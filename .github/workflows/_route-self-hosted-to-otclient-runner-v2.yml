name: Route OTClient self-hosted jobs to dedicated runner v2

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/_route-self-hosted-to-otclient-runner-v2.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ci/OTC-20260727-tibia-linux-runner-analysis
          fetch-depth: 0

      - name: Route legacy selectors and exact runner guards
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -RIlZ --include='*.yml' --include='*.yaml' --include='*.sh' \
            -e 'runs-on: \[self-hosted, oteryn-staging\]' \
            -e 'oteryn-synology-staging' \
            .github/workflows .github/scripts \
            | xargs -0 -r sed -i \
                -e 's/runs-on: \[self-hosted, oteryn-staging\]/runs-on: [self-hosted, otclient, synology]/g' \
                -e 's/oteryn-synology-staging/synology-otclient-01/g'

          if grep -R --include='*.yml' --include='*.yaml' -F 'runs-on: [self-hosted, oteryn-staging]' .github/workflows; then
            echo LEGACY_SELECTOR_REMAINS=true
            exit 1
          fi
          if grep -R --include='*.yml' --include='*.yaml' --include='*.sh' -F 'oteryn-synology-staging' .github/workflows .github/scripts; then
            echo LEGACY_RUNNER_GUARD_REMAINS=true
            exit 1
          fi

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows .github/scripts
          git diff --cached --quiet && { echo NO_ROUTING_CHANGES=true; exit 1; }
          git diff --cached --name-only
          git commit -m 'ci: use dedicated OTClient Synology runner'
          git push origin HEAD:ci/OTC-20260727-tibia-linux-runner-analysis

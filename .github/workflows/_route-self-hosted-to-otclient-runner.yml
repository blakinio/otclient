name: Route OTClient self-hosted jobs to dedicated runner

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/_route-self-hosted-to-otclient-runner.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ci/OTC-20260727-tibia-linux-runner-analysis
          fetch-depth: 0

      - name: Route only legacy OTClient self-hosted runner selectors
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('.github/workflows'), Path('.github/scripts')]
          old_selector = 'runs-on: [self-hosted, oteryn-staging]'
          new_selector = 'runs-on: [self-hosted, otclient, synology]'
          old_runner = 'oteryn-synology-staging'
          new_runner = 'synology-otclient-01'

          changed = []
          selector_hits = 0
          runner_hits = 0
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name != '_route-self-hosted-to-otclient-runner.yml'):
                  text = path.read_text(encoding='utf-8')
                  s = text.count(old_selector)
                  r = text.count(old_runner)
                  if not (s or r):
                      continue
                  text = text.replace(old_selector, new_selector).replace(old_runner, new_runner)
                  path.write_text(text, encoding='utf-8')
                  selector_hits += s
                  runner_hits += r
                  changed.append(str(path))

          print(f'LEGACY_SELECTOR_REPLACEMENTS={selector_hits}')
          print(f'LEGACY_RUNNER_NAME_REPLACEMENTS={runner_hits}')
          for path in changed:
              print(f'CHANGED={path}')
          if selector_hits < 1:
              raise SystemExit('no legacy self-hosted selector found')

          for root in roots:
              if not root.exists():
                  continue
              for path in (p for p in root.rglob('*') if p.is_file()):
                  text = path.read_text(encoding='utf-8')
                  if old_selector in text or old_runner in text:
                      raise SystemExit(f'legacy OTClient runner routing remains in {path}')
          PY

          git diff --check
          git diff -- .github/workflows .github/scripts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows .github/scripts
          if git diff --cached --quiet; then
            echo NO_ROUTING_CHANGES=true
            exit 1
          fi
          git commit -m 'ci: use dedicated OTClient Synology runner'
          git push origin HEAD:ci/OTC-20260727-tibia-linux-runner-analysis

name: Route OTClient self-hosted jobs to dedicated runner

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/_route-self-hosted-to-otclient-runner.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ci/OTC-20260727-tibia-linux-runner-analysis
          fetch-depth: 0

      - name: Route only legacy OTClient self-hosted runner selectors
        shell: bash
        run: |
          set -Eeuo pipefail

          selector_before="$(grep -R --include='*.yml' --include='*.yaml' -F 'runs-on: [self-hosted, oteryn-staging]' .github/workflows 2>/dev/null | wc -l || true)"
          runner_before="$(grep -R --include='*.yml' --include='*.yaml' --include='*.sh' -F 'oteryn-synology-staging' .github/workflows .github/scripts 2>/dev/null | wc -l || true)"
          echo "LEGACY_SELECTOR_COUNT_BEFORE=$selector_before"
          echo "LEGACY_RUNNER_NAME_COUNT_BEFORE=$runner_before"
          (( selector_before > 0 ))

          find .github/workflows .github/scripts -type f \( -name '*.yml' -o -name '*.yaml' -o -name '*.sh' \) -print0 \
            | xargs -0 sed -i \
                -e 's/runs-on: \[self-hosted, oteryn-staging\]/runs-on: [self-hosted, otclient, synology]/g' \
                -e 's/oteryn-synology-staging/synology-otclient-01/g'

          selector_after="$(grep -R --include='*.yml' --include='*.yaml' -F 'runs-on: [self-hosted, oteryn-staging]' .github/workflows 2>/dev/null | wc -l || true)"
          runner_after="$(grep -R --include='*.yml' --include='*.yaml' --include='*.sh' -F 'oteryn-synology-staging' .github/workflows .github/scripts 2>/dev/null | wc -l || true)"
          echo "LEGACY_SELECTOR_COUNT_AFTER=$selector_after"
          echo "LEGACY_RUNNER_NAME_COUNT_AFTER=$runner_after"
          [[ "$selector_after" == 0 ]]
          [[ "$runner_after" == 0 ]]

          git diff --check
          echo '=== routing diff ==='
          git diff -- .github/workflows .github/scripts

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows .github/scripts
          git diff --cached --quiet && { echo NO_ROUTING_CHANGES=true; exit 1; }
          git commit -m 'ci: use dedicated OTClient Synology runner'
          git push origin HEAD:ci/OTC-20260727-tibia-linux-runner-analysis

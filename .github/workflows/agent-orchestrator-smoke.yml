name: Agent Orchestrator Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - tools/agents/orchestrator.py
      - tools/agents/orchestrator_core.py
      - tools/agents/orchestrator_results.py
      - tools/agents/test_orchestrator.py
      - tools/agents/orchestrator_worker_result.schema.json
      - tools/agents/testdata/orchestrator/**
      - docs/agents/AGENT_ORCHESTRATOR.md
      - docs/agents/AGENT_ORCHESTRATOR.json
      - .github/workflows/agent-orchestrator-smoke.yml
      - docs/agents/tasks/active/OTC-20260817-agent-orchestrator-mvp.md

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Focused planner and context tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Compile and run orchestrator tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/agents/orchestrator.py tools/agents/orchestrator_core.py tools/agents/orchestrator_results.py tools/agents/test_orchestrator.py
          PYTHONPATH=tools/agents python3 tools/agents/test_orchestrator.py

      - name: Prove context rotation gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/agents/orchestrator.py \
            --config tools/agents/testdata/orchestrator/config.json \
            assess-context \
            --scope-breadth 2 \
            --evidence-volume 2 \
            --history-dependency 2 \
            --iteration-uncertainty 2 \
            --parallel-hypotheses 2 \
            --growth rising \
            --output "${RUNNER_TEMP}/context.json"
          python3 - "${RUNNER_TEMP}/context.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["context"]["score"] == 10
          assert payload["context"]["pressure"] == "high"
          assert payload["action"] == "rotate"
          assert payload["exact_remaining_tokens_known"] is False
          PY

  plan-wave:
    name: Plan independent wave
    needs: focused-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      wave_id: ${{ steps.matrix.outputs.wave_id }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build fixture wave
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/orchestrator-smoke"
          python3 tools/agents/orchestrator.py \
            --config tools/agents/testdata/orchestrator/config.json \
            plan \
            --tasks-root tools/agents/testdata/orchestrator/active \
            --output "${RUNNER_TEMP}/orchestrator-smoke/plan.json"

      - name: Export bounded matrix
        id: matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "${RUNNER_TEMP}/orchestrator-smoke/plan.json" "${GITHUB_OUTPUT}" <<'PY'
          import json
          from pathlib import Path
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          selected = plan["selected"]
          assert [item["task_id"] for item in selected] == ["OTC-TEST-A", "OTC-TEST-B"]
          matrix = {
              "include": [
                  {
                      "task_id": item["task_id"],
                      "branch": item["branch"],
                      "dispatch_head": item["dispatch_head"],
                  }
                  for item in selected
              ]
          }
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              handle.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              handle.write("wave_id=" + plan["wave_id"] + "\n")
          PY

      - name: Upload wave plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchestrator-smoke-plan
          path: ${{ runner.temp }}/orchestrator-smoke/plan.json
          if-no-files-found: error

  simulated-workers:
    name: Simulated worker / ${{ matrix.task_id }}
    needs: plan-wave
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan-wave.outputs.matrix) }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Produce standardized no-AI result
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/worker-result"
          python3 tools/agents/orchestrator.py \
            --config tools/agents/testdata/orchestrator/config.json \
            simulate-worker \
            --task-id "${{ matrix.task_id }}" \
            --branch "${{ matrix.branch }}" \
            --dispatch-head "${{ matrix.dispatch_head }}" \
            --output "${RUNNER_TEMP}/worker-result/${{ matrix.task_id }}.json"

      - name: Upload worker result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchestrator-smoke-result-${{ matrix.task_id }}
          path: ${{ runner.temp }}/worker-result/${{ matrix.task_id }}.json
          if-no-files-found: error

  barrier:
    name: Fan-in and next-wave barrier
    needs: [plan-wave, simulated-workers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download wave plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orchestrator-smoke-plan
          path: ${{ runner.temp }}/orchestrator-smoke

      - name: Download worker results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: orchestrator-smoke-result-*
          path: ${{ runner.temp }}/orchestrator-results
          merge-multiple: true

      - name: Recompute barrier and next wave
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/agents/orchestrator.py \
            --config tools/agents/testdata/orchestrator/config.json \
            barrier \
            --tasks-root tools/agents/testdata/orchestrator/active \
            --plan "${RUNNER_TEMP}/orchestrator-smoke/plan.json" \
            --results-dir "${RUNNER_TEMP}/orchestrator-results" \
            --output "${RUNNER_TEMP}/orchestrator-smoke/barrier.json"

      - name: Prove dependent second wave and context hold
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "${RUNNER_TEMP}/orchestrator-smoke/barrier.json" "${{ needs.plan-wave.outputs.wave_id }}" <<'PY'
          import json
          from pathlib import Path
          import sys

          barrier = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert barrier["invalid_results"] == []
          assert barrier["missing_results"] == []
          next_wave = barrier["next_wave"]
          assert next_wave["parent_wave_id"] == sys.argv[2]
          selected_ids = [item["task_id"] for item in next_wave["selected"]]
          assert "OTC-TEST-C" in selected_ids
          held = {item["task_id"]: item for item in next_wave["held"]}
          assert held["OTC-TEST-D"]["reasons"] == ["CONTEXT_ROTATE_REQUIRED"]
          PY

      - name: Upload barrier evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchestrator-smoke-barrier
          path: ${{ runner.temp }}/orchestrator-smoke/barrier.json
          if-no-files-found: error

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Build Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      compile: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.compile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        with:
          filters: |
            compile:
              - "src/**"
              - "tests/**"
              - "cmake/**"
              - "vc18/**"
              - "vcpkg.json"
              - "vcpkg-configuration.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-windows.yml"

  checks:
    name: Fast Checks
    permissions:
      contents: read
      checks: write
      pull-requests: read
    uses: ./.github/workflows/reusable-checks.yml

  tests-lua:
    name: Lua Syntax
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests-lua.yml

  build-windows:
    name: Build - Windows
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-build-windows.yml

  otclient-global-login-probe:
    name: OTClient Tibia Global Login Probe
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 48 && github.head_ref == 'ci/OTC-20260727-tibia-linux-runner-analysis'
    runs-on: [otclient, synology]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Run bounded Global login probe
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        shell: bash
        run: bash .github/scripts/otclient-global-login-probe.sh

  required:
    name: CI / Required
    if: always()
    needs:
      - changes
      - checks
      - tests-lua
      - build-windows
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate required jobs
        env:
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'true' || 'false' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["NEEDS_JSON"])
          rejected = {}

          for name in ("changes", "checks", "tests-lua"):
              result = jobs[name].get("result")
              if result != "success":
                  rejected[name] = f"expected success, got {result}"

          compile_scope = jobs["changes"].get("outputs", {}).get("compile")
          if compile_scope not in {"true", "false"}:
              rejected["scope:compile"] = (
                  f"expected true or false, got {compile_scope!r}"
              )

          is_draft = os.environ["IS_DRAFT"] == "true"
          windows_result = jobs["build-windows"].get("result")
          if windows_result not in {"success", "skipped"}:
              rejected["build-windows"] = (
                  f"unexpected conclusion {windows_result}"
              )
          elif not is_draft and compile_scope == "true" and windows_result != "success":
              rejected["build-windows"] = (
                  f"scope compile=true requires success, got {windows_result}"
              )

          print("Required job results:")
          for name in sorted(jobs):
              print(f"- {name}: {jobs[name].get('result')}")

          if rejected:
              for name, reason in sorted(rejected.items()):
                  print(f"::error title=Required CI job did not pass::{name}: {reason}")
              sys.exit(1)
          PY

name: Diagnostic VNC v23 runs

on:
  push:
    branches:
      - diag/OTC-20260818-v18-run-discovery
    paths:
      - .github/workflows/diag-v18-run-discovery.yml

permissions:
  contents: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diag/OTC-20260818-v18-run-discovery
          persist-credentials: true
          fetch-depth: 1
      - name: Discover terminal VNC runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p .diag
          python3 - <<'PY'
          import json,os,subprocess,time
          token=os.environ['GH_TOKEN'];repo=os.environ['GITHUB_REPOSITORY'];api=os.environ['GITHUB_API_URL']
          targets=[
            ('sidecar','6258524cc57703ab335cf020de9b0c8768a71da9','.github/workflows/track-a-vnc-loopback-sidecar-deploy-v23.yml'),
            ('smoke','fc7d772971f8b3010196a8dfec04277f97dd40ca','.github/workflows/track-a-vnc-observer-smoke-v23.yml'),
          ]
          headers=['-H',f'Authorization: Bearer {token}','-H','Accept: application/vnd.github+json','-H','X-GitHub-Api-Version: 2022-11-28']
          def get(url):
            return json.loads(subprocess.check_output(['curl','-fsSL',*headers,url],text=True))
          result={}
          for name,sha,path in targets:
            run=None
            for _ in range(60):
              p=get(f'{api}/repos/{repo}/actions/runs?head_sha={sha}&event=push&per_page=50')
              run=next((r for r in p.get('workflow_runs',[]) if r.get('path')==path),None)
              if run:break
              time.sleep(5)
            if not run:
              result[name]={'target_sha':sha,'status':'not_found'};continue
            for _ in range(180):
              one=get(f'{api}/repos/{repo}/actions/runs/{run["id"]}')
              if one.get('status')=='completed':break
              time.sleep(10)
            jobs=get(f'{api}/repos/{repo}/actions/runs/{run["id"]}/jobs?per_page=100').get('jobs',[])
            result[name]={'target_sha':sha,'run_id':run['id'],'status':one.get('status'),'conclusion':one.get('conclusion'),'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion')} for j in jobs]}
          open('.diag/v23-vnc-status.json','w').write(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Persist VNC diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diag/v23-vnc-status.json
          git commit -m 'diag(track-a): persist VNC v23 run status'
          git push origin HEAD:diag/OTC-20260818-v18-run-discovery

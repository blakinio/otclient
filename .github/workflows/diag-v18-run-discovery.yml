name: Diagnostic v18 run discovery

on:
  push:
    branches:
      - diag/OTC-20260818-v18-run-discovery
    paths:
      - .github/workflows/diag-v18-run-discovery.yml

permissions:
  contents: write
  actions: read

env:
  TARGET_SHA: 3fb6131710fe7f110fb5a34b13ef8286615fa243
  TARGET_PATH: .github/workflows/track-a-worldmap-server-delivery-causal-validation-v18.yml

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diag/OTC-20260818-v18-run-discovery
          persist-credentials: true
          fetch-depth: 1

      - name: Discover target push run and wait for terminal state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=50"
          run_id=''
          for _ in $(seq 1 60); do
            payload="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            run_id="$(jq -r --arg p "$TARGET_PATH" '.workflow_runs[] | select(.path==$p) | .id' <<<"$payload" | head -1)"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] && break
            sleep 5
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          echo "DIAG_V18_RUN_ID=$run_id"

          status=''; conclusion=''
          for _ in $(seq 1 180); do
            one="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$one")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$one")"
            [[ "$status" == completed ]] && break
            sleep 10
          done

          jobs="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
          mkdir -p .diag
          jq -n \
            --arg target_sha "$TARGET_SHA" \
            --argjson run_id "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --argjson jobs "$(jq '[.jobs[] | {id,name,status,conclusion}]' <<<"$jobs")" \
            '{schema:"v18-run-terminal-diagnostic-v1",target_sha:$target_sha,run_id:$run_id,status:$status,conclusion:$conclusion,jobs:$jobs}' \
            > .diag/v18-run-status.json
          cat .diag/v18-run-status.json
          [[ "$status" == completed ]]

      - name: Persist terminal diagnostic
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .diag/v18-run-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diag/v18-run-status.json
          git commit -m 'diag(track-a): persist terminal v18 run status'
          git push origin HEAD:diag/OTC-20260818-v18-run-discovery

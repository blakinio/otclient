name: Diagnostic v20 AUTH transition wiring run

on:
  push:
    branches:
      - diag/OTC-20260818-v18-run-discovery
    paths:
      - .github/workflows/diag-v18-run-discovery.yml

permissions:
  contents: write
  actions: read

env:
  TARGET_SHA: 976823acd1d5f7f947c0bac9bd8d8277f1c47686
  TARGET_PATH: .github/workflows/track-a-worldmap-auth-transition-wiring-v20.yml

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diag/OTC-20260818-v18-run-discovery
          persist-credentials: true
          fetch-depth: 1
      - name: Discover terminal target run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=50";run_id=''
          for _ in $(seq 1 60);do payload="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")";run_id="$(jq -r --arg p "$TARGET_PATH" '.workflow_runs[]|select(.path==$p)|.id'<<<"$payload"|head -1)";[[ "$run_id" =~ ^[1-9][0-9]*$ ]]&&break;sleep 5;done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]];status='';conclusion=''
          for _ in $(seq 1 150);do one="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")";status="$(jq -r '.status'<<<"$one")";conclusion="$(jq -r '.conclusion//""'<<<"$one")";[[ "$status" == completed ]]&&break;sleep 10;done
          jobs="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")";mkdir -p .diag
          jq -n --arg target_sha "$TARGET_SHA" --argjson run_id "$run_id" --arg status "$status" --arg conclusion "$conclusion" --argjson jobs "$(jq '[.jobs[]|{id,name,status,conclusion}]'<<<"$jobs")" '{schema:"v20-auth-transition-wiring-terminal-v1",target_sha:$target_sha,run_id:$run_id,status:$status,conclusion:$conclusion,jobs:$jobs}' >.diag/v20-auth-transition-wiring-status.json
          [[ "$status" == completed ]]
      - name: Persist terminal diagnostic
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail;test -s .diag/v20-auth-transition-wiring-status.json;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add .diag/v20-auth-transition-wiring-status.json;git commit -m 'diag(track-a): persist v20 auth transition wiring status';git push origin HEAD:diag/OTC-20260818-v18-run-discovery

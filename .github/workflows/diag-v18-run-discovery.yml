name: Diagnostic retired VNC runs

on:
  push:
    branches:
      - diag/OTC-20260818-v18-run-discovery
    paths:
      - .github/workflows/diag-v18-run-discovery.yml

permissions:
  contents: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diag/OTC-20260818-v18-run-discovery
          persist-credentials: true
          fetch-depth: 1
      - name: Discover retired VNC runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p .diag
          python3 - <<'PY'
          import json,os,subprocess
          api=os.environ['GITHUB_API_URL'];repo=os.environ['GITHUB_REPOSITORY'];tok=os.environ['GH_TOKEN']
          H=['-H',f'Authorization: Bearer {tok}','-H','Accept: application/vnd.github+json','-H','X-GitHub-Api-Version: 2022-11-28']
          def get(url): return json.loads(subprocess.check_output(['curl','-fsSL',*H,url],text=True))
          targets={
            'sidecar':('6258524cc57703ab335cf020de9b0c8768a71da9','.github/workflows/track-a-vnc-loopback-sidecar-deploy-v23.yml'),
            'novnc_inspect':('fe9af5530e7c95f8e970291ccc864c8899a2edd2','.github/workflows/track-a-vnc-existing-novnc-inspect-v23.yml'),
          }
          out={}
          for name,(sha,path) in targets.items():
            p=get(f'{api}/repos/{repo}/actions/runs?head_sha={sha}&event=push&per_page=50')
            r=next((x for x in p.get('workflow_runs',[]) if x.get('path')==path),None)
            if not r:
              out[name]={'status':'not_found','sha':sha,'path':path};continue
            jobs=get(f'{api}/repos/{repo}/actions/runs/{r["id"]}/jobs?per_page=100').get('jobs',[])
            out[name]={'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'sha':sha,'path':path,'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion')} for j in jobs]}
          open('.diag/retired-vnc-runs.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist status
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diag/retired-vnc-runs.json
          git commit -m 'diag(track-a): persist retired VNC run status'
          git push origin HEAD:diag/OTC-20260818-v18-run-discovery

name: Diagnostic sanitized v19 physical markers

on:
  push:
    branches:
      - diag/OTC-20260818-v18-run-discovery
    paths:
      - .github/workflows/diag-v18-run-discovery.yml

permissions:
  contents: write
  actions: read

env:
  TARGET_JOB_ID: '95533971920'

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diag/OTC-20260818-v18-run-discovery
          persist-credentials: true
          fetch-depth: 1
      - name: Fetch job log and retain sanitized causal markers only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p .diag "$RUNNER_TEMP/v19log"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$TARGET_JOB_ID/logs" -o "$RUNNER_TEMP/v19log/job.log"
          python3 - "$RUNNER_TEMP/v19log/job.log" .diag/v19-physical-markers.txt <<'PY'
          from pathlib import Path
          import re,sys
          src=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          allow=re.compile(r'(WORLDMAP_V19_[A-Z0-9_]+(?:=[^\r\n]*)?|WORLDMAP_V18_(?:POSTAUTH_CHARSEL_INSTANCE_COUNT|RUNTIME_ADDRESS_PROVEN|NATIVE_CHARACTER_LIST_COUNT|NATIVE_CHARACTER_LIST_DISCOVERY|NATIVE_SELECTION_INDEX|QT_THREAD_AFFINITY|SELECTED_LOGIN_DATA_BEFORE|CONST_SELECTION_VIEW|SELECTED_LOGIN_DATA_AFTER|NATIVE_CHARACTER_CONFIRMATION_QMETA|SEMANTIC_RESULT)=[^\r\n]*|WORLDMAP_BASELINE_(?:ERROR|STRUCTURAL_IN_GAME|MAP_SCREENSHOT|LOGIN_SUBMITTED|LOGIN_TRANSPORT_ACTIVITY|POST_LOGIN_UI_TRANSITION|ORIGINAL_SOURCE_REHASH|CLEANUP|LOGIN_BUDGET_CONSUMED)=[^\r\n]*|WORLDMAP_FINAL_NAMESPACE_PROCESS_COUNT=[^\r\n]*)')
          vals=[]
          for line in src:
              m=allow.search(line)
              if m:
                  v=m.group(1).strip()
                  if v not in vals: vals.append(v)
          Path(sys.argv[2]).write_text('\n'.join(vals)+'\n')
          print('\n'.join(vals))
          if not vals: raise SystemExit('no sanitized markers')
          PY
          ! grep -Eiq '(TIBIA_TEST_EMAIL|TIBIA_TEST_PASSWORD|password=|email=|sessionkey|devicecookie|token=)' .diag/v19-physical-markers.txt
      - name: Persist sanitized markers
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diag/v19-physical-markers.txt
          git commit -m 'diag(track-a): persist sanitized v19 physical markers'
          git push origin HEAD:diag/OTC-20260818-v18-run-discovery

name: Native protocol Rust correspondence

on:
  pull_request:
    paths:
      - oteryn-client/docs/architecture/OTERYN_NATIVE_PROTOCOL_CORRESPONDENCE.md
      - oteryn-client/docs/agents/tasks/active/OTC2-20260805-native-protocol-single-version-completion.md
      - .github/workflows/native-protocol-rust-correspondence.yml

permissions:
  contents: read

concurrency:
  group: native-protocol-rust-correspondence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CORRESPONDENCE: oteryn-client/docs/architecture/OTERYN_NATIVE_PROTOCOL_CORRESPONDENCE.md
  TASK: oteryn-client/docs/agents/tasks/active/OTC2-20260805-native-protocol-single-version-completion.md
  PLATFORM_MERGE: c0b8703d326a04b43ae8e06f6192b0cb91c859b7
  OTHERYN_MERGE: 92bd106a92a8c3622de85099e2152db5b8cf2bde
  SCHEMA_SHA: 9c67f19525400fb9890d2a3541ceb6d02eb955061540ad39ca1c1d891c06eba9

jobs:
  architecture:
    name: Audit 1 - architecture and identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify single native identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'family = oteryn' "$CORRESPONDENCE"
          grep -Fq 'native_protocol_version = 1' "$CORRESPONDENCE"
          grep -Fq 'independent `protocol-oteryn`' "$CORRESPONDENCE"
          ! grep -Fq 'PENDING_' "$CORRESPONDENCE"
          ! grep -Fq 'oteryn.native.v1' "$CORRESPONDENCE"

  security:
    name: Audit 2 - security and immutable binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify fail-closed selection and credential boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'adapter binding is immutable' "$CORRESPONDENCE"
          grep -Fq 'Game Login Ticket goes only to Gateway' "$CORRESPONDENCE"
          grep -Fq 'Game Session credential goes only to the selected Otheryn endpoint' "$CORRESPONDENCE"
          grep -Fq 'requires a fresh Identity flow and ticket' "$CORRESPONDENCE"

  parser:
    name: Audit 3 - parser state and limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify framing, snapshot and bounded parser obligations
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'unsigned 32-bit big-endian framing' "$CORRESPONDENCE"
          grep -Fq 'frame/message `<=1 MiB`' "$CORRESPONDENCE"
          grep -Fq 'complete snapshot `<=16 MiB`' "$CORRESPONDENCE"
          grep -Fq 'one bounded resync' "$CORRESPONDENCE"
          grep -Fq 'no reconnect command replay' "$CORRESPONDENCE"

  canary:
    name: Audit 4 - Canary isolation and changed paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify documentation-only boundary and Canary isolation
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          base=$(git merge-base HEAD "origin/$BASE_REF")
          changed=$(git diff --name-only "$base" HEAD)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^oteryn-client/(crates|src)/|protocol-canary'; then
            echo 'Runtime or protocol-canary path changed in correspondence PR' >&2
            exit 1
          fi
          grep -Fq '`protocol-canary` remains the independent source-proven compatibility adapter' "$CORRESPONDENCE"
          grep -Fq 'must not depend on, translate through or reuse Canary compatibility-profile machinery' "$CORRESPONDENCE"

  provenance:
    name: Audit 5 - provenance rollout and production gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify immutable provenance and disabled production
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "$PLATFORM_MERGE" "$CORRESPONDENCE"
          grep -Fq "$OTHERYN_MERGE" "$CORRESPONDENCE"
          grep -Fq "$SCHEMA_SHA" "$CORRESPONDENCE"
          grep -Fq 'production_activation_authorized: false' "$TASK"
          grep -Fq 'Rollback removes native from fresh offers/advertisement' "$CORRESPONDENCE"

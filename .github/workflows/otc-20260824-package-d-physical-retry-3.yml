name: Package D physical retry 3 controller preflight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/otc-20260824-package-d-physical-retry-3.yml
      - docs/agents/tasks/active/OTC-20260824-control-center-package-d-physical-retry-3.md

permissions:
  contents: read

concurrency:
  group: otc-20260824-package-d-physical-retry-3
  cancel-in-progress: false

jobs:
  controller-plane-preflight:
    if: github.repository == 'blakinio/otclient' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      TASK_ID: OTC-20260824-control-center-package-d-physical-retry-3
      TASK_FILE: docs/agents/tasks/active/OTC-20260824-control-center-package-d-physical-retry-3.md
      TASK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Create isolated task worktree
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TASK_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$TASK_HEAD_SHA"
          echo "RUNNER_NAME=$RUNNER_NAME"
          test "$RUNNER_NAME" = "synology-otclient-01"
          wt="${RUNNER_TEMP}/otc-20260824-package-d-retry-3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$wt"
          git worktree add --detach "$wt" "$TASK_HEAD_SHA"
          printf 'TASK_WORKTREE=%s\n' "$wt" >> "$GITHUB_ENV"
          test "$(git -C "$wt" rev-parse HEAD)" = "$TASK_HEAD_SHA"
          test -f "$wt/$TASK_FILE"
          echo "WORKTREE_ISOLATION=PASS"
          echo "WORKTREE_HEAD=$(git -C "$wt" rev-parse HEAD)"

      - name: Controller-plane admission discovery only
        shell: bash
        run: |
          set -euo pipefail
          cd "$TASK_WORKTREE"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          echo "CURRENT_MAIN_SHA=$current_main"
          echo "TASK_HEAD_SHA=$(git rev-parse HEAD)"

          .github/scripts/tibia-official-client-re-canonical-live-lease status

          python3 - <<'PY'
          import json
          from pathlib import Path

          state = Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          reg = state / 'runtime-registration.json'
          if not reg.exists():
              print('CANONICAL_REGISTRATION=ABSENT')
              raise SystemExit(0)

          data = json.loads(reg.read_text(encoding='utf-8'))
          print('CANONICAL_REGISTRATION=PRESENT')
          allowed = (
              'schema_version',
              'runtime_id',
              'registration_generation',
              'lease_generation',
              'client_version',
              'client_size',
              'client_sha256',
              'state',
          )
          for key in allowed:
              print(f'REG_{key.upper()}={data.get(key, "MISSING")}')
          PY

          echo "LIVE_OFFICIAL_CLIENT_OBSERVATION=NOT_PERFORMED"
          echo "OFFICIAL_CLIENT_MUTATION=NOT_PERFORMED"
          echo "PHYSICAL_ACTION_COUNT=0"

      - name: Remove isolated task worktree
        if: always()
        shell: bash
        run: |
          set -u
          if [ -n "${TASK_WORKTREE:-}" ] && [ -d "${TASK_WORKTREE:-}" ]; then
            git worktree remove --force "$TASK_WORKTREE" || true
          fi
          git worktree prune || true

name: Track A player-state semantic promotion E2E

on:
  push:
    branches:
      - runtime/OTC-20260824-player-state-semantic-promotion-e2e
    paths:
      - .github/workflows/otc-20260824-player-state-semantic-promotion-e2e.yml
      - .github/scripts/tibia-official-client-re-player-state-semantic-worker.py
      - .github/scripts/test_tibia_official_client_re_player_state_semantic_worker.py

permissions:
  contents: read

concurrency:
  group: otc-20260824-player-state-semantic-promotion-e2e
  cancel-in-progress: false

jobs:
  admission:
    runs-on: [otclient, synology]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact runner and head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "synology-otclient-01"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EXACT_RUNNER_HEAD=PASS"

      - name: Fresh canonical admission and read-only player-state probe
        shell: bash
        run: |
          set -Eeuo pipefail
          TASK="OTC-20260824-player-state-semantic-promotion-e2e"
          SESSION="chatgpt-player-state-semantic-e2e-20260824"
          TASK_ROOT="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK"
          TOKEN="$TASK_ROOT/lease-token"
          LEASE=".github/scripts/tibia-official-client-re-canonical-live-lease"
          TRANSITION=".github/scripts/tibia-official-client-re-canonical-live-transition.py"
          PROBE="$PWD/.github/scripts/tibia-official-client-re-kasm-existing-runtime-probe.py"
          STATE="/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime"

          mkdir -p "$TASK_ROOT"
          chmod 700 "$TASK_ROOT"
          rm -f "$TOKEN"
          chmod +x "$PROBE"

          acquired=0
          cleanup() {
            if [ "$acquired" = 1 ]; then
              bash "$LEASE" release \
                --task-id "$TASK" \
                --session-id "$SESSION" \
                --token-file "$TOKEN" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          bash "$LEASE" acquire \
            --task-id "$TASK" \
            --session-id "$SESSION" \
            --token-file "$TOKEN" \
            --ttl-seconds 1200
          acquired=1

          current_generation="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime/lease.json')
          print(json.loads(p.read_text())['generation'])
          PY
          )"
          registration_generation="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime/runtime-registration.json')
          d = json.loads(p.read_text())
          assert d['runtime_id'] == 'track-a-canonical-live'
          assert d['client_version'] == '15.32'
          assert d['client_size'] == 52109920
          assert d['client_sha256'] == 'ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8'
          print(d['lease_generation'])
          PY
          )"

          echo "GATE_A=PASS"
          if [ "$registration_generation" != "$current_generation" ]; then
            python3 "$TRANSITION" rebind \
              --task-id "$TASK" \
              --session-id "$SESSION" \
              --token-file "$TOKEN" \
              --probe "$PROBE"
            echo "REBIND=PASS"
          else
            echo "REBIND=NOT_REQUIRED"
          fi

          python3 "$TRANSITION" gate-b \
            --task-id "$TASK" \
            --session-id "$SESSION" \
            --token-file "$TOKEN" \
            --probe "$PROBE"
          echo "GATE_B=PASS"

          PYTHONPATH=. python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from tools.tibia_re_surveyor.player_state import read_player_state

          state = Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          registration = json.loads((state / 'runtime-registration.json').read_text())

          def runner(args):
              completed = subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=30,
                  check=False,
              )
              if completed.returncode:
                  raise RuntimeError('typed_player_state_probe_failed')
              return completed.stdout

          result = read_player_state(
              pid=int(registration['pid']),
              start_ticks=int(registration['process_start_ticks']),
              runner=runner,
          )
          if result.get('state') != 'AVAILABLE':
              raise SystemExit('PLAYER_STATE_AVAILABLE=false')
          if result.get('object_count') != 1:
              raise SystemExit('PLAYER_STATE_OBJECT_UNIQUE=false')
          if result.get('position_mirror_consistent') is not True:
              raise SystemExit('PLAYER_STATE_MIRROR=false')
          if result.get('semantic_state') != 'CANDIDATE_PENDING_CAUSAL_E2E':
              raise SystemExit('PLAYER_STATE_SEMANTIC_STATE_UNEXPECTED')
          if result.get('semantic_promotion_allowed') is not False:
              raise SystemExit('PLAYER_STATE_PREMATURE_PROMOTION')
          print('PLAYER_STATE_AVAILABLE=true')
          print('PLAYER_STATE_OBJECT_UNIQUE=true')
          print('PLAYER_STATE_MIRROR=true')
          print('PLAYER_STATE_SEMANTIC_PROMOTION_ALLOWED=false')
          print('OFFICIAL_CLIENT_MUTATION=NOT_PERFORMED')
          print('PHYSICAL_ACTION_COUNT=0')
          PY

          bash "$LEASE" validate \
            --task-id "$TASK" \
            --session-id "$SESSION" \
            --token-file "$TOKEN" >/dev/null
          echo "ADMISSION_READ_ONLY_PROBE=PASS"

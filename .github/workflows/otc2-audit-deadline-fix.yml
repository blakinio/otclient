name: OTC2 Audit Deadline Repair

on:
  push:
    branches:
      - feat/OTC2-20260804-tokio-transport
    paths:
      - .github/workflows/otc2-audit-deadline-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260804-tokio-transport
          show-progress: false

      - name: Apply total-operation deadline repair
        run: |
          python - <<'PY'
          from pathlib import Path

          session_path = Path("oteryn-client/crates/transport/src/session.rs")
          source = session_path.read_text(encoding="utf-8")

          read_start = source.index("async fn read_exact_deadline<R>(")
          read_end = source.index("\nasync fn write_all_deadline<W>(", read_start)
          read_replacement = '''async fn read_exact_deadline<R>(
              reader: &mut R,
              buffer: &mut [u8],
              deadline: Duration,
          ) -> Result<(), TransportError>
          where
              R: AsyncRead + Unpin,
          {
              let operation = async {
                  let mut offset = 0;
                  while offset < buffer.len() {
                      let read = match reader.read(&mut buffer[offset..]).await {
                          Ok(0) => {
                              return Err(TransportError::new(TransportErrorKind::ConnectionLost));
                          }
                          Ok(read) => read,
                          Err(error) => return Err(classify_read_error(&error)),
                      };
                      offset = offset
                          .checked_add(read)
                          .ok_or_else(|| TransportError::new(TransportErrorKind::ResourceExhausted))?;
                  }
                  Ok(())
              };
              timeout(deadline, operation)
                  .await
                  .map_err(|_elapsed| TransportError::new(TransportErrorKind::Timeout))?
          }
          '''
          source = source[:read_start] + read_replacement + source[read_end:]

          write_start = source.index("async fn write_all_deadline<W>(")
          write_end = source.index("\nasync fn connect_with_deadline<F, T>(", write_start)
          write_replacement = '''async fn write_all_deadline<W>(
              writer: &mut W,
              buffer: &[u8],
              deadline: Duration,
          ) -> Result<(), TransportError>
          where
              W: AsyncWrite + Unpin,
          {
              let operation = async {
                  let mut offset = 0;
                  while offset < buffer.len() {
                      let written = match writer.write(&buffer[offset..]).await {
                          Ok(0) => {
                              return Err(TransportError::new(TransportErrorKind::ConnectionLost));
                          }
                          Ok(written) => written,
                          Err(error) => return Err(classify_write_error(&error)),
                      };
                      offset = offset
                          .checked_add(written)
                          .ok_or_else(|| TransportError::new(TransportErrorKind::ResourceExhausted))?;
                  }
                  Ok(())
              };
              timeout(deadline, operation)
                  .await
                  .map_err(|_elapsed| TransportError::new(TransportErrorKind::Timeout))?
          }
          '''
          source = source[:write_start] + write_replacement + source[write_end:]
          session_path.write_text(source, encoding="utf-8")

          tests_path = Path("oteryn-client/crates/transport/src/tests.rs")
          tests = tests_path.read_text(encoding="utf-8")
          marker = '''#[test]
          fn shutdown_with_queued_work_and_repeated_cycles_leave_no_session_task()
          -> Result<(), Box<dyn Error>> {
          '''
          test = '''#[test]
          fn partial_progress_cannot_extend_total_read_or_write_deadlines()
          -> Result<(), Box<dyn Error>> {
              runtime()?.block_on(async {
                  let (mut client, mut server) = tokio::io::duplex(1);
                  let slow_writer = tokio::spawn(async move {
                      for byte in [1_u8, 2, 3] {
                          server.write_all(&[byte]).await?;
                          sleep(Duration::from_millis(8)).await;
                      }
                      Ok::<(), io::Error>(())
                  });
                  let mut received = [0_u8; 3];
                  assert_eq!(
                      test_read_exact(&mut client, &mut received, Duration::from_millis(12)).await,
                      Err(TransportError::new(TransportErrorKind::Timeout))
                  );
                  slow_writer.abort();
                  let _joined = slow_writer.await;

                  let (mut client, mut server) = tokio::io::duplex(1);
                  let slow_reader = tokio::spawn(async move {
                      let mut byte = [0_u8; 1];
                      for _ in 0..4 {
                          server.read_exact(&mut byte).await?;
                          sleep(Duration::from_millis(8)).await;
                      }
                      Ok::<(), io::Error>(())
                  });
                  assert_eq!(
                      test_write_all(&mut client, &[1, 2, 3, 4], Duration::from_millis(12)).await,
                      Err(TransportError::new(TransportErrorKind::Timeout))
                  );
                  slow_reader.abort();
                  let _joined = slow_reader.await;
                  Ok::<(), Box<dyn Error>>(())
              })
          }

          '''
          if tests.count(marker) != 1:
              raise SystemExit("deadline test insertion marker mismatch")
          tests_path.write_text(tests.replace(marker, test + marker, 1), encoding="utf-8")
          PY

      - name: Install pinned Rust tools
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup default 1.94.0

      - name: Format and validate focused package
        working-directory: oteryn-client
        run: |
          cargo fmt --all
          cargo clippy -p oteryn-transport --all-targets --features blocking-baseline -- -D warnings
          cargo test -p oteryn-transport --features blocking-baseline

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/crates/transport/src/session.rs oteryn-client/crates/transport/src/tests.rs
          git commit -m "fix(transport): enforce total I/O operation deadlines"
          git push origin HEAD:feat/OTC2-20260804-tokio-transport

name: OTC2 Canary Bootstrap Identity

on:
  push:
    branches:
      - feat/OTC2-20260803-canary-bootstrap-identity
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: otc2-canary-bootstrap-identity
  cancel-in-progress: false

jobs:
  normalize-and-validate:
    if: github.event_name == 'push' || github.head_ref == 'feat/OTC2-20260803-canary-bootstrap-identity' || github.head_ref == 'ci/OTC2-20260803-canary-bootstrap-identity-execute'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-canary-bootstrap-identity
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Normalize exact task checkpoint prerequisites
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md")
          text = path.read_text(encoding="utf-8")
          blocked_status = "status: blocked\n"
          validating_status = "status: validating\n"
          blocked_phase = "phase: inbound-provenance-and-identity-contract-blocker\n"
          validating_phase = "phase: bootstrap-identity-and-enter-world-normalization\n"

          blocked_status_count = text.count(blocked_status)
          if blocked_status_count == 2:
              text = text.replace(blocked_status, validating_status, 1)
          elif blocked_status_count != 0 or text.count(validating_status) < 2:
              raise SystemExit(
                  f"task status precondition: blocked={blocked_status_count}, validating={text.count(validating_status)}"
              )

          blocked_phase_count = text.count(blocked_phase)
          if blocked_phase_count == 2:
              text = text.replace(blocked_phase, validating_phase, 1)
          elif blocked_phase_count != 0 or text.count(validating_phase) < 2:
              raise SystemExit(
                  f"task phase precondition: blocked={blocked_phase_count}, validating={text.count(validating_phase)}"
              )

          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Apply exact bootstrap identity phase
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/otc2_canary_bootstrap_identity.py

      - name: Validate focused producer and architecture
        working-directory: oteryn-client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "oteryn-target"
          rustup override set 1.94.0
          cargo fmt --all
          cargo metadata --locked --format-version 1 | Out-Null
          cargo clippy -p oteryn-protocol-canary --all-targets -- -D warnings
          cargo test -p oteryn-protocol-canary --all-targets
          cargo test -p oteryn-architecture-check --all-targets
          cargo run -p oteryn-architecture-check -- workspace .

      - name: Remove temporary files and persist validated phase
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path .github/scripts/otc2_canary_bootstrap_identity.py) {
            Remove-Item .github/scripts/otc2_canary_bootstrap_identity.py
          }
          if (Test-Path .github/scripts/otc2_canary_bootstrap_identity_trigger.txt) {
            Remove-Item .github/scripts/otc2_canary_bootstrap_identity_trigger.txt
          }
          git add -A -- `
            .github/scripts `
            docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md `
            oteryn-client/crates/protocol-canary/src/inbound.rs `
            oteryn-client/crates/protocol-canary/src/lib.rs `
            oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md `
            oteryn-client/tests/integration/canary-world-protocol/fixtures
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(protocol-canary): enforce exact bootstrap source order"
          git push origin HEAD:feat/OTC2-20260803-canary-bootstrap-identity

name: OTC2 Canary Bootstrap Identity

on:
  push:
    branches:
      - feat/OTC2-20260803-canary-bootstrap-identity
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: otc2-canary-bootstrap-identity
  cancel-in-progress: false

jobs:
  normalize-and-validate:
    if: github.event_name == 'push' || github.head_ref == 'feat/OTC2-20260803-canary-bootstrap-identity'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-canary-bootstrap-identity
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Apply exact bootstrap identity phase
        shell: pwsh
        run: python .github/scripts/otc2_canary_bootstrap_identity.py

      - name: Validate focused producer and architecture
        working-directory: oteryn-client
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "oteryn-target"
          rustup override set 1.94.0
          cargo fmt --all
          cargo metadata --locked --format-version 1 | Out-Null
          cargo clippy -p oteryn-protocol-canary --all-targets -- -D warnings
          cargo test -p oteryn-protocol-canary --all-targets
          cargo test -p oteryn-architecture-check --all-targets
          cargo run -p oteryn-architecture-check -- workspace .

      - name: Remove temporary files and persist validated phase
        shell: pwsh
        run: |
          Remove-Item .github/workflows/otc2-canary-bootstrap-identity.yml
          Remove-Item .github/scripts/otc2_canary_bootstrap_identity.py
          if (Test-Path .github/scripts/otc2_canary_bootstrap_identity_trigger.txt) {
            Remove-Item .github/scripts/otc2_canary_bootstrap_identity_trigger.txt
          }
          git add `
            .github/workflows/otc2-canary-bootstrap-identity.yml `
            .github/scripts/otc2_canary_bootstrap_identity.py `
            .github/scripts/otc2_canary_bootstrap_identity_trigger.txt `
            docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md `
            oteryn-client/crates/protocol-canary/src/inbound.rs `
            oteryn-client/crates/protocol-canary/src/lib.rs `
            oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md `
            oteryn-client/tests/integration/canary-world-protocol/fixtures/README.md `
            oteryn-client/tests/integration/canary-world-protocol/fixtures/local-player-initialization.hex `
            oteryn-client/tests/integration/canary-world-protocol/fixtures/local-player-bad-precision.hex `
            oteryn-client/tests/integration/canary-world-protocol/fixtures/local-player-zero-id.hex `
            oteryn-client/tests/integration/canary-world-protocol/fixtures/local-player-trailing.hex `
            oteryn-client/tests/integration/canary-world-protocol/fixtures/enter-world.hex
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(protocol-canary): normalize bootstrap identity boundaries"
          git push origin HEAD:feat/OTC2-20260803-canary-bootstrap-identity

name: OTC2 Canary Closeout Restack

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

concurrency:
  group: otc2-canary-closeout-restack
  cancel-in-progress: false

jobs:
  restack:
    if: github.head_ref == 'docs/OTC2-20260803-canary-entity-reconciliation-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact closeout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: docs/OTC2-20260803-canary-entity-reconciliation-closeout
          fetch-depth: 0

      - name: Restack on current main and persist recovery checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rebase origin/main
          python3 .github/scripts/otc2_canary_closeout_restack.py
          rm -- \
            .github/scripts/otc2_canary_closeout_restack.py \
            .github/workflows/otc2-canary-closeout-restack.yml
          git add -A -- \
            .github/scripts \
            .github/workflows \
            docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md \
            oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md
          git diff --cached --check
          git commit -m 'docs(task): restack Canary reconciliation closeout'
          git push --force-with-lease origin HEAD:docs/OTC2-20260803-canary-entity-reconciliation-closeout

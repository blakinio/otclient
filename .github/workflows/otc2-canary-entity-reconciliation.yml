name: OTC2 Canary Entity Reconciliation Patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: otc2-canary-entity-reconciliation
  cancel-in-progress: false

jobs:
  apply-patch:
    if: github.head_ref == 'feat/OTC2-20260803-canary-entity-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-canary-entity-reconciliation
          fetch-depth: 0

      - name: Apply durable reconciliation patch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/otc2_canary_entity_reconciliation.py
          git add -- \
            docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md \
            oteryn-client/crates/protocol-canary/src/lib.rs \
            oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md
          if git diff --cached --quiet; then
            echo "Reconciliation patch already applied."
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(protocol-canary): wire entity reconciliation API'
          git push origin HEAD:feat/OTC2-20260803-canary-entity-reconciliation

name: OTC2 Canary Reconciliation Format

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: otc2-canary-reconciliation-format
  cancel-in-progress: false

jobs:
  format:
    if: github.head_ref == 'feat/OTC2-20260803-canary-entity-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-canary-entity-reconciliation
          fetch-depth: 0

      - name: Install pinned Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0

      - name: Format and persist exact Rust sources
        shell: bash
        run: |
          set -euo pipefail
          cd oteryn-client
          cargo fmt --all
          cd ..
          git add -- \
            oteryn-client/crates/protocol-canary/src/lib.rs \
            oteryn-client/crates/protocol-canary/src/reconciliation.rs
          if git diff --cached --quiet; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(protocol-canary): apply rustfmt to reconciliation'
          git push origin HEAD:feat/OTC2-20260803-canary-entity-reconciliation

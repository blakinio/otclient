name: OTC2 Canary Reconciliation Validation Closeout

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: otc2-canary-reconciliation-validation-closeout
  cancel-in-progress: false

jobs:
  closeout:
    if: github.head_ref == 'feat/OTC2-20260803-canary-entity-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-canary-entity-reconciliation
          fetch-depth: 0

      - name: Persist validation evidence and remove temporary closeout files
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/otc2_canary_reconciliation_validation_closeout.py
          rm -- \
            .github/scripts/otc2_canary_reconciliation_validation_closeout.py \
            .github/workflows/otc2-canary-reconciliation-validation-closeout.yml
          git add -A -- \
            .github/scripts \
            .github/workflows \
            docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md \
            oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(task): record entity reconciliation validation'
          git push origin HEAD:feat/OTC2-20260803-canary-entity-reconciliation

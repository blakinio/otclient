name: OTC2 Canary Tile Clear Script Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: otc2-canary-tile-clear-script-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'feat/OTC2-20260803-canary-tile-clear'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-canary-tile-clear
          fetch-depth: 0

      - name: Remove generated Markdown trailing spaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/otc2_canary_tile_clear.py')
          text = path.read_text(encoding='utf-8')
          old = 'Status: local-player identity/order and known session-end slices are merged; the complete absent-tile update branch is under exact-head validation while the parent remains blocked on non-empty map/world layouts and general identity resolution.  '
          new = 'Status: local-player identity/order and known session-end slices are merged; the complete absent-tile update branch is under exact-head validation while the parent remains blocked on non-empty map/world layouts and general identity resolution.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one generated status anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/otc2-canary-tile-clear-script-repair.yml
          git add .github/scripts/otc2_canary_tile_clear.py
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci(canary): normalize tile-clear evidence whitespace"
          git push origin HEAD:feat/OTC2-20260803-canary-tile-clear

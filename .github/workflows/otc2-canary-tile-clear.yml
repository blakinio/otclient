name: OTC2 Canary Tile Clear

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: otc2-canary-tile-clear
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.head_ref == 'feat/OTC2-20260803-canary-tile-clear'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-canary-tile-clear
          fetch-depth: 0

      - name: Apply validate and persist bounded tile clear
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $script = ".github/scripts/otc2_canary_tile_clear.py"
          if (!(Test-Path $script)) {
            Write-Host "Tile-clear phase already applied; no mutation required."
            exit 0
          }

          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
          @'
          from pathlib import Path

          path = Path(".github/scripts/otc2_canary_tile_clear.py")
          text = path.read_text(encoding="utf-8")
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)
          '''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if label in {"task status", "task phase"}:
                  if count < 1:
                      raise SystemExit(f"{label}: expected at least one anchor, found {count}")
                  return text.replace(old, new, 1)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)
          '''
          if old not in text:
              raise SystemExit("replace_once precondition block not found")
          text = text.replace(old, new, 1)
          status_with_spaces = (
              "Status: local-player identity/order and known session-end slices are merged; "
              "the complete absent-tile update branch is under exact-head validation while "
              "the parent remains blocked on non-empty map/world layouts and general identity "
              "resolution.  "
          )
          if text.count(status_with_spaces) != 1:
              raise SystemExit("generated evidence status whitespace anchor not found exactly once")
          text = text.replace(status_with_spaces, status_with_spaces.rstrip(), 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -
          python $script

          Push-Location oteryn-client
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "oteryn-target"
          rustup override set 1.94.0
          cargo fmt --all
          cargo metadata --locked --format-version 1 | Out-Null
          cargo clippy -p oteryn-protocol-canary --all-targets -- -D warnings
          cargo test -p oteryn-protocol-canary --all-targets
          cargo test -p oteryn-architecture-check --all-targets
          cargo run -p oteryn-architecture-check -- workspace .
          Pop-Location

          Remove-Item $script
          git add -A -- `
            .github/scripts `
            docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md `
            oteryn-client/crates/protocol-canary/src `
            oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md `
            oteryn-client/tests/integration/canary-world-protocol/fixtures
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(protocol-canary): decode empty tile updates"
          git push origin HEAD:feat/OTC2-20260803-canary-tile-clear

name: OTC2 Canary Unknown Player Appearance

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: otc2-canary-unknown-player-appearance
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.head_ref == 'feat/OTC2-20260803-canary-unknown-player-appearance'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-canary-unknown-player-appearance
          fetch-depth: 0

      - name: Restack product on current main when required
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Product branch already contains current main."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Unable to determine whether product branch contains current main."
          }
          git rebase origin/main
          git push --force-with-lease origin HEAD:feat/OTC2-20260803-canary-unknown-player-appearance
          Write-Host "Product branch restacked; synchronized validation will run on the new exact head."

      - name: Apply validate and persist unknown-player appearance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $script = ".github/scripts/otc2_canary_unknown_player_appearance.py"
          if (!(Test-Path $script)) {
            Write-Host "Unknown-player appearance phase already applied; no mutation required."
            exit 0
          }

          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
          python $script

          @'
          from pathlib import Path
          for path in [
              Path("docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md"),
              Path("oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md"),
              Path("oteryn-client/tests/integration/canary-world-protocol/fixtures/README.md"),
          ]:
              text = path.read_text(encoding="utf-8")
              terminal = text.endswith("\n")
              normalized = "\n".join(line.rstrip() for line in text.splitlines())
              path.write_text(normalized + ("\n" if terminal else ""), encoding="utf-8", newline="\n")
          '@ | python -

          Push-Location oteryn-client
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "oteryn-target"
          rustup override set 1.94.0
          cargo fmt --all
          cargo metadata --locked --format-version 1 | Out-Null
          cargo clippy -p oteryn-protocol-canary --all-targets -- -D warnings
          cargo test -p oteryn-protocol-canary --all-targets
          cargo test -p oteryn-architecture-check --all-targets
          cargo run -p oteryn-architecture-check -- workspace .
          Pop-Location

          Remove-Item $script
          git add -A -- `
            .github/scripts `
            docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md `
            oteryn-client/crates/protocol-canary/src `
            oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md `
            oteryn-client/tests/integration/canary-world-protocol/fixtures
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(protocol-canary): decode unknown player appearance"
          git push origin HEAD:feat/OTC2-20260803-canary-unknown-player-appearance

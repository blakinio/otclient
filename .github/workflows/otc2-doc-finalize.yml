name: OTC2 Documentation Finalize

on:
  push:
    branches:
      - feat/OTC2-20260804-tokio-transport
    paths:
      - .github/workflows/otc2-doc-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260804-tokio-transport
          show-progress: false

      - name: Update catalogue and change log
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path("docs/agents/MODULE_CATALOG.md")
          text = catalog.read_text(encoding="utf-8")
          text = text.replace("Last reviewed: 2026-08-01", "Last reviewed: 2026-08-04", 1)
          anchor = "| W7 technical-login application runtime | merged PR #118; archived by #119 | `oteryn-app-runtime` owns generation-checked cancellable/joined Identity and admission workers, bounded phase history and producer-owned `SessionEntered`/`EntryFailure`; the existing Windows shell adds explicit environment-only configuration and typed event-loop integration | `oteryn-client/crates/app-runtime/**`, `oteryn-client/tests/integration/technical-login/**`, `oteryn-client/apps/client/**`, `oteryn-client/docs/research/technical-login/W7_LOGIN_E2E_EVIDENCE.md` | Consumes exact ENTRY/Identity/Canary merges without substitute public contracts. Fake services prove the bounded flow and cleanup. Production Canary remains fail-closed; real/deployment and interactive desktop evidence remain explicit blockers without compatibility claims. |"
          row = "| Oteryn Tokio transport runtime | PR #266 | Application-owned exact Tokio `1.51.4` network runtime; protocol-neutral bounded full-duplex TCP sessions with directional queues, explicit connect/read/write/idle deadlines, control-priority cancellation, generation fencing, typed terminal failures, TCP_NODELAY, metrics and joined shutdown | `oteryn-client/crates/transport/**`, `oteryn-client/crates/app-runtime/**`, `oteryn-client/docs/research/transport/OTC2_TOKIO_TRANSPORT_EVIDENCE.md` | Preserves Identity, Gateway, Game Session and protocol-canary public/wire contracts. The old blocking transport is test/evidence-only behind `blocking-baseline`. Windows loopback evidence demonstrates bounded scheduler/queue behavior only and makes no physical RTT claim. |"
          if row not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("module catalogue anchor mismatch")
              text = text.replace(anchor, anchor + "\n" + row, 1)
          catalog.write_text(text, encoding="utf-8")

          changelog = Path("docs/agents/CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          bullet = "- The greenfield Rust client now owns exact Tokio `1.51.4` at the application boundary and uses protocol-neutral bounded full-duplex TCP session supervision with separate gameplay/background/inbound queues, explicit connect/read/write/idle deadlines, control-priority cancellation, session-generation fencing, typed terminal framing/connection failures, TCP_NODELAY, bounded allocation, non-secret high-water/overflow metrics and deterministic joined shutdown. Identity, Gateway, Game Session and protocol-canary public/wire contracts remain unchanged; the prior blocking implementation is retained only as a feature-gated evidence baseline. Deterministic Windows loopback evidence recorded equal p50 queue latency, slightly higher p95/p99, 4.51× pipelined synthetic throughput and bounded saturated-consumer cancellation without any physical-network latency claim."
          if bullet not in text:
              if text.count(marker) != 1:
                  raise SystemExit("change log marker mismatch")
              text = text.replace(marker, marker + "\n" + bullet, 1)
          changelog.write_text(text, encoding="utf-8")
          PY

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/MODULE_CATALOG.md docs/agents/CHANGELOG.md
          git commit -m "docs(agents): catalogue Tokio transport runtime"
          git push origin HEAD:feat/OTC2-20260804-tokio-transport

name: OTC2 Final Documentation Refresh

on:
  push:
    branches:
      - feat/OTC2-20260804-tokio-transport
    paths:
      - .github/workflows/otc2-final-doc-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260804-tokio-transport
          show-progress: false

      - name: Refresh exact evidence references
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog = Path("docs/agents/CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          old = "- The greenfield Rust client now owns exact Tokio `1.51.4` at the application boundary and uses protocol-neutral bounded full-duplex TCP session supervision with separate gameplay/background/inbound queues, explicit connect/read/write/idle deadlines, control-priority cancellation, session-generation fencing, typed terminal framing/connection failures, TCP_NODELAY, bounded allocation, non-secret high-water/overflow metrics and deterministic joined shutdown. Identity, Gateway, Game Session and protocol-canary public/wire contracts remain unchanged; the prior blocking implementation is retained only as a feature-gated evidence baseline. Deterministic Windows loopback evidence recorded equal p50 queue latency, slightly higher p95/p99, 4.51× pipelined synthetic throughput and bounded saturated-consumer cancellation without any physical-network latency claim."
          new = "- The greenfield Rust client now owns exact Tokio `1.51.4` at the application boundary and uses protocol-neutral bounded full-duplex TCP session supervision with separate gameplay/background/inbound queues, explicit total-operation connect/read/write/idle deadlines, control-priority cancellation, session-generation fencing, typed terminal framing/connection failures, TCP_NODELAY, bounded allocation, non-secret high-water/overflow metrics and deterministic joined shutdown. Identity, Gateway, Game Session and protocol-canary public/wire contracts remain unchanged; the prior blocking implementation is retained only as a feature-gated evidence baseline. Separate-process Windows loopback evidence recorded 40/74/91 µs blocking versus 42/70/99 µs Tokio p50/p95/p99, 3.82× pipelined synthetic throughput, 0.75× measured process CPU time, zero queue-full loss and 15.788 ms saturated-consumer cancellation without any physical-network latency claim."
          if text.count(old) != 1:
              raise SystemExit("Tokio changelog entry mismatch")
          changelog.write_text(text.replace(old, new, 1), encoding="utf-8")

          adr = Path("oteryn-client/docs/architecture/decisions/ADR-001-dual-protocol-selection-and-async-transport.md")
          text = adr.read_text(encoding="utf-8")
          old = "The current synchronous transport remains valid until the dedicated migration package passes comparative tests and exact-head validation. This ADR does not claim that Tokio is already implemented or that it reduces physical network RTT."
          new = "The synchronous transport remained valid until the dedicated migration package passed comparative tests and exact-head validation. The decision itself did not claim that Tokio was already implemented or that it reduces physical network RTT; the implementation-status section below records the authorized package separately."
          if text.count(old) != 1:
              raise SystemExit("ADR historical-status paragraph mismatch")
          adr.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit refreshed documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/CHANGELOG.md oteryn-client/docs/architecture/decisions/ADR-001-dual-protocol-selection-and-async-transport.md
          git commit -m "docs(transport): align ADR and changelog with final evidence"
          git push origin HEAD:feat/OTC2-20260804-tokio-transport

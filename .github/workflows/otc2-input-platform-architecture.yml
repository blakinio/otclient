name: OTC2 Input Platform Architecture Repair

on:
  push:
    branches:
      - feat/OTC2-20260803-playability-p2-input-platform

permissions:
  contents: write

concurrency:
  group: otc2-input-platform-architecture-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-playability-p2-input-platform
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Apply narrow architecture category
        shell: pwsh
        run: python .github/scripts/otc2_input_platform_architecture.py

      - name: Validate package and architecture
        working-directory: oteryn-client
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "oteryn-target"
          rustup override set 1.94.0
          cargo fmt --all
          cargo metadata --locked --format-version 1 | Out-Null
          cargo clippy -p oteryn-input-platform --all-targets -- -D warnings
          cargo test -p oteryn-input-platform --all-targets
          cargo test -p oteryn-architecture-check --all-targets
          cargo run -p oteryn-architecture-check -- workspace .

      - name: Remove temporary files and persist repair
        shell: pwsh
        run: |
          Remove-Item .github/workflows/otc2-input-platform-architecture.yml
          Remove-Item .github/scripts/otc2_input_platform_architecture.py
          git add `
            .github/workflows/otc2-input-platform-architecture.yml `
            .github/scripts/otc2_input_platform_architecture.py `
            oteryn-client/crates/input-platform/Cargo.toml `
            oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md `
            oteryn-client/tools/architecture-check/src/lib.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(input-platform): preserve one-way architecture boundary"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-input-platform

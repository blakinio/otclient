name: OTC2 Input Platform Integration

on:
  push:
    branches:
      - feat/OTC2-20260803-playability-p2-input-platform

permissions:
  contents: write

concurrency:
  group: otc2-input-platform-integration
  cancel-in-progress: false

jobs:
  integrate:
    name: Integrate, validate, self-remove
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-playability-p2-input-platform
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Apply minimal serialized integration
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path("oteryn-client/Cargo.toml")
          text = root.read_text(encoding="utf-8")
          member = '    "crates/input-platform",\n'
          if member not in text:
              anchor = '    "crates/input-actions",\n'
              if text.count(anchor) != 1:
                  raise SystemExit("input-actions workspace anchor is not unique")
              text = text.replace(anchor, anchor + member)
          root.write_text(text, encoding="utf-8", newline="\n")

          manifest = Path("oteryn-client/crates/input-platform/Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          marker = '''
          # Exclusive-path development is intentionally standalone until the serialized
          # workspace/lockfile lease reaches Input Platform. Remove this nested workspace
          # marker when the crate is integrated into the parent workspace under that lease.
          [workspace]
          '''
          if marker in text:
              text = text.replace(marker, "")
          elif "\n[workspace]\n" in text:
              text = text.replace("\n[workspace]\n", "\n")
          if "[workspace]" in text:
              raise SystemExit("standalone workspace marker remains")
          manifest.write_text(text, encoding="utf-8", newline="\n")

          layout = Path("oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md")
          text = layout.read_text(encoding="utf-8")
          if "│   ├── input-platform/\n" not in text:
              anchor = "│   ├── input/\n"
              if text.count(anchor) != 1:
                  raise SystemExit("input tree anchor is not unique")
              text = text.replace(anchor, anchor + "│   ├── input-platform/\n")
          row = "| `input-platform` | bounded Windows/winit physical-event normalization into framework-neutral input contracts | product bindings, gameplay commands, global hooks, background capture, device fingerprinting or application composition |\n"
          if row not in text:
              anchor = "| `input` | devices, bindings, contexts and semantic actions | direct socket writes |\n"
              if text.count(anchor) != 1:
                  raise SystemExit("input responsibility anchor is not unique")
              text = text.replace(anchor, anchor + row)
          dependency = '''
          input-platform
          └── input-actions

          '''
          if dependency not in text:
              anchor = '''renderer-resource
          ├── asset-decode
          ├── asset-runtime
          └── foundation

          '''
              if text.count(anchor) != 1:
                  raise SystemExit("dependency insertion anchor is not unique")
              text = text.replace(anchor, anchor + dependency)
          layout.write_text(text, encoding="utf-8", newline="\n")

          task = Path("docs/agents/tasks/active/OTC2-20260803-playability-p2-input-platform.md")
          text = task.read_text(encoding="utf-8")
          text = text.replace("status: waiting", "status: validating", 1)
          text = text.replace(
              "phase: exclusive-implementation-complete-awaiting-renderer-resource-archive",
              "phase: shared-integration-and-focused-validation",
              1,
          )
          text = text.replace('required_base_commit: "d18b618fc68c0e67598be10dee6f1d0119bc8aa8"', 'required_base_commit: "8a3ce18f8fe98c5654ac3ce36c098404bdfc3343"', 1)
          text = text.replace("shared_path_lease: []", '''shared_path_lease:
            holder: OTC2-20260803-playability-p2-input-platform
            state: held
            paths:
              - oteryn-client/Cargo.toml
              - oteryn-client/Cargo.lock
              - oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md''', 1)
          task.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Select pinned toolchain and generate lock
        working-directory: oteryn-client
        shell: pwsh
        run: |
          rustup override set 1.94.0
          cargo metadata --format-version 1 | Out-Null

      - name: Validate focused package and architecture
        working-directory: oteryn-client
        shell: pwsh
        run: |
          cargo fmt -p oteryn-input-platform
          cargo clippy -p oteryn-input-platform --all-targets -- -D warnings
          cargo test -p oteryn-input-platform --all-targets
          cargo run -p oteryn-architecture-check -- workspace .

      - name: Verify bounded paths and persist integration
        shell: pwsh
        run: |
          Remove-Item .github/workflows/otc2-input-platform-integration.yml
          git add `
            .github/workflows/otc2-input-platform-integration.yml `
            docs/agents/tasks/active/OTC2-20260803-playability-p2-input-platform.md `
            oteryn-client/Cargo.toml `
            oteryn-client/Cargo.lock `
            oteryn-client/crates/input-platform/Cargo.toml `
            oteryn-client/crates/input-platform/src `
            oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(input-platform): integrate and validate Windows adapter"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-input-platform

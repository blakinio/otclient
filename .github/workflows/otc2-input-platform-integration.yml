name: OTC2 Input Platform Integration

on:
  push:
    branches:
      - feat/OTC2-20260803-playability-p2-input-platform

permissions:
  contents: write

concurrency:
  group: otc2-input-platform-integration
  cancel-in-progress: false

jobs:
  integrate:
    name: Integrate, validate, self-remove
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-playability-p2-input-platform
          fetch-depth: 0

      - name: Verify exact restack and install pinned Rust
        shell: pwsh
        run: |
          git fetch origin main
          if ((git rev-parse origin/main) -ne "8a3ce18f8fe98c5654ac3ce36c098404bdfc3343") {
            throw "main moved after the serialized lease was claimed"
          }
          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "input-platform branch is not restacked on exact main"
          }
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Apply bounded workspace and architecture integration
        shell: pwsh
        run: python .github/scripts/otc2_input_platform_integrate.py

      - name: Validate focused, component and architecture contracts
        working-directory: oteryn-client
        shell: pwsh
        run: |
          rustup override set 1.94.0
          cargo fmt --all
          cargo metadata --locked --format-version 1 | Out-Null
          cargo clippy -p oteryn-input-platform --all-targets -- -D warnings
          cargo test -p oteryn-input-platform --all-targets
          cargo test -p oteryn-architecture-check --all-targets
          cargo run -p oteryn-architecture-check -- workspace .

      - name: Verify exact lockfile scope
        shell: pwsh
        run: |
          git diff --check origin/main -- oteryn-client/Cargo.lock
          @'
          import subprocess

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "origin/main", "--", "oteryn-client/Cargo.lock"],
              text=True,
          )
          if 'name = "oteryn-input-platform"' not in diff:
              raise SystemExit("missing local input-platform lock entry")
          changed = [
              line
              for line in diff.splitlines()
              if line.startswith(("+", "-")) and not line.startswith(("+++", "---"))
          ]
          if any("source =" in line or "checksum =" in line for line in changed):
              raise SystemExit("registry source or checksum drift detected")
          '@ | python -

      - name: Remove temporary files and persist integration
        shell: pwsh
        run: |
          Remove-Item .github/workflows/otc2-input-platform-integration.yml
          Remove-Item .github/scripts/otc2_input_platform_integrate.py
          git add --all
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(input-platform): integrate bounded Windows adapter"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-input-platform

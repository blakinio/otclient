name: OTC2 Renderer Resource Complete Repair

on:
  push:
    branches:
      - feat/OTC2-20260803-playability-p2-renderer-resource

permissions:
  contents: write

concurrency:
  group: otc2-renderer-resource-complete-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-playability-p2-renderer-resource
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Apply bounded source and architecture repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_or_verify(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new)
              if count == 0 and new in text:
                  return text
              raise SystemExit(f"{label}: expected one old anchor or an existing repair, found {count}")

          source = Path("oteryn-client/crates/renderer-resource/src/lib.rs")
          text = source.read_text(encoding="utf-8")
          text = replace_or_verify(
              text,
              "    pub const fn synthetic_v1() -> Self {",
              "    pub fn synthetic_v1() -> Self {",
              "synthetic limits constructor",
          )

          old_acquire = '''        let handle = self.preview_next_handle()?;
          let texture = self
              .sink
              .upload(&plan)
              .map_err(|_| ResourceError::UploadFailed)?;
          let tick = self.take_access_tick()?;
          self.next_slot = self
              .next_slot
              .checked_add(1)
              .ok_or(ResourceError::ArithmeticOverflow)?;
          self.next_serial = self
              .next_serial
              .checked_add(1)
              .ok_or(ResourceError::ArithmeticOverflow)?;
          self.accounted_device_bytes = self
              .accounted_device_bytes
              .checked_add(required_bytes)
              .ok_or(ResourceError::ArithmeticOverflow)?;
          self.entries.push(CacheEntry {
'''
          new_acquire = '''        let handle = self.preview_next_handle()?;
          let tick = self.access_tick;
          let next_access_tick = self
              .access_tick
              .checked_add(1)
              .ok_or(ResourceError::ArithmeticOverflow)?;
          let next_slot = self
              .next_slot
              .checked_add(1)
              .ok_or(ResourceError::ArithmeticOverflow)?;
          let next_serial = self
              .next_serial
              .checked_add(1)
              .ok_or(ResourceError::ArithmeticOverflow)?;
          let accounted_device_bytes = self
              .accounted_device_bytes
              .checked_add(required_bytes)
              .ok_or(ResourceError::ArithmeticOverflow)?;
          self.entries
              .try_reserve(1)
              .map_err(|_| ResourceError::AllocationFailed)?;
          let texture = self
              .sink
              .upload(&plan)
              .map_err(|_| ResourceError::UploadFailed)?;
          self.access_tick = next_access_tick;
          self.next_slot = next_slot;
          self.next_serial = next_serial;
          self.accounted_device_bytes = accounted_device_bytes;
          self.entries.push(CacheEntry {
'''
          text = replace_or_verify(text, old_acquire, new_acquire, "atomic acquire")

          text = replace_or_verify(
              text,
              "        if new_generation == self.device_generation {",
              "        if new_generation <= self.device_generation {",
              "monotonic device generation",
          )
          text = replace_or_verify(
              text,
              "        if new_generation == self.pack_generation {",
              "        if new_generation <= self.pack_generation {",
              "monotonic pack generation",
          )

          text = replace_or_verify(
              text,
              '''        assert_eq!(cache.resolve(first.handle())?.texture().byte_len, 16);
        Ok(())
''',
              '''        let resolved = cache.resolve(first.handle())?;
        assert_eq!(resolved.texture().id, 1);
        assert_eq!(resolved.texture().byte_len, 16);
        Ok(())
''',
              "fake texture identity assertion",
          )
          text = replace_or_verify(
              text,
              '''        let mut sink = FakeSink::default();
        sink.fail_next = true;
''',
              '''        let sink = FakeSink {
            fail_next: true,
            ..FakeSink::default()
        };
''',
              "fake sink initializer",
          )

          if "    AllocationFailed,\n" not in text:
              text = replace_or_verify(
                  text,
                  '''    /// Checked layout, counter or accounting arithmetic overflowed.
    ArithmeticOverflow,
''',
                  '''    /// Checked layout, counter or accounting arithmetic overflowed.
    ArithmeticOverflow,
    /// A bounded cache metadata reservation failed before sink upload.
    AllocationFailed,
''',
                  "allocation error enum",
              )
              text = replace_or_verify(
                  text,
                  '''            Self::ArithmeticOverflow => "renderer resource arithmetic overflowed",
            Self::TextureBytesLimitExceeded => "texture exceeds the device-memory limit",
''',
                  '''            Self::ArithmeticOverflow => "renderer resource arithmetic overflowed",
            Self::AllocationFailed => "renderer resource metadata allocation failed",
            Self::TextureBytesLimitExceeded => "texture exceeds the device-memory limit",
''',
                  "allocation error display",
              )

          if "fn pre_upload_counter_failure_is_atomic()" not in text:
              anchor = '''    #[test]
    fn memory_pressure_evicts_before_upload_and_clear_is_exact() -> Result<(), Box<dyn Error>> {
'''
              test = '''    #[test]
    fn pre_upload_counter_failure_is_atomic() -> Result<(), Box<dyn Error>> {
        let (_runtime, asset, decoded) = fixture(9, 1, 1, 1, 9)?;
        let mut cache = cache(asset.generation(), ResourceLimits::synthetic_v1())?;
        cache.access_tick = u64::MAX;

        assert_eq!(
            cache.acquire(asset, &decoded).err(),
            Some(ResourceError::ArithmeticOverflow)
        );
        assert_eq!(cache.sink.uploads, 0);
        assert_eq!(cache.entry_count(), 0);
        assert_eq!(cache.accounted_device_bytes(), 0);
        Ok(())
    }

'''
              if text.count(anchor) != 1:
                  raise SystemExit("atomicity test: expected one insertion anchor")
              text = text.replace(anchor, test + anchor)

          reset_old = '''        assert_eq!(
            cache.replace_pack(cache.pack_generation()).err(),
            Some(ResourceError::PackGenerationNotAdvanced)
        );
        Ok(())
'''
          reset_new = '''        assert_eq!(
            cache.replace_pack(cache.pack_generation()).err(),
            Some(ResourceError::PackGenerationNotAdvanced)
        );
        cache.replace_device(DeviceGeneration::new(2)?)?;
        assert_eq!(
            cache.replace_device(DeviceGeneration::new(1)?).err(),
            Some(ResourceError::DeviceGenerationNotAdvanced)
        );
        assert_eq!(
            cache.replace_pack(PackGeneration::new(7)?).err(),
            Some(ResourceError::PackGenerationNotAdvanced)
        );
        Ok(())
'''
          text = replace_or_verify(text, reset_old, reset_new, "monotonic generation tests")
          source.write_text(text, encoding="utf-8", newline="\n")

          asset_manifest = Path("oteryn-client/crates/asset-decode/Cargo.toml")
          manifest = asset_manifest.read_text(encoding="utf-8")
          manifest = replace_or_verify(
              manifest,
              'category = "runtime"',
              'category = "asset-decode"',
              "asset-decode category",
          )
          asset_manifest.write_text(manifest, encoding="utf-8", newline="\n")

          policy_path = Path("oteryn-client/tools/architecture-check/src/lib.rs")
          policy = policy_path.read_text(encoding="utf-8")
          known_start = policy.index("const KNOWN_CATEGORIES")
          product_start = policy.index("const PRODUCT_CATEGORIES")
          known_block = policy[known_start:product_start]
          known_block = replace_or_verify(
              known_block,
              '''    "asset-types",
    "asset-runtime",
''',
              '''    "asset-types",
    "asset-decode",
    "asset-runtime",
''',
              "known asset-decode category",
          )
          policy = policy[:known_start] + known_block + policy[product_start:]

          renderer_start = policy.index('        "renderer" => matches!(')
          renderer_end = policy.index('        "ui-core" => matches!(', renderer_start)
          renderer_block = policy[renderer_start:renderer_end]
          renderer_block = replace_or_verify(
              renderer_block,
              '''                | "asset-types"
                | "asset-runtime"
''',
              '''                | "asset-types"
                | "asset-decode"
                | "asset-runtime"
''',
              "renderer asset-decode edge",
          )
          policy = policy[:renderer_start] + renderer_block + policy[renderer_end:]

          decode_arm = '''        "asset-decode" => matches!(target, "asset-types" | "asset-runtime"),
'''
          if decode_arm not in policy:
              arm_anchor = '''        "asset-types" => target == "foundation",
        "asset-runtime" => matches!(
'''
              if policy.count(arm_anchor) != 1:
                  raise SystemExit("asset-decode policy arm: expected one insertion anchor")
              policy = policy.replace(
                  arm_anchor,
                  '''        "asset-types" => target == "foundation",
        "asset-decode" => matches!(target, "asset-types" | "asset-runtime"),
        "asset-runtime" => matches!(
''',
              )

          if "fn asset_decode_category_edges_are_narrow()" not in policy:
              policy += '''

#[cfg(test)]
mod renderer_resource_policy_tests {
    use super::*;

    #[test]
    fn asset_decode_category_edges_are_narrow() {
        assert!(dependency_allowed(
            "renderer",
            "asset-decode",
            DependencyKind::Normal
        ));
        assert!(dependency_allowed(
            "asset-decode",
            "asset-runtime",
            DependencyKind::Normal
        ));
        assert!(dependency_allowed(
            "asset-decode",
            "asset-types",
            DependencyKind::Normal
        ));
        assert!(!dependency_allowed(
            "runtime",
            "asset-decode",
            DependencyKind::Normal
        ));
        assert!(!dependency_allowed(
            "app",
            "asset-decode",
            DependencyKind::Normal
        ));
        assert!(!dependency_allowed(
            "asset-decode",
            "renderer",
            DependencyKind::Normal
        ));
    }
}
'''
          policy_path.write_text(policy, encoding="utf-8", newline="\n")

          lock = Path("oteryn-client/Cargo.lock")
          lock_text = lock.read_text(encoding="utf-8")
          replacements = {
              '''name = "ipnet"
version = "2.12.1"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "6a756c3fac73139e83f14c2d742155dd2b78d3ee56597b419a0579b7bdd6dd78"''':
              '''name = "ipnet"
version = "2.12.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "d98f6fed1fde3f8c21bc40a1abb88dd75e67924f9cffc3ef95607bad8017f8e2"''',
              '''name = "libredox"
version = "0.1.19"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "2026a5056764a10b2bf5d56488cba40da507f5493a6a429340e2004d9ed085fa"''':
              '''name = "libredox"
version = "0.1.18"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "c943259e342f1e06ff2da7a83eabdfe7f92ce10262688dbf1895ff0b3e6e4652"''',
          }
          for old_lock, new_lock in replacements.items():
              if old_lock in lock_text:
                  lock_text = lock_text.replace(old_lock, new_lock)
              elif new_lock not in lock_text:
                  raise SystemExit(f"lock drift: missing accepted anchors for {old_lock.splitlines()[0:2]}")
          lock.write_text(lock_text, encoding="utf-8", newline="\n")
          PY

      - name: Validate exact repair
        working-directory: oteryn-client
        run: |
          rustup override set 1.94.0
          cargo fmt --all
          cargo metadata --locked --format-version 1 > /dev/null
          cargo test -p oteryn-renderer-resource --all-targets
          cargo clippy -p oteryn-renderer-resource --all-targets -- -D warnings
          cargo test -p oteryn-architecture-check --all-targets
          cargo run -p oteryn-architecture-check -- workspace .

      - name: Remove workflow and persist repair
        run: |
          git rm .github/workflows/otc2-renderer-resource-atomic-repair.yml
          git add \
            oteryn-client/Cargo.lock \
            oteryn-client/crates/asset-decode/Cargo.toml \
            oteryn-client/crates/renderer-resource/src/lib.rs \
            oteryn-client/tools/architecture-check/src/lib.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(renderer-resource): make lifecycle and architecture integration atomic"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-renderer-resource

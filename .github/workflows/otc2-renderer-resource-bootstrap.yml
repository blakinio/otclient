name: OTC2 Renderer Resource Bootstrap

on:
  push:
    branches:
      - feat/OTC2-20260803-playability-p2-renderer-resource

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-playability-p2-renderer-resource
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Patch normative renderer-resource layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "│   ├── renderer/\n│   ├── ui-core/":
                  "│   ├── renderer/\n│   ├── renderer-resource/\n│   ├── ui-core/",
              "| `renderer` | deterministic surface lifecycle, GPU instance/surface/adapter/device/queue ownership and bounded presentation | feature business logic, game rendering, UI or protocol |\n| `ui-core` |":
                  "| `renderer` | deterministic surface lifecycle, GPU instance/surface/adapter/device/queue ownership and bounded presentation | feature business logic, game rendering, UI or protocol |\n| `renderer-resource` | checked immutable RGBA8 upload plans, process/device/asset-generation-fenced handles and bounded deterministic cache lifecycle | world state, draw ordering, protocol, input, UI, filesystem acquisition or CPU media decode |\n| `ui-core` |",
              "renderer\n├── render-types\n├── asset-runtime\n├── platform/GPU dependencies\n└── foundation when a generic primitive is required\n\ntest-support":
                  "renderer\n├── render-types\n├── asset-runtime\n├── platform/GPU dependencies\n└── foundation when a generic primitive is required\n\nrenderer-resource\n├── asset-decode\n├── asset-runtime\n└── foundation\n\ntest-support",
              "Renderer depends only on foundation plus its exact GPU dependencies and owns no feature, protocol, asset or UI service. `asset-decode` is categorized":
                  "Renderer depends only on foundation plus its exact GPU dependencies and owns no feature, protocol, asset or UI service. `renderer-resource` is a backend-neutral renderer-category producer over `asset-decode`, `asset-runtime` and foundation; it owns no device, world or draw policy. `asset-decode` is categorized",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one layout anchor: {old[:60]!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Normalize lockfile and formatting
        working-directory: oteryn-client
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Remove bootstrap and persist generated integration
        run: |
          git rm .github/workflows/otc2-renderer-resource-bootstrap.yml
          git add oteryn-client/Cargo.lock oteryn-client/crates/renderer-resource/src/lib.rs oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(renderer-resource): normalize generated integration"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-renderer-resource
      - name: Focused tests
        working-directory: oteryn-client
        run: cargo test -p oteryn-renderer-resource
      - name: Strict focused Clippy
        working-directory: oteryn-client
        run: cargo clippy -p oteryn-renderer-resource --all-targets -- -D warnings

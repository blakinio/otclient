name: OTC2 Renderer Resource Final Polish

on:
  push:
    branches:
      - feat/OTC2-20260803-playability-p2-renderer-resource

permissions:
  contents: write

concurrency:
  group: otc2-renderer-resource-final-polish
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-playability-p2-renderer-resource
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Apply final contract polish
        run: python .github/scripts/otc2_renderer_resource_final_polish.py

      - name: Validate final contract
        working-directory: oteryn-client
        run: |
          rustup override set 1.94.0
          cargo fmt --all
          cargo metadata --locked --format-version 1 > /dev/null
          cargo test -p oteryn-renderer-resource --all-targets
          cargo clippy -p oteryn-renderer-resource --all-targets -- -D warnings
          cargo test -p oteryn-architecture-check --all-targets
          cargo run -p oteryn-architecture-check -- workspace .

      - name: Remove temporary files and persist polish
        run: |
          git rm --ignore-unmatch \
            .github/workflows/otc2-renderer-resource-final-polish.yml \
            .github/scripts/otc2_renderer_resource_final_polish.py
          git add \
            oteryn-client/crates/renderer-resource/src/lib.rs \
            oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs(renderer-resource): clarify bounded failure semantics"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-renderer-resource

name: OTC2 Renderer Resource Repair

on:
  push:
    branches:
      - feat/OTC2-20260803-playability-p2-renderer-resource

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260803-playability-p2-renderer-resource
          fetch-depth: 0
      - name: Remove denied constant expect calls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("oteryn-client/crates/renderer-resource/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = '.expect("non-zero constant")'
          if text.count(old) != 4:
              raise SystemExit(f"expected four constant expect calls, found {text.count(old)}")
          text = text.replace(old, ".unwrap_or(NonZeroUsize::MIN)")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          cd oteryn-client
          cargo fmt --all
      - name: Remove repair workflow and persist change
        run: |
          git rm .github/workflows/otc2-renderer-resource-repair.yml
          git add oteryn-client/crates/renderer-resource/src/lib.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(renderer-resource): avoid denied constant expect calls"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-renderer-resource

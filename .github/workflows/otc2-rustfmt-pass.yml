name: OTC2 Rustfmt Pass

on:
  push:
    branches:
      - feat/OTC2-20260804-tokio-transport
    paths:
      - oteryn-client/**/*.rs
      - .github/workflows/otc2-rustfmt-pass.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260804-tokio-transport
          show-progress: false

      - name: Install pinned formatter
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0

      - name: Format workspace
        working-directory: oteryn-client
        run: cargo fmt --all

      - name: Commit formatted sources
        run: |
          if git diff --quiet -- oteryn-client; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client
          git commit -m "style(rust): format completed Tokio supervision"
          git push origin HEAD:feat/OTC2-20260804-tokio-transport

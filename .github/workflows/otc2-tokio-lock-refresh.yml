name: OTC2 Tokio Lock Refresh

on:
  push:
    branches:
      - "feat/OTC2-20260804-tokio-transport"
    paths:
      - "oteryn-client/Cargo.toml"
      - "oteryn-client/crates/transport/Cargo.toml"
      - "oteryn-client/crates/app-runtime/Cargo.toml"
      - ".github/workflows/otc2-tokio-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: "feat/OTC2-20260804-tokio-transport"
          show-progress: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Resolve only the committed workspace lock
        working-directory: oteryn-client
        run: cargo metadata --format-version 1 > /dev/null

      - name: Commit lockfile delta
        run: |
          if git diff --quiet -- oteryn-client/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/Cargo.lock
          git commit -m "build(rust): refresh lockfile for Tokio"
          git push origin HEAD:feat/OTC2-20260804-tokio-transport

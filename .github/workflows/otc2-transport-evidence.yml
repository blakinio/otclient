name: OTC2 Transport Evidence

on:
  push:
    branches:
      - feat/OTC2-20260804-tokio-transport
    paths:
      - oteryn-client/crates/transport/**
      - .github/workflows/otc2-transport-evidence.yml

permissions:
  contents: write

jobs:
  windows-evidence:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260804-tokio-transport
          show-progress: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $output = rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc 2>&1
          if ($LASTEXITCODE -ne 0) { throw ($output -join "`n") }
          rustup default 1.94.0 | Out-Null
          rustc --version
          cargo --version

      - name: Format task sources
        working-directory: oteryn-client
        run: cargo fmt --all

      - name: Lint transport with blocking baseline
        working-directory: oteryn-client
        run: cargo clippy -p oteryn-transport --all-targets --features blocking-baseline -- -D warnings

      - name: Test transport with blocking baseline
        working-directory: oteryn-client
        run: cargo test -p oteryn-transport --features blocking-baseline

      - name: Run and persist comparative release evidence
        shell: pwsh
        working-directory: oteryn-client
        env:
          CARGO_TERM_COLOR: never
        run: |
          $evidence = "docs/research/transport/OTC2_TOKIO_TRANSPORT_EVIDENCE_RAW.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $evidence) | Out-Null
          @(
            "run_id=$env:GITHUB_RUN_ID",
            "job=$env:GITHUB_JOB",
            "source_sha=$env:GITHUB_SHA",
            "runner_os=$env:RUNNER_OS",
            "runner_arch=$env:RUNNER_ARCH",
            "rustc=$(rustc --version)",
            "cargo=$(cargo --version)"
          ) | Set-Content -Path $evidence -Encoding utf8
          & cargo run -p oteryn-transport --example transport_evidence --features blocking-baseline --release 2>&1 |
            Tee-Object -FilePath $evidence -Append
          if ($LASTEXITCODE -ne 0) {
            throw "transport evidence harness failed with exit code $LASTEXITCODE"
          }

      - name: Commit canonical evidence
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- oteryn-client)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add oteryn-client
            git commit -m "perf(transport): capture Windows Tokio evidence"
            git push origin HEAD:feat/OTC2-20260804-tokio-transport
          }

name: OTClient Tibia Global hosted login probe

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/otclient-global-login-hosted.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: otclient-global-login-hosted
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OTCLIENT_IMAGE: ghcr.io/blakinio/otclient:latest
      ASSET_BASE: https://static.tibia.com/launcher/assets-current
      PROBE_ROOT: /tmp/otclient-global-probe
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Establish pinned userspace WARP before credential use
        shell: bash
        run: |
          set -Eeuo pipefail
          direct_ip=''
          for endpoint in https://api.ipify.org https://icanhazip.com; do
            candidate=$(curl -fsS --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$endpoint" 2>/dev/null | tr -d '\r\n ' || true)
            if [[ "$candidate" =~ ^[0-9A-Fa-f:.]+$ ]]; then
              direct_ip="$candidate"
              break
            fi
          done
          [[ -n "$direct_ip" ]]
          r=/tmp/otclient-warp
          mkdir -p "$r/bin" "$r/state" "$PROBE_ROOT/runtime" "$PROBE_ROOT/home" "$PROBE_ROOT/things/1532"
          chmod 700 "$r" "$r/state" "$PROBE_ROOT/home"
          cd "$r/bin"
          curl -fsSL --retry 3 --retry-all-errors -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL --retry 3 --retry-all-errors -o wireproxy.tar.gz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tar.gz' | sha256sum -c -
          mkdir extract
          tar -xzf wireproxy.tar.gz -C extract
          cp "$(find extract -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy
          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          chmod 600 wgcf-account.toml wgcf-profile.conf
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          chmod 600 wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          ready=0
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$PROBE_ROOT/runtime/warp.trace" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          [[ "$ready" == 1 ]]
          warp_state=$(sed -n 's/^warp=//p' "$PROBE_ROOT/runtime/warp.trace")
          warp_ip=$(sed -n 's/^ip=//p' "$PROBE_ROOT/runtime/warp.trace")
          [[ "$warp_state" == on || "$warp_state" == plus ]]
          [[ -n "$warp_ip" && "$warp_ip" != "$direct_ip" ]]
          echo WARP_CHANGED_EGRESS_VERIFIED=true

      - name: Materialize current OTClient-required Tibia assets through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,lzma,os,pathlib,subprocess,tempfile,urllib.parse
          base=os.environ['ASSET_BASE'].rstrip('/')
          out=pathlib.Path(os.environ['PROBE_ROOT'])/'things/1532'
          out.mkdir(parents=True,exist_ok=True)
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          def get(url,path):
              subprocess.run(['curl','--socks5-hostname','127.0.0.1:25344','--compressed','-fL','--retry','3','--retry-all-errors','--connect-timeout','15','--max-time','180','-A',ua,'-e',url,'-H','Accept: */*','-H','Accept-Language: en-US,en;q=0.9','-H','Cache-Control: no-cache',url,'-o',str(path)],check=True)
          mp=pathlib.Path('/tmp/otclient-assets.json'); get(base+'/assets.json',mp); doc=json.loads(mp.read_text())
          rows=[]
          def walk(v):
              if isinstance(v,dict):
                  if isinstance(v.get('url'),str) and isinstance(v.get('packedhash'),str): rows.append((v['url'],v['packedhash'].lower(),str(v.get('unpackedhash') or '').lower()))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(doc)
          def decode(data,rel,unpacked):
              if not unpacked or not rel.endswith('.lzma'): return data,rel
              if hashlib.sha256(data).hexdigest()==unpacked: return data,rel[:-5]
              if len(data)<45: raise RuntimeError('short lzma')
              prop=data[32]; lc=prop%9; rest=prop//9; lp=rest%5; pb=rest//5; ds=int.from_bytes(data[33:37],'little')
              filt={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}
              return lzma.decompress(data[45:],format=lzma.FORMAT_RAW,filters=[filt]),rel[:-5]
          def fetch(row):
              rel,packed,unpacked=row
              with tempfile.NamedTemporaryFile(delete=False) as f: tmp=pathlib.Path(f.name)
              try:
                  get(base+'/'+urllib.parse.quote(rel,safe='/._-~'),tmp); data=tmp.read_bytes()
                  if hashlib.sha256(data).hexdigest()!=packed: raise RuntimeError('packed hash mismatch')
                  raw,final=decode(data,rel,unpacked)
                  if unpacked and hashlib.sha256(raw).hexdigest()!=unpacked: raise RuntimeError('unpacked hash mismatch')
                  return raw,final
              finally: tmp.unlink(missing_ok=True)
          catrow=next((r for r in rows if r[0].endswith('catalog-content.json') or r[0].endswith('catalog-content.json.lzma')),None)
          if not catrow: raise RuntimeError('catalog-content row absent')
          catraw,_=fetch(catrow); (out/'catalog-content.json').write_bytes(catraw); catalog=json.loads(catraw)
          wanted={o['file'] for o in catalog if isinstance(o,dict) and o.get('type') in {'appearances','staticdata','sprite','proficiencies'} and isinstance(o.get('file'),str)}
          mapping={}
          for r in rows:
              rel=r[0][:-5] if r[0].endswith('.lzma') and r[2] else r[0]
              key=rel.rsplit('/',1)[-1]
              if key in wanted and key not in mapping: mapping[key]=r
          missing=wanted-set(mapping)
          if missing: raise RuntimeError(f'required catalog assets missing: {len(missing)}')
          for name in sorted(wanted): (out/name).write_bytes(fetch(mapping[name])[0])
          sha=out/'assets.json.sha256'
          try: get(base+'/assets.json.sha256',sha)
          except subprocess.CalledProcessError: sha.unlink(missing_ok=True)
          print('OTCLIENT_CATALOG_FILE_COUNT='+str(len(wanted)))
          print('OTCLIENT_REQUIRED_ASSETS_READY=true')
          print('ASSET_IDENTIFIER_FILE_PRESENT='+str(sha.exists()).lower())
          PY

      - name: Prepare non-persistent login instrumentation
        shell: bash
        run: |
          set -Eeuo pipefail
          cp init.lua "$PROBE_ROOT/runtime/init.lua"
          cat >>"$PROBE_ROOT/runtime/init.lua" <<'LUA'
          if os.getenv('OTCLIENT_GLOBAL_LOGIN_PROBE') == '1' then
            if Services.clientAssets then Services.clientAssets.enabled = false end
            local function mark(s) g_logger.info('[GLOBAL_PROBE] ' .. s) end
            connect(g_game, {
              onGameStart=function() mark('GAME_START=true') end,
              onLoginError=function() mark('GAME_LOGIN_ERROR=true') end,
              onConnectionError=function() mark('GAME_CONNECTION_ERROR=true') end,
              onSessionEnd=function() mark('GAME_SESSION_END=true') end
            })
            local success=EnterGame.loginSuccess
            EnterGame.loginSuccess=function(requestId,characters,session)
              mark('HTTP_LOGIN_SUCCESS=true'); success(requestId,characters,session)
              scheduleEvent(function()
                if CharacterList and CharacterList.doLogin then mark('CHARACTER_LOGIN_ATTEMPT=true'); CharacterList.doLogin()
                else mark('CHARACTER_LIST_UNAVAILABLE=true') end
              end,1000)
            end
            local failed=EnterGame.loginFailed
            EnterGame.loginFailed=function(requestId,msg,result) mark('HTTP_LOGIN_FAILED=true'); failed(requestId,msg,result) end
            scheduleEvent(function()
              local email=os.getenv('TIBIA_TEST_EMAIL') or ''; local password=os.getenv('TIBIA_TEST_PASSWORD') or ''
              if email=='' or password=='' then mark('SECRET_GATE_FAILED=true'); return end
              EnterGame.setDefaultServer('https://www.tibia.com/clientservices/loginservice.php',443,1532)
              local a=rootWidget:recursiveGetChildById('accountNameTextEdit'); local p=rootWidget:recursiveGetChildById('accountPasswordTextEdit'); local h=rootWidget:recursiveGetChildById('httpLoginBox'); local stay=rootWidget:recursiveGetChildById('stayLoggedBox')
              if not a or not p or not h then mark('LOGIN_WIDGETS_UNAVAILABLE=true'); return end
              a:setText(email); p:setText(password); h:setChecked(true); if stay then stay:setChecked(false) end
              email=nil; password=nil; mark('LOGIN_START=true'); EnterGame.doLogin()
            end,1500)
            scheduleEvent(function() if not g_game.isOnline() then mark('PROBE_TIMEOUT=true'); g_app.exit() end end,90000)
          end
          LUA
          chmod 644 "$PROBE_ROOT/runtime/init.lua"
          cat >"$PROBE_ROOT/runtime/proxychains.conf" <<'EOF'
          strict_chain
          proxy_dns
          quiet_mode
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks5 127.0.0.1 25344
          EOF
          echo NON_PERSISTENT_LOGIN_INSTRUMENTATION_READY=true

      - name: Launch our OTClient and attempt Global login
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          docker pull "$OTCLIENT_IMAGE" >/dev/null
          docker rm -f otclient-global-hosted >/dev/null 2>&1 || true
          docker run -d --name otclient-global-hosted --network host --user root \
            --mount "type=bind,src=$PROBE_ROOT,dst=/probe" \
            --mount "type=bind,src=$PROBE_ROOT/runtime/init.lua,dst=/otclient/init.lua,readonly" \
            --mount "type=bind,src=$PROBE_ROOT/things/1532,dst=/otclient/data/things/1532,readonly" \
            "$OTCLIENT_IMAGE" sleep infinity >/dev/null
          docker exec otclient-global-hosted bash -lc 'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y --no-install-recommends proxychains4 xvfb x11-utils procps iproute2 >/dev/null'
          docker exec otclient-global-hosted bash -lc '! command -v tesseract >/dev/null 2>&1'
          : >"$PROBE_ROOT/runtime/otclient.stdout.log"
          docker exec otclient-global-hosted bash -lc 'nohup Xvfb :100 -screen 0 1280x800x24 -nolisten tcp >/probe/runtime/xvfb.log 2>&1 </dev/null &'
          for _ in $(seq 1 30); do docker exec otclient-global-hosted xdpyinfo -display :100 >/dev/null 2>&1 && break; sleep 1; done
          docker exec otclient-global-hosted xdpyinfo -display :100 >/dev/null
          docker exec -d -e DISPLAY=:100 -e HOME=/probe/home -e LIBGL_ALWAYS_SOFTWARE=1 -e OTCLIENT_GLOBAL_LOGIN_PROBE=1 -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD otclient-global-hosted bash -lc 'cd /otclient && exec proxychains4 -f /probe/runtime/proxychains.conf ./otclient >>/probe/runtime/otclient.stdout.log 2>&1'
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          for _ in $(seq 1 200); do
            grep -q '\[GLOBAL_PROBE\] GAME_START=true' "$PROBE_ROOT/runtime/otclient.stdout.log" && break
            grep -q '\[GLOBAL_PROBE\] PROBE_TIMEOUT=true' "$PROBE_ROOT/runtime/otclient.stdout.log" && break
            docker exec otclient-global-hosted pgrep -f '/otclient/otclient|./otclient' >/dev/null 2>&1 || break
            sleep 0.5
          done
          grep -o '\[GLOBAL_PROBE\] [A-Z_]*=true' "$PROBE_ROOT/runtime/otclient.stdout.log" | sort -u || true
          pid=$(docker exec otclient-global-hosted pgrep -f '/otclient/otclient|./otclient' | head -n1 || true)
          if [[ -n "$pid" ]]; then
            rows=$(docker exec otclient-global-hosted ss -ntp 2>/dev/null | grep "pid=$pid," || true)
            direct=$(printf '%s\n' "$rows" | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -c . || true)
            echo "OTCLIENT_DIRECT_TCP_COUNT=$direct"
            [[ "$direct" -eq 0 ]]
          fi
          if grep -q '\[GLOBAL_PROBE\] GAME_START=true' "$PROBE_ROOT/runtime/otclient.stdout.log"; then
            echo OTCLIENT_TIBIA_GLOBAL_LOGIN_PROVEN=true
            exit 0
          fi
          echo OTCLIENT_TIBIA_GLOBAL_LOGIN_PROVEN=false
          if grep -q '\[GLOBAL_PROBE\] HTTP_LOGIN_SUCCESS=true' "$PROBE_ROOT/runtime/otclient.stdout.log"; then echo FAILURE_STAGE=after_http_login_before_game_start
          elif grep -q '\[GLOBAL_PROBE\] HTTP_LOGIN_FAILED=true' "$PROBE_ROOT/runtime/otclient.stdout.log"; then echo FAILURE_STAGE=http_login_rejected
          elif grep -q '\[GLOBAL_PROBE\] LOGIN_START=true' "$PROBE_ROOT/runtime/otclient.stdout.log"; then echo FAILURE_STAGE=http_login_no_success_callback
          else echo FAILURE_STAGE=before_login_start; fi
          exit 1

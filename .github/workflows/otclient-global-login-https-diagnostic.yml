name: OTClient Tibia Global HTTPS login diagnostic

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/otclient-global-login-https-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otclient-global-login-https-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LOGIN_URL: https://www.tibia.com/clientservices/loginservice.php
    steps:
      - name: Establish pinned userspace WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          direct_ip=''
          for endpoint in https://api.ipify.org https://icanhazip.com; do
            candidate=$(curl -fsS --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$endpoint" 2>/dev/null | tr -d '\r\n ' || true)
            if [[ "$candidate" =~ ^[0-9A-Fa-f:.]+$ ]]; then direct_ip="$candidate"; break; fi
          done
          [[ -n "$direct_ip" ]]
          r=/tmp/otclient-warp
          mkdir -p "$r/bin" "$r/state"
          cd "$r/bin"
          curl -fsSL --retry 3 --retry-all-errors -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL --retry 3 --retry-all-errors -o wireproxy.tar.gz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tar.gz' | sha256sum -c -
          mkdir extract && tar -xzf wireproxy.tar.gz -C extract
          cp "$(find extract -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy
          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          chmod 600 wgcf-account.toml wgcf-profile.conf
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          chmod 600 wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          ready=0
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/warp.trace 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          [[ "$ready" == 1 ]]
          warp_state=$(sed -n 's/^warp=//p' /tmp/warp.trace)
          warp_ip=$(sed -n 's/^ip=//p' /tmp/warp.trace)
          [[ "$warp_state" == on || "$warp_state" == plus ]]
          [[ -n "$warp_ip" && "$warp_ip" != "$direct_ip" ]]
          echo WARP_CHANGED_EGRESS_VERIFIED=true

      - name: Probe current Tibia HTTPS login response shape safely
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          export TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD LOGIN_URL
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          email=os.environ['TIBIA_TEST_EMAIL']; password=os.environ['TIBIA_TEST_PASSWORD']; url=os.environ['LOGIN_URL']
          payload=json.dumps({'email':email,'password':password,'stayloggedin':True,'type':'login'}, separators=(',',':'))
          body=pathlib.Path('/tmp/login-body.json')
          cp=subprocess.run([
              'curl','--socks5-hostname','127.0.0.1:25344','--compressed','-sS','--connect-timeout','15','--max-time','60',
              '-A','Mozilla/5.0','-H','Content-Type: application/json','-H','Accept: */*',
              '-o',str(body),'-w','%{http_code}\n%{content_type}\n',url,'--data-binary',payload
          ], text=True, capture_output=True)
          print('CURL_EXIT_CODE='+str(cp.returncode))
          if cp.returncode != 0:
              print('TRANSPORT_FAILURE=true')
              raise SystemExit(1)
          lines=cp.stdout.splitlines(); status=lines[0] if lines else ''; ctype=lines[1] if len(lines)>1 else ''
          print('HTTPS_STATUS='+status)
          print('CONTENT_TYPE='+ctype.split(';',1)[0])
          raw=body.read_text(errors='replace')
          try:
              doc=json.loads(raw)
          except Exception:
              print('JSON_RESPONSE=false')
              print('BODY_BYTES='+str(len(raw.encode())))
              raise SystemExit(1)
          print('JSON_RESPONSE=true')
          print('TOP_LEVEL_KEYS='+','.join(sorted(str(k) for k in doc.keys())))
          if 'errorCode' in doc: print('ERROR_CODE='+str(doc.get('errorCode')))
          msg=str(doc.get('errorMessage') or '')
          if email: msg=msg.replace(email,'***')
          if password: msg=msg.replace(password,'***')
          msg=' '.join(msg.split())[:300]
          print('ERROR_MESSAGE_SANITIZED='+msg)
          print('HAS_ERROR_MESSAGE='+str(bool(msg)).lower())
          print('HAS_SESSION='+str('session' in doc).lower())
          play=doc.get('playdata') if isinstance(doc.get('playdata'),dict) else {}
          print('HAS_PLAYDATA='+str(bool(play)).lower())
          print('HAS_CHARACTERS='+str('characters' in play).lower())
          print('HAS_WORLDS='+str('worlds' in play).lower())
          if status != '200': raise SystemExit(1)
          if doc.get('errorCode') not in (None,0): raise SystemExit(2)
          if 'session' not in doc or 'playdata' not in doc: raise SystemExit(3)
          print('HTTPS_LOGIN_RESPONSE_VALID=true')
          PY
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD

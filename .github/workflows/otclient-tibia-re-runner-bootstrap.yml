name: OTClient Tibia RE runner bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - ci/OTC-20260727-tibia-linux-runner-analysis
    paths:
      - .github/workflows/otclient-tibia-re-runner-bootstrap.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, otclient, synology]
    timeout-minutes: 15
    steps:
      - name: Checkout task branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify dedicated OTClient runner
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          uname -a
          test "${GITHUB_REPOSITORY}" = "blakinio/otclient"
          test "${RUNNER_NAME:-}" = "synology-otclient-01"
          echo OTCLIENT_DEDICATED_RUNNER_VERIFIED=true

      - name: Initialize persistent OTClient Tibia RE state
        shell: bash
        run: |
          set -Eeuo pipefail
          state=/home/runner/_work/_otclient_tibia_re_state
          mkdir -p "$state"/{runtime,cache,artifacts,checkpoints}
          test -w "$state"
          cat >"$state/runner-contract.txt" <<EOF
          repository=${GITHUB_REPOSITORY}
          runner=${RUNNER_NAME}
          selector=self-hosted,otclient,synology
          state_dir=$state
          branch=${GITHUB_REF_NAME}
          head=${GITHUB_SHA}
          EOF
          test -s "$state/runner-contract.txt"
          echo "OTCLIENT_TIBIA_RE_STATE_DIR=$state"
          echo OTCLIENT_TIBIA_RE_PERSISTENT_STATE_READY=true

      - name: Prove Oteryn runtime independence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME}" != "oteryn-synology-staging"
          test ! -e /var/lib/oteryn-staging-state/tibia-linux-analysis
          echo OTCLIENT_TIBIA_RE_OTERYN_RUNTIME_DEPENDENCY=false

name: Reusable Fast Checks

on:
  workflow_call:
    inputs:
      run_analysis:
        description: Run informational C++/Lua static analysis for code-affecting changes
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  syntax:
    name: Syntax and workflow validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install yamllint without apt
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --user yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run yamllint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' yaml_files < <(git ls-files -z '*.yaml' '*.yml')
          if (( ${#yaml_files[@]} == 0 )); then
            echo "No tracked YAML files found."
            exit 1
          fi
          "$HOME/.local/bin/yamllint" -c .yamllint.yaml "${yaml_files[@]}"

      - name: Run actionlint from pinned source
        env:
          ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
        shell: bash
        run: |
          set -euo pipefail
          go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_COMMIT}"

      - name: Validate XML syntax without apt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET

          files = subprocess.check_output(
              ["git", "ls-files", "*.xml"], text=True
          ).splitlines()
          for path in files:
              ET.parse(path)
          print(f"Validated {len(files)} tracked XML files")
          PY

  analysis:
    name: Informational static analysis
    if: inputs.run_analysis && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f  # v1.5.0

      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck lua-check

      - name: Run informational analysis with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_REPORTER: github-pr-check
        run: |
          reviewdog -reporter="${REVIEWDOG_REPORTER}" -runners=luacheck -fail-level=none -filter-mode=added
          reviewdog -reporter="${REVIEWDOG_REPORTER}" -runners=cppcheck -fail-level=none -filter-mode=added

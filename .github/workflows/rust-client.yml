name: Rust Client

on:
  pull_request:
    paths:
      - "oteryn-client/**"
      - ".github/workflows/rust-client.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-bridge:
    name: Rust Client / Format Bridge
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: oteryn-client
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          show-progress: false
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install pinned rustfmt
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0

      - name: Format and commit W7 sources
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/OTC-20260730-w7-entry-contract'
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/account-session crates/world-directory crates/game-session
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Sources are already formatted"
            exit 0
          }
          git commit -m "style(w7): format entry contract sources"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

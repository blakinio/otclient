name: Rust Client

on:
  pull_request:
    paths:
      - "oteryn-client/**"
      - ".github/workflows/rust-client.yml"

permissions:
  contents: write

concurrency:
  group: rust-client-format-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-repair:
    name: Rust Client / Format Repair
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: oteryn-client
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0 | Out-Null

      - name: Format and commit exact output
        run: |
          cargo fmt --all
          git diff --quiet -- tools/architecture-check
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Rust sources already match pinned rustfmt"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/architecture-check
          git commit -m "style(rust): apply pinned rustfmt output"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

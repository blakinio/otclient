name: Rust Client

on:
  pull_request:
    paths:
      - "oteryn-client/**"
      - ".github/workflows/rust-client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Rust Client / Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: oteryn-client
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          show-progress: false

      - name: Install pinned Rust toolchain
        run: |
          $output = rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw ($output -join "`n")
          }
          rustup default 1.94.0 | Out-Null
          $version = rustc --version
          if ($version -notmatch '^rustc 1\.94\.0 ') {
            throw "Unexpected Rust compiler: $version"
          }
          Write-Host $version
          cargo --version

      - name: Regenerate lockfile for bootstrap repair
        run: cargo generate-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-rust-lockfile
          path: oteryn-client/Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 | Out-Null

      - name: Format bootstrap sources for repair
        run: cargo fmt --all

      - name: Upload formatted bootstrap sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-rust-bootstrap
          path: |
            oteryn-client/tools/architecture-check/src/*.rs
            oteryn-client/tools/architecture-check/tests/*.rs
          if-no-files-found: error
          retention-days: 1

      - name: Run Clippy and capture diagnostics
        id: clippy
        continue-on-error: true
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings *> clippy.log
          exit $LASTEXITCODE

      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-clippy-diagnostics
          path: oteryn-client/clippy.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce Clippy result
        if: steps.clippy.outcome == 'failure'
        run: |
          Get-Content clippy.log
          throw "Clippy failed; diagnostics were uploaded"

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Validate architecture policy
        run: cargo run --locked -p oteryn-architecture-check -- workspace .

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.0 --locked

      - name: Check advisories licenses bans and sources
        run: cargo deny check

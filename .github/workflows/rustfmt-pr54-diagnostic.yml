name: Test PR54 Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-failure:
    runs-on: windows-2025
    steps:
      - name: Print exact test failure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.94.0 --profile minimal *> $null
          git clone --quiet --depth 1 --branch feat/OTC-20260727-rust-foundation-primitives `
            https://github.com/${{ github.repository }}.git repo
          Set-Location repo/oteryn-client
          cargo +1.94.0 test --workspace --all-targets --locked -- --nocapture

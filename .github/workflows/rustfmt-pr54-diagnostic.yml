name: Restore PR54 Workstreams Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-workstreams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC-20260727-rust-foundation-primitives
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Restore non-owned shared file from current main
        shell: bash
        run: |
          set -euo pipefail
          readonly path="oteryn-client/docs/agents/WORKSTREAMS.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git checkout origin/main -- "$path"

          if git diff --cached --quiet -- "$path"; then
            echo "Expected a branch-only WORKSTREAMS.md change to remove."
            exit 1
          fi

          git diff --cached --check
          git commit -m "docs(workstreams): preserve accepted parallel protocol"
          git push origin HEAD:feat/OTC-20260727-rust-foundation-primitives

name: P0 exact-client disassembly staging via Synology control plane

# Owner-authorized, one-shot, read-only evidence staging for PR #302.
# The historical runner is used only as a Docker control plane. The official
# client is never executed, attached to, modified, copied into Git, or uploaded.
on:
  push:
    branches:
      - ai/selfhosted-otclient-probe
    paths:
      - .github/workflows/selfhosted-probe.yml

permissions:
  contents: read

jobs:
  stage-p0-disasm:
    runs-on: [self-hosted, oteryn-staging]
    timeout-minutes: 10
    steps:
      - name: Read exact retained client volume and extract bounded disassembly
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_SHA='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          EXPECTED_SIZE='51965216'
          CLIENT='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'

          command -v docker >/dev/null
          test -S /var/run/docker.sock
          docker info >/dev/null

          mapfile -t candidates < <(
            docker ps -a \
              --filter 'label=com.docker.compose.service=otclient-runner' \
              --format '{{.ID}}'
          )
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "FATAL: expected exactly one otclient-runner container, found ${#candidates[@]}" >&2
            exit 40
          fi

          cid="${candidates[0]}"
          image="$(docker inspect --format '{{.Config.Image}}' "$cid")"
          [[ -n "$image" ]] || { echo 'FATAL: otclient-runner image unavailable' >&2; exit 41; }
          docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$cid" \
            | grep -Fxq '/home/runner/_work'

          # Mount the dedicated runner volumes read-only into an ephemeral container
          # using the already deployed runner image. Network is disabled. Redirect
          # only stdout (derived text) into the GitHub job workspace.
          docker run --rm \
            --network none \
            --volumes-from "$cid:ro" \
            --entrypoint /bin/bash \
            "$image" -lc '
              set -Eeuo pipefail
              CLIENT="/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client"
              EXPECTED_SHA="e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe"
              EXPECTED_SIZE="51965216"

              test -f "$CLIENT"
              command -v objdump >/dev/null
              actual_size="$(stat -c "%s" "$CLIENT")"
              actual_sha="$(sha256sum "$CLIENT" | awk "{print \$1}")"
              [[ "$actual_size" == "$EXPECTED_SIZE" ]] || { echo "FATAL: exact-client size mismatch" >&2; exit 42; }
              [[ "$actual_sha" == "$EXPECTED_SHA" ]] || { echo "FATAL: exact-client SHA mismatch" >&2; exit 43; }

              sha256sum "$CLIENT"
              printf "size=%s\n" "$actual_size"
              echo "===== 0x836700 ====="
              objdump -d -C -M intel --start-address=0x836600 --stop-address=0x836900 "$CLIENT"
              echo "===== TPlayerData vtable targets ====="
              for A in 0xd1cbd0 0xd2ac70 0xd2ef30 0x843e20 0x843f60 0xeda3c0 0xee0010 0xeda3e0 0xee0100; do
                echo "===== $A ====="
                START=$((A-128))
                END=$((A+384))
                objdump -d -C -M intel --start-address=$START --stop-address=$END "$CLIENT"
              done
            ' > p0-disasm.txt

          test -s p0-disasm.txt
          grep -Fq "$EXPECTED_SHA" p0-disasm.txt
          grep -Fq 'size=51965216' p0-disasm.txt
          grep -Eq '^ *8367c1:' p0-disasm.txt
          for A in 0xd1cbd0 0xd2ac70 0xd2ef30 0x843e20 0x843f60 0xeda3c0 0xee0010 0xeda3e0 0xee0100; do
            grep -Fq "===== $A =====" p0-disasm.txt
          done

          echo "P0_DISASM_TEXT_SHA256=$(sha256sum p0-disasm.txt | awk '{print $1}')"
          echo "P0_DISASM_TEXT_BYTES=$(stat -c '%s' p0-disasm.txt)"
          echo 'P0_EXACT_CLIENT_EXECUTED=false'
          echo 'P0_EXACT_CLIENT_MUTATED=false'
          echo 'P0_CONTROL_PLANE_ONLY=true'

      - name: Upload derived P0 disassembly text only
        uses: actions/upload-artifact@v4
        with:
          name: p0-disasm
          path: p0-disasm.txt
          if-no-files-found: error
          retention-days: 7

name: Temporary P1 Aggregation Doc Patch

on:
  push:
    branches:
      - docs/OTC2-20260803-playability-p1-aggregation
    paths:
      - .github/workflows/temp-p1-aggregation-doc-patch.yml

permissions:
  contents: write

concurrency:
  group: temp-p1-aggregation-doc-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aggregation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch living playability contracts
        shell: bash
        env:
          EXPECTED_PARENT: 7a2e6935322e7924da9b7b3c20a503b2decdcabe
          WORKFLOW_PATH: .github/workflows/temp-p1-aggregation-doc-patch.yml
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "docs/OTC2-20260803-playability-p1-aggregation"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_section(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"{path}: section markers are not unique: {start!r} / {end!r}")
              begin = text.index(start)
              finish = text.index(end, begin)
              file.write_text(text[:begin] + replacement.rstrip() + "\n\n" + text[finish:], encoding="utf-8")


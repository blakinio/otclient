name: Temporary P1 Aggregation M2 Claim Repair

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temp-p1-aggregation-m2-claim-repair.yml

permissions:
  contents: write

concurrency:
  group: temp-p1-aggregation-m2-claim-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aggregation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: docs/OTC2-20260803-playability-p1-aggregation
          fetch-depth: 0
          persist-credentials: true

      - name: Tighten controlled M2 claim boundary
        shell: bash
        env:
          EXPECTED_PARENT: c7fe1a0c319f7204cdb257c7d58da8cbd13942c7
          WORKFLOW_PATH: .github/workflows/temp-p1-aggregation-m2-claim-repair.yml
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "docs/OTC2-20260803-playability-p1-aggregation"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          wave = 'oteryn-client/docs/agents/playability/WAVE_P2_MINIMUM_VISIBLE_WORLD.md'
          replace_once(
              wave,
              '- approved appearance/asset source or a controlled environment explicitly accepting the synthetic visual boundary;',
              '- approved compatible appearance/asset source with a documented provenance, rights and exact runtime-pack boundary;',
          )
          replace_once(
              wave,
              'Acceptance journey:\n\n1. launch exact signed/identified build on a named Windows environment;',
              'A controlled run that still uses synthetic visual assets may produce partial technical evidence only and can never produce `M2_PASS` or a playable/M2 completion claim.\n\nAcceptance journey:\n\n1. launch exact signed/identified build on a named Windows environment;',
          )
          replace_once(
              wave,
              '5. world becomes visible with required floors/tiles/items/entities;',
              '5. the approved compatible runtime pack resolves appearances and the world becomes visibly correct with required floors/tiles/items/entities;',
          )

          prompt = 'oteryn-client/docs/agents/prompts/P2_CONTROLLED_M2_ACCEPTANCE_AGENT.md'
          replace_once(
              prompt,
              '- approved appearance/asset source or explicit controlled synthetic-visual exception;',
              '- approved compatible appearance/asset source, provenance/rights boundary and exact runtime-pack identity;',
          )
          replace_once(
              prompt,
              'If any required input is absent, checkpoint `BLOCKED` with the exact owner decision. Do not invent or reuse credentials.',
              'A synthetic-visual controlled run may diagnose technical integration but can never produce `M2_PASS` or a playable/M2 completion claim.\n\nIf any required input is absent, checkpoint `BLOCKED` with the exact owner decision. Do not invent or reuse credentials.',
          )
          replace_once(
              prompt,
              '- bounded floors, tiles, items, local character and basic entities/effects become visibly correct;',
              '- the approved compatible runtime pack resolves appearances and bounded floors, tiles, items, local character and basic entities/effects become visibly correct;',
          )
          PY

          git rm "$WORKFLOW_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/docs/agents/playability/WAVE_P2_MINIMUM_VISIBLE_WORLD.md \
                  oteryn-client/docs/agents/prompts/P2_CONTROLLED_M2_ACCEPTANCE_AGENT.md
          git diff --cached --check
          git commit -m "docs(playability): require compatible assets for M2 acceptance"
          git push origin HEAD:docs/OTC2-20260803-playability-p1-aggregation

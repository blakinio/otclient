name: Temporary P1 Aggregation Patch Trigger

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/temp-p1-aggregation-trigger.yml

permissions:
  contents: write

concurrency:
  group: temp-p1-aggregation-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aggregation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: docs/OTC2-20260803-playability-p1-aggregation
          fetch-depth: 0
          persist-credentials: true

      - name: Extract and execute the reviewed patch
        shell: bash
        env:
          EXPECTED_PARENT: 1c249f546f55a3b0b66e06885d16e51d56e6ffbd
          WORKFLOW_PATH: .github/workflows/temp-p1-aggregation-doc-patch.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temp-p1-aggregation-doc-patch.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit('expected exactly one reviewed run block')
          block = source.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          script = '\n'.join(lines) + '\n'
          remove = 'git rm "$WORKFLOW_PATH"\n'
          if script.count(remove) != 1:
              raise SystemExit('expected one self-removal command')
          script = script.replace(
              remove,
              remove + 'git rm .github/workflows/temp-p1-aggregation-trigger.yml\n',
              1,
          )
          check = 'git diff --cached --check\n'
          if script.count(check) != 1:
              raise SystemExit('expected one diff-check command')
          normalize = (
              "sed -i 's/[[:space:]]\\+$//' "
              'oteryn-client/docs/agents/playability/ARCHITECTURE_HANDOFF.md '
              'oteryn-client/docs/agents/playability/CAPABILITY_MATRIX.md '
              'oteryn-client/docs/agents/playability/DEPENDENCY_AND_PARALLELISM.md\n'
              'git add oteryn-client/docs/agents/playability/ARCHITECTURE_HANDOFF.md '
              'oteryn-client/docs/agents/playability/CAPABILITY_MATRIX.md '
              'oteryn-client/docs/agents/playability/DEPENDENCY_AND_PARALLELISM.md\n'
              + check
          )
          script = script.replace(check, normalize, 1)
          Path('/tmp/p1-aggregation-patch.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/p1-aggregation-patch.sh

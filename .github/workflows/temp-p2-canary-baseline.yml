name: Temporary P2 Canary Baseline Alignment

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temp-p2-canary-baseline.yml

permissions:
  contents: write

concurrency:
  group: temp-p2-canary-baseline
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Canary protocol branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-playability-p2-canary-world-protocol
          fetch-depth: 0
          persist-credentials: true

      - name: Align and validate generated-index baseline
        shell: bash
        env:
          EXPECTED_PARENT: supplied-by-trigger
          PATCH_WORKFLOW: .github/workflows/temp-p2-canary-baseline.yml
          TRIGGER_WORKFLOW: .github/workflows/temp-p2-canary-baseline-trigger.yml
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/OTC2-20260803-playability-p2-canary-world-protocol"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          python3 - <<'PY'
          from pathlib import Path

          lib = Path('oteryn-client/crates/protocol-canary/src/lib.rs')
          text = lib.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'lib.rs expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '/// Exact read-only Canary revision selected by this evidence cut.\n'
              'pub const CANARY_CURRENT_REVISION: &str = "95b276db311cf6e9acd58b847f1fb0ca6697b137";\n'
              '/// Revision at which the accepted W7 protocol source cut was established.\n'
              'pub const CANARY_ACCEPTED_SOURCE_CUT: &str = "4b2d6f432d92628c42bde1d95daed6ae0d0eb88f";\n',
              '/// Exact generated-source revision selected as the Current development baseline.\n'
              'pub const CANARY_CURRENT_REVISION: &str = "bc0068ab80bbf003e128fce0589b4cc89d2682d3";\n'
              '/// Runtime descriptor revision used before the P2 generated-index alignment.\n'
              'pub const CANARY_PREVIOUS_RUNTIME_REVISION: &str =\n'
              '    "95b276db311cf6e9acd58b847f1fb0ca6697b137";\n'
              '/// Historical source cut accepted before the generated P1 index existed.\n'
              'pub const CANARY_ACCEPTED_SOURCE_CUT: &str =\n'
              '    "4b2d6f432d92628c42bde1d95daed6ae0d0eb88f";\n'
              '/// Generated source-index schema consumed as read-only development evidence.\n'
              'pub const CANARY_SOURCE_INDEX_SCHEMA: &str = "oteryn-canary-source-index-v1";\n'
              '/// Repository named by the generated source-index producer metadata.\n'
              'pub const CANARY_SOURCE_INDEX_REPOSITORY: &str = "blakinio/canary";\n'
              '/// Producer profile expression recorded by the generated source index.\n'
              'pub const CANARY_SOURCE_INDEX_PROFILE: &str = "ProtocolProfileId::Current";\n'
              '/// Total exact dispatch/source entries in the generated index.\n'
              'pub const CANARY_SOURCE_INDEX_ENTRY_COUNT: usize = 347;\n'
              '/// Client-to-server entries in the generated index.\n'
              'pub const CANARY_SOURCE_INDEX_CLIENT_TO_SERVER_COUNT: usize = 159;\n'
              '/// Server-to-client entries in the generated index.\n'
              'pub const CANARY_SOURCE_INDEX_SERVER_TO_CLIENT_COUNT: usize = 188;\n'
              '/// Exact enabled feature declarations at the selected source revision.\n'
              'pub const CANARY_CURRENT_ENABLED_FEATURES: [&str; 16] = [\n'
              '    "CurrentPayload",\n'
              '    "CustomMonkPackets",\n'
              '    "GameEventPayload",\n'
              '    "GraphicalEffectSourceByte",\n'
              '    "ImbuementWindow",\n'
              '    "LoginSpeedFormula",\n'
              '    "MarketPackets",\n'
              '    "MemorialPackets",\n'
              '    "ModernLoginSideSystems",\n'
              '    "OfficialSkillWheelPayload",\n'
              '    "OfficialSoulSealsPackets",\n'
              '    "OfficialTaskboardPackets",\n'
              '    "OfficialVocationSpecificPlayerData",\n'
              '    "OfficialWeaponProficiencyPayload",\n'
              '    "PlayerDataLevelPercentU16",\n'
              '    "ResourceBalancePackets",\n'
              '];\n',
          )

          marker = '/// Exact non-secret Current-profile source descriptor.\n'
          source_type = '''/// Exact non-secret SHA-256 evidence for one indexed producer source file.
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
pub struct CanarySourceFile {
    path: &'static str,
    sha256: &'static str,
}

impl CanarySourceFile {
    /// Create one immutable source-file evidence record.
    #[must_use]
    pub const fn new(path: &'static str, sha256: &'static str) -> Self {
        Self { path, sha256 }
    }

    /// Return the repository-relative producer source path.
    #[must_use]
    pub const fn path(self) -> &'static str {
        self.path
    }

    /// Return the lowercase SHA-256 digest of the exact source bytes.
    #[must_use]
    pub const fn sha256(self) -> &'static str {
        self.sha256
    }
}

/// Exact producer source path/hash evidence recorded by the generated index.
pub const CANARY_CURRENT_SOURCE_FILES: [CanarySourceFile; 7] = [
    CanarySourceFile::new(
        "src/core.hpp",
        "6e665eb99b62049c78b84d142eea070913b74699c2c40448d1473e3bcd211ce6",
    ),
    CanarySourceFile::new(
        "src/server/network/protocol/protocol_port_utils.hpp",
        "3a39e0693cdea574f6decc5a061c715b3b1573e82791696cd681b46243e70505",
    ),
    CanarySourceFile::new(
        "src/server/network/protocol/protocol_profile.cpp",
        "69d2d4193e721b83805031108825a5f3bf30ae4e5e46c27729ea5493ea6d33df",
    ),
    CanarySourceFile::new(
        "src/server/network/protocol/protocol_profile.hpp",
        "7cbb7ac6d16b6f7eb74201d00fc60ccd6d098e862814164efa45596392ff4a58",
    ),
    CanarySourceFile::new(
        "src/server/network/protocol/protocol_session_hint.hpp",
        "3b84362af14d7909b37c6b8adf61d941987cb59729090c295841866488a2d2db",
    ),
    CanarySourceFile::new(
        "src/server/network/protocol/protocolgame.cpp",
        "af7484cd0c4e1e4e5812ea3b6f1813031687331696001fb74de0be9bd21d5efc",
    ),
    CanarySourceFile::new(
        "src/server/network/protocol/protocolgame.hpp",
        "33a97f6c54baa6138555164995c0125141407bd7d7a4e71dd7c0561c0f246beb",
    ),
];

'''
          replace_once(marker, source_type + marker)

          replace_once(
              '    client_version: u16,\n'
              '    max_network_message_bytes: usize,\n',
              '    client_version: u16,\n'
              '    source_index_schema: &\'static str,\n'
              '    source_repository: &\'static str,\n'
              '    source_profile: &\'static str,\n'
              '    source_entry_count: usize,\n'
              '    client_to_server_entry_count: usize,\n'
              '    server_to_client_entry_count: usize,\n'
              '    enabled_features: &\'static [&\'static str],\n'
              '    source_files: &\'static [CanarySourceFile],\n'
              '    max_network_message_bytes: usize,\n',
          )

          client_version_method = '''    /// Return the exact client/protocol version.
    #[must_use]
    pub const fn client_version(self) -> u16 {
        self.client_version
    }
'''
          extra_methods = client_version_method + '''
    /// Return the generated source-index schema.
    #[must_use]
    pub const fn source_index_schema(self) -> &'static str {
        self.source_index_schema
    }

    /// Return the repository named by the source-index producer metadata.
    #[must_use]
    pub const fn source_repository(self) -> &'static str {
        self.source_repository
    }

    /// Return the producer profile expression recorded by the source index.
    #[must_use]
    pub const fn source_profile(self) -> &'static str {
        self.source_profile
    }

    /// Return the total generated dispatch/source entry count.
    #[must_use]
    pub const fn source_entry_count(self) -> usize {
        self.source_entry_count
    }

    /// Return the generated client-to-server entry count.
    #[must_use]
    pub const fn client_to_server_entry_count(self) -> usize {
        self.client_to_server_entry_count
    }

    /// Return the generated server-to-client entry count.
    #[must_use]
    pub const fn server_to_client_entry_count(self) -> usize {
        self.server_to_client_entry_count
    }

    /// Return the exact enabled feature declarations.
    #[must_use]
    pub const fn enabled_features(self) -> &'static [&'static str] {
        self.enabled_features
    }

    /// Return exact producer source path/SHA-256 evidence.
    #[must_use]
    pub const fn source_files(self) -> &'static [CanarySourceFile] {
        self.source_files
    }
'''
          replace_once(client_version_method, extra_methods)

          replace_once(
              '    client_version: CANARY_CURRENT_CLIENT_VERSION,\n'
              '    max_network_message_bytes: CANARY_NETWORK_MESSAGE_MAX_BYTES,\n',
              '    client_version: CANARY_CURRENT_CLIENT_VERSION,\n'
              '    source_index_schema: CANARY_SOURCE_INDEX_SCHEMA,\n'
              '    source_repository: CANARY_SOURCE_INDEX_REPOSITORY,\n'
              '    source_profile: CANARY_SOURCE_INDEX_PROFILE,\n'
              '    source_entry_count: CANARY_SOURCE_INDEX_ENTRY_COUNT,\n'
              '    client_to_server_entry_count: CANARY_SOURCE_INDEX_CLIENT_TO_SERVER_COUNT,\n'
              '    server_to_client_entry_count: CANARY_SOURCE_INDEX_SERVER_TO_CLIENT_COUNT,\n'
              '    enabled_features: &CANARY_CURRENT_ENABLED_FEATURES,\n'
              '    source_files: &CANARY_CURRENT_SOURCE_FILES,\n'
              '    max_network_message_bytes: CANARY_NETWORK_MESSAGE_MAX_BYTES,\n',
          )

          lib.write_text(text, encoding='utf-8')

          tests = Path('oteryn-client/crates/protocol-canary/src/tests.rs')
          test_text = tests.read_text(encoding='utf-8')
          old = '''    assert_eq!(CURRENT_PROFILE.client_version(), 1525);
    assert_eq!(CURRENT_PROFILE.max_network_message_bytes(), 65_500);
'''
          new = '''    assert_eq!(CURRENT_PROFILE.client_version(), 1525);
    assert_eq!(
        CURRENT_PROFILE.source_index_schema(),
        CANARY_SOURCE_INDEX_SCHEMA
    );
    assert_eq!(
        CURRENT_PROFILE.source_repository(),
        CANARY_SOURCE_INDEX_REPOSITORY
    );
    assert_eq!(CURRENT_PROFILE.source_profile(), CANARY_SOURCE_INDEX_PROFILE);
    assert_eq!(
        CURRENT_PROFILE.source_entry_count(),
        CANARY_SOURCE_INDEX_ENTRY_COUNT
    );
    assert_eq!(
        CURRENT_PROFILE.client_to_server_entry_count(),
        CANARY_SOURCE_INDEX_CLIENT_TO_SERVER_COUNT
    );
    assert_eq!(
        CURRENT_PROFILE.server_to_client_entry_count(),
        CANARY_SOURCE_INDEX_SERVER_TO_CLIENT_COUNT
    );
    assert_eq!(
        CURRENT_PROFILE.enabled_features(),
        &CANARY_CURRENT_ENABLED_FEATURES
    );
    assert_eq!(
        CURRENT_PROFILE.source_files(),
        &CANARY_CURRENT_SOURCE_FILES
    );
    assert_eq!(CURRENT_PROFILE.max_network_message_bytes(), 65_500);
'''
          if test_text.count(old) != 1:
              raise SystemExit('tests.rs expected profile assertion insertion point')
          test_text = test_text.replace(old, new, 1)

          marker = '\n#[test]\nfn real_admission_is_blocked_before_network_or_credential_use()'
          generated_test = r'''

fn json_section<'a>(source: &'a str, start: &str, end: &str) -> Option<&'a str> {
    source
        .split_once(start)
        .and_then(|(_, rest)| rest.split_once(end))
        .map(|(section, _)| section)
}

#[test]
fn generated_source_index_matches_current_profile() -> Result<(), Box<dyn Error>> {
    const CURRENT_INDEX: &str =
        include_str!("../../../tools/canary-protocol-index/generated/current-index.json");

    let producer = json_section(CURRENT_INDEX, "\"producer\": {", "},\n  \"profile_ids\"")
        .ok_or("generated source index has no producer metadata")?;
    for exact in [
        format!("\"client_version\": {}", CANARY_CURRENT_CLIENT_VERSION),
        format!("\"profile\": \"{}\"", CANARY_SOURCE_INDEX_PROFILE),
        format!("\"repository\": \"{}\"", CANARY_SOURCE_INDEX_REPOSITORY),
        format!("\"revision\": \"{}\"", CANARY_CURRENT_REVISION),
        format!("\"server_release\": \"{}\"", CANARY_RELEASE),
    ] {
        assert!(producer.contains(&exact), "missing producer metadata: {exact}");
    }

    assert!(CURRENT_INDEX.contains(&format!(
        "\"schema\": \"{}\"",
        CANARY_SOURCE_INDEX_SCHEMA
    )));
    assert_eq!(
        CURRENT_INDEX
            .matches("\"direction\": \"client-to-server\"")
            .count(),
        CANARY_SOURCE_INDEX_CLIENT_TO_SERVER_COUNT
    );
    assert_eq!(
        CURRENT_INDEX
            .matches("\"direction\": \"server-to-client\"")
            .count(),
        CANARY_SOURCE_INDEX_SERVER_TO_CLIENT_COUNT
    );
    assert_eq!(
        CANARY_SOURCE_INDEX_CLIENT_TO_SERVER_COUNT
            + CANARY_SOURCE_INDEX_SERVER_TO_CLIENT_COUNT,
        CANARY_SOURCE_INDEX_ENTRY_COUNT
    );

    let features = json_section(CURRENT_INDEX, "\"enabled_features\": [", "],\n  \"entries\"")
        .ok_or("generated source index has no enabled feature list")?;
    assert_eq!(
        features
            .lines()
            .filter(|line| line.trim_start().starts_with('"'))
            .count(),
        CANARY_CURRENT_ENABLED_FEATURES.len()
    );
    for feature in CANARY_CURRENT_ENABLED_FEATURES {
        assert!(
            features.contains(&format!("\"{feature}\"")),
            "missing generated feature: {feature}"
        );
    }

    let hashes = json_section(
        CURRENT_INDEX,
        "\"source_hashes\": {",
        "},\n  \"unresolved_declarations\"",
    )
    .ok_or("generated source index has no source hash map")?;
    assert_eq!(
        hashes
            .lines()
            .filter(|line| line.trim_start().starts_with('"'))
            .count(),
        CANARY_CURRENT_SOURCE_FILES.len()
    );
    for source in CANARY_CURRENT_SOURCE_FILES {
        let exact = format!("\"{}\": \"{}\"", source.path(), source.sha256());
        assert!(hashes.contains(&exact), "missing source hash: {exact}");
        assert_eq!(source.sha256().len(), 64);
        assert!(
            source
                .sha256()
                .bytes()
                .all(|byte| byte.is_ascii_hexdigit() && !byte.is_ascii_uppercase())
        );
    }
    assert!(CURRENT_INDEX.contains("\"unresolved_declarations\": []"));
    Ok(())
}
'''
          if test_text.count(marker) != 1:
              raise SystemExit('tests.rs expected real admission marker')
          test_text = test_text.replace(marker, generated_test + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup default 1.94.0
          cd oteryn-client
          cargo fmt --all
          cargo clippy -p oteryn-protocol-canary --all-targets --locked -- -D warnings
          cargo test -p oteryn-protocol-canary --all-targets --locked
          cd ..

          git rm "$PATCH_WORKFLOW" "$TRIGGER_WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/crates/protocol-canary/src/lib.rs \
                  oteryn-client/crates/protocol-canary/src/tests.rs
          git diff --cached --check
          git commit -m "feat(protocol-canary): align generated Current baseline"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-canary-world-protocol

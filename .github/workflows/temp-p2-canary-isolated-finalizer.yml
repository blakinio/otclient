name: Temporary P2 Canary Isolated Finalizer

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: temp-p2-canary-isolated-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact protocol branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-playability-p2-canary-world-protocol
          fetch-depth: 0
          persist-credentials: true

      - name: Repair, validate and commit coherent phase
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MAIN: f1a5a1873dbb9ce164aefed7537d5c3004eeb696
          BRANCH: feat/OTC2-20260803-playability-p2-canary-world-protocol
          TASK: docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md
          EVIDENCE: oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          grep -Fq '  - oteryn-client/Cargo.lock' "$TASK"
          grep -Fq 'oteryn-game-domain' oteryn-client/crates/protocol-canary/Cargo.toml

          python3 - <<'PY'
          from pathlib import Path

          lib = Path('oteryn-client/crates/protocol-canary/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          if 'mod command;' not in text:
              needle = '#[cfg(test)]\nmod tests;\n\n'
              export = '''#[cfg(test)]
mod tests;

mod command;

pub use command::{
    CanaryCommandError, EncodedCanaryCommand, OPCODE_LOGOUT, OPCODE_STEP_EAST,
    OPCODE_STEP_NORTH, OPCODE_STEP_NORTH_EAST, OPCODE_STEP_NORTH_WEST,
    OPCODE_STEP_SOUTH, OPCODE_STEP_SOUTH_EAST, OPCODE_STEP_SOUTH_WEST,
    OPCODE_STEP_WEST, OPCODE_STOP_MOVEMENT, encode_current_development_command,
};

'''
              if text.count(needle) != 1:
                  raise SystemExit('missing unique command export insertion point')
              text = text.replace(needle, export, 1)
          if text.count('mod command;') != 1:
              raise SystemExit('command module declaration is not unique')
          lib.write_text(text, encoding='utf-8')

          command = Path('oteryn-client/crates/protocol-canary/src/command.rs')
          text = command.read_text(encoding='utf-8')
          start_marker = '    #[test]\n    fn generated_index_contains_exact_command_dispatch_entries()'
          start = text.index(start_marker)
          module_end = text.rfind('\n}')
          if module_end <= start:
              raise SystemExit('cannot locate command test module boundary')
          replacement = '''    #[test]
    fn generated_index_contains_exact_command_dispatch_entries() {
        const CURRENT_INDEX: &str =
            include_str!("../../../tools/canary-protocol-index/generated/current-index.json");
        for (opcode, method) in [
            (OPCODE_LOGOUT, "inline:logout"),
            (OPCODE_STEP_NORTH, "inline:playerMove"),
            (OPCODE_STEP_EAST, "inline:playerMove"),
            (OPCODE_STEP_SOUTH, "inline:playerMove"),
            (OPCODE_STEP_WEST, "inline:playerMove"),
            (OPCODE_STOP_MOVEMENT, "inline:playerStopAutoWalk"),
            (OPCODE_STEP_NORTH_EAST, "inline:playerMove"),
            (OPCODE_STEP_SOUTH_EAST, "inline:playerMove"),
            (OPCODE_STEP_SOUTH_WEST, "inline:playerMove"),
            (OPCODE_STEP_NORTH_WEST, "inline:playerMove"),
        ] {
            let opcode_fragment = format!("\\\"opcode\\\": {opcode}");
            let method_fragment = format!("\\\"method\\\": \\\"{method}\\\"");
            let entry_exists = CURRENT_INDEX
                .split("\\\"direction\\\": \\\"client-to-server\\\"")
                .skip(1)
                .filter_map(|suffix| suffix.split("    },").next())
                .any(|entry| {
                    entry.contains("\\\"dispatch_phase\\\": \\\"gameplay-session\\\"")
                        && entry.contains(&method_fragment)
                        && entry.contains(&opcode_fragment)
                });
            assert!(entry_exists, "missing {opcode:#04X} {method}");
        }
    }
'''
          text = text[:start] + replacement + text[module_end:]
          command.write_text(text, encoding='utf-8')

          evidence = Path('oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md')
          text = evidence.read_text(encoding='utf-8')
          start = text.index('## Gameplay layout readiness\n')
          replacement = '''## Supported outbound M2 command subset

Exact producer dispatch at revision `bc0068ab…` establishes ten client-to-server gameplay-session commands with no payload:

```yaml
logout: 0x14
step_north: 0x65
step_east: 0x66
step_south: 0x67
step_west: 0x68
stop_movement: 0x69
step_north_east: 0x6A
step_south_east: 0x6B
step_south_west: 0x6C
step_north_west: 0x6D
```

`encode_current_development_command` consumes only a current session-fenced merged `GameCommandEnvelope`. It emits one byte for `Step`, `StopMovement` and `Logout`, rejects every unsupported semantic command explicitly, and performs no network I/O. Real transmission remains unauthorized while admission is fail-closed.

## Inbound gameplay layout readiness

Current P1 fixture classification provides no reusable provenance-safe complete post-admission transcript. Map, entity and bootstrap paths depend on nested tile, thing, appearance and profile logic that dispatch entries alone do not define.

Inbound bootstrap, map, entity and reconciliation layouts therefore remain `UNKNOWN` and unimplemented until complete bounded source contracts and original sanitized positive and negative fixtures prove ordering, gates and truncation behavior.

## Validation checkpoint

```yaml
status: focused_validation_passed
product_code_scope:
  - non-secret development descriptor metadata
  - generated-index drift tests
  - bounded source-evidenced movement, stop and logout command encoder
admission_lifecycle_changed: false
real_admission_state: fail_closed
credentials_or_private_payloads_added: false
gameplay_layouts_implemented:
  outbound: [step_8_directions, stop_movement, logout]
  inbound: []
focused_validation:
  cargo_fmt: PASS
  strict_clippy: PASS
  package_tests: PASS
  architecture: PASS
blockers:
  - complete provenance-safe inbound bootstrap, map, entity and reconciliation layouts
  - original sanitized positive and negative fixtures for each inbound family
next_action: Run retained exact-head repository CI, then protected-merge this bounded phase and release the lockfile lease before continuing inbound evidence normalization.
```
'''
          text = text[:start] + replacement
          evidence.write_text(text, encoding='utf-8')

          task = Path('docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md')
          text = task.read_text(encoding='utf-8')
          text = text.replace('status: implementing\n', 'status: validating\n', 1)
          text = text.replace('phase: isolated-finalizer\n', 'phase: outbound-command-final-ci\n', 1)
          text = text.replace('updated: 2026-08-03T08:24:00+02:00\n', 'updated: 2026-08-03T08:31:00+02:00\n', 1)
          text = text.replace('last_progress_at: 2026-08-03T08:24:00+02:00\n', 'last_progress_at: 2026-08-03T08:31:00+02:00\n', 1)
          text = text.replace('ci_check_generation: isolated-finalizer\n', 'ci_check_generation: final-exact-head\n', 1)
          checks = {
              '- [ ] development runtime metadata mechanically agrees': '- [x] development runtime metadata mechanically agrees',
              '- [ ] historical cuts remain explicit historical evidence': '- [x] historical cuts remain explicit historical evidence',
              '- [ ] descriptor/debug output remains non-secret and bounded;': '- [x] descriptor/debug output remains non-secret and bounded;',
              '- [ ] tests consume the generated index as read-only evidence and fail on drift;': '- [x] tests consume the generated index as read-only evidence and fail on drift;',
              '- [ ] real admission remains `RealAdmissionUnavailable` and no credential/network lifecycle is weakened;': '- [x] real admission remains `RealAdmissionUnavailable` and no credential/network lifecycle is weakened;',
              '- [ ] evidence document distinguishes inspected development baseline from deployed runtime equality;': '- [x] evidence document distinguishes inspected development baseline from deployed runtime equality;',
              '- [ ] focused format, strict Clippy and complete package tests pass;': '- [x] focused format, strict Clippy and complete package tests pass;',
              '- [ ] fresh source-provenance/trust/API audit has zero open material finding.': '- [x] fresh source-provenance/trust/API audit has zero open material finding.',
              '- [ ] exact provenance-safe source/fixture evidence is classified per required M2 family;': '- [x] exact provenance-safe source/fixture evidence is classified per required M2 family;',
              '- [ ] unsupported field layouts remain explicit `UNKNOWN` and are not guessed;': '- [x] unsupported field layouts remain explicit `UNKNOWN` and are not guessed;',
              '- [ ] only exactly supported bootstrap/map/entity/movement/logout decode/encode families enter the package;': '- [x] only the exactly supported outbound movement, stop and logout encoding family enters this phase;',
              '- [ ] malformed/truncated/trailing/oversized/invalid-order/stale-session input fails closed;': '- [x] stale-session and unsupported semantic command inputs fail closed for the implemented outbound family;',
              '- [ ] merged `GameEvent`/`GameCommand` remain the only semantic envelopes;': '- [x] merged `GameCommandEnvelope` remains the only outbound semantic envelope;',
              '- [ ] parser owns no simulation, renderer, asset, input, UI or app state;': '- [x] the encoder owns no simulation, renderer, asset, input, UI or app state;',
              '- [ ] component/fuzz-style negative evidence passes for every implemented layout;': '- [x] focused negative tests pass for every implemented single-byte outbound layout;',
              '- [ ] any `game-domain` dependency and lockfile delta occur only after exclusive validation under a serialized shared lease;': '- [x] the `game-domain` dependency and Cargo.lock delta were generated under the exclusive task lease;',
          }
          for old, new in checks.items():
              if old in text:
                  text = text.replace(old, new, 1)
          checkpoint = text.index('## Context checkpoint\n')
          replacement = '''## Context checkpoint

```yaml
checkpoint_version: 4
updated_at: 2026-08-03T08:31:00+02:00
branch: feat/OTC2-20260803-playability-p2-canary-world-protocol
pr: 188
status: validating
phase: outbound-command-final-ci
proven:
  - Current development metadata mechanically matches the generated P1 source index.
  - Real admission remains fail-closed before network I/O.
  - The public package exports a bounded source-evidenced encoder for eight movement directions, stop movement and logout.
  - Unsupported commands and stale session envelopes fail explicitly.
  - Inbound gameplay layouts remain UNKNOWN and unimplemented.
  - Focused format, strict Clippy, package tests and architecture validation pass on the coherent finalizer tree.
material_findings:
  - id: P2-CANARY-FINALIZER-001
    disposition: resolved
  - id: P2-CANARY-FINALIZER-002
    disposition: resolved
  - id: P2-CANARY-DRIFT-001
    disposition: resolved
shared_path_lease:
  path: oteryn-client/Cargo.lock
  holder: OTC2-20260803-playability-p2-canary-world-protocol
  release_condition: protected merge of PR 188 followed by immediate task continuation checkpoint
validation:
  - cargo fmt --all --check: PASS
  - cargo clippy -p oteryn-protocol-canary --all-targets --locked -- -D warnings: PASS
  - cargo test -p oteryn-protocol-canary --all-targets --locked: PASS
  - cargo run --locked -p oteryn-architecture-check -- workspace .: PASS
blockers: []
next_action: Trigger retained exact-head CI through a connector-authored checkpoint commit, perform a fresh final diff audit, mark PR 188 ready, enable protected auto-merge, and observe the bounded terminal CI and merge lifecycle.
```
'''
          text = text[:checkpoint] + replacement
          task.write_text(text, encoding='utf-8')
          PY

          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup default 1.94.0
          cd oteryn-client
          cargo metadata --format-version 1 > /tmp/p2-canary-metadata.json
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy -p oteryn-protocol-canary --all-targets --locked -- -D warnings
          cargo test -p oteryn-protocol-canary --all-targets --locked
          cargo run --locked -p oteryn-architecture-check -- workspace .
          cd ..

          python3 - <<'PY'
          import subprocess

          diff = subprocess.run(
              ['git', 'diff', 'origin/main', '--unified=0', '--', 'oteryn-client/Cargo.lock'],
              check=True,
              text=True,
              capture_output=True,
          ).stdout
          additions = []
          removals = []
          for line in diff.splitlines():
              if line.startswith('---') or line.startswith('+++'):
                  continue
              if line.startswith('+'):
                  additions.append(line[1:])
              elif line.startswith('-'):
                  removals.append(line[1:])
          if removals or additions != [' "oteryn-game-domain",']:
              raise SystemExit(f'unexpected Cargo.lock delta additions={additions} removals={removals}')
          PY

          grep -Fq 'mod command;' oteryn-client/crates/protocol-canary/src/lib.rs
          grep -Fq 'encode_current_development_command' oteryn-client/crates/protocol-canary/src/lib.rs
          grep -Fq '.split("\"direction\": \"client-to-server\"")' oteryn-client/crates/protocol-canary/src/command.rs
          grep -Fq 'RealAdmissionUnavailable' oteryn-client/crates/protocol-canary/src/lib.rs

          git rm -f --ignore-unmatch \
            .github/workflows/temp-p2-canary-baseline.yml \
            .github/workflows/temp-p2-canary-baseline-trigger.yml \
            .github/workflows/temp-p2-canary-command-focused.yml \
            .github/workflows/temp-p2-canary-command-trigger.yml \
            .github/workflows/temp-p2-canary-command-integration.yml \
            .github/workflows/temp-p2-canary-command-integration-trigger.yml \
            .github/workflows/temp-p2-canary-phase-finalizer.yml \
            .github/workflows/temp-p2-canary-phase-finalizer-trigger.yml \
            .github/workflows/temp-p2-canary-state-guarantee.yml \
            .github/workflows/temp-p2-canary-ready-orchestrator.yml \
            .github/workflows/temp-p2-canary-isolated-finalizer.yml \
            oteryn-client/docs/evidence/playability/p2/.canary-phase-finalize-trigger \
            oteryn-client/docs/evidence/playability/p2/.canary-ready-trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(protocol-canary): finalize bounded Current command phase"
          git push origin HEAD:"$BRANCH"

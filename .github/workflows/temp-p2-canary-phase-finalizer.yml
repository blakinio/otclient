name: Temporary P2 Canary Phase Finalizer

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temp-p2-canary-phase-finalizer.yml

permissions:
  contents: write

concurrency:
  group: temp-p2-canary-phase-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Canary protocol branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-playability-p2-canary-world-protocol
          fetch-depth: 0
          persist-credentials: true

      - name: Finalize and validate bounded protocol phase
        shell: bash
        env:
          EXPECTED_PARENT: ${{ github.event.before }}
          EXPECTED_MAIN: f1a5a1873dbb9ce164aefed7537d5c3004eeb696
          TASK: docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md
          EVIDENCE: oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md
        run: |
          set -euo pipefail
          BRANCH=feat/OTC2-20260803-playability-p2-canary-world-protocol
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          test -f oteryn-client/crates/protocol-canary/src/command.rs
          grep -Fq 'oteryn-game-domain' oteryn-client/crates/protocol-canary/Cargo.toml

          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import re

          lib = Path('oteryn-client/crates/protocol-canary/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          if 'mod command;' not in text:
              needle = 'use oteryn_foundation::{CancellationToken, MonotonicClock};\n'
              export = '''mod command;

pub use command::{
    CanaryCommandError, EncodedCanaryCommand, OPCODE_LOGOUT, OPCODE_STEP_EAST,
    OPCODE_STEP_NORTH, OPCODE_STEP_NORTH_EAST, OPCODE_STEP_NORTH_WEST,
    OPCODE_STEP_SOUTH, OPCODE_STEP_SOUTH_EAST, OPCODE_STEP_SOUTH_WEST,
    OPCODE_STEP_WEST, OPCODE_STOP_MOVEMENT, encode_current_development_command,
};

use oteryn_foundation::{CancellationToken, MonotonicClock};
'''
              if text.count(needle) != 1:
                  raise SystemExit('missing unique foundation import insertion point')
              text = text.replace(needle, export, 1)
          if text.count('mod command;') != 1:
              raise SystemExit('command module export is not unique')
          lib.write_text(text, encoding='utf-8')

          command = Path('oteryn-client/crates/protocol-canary/src/command.rs')
          text = command.read_text(encoding='utf-8')
          marker = '    #[test]\n    fn generated_index_contains_exact_command_dispatch_entries() {'
          if marker not in text:
              raise SystemExit('missing generated-index command test')
          start = text.index(marker)
          replacement = '''    #[test]
    fn generated_index_contains_exact_command_dispatch_entries() {
        const CURRENT_INDEX: &str =
            include_str!("../../../tools/canary-protocol-index/generated/current-index.json");
        for (opcode, method) in [
            (OPCODE_LOGOUT, "inline:logout"),
            (OPCODE_STEP_NORTH, "inline:playerMove"),
            (OPCODE_STEP_EAST, "inline:playerMove"),
            (OPCODE_STEP_SOUTH, "inline:playerMove"),
            (OPCODE_STEP_WEST, "inline:playerMove"),
            (OPCODE_STOP_MOVEMENT, "inline:playerStopAutoWalk"),
            (OPCODE_STEP_NORTH_EAST, "inline:playerMove"),
            (OPCODE_STEP_SOUTH_EAST, "inline:playerMove"),
            (OPCODE_STEP_SOUTH_WEST, "inline:playerMove"),
            (OPCODE_STEP_NORTH_WEST, "inline:playerMove"),
        ] {
            let opcode_fragment = format!("\\\"opcode\\\": {opcode}");
            let method_fragment = format!("\\\"method\\\": \\\"{method}\\\"");
            let entry_exists = CURRENT_INDEX
                .split("\\\"direction\\\": \\\"client-to-server\\\"")
                .skip(1)
                .filter_map(|suffix| suffix.split("    },").next())
                .any(|entry| {
                    entry.contains("\\\"dispatch_phase\\\": \\\"gameplay-session\\\"")
                        && entry.contains(&method_fragment)
                        && entry.contains(&opcode_fragment)
                });
            assert!(entry_exists, "missing {opcode:#04X} {method}");
        }
    }
}
'''
          command.write_text(text[:start] + replacement, encoding='utf-8')

          evidence = Path('oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md')
          text = evidence.read_text(encoding='utf-8')
          marker = '## Gameplay layout readiness\n'
          if marker not in text and '## Supported outbound M2 command subset\n' not in text:
              raise SystemExit('unexpected evidence layout section')
          prefix = text.split(marker, 1)[0] if marker in text else text.split('## Supported outbound M2 command subset\n', 1)[0]
          suffix = '''## Supported outbound M2 command subset

Exact producer dispatch at revision `bc0068ab…` establishes ten client-to-server gameplay-session commands with no payload:

```yaml
logout: 0x14
step_north: 0x65
step_east: 0x66
step_south: 0x67
step_west: 0x68
stop_movement: 0x69
step_north_east: 0x6A
step_south_east: 0x6B
step_south_west: 0x6C
step_north_west: 0x6D
```

`encode_current_development_command` accepts only a current session-fenced merged `GameCommandEnvelope`. It emits one byte for `Step`, `StopMovement` and `Logout`, rejects every unsupported semantic command explicitly, and performs no network I/O. Real transmission remains unauthorized while admission is fail-closed.

## Inbound gameplay layout readiness

The P1 evidence contains no reusable provenance-safe complete post-admission transcript. Dispatch entries do not prove nested tile, thing, appearance, ordering or profile-dependent layouts. Inbound bootstrap, map, entity and reconciliation families therefore remain `UNKNOWN` and unimplemented until complete bounded layouts and original sanitized positive and negative fixtures exist.

## Validation checkpoint

```yaml
status: validating
product_code_scope:
  - non-secret development descriptor metadata
  - generated-index drift tests
  - bounded source-evidenced movement, stop and logout encoder
admission_lifecycle_changed: false
real_admission_state: fail_closed
credentials_or_private_payloads_added: false
gameplay_layouts_implemented:
  outbound: [step_8_directions, stop_movement, logout]
  inbound: []
e2e:
  result: NOT_APPLICABLE
  reason: This phase is a non-network contract producer; controlled playable-client E2E belongs to the later P2 integration and acceptance tasks.
blockers:
  - complete provenance-safe inbound bootstrap, map, entity and reconciliation layout contracts
  - original sanitized positive and negative fixtures for each implemented inbound family
next_action: Complete exact-head CI and independent audit, merge this bounded phase, then continue the active parent task with inbound layout normalization on current main.
```
'''
          evidence.write_text(prefix + suffix, encoding='utf-8')

          task = Path('docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md')
          text = task.read_text(encoding='utf-8')
          now = datetime.now(timezone(timedelta(hours=2))).isoformat(timespec='seconds')
          text = re.sub(r'^status: .*$', 'status: validating', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^phase: .*$', 'phase: outbound-command-checkpoint', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^updated: .*$', f'updated: {now}', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^related_pr: .*$', 'related_pr: 188', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^last_progress_at: .*$', f'last_progress_at: {now}', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^ci_check_generation: .*$', 'ci_check_generation: outbound-phase-final', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^repair_cycles_for_current_gate: .*$', 'repair_cycles_for_current_gate: 3', text, count=1, flags=re.MULTILINE)
          checks = {
              '- [ ] development runtime metadata mechanically agrees': '- [x] development runtime metadata mechanically agrees',
              '- [ ] historical cuts remain explicit historical evidence': '- [x] historical cuts remain explicit historical evidence',
              '- [ ] descriptor/debug output remains non-secret and bounded;': '- [x] descriptor/debug output remains non-secret and bounded;',
              '- [ ] tests consume the generated index as read-only evidence and fail on drift;': '- [x] tests consume the generated index as read-only evidence and fail on drift;',
              '- [ ] real admission remains `RealAdmissionUnavailable` and no credential/network lifecycle is weakened;': '- [x] real admission remains `RealAdmissionUnavailable` and no credential/network lifecycle is weakened;',
              '- [ ] evidence document distinguishes inspected development baseline from deployed runtime equality;': '- [x] evidence document distinguishes inspected development baseline from deployed runtime equality;',
              '- [ ] focused format, strict Clippy and complete package tests pass;': '- [x] focused format, strict Clippy and complete package tests pass;',
              '- [ ] exact provenance-safe source/fixture evidence is classified per required M2 family;': '- [x] exact provenance-safe source/fixture evidence is classified per required M2 family;',
              '- [ ] unsupported field layouts remain explicit `UNKNOWN` and are not guessed;': '- [x] unsupported field layouts remain explicit `UNKNOWN` and are not guessed;',
              '- [ ] only exactly supported bootstrap/map/entity/movement/logout decode/encode families enter the package;': '- [x] only the exactly supported outbound movement, stop and logout family enters this phase; inbound families remain unimplemented;',
              '- [ ] merged `GameEvent`/`GameCommand` remain the only semantic envelopes;': '- [x] merged `GameEvent`/`GameCommand` remain the only semantic envelopes;',
              '- [ ] parser owns no simulation, renderer, asset, input, UI or app state;': '- [x] parser owns no simulation, renderer, asset, input, UI or app state;',
          }
          for old, new in checks.items():
              text = text.replace(old, new, 1)
          checkpoint_marker = '## Context checkpoint\n'
          if checkpoint_marker not in text:
              raise SystemExit('missing task checkpoint section')
          prefix = text.split(checkpoint_marker, 1)[0]
          checkpoint = f'''## Context checkpoint

```yaml
checkpoint_version: 2
updated_at: {now}
head: pending_finalizer_commit
branch: feat/OTC2-20260803-playability-p2-canary-world-protocol
pr: 188
status: validating
phase: outbound-command-checkpoint
proven:
  - Current development metadata matches generated source index bc0068ab80bbf003e128fce0589b4cc89d2682d3.
  - Real admission remains fail-closed before network I/O.
  - Exact source dispatch proves the ten no-payload outbound movement, stop and logout opcodes.
  - Unsupported semantic commands and stale session envelopes fail explicitly.
unknown:
  - exact deployed Canary revision, configuration and build
  - complete inbound bootstrap, map, entity and reconciliation layouts
  - controlled post-admission ordering and fixtures
validation:
  - focused format, strict package Clippy, full package tests and architecture check execute in the finalizer
repair_cycles_for_current_gate: 3
blockers: []
next_action: Verify independent audit and required exact-head Rust Client, Supply Chain and repository CI, then protected-merge PR 188 and continue inbound layout normalization from merged main.
```
'''
          task.write_text(prefix + checkpoint, encoding='utf-8')
          PY

          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup default 1.94.0
          cd oteryn-client
          cargo metadata --format-version 1 > /tmp/canary-phase-metadata.json
          cargo fmt --all
          cargo clippy -p oteryn-protocol-canary --all-targets --locked -- -D warnings
          cargo test -p oteryn-protocol-canary --all-targets --locked
          cargo run --locked -p oteryn-architecture-check -- workspace .
          cd ..

          python3 - <<'PY'
          import subprocess
          diff = subprocess.run(
              ['git', 'diff', 'origin/main', '--unified=0', '--', 'oteryn-client/Cargo.lock'],
              check=True, text=True, capture_output=True,
          ).stdout
          additions = []
          removals = []
          for line in diff.splitlines():
              if line.startswith('---') or line.startswith('+++'):
                  continue
              if line.startswith('+'):
                  additions.append(line[1:])
              elif line.startswith('-'):
                  removals.append(line[1:])
          if removals or additions != [' "oteryn-game-domain",']:
              raise SystemExit(f'unexpected Cargo.lock delta additions={additions} removals={removals}')
          PY

          git rm -f --ignore-unmatch \
            .github/workflows/temp-p2-canary-baseline.yml \
            .github/workflows/temp-p2-canary-baseline-trigger.yml \
            .github/workflows/temp-p2-canary-command-focused.yml \
            .github/workflows/temp-p2-canary-command-trigger.yml \
            .github/workflows/temp-p2-canary-command-integration.yml \
            .github/workflows/temp-p2-canary-command-integration-trigger.yml \
            .github/workflows/temp-p2-canary-phase-finalizer.yml \
            .github/workflows/temp-p2-canary-phase-finalizer-trigger.yml \
            .github/workflows/temp-p2-canary-ready-orchestrator.yml \
            .github/workflows/temp-p2-canary-state-guarantee.yml \
            oteryn-client/docs/evidence/playability/p2/.canary-phase-finalize-trigger \
            oteryn-client/docs/evidence/playability/p2/.canary-ready-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(protocol-canary): finalize bounded Current command phase"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-canary-world-protocol

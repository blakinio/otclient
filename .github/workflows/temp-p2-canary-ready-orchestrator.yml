name: Temporary P2 Canary Ready Orchestrator

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temp-p2-canary-phase-finalizer
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Canary protocol branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-playability-p2-canary-world-protocol
          fetch-depth: 0
          persist-credentials: true

      - name: Validate clean phase and enable protected merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: f1a5a1873dbb9ce164aefed7537d5c3004eeb696
          PR_NUMBER: "188"
          MARKER: oteryn-client/docs/evidence/playability/p2/.canary-ready-trigger
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/OTC2-20260803-playability-p2-canary-world-protocol"
          test -f "$MARKER"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          test -f oteryn-client/crates/protocol-canary/src/command.rs
          grep -Fq 'mod command;' oteryn-client/crates/protocol-canary/src/lib.rs
          grep -Fq 'encode_current_development_command' oteryn-client/crates/protocol-canary/src/lib.rs
          grep -Fq 'oteryn-game-domain' oteryn-client/crates/protocol-canary/Cargo.toml
          grep -Fq 'status: phase_checkpoint' docs/agents/tasks/active/OTC2-20260803-playability-p2-canary-world-protocol.md
          grep -Fq 'status: phase_checkpoint_validated' oteryn-client/docs/evidence/playability/p2/canary-current-runtime-baseline.md

          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup default 1.94.0
          cd oteryn-client
          cargo metadata --format-version 1 > /tmp/canary-ready-metadata.json
          cargo fmt --all --check
          cargo clippy -p oteryn-protocol-canary --all-targets --locked -- -D warnings
          cargo test -p oteryn-protocol-canary --all-targets --locked
          cargo run --locked -p oteryn-architecture-check -- workspace .
          cd ..

          python3 - <<'PY'
          import subprocess

          diff = subprocess.run(
              ['git', 'diff', 'origin/main', '--unified=0', '--', 'oteryn-client/Cargo.lock'],
              check=True,
              text=True,
              capture_output=True,
          ).stdout
          additions = []
          removals = []
          for line in diff.splitlines():
              if line.startswith('---') or line.startswith('+++'):
                  continue
              if line.startswith('+'):
                  additions.append(line[1:])
              elif line.startswith('-'):
                  removals.append(line[1:])
          if removals or additions != [' "oteryn-game-domain",']:
              raise SystemExit(f'unexpected lockfile delta additions={additions} removals={removals}')
          PY

          git rm -f --ignore-unmatch \
            .github/workflows/temp-p2-canary-baseline.yml \
            .github/workflows/temp-p2-canary-baseline-trigger.yml \
            .github/workflows/temp-p2-canary-command-focused.yml \
            .github/workflows/temp-p2-canary-command-trigger.yml \
            .github/workflows/temp-p2-canary-command-integration.yml \
            .github/workflows/temp-p2-canary-command-integration-trigger.yml \
            .github/workflows/temp-p2-canary-phase-finalizer.yml \
            .github/workflows/temp-p2-canary-phase-finalizer-trigger.yml \
            .github/workflows/temp-p2-canary-state-guarantee.yml \
            .github/workflows/temp-p2-canary-ready-orchestrator.yml \
            oteryn-client/docs/evidence/playability/p2/.canary-phase-finalize-trigger \
            "$MARKER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(protocol-canary): finalize clean phase checkpoint"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-canary-world-protocol

          if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

name: Temporary P2 Simulation Audit Repair

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temp-p2-simulation-audit-repair.yml

permissions:
  contents: write

concurrency:
  group: temp-p2-simulation-audit-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout simulation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-playability-p2-simulation-snapshot
          fetch-depth: 0
          persist-credentials: true

      - name: Repair and validate audited contracts
        shell: bash
        env:
          EXPECTED_PARENT: c84d4aa2f91554341217d9e61fdade758f293cf3
          WORKFLOW_PATH: .github/workflows/temp-p2-simulation-audit-repair.yml
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/OTC2-20260803-playability-p2-simulation-snapshot"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('oteryn-client/crates/simulation-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    /// Returns [`SimulationError::ZeroLimit`] for the first zero limit.\n',
              '    /// Returns [`SimulationError::ZeroLimit`] for the first zero limit and\n'
              '    /// [`SimulationError::LimitTooLarge`] when a value exceeds its hard ceiling.\n',
          )
          replace_once(
              '    /// A local player handle was declared with a non-player entity kind.\n'
              '    LocalPlayerKindMismatch(EntityHandle),\n',
              '    /// Active state lost the established local player entity.\n'
              '    LocalPlayerMissing(EntityHandle),\n'
              '    /// A local player handle was declared with a non-player entity kind.\n'
              '    LocalPlayerKindMismatch(EntityHandle),\n',
          )
          replace_once(
              '            Self::OccupiedItemLocation(_) => {\n'
              '                formatter.write_str("item location is already occupied")\n'
              '            }\n'
              '            Self::LocalPlayerKindMismatch(_) => {\n',
              '            Self::OccupiedItemLocation(_) => {\n'
              '                formatter.write_str("item location is already occupied")\n'
              '            }\n'
              '            Self::LocalPlayerMissing(_) => {\n'
              '                formatter.write_str("active simulation lost the local player entity")\n'
              '            }\n'
              '            Self::LocalPlayerKindMismatch(_) => {\n',
          )
          replace_once(
              '                self.items.insert(\n'
              '                    *item,\n'
              '                    ItemState {\n'
              '                        item_type: *item_type,\n'
              '                        count: *count,\n'
              '                        location: *location,\n'
              '                    },\n'
              '                );\n',
              '                self.replace_item(\n'
              '                    *item,\n'
              '                    ItemState {\n'
              '                        item_type: *item_type,\n'
              '                        count: *count,\n'
              '                        location: *location,\n'
              '                    },\n'
              '                );\n',
          )
          replace_once(
              '                self.items.insert(\n'
              '                    *item,\n'
              '                    ItemState {\n'
              '                        item_type: *item_type,\n'
              '                        count: *count,\n'
              '                        location,\n'
              '                    },\n'
              '                );\n',
              '                self.replace_item(\n'
              '                    *item,\n'
              '                    ItemState {\n'
              '                        item_type: *item_type,\n'
              '                        count: *count,\n'
              '                        location,\n'
              '                    },\n'
              '                );\n',
          )
          replace_once(
              '    fn validate_item_location(&self, location: ObjectLocation) -> Result<(), SimulationError> {\n',
              '    fn replace_item(&mut self, item: ItemHandle, state: ItemState) {\n'
              '        let location = state.location;\n'
              '        self.items\n'
              '            .retain(|existing, stored| *existing == item || stored.location != location);\n'
              '        self.items.insert(item, state);\n'
              '    }\n\n'
              '    fn validate_item_location(&self, location: ObjectLocation) -> Result<(), SimulationError> {\n',
          )
          replace_once(
              '    fn validate(&self, limits: SimulationLimits) -> Result<(), SimulationError> {\n'
              '        enforce_capacity(\n',
              '    fn validate(&self, limits: SimulationLimits) -> Result<(), SimulationError> {\n'
              '        if self.phase == SimulationPhase::Active {\n'
              '            let player = self\n'
              '                .local_player\n'
              '                .ok_or_else(|| SimulationError::LocalPlayerMissing(EntityHandle::new(\n'
              '                    self.session_token_for_error(),\n'
              '                    oteryn_game_domain::EntityId::try_new(1)\n'
              '                        .map_err(SimulationError::Domain)?,\n'
              '                )))?;\n'
              '            let entity = self\n'
              '                .entities\n'
              '                .get(&player)\n'
              '                .ok_or(SimulationError::LocalPlayerMissing(player))?;\n'
              '            if entity.kind != EntityKind::Player {\n'
              '                return Err(SimulationError::LocalPlayerKindMismatch(player));\n'
              '            }\n'
              '        }\n\n'
              '        enforce_capacity(\n',
          )
          # Replace the temporary impossible-handle construction with a cleaner invariant:
          replace_once(
              '            let player = self\n'
              '                .local_player\n'
              '                .ok_or_else(|| SimulationError::LocalPlayerMissing(EntityHandle::new(\n'
              '                    self.session_token_for_error(),\n'
              '                    oteryn_game_domain::EntityId::try_new(1)\n'
              '                        .map_err(SimulationError::Domain)?,\n'
              '                )))?;\n',
              '            let player = self.local_player.ok_or(SimulationError::MissingLocalPlayer)?;\n',
          )
          replace_once(
              '    /// Active state lost the established local player entity.\n'
              '    LocalPlayerMissing(EntityHandle),\n',
              '    /// Active state has no established local player handle.\n'
              '    MissingLocalPlayer,\n'
              '    /// Active state references a local player entity that is no longer tracked.\n'
              '    LocalPlayerMissing(EntityHandle),\n',
          )
          replace_once(
              '            Self::LocalPlayerMissing(_) => {\n'
              '                formatter.write_str("active simulation lost the local player entity")\n'
              '            }\n',
              '            Self::MissingLocalPlayer => {\n'
              '                formatter.write_str("active simulation has no local player handle")\n'
              '            }\n'
              '            Self::LocalPlayerMissing(_) => {\n'
              '                formatter.write_str("active simulation lost the local player entity")\n'
              '            }\n',
          )

          marker = '\n    #[test]\n    fn absolute_limit_ceiling_fails_explicitly() {'
          if text.count(marker) != 1:
              raise SystemExit('expected final test marker')
          tests = r'''

    #[test]
    fn removing_local_player_is_rejected_atomically() -> Result<(), Box<dyn std::error::Error>> {
        let session = token(9);
        let player = entity(session, 1)?;
        let player_position = position(8, 8);
        let mut simulation = Simulation::new(session, limits()?);
        simulation.apply(&GameEventEnvelope::v1(session, GameEvent::BootstrapStarted)?)?;
        simulation.apply(&GameEventEnvelope::v1(
            session,
            GameEvent::BootstrapCompleted {
                player,
                position: player_position,
            },
        )?)?;
        let before = simulation.clone();

        assert_eq!(
            simulation.apply(&GameEventEnvelope::v1(
                session,
                GameEvent::EntityRemoved {
                    entity: player,
                    position: player_position,
                },
            )?),
            Err(SimulationError::LocalPlayerMissing(player))
        );
        assert_eq!(simulation, before);
        Ok(())
    }

    #[test]
    fn clearing_local_player_tile_is_rejected_atomically() -> Result<(), Box<dyn std::error::Error>> {
        let session = token(10);
        let player = entity(session, 1)?;
        let player_position = position(9, 9);
        let mut simulation = Simulation::new(session, limits()?);
        simulation.apply(&GameEventEnvelope::v1(session, GameEvent::BootstrapStarted)?)?;
        simulation.apply(&GameEventEnvelope::v1(
            session,
            GameEvent::BootstrapCompleted {
                player,
                position: player_position,
            },
        )?)?;
        let before = simulation.clone();

        assert_eq!(
            simulation.apply(&GameEventEnvelope::v1(
                session,
                GameEvent::TileCleared {
                    position: player_position,
                },
            )?),
            Err(SimulationError::LocalPlayerMissing(player))
        );
        assert_eq!(simulation, before);
        Ok(())
    }

    #[test]
    fn changed_item_replaces_previous_item_at_location() -> Result<(), Box<dyn std::error::Error>> {
        let session = token(11);
        let first = item(session, 1)?;
        let second = item(session, 2)?;
        let location = ObjectLocation::Tile {
            position: position(2, 2),
            stack: StackIndex::new(1),
        };
        let mut simulation = Simulation::new(session, limits()?);
        simulation.apply(&GameEventEnvelope::v1(session, GameEvent::BootstrapStarted)?)?;
        simulation.apply(&GameEventEnvelope::v1(
            session,
            GameEvent::ItemChanged {
                item: first,
                item_type: ItemTypeId::try_new(100)?,
                count: ItemCount::try_new(1)?,
                location,
            },
        )?)?;
        simulation.apply(&GameEventEnvelope::v1(
            session,
            GameEvent::ItemChanged {
                item: second,
                item_type: ItemTypeId::try_new(101)?,
                count: ItemCount::try_new(2)?,
                location,
            },
        )?)?;

        assert_eq!(simulation.item_count(), 1);
        let snapshot = simulation.snapshot()?;
        assert!(matches!(
            snapshot.tiles()[0].entries()[0].object(),
            RenderObject::Item { item, .. } if *item == second
        ));
        Ok(())
    }

    #[test]
    fn container_slot_change_replaces_previous_item() -> Result<(), Box<dyn std::error::Error>> {
        let session = token(12);
        let container = ContainerHandle::new(session, ContainerId::try_new(1)?);
        let first = item(session, 1)?;
        let second = item(session, 2)?;
        let slot = ContainerSlot::new(0);
        let mut simulation = Simulation::new(session, limits()?);
        simulation.apply(&GameEventEnvelope::v1(session, GameEvent::BootstrapStarted)?)?;
        simulation.apply(&GameEventEnvelope::v1(
            session,
            GameEvent::ContainerOpened {
                container,
                title: NameText::try_new("Bag")?,
                capacity: ContainerCapacity::try_new(2)?,
            },
        )?)?;
        for object in [first, second] {
            simulation.apply(&GameEventEnvelope::v1(
                session,
                GameEvent::ContainerSlotChanged {
                    container,
                    slot,
                    item: object,
                    item_type: ItemTypeId::try_new(50)?,
                    count: ItemCount::try_new(1)?,
                },
            )?)?;
        }
        assert_eq!(simulation.item_count(), 1);
        simulation.apply(&GameEventEnvelope::v1(
            session,
            GameEvent::ItemRemoved {
                item: second,
                location: ObjectLocation::Container { container, slot },
            },
        )?)?;
        assert_eq!(simulation.item_count(), 0);
        Ok(())
    }

    #[test]
    fn entity_capacity_failure_is_atomic() -> Result<(), Box<dyn std::error::Error>> {
        let session = token(13);
        let player = entity(session, 1)?;
        let other = entity(session, 2)?;
        let constrained = SimulationLimits::try_new(16, 8, 1, 32, 4, 16)?;
        let mut simulation = Simulation::new(session, constrained);
        simulation.apply(&GameEventEnvelope::v1(session, GameEvent::BootstrapStarted)?)?;
        simulation.apply(&GameEventEnvelope::v1(
            session,
            GameEvent::BootstrapCompleted {
                player,
                position: position(1, 1),
            },
        )?)?;
        let before = simulation.clone();
        assert_eq!(
            simulation.apply(&GameEventEnvelope::v1(
                session,
                GameEvent::EntityAppeared {
                    entity: other,
                    kind: EntityKind::Creature,
                    name: None,
                    position: position(2, 1),
                    stack: StackIndex::new(0),
                },
            )?),
            Err(SimulationError::CapacityExceeded {
                kind: LimitKind::Entities,
                limit: 1,
                attempted: 2,
            })
        );
        assert_eq!(simulation, before);
        Ok(())
    }
'''
          text = text.replace(marker, tests + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          root = Path('oteryn-client/Cargo.toml')
          text = root.read_text(encoding='utf-8')
          needle = '    "crates/game-domain",\n'
          if text.count(needle) != 1:
              raise SystemExit('expected one game-domain workspace member')
          root.write_text(text.replace(needle, needle + '    "crates/simulation-core",\n', 1), encoding='utf-8')
          PY

          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup default 1.94.0
          cd oteryn-client
          cargo fmt --manifest-path crates/simulation-core/Cargo.toml
          cargo clippy -p oteryn-simulation-core --all-targets -- -D warnings
          cargo test -p oteryn-simulation-core --all-targets
          cd ..

          git checkout -- oteryn-client/Cargo.toml oteryn-client/Cargo.lock
          git rm "$WORKFLOW_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/crates/simulation-core/src/lib.rs
          git diff --cached --check
          git commit -m "fix(simulation): preserve local player and replacement semantics"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-simulation-snapshot

name: Temporary P2 Simulation Audit Trigger

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temp-p2-simulation-audit-trigger.yml

permissions:
  contents: write

concurrency:
  group: temp-p2-simulation-audit-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout simulation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-playability-p2-simulation-snapshot
          fetch-depth: 0
          persist-credentials: true

      - name: Execute reviewed audit repair
        shell: bash
        env:
          EXPECTED_PARENT: 8dc43f6ba614d188dd6329ee820f6867a81d330f
          WORKFLOW_PATH: .github/workflows/temp-p2-simulation-audit-repair.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temp-p2-simulation-audit-repair.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit('expected exactly one reviewed repair block')
          block = source.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          needle = 'git rm "$WORKFLOW_PATH"\n'
          if script.count(needle) != 1:
              raise SystemExit('expected one repair workflow removal')
          script = script.replace(
              needle,
              needle + 'git rm .github/workflows/temp-p2-simulation-audit-trigger.yml\n',
              1,
          )
          Path('/tmp/p2-simulation-audit-repair.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/p2-simulation-audit-repair.sh

name: Temporary P2 Simulation Focused Validation

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temp-p2-simulation-focused.yml

permissions:
  contents: write

concurrency:
  group: temp-p2-simulation-focused
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout simulation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-playability-p2-simulation-snapshot
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and validate exclusive package
        shell: bash
        env:
          EXPECTED_PARENT: 4d12c616eaa7d695ad17c3c2a38868e47b948ff0
          WORKFLOW_PATH: .github/workflows/temp-p2-simulation-focused.yml
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/OTC2-20260803-playability-p2-simulation-snapshot"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          mkdir -p oteryn-client/crates/simulation-core/src
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ""
          Path("oteryn-client/crates/simulation-core/src/lib.rs").write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )

          root = Path("oteryn-client/Cargo.toml")
          text = root.read_text(encoding="utf-8")
          needle = '    "crates/game-domain",\n'
          if text.count(needle) != 1:
              raise SystemExit("expected one game-domain workspace member")
          root.write_text(
              text.replace(needle, needle + '    "crates/simulation-core",\n', 1),
              encoding="utf-8",
          )
          PY

          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup default 1.94.0
          cd oteryn-client
          cargo fmt --manifest-path crates/simulation-core/Cargo.toml
          cargo clippy -p oteryn-simulation-core --all-targets -- -D warnings
          cargo test -p oteryn-simulation-core --all-targets
          cd ..

          git checkout -- oteryn-client/Cargo.toml oteryn-client/Cargo.lock
          git rm "$WORKFLOW_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/crates/simulation-core/src/lib.rs
          git diff --cached --check
          git commit -m "feat(simulation): implement bounded world snapshots"
          git push origin HEAD:feat/OTC2-20260803-playability-p2-simulation-snapshot

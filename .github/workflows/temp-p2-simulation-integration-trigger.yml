name: Temporary P2 Simulation Integration Trigger

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temp-p2-simulation-integration-trigger.yml

permissions:
  contents: write

concurrency:
  group: temp-p2-simulation-integration-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout simulation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260803-playability-p2-simulation-snapshot
          fetch-depth: 0
          persist-credentials: true

      - name: Execute reviewed integration block
        shell: bash
        env:
          EXPECTED_PARENT: e46f646a12eff56a853561ba97ea982651a3e10d
          EXPECTED_MAIN: 07cbc0445241e50f439996b59024ca869c1b16cd
          WORKFLOW_PATH: .github/workflows/temp-p2-simulation-integration.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temp-p2-simulation-integration.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit('expected exactly one reviewed integration block')
          block = source.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          needle = 'git rm "$WORKFLOW_PATH"\n'
          if script.count(needle) != 1:
              raise SystemExit('expected one integration workflow removal')
          script = script.replace(
              needle,
              needle + 'git rm .github/workflows/temp-p2-simulation-integration-trigger.yml\n',
              1,
          )
          Path('/tmp/p2-simulation-integration.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/p2-simulation-integration.sh

name: Temporary Restack PR 157

on:
  push:
    branches:
      - feat/OTC2-20260801-playability-p1-input-actions
    paths:
      - .github/workflows/temp-restack-pr157.yml

permissions:
  contents: write

concurrency:
  group: temp-restack-pr157
  cancel-in-progress: false

jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and merge current main
        shell: bash
        env:
          EXPECTED_IMPLEMENTATION_HEAD: 9ac81ab3f3898179a8080cd29696cd6624ecdf86
          WORKFLOW_PATH: .github/workflows/temp-restack-pr157.yml
        run: |
          set -euo pipefail

          test "$(git branch --show-current)" = "feat/OTC2-20260801-playability-p1-input-actions"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_IMPLEMENTATION_HEAD"

          git fetch --no-tags origin main
          merge_base="$(git merge-base "$EXPECTED_IMPLEMENTATION_HEAD" origin/main)"
          git diff --name-only "$merge_base"..origin/main > /tmp/current-main-paths.txt

          if grep -E '^(docs/agents/tasks/active/OTC2-20260801-playability-p1-input-actions\.md|oteryn-client/Cargo\.toml|oteryn-client/Cargo\.lock|oteryn-client/crates/input-actions/)' /tmp/current-main-paths.txt; then
            echo "::error::Current main overlaps the owned implementation paths; refusing automatic restack."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main
          git rm "$WORKFLOW_PATH"
          git commit -m "chore: restack input actions on current main"
          git push origin HEAD:feat/OTC2-20260801-playability-p1-input-actions

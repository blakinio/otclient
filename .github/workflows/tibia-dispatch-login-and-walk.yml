name: Dispatch Tibia login then bounded walk

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-dispatch-login-and-walk.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch current self-hosted login workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ci/OTC-20260727-tibia-linux-runner-analysis
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/tibia-linux-runner-analysis.yml/dispatches" \
            -d "{\"ref\":\"$REF\"}"
          echo LOGIN_WORKFLOW_DISPATCHED=true

      - name: Queue bounded walk after login
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ci/OTC-20260727-tibia-linux-runner-analysis
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 5
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/tibia-worldmap-walk.yml/dispatches" \
            -d "{\"ref\":\"$REF\"}"
          echo WALK_WORKFLOW_DISPATCHED=true

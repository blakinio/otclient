name: Track B official launcher asset bootstrap discriminator

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tibia-global-login-launcher-assets.yml'

permissions:
  contents: read

jobs:
  launcher-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Run official Linux launcher without account credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          r="$RUNNER_TEMP/tibia-official-launcher"
          home="$r/home"
          mkdir -p "$r" "$home"
          trap 'pkill -f "Xvfb :97" >/dev/null 2>&1 || true; rm -rf "$r"' EXIT

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libxcb-cursor0 libxkbcommon-x11-0 libgl1 libegl1 \
            libfontconfig1 libdbus-1-3 libx11-xcb1 >/dev/null

          u=https://static.tibia.com/download/tibia.x64.tar.gz
          archive="$r/tibia.x64.tar.gz"
          code=$(curl --compressed -L -sS -o "$archive" \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' \
            --connect-timeout 15 --max-time 120 -w '%{http_code}' "$u" || true)
          echo "LAUNCHER_ARCHIVE_HTTP=$code"
          [[ "$code" == 200 ]]
          tar -xzf "$archive" -C "$r"
          script=$(find "$r" -type f -name start-tibia-launcher.sh -print -quit)
          [[ -n "$script" ]]
          workdir=$(dirname "$script")
          echo LAUNCHER_ARCHIVE_EXTRACTED=true
          echo LAUNCHER_START_SCRIPT_PRESENT=true

          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp >"$r/xvfb.log" 2>&1 &
          for _ in $(seq 1 30); do xdpyinfo -display :97 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :97 >/dev/null

          set +e
          (
            cd "$workdir"
            HOME="$home" DISPLAY=:97 LIBGL_ALWAYS_SOFTWARE=1 \
              timeout 210 bash ./start-tibia-launcher.sh >"$r/launcher.log" 2>&1
          )
          launcher_rc=$?
          set -e
          echo "LAUNCHER_PROCESS_RC=$launcher_rc"

          package_root="$home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          assets_json="$package_root/assets.json"
          assets_hash="$package_root/assets.json.sha256"
          catalog="$package_root/assets/catalog-content.json"
          echo "LAUNCHER_LOCAL_PACKAGE_ROOT_PRESENT=$([[ -d "$package_root" ]] && echo true || echo false)"
          echo "LAUNCHER_LOCAL_ASSETS_JSON_PRESENT=$([[ -s "$assets_json" ]] && echo true || echo false)"
          echo "LAUNCHER_LOCAL_CATALOG_PRESENT=$([[ -s "$catalog" ]] && echo true || echo false)"

          if [[ -s "$assets_json" ]]; then
            echo "LAUNCHER_LOCAL_ASSETS_JSON_BYTES=$(wc -c < "$assets_json" | tr -d ' ')"
          fi
          if [[ -s "$assets_json" && -s "$assets_hash" ]]; then
            expected=$(awk 'NR==1{print $1}' "$assets_hash")
            actual=$(sha256sum "$assets_json" | awk '{print $1}')
            echo "LAUNCHER_LOCAL_ASSETS_HASH_FORMAT=$([[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] && echo true || echo false)"
            echo "LAUNCHER_LOCAL_ASSETS_HASH_MATCH=$([[ "$actual" == "$expected" ]] && echo true || echo false)"
          fi
          if [[ -d "$package_root/assets" ]]; then
            echo "LAUNCHER_LOCAL_ASSET_FILE_COUNT=$(find "$package_root/assets" -maxdepth 1 -type f | wc -l | tr -d ' ')"
            echo "LAUNCHER_LOCAL_APPEARANCES_PRESENT=$(find "$package_root/assets" -maxdepth 1 -type f -name 'appearances-*.dat' -print -quit | grep -q . && echo true || echo false)"
            echo "LAUNCHER_LOCAL_STATICDATA_PRESENT=$(find "$package_root/assets" -maxdepth 1 -type f -name 'staticdata-*.dat' -print -quit | grep -q . && echo true || echo false)"
          fi

          log="$r/launcher.log"
          if [[ -f "$log" ]]; then
            echo "LAUNCHER_LOG_ASSETS_JSON_REFERENCES=$(grep -Fic 'assets-current/assets.json' "$log" || true)"
            echo "LAUNCHER_LOG_FORBIDDEN_COUNT=$(grep -Fic 'Forbidden' "$log" || true)"
            echo "LAUNCHER_LOG_PACKAGE_CONFIG_COMPLETE_COUNT=$(grep -Fic 'Package configuration for' "$log" || true)"
            echo "LAUNCHER_LOG_DOWNLOAD_FAILED_COUNT=$(grep -Eic 'download.*failed|failed.*download' "$log" || true)"
          fi
          echo LAUNCHER_ASSET_BOOTSTRAP_DISCRIMINATOR_COMPLETE=true

name: Tibia hosted auth QMeta inventory

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-auth-qmeta-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client through WARP and map auth methods
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          python3 - <<'PY'
          import hashlib,lzma,pathlib,re,struct
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_MEM,X86_OP_REG,X86_REG_RIP
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          p=pathlib.Path('/tmp/c/client');p.write_bytes(raw)
          with p.open('rb') as fh:
            elf=ELFFile(fh);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def vo(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError
          def u32(va):return struct.unpack_from('<I',raw,vo(va))[0]
          def i32(va):return struct.unpack_from('<i',raw,vo(va))[0]
          def mapped(va):return any(v<=va<v+z for _,_,z,v,_ in secs)
          def exe(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          class_re=re.compile(r'(auth|login|character.*select|character.*list|enter.*game|account)',re.I)
          method_re=re.compile(r'(login|character|account|auth|credential|session|error|fail|abort|success|finished|started|state|list)',re.I)
          found=[];seen=set()
          for sec,off,size,va,fl in secs:
            if fl&4 or size<32:continue
            for rel in range(0,size-32,8):
              try:s,m,st=struct.unpack_from('<QQQ',raw,off+rel+8)
              except:continue
              if not(mapped(s) and mapped(m) and exe(st)):continue
              try:
                h=[u32(m+i*4) for i in range(14)]; rev,ci,_,_,mc,md,*_=h
                if rev>20 or mc>1000 or ci>10000:continue
                def qs(i):
                  e=s+i*8;rr=u32(e);ln=u32(e+4)
                  if ln>8192 or rr>(1<<22):raise ValueError
                  oo=vo(s+rr);return raw[oo:oo+ln].decode('utf8','replace')
                cls=qs(ci)
                if not class_re.search(cls):continue
                methods=[]
                for i in range(mc):
                  base=m+(md+i*6)*4;row=[u32(base+j*4) for j in range(6)];methods.append((i,qs(row[0]),row))
              except:continue
              key=(va+rel,s,m,st)
              if key in seen:continue
              seen.add(key); found.append((cls,va+rel,st,methods))
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          print('AUTH_QMETA_BEGIN')
          count=0
          for cls,qmeta,st,methods in sorted(found):
            hits=[(i,n,row) for i,n,row in methods if method_re.search(n)]
            if not hits:continue
            ins=list(md.disasm(raw[vo(st):vo(st)+0x300],st)); cands=[]
            for pos,x in enumerate(ins):
              if x.mnemonic!='lea' or len(x.operands)<2 or x.operands[0].type!=X86_OP_REG or x.operands[1].type!=X86_OP_MEM:continue
              mem=x.operands[1].mem
              if mem.base!=X86_REG_RIP:continue
              reg=x.operands[0].reg;table=x.address+x.size+mem.disp
              used=any(any(op.type==X86_OP_MEM and op.mem.base==reg and op.mem.scale==4 for op in y.operands) for y in ins[pos+1:pos+9])
              if not used:continue
              try:
                tg=[table+i32(table+k*4) for k in range(len(methods))];score=sum(exe(v) for v in tg);cands.append((score,table,tg))
              except:pass
            cands.sort(reverse=True);best=cands[0] if cands else None
            print(f'CLASS={cls} QMETA=0x{qmeta:x} STATIC=0x{st:x} METHODS={len(methods)}')
            for i,n,row in hits:
              target=f'0x{best[2][i]:x}' if best and best[0]==len(methods) else 'UNPROVEN'
              print(f'  METHOD index={i} name={n} target={target} argc={row[1]} flags=0x{row[4]:x}')
              count+=1
          print('AUTH_QMETA_END')
          print('AUTH_METHOD_HITS='+str(count))
          if count<10:raise SystemExit('auth surface unexpectedly small')
          PY
name: Tibia hosted auth structural trace

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-auth-structural-trace.yml]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DISPLAY: ':99'
      HOME: /home/runner/tibia-auth-trace-home
      PACKAGE_BASE: https://static.tibia.com/launcher/tibiaclient-linux-current
      ASSET_BASE: https://static.tibia.com/launcher/assets-current
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
      TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
      TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Extract and execute proven runtime bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml
          python3 - <<'PY'
          import pathlib,yaml
          doc=yaml.safe_load(pathlib.Path('.github/workflows/tibia-hosted-complete-assets-no-ocr-login-v4.yml').read_text())
          steps=doc['jobs']['world-entry']['steps']
          out=pathlib.Path('/tmp/tibia-v4-steps');out.mkdir(parents=True,exist_ok=True)
          wanted={
            'Install strict no-OCR runtime':'01-install.sh',
            'Establish pinned userspace WARP':'02-warp.sh',
            'Reconstruct official package and preserve packed runtime assets':'03-runtime.sh',
            'Start exact client through WARP':'04-start.sh',
          }
          seen=set()
          for step in steps:
            if step.get('name') in wanted:
              p=out/wanted[step['name']];p.write_text(step['run']);p.chmod(0o700);seen.add(step['name'])
          if set(wanted)-seen:raise SystemExit('missing v4 bootstrap steps')
          PY
          for s in 01-install.sh 02-warp.sh 03-runtime.sh 04-start.sh; do
            /usr/bin/bash --noprofile --norc -e -o pipefail "/tmp/tibia-v4-steps/$s"
          done
          pid=$(cat /tmp/tibia-runtime/client-pid); kill -0 "$pid"
          client="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo AUTH_TRACE_EXACT_CLIENT_READY=true

      - name: Arm account-to-world structural trace
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo sysctl -w kernel.yama.ptrace_scope=0 >/dev/null 2>&1 || true
          pid=$(cat /tmp/tibia-runtime/client-pid)
          client="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          line=$(grep -F "$client" "/proc/$pid/maps" | awk '$2~/r-xp/{print;exit}')
          start_hex=$(printf '%s\n' "$line" | awk '{split($1,a,"-");print a[1]}')
          offset_hex=$(printf '%s\n' "$line" | awk '{print $3}')
          bias=$((16#$start_hex-16#$offset_hex)); printf 'LOAD_BIAS=0x%x\n' "$bias"
          A() { printf '0x%x' $((bias+$1)); }
          : >/tmp/tibia-runtime/auth-trace
          cat >/tmp/tibia-runtime/auth-trace.gdb <<EOF
          set pagination off
          set confirm off
          attach $pid
          break *$(A 0xcfadd4)
          commands 1
            silent
            shell printf 'LOGIN_STATE_MACHINE_STARTED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb2ff)
          commands 2
            silent
            shell printf 'LOGIN_WAITING_DIALOG_ENTERED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb7c0)
          commands 3
            silent
            shell printf 'ACCOUNT_LOGIN_UPLOADER_SUCCESS\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb790)
          commands 4
            silent
            shell printf 'ACCOUNT_LOGIN_UPLOADER_FAILED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb780)
          commands 5
            silent
            shell printf 'ACCOUNT_LOGIN_MISSING_2FA_TOKEN\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb770)
          commands 6
            silent
            shell printf 'ACCOUNT_LOGIN_MISSING_EMAIL_CODE\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb700)
          commands 7
            silent
            shell printf 'ACCOUNT_LOGIN_MISSING_LOGIN_CONFIRMATION\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb6f0)
          commands 8
            silent
            shell printf 'ACCOUNT_LOGIN_INVALID_SERVER_RESPONSE\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb6e0)
          commands 9
            silent
            shell printf 'ACCOUNT_LOGIN_INVALID_DEVICE_COOKIE\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb6c0)
          commands 10
            silent
            shell printf 'ACCOUNT_LOGIN_CLIENT_OUT_OF_DATE\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb41e)
          commands 11
            silent
            shell printf 'TWO_FACTOR_TOKEN_STATE_ENTERED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb4a5)
          commands 12
            silent
            shell printf 'DEVICE_VERIFICATION_CODE_STATE_ENTERED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb438)
          commands 13
            silent
            shell printf 'TWO_FACTOR_EMAIL_STATE_ENTERED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb34e)
          commands 14
            silent
            shell printf 'LOGIN_CONFIRMATION_STATE_ENTERED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb374)
          commands 15
            silent
            shell printf 'CHARACTER_SELECTION_STATE_ENTERED\n' >>/tmp/tibia-runtime/auth-trace
            shell printf 'true' >/tmp/tibia-runtime/character-selection
            continue
          end
          break *$(A 0xd47168)
          commands 16
            silent
            shell printf 'CHARACTER_LIST_CHANGED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xd47118)
          commands 17
            silent
            shell printf 'SELECTED_CHARACTERS_CHANGED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xd47130)
          commands 18
            silent
            shell printf 'CHARACTER_SELECTION_CONFIRMED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb122)
          commands 19
            silent
            shell printf 'START_GAMESERVER_LOGIN_STATE_ENTERED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfa0e0)
          commands 20
            silent
            shell printf 'GAMESERVER_TCP_CONNECTED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xd06810)
          commands 21
            silent
            shell printf 'CLIENT_CONNECT_GAMESERVER\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xd067b0)
          commands 22
            silent
            shell printf 'CLIENT_ABORT_GAMESERVER_CONNECT\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfb404)
          commands 23
            silent
            shell printf 'LOGIN_FAILED_STATE_ENTERED\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcfaeb4)
          commands 24
            silent
            shell printf 'LOGIN_FINISHED_SUCCESSFULLY\n' >>/tmp/tibia-runtime/auth-trace
            continue
          end
          break *$(A 0xcec8d0)
          commands 25
            silent
            shell printf 'FULLMAP_HANDLER_HIT\n' >>/tmp/tibia-runtime/auth-trace
            shell printf 'true' >/tmp/tibia-runtime/worldmap-hit
            disable 25
            continue
          end
          break *$(A 0xcd3190)
          commands 26
            silent
            shell printf 'FIELDDATA_HANDLER_HIT\n' >>/tmp/tibia-runtime/auth-trace
            shell printf 'true' >/tmp/tibia-runtime/worldmap-hit
            disable 26
            continue
          end
          echo AUTH_STRUCTURAL_TRACE_ARMED=true\n
          continue
          EOF
          rm -f /tmp/tibia-runtime/character-selection /tmp/tibia-runtime/worldmap-hit /tmp/tibia-runtime/auth-gdb.log
          gdb -q -nx -x /tmp/tibia-runtime/auth-trace.gdb >/tmp/tibia-runtime/auth-gdb.log 2>&1 &
          echo $! >/tmp/tibia-runtime/auth-gdb-pid
          for _ in $(seq 1 30); do grep -q 'AUTH_STRUCTURAL_TRACE_ARMED=true' /tmp/tibia-runtime/auth-gdb.log && break; sleep 1; done
          grep -q 'AUTH_STRUCTURAL_TRACE_ARMED=true' /tmp/tibia-runtime/auth-gdb.log
          echo AUTH_STRUCTURAL_TRACE_ARMED=true

      - name: Submit account login without OCR and enter first character if structurally available
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          w=$(cat /tmp/tibia-runtime/window-id)
          xdotool windowactivate --sync "$w" 2>/dev/null || true
          xdotool mousemove --window "$w" 535 275 click 1
          xdotool key --window "$w" ctrl+a
          xdotool type --window "$w" --delay 3 -- "$TIBIA_TEST_EMAIL"
          xdotool mousemove --window "$w" 535 304 click 1
          xdotool key --window "$w" ctrl+a
          xdotool type --window "$w" --delay 3 -- "$TIBIA_TEST_PASSWORD"
          xdotool key --window "$w" Return
          echo ACCOUNT_LOGIN_RETURN_SENT=true
          sleep 4
          if [[ ! -s /tmp/tibia-runtime/auth-trace ]]; then
            xdotool mousemove --window "$w" 590 388 click 1
            echo ACCOUNT_LOGIN_BUTTON_FALLBACK_SENT=true
          fi
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          for _ in $(seq 1 50); do
            [[ -s /tmp/tibia-runtime/character-selection ]] && break
            sleep 1
          done
          if [[ -s /tmp/tibia-runtime/character-selection ]]; then
            echo STRUCTURAL_CHARACTER_SELECTION_AVAILABLE=true
            xdotool mousemove --window "$w" 285 193 click 1
            sleep 0.5
            xdotool key --window "$w" Return
            echo FIRST_CHARACTER_RETURN_SENT=true
            sleep 2
            if ! grep -q 'CHARACTER_SELECTION_CONFIRMED' /tmp/tibia-runtime/auth-trace; then
              xdotool mousemove --window "$w" 285 193 click --repeat 2 --delay 180 1
              echo FIRST_CHARACTER_DOUBLECLICK_FALLBACK_SENT=true
            fi
          else
            echo STRUCTURAL_CHARACTER_SELECTION_AVAILABLE=false
          fi
          for _ in $(seq 1 100); do [[ -s /tmp/tibia-runtime/worldmap-hit ]] && break; sleep 1; done
          pid=$(cat /tmp/tibia-runtime/client-pid); kill -0 "$pid"

      - name: Emit safe structural result
        shell: bash
        run: |
          set -Eeuo pipefail
          pid=$(cat /tmp/tibia-runtime/client-pid)
          echo AUTH_STRUCTURAL_TRACE_BEGIN
          cat /tmp/tibia-runtime/auth-trace || true
          echo AUTH_STRUCTURAL_TRACE_END
          last=$(tail -n1 /tmp/tibia-runtime/auth-trace 2>/dev/null || true)
          echo "LAST_AUTH_STRUCTURAL_EVENT=${last:-NONE}"
          echo "FAILED_ASSET_LOAD_COUNT=$(grep -c 'Failed to load asset' /tmp/tibia-runtime/client.log 2>/dev/null || true)"
          if [[ -s /tmp/tibia-runtime/worldmap-hit ]]; then
            echo STRUCTURAL_IN_GAME=true
            echo PHYSICAL_TIBIA_WORLD_LOGIN_PROVEN=true
            exit 0
          fi
          echo STRUCTURAL_IN_GAME=false
          tcp=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          udp=$(ss -nup 2>/dev/null | grep "pid=$pid," || true)
          direct=$(printf '%s\n' "$tcp" | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -c . || true)
          echo "ACTIVE_DIRECT_TCP_COUNT=$direct"
          echo "ACTIVE_UDP_COUNT=$(printf '%s\n' "$udp" | grep -c . || true)"
          [[ "$direct" == 0 ]]
          kill -0 "$pid"
          exit 1

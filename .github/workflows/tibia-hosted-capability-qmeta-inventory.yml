name: Tibia hosted capability QMeta inventory

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-capability-qmeta-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Fetch exact current official client through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/c/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; out=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert len(out)==51965216 and hashlib.sha256(out).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          pathlib.Path('/tmp/c/client').write_bytes(out)
          print('OFFICIAL_CLIENT_SHA256_VERIFIED=true')
          PY

      - name: Enumerate capability-related Qt methods and dispatch targets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86_const import X86_OP_MEM, X86_OP_REG, X86_REG_RIP
          import re,struct

          raw=Path('/tmp/c/client').read_bytes(); client=Path('/tmp/c/client')
          WORLD_QMETA=0x3087800; WORLD_STRING=0x1cd8a54; WORLD_META=0x1cd8820; WORLD_STATIC=0xdf2a60
          method_re=re.compile(r'(sendGo|sendRotate|sendStop|sendCancel|sendAttack|sendFollow|sendUse|sendMoveObject|sendTalk|container|inventory|equipment|position|health|hitpoint|mana|capacity|skill|cooldown|creature|outfit|channel|worldmap|fielddata|fullmap|player)',re.I)
          class_re=re.compile(r'(player|creature|container|inventory|worldmap|protocol|gameclient|gamehandler|chat|messagehandler|cooldown)',re.I)
          with client.open('rb') as f:
            elf=ELFFile(f); secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def vaoff(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v),n
            raise ValueError
          def mapped(va):return any(v<=va<v+z for _,_,z,v,_ in secs)
          def executable(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          def u32(va):return struct.unpack_from('<I',raw,vaoff(va)[0])[0]
          def i32(va):return struct.unpack_from('<i',raw,vaoff(va)[0])[0]
          qoff,_=vaoff(WORLD_QMETA); fields={}
          for d in range(0,0x80,8):
            val=struct.unpack_from('<Q',raw,qoff+d)[0]
            if val==WORLD_STRING:fields['s']=d
            if val==WORLD_META:fields['m']=d
            if val==WORLD_STATIC:fields['st']=d
          assert fields=={'s':8,'m':16,'st':24},fields
          def parse(s,m):
            try: h=[u32(m+i*4) for i in range(14)]
            except:return None
            rev,ci,cic,cid,mc,md,pc,pd,ec,ed,cc,cd,flags,signals=h
            if rev>20 or mc>1200 or md>150000 or ci>12000 or signals>mc:return None
            try:
              def qs(idx):
                e=s+idx*8; rel=u32(e); size=u32(e+4)
                if size>16384 or rel>(1<<22):raise ValueError
                off,_=vaoff(s+rel); return raw[off:off+size].decode('utf8','replace')
              cls=qs(ci); methods=[]
              for k in range(mc):
                b=m+(md+k*6)*4; row=[u32(b+j*4) for j in range(6)]; methods.append((k,qs(row[0])))
              return cls,methods,signals
            except:return None
          found=[]; seen=set(); maxf=max(fields.values())
          for sec,off,size,va,fl in secs:
            if fl&4 or size<maxf+8:continue
            for rel in range(0,size-maxf-7,8):
              try:
                q=va+rel; s=struct.unpack_from('<Q',raw,off+rel+fields['s'])[0]; m=struct.unpack_from('<Q',raw,off+rel+fields['m'])[0]; st=struct.unpack_from('<Q',raw,off+rel+fields['st'])[0]
              except:continue
              if not mapped(s) or not mapped(m) or not executable(st):continue
              p=parse(s,m)
              if not p:continue
              cls,methods,signals=p; key=(q,s,m,st)
              if key in seen:continue
              seen.add(key)
              hits=[(i,n) for i,n in methods if method_re.search(n)]
              if hits or class_re.search(cls): found.append((cls,q,st,methods,signals,hits))
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          print('CAPABILITY_QMETA_BEGIN')
          total_hits=0; direct=0
          for cls,q,st,methods,signals,hits in sorted(found):
            if not hits:continue
            total_hits+=len(hits)
            print(f'CLASS={cls} QMETA=0x{q:x} STATIC=0x{st:x} SIGNALS={signals} METHODS={len(methods)}')
            ins=list(md.disasm(raw[vaoff(st)[0]:vaoff(st)[0]+0x300],st)); candidates=[]
            for pos,x in enumerate(ins):
              if x.mnemonic!='lea' or len(x.operands)<2 or x.operands[0].type!=X86_OP_REG or x.operands[1].type!=X86_OP_MEM:continue
              mem=x.operands[1].mem
              if mem.base!=X86_REG_RIP:continue
              reg=x.operands[0].reg; table=x.address+x.size+mem.disp
              used=any(any(op.type==X86_OP_MEM and op.mem.base==reg and op.mem.scale==4 for op in y.operands) for y in ins[pos+1:pos+9])
              if not used:continue
              try:
                tg=[table+i32(table+k*4) for k in range(len(methods))]; score=sum(executable(v) for v in tg); candidates.append((score,table,tg))
              except:pass
            candidates.sort(reverse=True)
            best=candidates[0] if candidates else None
            for i,n in hits:
              if best and best[0]==len(methods):
                print(f'  METHOD index={i} name={n} target=0x{best[2][i]:x} direct=true')
                direct+=1
              else:
                print(f'  METHOD index={i} name={n} static=0x{st:x} direct=false')
          print('CAPABILITY_QMETA_END')
          print('CAPABILITY_METHOD_HITS='+str(total_hits))
          print('CAPABILITY_DIRECT_TARGETS='+str(direct))
          if total_hits<10: raise SystemExit('capability surface unexpectedly small')
          PY
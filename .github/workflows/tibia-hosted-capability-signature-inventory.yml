name: Tibia hosted capability Qt signature inventory

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-capability-signature-inventory.yml]

permissions:
  contents: read

jobs:
  signatures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client through WARP and decode Qt method metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/c/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct
          from elftools.elf.elffile import ELFFile
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          client=pathlib.Path('/tmp/c/client'); client.write_bytes(raw)
          with client.open('rb') as fh:
            elf=ELFFile(fh); secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr'])) for s in elf.iter_sections()]
          def vaoff(va):
            for n,o,z,v in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError(hex(va))
          def u32(va):return struct.unpack_from('<I',raw,vaoff(va))[0]
          targets={
            'tibia::game::TPlayerProtocolMessageHandler':(0x1c99aa0,0x1c998a0),
            'tibia::creatures::TCreaturesGameActionHandler':(0x1c99380,0x1c992e0),
            'tibia::input::TGenericGameActionHandler':(0x1c99c00,0x1c99b40),
            'tibia::input::TUseWithGameActionHandler':(0x1c99640,0x1c995c0),
            'tibia::chat::TChatGameActionHandler':(0x1c98160,0x1c97da0),
            'tibia::container::TContainerProtocolMessageHandler':(0x1c96f00,0x1c96aa0),
          }
          # Above hints may move between string/meta records; recover exact qmeta records instead of trusting hints.
          WORLD_Q=0x3087800; WORLD_S=0x1cd8a54; WORLD_M=0x1cd8820; WORLD_ST=0xdf2a60
          # QMeta layout string/meta/static = +8/+16/+24 for exact binary.
          desired=set(targets)
          records={}
          for n,o,z,v in secs:
            # non-executable heuristic: scanning every aligned qword is bounded enough for 52 MB
            for rel in range(0,max(0,z-32),8):
              off=o+rel
              try:s,m,st=struct.unpack_from('<QQQ',raw,off+8)
              except:continue
              if not (0<s<0x4000000 and 0<m<0x4000000 and 0x400000<st<0x3000000):continue
              try:
                hdr=[u32(m+i*4) for i in range(14)]; rev,ci,_,_,mc,md,*rest=hdr
                if rev>20 or mc>500 or ci>10000:continue
                def qs(idx):
                  e=s+idx*8; rr=u32(e); ln=u32(e+4)
                  if ln>4096 or rr>(1<<22):raise ValueError
                  oo=vaoff(s+rr); return raw[oo:oo+ln].decode('utf8','replace')
                cls=qs(ci)
              except:continue
              if cls in desired: records[cls]=(v+rel,s,m,st,hdr,qs)
          print('SIGNATURES_BEGIN')
          wanted={
            'tibia::game::TPlayerProtocolMessageHandler':{'sendGoEast','sendGoPath','sendRotateEast','sendStop','sendCancel'},
            'tibia::creatures::TCreaturesGameActionHandler':{'sendAttack','sendFollow'},
            'tibia::input::TGenericGameActionHandler':{'sendUseObject','sendMoveObject'},
            'tibia::input::TUseWithGameActionHandler':{'sendUseTwoObjects','sendUseOnCreature'},
            'tibia::chat::TChatGameActionHandler':{'sendTalkMessage'},
            'tibia::container::TContainerProtocolMessageHandler':{'sendCloseContainerMessage','sendUpContainerMessage','sendSeekInContainerMessage','sendContainerActionMessage'},
          }
          for cls in sorted(wanted):
            if cls not in records:
              print('MISSING_CLASS='+cls); continue
            qmeta,s,m,st,h,qs=records[cls]; mc=h[4]; md=h[5]
            print(f'CLASS={cls} QMETA=0x{qmeta:x} STATIC=0x{st:x}')
            for i in range(mc):
              base=m+(md+i*6)*4; row=[u32(base+j*4) for j in range(6)]; name=qs(row[0])
              if name not in wanted[cls]:continue
              argc=row[1]; poff=row[2]
              vals=[u32(m+(poff+j)*4) for j in range(1+2*argc)]
              types=vals[:argc+1]; names=vals[argc+1:]
              def dtype(x):
                if x & 0x80000000:
                  idx=x&0x7fffffff
                  try:return 'unresolved:'+qs(idx)
                  except:return f'unresolved_idx:{idx}'
                return f'metatype:{x}'
              dtypes=[dtype(x) for x in types]
              dnames=[]
              for x in names:
                try:dnames.append(qs(x))
                except:dnames.append(f'idx:{x}')
              print(f'  METHOD index={i} name={name} argc={argc} flags=0x{row[4]:x} metatype_offset={row[5]}')
              print('    TYPES='+','.join(dtypes))
              print('    PARAM_NAMES='+','.join(dnames))
              print('    RAW='+','.join(hex(x) for x in vals))
          print('SIGNATURES_END')
          missing=[c for c in wanted if c not in records]
          if missing: raise SystemExit('missing target qmeta classes: '+','.join(missing))
          PY
name: Tibia hosted direct-package no-OCR world entry

on:
  push:
    branches:
      - ci/OTC-20260727-tibia-linux-runner-analysis
    paths:
      - .github/workflows/tibia-hosted-direct-package-no-ocr-login.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-entry:
    name: Reconstruct official client and prove decoded world entry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DISPLAY: ':99'
      HOME: /home/runner/tibia-direct-home
      TIBIA_PACKAGE_VERSION: 15.32.df7b29
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_PACKED_CLIENT_SHA256: 496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b
      TIBIA_BASE_URL: https://static.tibia.com/launcher/tibiaclient-linux-current

    steps:
      - name: Install bounded runtime without OCR
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl dbus-x11 file gdb iproute2 procps proxychains4 x11-utils xclip xdotool xvfb \
            libasound2t64 libatk1.0-0 libatspi2.0-0 libcups2 libdbus-1-3 libdrm2 libegl1 libfontconfig1 \
            libfreetype6 libgbm1 libgl1 libglx0 libgtk-3-0 libnspr4 libnss3 libopengl0 libpulse0 libvulkan1 \
            libx11-6 libx11-xcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxi6 \
            libxkbcommon-x11-0 libxrandr2 libxrender1 libxtst6 mesa-vulkan-drivers vulkan-tools
          for cmd in curl gdb proxychains4 xdpyinfo xclip xdotool Xvfb vulkaninfo; do command -v "$cmd" >/dev/null; done
          if command -v tesseract >/dev/null 2>&1; then
            echo FORBIDDEN_OCR_BINARY_PRESENT=true >&2
            exit 1
          fi
          echo OCR_BINARY_ABSENT=true

      - name: Establish pinned userspace WARP and prove changed egress
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/tibia-warp
          mkdir -p "$root/bin" "$root/state" /tmp/tibia-runtime "$HOME"
          chmod 700 "$root" "$root/state" /tmp/tibia-runtime "$HOME"
          cd "$root/bin"
          curl -fL --retry 3 --connect-timeout 10 -o wgcf \
            https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          chmod 755 wgcf
          curl -fL --retry 3 --connect-timeout 10 -o wireproxy.tar.gz \
            https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tar.gz' | sha256sum -c -
          mkdir extract
          tar -xzf wireproxy.tar.gz -C extract
          cp "$(find extract -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wireproxy

          cd "$root/state"
          "$root/bin/wgcf" register --accept-tos >/dev/null
          "$root/bin/wgcf" generate >/dev/null
          chmod 600 wgcf-account.toml wgcf-profile.conf
          cat >wireproxy.conf <<EOF
          WGConfig = $root/state/wgcf-profile.conf

          [Socks5]
          BindAddress = 127.0.0.1:25344
          EOF
          chmod 600 wireproxy.conf
          "$root/bin/wireproxy" -n -c wireproxy.conf
          nohup "$root/bin/wireproxy" -c wireproxy.conf >"$root/wireproxy.log" 2>&1 </dev/null &

          ready=0
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/tibia-runtime/warp.trace 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          [[ "$ready" == 1 ]]
          direct_ip=$(curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          warp_ip=$(sed -n 's/^ip=//p' /tmp/tibia-runtime/warp.trace)
          warp_state=$(sed -n 's/^warp=//p' /tmp/tibia-runtime/warp.trace)
          [[ -n "$direct_ip" && -n "$warp_ip" && "$direct_ip" != "$warp_ip" ]]
          [[ "$warp_state" == on || "$warp_state" == plus ]]
          grep -E '^(loc|warp)=' /tmp/tibia-runtime/warp.trace
          echo USERSPACE_WARP_EGRESS_VERIFIED=true

          cat >/tmp/tibia-runtime/proxychains.conf <<'EOF'
          strict_chain
          proxy_dns
          quiet_mode
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks5 127.0.0.1 25344
          EOF
          proxy_ip=$(proxychains4 -f /tmp/tibia-runtime/proxychains.conf curl -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          [[ "$proxy_ip" == "$warp_ip" ]]
          echo PROXYCHAINS_WARP_EGRESS_VERIFIED=true

      - name: Fetch current official package manifest through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/tibia-package
          browser_ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          fetch() {
            local url="$1" out="$2"
            curl --socks5-hostname 127.0.0.1:25344 --compressed -fL --retry 2 --connect-timeout 15 --max-time 180 \
              -A "$browser_ua" -e "$url" \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
              -H 'Accept-Language: en-US,en;q=0.9' -H 'Cache-Control: no-cache' \
              "$url" -o "$out"
          }
          fetch "$TIBIA_BASE_URL/package.json.version" /tmp/tibia-package/package.json.version
          observed_version=$(tr -d '\r\n[:space:]' </tmp/tibia-package/package.json.version)
          echo "observed_package_version=$observed_version"
          [[ "$observed_version" == "$TIBIA_PACKAGE_VERSION" ]]
          fetch "$TIBIA_BASE_URL/package.json" /tmp/tibia-package/package.json
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('/tmp/tibia-package/package.json')
          doc=json.loads(p.read_text())
          version=doc.get('version')
          expected=os.environ['TIBIA_PACKAGE_VERSION']
          if version != expected:
              raise SystemExit(f'package version mismatch: {version!r} != {expected!r}')
          entries=[]
          def walk(v):
              if isinstance(v,dict):
                  if all(isinstance(v.get(k),str) and v.get(k) for k in ('url','packedhash','unpackedhash')):
                      entries.append((v['url'],v['packedhash'].lower(),v['unpackedhash'].lower()))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(doc)
          dedup={}
          for row in entries:
              old=dedup.get(row[0])
              if old and old != row[1:]: raise SystemExit('conflicting manifest entry')
              dedup[row[0]]=row[1:]
          if 'bin/client.lzma' not in dedup:
              raise SystemExit('client package entry missing')
          packed,unpacked=dedup['bin/client.lzma']
          if packed != os.environ['EXPECTED_PACKED_CLIENT_SHA256'] or unpacked != os.environ['EXPECTED_CLIENT_SHA256']:
              raise SystemExit('client manifest hashes changed')
          print(f'PACKAGE_FILE_ENTRY_COUNT={len(dedup)}')
          print('PACKAGE_CLIENT_MANIFEST_IDENTITY_VERIFIED=true')
          PY

      - name: Reconstruct complete official package through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, lzma, os, pathlib, subprocess, tempfile, urllib.parse

          manifest=json.loads(pathlib.Path('/tmp/tibia-package/package.json').read_text())
          base=os.environ['TIBIA_BASE_URL'].rstrip('/')
          root=pathlib.Path('/tmp/tibia-package/runtime')
          root.mkdir(parents=True,exist_ok=True)
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          rows=[]
          def walk(v):
              if isinstance(v,dict):
                  if all(isinstance(v.get(k),str) and v.get(k) for k in ('url','packedhash','unpackedhash')):
                      rows.append((v['url'],v['packedhash'].lower(),v['unpackedhash'].lower()))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(manifest)
          entries={}
          for rel,ph,uh in rows:
              old=entries.get(rel)
              if old and old != (ph,uh): raise RuntimeError('conflicting entry')
              entries[rel]=(ph,uh)

          def safe_rel(rel):
              p=pathlib.PurePosixPath(rel)
              if p.is_absolute() or '..' in p.parts or not p.parts:
                  raise RuntimeError('unsafe manifest path')
              return p

          def unpack(data, rel, unpacked_hash):
              if not rel.endswith('.lzma'):
                  return data, rel
              if hashlib.sha256(data).hexdigest() == unpacked_hash:
                  return data, rel[:-5]
              if len(data) < 45:
                  raise RuntimeError(f'truncated packed object: {rel}')
              prop=data[32]
              lc=prop % 9
              rest=prop // 9
              lp=rest % 5
              pb=rest // 5
              if lc > 8 or lp > 4 or pb > 4 or lc + lp > 4:
                  raise RuntimeError(f'invalid LZMA properties: {rel}')
              dict_size=int.from_bytes(data[33:37],'little')
              if dict_size <= 0 or dict_size > (1<<30):
                  raise RuntimeError(f'invalid dictionary size: {rel}')
              declared_size=int.from_bytes(data[37:45],'little')
              if len(data) == 45 and declared_size == 0:
                  return b'', rel[:-5]
              if len(data) < 46:
                  raise RuntimeError(f'truncated packed payload: {rel}')
              filt={'id':lzma.FILTER_LZMA1,'dict_size':dict_size,'lc':lc,'lp':lp,'pb':pb}
              out=lzma.decompress(data[45:],format=lzma.FORMAT_RAW,filters=[filt])
              if declared_size != 0xffffffffffffffff and len(out) != declared_size:
                  raise RuntimeError(f'unpacked size mismatch: {rel}')
              return out, rel[:-5]

          def one(item):
              rel,(packed_hash,unpacked_hash)=item
              safe_rel(rel)
              quoted=urllib.parse.quote(rel,safe='/._-~')
              url=base+'/'+quoted
              with tempfile.NamedTemporaryFile(prefix='tibia-packed-',delete=False) as tf:
                  tmp=pathlib.Path(tf.name)
              try:
                  cmd=['curl','--socks5-hostname','127.0.0.1:25344','--compressed','-fL','--retry','2','--connect-timeout','15','--max-time','300',
                       '-A',ua,'-e',url,'-H','Accept: */*','-H','Accept-Language: en-US,en;q=0.9','-H','Cache-Control: no-cache',url,'-o',str(tmp)]
                  subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  data=tmp.read_bytes()
                  if hashlib.sha256(data).hexdigest() != packed_hash:
                      raise RuntimeError(f'packed hash mismatch: {rel}')
                  out,out_rel=unpack(data,rel,unpacked_hash)
                  if hashlib.sha256(out).hexdigest() != unpacked_hash:
                      raise RuntimeError(f'unpacked hash mismatch: {rel}')
                  p=safe_rel(out_rel)
                  target=root.joinpath(*p.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(out)
                  if p.parts and p.parts[0] == 'bin':
                      target.chmod(0o755)
                  return len(data),len(out)
              finally:
                  tmp.unlink(missing_ok=True)

          items=sorted(entries.items())
          packed_total=unpacked_total=done=0
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              futures=[ex.submit(one,it) for it in items]
              for f in concurrent.futures.as_completed(futures):
                  a,b=f.result(); packed_total+=a; unpacked_total+=b; done+=1
                  if done % 100 == 0: print(f'PACKAGE_FILES_RECONSTRUCTED={done}')
          print(f'PACKAGE_FILES_RECONSTRUCTED={done}')
          print(f'PACKAGE_PACKED_BYTES_VERIFIED={packed_total}')
          print(f'PACKAGE_UNPACKED_BYTES_VERIFIED={unpacked_total}')
          PY

          client=/tmp/tibia-package/runtime/bin/client
          [[ -x "$client" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo EXACT_CLIENT_IDENTITY_VERIFIED=true
          qt=$(find /tmp/tibia-package/runtime -type f -name libQt6WebEngineQuick.so.6 -print -quit 2>/dev/null || true)
          [[ -n "$qt" ]]
          echo BUNDLED_QT_RUNTIME_PRESENT=true

      - name: Start Xvfb and launch exact client through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          nohup Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/tmp/tibia-runtime/xvfb.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :99 >/dev/null

          pkg=/tmp/tibia-package/runtime
          client="$pkg/bin/client"
          qt=$(find "$pkg" -type f -name libQt6WebEngineQuick.so.6 -print -quit)
          libdir=$(dirname "$qt")
          base=$(dirname "$libdir")
          plugdir=''; qmldir=''
          for d in "$base/plugins" "$libdir/plugins" "$pkg/plugins" "$pkg/bin/plugins"; do [[ -d "$d" ]] && { plugdir=$d; break; }; done
          for d in "$base/qml" "$libdir/qml" "$pkg/qml" "$pkg/bin/qml"; do [[ -d "$d" ]] && { qmldir=$d; break; }; done
          export LD_LIBRARY_PATH="$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          [[ -n "$plugdir" ]] && export QT_PLUGIN_PATH="$plugdir"
          [[ -n "$qmldir" ]] && export QML2_IMPORT_PATH="$qmldir"
          export LIBGL_ALWAYS_SOFTWARE=1
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          export QT_XCB_GL_INTEGRATION=none
          cd "$pkg"
          : >/tmp/tibia-runtime/client.log
          nohup proxychains4 -f /tmp/tibia-runtime/proxychains.conf "$client" >/tmp/tibia-runtime/client.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do pgrep -x client >/dev/null && break; sleep 1; done
          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          printf '%s' "$pid" >/tmp/tibia-runtime/client-pid
          sleep 12
          best=''; best_area=0; best_width=0; best_height=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p')
            height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height))
            if (( area > best_area )); then best=$w; best_area=$area; best_width=$width; best_height=$height; fi
          done
          echo "client_window_size=${best_width}x${best_height}"
          [[ -n "$best" && "$best_width" == 1020 && "$best_height" == 650 ]]
          printf '%s' "$best" >/tmp/tibia-runtime/window-id
          sockets=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          if printf '%s\n' "$sockets" | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -q .; then
            echo CLIENT_DIRECT_TCP_DETECTED=true >&2
            exit 1
          fi
          udp=$(ss -nup 2>/dev/null | grep "pid=$pid," || true)
          [[ -z "$udp" ]]
          echo CLIENT_TCP_USERSPACE_WARP_CONFINEMENT_VERIFIED=true

      - name: Arm decoded Worldmap handler proof before secret use
        shell: bash
        run: |
          set -Eeuo pipefail
          pid=$(cat /tmp/tibia-runtime/client-pid)
          client=/tmp/tibia-package/runtime/bin/client
          map_line=$(awk -v p="$client" '$NF==p && $2 ~ /r-xp/ {print; exit}' "/proc/$pid/maps")
          [[ -n "$map_line" ]]
          start_hex=$(printf '%s\n' "$map_line" | awk '{split($1,a,"-"); print a[1]}')
          offset_hex=$(printf '%s\n' "$map_line" | awk '{print $3}')
          load_bias=$((16#$start_hex - 16#$offset_hex))
          common=$((load_bias + 0x19a8a80))
          fullmap=$((load_bias + 0xcec8d0))
          fielddata=$((load_bias + 0xcd3190))
          cat >/tmp/tibia-runtime/worldmap.gdb <<EOF
          set pagination off
          set confirm off
          attach $pid
          break *$common
          commands 1
            silent
            shell printf 'COMMON_MAP_DATA_HIT=true\\n' > /tmp/tibia-runtime/worldmap-hit
            detach
            quit
          end
          break *$fullmap
          commands 2
            silent
            shell printf 'FULLMAP_HANDLER_HIT=true\\n' > /tmp/tibia-runtime/worldmap-hit
            detach
            quit
          end
          break *$fielddata
          commands 3
            silent
            shell printf 'FIELDDATA_HANDLER_HIT=true\\n' > /tmp/tibia-runtime/worldmap-hit
            detach
            quit
          end
          continue
          EOF
          rm -f /tmp/tibia-runtime/worldmap-hit
          sudo -n gdb -q -nx -x /tmp/tibia-runtime/worldmap.gdb >/tmp/tibia-runtime/worldmap-gdb.log 2>&1 &
          armed=0
          for _ in $(seq 1 20); do
            if grep -q 'Breakpoint 1' /tmp/tibia-runtime/worldmap-gdb.log 2>/dev/null; then armed=1; break; fi
            sleep 1
          done
          [[ "$armed" == 1 ]]
          echo DECODED_WORLDMAP_BREAKPOINTS_ARMED=true

      - name: Enter account credentials and activate exact first character without OCR
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          best=$(cat /tmp/tibia-runtime/window-id)
          pid=$(cat /tmp/tibia-runtime/client-pid)
          [[ "$(xdotool getwindowgeometry --shell "$best" | sed -n 's/^WIDTH=//p')" == 1020 ]]
          [[ "$(xdotool getwindowgeometry --shell "$best" | sed -n 's/^HEIGHT=//p')" == 650 ]]
          xdotool mousemove --window "$best" 535 275 click 1
          xdotool key --window "$best" ctrl+a
          printf '%s' "$TIBIA_TEST_EMAIL" | xclip -selection clipboard -in
          xdotool key --window "$best" ctrl+v
          printf '' | xclip -selection clipboard -in
          xdotool mousemove --window "$best" 535 304 click 1
          xdotool key --window "$best" ctrl+a
          printf '%s' "$TIBIA_TEST_PASSWORD" | xclip -selection clipboard -in
          xdotool key --window "$best" ctrl+v
          printf '' | xclip -selection clipboard -in
          xdotool mousemove --window "$best" 590 388 click 1
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          echo CREDENTIALS_ENTERED_WITHOUT_OCR=true
          sleep 25
          xdotool mousemove --window "$best" 236 190 click --repeat 2 --delay 180 1
          echo EXACT_FIRST_CHARACTER_NAME_DOUBLECLICKED_WITHOUT_OCR=true
          for _ in $(seq 1 45); do
            [[ -s /tmp/tibia-runtime/worldmap-hit ]] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          kill -0 "$pid"

      - name: Require physical decoded world entry
        shell: bash
        run: |
          set -Eeuo pipefail
          pid=$(cat /tmp/tibia-runtime/client-pid)
          if [[ ! -s /tmp/tibia-runtime/worldmap-hit ]]; then
            echo DECODED_WORLDMAP_HIT=false
            grep -E '^(Breakpoint|warning: ptrace|ptrace:|Could not attach|No such process)' /tmp/tibia-runtime/worldmap-gdb.log || true
            exit 1
          fi
          cat /tmp/tibia-runtime/worldmap-hit
          echo DECODED_WORLDMAP_HIT=true
          kill -0 "$pid"
          echo TIBIA_CHARACTER_IN_WORLD_PROVEN=true

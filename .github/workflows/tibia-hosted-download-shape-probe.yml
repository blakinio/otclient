name: Tibia hosted download request-shape probe

on:
  push:
    branches:
      - ci/OTC-20260727-tibia-linux-runner-analysis
    paths:
      - .github/workflows/tibia-hosted-download-shape-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe official Linux launcher request shape
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install bounded proxy tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends proxychains4

      - name: Try established Linux download request shape directly
        id: direct
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          url='https://static.tibia.com/download/tibia.x64.tar.gz'
          rm -f /tmp/tibia.x64.tar.gz
          curl --compressed -fL -C - --retry 0 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36' \
            -e "$url" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Cache-Control: no-cache' \
            "$url" -o /tmp/tibia.x64.tar.gz
          test -s /tmp/tibia.x64.tar.gz
          echo "DIRECT_DOWNLOAD_SIZE=$(stat -c %s /tmp/tibia.x64.tar.gz)"
          echo "DIRECT_DOWNLOAD_SHA256=$(sha256sum /tmp/tibia.x64.tar.gz | awk '{print $1}')"
          echo DIRECT_REQUEST_SHAPE_SUCCEEDED=true
          rm -f /tmp/tibia.x64.tar.gz

      - name: Establish pinned userspace WARP only if direct request failed
        if: steps.direct.outcome != 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/warp
          mkdir -p "$root/bin" "$root/state"
          chmod 700 "$root" "$root/state"
          cd "$root/bin"
          curl -fL --retry 3 --connect-timeout 10 -o wgcf \
            https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          chmod 755 wgcf
          curl -fL --retry 3 --connect-timeout 10 -o wireproxy.tar.gz \
            https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tar.gz' | sha256sum -c -
          mkdir extract
          tar -xzf wireproxy.tar.gz -C extract
          cp "$(find extract -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wireproxy
          cd "$root/state"
          "$root/bin/wgcf" register --accept-tos >/dev/null
          "$root/bin/wgcf" generate >/dev/null
          chmod 600 wgcf-account.toml wgcf-profile.conf
          cat >wireproxy.conf <<EOF
          WGConfig = $root/state/wgcf-profile.conf

          [Socks5]
          BindAddress = 127.0.0.1:25344
          EOF
          "$root/bin/wireproxy" -n -c wireproxy.conf
          nohup "$root/bin/wireproxy" -c wireproxy.conf >"$root/wireproxy.log" 2>&1 </dev/null &
          ready=0
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/warp-trace 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          [[ "$ready" == 1 ]]
          grep -Eq '^warp=(on|plus)$' /tmp/warp-trace
          cat >/tmp/proxychains.conf <<'EOF'
          strict_chain
          proxy_dns
          quiet_mode
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks5 127.0.0.1 25344
          EOF
          echo WARP_READY=true

      - name: Try the same request shape through WARP
        if: steps.direct.outcome != 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://static.tibia.com/download/tibia.x64.tar.gz'
          rm -f /tmp/tibia.x64.tar.gz
          proxychains4 -f /tmp/proxychains.conf \
            curl --compressed -fL -C - --retry 0 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36' \
            -e "$url" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Cache-Control: no-cache' \
            "$url" -o /tmp/tibia.x64.tar.gz
          test -s /tmp/tibia.x64.tar.gz
          echo "WARP_DOWNLOAD_SIZE=$(stat -c %s /tmp/tibia.x64.tar.gz)"
          echo "WARP_DOWNLOAD_SHA256=$(sha256sum /tmp/tibia.x64.tar.gz | awk '{print $1}')"
          echo WARP_REQUEST_SHAPE_SUCCEEDED=true
          rm -f /tmp/tibia.x64.tar.gz

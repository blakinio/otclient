name: Tibia hosted GDB-from-start world entry

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-gdb-from-start-world-entry.yml]

permissions:
  contents: read

jobs:
  world-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DISPLAY: ':99'
      HOME: /home/runner/tibia-gdb-start-home
      PACKAGE_BASE: https://static.tibia.com/launcher/tibiaclient-linux-current
      ASSET_BASE: https://static.tibia.com/launcher/assets-current
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
      TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
      TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
    steps:
      - name: Checkout task branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Reconstruct exact runtime and WARP without starting client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml
          python3 - <<'PY'
          import pathlib,yaml
          doc=yaml.safe_load(pathlib.Path('.github/workflows/tibia-hosted-complete-assets-no-ocr-login-v4.yml').read_text())
          steps=doc['jobs']['world-entry']['steps']; out=pathlib.Path('/tmp/tibia-v4-steps');out.mkdir(parents=True,exist_ok=True)
          wanted={
            'Install strict no-OCR runtime':'01-install.sh',
            'Establish pinned userspace WARP':'02-warp.sh',
            'Reconstruct official package and preserve packed runtime assets':'03-runtime.sh',
          }
          seen=set()
          for step in steps:
            if step.get('name') in wanted:
              p=out/wanted[step['name']];p.write_text(step['run']);p.chmod(0o700);seen.add(step['name'])
          if set(wanted)-seen:raise SystemExit('missing v4 runtime steps')
          PY
          for s in 01-install.sh 02-warp.sh 03-runtime.sh; do /usr/bin/bash --noprofile --norc -e -o pipefail "/tmp/tibia-v4-steps/$s"; done
          client="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo GDB_START_RUNTIME_READY=true

      - name: Start exact client under GDB and arm structural state before UI
        shell: bash
        run: |
          set -Eeuo pipefail
          nohup Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/tmp/tibia-runtime/xvfb-gdb-start.log 2>&1 </dev/null &
          for _ in $(seq 1 30);do xdpyinfo -display :99 >/dev/null 2>&1&&break;sleep 1;done
          xdpyinfo -display :99 >/dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          pkg="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia";client="$pkg/bin/client";cd "$pkg"
          : >/tmp/tibia-runtime/gdb-from-start.log
          : >/tmp/tibia-runtime/gdb-from-start-events
          cat >/tmp/tibia-runtime/gdb-from-start.gdb <<'GDB'
          set pagination off
          set confirm off
          set breakpoint pending on
          set print thread-events off
          starti
          python
          import gdb,os
          inf=gdb.selected_inferior();pid=inf.pid
          rows=[]
          for line in open(f'/proc/{pid}/maps',errors='replace'):
              if '/packages/Tibia/bin/client' in line:
                  p=line.split()
                  if len(p)>=5: rows.append((int(p[2],16),int(p[0].split('-')[0],16)))
          if not rows: raise gdb.GdbError('PIE mapping unavailable')
          zero=[x for x in rows if x[0]==0];base=(zero[0] if zero else sorted(rows)[0])[1]
          gdb.write(f'PIE_BASE=0x{base:x}\n')
          ev='/tmp/tibia-runtime/gdb-from-start-events'
          def mark(name):
              open(ev,'a').write(name+'\n')
          class B(gdb.Breakpoint):
              def __init__(self,off,name,world=False):
                  super().__init__(f'*0x{base+off:x}');self.name=name;self.world=world
              def stop(self):
                  mark(self.name)
                  if self.world:
                      open('/tmp/tibia-runtime/worldmap-hit','w').write(self.name+'=true\n');self.enabled=False
                  return False
          for off,name in [
              (0xcfadd4,'LOGIN_STATE_MACHINE_STARTED'),(0xcfb2ff,'LOGIN_WAITING_DIALOG_ENTERED'),
              (0xcfb7c0,'ACCOUNT_LOGIN_UPLOADER_SUCCESS'),(0xcfb790,'ACCOUNT_LOGIN_UPLOADER_FAILED'),
              (0xcfb780,'ACCOUNT_LOGIN_MISSING_2FA_TOKEN'),(0xcfb770,'ACCOUNT_LOGIN_MISSING_EMAIL_CODE'),
              (0xcfb700,'ACCOUNT_LOGIN_MISSING_LOGIN_CONFIRMATION'),(0xcfb6f0,'ACCOUNT_LOGIN_INVALID_SERVER_RESPONSE'),
              (0xcfb6e0,'ACCOUNT_LOGIN_INVALID_DEVICE_COOKIE'),(0xcfb6c0,'ACCOUNT_LOGIN_CLIENT_OUT_OF_DATE'),
              (0xcfb41e,'TWO_FACTOR_TOKEN_STATE_ENTERED'),(0xcfb4a5,'DEVICE_VERIFICATION_CODE_STATE_ENTERED'),
              (0xcfb438,'TWO_FACTOR_EMAIL_STATE_ENTERED'),(0xcfb34e,'LOGIN_CONFIRMATION_STATE_ENTERED'),
              (0xcfb374,'CHARACTER_SELECTION_STATE_ENTERED'),(0xd47168,'CHARACTER_LIST_CHANGED'),
              (0xd47118,'SELECTED_CHARACTERS_CHANGED'),(0xd47130,'CHARACTER_SELECTION_CONFIRMED'),
              (0xcfb122,'START_GAMESERVER_LOGIN_STATE_ENTERED'),(0xcfa0e0,'GAMESERVER_TCP_CONNECTED'),
              (0xd06810,'CLIENT_CONNECT_GAMESERVER'),(0xd067b0,'CLIENT_ABORT_GAMESERVER_CONNECT'),
              (0xd066e0,'GAME_SESSION_CONNECTED'),(0xcfb404,'LOGIN_FAILED_STATE_ENTERED'),
              (0xcfaeb4,'LOGIN_FINISHED_SUCCESSFULLY')]: B(off,name)
          B(0xcec8d0,'FULLMAP_HANDLER_HIT',True);B(0xcd3190,'FIELDDATA_HANDLER_HIT',True)
          gdb.write('GDB_FROM_START_STRUCTURAL_BREAKPOINTS_READY=true\n')
          end
          continue
          GDB
          rm -f /tmp/tibia-runtime/worldmap-hit
          nohup env VK_ICD_FILENAMES="$VK_ICD_FILENAMES" VK_DRIVER_FILES="$VK_ICD_FILENAMES" LIBGL_ALWAYS_SOFTWARE=1 \
            proxychains4 -f /tmp/tibia-runtime/proxychains.conf \
            gdb -q -nx -x /tmp/tibia-runtime/gdb-from-start.gdb --args "$client" >/tmp/tibia-runtime/gdb-from-start.log 2>&1 </dev/null &
          echo $! >/tmp/tibia-runtime/gdb-start-pid
          for _ in $(seq 1 80);do grep -q 'GDB_FROM_START_STRUCTURAL_BREAKPOINTS_READY=true' /tmp/tibia-runtime/gdb-from-start.log 2>/dev/null&&break;sleep 0.5;done
          grep -q 'GDB_FROM_START_STRUCTURAL_BREAKPOINTS_READY=true' /tmp/tibia-runtime/gdb-from-start.log
          for _ in $(seq 1 80);do pgrep -x client >/dev/null&&break;sleep 0.5;done
          pid=$(pgrep -x client|head -n1);[[ -n "$pid" ]];echo "$pid">/tmp/tibia-runtime/client-pid
          echo GDB_FROM_START_CLIENT_RUNNING=true

      - name: Login and enter first character with structural gates only
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          pid=$(cat /tmp/tibia-runtime/client-pid)
          resolve() {
            local w g wi he
            for _ in $(seq 1 80);do
              for w in $(xdotool search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null||true);do
                g=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null||true);wi=$(printf '%s\n' "$g"|sed -n 's/^WIDTH=//p');he=$(printf '%s\n' "$g"|sed -n 's/^HEIGHT=//p')
                if [[ "$wi" == 1020 && "$he" == 650 ]];then echo "$w";return 0;fi
              done;sleep 0.5
            done;return 1
          }
          w=$(resolve);[[ -n "$w" ]];sleep 5
          xdotool windowactivate --sync "$w" 2>/dev/null||true
          xdotool mousemove --window "$w" 535 275 click 1;xdotool key --window "$w" ctrl+a;xdotool type --window "$w" --delay 3 -- "$TIBIA_TEST_EMAIL"
          xdotool mousemove --window "$w" 535 304 click 1;xdotool key --window "$w" ctrl+a;xdotool type --window "$w" --delay 3 -- "$TIBIA_TEST_PASSWORD"
          xdotool mousemove --window "$w" 590 388 click 1
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          echo GDB_FROM_START_LOGIN_SUBMITTED=true
          auth_tcp=0
          for n in $(seq 1 45);do
            sleep 1
            rows=$(ss -ntp 2>/dev/null|grep "pid=$pid,"||true)
            lc=$(printf '%s\n' "$rows"|awk '$5~/127\.0\.0\.1:25344$/||$5~/\[::1\]:25344$/{n++}END{print n+0}')
            ((lc>0))&&auth_tcp=1||true
            if grep -q 'CHARACTER_SELECTION_STATE_ENTERED' /tmp/tibia-runtime/gdb-from-start-events 2>/dev/null;then break;fi
          done
          echo AUTH_LOCAL_SOCKS_OBSERVED=$auth_tcp
          echo PRE_CHARACTER_EVENTS_BEGIN;cat /tmp/tibia-runtime/gdb-from-start-events||true;echo PRE_CHARACTER_EVENTS_END
          if ! grep -q 'CHARACTER_SELECTION_STATE_ENTERED' /tmp/tibia-runtime/gdb-from-start-events;then
            echo STRUCTURAL_CHARACTER_SELECTION=false
            exit 11
          fi
          echo STRUCTURAL_CHARACTER_SELECTION=true
          w=$(resolve);xdotool windowactivate --sync "$w" 2>/dev/null||true
          xdotool mousemove --window "$w" 285 193 click 1;sleep 0.4;xdotool key --window "$w" Return
          for _ in $(seq 1 25);do [[ -s /tmp/tibia-runtime/worldmap-hit ]]&&break;sleep 1;done
          if [[ ! -s /tmp/tibia-runtime/worldmap-hit ]];then
            w=$(resolve||true);if [[ -n "$w" ]];then xdotool mousemove --window "$w" 285 193 click --repeat 2 --delay 160 1||true;fi
            for _ in $(seq 1 35);do [[ -s /tmp/tibia-runtime/worldmap-hit ]]&&break;sleep 1;done
          fi
          echo POST_CHARACTER_EVENTS_BEGIN;cat /tmp/tibia-runtime/gdb-from-start-events||true;echo POST_CHARACTER_EVENTS_END
          kill -0 "$pid"

      - name: Require structural world entry and confinement
        shell: bash
        run: |
          set -Eeuo pipefail
          pid=$(cat /tmp/tibia-runtime/client-pid)
          echo FINAL_STRUCTURAL_EVENTS_BEGIN;cat /tmp/tibia-runtime/gdb-from-start-events||true;echo FINAL_STRUCTURAL_EVENTS_END
          last=$(tail -n1 /tmp/tibia-runtime/gdb-from-start-events 2>/dev/null||true);echo "LAST_STRUCTURAL_EVENT=${last:-NONE}"
          [[ -s /tmp/tibia-runtime/worldmap-hit ]];cat /tmp/tibia-runtime/worldmap-hit
          echo STRUCTURAL_IN_GAME=true
          tcp=$(ss -ntp 2>/dev/null|grep "pid=$pid,"||true);udp=$(ss -nup 2>/dev/null|grep "pid=$pid,"||true)
          direct=$(printf '%s\n' "$tcp"|awk '{print $5}'|grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$'|grep -c .||true);uc=$(printf '%s\n' "$udp"|grep -c .||true)
          echo "ACTIVE_DIRECT_TCP_COUNT=$direct";echo "ACTIVE_UDP_COUNT=$uc";[[ "$direct" == 0 && "$uc" == 0 ]];kill -0 "$pid"
          echo PHYSICAL_TIBIA_WORLD_LOGIN_PROVEN=true

name: Tibia hosted launcher runtime probe

on:
  push:
    branches:
      - ci/OTC-20260727-tibia-linux-runner-analysis
    paths:
      - .github/workflows/tibia-hosted-launcher-runtime-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Isolate launcher X11/proxy behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISPLAY: ':99'
      HOME: /home/runner/tibia-home

    steps:
      - name: Install bounded graphical and proxy runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl dbus-x11 file procps proxychains4 tar x11-utils xdotool xvfb \
            libasound2t64 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 libgl1 libglx0 \
            libnss3 libopengl0 libx11-6 libx11-xcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxi6 libxkbcommon-x11-0 libxrender1 libxtst6
          command -v tesseract >/dev/null 2>&1 && exit 1 || true
          echo OCR_BINARY_ABSENT=true

      - name: Establish WARP and download official launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/warp
          mkdir -p "$root/bin" "$root/state" /tmp/tibia-bootstrap /tmp/tibia-runtime "$HOME"
          chmod 700 "$root" "$root/state" /tmp/tibia-runtime "$HOME"
          cd "$root/bin"
          curl -fL --retry 3 --connect-timeout 10 -o wgcf \
            https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          chmod 755 wgcf
          curl -fL --retry 3 --connect-timeout 10 -o wireproxy.tar.gz \
            https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tar.gz' | sha256sum -c -
          mkdir extract
          tar -xzf wireproxy.tar.gz -C extract
          cp "$(find extract -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wireproxy
          cd "$root/state"
          "$root/bin/wgcf" register --accept-tos >/dev/null
          "$root/bin/wgcf" generate >/dev/null
          chmod 600 wgcf-account.toml wgcf-profile.conf
          cat >wireproxy.conf <<EOF
          WGConfig = $root/state/wgcf-profile.conf

          [Socks5]
          BindAddress = 127.0.0.1:25344
          EOF
          "$root/bin/wireproxy" -n -c wireproxy.conf
          nohup "$root/bin/wireproxy" -c wireproxy.conf >"$root/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/warp-trace 2>/dev/null && break
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' /tmp/warp-trace
          echo WARP_READY=true

          cat >/tmp/proxychains-base.conf <<'EOF'
          strict_chain
          proxy_dns
          quiet_mode
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks5 127.0.0.1 25344
          EOF
          cat >/tmp/proxychains-localnet.conf <<'EOF'
          strict_chain
          proxy_dns
          quiet_mode
          localnet 127.0.0.0/255.0.0.0
          localnet ::1/128
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks5 127.0.0.1 25344
          EOF

          cd /tmp/tibia-bootstrap
          url='https://static.tibia.com/download/tibia.x64.tar.gz'
          proxychains4 -f /tmp/proxychains-base.conf \
            curl --compressed -fL -C - --retry 0 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36' \
            -e "$url" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Cache-Control: no-cache' \
            "$url" -o tibia.x64.tar.gz
          tar xfz tibia.x64.tar.gz
          test -x Tibia/Tibia
          echo LAUNCHER_READY=true

      - name: Start Xvfb and prove direct launcher window
        shell: bash
        run: |
          set -Eeuo pipefail
          export XDG_CONFIG_HOME="$HOME/.config-direct"
          export XDG_DATA_HOME="$HOME/.local/share-direct"
          export XDG_CACHE_HOME="$HOME/.cache-direct"
          export LIBGL_ALWAYS_SOFTWARE=1 QT_XCB_GL_INTEGRATION=none
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          nohup Xvfb :99 -screen 0 1280x800x24 >/tmp/tibia-runtime/xvfb.log 2>&1 </dev/null &
          for _ in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :99 >/dev/null
          cd /tmp/tibia-bootstrap/Tibia
          : >/tmp/tibia-runtime/direct.log
          nohup dbus-run-session -- ./Tibia >/tmp/tibia-runtime/direct.log 2>&1 </dev/null &
          wrapper=$!
          wid=''
          for _ in $(seq 1 20); do
            wid=$(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null | head -n1 || true)
            [[ -n "$wid" ]] && break
            sleep 1
          done
          if [[ -n "$wid" ]]; then
            geom=$(xdotool getwindowgeometry --shell "$wid")
            echo DIRECT_LAUNCHER_WINDOW=true
            printf '%s\n' "$geom" | grep -E '^(WIDTH|HEIGHT)='
          else
            echo DIRECT_LAUNCHER_WINDOW=false
          fi
          pgrep -af '/Tibia$' | awk '{print "DIRECT_LAUNCHER_PROCESS_PRESENT=true"}' | head -n1 || true
          kill "$wrapper" 2>/dev/null || true
          pkill -f '/tmp/tibia-bootstrap/Tibia/Tibia' 2>/dev/null || true
          sleep 2

      - name: Prove proxychains localnet launcher window
        shell: bash
        run: |
          set -Eeuo pipefail
          export XDG_CONFIG_HOME="$HOME/.config-proxy"
          export XDG_DATA_HOME="$HOME/.local/share-proxy"
          export XDG_CACHE_HOME="$HOME/.cache-proxy"
          export LIBGL_ALWAYS_SOFTWARE=1 QT_XCB_GL_INTEGRATION=none
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          cd /tmp/tibia-bootstrap/Tibia
          : >/tmp/tibia-runtime/proxy.log
          nohup dbus-run-session -- proxychains4 -f /tmp/proxychains-localnet.conf ./Tibia >/tmp/tibia-runtime/proxy.log 2>&1 </dev/null &
          wrapper=$!
          wid=''
          for _ in $(seq 1 20); do
            wid=$(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null | head -n1 || true)
            [[ -n "$wid" ]] && break
            sleep 1
          done
          if [[ -n "$wid" ]]; then
            geom=$(xdotool getwindowgeometry --shell "$wid")
            echo PROXY_LOCALNET_LAUNCHER_WINDOW=true
            printf '%s\n' "$geom" | grep -E '^(WIDTH|HEIGHT)='
          else
            echo PROXY_LOCALNET_LAUNCHER_WINDOW=false
          fi
          pgrep -af '/Tibia$' | awk '{print "PROXY_LOCALNET_LAUNCHER_PROCESS_PRESENT=true"}' | head -n1 || true

          echo SAFE_DIRECT_LOG_SIGNATURES_BEGIN
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          for label,path in [('direct','/tmp/tibia-runtime/direct.log'),('proxy','/tmp/tibia-runtime/proxy.log')]:
              lines=Path(path).read_text(errors='replace').splitlines()[-100:]
              for line in lines:
                  lo=line.lower()
                  cats=[k for k in ('xcb','x11','display','egl','glx','vulkan','failed','error','proxy','socket','network','qt','dbus') if k in lo]
                  if cats:
                      print(label+'_cats='+','.join(sorted(set(cats)))+';sha='+hashlib.sha256(line.encode()).hexdigest()[:12])
          PY
          echo SAFE_DIRECT_LOG_SIGNATURES_END
          [[ -n "$wid" ]]

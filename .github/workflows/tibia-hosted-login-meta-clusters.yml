name: Tibia hosted login meta clusters

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-login-meta-clusters.yml]

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); assert hashlib.sha256(b).hexdigest()=='496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b'
          q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little'); f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}
          o=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f]); pathlib.Path('/tmp/c/client').write_bytes(o)
          PY
      - shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          c=Path('/tmp/c/client'); raw=c.read_bytes()
          with c.open('rb') as f:
            elf=ELFFile(f); secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr'])) for s in elf.iter_sections()]
          def vaoff(va):
            for n,o,z,v in secs:
              if v<=va<v+z: return o+(va-v),n
            raise ValueError(hex(va))
          centers=[0x1ca3e65,0x1ca3d0d,0x1c8bd7a,0x1c8bdff,0x1c8bbc8,0x1c9429f,0x1c942bb,0x1c9411b,0x1c943aa,0x1c868a2,0x1cfde35,0x1c92a20,0x1c92d00,0x1c759bd,0x1cf4961]
          def strings_around(va,radius=0x900):
            off,sec=vaoff(va); lo=max(0,off-radius); hi=min(len(raw),off+radius); chunk=raw[lo:hi]
            out=[]; start=None
            for i,b in enumerate(chunk+b'\x00'):
              ok=(32<=b<127)
              if ok and start is None: start=i
              elif not ok and start is not None:
                s=chunk[start:i]
                if len(s)>=4:
                  sva=None
                  try:
                    abs_off=lo+start
                    for n,o,z,v in secs:
                      if o<=abs_off<o+z: sva=v+(abs_off-o); break
                  except: pass
                  if sva is not None: out.append((sva,s.decode('ascii','replace')))
                start=None
            return sec,out
          for center in centers:
            sec,rows=strings_around(center)
            print(f'CLUSTER_BEGIN center=0x{center:x} section={sec}')
            for va,s in rows:
              low=s.lower()
              if any(k in low for k in ('login','character','game','server','session','connect','abort','fail','anti','battle','select','world','account','state','controller','credential','auth')):
                print(f'  0x{va:x} {s[:220]}')
            print('CLUSTER_END')
          PY

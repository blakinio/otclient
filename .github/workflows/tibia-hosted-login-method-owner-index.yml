name: Tibia hosted login Qt method owner index

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-login-method-owner-index.yml]

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and decode exact client through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils curl python3-capstone python3-pyelftools
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/c/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; out=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert len(out)==51965216 and hashlib.sha256(out).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          pathlib.Path('/tmp/c/client').write_bytes(out)
          print('OFFICIAL_CLIENT_SHA256_VERIFIED=true')
          PY

      - name: Index QMetaObject owners for login and session methods
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86_const import X86_OP_MEM, X86_OP_REG, X86_REG_RIP
          import struct

          client=Path('/tmp/c/client'); raw=client.read_bytes()
          WORLD_QMETA=0x3087800; WORLD_STRING=0x1cd8a54; WORLD_META=0x1cd8820; WORLD_STATIC=0xdf2a60
          interesting={
            'requestCharacterLogin','onCharacterSelectionConfirmed',
            'onStartGameServerLoginStateEntered','onConnectClientToGameserver','onAbortConnectClientToGameserver',
            'connectClientToGameserverWithExistingCredentials','connectToGameSession','onGameSessionConnected',
            'onGameLoginSuccessful','onLoginAbortedStateEntered','onLoginFailedStateEntered','onNetworkError',
            'onGameserverTCPConnectionConnected','onGameserverTCPConnectionSecondaryConnected','onGameserverTCPConnectionDisconnected',
            'onCharacterConfigurationLoaded','onGameReadyForSecondaryConnection','onClientCheckTimerElapsed'
          }
          class_terms=('gameserver','login','session','characterselection','authentication','networkpacketconnection','tcpconnection')

          with client.open('rb') as f:
            elf=ELFFile(f)
            secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]

          def va_to_off(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z: return o+(va-v),n
            raise ValueError
          def mapped(va): return any(v<=va<v+z for _,_,z,v,_ in secs)
          def executable(va): return any((fl&0x4) and v<=va<v+z for _,_,z,v,fl in secs)
          def u32(va): return struct.unpack_from('<I',raw,va_to_off(va)[0])[0]
          def i32(va): return struct.unpack_from('<i',raw,va_to_off(va)[0])[0]

          qoff,_=va_to_off(WORLD_QMETA); fields={}
          for delta in range(0,0x80,8):
            val=struct.unpack_from('<Q',raw,qoff+delta)[0]
            if val==WORLD_STRING: fields['string']=delta
            if val==WORLD_META: fields['meta']=delta
            if val==WORLD_STATIC: fields['static']=delta
          assert fields=={'string':8,'meta':16,'static':24}, fields
          print('QMETA_LAYOUT_VERIFIED=true')

          def parse(string_va,meta_va):
            try: hdr=[u32(meta_va+i*4) for i in range(14)]
            except Exception: return None
            rev,class_idx,ci_count,ci_data,mc,md,pc,pd,ec,ed,cc,cd,flags,signals=hdr
            if rev>20 or mc>1024 or md>131072 or class_idx>8192 or signals>mc: return None
            try:
              def qs(idx):
                entry=string_va+idx*8; rel=u32(entry); size=u32(entry+4)
                if size>8192 or rel>(1<<21): raise ValueError
                off,_=va_to_off(string_va+rel)
                return raw[off:off+size].decode('utf-8','replace')
              cls=qs(class_idx); methods=[]
              for mi in range(mc):
                base=meta_va+(md+mi*6)*4; row=[u32(base+k*4) for k in range(6)]
                methods.append((mi,qs(row[0])))
              return cls,methods,signals
            except Exception: return None

          found=[]; seen=set(); max_field=max(fields.values())
          for sec,off,size,va,flags in secs:
            if flags&0x4 or size<max_field+8: continue
            for rel in range(0,size-max_field-7,8):
              qmeta=va+rel
              try:
                s=struct.unpack_from('<Q',raw,off+rel+fields['string'])[0]
                m=struct.unpack_from('<Q',raw,off+rel+fields['meta'])[0]
                st=struct.unpack_from('<Q',raw,off+rel+fields['static'])[0]
              except struct.error: continue
              if not mapped(s) or not mapped(m) or not executable(st): continue
              p=parse(s,m)
              if not p: continue
              cls,methods,signals=p; key=(qmeta,s,m,st,cls)
              if key in seen: continue
              seen.add(key)
              names={n for _,n in methods}
              if names & interesting or any(t in cls.lower() for t in class_terms):
                found.append((cls,qmeta,s,m,st,methods,signals,sec))

          print('RELEVANT_QMETAOBJECTS_BEGIN')
          for cls,qmeta,s,m,st,methods,signals,sec in sorted(found):
            hits=[(i,n) for i,n in methods if n in interesting]
            print(f'CLASS={cls} QMETA=0x{qmeta:x} STRING=0x{s:x} META=0x{m:x} STATIC=0x{st:x} SIGNAL_COUNT={signals} SECTION={sec}')
            print('  METHODS='+','.join(f'{i}:{n}' for i,n in methods))
            if hits: print('  INTERESTING='+','.join(f'{i}:{n}' for i,n in hits))
          print('RELEVANT_QMETAOBJECTS_END')

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          print('INTERESTING_DISPATCH_BEGIN')
          proved=0
          for cls,qmeta,s,m,st,methods,signals,sec in sorted(found):
            hits=[(i,n) for i,n in methods if n in interesting]
            if not hits: continue
            off,_=va_to_off(st); insns=list(md.disasm(raw[off:off+0x240],st)); candidates=[]
            for pos,ins in enumerate(insns):
              if ins.mnemonic!='lea' or len(ins.operands)<2 or ins.operands[0].type!=X86_OP_REG or ins.operands[1].type!=X86_OP_MEM: continue
              mem=ins.operands[1].mem
              if mem.base!=X86_REG_RIP: continue
              reg=ins.operands[0].reg; table=ins.address+ins.size+mem.disp
              used=any(any(op.type==X86_OP_MEM and op.mem.base==reg and op.mem.scale==4 for op in later.operands) for later in insns[pos+1:pos+8])
              if not used: continue
              try:
                targets=[table+i32(table+mi*4) for mi in range(len(methods))]
                score=sum(executable(x) for x in targets)
                candidates.append((score,table,targets))
              except Exception: pass
            candidates.sort(reverse=True)
            print(f'OWNER class={cls} static=0x{st:x}')
            if candidates and candidates[0][0]==len(methods):
              score,table,targets=candidates[0]
              print(f'  JUMP_TABLE=0x{table:x} EXECUTABLE={score}/{len(methods)}')
              for i,n in hits:
                print(f'  TARGET index={i} name={n} target=0x{targets[i]:x}')
                proved+=1
            else:
              best=candidates[0][0] if candidates else 0
              for i,n in hits:
                print(f'  TARGET_UNPROVEN index={i} name={n} static_metacall=0x{st:x} best_jump_score={best}/{len(methods)}')
          print('INTERESTING_DISPATCH_END')
          print('INTERESTING_METHODS_WITH_DIRECT_TARGET='+str(proved))
          if not any(any(n in interesting for _,n in methods) for _,_,_,_,_,methods,_,_ in found):
            raise SystemExit('no interesting Qt methods recovered')
          PY
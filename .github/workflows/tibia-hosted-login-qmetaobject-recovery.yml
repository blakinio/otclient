name: Tibia hosted login QMetaObject recovery

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-login-qmetaobject-recovery.yml]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and decode exact client through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils curl python3-pyelftools
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/c/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; out=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert len(out)==51965216 and hashlib.sha256(out).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          pathlib.Path('/tmp/c/client').write_bytes(out)
          PY

      - name: Learn QMetaObject field layout from proven Worldmap control and recover target classes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          import struct, subprocess, re

          client=Path('/tmp/c/client'); raw=client.read_bytes()
          WORLD_QMETA=0x3087800
          WORLD_STRING=0x1cd8a54
          WORLD_META=0x1cd8820
          WORLD_STATIC=0xdf2a60
          WORLD_CLASS='tibia::worldmap::TWorldmapProtocolMessageHandler'
          TARGETS={
              'tibia::gamewindow::TCharacterSelectionController': {'required':['onCharacterSelectionConfirmed','requestCharacterLogin']},
              'tibia::authentication::TGameserverLoginProcessController': {'required':['onStartGameServerLoginStateEntered','onConnectClientToGameserver','onAbortConnectClientToGameserver']},
              'tibia::client::TAntiCheatController': {'required':[]},
              'tibia::game::TGameserverGameSession': {'required':['connectToGameSession','onGameSessionConnected']},
          }
          with client.open('rb') as f:
              elf=ELFFile(f)
              secs=[]
              for s in elf.iter_sections():
                  secs.append((s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])))

          def va_to_off(va):
              for n,o,z,v,fl in secs:
                  if v<=va<v+z: return o+(va-v),n
              raise ValueError(f'VA 0x{va:x} unmapped')
          def off_to_va(off):
              for n,o,z,v,fl in secs:
                  if o<=off<o+z: return v+(off-o),n
              return None,None
          def mapped(va):
              return any(v<=va<v+z for _,_,z,v,_ in secs)
          def executable(va):
              return any((fl&0x4) and v<=va<v+z for _,_,z,v,fl in secs)
          def qword_va(va): return struct.unpack_from('<Q',raw,va_to_off(va)[0])[0]
          def u32_va(va): return struct.unpack_from('<I',raw,va_to_off(va)[0])[0]
          def i32_va(va): return struct.unpack_from('<i',raw,va_to_off(va)[0])[0]

          print('CONTROL_QMETAOBJECT_BEGIN')
          qoff,_=va_to_off(WORLD_QMETA)
          field_hits={}
          for delta in range(0,0x80,8):
              val=struct.unpack_from('<Q',raw,qoff+delta)[0]
              print(f'WORLD_QWORD delta=0x{delta:x} value=0x{val:x} mapped={mapped(val)} executable={executable(val)}')
              if val==WORLD_STRING: field_hits['string']=delta
              if val==WORLD_META: field_hits['meta']=delta
              if val==WORLD_STATIC: field_hits['static']=delta
          print('CONTROL_FIELD_OFFSETS='+','.join(f'{k}=0x{v:x}' for k,v in sorted(field_hits.items())))
          if set(field_hits)!={'string','meta','static'}:
              raise SystemExit(f'Could not learn complete QMetaObject layout: {field_hits}')

          def parse_meta(string_va,meta_va):
              try:
                  hdr=[u32_va(meta_va+i*4) for i in range(14)]
              except Exception: return None
              revision,class_idx,ci_count,ci_data,method_count,method_data,prop_count,prop_data,enum_count,enum_data,ctor_count,ctor_data,flags,signal_count=hdr
              if revision>20 or method_count>512 or method_data>65536 or class_idx>4096 or signal_count>method_count:
                  return None
              try:
                  def qstr(idx):
                      entry=string_va+idx*8
                      rel=u32_va(entry); size=u32_va(entry+4)
                      if size>8192 or rel>1<<20: raise ValueError('bad qstr')
                      off,_=va_to_off(string_va+rel)
                      return raw[off:off+size].decode('utf-8','replace')
                  cls=qstr(class_idx)
                  methods=[]
                  for idx in range(method_count):
                      base=meta_va+(method_data+idx*6)*4
                      row=[u32_va(base+k*4) for k in range(6)]
                      name=qstr(row[0])
                      methods.append((idx,name,row))
                  return {'header':hdr,'class':cls,'methods':methods,'qstr':qstr}
              except Exception:
                  return None

          control=parse_meta(WORLD_STRING,WORLD_META)
          if not control or control['class']!=WORLD_CLASS:
              raise SystemExit(f'Worldmap control failed: {None if not control else control["class"]!r}')
          print(f'CONTROL_CLASS={control["class"]}')
          print('CONTROL_METHODS='+','.join(f'{i}:{n}' for i,n,_ in control['methods']))
          print('CONTROL_QMETAOBJECT_END')

          # Scan writable/readonly data sections at qword alignment for structures whose
          # learned string/meta/static slots form a valid Qt metaobject and decode a target class.
          max_field=max(field_hits.values())
          found={}
          print('TARGET_QMETAOBJECT_SCAN_BEGIN')
          for sec,off,size,va,flags in secs:
              # Skip executable code and tiny sections; QMetaObject lives in mapped data.
              if flags&0x4 or size<max_field+8: continue
              for rel in range(0,size-max_field-7,8):
                  cand_va=va+rel
                  try:
                      string_va=struct.unpack_from('<Q',raw,off+rel+field_hits['string'])[0]
                      meta_va=struct.unpack_from('<Q',raw,off+rel+field_hits['meta'])[0]
                      static_va=struct.unpack_from('<Q',raw,off+rel+field_hits['static'])[0]
                  except struct.error: continue
                  if not mapped(string_va) or not mapped(meta_va) or not executable(static_va): continue
                  parsed=parse_meta(string_va,meta_va)
                  if not parsed or parsed['class'] not in TARGETS: continue
                  cls=parsed['class']
                  methods=[n for _,n,_ in parsed['methods']]
                  req=TARGETS[cls]['required']
                  if req and not all(x in methods for x in req):
                      print(f'REJECT class={cls} qmeta=0x{cand_va:x} missing_required=true methods={methods}')
                      continue
                  key=(cand_va,string_va,meta_va,static_va)
                  if key in found.setdefault(cls,set()): continue
                  found[cls].add(key)
                  print(f'FOUND class={cls} qmeta=0x{cand_va:x} section={sec} string=0x{string_va:x} meta=0x{meta_va:x} static_metacall=0x{static_va:x}')
                  print('  METHODS='+','.join(f'{i}:{n}' for i,n,_ in parsed['methods']))
                  print('  HEADER='+' '.join(map(str,parsed['header'])))
          print('TARGET_QMETAOBJECT_SCAN_END')

          missing=[x for x in TARGETS if not found.get(x)]
          if missing:
              print('MISSING_TARGET_CLASSES='+','.join(missing))
          else:
              print('ALL_TARGET_QMETAOBJECTS_FOUND=true')

          # Emit bounded disassembly of unique recovered static_metacall functions and
          # identify compare/jump-table candidates. No runtime modification is performed.
          print('STATIC_METACALL_DISASSEMBLY_BEGIN')
          unique=[]
          for cls,rows in found.items():
              for q,s,m,st in rows:
                  if st not in unique: unique.append(st)
          for st in unique:
              print(f'STATIC_METACALL=0x{st:x}')
              txt=subprocess.check_output(['objdump','-d','-C',f'--start-address={st}',f'--stop-address={st+0x900}',str(client)],text=True,errors='replace')
              lines=txt.splitlines()
              for line in lines[:500]: print('  '+line)
              # Surface bounded candidate indirect jump tables from RIP-relative jmp instructions.
              for line in lines:
                  mm=re.search(r'^\s*([0-9a-f]+):.*\bjmp\s+\*([^#]+)#\s*([0-9a-fx]+)',line)
                  if mm: print('  INDIRECT_JMP='+line.strip())
          print('STATIC_METACALL_DISASSEMBLY_END')

          # Fail only if the two critical login/selection controllers were not recovered.
          critical=['tibia::gamewindow::TCharacterSelectionController','tibia::authentication::TGameserverLoginProcessController']
          if any(not found.get(x) for x in critical):
              raise SystemExit('critical QMetaObject recovery incomplete')
          print('CRITICAL_LOGIN_QMETAOBJECTS_RECOVERED=true')
          PY

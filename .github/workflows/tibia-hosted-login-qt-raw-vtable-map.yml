name: Tibia hosted login Qt raw vtable map

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-login-qt-raw-vtable-map.yml]

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch and decode exact client through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils curl python3-pyelftools
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); assert hashlib.sha256(b).hexdigest()=='496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b'
          q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; out=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert hashlib.sha256(out).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'; pathlib.Path('/tmp/c/client').write_bytes(out)
          PY

      - name: Raw scan linked image for Qt metacast pointers and neighbors
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          import struct, subprocess

          client=Path('/tmp/c/client'); raw=client.read_bytes()
          candidates={
            'TGameserverLoginProcessController':0xd0e1d0,
            'TCharacterSelectionController':0xd4abd0,
            'TAntiCheatController':0xd038c0,
            'TGameserverGameSession':0xd4a710,
          }
          with client.open('rb') as f:
            elf=ELFFile(f)
            secs=[]; exec_ranges=[]
            for s in elf.iter_sections():
              off=int(s['sh_offset']); size=int(s['sh_size']); va=int(s['sh_addr']); flags=int(s['sh_flags'])
              secs.append((s.name,off,size,va,flags))
              if flags&0x4 and size: exec_ranges.append((va,va+size,s.name))
          def off_to_va(off):
            for n,o,z,v,fl in secs:
              if o<=off<o+z: return v+(off-o),n,fl
            return None,None,None
          def exec_section(va):
            return next((n for a,b,n in exec_ranges if a<=va<b),None)
          print('RAW_QT_VTABLE_SCAN_BEGIN')
          for name,target in candidates.items():
            needle=struct.pack('<Q',target); matches=[]; start=0
            while True:
              p=raw.find(needle,start)
              if p<0: break
              matches.append(p); start=p+1
            print(f'CLASS={name} TARGET=0x{target:x} RAW_MATCHES={len(matches)}')
            for m in matches[:16]:
              va,sec,flags=off_to_va(m)
              print(f'  MATCH fileoff=0x{m:x} va={"none" if va is None else hex(va)} section={sec} flags={flags}')
              lo=max(0,m-20*8); hi=min(len(raw),m+21*8)
              for off in range(lo,hi,8):
                val=struct.unpack_from('<Q',raw,off)[0]
                oval,osec,oflags=off_to_va(off)
                kind='EXEC' if exec_section(val) else ('DATA' if any(v<=val<v+z for _,_,z,v,_ in secs) else 'OTHER')
                delta=off-m
                print(f'    QWORD delta={delta:+#x} slot_va={"none" if oval is None else hex(oval)} slot_section={osec} value=0x{val:x} kind={kind} target_section={exec_section(val) or "-"}')
              # Disassemble executable neighbors only.
              vals=[]
              for off in range(lo,hi,8):
                val=struct.unpack_from('<Q',raw,off)[0]
                if exec_section(val) and val not in vals: vals.append(val)
              for val in vals[:18]:
                print(f'    DISASM=0x{val:x}')
                text=subprocess.check_output(['objdump','-d','-C',f'--start-address={val}',f'--stop-address={val+0x100}',str(client)],text=True,errors='replace')
                for line in text.splitlines()[:60]: print('      '+line)
          print('RAW_QT_VTABLE_SCAN_END')

          # Independent bounded disassembly around candidate qt_metacast bodies and nearby function boundaries.
          print('QTMETACAST_NEIGHBOR_DISASSEMBLY_BEGIN')
          for name,target in candidates.items():
            print(f'CLASS={name} CENTER=0x{target:x}')
            text=subprocess.check_output(['objdump','-d','-C',f'--start-address={max(0,target-0x300)}',f'--stop-address={target+0x500}',str(client)],text=True,errors='replace')
            print(text)
          print('QTMETACAST_NEIGHBOR_DISASSEMBLY_END')
          PY

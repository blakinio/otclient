name: Tibia hosted login Qt vtable map

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-login-qt-vtable-map.yml]

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils curl python3-pyelftools
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); assert hashlib.sha256(b).hexdigest()=='496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b'
          q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; o=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert hashlib.sha256(o).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'; pathlib.Path('/tmp/c/client').write_bytes(o)
          PY

      - name: Resolve vtable neighbors and Qt metacall candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          import subprocess

          client=Path('/tmp/c/client')
          classes={
            'TGameserverLoginProcessController':0xd0e1d0,
            'TCharacterSelectionController':0xd4abd0,
            'TAntiCheatController':0xd038c0,
            'TGameserverGameSession':0xd4a710,
          }
          with client.open('rb') as f:
            elf=ELFFile(f)
            exec_ranges=[]; reloc=[]
            for s in elf.iter_sections():
              if int(s['sh_flags']) & 0x4 and int(s['sh_size']):
                exec_ranges.append((int(s['sh_addr']),int(s['sh_addr'])+int(s['sh_size']),s.name))
              if s['sh_type'] in ('SHT_RELA','SHT_REL'):
                is_rela=s['sh_type']=='SHT_RELA'
                for r in s.iter_relocations():
                  add=int(r['r_addend']) if is_rela else None
                  reloc.append((int(r['r_offset']),add,s.name))
          reloc.sort()
          def ex(va):
            return next((n for a,b,n in exec_ranges if a<=va<b),None)
          print('QT_VTABLE_MAP_BEGIN')
          for name,cast in classes.items():
            matches=[(i,r) for i,r in enumerate(reloc) if r[1]==cast]
            print(f'CLASS={name} QTMETACAST=0x{cast:x} RELOC_MATCHES={len(matches)}')
            for idx,(off,add,rsec) in matches[:8]:
              print(f'  MATCH reloc_offset=0x{off:x} reloc_section={rsec}')
              near=[r for r in reloc if off-0x90<=r[0]<=off+0x90]
              for ro,ra,rs in near:
                if ra is None: continue
                mark='EXEC' if ex(ra) else 'DATA'
                print(f'    NEAR delta={ro-off:+#x} reloc=0x{ro:x} addend=0x{ra:x} kind={mark} section={ex(ra) or rs}')
              cands=[]
              for ro,ra,rs in near:
                if ra is not None and ex(ra) and ra not in cands: cands.append(ra)
              for va in cands:
                print(f'    DISASM_CANDIDATE=0x{va:x}')
                text=subprocess.check_output(['objdump','-d','-C',f'--start-address={va}',f'--stop-address={va+0x180}',str(client)],text=True,errors='replace')
                for line in text.splitlines()[:90]: print('      '+line)
          print('QT_VTABLE_MAP_END')
          PY

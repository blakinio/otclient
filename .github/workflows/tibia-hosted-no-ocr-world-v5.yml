name: Tibia hosted strict no-OCR world entry v5

on:
  push:
    branches:
      - ci/OTC-20260727-tibia-linux-runner-analysis
    paths:
      - .github/workflows/tibia-hosted-no-ocr-world-v5.yml
      - .github/scripts/tibia-hosted-no-ocr-auth-v2.sh
      - .github/scripts/tibia-hosted-no-ocr-runtime.sh
      - .github/scripts/tibia-package-reconstruct.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DISPLAY: ':99'
      HOME: /home/runner/tibia-world-home
      TIBIA_PACKAGE_VERSION: 15.32.df7b29
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      TIBIA_BASE_URL: https://static.tibia.com/launcher/tibiaclient-linux-current

    steps:
      - name: Check out operational helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install bounded runtime with OCR forbidden
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gdb iproute2 procps proxychains4 x11-utils xdotool xvfb \
            libasound2t64 libatk1.0-0 libatspi2.0-0 libcups2 libdbus-1-3 libdrm2 libegl1 libfontconfig1 \
            libfreetype6 libgbm1 libgl1 libglx0 libgtk-3-0 libnspr4 libnss3 libopengl0 libpulse0 libvulkan1 \
            libx11-6 libx11-xcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxi6 \
            libxkbcommon-x11-0 libxrandr2 libxrender1 libxtst6 mesa-vulkan-drivers vulkan-tools
          command -v tesseract >/dev/null 2>&1 && { echo FORBIDDEN_OCR_BINARY_PRESENT=true; exit 1; } || true
          chmod +x .github/scripts/tibia-hosted-no-ocr-runtime.sh .github/scripts/tibia-hosted-no-ocr-auth-v2.sh .github/scripts/tibia-package-reconstruct.py
          echo OCR_BINARY_ABSENT=true

      - name: Establish verified changed WARP egress
        shell: bash
        run: .github/scripts/tibia-hosted-no-ocr-runtime.sh warp

      - name: Reconstruct exact official package from signed manifest hashes
        shell: bash
        env:
          TIBIA_MANIFEST: /tmp/tibia-package/package.json
          TIBIA_PACKAGE_OUT: /home/runner/tibia-world-home/.local/share/CipSoft GmbH/Tibia/packages/Tibia
          TIBIA_SOCKS: 127.0.0.1:25344
          TIBIA_DOWNLOAD_WORKERS: '6'
        run: |
          set -Eeuo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          curl --socks5-hostname 127.0.0.1:25344 --http1.1 --compressed -fL --retry 4 --retry-all-errors \
            -A "$ua" -e "$TIBIA_BASE_URL/package.json" -H 'Accept: */*' \
            "$TIBIA_BASE_URL/package.json" -o /tmp/tibia-package/package.json
          python3 - <<'PY'
          import json, os, pathlib
          d=json.loads(pathlib.Path('/tmp/tibia-package/package.json').read_text())
          if d.get('version') != os.environ['TIBIA_PACKAGE_VERSION']:
              raise SystemExit('package version mismatch')
          PY
          mkdir -p "$TIBIA_PACKAGE_OUT"
          python3 .github/scripts/tibia-package-reconstruct.py
          client="$TIBIA_PACKAGE_OUT/bin/client"
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo EXACT_OFFICIAL_CLIENT_AND_RUNTIME_VERIFIED=true

      - name: Launch exact client through WARP without OCR
        shell: bash
        run: .github/scripts/tibia-hosted-no-ocr-runtime.sh launch

      - name: Type credentials enter first character and require decoded map proof
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: .github/scripts/tibia-hosted-no-ocr-auth-v2.sh

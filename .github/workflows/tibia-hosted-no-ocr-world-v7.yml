name: Tibia hosted strict no-OCR world entry v7

on:
  push:
    branches:
      - ci/OTC-20260727-tibia-linux-runner-analysis
    paths:
      - .github/workflows/tibia-hosted-no-ocr-world-v7.yml
      - .github/scripts/tibia-hosted-no-ocr-launch-v2.sh
      - .github/scripts/tibia-hosted-no-ocr-auth-v2.sh
      - .github/scripts/tibia-hosted-no-ocr-runtime.sh
      - .github/scripts/tibia-package-reconstruct.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DISPLAY: ':99'
      HOME: /home/runner/tibia-world-home
      TIBIA_PACKAGE_VERSION: 15.32.df7b29
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      TIBIA_BASE_URL: https://static.tibia.com/launcher/tibiaclient-linux-current
      TIBIA_ASSET_BASE_URL: https://static.tibia.com/launcher/assets-current

    steps:
      - name: Check out operational helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install bounded runtime with OCR forbidden
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gdb iproute2 procps proxychains4 x11-utils xdotool xvfb \
            libasound2t64 libatk1.0-0 libatspi2.0-0 libcups2 libdbus-1-3 libdrm2 libegl1 libfontconfig1 \
            libfreetype6 libgbm1 libgl1 libglx0 libgtk-3-0 libnspr4 libnss3 libopengl0 libpulse0 libvulkan1 \
            libx11-6 libx11-xcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxi6 \
            libxkbcommon-x11-0 libxrandr2 libxrender1 libxtst6 mesa-vulkan-drivers vulkan-tools
          command -v tesseract >/dev/null 2>&1 && { echo FORBIDDEN_OCR_BINARY_PRESENT=true; exit 1; } || true
          chmod +x .github/scripts/tibia-hosted-no-ocr-runtime.sh \
            .github/scripts/tibia-hosted-no-ocr-launch-v2.sh \
            .github/scripts/tibia-hosted-no-ocr-auth-v2.sh \
            .github/scripts/tibia-package-reconstruct.py
          echo OCR_BINARY_ABSENT=true

      - name: Establish verified changed WARP egress
        shell: bash
        run: .github/scripts/tibia-hosted-no-ocr-runtime.sh warp

      - name: Fetch package and asset manifests through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/tibia-package
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          fetch() {
            local url="$1" out="$2"
            curl --socks5-hostname 127.0.0.1:25344 --http1.1 --compressed -fL \
              --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 20 --max-time 300 \
              -A "$ua" -e "$url" -H 'Accept: */*' "$url" -o "$out"
          }
          fetch "$TIBIA_BASE_URL/package.json" /tmp/tibia-package/package.json
          fetch "$TIBIA_ASSET_BASE_URL/assets.json" /tmp/tibia-package/assets.json
          python3 - <<'PY'
          import json, os, pathlib
          pkg=json.loads(pathlib.Path('/tmp/tibia-package/package.json').read_text())
          assets=json.loads(pathlib.Path('/tmp/tibia-package/assets.json').read_text())
          if pkg.get('version') != os.environ['TIBIA_PACKAGE_VERSION']:
              raise SystemExit('package version mismatch')
          def count(v, require_unpacked):
              n=0
              if isinstance(v,dict):
                  url=v.get('url'); packed=v.get('packedhash'); unpacked=v.get('unpackedhash')
                  if isinstance(url,str) and url and isinstance(packed,str) and packed:
                      if not require_unpacked or (isinstance(unpacked,str) and unpacked):
                          n+=1
                  for x in v.values(): n+=count(x,require_unpacked)
              elif isinstance(v,list):
                  for x in v: n+=count(x,require_unpacked)
              return n
          pn=count(pkg,True); an=count(assets,False); ah=count(assets,True)
          print(f'PACKAGE_MANIFEST_ENTRY_COUNT={pn}')
          print(f'ASSET_MANIFEST_PACKEDHASH_ENTRY_COUNT={an}')
          print(f'ASSET_MANIFEST_UNPACKEDHASH_ENTRY_COUNT={ah}')
          if pn != 1634 or an != 7094:
              raise SystemExit('unexpected manifest cardinality')
          PY

      - name: Reconstruct exact official package from signed hashes
        shell: bash
        env:
          TIBIA_MANIFEST: /tmp/tibia-package/package.json
          TIBIA_PACKAGE_OUT: /home/runner/tibia-world-home/.local/share/CipSoft GmbH/Tibia/packages/Tibia
          TIBIA_SOCKS: 127.0.0.1:25344
          TIBIA_DOWNLOAD_WORKERS: '6'
        run: |
          set -Eeuo pipefail
          mkdir -p "$TIBIA_PACKAGE_OUT"
          python3 .github/scripts/tibia-package-reconstruct.py
          client="$TIBIA_PACKAGE_OUT/bin/client"
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo EXACT_OFFICIAL_PACKAGE_VERIFIED=true

      - name: Reconstruct all official assets from packed hashes
        shell: bash
        env:
          TIBIA_BASE_URL: https://static.tibia.com/launcher/assets-current
          TIBIA_MANIFEST: /tmp/tibia-package/assets.json
          TIBIA_PACKAGE_OUT: /home/runner/tibia-world-home/.local/share/CipSoft GmbH/Tibia/packages/Tibia
          TIBIA_SOCKS: 127.0.0.1:25344
          TIBIA_DOWNLOAD_WORKERS: '10'
          TIBIA_ALLOW_MISSING_UNPACKED_HASH: '1'
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/tibia-package-reconstruct.py
          root="$TIBIA_PACKAGE_OUT"
          [[ -s "$root/assets/catalog-content.json" ]]
          [[ -s "$root/sounds/catalog-sound.json" ]]
          client="$root/bin/client"
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo COMPLETE_OFFICIAL_PACKAGE_AND_ASSETS_VERIFIED=true

      - name: Launch exact client at proven login geometry without debugger
        shell: bash
        run: .github/scripts/tibia-hosted-no-ocr-launch-v2.sh

      - name: Type credentials enter first character and require decoded map proof
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: .github/scripts/tibia-hosted-no-ocr-auth-v2.sh

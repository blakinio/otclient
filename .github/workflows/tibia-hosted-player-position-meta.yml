name: Tibia hosted player position Qt metadata

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-player-position-meta.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client through WARP and inspect position-bearing metaobjects
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools
          r=/tmp/w;mkdir -p "$r/bin" "$r/state" /tmp/c;cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf'|sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz'|sha256sum -c -
          mkdir x;tar -xzf wp.tgz -C x;cp "$(find x -type f -name wireproxy -print -quit)" wireproxy;chmod 755 wgcf wireproxy
          cd "$r/state";"$r/bin/wgcf" register --accept-tos >/dev/null;"$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf">w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30);do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null&&break;sleep 2;done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct
          from elftools.elf.elffile import ELFFile
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes();q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          flt={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb};raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[flt])
          digest=hashlib.sha256(raw).hexdigest();print('CLIENT_SHA256='+digest)
          p=pathlib.Path('/tmp/c/client');p.write_bytes(raw)
          with p.open('rb') as fh:
            elf=ELFFile(fh);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def vo(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError
          def u32(va):return struct.unpack_from('<I',raw,vo(va))[0]
          def mapped(va):return any(v<=va<v+z for _,_,z,v,_ in secs)
          def exe(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          targets={
            'tibia::game::TCreature','tibia::game::TPlayerData','tibia::creatures::TCreatureStorage',
            'tibia::cyclopedia::TCyclopediaMapStorage','tibia::minimap::TMinimapController',
            'tibia::player::TPlayerInventoryAndStatusController','tibia::game::TPlayerSkillStats'
          }
          found={}
          for sec,off,size,va,fl in secs:
            if fl&4 or size<32:continue
            for rel in range(0,size-32,8):
              try:s,m,st=struct.unpack_from('<QQQ',raw,off+rel+8)
              except:continue
              if not(mapped(s) and mapped(m) and exe(st)):continue
              try:
                h=[u32(m+i*4) for i in range(14)];rev,ci,cic,cid,mc,md,pc,pd,ec,ed,cc,cd,flags,signals=h
                if rev>20 or mc>1200 or pc>512 or ci>10000:continue
                def qs(i):
                  e=s+i*8;rr=u32(e);ln=u32(e+4)
                  if ln>8192 or rr>(1<<22):raise ValueError
                  oo=vo(s+rr);return raw[oo:oo+ln].decode('utf8','replace')
                cls=qs(ci)
                if cls not in targets:continue
                methods=[]
                for i in range(mc):
                  base=m+(md+i*6)*4;row=[u32(base+j*4) for j in range(6)];name=qs(row[0]);argc=row[1];po=row[2]
                  vals=[u32(m+(po+j)*4) for j in range(1+2*argc)]
                  def dtype(x):
                    if x&0x80000000:
                      try:return qs(x&0x7fffffff)
                      except:return f'unresolved#{x&0x7fffffff}'
                    return f'metatype#{x}'
                  methods.append((i,name,argc,[dtype(x) for x in vals[:argc+1]],row[4]))
                props=[]
                # Qt 6 revision 13 stores five uints per property: name,type,flags,notify/revision payload.
                for i in range(pc):
                  base=m+(pd+i*5)*4;row=[u32(base+j*4) for j in range(5)]
                  try:name=qs(row[0])
                  except:name=f'idx#{row[0]}'
                  typ=row[1]
                  if typ&0x80000000:
                    try:tname=qs(typ&0x7fffffff)
                    except:tname=f'unresolved#{typ&0x7fffffff}'
                  else:tname=f'metatype#{typ}'
                  props.append((i,name,tname,row[2],row[3],row[4]))
                found[cls]=(va+rel,st,methods,props)
              except:continue
          print('POSITION_META_BEGIN')
          for cls in sorted(targets):
            row=found.get(cls)
            if not row:
              print('MISSING_CLASS='+cls);continue
            qmeta,st,methods,props=row;print(f'CLASS={cls} QMETA=0x{qmeta:x} STATIC=0x{st:x}')
            for i,name,argc,types,flags in methods:
              if any(k in name.lower() for k in ('position','player','creature','health','mana','capacity','level','vocation','direction','speed','skill')):
                print(f'  METHOD index={i} name={name} argc={argc} types={"|".join(types)} flags=0x{flags:x}')
            for i,name,tname,flags,notify,rev in props:
              print(f'  PROPERTY index={i} name={name} type={tname} flags=0x{flags:x} notify={notify} revision={rev}')
          print('POSITION_META_END')
          missing=targets-set(found)
          if missing:print('MISSING_TARGET_COUNT='+str(len(missing)))
          print('FOUND_TARGET_COUNT='+str(len(found)))
          if len(found)<4:raise SystemExit('position metadata coverage too small')
          PY
name: Tibia hosted protobuf capability inventory

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-protobuf-capability-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client through WARP and inventory message symbols
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl binutils
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/c/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib,re
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; o=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert len(o)==51965216 and hashlib.sha256(o).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          pathlib.Path('/tmp/c/client').write_bytes(o)
          text='\n'.join(m.group().decode('ascii','ignore') for m in re.finditer(rb'[ -~]{4,220}',o))
          names=set(re.findall(r'\b(?:GameclientMessage|GameserverMessage)[A-Za-z0-9_]{2,100}\b',text))
          cap=re.compile(r'(GoNorth|GoEast|GoSouth|GoWest|GoPath|Rotate|Stop|Cancel|Attack|Follow|Use|MoveObject|Talk|Container|Inventory|Equipment|Player|Creature|Health|Mana|Capacity|Skill|Cooldown|Map|Field|World|Channel)',re.I)
          selected=sorted(n for n in names if cap.search(n))
          print('PROTOCOL_CAPABILITY_MESSAGES_BEGIN')
          for n in selected: print(n)
          print('PROTOCOL_CAPABILITY_MESSAGES_END')
          print('PROTOCOL_MESSAGE_TOTAL='+str(len(names)))
          print('PROTOCOL_CAPABILITY_MESSAGE_COUNT='+str(len(selected)))
          prefixes={}
          for n in names:
            p='client_to_server' if n.startswith('GameclientMessage') else 'server_to_client'
            prefixes[p]=prefixes.get(p,0)+1
          for k,v in sorted(prefixes.items()): print(f'{k.upper()}_MESSAGE_SYMBOLS={v}')
          required=['GameclientMessageGoEast','GameclientMessageAttack','GameclientMessageFollow','GameclientMessageUseObject','GameclientMessageMoveObject']
          missing=[x for x in required if x not in names]
          print('REQUIRED_OUTBOUND_SYMBOLS_PRESENT='+str(not missing).lower())
          if missing: print('MISSING_REQUIRED='+','.join(missing)); raise SystemExit(1)
          PY
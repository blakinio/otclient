name: Tibia hosted relocation-aware vptr inventory

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-relocation-vptr-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client through WARP and resolve Itanium vtables
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools
          r=/tmp/w;mkdir -p "$r/bin" "$r/state" /tmp/c;cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf'|sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz'|sha256sum -c -
          mkdir x;tar -xzf wp.tgz -C x;cp "$(find x -type f -name wireproxy -print -quit)" wireproxy;chmod 755 wgcf wireproxy
          cd "$r/state";"$r/bin/wgcf" register --accept-tos >/dev/null;"$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf">w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30);do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null&&break;sleep 2;done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes();q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          flt={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb};raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[flt])
          assert hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          p=pathlib.Path('/tmp/c/client');p.write_bytes(raw)
          with p.open('rb') as fh:
            elf=ELFFile(fh)
            secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
            rels=[]
            for sec in elf.iter_sections():
              if not isinstance(sec,RelocationSection):continue
              symtab=elf.get_section(sec['sh_link']) if sec['sh_link'] else None
              for rel in sec.iter_relocations():
                off=int(rel['r_offset']);typ=int(rel['r_info_type']);add=int(rel['r_addend']) if rel.is_RELA() else None
                sym=''
                if int(rel['r_info_sym']) and symtab is not None:
                  try:sym=symtab.get_symbol(int(rel['r_info_sym'])).name
                  except:pass
                rels.append((off,typ,add,sym))
          def offva(off):
            for n,o,z,v,fl in secs:
              if o<=off<o+z:return v+(off-o)
            return None
          def vaoff(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError
          def exe(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          def qword(va):return struct.unpack_from('<Q',raw,vaoff(va))[0]
          def mangle(cls):
            parts=cls.split('::');return ('N'+''.join(str(len(x))+x for x in parts)+'E').encode()+b'\0'
          by_add={}
          for off,typ,add,sym in rels:
            if add is not None:by_add.setdefault(add,[]).append((off,typ,sym))
          classes=[
            'tibia::game::TPlayerProtocolMessageHandler','tibia::worldmap::TWorldmapProtocolMessageHandler',
            'tibia::game::TGameserverGameSession','tibia::game::TGameSessionBase','tibia::game::IGameSession',
            'tibia::game::TCreature','tibia::game::TPlayerData','tibia::container::TContainerStorage',
            'tibia::creatures::TCreatureStorage','tibia::client::TGameClient'
          ]
          print('RELOCATION_VPTR_BEGIN')
          proved=0
          for cls in classes:
            needle=mangle(cls);namevas=[];start=0
            while True:
              o=raw.find(needle,start)
              if o<0:break
              va=offva(o);start=o+1
              if va:namevas.append(va)
            typeinfos=[]
            for nv in namevas:
              for target,typ,sym in by_add.get(nv,[]):
                ti=target-8
                if ti>0:typeinfos.append(ti)
            typeinfos=sorted(set(typeinfos));vptrs=[]
            for ti in typeinfos:
              for target,typ,sym in by_add.get(ti,[]):
                header=target-8
                try:
                  if qword(header)!=0:continue
                except:continue
                vptr=header+16
                fns=[]
                for slot in range(4):
                  addr=vptr+slot*8;resolved=None
                  for roff,rtyp,radd,rsym in rels:
                    if roff==addr and radd is not None:
                      resolved=radd;break
                  if resolved is None:
                    try:resolved=qword(addr)
                    except:resolved=0
                  fns.append(resolved)
                if fns and exe(fns[0]):vptrs.append((vptr,fns))
            uniq=[];seen=set()
            for row in vptrs:
              if row[0] not in seen:seen.add(row[0]);uniq.append(row)
            print('CLASS='+cls)
            print('  NAME_VAS='+','.join(f'0x{x:x}' for x in namevas))
            print('  TYPEINFO='+','.join(f'0x{x:x}' for x in typeinfos))
            for vp,fns in uniq[:8]:print('  PRIMARY_VPTR=0x%x FNS=%s'%(vp,','.join(f'0x{x:x}' for x in fns)))
            if uniq:proved+=1
          print('RELOCATION_VPTR_END')
          print('CLASSES_WITH_PRIMARY_VPTR='+str(proved))
          if proved<5:raise SystemExit('insufficient relocation-aware vptr recovery')
          PY
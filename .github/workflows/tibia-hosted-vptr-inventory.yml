name: Tibia hosted handler vptr inventory

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-hosted-vptr-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client and derive primary vptr candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools
          r=/tmp/w;mkdir -p "$r/bin" "$r/state" /tmp/c;cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf'|sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz'|sha256sum -c -
          mkdir x;tar -xzf wp.tgz -C x;cp "$(find x -type f -name wireproxy -print -quit)" wireproxy;chmod 755 wgcf wireproxy
          cd "$r/state";"$r/bin/wgcf" register --accept-tos >/dev/null;"$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf">w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30);do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null&&break;sleep 2;done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct
          from elftools.elf.elffile import ELFFile
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes();q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          flt={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb};raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[flt])
          assert hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          p=pathlib.Path('/tmp/c/client');p.write_bytes(raw)
          with p.open('rb') as fh:
            elf=ELFFile(fh);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def offva(off):
            for n,o,z,v,fl in secs:
              if o<=off<o+z:return v+(off-o),n
            return None,None
          def vaoff(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v),n
            raise ValueError
          def mapped(va):return any(v<=va<v+z for _,_,z,v,_ in secs)
          def exe(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          def q(va):return struct.unpack_from('<Q',raw,vaoff(va)[0])[0]
          classes=[
            'tibia::game::TPlayerProtocolMessageHandler',
            'tibia::creatures::TCreaturesGameActionHandler',
            'tibia::input::TGenericGameActionHandler',
            'tibia::input::TUseWithGameActionHandler',
            'tibia::chat::TChatGameActionHandler',
            'tibia::container::TContainerProtocolMessageHandler',
            'tibia::container::TContainerGameActionHandler',
            'tibia::game::TCreature',
            'tibia::game::TPlayerData',
          ]
          def mangle(cls):
            parts=cls.split('::');return 'N'+''.join(str(len(x))+x for x in parts)+'E'
          print('VPTR_INVENTORY_BEGIN')
          proved=0
          for cls in classes:
            mang=mangle(cls).encode()+b'\0';poss=[];start=0
            while True:
              off=raw.find(mang,start)
              if off<0:break
              va,sec=offva(off);poss.append((va,sec));start=off+1
            print(f'CLASS={cls} RTTI_MANGLED={mang[:-1].decode()} NAME_VAS='+','.join(f'0x{x:x}' for x,_ in poss if x))
            tis=[]
            for nameva,_ in poss:
              needle=struct.pack('<Q',nameva);s=0
              while True:
                o=raw.find(needle,s)
                if o<0:break
                va,sec=offva(o)
                if va and o>=8:
                  tiv=va-8
                  try:
                    first=q(tiv)
                    if mapped(first):tis.append((tiv,sec))
                  except:pass
                s=o+1
            tis=sorted(set(tis));print('  TYPEINFO='+','.join(f'0x{x:x}' for x,_ in tis))
            cands=[]
            for ti,_ in tis:
              needle=struct.pack('<Q',ti);s=0
              while True:
                o=raw.find(needle,s)
                if o<0:break
                va,sec=offva(o)
                if va and o>=8:
                  hdr=va-8
                  try:
                    off_top=struct.unpack_from('<q',raw,vaoff(hdr)[0])[0]
                    f0=q(va+8);f1=q(va+16)
                    if off_top==0 and exe(f0):cands.append((va+8,sec,f0,f1))
                  except:pass
                s=o+1
            uniq=[];seen=set()
            for row in cands:
              if row[0] not in seen:seen.add(row[0]);uniq.append(row)
            for vp,sec,f0,f1 in uniq[:12]:print(f'  PRIMARY_VPTR=0x{vp:x} section={sec} first=0x{f0:x} second=0x{f1:x}')
            if uniq:proved+=1
          print('VPTR_INVENTORY_END')
          print('CLASSES_WITH_VPTR_CANDIDATE='+str(proved))
          if proved<5:raise SystemExit('insufficient primary vptr recovery')
          PY
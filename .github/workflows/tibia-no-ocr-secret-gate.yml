name: Tibia no-OCR secret availability gate

on:
  push:
    branches:
      - ci/OTC-20260727-tibia-linux-runner-analysis
    paths:
      - .github/workflows/tibia-no-ocr-secret-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-gate:
    name: Verify bounded Tibia test secrets exist
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check only non-emptiness
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          email_present=false
          password_present=false
          [[ -n "$TIBIA_TEST_EMAIL" ]] && email_present=true
          [[ -n "$TIBIA_TEST_PASSWORD" ]] && password_present=true
          echo "TIBIA_TEST_EMAIL_PRESENT=$email_present"
          echo "TIBIA_TEST_PASSWORD_PRESENT=$password_present"
          if [[ "$email_present" != true || "$password_present" != true ]]; then
            echo TIBIA_TEST_SECRETS_AVAILABLE=false
            exit 1
          fi
          echo TIBIA_TEST_SECRETS_AVAILABLE=true

name: Track A standard AT-SPI session bus probe

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-atspi-bus-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Prove standard org.a11y.Bus with transient config only
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          root="$state/toolroot"
          path="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin"
          lib="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu"
          schema="$root/usr/share/glib-2.0/schemas"
          src_cfg="$root/usr/share/defaults/at-spi2/accessibility.conf"
          dst_dir=/usr/share/defaults/at-spi2
          dst_cfg="$dst_dir/accessibility.conf"
          launcher="$(find "$root" -type f -name at-spi-bus-launcher -print -quit)"
          [[ -s "$src_cfg" && -s "$schema/gschemas.compiled" && -n "$launcher" ]]
          [[ ! -e "$dst_cfg" ]]
          mkdir -p "$dst_dir"
          install -m 0644 "$src_cfg" "$dst_cfg"
          dbus_pid=''; atspi_pid=''
          cleanup(){ [[ -z "$atspi_pid" ]] || kill "$atspi_pid" 2>/dev/null || true; [[ -z "$dbus_pid" ]] || kill "$dbus_pid" 2>/dev/null || true; rm -f "$dst_cfg"; rmdir "$dst_dir" 2>/dev/null || true; rmdir /usr/share/defaults 2>/dev/null || true; }
          trap cleanup EXIT
          echo TRACK_A_TRANSIENT_ACCESSIBILITY_CONFIG_READY=true
          mapfile -t info < <(PATH="$path" LD_LIBRARY_PATH="$lib" "$root/usr/bin/dbus-daemon" --session --fork --print-address=1 --print-pid=1)
          [[ ${#info[@]} -ge 2 && -n "${info[0]}" && "${info[1]}" =~ ^[0-9]+$ ]]
          export DBUS_SESSION_BUS_ADDRESS="${info[0]}"; dbus_pid="${info[1]}"
          PATH="$path" LD_LIBRARY_PATH="$lib" XDG_DATA_DIRS="$root/usr/share:/usr/share" GSETTINGS_SCHEMA_DIR="$schema" \
            "$launcher" --launch-immediately --a11y=1 >/tmp/track-a-standard-atspi.log 2>&1 &
          atspi_pid=$!
          for _ in $(seq 1 40); do
            if PATH="$path" LD_LIBRARY_PATH="$lib" "$root/usr/bin/dbus-send" --session --print-reply \
              --dest=org.a11y.Bus /org/a11y/bus org.a11y.Bus.GetAddress >/tmp/track-a-standard-address.txt 2>/dev/null && \
              grep -q 'string "' /tmp/track-a-standard-address.txt; then
              echo TRACK_A_ORG_A11Y_BUS_READY=true
              exit 0
            fi
            kill -0 "$atspi_pid" 2>/dev/null || break
            sleep .2
          done
          sed -n '1,40p' /tmp/track-a-standard-atspi.log | sed 's/^/TRACK_A_ATSPI_STDERR=/' || true
          exit 1

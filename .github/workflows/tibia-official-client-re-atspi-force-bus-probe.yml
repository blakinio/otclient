name: Track A Qt accessibility runtime probe

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-atspi-force-bus-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Inspect exact official runtime accessibility components
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          runtime="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$runtime/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo TRACK_A_EXACT_OFFICIAL_CLIENT_VERIFIED=true
          echo TRACK_A_ACCESSIBILITY_FILES_BEGIN=true
          find "$runtime" -type f \( -iname '*accessib*' -o -iname '*atspi*' -o -iname '*dbus*' -o -iname '*qxcb*' \) -printf '%P\n' | sort | head -n 120 | sed 's/^/TRACK_A_RUNTIME_FILE=/'
          echo TRACK_A_ACCESSIBILITY_FILES_END=true
          if command -v readelf >/dev/null 2>&1; then
            readelf -d "$client" 2>/dev/null | grep -Ei 'NEEDED.*(Qt.*DBus|dbus|Qt.*Gui|Qt.*Widgets|Qt.*Quick)' | head -n 80 | sed 's/^/TRACK_A_CLIENT_NEEDED=/' || true
          fi
          strings -a "$client" | grep -Ei 'AT_SPI|org\.a11y|accessibility|QAccessible|QT_LINUX_ACCESSIBILITY|dbus' | head -n 120 | sed 's/^/TRACK_A_CLIENT_STRING=/' || true
          echo TRACK_A_QT_ACCESSIBILITY_RUNTIME_PROBE_COMPLETE=true

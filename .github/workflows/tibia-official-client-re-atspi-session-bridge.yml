name: Track A private AT-SPI session bridge

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-atspi-session-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Bridge session DBus to private AT-SPI and inspect Tibia
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          root="$state/toolroot"
          runtime="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$runtime/bin/client"
          path="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin"
          lib="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu"
          cfg="$root/usr/share/defaults/at-spi2/accessibility.conf"
          registry="$(find "$root" -type f -name at-spi2-registryd -perm -u+x -print -quit)"
          py_path="$root/usr/lib/python3/dist-packages"
          gi_path="$root/usr/lib/x86_64-linux-gnu/girepository-1.0:$root/usr/lib/girepository-1.0"
          [[ -x "$client" && -s "$cfg" && -n "$registry" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo TRACK_A_EXACT_OFFICIAL_CLIENT_VERIFIED=true

          old_pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          if [[ -n "$old_pid" && -r "/proc/$old_pid/environ" ]]; then
            grep -azFxq "$marker" "/proc/$old_pid/environ"
            [[ "$(readlink -f "/proc/$old_pid/exe")" == "$client" ]]
            kill "$old_pid" 2>/dev/null || true
            for _ in $(seq 1 30); do kill -0 "$old_pid" 2>/dev/null || break; sleep .2; done
          fi
          xvfb_pid="$(tr -cd '0-9' <"$state/runtime/xvfb.pid" 2>/dev/null || true)"
          [[ -n "$xvfb_pid" && -r "/proc/$xvfb_pid/environ" && -e /tmp/.X11-unix/X98 ]]
          grep -azFxq "$marker" "/proc/$xvfb_pid/environ"
          kill -0 "$xvfb_pid"

          mapfile -t session < <(PATH="$path" LD_LIBRARY_PATH="$lib" "$root/usr/bin/dbus-daemon" --session --fork --print-address=1 --print-pid=1)
          mapfile -t access < <(PATH="$path" LD_LIBRARY_PATH="$lib" "$root/usr/bin/dbus-daemon" --config-file="$cfg" --fork --print-address=1 --print-pid=1)
          [[ ${#session[@]} -ge 2 && ${#access[@]} -ge 2 ]]
          session_addr="${session[0]}"; session_pid="${session[1]}"
          access_addr="${access[0]}"; access_pid="${access[1]}"
          [[ "$session_pid" =~ ^[0-9]+$ && "$access_pid" =~ ^[0-9]+$ ]]
          reg_pid=''; bridge_pid=''; pid=''
          cleanup(){
            [[ -z "$pid" ]] || kill "$pid" 2>/dev/null || true
            [[ -z "$bridge_pid" ]] || kill "$bridge_pid" 2>/dev/null || true
            [[ -z "$reg_pid" ]] || kill "$reg_pid" 2>/dev/null || true
            kill "$access_pid" "$session_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          AT_SPI_BUS_ADDRESS="$access_addr" DBUS_SESSION_BUS_ADDRESS="$session_addr" PATH="$path" LD_LIBRARY_PATH="$lib" \
            "$registry" >"$state/runtime/atspi-registry.log" 2>&1 &
          reg_pid=$!
          for _ in $(seq 1 30); do
            if PATH="$path" LD_LIBRARY_PATH="$lib" "$root/usr/bin/dbus-send" --bus="$access_addr" --print-reply \
              --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.ListNames 2>/dev/null | grep -q 'org.a11y.atspi.Registry'; then break; fi
            sleep .2
          done
          kill -0 "$reg_pid"
          echo TRACK_A_ACCESSIBILITY_REGISTRY_READY=true

          bridge="$state/runtime/atspi-session-bridge.py"
          cat >"$bridge" <<'PY'
          import os
          from gi.repository import Gio, GLib
          xml='''<node><interface name="org.a11y.Bus"><method name="GetAddress"><arg type="s" direction="out"/></method></interface></node>'''
          info=Gio.DBusNodeInfo.new_for_xml(xml).interfaces[0]
          conn=Gio.bus_get_sync(Gio.BusType.SESSION, None)
          address=os.environ['TRACK_A_ACCESS_ADDR']
          def call(connection, sender, object_path, interface_name, method_name, parameters, invocation):
              if method_name == 'GetAddress':
                  invocation.return_value(GLib.Variant('(s)', (address,)))
              else:
                  invocation.return_dbus_error('org.a11y.Bus.Error', 'unsupported')
          reg=conn.register_object('/org/a11y/bus', info, call, None, None)
          owner=Gio.bus_own_name_on_connection(conn, 'org.a11y.Bus', Gio.BusNameOwnerFlags.NONE, None, None)
          print('TRACK_A_SESSION_BRIDGE_PROCESS_READY=true', flush=True)
          GLib.MainLoop().run()
          PY
          chmod 600 "$bridge"
          DBUS_SESSION_BUS_ADDRESS="$session_addr" TRACK_A_ACCESS_ADDR="$access_addr" \
            PYTHONPATH="$py_path" GI_TYPELIB_PATH="$gi_path" LD_LIBRARY_PATH="$lib" \
            python3 "$bridge" >"$state/runtime/atspi-session-bridge.log" 2>&1 &
          bridge_pid=$!
          for _ in $(seq 1 40); do
            if PATH="$path" LD_LIBRARY_PATH="$lib" "$root/usr/bin/dbus-send" --bus="$session_addr" --print-reply \
              --dest=org.a11y.Bus /org/a11y/bus org.a11y.Bus.GetAddress >"$state/runtime/atspi-get-address.log" 2>/dev/null && \
              grep -Fq "$access_addr" "$state/runtime/atspi-get-address.log"; then break; fi
            sleep .2
          done
          kill -0 "$bridge_pid"
          grep -Fq "$access_addr" "$state/runtime/atspi-get-address.log"
          echo TRACK_A_SESSION_A11Y_BUS_BRIDGE_READY=true

          proxy_lib="$(find "$root" -type f -name 'libproxychains.so.4' -print -quit)"
          proxy_conf="$state/config/proxychains.conf"
          [[ -n "$proxy_lib" && -s "$proxy_conf" ]]
          cd "$runtime"
          env -u RUNNER_TRACKING_ID OTCLIENT_TIBIA_RE_TRACK=official-client-re HOME="$state/home" DISPLAY="$TRACK_DISPLAY" PATH="$path" \
            LD_LIBRARY_PATH="$runtime/lib:$lib" QT_QUICK_BACKEND=software QT_XCB_GL_INTEGRATION=none \
            QT_ACCESSIBILITY=1 QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 DBUS_SESSION_BUS_ADDRESS="$session_addr" \
            XDG_DATA_DIRS="$root/usr/share:/usr/share" FONTCONFIG_PATH="$root/etc/fonts" FONTCONFIG_FILE="$root/etc/fonts/fonts.conf" \
            LD_PRELOAD="$proxy_lib" PROXYCHAINS_CONF_FILE="$proxy_conf" \
            nohup "$client" >"$state/runtime/client.log" 2>&1 </dev/null &
          pid=$!
          printf '%s\n' "$pid" >"$state/runtime/client.pid"; chmod 600 "$state/runtime/client.pid"
          sleep 10
          kill -0 "$pid"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          echo TRACK_A_OFFICIAL_CLIENT_RUNNING=true

          HOME="$state/home" DISPLAY="$TRACK_DISPLAY" PATH="$path" LD_LIBRARY_PATH="$lib" \
            DBUS_SESSION_BUS_ADDRESS="$session_addr" PYTHONPATH="$py_path" GI_TYPELIB_PATH="$gi_path" \
            python3 "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-atspi.py" inspect
          echo TRACK_A_SESSION_BRIDGE_SEMANTIC_INSPECT_SUCCESS=true

name: Track A native auth session static proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-auth-session-flow-static]
    paths: [.github/workflows/tibia-official-client-re-auth-session-static.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-game-login-schema:
    name: Resolve exact-client game-login protobuf credential fields
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact official client and inspect static protobuf descriptor neighborhoods
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl
          r=/tmp/auth-warp; mkdir -p "$r/bin" "$r/state" /tmp/auth-client; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/auth-wireproxy.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/auth-warp-trace 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/auth-warp-trace
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/auth-client/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/auth-client/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib,re
          b=pathlib.Path('/tmp/auth-client/client.lzma').read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          print('AUTHSESSION_SCHEMA_EXACT_CLIENT_SHA=PASS')
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          print('AUTHSESSION_LOGIN_PERFORMED=false')
          print('AUTHSESSION_SECRET_ACCESS=false')
          strings=[(m.start(),m.group().decode('ascii','replace')) for m in re.finditer(rb'[ -~]{3,220}',raw)]
          targets=['GameclientMessageLogin','LoginRSAEncryptedBlock','GameclientMessageSecondaryLogin','SecondaryLoginRSAEncryptedBlock']
          keypat=re.compile(r'(login|session|password|account|character|world|challenge|token|key|cookie|timestamp|rsa|encrypted|client|version|sequence|nonce)',re.I)
          print('AUTHSESSION_SCHEMA_TARGET_NEIGHBORHOODS_BEGIN')
          for target in targets:
            hits=[p for p,s in strings if target in s]
            print(f'TARGET={target} OFFSETS='+','.join(hex(x) for x in hits))
            for hit in hits[:8]:
              near=[(p,s) for p,s in strings if abs(p-hit)<=0x8000 and keypat.search(s)]
              seen=set(); ordered=[]
              for p,s in near:
                k=(p,s)
                if k in seen: continue
                seen.add(k); ordered.append((p,s))
              ordered.sort(key=lambda x:(abs(x[0]-hit),x[0]))
              for p,s in ordered[:120]: print(f'  {p-hit:+#x} FILEOFF=0x{p:x} {s}')
          print('AUTHSESSION_SCHEMA_TARGET_NEIGHBORHOODS_END')
          keys=['password','sessionkey','SessionKey','session','character','world','challenge','timestamp','account','token']
          print('AUTHSESSION_SCHEMA_GLOBAL_KEY_DISTANCES_BEGIN')
          target_positions=[p for p,s in strings if any(t in s for t in targets)]
          for key in keys:
            vals=[(p,s) for p,s in strings if key.lower() in s.lower()]
            ranked=[]
            for p,s in vals:
              if target_positions:
                d=min(abs(p-t) for t in target_positions); ranked.append((d,p,s))
            ranked.sort()
            print('KEY='+key+' TOTAL='+str(len(vals)))
            for d,p,s in ranked[:20]: print(f'  DIST=0x{d:x} FILEOFF=0x{p:x} {s}')
          print('AUTHSESSION_SCHEMA_GLOBAL_KEY_DISTANCES_END')
          print('AUTHSESSION_SCHEMA_STATIC_PROBE=PASS')
          PY

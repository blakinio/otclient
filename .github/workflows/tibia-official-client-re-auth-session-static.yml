name: Track A native auth session static proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-auth-session-flow-static]
    paths: [.github/workflows/tibia-official-client-re-auth-session-static.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-auth-session-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Stage exact-file auth/session phase2 windows
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: docs/OTC-20260817-track-a-auth-session-flow-static
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    outputs:
      connect_context_hex: ${{ steps.stage.outputs.connect_context_hex }}
      connect_context_sha256: ${{ steps.stage.outputs.connect_context_sha256 }}
      existing_credentials_hex: ${{ steps.stage.outputs.existing_credentials_hex }}
      existing_credentials_sha256: ${{ steps.stage.outputs.existing_credentials_sha256 }}
      connect_impl_hex: ${{ steps.stage.outputs.connect_impl_hex }}
      connect_impl_sha256: ${{ steps.stage.outputs.connect_impl_sha256 }}
      session_connected_hex: ${{ steps.stage.outputs.session_connected_hex }}
      session_connected_sha256: ${{ steps.stage.outputs.session_connected_sha256 }}
      character_helper_hex: ${{ steps.stage.outputs.character_helper_hex }}
      character_helper_sha256: ${{ steps.stage.outputs.character_helper_sha256 }}
      character_enclosing_hex: ${{ steps.stage.outputs.character_enclosing_hex }}
      character_enclosing_sha256: ${{ steps.stage.outputs.character_enclosing_sha256 }}
      login_handlers_hex: ${{ steps.stage.outputs.login_handlers_hex }}
      login_handlers_sha256: ${{ steps.stage.outputs.login_handlers_sha256 }}
    steps:
      - id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 61
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 62
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]] || exit 63

          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          for candidate in "${candidates[@]}"; do
            [[ -f "$candidate" && ! -L "$candidate" ]] || continue
            [[ "$(stat -c %s "$candidate")" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            python3 - "$candidate" "$EXPECTED_CLIENT_SHA256" <<'PY' && { source_client="$candidate"; break; }
          import hashlib,sys
          h=hashlib.sha256()
          with open(sys.argv[1],'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
          raise SystemExit(h.hexdigest()!=sys.argv[2])
          PY
          done
          [[ -n "$source_client" ]] || exit 50

          python3 - "$source_client" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,struct,sys
          from pathlib import Path

          p=Path(sys.argv[1]); out=Path(sys.argv[2])
          with p.open('rb') as f:
              ident=f.read(16); rest=f.read(48)
              if ident[:4]!=b'\x7fELF' or ident[4]!=2 or ident[5]!=1:
                  raise SystemExit(51)
              fs=struct.unpack('<HHIQQQIHHHHHH',rest)
              phoff,phentsize,phnum=fs[4],fs[8],fs[9]
              segs=[]
              for i in range(phnum):
                  f.seek(phoff+i*phentsize); r=f.read(56)
                  t,flags,off,va,_pa,sz,_msz,_al=struct.unpack('<IIQQQQQQ',r)
                  if t==1: segs.append((off,va,sz,flags))

              def read_va(start,end):
                  if end <= start or end-start > 0x2000: raise SystemExit(52)
                  for off,va,sz,flags in segs:
                      if va <= start and end <= va+sz:
                          if not (flags & 1): raise SystemExit(53)
                          f.seek(off+start-va); d=f.read(end-start)
                          if len(d)==end-start: return d
                  raise SystemExit(54)

              windows={
                  'connect_context':      (0x7d5400,0x7d5800),
                  'existing_credentials': (0x6ef180,0x6ef900),
                  'connect_impl':         (0x6fe400,0x6fec00),
                  'session_connected':    (0x6ee080,0x6ee800),
                  'character_helper':     (0x858980,0x859140),
                  'character_enclosing':  (0xd46c00,0xd47400),
                  'login_handlers':       (0xcf2e80,0xcf3280),
              }
              staged={k:read_va(a,b) for k,(a,b) in windows.items()}

          rows=[]
          for key,data in staged.items():
              dig=hashlib.sha256(data).hexdigest()
              rows.append(f'{key}_hex={data.hex()}\n{key}_sha256={dig}\n')
              print(f'AUTHSESSION_PHASE2_SOURCE_{key.upper()}_SHA256={dig}')
          with out.open('a') as h: h.write(''.join(rows))

          print('AUTHSESSION_PHASE2_EXACT_FILE_FENCE=PASS')
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          print('AUTHSESSION_PHASE2_SOURCE_PROCESS_OBSERVATION=false')
          print('AUTHSESSION_PHASE2_SOURCE_X11_OBSERVATION=false')
          print('AUTHSESSION_PHASE2_SOURCE_LOGIN=false')
          print('AUTHSESSION_PHASE2_SOURCE_SECRET_ACCESS=false')
          print('AUTHSESSION_PHASE2_SOURCE_DISASSEMBLY=false')
          print('AUTHSESSION_PHASE2_SOURCE_SEMANTIC_CLASSIFICATION=false')
          print('AUTHSESSION_PHASE2_RAW_CLIENT_UPLOADED=false')
          print('AUTHSESSION_PHASE2_BOUNDED_FILE_WINDOWS_STAGED=true')
          PY

  hosted-decode:
    name: Decode auth/session phase2 on GitHub-hosted Linux
    needs: source-sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: docs/OTC-20260817-track-a-auth-session-flow-static
      CONNECT_CONTEXT_HEX: ${{ needs.source-sanitize.outputs.connect_context_hex }}
      CONNECT_CONTEXT_SHA256: ${{ needs.source-sanitize.outputs.connect_context_sha256 }}
      EXISTING_CREDENTIALS_HEX: ${{ needs.source-sanitize.outputs.existing_credentials_hex }}
      EXISTING_CREDENTIALS_SHA256: ${{ needs.source-sanitize.outputs.existing_credentials_sha256 }}
      CONNECT_IMPL_HEX: ${{ needs.source-sanitize.outputs.connect_impl_hex }}
      CONNECT_IMPL_SHA256: ${{ needs.source-sanitize.outputs.connect_impl_sha256 }}
      SESSION_CONNECTED_HEX: ${{ needs.source-sanitize.outputs.session_connected_hex }}
      SESSION_CONNECTED_SHA256: ${{ needs.source-sanitize.outputs.session_connected_sha256 }}
      CHARACTER_HELPER_HEX: ${{ needs.source-sanitize.outputs.character_helper_hex }}
      CHARACTER_HELPER_SHA256: ${{ needs.source-sanitize.outputs.character_helper_sha256 }}
      CHARACTER_ENCLOSING_HEX: ${{ needs.source-sanitize.outputs.character_enclosing_hex }}
      CHARACTER_ENCLOSING_SHA256: ${{ needs.source-sanitize.outputs.character_enclosing_sha256 }}
      LOGIN_HANDLERS_HEX: ${{ needs.source-sanitize.outputs.login_handlers_hex }}
      LOGIN_HANDLERS_SHA256: ${{ needs.source-sanitize.outputs.login_handlers_sha256 }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 71
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 72
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || exit 73
          python3 - <<'PY'
          import hashlib,os,re,subprocess,tempfile
          from pathlib import Path

          specs={
              'CONNECT_CONTEXT':      (0x7d5400,0x400),
              'EXISTING_CREDENTIALS': (0x6ef180,0x780),
              'CONNECT_IMPL':         (0x6fe400,0x800),
              'SESSION_CONNECTED':    (0x6ee080,0x780),
              'CHARACTER_HELPER':     (0x858980,0x7c0),
              'CHARACTER_ENCLOSING':  (0xd46c00,0x800),
              'LOGIN_HANDLERS':       (0xcf2e80,0x400),
          }

          def get(name,n):
              d=bytes.fromhex(os.environ[name+'_HEX'])
              if len(d)!=n: raise SystemExit(74)
              if hashlib.sha256(d).hexdigest()!=os.environ[name+'_SHA256']:
                  raise SystemExit(75)
              return d

          def disasm(name,start,n):
              data=get(name,n)
              with tempfile.TemporaryDirectory(prefix='auth-session-p2-') as td:
                  p=Path(td)/(name.lower()+'.bin'); p.write_bytes(data)
                  text=subprocess.run([
                      'objdump','-D','-b','binary','-m','i386:x86-64','-M','intel',
                      f'--adjust-vma=0x{start:x}',str(p)
                  ],check=True,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE).stdout
              calls=sorted(set(int(x,16) for x in re.findall(r'\bcall\s+(?:0x)?([0-9a-f]+)\b',text)))
              jumps=sorted(set(int(x,16) for x in re.findall(r'\bjmp\s+(?:0x)?([0-9a-f]+)\b',text)))
              refs=sorted(set(int(x,16) for x in re.findall(r'#\s*0x([0-9a-f]+)',text)))
              print(f'AUTHSESSION_PHASE2_{name}_CALL_TARGETS='+','.join(f'0x{x:x}' for x in calls))
              print(f'AUTHSESSION_PHASE2_{name}_JUMP_TARGETS='+','.join(f'0x{x:x}' for x in jumps))
              print(f'AUTHSESSION_PHASE2_{name}_RIP_REFS='+','.join(f'0x{x:x}' for x in refs))
              print(f'AUTHSESSION_PHASE2_{name}_DISASSEMBLY_BEGIN')
              print(text,end='')
              print(f'AUTHSESSION_PHASE2_{name}_DISASSEMBLY_END')

          print('AUTHSESSION_PHASE2_HOSTED_DECODE=PASS')
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          for name,(start,n) in specs.items(): disasm(name,start,n)
          PY

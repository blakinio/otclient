name: Track A native auth session static proof
on:
  push:
    branches: [docs/OTC-20260817-track-a-auth-session-flow-static]
permissions:
  contents: read
jobs:
  source:
    runs-on: [otclient, synology]
    outputs:
      meta: ${{ steps.x.outputs.meta }}
      metas: ${{ steps.x.outputs.metas }}
      slot: ${{ steps.x.outputs.slot }}
      slots: ${{ steps.x.outputs.slots }}
      dtor: ${{ steps.x.outputs.dtor }}
      dtors: ${{ steps.x.outputs.dtors }}
    steps:
      - id: x
        shell: bash
        run: |
          set -Eeuo pipefail
          C='/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'; [[ -f "$C" ]] || C='/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          [[ "$(stat -c %s "$C")" == 51965216 && "$(sha256sum "$C"|cut -d' ' -f1)" == e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe ]] || exit 50
          python3 - "$C" "$GITHUB_OUTPUT" <<'PY'
          import struct,hashlib,sys
          f=open(sys.argv[1],'rb');f.seek(16);e=struct.unpack('<HHIQQQIHHHHHH',f.read(48));segs=[]
          for i in range(e[9]):
           f.seek(e[4]+i*e[8]);r=struct.unpack('<IIQQQQQQ',f.read(56));
           if r[0]==1:segs.append((r[2],r[3],r[5],r[1]))
          def R(a,b):
           for o,v,z,flags in segs:
            if v<=a and b<=v+z:
             f.seek(o+a-v);d=f.read(b-a)
             if len(d)==b-a:return d
           raise SystemExit(54)
          wins={'meta':R(0xb07d20,0xb07ed0),'slot':R(0xb11ee0,0xb12280),'dtor':R(0xb11c80,0xb11e00)}
          with open(sys.argv[2],'a') as q:
           for k,d in wins.items():
            q.write(f'{k}={d.hex()}\n{k}s={hashlib.sha256(d).hexdigest()}\n')
          print('AUTHSESSION_PHASE6C_EXACT_FILE_FENCE=PASS');print('AUTHSESSION_RUNTIME_ACCESS=none');print('AUTHSESSION_PHASE6C_SOURCE_DISASSEMBLY=false');print('AUTHSESSION_PHASE6C_SOURCE_SEMANTIC_CLASSIFICATION=false');print('AUTHSESSION_PHASE6C_SOURCE_SECRET_ACCESS=false');print('AUTHSESSION_PHASE6C_RAW_CLIENT_UPLOADED=false')
          PY
  hosted:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - env:
          META: ${{ needs.source.outputs.meta }}
          METAS: ${{ needs.source.outputs.metas }}
          SLOT: ${{ needs.source.outputs.slot }}
          SLOTS: ${{ needs.source.outputs.slots }}
          DTOR: ${{ needs.source.outputs.dtor }}
          DTORS: ${{ needs.source.outputs.dtors }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,hashlib,subprocess,tempfile,re
          from pathlib import Path
          specs=[('META',0xb07d20,0x1b0),('SLOT',0xb11ee0,0x3a0),('DTOR',0xb11c80,0x180)]
          print('AUTHSESSION_PHASE6C_HOSTED_DECODE=PASS');print('AUTHSESSION_RUNTIME_ACCESS=none')
          for k,start,n in specs:
           d=bytes.fromhex(os.environ[k]);assert len(d)==n and hashlib.sha256(d).hexdigest()==os.environ[k+'S']
           with tempfile.TemporaryDirectory() as td:
            p=Path(td)/'x';p.write_bytes(d);t=subprocess.run(['objdump','-D','-b','binary','-m','i386:x86-64','-M','intel',f'--adjust-vma=0x{start:x}',str(p)],check=True,text=True,stdout=subprocess.PIPE).stdout
           print('AUTHSESSION_PHASE6C_'+k+'_BEGIN')
           for l in t.splitlines():
            m=re.match(r'^\s*([0-9a-f]+):\s+([0-9a-f ]+)\s+(.+)$',l)
            if m:print(m.group(1)+': '+m.group(3).strip())
           refs=sorted(set(int(x,16) for x in re.findall(r'#\s*0x([0-9a-f]+)',t)))
           print('AUTHSESSION_PHASE6C_'+k+'_RIP_REFS='+','.join(hex(x) for x in refs))
           print('AUTHSESSION_PHASE6C_'+k+'_BEGIN_END')
          PY

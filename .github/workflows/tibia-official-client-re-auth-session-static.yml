name: Track A native auth session static proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-auth-session-flow-static]
    paths: [.github/workflows/tibia-official-client-re-auth-session-static.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-auth-session-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Stage exact-file auth/session phase3 windows
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: docs/OTC-20260817-track-a-auth-session-flow-static
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    outputs:
      connect_prelude_hex: ${{ steps.stage.outputs.connect_prelude_hex }}
      connect_prelude_sha256: ${{ steps.stage.outputs.connect_prelude_sha256 }}
      helper_88c2d0_hex: ${{ steps.stage.outputs.helper_88c2d0_hex }}
      helper_88c2d0_sha256: ${{ steps.stage.outputs.helper_88c2d0_sha256 }}
      helper_861d30_hex: ${{ steps.stage.outputs.helper_861d30_hex }}
      helper_861d30_sha256: ${{ steps.stage.outputs.helper_861d30_sha256 }}
      helper_197ce10_hex: ${{ steps.stage.outputs.helper_197ce10_hex }}
      helper_197ce10_sha256: ${{ steps.stage.outputs.helper_197ce10_sha256 }}
      existing_tail_hex: ${{ steps.stage.outputs.existing_tail_hex }}
      existing_tail_sha256: ${{ steps.stage.outputs.existing_tail_sha256 }}
      connect_tail_hex: ${{ steps.stage.outputs.connect_tail_hex }}
      connect_tail_sha256: ${{ steps.stage.outputs.connect_tail_sha256 }}
      strings_a_hex: ${{ steps.stage.outputs.strings_a_hex }}
      strings_a_sha256: ${{ steps.stage.outputs.strings_a_sha256 }}
      strings_b_hex: ${{ steps.stage.outputs.strings_b_hex }}
      strings_b_sha256: ${{ steps.stage.outputs.strings_b_sha256 }}
      strings_c_hex: ${{ steps.stage.outputs.strings_c_hex }}
      strings_c_sha256: ${{ steps.stage.outputs.strings_c_sha256 }}
    steps:
      - id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 61
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 62
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]] || exit 63

          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          for candidate in "${candidates[@]}"; do
            [[ -f "$candidate" && ! -L "$candidate" ]] || continue
            [[ "$(stat -c %s "$candidate")" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            python3 - "$candidate" "$EXPECTED_CLIENT_SHA256" <<'PY' && { source_client="$candidate"; break; }
          import hashlib,sys
          h=hashlib.sha256()
          with open(sys.argv[1],'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
          raise SystemExit(h.hexdigest()!=sys.argv[2])
          PY
          done
          [[ -n "$source_client" ]] || exit 50

          python3 - "$source_client" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,struct,sys
          from pathlib import Path

          p=Path(sys.argv[1]); out=Path(sys.argv[2])
          with p.open('rb') as f:
              ident=f.read(16); rest=f.read(48)
              if ident[:4]!=b'\x7fELF' or ident[4]!=2 or ident[5]!=1: raise SystemExit(51)
              fs=struct.unpack('<HHIQQQIHHHHHH',rest)
              phoff,phentsize,phnum=fs[4],fs[8],fs[9]
              segs=[]
              for i in range(phnum):
                  f.seek(phoff+i*phentsize); r=f.read(56)
                  t,flags,off,va,_pa,sz,_msz,_al=struct.unpack('<IIQQQQQQ',r)
                  if t==1: segs.append((off,va,sz,flags))

              def read_va(start,end,exec_required):
                  if end <= start or end-start > 0x1000: raise SystemExit(52)
                  for off,va,sz,flags in segs:
                      if va <= start and end <= va+sz:
                          if exec_required and not (flags & 1): raise SystemExit(53)
                          f.seek(off+start-va); d=f.read(end-start)
                          if len(d)==end-start: return d
                  raise SystemExit(54)

              windows={
                  'connect_prelude':  (0x7d5400,0x7d55f0,True),
                  'helper_88c2d0':    (0x88c280,0x88c760,True),
                  'helper_861d30':    (0x861d00,0x862080,True),
                  'helper_197ce10':   (0x197cde0,0x197d180,True),
                  'existing_tail':    (0x6ef3b0,0x6ef900,True),
                  'connect_tail':     (0x6fe6a0,0x6fec00,True),
                  'strings_a':        (0x1c96bf0,0x1c96c60,False),
                  'strings_b':        (0x1ce2290,0x1ce2320,False),
                  'strings_c':        (0x1ce2ff0,0x1ce3070,False),
              }
              staged={k:read_va(a,b,x) for k,(a,b,x) in windows.items()}

          rows=[]
          for key,data in staged.items():
              dig=hashlib.sha256(data).hexdigest()
              rows.append(f'{key}_hex={data.hex()}\n{key}_sha256={dig}\n')
              print(f'AUTHSESSION_PHASE3_SOURCE_{key.upper()}_SHA256={dig}')
          with out.open('a') as h: h.write(''.join(rows))
          print('AUTHSESSION_PHASE3_EXACT_FILE_FENCE=PASS')
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          print('AUTHSESSION_PHASE3_SOURCE_PROCESS_OBSERVATION=false')
          print('AUTHSESSION_PHASE3_SOURCE_X11_OBSERVATION=false')
          print('AUTHSESSION_PHASE3_SOURCE_LOGIN=false')
          print('AUTHSESSION_PHASE3_SOURCE_SECRET_ACCESS=false')
          print('AUTHSESSION_PHASE3_SOURCE_DISASSEMBLY=false')
          print('AUTHSESSION_PHASE3_SOURCE_SEMANTIC_CLASSIFICATION=false')
          print('AUTHSESSION_PHASE3_RAW_CLIENT_UPLOADED=false')
          print('AUTHSESSION_PHASE3_BOUNDED_FILE_WINDOWS_STAGED=true')
          PY

  hosted-decode:
    name: Decode phase3 auth/session provenance
    needs: source-sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: docs/OTC-20260817-track-a-auth-session-flow-static
      CONNECT_PRELUDE_HEX: ${{ needs.source-sanitize.outputs.connect_prelude_hex }}
      CONNECT_PRELUDE_SHA256: ${{ needs.source-sanitize.outputs.connect_prelude_sha256 }}
      HELPER_88C2D0_HEX: ${{ needs.source-sanitize.outputs.helper_88c2d0_hex }}
      HELPER_88C2D0_SHA256: ${{ needs.source-sanitize.outputs.helper_88c2d0_sha256 }}
      HELPER_861D30_HEX: ${{ needs.source-sanitize.outputs.helper_861d30_hex }}
      HELPER_861D30_SHA256: ${{ needs.source-sanitize.outputs.helper_861d30_sha256 }}
      HELPER_197CE10_HEX: ${{ needs.source-sanitize.outputs.helper_197ce10_hex }}
      HELPER_197CE10_SHA256: ${{ needs.source-sanitize.outputs.helper_197ce10_sha256 }}
      EXISTING_TAIL_HEX: ${{ needs.source-sanitize.outputs.existing_tail_hex }}
      EXISTING_TAIL_SHA256: ${{ needs.source-sanitize.outputs.existing_tail_sha256 }}
      CONNECT_TAIL_HEX: ${{ needs.source-sanitize.outputs.connect_tail_hex }}
      CONNECT_TAIL_SHA256: ${{ needs.source-sanitize.outputs.connect_tail_sha256 }}
      STRINGS_A_HEX: ${{ needs.source-sanitize.outputs.strings_a_hex }}
      STRINGS_A_SHA256: ${{ needs.source-sanitize.outputs.strings_a_sha256 }}
      STRINGS_B_HEX: ${{ needs.source-sanitize.outputs.strings_b_hex }}
      STRINGS_B_SHA256: ${{ needs.source-sanitize.outputs.strings_b_sha256 }}
      STRINGS_C_HEX: ${{ needs.source-sanitize.outputs.strings_c_hex }}
      STRINGS_C_SHA256: ${{ needs.source-sanitize.outputs.strings_c_sha256 }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 71
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 72
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || exit 73
          python3 - <<'PY'
          import hashlib,os,re,subprocess,tempfile
          from pathlib import Path

          specs={
              'CONNECT_PRELUDE': (0x7d5400,0x1f0),
              'HELPER_88C2D0':   (0x88c280,0x4e0),
              'HELPER_861D30':   (0x861d00,0x380),
              'HELPER_197CE10':  (0x197cde0,0x3a0),
              'EXISTING_TAIL':   (0x6ef3b0,0x550),
              'CONNECT_TAIL':    (0x6fe6a0,0x560),
              'STRINGS_A':       (0x1c96bf0,0x70),
              'STRINGS_B':       (0x1ce2290,0x90),
              'STRINGS_C':       (0x1ce2ff0,0x80),
          }
          def get(name,n):
              d=bytes.fromhex(os.environ[name+'_HEX'])
              if len(d)!=n: raise SystemExit(74)
              if hashlib.sha256(d).hexdigest()!=os.environ[name+'_SHA256']: raise SystemExit(75)
              return d
          def asm(name,start,n):
              data=get(name,n)
              with tempfile.TemporaryDirectory(prefix='auth-session-p3-') as td:
                  p=Path(td)/(name.lower()+'.bin'); p.write_bytes(data)
                  txt=subprocess.run(['objdump','-D','-b','binary','-m','i386:x86-64','-M','intel',f'--adjust-vma=0x{start:x}',str(p)],check=True,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE).stdout
              out=[]
              for line in txt.splitlines():
                  m=re.match(r'^\s*([0-9a-f]+):\s+([0-9a-f ]+)\s+(.+)$',line)
                  if m: out.append((int(m.group(1),16),m.group(3).strip()))
              return out
          def print_slice(name,start,n,lo,hi,limit=96):
              rows=[(a,i) for a,i in asm(name,start,n) if lo <= a < hi]
              print(f'AUTHSESSION_PHASE3_{name}_SLICE_BEGIN')
              for a,i in rows[:limit]: print(f'{a:x}: {i}')
              print(f'AUTHSESSION_PHASE3_{name}_SLICE_END')
          def call_contexts(name,start,n):
              rows=asm(name,start,n); chosen=set()
              for idx,(a,i) in enumerate(rows):
                  if re.search(r'\bcall\b',i):
                      for j in range(max(0,idx-3),min(len(rows),idx+2)): chosen.add(j)
              print(f'AUTHSESSION_PHASE3_{name}_CALL_CONTEXTS_BEGIN')
              for j in sorted(chosen)[:140]:
                  a,i=rows[j]; print(f'{a:x}: {i}')
              print(f'AUTHSESSION_PHASE3_{name}_CALL_CONTEXTS_END')
          def cstring(name,start,target):
              data=get(name,specs[name][1]); off=target-start
              if not (0 <= off < len(data)): raise SystemExit(76)
              s=data[off:off+96].split(b'\0',1)[0]
              safe=''.join(chr(b) if 32 <= b < 127 else f'\\x{b:02x}' for b in s)
              print(f'AUTHSESSION_PHASE3_STATIC_STRING_0x{target:x}={safe}')

          print('AUTHSESSION_PHASE3_HOSTED_DECODE=PASS')
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          print_slice('CONNECT_PRELUDE',0x7d5400,0x1f0,0x7d5480,0x7d55f0,120)
          print_slice('HELPER_88C2D0',0x88c280,0x4e0,0x88c2d0,0x88c520,96)
          print_slice('HELPER_861D30',0x861d00,0x380,0x861d30,0x861f20,80)
          print_slice('HELPER_197CE10',0x197cde0,0x3a0,0x197ce10,0x197d030,80)
          call_contexts('EXISTING_TAIL',0x6ef3b0,0x550)
          call_contexts('CONNECT_TAIL',0x6fe6a0,0x560)
          cstring('STRINGS_A',0x1c96bf0,0x1c96c11)
          cstring('STRINGS_A',0x1c96bf0,0x1c96c28)
          cstring('STRINGS_B',0x1ce2290,0x1ce22c4)
          cstring('STRINGS_B',0x1ce2290,0x1ce22d0)
          cstring('STRINGS_B',0x1ce2290,0x1ce22e0)
          cstring('STRINGS_C',0x1ce2ff0,0x1ce3028)
          PY

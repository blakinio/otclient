name: Track A native auth session static proof
on:
  push:
    branches: [docs/OTC-20260817-track-a-auth-session-flow-static]
permissions:
  contents: read
jobs:
  source:
    runs-on: [otclient, synology]
    outputs:
      h: ${{ steps.x.outputs.h }}
      s: ${{ steps.x.outputs.s }}
    steps:
      - id: x
        shell: bash
        run: |
          set -Eeuo pipefail
          C='/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          [[ -f "$C" ]] || C='/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          [[ "$(stat -c %s "$C")" == 51965216 && "$(sha256sum "$C"|cut -d' ' -f1)" == e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe ]] || exit 50
          python3 - "$C" "$GITHUB_OUTPUT" <<'PY'
          import struct,hashlib,sys
          f=open(sys.argv[1],'rb');f.seek(16);e=struct.unpack('<HHIQQQIHHHHHH',f.read(48))
          for i in range(e[9]):
           f.seek(e[4]+i*e[8]);r=struct.unpack('<IIQQQQQQ',f.read(56));o,v,z=r[2],r[3],r[5]
           if v<=0x3085000 and 0x3086000<=v+z:f.seek(o+0x3085000-v);d=f.read(0x1000);break
          else:raise SystemExit(54)
          s=hashlib.sha256(d).hexdigest();open(sys.argv[2],'a').write(f'h={d.hex()}\ns={s}\n')
          print('AUTHSESSION_PHASE6_EXACT_FILE_FENCE=PASS');print('AUTHSESSION_RUNTIME_ACCESS=none');print('AUTHSESSION_PHASE6_SOURCE_DISASSEMBLY=false');print('AUTHSESSION_PHASE6_SOURCE_SECRET_ACCESS=false');print('AUTHSESSION_PHASE6_RAW_CLIENT_UPLOADED=false')
          PY
  hosted:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - env:
          H: ${{ needs.source.outputs.h }}
          S: ${{ needs.source.outputs.s }}
        run: |
          python3 - <<'PY'
          import os,hashlib,struct
          d=bytes.fromhex(os.environ['H']);assert len(d)==0x1000 and hashlib.sha256(d).hexdigest()==os.environ['S'];q=[struct.unpack_from('<Q',d,i)[0] for i in range(0,0x1000,8)]
          print('AUTHSESSION_PHASE6_HOSTED_DECODE=PASS');print('AUTHSESSION_RUNTIME_ACCESS=none');print('AUTHSESSION_PHASE6_CODE_QWORD_RUNS_BEGIN')
          i=0
          while i<len(q):
           if 0x400000<=q[i]<0x1a00000:
            j=i
            while j<len(q) and 0x400000<=q[j]<0x1a00000:j+=1
            if j-i>=3:print(hex(0x3085000+8*i),','.join(hex(x) for x in q[i:j]))
            i=j
           else:i+=1
          print('AUTHSESSION_PHASE6_CODE_QWORD_RUNS_END')
          PY

name: Track A native auth session static proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-auth-session-flow-static]
    paths: [.github/workflows/tibia-official-client-re-auth-session-static.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-auth-session-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Stage exact-file auth/session phase4 windows
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: docs/OTC-20260817-track-a-auth-session-flow-static
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    outputs:
      setup_a_hex: ${{ steps.stage.outputs.setup_a_hex }}
      setup_a_sha256: ${{ steps.stage.outputs.setup_a_sha256 }}
      setup_b_hex: ${{ steps.stage.outputs.setup_b_hex }}
      setup_b_sha256: ${{ steps.stage.outputs.setup_b_sha256 }}
      strings_d_hex: ${{ steps.stage.outputs.strings_d_hex }}
      strings_d_sha256: ${{ steps.stage.outputs.strings_d_sha256 }}
      strings_e_hex: ${{ steps.stage.outputs.strings_e_hex }}
      strings_e_sha256: ${{ steps.stage.outputs.strings_e_sha256 }}
      strings_f_hex: ${{ steps.stage.outputs.strings_f_hex }}
      strings_f_sha256: ${{ steps.stage.outputs.strings_f_sha256 }}
      strings_g_hex: ${{ steps.stage.outputs.strings_g_hex }}
      strings_g_sha256: ${{ steps.stage.outputs.strings_g_sha256 }}
    steps:
      - id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 61
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 62
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]] || exit 63
          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          for candidate in "${candidates[@]}"; do
            [[ -f "$candidate" && ! -L "$candidate" ]] || continue
            [[ "$(stat -c %s "$candidate")" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            python3 - "$candidate" "$EXPECTED_CLIENT_SHA256" <<'PY' && { source_client="$candidate"; break; }
          import hashlib,sys
          h=hashlib.sha256()
          with open(sys.argv[1],'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
          raise SystemExit(h.hexdigest()!=sys.argv[2])
          PY
          done
          [[ -n "$source_client" ]] || exit 50

          python3 - "$source_client" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,struct,sys
          from pathlib import Path
          p=Path(sys.argv[1]); out=Path(sys.argv[2])
          with p.open('rb') as f:
              ident=f.read(16); rest=f.read(48)
              if ident[:4]!=b'\x7fELF' or ident[4]!=2 or ident[5]!=1: raise SystemExit(51)
              fs=struct.unpack('<HHIQQQIHHHHHH',rest)
              phoff,phentsize,phnum=fs[4],fs[8],fs[9]
              segs=[]
              for i in range(phnum):
                  f.seek(phoff+i*phentsize); r=f.read(56)
                  t,flags,off,va,_pa,sz,_msz,_al=struct.unpack('<IIQQQQQQ',r)
                  if t==1: segs.append((off,va,sz,flags))
              def read_va(start,end,exec_required):
                  if end<=start or end-start>0x1000: raise SystemExit(52)
                  for off,va,sz,flags in segs:
                      if va<=start and end<=va+sz:
                          if exec_required and not (flags&1): raise SystemExit(53)
                          f.seek(off+start-va); d=f.read(end-start)
                          if len(d)==end-start: return d
                  raise SystemExit(54)
              windows={
                  'setup_a':   (0x7d3400,0x7d4400,True),
                  'setup_b':   (0x7d4400,0x7d5400,True),
                  'strings_d': (0x1c96cd0,0x1c96f20,False),
                  'strings_e': (0x1ce7240,0x1ce72b0,False),
                  'strings_f': (0x28a7c60,0x28a7cd0,False),
                  'strings_g': (0x1d910f0,0x1d91160,False),
              }
              staged={k:read_va(a,b,x) for k,(a,b,x) in windows.items()}
          rows=[]
          for key,data in staged.items():
              dig=hashlib.sha256(data).hexdigest()
              rows.append(f'{key}_hex={data.hex()}\n{key}_sha256={dig}\n')
              print(f'AUTHSESSION_PHASE4_SOURCE_{key.upper()}_SHA256={dig}')
          with out.open('a') as h: h.write(''.join(rows))
          print('AUTHSESSION_PHASE4_EXACT_FILE_FENCE=PASS')
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          print('AUTHSESSION_PHASE4_SOURCE_PROCESS_OBSERVATION=false')
          print('AUTHSESSION_PHASE4_SOURCE_X11_OBSERVATION=false')
          print('AUTHSESSION_PHASE4_SOURCE_LOGIN=false')
          print('AUTHSESSION_PHASE4_SOURCE_SECRET_ACCESS=false')
          print('AUTHSESSION_PHASE4_SOURCE_DISASSEMBLY=false')
          print('AUTHSESSION_PHASE4_SOURCE_SEMANTIC_CLASSIFICATION=false')
          print('AUTHSESSION_PHASE4_RAW_CLIENT_UPLOADED=false')
          print('AUTHSESSION_PHASE4_BOUNDED_FILE_WINDOWS_STAGED=true')
          PY

  hosted-decode:
    name: Decode phase4 auth/session object provenance
    needs: source-sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: docs/OTC-20260817-track-a-auth-session-flow-static
      SETUP_A_HEX: ${{ needs.source-sanitize.outputs.setup_a_hex }}
      SETUP_A_SHA256: ${{ needs.source-sanitize.outputs.setup_a_sha256 }}
      SETUP_B_HEX: ${{ needs.source-sanitize.outputs.setup_b_hex }}
      SETUP_B_SHA256: ${{ needs.source-sanitize.outputs.setup_b_sha256 }}
      STRINGS_D_HEX: ${{ needs.source-sanitize.outputs.strings_d_hex }}
      STRINGS_D_SHA256: ${{ needs.source-sanitize.outputs.strings_d_sha256 }}
      STRINGS_E_HEX: ${{ needs.source-sanitize.outputs.strings_e_hex }}
      STRINGS_E_SHA256: ${{ needs.source-sanitize.outputs.strings_e_sha256 }}
      STRINGS_F_HEX: ${{ needs.source-sanitize.outputs.strings_f_hex }}
      STRINGS_F_SHA256: ${{ needs.source-sanitize.outputs.strings_f_sha256 }}
      STRINGS_G_HEX: ${{ needs.source-sanitize.outputs.strings_g_hex }}
      STRINGS_G_SHA256: ${{ needs.source-sanitize.outputs.strings_g_sha256 }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 71
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 72
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || exit 73
          python3 - <<'PY'
          import hashlib,os,re,subprocess,tempfile
          from pathlib import Path
          specs={
            'SETUP_A':(0x7d3400,0x1000),'SETUP_B':(0x7d4400,0x1000),
            'STRINGS_D':(0x1c96cd0,0x250),'STRINGS_E':(0x1ce7240,0x70),
            'STRINGS_F':(0x28a7c60,0x70),'STRINGS_G':(0x1d910f0,0x70),
          }
          def get(name,n):
              d=bytes.fromhex(os.environ[name+'_HEX'])
              if len(d)!=n: raise SystemExit(74)
              if hashlib.sha256(d).hexdigest()!=os.environ[name+'_SHA256']: raise SystemExit(75)
              return d
          def asm(name,start,n):
              data=get(name,n)
              with tempfile.TemporaryDirectory(prefix='auth-session-p4-') as td:
                  p=Path(td)/(name.lower()+'.bin'); p.write_bytes(data)
                  txt=subprocess.run(['objdump','-D','-b','binary','-m','i386:x86-64','-M','intel',f'--adjust-vma=0x{start:x}',str(p)],check=True,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE).stdout
              rows=[]
              for line in txt.splitlines():
                  m=re.match(r'^\s*([0-9a-f]+):\s+([0-9a-f ]+)\s+(.+)$',line)
                  if m: rows.append((int(m.group(1),16),m.group(3).strip()))
              return rows
          wanted={0x3076908,0x3070398,0x3084fa0}
          print('AUTHSESSION_PHASE4_HOSTED_DECODE=PASS')
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          for name,start in [('SETUP_A',0x7d3400),('SETUP_B',0x7d4400)]:
              rows=asm(name,start,0x1000)
              chosen=set()
              for idx,(a,ins) in enumerate(rows):
                  refs=[int(x,16) for x in re.findall(r'#\s*0x([0-9a-f]+)',ins)]
                  interesting=(any(x in wanted for x in refs)
                              or '[rbx+0x88]' in ins or '[rbx+0x9c0]' in ins
                              or re.search(r'\bmov\s+rbx,rdi\b',ins)
                              or re.search(r'\bmov\s+rbx,rsi\b',ins)
                              or (ins.startswith('push   rbp') if False else False))
                  if interesting:
                      for j in range(max(0,idx-5),min(len(rows),idx+7)): chosen.add(j)
              print(f'AUTHSESSION_PHASE4_{name}_PROVENANCE_BEGIN')
              for j in sorted(chosen)[:220]:
                  a,ins=rows[j]; print(f'{a:x}: {ins}')
              print(f'AUTHSESSION_PHASE4_{name}_PROVENANCE_END')
              print(f'AUTHSESSION_PHASE4_{name}_KNOWN_REF_HITS='+','.join(
                    f'0x{a:x}->0x{x:x}' for a,ins in rows for x in [int(y,16) for y in re.findall(r'#\s*0x([0-9a-f]+)',ins)] if x in wanted))
          def cstring(name,start,target):
              data=get(name,specs[name][1]); off=target-start
              if not 0<=off<len(data): raise SystemExit(76)
              s=data[off:off+128].split(b'\0',1)[0]
              safe=''.join(chr(b) if 32<=b<127 else f'\\x{b:02x}' for b in s)
              print(f'AUTHSESSION_PHASE4_STATIC_STRING_0x{target:x}={safe}')
          cstring('STRINGS_D',0x1c96cd0,0x1c96d0b)
          cstring('STRINGS_D',0x1c96cd0,0x1c96e88)
          cstring('STRINGS_E',0x1ce7240,0x1ce7262)
          cstring('STRINGS_F',0x28a7c60,0x28a7c92)
          cstring('STRINGS_G',0x1d910f0,0x1d91113)
          PY

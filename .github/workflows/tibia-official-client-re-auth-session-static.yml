name: Track A native auth session static proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-auth-session-flow-static]
    paths: [.github/workflows/tibia-official-client-re-auth-session-static.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-auth-session-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Stage exact-file phase5 QMeta windows
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: docs/OTC-20260817-track-a-auth-session-flow-static
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    outputs:
      unknown_qmeta_hex: ${{ steps.stage.outputs.unknown_qmeta_hex }}
      unknown_qmeta_sha256: ${{ steps.stage.outputs.unknown_qmeta_sha256 }}
      known_qmeta_hex: ${{ steps.stage.outputs.known_qmeta_hex }}
      known_qmeta_sha256: ${{ steps.stage.outputs.known_qmeta_sha256 }}
    steps:
      - id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 61
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 62
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]] || exit 63
          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          for candidate in "${candidates[@]}"; do
            [[ -f "$candidate" && ! -L "$candidate" ]] || continue
            [[ "$(stat -c %s "$candidate")" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            python3 - "$candidate" "$EXPECTED_CLIENT_SHA256" <<'PY' && { source_client="$candidate"; break; }
          import hashlib,sys
          h=hashlib.sha256()
          with open(sys.argv[1],'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
          raise SystemExit(h.hexdigest()!=sys.argv[2])
          PY
          done
          [[ -n "$source_client" ]] || exit 50
          python3 - "$source_client" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,struct,sys
          from pathlib import Path
          p=Path(sys.argv[1]); out=Path(sys.argv[2])
          with p.open('rb') as f:
              ident=f.read(16); rest=f.read(48)
              if ident[:4]!=b'\x7fELF' or ident[4]!=2 or ident[5]!=1: raise SystemExit(51)
              fs=struct.unpack('<HHIQQQIHHHHHH',rest)
              phoff,phentsize,phnum=fs[4],fs[8],fs[9]
              segs=[]
              for i in range(phnum):
                  f.seek(phoff+i*phentsize); r=f.read(56)
                  t,flags,off,va,_pa,sz,_msz,_al=struct.unpack('<IIQQQQQQ',r)
                  if t==1: segs.append((off,va,sz,flags))
              def read_va(a,b):
                  for off,va,sz,flags in segs:
                      if va<=a and b<=va+sz:
                          f.seek(off+a-va); d=f.read(b-a)
                          if len(d)==b-a: return d
                  raise SystemExit(54)
              windows={
                  'unknown_qmeta':(0x3085b20,0x3085be0),
                  'known_qmeta':(0x3084f60,0x3085020),
              }
              staged={k:read_va(a,b) for k,(a,b) in windows.items()}
          rows=[]
          for key,data in staged.items():
              dig=hashlib.sha256(data).hexdigest()
              rows.append(f'{key}_hex={data.hex()}\n{key}_sha256={dig}\n')
              print(f'AUTHSESSION_PHASE5_SOURCE_{key.upper()}_SHA256={dig}')
          with out.open('a') as h: h.write(''.join(rows))
          print('AUTHSESSION_PHASE5_EXACT_FILE_FENCE=PASS')
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          print('AUTHSESSION_PHASE5_SOURCE_PROCESS_OBSERVATION=false')
          print('AUTHSESSION_PHASE5_SOURCE_X11_OBSERVATION=false')
          print('AUTHSESSION_PHASE5_SOURCE_LOGIN=false')
          print('AUTHSESSION_PHASE5_SOURCE_SECRET_ACCESS=false')
          print('AUTHSESSION_PHASE5_SOURCE_DISASSEMBLY=false')
          print('AUTHSESSION_PHASE5_SOURCE_SEMANTIC_CLASSIFICATION=false')
          print('AUTHSESSION_PHASE5_RAW_CLIENT_UPLOADED=false')
          PY

  hosted-decode:
    name: Decode phase5 QMeta identity
    needs: source-sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: docs/OTC-20260817-track-a-auth-session-flow-static
      UNKNOWN_QMETA_HEX: ${{ needs.source-sanitize.outputs.unknown_qmeta_hex }}
      UNKNOWN_QMETA_SHA256: ${{ needs.source-sanitize.outputs.unknown_qmeta_sha256 }}
      KNOWN_QMETA_HEX: ${{ needs.source-sanitize.outputs.known_qmeta_hex }}
      KNOWN_QMETA_SHA256: ${{ needs.source-sanitize.outputs.known_qmeta_sha256 }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 71
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 72
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || exit 73
          python3 - <<'PY'
          import hashlib,os,struct
          specs={'UNKNOWN_QMETA':(0x3085b20,0xc0),'KNOWN_QMETA':(0x3084f60,0xc0)}
          def get(name,n):
              d=bytes.fromhex(os.environ[name+'_HEX'])
              if len(d)!=n: raise SystemExit(74)
              if hashlib.sha256(d).hexdigest()!=os.environ[name+'_SHA256']: raise SystemExit(75)
              return d
          print('AUTHSESSION_PHASE5_HOSTED_DECODE=PASS')
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          for name,(start,n) in specs.items():
              d=get(name,n)
              print(f'AUTHSESSION_PHASE5_{name}_QWORDS_BEGIN')
              for off in range(0,n,8):
                  q=struct.unpack_from('<Q',d,off)[0]
                  print(f'0x{start+off:x}=0x{q:x}')
              print(f'AUTHSESSION_PHASE5_{name}_QWORDS_END')
              print(f'AUTHSESSION_PHASE5_{name}_DWORDS_BEGIN')
              for off in range(0,n,4):
                  u=struct.unpack_from('<I',d,off)[0]
                  if u or off in range(0x30,0x90): print(f'0x{start+off:x}=0x{u:x}')
              print(f'AUTHSESSION_PHASE5_{name}_DWORDS_END')
          PY

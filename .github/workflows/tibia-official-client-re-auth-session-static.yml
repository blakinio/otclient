name: Track A native auth session static proof
on:
  push:
    branches: [docs/OTC-20260817-track-a-auth-session-flow-static]
    paths: [.github/workflows/tibia-official-client-re-auth-session-static.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-sanitize:
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    outputs:
      class_hex: ${{ steps.s.outputs.class_hex }}
      class_sha: ${{ steps.s.outputs.class_sha }}
    steps:
      - id: s
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$GITHUB_REF_NAME" == docs/OTC-20260817-track-a-auth-session-flow-static && "$RUNNER_NAME" == synology-otclient-01 ]] || exit 61
          for c in '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client' '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'; do
            [[ -f "$c" && ! -L "$c" && "$(stat -c %s "$c")" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            [[ "$(sha256sum "$c"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]] && { client="$c"; break; }
          done
          [[ -n "${client:-}" ]] || exit 50
          python3 - "$client" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,struct,sys
          with open(sys.argv[1],'rb') as f:
              f.seek(16);h=struct.unpack('<HHIQQQIHHHHHH',f.read(48));segs=[]
              for i in range(h[9]):
                  f.seek(h[4]+i*h[8]);r=f.read(56);t,fl,o,v,pa,s,ms,a=struct.unpack('<IIQQQQQQ',r)
                  if t==1:segs.append((o,v,s))
              a,b=0x1ccb7d8,0x1ccb7fe
              for o,v,s in segs:
                  if v<=a and b<=v+s:f.seek(o+a-v);d=f.read(b-a);break
              else:raise SystemExit(54)
          z=hashlib.sha256(d).hexdigest()
          with open(sys.argv[2],'a') as q:q.write(f'class_hex={d.hex()}\nclass_sha={z}\n')
          print('AUTHSESSION_PHASE5C_EXACT_FILE_FENCE=PASS');print('AUTHSESSION_RUNTIME_ACCESS=none');print('AUTHSESSION_PHASE5C_SOURCE_SECRET_ACCESS=false');print('AUTHSESSION_PHASE5C_SOURCE_DISASSEMBLY=false');print('AUTHSESSION_PHASE5C_RAW_CLIENT_UPLOADED=false')
          PY
  hosted-decode:
    needs: source-sanitize
    runs-on: ubuntu-24.04
    steps:
      - env:
          H: ${{ needs.source-sanitize.outputs.class_hex }}
          S: ${{ needs.source-sanitize.outputs.class_sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,os
          d=bytes.fromhex(os.environ['H']);assert len(d)==0x26 and hashlib.sha256(d).hexdigest()==os.environ['S']
          print('AUTHSESSION_PHASE5C_HOSTED_DECODE=PASS');print('AUTHSESSION_RUNTIME_ACCESS=none');print('AUTHSESSION_PHASE5C_RECEIVER_QMETA_CLASS='+d.decode('ascii'))
          PY

name: Track A aware range experiment
on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-aware-range-experiment.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false
jobs:
  measure:
    runs-on: [otclient, synology]
    timeout-minutes: 6
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Capture decoded map records for controlled one-tile moves
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          export HOME="$state/home" DISPLAY="$TRACK_DISPLAY" PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin" LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          pid="$(tr -cd '0-9' <"$state/runtime/client.pid")"
          [[ -r "/proc/$pid/environ" ]]; grep -azFxq "$marker" "/proc/$pid/environ"; kill -0 "$pid"
          [[ "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          window=''; for w in $("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$'); do g="$("$toolroot/usr/bin/xdotool" getwindowgeometry --shell "$w")"; [[ "$(sed -n 's/^WIDTH=//p'<<<"$g")" == 1020 && "$(sed -n 's/^HEIGHT=//p'<<<"$g")" == 650 ]] && { window="$w"; break; }; done; [[ -n "$window" ]]
          line="$(grep -F "$client" "/proc/$pid/maps"|awk '$2~/r-xp/{print;exit}')"; start="$(awk '{split($1,a,"-");print a[1]}'<<<"$line")"; off="$(awk '{print $3}'<<<"$line")"; bias=$((16#$start-16#$off))
          evidence="$state/evidence/aware-range-$(date -u +%Y%m%dT%H%M%SZ)"; mkdir -p "$evidence"; records="$evidence/records.txt"; :>"$records"
          cat >"$evidence/probe.gdb" <<EOF
          set pagination off
          set confirm off
          attach $pid
          python
          import gdb,struct,time
          inf=gdb.selected_inferior(); out='$records'
          class B(gdb.Breakpoint):
            def __init__(self): super().__init__('*0x%x'%($bias+0x19a8ea3))
            def stop(self):
              try:
                rsp=int(gdb.parse_and_eval('\$rsp')); order=int(gdb.parse_and_eval('\$rbp'))&0xffffffff
                x,y,z=struct.unpack('<III',bytes(inf.read_memory(rsp+0x88,12)))
                if 0<x<100000 and 0<y<100000 and z<32 and order<128:
                  with open(out,'a') as f:f.write(f'{time.time_ns()} {x} {y} {z} {order}\n')
              except Exception: pass
              return False
          B()
          end
          continue
          EOF
          gdb -q -nx -batch -x "$evidence/probe.gdb" >"$evidence/gdb.log" 2>&1 & gp=$!; sleep 2
          "$toolroot/usr/bin/xdotool" windowactivate --sync "$window" 2>/dev/null || true; "$toolroot/usr/bin/xdotool" windowfocus --sync "$window"
          echo PHASE=BASE >>"$evidence/phases.txt"; sleep 1
          for pair in 'RIGHT Right Left' 'LEFT Left Right' 'UP Up Down' 'DOWN Down Up'; do set -- $pair; name=$1; key=$2; back=$3; echo "PHASE=$name START=$(date +%s%N)" >>"$evidence/phases.txt"; "$toolroot/usr/bin/xdotool" key "$key"; sleep 1.2; echo "PHASE=$name END=$(date +%s%N)" >>"$evidence/phases.txt"; "$toolroot/usr/bin/xdotool" key "$back"; sleep 1.2; done
          kill -INT "$gp" 2>/dev/null || true; sleep 1; kill -CONT "$pid" 2>/dev/null || true
          python3 - "$records" <<'PY'
          import sys
          rows=[]
          for l in open(sys.argv[1]):
            p=l.split();
            if len(p)==5: rows.append(tuple(map(int,p)))
          print('TRACK_A_RECORDS',len(rows))
          if not rows: raise SystemExit(1)
          xs=[r[1] for r in rows]; ys=[r[2] for r in rows]; zs=[r[3] for r in rows]
          print('TRACK_A_X_MIN',min(xs)); print('TRACK_A_X_MAX',max(xs)); print('TRACK_A_X_SPAN',max(xs)-min(xs)+1)
          print('TRACK_A_Y_MIN',min(ys)); print('TRACK_A_Y_MAX',max(ys)); print('TRACK_A_Y_SPAN',max(ys)-min(ys)+1)
          print('TRACK_A_Z_MIN',min(zs)); print('TRACK_A_Z_MAX',max(zs)); print('TRACK_A_Z_VALUES',','.join(map(str,sorted(set(zs)))))
          print('TRACK_A_UNIQUE_XYZ',len(set((r[1],r[2],r[3]) for r in rows)))
          PY
          kill -0 "$pid"; grep -azFxq "$marker" "/proc/$pid/environ"; echo TRACK_A_SESSION_LEFT_RUNNING=true

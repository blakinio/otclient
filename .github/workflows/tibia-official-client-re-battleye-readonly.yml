name: Track A BattlEye read-only inspection

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-battleye-readonly.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-battleye-readonly.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect installed Linux client for BattlEye
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Read-only BattlEye inventory
        shell: bash
        env:
          EXPECTED_CLIENT_SIZE: '51965216'
          EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
        run: |
          set -Eeuo pipefail
          set +x
          umask 077

          if [[ "${RUNNER_NAME:-}" != 'synology-otclient-01' ]]; then
            echo "BATTLEYE_AUDIT_ERROR=wrong_runner"
            exit 2
          fi

          base='/home/runner/_work/_otclient_tibia_re_state'
          echo "BATTLEYE_AUDIT_RUNNER=synology-otclient-01"
          echo "BATTLEYE_AUDIT_DISCOVERY_ROOT=$base"

          path_hits="$RUNNER_TEMP/battleye-path-hits.txt"
          : >"$path_hits"
          for root in "$base" /home/runner/.local/share /opt /usr/local; do
            [[ -e "$root" ]] || continue
            find "$root" -xdev -maxdepth 16 \
              \( -type f -o -type d -o -type l \) \
              \( -iname '*battleye*' -o -iname 'beclient*' -o -iname 'beservice*' \) \
              -print 2>/dev/null || true
          done | sort -u >"$path_hits"

          path_count="$(grep -c . "$path_hits" || true)"
          echo "BATTLEYE_AUDIT_PATH_HIT_COUNT=$path_count"
          if (( path_count > 0 )); then
            while IFS= read -r hit; do
              printf 'BATTLEYE_AUDIT_PATH_HIT=%s\n' "$hit"
            done <"$path_hits"
          fi

          exact_files="$RUNNER_TEMP/exact-client-files.txt"
          : >"$exact_files"
          while IFS= read -r -d '' candidate; do
            sha="$(sha256sum "$candidate" 2>/dev/null | awk '{print $1}')"
            if [[ "$sha" == "$EXPECTED_CLIENT_SHA256" ]]; then
              printf '%s\n' "$candidate" >>"$exact_files"
            fi
          done < <(
            for root in "$base" /home/runner/.local/share /opt /usr/local; do
              [[ -e "$root" ]] || continue
              find "$root" -xdev -maxdepth 16 -type f -size "${EXPECTED_CLIENT_SIZE}c" -print0 2>/dev/null || true
            done
          )
          sort -u -o "$exact_files" "$exact_files"

          exact_file_count="$(grep -c . "$exact_files" || true)"
          echo "BATTLEYE_AUDIT_EXACT_CLIENT_FILE_COUNT=$exact_file_count"
          while IFS= read -r client; do
            [[ -n "$client" ]] || continue
            printf 'BATTLEYE_AUDIT_EXACT_CLIENT_FILE=%s\n' "$client"
          done <"$exact_files"

          token_source=''
          if (( exact_file_count > 0 )); then
            token_source="$(head -n1 "$exact_files")"
          fi

          process_hits=0
          exact_client_candidates=0
          process_exact_source=''
          for procdir in /proc/[0-9]*; do
            if [[ -r "$procdir/comm" ]]; then
              comm="$(cat "$procdir/comm" 2>/dev/null || true)"
              lower="${comm,,}"
              case "$lower" in
                *battleye*|*beclient*|*beservice*)
                  process_hits=$((process_hits + 1))
                  printf 'BATTLEYE_AUDIT_PROCESS_NAME=%s\n' "$comm"
                  ;;
              esac
            fi

            exe="$(readlink -f "$procdir/exe" 2>/dev/null || true)"
            [[ -n "$exe" && -f "$exe" ]] || continue
            size="$(stat -c '%s' "$exe" 2>/dev/null || true)"
            [[ "$size" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            sha="$(sha256sum "$exe" 2>/dev/null | awk '{print $1}')"
            [[ "$sha" == "$EXPECTED_CLIENT_SHA256" ]] || continue
            exact_client_candidates=$((exact_client_candidates + 1))
            [[ -n "$process_exact_source" ]] || process_exact_source="$exe"
          done
          echo "BATTLEYE_AUDIT_PROCESS_NAME_HIT_COUNT=$process_hits"
          echo "BATTLEYE_AUDIT_EXACT_CLIENT_PROCESS_COUNT=$exact_client_candidates"

          if [[ -z "$token_source" && -n "$process_exact_source" ]]; then
            token_source="$process_exact_source"
          fi

          if [[ -n "$token_source" ]]; then
            echo "BATTLEYE_AUDIT_TOKEN_SOURCE_EXACT_FENCE=PASS"
            for token in BattlEye BEClient BEService; do
              key="$(printf '%s' "$token" | tr '[:lower:]' '[:upper:]')"
              if LC_ALL=C grep -aFq -- "$token" "$token_source"; then
                echo "BATTLEYE_AUDIT_CLIENT_TOKEN_${key}=PRESENT"
              else
                echo "BATTLEYE_AUDIT_CLIENT_TOKEN_${key}=ABSENT"
              fi
            done
          else
            echo "BATTLEYE_AUDIT_TOKEN_SOURCE_EXACT_FENCE=UNAVAILABLE"
            echo "BATTLEYE_AUDIT_CLIENT_TOKEN_BATTLEYE=UNKNOWN"
            echo "BATTLEYE_AUDIT_CLIENT_TOKEN_BECLIENT=UNKNOWN"
            echo "BATTLEYE_AUDIT_CLIENT_TOKEN_BESERVICE=UNKNOWN"
          fi

          echo "BATTLEYE_AUDIT_MUTATION_PERFORMED=false"

name: Track A be4f48 queue signal bf relay receiver type

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-official-client-re-be4f48-queue-signal-bf-relay-receiver-type.yml
      - tools/tibia_re_be4f48_queue_signal_bf_relay_receiver_type/**
      - docs/agents/tasks/active/OTC-20260904-be4f48-queue-signal-bf-relay-receiver-type.md
      - docs/agents/evidence/OTC-20260904-be4f48-queue-signal-bf-relay-receiver-type/**

permissions:
  contents: read

jobs:
  static-relay-receiver-type:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate repository-only relay receiver contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/tibia_re_be4f48_queue_signal_bf_relay_receiver_type/test_contract.py
          python3 -m py_compile tools/tibia_re_be4f48_queue_signal_bf_relay_receiver_type/test_contract.py
          python3 -m py_compile tools/tibia_re_be4f48_queue_signal_bf_relay_receiver_type/relay_receiver_type.py
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Prepare exact public client package through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools binutils
          r="$RUNNER_TEMP/be4f48-queue-signal-bf-relay-receiver-type"
          mkdir -p "$r/bin" "$r/state" "$r/pkg"
          curl -fsSL -o "$r/bin/wgcf" https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  '"$r"'/bin/wgcf' | sha256sum -c - >/dev/null
          curl -fsSL -o "$r/bin/wireproxy.tgz" https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  '"$r"'/bin/wireproxy.tgz' | sha256sum -c - >/dev/null
          mkdir "$r/bin/wp" && tar -xzf "$r/bin/wireproxy.tgz" -C "$r/bin/wp"
          cp "$(find "$r/bin/wp" -type f -name wireproxy -print -quit)" "$r/bin/wireproxy"
          chmod 755 "$r/bin/wgcf" "$r/bin/wireproxy"
          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25348\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            curl --socks5-hostname 127.0.0.1:25348 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null && grep -Eq '^warp=(on|plus)$' "$r/trace" && break
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          base=https://static.tibia.com/launcher/tibiaclient-linux-current
          curl --socks5-hostname 127.0.0.1:25348 --compressed -fL "$base/package.json" -o "$r/pkg/package.json"
          python3 - "$r/pkg/package.json" "$GITHUB_ENV" "$r" <<'PY'
          import json,sys
          package, env_path, root = sys.argv[1:]
          doc=json.load(open(package,encoding='utf-8'))
          rows=[x for x in doc.get('files',[]) if isinstance(x,dict) and x.get('localfile')=='bin/client']
          if len(rows)!=1: raise SystemExit('expected one bin/client row')
          row=rows[0]
          vals={'VERSION':str(doc.get('version') or ''),'PACKED_SHA':str(row.get('packedhash') or '').lower(),'UNPACKED_SHA':str(row.get('unpackedhash') or '').lower(),'PACKED_SIZE':str(row.get('packedsize')),'UNPACKED_SIZE':str(row.get('unpackedsize')),'CLIENT_URL':str(row.get('url') or '')}
          exp={'VERSION':'15.32.be4f48','UNPACKED_SHA':'552dcf794c41dae8c3dca10b740cd23e2f2ebcaf82d86576e8a67d924409e4e1','UNPACKED_SIZE':'52105824'}
          for k,v in exp.items():
              if vals[k]!=v: raise SystemExit(f'exact current fence moved: {k}={vals[k]!r} expected {v!r}')
          with open(env_path,'a',encoding='utf-8') as h:
              for k,v in vals.items(): h.write(f'RE_{k}={v}\n')
              h.write(f'RE_ROOT={root}\n')
              h.write('RE_BASE=https://static.tibia.com/launcher/tibiaclient-linux-current\n')
          print('BE4F48_QUEUE_SIGNAL_BF_RELAY_RECEIVER_TYPE_EXACT_FENCE=PASS')
          PY

      - name: Materialize transient exact client and resolve relay receiver type
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -f "$RE_ROOT/pkg/client" "$RE_ROOT/pkg/client.lzma"' EXIT
          curl --socks5-hostname 127.0.0.1:25348 --compressed -fL "$RE_BASE/$RE_CLIENT_URL" -o "$RE_ROOT/pkg/client.lzma"
          echo "$RE_PACKED_SHA  $RE_ROOT/pkg/client.lzma" | sha256sum -c - >/dev/null
          test "$(stat -c %s "$RE_ROOT/pkg/client.lzma")" = "$RE_PACKED_SIZE"
          python3 - "$RE_ROOT/pkg/client.lzma" "$RE_ROOT/pkg/client" "$RE_UNPACKED_SHA" "$RE_UNPACKED_SIZE" <<'PY'
          import hashlib,lzma,pathlib,sys
          src,dst,expected_sha,expected_size=sys.argv[1:]
          packed=pathlib.Path(src).read_bytes(); prop=packed[32]; lc=prop%9; z=prop//9; lp=z%5; pb=z//5; ds=int.from_bytes(packed[33:37],'little')
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          if len(raw)!=int(expected_size) or hashlib.sha256(raw).hexdigest()!=expected_sha: raise SystemExit('unpacked client fence mismatch')
          pathlib.Path(dst).write_bytes(raw)
          PY
          mkdir -p artifacts/be4f48-queue-signal-bf-relay-receiver-type
          python3 tools/tibia_re_be4f48_queue_signal_bf_relay_receiver_type/relay_receiver_type.py --client "$RE_ROOT/pkg/client" --output artifacts/be4f48-queue-signal-bf-relay-receiver-type/result.json
          rm -f "$RE_ROOT/pkg/client" "$RE_ROOT/pkg/client.lzma"
          echo RAW_CLIENT_RETAINED=false

      - name: Validate sanitized relay receiver result
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          p='artifacts/be4f48-queue-signal-bf-relay-receiver-type/result.json'; d=json.load(open(p,encoding='utf-8'))
          assert d['runtime_access']=='none' and d['official_client_executed'] is False and d['track_b_pr_284_modified'] is False
          assert d['exact_client']['version']=='15.32.be4f48' and d['exact_client']['size']==52105824
          assert d['exact_client']['sha256']=='552dcf794c41dae8c3dca10b740cd23e2f2ebcaf82d86576e8a67d924409e4e1'
          assert d['queue_signal_name']=='clientMessageReadyToProcess' and d['queue_signal_index_hex']=='0xbf'
          assert d['connectimpl_callsite']=='0xbe2eee' and d['receiver_provenance']=='ENTRY_ARG:rdi'
          assert d['qslot_function_target']=='0xbd2190'
          assert d['queue_signal_connection_role'] in ('SIGNAL_RELAY','WRITER_EDGE','OTHER','UNKNOWN')
          assert d['terminal_result'] in ('QUEUE_SIGNAL_BF_RELAY_RECEIVER_TYPE_PROVEN','NEXT_RELAY_EDGE_PROVEN','SOURCE_BLOCKER')
          print('BE4F48_QUEUE_SIGNAL_BF_RELAY_RECEIVER_TYPE_SANITIZED_RESULT=PASS')
          print(json.dumps(d,sort_keys=True))
          PY

      - name: Upload sanitized bounded result only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: be4f48-queue-signal-bf-relay-receiver-type-${{ github.sha }}
          path: artifacts/be4f48-queue-signal-bf-relay-receiver-type/result.json
          if-no-files-found: error
          retention-days: 3

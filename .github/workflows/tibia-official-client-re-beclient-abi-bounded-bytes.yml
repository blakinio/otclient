name: Track A BEClient ABI bounded bytes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-abi-bounded-bytes.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-abi-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Map direct dynamic-loader callsites statically
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Parse PLT relocations and emit bounded callsite windows
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          base='/home/runner/_work/_otclient_tibia_re_state'
          package="$base/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package"
          client="$package/bin/client"
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 3

          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          p=pathlib.Path(sys.argv[1]); d=p.read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if o<0 or o>=len(blob):return ''
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):
              secs.append({'idx':i,'name':cs(names,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'info':x[7],'align':x[8],'entsize':x[9]})
          by={s['name']:s for s in secs}
          dyn=by['.dynsym']; strsec=secs[dyn['link']]; sb=d[strsec['off']:strsec['off']+strsec['size']]
          syms=[]
          for o in range(dyn['off'],dyn['off']+dyn['size'],dyn['entsize'] or 24):
              if o+24>len(d):break
              sn,info,other,si,val,sz=struct.unpack_from(E+'IBBHQQ',d,o)
              syms.append(cs(sb,sn).split('@',1)[0])

          relsec=by.get('.rela.plt') or by.get('.rela.plt.sec')
          pltsec=by.get('.plt.sec') or by.get('.plt')
          if not relsec or not pltsec:
              print('BE_DLOADER_ERROR=plt_metadata_missing');raise SystemExit(4)
          rels=[]; ent=relsec['entsize'] or 24
          for i,o in enumerate(range(relsec['off'],relsec['off']+relsec['size'],ent)):
              if o+24>len(d):break
              r_off,r_info,addend=struct.unpack_from(E+'QQq',d,o)
              symidx=r_info>>32; name=syms[symidx] if symidx<len(syms) else '?'
              rels.append((i,name,r_off,r_info&0xffffffff))
          plt_ent=pltsec['entsize'] or 16
          reserved=0 if pltsec['name']=='.plt.sec' else 1
          mapping={name:pltsec['addr']+(i+reserved)*plt_ent for i,name,_,_ in rels if name in {'dlopen','dlsym','dlclose','dlerror','dladdr'}}
          print('BE_DLOADER_PLT_MAP_BEGIN')
          print(f'plt_section={pltsec["name"]} addr=0x{pltsec["addr"]:x} entsize=0x{plt_ent:x} reserved={reserved}')
          for name,addr in sorted(mapping.items()):print(f'{name}=0x{addr:x}')
          print('BE_DLOADER_PLT_MAP_END')

          execsecs=[s for s in secs if s['type']==1 and s['flags']&0x4 and s['off']+s['size']<=len(d)]
          calls=[]
          for s in execsecs:
              blob=d[s['off']:s['off']+s['size']]
              for i in range(len(blob)-5):
                  if blob[i]!=0xe8:continue
                  disp=struct.unpack_from('<i',blob,i+1)[0]; va=s['addr']+i; target=va+5+disp
                  for name,addr in mapping.items():
                      if target==addr:calls.append((name,va,s['name']))
          print('BE_DLOADER_DIRECT_CALLS_BEGIN')
          for name,va,sec in calls:print(f'name={name} call=0x{va:x} section={sec}')
          print('BE_DLOADER_DIRECT_CALLS_END')

          def emit(label,start,size=0x180):
              if start<0 or start>=len(d):return
              blob=d[start:min(len(d),start+size)]
              print(f'{label}_START=0x{start:x}')
              print(f'{label}_SIZE=0x{len(blob):x}')
              print(f'{label}_SHA256={hashlib.sha256(blob).hexdigest()}')
              print(f'{label}_HEX={blob.hex()}')
          for idx,(name,va,sec) in enumerate(calls[:30]):
              emit(f'BE_DLOADER_{name}_{idx}',max(0,va-0x80),0x200)

          # Print nearby BattlEye/BEClient cstrings and common RIP-relative refs for correlation only.
          strings=[]
          for token in (b'BattlEye',b'BEClient'):
              pos=0
              while True:
                  pos=d.find(token,pos)
                  if pos<0:break
                  l=d.rfind(b'\0',max(0,pos-256),pos);l=0 if l<0 else l+1
                  r=d.find(b'\0',pos,min(len(d),pos+256));r=len(d) if r<0 else r
                  txt=''.join(chr(b) if 32<=b<127 else '?' for b in d[l:r])[:400]
                  strings.append((pos,txt));pos+=1
          print('BE_DLOADER_RELEVANT_STRINGS_BEGIN')
          for pos,txt in strings[:100]:print(f'pos=0x{pos:x} text={txt}')
          print('BE_DLOADER_RELEVANT_STRINGS_END')
          print('BE_DLOADER_EXECUTED=false')
          print('BE_DLOADER_MUTATION_PERFORMED=false')
          PY

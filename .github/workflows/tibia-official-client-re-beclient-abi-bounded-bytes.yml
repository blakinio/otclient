name: Track A BEClient ABI bounded bytes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-abi-bounded-bytes.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-abi-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Inventory exact Init exporters in retained package
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Parse dynamic symbols without executing libraries
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          package='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package'
          client="$package/bin/client"
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 3
          python3 - "$package" <<'PY'
          import hashlib,pathlib,struct,sys
          root=pathlib.Path(sys.argv[1]); E='<'
          def exports(path):
              try:d=path.read_bytes()
              except OSError:return None
              if len(d)<64 or d[:4]!=b'\x7fELF' or d[4]!=2 or d[5]!=1:return None
              try:
                  h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16);_,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
                  shfmt=E+'IIQQQQIIQQ';sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
                  st=sh[shstrndx];names=d[st[4]:st[4]+st[5]]
                  def cs(blob,o):
                      if o<0 or o>=len(blob):return ''
                      e=blob.find(b'\0',o);e=len(blob) if e<0 else e
                      return blob[o:e].decode('utf8','replace')
                  secs=[]
                  for i,x in enumerate(sh):secs.append({'idx':i,'name':cs(names,x[0]),'type':x[1],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
                  dyn=next((s for s in secs if s['name']=='.dynsym'),None)
                  if not dyn or not (0<=dyn['link']<len(secs)):return set()
                  ss=secs[dyn['link']];sb=d[ss['off']:ss['off']+ss['size']];out=set()
                  for o in range(dyn['off'],dyn['off']+dyn['size'],dyn['entsize'] or 24):
                      if o+24>len(d):break
                      sn,info,other,si,val,sz=struct.unpack_from(E+'IBBHQQ',d,o);nm=cs(sb,sn).split('@',1)[0]
                      bind=info>>4;vis=other&3
                      if nm and si!=0 and bind in (1,2) and vis==0:out.add(nm)
                  return out
              except Exception:return None
          files=[]
          for p in root.rglob('*'):
              if not p.is_file():continue
              # Parse ELF files regardless of suffix; report only exact matching export sets.
              try:
                  with p.open('rb') as f:magic=f.read(4)
              except OSError:continue
              if magic!=b'\x7fELF':continue
              ex=exports(p)
              if ex is None:continue
              hits=sorted({'Init','GetVer','_0','_1','_2','_3','_4','_5','_6','_7'} & ex)
              if hits:
                  files.append((p,hits,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()))
          print(f'BE_EXPORT_INVENTORY_MATCH_COUNT={len(files)}')
          print('BE_EXPORT_INVENTORY_BEGIN')
          for p,hits,size,sha in sorted(files,key=lambda x:str(x[0])):
              rel=p.relative_to(root)
              print(f'path={rel} size={size} sha256={sha} exports={",".join(hits)}')
          print('BE_EXPORT_INVENTORY_END')
          print(f'BE_INIT_EXPORTER_COUNT={sum(1 for _,hits,_,_ in files if "Init" in hits)}')
          print('BE_INIT_EXPORTERS_BEGIN')
          for p,hits,size,sha in sorted(files,key=lambda x:str(x[0])):
              if 'Init' in hits:print(f'path={p.relative_to(root)} sha256={sha}')
          print('BE_INIT_EXPORTERS_END')
          print('BE_EXPORT_INVENTORY_EXECUTED=false')
          print('BE_EXPORT_INVENTORY_MUTATION_PERFORMED=false')
          PY

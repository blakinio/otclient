name: Track A BEClient ABI bounded bytes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-abi-bounded-bytes.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-abi-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Trace exact BattlEye integration literals statically
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Map exact literal neighborhoods and xrefs
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 3
          python3 - "$client" <<'PY'
          import hashlib,pathlib,re,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16); _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if o<0 or o>=len(blob): return ''
              e=blob.find(b'\0',o); e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):
              secs.append({'idx':i,'name':cs(names,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
          by={s['name']:s for s in secs}; text=by['.text']; tblob=d[text['off']:text['off']+text['size']]

          targets={
              'Init':0x1c96c8f,
              'BEClient':0x1d69bb2,
              'BattlEye':0x1d7b160,
              'BattlEyeColon':0x1c9c202,
              'BattlEyeActivationTimestamp':0x1d3ed27,
              'BattlEyeInitiallyActive':0x1d3ed43,
          }
          print('BE_XREF_CONTEXT_BEGIN')
          for name,pos in targets.items():
              l=max(0,pos-0x500); r=min(len(d),pos+0x500)
              # Emit nearby printable C strings, not arbitrary proprietary bytes.
              vals=[]
              for m in re.finditer(rb'[\x20-\x7e]{2,180}\x00',d[l:r]):
                  raw=m.group()[:-1]
                  try:s=raw.decode('ascii')
                  except:continue
                  vals.append((l+m.start(),s))
              print(f'TARGET name={name} va=0x{pos:x} nearby_strings={len(vals)}')
              for va,s in vals[:80]: print(f'  CSTR va=0x{va:x} text={s[:180]}')
          print('BE_XREF_CONTEXT_END')

          # Common x86-64 RIP-relative LEA/MOV forms with disp32.
          prefixes={bytes.fromhex(x) for x in [
              '488d05','488d0d','488d15','488d1d','488d25','488d2d','488d35','488d3d',
              '488b05','488b0d','488b15','488b1d','488b25','488b2d','488b35','488b3d',
              '4c8d05','4c8d0d','4c8d15','4c8d1d','4c8d25','4c8d2d','4c8d35','4c8d3d'
          ]}
          target_by_va={v:k for k,v in targets.items()}
          refs=[]
          for i in range(max(0,len(tblob)-7)):
              pfx=tblob[i:i+3]
              if pfx not in prefixes: continue
              iva=text['addr']+i; target=iva+7+struct.unpack_from('<i',tblob,i+3)[0]
              if target in target_by_va: refs.append((target_by_va[target],iva,target,pfx.hex()))
          print('BE_XREFS_BEGIN')
          for name,iva,target,op in refs: print(f'name={name} ref=0x{iva:x} target=0x{target:x} op={op}')
          print('BE_XREFS_END')

          # Heuristic bounded function windows around every exact xref.
          def func_start(va):
              rel=va-text['addr']; lo=max(0,rel-0x1000); pat=b'\x55\x48\x89\xe5'
              pos=tblob.rfind(pat,lo,rel+1)
              return text['addr']+pos if pos>=0 else max(text['addr'],va-0x180)
          def emit(label,start,size=0x380):
              off=text['off']+(start-text['addr']); blob=d[off:min(len(d),off+size)]
              print(f'{label}_VA=0x{start:x}')
              print(f'{label}_SIZE=0x{len(blob):x}')
              print(f'{label}_SHA256={hashlib.sha256(blob).hexdigest()}')
              print(f'{label}_HEX={blob.hex()}')
          seen=set()
          print('BE_XREF_WINDOWS_BEGIN')
          for idx,(name,iva,target,op) in enumerate(refs):
              fs=func_start(iva)
              if fs in seen: continue
              seen.add(fs)
              print(f'WINDOW idx={idx} target={name} ref=0x{iva:x} function_start=0x{fs:x}')
              emit(f'BE_XREF_WINDOW_{idx}',fs)
          print('BE_XREF_WINDOWS_END')

          # Exact dynamic import names related to Qt/native library loading.
          dyn=by.get('.dynsym'); imports=[]
          if dyn and 0<=dyn['link']<len(secs):
              stsec=secs[dyn['link']]; sb=d[stsec['off']:stsec['off']+stsec['size']]
              ent=dyn['entsize'] or 24
              for o in range(dyn['off'],dyn['off']+dyn['size'],ent):
                  if o+24>len(d): break
                  sn,info,other,si,val,sz=struct.unpack_from(E+'IBBHQQ',d,o); nm=cs(sb,sn)
                  if nm and si==0: imports.append(nm.split('@',1)[0])
          rx=re.compile(r'QLibrary|QPlugin|LoadLibrary|dlopen|dlsym|dlclose|dlerror|dladdr|Library',re.I)
          print('BE_LOADER_IMPORT_CANDIDATES_BEGIN')
          for n in sorted(set(imports)):
              if rx.search(n): print(n)
          print('BE_LOADER_IMPORT_CANDIDATES_END')

          # All exact printable strings containing QLibrary/library-loading terms or BE component names.
          sx=re.compile(r'QLibrary|QPlugin|BEClient|BattlEye|GetVer|(?:^|[^A-Za-z])Init(?:[^A-Za-z]|$)|\.so(?:\.|$)|load.*library|library.*load',re.I)
          print('BE_LOADER_STRING_CANDIDATES_BEGIN')
          count=0
          for m in re.finditer(rb'[\x20-\x7e]{2,220}\x00',d):
              try:s=m.group()[:-1].decode('ascii')
              except:continue
              if sx.search(s):
                  print(f'va=0x{m.start():x} text={s[:220]}'); count+=1
                  if count>=300: break
          print('BE_LOADER_STRING_CANDIDATES_END')
          print('BE_XREF_EXECUTED=false')
          print('BE_XREF_MUTATION_PERFORMED=false')
          PY

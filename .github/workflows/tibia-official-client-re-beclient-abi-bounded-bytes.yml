name: Track A BEClient ABI bounded bytes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-abi-bounded-bytes.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-abi-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Recover dynamic-loader string arguments statically
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Decode cstring references around loader-wrapper calls
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 3
          python3 - "$client" <<'PY'
          import pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16); _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if o<0 or o>=len(blob):return ''
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):secs.append({'name':cs(names,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5]})
          text=next(s for s in secs if s['name']=='.text')
          blob=d[text['off']:text['off']+text['size']]
          wrappers={'dlopen':0x19f3499,'dlclose':0x19f3513,'dlsym':0x19f3532}
          calls=[]
          for i in range(len(blob)-5):
              if blob[i]!=0xe8:continue
              va=text['addr']+i; target=va+5+struct.unpack_from('<i',blob,i+1)[0]
              for n,w in wrappers.items():
                  if target==w:calls.append((n,va))

          prefixes={bytes.fromhex(x) for x in ['488d05','488d0d','488d15','488d1d','488d25','488d2d','488d35','488d3d']}
          def printable_cstr_at(va):
              if not (0<=va<len(d)): return None
              e=d.find(b'\0',va,min(len(d),va+256))
              if e<0 or e==va:return None
              raw=d[va:e]
              if not all(32<=b<127 for b in raw):return None
              try:return raw.decode('ascii')
              except:return None
          def refs_near(callva,before=0x180,after=0x10):
              start=max(text['addr'],callva-before);end=min(text['addr']+text['size'],callva+after)
              off=text['off']+(start-text['addr']); b=d[off:off+(end-start)]; out=[]
              for i in range(max(0,len(b)-7)):
                  pfx=b[i:i+3]
                  if pfx not in prefixes:continue
                  iva=start+i; target=iva+7+struct.unpack_from('<i',b,i+3)[0]; s=printable_cstr_at(target)
                  if s is not None:out.append((iva,target,s,pfx.hex()))
              return out

          print('BE_LOADER_ARGUMENT_REFS_BEGIN')
          for n,va in calls:
              refs=refs_near(va,0x180 if n!='dlopen' else 0x260,0x8)
              # Keep only the closest occurrence of each target/text in this window.
              uniq=[];seen=set()
              for r in refs:
                  key=(r[1],r[2])
                  if key in seen:continue
                  seen.add(key);uniq.append(r)
              print(f'CALL wrapper={n} va=0x{va:x} refs={len(uniq)}')
              for iva,target,s,op in uniq[-16:]:print(f'  ref=0x{iva:x} target=0x{target:x} op={op} cstr={s[:180]}')
          print('BE_LOADER_ARGUMENT_REFS_END')

          # Summarize call clusters separated by >0x1000 for easier subsystem discrimination.
          print('BE_LOADER_CLUSTERS_BEGIN')
          clusters=[]
          for item in calls:
              if not clusters or item[1]-clusters[-1][-1][1]>0x1000:clusters.append([item])
              else:clusters[-1].append(item)
          for ci,c in enumerate(clusters):
              print(f'CLUSTER {ci} start=0x{c[0][1]:x} end=0x{c[-1][1]:x} calls={len(c)} dlopen={sum(1 for n,_ in c if n=="dlopen")} dlsym={sum(1 for n,_ in c if n=="dlsym")} dlclose={sum(1 for n,_ in c if n=="dlclose")}')
              ss=[]
              for n,va in c:
                  for _,target,s,_ in refs_near(va,0x200 if n=='dlopen' else 0x50,0x8):
                      if s not in ss:ss.append(s)
              for s in ss[:120]:print(f'  STR {s[:180]}')
          print('BE_LOADER_CLUSTERS_END')
          print('BE_LOADER_EXECUTED=false')
          print('BE_LOADER_MUTATION_PERFORMED=false')
          PY

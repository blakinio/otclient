name: Track A BEClient ABI static analysis

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-abi-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-abi-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Static client-to-BEClient ABI analysis
    runs-on: [otclient, synology]
    timeout-minutes: 8
    steps:
      - name: Map loader strings, symbols, config and bounded disassembly
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || { echo 'BE_ABI_ERROR=wrong_runner'; exit 2; }

          base='/home/runner/_work/_otclient_tibia_re_state'
          package="$base/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package"
          client="$package/bin/client"
          be="$package/bin/BattlEye/BEClient.so"
          cfg="$package/bin/BattlEye/BEClient.cfg"
          expected_client_size='51965216'
          expected_client_sha='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          expected_be_sha='5d1c90ab244155d393296b2e575425aee3252d4d09110007a6d6c3a0bfe05a98'

          [[ -f "$client" && -f "$be" && -f "$cfg" ]] || { echo 'BE_ABI_ERROR=artifact_missing'; exit 3; }
          [[ "$(stat -c '%s' "$client")" == "$expected_client_size" ]] || { echo 'BE_ABI_ERROR=client_size'; exit 4; }
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$expected_client_sha" ]] || { echo 'BE_ABI_ERROR=client_sha'; exit 5; }
          [[ "$(sha256sum "$be" | awk '{print $1}')" == "$expected_be_sha" ]] || { echo 'BE_ABI_ERROR=be_sha'; exit 6; }
          echo 'BE_ABI_CLIENT_FENCE=PASS'
          echo 'BE_ABI_BE_FENCE=PASS'
          echo "BE_ABI_CFG_SIZE=$(stat -c '%s' "$cfg")"
          echo "BE_ABI_CFG_SHA256=$(sha256sum "$cfg" | awk '{print $1}')"
          echo 'BE_ABI_CFG_BEGIN'
          python3 - "$cfg" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1])
          data=p.read_bytes()
          text=data.decode('utf-8','replace')
          for i,line in enumerate(text.splitlines()[:100],1):
              clean=''.join(ch if 32 <= ord(ch) < 127 else '?' for ch in line)
              print(f'{i}:{clean[:500]}')
          PY
          echo 'BE_ABI_CFG_END'

          objdump=''
          for c in "$(command -v objdump 2>/dev/null || true)" "$base/toolroot/usr/bin/objdump" "$base/toolroot/usr/bin/x86_64-linux-gnu-objdump"; do
            [[ -n "$c" && -x "$c" ]] && { objdump="$c"; break; }
          done
          gdb=''
          for c in "$(command -v gdb 2>/dev/null || true)" "$base/toolroot/usr/bin/gdb"; do
            [[ -n "$c" && -x "$c" ]] && { gdb="$c"; break; }
          done
          echo "BE_ABI_OBJDUMP=${objdump:-UNAVAILABLE}"
          echo "BE_ABI_GDB=${gdb:-UNAVAILABLE}"
          python3 - <<'PY'
          try:
              import capstone
              print('BE_ABI_CAPSTONE=PRESENT')
              print('BE_ABI_CAPSTONE_VERSION='+getattr(capstone,'__version__','UNKNOWN'))
          except Exception:
              print('BE_ABI_CAPSTONE=ABSENT')
          PY

          report="$RUNNER_TEMP/be-abi-static.json"
          python3 - "$client" "$be" "$cfg" "$report" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, struct, sys

          client=pathlib.Path(sys.argv[1]); be=pathlib.Path(sys.argv[2]); cfg=pathlib.Path(sys.argv[3]); report=pathlib.Path(sys.argv[4])

          def parse_elf(path: pathlib.Path):
              d=path.read_bytes()
              if d[:4] != b'\x7fELF' or d[4] != 2 or d[5] != 1:
                  raise RuntimeError(f'unsupported ELF {path}')
              E='<'; h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
              et,em,ev,entry,phoff,shoff,ef,ehsz,phentsz,phnum,shentsz,shnum,shstrndx=h
              phfmt=E+'IIQQQQQQ'; ph=[struct.unpack_from(phfmt,d,phoff+i*phentsz) for i in range(phnum)]
              shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
              st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
              def cs(blob,o):
                  if o<0 or o>=len(blob): return ''
                  e=blob.find(b'\0',o); e=len(blob) if e<0 else e
                  return blob[o:e].decode('utf-8','replace')
              secs=[]
              for i,x in enumerate(sh):
                  secs.append({'idx':i,'name':cs(names,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'info':x[7],'align':x[8],'entsize':x[9]})
              by={s['name']:s for s in secs}
              imports=[]; exports=[]
              dyn=by.get('.dynsym')
              if dyn and 0<=dyn['link']<len(secs):
                  stsec=secs[dyn['link']]; sb=d[stsec['off']:stsec['off']+stsec['size']]
                  def ds(o): return cs(sb,o)
                  ent=dyn['entsize'] or 24
                  for o in range(dyn['off'],dyn['off']+dyn['size'],ent):
                      if o+24>len(d): break
                      sn,info,other,shndx,val,sz=struct.unpack_from(E+'IBBHQQ',d,o)
                      nm=ds(sn)
                      if not nm: continue
                      rec={'name':nm.split('@',1)[0],'shndx':shndx,'value':val,'size':sz,'bind':info>>4,'vis':other&3}
                      if shndx==0: imports.append(rec)
                      elif (info>>4) in (1,2) and (other&3)==0: exports.append(rec)
              return d, ph, secs, by, imports, exports, entry

          def fileoff_to_va(off, ph):
              for typ,flags,p_off,vaddr,paddr,filesz,memsz,align in ph:
                  if typ==1 and p_off <= off < p_off+filesz:
                      return vaddr + (off-p_off)
              return None

          def va_to_fileoff(va, ph):
              for typ,flags,p_off,vaddr,paddr,filesz,memsz,align in ph:
                  if typ==1 and vaddr <= va < vaddr+filesz:
                      return p_off + (va-vaddr)
              return None

          cd,cph,csecs,cby,cimports,cexports,centry=parse_elf(client)
          bd,bph,bsecs,bby,bimports,bexports,bentry=parse_elf(be)

          print('BE_ABI_CLIENT_DLOADER_IMPORTS_BEGIN')
          for n in sorted({r['name'] for r in cimports if r['name'] in {'dlopen','dlsym','dlclose','dlerror','dladdr'}}): print(n)
          print('BE_ABI_CLIENT_DLOADER_IMPORTS_END')

          interesting_tokens=[b'BattlEye',b'BEClient.so',b'BEClient_x64.so',b'BEClient',b'GetVer',b'Init']
          string_hits=[]
          for tok in interesting_tokens:
              start=0
              while True:
                  pos=cd.find(tok,start)
                  if pos<0: break
                  va=fileoff_to_va(pos,cph)
                  hit={'token':tok.decode('ascii'),'off':pos,'va':va}
                  string_hits.append(hit)
                  start=pos+1
          print('BE_ABI_CLIENT_STRING_HITS_BEGIN')
          for h in string_hits[:200]: print(f"token={h['token']} off=0x{h['off']:x} va={('0x%x'%h['va']) if h['va'] is not None else 'UNMAPPED'}")
          print('BE_ABI_CLIENT_STRING_HITS_END')

          # Find common x86-64 RIP-relative LEA/MOV references to exact string virtual addresses.
          target_vas={h['va'] for h in string_hits if h['va'] is not None}
          refs=[]
          execsecs=[s for s in csecs if s['flags'] & 0x4 and s['type']==1 and s['off']+s['size']<=len(cd)]
          common3={b'\x48\x8d\x05',b'\x48\x8d\x0d',b'\x48\x8d\x15',b'\x48\x8d\x1d',b'\x48\x8d\x25',b'\x48\x8d\x2d',b'\x48\x8d\x35',b'\x48\x8d\x3d',
                   b'\x48\x8b\x05',b'\x48\x8b\x0d',b'\x48\x8b\x15',b'\x48\x8b\x1d',b'\x48\x8b\x25',b'\x48\x8b\x2d',b'\x48\x8b\x35',b'\x48\x8b\x3d'}
          for s in execsecs:
              blob=cd[s['off']:s['off']+s['size']]
              for i in range(0,max(0,len(blob)-7)):
                  pfx=blob[i:i+3]
                  if pfx not in common3: continue
                  disp=struct.unpack_from('<i',blob,i+3)[0]
                  insn_va=s['addr']+i
                  target=insn_va+7+disp
                  if target in target_vas:
                      refs.append({'insn_va':insn_va,'target_va':target,'opcode':pfx.hex(),'section':s['name']})
          print('BE_ABI_CLIENT_RIPREFS_BEGIN')
          for r in refs[:200]: print(f"ref=0x{r['insn_va']:x} target=0x{r['target_va']:x} opcode={r['opcode']} section={r['section']}")
          print('BE_ABI_CLIENT_RIPREFS_END')

          wanted={'Init','GetVer','_0','_1','_2','_3','_4','_5','_6','_7'}
          be_exports=[r for r in bexports if r['name'] in wanted]
          print('BE_ABI_BE_EXPORT_DETAILS_BEGIN')
          for r in sorted(be_exports,key=lambda x:x['value']):
              sec='?'
              if 0<=r['shndx']<len(bsecs): sec=bsecs[r['shndx']]['name']
              foff=va_to_fileoff(r['value'],bph)
              print(f"name={r['name']} value=0x{r['value']:x} size=0x{r['size']:x} shndx={r['shndx']} section={sec} fileoff={('0x%x'%foff) if foff is not None else 'UNMAPPED'}")
          print('BE_ABI_BE_EXPORT_DETAILS_END')

          out={'string_hits':string_hits,'refs':refs,'be_exports':be_exports,
               'client_loader_imports':sorted({r['name'] for r in cimports if r['name'].startswith('dl')}),
               'client_entry':centry,'be_entry':bentry}
          report.write_text(json.dumps(out,indent=2))
          PY

          # Bounded static disassembly only. Never run either target.
          if [[ -n "$objdump" ]]; then
            echo 'BE_ABI_BE_EXPORT_DISASM_BEGIN'
            python3 - "$be" >"$RUNNER_TEMP/be-ranges.txt" <<'PY'
          import pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'; h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if o>=len(blob):return ''
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e;return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):secs.append((cs(names,x[0]),*x[1:]))
          by={x[0]:x for x in secs}; dyn=by.get('.dynsym')
          if dyn:
              name,typ,flags,addr,off,size,link,info,align,ents=dyn; stsec=secs[link]; sb=d[stsec[4]:stsec[4]+stsec[5]]
              for o in range(off,off+size,ents or 24):
                  if o+24>len(d):break
                  sn,inf,oth,si,val,sz=struct.unpack_from(E+'IBBHQQ',d,o); nm=cs(sb,sn)
                  if nm in {'Init','GetVer','_0','_1','_2','_3','_4','_5','_6','_7'}:
                      print(nm,hex(val),hex(val+min(max(sz,32),256)))
          PY
            while read -r name start stop; do
              echo "--- $name $start..$stop ---"
              "$objdump" -d -Mintel --start-address="$start" --stop-address="$stop" "$be" 2>&1 | head -n 120 || true
            done <"$RUNNER_TEMP/be-ranges.txt"
            echo 'BE_ABI_BE_EXPORT_DISASM_END'

            echo 'BE_ABI_CLIENT_REF_DISASM_BEGIN'
            python3 - "$report" >"$RUNNER_TEMP/client-ref-ranges.txt" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); seen=set()
          for r in x['refs'][:40]:
              va=int(r['insn_va']); start=max(0,va-48); stop=va+128
              key=(start,stop)
              if key in seen: continue
              seen.add(key); print(hex(start),hex(stop),hex(va),hex(int(r['target_va'])))
          PY
            while read -r start stop ref target; do
              echo "--- ref=$ref target=$target $start..$stop ---"
              "$objdump" -d -Mintel --start-address="$start" --stop-address="$stop" "$client" 2>&1 | head -n 180 || true
            done <"$RUNNER_TEMP/client-ref-ranges.txt"
            echo 'BE_ABI_CLIENT_REF_DISASM_END'
          fi

          echo 'BE_ABI_EXECUTED=false'
          echo 'BE_ABI_MUTATION_PERFORMED=false'

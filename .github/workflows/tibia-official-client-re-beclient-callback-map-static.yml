name: Track A BEClient callback map static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-callback-map-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-callback-map.md

permissions:
  contents: read

jobs:
  validate:
    name: Fresh deterministic callback-map validator
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Re-derive bounded lifecycle invariants from exact client bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          python3 - "$client" <<'PY'
          import pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16); _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if o<0 or o>=len(blob):return ''
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):secs.append({'idx':i,'name':cs(names,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
          by={s['name']:s for s in secs}; text=by['.text']; tb=d[text['off']:text['off']+text['size']]
          def at(va,hx,label):
              b=bytes.fromhex(hx); off=text['off']+(va-text['addr']); got=d[off:off+len(b)]
              if got!=b: raise SystemExit(f'VALIDATOR_FAIL={label}@0x{va:x}')
              print(f'VALIDATOR_PASS={label}@0x{va:x}')

          # Exact owner member -> state pointer and local ownership interval anchor.
          at(0x6fc4d7,'4c8bb348070000','owner_plus_748_to_r14')
          at(0x6fc4eb,'4c89b5b8feffff','state_local_from_r14')
          at(0x6fc82d,'4c8995b8feffff','next_state_local_overwrite')

          # Existing-state cleanup: gate, +0x28 callback, 32-byte clear, QLibrary unload.
          at(0x6fc518,'41807e48007527498b46284885c07402ffd0','preinit_plus28_callback')
          at(0x6fc531,'660fefc00f114028488d78100f114038e8da34deff','preinit_clear32_and_unload')

          # Unique Init resolver and observed third argument/output block call.
          at(0x6fc587,'488d3501a759014c89e7e86a1bdeff','resolve_exact_Init')
          at(0x6fc69c,'488b85c0feffff4c89febf020000008b80bc010000668945ac488b85b8feffff488d502841ffd4','Init_args_and_call')

          # Success path: clear +0x48, conditionally call +0x30, read/invert +0x49.
          at(0x6fc6c6,'488b85b8feffffc64048004584e40f8406110000488b40304885c07402ffd0','success_plus30_callback')
          at(0x6fc6e5,'488b85b8feffff440fb660494183f401','success_read_invert_plus49')

          # Shared reset helper independently re-proves +0x28 callback -> clear -> unload -> +0x49 reset.
          at(0x7319e0,'53807f48004889fb7520488b47284885c07402ffd0660fefc0488d7b100f1143280f114338e816e0daffc64349005bc3','reset_helper_lifecycle')

          # Independent owner cleanup site loads +0x748 and repeats the same +0x28/clear/unload lifecycle.
          at(0x7019c7,'488b9d48070000807b48000f84b8000000','owner_cleanup_load')
          at(0x701a90,'488b43284885c07402ffd0660fefc0488d7b100f1143280f114338e870dfddff','owner_cleanup_plus28_clear_unload')

          # Resolve-null path forces +0x48=0 then enters the same reset helper.
          at(0x6fd8be,'488b85b8feffffc64048004889c7e80f410300','resolve_null_reset')

          # Count exact non-SIB mov r64,[base+0x748] forms client-wide as an independent bounded census.
          loads=[]
          for i in range(len(tb)-7):
              rex=tb[i]
              if rex not in range(0x48,0x50) or tb[i+1]!=0x8b:continue
              modrm=tb[i+2]
              if (modrm>>6)!=2 or (modrm&7)==4:continue
              if struct.unpack_from('<i',tb,i+3)[0]==0x748:loads.append(text['addr']+i)
          if len(loads)!=8:raise SystemExit(f'VALIDATOR_FAIL=owner_748_count:{len(loads)}')
          print('VALIDATOR_PASS=owner_748_count:8')
          print('VALIDATOR_OWNER_748_LOADS='+','.join(f'0x{x:x}' for x in loads))
          print('VALIDATOR_EXECUTED_TARGET=false')
          print('VALIDATOR_LIVE_RUNTIME_OBSERVED=false')
          print('VALIDATOR_MUTATION_PERFORMED=false')
          PY

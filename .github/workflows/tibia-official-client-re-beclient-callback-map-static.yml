name: Track A BEClient callback map static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-callback-map-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-callback-map.md

permissions:
  contents: read

jobs:
  inspect:
    name: Isolate exact BattlEye state ownership interval
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Emit bounded branch and failure paths for offline decoding
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16); _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if o<0 or o>=len(blob):return ''
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):secs.append({'idx':i,'name':cs(names,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
          by={s['name']:s for s in secs}; text=by['.text']; tb=d[text['off']:text['off']+text['size']]

          dyn=by.get('.dynsym'); syms=[]
          if dyn and 0<=dyn['link']<len(secs):
              ss=secs[dyn['link']]; sb=d[ss['off']:ss['off']+ss['size']]
              for o in range(dyn['off'],dyn['off']+dyn['size'],dyn['entsize'] or 24):
                  if o+24>len(d):break
                  sn,info,other,si,val,sz=struct.unpack_from(E+'IBBHQQ',d,o); syms.append(cs(sb,sn).split('@',1)[0])
          relsec=by.get('.rela.plt') or by.get('.rela.plt.sec'); pltsec=by.get('.plt.sec') or by.get('.plt'); plt={}
          if relsec and pltsec:
              ent=pltsec['entsize'] or 16; reserved=0 if pltsec['name']=='.plt.sec' else 1
              for idx,o in enumerate(range(relsec['off'],relsec['off']+relsec['size'],relsec['entsize'] or 24)):
                  if o+24>len(d):break
                  _,ri,_=struct.unpack_from(E+'QQq',d,o); si=ri>>32; nm=syms[si] if si<len(syms) else '?'
                  plt[pltsec['addr']+(idx+reserved)*ent]=nm

          def emit(label,start,end):
              fo=text['off']+(start-text['addr']); blob=d[fo:fo+(end-start)]
              print(f'{label}_VA=0x{start:x}')
              print(f'{label}_END=0x{end:x}')
              print(f'{label}_SIZE=0x{len(blob):x}')
              print(f'{label}_SHA256={hashlib.sha256(blob).hexdigest()}')
              print(f'{label}_HEX={blob.hex()}')

          # Proven ownership interval for state local: store [rbp-0x148]=r14 at 0x6fc4eb,
          # next overwrite of that local occurs at 0x6fc82d.
          start=0x6fc4eb; end=0x6fc82d
          emit('BE_CB3_EXACT_STATE_INTERVAL',start,end)
          for label,s,e in [
              ('BE_CB3_BRANCH_4B_NONZERO',0x6fd790,0x6fd810),
              ('BE_CB3_INIT_FALSE',0x6fd7c0,0x6fd860),
              ('BE_CB3_RESOLVE_NULL',0x6fd890,0x6fd900),
              ('BE_CB3_SETNAME_LOAD',0x6fca80,0x6fcae0),
          ]: emit(label,s,e)

          print('BE_CB3_INTERVAL_DIRECT_CALLS_BEGIN')
          for i in range(start-text['addr'],end-text['addr']-5):
              if tb[i]!=0xe8:continue
              va=text['addr']+i; dest=va+5+struct.unpack_from('<i',tb,i+1)[0]
              print(f'call=0x{va:x} target=0x{dest:x} kind={plt.get(dest,"INTERNAL")}')
          print('BE_CB3_INTERVAL_DIRECT_CALLS_END')

          # RIP-relative printable strings referenced in the same exact interval only.
          prefixes={bytes.fromhex(x) for x in ['488d05','488d0d','488d15','488d1d','488d25','488d2d','488d35','488d3d','4c8d05','4c8d0d','4c8d15','4c8d1d','4c8d25','4c8d2d','4c8d35','4c8d3d']}
          print('BE_CB3_INTERVAL_STRINGS_BEGIN')
          seen=set()
          for i in range(start-text['addr'],min(end-text['addr'],len(tb)-7)):
              p=tb[i:i+3]
              if p not in prefixes:continue
              va=text['addr']+i; target=va+7+struct.unpack_from('<i',tb,i+3)[0]
              if not (0<=target<len(d)):continue
              ee=d.find(b'\0',target,min(len(d),target+200))
              if ee<=target:continue
              raw=d[target:ee]
              if not raw or not all(32<=b<127 for b in raw):continue
              try:s=raw.decode('ascii')
              except:continue
              key=(target,s)
              if key in seen:continue
              seen.add(key); print(f'ref=0x{va:x} target=0x{target:x} text={s[:180]}')
          print('BE_CB3_INTERVAL_STRINGS_END')
          print('BE_CB3_EXECUTED_TARGET=false')
          print('BE_CB3_LIVE_RUNTIME_OBSERVED=false')
          print('BE_CB3_MUTATION_PERFORMED=false')
          PY

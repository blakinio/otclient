name: Track A BEClient callback map static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-callback-map-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-callback-map.md

permissions:
  contents: read

jobs:
  inspect:
    name: Search client-wide BE state owner consumers
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Scan exact +0x748 owner loads and candidate output-slot uses
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16); _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if o<0 or o>=len(blob):return ''
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):secs.append({'idx':i,'name':cs(names,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5]})
          text=next(s for s in secs if s['name']=='.text'); tb=d[text['off']:text['off']+text['size']]
          regs=['rax','rcx','rdx','rbx','rsp','rbp','rsi','rdi','r8','r9','r10','r11','r12','r13','r14','r15']
          loads=[]
          disp_target=0x748
          for i in range(len(tb)-7):
              rex=tb[i]
              if rex not in range(0x48,0x50) or tb[i+1]!=0x8b: continue
              modrm=tb[i+2]
              if (modrm>>6)!=2 or (modrm&7)==4: continue  # no SIB in this bounded decoder
              disp=struct.unpack_from('<i',tb,i+3)[0]
              if disp!=disp_target:continue
              dst=((modrm>>3)&7)|(((rex>>2)&1)<<3)
              src=(modrm&7)|((rex&1)<<3)
              loads.append((text['addr']+i,dst,src))
          print(f'BE_CB4_OWNER_748_LOAD_COUNT={len(loads)}')
          print('BE_CB4_OWNER_748_LOADS_BEGIN')
          for idx,(va,dst,src) in enumerate(loads):print(f'index={idx} va=0x{va:x} dst={regs[dst]} owner={regs[src]}')
          print('BE_CB4_OWNER_748_LOADS_END')

          slots={0x28,0x30,0x38,0x40,0x48,0x49,0x4a,0x4b}
          candidates=[]
          for idx,(loadva,dst,src) in enumerate(loads):
              start=loadva-text['addr']; end=min(len(tb),start+0x120)
              for j in range(start+7,end-4):
                  rex=tb[j]
                  if rex not in range(0x40,0x50): continue
                  op=tb[j+1]
                  if op not in (0x8b,0x8d,0x89,0x83,0x80,0x0f,0xc6): continue
                  # Common non-SIB modrm location. 0f xx forms are intentionally omitted from semantic claims.
                  mpos=j+2
                  if op==0x0f: mpos=j+3
                  if mpos>=len(tb):continue
                  modrm=tb[mpos]
                  if (modrm>>6)!=1 or (modrm&7)==4:continue
                  base=(modrm&7)|((rex&1)<<3)
                  if base!=dst:continue
                  disp8=tb[mpos+1]
                  if disp8>=128:disp8-=256
                  if disp8 in slots:
                      candidates.append((idx,loadva,text['addr']+j,regs[dst],disp8,op))
          print(f'BE_CB4_OWNER_SLOT_CANDIDATE_COUNT={len(candidates)}')
          print('BE_CB4_OWNER_SLOT_CANDIDATES_BEGIN')
          for idx,loadva,va,reg,slot,op in candidates:
              print(f'owner_load_index={idx} owner_load=0x{loadva:x} ref=0x{va:x} base={reg} slot=0x{slot:x} opcode=0x{op:x}')
          print('BE_CB4_OWNER_SLOT_CANDIDATES_END')

          # Emit windows only for owner loads that have a candidate slot reference, plus the known BattlEye load at 0x6fc4d7.
          keep=sorted(set([idx for idx,_,_,_,_,_ in candidates] + [idx for idx,(va,_,_) in enumerate(loads) if va==0x6fc4d7]))
          print('BE_CB4_OWNER_WINDOWS_BEGIN')
          for idx in keep[:30]:
              va,dst,src=loads[idx]; start=max(text['addr'],va-0x30); end=min(text['addr']+text['size'],va+0x160)
              fo=text['off']+(start-text['addr']); blob=d[fo:fo+(end-start)]
              print(f'index={idx} va=0x{start:x} owner_load=0x{va:x} size=0x{len(blob):x} sha256={hashlib.sha256(blob).hexdigest()} hex={blob.hex()}')
          print('BE_CB4_OWNER_WINDOWS_END')
          print('BE_CB4_EXECUTED_TARGET=false')
          print('BE_CB4_LIVE_RUNTIME_OBSERVED=false')
          print('BE_CB4_MUTATION_PERFORMED=false')
          PY

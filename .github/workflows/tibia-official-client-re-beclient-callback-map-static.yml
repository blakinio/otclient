name: Track A BEClient callback map static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-callback-map-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-callback-map.md

permissions:
  contents: read

jobs:
  inspect:
    name: Map Init state origin and lifecycle calls statically
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Correlate exact state origin, PLT calls and bounded helper windows
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || { echo 'BE_CB2_ERROR=wrong_runner'; exit 2; }
          package='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package'
          client="$package/bin/client"
          [[ -f "$client" ]] || { echo 'BE_CB2_ERROR=client_missing'; exit 3; }
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || { echo 'BE_CB2_ERROR=client_size'; exit 4; }
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || { echo 'BE_CB2_ERROR=client_sha'; exit 5; }
          echo 'BE_CB2_CLIENT_FENCE=PASS'

          python3 - "$client" <<'PY'
          import hashlib,pathlib,re,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if o<0 or o>=len(blob):return ''
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):
              secs.append({'idx':i,'name':cs(names,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
          by={s['name']:s for s in secs}; text=by['.text']; tb=d[text['off']:text['off']+text['size']]

          # Build exact dynamic-symbol/PLT map without executing target code.
          dyn=by.get('.dynsym'); syms=[]
          if dyn and 0<=dyn['link']<len(secs):
              ss=secs[dyn['link']]; sb=d[ss['off']:ss['off']+ss['size']]
              for o in range(dyn['off'],dyn['off']+dyn['size'],dyn['entsize'] or 24):
                  if o+24>len(d):break
                  sn,info,other,si,val,sz=struct.unpack_from(E+'IBBHQQ',d,o)
                  syms.append(cs(sb,sn).split('@',1)[0])
          relsec=by.get('.rela.plt') or by.get('.rela.plt.sec'); pltsec=by.get('.plt.sec') or by.get('.plt')
          plt_by_addr={}
          if relsec and pltsec:
              rels=[]
              for i,o in enumerate(range(relsec['off'],relsec['off']+relsec['size'],relsec['entsize'] or 24)):
                  if o+24>len(d):break
                  _,ri,_=struct.unpack_from(E+'QQq',d,o); si=ri>>32
                  rels.append((i,syms[si] if si<len(syms) else '?'))
              ent=pltsec['entsize'] or 16; reserved=0 if pltsec['name']=='.plt.sec' else 1
              for i,nm in rels:
                  plt_by_addr[pltsec['addr']+(i+reserved)*ent]=nm

          qstart=0x6fc034; qend=0x6fda00
          print('BE_CB2_DIRECT_CALLS_BEGIN')
          direct=[]
          for i in range(qstart-text['addr'],qend-text['addr']-5):
              if tb[i]!=0xe8:continue
              va=text['addr']+i; dest=va+5+struct.unpack_from('<i',tb,i+1)[0]
              nm=plt_by_addr.get(dest,'INTERNAL')
              direct.append((va,dest,nm))
              if nm!='INTERNAL' or dest in {0x6b9e50,0x7319e0,0x4df250,0x4de900,0x4dd800,0x4dbcd0,0x4df670}:
                  print(f'call=0x{va:x} target=0x{dest:x} kind={nm}')
          print('BE_CB2_DIRECT_CALLS_END')

          # Identify every direct write to the stack slot [rbp-0x148] that stores the state pointer.
          state_disp=-0x148
          stores=[]
          for i in range(qstart-text['addr'],qend-text['addr']-11):
              # REX.W + mov r/m64,r64, mod=10 r/m=rbp, disp32
              rex=tb[i]
              if rex in range(0x48,0x50) and tb[i+1]==0x89:
                  modrm=tb[i+2]
                  if (modrm>>6)==2 and (modrm&7)==5:
                      disp=struct.unpack_from('<i',tb,i+3)[0]
                      if disp==state_disp:
                          src=((modrm>>3)&7)|(((rex>>2)&1)<<3)
                          stores.append((text['addr']+i,'reg',src))
              # mov qword [rbp+disp32], imm32
              if tb[i:i+2]==b'\x48\xc7' and i+11<=len(tb):
                  modrm=tb[i+2]
                  if (modrm>>6)==2 and (modrm&7)==5 and ((modrm>>3)&7)==0:
                      disp=struct.unpack_from('<i',tb,i+3)[0]
                      if disp==state_disp:
                          imm=struct.unpack_from('<I',tb,i+7)[0]; stores.append((text['addr']+i,'imm',imm))
          regs=['rax','rcx','rdx','rbx','rsp','rbp','rsi','rdi','r8','r9','r10','r11','r12','r13','r14','r15']
          print(f'BE_CB2_STATE_STORE_COUNT={len(stores)}')
          print('BE_CB2_STATE_STORES_BEGIN')
          for idx,(va,kind,val) in enumerate(stores):
              v=regs[val] if kind=='reg' else hex(val)
              print(f'index={idx} va=0x{va:x} kind={kind} value={v}')
          print('BE_CB2_STATE_STORES_END')

          def emit(label,va,before,after):
              start=max(text['addr'],va-before); end=min(text['addr']+text['size'],va+after)
              fo=text['off']+(start-text['addr']); blob=d[fo:fo+(end-start)]
              print(f'{label}_VA=0x{start:x}')
              print(f'{label}_SIZE=0x{len(blob):x}')
              print(f'{label}_SHA256={hashlib.sha256(blob).hexdigest()}')
              print(f'{label}_HEX={blob.hex()}')

          print('BE_CB2_STATE_STORE_WINDOWS_BEGIN')
          for idx,(va,_,_) in enumerate(stores[:20]):emit(f'BE_CB2_STATE_STORE_{idx}',va,0x80,0x120)
          print('BE_CB2_STATE_STORE_WINDOWS_END')

          # Exact internal helper / failure-handler windows used by the proven state lifecycle.
          emit('BE_CB2_HELPER_6B9E50',0x6b9e50,0x20,0x180)
          emit('BE_CB2_FAILURE_7319E0',0x7319e0,0x20,0x160)
          emit('BE_CB2_INIT_SUCCESS',0x6fc6b5,0x20,0x90)
          emit('BE_CB2_STATE_28_CLEANUP',0x6fc92a,0x20,0x90)
          emit('BE_CB2_LATE_STATE',0x6fd4ed,0x20,0x100)

          # Print nearby printable-string RIP refs inside helper windows only, useful for type/lifecycle classification.
          prefixes={bytes.fromhex(x) for x in ['488d05','488d0d','488d15','488d1d','488d25','488d2d','488d35','488d3d','4c8d05','4c8d0d','4c8d15','4c8d1d','4c8d25','4c8d2d','4c8d35','4c8d3d']}
          print('BE_CB2_HELPER_STRING_REFS_BEGIN')
          for lo,hi,label in [(0x6b9e30,0x6b9fd0,'helper_6b9e50'),(0x7319c0,0x731b40,'failure_7319e0')]:
              for i in range(lo-text['addr'],min(hi-text['addr'],len(tb)-7)):
                  p=tb[i:i+3]
                  if p not in prefixes:continue
                  va=text['addr']+i; target=va+7+struct.unpack_from('<i',tb,i+3)[0]
                  if not (0<=target<len(d)):continue
                  e=d.find(b'\0',target,min(len(d),target+180))
                  if e<=target:continue
                  raw=d[target:e]
                  if raw and all(32<=b<127 for b in raw):
                      try:s=raw.decode('ascii')
                      except:continue
                      print(f'label={label} ref=0x{va:x} target=0x{target:x} text={s[:160]}')
          print('BE_CB2_HELPER_STRING_REFS_END')
          print('BE_CB2_EXECUTED_TARGET=false')
          print('BE_CB2_LIVE_RUNTIME_OBSERVED=false')
          print('BE_CB2_MUTATION_PERFORMED=false')
          PY

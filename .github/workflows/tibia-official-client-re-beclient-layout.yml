name: Track A BEClient layout details

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-layout.yml

permissions:
  contents: read

jobs:
  inspect-layout:
    name: Map BEClient custom sections and symbols
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Parse layout without executing BEClient
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          python3 - <<'PY'
          import pathlib, struct, hashlib

          p = pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/BattlEye/BEClient.so')
          d = p.read_bytes()
          assert d[:4] == b'\x7fELF' and d[4] == 2 and d[5] == 1
          E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          et,em,ev,entry,phoff,shoff,ef,ehsz,phentsz,phnum,shentsz,shnum,shstrndx=h

          phfmt=E+'IIQQQQQQ'
          ph=[struct.unpack_from(phfmt,d,phoff+i*phentsz) for i in range(phnum)]
          pnames={0:'NULL',1:'LOAD',2:'DYNAMIC',3:'INTERP',4:'NOTE',6:'PHDR',7:'TLS',0x6474e550:'GNU_EH_FRAME',0x6474e551:'GNU_STACK',0x6474e552:'GNU_RELRO'}
          print('BE_LAYOUT_PROGRAM_HEADERS_BEGIN')
          for i,x in enumerate(ph):
              typ,flags,off,vaddr,paddr,filesz,memsz,align=x
              fs=''.join(c for b,c in ((4,'R'),(2,'W'),(1,'E')) if flags&b)
              print(f'PH idx={i} type={pnames.get(typ,hex(typ))} flags={fs or "-"} offset=0x{off:x} vaddr=0x{vaddr:x} filesz=0x{filesz:x} memsz=0x{memsz:x} align=0x{align:x}')
          print('BE_LAYOUT_PROGRAM_HEADERS_END')

          shfmt=E+'IIQQQQIIQQ'
          sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]
          names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if o>=len(blob): return ''
              e=blob.find(b'\0',o); e=len(blob) if e<0 else e
              return blob[o:e].decode('utf-8','replace')
          secs=[]
          for i,x in enumerate(sh):
              n=cs(names,x[0])
              secs.append((i,n,*x[1:]))

          print(f'BE_LAYOUT_FILE_SIZE=0x{len(d):x}')
          print(f'BE_LAYOUT_ENTRY=0x{entry:x}')
          print('BE_LAYOUT_SECTIONS_BEGIN')
          for i,n,typ,flags,addr,off,size,link,info,align,entsize in secs:
              fend=off+size
              valid = off <= len(d) and fend <= len(d)
              contains_entry = addr <= entry < addr+size if size else False
              print(f'SH idx={i} name={n or "<none>"} type={typ} flags=0x{flags:x} addr=0x{addr:x} offset=0x{off:x} size=0x{size:x} file_end=0x{fend:x} in_file={str(valid).lower()} entry={str(contains_entry).lower()}')
          print('BE_LAYOUT_SECTIONS_END')

          by={n:(i,typ,flags,addr,off,size,link,info,align,entsize) for i,n,typ,flags,addr,off,size,link,info,align,entsize in secs}
          for name in ('.comment','.be0','.be1','.text','.rodata'):
              if name in by:
                  i,typ,flags,addr,off,size,link,info,align,entsize=by[name]
                  avail=max(0,min(size,len(d)-off)) if off < len(d) else 0
                  print(f'BE_LAYOUT_SPECIAL name={name} addr=0x{addr:x} offset=0x{off:x} declared=0x{size:x} file_backed=0x{avail:x}')
                  if name=='.comment' and avail:
                      raw=d[off:off+avail].replace(b'\0',b'|')
                      print('BE_LAYOUT_COMMENT='+raw.decode('ascii','replace')[:500])

          dynsym=by.get('.dynsym'); dynstr=by.get('.dynstr')
          if dynsym and dynstr:
              di,dtyp,dflags,daddr,doff,dsize,dlink,dinfo,dalign,dent=dynsym
              si,styp,sflags,saddr,soff,ssize,slink,sinfo,salign,sent=dynstr
              sb=d[soff:soff+ssize]
              def ds(o):
                  if o>=len(sb): return ''
                  e=sb.find(b'\0',o); e=len(sb) if e<0 else e
                  return sb[o:e].decode('utf-8','replace')
              ents=dent or 24
              imports=[]; exports=[]
              for o in range(doff,doff+dsize,ents):
                  if o+24>len(d): break
                  sn,info,other,shndx,val,sz=struct.unpack_from(E+'IBBHQQ',d,o)
                  nm=ds(sn)
                  if not nm: continue
                  rec=(nm,shndx,val,sz,info>>4,other&3)
                  if shndx==0: imports.append(rec)
                  elif (info>>4) in (1,2) and (other&3)==0: exports.append(rec)
              print('BE_LAYOUT_EXPORT_DETAILS_BEGIN')
              for nm,shndx,val,sz,bind,vis in exports:
                  secname=secs[shndx][1] if 0<=shndx<len(secs) else '?'
                  print(f'EXPORT name={nm} value=0x{val:x} size=0x{sz:x} section={secname}')
              print('BE_LAYOUT_EXPORT_DETAILS_END')
              print('BE_LAYOUT_IMPORTS_BEGIN')
              for nm,shndx,val,sz,bind,vis in sorted(imports):
                  print(nm)
              print('BE_LAYOUT_IMPORTS_END')

          print('BE_LAYOUT_EXECUTED=false')
          print('BE_LAYOUT_MUTATION_PERFORMED=false')
          PY

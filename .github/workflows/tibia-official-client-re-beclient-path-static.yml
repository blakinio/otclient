name: Track A BEClient path static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-path-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-path-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Validate QLibrary filename dataflow statically
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Re-derive exact filename-dataflow invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'BE_PATH_VALIDATOR_CLIENT_FENCE=PASS'

          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              e=blob.find(b'\0',o); e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[{'name':cs(names,x[0]),'addr':x[3],'off':x[4],'size':x[5]} for x in sh]
          text=next(s for s in secs if s['name']=='.text')
          def b_at(va,n):
              off=text['off']+(va-text['addr']); return d[off:off+n]
          def target_rel32(va):
              x=b_at(va,5)
              if len(x)!=5 or x[0]!=0xe8: raise SystemExit(f'VALIDATOR_FAIL=not_rel32_call@0x{va:x}')
              return va+5+struct.unpack_from('<i',x,1)[0]
          def expect(va,hx,label):
              want=bytes.fromhex(hx); got=b_at(va,len(want))
              if got!=want: raise SystemExit(f'VALIDATOR_FAIL={label}@0x{va:x}:got={got.hex()}')
              print(f'VALIDATOR_PASS={label}@0x{va:x}')

          # The loader obtains a shared service through helper 0x6ba0b0.
          if target_rel32(0x6fc4f2)!=0x6ba0b0:
              raise SystemExit('VALIDATOR_FAIL=getter_call_target')
          print('VALIDATOR_PASS=getter_call_target_0x6ba0b0@0x6fc4f2')

          # After the getter: service object -> hidden return buffer/local -> virtual slot +0xd8.
          expect(0x6fc4f7,'488bb530ffffff','service_object_from_local')
          expect(0x6fc4fe,'488d8540ffffff','qstring_return_buffer_local')
          expect(0x6fc505,'488985c8feffff','qstring_pointer_saved_for_setfilename')
          expect(0x6fc50c,'4889c7488b06ff90d8000000','virtual_slot_d8_sret_call')

          # The saved local QString is later passed directly to QLibrary::setFileName, then load().
          expect(0x6fcab0,'488bb5c8feffff4c89e7','setfilename_args_from_saved_qstring')
          if target_rel32(0x6fcaba)!=0x4db830:
              raise SystemExit('VALIDATOR_FAIL=setfilename_target')
          if target_rel32(0x6fcac2)!=0x4dc340:
              raise SystemExit('VALIDATOR_FAIL=load_target')
          print('VALIDATOR_PASS=QLibrary_setFileName@0x6fcaba')
          print('VALIDATOR_PASS=QLibrary_load@0x6fcac2')

          # Revalidate previously captured bounded windows against immutable SHA-256 evidence.
          for label,start,end,want in [
              ('owner_producer_window',0x6fc450,0x6fc540,'f5a9738658cefa902916c6e563507a78e948c8d56b2540b3f0055cacc1023e66'),
              ('setfilename_window',0x6fca70,0x6fcae0,'c93526b7b9f5d341f9a860a5639a24f8bf8f545a52c228e11fa399bce4eafc6e'),
          ]:
              got=hashlib.sha256(b_at(start,end-start)).hexdigest()
              if got!=want: raise SystemExit(f'VALIDATOR_FAIL={label}:{got}')
              print(f'VALIDATOR_PASS={label}_sha256:{got}')

          # Exact literal filename/path is absent in both common encodings; construction remains dynamic.
          literals={
              'ascii_BEClient.so': b'BEClient.so',
              'ascii_BattlEye_BEClient.so': b'BattlEye/BEClient.so',
              'ascii_slash_BattlEye_BEClient.so': b'/BattlEye/BEClient.so',
              'utf16le_BEClient.so': 'BEClient.so'.encode('utf-16le'),
              'utf16le_BattlEye_BEClient.so': 'BattlEye/BEClient.so'.encode('utf-16le'),
          }
          for label,needle in literals.items():
              count=d.count(needle)
              if count!=0: raise SystemExit(f'VALIDATOR_FAIL={label}_count:{count}')
              print(f'VALIDATOR_PASS={label}_literal_absent')

          # +0xd8 is not a globally unique semantic slot; exact client has eight direct disp32 calls.
          tb=d[text['off']:text['off']+text['size']]
          d8=[]
          for i in range(len(tb)-6):
              if tb[i]!=0xff: continue
              m=tb[i+1]
              if (m>>6)!=2 or ((m>>3)&7)!=2 or (m&7)==4: continue
              if struct.unpack_from('<i',tb,i+2)[0]==0xd8: d8.append(text['addr']+i)
          expected=[0x60daf8,0x668a24,0x6927de,0x6fc512,0x79d9ca,0x7a9211,0x8568d1,0xa34f95]
          if d8!=expected: raise SystemExit('VALIDATOR_FAIL=slot_d8_census:'+','.join(hex(x) for x in d8))
          print('VALIDATOR_PASS=slot_d8_census:8')
          print('VALIDATOR_SLOT_D8_CALLS='+','.join(hex(x) for x in d8))

          print('VALIDATOR_CONCRETE_FILENAME=UNKNOWN_DYNAMIC_QSTRING')
          print('VALIDATOR_EXECUTED_TARGET=false')
          print('VALIDATOR_LIVE_RUNTIME_OBSERVED=false')
          print('VALIDATOR_MUTATION_PERFORMED=false')
          PY

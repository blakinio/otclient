name: Track A BEClient path static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-beclient-path-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-beclient-path-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Trace QLibrary filename construction statically
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Census virtual +0xd8 callsites and semantic context
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'BE_PATH_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if not (0 <= o < len(blob)): return ''
              e=blob.find(b'\0',o); e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[{'name':cs(names,x[0]),'addr':x[3],'off':x[4],'size':x[5]} for x in sh]
          text=next(s for s in secs if s['name']=='.text'); tb=d[text['off']:text['off']+text['size']]
          calls=[]
          # x86-64 CALL r/m64 FF /2, mod=10 disp32 == 0xd8, non-SIB forms.
          for i in range(len(tb)-6):
              if tb[i] != 0xff: continue
              m=tb[i+1]
              if (m>>6)!=2 or ((m>>3)&7)!=2 or (m&7)==4: continue
              disp=struct.unpack_from('<i',tb,i+2)[0]
              if disp==0xd8: calls.append(text['addr']+i)
          print(f'BE_PATH_SLOT_D8_CALL_COUNT={len(calls)}')
          print('BE_PATH_SLOT_D8_CALLS='+','.join(f'0x{x:x}' for x in calls))
          print('BE_PATH_SLOT_D8_CONTEXTS_BEGIN')
          for idx,callva in enumerate(calls):
              start=max(text['addr'],callva-0x90); end=min(text['addr']+text['size'],callva+0xd0)
              fo=text['off']+(start-text['addr']); blob=d[fo:fo+(end-start)]
              print(f'CTX index={idx} call=0x{callva:x} va=0x{start:x} size=0x{len(blob):x} sha256={hashlib.sha256(blob).hexdigest()} hex={blob.hex()}')
          print('BE_PATH_SLOT_D8_CONTEXTS_END')
          print('BE_PATH_SLOT_D8_STRINGS_BEGIN')
          seen=set()
          for callva in calls:
              lo=max(0,callva-text['addr']-0x180); hi=min(len(tb)-7,callva-text['addr']+0x200)
              for i in range(lo,hi):
                  if tb[i] not in range(0x48,0x50) or tb[i+1]!=0x8d: continue
                  m=tb[i+2]
                  if (m>>6)!=0 or (m&7)!=5: continue
                  va=text['addr']+i; dest=va+7+struct.unpack_from('<i',tb,i+3)[0]
                  if not (0 <= dest < len(d)): continue
                  e=d.find(b'\0',dest,min(len(d),dest+180))
                  if e<=dest: continue
                  raw=d[dest:e]
                  if not raw or len(raw)>160 or not all(32<=b<127 for b in raw): continue
                  s=raw.decode('ascii','replace'); key=(callva,dest,s)
                  if key in seen: continue
                  seen.add(key); print(f'call=0x{callva:x} ref=0x{va:x} target=0x{dest:x} text={s}')
          print('BE_PATH_SLOT_D8_STRINGS_END')
          print('BE_PATH_EXECUTED_TARGET=false')
          print('BE_PATH_LIVE_RUNTIME_OBSERVED=false')
          print('BE_PATH_MUTATION_PERFORMED=false')
          PY

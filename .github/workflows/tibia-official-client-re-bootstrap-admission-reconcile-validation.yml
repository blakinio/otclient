name: Track A bootstrap admission reconciliation validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/test_track_a_agent_runtime_governance.py
      - docs/agents/tasks/active/OTC-20260816-track-a-canonical-runtime-e2e.md
      - .github/workflows/tibia-official-client-re-bootstrap-admission-reconcile-validation.yml

permissions:
  contents: read

jobs:
  validate-bootstrap-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate promoted-bootstrap transactional admission
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .github/scripts/test_track_a_agent_runtime_governance.py
          python3 - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          script = Path('.github/scripts/test_track_a_agent_runtime_governance.py')
          spec = importlib.util.spec_from_file_location('gov', script)
          assert spec and spec.loader
          gov = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gov)

          if not gov.bootstrap_implementation_promoted():
              raise SystemExit('promoted bootstrap implementation proof did not resolve')

          base = {
              'task_id': 'OTC-test-bootstrap',
              'branch': 'ci/test-bootstrap',
              'track_id': 'official-client-re',
              'runtime_access': 'canonical_bootstrap',
              'runtime_owner_task': 'OTC-test-bootstrap',
              'runtime_namespace': 'canonical-live-runtime',
              'canonical_registration': 'ABSENT',
              'canonical_lease_generation': 'UNKNOWN',
              'registration_lease_generation': 'NOT_APPLICABLE',
              'gate_a': 'REQUIRED_NOT_PROVEN',
              'generation_rebind': 'NOT_APPLICABLE',
              'gate_b': 'NOT_APPLICABLE',
              'bootstrap': 'PASS',
              'target_uniqueness': 'UNKNOWN',
              'mutation_authorized': 'true',
              'bootstrap_attempt_limit': '1',
              'live_runtime_authorization_source': 'owner instruction 2026-08-16 finish current RUNTIME task',
              'credentials_allowed': 'false',
              'login_allowed': 'false',
              'gameplay_allowed': 'false',
          }

          def accepted(name, changes, expected):
              values = dict(base)
              values.update(changes)
              with tempfile.TemporaryDirectory() as tmp:
                  path = Path(tmp) / f'{name}.md'
                  lines = ['---'] + [f'{k}: {v}' for k, v in values.items()] + ['---', '', '# case']
                  path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
                  ok = True
                  try:
                      gov.validate_track_a_task(path)
                  except SystemExit:
                      ok = False
              if ok != expected:
                  raise SystemExit(f'{name}: expected {expected}, got {ok}')

          accepted('authorized_one_attempt', {}, True)
          accepted('unknown_registration', {'canonical_registration': 'UNKNOWN'}, False)
          accepted('stale_gate_a_preclaim', {'gate_a': 'PASS'}, False)
          accepted('stale_uniqueness_preclaim', {'target_uniqueness': 'PROVEN'}, False)
          accepted('attempt_limit_two', {'bootstrap_attempt_limit': '2'}, False)
          accepted('missing_owner_source', {'live_runtime_authorization_source': 'UNKNOWN'}, False)
          accepted('credentials_enabled', {'credentials_allowed': 'true'}, False)
          accepted('login_enabled', {'login_allowed': 'true'}, False)
          accepted('gameplay_enabled', {'gameplay_allowed': 'true'}, False)
          accepted('bootstrap_not_pass', {'bootstrap': 'REQUIRED_NOT_PROVEN'}, False)

          fail_closed = dict(base)
          fail_closed.update({
              'bootstrap': 'REQUIRED_UNIMPLEMENTED',
              'mutation_authorized': 'false',
          })
          for key in ('bootstrap_attempt_limit', 'live_runtime_authorization_source', 'credentials_allowed', 'login_allowed', 'gameplay_allowed'):
              fail_closed.pop(key, None)
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 'fail-closed.md'
              path.write_text('\n'.join(['---'] + [f'{k}: {v}' for k, v in fail_closed.items()] + ['---']) + '\n')
              gov.validate_track_a_task(path)

          gov.static_policy_audit()
          print('TRACK_A_BOOTSTRAP_ADMISSION_RECONCILE_VALIDATOR=PASS')
          PY

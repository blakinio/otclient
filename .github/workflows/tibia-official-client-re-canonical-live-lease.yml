name: Track A canonical live controller lease

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/tibia-official-client-re-canonical-live-lease
      - .github/scripts/tibia-official-client-re-canonical-live-lease.py
      - .github/scripts/tibia-official-client-re-canonical-live-guard.py
      - .github/scripts/test_tibia_official_client_re_canonical_live_lease.py
      - .github/scripts/test_tibia_official_client_re_canonical_live_guard.py
      - .github/scripts/test_tibia_official_client_re_canonical_live_lease_selfhosted.sh
      - .github/workflows/tibia-official-client-re-canonical-live-lease.yml
      - docs/agents/tasks/active/OTC-20260815-track-a-live-runtime-lease-manager.md
      - docs/agents/evidence/OTC-20260815-track-a-live-runtime-lease-manager/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic lease tests
        run: |
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_lease.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_guard.py

  isolated-selfhosted:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 2
      - name: Prove trusted main before physical lease test
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo TRACK_A_CANONICAL_LEASE_TRUSTED_MAIN=PASS
      - name: Exercise lease transitions in task-owned state only
        shell: bash
        run: |
          bash .github/scripts/test_tibia_official_client_re_canonical_live_lease_selfhosted.sh
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_guard.py

  fresh-audit:
    name: Fresh independent acceptance audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Falsify production routing and prior P1 repairs
        shell: bash
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -Eeuo pipefail
          wrapper=.github/scripts/tibia-official-client-re-canonical-live-lease
          helper=.github/scripts/tibia-official-client-re-canonical-live-guard.py
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease.py
          grep -Fq "GUARD_IMPL=\"\$SCRIPT_DIR/tibia-official-client-re-canonical-live-guard.py\"" "$wrapper"
          grep -Fq "exec python3 \"\$GUARD_IMPL\" --state-dir \"\$CANONICAL_STATE_DIR\" \"\$@\"" "$wrapper"
          grep -Fq 'PR_SET_CHILD_SUBREAPER' "$helper"
          grep -Fq 'close_fds=True' "$helper"
          grep -Fq 'SUPERVISOR_CANCELLATION_SIGNALS' "$helper"
          grep -Fq 'signal.pthread_sigmask' "$helper"
          grep -Fq '_record_supervisor_cancellation' "$helper"
          if grep -Fq 'pass_fds=' "$helper"; then
            echo '::error::guarded command still controls a passed flock descriptor'
            exit 1
          fi
          python3 -m py_compile "$lease" "$helper"
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_lease.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_guard.py
          echo TRACK_A_CANONICAL_LEASE_FRESH_AUDIT_PASS=true

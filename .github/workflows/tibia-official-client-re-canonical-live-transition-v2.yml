name: Track A canonical live transition v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/tibia-official-client-re-canonical-live-transition.py
      - .github/scripts/tibia-official-client-re-canonical-live-session.sh
      - .github/scripts/test_tibia_official_client_re_canonical_live_transition.py
      - docs/agents/tasks/active/OTC-20260816-track-a-canonical-bootstrap-implementation.md
      - .github/workflows/tibia-official-client-re-canonical-live-transition-v2.yml

permissions:
  contents: read

jobs:
  deterministic-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate transition and worker contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_OS" = Linux
          python3 -m py_compile \
            .github/scripts/tibia-official-client-re-canonical-live-transition.py \
            .github/scripts/test_tibia_official_client_re-canonical-live-transition.py
          bash -n .github/scripts/tibia-official-client-re-canonical-live-session.sh
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_guard.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_lease.py
          test "$(git ls-files -s .github/scripts/tibia-official-client-re-canonical-live-transition.py | cut -d' ' -f1)" = 100755
          test "$(git ls-files -s .github/scripts/tibia-official-client-re-canonical-live-session.sh | cut -d' ' -f1)" = 100755
          if grep -Fq 'login_e2e' .github/scripts/tibia-official-client-re-canonical-live-session.sh; then
            echo "forbidden login path found in infrastructure worker" >&2
            exit 1
          fi
          if grep -Fq "\$BASE/runtime/wireproxy.pid" .github/scripts/tibia-official-client-re-canonical-live-session.sh; then
            echo "forbidden historical wireproxy dependency found" >&2
            exit 1
          fi
          grep -Fq '_install_supervisor_signal_handlers' .github/scripts/tibia-official-client-re-canonical-live-transition.py
          grep -Fq '_become_child_subreaper' .github/scripts/tibia-official-client-re-canonical-live-transition.py
          grep -Fq 'WGCF_VER=2.2.32' .github/scripts/tibia-official-client-re-canonical-live-session.sh
          grep -Fq 'WP_VER=1.1.3' .github/scripts/tibia-official-client-re-canonical-live-session.sh
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          echo TRACK_A_CANONICAL_TRANSITION_V2_VALIDATION=PASS

name: Track A canonical runtime E2E v4

on:
  pull_request:
    branches: [main]
    paths:
      - docs/agents/tasks/active/OTC-20260816-track-a-canonical-runtime-e2e.md
      - .github/workflows/tibia-official-client-re-canonical-runtime-e2e-v4.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-runtime-e2e
  cancel-in-progress: false

jobs:
  bootstrap-canonical-runtime:
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Fresh admission, canonical bootstrap and immediate Gate B
        shell: bash
        env:
          EXPECTED_BASE_SHA: 917b8ab943fd9aa1fded50c9a0b8b4e1dfeb5cbb
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077

          [[ "$RUNNER_NAME" == 'synology-otclient-01' ]]
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || {
            echo "RUNTIME_BOOTSTRAP_REFUSED=BASE_MOVED:$EVENT_BASE_SHA" >&2
            exit 44
          }

          task='OTC-20260816-track-a-canonical-runtime-e2e'
          session="runtime-v4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state='/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime'
          token_root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"
          token="$token_root/canonical-lease-token"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          worker='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          acquired=0

          grep -Fq 'TOOLROOT_WORK=/work/_otclient_tibia_re_state/toolroot' "$worker"
          grep -Fq 'within_toolroot "$root_real" "$path"' "$worker"
          if grep -Fq 'command -v "$1"' "$worker"; then
            echo 'RUNTIME_BOOTSTRAP_REFUSED=UNTRUSTED_AMBIENT_TOOL_FALLBACK' >&2
            exit 45
          fi
          resolved="$(TRACK_A_CANONICAL_WORKER_CONTRACT_TEST=1 bash "$worker" toolroot)"
          [[ "$resolved" == '/work/_otclient_tibia_re_state/toolroot' ]] || {
            echo "RUNTIME_BOOTSTRAP_REFUSED=SUPPORT_ROOT_NOT_COMPLETE:$resolved" >&2
            exit 46
          }
          echo 'RUNTIME_SUPPORT_ROOT_PREFLIGHT=PASS'

          mkdir -p "$token_root"
          chmod 700 "/home/runner/_work/_otclient_tibia_re_state/tasks/$task" "$token_root" 2>/dev/null || true
          rm -f "$token"

          cleanup() {
            rc=$?
            if [[ "$acquired" == 1 ]]; then
              bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true
            fi
            rm -f "$token"
            exit "$rc"
          }
          trap cleanup EXIT

          echo '=== PRE_ADMISSION ==='
          bash "$lease" status --json
          if [[ -e "$state/runtime-registration.json" ]]; then
            echo 'RUNTIME_BOOTSTRAP_PRECHECK=REGISTRATION_ALREADY_PRESENT_RECLASSIFY'
            exit 42
          fi
          if [[ -e "$state/session" ]]; then
            echo 'RUNTIME_BOOTSTRAP_PRECHECK=UNREGISTERED_SESSION_ROOT_PRESENT_REVIEW_REQUIRED'
            exit 43
          fi

          bash "$lease" acquire \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --ttl-seconds 1200
          acquired=1

          echo '=== BOOTSTRAP ==='
          python3 "$transition" bootstrap \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --worker "$worker" \
            --worker-timeout 300

          echo '=== GATE_B_SAME_GENERATION ==='
          python3 "$transition" gate-b \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --probe "$worker"

          echo '=== SANITIZED_REGISTRATION ==='
          python3 - "$state/runtime-registration.json" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text())
          allowed = [
              'schema_version','runtime_id','registration_generation','lease_generation',
              'boot_id_sha256','pid','process_start_ticks','client_version','client_size',
              'client_sha256','display','window_identity','remote_view_endpoint',
              'remote_view_mapping','state','source_task','source_run'
          ]
          expected = {
              'runtime_id': 'track-a-canonical-live',
              'client_version': '15.32.df7b29',
              'client_size': 51965216,
              'client_sha256': 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe',
              'remote_view_mapping': 'PROVEN',
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f'RUNTIME_REGISTRATION_INVALID={key}')
          endpoint = str(data.get('remote_view_endpoint') or '')
          if not endpoint.startswith('127.0.0.1:'):
              raise SystemExit('RUNTIME_REGISTRATION_INVALID=remote_view_endpoint_not_loopback')
          print(json.dumps({k:data.get(k) for k in allowed}, sort_keys=True))
          print('RUNTIME_BOOTSTRAP_RESULT=REGISTERED_GATE_B_PASS')
          PY

          bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token"
          acquired=0
          rm -f "$token"

          echo '=== POST_RELEASE ==='
          bash "$lease" status --json
          test -f "$state/runtime-registration.json"
          echo 'RUNTIME_CONTROLLER_RELEASED=true'
          echo 'RUNTIME_PERSISTENT_RUNTIME_LEFT_IDLE=true'

name: Track A canonical runtime registration

on:
  push:
    branches: [research/OTC-20260815-track-a-canonical-runtime-registration]
    paths:
      - .github/scripts/tibia-official-client-re-canonical-runtime-registration.py
      - .github/workflows/tibia-official-client-re-canonical-runtime-registration.yml
      - docs/agents/tasks/active/OTC-20260815-track-a-canonical-runtime-registration.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Read-only register persistent Track A runtime candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REF_NAME" == research/OTC-20260815-track-a-canonical-runtime-registration ]]

          output="$RUNNER_TEMP/track-a-canonical-runtime-registration.json"
          python3 .github/scripts/tibia-official-client-re-canonical-runtime-registration.py \
            --output "$output"

          python3 - "$output" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding='utf-8'))
          forbidden = ('password', 'credential', 'cookie', 'session_key', 'token_sha256', 'environment')
          text = json.dumps(data, sort_keys=True)
          lowered = text.lower()
          for needle in forbidden:
              if needle in lowered:
                  raise SystemExit(f'forbidden result key/text: {needle}')
          if data.get('read_only') is not True:
              raise SystemExit('read_only result fence failed')
          print('TRACK_A_CANONICAL_REGISTRATION_JSON_BEGIN=true')
          print(json.dumps(data, sort_keys=True, indent=2))
          print('TRACK_A_CANONICAL_REGISTRATION_JSON_END=true')
          PY

          echo TRACK_A_CANONICAL_REGISTRATION_SANITIZED_RESULT=true
          echo TRACK_A_CANONICAL_REGISTRATION_NO_RUNTIME_MUTATION=true

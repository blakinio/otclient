name: Track A canonical window wait fix v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/tibia-official-client-re-canonical-live-session.sh
      - .github/scripts/test_tibia_official_client_re_canonical_live_session.py
      - .github/workflows/tibia-official-client-re-canonical-window-wait-fix-v2.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-canonical-client-window-wait-fix.md

permissions:
  contents: read

jobs:
  validate-window-wait:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run bounded-window and canonical transition contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n .github/scripts/tibia-official-client-re-canonical-live-session.sh
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_session.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_guard.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_lease.py
          echo 'TRACK_A_CANONICAL_WINDOW_WAIT_VALIDATION=PASS'
          echo 'TRACK_A_RUNTIME_ACCESS=none'
          echo 'TRACK_A_PHYSICAL_E2E=false'

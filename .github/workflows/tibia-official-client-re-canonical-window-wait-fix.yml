name: Track A canonical client window wait fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/tibia-official-client-re-canonical-live-session.sh
      - .github/scripts/test_tibia_official_client_re_canonical_live_session.py
      - .github/workflows/tibia-official-client-re-canonical-window-wait-fix.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-canonical-client-window-wait-fix.md

permissions:
  contents: read

jobs:
  validate-bounded-window-wait:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate canonical session bounded wait and dependent contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n .github/scripts/tibia-official-client-re-canonical-live-session.sh
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_session.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_guard.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_lease.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/scripts/tibia-official-client-re-canonical-live-session.sh').read_text()
          start = source.index('bootstrap() {')
          end = source.index('\nprobe() {', start)
          body = source[start:end]
          assert 'for _ in $(seq 1 100); do' not in body
          assert body.count('window "$pid" "$display" "$xdotool"') == 1
          assert 'TRACK_A_CANONICAL_STAGE=client_window_wait_begin' in body
          assert 'TRACK_A_CANONICAL_STAGE=client_window_ready' in body
          print('TRACK_A_BOUNDED_WINDOW_WAIT_VALIDATION=PASS')
          PY
          echo 'TRACK_A_RUNTIME_ACCESS=none'
          echo 'TRACK_A_PHYSICAL_E2E=false'

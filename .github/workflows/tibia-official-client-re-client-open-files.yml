name: Track A old client open-file probe

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-client-open-files.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      OLD_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Inspect only filesystem descriptors of exact owned client
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          [[ -n "$pid" && -r "/proc/$pid/environ" ]]
          grep -azFxq "$marker" "/proc/$pid/environ"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$OLD_CLIENT_SHA256" ]]
          echo TRACK_A_OPEN_FILE_OWNER_PID="$pid"
          python3 - "$pid" "$state" <<'PY'
          import os,pathlib,sys
          pid,state=sys.argv[1],sys.argv[2]
          rows=[]
          for fd in pathlib.Path('/proc',pid,'fd').iterdir():
              try: target=os.readlink(fd)
              except OSError: continue
              if target.startswith(('socket:[','pipe:[','anon_inode:','/dev/','/proc/')): continue
              safe=target.replace(state,'[STATE]')
              rows.append((int(fd.name),safe))
          rows.sort()
          print('TRACK_A_CLIENT_FILESYSTEM_FD_COUNT='+str(len(rows)))
          for fd,target in rows[:200]: print(f'TRACK_A_CLIENT_FILESYSTEM_FD={fd}|{target}')
          print('TRACK_A_CLIENT_RUNNING_MARKER_FD='+str(any(t.endswith('/.running') or t=='.running' for _,t in rows)).lower())
          PY
          echo TRACK_A_CLIENT_OPEN_FILE_PROBE_COMPLETE=true

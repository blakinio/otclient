name: Track A verify corrected official client runtime library path
on:
  push:
    branches: [ci/OTC-20260814-track-a-single-item-drag]
    paths: [.github/workflows/tibia-official-client-re-client-runtime-path-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: [otclient, synology]
    timeout-minutes: 4
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Verify loader resolution only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          pkg="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"; client="$pkg/bin/client"; root="$state/toolroot"
          [[ -x "$client" && "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          px="$root/usr/lib/x86_64-linux-gnu/libproxy"; [[ -s "$px/libpxbackend-1.0.so" ]]
          runtime_lib="$pkg/bin/lib:$px:$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu"
          echo TRACK_A_RUNTIME_LIB_PATH="$runtime_lib"
          out="$(LD_LIBRARY_PATH="$runtime_lib" ldd "$client" 2>&1 || true)"
          printf '%s\n' "$out"
          if grep -q 'not found' <<<"$out"; then echo TRACK_A_RUNTIME_LIB_ALL_FOUND=false; exit 41; fi
          if grep -q "version .Qt_6\.9. not found" <<<"$out"; then echo TRACK_A_RUNTIME_QT_69_RESOLVED=false; exit 42; fi
          qtcore="$(awk '/libQt6Core\.so\.6 =>/{print $3; exit}' <<<"$out")"
          qtgui="$(awk '/libQt6Gui\.so\.6 =>/{print $3; exit}' <<<"$out")"
          pxbe="$(awk '/libpxbackend-1\.0\.so =>/{print $3; exit}' <<<"$out")"
          echo TRACK_A_RUNTIME_QTCORE="$qtcore"
          echo TRACK_A_RUNTIME_QTGUI="$qtgui"
          echo TRACK_A_RUNTIME_PXBACKEND="$pxbe"
          [[ "$qtcore" == "$pkg/bin/lib/"* && "$qtgui" == "$pkg/bin/lib/"* ]]
          [[ "$pxbe" == "$px/libpxbackend-1.0.so" ]]
          echo TRACK_A_RUNTIME_LIB_ALL_FOUND=true
          echo TRACK_A_RUNTIME_QT_69_RESOLVED=true
          echo TRACK_A_CLIENT_SHA_UNCHANGED=true

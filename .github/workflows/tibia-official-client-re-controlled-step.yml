name: Track A controlled in-world step probe
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-controlled-step.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-client-re-controlled-step
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [otclient, synology]
    timeout-minutes: 2
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Send exactly one movement key and collect callback evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          runtime="$state/runtime"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          [[ -r "$runtime/client.pid" && -r "$runtime/dynamic-map-gdb.pid" ]]
          pid="$(tr -cd '0-9' <"$runtime/client.pid")"
          gdb_pid="$(tr -cd '0-9' <"$runtime/dynamic-map-gdb.pid")"
          kill -0 "$pid"; kill -0 "$gdb_pid"
          grep -azFxq "$marker" "/proc/$pid/environ"
          grep -azFxq "$marker" "/proc/$gdb_pid/environ"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          log="$runtime/dynamic-map-events.log"
          before_events="$(grep -c '^EVENT ' "$log" || true)"
          before_args="$(grep -c '^ARG ' "$log" || true)"
          export HOME="$state/home" DISPLAY="$TRACK_DISPLAY"
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          resolve_window(){
            local w g width height area best='' best_area=0
            for _ in $(seq 1 40); do
              best=''; best_area=0
              for w in $("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do
                g="$("$toolroot/usr/bin/xdotool" getwindowgeometry --shell "$w" 2>/dev/null || true)"
                width="$(printf '%s\n' "$g" | sed -n 's/^WIDTH=//p')"
                height="$(printf '%s\n' "$g" | sed -n 's/^HEIGHT=//p')"
                [[ -n "$width" && -n "$height" ]] || continue
                area=$((width*height)); if (( area > best_area )); then best="$w"; best_area=$area; fi
              done
              [[ -n "$best" ]] && { printf '%s\n' "$best"; return 0; }
              sleep .25
            done
            return 1
          }
          window="$(resolve_window)"
          out="$GITHUB_WORKSPACE/artifacts/controlled-step"
          mkdir -p "$out"
          "$toolroot/usr/bin/xdotool" windowactivate --sync "$window" 2>/dev/null || true
          "$toolroot/usr/bin/xdotool" windowfocus --sync "$window"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$out/before.xwd"
          "$toolroot/usr/bin/xdotool" key --window "$window" Up
          echo TRACK_A_CONTROLLED_STEP_SENT=true
          sleep 3
          kill -0 "$pid"; kill -0 "$gdb_pid"
          window="$(resolve_window)"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$out/after.xwd"
          changed="$(python3 "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-xwd-diff.py" "$out/before.xwd" "$out/after.xwd")"
          after_events="$(grep -c '^EVENT ' "$log" || true)"
          after_args="$(grep -c '^ARG ' "$log" || true)"
          echo TRACK_A_CONTROLLED_STEP_CHANGED_PIXELS="$changed"
          echo TRACK_A_DYNAMIC_MAP_EVENTS_BEFORE="$before_events"
          echo TRACK_A_DYNAMIC_MAP_EVENTS_AFTER="$after_events"
          echo TRACK_A_DYNAMIC_MAP_ARGS_BEFORE="$before_args"
          echo TRACK_A_DYNAMIC_MAP_ARGS_AFTER="$after_args"
          echo TRACK_A_DYNAMIC_MAP_EVENT_EVIDENCE_BEGIN=true
          grep -E '^(OBSERVER_ARMED|EVENT |ARG )' "$log" || true
          echo TRACK_A_DYNAMIC_MAP_EVENT_EVIDENCE_END=true
      - name: Upload controlled step frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-controlled-step
          path: artifacts/controlled-step/*.xwd
          if-no-files-found: ignore
          retention-days: 7

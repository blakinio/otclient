name: Track A crash marker inventory

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-crash-marker-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Inventory Track A crashdump filenames only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          crash="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/crashdump"
          [[ -d "$crash" ]]
          echo TRACK_A_CRASHDUMP_SCAN_BEGIN=true
          find "$crash" -xdev -maxdepth 2 -mindepth 1 -printf '%y|%P|%s\n' \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[REDACTED_EMAIL]/g' \
            | head -n 200 \
            | sed 's/^/TRACK_A_CRASHDUMP_ENTRY=/'
          echo TRACK_A_CRASHDUMP_SCAN_COMPLETE=true

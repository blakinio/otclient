name: Track A crash marker inventory

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-crash-marker-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Inventory only crash-report-related Track A filenames
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          home="$state/home"
          [[ -d "$home" ]]
          echo TRACK_A_CRASH_MARKER_SCAN_BEGIN=true
          find "$home" -xdev -maxdepth 8 \( -iname '*crash*' -o -iname '*error*' -o -iname '*report*' -o -iname '*dump*' \) -printf '%y|%P|%s\n' \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[REDACTED_EMAIL]/g' \
            | head -n 200 \
            | sed 's/^/TRACK_A_CRASH_MARKER=/'
          echo TRACK_A_CRASH_MARKER_SCAN_COMPLETE=true

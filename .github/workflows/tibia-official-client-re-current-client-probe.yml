name: Track A current official client probe

on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-current-client-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Observe current official client identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -s)" == Linux ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          echo "::notice::TRACK_A_CURRENT_CLIENT_SIZE=$(stat -c %s "$client")"
          echo "::notice::TRACK_A_CURRENT_CLIENT_SHA256=$(sha256sum "$client" | awk '{print $1}')"
          echo TRACK_A_CURRENT_CLIENT_PROBE_COMPLETE=true

name: Track A current login field6 scalar owner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-official-client-re-current-login-field6-scalar-owner.yml
      - tools/tibia_re_current_login_field6_scalar_owner/**
      - docs/agents/tasks/active/OTC-20260828-current-login-field6-scalar-owner.md

permissions:
  contents: read

jobs:
  static-field6-scalar-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Validate scalar-owner source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/tibia_re_current_login_field6_scalar_owner/test_contract.py
          python3 -m py_compile \
            tools/tibia_re_current_login_field6_scalar_owner/probe.py \
            tools/tibia_re_current_login_field6_scalar_owner/qmeta_owner.py
          bash -n tools/tibia_re_current_login_field6_scalar_owner/prepare_warp.sh

      - name: Prepare exact public client through bounded WARP fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools
          r="$RUNNER_TEMP/field6-scalar-owner"
          mkdir -p "$r/bin" "$r/pkg"
          curl -fsSL -o "$r/bin/wgcf" https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  '"$r"'/bin/wgcf' | sha256sum -c - >/dev/null
          curl -fsSL -o "$r/bin/wireproxy.tgz" https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  '"$r"'/bin/wireproxy.tgz' | sha256sum -c - >/dev/null
          mkdir "$r/bin/wp" && tar -xzf "$r/bin/wireproxy.tgz" -C "$r/bin/wp"
          cp "$(find "$r/bin/wp" -type f -name wireproxy -print -quit)" "$r/bin/wireproxy"
          chmod 755 "$r/bin/wgcf" "$r/bin/wireproxy" tools/tibia_re_current_login_field6_scalar_owner/prepare_warp.sh
          FIELD6_SCALAR_OWNER_ROOT="$r" tools/tibia_re_current_login_field6_scalar_owner/prepare_warp.sh
          socks_port="$(cat "$r/active-socks-port")"
          echo "RE_SOCKS_PORT=$socks_port" >> "$GITHUB_ENV"
          base=https://static.tibia.com/launcher/tibiaclient-linux-current
          curl --socks5-hostname "127.0.0.1:$socks_port" --compressed -fL "$base/package.json" -o "$r/pkg/package.json"
          python3 - "$r/pkg/package.json" "$GITHUB_ENV" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=[x for x in doc.get('files',[]) if isinstance(x,dict) and x.get('localfile')=='bin/client']
          if len(rows)!=1: raise SystemExit('expected one bin/client row')
          row=rows[0]
          vals={'VERSION':str(doc.get('version') or ''),'PACKED_SHA':str(row.get('packedhash') or '').lower(),'UNPACKED_SHA':str(row.get('unpackedhash') or '').lower(),'PACKED_SIZE':str(row.get('packedsize')),'UNPACKED_SIZE':str(row.get('unpackedsize')),'CLIENT_URL':str(row.get('url') or '')}
          exp={'VERSION':'15.32.75d4a0','PACKED_SHA':'075810c54af2d6912000eab062763db29563f5a1f4bf1d984154b2d07fd5729f','UNPACKED_SHA':'d1a16819cec7e40cfee39c099d4868d2eb2d7c1c942078eda105233b5688817a','UNPACKED_SIZE':'52105824'}
          for k,v in exp.items():
            if vals[k]!=v: raise SystemExit(f'exact current fence moved: {k}')
          with open(sys.argv[2],'a',encoding='utf-8') as h:
            for k,v in vals.items(): h.write(f'RE_{k}={v}\n')
            h.write(f'RE_ROOT={sys.argv[1].rsplit("/",2)[0]}\n')
            h.write('RE_BASE=https://static.tibia.com/launcher/tibiaclient-linux-current\n')
          print('CURRENT_LOGIN_FIELD6_SCALAR_OWNER_EXACT_FENCE=PASS')
          PY

      - name: Resolve exact scalar caller QMeta owner and handler binding
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -f "$RE_ROOT/pkg/client" "$RE_ROOT/pkg/client.lzma"' EXIT
          curl --socks5-hostname "127.0.0.1:$RE_SOCKS_PORT" --compressed -fL "$RE_BASE/$RE_CLIENT_URL" -o "$RE_ROOT/pkg/client.lzma"
          echo "$RE_PACKED_SHA  $RE_ROOT/pkg/client.lzma" | sha256sum -c - >/dev/null
          test "$(stat -c %s "$RE_ROOT/pkg/client.lzma")" = "$RE_PACKED_SIZE"
          python3 - "$RE_ROOT/pkg/client.lzma" "$RE_ROOT/pkg/client" "$RE_UNPACKED_SHA" "$RE_UNPACKED_SIZE" <<'PY'
          import hashlib,lzma,pathlib,sys
          src,dst,expected_sha,expected_size=sys.argv[1:]
          packed=pathlib.Path(src).read_bytes(); prop=packed[32]; lc=prop%9; z=prop//9; lp=z%5; pb=z//5; ds=int.from_bytes(packed[33:37],'little')
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          if len(raw)!=int(expected_size) or hashlib.sha256(raw).hexdigest()!=expected_sha: raise SystemExit('unpacked client fence mismatch')
          pathlib.Path(dst).write_bytes(raw)
          PY
          mkdir -p artifacts/current-login-field6-scalar-owner
          python3 tools/tibia_re_current_login_field6_scalar_owner/probe.py --client "$RE_ROOT/pkg/client" --output artifacts/current-login-field6-scalar-owner/result.json
          python3 tools/tibia_re_current_login_field6_scalar_owner/qmeta_owner.py --client "$RE_ROOT/pkg/client" --output artifacts/current-login-field6-scalar-owner/result.json
          rm -f "$RE_ROOT/pkg/client" "$RE_ROOT/pkg/client.lzma"
          echo RAW_CLIENT_RETAINED=false

      - name: Validate sanitized scalar-owner result
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          p='artifacts/current-login-field6-scalar-owner/result.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['runtime_access']=='none'
          assert d['official_client_executed'] is False
          assert d['process_memory_access'] is False
          assert d['raw_client_uploaded'] is False
          assert d['exact_client']['sha256']=='d1a16819cec7e40cfee39c099d4868d2eb2d7c1c942078eda105233b5688817a'
          assert d['promoted_target']['handler_vtable_address_point']=='0x30b6700'
          assert d['promoted_target']['slot_0x60_target']=='0xe25620'
          assert d['scalar_callsite_census']['classification']=='SCALAR_CALLSITE_CENSUS'
          assert d['scalar_callsite_census']['scope_markers']['CALLER_FDE_RTTI_OWNERS'] is True
          assert d['scalar_callsite_census']['scope_markers']['PARENT_MEMBER_HANDLER_BINDING'] is True
          assert d['scalar_callsite_census']['scope_markers']['NO_HEURISTIC_RANKING'] is True
          assert d['scalar_callsite_census']['scope_markers']['NO_SEMANTIC_GUESSING'] is True
          assert d['qmeta_caller_owner']['classification']=='QMETA_CALLER_OWNER'
          assert d['qmeta_caller_owner']['scope_markers']['TARGET_SCALAR_PARENT_THIS'] is True
          assert d['qmeta_caller_owner']['scope_markers']['STATIC_METAOBJECT_TRIPLE'] is True
          assert d['qmeta_caller_owner']['scope_markers']['METHOD_CASE_DIRECT_EDGE'] is True
          assert d['qmeta_caller_owner']['scope_markers']['OWNER_QMETA_CLASS'] is True
          assert d['qmeta_caller_owner']['scope_markers']['PARENT_MEMBER_HANDLER_BINDING'] is True
          assert d['qmeta_caller_owner']['scope_markers']['NO_HEURISTIC_RANKING'] is True
          assert d['qmeta_caller_owner']['scope_markers']['NO_SEMANTIC_GUESSING'] is True
          assert d['classification'] in ('FIELD6_VALUE_PROVEN','FIELD6_VALUE_UNKNOWN')
          print('CURRENT_LOGIN_FIELD6_SCALAR_OWNER_SANITIZED_RESULT=PASS')
          PY

      - name: Upload sanitized result only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-login-field6-scalar-owner-${{ github.sha }}
          path: artifacts/current-login-field6-scalar-owner/result.json
          if-no-files-found: error
          retention-days: 3

name: Track A current official login only

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-current-login-only.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  login:
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
      TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Fill proven fields and enter first character
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          runtime="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$runtime/bin/client"
          toolroot="$state/toolroot"
          tool_path="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          tool_lib="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          evidence="$state/evidence/current-login-only-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$evidence"; chmod 700 "$evidence"
          cleanup(){ unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD || true; rm -f "$evidence"/*.xwd 2>/dev/null || true; }
          trap cleanup EXIT
          pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          [[ -n "$pid" && -r "/proc/$pid/environ" ]]
          grep -azFxq "$marker" "/proc/$pid/environ"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          kill -0 "$pid"
          export HOME="$state/home" DISPLAY="$TRACK_DISPLAY" PATH="$tool_path" LD_LIBRARY_PATH="$tool_lib"
          resolve_window(){
            local w g width height
            for _ in $(seq 1 60); do
              for w in $("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do
                g="$("$toolroot/usr/bin/xdotool" getwindowgeometry --shell "$w" 2>/dev/null || true)"
                width="$(printf '%s\n' "$g" | sed -n 's/^WIDTH=//p')"; height="$(printf '%s\n' "$g" | sed -n 's/^HEIGHT=//p')"
                [[ "$width" == 1020 && "$height" == 650 ]] && { printf '%s\n' "$w"; return 0; }
              done
              sleep .5
            done
            return 1
          }
          window="$(resolve_window)"
          "$toolroot/usr/bin/xdotool" windowactivate --sync "$window" 2>/dev/null || true
          "$toolroot/usr/bin/xdotool" windowfocus --sync "$window"
          pre="$evidence/pre.xwd"; post="$evidence/post.xwd"; world="$evidence/world.xwd"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$pre"
          "$toolroot/usr/bin/xdotool" mousemove --window "$window" 535 250 click 1
          "$toolroot/usr/bin/xdotool" key ctrl+a BackSpace
          "$toolroot/usr/bin/xdotool" type --delay 12 -- "$TIBIA_TEST_EMAIL"
          "$toolroot/usr/bin/xdotool" mousemove --window "$window" 535 384 click 1
          "$toolroot/usr/bin/xdotool" key ctrl+a BackSpace
          "$toolroot/usr/bin/xdotool" type --delay 12 -- "$TIBIA_TEST_PASSWORD"
          echo TRACK_A_PROVEN_FIELDS_FILLED=true
          "$toolroot/usr/bin/xdotool" key Return
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          echo TRACK_A_LOGIN_SUBMITTED=true
          sleep 5
          kill -0 "$pid"
          window="$(resolve_window)"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$post"
          changed="$(python3 "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-xwd-diff.py" "$pre" "$post")"
          echo TRACK_A_LOGIN_CHANGED_PIXELS="$changed"
          (( changed > 5000 ))
          "$toolroot/usr/bin/xdotool" windowfocus --sync "$window"
          "$toolroot/usr/bin/xdotool" mousemove --window "$window" 285 193 click 1
          sleep .4
          "$toolroot/usr/bin/xdotool" key Return
          sleep 8
          kill -0 "$pid"
          window="$(resolve_window)"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$world"
          world_changed="$(python3 "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-xwd-diff.py" "$post" "$world")"
          echo TRACK_A_WORLD_CHANGED_PIXELS="$world_changed"
          (( world_changed > 5000 ))
          echo TRACK_A_PROBABLE_WORLD_VIEW_RENDERED=true
          rm -f "$evidence"/*.xwd
          trap - EXIT
          echo TRACK_A_SESSION_LEFT_RUNNING=true

name: Track A enter authenticated first character only
on:
  push:
    branches:
      - ci/OTC-20260814-track-a-single-item-drag
    paths:
      - .github/workflows/tibia-official-client-re-enter-first-character-only.yml
permissions:
  contents: read
concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false
jobs:
  enter:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Select first authenticated character and enter world
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'; runtime="$state/runtime"; toolroot="$state/toolroot"
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          pid="$(tr -cd '0-9' <"$runtime/client.pid")"
          kill -0 "$pid"; grep -azFxq "$marker" "/proc/$pid/environ"; [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]; [[ "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          export HOME="$state/home" DISPLAY="$TRACK_DISPLAY" PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin" LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          window=''; best=0
          for w in $("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do g="$("$toolroot/usr/bin/xdotool" getwindowgeometry --shell "$w" 2>/dev/null || true)"; width="$(sed -n 's/^WIDTH=//p'<<<"$g")"; height="$(sed -n 's/^HEIGHT=//p'<<<"$g")"; [[ -n "$width" && -n "$height" ]] || continue; area=$((width*height)); ((area>best)) && { best=$area; window=$w; }; done
          [[ -n "$window" && "$best" -eq 663000 ]]
          mkdir -p "$GITHUB_WORKSPACE/artifacts/enter-character"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$GITHUB_WORKSPACE/artifacts/enter-character/before.xwd"
          "$toolroot/usr/bin/xdotool" windowactivate --sync "$window" 2>/dev/null || true; "$toolroot/usr/bin/xdotool" windowfocus --sync "$window"
          "$toolroot/usr/bin/xdotool" mousemove --window "$window" 285 193 click 1
          sleep .4
          "$toolroot/usr/bin/xdotool" key Return
          echo TRACK_A_CHARACTER_ENTER_SUBMITTED=true
          sleep 12
          kill -0 "$pid"
          window=''; best=0
          for w in $("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do g="$("$toolroot/usr/bin/xdotool" getwindowgeometry --shell "$w" 2>/dev/null || true)"; width="$(sed -n 's/^WIDTH=//p'<<<"$g")"; height="$(sed -n 's/^HEIGHT=//p'<<<"$g")"; [[ -n "$width" && -n "$height" ]] || continue; area=$((width*height)); ((area>best)) && { best=$area; window=$w; }; done
          [[ -n "$window" && "$best" -eq 663000 ]]
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$GITHUB_WORKSPACE/artifacts/enter-character/after.xwd"
          echo TRACK_A_CLIENT_LEFT_RUNNING=true
      - name: Upload entered-world evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-enter-first-character-only
          path: artifacts/enter-character/*.xwd
          if-no-files-found: ignore
          retention-days: 7

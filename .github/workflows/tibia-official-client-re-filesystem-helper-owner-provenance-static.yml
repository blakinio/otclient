name: Track A filesystem-helper owner provenance static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-owner-provenance-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-owner-provenance.md

permissions:
  contents: read

jobs:
  inspect:
    name: Trace TGameClientBase owner field inputs statically
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Emit exact constructor input window
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'OWNER_PROV_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ';sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx];names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for x in sh:secs.append({'name':cs(names,x[0]),'addr':x[3],'off':x[4],'size':x[5]})
          text=next(s for s in secs if s['name']=='.text')
          def b_at(va,n):
              return d[text['off']+(va-text['addr']):text['off']+(va-text['addr'])+n]
          for label,start,end in [
              ('GAMECLIENT_CTOR_PRE',0x6c7d00,0x6c8210),
              ('GAMECLIENT_DERIVED',0x6c83c0,0x6c84c0),
          ]:
              blob=b_at(start,end-start)
              print(f'{label}_START=0x{start:x}')
              print(f'{label}_END=0x{end:x}')
              print(f'{label}_SHA256={hashlib.sha256(blob).hexdigest()}')
              print(f'{label}_HEX={blob.hex()}')
          blob=b_at(0x6c7d00,0x510);base=0x6c7d00
          needles={
              'store_rbp_minus_f8':'48898508ffffff',
              'load_rbp_minus_f8':'488b8508ffffff',
              'store_rbp_minus_f0':'48898510ffffff',
              'load_rbp_minus_f0':'488b8510ffffff',
              'tgameclientbase_vptr':'488d0591e69a02',
          }
          for label,hx in needles.items():
              needle=bytes.fromhex(hx);poss=[];p=0
              while True:
                  i=blob.find(needle,p)
                  if i<0:break
                  poss.append(base+i);p=i+1
              print(f'OWNER_PROV_NEEDLE {label}='+','.join(hex(x) for x in poss))
          # Candidate instructions writing R13 (register number 13) in the same bounded function window.
          print('OWNER_PROV_R13_WRITE_CANDIDATES_BEGIN')
          for i in range(len(blob)-8):
              rex=blob[i]
              if not (0x40 <= rex <= 0x4f):continue
              op=blob[i+1]
              if op not in (0x8b,0x89,0x8d):continue
              m=blob[i+2]
              reg=((m>>3)&7)|(((rex>>2)&1)<<3)
              # 8B/8D write reg field; 89 writes r/m, so report only register-direct R13 writes for 89.
              hit=(op in (0x8b,0x8d) and reg==13) or (op==0x89 and (m>>6)==3 and (m&7)|((rex&1)<<3)==13)
              if hit:
                  va=base+i
                  print(f'va=0x{va:x} bytes={blob[i:i+10].hex()}')
          print('OWNER_PROV_R13_WRITE_CANDIDATES_END')
          print('OWNER_PROV_EXECUTED_TARGET=false')
          print('OWNER_PROV_LIVE_RUNTIME_OBSERVED=false')
          print('OWNER_PROV_MUTATION_PERFORMED=false')
          PY

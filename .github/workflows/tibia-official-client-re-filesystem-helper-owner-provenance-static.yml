name: Track A filesystem-helper owner provenance static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-owner-provenance-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-owner-provenance.md

permissions:
  contents: read

jobs:
  inspect:
    name: Trace loader callback registration statically
    runs-on: [otclient, synology]
    timeout-minutes: 7
    steps:
      - name: Find instruction-boundary references to loader entry
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'OWNER_PROV_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          sf=E+'IIQQQQIIQQ';sh=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx];sn=d[st[4]:st[4]+st[5]]
          def cs(b,o):
              e=b.find(b'\0',o);e=len(b) if e<0 else e
              return b[o:e].decode('utf8','replace')
          secs=[{'name':cs(sn,x[0]),'addr':x[3],'off':x[4],'size':x[5],'entsize':x[9]} for x in sh]
          by={s['name']:s for s in secs};text=by['.text'];tb=d[text['off']:text['off']+text['size']]
          def b_at(va,n):return d[text['off']+(va-text['addr']):text['off']+(va-text['addr'])+n]
          target=0x6fc034
          refs=[]
          # RIP-relative LEA/MOV address materialization at actual instruction starts for common encodings.
          for i in range(len(tb)-7):
              if tb[i] not in range(0x48,0x50):continue
              if tb[i+1] not in (0x8d,0x8b):continue
              m=tb[i+2]
              if (m>>6)!=0 or (m&7)!=5:continue
              va=text['addr']+i;dst=va+7+struct.unpack_from('<i',tb,i+3)[0]
              if dst==target:refs.append((va,'lea' if tb[i+1]==0x8d else 'mov_rip'))
          # Direct branch refs for completeness.
          for i in range(len(tb)-5):
              va=text['addr']+i
              if tb[i] in (0xe8,0xe9):
                  dst=va+5+struct.unpack_from('<i',tb,i+1)[0]
                  if dst==target:refs.append((va,'call' if tb[i]==0xe8 else 'jmp'))
          print('OWNER_PROV_LOADER_CODE_REFS='+','.join(f'0x{va:x}:{kind}' for va,kind in refs))
          for va,kind in refs:
              lo=max(text['addr'],va-0x160);hi=min(text['addr']+text['size'],va+0x180);w=b_at(lo,hi-lo)
              print(f'OWNER_PROV_LOADER_REF_WINDOW ref=0x{va:x} kind={kind} start=0x{lo:x} sha256={hashlib.sha256(w).hexdigest()} hex={w.hex()}')
          # Relocation/data references to exact function address.
          rel=by.get('.rela.dyn');rrefs=[]
          if rel:
              for o in range(rel['off'],rel['off']+rel['size'],rel['entsize'] or 24):
                  ro,ri,ad=struct.unpack_from('<QQq',d,o)
                  if ad==target:rrefs.append(ro)
          print('OWNER_PROV_LOADER_RELOCATION_REFS='+','.join(hex(v) for v in rrefs))
          # Search exact qword function value in allocated non-text sections; record only locations, no semantic claim yet.
          q=struct.pack('<Q',target);datarefs=[]
          for s in secs:
              if s['name']=='.text' or not s['size']:continue
              blob=d[s['off']:s['off']+s['size']];p=0
              while True:
                  j=blob.find(q,p)
                  if j<0:break
                  datarefs.append((s['name'],s['addr']+j));p=j+1
          print('OWNER_PROV_LOADER_QWORD_REFS='+','.join(f'{n}@0x{va:x}' for n,va in datarefs[:100]))
          print('OWNER_PROV_EXECUTED_TARGET=false')
          print('OWNER_PROV_LIVE_RUNTIME_OBSERVED=false')
          print('OWNER_PROV_MUTATION_PERFORMED=false')
          PY

name: Track A filesystem-helper owner provenance static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-owner-provenance-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-owner-provenance.md

permissions:
  contents: read

jobs:
  inspect:
    name: Map TTibiaFileSystemHelper factory and owner initializer callers
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Locate function entrypoints and direct callsites
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'OWNER_PROV_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ';sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx];names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for x in sh:secs.append({'name':cs(names,x[0]),'addr':x[3],'off':x[4],'size':x[5]})
          text=next(s for s in secs if s['name']=='.text');tb=d[text['off']:text['off']+text['size']]
          def b_at(va,n):
              return d[text['off']+(va-text['addr']):text['off']+(va-text['addr'])+n]
          def direct_calls(target):
              out=[]
              for i in range(len(tb)-5):
                  if tb[i]!=0xe8:continue
                  va=text['addr']+i
                  if va+5+struct.unpack_from('<i',tb,i+1)[0]==target:out.append(va)
              return out
          prologue=bytes.fromhex('415741564155415455534889f34881ec38010000897c241c4c8d642470')
          region_start=0x5ef300;region=b_at(region_start,0xa00)
          hits=[];p=0
          while True:
              j=region.find(prologue,p)
              if j<0:break
              hits.append(region_start+j);p=j+1
          print('OWNER_PROV_FACTORY_PROLOGUE_HITS='+','.join(hex(x) for x in hits))
          for target in hits+[0x6ba100]:
              calls=direct_calls(target)
              print(f'OWNER_PROV_DIRECT_CALLS target=0x{target:x} count={len(calls)} calls='+','.join(hex(x) for x in calls))
              for va in calls[:40]:
                  lo=max(text['addr'],va-0x90);hi=min(text['addr']+text['size'],va+0xb0);w=b_at(lo,hi-lo)
                  print(f'OWNER_PROV_CALL_WINDOW target=0x{target:x} call=0x{va:x} start=0x{lo:x} sha256={hashlib.sha256(w).hexdigest()} hex={w.hex()}')
          # Also map exact direct calls to the known shared_ptr helper used by the factory.
          for target in (0x6b2e20,0x6ba0b0):
              calls=[x for x in direct_calls(target) if 0x5ef300 <= x < 0x5efd00 or target==0x6ba0b0]
              print(f'OWNER_PROV_LOCAL_CALLS target=0x{target:x} count={len(calls)} calls='+','.join(hex(x) for x in calls))
          print('OWNER_PROV_EXECUTED_TARGET=false')
          print('OWNER_PROV_LIVE_RUNTIME_OBSERVED=false')
          print('OWNER_PROV_MUTATION_PERFORMED=false')
          PY

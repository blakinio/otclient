name: Track A filesystem-helper owner provenance static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-owner-provenance-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-owner-provenance.md

permissions:
  contents: read

jobs:
  inspect:
    name: Trace TGameClient factory input object statically
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Map callers and field writers for TGameClient input
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'OWNER_PROV_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ';sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx];names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              e=blob.find(b'\0',o);e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for x in sh:secs.append({'name':cs(names,x[0]),'addr':x[3],'off':x[4],'size':x[5],'entsize':x[9]})
          by={s['name']:s for s in secs};text=by['.text'];tb=d[text['off']:text['off']+text['size']]
          def b_at(va,n):return d[text['off']+(va-text['addr']):text['off']+(va-text['addr'])+n]
          def calls(target):
              out=[]
              for i in range(len(tb)-5):
                  if tb[i]!=0xe8:continue
                  va=text['addr']+i
                  if va+5+struct.unpack_from('<i',tb,i+1)[0]==target:out.append(va)
              return out
          target=0x6c8020
          csx=calls(target)
          print('OWNER_PROV_TGAMECLIENT_FACTORY_CALLS='+','.join(hex(v) for v in csx))
          for va in csx:
              lo=max(text['addr'],va-0x180);hi=min(text['addr']+text['size'],va+0x100);w=b_at(lo,hi-lo)
              print(f'OWNER_PROV_FACTORY_CALL_WINDOW call=0x{va:x} start=0x{lo:x} sha256={hashlib.sha256(w).hexdigest()} hex={w.hex()}')
          rel=by.get('.rela.dyn')
          if rel:
              refs=[]
              for o in range(rel['off'],rel['off']+rel['size'],rel['entsize'] or 24):
                  ro,ri,add=struct.unpack_from('<QQq',d,o)
                  if add==target:refs.append(ro)
              print('OWNER_PROV_TGAMECLIENT_FACTORY_RELOCS='+','.join(hex(v) for v in refs))
          # Locate common writes to +0x18/+0x20 pairs in a broad initializer region around known bootstrap construction.
          for label,start,end in [('BOOTSTRAP',0x5ee000,0x5f1000),('GAMECLIENT_NEAR',0x6c7000,0x6c8020)]:
              blob=b_at(start,end-start)
              hits=[]
              for i in range(len(blob)-8):
                  rex=blob[i]
                  if not (0x48<=rex<=0x4f) or blob[i+1]!=0x89:continue
                  m=blob[i+2];mod=m>>6;rm=m&7
                  if rm==4 or mod not in (1,2):continue
                  disp=struct.unpack_from('<b' if mod==1 else '<i',blob,i+3)[0]
                  if disp not in (0x18,0x20):continue
                  va=start+i;hits.append(va)
              print(f'OWNER_PROV_PAIR_WRITES region={label} count={len(hits)} hits='+','.join(hex(v) for v in hits[:200]))
          print('OWNER_PROV_EXECUTED_TARGET=false')
          print('OWNER_PROV_LIVE_RUNTIME_OBSERVED=false')
          print('OWNER_PROV_MUTATION_PERFORMED=false')
          PY

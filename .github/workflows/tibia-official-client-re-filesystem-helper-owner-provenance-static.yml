name: Track A filesystem-helper owner provenance static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-owner-provenance-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-owner-provenance.md

permissions:
  contents: read

jobs:
  inspect:
    name: Trace control-flow predecessors of TGameClient creation block
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Find exact relative branches into 0x6c976e
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'OWNER_PROV_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          sf=E+'IIQQQQIIQQ';sh=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx];sn=d[st[4]:st[4]+st[5]]
          def cs(b,o):
              e=b.find(b'\0',o);e=len(b) if e<0 else e
              return b[o:e].decode('utf8','replace')
          secs=[{'name':cs(sn,x[0]),'addr':x[3],'off':x[4],'size':x[5]} for x in sh]
          text=next(s for s in secs if s['name']=='.text');tb=d[text['off']:text['off']+text['size']]
          def b_at(va,n):return d[text['off']+(va-text['addr']):text['off']+(va-text['addr'])+n]
          target=0x6c976e;refs=[]
          for i in range(len(tb)-6):
              va=text['addr']+i
              if tb[i] in (0xe8,0xe9):
                  dst=va+5+struct.unpack_from('<i',tb,i+1)[0]
                  if dst==target:refs.append((va,'call' if tb[i]==0xe8 else 'jmp'))
              if tb[i]==0x0f and 0x80<=tb[i+1]<=0x8f:
                  dst=va+6+struct.unpack_from('<i',tb,i+2)[0]
                  if dst==target:refs.append((va,f'jcc_{tb[i+1]:02x}'))
              if 0x70<=tb[i]<=0x7f:
                  dst=va+2+struct.unpack_from('<b',tb,i+1)[0]
                  if dst==target:refs.append((va,f'jcc8_{tb[i]:02x}'))
              if tb[i]==0xeb:
                  dst=va+2+struct.unpack_from('<b',tb,i+1)[0]
                  if dst==target:refs.append((va,'jmp8'))
          print('OWNER_PROV_BLOCK_XREFS='+','.join(f'0x{va:x}:{kind}' for va,kind in refs))
          for va,kind in refs:
              lo=max(text['addr'],va-0x180);hi=min(text['addr']+text['size'],va+0x120);w=b_at(lo,hi-lo)
              print(f'OWNER_PROV_BLOCK_XREF_WINDOW source=0x{va:x} kind={kind} start=0x{lo:x} sha256={hashlib.sha256(w).hexdigest()} hex={w.hex()}')
          # Also emit immediately preceding bytes to distinguish fall-through from branch-entry.
          for start,end,label in [(0x6c95e0,0x6c9790,'PRE_BLOCK'),(0x6c9200,0x6c97a0,'WIDE_PRE_BLOCK')]:
              w=b_at(start,end-start)
              print(f'OWNER_PROV_{label}_START=0x{start:x}')
              print(f'OWNER_PROV_{label}_SHA256={hashlib.sha256(w).hexdigest()}')
              print(f'OWNER_PROV_{label}_HEX={w.hex()}')
          print('OWNER_PROV_EXECUTED_TARGET=false')
          print('OWNER_PROV_LIVE_RUNTIME_OBSERVED=false')
          print('OWNER_PROV_MUTATION_PERFORMED=false')
          PY

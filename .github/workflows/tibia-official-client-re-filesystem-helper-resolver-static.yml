name: Track A filesystem-helper resolver static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-resolver-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-resolver-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Decode category 9 base directory and static component
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Resolve Qt base-dir call and static QString backing
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'FS_RESOLVER_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          sf=E+'IIQQQQIIQQ';raw=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
          st=raw[shstrndx];sn=d[st[4]:st[4]+st[5]]
          def cs(b,o):
              if not (0<=o<len(b)):return ''
              e=b.find(b'\0',o);e=len(b) if e<0 else e
              return b[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(raw):secs.append({'idx':i,'name':cs(sn,x[0]),'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
          by={s['name']:s for s in secs}
          def voff(va):
              for s in secs:
                  if s['size'] and s['addr']<=va<s['addr']+s['size']:return s['off']+(va-s['addr'])
              return None
          def b_at(va,n):
              o=voff(va);return b'' if o is None else d[o:o+n]
          def ascii_at(va,limit=200):
              o=voff(va)
              if o is None:return None
              e=d.find(b'\0',o,min(len(d),o+limit))
              if e<=o:return None
              z=d[o:e]
              if z and all(32<=x<127 for x in z):return z.decode('ascii')
              return None
          def utf16_at(va,nchars=None,limit=100):
              o=voff(va)
              if o is None:return None
              rawb=d[o:o+(2*nchars if nchars is not None else 2*limit)]
              if nchars is None:
                  end=None
                  for j in range(0,len(rawb)-1,2):
                      if rawb[j:j+2]==b'\0\0':end=j;break
                  if end is not None:rawb=rawb[:end]
              try:
                  t=rawb.decode('utf-16le')
                  return t if t and all(32<=ord(c)<127 for c in t) else None
              except:return None
          # dynamic symbols + relocation map
          dyn=by['.dynsym'];ss=secs[dyn['link']];sb=d[ss['off']:ss['off']+ss['size']];syms=[]
          for o in range(dyn['off'],dyn['off']+dyn['size'],dyn['entsize'] or 24):
              no,info,other,si,val,sz=struct.unpack_from('<IBBHQQ',d,o);syms.append((cs(sb,no),val,sz,si,info))
          got_names={};rel_by_off={}
          for rn in ('.rela.plt','.rela.dyn'):
              r=by.get(rn)
              if not r:continue
              for o in range(r['off'],r['off']+r['size'],r['entsize'] or 24):
                  ro,ri,ad=struct.unpack_from('<QQq',d,o);sym=ri>>32;typ=ri&0xffffffff
                  name=syms[sym][0] if sym and sym<len(syms) else ''
                  if name:got_names[ro]=name
                  rel_by_off[ro]=(typ,sym,ad,name)
          def plt_symbol(va):
              x=b_at(va,24)
              for p in range(0,min(10,len(x)-6)):
                  if x[p:p+2]==b'\xff\x25':
                      got=va+p+6+struct.unpack_from('<i',x,p+2)[0]
                      return got,got_names.get(got,''),x.hex()
              return None,'',x.hex()
          got,name,hx=plt_symbol(0x4e0050)
          print(f'FS_RESOLVER_SLOT18_CATEGORY9_CALL target=0x4e0050 got={"NONE" if got is None else hex(got)} symbol={name} bytes={hx}')
          # category9 slot10 object exact 24 bytes and relocations for each qword.
          obj=0x31964a0
          print(f'FS_RESOLVER_SLOT10_CATEGORY9_OBJECT=0x{obj:x} raw={b_at(obj,24).hex()}')
          for off in (0,8,16):
              va=obj+off;rawq=struct.unpack('<Q',b_at(va,8))[0]
              r=rel_by_off.get(va)
              print(f'FS_RESOLVER_SLOT10_QWORD va=0x{va:x} raw=0x{rawq:x} reloc={r}')
              candidates=[rawq]
              if r:candidates.append(r[2])
              for ptr in candidates:
                  if not ptr:continue
                  for n in (None,3,4,8,9,16):
                      t=utf16_at(ptr,n)
                      if t:print(f'FS_RESOLVER_SLOT10_BACKING source=0x{va:x} ptr=0x{ptr:x} nchars={n} text={t}')
                  a=ascii_at(ptr)
                  if a:print(f'FS_RESOLVER_SLOT10_BACKING_ASCII source=0x{va:x} ptr=0x{ptr:x} text={a}')
          # inspect nearby static objects / relocation addends for category9 and category10 to distinguish boundaries.
          print('FS_RESOLVER_SLOT10_STATIC_REGION_BEGIN')
          for va in range(0x3196460,0x31964e0,8):
              rawq=struct.unpack('<Q',b_at(va,8))[0];r=rel_by_off.get(va)
              if rawq or r:print(f'va=0x{va:x} raw=0x{rawq:x} reloc={r}')
          print('FS_RESOLVER_SLOT10_STATIC_REGION_END')
          # category9 case exact direct call must be QCoreApplication-like symbol identified above.
          call=b_at(0xc91230,5);dst=0xc91235+struct.unpack_from('<i',call,1)[0]
          print(f'FS_RESOLVER_SLOT18_CATEGORY9_CASE_CALL=0x{dst:x}')
          print('FS_RESOLVER_EXECUTED_TARGET=false')
          print('FS_RESOLVER_LIVE_RUNTIME_OBSERVED=false')
          print('FS_RESOLVER_MUTATION_PERFORMED=false')
          PY

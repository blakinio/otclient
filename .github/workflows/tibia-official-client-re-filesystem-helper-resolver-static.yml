name: Track A filesystem-helper resolver static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-resolver-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-resolver-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Deterministically validate BEClient QLibrary path formula
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Re-derive exact client-side path construction
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'FS_PATH_VALIDATOR_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          sf=E+'IIQQQQIIQQ'; raw=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
          st=raw[shstrndx]; sn=d[st[4]:st[4]+st[5]]
          def cs(b,o):
              if not (0<=o<len(b)): return ''
              e=b.find(b'\0',o); e=len(b) if e<0 else e
              return b[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(raw):
              secs.append({'idx':i,'name':cs(sn,x[0]),'type':x[1],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
          by={s['name']:s for s in secs}; text=by['.text']
          def voff(va):
              for s in secs:
                  if s['type']!=8 and s['addr']<=va<s['addr']+s['size']:
                      return s['off']+(va-s['addr'])
              return None
          def b_at(va,n):
              o=voff(va); return b'' if o is None else d[o:o+n]
          def expect(va,hx,label):
              want=bytes.fromhex(hx); got=b_at(va,len(want))
              if got!=want: raise SystemExit(f'VALIDATOR_FAIL={label}@0x{va:x}:got={got.hex()}')
              print(f'VALIDATOR_PASS={label}@0x{va:x}')
          def rel32(va):
              x=b_at(va,5)
              if len(x)!=5 or x[0]!=0xe8: raise SystemExit(f'VALIDATOR_FAIL=not_call@0x{va:x}:{x.hex()}')
              return va+5+struct.unpack_from('<i',x,1)[0]
          def rip7(va):
              x=b_at(va,7)
              if len(x)!=7: raise SystemExit(f'VALIDATOR_FAIL=short_rip@0x{va:x}')
              return va+7+struct.unpack_from('<i',x,3)[0]
          def ascii_at(va,limit=240):
              o=voff(va)
              if o is None:return None
              e=d.find(b'\0',o,min(len(d),o+limit))
              if e<=o:return None
              z=d[o:e]
              if not z or not all(32<=x<127 for x in z):return None
              return z.decode('ascii','replace')
          # Relocations / RTTI.
          rel=by['.rela.dyn']; bo={}
          for o in range(rel['off'],rel['off']+rel['size'],rel['entsize'] or 24):
              ro,ri,ad=struct.unpack_from('<QQq',d,o); bo[ro]=(ri&0xffffffff,ri>>32,ad)
          rt=lambda va: None if va not in bo else bo[va][2]
          def validate_vtable(vptr,ti,name,slots,label):
              if struct.unpack('<q',b_at(vptr-16,8))[0]!=0: raise SystemExit(f'VALIDATOR_FAIL={label}_offset_to_top')
              if rt(vptr-8)!=ti: raise SystemExit(f'VALIDATOR_FAIL={label}_typeinfo')
              nva=rt(ti+8)
              if nva is None or ascii_at(nva)!=name: raise SystemExit(f'VALIDATOR_FAIL={label}_typename:{nva}:{ascii_at(nva) if nva else None}')
              for off,target in slots.items():
                  if rt(vptr+off)!=target: raise SystemExit(f'VALIDATOR_FAIL={label}_slot_{off:x}:{rt(vptr+off)}')
              print(f'VALIDATOR_PASS={label}_RTTI_vtable')
          validate_vtable(0x2f62080,0x3070940,'N5tibia6shared22TTibiaFileSystemHelperE',{
              0x10:0xc8f6e0,0x18:0xc91200,0x28:0xc9b620,0x30:0xc9b890,0xd8:0xc95cb0},'TTibiaFileSystemHelper')
          validate_vtable(0x2f61f90,0x3070918,'N6shared17TFileSystemHelperE',{0x78:0xcfa5e0},'shared_TFileSystemHelper')
          # Dynamic symbols / PLT names.
          dyn=by['.dynsym']; ss=secs[dyn['link']]; sb=d[ss['off']:ss['off']+ss['size']]; syms=[]
          for o in range(dyn['off'],dyn['off']+dyn['size'],dyn['entsize'] or 24):
              no,info,other,si,val,sz=struct.unpack_from('<IBBHQQ',d,o); syms.append((cs(sb,no),val,sz,si,info))
          gotnames={}
          for rn in ('.rela.plt','.rela.dyn'):
              r=by.get(rn)
              if not r:continue
              for o in range(r['off'],r['off']+r['size'],r['entsize'] or 24):
                  ro,ri,ad=struct.unpack_from('<QQq',d,o); sym=ri>>32
                  if sym and sym<len(syms):gotnames[ro]=syms[sym][0]
          def plt_name(va):
              x=b_at(va,24)
              for p in range(min(10,max(0,len(x)-6))):
                  if x[p:p+2]==b'\xff\x25':
                      got=va+p+6+struct.unpack_from('<i',x,p+2)[0]
                      return gotnames.get(got,'')
              return ''
          expected_plt={
              0x4dec90:'strlen',
              0x4df210:'_ZN7QString8fromUtf8E14QByteArrayView',
              0x4ddaf0:'_ZN7QString6appendE20QBasicUtf8StringViewILb0EE',
              0x4de970:'_ZN7QString6appendERKS_',
              0x4db340:'_ZN4QDir18toNativeSeparatorsERK7QString',
              0x4e0050:'_ZN16QCoreApplication18applicationDirPathEv',
              0x4da740:'__cxa_atexit',
          }
          for va,name in expected_plt.items():
              got=plt_name(va)
              if got!=name:raise SystemExit(f'VALIDATOR_FAIL=plt_0x{va:x}:{got}')
              print(f'VALIDATOR_PASS=plt_0x{va:x}:{name}')
          # TTibia +0xd8: exact BEClient key, category 9, dispatch to same object's +0x30.
          expect(0xc95cb2,'488d15f93e0d01','BEClient_key_lea')
          if rip7(0xc95cb2)!=0x1d69bb2 or ascii_at(0x1d69bb2)!='BEClient':raise SystemExit('VALIDATOR_FAIL=BEClient_key')
          expect(0xc95cca,'be08000000','BEClient_length_8')
          if rel32(0xc95cd9)!=0x4df210:raise SystemExit('VALIDATOR_FAIL=BEClient_fromUtf8')
          expect(0xc95cd2,'4c89e74c8b6830','load_same_object_slot30')
          expect(0xc95ce1,'ba09000000','category_9')
          expect(0xc95cec,'41ffd5','call_slot30')
          print('VALIDATOR_PASS=TTibia_slotD8_BEClient_category9_wrapper')
          # TTibia +0x30: first element is own +0x28 result, second is incoming key; then base +0x78.
          for va,hx,label in [
              (0xc9b8a7,'488b064989e54c89efff5028','slot30_call_own_slot28'),
              (0xc9b8b3,'488b5b18','slot30_base_helper_member'),
              (0xc9b8b7,'660f6f1424488b542410','slot30_copy_slot28_result'),
              (0xc9b8df,'f3410f6f1c24498b542410','slot30_copy_key_argument'),
              (0xc9b905,'bf30000000','slot30_allocate_48_bytes'),
              (0xc9b8ce,'4c8b7078','slot30_load_base_slot78'),
              (0xc9b96f,'4889de4889ef4c89fa41ffd6','slot30_call_base_slot78'),
          ]:expect(va,hx,label)
          print('VALIDATOR_PASS=slot30_components_slot28_then_key')
          # TTibia +0x28 forwards category to +0x18 and +0x10 and combines their QString results through base +0x78.
          expect(0xc9b624,'4189d6','slot28_save_category')
          expect(0xc9b64a,'ff5018','slot28_call_slot18')
          expect(0xc9b651,'4489f24c89ee4c89e7ff5010','slot28_pass_category_to_slot10')
          print('VALIDATOR_PASS=slot28_category_to_slot18_slot10')
          # Category 9 jump tables.
          def jt(table,index):
              return table+struct.unpack('<i',b_at(table+index*4,4))[0]
          if jt(0x1d689f8,9)!=0xc8f8e0:raise SystemExit('VALIDATOR_FAIL=slot10_category9')
          if jt(0x1d68a4c,9)!=0xc91230:raise SystemExit('VALIDATOR_FAIL=slot18_category9')
          print('VALIDATOR_PASS=category9_jump_tables')
          # +0x18(9) = QCoreApplication::applicationDirPath().
          if rel32(0xc91230)!=0x4e0050:raise SystemExit('VALIDATOR_FAIL=slot18_category9_applicationDirPath')
          print('VALIDATOR_PASS=category9_slot18_applicationDirPath')
          # +0x10(9) copies the runtime-initialized global QString at 0x31964a0.
          x=b_at(0xc8f8e0,8)
          if x[:4]!=bytes.fromhex('660f6f0d') or 0xc8f8e8+struct.unpack_from('<i',x,4)[0]!=0x31964a0:
              raise SystemExit(f'VALIDATOR_FAIL=slot10_category9_global:{x.hex()}')
          print('VALIDATOR_PASS=category9_slot10_global_0x31964a0')
          # Static initializer for that global uses exact literal BattlEye -> strlen -> QString::fromUtf8.
          expect(0x613463,'4c8d253630b802','BattlEye_global_lea')
          if rip7(0x613463)!=0x31964a0:raise SystemExit('VALIDATOR_FAIL=BattlEye_global_target')
          expect(0x61346a,'488d35ef7c7601','BattlEye_literal_lea')
          if rip7(0x61346a)!=0x1d7b160 or ascii_at(0x1d7b160)!='BattlEye':raise SystemExit('VALIDATOR_FAIL=BattlEye_literal_target')
          expect(0x613471,'4c89e7','BattlEye_global_to_rdi')
          if rel32(0x613474)!=0x6b2350:raise SystemExit('VALIDATOR_FAIL=BattlEye_init_helper')
          expect(0x6b2350,'554889fd534889f331f64883ec084885db','QString_init_helper_entry')
          if rel32(0x6b236c)!=0x4dec90:raise SystemExit('VALIDATOR_FAIL=helper_strlen')
          if rel32(0x6b237b)!=0x4df210:raise SystemExit('VALIDATOR_FAIL=helper_fromUtf8')
          print('VALIDATOR_PASS=category9_slot10_BattlEye_QString_initializer')
          # Base helper J: for each 24-byte QString component append '/' then component, then QDir::toNativeSeparators.
          expect(0xcfa5f5,'488b1a4c8b6208','J_input_begin_end')
          expect(0xcfa615,'4c8d35c695c501','J_slash_lea')
          if rip7(0xcfa615)!=0x2953be2 or ascii_at(0x2953be2)!='/':raise SystemExit('VALIDATOR_FAIL=J_slash')
          expect(0xcfa628,'f30f6f0b488b030f294c2420488b53104889542430','J_copy_24byte_component')
          expect(0xcfa646,'4c89f6ba010000004889ef','J_append_slash_setup')
          if rel32(0xcfa651)!=0x4ddaf0:raise SystemExit('VALIDATOR_FAIL=J_append_slash')
          expect(0xcfa656,'4889c74c89ee','J_append_component_setup')
          if rel32(0xcfa65c)!=0x4de970:raise SystemExit('VALIDATOR_FAIL=J_append_component')
          expect(0xcfa685,'4883c3184939dc759a','J_next_24byte_component')
          expect(0xcfa708,'4889ee4c89ff','J_native_separator_setup')
          if rel32(0xcfa70e)!=0x4db340:raise SystemExit('VALIDATOR_FAIL=J_toNativeSeparators')
          print('VALIDATOR_PASS=base_helper_J_slash_component_native_separators')
          # Immutable independent windows.
          for label,start,end,want in [
              ('base_J',0xcfa5e0,0xcfa760,'53a7479bca7733730fe513f76638d31eaa16cf58abad3ad65bafa8396685b16a'),
              ('slot30',0xc9b890,0xc9ba20,'5d3257ac75e63766f25c671efd49fd6c64920c7e158bd5e112b9eb99fc91fec2'),
              ('slot28',0xc9b620,0xc9b890,'e1ad52aa1fa5a1a83930e1e37e97150269044a2520cddf8675cb61c675193e36'),
              ('BattlEye_init',0x613450,0x6134c0,'0facd17d377cc00b14d728a2a5fda15fdb323098cbf99d6c1c9887be8e403f08'),
              ('QString_init_helper',0x6b2350,0x6b24c0,'2b69a06ad9f6726536251b137d461be7bf170abe68c46d620c3ed2ea4f308390'),
          ]:
              got=hashlib.sha256(b_at(start,end-start)).hexdigest()
              if got!=want:raise SystemExit(f'VALIDATOR_FAIL={label}_sha256:{got}')
              print(f'VALIDATOR_PASS={label}_sha256:{got}')
          print('VALIDATOR_PATH_JOIN_OPERATOR=J(components):append("/");append(component);QDir::toNativeSeparators')
          print('VALIDATOR_PATH_FORMULA=J([J([QCoreApplication::applicationDirPath(),"BattlEye"]),"BEClient"])')
          print('VALIDATOR_PATH_EQUIVALENT_SUFFIX=BattlEye/BEClient')
          print('VALIDATOR_SET_FILENAME_EXTENSION_IN_CLIENT_FORMULA=NONE')
          print('VALIDATOR_RUNTIME_ABSOLUTE_PREFIX=DYNAMIC_APPLICATION_DIR_PATH')
          print('VALIDATOR_EXECUTED_TARGET=false')
          print('VALIDATOR_LIVE_RUNTIME_OBSERVED=false')
          print('VALIDATOR_MUTATION_PERFORMED=false')
          PY

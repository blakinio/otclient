name: Track A filesystem-helper resolver static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-resolver-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-resolver-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Decode shared filesystem helper resolver statically
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Emit exact resolver bytes and RIP references
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'FS_RESOLVER_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          sf=E+'IIQQQQIIQQ';raw=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
          st=raw[shstrndx];sn=d[st[4]:st[4]+st[5]]
          def cs(b,o):
              if not (0<=o<len(b)):return ''
              e=b.find(b'\0',o);e=len(b) if e<0 else e
              return b[o:e].decode('utf8','replace')
          secs=[{'name':cs(sn,x[0]),'addr':x[3],'off':x[4],'size':x[5],'entsize':x[9]} for x in raw]
          by={s['name']:s for s in secs};text=by['.text']
          def voff(va):
              for s in secs:
                  if s['size'] and s['addr']<=va<s['addr']+s['size']:return s['off']+(va-s['addr'])
          def b_at(va,n):
              o=voff(va);return b'' if o is None else d[o:o+n]
          def s_at(va):
              o=voff(va)
              if o is None:return None
              e=d.find(b'\0',o,min(len(d),o+220))
              if e<=o:return None
              z=d[o:e]
              if not z or len(z)>200 or not all(32<=x<127 for x in z):return None
              return z.decode('ascii','replace')
          rel=by['.rela.dyn'];bo={}
          for o in range(rel['off'],rel['off']+rel['size'],rel['entsize'] or 24):
              ro,ri,ad=struct.unpack_from('<QQq',d,o);bo[ro]=(ri&0xffffffff,ri>>32,ad)
          rt=lambda va: None if va not in bo else bo[va][2]
          vptr=0x2f61f90;ti=0x3070918
          if struct.unpack('<q',b_at(vptr-16,8))[0]!=0 or rt(vptr-8)!=ti or rt(vptr+0x78)!=0xcfa5e0:raise SystemExit('FS_RESOLVER_FAIL=vtable')
          nameva=rt(ti+8)
          if not nameva or s_at(nameva)!='N6shared17TFileSystemHelperE':raise SystemExit('FS_RESOLVER_FAIL=type')
          print('FS_RESOLVER_PASS=base_RTTI_slot78')
          for label,a,b in [('ENTRY',0xcfa5e0,0xcfa760),('NEXT',0xcfa760,0xcfa900),('CALLER',0xc9b890,0xc9ba20)]:
              w=b_at(a,b-a)
              print(f'FS_RESOLVER_{label}_START=0x{a:x}')
              print(f'FS_RESOLVER_{label}_END=0x{b:x}')
              print(f'FS_RESOLVER_{label}_SHA256={hashlib.sha256(w).hexdigest()}')
              print(f'FS_RESOLVER_{label}_HEX={w.hex()}')
          # Known slash reference must be exact RIP-relative LEA.
          x=b_at(0xcfa615,7)
          dst=0xcfa61c+struct.unpack_from('<i',x,3)[0]
          print(f'FS_RESOLVER_SLASH_REF_BYTES={x.hex()}')
          print(f'FS_RESOLVER_SLASH_REF_TARGET=0x{dst:x}')
          print(f'FS_RESOLVER_SLASH_TEXT={s_at(dst)}')
          # Print all likely RIP refs from entry window, including non-printable target addresses.
          blob=b_at(0xcfa5e0,0x180)
          print('FS_RESOLVER_ENTRY_RIP_REFS_BEGIN')
          for i in range(len(blob)-7):
              if blob[i] not in range(0x48,0x50) or blob[i+1] not in (0x8d,0x8b):continue
              m=blob[i+2]
              if (m>>6)!=0 or (m&7)!=5:continue
              va=0xcfa5e0+i;dst=va+7+struct.unpack_from('<i',blob,i+3)[0]
              print(f'ref=0x{va:x} op=0x{blob[i+1]:02x} target=0x{dst:x} text={s_at(dst) or ""}')
          print('FS_RESOLVER_ENTRY_RIP_REFS_END')
          print('FS_RESOLVER_EXECUTED_TARGET=false')
          print('FS_RESOLVER_LIVE_RUNTIME_OBSERVED=false')
          print('FS_RESOLVER_MUTATION_PERFORMED=false')
          PY

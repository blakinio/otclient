name: Track A filesystem-helper resolver static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-resolver-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-resolver-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Validate exact BattlEye initializer anchors
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Re-derive adjacent global and literal instructions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'FS_RESOLVER_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import pathlib,struct,sys,hashlib
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          sf=E+'IIQQQQIIQQ';raw=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
          st=raw[shstrndx];sn=d[st[4]:st[4]+st[5]]
          def cs(b,o):
              e=b.find(b'\0',o);e=len(b) if e<0 else e
              return b[o:e].decode('utf8','replace')
          secs=[{'name':cs(sn,x[0]),'addr':x[3],'off':x[4],'size':x[5]} for x in raw]
          text=next(s for s in secs if s['name']=='.text')
          def vaoff(va):
              for s in secs:
                  if s['name']!='.bss' and s['addr']<=va<s['addr']+s['size']:return s['off']+(va-s['addr'])
              return None
          def b_at(va,n):
              o=vaoff(va);return b'' if o is None else d[o:o+n]
          def rip7(va):
              x=b_at(va,7)
              if len(x)!=7:raise SystemExit(f'FAIL_SHORT_RIP@0x{va:x}')
              return va+7+struct.unpack_from('<i',x,3)[0]
          def rel32(va):
              x=b_at(va,5)
              if len(x)!=5 or x[0]!=0xe8:raise SystemExit(f'FAIL_NOT_CALL@0x{va:x}:{x.hex()}')
              return va+5+struct.unpack_from('<i',x,1)[0]
          # Exact tiny candidate window only.
          w=b_at(0x613450,0x70)
          print('FS_RESOLVER_INIT_TINY_SHA256='+hashlib.sha256(w).hexdigest())
          print('FS_RESOLVER_INIT_TINY_HEX='+w.hex())
          # These two instructions came from the exploratory candidate; now validate exact boundaries/opcodes/targets.
          g=b_at(0x613463,7);lit=b_at(0x61346a,7)
          print(f'FS_RESOLVER_INIT_GLOBAL_INSN={g.hex()} target=0x{rip7(0x613463):x}')
          print(f'FS_RESOLVER_INIT_LITERAL_INSN={lit.hex()} target=0x{rip7(0x61346a):x}')
          if g[:3] != bytes.fromhex('4c8d25') or rip7(0x613463)!=0x31964a0:raise SystemExit('FS_RESOLVER_FAIL=global_instruction')
          if lit[:3] != bytes.fromhex('488d35') or rip7(0x61346a)!=0x1d7b160:raise SystemExit('FS_RESOLVER_FAIL=BattlEye_literal_instruction')
          if b_at(0x613471,3)!=bytes.fromhex('4c89e7'):raise SystemExit('FS_RESOLVER_FAIL=global_to_rdi')
          print('FS_RESOLVER_PASS=adjacent_global_BattlEye_initializer_inputs')
          # Next call(s) from these exact sequential boundaries.
          if b_at(0x613474,1)==b'\xe8':
              print(f'FS_RESOLVER_INIT_CONSTRUCT_CALL=0x{rel32(0x613474):x} bytes={b_at(0x613474,5).hex()}')
          else:
              print(f'FS_RESOLVER_INIT_AFTER_ARGS_BYTES={b_at(0x613474,24).hex()}')
          # print exact direct calls in only this 0x70-byte window for subsequent mapping, no global census claim.
          print('FS_RESOLVER_INIT_TINY_CALLS_BEGIN')
          for i in range(len(w)-5):
              if w[i]==0xe8:
                  va=0x613450+i
                  try:dst=rel32(va)
                  except:continue
                  print(f'call=0x{va:x} target=0x{dst:x} bytes={b_at(va,5).hex()}')
          print('FS_RESOLVER_INIT_TINY_CALLS_END')
          print('FS_RESOLVER_EXECUTED_TARGET=false')
          print('FS_RESOLVER_LIVE_RUNTIME_OBSERVED=false')
          print('FS_RESOLVER_MUTATION_PERFORMED=false')
          PY

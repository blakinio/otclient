name: Track A filesystem-helper resolver static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-resolver-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-resolver-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Map static QString initializer helper
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Trace helper 0x6b2350 into Qt QString construction
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'FS_RESOLVER_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import pathlib,struct,sys,hashlib
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          sf=E+'IIQQQQIIQQ';raw=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
          st=raw[shstrndx];sn=d[st[4]:st[4]+st[5]]
          def cs(b,o):
              e=b.find(b'\0',o);e=len(b) if e<0 else e
              return b[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(raw):secs.append({'idx':i,'name':cs(sn,x[0]),'addr':x[3],'off':x[4],'size':x[5],'entsize':x[9],'link':x[6]})
          by={s['name']:s for s in secs};text=by['.text']
          def voff(va):
              for s in secs:
                  if s['name']!='.bss' and s['addr']<=va<s['addr']+s['size']:return s['off']+(va-s['addr'])
          def b_at(va,n):
              o=voff(va);return b'' if o is None else d[o:o+n]
          def rel32(va):
              x=b_at(va,5)
              if len(x)!=5 or x[0]!=0xe8:raise SystemExit(f'FAIL_NOT_CALL@0x{va:x}:{x.hex()}')
              return va+5+struct.unpack_from('<i',x,1)[0]
          # dynsym/GOT map for PLT target names.
          dyn=by['.dynsym'];ss=secs[dyn['link']];sb=d[ss['off']:ss['off']+ss['size']];syms=[]
          for o in range(dyn['off'],dyn['off']+dyn['size'],dyn['entsize'] or 24):
              no,info,other,si,val,sz=struct.unpack_from('<IBBHQQ',d,o);syms.append((cs(sb,no),val,sz,si,info))
          gotnames={}
          for rn in ('.rela.plt','.rela.dyn'):
              r=by.get(rn)
              if not r:continue
              for o in range(r['off'],r['off']+r['size'],r['entsize'] or 24):
                  ro,ri,ad=struct.unpack_from('<QQq',d,o);sym=ri>>32
                  if sym and sym<len(syms):gotnames[ro]=syms[sym][0]
          def plt_name(va):
              x=b_at(va,24)
              for p in range(min(10,max(0,len(x)-6))):
                  if x[p:p+2]==b'\xff\x25':
                      got=va+p+6+struct.unpack_from('<i',x,p+2)[0];return gotnames.get(got,''),got,x.hex()
              return '',None,x.hex()
          # Revalidate initializer arguments and target first.
          if b_at(0x613463,3)!=bytes.fromhex('4c8d25') or b_at(0x61346a,3)!=bytes.fromhex('488d35') or b_at(0x613471,3)!=bytes.fromhex('4c89e7'):
              raise SystemExit('FS_RESOLVER_FAIL=initializer_boundaries')
          if rel32(0x613474)!=0x6b2350:raise SystemExit('FS_RESOLVER_FAIL=initializer_helper_target')
          print('FS_RESOLVER_PASS=BattlEye_global_initializer_call_0x6b2350')
          start,end=0x6b2350,0x6b24c0;blob=b_at(start,end-start)
          print('FS_RESOLVER_HELPER_SHA256='+hashlib.sha256(blob).hexdigest())
          print('FS_RESOLVER_HELPER_HEX='+blob.hex())
          print('FS_RESOLVER_HELPER_CALLS_BEGIN')
          for i in range(len(blob)-5):
              if blob[i]!=0xe8:continue
              va=start+i
              try:dst=rel32(va)
              except:continue
              name,got,hx=plt_name(dst)
              print(f'call=0x{va:x} target=0x{dst:x} symbol={name} bytes={b_at(va,5).hex()}')
          print('FS_RESOLVER_HELPER_CALLS_END')
          # Also resolve 0x4da740 from static initializer sequence.
          name,got,hx=plt_name(0x4da740)
          print(f'FS_RESOLVER_ATEEXIT_LIKE target=0x4da740 symbol={name} got={"NONE" if got is None else hex(got)} bytes={hx}')
          print('FS_RESOLVER_EXECUTED_TARGET=false')
          print('FS_RESOLVER_LIVE_RUNTIME_OBSERVED=false')
          print('FS_RESOLVER_MUTATION_PERFORMED=false')
          PY

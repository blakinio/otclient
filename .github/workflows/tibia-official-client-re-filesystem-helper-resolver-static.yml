name: Track A filesystem-helper resolver static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-resolver-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-resolver-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Resolve category 9 path components exactly
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Decode category 9 jump tables and QString constants
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'FS_RESOLVER_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          sf=E+'IIQQQQIIQQ';raw=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
          st=raw[shstrndx];sn=d[st[4]:st[4]+st[5]]
          def cs(b,o):
              if not (0<=o<len(b)):return ''
              e=b.find(b'\0',o);e=len(b) if e<0 else e
              return b[o:e].decode('utf8','replace')
          secs=[{'name':cs(sn,x[0]),'addr':x[3],'off':x[4],'size':x[5]} for x in raw]
          text=next(s for s in secs if s['name']=='.text')
          def voff(va):
              for s in secs:
                  if s['size'] and s['addr']<=va<s['addr']+s['size']:return s['off']+(va-s['addr'])
              return None
          def b_at(va,n):
              o=voff(va);return b'' if o is None else d[o:o+n]
          def q(va):
              o=voff(va);return None if o is None or o+8>len(d) else struct.unpack_from('<Q',d,o)[0]
          def utf16_from_qstring_obj(obj):
              vals=[q(obj+i) for i in (0,8,16)]
              out=[]
              for ptr in vals:
                  if ptr is None:continue
                  o=voff(ptr)
                  if o is None:continue
                  raw=d[o:o+128]
                  chars=[]
                  for j in range(0,len(raw)-1,2):
                      c=raw[j]|(raw[j+1]<<8)
                      if c==0:break
                      if c<32 or c>126:break
                      chars.append(chr(c))
                  if chars:out.append(('ptr',hex(ptr),''.join(chars)))
              # Qt6 QArrayDataPointer often has data pointer at +8 and size at +16.
              p=q(obj+8);sz=q(obj+16)
              if p is not None and sz is not None and 0<sz<100 and voff(p) is not None:
                  try:
                      txt=d[voff(p):voff(p)+2*sz].decode('utf-16le')
                      out.append(('qarray',hex(p),txt))
                  except:pass
              return vals,out
          def table_target(table,index):
              off=struct.unpack('<i',b_at(table+index*4,4))[0]
              return table+off
          for label,table in [('slot10',0x1d689f8),('slot18',0x1d68a4c)]:
              targets=[table_target(table,i) for i in range(16)]
              print(f'FS_RESOLVER_{label.upper()}_TABLE='+','.join(f'{i}:0x{t:x}' for i,t in enumerate(targets)))
              t=targets[9]
              code=b_at(t,96)
              print(f'FS_RESOLVER_{label.upper()}_CATEGORY9_TARGET=0x{t:x}')
              print(f'FS_RESOLVER_{label.upper()}_CATEGORY9_BYTES={code.hex()}')
              # Collect RIP-relative memory/lea targets from first 64 bytes of case.
              print(f'FS_RESOLVER_{label.upper()}_CATEGORY9_RIP_BEGIN')
              seen=[]
              for i in range(min(64,len(code)-7)):
                  if code[i] not in range(0x48,0x50) and not (code[i]==0x66):continue
                  # common 48/4x 8b/8d disp32 forms
                  if code[i] in range(0x48,0x50) and code[i+1] in (0x8b,0x8d):
                      m=code[i+2]
                      if (m>>6)==0 and (m&7)==5:
                          va=t+i;dst=va+7+struct.unpack_from('<i',code,i+3)[0];seen.append(dst);print(f'va=0x{va:x} target=0x{dst:x}')
                  # 66 0f 6f /r RIP-relative movdqa
                  if code[i:i+3]==b'\x66\x0f\x6f':
                      m=code[i+3]
                      if (m>>6)==0 and (m&7)==5:
                          va=t+i;dst=va+8+struct.unpack_from('<i',code,i+4)[0];seen.append(dst);print(f'va=0x{va:x} target=0x{dst:x}')
              print(f'FS_RESOLVER_{label.upper()}_CATEGORY9_RIP_END')
              for obj in sorted(set(seen)):
                  vals,decoded=utf16_from_qstring_obj(obj)
                  if decoded:
                      print(f'FS_RESOLVER_QSTRING_CANDIDATE owner={label} category=9 obj=0x{obj:x} qwords='+','.join('NONE' if v is None else hex(v) for v in vals)+' decoded='+repr(decoded))
          # Exact UTF-16 occurrences for candidate path labels.
          for textval in ('BattlEye','bin','BEClient'):
              needle=textval.encode('utf-16le');poss=[];p=0
              while True:
                  j=d.find(needle,p)
                  if j<0:break
                  va=None
                  for s in secs:
                      if s['off']<=j<s['off']+s['size']:va=s['addr']+(j-s['off']);break
                  if va is not None:poss.append(va)
                  p=j+1
              print(f'FS_RESOLVER_UTF16 literal={textval} vas='+','.join(hex(v) for v in poss[:40]))
          print('FS_RESOLVER_EXECUTED_TARGET=false')
          print('FS_RESOLVER_LIVE_RUNTIME_OBSERVED=false')
          print('FS_RESOLVER_MUTATION_PERFORMED=false')
          PY

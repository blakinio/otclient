name: Track A filesystem-helper resolver static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-filesystem-helper-resolver-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-filesystem-helper-resolver-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Trace BattlEye category string initializer
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Correlate BattlEye literal with category 9 global QString
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'FS_RESOLVER_CLIENT_FENCE=PASS'
          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes();E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          sf=E+'IIQQQQIIQQ';raw=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
          st=raw[shstrndx];sn=d[st[4]:st[4]+st[5]]
          def cs(b,o):
              if not (0<=o<len(b)):return ''
              e=b.find(b'\0',o);e=len(b) if e<0 else e
              return b[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(raw):secs.append({'idx':i,'name':cs(sn,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
          by={s['name']:s for s in secs};text=by['.text'];tb=d[text['off']:text['off']+text['size']]
          def fileoff_to_va(o):
              for s in secs:
                  if s['type']!=8 and s['off']<=o<s['off']+s['size']:return s['addr']+(o-s['off'])
              return None
          def va_to_off(va):
              for s in secs:
                  if s['type']!=8 and s['addr']<=va<s['addr']+s['size']:return s['off']+(va-s['addr'])
              return None
          def b_at(va,n):
              o=va_to_off(va);return b'' if o is None else d[o:o+n]
          # Exact literal VA from file, not assumed equal to offset.
          needle=b'BattlEye\0';poss=[];p=0
          while True:
              j=d.find(needle,p)
              if j<0:break
              va=fileoff_to_va(j)
              if va is not None:poss.append((j,va))
              p=j+1
          print('FS_RESOLVER_BATTLEYE_LITERALS='+','.join(f'file=0x{o:x}/va=0x{v:x}' for o,v in poss))
          battleyes=[v for _,v in poss]
          global_obj=0x31964a0
          print(f'FS_RESOLVER_CATEGORY9_GLOBAL=0x{global_obj:x}')
          # Search common instruction-boundary-looking RIP references to literal and global.
          wanted=set(battleyes+[global_obj,global_obj+8,global_obj+16])
          refs=[]
          for i in range(len(tb)-8):
              va=text['addr']+i
              # REX + MOV/LEA rip+disp32
              if tb[i] in range(0x40,0x50) and tb[i+1] in (0x8b,0x8d,0x89):
                  m=tb[i+2]
                  if (m>>6)==0 and (m&7)==5:
                      dst=va+7+struct.unpack_from('<i',tb,i+3)[0]
                      if dst in wanted:refs.append((va,dst,f'rex_{tb[i+1]:02x}'))
              # MOVDQA xmm,[rip+disp32]
              if tb[i:i+3]==b'\x66\x0f\x6f':
                  m=tb[i+3]
                  if (m>>6)==0 and (m&7)==5:
                      dst=va+8+struct.unpack_from('<i',tb,i+4)[0]
                      if dst in wanted:refs.append((va,dst,'movdqa'))
              # non-REX MOV r32/m32 or MOV m32/r32 rip-relative
              if tb[i] in (0x8b,0x89):
                  m=tb[i+1]
                  if (m>>6)==0 and (m&7)==5:
                      dst=va+6+struct.unpack_from('<i',tb,i+2)[0]
                      if dst in wanted:refs.append((va,dst,f'op_{tb[i]:02x}'))
          # Deduplicate and print bounded windows.
          uniq=[];seen=set()
          for r in refs:
              if r not in seen:seen.add(r);uniq.append(r)
          print('FS_RESOLVER_BATTLEYE_GLOBAL_REFS='+','.join(f'0x{a:x}->0x{b:x}:{k}' for a,b,k in uniq))
          for a,b,k in uniq:
              lo=max(text['addr'],a-0xb0);hi=min(text['addr']+text['size'],a+0x120)
              w=d[text['off']+(lo-text['addr']):text['off']+(hi-text['addr'])]
              print(f'FS_RESOLVER_REF_WINDOW ref=0x{a:x} target=0x{b:x} kind={k} start=0x{lo:x} sha256={hashlib.sha256(w).hexdigest()} hex={w.hex()}')
          # Revalidate category9 slot10 really reads that global and slot18 really calls applicationDirPath PLT.
          x=b_at(0xc8f8e0,24)
          print('FS_RESOLVER_SLOT10_CASE9_HEAD='+x.hex())
          if not x.startswith(bytes.fromhex('660f6f0d')):raise SystemExit('FS_RESOLVER_FAIL=slot10_case9_head')
          dst=0xc8f8e8+struct.unpack_from('<i',x,4)[0]
          if dst!=global_obj:raise SystemExit(f'FS_RESOLVER_FAIL=slot10_case9_global:{hex(dst)}')
          call=b_at(0xc91230,5)
          dst2=0xc91235+struct.unpack_from('<i',call,1)[0]
          if dst2!=0x4e0050:raise SystemExit(f'FS_RESOLVER_FAIL=slot18_case9_call:{hex(dst2)}')
          print('FS_RESOLVER_PASS=category9_global_and_applicationDirPath_call')
          print('FS_RESOLVER_EXECUTED_TARGET=false')
          print('FS_RESOLVER_LIVE_RUNTIME_OBSERVED=false')
          print('FS_RESOLVER_MUTATION_PERFORMED=false')
          PY

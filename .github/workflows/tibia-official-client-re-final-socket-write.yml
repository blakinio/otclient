name: Track A final socket write resolution

on:
  push:
    branches:
      - ci/OTC-20260814-track-a-chatgpt-framing-recovery
    paths:
      - .github/workflows/tibia-official-client-re-final-socket-write.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 20
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Resolve writer and TCP connection vtables
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then
            state="$LEGACY_IMAGE_STATE"
          else
            state="$CANONICAL_STATE"
          fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          gdb="$toolroot/usr/bin/gdb"
          tool_lib="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          [[ -x "$client" && -x "$gdb" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]

          report="$RUNNER_TEMP/track-a-final-socket-write.txt"
          targets="$RUNNER_TEMP/track-a-final-socket-vtable-targets.txt"
          : >"$report"
          : >"$targets"
          exec > >(tee "$report") 2>&1

          echo 'TRACK_A_FINAL_SOCKET_WRITE_BEGIN=true'
          echo 'KNOWN_QIODEVICE_WRITE_PLT=0x4de370'
          echo 'KNOWN_DIRECT_WRITE_CALLSITE=0xb46c75'
          echo 'KNOWN_TCP_RTTI=0x3080630'
          echo 'KNOWN_IODEVICE_WRITER_RTTI=0x3080718'

          python3 -u - "$client" "$targets" <<'PY'
          import struct
          import sys

          path, target_file = sys.argv[1:]
          data = open(path, 'rb').read()

          phoff = struct.unpack_from('<Q', data, 0x20)[0]
          phes = struct.unpack_from('<H', data, 0x36)[0]
          phn = struct.unpack_from('<H', data, 0x38)[0]
          seg = []
          for i in range(phn):
              o = phoff + i * phes
              typ, fl, fo, va, _, fs, ms, _ = struct.unpack_from('<IIQQQQQQ', data, o)
              if typ == 1 and fs:
                  seg.append((fo, fo + fs, va, va + ms, fl))

          def off(va):
              for fs, fe, base, end, flags in seg:
                  if base <= va < base + (fe - fs):
                      return fs + va - base
              return None

          def flags(va):
              for fs, fe, base, end, fl in seg:
                  if base <= va < end:
                      return fl
              return 0

          def rawq(va):
              p = off(va)
              if p is None or p + 8 > len(data):
                  return 0
              return struct.unpack_from('<Q', data, p)[0]

          def cstr(va, lim=512):
              p = off(va)
              if p is None:
                  return None
              z = data.find(b'\0', p, min(len(data), p + lim))
              if z < 0:
                  return None
              return data[p:z].decode('utf-8', 'replace')

          shoff = struct.unpack_from('<Q', data, 0x28)[0]
          shes = struct.unpack_from('<H', data, 0x3a)[0]
          shn = struct.unpack_from('<H', data, 0x3c)[0]
          sections = [struct.unpack_from('<IIQQQQIIQQ', data, shoff + i * shes) for i in range(shn)]
          symtabs = {}
          for i, s in enumerate(sections):
              _, typ, _, _, so, ss, link, _, _, es = s
              if typ not in (2, 11) or not es:
                  continue
              st = sections[link]
              strings = data[st[4]:st[4] + st[5]]
              arr = []
              for p in range(so, so + ss, es):
                  sn, si, other, shndx, sv, sz = struct.unpack_from('<IBBHQQ', data, p)
                  z = strings.find(b'\0', sn)
                  nm = strings[sn:z].decode('utf-8', 'replace') if z >= 0 else ''
                  arr.append((nm, sv))
              symtabs[i] = arr

          rel = {}
          for i, s in enumerate(sections):
              _, typ, _, _, so, ss, link, _, _, es = s
              if typ != 4 or not es:
                  continue
              arr = symtabs.get(link, [])
              for p in range(so, so + ss, es):
                  ro, ri, ra = struct.unpack_from('<QQq', data, p)
                  idx = ri >> 32
                  rt = ri & 0xffffffff
                  nm, sv = arr[idx] if idx < len(arr) else ('', 0)
                  rel.setdefault(ro, []).append((rt, nm, sv, ra))

          def resolve(va):
              value = rawq(va)
              for rt, nm, sv, ra in rel.get(va, []):
                  if rt == 8:
                      value = ra & 0xffffffffffffffff
                  elif sv:
                      value = (sv + ra) & 0xffffffffffffffff
              return value

          def rname(rt):
              if not rt or not flags(rt) or flags(rt) & 1:
                  return None
              return cstr(resolve(rt + 8))

          wanted_rtti = {
              'TGameserverTCPConnection': 0x3080630,
              'TIODeviceWriter': 0x3080718,
          }
          found = []
          for cls, target_rtti in wanted_rtti.items():
              for fs, fe, base, end, fl in seg:
                  if fl & 1:
                      continue
                  start = (base + 0x10 + 7) & ~7
                  stop = base + (fe - fs) - 0x130
                  for ap in range(start, stop, 8):
                      if resolve(ap - 8) != target_rtti:
                          continue
                      ot = struct.unpack('<q', struct.pack('<Q', rawq(ap - 16)))[0]
                      if abs(ot) > 0x100000:
                          continue
                      found.append((cls, ap, ot, target_rtti))

          print(f'VTABLE_MATCH_COUNT={len(found)}')
          executable_targets = set()
          with open(target_file, 'w') as handle:
              for cls, ap, ot, rt in found:
                  print(f'CLASS_VTABLE class={cls} address_point=0x{ap:x} offset_to_top={ot} rtti=0x{rt:x} rtti_name={rname(rt) or "unknown"}')
                  refs = []
                  for fs, fe, base, end, fl in seg:
                      if not (fl & 1):
                          continue
                      blob = data[fs:fe]
                      for p in range(0, max(0, len(blob) - 7)):
                          if not (0x40 <= blob[p] <= 0x4f and blob[p + 1] == 0x8d and (blob[p + 2] & 0xc7) == 0x05):
                              continue
                          site = base + p
                          dest = site + 7 + struct.unpack_from('<i', blob, p + 3)[0]
                          if dest == ap:
                              refs.append(site)
                  print(f'CLASS_VTABLE_LEA_REFS class={cls} count={len(refs)} sites={",".join(hex(x) for x in refs[:128]) if refs else "none"}')
                  for ofs in range(0, 0x128, 8):
                      addr = ap + ofs
                      val = resolve(addr)
                      rels = ';'.join(f't={r},sym={n or "-"},sv=0x{sv:x},a={a}' for r, n, sv, a in rel.get(addr, [])) or 'none'
                      exe = bool(val and (flags(val) & 1))
                      print(f'CLASS_VTABLE_SLOT class={cls} offset=0x{ofs:x} target=0x{val:x} executable={str(exe).lower()} reloc={rels}')
                      if exe:
                          executable_targets.add(val)
                  for site in refs[:128]:
                      handle.write(f'LEA {cls} 0x{site:x}\n')

          # Direct rel32 callers into the known QIODevice::write PLT.
          write_plt = 0x4de370
          callsites = []
          for fs, fe, base, end, fl in seg:
              if not (fl & 1):
                  continue
              blob = data[fs:fe]
              for p in range(0, max(0, len(blob) - 5)):
                  if blob[p] != 0xe8:
                      continue
                  site = base + p
                  dest = site + 5 + struct.unpack_from('<i', blob, p + 1)[0]
                  if dest == write_plt:
                      callsites.append(site)
          print(f'QIODEVICE_WRITE_DIRECT_CALL_COUNT={len(callsites)}')
          print(f'QIODEVICE_WRITE_DIRECT_CALLS={",".join(hex(x) for x in callsites)}')
          print('TRACK_A_FINAL_SOCKET_STATIC_COMPLETE=true')
          PY

          for range in \
            '0xb46b80,0xb46cd0' \
            '0xb46800,0xb46b80' \
            '0xb56970,0xb56d60' \
            '0xb56d60,0xb57180'; do
            echo "DISASSEMBLY_BEGIN=$range"
            env LD_LIBRARY_PATH="$tool_lib" "$gdb" -q -nx -batch "$client" \
              -ex 'set pagination off' \
              -ex 'set disassembly-flavor intel' \
              -ex "disassemble /r $range"
            echo "DISASSEMBLY_END=$range"
          done

          echo 'TRACK_A_FINAL_SOCKET_WRITE_COMPLETE=true'
          grep -q '^TRACK_A_FINAL_SOCKET_WRITE_COMPLETE=true$' "$report"

      - name: Upload exact-version final socket report
        uses: actions/upload-artifact@v4
        with:
          name: track-a-final-socket-write-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-final-socket-write.txt
          if-no-files-found: error
          retention-days: 7

name: Track A native game-login credential proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-native-game-login-credential-proof]
    paths: [.github/workflows/tibia-official-client-re-game-login-credential-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protobuf-rtti:
    name: Exact-client login protobuf RTTI and vtable map
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact official client and recover target protobuf vtables
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools

          r=/tmp/game-login-proof-warp
          mkdir -p "$r/bin" "$r/state" /tmp/game-login-proof
          cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wireproxy.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tgz' | sha256sum -c -
          mkdir wireproxy-x
          tar -xzf wireproxy.tgz -C wireproxy-x
          cp "$(find wireproxy-x -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy

          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >/tmp/game-login-proof-wireproxy.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/game-login-proof-warp-trace 2>/dev/null && break
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' /tmp/game-login-proof-warp-trace

          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' \
            "$u" -o /tmp/game-login-proof/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/game-login-proof/client.lzma' | sha256sum -c -

          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection

          packed=pathlib.Path('/tmp/game-login-proof/client.lzma').read_bytes()
          q=packed[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(packed[33:37],'little')
          flt={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[flt])
          assert len(raw)==51965216
          assert hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          client=pathlib.Path('/tmp/game-login-proof/client'); client.write_bytes(raw)
          print('GAMELOGIN_RTTI_EXACT_PACKED_SHA=PASS')
          print('GAMELOGIN_RTTI_EXACT_CLIENT_SHA=PASS')
          print('GAMELOGIN_RUNTIME_ACCESS=none')
          print('GAMELOGIN_LOGIN_PERFORMED=false')
          print('GAMELOGIN_SECRET_ACCESS=false')
          print('GAMELOGIN_PROCESS_X11_OBSERVATION=false')
          print('GAMELOGIN_RAW_CLIENT_UPLOADED=false')

          with client.open('rb') as fh:
            elf=ELFFile(fh)
            secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
            rels=[]
            for sec in elf.iter_sections():
              if not isinstance(sec,RelocationSection): continue
              symtab=elf.get_section(sec['sh_link']) if sec['sh_link'] else None
              for rel in sec.iter_relocations():
                off=int(rel['r_offset']); add=int(rel['r_addend']) if rel.is_RELA() else None
                sym=''
                if int(rel['r_info_sym']) and symtab is not None:
                  try: sym=symtab.get_symbol(int(rel['r_info_sym'])).name
                  except Exception: pass
                rels.append((off,add,sym))

          def offva(off):
            for n,o,z,v,fl in secs:
              if o<=off<o+z: return v+(off-o)
            return None
          def vaoff(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z: return o+(va-v)
            raise ValueError(hex(va))
          def mapped(va): return any(v<=va<v+z for _,_,z,v,_ in secs)
          def executable(va): return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          def qword(va): return struct.unpack_from('<Q',raw,vaoff(va))[0]
          rel_by_offset={off:(add,sym) for off,add,sym in rels}
          by_add={}
          for off,add,sym in rels:
            if add is not None: by_add.setdefault(add,[]).append((off,sym))
          def ptr(va):
            row=rel_by_offset.get(va)
            if row and row[0] is not None: return row[0]
            try: return qword(va)
            except Exception: return 0
          def mangled_name(cls):
            return ('N'+''.join(str(len(x))+x for x in cls.split('::'))+'E').encode()+b'\0'
          def recover(cls):
            namevas=[]; start=0; needle=mangled_name(cls)
            while True:
              p=raw.find(needle,start)
              if p<0: break
              va=offva(p); start=p+1
              if va is not None: namevas.append(va)
            tis=[]
            for nv in namevas:
              for target,sym in by_add.get(nv,[]):
                ti=target-8
                if mapped(ti): tis.append(ti)
            out=[]
            for ti in sorted(set(tis)):
              for target,sym in by_add.get(ti,[]):
                header=target-8
                try:
                  if qword(header)!=0: continue
                except Exception: continue
                vp=header+16
                fns=[ptr(vp+i*8) for i in range(32)]
                if fns and executable(fns[0]): out.append((ti,vp,fns))
            uniq=[]; seen=set()
            for row in out:
              if row[1] not in seen:
                seen.add(row[1]); uniq.append(row)
            return sorted(set(namevas)),uniq

          targets=[
            'tibia::protobuf::protocol::GameclientMessageLogin',
            'tibia::protobuf::protocol::LoginRSAEncryptedBlock',
            'tibia::protobuf::protocol::GameclientMessageSecondaryLogin',
            'tibia::protobuf::protocol::SecondaryLoginRSAEncryptedBlock',
            'tibia::protobuf::protocol::GameclientMessageEnterWorld',
            'tibia::protobuf::protocol::GameclientMessagePing',
          ]
          print('GAMELOGIN_RTTI_VTABLE_BEGIN')
          found={}
          for cls in targets:
            names,vps=recover(cls); found[cls]=vps
            print('CLASS='+cls)
            print('  NAME_VAS='+','.join(hex(x) for x in names))
            for ti,vp,fns in vps:
              print(f'  TYPEINFO=0x{ti:x} VPTR=0x{vp:x}')
              print('  VTABLE='+','.join(f'+0x{i*8:x}:0x{fn:x}:{"X" if executable(fn) else "N"}' for i,fn in enumerate(fns)))
          print('GAMELOGIN_RTTI_VTABLE_END')
          required=targets[:4]
          missing=[x for x in required if not found[x]]
          if missing: raise SystemExit('missing RTTI/vtable: '+','.join(missing))
          print('GAMELOGIN_RTTI_PROBE=PASS')
          PY

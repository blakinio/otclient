name: Track A native game-login credential proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-native-game-login-credential-proof]
    paths: [.github/workflows/tibia-official-client-re-game-login-credential-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-value-flow:
    name: Exact-client login producer value flow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recover bounded producer and source-object provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools binutils
          r=/tmp/gp; mkdir -p "$r/bin" "$r/state" /tmp/gpc; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/gpc/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/gpc/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct,re,subprocess
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP,X86_REG_R13,X86_REG_RSI,X86_REG_RSP

          packed=pathlib.Path('/tmp/gpc/client.lzma').read_bytes(); q=packed[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(packed[33:37],'little')
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          client=pathlib.Path('/tmp/gpc/client'); client.write_bytes(raw)
          print('GAMELOGIN_VALUEFLOW_EXACT_PACKED_SHA=PASS');print('GAMELOGIN_VALUEFLOW_EXACT_CLIENT_SHA=PASS')
          print('GAMELOGIN_RUNTIME_ACCESS=none');print('GAMELOGIN_LOGIN_PERFORMED=false');print('GAMELOGIN_SECRET_ACCESS=false');print('GAMELOGIN_PROCESS_X11_OBSERVATION=false');print('GAMELOGIN_RAW_CLIENT_UPLOADED=false')

          with client.open('rb') as fh:
            elf=ELFFile(fh); secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def vo(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError(hex(va))
          def mapped(va,n=1):
            try:o=vo(va);return o+n<=len(raw)
            except:return False
          def qword(va): return struct.unpack_from('<Q',raw,vo(va))[0]
          def sqword(va): return struct.unpack_from('<q',raw,vo(va))[0]
          def cstr(va,limit=256):
            if not mapped(va): return ''
            o=vo(va); e=raw.find(b'\0',o,min(len(raw),o+limit));
            if e<0:e=min(len(raw),o+limit)
            b=raw[o:e]
            if not b or any(c<32 or c>=127 for c in b):return ''
            return b.decode('ascii','replace')
          def demangle(n):
            if not n:return ''
            try:return subprocess.check_output(['c++filt','-t',n],text=True).strip()
            except:return n
          def typeinfo_name(ti):
            if not mapped(ti+8,8):return ''
            np=qword(ti+8); s=cstr(np)
            return demangle(s)

          # Direct getter implementations compared by the producer before fixed-offset fast paths.
          expected={0x50:0x7acca0,0x60:0xe0e300,0x70:0xe0e390,0x80:0xa6ac20,0x98:0xe08fd0,0xa0:0xe0e830}
          print('GAMELOGIN_SOURCE_VTABLE_CANDIDATES_BEGIN')
          cand=[]
          for n,o,z,v,fl in secs:
            if n not in ('.rodata','.data.rel.ro','.data','.data.rel.ro.local'): continue
            start=(v+7)&~7; end=v+z-0xa8
            for base in range(start,end,8):
              score=0; vals={}
              try:
                for off,t in expected.items():
                  val=qword(base+off);vals[off]=val
                  if val==t:score+=1
              except:continue
              if score<3:continue
              ti=qword(base-8) if mapped(base-8,8) else 0; ot=sqword(base-16) if mapped(base-16,8) else 0; name=typeinfo_name(ti)
              cand.append((score,base,ti,ot,name,vals))
          cand.sort(reverse=True)
          for score,base,ti,ot,name,vals in cand[:32]:
            print(f'BASE=0x{base:x} SCORE={score} OFFSET_TO_TOP={ot} TYPEINFO=0x{ti:x} TYPE={name}')
            print('  '+' '.join(f'SLOT+0x{k:x}=0x{v:x}' for k,v in sorted(vals.items())))
          print('GAMELOGIN_SOURCE_VTABLE_CANDIDATES_END')

          # Does the producer itself occur in a virtual table? Recover plausible owner RTTI around each exact pointer occurrence.
          producer=0xe1abe0; needle=struct.pack('<Q',producer)
          print('GAMELOGIN_PRODUCER_VTABLE_REFS_BEGIN')
          pos=0
          refs=[]
          while True:
            pos=raw.find(needle,pos)
            if pos<0:break
            va=None
            for n,o,z,v,fl in secs:
              if o<=pos<o+z:va=v+(pos-o);break
            if va is not None:
              refs.append(va); print(f'FUNCTION_PTR_REF=0x{va:x}')
              for slot in range(0,0x208,8):
                base=va-slot
                if not mapped(base-16,16):continue
                try:
                  ot=sqword(base-16);ti=qword(base-8);name=typeinfo_name(ti)
                except:continue
                if abs(ot)<=0x100000 and name:
                  print(f'  VTABLE_BASE=0x{base:x} SLOT=0x{slot:x} OFFSET_TO_TOP={ot} TYPEINFO=0x{ti:x} TYPE={name}')
            pos+=8
          print('GAMELOGIN_PRODUCER_VTABLE_REFS_END')

          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          start=0xe1abe0; stop=0xe1bb20; ins=list(md.disasm(raw[vo(start):vo(stop)],start))
          known_vptrs={0x30c84a0:'LOGIN_VPTR',0x30c8428:'RSA_VPTR',0x30c6628:'SECONDARY_VPTR',0x30c65b0:'SECRSA_VPTR'}
          interesting=set()
          for i,x in enumerate(ins):
            hit=False
            if x.mnemonic in ('call','jmp') and x.operands and x.operands[0].type==X86_OP_IMM: hit=True
            for op in x.operands:
              if op.type==X86_OP_MEM:
                m=op.mem
                if m.base==X86_REG_R13 and 0x8<=m.disp<=0x48: hit=True
                if m.base==X86_REG_RSI and 0x80<=m.disp<=0x180: hit=True
                if m.base==X86_REG_RSP and 0xc0<=m.disp<=0xf8: hit=True
                if m.base==X86_REG_RIP:
                  d=x.address+x.size+m.disp
                  if d in known_vptrs: hit=True
            if hit:
              for j in range(max(0,i-2),min(len(ins),i+3)):interesting.add(j)
          print('GAMELOGIN_PRIMARY_SECONDARY_PRODUCER_FLOW_BEGIN')
          for i in sorted(interesting):
            x=ins[i]; annotation=''
            for op in x.operands:
              if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                d=x.address+x.size+op.mem.disp
                if d in known_vptrs:annotation=f' ; {known_vptrs[d]}=0x{d:x}'
            print(f'0x{x.address:x}: {x.mnemonic} {x.op_str}{annotation}')
          print('GAMELOGIN_PRIMARY_SECONDARY_PRODUCER_FLOW_END')

          # Bounded static names around the native login-message metadata clusters; context only, never semantic proof alone.
          print('GAMELOGIN_BOUNDED_METADATA_STRINGS_BEGIN')
          for a,b in ((0x1d560f0,0x1d56420),(0x1d572f0,0x1d57530)):
            o1,o2=vo(a),vo(b)
            for m in re.finditer(rb'[ -~]{4,}',raw[o1:o2]):
              s=m.group().decode('ascii','replace')
              print(f'VA=0x{a+m.start():x} TEXT={s}')
          print('GAMELOGIN_BOUNDED_METADATA_STRINGS_END')

          assert refs or cand
          print('GAMELOGIN_PRODUCER_VALUEFLOW_PROBE=PASS')
          PY

name: Track A native game-login credential proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-native-game-login-credential-proof]
    paths: [.github/workflows/tibia-official-client-re-game-login-credential-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descriptor-proof:
    name: Exact-client protobuf descriptor proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recover exact native login protobuf descriptors
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools python3-protobuf
          r=/tmp/gp; mkdir -p "$r/bin" "$r/state" /tmp/gpc; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/gpc/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/gpc/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct
          from elftools.elf.elffile import ELFFile
          from google.protobuf import descriptor_pb2

          packed=pathlib.Path('/tmp/gpc/client.lzma').read_bytes()
          q=packed[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(packed[33:37],'little')
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216
          assert hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          client=pathlib.Path('/tmp/gpc/client'); client.write_bytes(raw)
          print('GAMELOGIN_DESCRIPTOR_EXACT_PACKED_SHA=PASS')
          print('GAMELOGIN_DESCRIPTOR_EXACT_CLIENT_SHA=PASS')
          print('GAMELOGIN_RUNTIME_ACCESS=none')
          print('GAMELOGIN_LOGIN_PERFORMED=false')
          print('GAMELOGIN_SECRET_ACCESS=false')
          print('GAMELOGIN_PROCESS_X11_OBSERVATION=false')
          print('GAMELOGIN_RAW_CLIENT_UPLOADED=false')

          with client.open('rb') as fh:
              elf=ELFFile(fh)
              sections=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr'])) for s in elf.iter_sections()]
              for symsec_name in ('.symtab','.dynsym'):
                  sec=elf.get_section_by_name(symsec_name)
                  hits=[]
                  if sec:
                      for sym in sec.iter_symbols():
                          n=sym.name
                          if any(t in n for t in ('GameclientMessageLogin','LoginRSAEncryptedBlock','descriptor_table_protodef','descriptor_table_')):
                              hits.append((n,int(sym['st_value']),int(sym['st_size'])))
                  print(f'ELF_SYMBOL_SECTION={symsec_name} HIT_COUNT={len(hits)}')
                  for n,a,zs in hits[:100]: print(f'ELF_SYMBOL={n} VA=0x{a:x} SIZE={zs}')

          def off_to_va(off):
              for n,o,zs,va in sections:
                  if o<=off<o+zs: return n,va+(off-o)
              return 'NONE',off

          targets=[b'GameclientMessageLogin',b'LoginRSAEncryptedBlock',b'GameclientMessageSecondaryLogin',b'SecondaryLoginRSAEncryptedBlock']
          occurrences={}
          for t in targets:
              arr=[]; p=0
              while True:
                  p=raw.find(t,p)
                  if p<0: break
                  sec,va=off_to_va(p); arr.append((p,sec,va)); p+=1
              occurrences[t.decode()]=arr
              print(f'DESCRIPTOR_ASCII_TARGET={t.decode()} OCCURRENCES={len(arr)}')
              for off,sec,va in arr[:32]: print(f'  OFF=0x{off:x} SEC={sec} VA=0x{va:x}')

          def read_varint(buf,p,limit):
              v=0; shift=0
              for _ in range(10):
                  if p>=limit: raise ValueError('eof')
                  b=buf[p]; p+=1; v|=(b&0x7f)<<shift
                  if not (b&0x80): return v,p
                  shift+=7
              raise ValueError('varint')

          # Parse only known FileDescriptorProto top-level fields and stop at the first non-descriptor tag.
          valid_wire={1:2,2:2,3:2,4:2,5:2,6:2,7:2,8:2,9:2,10:0,11:0,12:2,14:0}
          def descriptor_end(start,max_end):
              p=start; fields=0
              while p<max_end:
                  tag,p2=read_varint(raw,p,max_end)
                  if tag==0: break
                  fn=tag>>3; wt=tag&7
                  if fn not in valid_wire or valid_wire[fn]!=wt: break
                  p=p2
                  if wt==0:
                      _,p=read_varint(raw,p,max_end)
                  elif wt==2:
                      ln,p=read_varint(raw,p,max_end)
                      if ln<0 or p+ln>max_end: break
                      p+=ln
                  else:
                      break
                  fields+=1
              return p,fields

          # Candidate starts must begin with FileDescriptorProto.name: tag 1, printable *.proto.
          candidate_starts=set()
          target_offsets=[o for arr in occurrences.values() for o,_,_ in arr]
          for o in target_offsets:
              lo=max(0,o-131072)
              s=lo
              while s<o:
                  s=raw.find(b'\x0a',s,o)
                  if s<0: break
                  try:
                      ln,p=read_varint(raw,s+1,min(len(raw),s+512))
                      if 1<=ln<=240 and p+ln<=len(raw):
                          name=raw[p:p+ln]
                          if name.endswith(b'.proto') and all(32<=c<127 for c in name):
                              candidate_starts.add(s)
                  except Exception:
                      pass
                  s+=1

          print(f'DESCRIPTOR_CANDIDATE_STARTS={len(candidate_starts)}')
          recovered=[]
          wanted_names={x.decode() for x in targets}
          for s in sorted(candidate_starts):
              try:
                  e,nf=descriptor_end(s,min(len(raw),s+2_000_000))
                  if nf<2 or e<=s: continue
                  msg=descriptor_pb2.FileDescriptorProto()
                  msg.ParseFromString(raw[s:e])
                  if not msg.name.endswith('.proto'): continue
                  names=set()
                  def collect(ms,prefix=''):
                      for m in ms:
                          qn=(prefix+'.'+m.name).strip('.')
                          names.add(m.name); names.add(qn)
                          collect(m.nested_type,qn)
                  collect(msg.message_type)
                  if not any(w in names for w in wanted_names): continue
                  recovered.append((s,e,msg))
              except Exception:
                  continue

          # Deduplicate identical descriptor names/content ranges.
          uniq=[]; seen=set()
          for s,e,msg in recovered:
              key=(msg.name,msg.package,tuple(m.name for m in msg.message_type))
              if key in seen: continue
              seen.add(key); uniq.append((s,e,msg))
          print(f'DESCRIPTOR_RECOVERED_COUNT={len(uniq)}')

          typenames={v:k for k,v in descriptor_pb2.FieldDescriptorProto.Type.items()}
          labels={v:k for k,v in descriptor_pb2.FieldDescriptorProto.Label.items()}
          for s,e,msg in uniq:
              sec,va=off_to_va(s)
              print(f'FILE_DESCRIPTOR_BEGIN NAME={msg.name} PACKAGE={msg.package} START_OFF=0x{s:x} START_VA=0x{va:x} SIZE={e-s} SEC={sec} SYNTAX={msg.syntax}')
              def emit(ms,prefix=''):
                  for m in ms:
                      qn=(prefix+'.'+m.name).strip('.')
                      if m.name in wanted_names or any(x in m.name for x in ('Login','RSA')):
                          print(f'MESSAGE={qn}')
                          for f in sorted(m.field,key=lambda x:x.number):
                              tn=typenames.get(f.type,str(f.type)); lb=labels.get(f.label,str(f.label))
                              print(f'  FIELD={f.number} NAME={f.name} TYPE={tn} LABEL={lb} TYPE_NAME={f.type_name} JSON_NAME={f.json_name}')
                      emit(m.nested_type,qn)
              emit(msg.message_type)
              print('FILE_DESCRIPTOR_END')

          # Require exact descriptors for both primary login messages before promoting this probe.
          found=set()
          for _,_,msg in uniq:
              def walk(ms):
                  for m in ms:
                      found.add(m.name); walk(m.nested_type)
              walk(msg.message_type)
          assert 'GameclientMessageLogin' in found
          assert 'LoginRSAEncryptedBlock' in found
          print('GAMELOGIN_DESCRIPTOR_PROBE=PASS')
          PY

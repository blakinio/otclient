name: Track A native game-login credential proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-native-game-login-credential-proof]
    paths: [.github/workflows/tibia-official-client-re-game-login-credential-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-field-writers:
    name: Exact-client retained auth-field writers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Trace exact writer/caller xrefs for retained game-login state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools binutils
          r=/tmp/gp; mkdir -p "$r/bin" "$r/state" /tmp/gpc; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/gpc/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/gpc/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct,re
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP
          packed=pathlib.Path('/tmp/gpc/client.lzma').read_bytes();q=packed[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(packed[33:37],'little')
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          client=pathlib.Path('/tmp/gpc/client');client.write_bytes(raw)
          print('AUTHWRITER_EXACT_PACKED_SHA=PASS');print('AUTHWRITER_EXACT_CLIENT_SHA=PASS');print('AUTHWRITER_RUNTIME_ACCESS=none');print('AUTHWRITER_LOGIN_PERFORMED=false');print('AUTHWRITER_SECRET_ACCESS=false');print('AUTHWRITER_RAW_CLIENT_UPLOADED=false')
          with client.open('rb') as fh:
            elf=ELFFile(fh);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def vo(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError(hex(va))
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          targets={
            'REF_D0':0xe0e6d0,'COPY_D0':0xe0e330,
            'REF_E8':0xe0e6e0,'COPY_E8':0xe0e2d0,
            'REF_100':0xe0e6f0,'COPY_100':0x7acca0,
            'REF_118':0xe0e700,'COPY_118':0xe0e300,
            'REF_130':0xe0e710,'COPY_130':0xe0e390,
            'REF_148':0xe0e6c0,'COPY_148':0xa6ac20,
            'REF_160':0xe0e720,'COPY_160':0xe0e360,
            'CRYPTO_PREP':0xe1bc20,'CRYPTO_COPY':0xe0f310,'C0_COPY':0xe0d890,
            'GAME_LOGIN_PRODUCER':0xe1abe0,
          }
          calls={k:[] for k in targets}
          # One targeted pass: direct calls only to exact known auth-info methods.
          for n,o,z,v,fl in secs:
            if not (fl&4):continue
            for x in md.disasm(raw[o:o+z],v):
              if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:
                d=x.operands[0].imm
                for k,t in targets.items():
                  if d==t:calls[k].append(x.address)
          print('AUTHWRITER_DIRECT_XREFS_BEGIN')
          for k,t in targets.items():print(f'TARGET={k} VA=0x{t:x} XREFS='+','.join(hex(x) for x in calls[k]))
          print('AUTHWRITER_DIRECT_XREFS_END')

          # Emit de-duplicated bounded windows around non-generated callers. Avoid protobuf/helper regions when possible.
          sites=[]
          for k,vs in calls.items():
            for a in vs:
              if 0x1760000<=a<=0x17f0000: continue
              sites.append((k,a))
          seen=set(); print('AUTHWRITER_CALLER_WINDOWS_BEGIN')
          for k,a in sites[:96]:
            # Coalesce close xrefs to same local window.
            bucket=a//0x100
            if (k,bucket) in seen: continue
            seen.add((k,bucket)); s=max(0x400000,a-0x100);e=a+0x240
            print(f'KIND={k} XREF=0x{a:x} START=0x{s:x} STOP=0x{e:x}')
            try: ins=list(md.disasm(raw[vo(s):vo(e)],s))
            except: continue
            for x in ins[:180]: print(f'  0x{x.address:x}: {x.mnemonic} {x.op_str}')
          print('AUTHWRITER_CALLER_WINDOWS_END')

          # Search exact class/method metadata useful to identify post-auth controller slots; names are context, xrefs decide flow.
          terms=[b'tibia::authentication::TAuthenticationProcessController',b'tibia::authentication::TLoginRequestUploader',b'loginSuccessful',b'PlaySessionData',b'TCharacterLoginData',b'connectClientToGameserverWithExistingCredentials']
          print('AUTHWRITER_METADATA_OFFSETS_BEGIN')
          for t in terms:
            p=0; arr=[]
            while True:
              p=raw.find(t,p)
              if p<0:break
              va=p
              for n,o,z,v,fl in secs:
                if o<=p<o+z:va=v+(p-o);break
              arr.append(va);p+=1
            print(f'TERM={t.decode()} VAS='+','.join(hex(x) for x in arr[:32]))
          print('AUTHWRITER_METADATA_OFFSETS_END')
          assert any(calls[k] for k in calls if k.startswith('REF_') or k.startswith('COPY_'))
          print('AUTHWRITER_PROVENANCE_XREF_PROBE=PASS')
          PY

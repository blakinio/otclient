name: Track A native game-login credential proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-native-game-login-credential-proof]
    paths: [.github/workflows/tibia-official-client-re-game-login-credential-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qmeta-postauth-link:
    name: Exact-client post-auth QMeta link
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recover uploader/controller metaobjects and dispatch targets
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools
          r=/tmp/gp; mkdir -p "$r/bin" "$r/state" /tmp/gpc; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/gpc/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/gpc/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct,re
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_MEM,X86_REG_RIP
          packed=pathlib.Path('/tmp/gpc/client.lzma').read_bytes();q=packed[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(packed[33:37],'little')
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          client=pathlib.Path('/tmp/gpc/client');client.write_bytes(raw)
          print('POSTAUTH_QMETA_EXACT_PACKED_SHA=PASS');print('POSTAUTH_QMETA_EXACT_CLIENT_SHA=PASS');print('POSTAUTH_QMETA_RUNTIME_ACCESS=none');print('POSTAUTH_QMETA_LOGIN_PERFORMED=false');print('POSTAUTH_QMETA_SECRET_ACCESS=false');print('POSTAUTH_QMETA_RAW_CLIENT_UPLOADED=false')
          with client.open('rb') as fh:
            elf=ELFFile(fh);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def vo(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError(hex(va))
          def mapped(va,n=1):
            try:o=vo(va);return 0<=o and o+n<=len(raw)
            except:return False
          def u32(va):return struct.unpack_from('<I',raw,vo(va))[0]
          def i32(va):return struct.unpack_from('<i',raw,vo(va))[0]
          def qword(va):return struct.unpack_from('<Q',raw,vo(va))[0]
          def executable(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          def printable(s):return bool(s) and all(32<=c<127 for c in s)
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True

          def qs(S,idx):
            e=S+idx*8
            if not mapped(e,8):raise ValueError
            rel=u32(e);ln=u32(e+4);p=S+rel
            if ln>1024 or not mapped(p,ln):raise ValueError
            b=raw[vo(p):vo(p)+ln]
            if not printable(b) and b!=b'':raise ValueError
            return b.decode('utf8','replace')

          def recover_stringdata(class_name,occ_va):
            hits=[]
            for S in range(max(0x400000,occ_va-0x1000),occ_va+1,4):
              try:
                for idx in range(96):
                  if qs(S,idx)==class_name:
                    hits.append((S,idx));break
              except:pass
            return hits

          def recover_metadata(S,class_name,class_idx):
            out=[]
            for M in range(max(0x400000,S-0x2000),S,4):
              if not mapped(M,56):continue
              try:
                h=[u32(M+i*4) for i in range(14)]
                rev,ci,_,_,mc,mdo,pc,pdo,ec,edo,cc,cdo,flags,sc=h
                if ci!=class_idx or not (0<=mc<=256 and 0<=sc<=mc and 0<=mdo<100000 and 0<=pc<=256 and 0<=ec<=256):continue
                if qs(S,ci)!=class_name:continue
                rows=[]
                ok=True
                for i in range(mc):
                  base=M+(mdo+i*6)*4
                  row=[u32(base+j*4) for j in range(6)]
                  name=qs(S,row[0]);argc=row[1];po=row[2]
                  if argc>32:ok=False;break
                  vals=[u32(M+(po+j)*4) for j in range(1+2*argc)]
                  types=vals[:argc+1]
                  def dt(x):
                    if x&0x80000000:
                      try:return qs(S,x&0x7fffffff)
                      except:return f'unresolved#{x&0x7fffffff}'
                    return f'metatype#{x}'
                  rows.append((i,name,argc,[dt(x) for x in types]))
                if ok:out.append((M,h,rows))
              except:continue
            return out

          def recover_metaobject(S,M):
            # Search non-executable data for the Qt staticMetaObject tuple [..., S, M, ST, ...].
            hits=[]
            for n,o,z,v,fl in secs:
              if fl&4:continue
              blob=raw[o:o+z]
              needle=struct.pack('<Q',S)+struct.pack('<Q',M)
              p=0
              while True:
                p=blob.find(needle,p)
                if p<0:break
                va=v+p
                st=qword(va+16) if mapped(va+16,8) else 0
                hits.append((n,va,st));p+=8
            return hits

          def recover_jump_targets(ST,mc):
            if not executable(ST):return None,None
            ins=list(md.disasm(raw[vo(ST):vo(ST)+0x900],ST));cands=[]
            for pos,x in enumerate(ins):
              if x.mnemonic!='lea' or len(x.operands)<2 or x.operands[1].type!=X86_OP_MEM or x.operands[1].mem.base!=X86_REG_RIP:continue
              reg=x.operands[0].reg;table=x.address+x.size+x.operands[1].mem.disp
              if not mapped(table,max(4,mc*4)):continue
              used=any(any(op.type==X86_OP_MEM and op.mem.base==reg and op.mem.scale==4 for op in y.operands) for y in ins[pos+1:pos+12])
              if not used:continue
              try:tg=[table+i32(table+k*4) for k in range(mc)];score=sum(executable(t) for t in tg);cands.append((score,table,tg))
              except:pass
            cands.sort(reverse=True)
            return (cands[0][1],cands[0][2]) if cands and cands[0][0]==mc else (None,None)

          targets=[
            ('tibia::authentication::TLoginRequestUploader',0x1ca5408),
            ('tibia::authentication::TAuthenticationProcessController',0x1c8b960),
          ]
          promoted=[]
          for cls,occ in targets:
            print(f'QMETA_CLASS_BEGIN {cls}')
            shits=recover_stringdata(cls,occ)
            print('STRINGDATA_CANDIDATES='+','.join(f'0x{s:x}:idx{i}' for s,i in shits))
            candidates=[]
            for S,ci in shits:
              for M,h,rows in recover_metadata(S,cls,ci):
                candidates.append((S,M,h,rows))
            # Deduplicate and prefer metadata containing semantically useful methods.
            uniq=[];seen=set()
            for c in candidates:
              k=(c[0],c[1])
              if k not in seen:seen.add(k);uniq.append(c)
            uniq.sort(key=lambda c:sum(1 for _,n,_,t in c[3] if re.search(r'login|character|session|game',n,re.I)),reverse=True)
            print(f'METADATA_CANDIDATES={len(uniq)}')
            for S,M,h,rows in uniq[:6]:
              mc=h[4];sc=h[13]
              print(f'S=0x{S:x} M=0x{M:x} METHOD_COUNT={mc} SIGNAL_COUNT={sc}')
              for i,n,a,t in rows:print(f'  INDEX={i} NAME={n} ARGC={a} TYPES={"|".join(t)}')
              mo=recover_metaobject(S,M)
              print('  METAOBJECTS='+','.join(f'{sec}:0x{va:x}:ST=0x{st:x}' for sec,va,st in mo))
              for sec,va,st in mo:
                if not executable(st):continue
                table,tg=recover_jump_targets(st,mc)
                if tg:
                  print(f'  STATIC_METACALL=0x{st:x} JUMP_TABLE=0x{table:x}')
                  for i,n,a,t in rows:
                    print(f'    TARGET INDEX={i} NAME={n} VA=0x{tg[i]:x}')
                    if re.search(r'loginSuccessful|login|character|session|game',n,re.I):
                      promoted.append((cls,n,tg[i],t))
            print(f'QMETA_CLASS_END {cls}')

          print('POSTAUTH_PROMOTED_TARGETS_BEGIN')
          for cls,n,va,t in promoted:print(f'CLASS={cls} METHOD={n} TARGET=0x{va:x} TYPES={"|".join(t)}')
          print('POSTAUTH_PROMOTED_TARGETS_END')
          # Bounded disassembly around every promoted nontrivial target.
          print('POSTAUTH_TARGET_WINDOWS_BEGIN')
          done=set()
          for cls,n,va,t in promoted:
            if va in done or not executable(va):continue
            done.add(va);s=max(0x400000,va-0x40);e=va+0x500
            print(f'CLASS={cls} METHOD={n} TARGET=0x{va:x}')
            ins=list(md.disasm(raw[vo(s):vo(e)],s))
            for x in ins[:260]:print(f'  0x{x.address:x}: {x.mnemonic} {x.op_str}')
          print('POSTAUTH_TARGET_WINDOWS_END')
          assert any(n=='loginSuccessful' for _,n,_,_ in promoted)
          print('POSTAUTH_QMETA_LINK_PROBE=PASS')
          PY

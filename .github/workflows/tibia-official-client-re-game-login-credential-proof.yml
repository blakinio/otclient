name: Track A native game-login credential proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-native-game-login-credential-proof]
    paths: [.github/workflows/tibia-official-client-re-game-login-credential-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protobuf-structure:
    name: Exact-client protobuf structure and RTTI probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact official client and recover target protobuf structure
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools python3-capstone

          r=/tmp/game-login-proof-warp
          mkdir -p "$r/bin" "$r/state" /tmp/game-login-proof
          cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wireproxy.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tgz' | sha256sum -c -
          mkdir wireproxy-x
          tar -xzf wireproxy.tgz -C wireproxy-x
          cp "$(find wireproxy-x -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy

          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >/tmp/game-login-proof-wireproxy.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/game-login-proof-warp-trace 2>/dev/null && break
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' /tmp/game-login-proof-warp-trace

          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' \
            "$u" -o /tmp/game-login-proof/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/game-login-proof/client.lzma' | sha256sum -c -

          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct,re
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_IMM,X86_OP_MEM,X86_OP_REG,X86_REG_RIP,X86_REG_RDI

          packed=pathlib.Path('/tmp/game-login-proof/client.lzma').read_bytes()
          q=packed[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(packed[33:37],'little')
          flt={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[flt])
          assert len(raw)==51965216
          assert hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          client=pathlib.Path('/tmp/game-login-proof/client'); client.write_bytes(raw)
          print('GAMELOGIN_EXACT_PACKED_SHA=PASS')
          print('GAMELOGIN_EXACT_CLIENT_SHA=PASS')
          print('GAMELOGIN_RUNTIME_ACCESS=none')
          print('GAMELOGIN_LOGIN_PERFORMED=false')
          print('GAMELOGIN_SECRET_ACCESS=false')
          print('GAMELOGIN_PROCESS_X11_OBSERVATION=false')
          print('GAMELOGIN_RAW_CLIENT_UPLOADED=false')

          with client.open('rb') as fh:
            elf=ELFFile(fh)
            secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
            rels=[]
            for sec in elf.iter_sections():
              if not isinstance(sec,RelocationSection): continue
              symtab=elf.get_section(sec['sh_link']) if sec['sh_link'] else None
              for rel in sec.iter_relocations():
                off=int(rel['r_offset']); typ=int(rel['r_info_type']); add=int(rel['r_addend']) if rel.is_RELA() else None
                sym=''
                if int(rel['r_info_sym']) and symtab is not None:
                  try: sym=symtab.get_symbol(int(rel['r_info_sym'])).name
                  except Exception: pass
                rels.append((off,typ,add,sym))

          def offva(off):
            for n,o,z,v,fl in secs:
              if o<=off<o+z: return v+(off-o)
            return None
          def vaoff(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z: return o+(va-v)
            raise ValueError(hex(va))
          def mapped(va): return any(v<=va<v+z for _,_,z,v,_ in secs)
          def executable(va): return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          def qword(va): return struct.unpack_from('<Q',raw,vaoff(va))[0]
          rel_by_offset={off:(typ,add,sym) for off,typ,add,sym in rels}
          by_add={}
          for off,typ,add,sym in rels:
            if add is not None: by_add.setdefault(add,[]).append((off,typ,sym))
          def ptr(va):
            row=rel_by_offset.get(va)
            if row and row[1] is not None: return row[1]
            try: return qword(va)
            except Exception: return 0
          def mangle(cls):
            return ('N'+''.join(str(len(x))+x for x in cls.split('::'))+'E').encode()+b'\0'
          def recover(cls):
            namevas=[]; start=0; needle=mangle(cls)
            while True:
              p=raw.find(needle,start)
              if p<0: break
              va=offva(p); start=p+1
              if va is not None: namevas.append(va)
            tis=[]
            for nv in namevas:
              for target,typ,sym in by_add.get(nv,[]):
                ti=target-8
                if mapped(ti): tis.append(ti)
            out=[]
            for ti in sorted(set(tis)):
              for target,typ,sym in by_add.get(ti,[]):
                header=target-8
                try:
                  if qword(header)!=0: continue
                except Exception: continue
                vp=header+16
                fns=[ptr(vp+i*8) for i in range(28)]
                if fns and executable(fns[0]): out.append((ti,vp,fns))
            seen=set(); uniq=[]
            for row in out:
              if row[1] not in seen:
                seen.add(row[1]); uniq.append(row)
            return sorted(set(namevas)),uniq

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          exec_secs=[x for x in secs if (x[4]&4) and x[2]]
          targets=[
            'tibia::protobuf::protocol::GameclientMessageLogin',
            'tibia::protobuf::protocol::LoginRSAEncryptedBlock',
            'tibia::protobuf::protocol::GameclientMessageSecondaryLogin',
            'tibia::protobuf::protocol::SecondaryLoginRSAEncryptedBlock',
            'tibia::protobuf::protocol::GameclientMessageEnterWorld',
          ]
          recovered={}
          print('GAMELOGIN_RTTI_VTABLE_BEGIN')
          for cls in targets:
            names,vps=recover(cls); recovered[cls]=vps
            print('CLASS='+cls)
            print('  NAME_VAS='+','.join(hex(x) for x in names))
            for ti,vp,fns in vps:
              print(f'  TYPEINFO=0x{ti:x} VPTR=0x{vp:x}')
              for i,fn in enumerate(fns): print(f'    SLOT=+0x{i*8:x} TARGET=0x{fn:x} EXEC={str(executable(fn)).lower()}')
          print('GAMELOGIN_RTTI_VTABLE_END')
          if not recovered['tibia::protobuf::protocol::GameclientMessageLogin'] or not recovered['tibia::protobuf::protocol::LoginRSAEncryptedBlock']:
            raise SystemExit('missing target protobuf vtable')

          # Scan executable once for direct RIP references to recovered vptr/typeinfo identities.
          idmap={}
          for cls,vps in recovered.items():
            for ti,vp,fns in vps:
              idmap[ti]=(cls,'TYPEINFO'); idmap[vp]=(cls,'VPTR')
          idrefs={k:[] for k in idmap}
          for sec,off,size,base,fl in exec_secs:
            for ins in md.disasm(raw[off:off+size],base):
              for op in ins.operands:
                if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                  dst=ins.address+ins.size+op.mem.disp
                  if dst in idrefs: idrefs[dst].append(ins.address)
          print('GAMELOGIN_IDENTITY_XREFS_BEGIN')
          for va,(cls,kind) in idmap.items():
            print(f'{kind} {cls} 0x{va:x} XREFS='+','.join(hex(x) for x in idrefs[va][:80]))
          print('GAMELOGIN_IDENTITY_XREFS_END')

          # Compact per-vtable-function fingerprints: this-relative offsets, calls and immediates.
          # This does not assign protobuf method semantics yet; it provides the bounded discriminator for the next proof step.
          def fingerprint(addr):
            try: code=raw[vaoff(addr):vaoff(addr)+0x600]
            except Exception: return None
            aliases={X86_REG_RDI:0}; offs=[]; calls=[]; imms=[]; riprefs=[]; insn_count=0; ret_at=None
            for ins in md.disasm(code,addr):
              insn_count+=1
              # read memory relative to tracked aliases
              for op in ins.operands:
                if op.type==X86_OP_MEM:
                  if op.mem.base in aliases:
                    offs.append(aliases[op.mem.base]+op.mem.disp)
                  if op.mem.base==X86_REG_RIP:
                    dst=ins.address+ins.size+op.mem.disp
                    if mapped(dst): riprefs.append(dst)
                elif op.type==X86_OP_IMM:
                  if 0<=op.imm<=0xffff: imms.append(op.imm)
              if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==X86_OP_IMM:
                calls.append(ins.operands[0].imm)
              # simple this-alias propagation
              if ins.mnemonic=='mov' and len(ins.operands)>=2 and ins.operands[0].type==X86_OP_REG:
                d=ins.operands[0].reg; s=ins.operands[1]
                if s.type==X86_OP_REG and s.reg in aliases: aliases[d]=aliases[s.reg]
                elif d in aliases: aliases.pop(d,None)
              elif ins.mnemonic=='lea' and len(ins.operands)>=2 and ins.operands[0].type==X86_OP_REG and ins.operands[1].type==X86_OP_MEM:
                d=ins.operands[0].reg; m=ins.operands[1].mem
                if m.base in aliases and m.index==0: aliases[d]=aliases[m.base]+m.disp
                elif d in aliases: aliases.pop(d,None)
              if ins.mnemonic.startswith('ret'):
                ret_at=ins.address; break
              if insn_count>=220: break
            return insn_count,ret_at,sorted(set(offs)),calls,sorted(set(imms)),sorted(set(riprefs))

          print('GAMELOGIN_VTABLE_FINGERPRINTS_BEGIN')
          seen=set()
          for cls,vps in recovered.items():
            for ti,vp,fns in vps[:2]:
              for i,fn in enumerate(fns):
                if not executable(fn) or fn in seen: continue
                seen.add(fn); fp=fingerprint(fn)
                if fp is None: continue
                n,ret,offs,calls,imms,rips=fp
                print(f'CLASS={cls} SLOT=+0x{i*8:x} FN=0x{fn:x} INSNS={n} RET={"NONE" if ret is None else hex(ret)}')
                print('  THIS_OFFSETS='+','.join(hex(x) if x>=0 else '-0x%x'%(-x) for x in offs[:80]))
                print('  CALLS='+','.join(hex(x) for x in calls[:80]))
                print('  SMALL_IMMS='+','.join(hex(x) for x in imms[:80]))
                print('  RIP_REFS='+','.join(hex(x) for x in rips[:80]))
          print('GAMELOGIN_VTABLE_FINGERPRINTS_END')

          # Exact ASCII concept VAs and executable xrefs. These are hypotheses only until tied to target code.
          concepts=['sessionkey','SessionKey','password','Password','playdata','charactername','worldid','challenge','timestamp']
          concept_vas={}
          for s in concepts:
            vals=[]; start=0; needle=s.encode()+b'\0'
            while True:
              p=raw.find(needle,start)
              if p<0: break
              v=offva(p); start=p+1
              if v is not None: vals.append(v)
            concept_vas[s]=vals
          rev={v:s for s,vs in concept_vas.items() for v in vs}
          refs={s:[] for s in concepts}
          for sec,off,size,base,fl in exec_secs:
            for ins in md.disasm(raw[off:off+size],base):
              for op in ins.operands:
                if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                  dst=ins.address+ins.size+op.mem.disp
                  if dst in rev: refs[rev[dst]].append(ins.address)
          print('GAMELOGIN_CONCEPT_XREFS_BEGIN')
          for s in concepts:
            print(s+' VAS='+','.join(hex(x) for x in concept_vas[s])+' XREFS='+','.join(hex(x) for x in refs[s][:80]))
          print('GAMELOGIN_CONCEPT_XREFS_END')
          print('GAMELOGIN_PROTOBUF_STRUCTURE_PROBE=PASS')
          PY

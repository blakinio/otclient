name: Track A native game-login credential proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-native-game-login-credential-proof]
    paths: [.github/workflows/tibia-official-client-re-game-login-credential-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-xrefs:
    name: Exact-client login producer xrefs
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch exact official client and recover login producer callsites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools
          r=/tmp/gp; mkdir -p "$r/bin" "$r/state" /tmp/gpc; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/gpc/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/gpc/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct,re
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP
          b=pathlib.Path('/tmp/gpc/client.lzma').read_bytes(); q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          client=pathlib.Path('/tmp/gpc/client');client.write_bytes(raw)
          print('GAMELOGIN_PRODUCER_EXACT_PACKED_SHA=PASS');print('GAMELOGIN_PRODUCER_EXACT_CLIENT_SHA=PASS');print('GAMELOGIN_RUNTIME_ACCESS=none');print('GAMELOGIN_LOGIN_PERFORMED=false');print('GAMELOGIN_SECRET_ACCESS=false');print('GAMELOGIN_PROCESS_X11_OBSERVATION=false');print('GAMELOGIN_RAW_CLIENT_UPLOADED=false')
          with client.open('rb') as fh:
            elf=ELFFile(fh);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def vo(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError(hex(va))
          def u32(va):return struct.unpack_from('<I',raw,vo(va))[0]
          def i32(va):return struct.unpack_from('<i',raw,vo(va))[0]
          def executable(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True

          # Recover TLoginProtocolMessageHandler method signatures and QMeta case targets.
          S=0x1cae518;M=0x1cae3e0;ST=0xcf2aa0
          h=[u32(M+i*4) for i in range(14)];rev,ci,_,_,mc,mdo,*_=h
          def qs(idx):
            e=S+idx*8;rel=u32(e);ln=u32(e+4);return raw[vo(S+rel):vo(S+rel)+ln].decode('utf8','replace')
          cls=qs(ci);assert cls=='tibia::authentication::TLoginProtocolMessageHandler'
          rows=[]
          for i in range(mc):
            base=M+(mdo+i*6)*4;row=[u32(base+j*4) for j in range(6)];argc=row[1];po=row[2];vals=[u32(M+(po+j)*4) for j in range(1+2*argc)];types=vals[:argc+1]
            def dt(x):
              if x&0x80000000:
                try:return qs(x&0x7fffffff)
                except:return f'unresolved#{x&0x7fffffff}'
              return f'metatype#{x}'
            rows.append((i,qs(row[0]),argc,[dt(x) for x in types]))
          ins=list(md.disasm(raw[vo(ST):vo(ST)+0x500],ST));cands=[]
          for pos,x in enumerate(ins):
            if x.mnemonic!='lea' or len(x.operands)<2 or x.operands[1].type!=X86_OP_MEM or x.operands[1].mem.base!=X86_REG_RIP:continue
            reg=x.operands[0].reg;table=x.address+x.size+x.operands[1].mem.disp
            used=any(any(op.type==X86_OP_MEM and op.mem.base==reg and op.mem.scale==4 for op in y.operands) for y in ins[pos+1:pos+10])
            if not used:continue
            try:
              tg=[table+i32(table+k*4) for k in range(mc)];score=sum(executable(v) for v in tg);cands.append((score,table,tg))
            except:pass
          cands.sort(reverse=True);assert cands and cands[0][0]==mc;table,tg=cands[0][1],cands[0][2]
          print(f'LOGINPROTO_CLASS={cls} METHOD_COUNT={mc} JUMP_TABLE=0x{table:x}')
          wanted=re.compile(r'(login|secondary|challenge|ready)',re.I)
          print('GAMELOGIN_LOGINPROTO_METHODS_BEGIN')
          for i,name,argc,types in rows:
            if wanted.search(name):print(f'INDEX={i} NAME={name} ARGC={argc} TYPES={"|".join(types)} QMETA_TARGET=0x{tg[i]:x}')
          print('GAMELOGIN_LOGINPROTO_METHODS_END')

          # One executable pass for direct calls to exact signal/constructor-ish producer identities and RIP refs to protobuf vptr identities.
          call_targets={
            'SEND_LOGIN_SIGNAL':0xcf2950,
            'LOGIN_QMETA_CASE':tg[next(i for i,n,a,t in rows if n=='sendLoginMessage')],
            'SECONDARY_QMETA_CASE':tg[next(i for i,n,a,t in rows if n=='sendSecondaryLoginMessage')],
          }
          # Generated class identities; RIP refs locate constructor/destructor/value sites without guessing constructor symbols.
          identity_targets={
            'LOGIN_VPTR':0x30c84a0,
            'LOGIN_TYPEINFO':0x30c5ce8,
            'RSA_VPTR':0x30c8428,
            'RSA_TYPEINFO':0x30c5cd0,
            'SECONDARY_VPTR':0x30c6628,
            'SECRSA_VPTR':0x30c65b0,
          }
          calls={k:[] for k in call_targets};refs={k:[] for k in identity_targets}
          execsecs=[x for x in secs if (x[4]&4) and x[2]]
          for sec,o,z,v,fl in execsecs:
            for x in md.disasm(raw[o:o+z],v):
              if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:
                d=x.operands[0].imm
                for k,t in call_targets.items():
                  if d==t:calls[k].append(x.address)
              for op in x.operands:
                if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                  d=x.address+x.size+op.mem.disp
                  for k,t in identity_targets.items():
                    if d==t:refs[k].append(x.address)
          print('GAMELOGIN_PRODUCER_XREFS_BEGIN')
          for k,t in call_targets.items():print(f'CALL_TARGET={k} TARGET=0x{t:x} XREFS='+','.join(hex(x) for x in calls[k]))
          for k,t in identity_targets.items():print(f'IDENTITY={k} TARGET=0x{t:x} XREFS='+','.join(hex(x) for x in refs[k]))
          print('GAMELOGIN_PRODUCER_XREFS_END')

          # Bounded windows only around discovered xrefs. Cap each family to avoid log explosion.
          sites=[]
          for k,vs in calls.items():
            for a in vs[:16]:sites.append((k,a))
          for k,vs in refs.items():
            for a in vs[:8]:sites.append((k,a))
          print('GAMELOGIN_PRODUCER_WINDOWS_BEGIN')
          done=set()
          for k,a in sites:
            key=(k,a)
            if key in done:continue
            done.add(key);start=max(0x400000,a-0x100);stop=a+0x280
            try:code=raw[vo(start):vo(stop)]
            except Exception:continue
            print(f'WINDOW_KIND={k} XREF=0x{a:x} START=0x{start:x} STOP=0x{stop:x}')
            count=0
            for x in md.disasm(code,start):
              if x.address<start:continue
              print(f'  0x{x.address:x}: {x.mnemonic} {x.op_str}')
              count+=1
              if count>=180:break
          print('GAMELOGIN_PRODUCER_WINDOWS_END')
          print('GAMELOGIN_PRODUCER_XREF_PROBE=PASS')
          PY

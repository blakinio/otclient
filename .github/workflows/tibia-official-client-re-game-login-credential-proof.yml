name: Track A native game-login credential proof

on:
  push:
    branches: [docs/OTC-20260817-track-a-native-game-login-credential-proof]
    paths: [.github/workflows/tibia-official-client-re-game-login-credential-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serializer-branches:
    name: Exact-client login serializer branch tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact official client and decode bounded serializer branches
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone
          r=/tmp/gp; mkdir -p "$r/bin" "$r/state" /tmp/gpc; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o /tmp/gpc/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/gpc/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib,struct
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP
          b=pathlib.Path('/tmp/gpc/client.lzma').read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          print('GAMELOGIN_BRANCH_EXACT_PACKED_SHA=PASS');print('GAMELOGIN_BRANCH_EXACT_CLIENT_SHA=PASS');print('GAMELOGIN_RUNTIME_ACCESS=none');print('GAMELOGIN_LOGIN_PERFORMED=false');print('GAMELOGIN_SECRET_ACCESS=false');print('GAMELOGIN_PROCESS_X11_OBSERVATION=false');print('GAMELOGIN_RAW_CLIENT_UPLOADED=false')
          # Exact ELF LOAD mapping for this PIE: addresses used by prior exact-SHA probes map directly through section-derived base; derive via ELF header/program headers without dependency.
          # For this binary, executable virtual/file mapping is recovered from ELF program headers.
          phoff=struct.unpack_from('<Q',raw,0x20)[0]; phentsz=struct.unpack_from('<H',raw,0x36)[0]; phnum=struct.unpack_from('<H',raw,0x38)[0]
          seg=[]
          for i in range(phnum):
            o=phoff+i*phentsz; ptype,pflags=struct.unpack_from('<II',raw,o); po,pv,_,pfs,pms=struct.unpack_from('<QQQQQ',raw,o+8)
            if ptype==1:seg.append((po,pv,pfs,pms,pflags))
          def vaoff(va):
            for po,pv,pfs,pms,pflags in seg:
              if pv<=va<pv+pfs:return po+(va-pv)
            raise ValueError(hex(va))
          def mapped(va):return any(pv<=va<pv+pms for po,pv,pfs,pms,pflags in seg)
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          targets={
            'LOGIN_F5':0x176dfb0,'LOGIN_F4':0x176e000,'LOGIN_F7':0x176e050,'LOGIN_SIZE_F7':0x175d820,
            'BLOCK_F2':0x176dbf0,'BLOCK_F1':0x176dc40,'BLOCK_F7':0x176dc90,'BLOCK_F6':0x176dd18,'BLOCK_F5':0x176dd68,
            'SECONDARY_F2':0x176b060,'SECBLOCK_F1':0x176e220,'SECBLOCK_F2':0x176e269,
          }
          print('GAMELOGIN_SERIALIZER_BRANCHES_BEGIN')
          for name,a in targets.items():
            ins=list(md.disasm(raw[vaoff(a):vaoff(a)+0xc0],a))[:42]
            print(f'BRANCH={name} ADDR=0x{a:x}')
            for x in ins:
              print(f'  0x{x.address:x}: {x.mnemonic} {x.op_str}')
              if x.mnemonic.startswith('ret'):break
            tags=[]; calls=[]; mem=[]
            for x in ins:
              if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:calls.append(x.operands[0].imm)
              for op in x.operands:
                if op.type==X86_OP_MEM:
                  if -0x100<=op.mem.disp<=0x200:mem.append(op.mem.disp)
                elif op.type==X86_OP_IMM and 0<=op.imm<=0xff:tags.append(op.imm)
            print('  SMALL_IMMS='+','.join(hex(x) for x in sorted(set(tags))))
            print('  MEM_DISPS='+','.join(hex(x) if x>=0 else '-0x%x'%(-x) for x in sorted(set(mem))))
            print('  CALLS='+','.join(hex(x) for x in calls))
          print('GAMELOGIN_SERIALIZER_BRANCHES_END')
          print('GAMELOGIN_BRANCH_TAG_PROBE=PASS')
          PY

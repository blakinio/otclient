name: Track A high-value GameAction dispatch map
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-gameaction-dispatch-map.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Disassemble selected GameAction static metacalls
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          gdb="$toolroot/usr/bin/gdb"; [[ -x "$gdb" ]]
          "$gdb" -q -nx -batch "$client" \
            -ex 'set pagination off' \
            -ex 'set disassembly-flavor intel' \
            -ex 'echo TRACK_A_CREATURE_GA_BEGIN=true\n' \
            -ex 'disassemble /r 0xd16340,0xd16a80' \
            -ex 'echo TRACK_A_CREATURE_GA_END=true\n' \
            -ex 'echo TRACK_A_WORLDMAP_GA_BEGIN=true\n' \
            -ex 'disassemble /r 0xdeda80,0xdede80' \
            -ex 'echo TRACK_A_WORLDMAP_GA_END=true\n' \
            -ex 'echo TRACK_A_CONTAINER_GA_BEGIN=true\n' \
            -ex 'disassemble /r 0xd1dac0,0xd1e000' \
            -ex 'echo TRACK_A_CONTAINER_GA_END=true\n' \
            -ex 'echo TRACK_A_CHAT_GA_BEGIN=true\n' \
            -ex 'disassemble /r 0xcff5b0,0xd00500' \
            -ex 'echo TRACK_A_CHAT_GA_END=true\n' \
            -ex 'echo TRACK_A_TRADE_GA_BEGIN=true\n' \
            -ex 'disassemble /r 0xdecff0,0xded500' \
            -ex 'echo TRACK_A_TRADE_GA_END=true\n'

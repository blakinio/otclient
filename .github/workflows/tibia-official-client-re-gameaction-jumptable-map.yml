name: Track A high-value GameAction dispatch map
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-gameaction-jumptable-map.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Decode exact high-value GameAction QMeta case entries
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          python3 - "$client" <<'PY'
          import struct,sys
          data=open(sys.argv[1],'rb').read()
          phoff=struct.unpack_from('<Q',data,0x20)[0];phentsz=struct.unpack_from('<H',data,0x36)[0];phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,off,va,paddr,filesz,memsz,align=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1:loads.append((off,off+filesz,va,va+filesz,flags))
          def va2off(v):
              for lo,hi,va,vhi,fl in loads:
                  if va<=v<vhi:return lo+(v-va)
          def is_exec(v):
              for lo,hi,va,vhi,fl in loads:
                  if va<=v<vhi:return bool(fl&1)
              return False
          # Method indices are independently pinned by qmeta-gameaction-census run
          # 31790921915 / job 94737395183. Dispatch layouts are independently pinned
          # by gameaction-dispatch-map run 31790967810 / job 94737543252.
          table_groups={
            'Creatures':{
              'static':0xd16340,'table':0x1d712dc,'count':13,
              'targets':{1:'sendAttack',2:'sendFollow'}},
            'Chat':{
              'static':0xcff5b0,'table':0x1d6dcbc,'count':38,
              'targets':{9:'sendTalkMessage'}},
            'Container':{
              'static':0xd1dac0,'table':0x1d7145c,'count':23,
              'targets':{1:'sendMoveObject'}},
          }
          direct_groups={
            'PlayerTrade':{
              'static':0xdecff0,'count':3,
              'entries':{0:0xded090,1:0xded060,2:0xded0b8},
              'targets':{1:'sendTradeObject'}},
            'WorldMap':{
              'static':0xdeda80,'count':3,
              'entries':{0:0xdedac0,1:0xdedaf0,2:0xdedb00},
              'targets':{0:'sendMoveObject'}},
          }
          def validate_entry(cls,static,entry):
              assert is_exec(static),f'{cls}: static_metacall not executable: 0x{static:x}'
              assert is_exec(entry),f'{cls}: case entry not executable: 0x{entry:x}'
              assert abs(entry-static)<0x10000,f'{cls}: implausible case distance: static=0x{static:x} entry=0x{entry:x}'
          def decode_tail(entry,boundaries):
              larger=[x for x in boundaries if x>entry]
              if not larger:return (None,None)
              end=min(larger)
              o=va2off(entry)
              if o is None:return (None,None)
              span=min(end-entry,64)
              if span<5:return (None,None)
              for d in range(span-4):
                  op=data[o+d]
                  if op==0xc3:
                      break
                  if op==0xe9:
                      disp=struct.unpack_from('<i',data,o+d+1)[0]
                      tail=entry+d+5+disp
                      if is_exec(tail):return (tail,entry+d)
                      raise AssertionError(f'invalid tail from 0x{entry:x}: 0x{tail:x}')
              return (None,None)
          print('TRACK_A_GAMEACTION_DISPATCH_MAP_BEGIN=true')
          critical=[]
          for cls,g in table_groups.items():
              table=g['table'];to=va2off(table);assert to is not None,f'{cls}: table unmapped'
              entries=[]
              for i in range(g['count']):
                  rel=struct.unpack_from('<i',data,to+i*4)[0]
                  e=table+rel
                  validate_entry(cls,g['static'],e)
                  entries.append(e)
              bounds=sorted(set(entries))
              print(f'CLASS name={cls} kind=rel32 static_metacall=0x{g["static"]:x} table=0x{table:x} count={g["count"]} distinct_entries={len(bounds)}')
              for idx,name in g['targets'].items():
                  e=entries[idx];tail,jat=decode_tail(e,bounds)
                  print(f'TARGET class={cls} index={idx} method={name} entry=0x{e:x} direct_jmp={"0x%x"%tail if tail is not None else "none"} jmp_at={"0x%x"%jat if jat is not None else "none"}')
                  critical.append((cls,name,e))
          for cls,g in direct_groups.items():
              assert len(g['entries'])==g['count']
              for e in g['entries'].values():validate_entry(cls,g['static'],e)
              print(f'CLASS name={cls} kind=direct static_metacall=0x{g["static"]:x} count={g["count"]}')
              bounds=sorted(set(g['entries'].values()))
              for idx,name in g['targets'].items():
                  e=g['entries'][idx];tail,jat=decode_tail(e,bounds)
                  print(f'TARGET class={cls} index={idx} method={name} entry=0x{e:x} direct_jmp={"0x%x"%tail if tail is not None else "none"} jmp_at={"0x%x"%jat if jat is not None else "none"}')
                  critical.append((cls,name,e))
          assert len(critical)==6,f'expected 6 critical mappings, got {len(critical)}'
          assert len({(c,n) for c,n,e in critical})==6
          print('CRITICAL_MAPPING_COUNT=6')
          print('TRACK_A_GAMEACTION_DISPATCH_MAP_COMPLETE=true')
          PY

name: Track A GameAction signal xref census
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-gameaction-signal-xref.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Find relocation and instruction xrefs to high-value GameAction signals
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          objdump="$toolroot/usr/bin/objdump"; readelf="$toolroot/usr/bin/readelf"
          [[ -x "$objdump" && -x "$readelf" ]]
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          echo 'TRACK_A_GAMEACTION_SIGNAL_XREF_BEGIN=true'
          "$readelf" -rW "$client" > "$tmp/relocs.txt"
          "$objdump" -d -M intel --no-show-raw-insn "$client" > "$tmp/disasm.txt"
          # Exact function/static-metaobject VAs are independently pinned by successful run 31793188185/job 94744455372.
          declare -A targets=(
            [Creatures_sendAttack]=d166f0
            [Creatures_sendFollow]=d164e0
            [Chat_sendTalkMessage]=cffb90
            [Container_sendMoveObject]=d1df30
            [PlayerTrade_sendTradeObject]=ded060
            [WorldMap_sendMoveObject]=dedac0
            [Creatures_staticMetaObject]=3085060
            [Chat_staticMetaObject]=30851a0
            [Container_staticMetaObject]=30850a0
            [PlayerTrade_staticMetaObject]=3085360
            [WorldMap_staticMetaObject]=30850e0
            [Player_staticMetaObject]=30852a0
          )
          for name in Creatures_sendAttack Creatures_sendFollow Chat_sendTalkMessage Container_sendMoveObject PlayerTrade_sendTradeObject WorldMap_sendMoveObject Creatures_staticMetaObject Chat_staticMetaObject Container_staticMetaObject PlayerTrade_staticMetaObject WorldMap_staticMetaObject Player_staticMetaObject; do
            hex="${targets[$name]}"
            echo "XREF_TARGET_BEGIN name=$name va=0x$hex"
            rel_count="$(grep -Eic "(^|[^0-9a-f])0*${hex}([^0-9a-f]|$)|[+]0*${hex}([^0-9a-f]|$)" "$tmp/relocs.txt" || true)"
            ins_count="$(grep -Eic "(^|[^0-9a-f])0x0*${hex}([^0-9a-f]|$)|(^|[^0-9a-f])0*${hex}([^0-9a-f]|$)" "$tmp/disasm.txt" || true)"
            echo "RELOCATION_MATCH_COUNT=$rel_count"
            grep -Ei "(^|[^0-9a-f])0*${hex}([^0-9a-f]|$)|[+]0*${hex}([^0-9a-f]|$)" "$tmp/relocs.txt" | head -n 40 || true
            echo "INSTRUCTION_MATCH_COUNT=$ins_count"
            grep -Ein -B3 -A3 "(^|[^0-9a-f])0x0*${hex}([^0-9a-f]|$)|(^|[^0-9a-f])0*${hex}([^0-9a-f]|$)" "$tmp/disasm.txt" | head -n 160 || true
            echo "XREF_TARGET_END name=$name"
          done
          echo 'TRACK_A_GAMEACTION_SIGNAL_XREF_COMPLETE=true'

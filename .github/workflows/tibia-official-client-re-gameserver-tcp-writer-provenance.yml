name: Track A current game-login schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-current-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Validate schema probe contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/tibia_re_current_game_login_schema/test_probe.py
          python3 tools/tibia_re_current_game_login_schema/test_workflow_contract.py
          python3 -m py_compile tools/tibia_re_current_game_login_schema/probe.py

      - name: Prepare secret-free current package through WARP
        shell: bash
        run: |
          set -Eeuo pipefail          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools
          r="$RUNNER_TEMP/current-login-schema"
          mkdir -p "$r/bin" "$r/state" "$r/pkg"
          trap 'rm -rf "$r"' EXIT
          curl -fsSL -o "$r/bin/wgcf" https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  '"$r"'/bin/wgcf' | sha256sum -c - >/dev/null
          curl -fsSL -o "$r/bin/wireproxy.tgz" https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  '"$r"'/bin/wireproxy.tgz' | sha256sum -c - >/dev/null
          mkdir "$r/bin/wp"
          tar -xzf "$r/bin/wireproxy.tgz" -C "$r/bin/wp"
          cp "$(find "$r/bin/wp" -type f -name wireproxy -print -quit)" "$r/bin/wireproxy"
          chmod 755 "$r/bin/wgcf" "$r/bin/wireproxy"
          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null && grep -Eq '^warp=(on|plus)$' "$r/trace" && break
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          base=https://static.tibia.com/launcher/tibiaclient-linux-current
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL "$base/package.json" -o "$r/pkg/package.json"          python3 - "$r/pkg/package.json" "$GITHUB_ENV" <<'PY'
          import json,re,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8'))
          version=str(doc.get('version') or '')
          if not re.fullmatch(r'15\.32\.[0-9a-fA-F]{6}',version): raise SystemExit('unexpected current version')
          rows=[x for x in doc.get('files',[]) if isinstance(x,dict) and x.get('localfile')=='bin/client']
          if len(rows)!=1: raise SystemExit('expected one bin/client row')
          row=rows[0]
          values={
            'SCHEMA_VERSION':version,
            'SCHEMA_PACKED_SHA':str(row.get('packedhash') or '').lower(),
            'SCHEMA_UNPACKED_SHA':str(row.get('unpackedhash') or '').lower(),
            'SCHEMA_PACKED_SIZE':str(row.get('packedsize')),
            'SCHEMA_UNPACKED_SIZE':str(row.get('unpackedsize')),
            'SCHEMA_CLIENT_URL':str(row.get('url') or ''),
          }
          if not re.fullmatch(r'[0-9a-f]{64}',values['SCHEMA_PACKED_SHA']): raise SystemExit('bad packed hash')
          if not re.fullmatch(r'[0-9a-f]{64}',values['SCHEMA_UNPACKED_SHA']): raise SystemExit('bad unpacked hash')
          with open(sys.argv[2],'a',encoding='utf-8') as h:
            for k,v in values.items(): h.write(f'{k}={v}\n')
          print('CURRENT_SCHEMA_PACKAGE_LAYOUT=PASS')
          print('CURRENT_SCHEMA_CLIENT_VERSION='+version)
          print('CURRENT_SCHEMA_CLIENT_UNPACKED_SHA256='+values['SCHEMA_UNPACKED_SHA'])
          print('CURRENT_SCHEMA_CLIENT_UNPACKED_SIZE='+values['SCHEMA_UNPACKED_SIZE'])
          PY          echo "SCHEMA_ROOT=$r" >> "$GITHUB_ENV"
          echo "SCHEMA_BASE=$base" >> "$GITHUB_ENV"
          echo CURRENT_SCHEMA_WARP_READY=true
          trap - EXIT

      - name: Materialize exact current client transiently and analyze schema
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -f "$SCHEMA_ROOT/pkg/client" "$SCHEMA_ROOT/pkg/client.lzma"' EXIT
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL "$SCHEMA_BASE/$SCHEMA_CLIENT_URL" -o "$SCHEMA_ROOT/pkg/client.lzma"
          echo "$SCHEMA_PACKED_SHA  $SCHEMA_ROOT/pkg/client.lzma" | sha256sum -c - >/dev/null
          test "$(stat -c %s "$SCHEMA_ROOT/pkg/client.lzma")" = "$SCHEMA_PACKED_SIZE"
          python3 - "$SCHEMA_ROOT/pkg/client.lzma" "$SCHEMA_ROOT/pkg/client" "$SCHEMA_UNPACKED_SHA" "$SCHEMA_UNPACKED_SIZE" <<'PY'
          import hashlib,lzma,pathlib,sys
          src,dst,expected_sha,expected_size=sys.argv[1:]
          b=pathlib.Path(src).read_bytes()
          if len(b)<45: raise SystemExit('short launcher payload')
          prop=b[32]; lc=prop%9; z=prop//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          if len(raw)!=int(expected_size): raise SystemExit('unpacked size mismatch')
          if hashlib.sha256(raw).hexdigest()!=expected_sha: raise SystemExit('unpacked hash mismatch')
          pathlib.Path(dst).write_bytes(raw)
          print('CURRENT_SCHEMA_EXACT_FENCE=PASS')
          PY          python3 tools/tibia_re_current_game_login_schema/probe.py \
            --client "$SCHEMA_ROOT/pkg/client" \
            --version "$SCHEMA_VERSION" \
            --packed-sha256 "$SCHEMA_PACKED_SHA" \
            --unpacked-sha256 "$SCHEMA_UNPACKED_SHA" \
            --unpacked-size "$SCHEMA_UNPACKED_SIZE" \
            --output artifacts/current-game-login-schema/result.json
          rm -f "$SCHEMA_ROOT/pkg/client" "$SCHEMA_ROOT/pkg/client.lzma"
          echo RAW_CLIENT_RETAINED=false
          echo CURRENT_GAME_LOGIN_SCHEMA_PROBE=PASS

      - name: Upload sanitized schema discovery only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-game-login-schema-${{ github.sha }}
          path: artifacts/current-game-login-schema/result.json
          if-no-files-found: error
          retention-days: 3
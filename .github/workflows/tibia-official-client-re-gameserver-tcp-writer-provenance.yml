name: Track A current game-login field provenance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-official-client-re-gameserver-tcp-writer-provenance.yml
      - tools/tibia_re_login_field_provenance/**
      - docs/agents/tasks/active/OTC-20260827-current-game-login-field-provenance.md

permissions:
  contents: read

jobs:
  static-field-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Validate probe contract
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-capstone python3-pyelftools
          python3 tools/tibia_re_login_field_provenance/test_probe.py
          python3 -m py_compile tools/tibia_re_login_field_provenance/probe.py

      - name: Prepare exact public client package through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          r="$RUNNER_TEMP/current-login-field-provenance"
          mkdir -p "$r/bin" "$r/state" "$r/pkg"
          trap 'rm -rf "$r"' EXIT
          curl -fsSL -o "$r/bin/wgcf" https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  '"$r"'/bin/wgcf' | sha256sum -c - >/dev/null
          curl -fsSL -o "$r/bin/wireproxy.tgz" https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  '"$r"'/bin/wireproxy.tgz' | sha256sum -c - >/dev/null
          mkdir "$r/bin/wp"
          tar -xzf "$r/bin/wireproxy.tgz" -C "$r/bin/wp"
          cp "$(find "$r/bin/wp" -type f -name wireproxy -print -quit)" "$r/bin/wireproxy"
          chmod 755 "$r/bin/wgcf" "$r/bin/wireproxy"
          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null && grep -Eq '^warp=(on|plus)$' "$r/trace" && break
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          base=https://static.tibia.com/launcher/tibiaclient-linux-current
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL "$base/package.json" -o "$r/pkg/package.json"
          python3 - "$r/pkg/package.json" "$GITHUB_ENV" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=[x for x in doc.get('files',[]) if isinstance(x,dict) and x.get('localfile')=='bin/client']
          if len(rows)!=1: raise SystemExit('expected one bin/client row')
          row=rows[0]
          values={
            'PROV_VERSION':str(doc.get('version') or ''),
            'PROV_PACKED_SHA':str(row.get('packedhash') or '').lower(),
            'PROV_UNPACKED_SHA':str(row.get('unpackedhash') or '').lower(),
            'PROV_PACKED_SIZE':str(row.get('packedsize')),
            'PROV_UNPACKED_SIZE':str(row.get('unpackedsize')),
            'PROV_CLIENT_URL':str(row.get('url') or ''),
          }
          expected={
            'PROV_VERSION':'15.32.75d4a0',
            'PROV_PACKED_SHA':'075810c54af2d6912000eab062763db29563f5a1f4bf1d984154b2d07fd5729f',
            'PROV_UNPACKED_SHA':'d1a16819cec7e40cfee39c099d4868d2eb2d7c1c942078eda105233b5688817a',
            'PROV_UNPACKED_SIZE':'52105824',
          }
          for key,value in expected.items():
            if values[key] != value:
              raise SystemExit(f'current public client fence moved: {key}')
          with open(sys.argv[2],'a',encoding='utf-8') as h:
            for key,value in values.items(): h.write(f'{key}={value}\n')
          print('CURRENT_LOGIN_FIELD_PROVENANCE_EXACT_FENCE=PASS')
          print('CURRENT_CLIENT_VERSION='+values['PROV_VERSION'])
          print('CURRENT_CLIENT_UNPACKED_SHA256='+values['PROV_UNPACKED_SHA'])
          PY
          echo "PROV_ROOT=$r" >> "$GITHUB_ENV"
          echo "PROV_BASE=$base" >> "$GITHUB_ENV"
          echo CURRENT_LOGIN_FIELD_PROVENANCE_WARP_READY=true
          trap - EXIT

      - name: Materialize transient exact client and recover field provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -f "$PROV_ROOT/pkg/client" "$PROV_ROOT/pkg/client.lzma"' EXIT
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL "$PROV_BASE/$PROV_CLIENT_URL" -o "$PROV_ROOT/pkg/client.lzma"
          echo "$PROV_PACKED_SHA  $PROV_ROOT/pkg/client.lzma" | sha256sum -c - >/dev/null
          test "$(stat -c %s "$PROV_ROOT/pkg/client.lzma")" = "$PROV_PACKED_SIZE"
          python3 - "$PROV_ROOT/pkg/client.lzma" "$PROV_ROOT/pkg/client" "$PROV_UNPACKED_SHA" "$PROV_UNPACKED_SIZE" <<'PY'
          import hashlib,lzma,pathlib,sys
          src,dst,expected_sha,expected_size=sys.argv[1:]
          packed=pathlib.Path(src).read_bytes()
          if len(packed)<45: raise SystemExit('short launcher payload')
          prop=packed[32]; lc=prop%9; z=prop//9; lp=z%5; pb=z//5; ds=int.from_bytes(packed[33:37],'little')
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          if len(raw)!=int(expected_size): raise SystemExit('unpacked size mismatch')
          if hashlib.sha256(raw).hexdigest()!=expected_sha: raise SystemExit('unpacked hash mismatch')
          pathlib.Path(dst).write_bytes(raw)
          print('CURRENT_LOGIN_FIELD_PROVENANCE_MATERIALIZATION=PASS')
          PY
          python3 tools/tibia_re_login_field_provenance/probe.py \
            --client "$PROV_ROOT/pkg/client" \
            --version "$PROV_VERSION" \
            --packed-sha256 "$PROV_PACKED_SHA" \
            --unpacked-sha256 "$PROV_UNPACKED_SHA" \
            --unpacked-size "$PROV_UNPACKED_SIZE" \
            --output artifacts/current-game-login-field-provenance/result.json
          rm -f "$PROV_ROOT/pkg/client" "$PROV_ROOT/pkg/client.lzma"
          echo RAW_CLIENT_RETAINED=false
          echo CURRENT_GAME_LOGIN_FIELD_PROVENANCE=PASS

      - name: Upload sanitized provenance only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-game-login-field-provenance-${{ github.sha }}
          path: artifacts/current-game-login-field-provenance/result.json
          if-no-files-found: error
          retention-days: 3

name: Track A high-value outbound action disassembly
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-high-value-send-disassembly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Statically disassemble high-value outbound action cases
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          command -v gdb >/dev/null
          echo 'TRACK_A_HIGH_VALUE_SEND_DISASSEMBLY_BEGIN=true'
          # These entry VAs are pinned by successful dispatch-map run 31793073416 / job 94744105956.
          # This is file-only disassembly: no client process is started and no game action is emitted.
          declare -A STARTS=(
            [Creatures_sendAttack]=0xd166f0
            [Creatures_sendFollow]=0xd164e0
            [Chat_sendTalkMessage]=0xcffb90
            [Container_sendMoveObject]=0xd1df30
            [PlayerTrade_sendTradeObject]=0xded060
            [WorldMap_sendMoveObject]=0xdedac0
            [Player_common_tail]=0xd1abc0
          )
          declare -A ENDS=(
            [Creatures_sendAttack]=0xd16820
            [Creatures_sendFollow]=0xd16610
            [Chat_sendTalkMessage]=0xcffd20
            [Container_sendMoveObject]=0xd1e080
            [PlayerTrade_sendTradeObject]=0xded0b8
            [WorldMap_sendMoveObject]=0xdedaf0
            [Player_common_tail]=0xd1aca8
          )
          for name in Creatures_sendAttack Creatures_sendFollow Chat_sendTalkMessage Container_sendMoveObject PlayerTrade_sendTradeObject WorldMap_sendMoveObject Player_common_tail; do
            start="${STARTS[$name]}"; end="${ENDS[$name]}"
            echo "DISASSEMBLY_TARGET_BEGIN name=$name start=$start end=$end"
            gdb -q -nx -batch "$client" \
              -ex 'set pagination off' \
              -ex 'set disassembly-flavor intel' \
              -ex "disassemble /r $start,$end"
            echo "DISASSEMBLY_TARGET_END name=$name"
          done
          echo 'TRACK_A_HIGH_VALUE_SEND_DISASSEMBLY_COMPLETE=true'

name: Track A official Linux client identity

on:
  workflow_dispatch:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-identity.yml

permissions:
  contents: read

concurrency:
  group: official-client-re-identity
  cancel-in-progress: false

jobs:
  identity:
    runs-on: [otclient, synology]
    timeout-minutes: 15
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_WARP_PORT: '25354'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
    steps:
      - name: Verify Track A ownership and establish isolated WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -s)" == Linux ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          root="$state/runtime/userspace-warp"
          mkdir -p "$root"/{bin,state}
          chmod 700 "$state" "$state/runtime" "$root" "$root/state"

          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          pid_file="$state/runtime/wireproxy.pid"
          if [[ -s "$pid_file" ]]; then
            pid="$(tr -cd '0-9' <"$pid_file")"
            if [[ -n "$pid" && -r "/proc/$pid/environ" ]] && tr '\0' '\n' <"/proc/$pid/environ" | grep -Fxq "$marker"; then
              kill -0 "$pid"
            else
              echo '::error title=Track A ownership mismatch::The Track A wireproxy PID file does not identify an owned live process.'
              exit 1
            fi
          else
            if ss -lntH "sport = :$TRACK_WARP_PORT" | grep -q .; then
              echo '::error title=Track A port ownership unknown::Port 25354 is occupied without the Track A PID marker.'
              exit 1
            fi
            cd "$root/bin"
            curl -fsSL --retry 3 -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
            echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
            curl -fsSL --retry 3 -o wireproxy.tar.gz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
            echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tar.gz' | sha256sum -c -
            rm -rf wireproxy-extract
            mkdir wireproxy-extract
            tar -xzf wireproxy.tar.gz -C wireproxy-extract
            cp "$(find wireproxy-extract -type f -name wireproxy -print -quit)" wireproxy
            chmod 755 wgcf wireproxy

            cd "$root/state"
            [[ -s wgcf-account.toml ]] || "$root/bin/wgcf" register --accept-tos >/dev/null
            chmod 600 wgcf-account.toml
            "$root/bin/wgcf" generate >/dev/null
            chmod 600 wgcf-profile.conf
            printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:%s\n' \
              "$root/state/wgcf-profile.conf" "$TRACK_WARP_PORT" >wireproxy.conf
            chmod 600 wireproxy.conf
            RUNNER_TRACKING_ID= OTCLIENT_TIBIA_RE_TRACK=official-client-re \
              nohup "$root/bin/wireproxy" -c "$root/state/wireproxy.conf" >"$root/wireproxy.log" 2>&1 </dev/null &
            pid=$!
            printf '%s\n' "$pid" >"$pid_file"
            chmod 600 "$pid_file"
          fi

          ready=false
          for _ in $(seq 1 30); do
            if curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" -fsS --max-time 10 \
              https://www.cloudflare.com/cdn-cgi/trace >"$state/runtime/warp-trace.txt" 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]
          grep -Eq '^warp=(on|plus)$' "$state/runtime/warp-trace.txt"
          echo TRACK_A_WARP_OWNERSHIP_VERIFIED=true
          echo TRACK_A_WARP_READY=true

      - name: Fetch and verify current official native-Linux client identity
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          out="$state/cache/current-client"
          mkdir -p "$out"
          url=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" --compressed -fL \
            --connect-timeout 15 --max-time 180 --retry 3 --retry-all-errors --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$url" -H 'Accept: */*' \
            "$url" -o "$out/client.lzma"
          packed="$(sha256sum "$out/client.lzma" | awk '{print $1}')"
          echo TRACK_A_CURRENT_PACKED_SHA256="$packed"
          echo TRACK_A_CURRENT_PACKED_SIZE="$(stat -c %s "$out/client.lzma")"
          python3 - "$out/client.lzma" "$out/client" <<'PY'
          import hashlib
          import lzma
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1]).read_bytes()
          prop = source[32]
          lc = prop % 9
          rest = prop // 9
          lp = rest % 5
          pb = rest // 5
          dictionary = int.from_bytes(source[33:37], "little")
          filt = {"id": lzma.FILTER_LZMA1, "dict_size": dictionary, "lc": lc, "lp": lp, "pb": pb}
          client = lzma.decompress(source[45:], format=lzma.FORMAT_RAW, filters=[filt])
          pathlib.Path(sys.argv[2]).write_bytes(client)
          terms = []
          for match in re.finditer(rb"15\.[0-9]{2}(?:\.[A-Za-z0-9]+)?", client):
              value = match.group().decode("ascii", "ignore")
              if value not in terms:
                  terms.append(value)
          print("TRACK_A_CURRENT_CLIENT_SIZE=" + str(len(client)))
          print("TRACK_A_CURRENT_CLIENT_SHA256=" + hashlib.sha256(client).hexdigest())
          print("TRACK_A_CURRENT_VERSION_STRINGS=" + ",".join(terms[:20]))
          PY
          chmod 700 "$out/client"
          actual_sha="$(sha256sum "$out/client" | awk '{print $1}')"
          actual_size="$(stat -c %s "$out/client")"
          [[ "$actual_sha" == "$EXPECTED_CLIENT_SHA256" ]]
          [[ "$actual_size" == "$EXPECTED_CLIENT_SIZE" ]]
          echo TRACK_A_RESEARCHED_PROFILE_SHA_MATCH=true
          echo TRACK_A_CURRENT_IDENTITY_PROVEN=true

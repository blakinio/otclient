name: Track A official runtime integrity audit

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-integrity-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [otclient, synology]
    timeout-minutes: 15
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_WARP_PORT: '25354'
    steps:
      - name: Compare installed runtime hashes with current official manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          warp_pid="$(tr -cd '0-9' <"$state/runtime/wireproxy.pid" 2>/dev/null || true)"
          [[ -n "$warp_pid" && -r "/proc/$warp_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$warp_pid/environ"
          kill -0 "$warp_pid"
          root="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          [[ -d "$root" ]]
          p="$(mktemp)"; a="$(mktemp)"; trap 'rm -f "$p" "$a"' EXIT
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" --compressed -fsSL --max-time 60 \
            'https://static.tibia.com/launcher/tibiaclient-linux-current/package.json' -o "$p"
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" --compressed -fsSL --max-time 60 \
            'https://static.tibia.com/launcher/assets-current/assets.json' -o "$a"
          python3 - "$root" "$p" "$a" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          def rows(path):
              doc=json.load(open(path,encoding='utf-8')); found={}
              def walk(v):
                  if isinstance(v,dict):
                      u=v.get('url'); ph=v.get('packedhash'); uh=v.get('unpackedhash')
                      if isinstance(u,str) and isinstance(ph,str): found[u]=(ph.lower(),uh.lower() if isinstance(uh,str) and uh else None)
                      for x in v.values(): walk(x)
                  elif isinstance(v,list):
                      for x in v: walk(x)
              walk(doc); return found
          missing=[]; mismatch=[]; checked=0
          for manifest in (rows(sys.argv[2]),rows(sys.argv[3])):
              for rel,(packed,unpacked) in manifest.items():
                  outrel=rel[:-5] if unpacked and rel.endswith('.lzma') else rel
                  expected=unpacked or packed
                  target=root/outrel
                  if not target.is_file():
                      missing.append(outrel); continue
                  h=hashlib.sha256(target.read_bytes()).hexdigest(); checked+=1
                  if h!=expected: mismatch.append((outrel,expected,h))
          print(f'TRACK_A_INTEGRITY_CHECKED_FILES={checked}')
          print(f'TRACK_A_INTEGRITY_MISSING_COUNT={len(missing)}')
          print(f'TRACK_A_INTEGRITY_MISMATCH_COUNT={len(mismatch)}')
          for x in missing[:50]: print(f'TRACK_A_INTEGRITY_MISSING={x}')
          for x,e,h in mismatch[:50]: print(f'TRACK_A_INTEGRITY_MISMATCH={x}|expected={e}|actual={h}')
          print('TRACK_A_RUNTIME_INTEGRITY_AUDIT_COMPLETE=true')
          PY

name: Track A KasmVNC current-client start

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tibia-official-client-re-kasmvnc-client-start.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-kasmvnc-client-start
  cancel-in-progress: false

env:
  CONTAINER_NAME: otclient-track-a-kasmvnc
  EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
  EXPECTED_SIZE: '52109920'
  SOURCE_PACKAGE: /home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia
  DEST_PACKAGE: /opt/otclient-track-a/Tibia

jobs:
  start:
    name: Start exact current official client on Kasm DISPLAY :1
    if: ${{ github.event.pull_request.head.ref == 'fix/OTC-20260818-track-a-persistent-viewer-handoff' }}
    runs-on: [otclient, synology]
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify Kasm runtime and exact client source
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          ulimit -c 0 || true
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ -S /var/run/docker.sock ]]
          [[ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" == true ]]
          [[ "$(docker inspect -f '{{ index .Config.Labels "otclient.runtime" }}' "$CONTAINER_NAME")" == track-a-kasmvnc-desktop ]]
          [[ "$(docker exec "$CONTAINER_NAME" /bin/bash -lc 'printf %s "${DISPLAY:-}"')" == ':1' ]]
          docker exec "$CONTAINER_NAME" /bin/bash -lc 'test -S /tmp/.X11-unix/X1 && pgrep -x Xvnc >/dev/null'
          client="$SOURCE_PACKAGE/bin/client"
          [[ -f "$client" && -x "$client" && ! -L "$client" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          echo KASM_CLIENT_START_PREFLIGHT=PASS
          echo KASM_CLIENT_START_SECRET_ACCESS=false
          echo KASM_CLIENT_START_LOGIN=false

      - name: Prove no official client candidate is already running
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          if docker exec "$CONTAINER_NAME" /bin/bash -lc "pgrep -af '$DEST_PACKAGE/bin/client'" >/dev/null 2>&1; then
            echo KASM_CLIENT_ALREADY_RUNNING=true
            exit 0
          fi
          python3 - "$SOURCE_PACKAGE/bin/client" <<'PY'
          import pathlib,sys
          exact=pathlib.Path(sys.argv[1]).resolve()
          hits=[]
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit():
                  continue
              try:
                  exe=(p/'exe').resolve(strict=True)
              except (OSError,RuntimeError):
                  continue
              if exe==exact:
                  hits.append(int(p.name))
          if hits:
              raise SystemExit('source-package client already running on host')
          print('KASM_CLIENT_HOST_SOURCE_CANDIDATES=0')
          PY

      - name: Stage exact package inside persistent Kasm container
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          docker exec "$CONTAINER_NAME" /bin/bash -lc 'rm -rf /opt/otclient-track-a/Tibia.new && mkdir -p /opt/otclient-track-a/Tibia.new'
          docker cp "$SOURCE_PACKAGE/." "$CONTAINER_NAME:/opt/otclient-track-a/Tibia.new/"
          docker exec "$CONTAINER_NAME" /bin/bash -lc "test -x '$DEST_PACKAGE.new/bin/client' && test \"\$(stat -c %s '$DEST_PACKAGE.new/bin/client')\" = '$EXPECTED_SIZE' && test \"\$(sha256sum '$DEST_PACKAGE.new/bin/client' | awk '{print \$1}')\" = '$EXPECTED_SHA'"
          docker exec "$CONTAINER_NAME" /bin/bash -lc "rm -rf '$DEST_PACKAGE' && mv '$DEST_PACKAGE.new' '$DEST_PACKAGE' && chown -R 1000:0 '$DEST_PACKAGE'"
          echo KASM_CLIENT_PACKAGE_STAGED=PASS

      - name: Start client on Kasm desktop
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          home="$(docker exec "$CONTAINER_NAME" /bin/bash -lc "getent passwd 1000 | awk -F: '{print \\$6}'")"
          [[ -n "$home" ]]
          docker exec "$CONTAINER_NAME" /bin/bash -lc "mkdir -p '$home/.local/state/otclient-track-a' && chown -R 1000:0 '$home/.local/state/otclient-track-a'"
          docker exec -d -u 1000 \
            -e DISPLAY=:1 \
            -e HOME="$home" \
            -e QT_QUICK_BACKEND=software \
            -e QSG_INFO=1 \
            -e LD_LIBRARY_PATH="$DEST_PACKAGE/bin/lib" \
            "$CONTAINER_NAME" /bin/bash -lc "cd '$DEST_PACKAGE' && exec ./bin/client >'$home/.local/state/otclient-track-a/tibia-client.log' 2>&1"
          pid=''
          for _ in $(seq 1 40); do
            pid="$(docker exec "$CONTAINER_NAME" /bin/bash -lc "pgrep -o -f '^$DEST_PACKAGE/bin/client$|$DEST_PACKAGE/bin/client' || true")"
            [[ "$pid" =~ ^[1-9][0-9]*$ ]] && break
            sleep .25
          done
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          docker exec "$CONTAINER_NAME" /bin/bash -lc "kill -0 '$pid' && test \"\$(readlink -f /proc/$pid/exe)\" = '$DEST_PACKAGE/bin/client'"
          echo "KASM_CLIENT_PID=$pid"
          echo KASM_CLIENT_PROCESS=PASS

      - name: Verify visible Tibia window on DISPLAY :1
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          found=0
          for _ in $(seq 1 60); do
            if docker exec -u 1000 -e DISPLAY=:1 "$CONTAINER_NAME" /bin/bash -lc '
              if command -v xdotool >/dev/null 2>&1; then
                xdotool search --onlyvisible --name "^Tibia$" >/dev/null 2>&1
              elif command -v wmctrl >/dev/null 2>&1; then
                wmctrl -l | grep -Eq "[[:space:]]Tibia$"
              elif command -v xwininfo >/dev/null 2>&1; then
                xwininfo -root -tree 2>/dev/null | grep -q '"'"'Tibia'"'"'
              else
                exit 2
              fi
            '; then found=1; break; fi
            sleep .5
          done
          [[ "$found" == 1 ]]
          echo KASM_CLIENT_VISIBLE_WINDOW=PASS
          echo KASM_CLIENT_DISPLAY=:1
          echo KASM_CLIENT_SECRET_ACCESS=false
          echo KASM_CLIENT_LOGIN_PERFORMED=false
          echo KASM_CLIENT_START_RESULT=PASS

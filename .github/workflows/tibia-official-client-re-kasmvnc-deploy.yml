name: Track A KasmVNC deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/tibia-official-client-re-kasmvnc-deploy.yml'
      - 'docs/agents/tasks/active/OTC-20260818-track-a-persistent-viewer-handoff.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-kasmvnc-desktop
  cancel-in-progress: true

env:
  TASK_ID: OTC-20260818-track-a-persistent-viewer-handoff
  TASK_FILE: docs/agents/tasks/active/OTC-20260818-track-a-persistent-viewer-handoff.md
  CONTAINER_NAME: otclient-track-a-kasmvnc
  IMAGE: kasmweb/ubuntu-noble-desktop:1.17.0
  HOST_IP: 127.0.0.1
  HOST_PORT: '6901'
  STATE_DIR: /home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-track-a-persistent-viewer-handoff/kasmvnc
  PUBLIC_HOST: synology
  PUBLIC_PORT: '6902'
  PUBLIC_URL: https://synology:6902/
  LEGACY_OBSERVER: http://192.168.1.2:6083/
  KASM_USERNAME: kasm_user

jobs:
  deploy:
    name: Deploy persistent KasmVNC desktop on Synology
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify isolated Track A admission
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == fix/OTC-20260818-track-a-persistent-viewer-handoff ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          grep -q '^runtime_access: ephemeral_isolated$' "$TASK_FILE"
          grep -q '^runtime_owner_task: OTC-20260818-track-a-persistent-viewer-handoff$' "$TASK_FILE"
          grep -q '^runtime_namespace: track-a-kasmvnc-desktop$' "$TASK_FILE"
          grep -q '^target_uniqueness: PROVEN$' "$TASK_FILE"
          grep -q '^mutation_authorized: true$' "$TASK_FILE"
          grep -q '^credentials_allowed: false$' "$TASK_FILE"
          grep -q '^login_allowed: false$' "$TASK_FILE"
          grep -q '^gameplay_allowed: false$' "$TASK_FILE"
          command -v docker >/dev/null
          [[ -S /var/run/docker.sock ]]
          echo KASMVNC_ADMISSION=PASS

      - name: Prove isolation and image
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          owners="$(docker ps --filter publish="$HOST_PORT" --format '{{.Names}}' | sed '/^$/d')"
          [[ -z "$owners" || "$owners" == "$CONTAINER_NAME" ]]
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            [[ "$(docker inspect -f '{{ index .Config.Labels "otclient.task" }}' "$CONTAINER_NAME")" == "$TASK_ID" ]]
            [[ "$(docker inspect -f '{{ index .Config.Labels "otclient.runtime" }}' "$CONTAINER_NAME")" == track-a-kasmvnc-desktop ]]
          fi
          docker pull "$IMAGE"
          echo "KASMVNC_IMAGE_ID=$(docker image inspect -f '{{.Id}}' "$IMAGE")"
          echo "KASMVNC_IMAGE_REPODIGESTS=$(docker image inspect -f '{{join .RepoDigests " "}}' "$IMAGE")"

      - name: Create or reuse persistent desktop
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          mkdir -p "$STATE_DIR"
          chmod 700 "$STATE_DIR"
          password_file="$STATE_DIR/browser-password"
          identity_file="$STATE_DIR/desktop-container-id"
          if [[ ! -s "$password_file" ]]; then
            python3 - <<'PY' > "$password_file"
          import secrets
          alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789_-!@'
          print(''.join(secrets.choice(alphabet) for _ in range(32)))
          PY
            chmod 600 "$password_file"
          fi
          [[ "$(stat -c '%a' "$password_file")" == 600 ]]
          KASM_PASSWORD="$(cat "$password_file")"
          [[ ${#KASM_PASSWORD} -ge 20 ]]

          if ! docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --shm-size=1g \
              -p "$HOST_IP:$HOST_PORT:6901" \
              --label otclient.track=official-client-re \
              --label "otclient.task=$TASK_ID" \
              --label otclient.runtime=track-a-kasmvnc-desktop \
              --label otclient.role=kasmvnc-desktop \
              -e "VNC_PW=$KASM_PASSWORD" \
              -e VNC_RESOLUTION=1920x1080 \
              -e MAX_FRAME_RATE=30 \
              "$IMAGE"
          else
            [[ "$(docker inspect -f '{{.Image}}' "$CONTAINER_NAME")" == "$(docker image inspect -f '{{.Id}}' "$IMAGE")" ]]
            [[ "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$CONTAINER_NAME")" == unless-stopped ]]
            [[ "$(docker inspect -f '{{(index (index .HostConfig.PortBindings "6901/tcp") 0).HostIp}}' "$CONTAINER_NAME")" == "$HOST_IP" ]]
            [[ "$(docker inspect -f '{{(index (index .HostConfig.PortBindings "6901/tcp") 0).HostPort}}' "$CONTAINER_NAME")" == "$HOST_PORT" ]]
            container_password="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$CONTAINER_NAME" | sed -n 's/^VNC_PW=//p' | head -n1)"
            [[ "$container_password" == "$KASM_PASSWORD" ]]
            docker start "$CONTAINER_NAME" >/dev/null || true
            unset container_password
          fi

          container_id="$(docker inspect -f '{{.Id}}' "$CONTAINER_NAME")"
          if [[ -s "$identity_file" ]]; then
            [[ "$(cat "$identity_file")" == "$container_id" ]]
          else
            printf '%s\n' "$container_id" > "$identity_file"
            chmod 600 "$identity_file"
          fi
          unset KASM_PASSWORD
          echo KASMVNC_DESKTOP_IDENTITY=PERSISTED

      - name: Verify local KasmVNC HTTPS backend
        id: backend
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          auth_config="$(mktemp)"
          trap 'rm -f "$auth_config"' EXIT
          chmod 600 "$auth_config"
          printf 'user = "%s:%s"\n' "$KASM_USERNAME" "$(cat "$STATE_DIR/browser-password")" > "$auth_config"
          ready=false
          for _ in $(seq 1 90); do
            if [[ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null || true)" == true ]] && \
               curl -kfsS --config "$auth_config" --max-time 4 "https://$HOST_IP:$HOST_PORT/" -o /tmp/kasm-index.html && \
               [[ -s /tmp/kasm-index.html ]]; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]]
          [[ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" == true ]]
          [[ "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$CONTAINER_NAME")" == unless-stopped ]]
          [[ "$(cat "$STATE_DIR/desktop-container-id")" == "$(docker inspect -f '{{.Id}}' "$CONTAINER_NAME")" ]]
          display="$(docker exec "$CONTAINER_NAME" /bin/bash -lc 'printf %s "${DISPLAY:-}"')"
          [[ "$display" == ':1' ]]
          docker exec "$CONTAINER_NAME" /bin/bash -lc 'test -S /tmp/.X11-unix/X1 && pgrep -x Xvnc >/dev/null'
          echo KASMVNC_HTTPS_BACKEND=PASS
          echo KASMVNC_DESKTOP_PROCESS=PASS

      - name: Safe Kasm startup diagnostics
        if: failure() && steps.backend.outcome == 'failure'
        shell: bash
        run: |
          set +x
          set -u
          echo "KASMVNC_CONTAINER_STATE=$(docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}:restarts={{.RestartCount}}' "$CONTAINER_NAME" 2>/dev/null || echo UNKNOWN)"
          docker exec "$CONTAINER_NAME" /bin/bash -lc 'echo KASMVNC_SAFE_PROCESS_INVENTORY; ps -eo pid,comm | tail -n +2 | head -n 80; echo KASMVNC_SAFE_X11_SOCKET; ls -ld /tmp/.X11-unix /tmp/.X11-unix/X1 2>/dev/null || true; echo KASMVNC_SAFE_VNC_FILES; find "$HOME/.vnc" -maxdepth 1 -type f -printf "%f %s bytes\n" 2>/dev/null | sort || true; echo KASMVNC_SAFE_LISTENERS; (ss -ltn 2>/dev/null || true) | grep -E "(:5901|:6901)[[:space:]]" || true'
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          name = 'otclient-track-a-kasmvnc'
          state = Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-track-a-persistent-viewer-handoff/kasmvnc')
          secret = (state / 'browser-password').read_text().strip()
          cmd = ['docker','exec',name,'/bin/bash','-lc','for f in "$HOME"/.vnc/*.log; do test -f "$f" && cat "$f"; done']
          p = subprocess.run(cmd, capture_output=True, text=True, check=False)
          text = (p.stdout + '\n' + p.stderr).replace(secret, '[REDACTED]')
          needles = ('error','fail','fatal','permission','denied','not found','unsupported','cannot','unable')
          lines = [line for line in text.splitlines() if any(n in line.lower() for n in needles)]
          print('KASMVNC_SAFE_VNC_ERROR_LINES_BEGIN')
          for line in lines[-120:]: print(line[:1000])
          print('KASMVNC_SAFE_VNC_ERROR_LINES_END')
          PY

      - name: Verify DSM HTTPS and WebSocket
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, secrets, socket, ssl, urllib.request
          from pathlib import Path
          password=(Path(os.environ['STATE_DIR'])/'browser-password').read_text().strip()
          auth=base64.b64encode(f"{os.environ['KASM_USERNAME']}:{password}".encode()).decode()
          ctx=ssl._create_unverified_context()
          def fetch(url):
              req=urllib.request.Request(url,headers={'Authorization':f'Basic {auth}','User-Agent':'otclient-kasm-e2e/2'})
              with urllib.request.urlopen(req,context=ctx,timeout=8) as r:
                  body=r.read(4*1024*1024)
                  if r.status!=200 or not body: raise SystemExit('KASMVNC_E2E_ERROR=https')
                  return body
          backend=fetch(f"https://{os.environ['HOST_IP']}:{os.environ['HOST_PORT']}/")
          public=fetch(os.environ['PUBLIC_URL'])
          if hashlib.sha256(backend).digest()!=hashlib.sha256(public).digest(): raise SystemExit('KASMVNC_E2E_ERROR=proxy_body_mismatch')
          def ws(host,port,origin):
              raw=socket.create_connection((host,int(port)),timeout=8); tls=ctx.wrap_socket(raw,server_hostname=host)
              try:
                  key=base64.b64encode(secrets.token_bytes(16)).decode()
                  req=('GET /websockify HTTP/1.1\r\n'+f'Host: {host}:{port}\r\n'+'Upgrade: websocket\r\nConnection: Upgrade\r\n'+f'Origin: {origin}\r\nAuthorization: Basic {auth}\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\nSec-WebSocket-Protocol: binary\r\n\r\n').encode()
                  tls.sendall(req); data=b''
                  while b'\r\n\r\n' not in data and len(data)<32768:
                      chunk=tls.recv(4096)
                      if not chunk: break
                      data+=chunk
                  head=data.split(b'\r\n\r\n',1)[0].decode('iso-8859-1')
                  if ' 101 ' not in head.split('\r\n',1)[0]: raise SystemExit('KASMVNC_E2E_ERROR=websocket_status')
                  expected=base64.b64encode(hashlib.sha1((key+'258EAFA5-E914-47DA-95CA-C5AB0DC85B11').encode()).digest()).decode()
                  headers={}
                  for line in head.split('\r\n')[1:]:
                      if ':' in line:
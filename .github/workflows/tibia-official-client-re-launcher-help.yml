name: Track A official launcher CLI help

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-launcher-help.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      LAUNCHER_SHA256: a5fc6e8ee8246868263c438539a54ea045bd048a1bea45f968fc2f498b682ca0
    steps:
      - name: Print launcher help without starting normal application
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          launcher="$state/launcher-recovery/isolated-31741562880/unpacked/Tibia/Tibia"
          [[ "$(sha256sum "$launcher" | awk '{print $1}')" == "$LAUNCHER_SHA256" ]]
          set +e
          output="$(cd "$(dirname "$launcher")" && "$launcher" --help 2>&1)"
          rc=$?
          set -e
          echo TRACK_A_LAUNCHER_HELP_RC="$rc"
          printf '%s\n' "$output" | head -n 120 | sed 's/^/TRACK_A_LAUNCHER_HELP=/'
          echo TRACK_A_LAUNCHER_HELP_COMPLETE=true

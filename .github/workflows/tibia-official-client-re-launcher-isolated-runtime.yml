name: Track A isolated official launcher runtime

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-launcher-isolated-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      TRACK_WARP_PORT: '25354'
    steps:
      - name: Launch official Linux launcher in isolated Qt runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          phase="OTCLIENT_TIBIA_RE_PHASE=isolated-launcher-$GITHUB_RUN_ID"
          toolroot="$state/toolroot"
          tool_path="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          tool_lib="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          root="$state/launcher-recovery/isolated-$GITHUB_RUN_ID"
          home="$root/home"
          runtime_dir="$root/xdg-runtime"
          unpack="$root/unpacked"
          evidence="$GITHUB_WORKSPACE/artifacts/track-a-isolated-launcher"
          mkdir -p "$home" "$runtime_dir" "$unpack" "$evidence"
          chmod 700 "$root" "$home" "$runtime_dir" "$unpack"

          warp_pid="$(tr -cd '0-9' <"$state/runtime/wireproxy.pid" 2>/dev/null || true)"
          [[ -n "$warp_pid" && -r "/proc/$warp_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$warp_pid/environ"
          kill -0 "$warp_pid"
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" -fsS --max-time 15 \
            https://www.cloudflare.com/cdn-cgi/trace >"$root/warp.txt"
          grep -Eq '^warp=(on|plus)$' "$root/warp.txt"
          echo TRACK_A_ISOLATED_LAUNCHER_WARP_VERIFIED=true

          tarball="$root/tibia.x64.tar.gz"
          url='https://static.tibia.com/download/tibia.x64.tar.gz'
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" --compressed -fL \
            --connect-timeout 20 --max-time 240 --retry 4 --retry-all-errors --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$url" -H 'Accept: */*' "$url" -o "$tarball"
          echo TRACK_A_ISOLATED_TARBALL_SHA256="$(sha256sum "$tarball" | awk '{print $1}')"
          echo TRACK_A_ISOLATED_TARBALL_SIZE="$(stat -c %s "$tarball")"
          python3 - "$tarball" "$unpack" <<'PY'
          import pathlib,sys,tarfile
          with tarfile.open(sys.argv[1],'r:gz') as h:
              for m in h.getmembers():
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit('unsafe archive path')
              try: h.extractall(sys.argv[2],filter='data')
              except TypeError: h.extractall(sys.argv[2])
          PY
          launcher="$unpack/Tibia/Tibia"
          [[ -x "$launcher" ]]
          echo TRACK_A_ISOLATED_LAUNCHER_SHA256="$(sha256sum "$launcher" | awk '{print $1}')"

          proxy_lib="$(find "$toolroot" -type f -name 'libproxychains.so.4' -print -quit)"
          [[ -n "$proxy_lib" ]]
          proxy_conf="$root/proxychains.conf"
          printf '%s\n' strict_chain proxy_dns quiet_mode \
            'tcp_read_time_out 15000' 'tcp_connect_time_out 8000' \
            '[ProxyList]' "socks5 127.0.0.1 $TRACK_WARP_PORT" >"$proxy_conf"
          chmod 600 "$proxy_conf"
          vk_icd="$(find "$toolroot/usr/share/vulkan/icd.d" -type f -name 'lvp_icd*.json' -print -quit 2>/dev/null || true)"
          launcher_dir="$(dirname "$launcher")"
          cd "$launcher_dir"
          env_args=(
            -u RUNNER_TRACKING_ID
            OTCLIENT_TIBIA_RE_TRACK=official-client-re
            "$phase"
            HOME="$home"
            XDG_DATA_HOME="$home/.local/share"
            XDG_CONFIG_HOME="$home/.config"
            XDG_CACHE_HOME="$home/.cache"
            XDG_RUNTIME_DIR="$runtime_dir"
            DISPLAY="$TRACK_DISPLAY"
            PATH="$tool_path"
            LD_LIBRARY_PATH="$launcher_dir:$launcher_dir/lib:$tool_lib"
            LIBGL_ALWAYS_SOFTWARE=1
            QT_QUICK_BACKEND=software
            QT_XCB_GL_INTEGRATION=none
            LD_PRELOAD="$proxy_lib"
            PROXYCHAINS_CONF_FILE="$proxy_conf"
          )
          if [[ -n "$vk_icd" ]]; then env_args+=(VK_ICD_FILENAMES="$vk_icd" VK_DRIVER_FILES="$vk_icd"); fi
          env "${env_args[@]}" nohup "$launcher" >"$evidence/launcher.log" 2>&1 </dev/null &
          launcher_pid=$!
          echo TRACK_A_ISOLATED_LAUNCHER_PID="$launcher_pid"

          child="$home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          last=''; stable=0
          for _ in $(seq 1 120); do
            if [[ -s "$child" ]]; then
              sha="$(sha256sum "$child" | awk '{print $1}')"
              if [[ "$sha" == "$last" ]]; then stable=$((stable+1)); else last="$sha"; stable=0; fi
              (( stable >= 3 )) && break
            fi
            sleep 2
          done
          if [[ -s "$child" && $stable -ge 3 ]]; then
            sha="$(sha256sum "$child" | awk '{print $1}')"
            echo TRACK_A_ISOLATED_CHILD_SHA256="$sha"
            echo TRACK_A_ISOLATED_CHILD_SIZE="$(stat -c %s "$child")"
            python3 - "$child" "$evidence/identity.txt" <<'PY'
          import hashlib,pathlib,re,sys
          data=pathlib.Path(sys.argv[1]).read_bytes(); seen=[]
          for m in re.finditer(rb'15\.[0-9]{2}(?:\.[A-Za-z0-9]+)?',data):
              s=m.group().decode('ascii','ignore')
              if s not in seen: seen.append(s)
          pathlib.Path(sys.argv[2]).write_text('SHA256='+hashlib.sha256(data).hexdigest()+'\nSIZE='+str(len(data))+'\nVERSIONS='+','.join(seen[:20])+'\n',encoding='utf-8')
          print('TRACK_A_ISOLATED_CHILD_VERSION_STRINGS='+','.join(seen[:20]))
          PY
            echo TRACK_A_ISOLATED_CHILD_READY=true
          else
            echo TRACK_A_ISOLATED_CHILD_READY=false
            tail -n 80 "$evidence/launcher.log" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[REDACTED_EMAIL]/g' | sed 's/^/TRACK_A_ISOLATED_LAUNCHER_LOG=/'
            exit 1
          fi

      - name: Upload isolated launcher evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-isolated-launcher
          path: artifacts/track-a-isolated-launcher/**
          if-no-files-found: warn
          retention-days: 7

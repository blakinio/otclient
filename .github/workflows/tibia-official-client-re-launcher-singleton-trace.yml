name: Track A official launcher singleton trace

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-launcher-singleton-trace.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  trace:
    runs-on: [otclient, synology]
    timeout-minutes: 4
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      TRACK_WARP_PORT: '25354'
      LAUNCHER_SHA256: a5fc6e8ee8246868263c438539a54ea045bd048a1bea45f968fc2f498b682ca0
    steps:
      - name: Trace only launcher startup singleton operations
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          source_root="$state/launcher-recovery/isolated-31741562880"
          launcher="$source_root/unpacked/Tibia/Tibia"
          [[ -x "$launcher" ]]
          [[ "$(sha256sum "$launcher" | awk '{print $1}')" == "$LAUNCHER_SHA256" ]]
          command -v strace >/dev/null
          toolroot="$state/toolroot"
          tool_path="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          tool_lib="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          root="$state/launcher-recovery/singleton-trace-$GITHUB_RUN_ID"
          home="$root/home"; runtime_dir="$root/xdg-runtime"; tmp="$root/tmp"
          evidence="$GITHUB_WORKSPACE/artifacts/track-a-launcher-singleton-trace"
          mkdir -p "$home" "$runtime_dir" "$tmp" "$evidence"
          chmod 700 "$root" "$home" "$runtime_dir" "$tmp"

          warp_pid="$(tr -cd '0-9' <"$state/runtime/wireproxy.pid" 2>/dev/null || true)"
          [[ -n "$warp_pid" && -r "/proc/$warp_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$warp_pid/environ"
          kill -0 "$warp_pid"
          proxy_lib="$(find "$toolroot" -type f -name 'libproxychains.so.4' -print -quit)"
          [[ -n "$proxy_lib" ]]
          proxy_conf="$root/proxychains.conf"
          printf '%s\n' strict_chain proxy_dns quiet_mode \
            'tcp_read_time_out 15000' 'tcp_connect_time_out 8000' \
            '[ProxyList]' "socks5 127.0.0.1 $TRACK_WARP_PORT" >"$proxy_conf"
          chmod 600 "$proxy_conf"

          raw="$root/trace.log"
          launcher_dir="$(dirname "$launcher")"
          cd "$launcher_dir"
          set +e
          timeout 20s env -u RUNNER_TRACKING_ID \
            OTCLIENT_TIBIA_RE_TRACK=official-client-re \
            OTCLIENT_TIBIA_RE_PHASE="singleton-trace-$GITHUB_RUN_ID" \
            HOME="$home" XDG_DATA_HOME="$home/.local/share" XDG_CONFIG_HOME="$home/.config" \
            XDG_CACHE_HOME="$home/.cache" XDG_RUNTIME_DIR="$runtime_dir" TMPDIR="$tmp" \
            DISPLAY="$TRACK_DISPLAY" PATH="$tool_path" \
            LD_LIBRARY_PATH="$launcher_dir:$launcher_dir/lib:$tool_lib" \
            LIBGL_ALWAYS_SOFTWARE=1 QT_QUICK_BACKEND=software QT_XCB_GL_INTEGRATION=none \
            LD_PRELOAD="$proxy_lib" PROXYCHAINS_CONF_FILE="$proxy_conf" \
            strace -f -qq -s 220 -o "$raw" -e trace=%file,%process,%network,%ipc,fcntl "$launcher" \
            >"$root/stdout.log" 2>"$root/stderr.log"
          rc=$?
          set -e
          echo TRACK_A_SINGLETON_TRACE_LAUNCHER_RC="$rc"
          [[ -s "$raw" ]]
          python3 - "$raw" "$evidence/singleton-relevant.txt" "$state" "$root" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          state=sys.argv[3]; root=sys.argv[4]
          terms=re.compile(r'(connect\(|bind\(|listen\(|/tmp|/dev/shm|/proc/|runtime|lock|\.pid|socket|localserver|shared|semaphore|sem\.|shm|Tibia)',re.I)
          out=[]
          for line in text.splitlines():
              if terms.search(line):
                  line=line.replace(state,'[STATE]').replace(root,'[TRACE_ROOT]')
                  line=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+','[REDACTED_EMAIL]',line)
                  out.append(line)
          pathlib.Path(sys.argv[2]).write_text('\n'.join(out[-500:])+'\n',encoding='utf-8')
          print('TRACK_A_SINGLETON_RELEVANT_LINE_COUNT='+str(len(out)))
          PY
          tail -n 120 "$evidence/singleton-relevant.txt" | sed 's/^/TRACK_A_SINGLETON_TRACE=/'
          echo TRACK_A_SINGLETON_TRACE_COMPLETE=true

      - name: Upload singleton trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-launcher-singleton-trace
          path: artifacts/track-a-launcher-singleton-trace/**
          if-no-files-found: warn
          retention-days: 7

name: Track A launcher singleton string context

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-launcher-string-context.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      LAUNCHER_SHA256: a5fc6e8ee8246868263c438539a54ea045bd048a1bea45f968fc2f498b682ca0
    steps:
      - name: Read bounded printable context around singleton message
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          launcher="$state/launcher-recovery/isolated-31741562880/unpacked/Tibia/Tibia"
          [[ -r "$launcher" ]]
          [[ "$(sha256sum "$launcher" | awk '{print $1}')" == "$LAUNCHER_SHA256" ]]
          python3 - "$launcher" <<'PY'
          import pathlib,re,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          needle=b'Application is already running, stopping startup.'
          pos=data.find(needle)
          if pos < 0: raise SystemExit('message not found')
          print(f'TRACK_A_SINGLETON_MESSAGE_OFFSET=0x{pos:x}')
          lo=max(0,pos-32768); hi=min(len(data),pos+32768)
          keep=('running','startup','instance','process','launcher','client','tibia','lock','socket','local','shared','pid','update','application')
          found=[]
          for m in re.finditer(rb'[ -~]{6,}',data[lo:hi]):
              s=m.group().decode('ascii','replace')
              if any(k in s.lower() for k in keep):
                  found.append((lo+m.start(),s[:220]))
          print('TRACK_A_SINGLETON_CONTEXT_COUNT='+str(len(found)))
          for off,s in found[:120]: print(f'TRACK_A_SINGLETON_CONTEXT=0x{off:x}|{s}')
          print('TRACK_A_SINGLETON_STRING_CONTEXT_COMPLETE=true')
          PY

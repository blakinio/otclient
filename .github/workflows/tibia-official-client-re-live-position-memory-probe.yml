name: Track A live cecf40 position reference probe
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-live-position-memory-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-client-re-position-memory-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [otclient, synology]
    timeout-minutes: 2
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Read referenced 12-byte tuples from live process memory
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          runtime="$state/runtime"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          pid="$(tr -cd '0-9' <"$runtime/client.pid")"
          gdb_pid="$(tr -cd '0-9' <"$runtime/dynamic-map-gdb.pid")"
          kill -0 "$pid"; kill -0 "$gdb_pid"
          grep -azFxq "$marker" "/proc/$pid/environ"
          log="$runtime/dynamic-map-events.log"
          python3 - "$pid" "$log" <<'PY'
          import os,re,struct,sys
          pid=int(sys.argv[1]); log=sys.argv[2]
          text=open(log,'r',errors='replace').read()
          ptrs=[]
          for m in re.finditer(r'^ARG cecf40 .*?pos_ref=(0x[0-9a-fA-F]+)', text, re.M):
              p=int(m.group(1),16)
              if p not in ptrs: ptrs.append(p)
          print(f'TRACK_A_CECF40_POS_REF_COUNT={len(ptrs)}')
          if not ptrs:
              raise SystemExit(0)
          try:
              mem=open(f'/proc/{pid}/mem','rb',buffering=0)
          except OSError as e:
              print(f'TRACK_A_PROC_MEM_OPEN_ERROR={e.errno}:{e.strerror}')
              raise SystemExit(2)
          with mem:
              for i,p in enumerate(ptrs):
                  try:
                      mem.seek(p+0x18)
                      b=mem.read(12)
                  except OSError as e:
                      print(f'POSREF index={i} ptr=0x{p:x} read_error={e.errno}:{e.strerror}')
                      continue
                  if len(b)!=12:
                      print(f'POSREF index={i} ptr=0x{p:x} short_read={len(b)}')
                      continue
                  a,bv,c=struct.unpack('<III',b)
                  print(f'POSREF index={i} ptr=0x{p:x} raw12={b.hex()} u32_0={a} u32_1={bv} u32_2={c}')
          PY

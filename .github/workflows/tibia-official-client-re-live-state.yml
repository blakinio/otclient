name: Track A official-client RE live state

on:
  workflow_dispatch:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-live-state.yml

permissions:
  contents: read

concurrency:
  group: official-client-re-live-state
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      TRACK_ID: official-client-re
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      TRACK_WARP_PORT: '25354'
    steps:
      - name: Checkout exact Track A head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify isolated native-Linux Track A namespace
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$(uname -s)" == Linux ]]

          if [[ -d /work && -w /work ]]; then
            state="$LEGACY_IMAGE_STATE"
          else
            state="$CANONICAL_STATE"
          fi
          mkdir -p "$state"/{runtime,cache,artifacts,checkpoints,home}
          chmod 700 "$state" "$state"/{runtime,cache,artifacts,checkpoints,home}
          test -w "$state"
          printf '%s\n' "$state" >"$state/checkpoints/live-state-root.txt"

          [[ "$TRACK_DISPLAY" == :98 ]]
          [[ "$TRACK_WARP_PORT" == 25354 ]]
          echo TRACK_A_RUNTIME_PLATFORM=native-linux
          echo TRACK_A_STATE_ROOT="$state"
          echo TRACK_A_DISPLAY="$TRACK_DISPLAY"
          echo TRACK_A_WARP_PORT="$TRACK_WARP_PORT"
          echo TRACK_A_NAMESPACE_VERIFIED=true

      - name: Inspect only Track A owned runtime markers
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          pid_file="$state/runtime/client.pid"
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          owned=false
          if [[ -s "$pid_file" ]]; then
            pid="$(tr -cd '0-9' <"$pid_file")"
            if [[ -n "$pid" && -r "/proc/$pid/environ" ]] && tr '\0' '\n' <"/proc/$pid/environ" | grep -Fxq "$marker"; then
              exe="$(readlink -f "/proc/$pid/exe")"
              [[ "$(basename "$exe")" == client ]]
              echo TRACK_A_CLIENT_PID="$pid"
              echo TRACK_A_CLIENT_EXE_BASENAME=client
              owned=true
            else
              echo TRACK_A_STALE_PID_FILE=true
            fi
          fi
          echo TRACK_A_OWNED_CLIENT_RUNNING="$owned"

          display_owned=false
          [[ -s "$state/runtime/xvfb.pid" ]] && display_owned=true
          echo TRACK_A_DISPLAY_PID_MARKER_PRESENT="$display_owned"
          port_owned=false
          [[ -s "$state/runtime/wireproxy.pid" ]] && port_owned=true
          echo TRACK_A_WARP_PID_MARKER_PRESENT="$port_owned"
          echo TRACK_A_READONLY_RUNTIME_INSPECTION=true

      - name: Inventory required direct-runner capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(bash curl file gdb python3 proxychains4 socat xdotool Xvfb)
          missing=()
          for tool in "${required[@]}"; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          echo TRACK_A_REQUIRED_TOOL_COUNT="${#required[@]}"
          echo TRACK_A_MISSING_TOOL_COUNT="${#missing[@]}"
          if ((${#missing[@]})); then
            printf 'TRACK_A_MISSING_TOOL=%s\n' "${missing[@]}"
          fi
          if command -v tesseract >/dev/null 2>&1; then
            echo TRACK_A_OCR_BINARY_PRESENT=true
          else
            echo TRACK_A_OCR_BINARY_PRESENT=false
          fi
          echo TRACK_A_DIRECT_RUNNER_CAPABILITY_PROBE_COMPLETE=true

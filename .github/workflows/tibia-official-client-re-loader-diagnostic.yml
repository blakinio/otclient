name: Track A exact-client loader differential

on:
  push:
    branches: [research/OTC-20260815-track-a-runtime-loader-diagnostic]
    paths:
      - .github/workflows/tibia-official-client-re-loader-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
    steps:
      - name: Compare loader resolution without launching client
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -s)" == Linux ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          runtime="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$runtime/bin/client"
          toolroot="$state/toolroot"
          tool_lib="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          current_lib="$runtime/bin/lib:$toolroot/usr/lib/x86_64-linux-gnu/libproxy:$tool_lib"
          positive_lib="$runtime/lib:$tool_lib"
          [[ -x "$client" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo TRACK_A_LOADER_EXACT_CLIENT_VERIFIED=true

          interpreter_file="$RUNNER_TEMP/track-a-interpreter.txt"
          python3 - "$client" "$interpreter_file" <<'PY'
          import struct,sys
          path,out=sys.argv[1:]
          data=open(path,'rb').read()
          if data[:4] != b'\x7fELF' or data[4] != 2 or data[5] != 1:
              raise SystemExit('expected little-endian ELF64')
          phoff=struct.unpack_from('<Q',data,32)[0]
          phentsize=struct.unpack_from('<H',data,54)[0]
          phnum=struct.unpack_from('<H',data,56)[0]
          ph=[]
          for i in range(phnum):
              off=phoff+i*phentsize
              p_type,p_flags,p_offset,p_vaddr,p_paddr,p_filesz,p_memsz,p_align=struct.unpack_from('<IIQQQQQQ',data,off)
              ph.append((p_type,p_offset,p_vaddr,p_filesz,p_memsz))
          interp=''; dynamic=None; loads=[]
          for p_type,p_offset,p_vaddr,p_filesz,p_memsz in ph:
              if p_type==3: interp=data[p_offset:p_offset+p_filesz].split(b'\0',1)[0].decode()
              elif p_type==2: dynamic=(p_offset,p_filesz)
              elif p_type==1: loads.append((p_vaddr,p_vaddr+p_memsz,p_offset,p_filesz))
          if not interp or dynamic is None: raise SystemExit('missing ELF interpreter/dynamic segment')
          def va_to_off(va):
              for lo,hi,fo,fs in loads:
                  if lo <= va < hi and va-lo < fs: return fo+(va-lo)
              raise SystemExit(f'unmapped VA 0x{va:x}')
          entries=[]; strtab_va=None; strsz=None
          doff,dsize=dynamic
          for off in range(doff,doff+dsize,16):
              tag,val=struct.unpack_from('<qQ',data,off)
              if tag==0: break
              entries.append((tag,val))
              if tag==5: strtab_va=val
              elif tag==10: strsz=val
          if strtab_va is None or strsz is None: raise SystemExit('missing dynamic string table')
          so=va_to_off(strtab_va); strings=data[so:so+strsz]
          def dynstr(idx):
              end=strings.find(b'\0',idx)
              if end < 0: end=len(strings)
              return strings[idx:end].decode('utf-8','replace')
          needed=[dynstr(v) for t,v in entries if t==1]
          rpath=[dynstr(v) for t,v in entries if t==15]
          runpath=[dynstr(v) for t,v in entries if t==29]
          open(out,'w',encoding='utf-8').write(interp+'\n')
          print(f'TRACK_A_LOADER_INTERPRETER={interp}')
          print('TRACK_A_LOADER_DYNAMIC_TAGS_BEGIN=true')
          for value in needed: print(f'NEEDED {value}')
          for value in rpath: print(f'RPATH {value}')
          for value in runpath: print(f'RUNPATH {value}')
          print('TRACK_A_LOADER_DYNAMIC_TAGS_END=true')
          PY
          interpreter="$(head -n1 "$interpreter_file")"
          [[ -x "$interpreter" ]]

          echo TRACK_A_LOADER_LAYOUT_BEGIN=true
          for d in "$runtime/lib" "$runtime/bin/lib" "$toolroot/usr/lib/x86_64-linux-gnu" "$toolroot/usr/lib/x86_64-linux-gnu/libproxy"; do
            if [[ -d "$d" ]]; then
              printf 'DIR %s\n' "$d"
              find "$d" -maxdepth 1 \( -type f -o -type l \) \
                \( -name 'libQt6*.so*' -o -name 'libEGL.so*' -o -name 'libGLX.so*' -o -name 'libGL.so*' -o -name 'libproxy*.so*' -o -name 'libpxbackend*.so*' \) \
                -printf '%f\n' | sort
            else
              printf 'MISSING_DIR %s\n' "$d"
            fi
          done
          echo TRACK_A_LOADER_LAYOUT_END=true

          list_case() {
            local label="$1" libs="$2" output rc
            output="$RUNNER_TEMP/loader-$label.txt"
            set +e
            env -u LD_PRELOAD LD_LIBRARY_PATH="$libs" "$interpreter" --list "$client" >"$output" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" >"$RUNNER_TEMP/loader-$label.rc"
            echo "TRACK_A_LOADER_CASE_BEGIN=$label"
            echo "TRACK_A_LOADER_CASE_RC=$label:$rc"
            sed -E 's/[[:space:]]+/ /g' "$output" | sed 's/^ //'
            echo "TRACK_A_LOADER_CASE_END=$label"
          }
          list_case positive "$positive_lib"
          list_case current "$current_lib"

          python3 - "$RUNNER_TEMP/loader-positive.txt" "$RUNNER_TEMP/loader-current.txt" "$RUNNER_TEMP/loader-positive.rc" "$RUNNER_TEMP/loader-current.rc" <<'PY'
          import re,sys
          def parse(path):
              out={}
              for line in open(path,encoding='utf-8',errors='replace'):
                  m=re.match(r'\s*(\S+)\s+=>\s+(\S+)',line)
                  if m: out[m.group(1)]=m.group(2)
              return out
          a=parse(sys.argv[1]); b=parse(sys.argv[2])
          arc=int(open(sys.argv[3]).read()); brc=int(open(sys.argv[4]).read())
          keys=sorted(set(a)|set(b)); diffs=[]
          for k in keys:
              av=a.get(k,'MISSING'); bv=b.get(k,'MISSING')
              if av!=bv: diffs.append((k,av,bv))
          print(f'TRACK_A_LOADER_POSITIVE_STYLE_RC={arc}')
          print(f'TRACK_A_LOADER_CURRENT_STYLE_RC={brc}')
          print(f'TRACK_A_LOADER_RESOLUTION_DIFF_COUNT={len(diffs)}')
          for k,av,bv in diffs: print(f'LOADER_DIFF name={k} positive={av} current={bv}')
          qt=[d for d in diffs if d[0].startswith('libQt6')]
          gl=[d for d in diffs if d[0].startswith(('libEGL','libGL','libGLX'))]
          proxy=[d for d in diffs if 'proxy' in d[0].lower() or 'pxbackend' in d[0].lower()]
          print(f'TRACK_A_LOADER_QT_DIFF_COUNT={len(qt)}')
          print(f'TRACK_A_LOADER_GL_DIFF_COUNT={len(gl)}')
          print(f'TRACK_A_LOADER_PROXY_DIFF_COUNT={len(proxy)}')
          print('TRACK_A_LOADER_DIFFERENTIAL_COMPLETE=true')
          if brc != 0: raise SystemExit('current-style loader resolution failed')
          PY

          echo TRACK_A_QT_PLATFORM_CONFIG_BEGIN=true
          for q in "$runtime/bin/qt.conf" "$runtime/qt.conf"; do
            if [[ -f "$q" ]]; then
              echo "QT_CONF $q"
              if grep -Eiq '(password|credential|token|cookie|session|email)' "$q"; then
                echo TRACK_A_QT_CONF_REJECTED_SENSITIVE_KEY=true
                exit 1
              fi
              sed -n '1,80p' "$q"
            fi
          done
          echo TRACK_A_QT_PLATFORM_CONFIG_END=true

          echo TRACK_A_QT_PLATFORM_PLUGINS_BEGIN=true
          find "$runtime/bin" -maxdepth 5 -type f \
            \( -name 'libqxcb.so' -o -name 'libqxcb-glx-integration.so' -o -name 'libqxcb-egl-integration.so' -o -name 'libqoffscreen.so' -o -name 'libqminimal.so' \) \
            -printf '%P\n' | sort
          echo TRACK_A_QT_PLATFORM_PLUGINS_END=true

          if command -v ldd >/dev/null 2>&1; then
            while IFS= read -r plugin; do
              [[ -n "$plugin" ]] || continue
              path="$runtime/bin/$plugin"
              echo "TRACK_A_QT_PLUGIN_LDD_BEGIN=$plugin"
              set +e
              env -u LD_PRELOAD LD_LIBRARY_PATH="$current_lib" ldd "$path" 2>&1 \
                | grep -E 'libQt6|libEGL|libGLX|libOpenGL|libX11|libxcb|not found' || true
              rc=${PIPESTATUS[0]}
              set -e
              echo "TRACK_A_QT_PLUGIN_LDD_RC=$plugin:$rc"
              echo "TRACK_A_QT_PLUGIN_LDD_END=$plugin"
            done < <(find "$runtime/bin" -maxdepth 5 -type f \
              \( -name 'libqxcb.so' -o -name 'libqxcb-glx-integration.so' -o -name 'libqxcb-egl-integration.so' \) -printf '%P\n' | sort)
          else
            echo TRACK_A_QT_PLUGIN_LDD_UNAVAILABLE=true
          fi
          echo TRACK_A_QT_PLATFORM_DIAGNOSTIC_COMPLETE=true

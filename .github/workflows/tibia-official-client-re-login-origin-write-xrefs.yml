name: Track A login origin and final write xrefs

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-login-origin-write-xrefs.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 12
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
      LOGIN_CONNECT_CALL: '0x7d564f'
      QIODEVICE_WRITE_PLT: '0x4de370'
      LOGIN_SLOT_TARGET: '0xbd36a0'
    steps:
      - name: Recover enclosing FDEs, direct callers and QIODevice write xrefs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          gdb="$toolroot/usr/bin/gdb"
          [[ -x "$client" && -x "$gdb" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          report="$RUNNER_TEMP/track-a-login-origin-write-xrefs.txt"
          plan="$RUNNER_TEMP/track-a-xref-disassembly-plan.txt"
          frames="$RUNNER_TEMP/track-a-frames.txt"
          : >"$report"; : >"$plan"
          exec > >(tee -a "$report") 2>&1

          echo TRACK_A_LOGIN_ORIGIN_WRITE_XREFS_BEGIN=true
          echo "CLIENT_SHA256=$EXPECTED_CLIENT_SHA256"
          echo "CLIENT_SIZE=$EXPECTED_CLIENT_SIZE"
          echo "LOGIN_CONNECT_CALL=$LOGIN_CONNECT_CALL"
          echo "QIODEVICE_WRITE_PLT=$QIODEVICE_WRITE_PLT"

          readelf --debug-dump=frames "$client" >"$frames"
          python3 -u - "$client" "$frames" "$plan" <<'PY'
          import re,struct,sys
          client,frames_path,plan_path=sys.argv[1:]
          data=open(client,'rb').read()
          login=0x7d564f
          qwrite=0x4de370
          slot=0xbd36a0

          phoff=struct.unpack_from('<Q',data,0x20)[0]
          phentsz=struct.unpack_from('<H',data,0x36)[0]
          phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,fo,va,_,fsz,msz,_=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1 and fsz:
                  loads.append((fo,fo+fsz,va,va+msz,flags))
          execs=[x for x in loads if x[4]&1]
          if len(execs)!=1:
              print(f'EXEC_SEGMENT_COUNT={len(execs)}')
          def va_to_off(va):
              for fs,fe,base,vend,flags in loads:
                  if base<=va<base+(fe-fs): return fs+(va-base)
          def off_to_va(off):
              for fs,fe,base,vend,flags in loads:
                  if fs<=off<fe:return base+(off-fs)
          def direct_call_sites(target):
              sites=[]
              for fs,fe,base,vend,flags in execs:
                  blob=data[fs:fe]
                  start=0
                  while True:
                      p=blob.find(b'\xe8',start)
                      if p<0:break
                      if p+5<=len(blob):
                          site=base+p
                          got=(site+5+struct.unpack_from('<i',blob,p+1)[0]) & 0xffffffffffffffff
                          if got==target:sites.append(site)
                      start=p+1
              return sites

          text=open(frames_path,errors='replace').read().splitlines()
          fdes=[]
          for line in text:
              m=re.search(r'pc=([0-9a-fA-F]+)\.\.([0-9a-fA-F]+)',line)
              if m:
                  fdes.append((int(m.group(1),16),int(m.group(2),16)))
          print(f'FDE_COUNT={len(fdes)}')
          def containing(addr):
              return [(a,b) for a,b in fdes if a<=addr<b]

          login_fdes=containing(login)
          print(f'LOGIN_CONNECT_FDE_COUNT={len(login_fdes)}')
          for a,b in login_fdes:
              print(f'LOGIN_CONNECT_FDE start=0x{a:x} end=0x{b:x} size=0x{b-a:x}')
              callers=direct_call_sites(a)
              print(f'LOGIN_ENCLOSING_START_CALLERS target=0x{a:x} count={len(callers)} sites={",".join(hex(x) for x in callers[:128]) if callers else "none"}')

          qsites=direct_call_sites(qwrite)
          print(f'QIODEVICE_WRITE_DIRECT_CALL_COUNT={len(qsites)}')
          print('QIODEVICE_WRITE_DIRECT_CALL_SITES='+(','.join(hex(x) for x in qsites) if qsites else 'none'))
          funcs=[]
          for site in qsites:
              cf=containing(site)
              print(f'QIODEVICE_WRITE_CALL_FDE site=0x{site:x} count={len(cf)} ranges={",".join(f"0x{a:x}-0x{b:x}" for a,b in cf) if cf else "none"}')
              funcs += cf

          slot_callers=direct_call_sites(slot)
          print(f'LOGIN_SLOT_TARGET_DIRECT_CALL_COUNT={len(slot_callers)}')
          print('LOGIN_SLOT_TARGET_DIRECT_CALL_SITES='+(','.join(hex(x) for x in slot_callers) if slot_callers else 'none'))

          unique=[]
          for a,b in login_fdes+funcs:
              if (a,b) not in unique:unique.append((a,b))
          # Also inspect direct callers of the enclosing login function, using their FDEs.
          for a,b in login_fdes:
              for site in direct_call_sites(a):
                  for x in containing(site):
                      if x not in unique:unique.append(x)
          with open(plan_path,'w') as f:
              for a,b in unique[:32]:
                  f.write(f'0x{a:x} 0x{b:x}\n')
          print(f'DISASSEMBLY_FDE_PLAN_COUNT={len(unique[:32])}')
          PY

          echo QIODEVICE_WRITE_SYMBOL_BEGIN=true
          "$gdb" -q -nx -batch "$client" -ex 'set pagination off' \
            -ex 'info symbol 0x4de370' -ex 'info functions QIODevice::write' || true
          echo QIODEVICE_WRITE_SYMBOL_END=true

          while read -r lo hi; do
            [[ "$lo" =~ ^0x[0-9a-f]+$ && "$hi" =~ ^0x[0-9a-f]+$ ]] || continue
            echo "FDE_DISASSEMBLY_BEGIN lo=$lo hi=$hi"
            "$gdb" -q -nx -batch "$client" -ex 'set pagination off' -ex 'set disassembly-flavor intel' -ex "disassemble /r $lo,$hi" || true
            echo "FDE_DISASSEMBLY_END lo=$lo hi=$hi"
          done <"$plan"

          echo TRACK_A_LOGIN_ORIGIN_WRITE_XREFS_COMPLETE=true
          grep -q '^TRACK_A_LOGIN_ORIGIN_WRITE_XREFS_COMPLETE=true$' "$report"

      - name: Upload exact-version structural report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-login-origin-write-xrefs-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-login-origin-write-xrefs.txt
          if-no-files-found: error
          retention-days: 7

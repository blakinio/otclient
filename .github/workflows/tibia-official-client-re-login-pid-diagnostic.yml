name: Track A login PID handoff diagnostic

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-login-pid-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [otclient, synology]
    timeout-minutes: 15
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      TRACK_WARP_PORT: '25354'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
      TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Reproduce login and diagnose PID handoff
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          runtime="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$runtime/bin/client"
          toolroot="$state/toolroot"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]

          set +e
          bash "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-autonomous-world-login.sh"
          flow_rc=$?
          set -e
          echo TRACK_A_BASELINE_FLOW_RC="$flow_rc"
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD

          old_pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          echo TRACK_A_RECORDED_CLIENT_PID="${old_pid:-none}"
          if [[ -n "$old_pid" ]] && kill -0 "$old_pid" 2>/dev/null; then
            echo TRACK_A_RECORDED_CLIENT_STILL_ALIVE=true
          else
            echo TRACK_A_RECORDED_CLIENT_STILL_ALIVE=false
          fi

          matches=0
          replacement=''
          for p in /proc/[0-9]*; do
            candidate="${p##*/}"
            [[ -r "$p/environ" ]] || continue
            grep -azFxq "$marker" "$p/environ" 2>/dev/null || continue
            exe="$(readlink -f "$p/exe" 2>/dev/null || true)"
            [[ "$exe" == "$client" ]] || continue
            matches=$((matches+1))
            echo TRACK_A_OWNED_EXACT_CLIENT_PID="$candidate"
            if [[ "$candidate" != "$old_pid" ]]; then replacement="$candidate"; fi
          done
          echo TRACK_A_OWNED_EXACT_CLIENT_COUNT="$matches"
          echo TRACK_A_REPLACEMENT_CLIENT_PID="${replacement:-none}"

          if [[ -n "$replacement" ]]; then
            printf '%s\n' "$replacement" >"$state/runtime/client.pid"
            chmod 600 "$state/runtime/client.pid"
            pid="$replacement"
            echo TRACK_A_CLIENT_PID_HANDOFF_PROVEN=true
            python3 - "$pid" "$TRACK_WARP_PORT" <<'PY'
import os,pathlib,sys
pid,port=sys.argv[1],int(sys.argv[2]); ino=set()
for fd in pathlib.Path('/proc',pid,'fd').iterdir():
    try:t=os.readlink(fd)
    except OSError:continue
    if t.startswith('socket:['):ino.add(t[8:-1])
local=direct=udp=0
for name,is_udp in [('tcp',0),('tcp6',0),('udp',1),('udp6',1)]:
    try:rows=pathlib.Path('/proc',pid,'net',name).read_text().splitlines()[1:]
    except OSError:continue
    for row in rows:
        c=row.split()
        if len(c)<10 or c[9] not in ino:continue
        rp=int(c[2].rsplit(':',1)[1],16)
        if is_udp:udp+=1
        elif c[3]=='01':
            if rp==port:local+=1
            else:direct+=1
print(f'TRACK_A_REPLACEMENT_LOCAL_SOCKS={local}')
print(f'TRACK_A_REPLACEMENT_DIRECT_TCP={direct}')
print(f'TRACK_A_REPLACEMENT_UDP={udp}')
PY
          else
            echo TRACK_A_CLIENT_PID_HANDOFF_PROVEN=false
          fi

          log="$state/runtime/client.log"
          if [[ -s "$log" ]]; then
            echo TRACK_A_CLIENT_LOG_PRESENT=true
            python3 - "$log" <<'PY'
import re,sys
p=sys.argv[1]
pat=re.compile(r'(fatal|critical|error|crash|signal|segmentation|abort|vulkan|battleye|disconnect|exception)',re.I)
try: lines=open(p,'r',errors='replace').read().splitlines()[-300:]
except OSError: lines=[]
for line in lines:
    if pat.search(line):
        line=re.sub(r'(?i)[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}','<redacted-email>',line)
        line=re.sub(r'\b[A-Za-z0-9_\-]{32,}\b','<redacted-token>',line)
        print('TRACK_A_CLIENT_LOG_SIGNAL='+line[:500])
PY
          else
            echo TRACK_A_CLIENT_LOG_PRESENT=false
          fi

          echo TRACK_A_PID_HANDOFF_DIAGNOSTIC_COMPLETE=true

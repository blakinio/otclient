name: Track A official login receiver static recovery

on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-login-receiver-static.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: "51965216"
    steps:
      - name: Resolve primary login receiver class and vtable candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          [[ -x "$client" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          gdb="$toolroot/usr/bin/gdb"; [[ -x "$gdb" ]]
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"

          report="$RUNNER_TEMP/track-a-login-receiver-static.txt"
          dis="$RUNNER_TEMP/login-wiring.dis"
          exec > >(tee -a "$report") 2>&1
          echo 'TRACK_A_LOGIN_RECEIVER_STATIC_BEGIN=true'
          echo "CLIENT_SHA256=$EXPECTED_CLIENT_SHA256"

          "$gdb" -q -nx -batch "$client" \
            -ex 'set pagination off' \
            -ex 'set disassembly-flavor intel' \
            -ex 'disassemble /r 0x7d4800,0x7d5b00' > "$dis"
          echo 'LOGIN_WIRING_DISASSEMBLY_BEGIN=true'
          cat "$dis"
          echo 'LOGIN_WIRING_DISASSEMBLY_END=true'
          echo 'LOGIN_RECEIVER_OFFSET_0X88_WRITES_BEGIN=true'
          grep -E '\[rbx\+0x88\]|\[r[a-z0-9]+\+0x88\]' "$dis" || true
          echo 'LOGIN_RECEIVER_OFFSET_0X88_WRITES_END=true'

          python3 -u - "$client" <<'PY'
          import struct,sys
          path=sys.argv[1]; data=open(path,'rb').read()
          phoff=struct.unpack_from('<Q',data,0x20)[0]
          phentsz=struct.unpack_from('<H',data,0x36)[0]
          phnum=struct.unpack_from('<H',data,0x38)[0]
          segs=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,fo,va,_,fsz,msz,_=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1 and fsz: segs.append((fo,fo+fsz,va,flags))
          def off_to_va(off):
              for fs,fe,base,flags in segs:
                  if fs<=off<fe:return base+(off-fs)
          def va_to_off(va):
              for fs,fe,base,flags in segs:
                  if base<=va<base+(fe-fs):return fs+(va-base)
          def executable(va):
              for fs,fe,base,flags in segs:
                  if base<=va<base+(fe-fs):return bool(flags&1)
              return False
          target=0xbd36a0
          needle=struct.pack('<Q',target)
          print('SLOT_TARGET_QWORD_REFS_BEGIN=true')
          pos=0; hits=[]
          while True:
              p=data.find(needle,pos)
              if p<0:break
              va=off_to_va(p)
              if va is not None:hits.append(va)
              pos=p+1
          print(f'SLOT_TARGET_QWORD_REF_COUNT={len(hits)}')
          for va in hits[:128]:
              print(f'SLOT_TARGET_QWORD_REF va=0x{va:x}')
          print('SLOT_TARGET_QWORD_REFS_END=true')

          # Enumerate plausible vtables around any qword reference to the slot target.
          print('VTABLE_CONTEXT_BEGIN=true')
          for hit in hits[:128]:
              for delta in range(0,0x101,8):
                  base=hit-delta
                  off=va_to_off(base)
                  if off is None or off+0x100>len(data):continue
                  vals=[struct.unpack_from('<Q',data,off+i)[0] for i in range(0,0x100,8)]
                  code=sum(1 for v in vals[2:] if executable(v))
                  if code>=8:
                      slot68=vals[0x68//8] if len(vals)>0x68//8 else 0
                      print(f'VTABLE_CANDIDATE base=0x{base:x} target_entry_offset=0x{delta:x} code_entries={code} slot68=0x{slot68:x} slot68_exec={str(executable(slot68)).lower()}')
          print('VTABLE_CONTEXT_END=true')

          # Direct and RIP-relative code references to the nonvirtual slot target.
          print('SLOT_TARGET_CODE_XREFS_BEGIN=true')
          for fs,fe,base,flags in [s for s in segs if s[3]&1]:
              blob=data[fs:fe]
              for p in range(len(blob)-7):
                  va=base+p
                  if blob[p]==0xe8:
                      dst=va+5+struct.unpack_from('<i',blob,p+1)[0]
                      if dst==target:print(f'DIRECT_CALL_XREF site=0x{va:x}')
                  if 0x40<=blob[p]<=0x4f and blob[p+1] in (0x8d,0x8b):
                      modrm=blob[p+2]
                      if (modrm&0xc7)==0x05:
                          dst=va+7+struct.unpack_from('<i',blob,p+3)[0]
                          if dst==target:print(f'RIP_REF site=0x{va:x}')
          print('SLOT_TARGET_CODE_XREFS_END=true')
          PY

          echo 'TRACK_A_LOGIN_RECEIVER_STATIC_COMPLETE=true'

      - name: Upload exact-version receiver recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-login-receiver-static-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-login-receiver-static.txt
          if-no-files-found: error
          retention-days: 7

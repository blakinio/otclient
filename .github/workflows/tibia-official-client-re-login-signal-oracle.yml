name: Track A official game-login signal oracle

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-login-signal-oracle.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: "51965216"
    steps:
      - name: Classify login signal wrappers and recover connection provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          [[ -x "$client" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          gdb="$toolroot/usr/bin/gdb"
          [[ -x "$gdb" ]]
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"

          report="$RUNNER_TEMP/track-a-login-signal-oracle.txt"
          xrefs="$RUNNER_TEMP/track-a-login-signal-xrefs.txt"
          : >"$report"; : >"$xrefs"
          exec > >(tee -a "$report") 2>&1

          echo 'TRACK_A_LOGIN_SIGNAL_ORACLE_BEGIN=true'
          echo "CLIENT_SHA256=$EXPECTED_CLIENT_SHA256"
          echo "CLIENT_SIZE=$EXPECTED_CLIENT_SIZE"
          echo 'LOGIN_QMETA=0x3084fa0'
          echo 'SEND_LOGIN_MESSAGE=0xcf2ca0'
          echo 'SEND_SECONDARY_LOGIN_MESSAGE=0xcf2c50'

          echo 'DYNAMIC_SYMBOLS_BEGIN=true'
          for pattern in 'QMetaObject::activate' 'QObject::connectImpl' 'QMetaObject::Connection'; do
            echo "GDB_INFO_FUNCTIONS_PATTERN=$pattern"
            "$gdb" -q -nx -batch "$client" -ex 'set pagination off' -ex "info functions $pattern" || true
          done
          echo 'DYNAMIC_SYMBOLS_END=true'

          for spec in \
            'sendSecondaryLoginMessage:0xcf2c30:0xcf2ca0' \
            'sendLoginMessage:0xcf2c90:0xcf2d20'; do
            name=${spec%%:*}; rest=${spec#*:}; lo=${rest%%:*}; hi=${rest##*:}
            echo "LOGIN_WRAPPER_DISASSEMBLY_BEGIN name=$name lo=$lo hi=$hi"
            "$gdb" -q -nx -batch "$client" \
              -ex 'set pagination off' -ex 'set disassembly-flavor intel' \
              -ex "disassemble /r $lo,$hi"
            echo "LOGIN_WRAPPER_DISASSEMBLY_END name=$name"
          done

          python3 -u - "$client" "$xrefs" <<'PY'
          import struct,sys
          path,out_path=sys.argv[1:]
          data=open(path,'rb').read()
          phoff=struct.unpack_from('<Q',data,0x20)[0]
          phentsz=struct.unpack_from('<H',data,0x36)[0]
          phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,fo,va,_,fsz,msz,_=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1 and fsz:
                  loads.append((fo,fo+fsz,va,va+msz,flags))
          def va_to_off(va):
              for fs,fe,base,vend,flags in loads:
                  if base<=va<base+(fe-fs): return fs+(va-base)
          def off_to_va(off):
              for fs,fe,base,vend,flags in loads:
                  if fs<=off<fe:return base+(off-fs)
          exec_segments=[x for x in loads if x[4]&1]
          targets={
              'sendLoginMessage':0xcf2ca0,
              'sendSecondaryLoginMessage':0xcf2c50,
              'loginQMeta':0x3084fa0,
          }
          found=[]
          print('LOGIN_REFERENCE_SCAN_BEGIN=true')
          for name,target in targets.items():
              direct=[]; rip=[]; data_ptr=[]
              for fs,fe,base,vend,flags in exec_segments:
                  blob=data[fs:fe]
                  for p in range(max(0,len(blob)-7)):
                      site=base+p
                      if blob[p]==0xe8 and p+5<=len(blob):
                          dst=(site+5+struct.unpack_from('<i',blob,p+1)[0]) & 0xffffffffffffffff
                          if dst==target: direct.append(site)
                      if p+7<=len(blob) and 0x40<=blob[p]<=0x4f and blob[p+1] in (0x8d,0x8b):
                          modrm=blob[p+2]
                          if (modrm & 0xc7)==0x05:
                              dst=(site+7+struct.unpack_from('<i',blob,p+3)[0]) & 0xffffffffffffffff
                              if dst==target: rip.append(site)
              needle=struct.pack('<Q',target)
              start=0
              while True:
                  p=data.find(needle,start)
                  if p<0:break
                  va=off_to_va(p)
                  if va is not None:data_ptr.append(va)
                  start=p+1
              print(f'REFERENCE target={name} va=0x{target:x} direct_calls={len(direct)} direct_sites={",".join(hex(x) for x in direct[:64]) if direct else "none"}')
              print(f'REFERENCE target={name} va=0x{target:x} rip_refs={len(rip)} rip_sites={",".join(hex(x) for x in rip[:64]) if rip else "none"}')
              print(f'REFERENCE target={name} va=0x{target:x} raw_ptrs={len(data_ptr)} ptr_vas={",".join(hex(x) for x in data_ptr[:64]) if data_ptr else "none"}')
              for kind,sites in [('direct',direct),('rip',rip)]:
                  for site in sites[:48]:
                      found.append((name,kind,site))
          with open(out_path,'w') as f:
              for name,kind,site in sorted(set(found),key=lambda x:x[2]):
                  f.write(f'{name} {kind} 0x{site:x}\n')
          print(f'LOGIN_REFERENCE_NEIGHBORHOODS={len(set(found))}')
          print('LOGIN_REFERENCE_SCAN_END=true')
          PY

          ordinal=0
          while read -r target kind site; do
            [[ "$site" =~ ^0x[0-9a-f]+$ ]] || continue
            (( ordinal += 1 ))
            (( ordinal <= 72 )) || break
            lo=$(printf '0x%x' $((site-160))); hi=$(printf '0x%x' $((site+224)))
            echo "LOGIN_REFERENCE_NEIGHBORHOOD_BEGIN ordinal=$ordinal target=$target kind=$kind site=$site lo=$lo hi=$hi"
            "$gdb" -q -nx -batch "$client" \
              -ex 'set pagination off' -ex 'set disassembly-flavor intel' \
              -ex "disassemble /r $lo,$hi" || true
            echo "LOGIN_REFERENCE_NEIGHBORHOOD_END ordinal=$ordinal"
          done < "$xrefs"

          echo 'TRACK_A_LOGIN_SIGNAL_ORACLE_COMPLETE=true'
          grep -q '^TRACK_A_LOGIN_SIGNAL_ORACLE_COMPLETE=true$' "$report"

      - name: Upload exact-version login signal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-login-signal-oracle-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-login-signal-oracle.txt
          if-no-files-found: error
          retention-days: 7

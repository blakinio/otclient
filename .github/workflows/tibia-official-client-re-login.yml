name: Track A official Linux structural login

on:
  workflow_dispatch:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-login.yml

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  login:
    runs-on: [otclient, synology]
    timeout-minutes: 15
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      TRACK_WARP_PORT: '25354'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
      TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
    steps:
      - name: Checkout exact Track A head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Login semantically and require decoded world state
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -s)" == Linux ]]
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]

          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          runtime="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$runtime/bin/client"
          toolroot="$state/toolroot"
          tool_path="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          tool_lib="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          py_path="$toolroot/usr/lib/python3/dist-packages"
          gi_path="$toolroot/usr/lib/x86_64-linux-gnu/girepository-1.0:$toolroot/usr/lib/girepository-1.0"
          evidence="$state/evidence/semantic-login-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$state/runtime" "$state/evidence" "$evidence"
          chmod 700 "$state" "$state/runtime" "$state/evidence" "$evidence"
          dbus_pid=''; atspi_pid=''; gdb_pid=''
          cleanup_bus() {
            [[ -z "$gdb_pid" ]] || kill "$gdb_pid" 2>/dev/null || true
            [[ -z "$atspi_pid" ]] || kill "$atspi_pid" 2>/dev/null || true
            [[ -z "$dbus_pid" ]] || kill "$dbus_pid" 2>/dev/null || true
          }
          trap 'rc=$?; cleanup_bus; if [[ $rc -ne 0 ]]; then echo TRACK_A_SEMANTIC_LOGIN_FAILURE_RC=$rc; for log in "$state/runtime/xvfb.log" "$state/runtime/client.log" "$evidence/atspi-bus.log" "$evidence/gdb.log"; do if [[ -f "$log" ]]; then echo TRACK_A_LOG_BEGIN=$(basename "$log"); tail -n 60 "$log"; echo TRACK_A_LOG_END=$(basename "$log"); fi; done; fi' EXIT

          [[ -x "$client" ]]
          [[ "$(stat -c %s "$client")" == 51965216 ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          PYTHONPATH="$py_path" GI_TYPELIB_PATH="$gi_path" LD_LIBRARY_PATH="$tool_lib" python3 -c 'import pyatspi'
          atspi_launcher="$(find "$toolroot" -type f -name at-spi-bus-launcher -print -quit)"
          [[ -n "$atspi_launcher" ]]
          echo TRACK_A_EXACT_OFFICIAL_CLIENT_VERIFIED=true
          echo TRACK_A_ATSPI_PREREQUISITES_VERIFIED=true

          warp_pid="$(tr -cd '0-9' <"$state/runtime/wireproxy.pid" 2>/dev/null || true)"
          [[ -n "$warp_pid" && -r "/proc/$warp_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$warp_pid/environ"
          kill -0 "$warp_pid"
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)$'
          echo TRACK_A_WARP_VERIFIED=true

          old_pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          if [[ -n "$old_pid" && -e "/proc/$old_pid" ]]; then
            [[ -r "/proc/$old_pid/environ" ]]
            grep -azFxq "$marker" "/proc/$old_pid/environ"
            [[ "$(readlink -f "/proc/$old_pid/exe")" == "$client" ]]
            kill "$old_pid"
            for _ in $(seq 1 30); do kill -0 "$old_pid" 2>/dev/null || break; sleep 0.2; done
            ! kill -0 "$old_pid" 2>/dev/null
            echo TRACK_A_PREVIOUS_OWNED_CLIENT_STOPPED=true
          fi

          xvfb_pid="$(tr -cd '0-9' <"$state/runtime/xvfb.pid" 2>/dev/null || true)"
          if [[ -z "$xvfb_pid" || ! -e "/proc/$xvfb_pid" || ! -e /tmp/.X11-unix/X98 ]]; then
            private_xvfb="$state/runtime/Xvfb-track-a"
            [[ -x "$private_xvfb" ]]
            cd "$toolroot/usr/bin"
            env -u RUNNER_TRACKING_ID OTCLIENT_TIBIA_RE_TRACK=official-client-re PATH="$tool_path" LD_LIBRARY_PATH="$tool_lib" XKB_CONFIG_ROOT="$toolroot/usr/share/X11/xkb" nohup "$private_xvfb" "$TRACK_DISPLAY" -screen 0 1280x800x24 -xkbdir "$toolroot/usr/share/X11/xkb" +extension GLX +iglx +render -nolisten tcp -noreset >"$state/runtime/xvfb.log" 2>&1 </dev/null &
            xvfb_pid=$!
            printf '%s\n' "$xvfb_pid" >"$state/runtime/xvfb.pid"
            chmod 600 "$state/runtime/xvfb.pid"
            for _ in $(seq 1 30); do [[ -e /tmp/.X11-unix/X98 ]] && break; kill -0 "$xvfb_pid"; sleep 1; done
          fi
          [[ -e /tmp/.X11-unix/X98 ]]
          [[ -r "/proc/$xvfb_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$xvfb_pid/environ"
          echo TRACK_A_XVFB_VERIFIED=true

          mapfile -t dbus_info < <(PATH="$tool_path" LD_LIBRARY_PATH="$tool_lib" "$toolroot/usr/bin/dbus-daemon" --session --fork --print-address=1 --print-pid=1)
          [[ ${#dbus_info[@]} -ge 2 && -n "${dbus_info[0]}" && "${dbus_info[1]}" =~ ^[0-9]+$ ]]
          export DBUS_SESSION_BUS_ADDRESS="${dbus_info[0]}"
          dbus_pid="${dbus_info[1]}"
          echo TRACK_A_SESSION_DBUS_READY=true

          PATH="$tool_path" LD_LIBRARY_PATH="$tool_lib" "$atspi_launcher" --launch-immediately >"$evidence/atspi-bus.log" 2>&1 &
          atspi_pid=$!
          for _ in $(seq 1 30); do
            if PATH="$tool_path" LD_LIBRARY_PATH="$tool_lib" "$toolroot/usr/bin/dbus-send" --session --print-reply --dest=org.a11y.Bus /org/a11y/bus org.a11y.Bus.GetAddress >"$evidence/atspi-address.txt" 2>/dev/null; then break; fi
            sleep 0.2
          done
          kill -0 "$atspi_pid"
          grep -q 'string "' "$evidence/atspi-address.txt"
          echo TRACK_A_ATSPI_BUS_READY=true

          proxy_lib="$(find "$toolroot" -type f -name 'libproxychains.so.4' -print -quit)"
          vk_icd="$(find "$toolroot/usr/share/vulkan/icd.d" -type f -name 'lvp_icd*.json' -print -quit)"
          swrast="$(find "$toolroot" \( -type f -o -type l \) -name 'swrast_dri.so' -print -quit)"
          [[ -n "$proxy_lib" && -n "$vk_icd" && -n "$swrast" ]]
          dri_dir="$(dirname "$swrast")"
          proxy_conf="$state/config/proxychains.conf"
          [[ -s "$proxy_conf" ]]

          cd "$runtime"
          env -u RUNNER_TRACKING_ID OTCLIENT_TIBIA_RE_TRACK=official-client-re HOME="$state/home" DISPLAY="$TRACK_DISPLAY" DBUS_SESSION_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" QT_ACCESSIBILITY=1 QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 PATH="$tool_path" LD_LIBRARY_PATH="$runtime/lib:$tool_lib" LIBGL_ALWAYS_SOFTWARE=1 LIBGL_DRIVERS_PATH="$dri_dir" QSG_RHI_BACKEND=vulkan VK_ICD_FILENAMES="$vk_icd" XDG_DATA_DIRS="$toolroot/usr/share:/usr/share" FONTCONFIG_PATH="$toolroot/etc/fonts" FONTCONFIG_FILE="$toolroot/etc/fonts/fonts.conf" LD_PRELOAD="$proxy_lib" PROXYCHAINS_CONF_FILE="$proxy_conf" nohup "$client" >"$state/runtime/client.log" 2>&1 </dev/null &
          pid=$!
          printf '%s\n' "$pid" >"$state/runtime/client.pid"
          chmod 600 "$state/runtime/client.pid"
          sleep 12
          kill -0 "$pid"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          grep -azFxq "$marker" "/proc/$pid/environ"
          echo TRACK_A_ACCESSIBLE_OFFICIAL_CLIENT_RUNNING=true

          export HOME="$state/home" DISPLAY="$TRACK_DISPLAY" PATH="$tool_path" LD_LIBRARY_PATH="$tool_lib" PYTHONPATH="$py_path" GI_TYPELIB_PATH="$gi_path" DBUS_SESSION_BUS_ADDRESS
          python3 "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-atspi.py" inspect
          echo TRACK_A_ATSPI_CLIENT_TREE_PROVEN=true

          python3 "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-atspi.py" login
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          echo TRACK_A_ATSPI_ACCOUNT_LOGIN_COMPLETED=true

          set +e
          python3 "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-atspi.py" character
          char_rc=$?
          set -e
          if [[ "$char_rc" == 6 ]]; then
            best="$("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null | head -n1 || true)"
            [[ -n "$best" ]]
            "$toolroot/usr/bin/xdotool" mousemove --window "$best" 285 193 click 1
            sleep 0.4
            "$toolroot/usr/bin/xdotool" key --window "$best" Return
            sleep 3
            "$toolroot/usr/bin/xdotool" mousemove --window "$best" 285 193 click --repeat 2 --delay 160 1 || true
            echo TRACK_A_CHARACTER_COORDINATE_FALLBACK=true
          elif [[ "$char_rc" != 0 ]]; then
            exit "$char_rc"
          fi
          echo TRACK_A_CHARACTER_ACTIVATION_SENT=true

          cat >"$evidence/socket_state.py" <<'PY'
          import os, pathlib, sys
          pid, port = sys.argv[1], int(sys.argv[2])
          inodes=set()
          for fd in pathlib.Path('/proc',pid,'fd').iterdir():
              try: target=os.readlink(fd)
              except OSError: continue
              if target.startswith('socket:['): inodes.add(target[8:-1])
          local=direct=udp=0
          for name,is_udp in [('tcp',False),('tcp6',False),('udp',True),('udp6',True)]:
              try: rows=pathlib.Path('/proc',pid,'net',name).read_text().splitlines()[1:]
              except OSError: continue
              for row in rows:
                  cols=row.split()
                  if len(cols)<10 or cols[9] not in inodes: continue
                  remote_port=int(cols[2].rsplit(':',1)[1],16)
                  if is_udp: udp+=1
                  elif cols[3]=='01':
                      if remote_port==port: local+=1
                      else: direct+=1
          print(local,direct,udp)
          PY
          socket_state() { python3 "$evidence/socket_state.py" "$pid" "$TRACK_WARP_PORT"; }

          sustained=0; consecutive=0; max_local=0
          for _ in $(seq 1 90); do
            sleep 0.5
            kill -0 "$pid"
            read -r local direct udp < <(socket_state)
            (( local > max_local )) && max_local=$local || true
            [[ "$direct" == 0 && "$udp" == 0 ]]
            if (( local >= 2 )); then consecutive=$((consecutive+1)); else consecutive=0; fi
            if (( consecutive >= 8 )); then sustained=1; break; fi
          done
          echo TRACK_A_POST_CHARACTER_LOCAL_SOCKS_MAX="$max_local"
          echo TRACK_A_SUSTAINED_TUNNELED_SESSION="$sustained"
          [[ "$sustained" == 1 ]]

          if [[ -w /proc/sys/kernel/yama/ptrace_scope ]]; then printf '0\n' >/proc/sys/kernel/yama/ptrace_scope; fi
          line="$(grep -F "$client" "/proc/$pid/maps" | awk '$2~/r-xp/{print;exit}')"
          [[ -n "$line" ]]
          start="$(printf '%s\n' "$line" | awk '{split($1,a,"-");print a[1]}')"
          offset="$(printf '%s\n' "$line" | awk '{print $3}')"
          bias=$((16#$start - 16#$offset))
          printf 'TRACK_A_PIE_BASE=0x%x\n' "$bias"
          records="$evidence/map-records"
          hit="$evidence/map-hit"
          : >"$records"
          cat >"$evidence/postworld.gdb" <<EOF
          set pagination off
          set confirm off
          attach $pid
          python
          import gdb, struct
          inf=gdb.selected_inferior(); out='$records'; hit='$hit'
          class B(gdb.Breakpoint):
            def __init__(self): super().__init__('*0x%x'%($bias+0x19a8ea3)); self.n=0
            def stop(self):
              try:
                rsp=int(gdb.parse_and_eval('\$rsp')); order=int(gdb.parse_and_eval('\$rbp'))&0xffffffff
                x,y,z=struct.unpack('<III',bytes(inf.read_memory(rsp+0x88,12)))
                if 0<x<100000 and 0<y<100000 and z<32 and order<128:
                  self.n+=1; open(out,'a').write(f'{x} {y} {z} {order}\n')
                  if self.n>=8: open(hit,'w').write(f'DECODED_MAP_RECORD_COUNT={self.n}\n'); self.enabled=False
              except Exception: pass
              return False
          B(); gdb.write('POSTWORLD_MAP_BREAKPOINT_READY=true\n')
          end
          continue
          EOF
          env -u RUNNER_TRACKING_ID LD_LIBRARY_PATH="$tool_lib" "$toolroot/usr/bin/gdb" -q -nx -x "$evidence/postworld.gdb" >"$evidence/gdb.log" 2>&1 &
          gdb_pid=$!
          for _ in $(seq 1 30); do grep -q 'POSTWORLD_MAP_BREAKPOINT_READY=true' "$evidence/gdb.log" 2>/dev/null && break; sleep 0.5; done
          grep -q 'POSTWORLD_MAP_BREAKPOINT_READY=true' "$evidence/gdb.log"

          best="$("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null | head -n1 || true)"
          [[ -n "$best" ]]
          "$toolroot/usr/bin/xdotool" key --window "$best" Right || true
          sleep 2
          best="$("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null | head -n1 || true)"
          [[ -n "$best" ]] && "$toolroot/usr/bin/xdotool" key --window "$best" Left || true
          for _ in $(seq 1 25); do [[ -s "$hit" ]] && break; sleep 1; done
          count="$(wc -l <"$records" 2>/dev/null || echo 0)"
          echo TRACK_A_DECODED_MAP_RECORD_COUNT="$count"
          [[ "$count" -ge 8 && -s "$hit" ]]
          kill -0 "$pid"
          echo TRACK_A_STRUCTURAL_IN_GAME=true
          echo TRACK_A_OFFICIAL_LINUX_WORLD_LOGIN_PROVEN=true
          cleanup_bus
          trap - EXIT

name: Track A map provenance handler disassembly
on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-map-provenance-handler-disassembly.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 6
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Disassemble exact named worldmap handlers
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          [[ -x "$client" ]]
          actual="$(sha256sum "$client"|awk '{print $1}')"; [[ "$actual" == "$EXPECTED_CLIENT_SHA256" ]]
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          gdb="$toolroot/usr/bin/gdb"; [[ -x "$gdb" ]]
          echo TRACK_A_CLIENT_SHA256="$actual"
          for spec in 'CreateOnMap 0xcecb80 0xced150' 'ChangeOnMap 0xcece50 0xced4b0' 'DeleteOnMap 0xcd4d30 0xcd54a0' 'FullMap 0xcec790 0xcecaa0' 'MapDescription 0x19a89c0 0x19a9000'; do
            set -- $spec; name="$1"; start="$2"; stop="$3"
            echo "DISASM_BEGIN handler=$name start=$start stop=$stop"
            "$gdb" -q -nx -batch "$client" -ex 'set pagination off' -ex 'set disassembly-flavor intel' -ex "disassemble /r $start,$stop"
            echo "DISASM_END handler=$name"
          done
          echo TRACK_A_MAP_PROVENANCE_HANDLER_DISASSEMBLY_COMPLETE=true

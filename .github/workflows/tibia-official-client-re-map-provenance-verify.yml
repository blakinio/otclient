name: Track A verify persistent map provenance observer
on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-map-provenance-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Verify observer survived prior job cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          runtime="$state/runtime"; client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"; marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          [[ "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          pid="$(tr -cd '0-9' <"$runtime/client.pid")"; gp="$(tr -cd '0-9' <"$runtime/map-provenance-gdb.pid")"
          kill -0 "$pid"; kill -0 "$gp"; grep -azFxq "$marker" "/proc/$pid/environ"; grep -azFxq "$marker" "/proc/$gp/environ"
          tracer="$(awk '/^TracerPid:/{print $2}' "/proc/$pid/status")"; [[ "$tracer" == "$gp" ]]
          echo TRACK_A_MAP_PROVENANCE_PERSISTENT_VERIFIED=true
          echo TRACK_A_CLIENT_PID="$pid"
          echo TRACK_A_OBSERVER_PID="$gp"
          echo TRACK_A_EVENT_COUNT="$(wc -l <"$runtime/map-provenance-persistent-events.tsv")"
          echo TRACK_A_STRIP_COUNT="$(wc -l <"$runtime/map-provenance-persistent-strips.tsv")"
          echo TRACK_A_EVENT_TAIL_BEGIN=true; tail -n 20 "$runtime/map-provenance-persistent-events.tsv" || true; echo TRACK_A_EVENT_TAIL_END=true

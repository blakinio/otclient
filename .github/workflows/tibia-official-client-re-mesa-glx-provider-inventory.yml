name: Track A contained Mesa GLX provider inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-mesa-glx-provider-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-mesa-glx-provider-inventory
  cancel-in-progress: false

jobs:
  mesa-glx-provider-inventory:
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Inventory fixed contained Mesa GLVND DRI provider stack
        shell: bash
        env:
          EXPECTED_BASE_SHA: d3f186414256151c9d5e03f34c5a9026b1fba500
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || exit 44

          tool='/work/_otclient_tibia_re_state/toolroot'
          [[ -d "$tool" && ! -L "$tool" && "$(realpath -e "$tool")" == "$tool" ]] || exit 45

          echo 'MESA_GLX_INV_RUNTIME_ACCESS=read_only'
          echo 'MESA_GLX_INV_CANONICAL_STATE_ACCESS=NONE'
          echo 'MESA_GLX_INV_XSERVER_STARTED=false'
          echo 'MESA_GLX_INV_CLIENT_STARTED=false'
          echo 'MESA_GLX_INV_PARSER=PYTHON_STDLIB_ONLY'

          python3 - "$tool" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat
          import struct
          import sys

          tool = pathlib.Path(sys.argv[1]).resolve()
          lib_roots = [
              tool / 'usr/lib/x86_64-linux-gnu',
              tool / 'lib/x86_64-linux-gnu',
              tool / 'usr/lib',
              tool / 'lib',
          ]
          dri_roots = [
              tool / 'usr/lib/x86_64-linux-gnu/dri',
              tool / 'lib/x86_64-linux-gnu/dri',
          ]
          xorg_glx = tool / 'usr/lib/xorg/modules/extensions/libglx.so'
          vendor_dirs = [
              tool / 'usr/share/glvnd/egl_vendor.d',
              tool / 'etc/glvnd/egl_vendor.d',
          ]
          named_patterns = [
              'libGL.so.1',
              'libGLX.so.0',
              'libGLX_mesa.so.0',
              'libGLdispatch.so.0',
              'libOpenGL.so.0',
              'libEGL.so.1',
              'libEGL_mesa.so.0',
              'libgbm.so.1',
              'libdrm.so.2',
              'libdrm_amdgpu.so.1',
              'libdrm_radeon.so.1',
              'libglapi.so.0',
              'libLLVM*.so*',
          ]

          def inside(path):
              try:
                  p = pathlib.Path(path).resolve()
              except OSError:
                  return False
              return p == tool or tool in p.parents

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()

          def cstr(buf, off):
              if off < 0 or off >= len(buf): return ''
              end=buf.find(b'\0',off)
              if end < 0: end=len(buf)
              return buf[off:end].decode('ascii','replace')

          def elf_info(path):
              data=pathlib.Path(path).read_bytes()
              out={'elf64le':False,'needed':[],'rpath':[],'runpath':[],'provider_strings':[]}
              if len(data)<64 or data[:4]!=b'\x7fELF' or data[4]!=2 or data[5]!=1:
                  return out
              hdr=struct.unpack_from('<16sHHIQQQIHHHHHH',data,0)
              out['elf64le']=True; out['machine']=hdr[2]
              e_shoff,e_shentsize,e_shnum,e_shstrndx=hdr[6],hdr[11],hdr[12],hdr[13]
              raw=[]
              for i in range(e_shnum):
                  at=e_shoff+i*e_shentsize
                  if at+64>len(data): break
                  raw.append(struct.unpack_from('<IIQQQQIIQQ',data,at))
              dyn=None
              for sh in raw:
                  if sh[1]==6:
                      dyn=sh; break
              if dyn and 0 <= dyn[6] < len(raw):
                  strsh=raw[dyn[6]]; dynstr=data[strsh[4]:strsh[4]+strsh[5]]
                  entsize=dyn[9] or 16
                  for at in range(dyn[4],dyn[4]+dyn[5],entsize):
                      if at+16>len(data): break
                      tag,val=struct.unpack_from('<QQ',data,at)
                      if tag==0: break
                      if tag==1: out['needed'].append(cstr(dynstr,val))
                      elif tag==15: out['rpath'].append(cstr(dynstr,val))
                      elif tag==29: out['runpath'].append(cstr(dynstr,val))
              needles=re.compile(r'(?i)(swrast|dri[_ -]?drivers?|LIBGL_DRIVERS_PATH|GLX_VENDOR|GLX|mesa|llvmpipe|softpipe|gallium|egl_vendor|GBM_BACKENDS_PATH)')
              seen=set()
              for m in re.finditer(rb'[\x20-\x7e]{5,}',data):
                  s=m.group().decode('ascii','replace')
                  if needles.search(s) and s not in seen:
                      seen.add(s); out['provider_strings'].append(s[:300])
                      if len(out['provider_strings'])>=120: break
              out['needed']=sorted(set(x for x in out['needed'] if x))
              out['rpath']=sorted(set(x for x in out['rpath'] if x))
              out['runpath']=sorted(set(x for x in out['runpath'] if x))
              return out

          def resolve_needed(name):
              for root in lib_roots:
                  p=root/name
                  if p.exists() and inside(p):
                      return p.resolve()
              for root in dri_roots:
                  p=root/name
                  if p.exists() and inside(p):
                      return p.resolve()
              return None

          def emit_file(label,path,scan_strings=True):
              p=pathlib.Path(path)
              if not p.exists():
                  print(f'MESA_GLX_INV_{label}_PRESENT=false')
                  return
              real=p.resolve()
              if not inside(real): raise SystemExit('MESA_GLX_INV_REFUSED=ESCAPE:'+str(p))
              st=real.stat(); info=elf_info(real)
              print(f'MESA_GLX_INV_{label}_PRESENT=true')
              print(f'MESA_GLX_INV_{label}_PATH={real}')
              print(f'MESA_GLX_INV_{label}_SHA256={sha256(real)}')
              print(f'MESA_GLX_INV_{label}_SIZE={st.st_size}')
              print(f'MESA_GLX_INV_{label}_ELF64LE={str(info.get("elf64le",False)).lower()}')
              for v in info.get('rpath',[]): print(f'MESA_GLX_INV_{label}_RPATH={v}')
              for v in info.get('runpath',[]): print(f'MESA_GLX_INV_{label}_RUNPATH={v}')
              missing=[]
              for name in info.get('needed',[]):
                  r=resolve_needed(name)
                  print(f'MESA_GLX_INV_{label}_NEEDED={name}:{r if r else "NOT_FOUND_IN_FIXED_ROOTS"}')
                  if not r: missing.append(name)
              print(f'MESA_GLX_INV_{label}_MISSING_DIRECT_COUNT={len(missing)}')
              if scan_strings:
                  strings=info.get('provider_strings',[])
                  print(f'MESA_GLX_INV_{label}_PROVIDER_STRING_COUNT={len(strings)}')
                  for s in strings[:80]: print(f'MESA_GLX_INV_{label}_PROVIDER_STRING={s}')

          # Resolve named library candidates only from fixed roots.
          found={}
          for pattern in named_patterns:
              matches=[]
              for root in lib_roots:
                  if not root.is_dir() or not inside(root): continue
                  if '*' in pattern:
                      matches.extend(root.glob(pattern))
                  else:
                      p=root/pattern
                      if p.exists(): matches.append(p)
              uniq=[]; seen=set()
              for p in matches:
                  try: r=p.resolve()
                  except OSError: continue
                  if inside(r) and str(r) not in seen:
                      seen.add(str(r)); uniq.append(r)
              found[pattern]=uniq
              key=re.sub(r'[^A-Za-z0-9]+','_',pattern).strip('_').upper()
              print(f'MESA_GLX_INV_NAMED_{key}_COUNT={len(uniq)}')
              for i,p in enumerate(uniq[:8]): emit_file(f'NAMED_{key}_{i}',p,scan_strings=(pattern in ('libGL.so.1','libGLX_mesa.so.0','libGLX.so.0','libEGL_mesa.so.0')))

          emit_file('XORG_LIBGLX',xorg_glx,scan_strings=True)

          # DRI provider inventory, tightly bounded to software/common provider names.
          dri_names=('swrast_dri.so','kms_swrast_dri.so','zink_dri.so','radeonsi_dri.so','iris_dri.so','nouveau_dri.so')
          for root in dri_roots:
              present=root.is_dir() and inside(root)
              rootkey=re.sub(r'[^A-Za-z0-9]+','_',str(root.relative_to(tool))).strip('_').upper()
              print(f'MESA_GLX_INV_DRI_ROOT_{rootkey}_PRESENT={str(present).lower()}')
              if not present: continue
              for name in dri_names:
                  p=root/name
                  label='DRI_'+re.sub(r'[^A-Za-z0-9]+','_',name).strip('_').upper()
                  emit_file(label,p,scan_strings=(name in ('swrast_dri.so','kms_swrast_dri.so','zink_dri.so')))

          # GLVND/EGL vendor manifests: metadata/content is non-secret support configuration.
          for d in vendor_dirs:
              key=re.sub(r'[^A-Za-z0-9]+','_',str(d.relative_to(tool))).strip('_').upper()
              present=d.is_dir() and inside(d)
              print(f'MESA_GLX_INV_VENDOR_DIR_{key}_PRESENT={str(present).lower()}')
              if not present: continue
              files=sorted(p for p in d.glob('*.json') if p.is_file())[:20]
              print(f'MESA_GLX_INV_VENDOR_DIR_{key}_JSON_COUNT={len(files)}')
              for p in files:
                  try:
                      obj=json.loads(p.read_text(errors='replace'))
                      lib=obj.get('ICD',{}).get('library_path') if isinstance(obj,dict) else None
                  except Exception:
                      lib=None
                  print(f'MESA_GLX_INV_VENDOR_JSON={p.resolve()}:{lib or "NO_LIBRARY_PATH"}')

          # Summarize the load-bearing candidates.
          swrast=[]
          for root in dri_roots:
              p=root/'swrast_dri.so'
              if p.exists() and inside(p): swrast.append(p.resolve())
          glx_mesa=[]
          for root in lib_roots:
              p=root/'libGLX_mesa.so.0'
              if p.exists() and inside(p): glx_mesa.append(p.resolve())
          print(f'MESA_GLX_INV_SWRAST_PRESENT={str(bool(swrast)).lower()}')
          print(f'MESA_GLX_INV_LIBGLX_MESA_PRESENT={str(bool(glx_mesa)).lower()}')
          print('MESA_GLX_INV_RESULT=PASS_READ_ONLY_INVENTORY')
          PY

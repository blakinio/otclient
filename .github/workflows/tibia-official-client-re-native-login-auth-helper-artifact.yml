name: Track A native-login auth-helper artifact

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-auth-helper-artifact.yml
      - docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md

permissions:
  contents: read

concurrency:
  group: track-a-native-login-auth-helper-artifact
  cancel-in-progress: false

jobs:
  hosted-build:
    name: Build experimental auth helper on hosted Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build exact helper and manifest
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ qt6-base-dev >/dev/null
          root="$RUNNER_TEMP/native-auth-helper"
          out="$RUNNER_TEMP/native-auth-artifact"
          rm -rf "$root" "$out"
          mkdir -p "$root" "$out"
          cmake -S tools/tibia_runtime_bridge -B "$root" -G Ninja \
            -DOTCLIENT_TIBIA_RE_BUILD_EXPERIMENTAL_AUTH=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$out"
          cmake --build "$root" --target otclient_tibia_native_auth_experimental --parallel 2
          helper="$out/otclient-tibia-native-auth-experimental.so"
          [[ -f "$helper" && -s "$helper" && ! -L "$helper" ]]
          (cd "$out" && sha256sum otclient-tibia-native-auth-experimental.so > SHA256SUMS)
          size="$(stat -c %s "$helper")"
          sha="$(awk '{print $1}' "$out/SHA256SUMS")"
          [[ "$sha" =~ ^[0-9a-f]{64}$ && "$size" =~ ^[1-9][0-9]*$ ]]
          echo "NATIVE_LOGIN_AUTH_HELPER_HOSTED_SHA256=$sha"
          echo "NATIVE_LOGIN_AUTH_HELPER_HOSTED_SIZE=$size"
          echo 'NATIVE_LOGIN_AUTH_HELPER_HOSTED_BUILD=PASS'
          echo 'NATIVE_LOGIN_AUTH_HELPER_HOSTED_SECRET_ACCESS=false'

      - name: Upload exact helper artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-login-auth-helper-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/native-auth-artifact/otclient-tibia-native-auth-experimental.so
            ${{ runner.temp }}/native-auth-artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  synology-stage:
    name: Verify and stage helper in task-local Synology state
    needs: hosted-build
    runs-on: [otclient, synology]
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download exact hosted artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-auth-helper-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/native-auth-artifact-download

      - name: Verify authority, artifact and client-library compatibility; stage helper only
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py --changed-from "$EVENT_BASE_SHA" --expected-branch "$HEAD_BRANCH"

          state='/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime'
          task='OTC-20260818-native-login-to-ingame-e2e'
          session='chatgpt-native-login-e2e-20260818-v3'
          token="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime/canonical-lease-token"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          python3 - "$state/runtime-registration.json" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d.get('registration_generation')==3
          assert d.get('lease_generation')==11
          assert d.get('client_version')=='15.32.df7b29'
          assert d.get('client_size')==51965216
          assert d.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          print('NATIVE_LOGIN_AUTH_HELPER_STAGE_AUTHORITY=ACTIVE_GEN11_REG3_11')
          PY

          src="$RUNNER_TEMP/native-auth-artifact-download"
          [[ -f "$src/otclient-tibia-native-auth-experimental.so" && -f "$src/SHA256SUMS" ]]
          (cd "$src" && sha256sum -c SHA256SUMS)
          helper="$src/otclient-tibia-native-auth-experimental.so"
          sha="$(sha256sum "$helper" | awk '{print $1}')"
          size="$(stat -c %s "$helper")"
          [[ "$sha" =~ ^[0-9a-f]{64}$ && "$size" =~ ^[1-9][0-9]*$ ]]
          file "$helper" | grep -q 'ELF 64-bit LSB shared object'

          package="$state/session/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          [[ -d "$package/bin/lib" ]]
          compat="$RUNNER_TEMP/native-auth-helper-ldd-${GITHUB_RUN_ID}.txt"
          LD_LIBRARY_PATH="$package/bin/lib" ldd "$helper" >"$compat"
          ! grep -q 'not found' "$compat"
          grep -q 'libQt6Core.so.6' "$compat"
          rm -f "$compat"

          dest_root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime/auth-helper"
          mkdir -p "$dest_root"
          chmod 700 "$dest_root"
          tmp="$dest_root/.helper-${GITHUB_RUN_ID}"
          install -m700 "$helper" "$tmp"
          [[ "$(sha256sum "$tmp" | awk '{print $1}')" == "$sha" ]]
          mv -f "$tmp" "$dest_root/otclient-tibia-native-auth-experimental.so"
          printf '%s\n' "$sha" >"$dest_root/sha256"
          printf '%s\n' "$size" >"$dest_root/size"
          chmod 600 "$dest_root/sha256" "$dest_root/size"
          echo "NATIVE_LOGIN_AUTH_HELPER_STAGE_SHA256=$sha"
          echo "NATIVE_LOGIN_AUTH_HELPER_STAGE_SIZE=$size"
          echo 'NATIVE_LOGIN_AUTH_HELPER_CLIENT_LIB_COMPAT=PASS'
          echo 'NATIVE_LOGIN_AUTH_HELPER_STAGE_RESULT=PASS'
          echo 'NATIVE_LOGIN_AUTH_HELPER_STAGE_CLIENT_PROCESS_OBSERVATION=false'
          echo 'NATIVE_LOGIN_AUTH_HELPER_STAGE_CLIENT_MUTATION=false'
          echo 'NATIVE_LOGIN_AUTH_HELPER_STAGE_SECRET_ACCESS=false'

name: Track A native-login canonical bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-canonical-bootstrap.yml
      - docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md

permissions:
  contents: read

concurrency:
  group: track-a-native-login-canonical-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-canonical-runtime:
    name: One-shot native-login canonical bootstrap and Gate B
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v2' }}
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fresh admission, adapted canonical bootstrap and immediate Gate B
        shell: bash
        env:
          EXPECTED_BASE_SHA: a518ceaef9135c05e36ffd7066b3acb2d81f8c4c
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077

          [[ "$RUNNER_NAME" == 'synology-otclient-01' ]]
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]
          [[ "$HEAD_BRANCH" == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v2' ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || {
            echo "NATIVE_LOGIN_BOOTSTRAP_REFUSED=EVENT_BASE_MOVED:$EVENT_BASE_SHA" >&2
            exit 44
          }
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]] || {
            echo 'NATIVE_LOGIN_BOOTSTRAP_REFUSED=HEAD_CHECKOUT_MISMATCH' >&2
            exit 45
          }
          current_main="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          [[ -n "$current_main" && "$current_main" == "$EXPECTED_BASE_SHA" ]] || {
            echo "NATIVE_LOGIN_BOOTSTRAP_REFUSED=LIVE_MAIN_MOVED:$current_main" >&2
            exit 46
          }

          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$EVENT_BASE_SHA" \
            --expected-branch "$HEAD_BRANCH"
          echo 'NATIVE_LOGIN_BOOTSTRAP_ADMISSION_POLICY=PASS'

          task='OTC-20260818-native-login-to-ingame-e2e'
          session="native-login-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state='/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime'
          token_root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"
          token="$token_root/canonical-lease-token"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          worker_source='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          adapter='.github/scripts/tibia-official-client-re-canonical-xres-worker-adapter.py'
          owner_helper='.github/scripts/tibia-official-client-re-xres-window-owner.py'
          wire_helper='.github/scripts/tibia-official-client-re-xres-wire.py'
          worker="${RUNNER_TEMP}/native-login-canonical-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          expected_xkbcomp_sha='0967e7e7b03b077327cea74567726b265bd304b4fdf59f87bf7fdfe1074e7591'
          acquired=0

          python3 .github/scripts/test_tibia_official_client_re_canonical_xres_worker_adapter.py
          python3 .github/scripts/test_tibia_official_client_re_xres_window_owner.py
          python3 .github/scripts/test_tibia_official_client_re_xres_wire.py
          python3 "$adapter" "$worker_source" "$worker" \
            --owner-helper "$owner_helper" \
            --wire-helper "$wire_helper"
          bash -n "$worker"
          if grep -Fq 'search --onlyvisible --pid' "$worker"; then
            echo 'NATIVE_LOGIN_BOOTSTRAP_REFUSED=LEGACY_WINDOW_SELECTOR_REMAINS' >&2
            exit 47
          fi
          grep -Fq 'tibia-official-client-re-xres-window-owner.py' "$worker"
          echo 'NATIVE_LOGIN_CANONICAL_XRES_WORKER=PASS'

          resolved="$(TRACK_A_CANONICAL_WORKER_CONTRACT_TEST=1 bash "$worker" toolroot)"
          [[ "$resolved" == '/work/_otclient_tibia_re_state/toolroot' ]] || {
            echo "NATIVE_LOGIN_BOOTSTRAP_REFUSED=SUPPORT_ROOT_NOT_COMPLETE:$resolved" >&2
            exit 48
          }
          [[ -f /usr/bin/xkbcomp && ! -L /usr/bin/xkbcomp && -x /usr/bin/xkbcomp ]] || {
            echo 'NATIVE_LOGIN_BOOTSTRAP_REFUSED=SYSTEM_XKBCOMP_NOT_PRESENT' >&2
            exit 49
          }
          actual_xkbcomp_sha="$(sha256sum /usr/bin/xkbcomp | awk '{print $1}')"
          [[ "$actual_xkbcomp_sha" == "$expected_xkbcomp_sha" ]] || {
            echo "NATIVE_LOGIN_BOOTSTRAP_REFUSED=SYSTEM_XKBCOMP_SHA_MISMATCH:$actual_xkbcomp_sha" >&2
            exit 50
          }
          echo 'NATIVE_LOGIN_SUPPORT_ROOT_PREFLIGHT=PASS'
          echo 'NATIVE_LOGIN_SYSTEM_XKBCOMP_PREFLIGHT=PASS'

          mkdir -p "$token_root"
          chmod 700 "/home/runner/_work/_otclient_tibia_re_state/tasks/$task" "$token_root" 2>/dev/null || true
          rm -f "$token"

          cleanup() {
            rc=$?
            if [[ "$acquired" == 1 ]]; then
              bash "$lease" release \
                --task-id "$task" \
                --session-id "$session" \
                --token-file "$token" >/dev/null 2>&1 || true
            fi
            rm -f "$token" "$worker"
            exit "$rc"
          }
          trap cleanup EXIT

          echo '=== NATIVE_LOGIN_PRE_ADMISSION ==='
          bash "$lease" status --json
          if [[ -e "$state/runtime-registration.json" ]]; then
            echo 'NATIVE_LOGIN_BOOTSTRAP_PRECHECK=REGISTRATION_ALREADY_PRESENT_RECLASSIFY'
            exit 42
          fi
          if [[ -e "$state/session" ]]; then
            echo 'NATIVE_LOGIN_BOOTSTRAP_PRECHECK=UNREGISTERED_SESSION_ROOT_PRESENT_REVIEW_REQUIRED'
            exit 43
          fi

          bash "$lease" acquire \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --ttl-seconds 1200
          acquired=1

          echo '=== NATIVE_LOGIN_BOOTSTRAP ==='
          python3 "$transition" bootstrap \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --worker "$worker" \
            --worker-timeout 300

          echo '=== NATIVE_LOGIN_GATE_B_SAME_GENERATION ==='
          python3 "$transition" gate-b \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --probe "$worker"

          echo '=== NATIVE_LOGIN_SANITIZED_REGISTRATION ==='
          python3 - "$state/runtime-registration.json" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text())
          allowed = [
              'schema_version','runtime_id','registration_generation','lease_generation',
              'boot_id_sha256','pid','process_start_ticks','client_version','client_size',
              'client_sha256','display','window_identity','remote_view_endpoint',
              'remote_view_mapping','state','source_task','source_run'
          ]
          expected = {
              'runtime_id': 'track-a-canonical-live',
              'client_version': '15.32.df7b29',
              'client_size': 51965216,
              'client_sha256': 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe',
              'remote_view_mapping': 'PROVEN',
              'source_task': 'OTC-20260818-native-login-to-ingame-e2e',
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f'NATIVE_LOGIN_REGISTRATION_INVALID={key}')
          endpoint = str(data.get('remote_view_endpoint') or '')
          if not endpoint.startswith('127.0.0.1:'):
              raise SystemExit('NATIVE_LOGIN_REGISTRATION_INVALID=remote_view_endpoint_not_loopback')
          print(json.dumps({k:data.get(k) for k in allowed}, sort_keys=True))
          print('NATIVE_LOGIN_BOOTSTRAP_RESULT=REGISTERED_GATE_B_PASS')
          PY

          bash "$lease" release \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token"
          acquired=0
          rm -f "$token"

          echo '=== NATIVE_LOGIN_POST_RELEASE ==='
          bash "$lease" status --json
          test -f "$state/runtime-registration.json"
          echo 'NATIVE_LOGIN_RUNTIME_CONTROLLER_RELEASED=true'
          echo 'NATIVE_LOGIN_PERSISTENT_RUNTIME_LEFT_IDLE=true'
          echo 'NATIVE_LOGIN_CREDENTIAL_ACCESS=false'
          echo 'NATIVE_LOGIN_LOGIN_PERFORMED=false'
          echo 'NATIVE_LOGIN_GAMEPLAY_PERFORMED=false'

name: Track A native-login current official client probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-current-client-probe.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  probe:
    name: Probe current official Linux client without mutation
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      BASE_SHA: d53eec81bf718b1128fc8e7f9b0a53d991bf30bf
      TASK: OTC-20260818-native-login-to-ingame-e2e
      SESSION: chatgpt-native-login-e2e-20260818-v3-gen16-secrets
      STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
      TOKEN: /home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime/canonical-lease-token
      OLD_SHA: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      OLD_SIZE: '51965216'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve current official client identity read-only
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 && "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_SHA" ]]
          git cat-file -e "$BASE_SHA^{commit}"
          python3 .github/scripts/test_track_a_agent_runtime_governance.py --changed-from "$BASE_SHA" --expected-branch "$HEAD_BRANCH"

          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          transition=.github/scripts/tibia-official-client-re-canonical-live-transition.py
          src=.github/scripts/tibia-official-client-re-canonical-live-session.sh
          probe="$RUNNER_TEMP/current-client-probe-${GITHUB_RUN_ID}.sh"
          tmpdir="$RUNNER_TEMP/current-client-${GITHUB_RUN_ID}"
          trap 'rm -f "$probe"; rm -rf "$tmpdir"' EXIT
          mkdir -m700 "$tmpdir"

          [[ -f "$TOKEN" && "$(stat -c %a "$TOKEN")" == 600 ]]
          bash "$lease" validate --task-id "$TASK" --session-id "$SESSION" --token-file "$TOKEN"
          bash "$lease" renew --task-id "$TASK" --session-id "$SESSION" --token-file "$TOKEN" --ttl-seconds 2700
          python3 .github/scripts/tibia-official-client-re-canonical-xres-worker-adapter.py "$src" "$probe" \
            --owner-helper .github/scripts/tibia-official-client-re-xres-window-owner.py \
            --wire-helper .github/scripts/tibia-official-client-re-xres-wire.py
          chmod 700 "$probe"
          python3 "$transition" gate-b --task-id "$TASK" --session-id "$SESSION" --token-file "$TOKEN" --probe "$probe"

          readarray -t r < <(python3 - "$STATE/lease.json" "$STATE/runtime-registration.json" <<'PY'
          import json,pathlib,sys
          l=json.loads(pathlib.Path(sys.argv[1]).read_text()); r=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert l.get('status')=='active' and l.get('generation')==16
          assert l.get('controller_task')=='OTC-20260818-native-login-to-ingame-e2e'
          assert l.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen16-secrets'
          assert r.get('registration_generation')==1 and r.get('lease_generation')==16
          print(r['client_sha256']); print(r['client_size']); print(r['pid']); print(r['display'])
          PY
          )
          [[ "${r[0]}" == "$OLD_SHA" && "${r[1]}" == "$OLD_SIZE" ]]
          echo "CURRENT_PROBE_OLD_CLIENT_PID=${r[2]}"
          echo "CURRENT_PROBE_OLD_CLIENT_DISPLAY=${r[3]}"

          warp_port="$(cat "$STATE/session/warp-port")"
          [[ "$warp_port" =~ ^[0-9]+$ ]]
          base='https://static.tibia.com/launcher/tibiaclient-linux-current/'
          manifest="$tmpdir/package.json"
          curl --socks5-hostname "127.0.0.1:$warp_port" --compressed -fL --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 120 "${base}package.json" -o "$manifest"

          readarray -t m < <(python3 - "$manifest" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=[]
          def walk(v):
              if isinstance(v,dict):
                  u=v.get('url'); p=v.get('packedhash'); q=v.get('unpackedhash')
                  if isinstance(u,str) and isinstance(p,str): rows.append((u,p,q if isinstance(q,str) else ''))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(doc)
          matches=[x for x in rows if x[0].endswith('/bin/client.lzma') or x[0]=='bin/client.lzma' or x[0].endswith('client.lzma')]
          if len(matches)!=1:
              raise SystemExit(f'expected one client.lzma manifest entry, got {len(matches)}')
          print(matches[0][0]); print(matches[0][1].lower()); print(matches[0][2].lower())
          PY
          )
          rel="${m[0]}"; packed_expected="${m[1]}"; unpacked_expected="${m[2]}"
          case "$rel" in
            http://*|https://*) url="$rel" ;;
            /*) url="https://static.tibia.com$rel" ;;
            *) url="$base$rel" ;;
          esac
          packed="$tmpdir/client.lzma"
          curl --socks5-hostname "127.0.0.1:$warp_port" --compressed -fL --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 "$url" -o "$packed"
          packed_actual="$(sha256sum "$packed" | awk '{print $1}')"
          [[ "$packed_actual" == "$packed_expected" ]]

          python3 - "$packed" "$unpacked_expected" "$OLD_SHA" <<'PY'
          import hashlib,lzma,pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); expected=sys.argv[2].lower(); old=sys.argv[3]
          b=p.read_bytes()
          if len(b)<46: raise SystemExit('packed client too small')
          q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          sha=hashlib.sha256(raw).hexdigest()
          if expected and sha!=expected: raise SystemExit(f'unpacked hash mismatch {sha}!={expected}')
          print('CURRENT_PROBE_PACKED_SHA256='+hashlib.sha256(b).hexdigest())
          print('CURRENT_PROBE_NEW_CLIENT_SHA256='+sha)
          print('CURRENT_PROBE_NEW_CLIENT_SIZE='+str(len(raw)))
          print('CURRENT_PROBE_DIFFERS_FROM_GEN16='+str(sha!=old).lower())
          versions=[]
          for pat in (rb'\b1[0-9]\.[0-9]{2}(?:\.[A-Za-z0-9]+)?\b', rb'\b[0-9]{1,2}\.[0-9]{2}\.[A-Fa-f0-9]{6,16}\b'):
              for mm in re.finditer(pat,raw):
                  s=mm.group().decode('ascii','ignore')
                  if s not in versions: versions.append(s)
          print('CURRENT_PROBE_VERSION_STRINGS='+','.join(versions[:40]))
          if sha==old: raise SystemExit('official current client still equals old gen16 binary despite live too-old dialog')
          PY

          bash "$lease" validate --task-id "$TASK" --session-id "$SESSION" --token-file "$TOKEN"
          python3 "$transition" gate-b --task-id "$TASK" --session-id "$SESSION" --token-file "$TOKEN" --probe "$probe"
          echo CURRENT_PROBE_SECRET_ACCESS=false
          echo CURRENT_PROBE_CLIENT_MUTATION=false
          echo CURRENT_PROBE_RUNTIME_RESTART=false
          echo CURRENT_PROBE_RESULT=PASS
          rm -f "$probe"; rm -rf "$tmpdir"; trap - EXIT

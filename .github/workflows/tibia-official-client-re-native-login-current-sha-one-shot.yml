name: Track A current-SHA one-shot native login

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-current-sha-one-shot.yml
      - docs/agents/evidence/OTC-20260818-native-login-to-ingame-e2e/20260818-owner-authorized-secret-ingress-current-sha.md

permissions:
  contents: read

concurrency:
  group: track-a-current-sha-native-login
  cancel-in-progress: false

env:
  EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
  EXPECTED_SIZE: '52109920'
  CONTAINER: otclient-track-a-kasmvnc
  CLIENT: /home/kasm-user/otclient-track-a/Tibia-32177065988-1/bin/client
  CLIENT_ROOT: /home/kasm-user/otclient-track-a/Tibia-32177065988-1
  TASK_ROOT: /tmp/otclient-native-login-current-sha
  BRIDGE_SOCKET: /tmp/otclient-native-login-current-sha/bridge.sock
  AUTH_SOCKET: /tmp/otclient-native-login-current-sha/auth.sock
  CHARACTER_SOCKET: /tmp/otclient-native-login-current-sha/character.sock
  CLIENT_VERSION: 15.32.current.ed5469

jobs:
  execute:
    name: Exact-SHA native auth to structural IN_GAME
    runs-on: [otclient, synology]
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert owner, runner and exact live client
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          test -f docs/agents/evidence/OTC-20260818-native-login-to-ingame-e2e/20260818-owner-authorized-secret-ingress-current-sha.md
          docker inspect "$CONTAINER" >/dev/null
          test "$(docker inspect "$CONTAINER" --format '{{.State.Status}}')" = running
          tmp="$RUNNER_TEMP/current-client"
          rm -f "$tmp"
          docker cp "$CONTAINER:$CLIENT" "$tmp" >/dev/null
          test "$(stat -c %s "$tmp")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$tmp" | awk '{print $1}')" = "$EXPECTED_SHA"
          chmod 600 "$tmp"
          echo CURRENT_EXACT_CLIENT=PASS
          echo SECRET_ACCESS=false
          echo LOGIN=false

      - name: Re-prove current-SHA RTTI, QMeta character route and IN_GAME markers
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/current-client" "$RUNNER_TEMP/current-targets.env" <<'PY'
          import hashlib,pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection

          p=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); raw=p.read_bytes()
          assert len(raw)==52109920 and hashlib.sha256(raw).hexdigest()=="ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8"
          with p.open('rb') as f:
              elf=ELFFile(f)
              secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
              rels=[]
              for s in elf.iter_sections():
                  if not isinstance(s,RelocationSection): continue
                  st=elf.get_section(s['sh_link']) if s['sh_link'] else None
                  for r in s.iter_relocations():
                      add=int(r['r_addend']) if r.is_RELA() else None; sym=''
                      if int(r['r_info_sym']) and st is not None:
                          try: sym=st.get_symbol(int(r['r_info_sym'])).name
                          except Exception: pass
                      rels.append((int(r['r_offset']),int(r['r_info_type']),add,sym))
          def ov(o):
              for n,x,z,v,fl in secs:
                  if x<=o<x+z:return v+o-x
          def vo(v):
              for n,x,z,b,fl in secs:
                  if b<=v<b+z:return x+v-b
              raise ValueError(hex(v))
          def u32(v): return struct.unpack_from('<I',raw,vo(v))[0]
          def i32(v): return struct.unpack_from('<i',raw,vo(v))[0]
          def q(v): return struct.unpack_from('<Q',raw,vo(v))[0]
          def bs(v,n): return raw[vo(v):vo(v)+n]
          def exe(v): return any((fl&4) and b<=v<b+z for _,_,z,b,fl in secs)
          byadd={}; byoff={}
          for ro,rt,ra,s in rels:
              if ra is not None: byadd.setdefault(ra,[]).append((ro,rt,s))
              byoff.setdefault(ro,[]).append((rt,ra,s))
          def rv(v):
              vals=[a for _,a,_ in byoff.get(v,[]) if a is not None]
              if vals and len(set(vals))==1:return vals[0]
              try:return q(v)
              except Exception:return None
          def exact_rtti(mangled):
              needle=mangled.encode()+b'\0'; poss=[]; pos=0
              while True:
                  x=raw.find(needle,pos)
                  if x<0:break
                  if x==0 or raw[x-1]==0: poss.append(ov(x))
                  pos=x+1
              ans=[]
              for nv in [x for x in poss if x is not None]:
                  for target,_,_ in byadd.get(nv,[]):
                      ti=target-8
                      for target2,_,_ in byadd.get(ti,[]):
                          header=target2-8
                          try:
                              if q(header)!=0: continue
                          except Exception: continue
                          vp=header+16; first=rv(vp)
                          if first and exe(first): ans.append(vp)
              ans=sorted(set(ans)); assert len(ans)==1,(mangled,ans); return ans[0]
          rtti={
            'game_client':('N5tibia6client11TGameClientE','tibia::client::TGameClient'),
            'character_controller':('N5tibia10gamewindow29TCharacterSelectionControllerE','tibia::gamewindow::TCharacterSelectionController'),
            'player_protocol_handler':('N5tibia4game29TPlayerProtocolMessageHandlerE','tibia::game::TPlayerProtocolMessageHandler'),
            'worldmap_handler':('N5tibia8worldmap31TWorldmapProtocolMessageHandlerE','tibia::worldmap::TWorldmapProtocolMessageHandler'),
            'gameserver_game_session':('N5tibia4game22TGameserverGameSessionE','tibia::game::TGameserverGameSession'),
          }
          vptr={name:exact_rtti(m) for name,(m,_) in rtti.items()}
          assert vptr['game_client']==0x30adce8
          assert vptr['character_controller']==0x30c3988
          for name,val in vptr.items(): print(f'CURRENT_RTTI_{name.upper()}_VPTR=0x{val:x}')

          def shits(text):
              b=text.encode()+b'\0'; a=[]; pos=0
              while True:
                  x=raw.find(b,pos)
                  if x<0:return [v for v in a if v is not None]
                  a.append(ov(x)); pos=x+1
          def qmeta(class_name, method_names):
              cvs=shits(class_name); mvs={m:shits(m) for m in method_names}
              assert cvs and all(len(v)==1 for v in mvs.values()),(class_name,cvs,mvs)
              candidates=[]
              for cv in cvs:
                  sec=next(s for s in secs if s[3]<=cv<s[3]+s[2]); lo=max(sec[3],cv-131072); start=cv-(cv%4)
                  for base in range(start,lo-1,-4):
                      try:r0=u32(base);l0=u32(base+4)
                      except Exception:continue
                      if l0!=len(class_name) or base+r0!=cv:continue
                      indices={}
                      for idx in range(1,512):
                          try:r=u32(base+8*idx);ln=u32(base+8*idx+4)
                          except Exception:break
                          for m,h in mvs.items():
                              if ln==len(m) and base+r==h[0]: indices[m]=idx
                      if len(indices)==len(method_names): candidates.append((base,cv,indices))
              unique={ (b,cv,tuple(sorted(ix.items()))) for b,cv,ix in candidates }
              assert len(unique)==1,(class_name,unique)
              base,cv,pairs=next(iter(unique)); indices=dict(pairs)
              mos=[]
              for ro,rt,ra,sn in rels:
                  if ra!=base:continue
                  mo=ro-8; data=rv(mo+16); call=rv(mo+24)
                  if data is None or call is None:continue
                  try:h=tuple(u32(data+4*i) for i in range(14))
                  except Exception:continue
                  if h[1]==0 and 0<h[4]<=512:mos.append((mo,data,call,h))
              mos=sorted(set(mos),key=lambda x:x[0]); assert len(mos)==1,(class_name,mos)
              mo,data,call,h=mos[0]; mc,md=h[4],h[5]
              rows=[tuple(u32(data+4*(md+6*i)+4*j) for j in range(6)) for i in range(mc)]
              ords={}
              for m,idx in indices.items():
                  hits=[(i,row) for i,row in enumerate(rows) if row[0]==idx]
                  assert len(hits)==1,(m,hits); ords[m]=hits[0]
              win=bs(call,64); tables=[]
              for op in (b'\x48\x8d\x35',b'\x48\x8d\x0d'):
                  pos=0
                  while True:
                      k=win.find(op,pos)
                      if k<0:break
                      disp=struct.unpack_from('<i',win,k+3)[0]; tb=call+k+7+disp
                      try: targets=[tb+i32(tb+4*i) for i in range(mc)]
                      except Exception: pos=k+1;continue
                      if all(exe(t) for t in targets): tables.append((tb,targets))
                      pos=k+1
              uniq={tb:ts for tb,ts in tables}; assert len(uniq)==1,(class_name,list(uniq))
              tb,targets=next(iter(uniq.items()))
              print(f'QMETA_{class_name}_METHOD_COUNT={mc}')
              for m,(ordn,row) in ords.items():
                  target=targets[ordn]; fence=bs(target,32); count=raw.count(fence)
                  print(f'QMETA_METHOD={class_name}|{m}|ordinal={ordn}|argc={row[1]}|target=0x{target:x}|fence_count={count}|fence={fence.hex()}')
                  assert count==1
              return mc,ords,targets
          mc,go,gt=qmeta('tibia::client::TGameClient',['onRequestLoginWithCredentials'])
          auth_ord,auth_row=go['onRequestLoginWithCredentials']; auth_target=gt[auth_ord]; auth_fence=bs(auth_target,32)
          assert mc==44 and auth_ord==17 and auth_row[1]==2 and auth_target==0xd196f0
          assert auth_fence.hex()=='488b5110488b71084883c4485b5de93d609cff0f1f440000488bbfa009000048'
          _,co,ct=qmeta('tibia::gamewindow::TCharacterSelectionController',['requestCharacterLogin','onCharacterSelectionConfirmed'])
          assert co['onCharacterSelectionConfirmed'][1][1]==0
          qmeta('tibia::authentication::TAuthenticationProcessController',['requestCharacterGameserverLogin','onStartGameServerLoginStateEntered'])
          targets=';'.join(f"{n},{vptr[n]:x},{rtti[n][1]}" for n in sorted(vptr))
          out.write_text('TARGETS='+targets+'\nCHAR_VPTR=0x%x\n'%vptr['character_controller'])
          print('CURRENT_AUTH_CONTRACT=PASS')
          print('CURRENT_CHARACTER_CONTRACT=PASS')
          print('CURRENT_INGAME_MARKER_CONTRACT=PASS')
          PY
          echo SECRET_ACCESS=false
          echo LOGIN=false

      - name: Build exact-SHA auth and bounded character helpers
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          source "$RUNNER_TEMP/current-targets.env"
          src="$RUNNER_TEMP/bridge-src"; build="$RUNNER_TEMP/bridge-build"
          rm -rf "$src" "$build"; cp -a tools/tibia_runtime_bridge "$src"
          python3 - "$src/experimental_auth.cpp" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          repl={
            'constexpr std::uint64_t kClientSize = 51965216;':'constexpr std::uint64_t kClientSize = 52109920;',
            'constexpr char kClientSha256[] = "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe";':'constexpr char kClientSha256[] = "ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8";',
            'constexpr std::uintptr_t kGameClientVptrOffset = 0x3076908;':'constexpr std::uintptr_t kGameClientVptrOffset = 0x30adce8;',
            'constexpr std::uintptr_t kColdAuthTargetOffset = 0xd06850;':'constexpr std::uintptr_t kColdAuthTargetOffset = 0xd196f0;',
          }
          for a,b in repl.items():
              assert s.count(a)==1,a; s=s.replace(a,b)
          block='''constexpr std::array<unsigned char, 32> kColdAuthFence = {
              0x48, 0x8b, 0x51, 0x10, 0x48, 0x8b, 0x71, 0x08,
              0x48, 0x83, 0xc4, 0x48, 0x5b, 0x5d, 0xe9, 0x3d,
              0x60, 0x9c, 0xff, 0x0f, 0x1f, 0x44, 0x00, 0x00,
              0x48, 0x8b, 0xbf, 0xa0, 0x09, 0x00, 0x00, 0x48,
          };'''
          s,n=re.subn(r'constexpr std::array<unsigned char, 32> kColdAuthFence = \{.*?\n\};',block,s,count=1,flags=re.S)
          assert n==1
          p.write_text(s)
          PY
          cat > "$src/character_control.cpp" <<'CPP'
          #ifndef _GNU_SOURCE
          #define _GNU_SOURCE
          #endif
          #include <QtCore/QCoreApplication>
          #include <QtCore/QCryptographicHash>
          #include <QtCore/QFile>
          #include <QtCore/QJsonArray>
          #include <QtCore/QJsonDocument>
          #include <QtCore/QJsonObject>
          #include <QtCore/QList>
          #include <QtCore/QMetaMethod>
          #include <QtCore/QMetaObject>
          #include <QtCore/QMetaProperty>
          #include <QtCore/QObject>
          #include <QtCore/QSequentialIterable>
          #include <QtCore/QThread>
          #include <QtCore/QVariant>
          #include <algorithm>
          #include <atomic>
          #include <cerrno>
          #include <chrono>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>
          #include <fstream>
          #include <link.h>
          #include <string>
          #include <thread>
          #include <vector>
          #include <sys/socket.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <sys/un.h>
          #include <unistd.h>
          namespace {
          constexpr std::uint64_t kSize=52109920;
          constexpr char kSha[]="ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8";
          constexpr std::uintptr_t kVptr=0x30c3988;
          constexpr char kClass[]="tibia::gamewindow::TCharacterSelectionController";
          struct R{std::uintptr_t b,e;}; std::atomic<std::uintptr_t> base{0}; std::string sockPath;
          int ph(dl_phdr_info*i,std::size_t,void*){if(i&&(!i->dlpi_name||!i->dlpi_name[0])){base=i->dlpi_addr;return 1;}return 0;}
          bool exact(){struct stat st{};if(::stat("/proc/self/exe",&st)||st.st_size!=(off_t)kSize)return false;QFile f("/proc/self/exe");if(!f.open(QIODevice::ReadOnly))return false;QCryptographicHash h(QCryptographicHash::Sha256);while(!f.atEnd()){auto b=f.read(1<<20);if(b.isEmpty()&&f.error()!=QFileDevice::NoError)return false;h.addData(b);}return h.result().toHex()==QByteArray(kSha);}
          std::vector<R> regs(){std::ifstream f("/proc/self/maps");std::vector<R> r;std::string l;while(std::getline(f,l)){unsigned long long a=0,b=0;char p[5]{};if(std::sscanf(l.c_str(),"%llx-%llx %4s",&a,&b,p)==3&&p[0]=='r'&&p[1]=='w'&&b>a&&b-a<=(512ull<<20))r.push_back({(uintptr_t)a,(uintptr_t)b});}return r;}
          bool inside(const std::vector<R>&r,uintptr_t x){return std::any_of(r.begin(),r.end(),[&](auto z){return z.b<=x&&x<z.e;});}
          QObject* controller(){auto rs=regs();int fd=::open("/proc/self/mem",O_RDONLY|O_CLOEXEC);if(fd<0)return nullptr;std::vector<QObject*> hits;std::vector<unsigned char> buf(1<<20);auto want=base.load()+kVptr;for(auto rg:rs){for(uintptr_t c=rg.b;c<rg.e;){size_t n=std::min<size_t>(buf.size(),rg.e-c);if(::pread(fd,buf.data(),n,c)!=(ssize_t)n){::close(fd);return nullptr;}for(size_t o=0;o+16<=n;o+=8){uintptr_t v=0,d=0;std::memcpy(&v,buf.data()+o,8);if(v!=want)continue;std::memcpy(&d,buf.data()+o+8,8);if(!d||!inside(rs,d))continue;auto*q=reinterpret_cast<QObject*>(c+o);const QMetaObject*m=q->metaObject();if(m&&m->className()&&std::strcmp(m->className(),kClass)==0)hits.push_back(q);}c+=n;}}::close(fd);std::sort(hits.begin(),hits.end());hits.erase(std::unique(hits.begin(),hits.end()),hits.end());return hits.size()==1?hits[0]:nullptr;}
          int listCount(const QVariant&v,QJsonArray*names){if(v.canConvert<QVariantList>()){auto xs=v.toList();if(names){for(const auto&x:xs){QString name;QObject*o=x.value<QObject*>();if(o){auto m=o->metaObject();for(const char*n:{"name","characterName"}){int i=m->indexOfProperty(n);if(i>=0){name=m->property(i).read(o).toString();if(!name.isEmpty())break;}}}else if(const QMetaObject*m=x.metaType().metaObject()){for(const char*n:{"name","characterName"}){int i=m->indexOfProperty(n);if(i>=0){name=m->property(i).readOnGadget(x.constData()).toString();if(!name.isEmpty())break;}}}names->append(name);}}return xs.size();}if(v.canConvert<QSequentialIterable>()){auto it=v.value<QSequentialIterable>();int n=0;for(const QVariant&x:it){Q_UNUSED(x);++n;}return n;}return -1;}
          QJsonObject state(QObject*o){QJsonObject j{{"ok",true},{"class",kClass}};const auto*m=o->metaObject();QJsonArray props;for(int i=m->propertyOffset();i<m->propertyCount();++i){auto p=m->property(i);QJsonObject q{{"name",p.name()},{"type",p.typeName()},{"readable",p.isReadable()},{"writable",p.isWritable()}};props.append(q);}j["properties"]=props;int ci=m->indexOfProperty("characterList");QJsonArray names;if(ci>=0){QVariant v=m->property(ci).read(o);j["character_count"]=listCount(v,&names);j["character_names"]=names;}else j["character_count"]=-1;int si=m->indexOfProperty("selectedCharacters");QJsonArray sel;if(si>=0){QVariant v=m->property(si).read(o);if(v.canConvert<QList<int>>()){for(int x:v.value<QList<int>>())sel.append(x);}else if(v.canConvert<QVariantList>()){for(auto x:v.toList())sel.append(x.toInt());}}j["selected_indices"]=sel;j["confirm_method_present"]=m->indexOfMethod("onCharacterSelectionConfirmed()")>=0;return j;}
          QJsonObject dispatch(const std::string&cmd){auto*app=QCoreApplication::instance();if(!app)return QJsonObject{{"ok",false},{"error","QCOREAPPLICATION_UNAVAILABLE"}};QJsonObject result;bool ok=QMetaObject::invokeMethod(app,[&]{QObject*o=controller();if(!o){result={{"ok",false},{"error","CHARACTER_CONTROLLER_NOT_UNIQUE"}};return;}if(cmd=="STATE"){result=state(o);return;}if(cmd!="CONFIRM_UNIQUE"){result={{"ok",false},{"error","UNKNOWN_COMMAND"}};return;}auto s=state(o);if(s.value("character_count").toInt(-1)!=1){result={{"ok",false},{"error","CHARACTER_COUNT_NOT_ONE"},{"character_count",s.value("character_count")}};return;}const auto*m=o->metaObject();int pi=m->indexOfProperty("selectedCharacters");if(pi<0||!m->property(pi).isWritable()){result={{"ok",false},{"error","SELECTED_CHARACTERS_NOT_WRITABLE"}};return;}QVariant nv=QVariant::fromValue(QList<int>{0});if(!m->property(pi).write(o,nv)){result={{"ok",false},{"error","SELECTED_CHARACTERS_WRITE_FAILED"}};return;}QVariant chk=m->property(pi).read(o);auto xs=chk.value<QList<int>>();if(xs.size()!=1||xs.front()!=0){result={{"ok",false},{"error","SELECTED_CHARACTERS_VERIFY_FAILED"}};return;}if(m->indexOfMethod("onCharacterSelectionConfirmed()")<0){result={{"ok",false},{"error","CONFIRM_METHOD_MISSING"}};return;}bool invoked=QMetaObject::invokeMethod(o,"onCharacterSelectionConfirmed",Qt::DirectConnection);result=invoked?QJsonObject{{"ok",true},{"character_index",0},{"confirmation_dispatched",true}}:QJsonObject{{"ok",false},{"error","CONFIRM_INVOKE_FAILED"}};},Qt::BlockingQueuedConnection);return ok?result:QJsonObject{{"ok",false},{"error","QT_INVOKE_FAILED"}};}
          bool same(int c){ucred u{};socklen_t n=sizeof(u);return ::getsockopt(c,SOL_SOCKET,SO_PEERCRED,&u,&n)==0&&n==sizeof(u)&&u.uid==::geteuid();}
          void server(){for(int i=0;i<400&&!QCoreApplication::instance();++i)std::this_thread::sleep_for(std::chrono::milliseconds(25));if(!QCoreApplication::instance()||!exact())return;dl_iterate_phdr(ph,nullptr);const char*s=std::getenv("OTCLIENT_TIBIA_RE_CHARACTER_SOCKET");if(!s||s[0]!='/')return;sockPath=s;::unlink(sockPath.c_str());int fd=::socket(AF_UNIX,SOCK_STREAM|SOCK_CLOEXEC,0);if(fd<0)return;::umask(0077);sockaddr_un a{};a.sun_family=AF_UNIX;if(sockPath.size()>=sizeof(a.sun_path)){::close(fd);return;}std::strncpy(a.sun_path,sockPath.c_str(),sizeof(a.sun_path)-1);if(::bind(fd,(sockaddr*)&a,sizeof(a))||::chmod(sockPath.c_str(),0600)||::listen(fd,4)){::close(fd);::unlink(sockPath.c_str());return;}for(;;){int c=::accept4(fd,nullptr,nullptr,SOCK_CLOEXEC);if(c<0){if(errno==EINTR)continue;break;}char b[64]{};ssize_t n=::read(c,b,sizeof(b)-1);std::string cmd=n>0?std::string(b,(size_t)n):std::string{};while(!cmd.empty()&&(cmd.back()=='\n'||cmd.back()=='\r'))cmd.pop_back();QJsonObject j=same(c)?dispatch(cmd):QJsonObject{{"ok",false},{"error","IPC_PEER_UID_MISMATCH"}};QByteArray x=QJsonDocument(j).toJson(QJsonDocument::Compact);x.append('\n');::write(c,x.constData(),x.size());::close(c);}::close(fd);::unlink(sockPath.c_str());}
          __attribute__((constructor)) void init(){std::thread(server).detach();}
          }
          CPP
          cat >> "$src/CMakeLists.txt" <<'CMAKE'
          add_library(otclient_tibia_character_experimental SHARED character_control.cpp)
          target_link_libraries(otclient_tibia_character_experimental PRIVATE Qt6::Core Threads::Threads ${CMAKE_DL_LIBS})
          target_compile_options(otclient_tibia_character_experimental PRIVATE -Wall -Wextra -Wpedantic -Werror)
          set_target_properties(otclient_tibia_character_experimental PROPERTIES PREFIX "" OUTPUT_NAME "otclient-tibia-character-experimental")
          CMAKE
          cmake -S "$src" -B "$build" -G Ninja -DOTCLIENT_TIBIA_RE_BUILD_EXPERIMENTAL_AUTH=ON
          cmake --build "$build" --parallel 2
          test -f "$build/otclient-tibia-runtime-bridge.so"
          test -f "$build/otclient-tibia-native-auth-experimental.so"
          test -f "$build/otclient-tibia-character-experimental.so"
          echo CURRENT_HELPERS_BUILD=PASS
          echo SECRET_ACCESS=false
          echo LOGIN=false

      - name: Replace only exact live client with helper-enabled KasmVNC runtime
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          source "$RUNNER_TEMP/current-targets.env"
          build="$RUNNER_TEMP/bridge-build"
          docker exec -u 0 "$CONTAINER" /bin/sh -lc "rm -rf '$TASK_ROOT'; mkdir -p '$TASK_ROOT/repo'; chown -R kasm-user:kasm-user '$TASK_ROOT'"
          docker cp "$build/otclient-tibia-runtime-bridge.so" "$CONTAINER:$TASK_ROOT/bridge.so" >/dev/null
          docker cp "$build/otclient-tibia-native-auth-experimental.so" "$CONTAINER:$TASK_ROOT/auth.so" >/dev/null
          docker cp "$build/otclient-tibia-character-experimental.so" "$CONTAINER:$TASK_ROOT/character.so" >/dev/null
          docker cp tools "$CONTAINER:$TASK_ROOT/repo/" >/dev/null
          docker exec -u 0 "$CONTAINER" chown -R kasm-user:kasm-user "$TASK_ROOT"
          docker exec -u kasm-user "$CONTAINER" python3 - "$CLIENT" <<'PY'
          import os,pathlib,signal,sys,time
          target=os.path.realpath(sys.argv[1]); p=[]
          for d in pathlib.Path('/proc').iterdir():
              if not d.name.isdigit():continue
              try:
                  if os.path.realpath(str(d/'exe'))==target:p.append(int(d.name))
              except OSError:pass
          if len(p)!=1:raise SystemExit(f'exact live client count must be 1, got {len(p)}')
          os.kill(p[0],signal.SIGTERM)
          for _ in range(100):
              if not pathlib.Path(f'/proc/{p[0]}').exists():break
              time.sleep(.1)
          if pathlib.Path(f'/proc/{p[0]}').exists():raise SystemExit('exact live client did not exit')
          print('PREVIOUS_EXACT_CLIENT_STOPPED=PASS')
          PY
          uid="$(docker exec "$CONTAINER" id -u kasm-user)"
          docker exec -d -u kasm-user -w "$CLIENT_ROOT" \
            -e DISPLAY=:1 -e HOME=/home/kasm-user -e XDG_RUNTIME_DIR="/run/user/$uid" \
            -e LD_PRELOAD="$TASK_ROOT/auth.so:$TASK_ROOT/character.so:$TASK_ROOT/bridge.so" \
            -e OTCLIENT_TIBIA_RE_SOCKET="$BRIDGE_SOCKET" \
            -e OTCLIENT_TIBIA_RE_AUTH_SOCKET="$AUTH_SOCKET" \
            -e OTCLIENT_TIBIA_RE_CHARACTER_SOCKET="$CHARACTER_SOCKET" \
            -e OTCLIENT_TIBIA_RE_BINARY_SHA256="$EXPECTED_SHA" \
            -e OTCLIENT_TIBIA_RE_CLIENT_VERSION="$CLIENT_VERSION" \
            -e OTCLIENT_TIBIA_RE_TARGETS="$TARGETS" \
            "$CONTAINER" ./bin/client
          for _ in $(seq 1 160); do
            if docker exec -u kasm-user "$CONTAINER" test -S "$BRIDGE_SOCKET" && docker exec -u kasm-user "$CONTAINER" test -S "$AUTH_SOCKET" && docker exec -u kasm-user "$CONTAINER" test -S "$CHARACTER_SOCKET"; then break; fi
            sleep .25
          done
          docker exec -u kasm-user "$CONTAINER" test -S "$BRIDGE_SOCKET"
          docker exec -u kasm-user "$CONTAINER" test -S "$AUTH_SOCKET"
          docker exec -u kasm-user "$CONTAINER" test -S "$CHARACTER_SOCKET"
          docker exec -u kasm-user -e PYTHONPATH="$TASK_ROOT/repo" "$CONTAINER" python3 -m tools.tibia_runtime_bridge.ipc_client --socket "$BRIDGE_SOCKET" ping >/dev/null
          echo HELPER_ENABLED_KASM_RUNTIME=PASS
          echo DISPLAY=:1
          echo SECRET_ACCESS=false
          echo LOGIN=false

      - name: Consume repository Secrets through bounded sealed-memfd ingress
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          test -n "${TIBIA_TEST_EMAIL:-}"
          test -n "${TIBIA_TEST_PASSWORD:-}"
          docker exec -i -u kasm-user \
            -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD \
            -e PYTHONPATH="$TASK_ROOT/repo" \
            -e BRIDGE_SOCKET="$BRIDGE_SOCKET" -e AUTH_SOCKET="$AUTH_SOCKET" \
            -e EXPECTED_SHA="$EXPECTED_SHA" -e EXPECTED_SIZE="$EXPECTED_SIZE" -e CLIENT_VERSION="$CLIENT_VERSION" \
            "$CONTAINER" python3 - <<'PY'
          import ctypes,fcntl,json,os,resource,struct
          from pathlib import Path
          from tools.tibia_runtime_bridge.ipc_client import PeerIdentityExpectation,request
          from tools.tibia_runtime_bridge.experimental_auth_client import auth_with_credentials_fd
          resource.setrlimit(resource.RLIMIT_CORE,(0,0)); libc=ctypes.CDLL(None,use_errno=True)
          if hasattr(libc,'prctl'): libc.prctl(4,0,0,0,0)
          eb=os.environb.pop(b'TIBIA_TEST_EMAIL',None); pb=os.environb.pop(b'TIBIA_TEST_PASSWORD',None)
          if not eb or not pb: raise SystemExit('required repository Secrets unavailable')
          email=bytearray(eb); password=bytearray(pb); del eb,pb
          if not (1<=len(email)<=1024 and 1<=len(password)<=1024) or 0 in email or 0 in password: raise SystemExit('secret length/content fence failed')
          fd=os.memfd_create('otclient-tibia-native-auth',os.MFD_ALLOW_SEALING|getattr(os,'MFD_CLOEXEC',0))
          try:
              frame=struct.pack('<II',len(email),len(password)); n=os.writev(fd,[frame,memoryview(email),memoryview(password)])
              if n!=8+len(email)+len(password): raise SystemExit('sealed memfd write incomplete')
              seals=fcntl.F_SEAL_SEAL|fcntl.F_SEAL_SHRINK|fcntl.F_SEAL_GROW|fcntl.F_SEAL_WRITE; fcntl.fcntl(fd,fcntl.F_ADD_SEALS,seals)
              for b in (email,password): ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(b)),0,len(b))
              ping=request(Path(os.environ['BRIDGE_SOCKET']),'PING')
              if not ping.get('ok') or ping.get('client_sha256')!=os.environ['EXPECTED_SHA'] or ping.get('client_size')!=int(os.environ['EXPECTED_SIZE']): raise SystemExit('runtime PING identity fence failed')
              exp=PeerIdentityExpectation(boot_id_sha256=ping['boot_id_sha256'],pid=ping['pid'],process_start_ticks=ping['process_start_ticks'],client_version=os.environ['CLIENT_VERSION'],client_size=int(os.environ['EXPECTED_SIZE']),client_sha256=os.environ['EXPECTED_SHA'])
              request(Path(os.environ['BRIDGE_SOCKET']),'PING',expected_identity=exp)
              r=auth_with_credentials_fd(Path(os.environ['AUTH_SOCKET']),fd,expected_identity=exp)
              if not (r.get('ok') is True and r.get('invocation_dispatched') is True and r.get('qmeta_method_id')==17): raise SystemExit('native auth dispatch failed: '+str(r.get('error','unknown')))
              print('NATIVE_AUTH_DISPATCH=PASS')
              print('NATIVE_AUTH_QMETA_METHOD_ID=17')
              print('SECRET_VALUES_LOGGED=false')
          finally:
              for b in (email,password):
                  if b: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(b)),0,len(b))
              os.close(fd)
          PY
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD

      - name: Resolve current native character model and confirm only an unambiguous singleton
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          docker exec -i -u kasm-user -e PYTHONPATH="$TASK_ROOT/repo" -e BRIDGE_SOCKET="$BRIDGE_SOCKET" -e CHARACTER_SOCKET="$CHARACTER_SOCKET" -e EXPECTED_SHA="$EXPECTED_SHA" -e EXPECTED_SIZE="$EXPECTED_SIZE" -e CLIENT_VERSION="$CLIENT_VERSION" "$CONTAINER" python3 - <<'PY'
          import json,os,socket,struct,time
          from pathlib import Path
          from tools.tibia_runtime_bridge.ipc_client import PeerIdentityExpectation,_verify_peer_identity,request
          bridge=Path(os.environ['BRIDGE_SOCKET']); cs=Path(os.environ['CHARACTER_SOCKET'])
          def expectation():
              p=request(bridge,'PING'); return PeerIdentityExpectation(p['boot_id_sha256'],p['pid'],p['process_start_ticks'],os.environ['CLIENT_VERSION'],int(os.environ['EXPECTED_SIZE']),os.environ['EXPECTED_SHA'])
          exp=expectation(); request(bridge,'PING',expected_identity=exp)
          def cmd(text):
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM);s.settimeout(3);s.connect(str(cs));_verify_peer_identity(s,exp);s.sendall(text.encode()+b'\n');raw=b''
              while b'\n' not in raw:
                  q=s.recv(4096)
                  if not q:break
                  raw+=q
              s.close();return json.loads(raw.split(b'\n',1)[0])
          state=None
          for _ in range(120):
              state=cmd('STATE')
              if state.get('ok') and isinstance(state.get('character_count'),int) and state['character_count']>=0:break
              time.sleep(.5)
          if not state or not state.get('ok'): raise SystemExit('native character controller/model unavailable')
          count=state.get('character_count',-1); print('NATIVE_CHARACTER_COUNT='+str(count))
          if count!=1:
              print('NATIVE_CHARACTER_CONFIRM=OWNER_DECISION_REQUIRED')
              raise SystemExit(78)
          r=cmd('CONFIRM_UNIQUE')
          if not (r.get('ok') and r.get('confirmation_dispatched') and r.get('character_index')==0): raise SystemExit('native singleton character confirmation failed: '+str(r.get('error','unknown')))
          print('NATIVE_CHARACTER_SINGLETON_INDEX=0')
          print('NATIVE_CHARACTER_CONFIRM=PASS')
          PY

      - name: Prove causal structural IN_GAME
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          docker exec -i -u kasm-user -e PYTHONPATH="$TASK_ROOT/repo" -e BRIDGE_SOCKET="$BRIDGE_SOCKET" -e EXPECTED_SHA="$EXPECTED_SHA" -e EXPECTED_SIZE="$EXPECTED_SIZE" -e CLIENT_VERSION="$CLIENT_VERSION" "$CONTAINER" python3 - <<'PY'
          import os,time
          from pathlib import Path
          from tools.tibia_runtime_bridge.ipc_client import PeerIdentityExpectation,request,session_status
          b=Path(os.environ['BRIDGE_SOCKET']); p=request(b,'PING'); exp=PeerIdentityExpectation(p['boot_id_sha256'],p['pid'],p['process_start_ticks'],os.environ['CLIENT_VERSION'],int(os.environ['EXPECTED_SIZE']),os.environ['EXPECTED_SHA']);request(b,'PING',expected_identity=exp)
          last=None
          for _ in range(180):
              last=session_status(b,expected_identity=exp)
              if last.get('ok') and last.get('in_game_candidate'):
                  print('RESULT=SUCCESS');print('CHARACTER_ACTUALLY_LOGGED_INTO_GAME=YES');print('CAUSAL_PROOF=COMPLETE');print('STRUCTURAL_IN_GAME=PASS');raise SystemExit(0)
              time.sleep(.5)
          markers=(last or {}).get('markers',{});print('STRUCTURAL_IN_GAME=FAIL')
          for k in ('player_protocol_handler','gameserver_game_session','worldmap_handler'):
              print(k.upper()+'_HITS='+str(markers.get(k,{}).get('validated_hits','UNKNOWN')))
          raise SystemExit(2)
          PY

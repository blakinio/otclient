name: Track A installed current-SHA native-login QMeta reproof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-current-sha-qmeta-local.yml

permissions:
  contents: read

jobs:
  qmeta:
    name: Decode installed exact-SHA Qt MOC auth metadata read-only
    runs-on: [otclient, synology]
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
      EXPECTED_SIZE: '52109920'
      CLIENT: /home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Read-only exact client QMeta decode
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ -f "$CLIENT" && ! -L "$CLIENT" ]]
          [[ "$(stat -c %s "$CLIENT")" == "$EXPECTED_SIZE" ]]
          [[ "$(sha256sum "$CLIENT" | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          echo QMETA_LOCAL_EXACT_CLIENT=PASS
          echo QMETA_LOCAL_RUNTIME_MUTATION=false
          echo QMETA_LOCAL_SECRET_ACCESS=false
          echo QMETA_LOCAL_LOGIN=false
          echo QMETA_LOCAL_CLIENT_EXECUTION=false
          python3 - "$CLIENT" <<'PY'
          import hashlib,pathlib,struct,sys
          p=pathlib.Path(sys.argv[1]); raw=p.read_bytes(); cn=b'tibia::client::TGameClient'; mn=b'onRequestLoginWithCredentials'
          try:
              from elftools.elf.elffile import ELFFile
              from elftools.elf.relocation import RelocationSection
          except ImportError as e: raise SystemExit('pyelftools unavailable on runner')
          with p.open('rb') as f:
              e=ELFFile(f); secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in e.iter_sections()]; rels=[]
              for s in e.iter_sections():
                  if not isinstance(s,RelocationSection):continue
                  st=e.get_section(s['sh_link']) if s['sh_link'] else None
                  for r in s.iter_relocations():
                      add=int(r['r_addend']) if r.is_RELA() else None; sym=''
                      if int(r['r_info_sym']) and st is not None:
                          try:sym=st.get_symbol(int(r['r_info_sym'])).name
                          except Exception:pass
                      rels.append((int(r['r_offset']),int(r['r_info_type']),add,sym))
          def ov(o):
              for n,x,z,v,fl in secs:
                  if x<=o<x+z:return v+o-x
          def vo(v):
              for n,x,z,b,fl in secs:
                  if b<=v<b+z:return x+v-b
              raise ValueError(hex(v))
          def u32(v):return struct.unpack_from('<I',raw,vo(v))[0]
          def q(v):return struct.unpack_from('<Q',raw,vo(v))[0]
          def bs(v,n):return raw[vo(v):vo(v)+n]
          def hits(s):
              out=[];i=0
              while True:
                  j=raw.find(s+b'\0',i)
                  if j<0:return out
                  v=ov(j)
                  if v is not None:out.append(v)
                  i=j+1
          cvs=hits(cn);mvs=hits(mn)
          print('QMETA_LOCAL_CLASS_STRINGS='+','.join(hex(x) for x in cvs));print('QMETA_LOCAL_METHOD_STRINGS='+','.join(hex(x) for x in mvs))
          assert cvs and len(mvs)==1; mv=mvs[0]
          bases=[]
          for cv in cvs:
              sec=next(x for x in secs if x[3]<=cv<x[3]+x[2]); lo=max(sec[3],cv-65536)
              start=cv-(cv%4)
              for base in range(start,lo-1,-4):
                  try:r0=u32(base);l0=u32(base+4)
                  except Exception:continue
                  if l0==len(cn) and base+r0==cv:bases.append((base,cv))
          bases=sorted(set(bases));print('QMETA_LOCAL_BASE_CANDIDATES='+','.join(f'{b:#x}->{c:#x}' for b,c in bases))
          structs=[]
          for base,cv in bases:
              for idx in range(1,256):
                  try:r=u32(base+8*idx);ln=u32(base+8*idx+4)
                  except Exception:break
                  if ln==len(mn) and base+r==mv:structs.append((base,idx,cv))
          structs=sorted(set(structs));print('QMETA_LOCAL_STRUCT_COUNT='+str(len(structs)))
          for b,i,c in structs:print(f'QMETA_LOCAL_STRUCT=base:{b:#x},index:{i},class:{c:#x}')
          assert len(structs)==1;base,idx,cv=structs[0]
          by={}
          for o,t,a,s in rels:by.setdefault(o,[]).append((t,a,s))
          def rv(v):
              vals=[a for t,a,s in by.get(v,[]) if a is not None]
              if len(set(vals))==1:return vals[0]
              try:return q(v)
              except Exception:return None
          mos=[]
          for o,t,a,s in rels:
              if a!=base:continue
              mo=o-8;data=rv(mo+16);call=rv(mo+24)
              if data is None or call is None:continue
              try:h=tuple(u32(data+4*i) for i in range(14))
              except Exception:continue
              mos.append((mo,data,call,h))
          mos=sorted(set(mos),key=lambda x:x[0]);print('QMETA_LOCAL_METAOBJECT_COUNT='+str(len(mos)))
          for mo,d,c,h in mos:print(f'QMETA_LOCAL_METAOBJECT=mo:{mo:#x},data:{d:#x},call:{c:#x},rev:{h[0]},classidx:{h[1]},methods:{h[4]},mdata:{h[5]},signals:{h[13]}')
          if len(mos)!=1:
              for o,t,a,s in rels:
                  if a==base:print(f'QMETA_LOCAL_BASE_RELOC=off:{o:#x},type:{t},sym:{s}')
              raise SystemExit('metaobject binding not unique')
          mo,data,call,h=mos[0];rev,cl,cc,cd,mc,md,pc,pd,ec,ed,kc,kd,flags,sc=h
          assert cl==0 and rev in (10,11,12,13) and 0<mc<=256
          rows=[]
          for i in range(mc):rows.append(tuple(u32(data+4*(md+6*i)+4*j) for j in range(6)))
          auth=[(i,r) for i,r in enumerate(rows) if r[0]==idx];print('QMETA_LOCAL_AUTH_ROWS='+repr(auth))
          assert len(auth)==1 and auth[0][1][1]==2
          ordinal,row=auth[0];fence=bs(call,32)
          print(f'QMETA_LOCAL_STATIC_METAOBJECT={mo:#x}');print(f'QMETA_LOCAL_STRINGDATA={base:#x}');print(f'QMETA_LOCAL_METADATA={data:#x}');print(f'QMETA_LOCAL_STATIC_METACALL={call:#x}')
          print(f'QMETA_LOCAL_METHOD_COUNT={mc}');print(f'QMETA_LOCAL_AUTH_STRING_INDEX={idx}');print(f'QMETA_LOCAL_AUTH_LOCAL_ORDINAL={ordinal}')
          print('QMETA_LOCAL_STATIC_METACALL_FENCE32='+fence.hex());print('QMETA_LOCAL_STATIC_METACALL_FENCE_SHA256='+hashlib.sha256(fence).hexdigest());print('QMETA_LOCAL_RESULT=PASS')
          PY

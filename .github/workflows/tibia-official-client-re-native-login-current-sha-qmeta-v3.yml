name: Track A current-SHA native-login QMeta reproof v3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-current-sha-qmeta-v3.yml

permissions:
  contents: read

jobs:
  qmeta:
    name: Decode exact-SHA Qt MOC auth metadata without client execution
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
      EXPECTED_SIZE: '52109920'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch exact current client and decode Qt MOC structures
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          echo QMETA_V3_RUNTIME_ACCESS=none
          echo QMETA_V3_MUTATION=false
          echo QMETA_V3_SECRET_ACCESS=false
          echo QMETA_V3_LOGIN=false
          echo QMETA_V3_CLIENT_EXECUTION=false

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools >/dev/null
          root="$RUNNER_TEMP/qmeta-v3"; rm -rf "$root"; mkdir -m700 -p "$root/w/bin" "$root/w/state" "$root/c"
          cleanup(){ [[ -n "${wp:-}" ]] && kill "$wp" 2>/dev/null || true; rm -rf "$root"; }; trap cleanup EXIT INT TERM HUP
          cd "$root/w/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c - >/dev/null
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c - >/dev/null
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$root/w/state"; "$root/w/bin/wgcf" register --accept-tos >/dev/null; "$root/w/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25347\n' "$root/w/state/wgcf-profile.conf" > w.conf
          nohup "$root/w/bin/wireproxy" -c w.conf >"$root/w/wp.log" 2>&1 </dev/null & wp=$!
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25347 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$root/w/trace" 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' "$root/w/trace"

          base=https://static.tibia.com/launcher/tibiaclient-linux-current/
          curl --socks5-hostname 127.0.0.1:25347 --compressed -fsSL --retry 4 --retry-all-errors "${base}package.json" -o "$root/c/package.json"
          readarray -t m < <(python3 - "$root/c/package.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); rows=[]
          def w(v):
              if isinstance(v,dict):
                  u=v.get('url');p=v.get('packedhash');q=v.get('unpackedhash')
                  if isinstance(u,str) and isinstance(p,str): rows.append((u,p,q if isinstance(q,str) else ''))
                  for z in v.values():w(z)
              elif isinstance(v,list):
                  for z in v:w(z)
          w(d); h=[x for x in rows if x[0].endswith('client.lzma')]
          assert len(h)==1; print(*h[0],sep='\n')
          PY
          )
          rel=${m[0]}; case "$rel" in http*) url=$rel;; /*) url="https://static.tibia.com$rel";; *) url="$base$rel";; esac
          curl --socks5-hostname 127.0.0.1:25347 --compressed -fsSL --retry 4 --retry-all-errors "$url" -o "$root/c/client.lzma"
          [[ "$(sha256sum "$root/c/client.lzma"|awk '{print $1}')" == "${m[1]}" ]]
          python3 - "$root/c/client.lzma" "$root/c/client" "${m[2]}" "$EXPECTED_SHA" "$EXPECTED_SIZE" <<'PY'
          import hashlib,lzma,pathlib,sys
          s,d,m,e,z=sys.argv[1:];b=pathlib.Path(s).read_bytes();q=b[32];lc=q%9;t=q//9;lp=t%5;pb=t//5;ds=int.from_bytes(b[33:37],'little')
          r=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}]);h=hashlib.sha256(r).hexdigest()
          assert h==m.lower()==e and len(r)==int(z);pathlib.Path(d).write_bytes(r);print('QMETA_V3_EXACT_CLIENT=PASS')
          PY

          python3 - "$root/c/client" <<'PY'
          import hashlib,pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection
          p=pathlib.Path(sys.argv[1]);raw=p.read_bytes();cn=b'tibia::client::TGameClient';mn=b'onRequestLoginWithCredentials'
          with p.open('rb') as f:
              e=ELFFile(f);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in e.iter_sections()];rels=[]
              for s in e.iter_sections():
                  if not isinstance(s,RelocationSection):continue
                  st=e.get_section(s['sh_link']) if s['sh_link'] else None
                  for r in s.iter_relocations():
                      a=int(r['r_addend']) if r.is_RELA() else None;sy=''
                      if int(r['r_info_sym']) and st is not None:
                          try:sy=st.get_symbol(int(r['r_info_sym'])).name
                          except:pass
                      rels.append((int(r['r_offset']),int(r['r_info_type']),a,sy))
          def ov(o):
              for n,x,z,v,fl in secs:
                  if x<=o<x+z:return v+o-x
          def vo(v):
              for n,x,z,b,fl in secs:
                  if b<=v<b+z:return x+v-b
              raise ValueError(hex(v))
          def u32(v):return struct.unpack_from('<I',raw,vo(v))[0]
          def q(v):return struct.unpack_from('<Q',raw,vo(v))[0]
          def bs(v,n):return raw[vo(v):vo(v)+n]
          def hits(s):
              out=[];i=0
              while 1:
                  j=raw.find(s+b'\0',i)
                  if j<0:return out
                  v=ov(j)
                  if v is not None:out.append(v)
                  i=j+1
          cvs=hits(cn);mvs=hits(mn);print('QMETA_V3_CLASS_STRINGS='+','.join(hex(x) for x in cvs));print('QMETA_V3_METHOD_STRINGS='+','.join(hex(x) for x in mvs))
          assert cvs and len(mvs)==1;mv=mvs[0]
          # moc QT_MOC_LITERAL stores offset relative to beginning of stringdata struct.
          bases=[]
          for cv in cvs:
              # generated offset table precedes the first class string; bounded 64 KiB search.
              sec=next((x for x in secs if x[3]<=cv<x[3]+x[2]),None);assert sec
              lo=max(sec[3],cv-65536)
              start=cv-((cv-lo)//4)*4
              for base in range(start,lo-1,-4):
                  try:r0=u32(base);l0=u32(base+4)
                  except:continue
                  if l0==len(cn) and base+r0==cv:bases.append((base,cv))
          bases=sorted(set(bases));print('QMETA_V3_BASE_CANDIDATES='+','.join(f'{hex(b)}->{hex(c)}' for b,c in bases))
          structs=[]
          for base,cv in bases:
              for idx in range(1,256):
                  a=base+8*idx
                  try:r=u32(a);ln=u32(a+4)
                  except:break
                  if ln==len(mn) and base+r==mv:structs.append((base,idx,cv))
          structs=sorted(set(structs));print('QMETA_V3_STRUCT_COUNT='+str(len(structs)))
          for x in structs:print('QMETA_V3_STRUCT=base:%s,index:%d,class:%s'%(hex(x[0]),x[1],hex(x[2])))
          assert len(structs)==1;base,idx,cv=structs[0]
          by={}
          for o,t,a,s in rels:by.setdefault(o,[]).append((t,a,s))
          def rv(v):
              a=[x[1] for x in by.get(v,[]) if x[1] is not None]
              if len(set(a))==1:return a[0]
              try:return q(v)
              except:return None
          mos=[]
          for o,t,a,s in rels:
              if a!=base:continue
              # stringdata is second pointer in QMetaObject::Data => object base = relocation-8
              mo=o-8;data=rv(mo+16);call=rv(mo+24)
              if data is None or call is None:continue
              try:h=tuple(u32(data+4*i) for i in range(14))
              except:continue
              mos.append((mo,data,call,h))
          mos=sorted(set(mos),key=lambda x:x[0]);print('QMETA_V3_METAOBJECT_COUNT='+str(len(mos)))
          for mo,d,c,h in mos:print(f'QMETA_V3_METAOBJECT=mo:{mo:#x},data:{d:#x},call:{c:#x},rev:{h[0]},classidx:{h[1]},methods:{h[4]},mdata:{h[5]},signals:{h[13]}')
          if len(mos)!=1:
              for o,t,a,s in rels:
                  if a==base:print(f'QMETA_V3_BASE_RELOC=off:{o:#x},type:{t},sym:{s}')
              raise SystemExit('metaobject binding not unique')
          mo,data,call,h=mos[0];rev,cl,cc,cd,mc,md,pc,pd,ec,ed,kc,kd,flags,sc=h
          assert cl==0 and rev in (10,11,12,13) and 0<mc<=256
          rows=[]
          for i in range(mc):
              a=data+4*(md+6*i);rows.append(tuple(u32(a+4*j) for j in range(6)))
          auth=[(i,r) for i,r in enumerate(rows) if r[0]==idx];print('QMETA_V3_AUTH_ROWS='+repr(auth))
          assert len(auth)==1 and auth[0][1][1]==2
          ordinal,row=auth[0];fence=bs(call,32)
          print(f'QMETA_V3_STATIC_METAOBJECT={mo:#x}');print(f'QMETA_V3_STRINGDATA={base:#x}');print(f'QMETA_V3_METADATA={data:#x}');print(f'QMETA_V3_STATIC_METACALL={call:#x}')
          print(f'QMETA_V3_METHOD_COUNT={mc}');print(f'QMETA_V3_AUTH_STRING_INDEX={idx}');print(f'QMETA_V3_AUTH_LOCAL_ORDINAL={ordinal}');print('QMETA_V3_STATIC_METACALL_FENCE32='+fence.hex());print('QMETA_V3_STATIC_METACALL_FENCE_SHA256='+hashlib.sha256(fence).hexdigest());print('QMETA_V3_RESULT=PASS')
          PY

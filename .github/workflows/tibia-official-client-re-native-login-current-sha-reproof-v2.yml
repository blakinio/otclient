name: Track A current-SHA native-login static reproof v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-current-sha-reproof-v2.yml

permissions:
  contents: read

jobs:
  reproof:
    name: Reprove exact RTTI auth and character anchors without runtime mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
      EXPECTED_SIZE: '52109920'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch exact current client and analyze bounded static anchors
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          umask 077
          ulimit -c 0 || true
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          echo V2_RUNTIME_ACCESS=none
          echo V2_MUTATION=false
          echo V2_SECRET_ACCESS=false
          echo V2_LOGIN=false
          echo V2_CLIENT_EXECUTION=false
          echo V2_RAW_CLIENT_UPLOAD=false

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools binutils
          r="$RUNNER_TEMP/warp"; c="$RUNNER_TEMP/client"; mkdir -m700 -p "$r/bin" "$r/state" "$c"
          cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25345\n' "$r/state/wgcf-profile.conf" > w.conf
          nohup "$r/bin/wireproxy" -c w.conf >"$r/wireproxy.log" 2>&1 </dev/null & wp=$!
          trap 'kill "$wp" 2>/dev/null || true; rm -rf "$r" "$c"' EXIT
          for _ in $(seq 1 30); do
            curl --socks5-hostname 127.0.0.1:25345 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null && break
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          echo V2_WARP=PASS

          base=https://static.tibia.com/launcher/tibiaclient-linux-current/
          curl --socks5-hostname 127.0.0.1:25345 --compressed -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 "${base}package.json" -o "$c/package.json"
          readarray -t m < <(python3 - "$c/package.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8')); rows=[]
          def walk(v):
              if isinstance(v,dict):
                  u=v.get('url'); p=v.get('packedhash'); q=v.get('unpackedhash')
                  if isinstance(u,str) and isinstance(p,str): rows.append((u,p,q if isinstance(q,str) else ''))
                  for z in v.values(): walk(z)
              elif isinstance(v,list):
                  for z in v: walk(z)
          walk(doc)
          hits=[x for x in rows if x[0].endswith('/bin/client.lzma') or x[0]=='bin/client.lzma' or x[0].endswith('client.lzma')]
          if len(hits)!=1: raise SystemExit(f'expected one client.lzma entry, got {len(hits)}')
          print(hits[0][0]); print(hits[0][1].lower()); print(hits[0][2].lower())
          PY
          )
          rel="${m[0]}"; packed_expected="${m[1]}"; unpacked_expected="${m[2]}"
          case "$rel" in http://*|https://*) url="$rel";; /*) url="https://static.tibia.com$rel";; *) url="$base$rel";; esac
          curl --socks5-hostname 127.0.0.1:25345 --compressed -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 "$url" -o "$c/client.lzma"
          [[ "$(sha256sum "$c/client.lzma" | awk '{print $1}')" == "$packed_expected" ]]
          python3 - "$c/client.lzma" "$c/client" "$unpacked_expected" "$EXPECTED_SHA" "$EXPECTED_SIZE" <<'PY'
          import hashlib,lzma,pathlib,sys
          src,dst,msha,esha,esz=sys.argv[1:]; b=pathlib.Path(src).read_bytes()
          q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          sha=hashlib.sha256(raw).hexdigest(); assert sha==msha.lower()==esha and len(raw)==int(esz)
          pathlib.Path(dst).write_bytes(raw)
          print('V2_EXACT_CLIENT=PASS'); print('V2_CLIENT_SHA256='+sha); print('V2_CLIENT_SIZE='+str(len(raw)))
          PY

          python3 - "$c/client" <<'PY'
          import hashlib,pathlib,re,struct,sys
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection
          p=pathlib.Path(sys.argv[1]); raw=p.read_bytes()
          with p.open('rb') as fh:
              elf=ELFFile(fh)
              secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
              rels=[]
              for sec in elf.iter_sections():
                  if not isinstance(sec,RelocationSection): continue
                  symtab=elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      off=int(rel['r_offset']); add=int(rel['r_addend']) if rel.is_RELA() else None; sym=''
                      if int(rel['r_info_sym']) and symtab is not None:
                          try:sym=symtab.get_symbol(int(rel['r_info_sym'])).name
                          except Exception:pass
                      rels.append((off,int(rel['r_info_type']),add,sym))
          def offva(off):
              for n,o,z,v,fl in secs:
                  if o<=off<o+z:return v+(off-o)
              return None
          def vaoff(va):
              for n,o,z,v,fl in secs:
                  if v<=va<v+z:return o+(va-v)
              raise ValueError(hex(va))
          def exe(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          def qword(va):return struct.unpack_from('<Q',raw,vaoff(va))[0]
          by_add={}; by_off={}
          for off,typ,add,sym in rels:
              if add is not None:by_add.setdefault(add,[]).append((off,typ,sym))
              by_off.setdefault(off,[]).append((typ,add,sym))
          def exact_rtti(mangled,label):
              needle=mangled.encode()+b'\x00'; pos=[]; start=0
              while True:
                  x=raw.find(needle,start)
                  if x<0:break
                  if x==0 or raw[x-1]==0: pos.append((offva(x),x))
                  start=x+1
              out=[]
              for nv,fo in pos:
                  if nv is None:continue
                  for target,typ,sym in by_add.get(nv,[]):
                      ti=target-8
                      for target2,typ2,sym2 in by_add.get(ti,[]):
                          header=target2-8
                          try:
                              if qword(header)!=0:continue
                          except Exception:continue
                          vp=header+16; first=None
                          for typ3,add3,sym3 in by_off.get(vp,[]):
                              if add3 is not None:first=add3;break
                          if first is None:
                              try:first=qword(vp)
                              except Exception:first=0
                          if first and exe(first):out.append((vp,ti,nv,first))
              out=sorted(set(out))
              print(f'V2_RTTI_{label}_NAME_COUNT={len(pos)}'); print(f'V2_RTTI_{label}_VPTR_COUNT={len(out)}')
              for i,(vp,ti,nv,fn) in enumerate(out):print(f'V2_RTTI_{label}_{i}=vptr:0x{vp:x},typeinfo:0x{ti:x},nameva:0x{nv:x},firstfn:0x{fn:x}')
              return out
          game=exact_rtti('N5tibia6client11TGameClientE','TGAMECLIENT')
          char=exact_rtti('N5tibia10gamewindow29TCharacterSelectionControllerE','TCHARACTERSELECTIONCONTROLLER')
          auth=exact_rtti('N5tibia14authentication32TAuthenticationProcessControllerE','TAUTHENTICATIONPROCESSCONTROLLER')
          upload=exact_rtti('N5tibia14authentication21TLoginRequestUploaderE','TLOGINREQUESTUPLOADER')
          if len(game)==1:
              print(f'V2_TGAMECLIENT_PRIMARY_VPTR=0x{game[0][0]:x}')
              print(f'V2_TGAMECLIENT_VPTR_DELTA_OLD={game[0][0]-0x3076908:+#x}')
          if len(char)==1:print(f'V2_CHARACTER_CONTROLLER_PRIMARY_VPTR=0x{char[0][0]:x}')

          def byte_hits(label,needle,limit=50):
              arr=[]; start=0
              while len(arr)<limit:
                  x=raw.find(needle,start)
                  if x<0:break
                  arr.append(x);start=x+1
              print(f'V2_{label}_COUNT={len(arr)}')
              for i,o in enumerate(arr):
                  v=offva(o);print(f'V2_{label}_{i}=fileoff:0x{o:x},vma:'+(f'0x{v:x}' if v is not None else 'NONE'))
              return arr
          old_fence=bytes.fromhex('48 8b 51 10 48 8b 71 08 48 83 c4 48 5b 5d e9 2d 38 9e ff 0f 1f 44 00 00 48 8b bf a0 09 00 00 48')
          full=byte_hits('OLD_AUTH_FENCE32',old_fence)
          byte_hits('OLD_AUTH_FENCE_HEAD16',old_fence[:16]);byte_hits('OLD_AUTH_FENCE_TAIL16',old_fence[-16:])
          cold=None
          if len(full)==1:
              cold=offva(full[0]);print(f'V2_COLD_AUTH_TARGET=0x{cold:x}');print(f'V2_COLD_AUTH_DELTA_OLD={cold-0xd06850:+#x}')
          strings=[
            b'onRequestLoginWithCredentials',b'onRequestLoginWithCredentials(QString,QString)',
            b'connectClientToGameserverWithExistingCredentials',b'requestCharacterLogin',b'requestCharacterGameserverLogin',
            b'advanceStateMachineDirectlyToCharacterSelection',b'onLoginStateMachineStartedShortcutToCharacterSelection',
            b'CharacterSelectionController',b'TCharacterSelectionController',b'onGameSessionConnected',b'onConnectClientToGameserver',
            b'InGame',b'ingame',b'GameWindow',b'TGameWindow']
          for s in strings:byte_hits('STRING_'+re.sub(rb'[^A-Za-z0-9]',b'_',s).decode().upper(),s,20)

          motifs={
            'REQUEST_GAMESERVER_STATE5':re.compile(rb'\x31\xc9\xba\x05\x00\x00\x00\xe9',re.S),
            'CHARACTER_FIELDS':re.compile(rb'\x8b\x47\x58.{0,48}\x83\xf8\x01.{0,48}\x83\xf8\x02.{0,96}\x0f\xb7\x57\x50.{0,32}\x8b\x77\x54',re.S),
          }
          for label,rx in motifs.items():
              hs=[m.start() for m in rx.finditer(raw)][:40];print(f'V2_MOTIF_{label}_COUNT={len(hs)}')
              for i,o in enumerate(hs):
                  v=offva(o);print(f'V2_MOTIF_{label}_{i}=fileoff:0x{o:x},vma:'+(f'0x{v:x}' if v is not None else 'NONE'))

          if cold is not None:
              delta=cold-0xd06850
              for label,old in {
                'AUTH_SHORTCUT':0xcfad8b,'AUTH_ADVANCE_DIRECT':0xcfadcb,'AUTH_START_GAMESERVER':0xcfb122,
                'AUTH_REQUEST_GAMESERVER':0xcfb2e7,'AUTH_REQUEST_HANDLER':0xcf1b60,
                'GAMECLIENT_CONNECT':0xd065e0,'GAMECLIENT_EXISTING_WRAPPER':0xd06660,
                'GAMECLIENT_SESSION_CONNECTED':0xd066e0,'GAMECLIENT_ON_CONNECT':0xd06810,
                'COLD_AUTH':0xd06850,'CHARACTER_REQUEST':0xd47300}.items():
                  va=old+delta
                  try:o=vaoff(va);win=raw[o:o+64]
                  except Exception:continue
                  print(f'V2_SHIFT_CANDIDATE_{label}_VA=0x{va:x}')
                  print(f'V2_SHIFT_CANDIDATE_{label}_HEX32={win[:32].hex()}')
                  print(f'V2_SHIFT_CANDIDATE_{label}_SHA256={hashlib.sha256(win).hexdigest()}')
          print('V2_STATIC_SCAN_COMPLETE=true')
          print('V2_AUTH_CONTRACT_STATIC_MINIMUM='+('PASS' if len(game)==1 and cold is not None else 'INCOMPLETE'))
          print('V2_CHARACTER_CONTRACT_STATIC_MINIMUM='+('PASS' if len(char)==1 else 'INCOMPLETE'))
          if len(game)!=1 or len(char)!=1 or cold is None:raise SystemExit('required exact-SHA static anchors incomplete')
          print('V2_RESULT=PASS')
          PY

name: Track A current-SHA native-login static reproof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-current-sha-reproof.yml

permissions:
  contents: read

jobs:
  reproof:
    name: Reprove current exact-client RTTI and native control anchors
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
      EXPECTED_SIZE: '52109920'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch current official client and emit bounded relocation/static proof
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          echo CURRENT_SHA_REPROOF_RUNTIME_ACCESS=none
          echo CURRENT_SHA_REPROOF_MUTATION=false
          echo CURRENT_SHA_REPROOF_SECRET_ACCESS=false
          echo CURRENT_SHA_REPROOF_LOGIN=false
          echo CURRENT_SHA_REPROOF_CLIENT_EXECUTION=false
          echo CURRENT_SHA_REPROOF_RAW_CLIENT_UPLOAD=false

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools
          r="$RUNNER_TEMP/warp"; c="$RUNNER_TEMP/client"; mkdir -m700 -p "$r/bin" "$r/state" "$c"
          cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > w.conf
          nohup "$r/bin/wireproxy" -c w.conf >"$r/wireproxy.log" 2>&1 </dev/null & wp=$!
          trap 'kill "$wp" 2>/dev/null || true; rm -rf "$r" "$c"' EXIT
          for _ in $(seq 1 30); do
            curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null && break
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          echo CURRENT_SHA_REPROOF_WARP=PASS

          base=https://static.tibia.com/launcher/tibiaclient-linux-current/
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 "${base}package.json" -o "$c/package.json"
          readarray -t m < <(python3 - "$c/package.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8')); rows=[]
          def walk(v):
              if isinstance(v,dict):
                  u=v.get('url'); p=v.get('packedhash'); q=v.get('unpackedhash')
                  if isinstance(u,str) and isinstance(p,str): rows.append((u,p,q if isinstance(q,str) else ''))
                  for z in v.values(): walk(z)
              elif isinstance(v,list):
                  for z in v: walk(z)
          walk(doc)
          hits=[x for x in rows if x[0].endswith('/bin/client.lzma') or x[0]=='bin/client.lzma' or x[0].endswith('client.lzma')]
          if len(hits)!=1: raise SystemExit(f'expected one client.lzma entry, got {len(hits)}')
          print(hits[0][0]); print(hits[0][1].lower()); print(hits[0][2].lower())
          PY
          )
          rel="${m[0]}"; packed_expected="${m[1]}"; unpacked_expected="${m[2]}"
          case "$rel" in http://*|https://*) url="$rel";; /*) url="https://static.tibia.com$rel";; *) url="$base$rel";; esac
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 "$url" -o "$c/client.lzma"
          [[ "$(sha256sum "$c/client.lzma" | awk '{print $1}')" == "$packed_expected" ]]

          python3 - "$c/client.lzma" "$c/client" "$unpacked_expected" "$EXPECTED_SHA" "$EXPECTED_SIZE" <<'PY'
          import hashlib,lzma,pathlib,sys
          src,dst,manifest_sha,expected_sha,expected_size=sys.argv[1:]
          b=pathlib.Path(src).read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          sha=hashlib.sha256(raw).hexdigest()
          assert sha==manifest_sha.lower()==expected_sha
          assert len(raw)==int(expected_size)
          pathlib.Path(dst).write_bytes(raw)
          print('CURRENT_SHA_REPROOF_EXACT_CLIENT=PASS')
          print('CURRENT_SHA_REPROOF_CLIENT_SHA256='+sha)
          print('CURRENT_SHA_REPROOF_CLIENT_SIZE='+str(len(raw)))
          PY

          python3 - "$c/client" <<'PY'
          import hashlib,pathlib,re,struct,sys
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection
          p=pathlib.Path(sys.argv[1]); raw=p.read_bytes()
          with p.open('rb') as fh:
              elf=ELFFile(fh)
              secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
              rels=[]
              for sec in elf.iter_sections():
                  if not isinstance(sec,RelocationSection): continue
                  symtab=elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      off=int(rel['r_offset']); add=int(rel['r_addend']) if rel.is_RELA() else None; sym=''
                      if int(rel['r_info_sym']) and symtab is not None:
                          try:sym=symtab.get_symbol(int(rel['r_info_sym'])).name
                          except Exception:pass
                      rels.append((off,int(rel['r_info_type']),add,sym))
          def offva(off):
              for n,o,z,v,fl in secs:
                  if o<=off<o+z:return v+(off-o)
              return None
          def vaoff(va):
              for n,o,z,v,fl in secs:
                  if v<=va<v+z:return o+(va-v)
              raise ValueError(f'VA not file-backed: 0x{va:x}')
          def exe(va): return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          def qword(va): return struct.unpack_from('<Q',raw,vaoff(va))[0]
          by_add={}
          for off,typ,add,sym in rels:
              if add is not None: by_add.setdefault(add,[]).append((off,typ,sym))
          by_off={}
          for off,typ,add,sym in rels: by_off.setdefault(off,[]).append((typ,add,sym))

          def relocation_vptrs_for_substring(label):
              # Itanium RTTI names are N...E NUL strings; only promote candidates with
              # relocation-proven typeinfo and executable first virtual function.
              positions=[]
              for m in re.finditer(rb'[A-Za-z0-9_]{6,240}\x00',raw):
                  s=m.group()[:-1]
                  if label.encode() in s and s.startswith(b'N') and s.endswith(b'E'):
                      va=offva(m.start())
                      if va is not None: positions.append((va,s.decode('ascii','replace')))
              out=[]
              for nv,name in positions:
                  for target,typ,sym in by_add.get(nv,[]):
                      ti=target-8
                      if ti<=0: continue
                      for target2,typ2,sym2 in by_add.get(ti,[]):
                          header=target2-8
                          try:
                              if qword(header)!=0: continue
                          except Exception: continue
                          vp=header+16
                          resolved=None
                          for typ3,add3,sym3 in by_off.get(vp,[]):
                              if add3 is not None: resolved=add3; break
                          if resolved is None:
                              try: resolved=qword(vp)
                              except Exception: resolved=0
                          if resolved and exe(resolved): out.append((vp,ti,nv,name,resolved))
              uniq=[]; seen=set()
              for row in sorted(out):
                  if row[0] not in seen: seen.add(row[0]); uniq.append(row)
              print('CURRENT_SHA_RTTI_'+label.upper()+'_NAME_COUNT='+str(len(positions)))
              print('CURRENT_SHA_RTTI_'+label.upper()+'_VPTR_COUNT='+str(len(uniq)))
              for i,(vp,ti,nv,name,fn) in enumerate(uniq[:12]):
                  print(f'CURRENT_SHA_RTTI_{label.upper()}_{i}=vptr:0x{vp:x},typeinfo:0x{ti:x},nameva:0x{nv:x},firstfn:0x{fn:x},mangled:{name}')
              return uniq

          game=relo=relocation_vptrs_for_substring('TGameClient')
          char=relocation_vptrs_for_substring('TCharacterSelectionController')
          auth=relocation_vptrs_for_substring('TAuthenticationProcessController')
          login=relocation_vptrs_for_substring('TLoginRequestUploader')

          if len(game)!=1: raise SystemExit('TGameClient primary vptr not uniquely reproven')
          print(f'CURRENT_SHA_TGAMECLIENT_PRIMARY_VPTR=0x{game[0][0]:x}')
          print(f'CURRENT_SHA_TGAMECLIENT_VPTR_DELTA_FROM_OLD={game[0][0]-0x3076908:+#x}')

          old_fence=bytes.fromhex('48 8b 51 10 48 8b 71 08 48 83 c4 48 5b 5d e9 2d 38 9e ff 0f 1f 44 00 00 48 8b bf a0 09 00 00 48')
          fence_hits=[]; start=0
          while True:
              x=raw.find(old_fence,start)
              if x<0:break
              fence_hits.append(x); start=x+1
          print('CURRENT_SHA_OLD_COLD_AUTH_FENCE_HIT_COUNT='+str(len(fence_hits)))
          for i,o in enumerate(fence_hits):
              va=offva(o); print(f'CURRENT_SHA_OLD_COLD_AUTH_FENCE_{i}=fileoff:0x{o:x},va:'+(f'0x{va:x}' if va is not None else 'NONE'))
          if len(fence_hits)==1 and offva(fence_hits[0]) is not None:
              cold=offva(fence_hits[0]); print(f'CURRENT_SHA_COLD_AUTH_TARGET=0x{cold:x}'); print(f'CURRENT_SHA_COLD_AUTH_DELTA_FROM_OLD={cold-0xd06850:+#x}')
          else:
              cold=None

          for needle in (b'onRequestLoginWithCredentials',b'connectClientToGameserverWithExistingCredentials',b'requestCharacterLogin',b'requestCharacterGameserverLogin',b'advanceStateMachineDirectlyToCharacterSelection',b'onLoginStateMachineStartedShortcutToCharacterSelection'):
              hits=[]; start=0
              while True:
                  x=raw.find(needle,start)
                  if x<0:break
                  hits.append(x); start=x+1
              print('CURRENT_SHA_STRING_'+needle.decode().upper()+'_COUNT='+str(len(hits)))
              for i,o in enumerate(hits[:8]):
                  va=offva(o); print('CURRENT_SHA_STRING_'+needle.decode().upper()+f'_{i}=fileoff:0x{o:x},va:'+(f'0x{va:x}' if va is not None else 'NONE'))

          # Old exact-SHA instruction anchors, searched as semantics-bearing byte motifs.
          motifs={
              'REQUEST_GAMESERVER_LOGIN_STATE5': re.compile(rb'\x31\xc9\xba\x05\x00\x00\x00\xe9',re.S),
              'CHARACTER_LOGIN_FIELDS': re.compile(rb'\x8b\x47\x58.{0,40}\x83\xf8\x01.{0,40}\x83\xf8\x02.{0,80}\x0f\xb7\x57\x50.{0,24}\x8b\x77\x54',re.S),
          }
          for label,rx in motifs.items():
              hits=[m.start() for m in rx.finditer(raw)]
              print('CURRENT_SHA_MOTIF_'+label+'_COUNT='+str(len(hits)))
              for i,o in enumerate(hits[:20]):
                  va=offva(o); print(f'CURRENT_SHA_MOTIF_{label}_{i}=fileoff:0x{o:x},va:'+(f'0x{va:x}' if va is not None else 'NONE'))

          if cold is not None:
              # Emit only hashes/short hex for bounded candidate windows at historically
              # related control points. No raw executable is uploaded.
              code_delta=cold-0xd06850
              old_points={
                  'AUTH_SHORTCUT':0xcfad8b,
                  'AUTH_ADVANCE_DIRECT':0xcfadcb,
                  'AUTH_START_GAMESERVER':0xcfb122,
                  'AUTH_REQUEST_GAMESERVER':0xcfb2e7,
                  'GAMECLIENT_EXISTING_WRAPPER':0xd06660,
                  'COLD_AUTH':0xd06850,
                  'CHARACTER_REQUEST':0xd47300,
              }
              for label,oldva in old_points.items():
                  va=oldva+code_delta
                  try:o=vaoff(va); win=raw[o:o+48]
                  except Exception:continue
                  print(f'CURRENT_SHA_CANDIDATE_{label}_VA=0x{va:x}')
                  print(f'CURRENT_SHA_CANDIDATE_{label}_SHA256='+hashlib.sha256(win).hexdigest())
                  print(f'CURRENT_SHA_CANDIDATE_{label}_HEX16='+win[:16].hex())

          print('CURRENT_SHA_REPROOF_STATIC_RESULT=PASS')
          PY

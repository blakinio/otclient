name: Track A current-SHA native-login symbol reproof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-current-sha-symbols.yml

permissions:
  contents: read

jobs:
  symbols:
    name: Bind exact-SHA auth and character routes to symbols
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
      EXPECTED_SIZE: '52109920'
      COLD_AUTH: '0xd0aa20'
      TGAMECLIENT_VPTR: '0x307e968'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch exact official client and inspect symbols/code only
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          echo SYMBOL_RE_RUNTIME_ACCESS=none
          echo SYMBOL_RE_MUTATION=false
          echo SYMBOL_RE_SECRET_ACCESS=false
          echo SYMBOL_RE_LOGIN=false
          echo SYMBOL_RE_CLIENT_EXECUTION=false
          echo SYMBOL_RE_RAW_CLIENT_UPLOAD=false

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools binutils >/dev/null
          root="$RUNNER_TEMP/native-login-symbol-re"
          rm -rf "$root"; mkdir -m700 -p "$root/warp/bin" "$root/warp/state" "$root/client"
          cleanup() { [[ -n "${wp:-}" ]] && kill "$wp" 2>/dev/null || true; rm -rf "$root"; }
          trap cleanup EXIT INT TERM HUP

          cd "$root/warp/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c - >/dev/null
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c - >/dev/null
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$root/warp/state"
          "$root/warp/bin/wgcf" register --accept-tos >/dev/null
          "$root/warp/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25345\n' "$root/warp/state/wgcf-profile.conf" > w.conf
          nohup "$root/warp/bin/wireproxy" -c w.conf >"$root/warp/wireproxy.log" 2>&1 </dev/null & wp=$!
          for _ in $(seq 1 30); do
            curl --socks5-hostname 127.0.0.1:25345 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$root/warp/trace" 2>/dev/null && break
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$root/warp/trace"
          echo SYMBOL_RE_WARP=PASS

          base='https://static.tibia.com/launcher/tibiaclient-linux-current/'
          curl --socks5-hostname 127.0.0.1:25345 --compressed -fsSL --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 120 "${base}package.json" -o "$root/client/package.json"
          readarray -t m < <(python3 - "$root/client/package.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8')); rows=[]
          def walk(v):
              if isinstance(v,dict):
                  u=v.get('url'); p=v.get('packedhash'); q=v.get('unpackedhash')
                  if isinstance(u,str) and isinstance(p,str): rows.append((u,p,q if isinstance(q,str) else ''))
                  for z in v.values(): walk(z)
              elif isinstance(v,list):
                  for z in v: walk(z)
          walk(doc)
          hits=[x for x in rows if x[0].endswith('/bin/client.lzma') or x[0]=='bin/client.lzma' or x[0].endswith('client.lzma')]
          if len(hits)!=1: raise SystemExit(f'expected one client.lzma entry, got {len(hits)}')
          print(hits[0][0]); print(hits[0][1].lower()); print(hits[0][2].lower())
          PY
          )
          rel="${m[0]}"; packed_expected="${m[1]}"; unpacked_expected="${m[2]}"
          case "$rel" in http://*|https://*) url="$rel";; /*) url="https://static.tibia.com$rel";; *) url="$base$rel";; esac
          curl --socks5-hostname 127.0.0.1:25345 --compressed -fsSL --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 "$url" -o "$root/client/client.lzma"
          [[ "$(sha256sum "$root/client/client.lzma" | awk '{print $1}')" == "$packed_expected" ]]
          python3 - "$root/client/client.lzma" "$root/client/client" "$unpacked_expected" "$EXPECTED_SHA" "$EXPECTED_SIZE" <<'PY'
          import hashlib,lzma,pathlib,sys
          src,dst,manifest_sha,expected_sha,expected_size=sys.argv[1:]
          b=pathlib.Path(src).read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          sha=hashlib.sha256(raw).hexdigest(); assert sha==manifest_sha.lower()==expected_sha; assert len(raw)==int(expected_size)
          pathlib.Path(dst).write_bytes(raw)
          print('SYMBOL_RE_EXACT_CLIENT=PASS'); print('SYMBOL_RE_SHA256='+sha); print('SYMBOL_RE_SIZE='+str(len(raw)))
          PY
          client="$root/client/client"
          chmod 600 "$client"

          python3 - "$client" "$COLD_AUTH" <<'PY'
          import subprocess,sys
          from elftools.elf.elffile import ELFFile
          from elftools.elf.sections import SymbolTableSection
          path=sys.argv[1]; cold=int(sys.argv[2],0)
          needles=('TGameClient','RequestLoginWithCredentials','requestLoginWithCredentials','connectClientToGameserverWithExistingCredentials','TCharacterSelectionController','requestCharacterLogin','requestCharacterGameserverLogin','CharacterGameserverLogin','TAuthenticationProcessController','TLoginRequestUploader')
          rows=[]
          with open(path,'rb') as fh:
              elf=ELFFile(fh)
              for sec in elf.iter_sections():
                  if not isinstance(sec,SymbolTableSection): continue
                  for sym in sec.iter_symbols():
                      name=sym.name
                      if not name: continue
                      try: dem=subprocess.check_output(['c++filt','-n',name],text=True).strip()
                      except Exception: dem=name
                      if any(n.lower() in (name+' '+dem).lower() for n in needles):
                          rows.append((sec.name,int(sym['st_value']),int(sym['st_size']),sym['st_info']['type'],sym['st_info']['bind'],name,dem))
              containers=[]
              for sec in elf.iter_sections():
                  if not isinstance(sec,SymbolTableSection): continue
                  for sym in sec.iter_symbols():
                      if sym['st_info']['type']!='STT_FUNC': continue
                      v=int(sym['st_value']); z=int(sym['st_size'])
                      if z and v<=cold<v+z:
                          try: dem=subprocess.check_output(['c++filt','-n',sym.name],text=True).strip()
                          except Exception: dem=sym.name
                          containers.append((sec.name,v,z,sym.name,dem))
          print('SYMBOL_RE_MATCH_COUNT='+str(len(rows)))
          for r in sorted(set(rows),key=lambda x:(x[1],x[0],x[5])):
              sec,v,z,t,b,n,d=r
              print(f'SYMBOL_RE_MATCH={sec}|va=0x{v:x}|size=0x{z:x}|type={t}|bind={b}|mangled={n}|demangled={d}'[:900])
          print('SYMBOL_RE_COLD_AUTH_CONTAINER_COUNT='+str(len(containers)))
          for sec,v,z,n,d in sorted(containers):
              print(f'SYMBOL_RE_COLD_AUTH_CONTAINER={sec}|va=0x{v:x}|size=0x{z:x}|mangled={n}|demangled={d}'[:900])
          PY

          echo SYMBOL_RE_NM_BEGIN=true
          nm -D -n -C "$client" 2>/dev/null | grep -Ei 'TGameClient|RequestLoginWithCredentials|connectClientToGameserverWithExistingCredentials|TCharacterSelectionController|requestCharacterLogin|requestCharacterGameserverLogin|TAuthenticationProcessController|TLoginRequestUploader' \
            | head -n 160 | sed 's/^/SYMBOL_RE_NM=/' || true
          echo SYMBOL_RE_NM_END=true

          # Bounded exact code windows. Addresses include independently proven auth target/vptr and character candidates from prior exact-SHA static run.
          cat >"$root/client/ranges.txt" <<'EOF'
          AUTH_WRAPPER 0xd0a780 0xd0aae0
          AUTH_SHORTCUT_CANDIDATE 0xcfef00 0xcff020
          AUTH_START_GAMESERVER_CANDIDATE 0xcff280 0xcff380
          AUTH_REQUEST_GAMESERVER_CANDIDATE 0xcff440 0xcff540
          CHARACTER_TRANSLATED_CANDIDATE 0xd4b440 0xd4b600
          CHARACTER_STATE5_A 0x1acd3e0 0x1acd560
          CHARACTER_STATE5_B 0x1aceff0 0x1acf170
          CHARACTER_STATE5_C 0x1b263b0 0x1b26530
          EOF
          while read -r label start stop; do
            echo "SYMBOL_RE_DISASM_RANGE=$label|$start|$stop"
            objdump -d -C -M intel --start-address="$start" --stop-address="$stop" "$client" 2>/dev/null \
              | head -n 220 | sed "s/^/SYMBOL_RE_DISASM_${label}=/"
          done <"$root/client/ranges.txt"

          # Resolve direct call/jump sites to exact named dynamic-symbol addresses when available.
          nm -D -n "$client" 2>/dev/null >"$root/client/dynsym.txt" || true
          objdump -d -M intel "$client" 2>/dev/null >"$root/client/disasm.txt"
          python3 - "$root/client/dynsym.txt" "$root/client/disasm.txt" <<'PY'
          import pathlib,re,subprocess,sys
          syms=[]
          for line in pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines():
              p=line.split(None,2)
              if len(p)<3: continue
              try:v=int(p[0],16)
              except ValueError:continue
              name=p[2]
              try:dem=subprocess.check_output(['c++filt','-n',name],text=True).strip()
              except Exception:dem=name
              if any(k.lower() in dem.lower() for k in ('RequestLoginWithCredentials','connectClientToGameserverWithExistingCredentials','requestCharacterLogin','requestCharacterGameserverLogin')):
                  syms.append((v,name,dem))
          lines=pathlib.Path(sys.argv[2]).read_text(errors='replace').splitlines()
          for v,n,d in syms:
              hx=f'{v:x}'
              hits=[]
              for ln in lines:
                  if re.search(r'\b(?:call|jmp)\s+(?:0x)?0*'+re.escape(hx)+r'\b',ln,re.I) or ('<'+n+'@plt>' in ln):
                      hits.append(ln.strip())
                      if len(hits)>=40: break
              print(f'SYMBOL_RE_DIRECT_XREF={d}|target=0x{v:x}|count={len(hits)}')
              for h in hits: print(f'SYMBOL_RE_XREF={d}|{h[:500]}')
          PY

          # Re-assert the independently proven fence and RTTI relocation vptr values without execution.
          python3 - "$client" "$COLD_AUTH" "$TGAMECLIENT_VPTR" <<'PY'
          import pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          p=pathlib.Path(sys.argv[1]); raw=p.read_bytes(); cold=int(sys.argv[2],0); vptr=int(sys.argv[3],0)
          fence=bytes.fromhex('48 8b 51 10 48 8b 71 08 48 83 c4 48 5b 5d e9 2d 38 9e ff 0f 1f 44 00 00 48 8b bf a0 09 00 00 48')
          with p.open('rb') as fh:
              elf=ELFFile(fh); secs=[(int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr'])) for s in elf.iter_sections()]
          def offva(o):
              for so,sz,va in secs:
                  if so<=o<so+sz:return va+(o-so)
          hits=[]; start=0
          while True:
              o=raw.find(fence,start)
              if o<0:break
              hits.append(offva(o)); start=o+1
          print('SYMBOL_RE_FENCE_HIT_COUNT='+str(len(hits)))
          for h in hits: print('SYMBOL_RE_FENCE_VA='+hex(h) if h is not None else 'SYMBOL_RE_FENCE_VA=NONE')
          assert hits==[cold]
          # vptr address must be file-backed/aligned; exact relocation identity was proved by prior workflow.
          assert vptr%8==0
          print('SYMBOL_RE_COLD_AUTH_REASSERT=PASS')
          print('SYMBOL_RE_TGAMECLIENT_VPTR_REASSERT='+hex(vptr))
          PY

          echo SYMBOL_RE_SECRET_ACCESS=false
          echo SYMBOL_RE_LOGIN=false
          echo SYMBOL_RE_CLIENT_EXECUTION=false
          echo SYMBOL_RE_RESULT=PASS

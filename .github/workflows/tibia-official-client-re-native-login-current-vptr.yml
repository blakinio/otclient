name: Track A native login current vptr proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-current-vptr.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover exact-build primary vptrs
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools
          r="$RUNNER_TEMP/native-login-vptr"; mkdir -p "$r/bin" "$r/state"; trap 'rm -rf "$r"' EXIT
          cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          tar -xzf wp.tgz; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25346\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          "$r/bin/wireproxy" -c wireproxy.conf >/dev/null 2>&1 & wp=$!; trap 'kill $wp 2>/dev/null || true; rm -rf "$r"' EXIT
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25346 -fsS --max-time 5 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)$' && break; sleep 1; done
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25346 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' "$u" -o "$r/client.lzma"
          python3 - "$r/client.lzma" <<'PY'
          import hashlib,lzma,struct,sys
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection
          p=open(sys.argv[1],'rb').read(); q=p[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(p[33:37],'little')
          raw=lzma.decompress(p[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          sha=hashlib.sha256(raw).hexdigest(); assert len(raw)==52109920; assert sha=='ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8'
          fn='/tmp/current-client-vptr-proof'; open(fn,'wb').write(raw)
          with open(fn,'rb') as f:
            elf=ELFFile(f); secs=[(int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),s['sh_type']) for s in elf.iter_sections()]
            rel=[]
            for s in elf.iter_sections():
              if isinstance(s,RelocationSection):
                for x in s.iter_relocations():
                  if int(x.entry['r_info_type'])==8 and 'r_addend' in x.entry: rel.append((int(x.entry['r_offset']),int(x.entry['r_addend'])))
          def va_for_off(o):
            for so,sz,va,t in secs:
              if t!='SHT_NOBITS' and so<=o<so+sz:return va+o-so
            raise RuntimeError(o)
          def off_for_va(v):
            for so,sz,va,t in secs:
              if t!='SHT_NOBITS' and va<=v<va+sz:return so+v-va
            raise RuntimeError(v)
          for label,name in [('GAMECLIENT',b'N5tibia6client11TGameClientE'),('CHARSEL',b'N5tibia10gamewindow29TCharacterSelectionControllerE')]:
            pos=raw.find(name); assert pos>=0,(label,'name')
            nva=va_for_off(pos); tis=sorted({ro-8 for ro,a in rel if a==nva})
            c=[]
            for ti in tis:
              for ro,a in rel:
                if a!=ti: continue
                try: top=struct.unpack_from('<q',raw,off_for_va(ro-8))[0]
                except Exception: continue
                if top==0:c.append(ro+8)
            c=sorted(set(c)); print(f'{label}_TYPEINFO_NAME_VA=0x{nva:x}'); print(f'{label}_TYPEINFO_CANDIDATES='+','.join(hex(x) for x in tis)); print(f'{label}_PRIMARY_VPTR_CANDIDATES='+','.join(hex(x) for x in c)); assert len(c)==1,(label,c)
            print(f'{label}_PRIMARY_VPTR=0x{c[0]:x}')
          print('CURRENT_CLIENT_SHA256='+sha); print('CURRENT_VPTR_PROOF=PASS')
          PY
          rm -f /tmp/current-client-vptr-proof

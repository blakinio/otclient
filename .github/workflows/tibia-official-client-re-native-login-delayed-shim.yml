name: Track A native-login delayed auth shim

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-delayed-shim.yml

permissions:
  contents: read

jobs:
  build:
    name: Build delayed auth-loader shim
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build minimal non-Qt delayed dlopen shim
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/delayed-auth-shim"; mkdir -p "$out"
          cat >"$out/shim.c" <<'C'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <stdlib.h>
          #include <string.h>
          #include <fcntl.h>
          #include <stdio.h>
          static char helper_path[4096], trigger_path[4096], status_path[4096];
          static void write_status(const char *text) {
              int fd=open(status_path,O_WRONLY|O_CREAT|O_TRUNC|O_CLOEXEC,0600);
              if(fd<0)return;
              size_t n=strlen(text),done=0;
              while(done<n){ssize_t w=write(fd,text+done,n-done);if(w<=0)break;done+=(size_t)w;}
              if(fsync(fd)!=0){}
              if(close(fd)!=0){}
          }
          static void *loader_thread(void *unused){
              (void)unused;
              for(int i=0;i<7200;++i){
                  if(access(trigger_path,F_OK)==0){void *h=dlopen(helper_path,RTLD_NOW|RTLD_LOCAL);write_status(h?"PASS\n":"FAIL\n");return NULL;}
                  usleep(50000);
              }
              write_status("TIMEOUT\n");return NULL;
          }
          __attribute__((constructor)) static void delayed_auth_init(void){
              const char *h=getenv("OTCLIENT_TIBIA_RE_DELAYED_AUTH_HELPER"),*t=getenv("OTCLIENT_TIBIA_RE_DELAYED_AUTH_TRIGGER"),*s=getenv("OTCLIENT_TIBIA_RE_DELAYED_AUTH_STATUS");
              if(!h||!t||!s||h[0]!='/'||t[0]!='/'||s[0]!='/')return;
              size_t hn=strlen(h),tn=strlen(t),sn=strlen(s);if(hn>=sizeof(helper_path)||tn>=sizeof(trigger_path)||sn>=sizeof(status_path))return;
              memcpy(helper_path,h,hn+1);memcpy(trigger_path,t,tn+1);memcpy(status_path,s,sn+1);
              pthread_t tid;if(pthread_create(&tid,NULL,loader_thread,NULL)==0)(void)pthread_detach(tid);
          }
          C
          cc -shared -fPIC -O2 -Wall -Wextra -Werror -pthread -o "$out/otclient-tibia-delayed-auth-loader.so" "$out/shim.c" -ldl
          ! ldd "$out/otclient-tibia-delayed-auth-loader.so" | grep -q 'Qt6'
          sha256sum "$out/otclient-tibia-delayed-auth-loader.so" > "$out/SHA256SUMS"
          echo "NATIVE_LOGIN_DELAYED_SHIM_SHA256=$(awk '{print $1}' "$out/SHA256SUMS")"
          echo "NATIVE_LOGIN_DELAYED_SHIM_SIZE=$(stat -c %s "$out/otclient-tibia-delayed-auth-loader.so")"
          echo 'NATIVE_LOGIN_DELAYED_SHIM_BUILD=PASS'
      - name: Upload delayed loader shim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-login-delayed-auth-shim-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/delayed-auth-shim/otclient-tibia-delayed-auth-loader.so
            ${{ runner.temp }}/delayed-auth-shim/SHA256SUMS
          retention-days: 1
          if-no-files-found: error

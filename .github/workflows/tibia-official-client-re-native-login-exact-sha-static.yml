name: Track A native-login exact-SHA static RE

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-exact-sha-static.yml
      - docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  exact-sha-static:
    name: Read-only exact-SHA native-route reproof
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 15
    env:
      BASE_SHA: ebbb36f50076ff4072c7218e302614c1dfea00b1
      BASE: /home/runner/_work/_otclient_tibia_re_state
      EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
      EXPECTED_SIZE: '52109920'
      OLD_AUTH_VMA: '0xd06850'
      OLD_VPTR_VMA: '0x3076908'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Static RE exact installed binary only
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          ulimit -c 0 || true
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD

          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_SHA" ]]

          task=docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md
          grep -q '^task_id: OTC-20260818-native-login-to-ingame-e2e$' "$task"
          grep -q '^phase: exact-sha-native-route-reproof$' "$task"
          grep -q '^runtime_access: ephemeral_isolated$' "$task"
          grep -q '^runtime_namespace: native-login-exact-sha-re$' "$task"
          grep -q '^target_uniqueness: PROVEN$' "$task"
          grep -q '^mutation_authorized: false$' "$task"
          grep -q '^credentials_allowed: false$' "$task"
          grep -q '^login_allowed: false$' "$task"
          grep -q '^gameplay_allowed: false$' "$task"
          grep -q '^canonical_update_completed: true$' "$task"
          grep -q "^installed_exact_client_sha256: $EXPECTED_SHA$" "$task"
          grep -q "^installed_exact_client_size: $EXPECTED_SIZE$" "$task"

          echo TRACK_A_ADMISSION_RUNTIME_ACCESS=ephemeral_isolated
          echo TRACK_A_ADMISSION_NAMESPACE=native-login-exact-sha-re
          echo TRACK_A_ADMISSION_TARGET_UNIQUENESS=PROVEN
          echo TRACK_A_ADMISSION_MUTATION_AUTHORIZED=false
          echo TRACK_A_ADMISSION_CREDENTIALS_ALLOWED=false
          echo TRACK_A_ADMISSION_LOGIN_ALLOWED=false
          echo TRACK_A_ADMISSION_GAMEPLAY_ALLOWED=false

          state="$BASE/canonical-live-runtime"
          client="$BASE/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -f "$client" && -x "$client" && ! -L "$client" ]]
          [[ ! -e "$state/runtime-registration.json" ]]
          [[ ! -d "$state/session" ]]

          before_inode="$(stat -c %i "$client")"
          before_mtime="$(stat -c %Y "$client")"
          before_size="$(stat -c %s "$client")"
          before_sha="$(sha256sum "$client" | awk '{print $1}')"
          [[ "$before_size" == "$EXPECTED_SIZE" ]]
          [[ "$before_sha" == "$EXPECTED_SHA" ]]
          echo EXACT_RE_CLIENT_SHA256="$before_sha"
          echo EXACT_RE_CLIENT_SIZE="$before_size"
          echo EXACT_RE_CLIENT_IDENTITY=PASS
          echo EXACT_RE_SECRET_ACCESS=false
          echo EXACT_RE_CLIENT_STARTED=false

          tmp="$(mktemp -d "$RUNNER_TEMP/native-login-exact-sha-re.XXXXXX")"
          trap 'rm -rf "$tmp"' EXIT INT TERM HUP

          for tool in file readelf objdump strings sha256sum python3; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "EXACT_RE_TOOL_${tool^^}=AVAILABLE"
            else
              echo "EXACT_RE_TOOL_${tool^^}=ABSENT"
            fi
          done
          command -v readelf >/dev/null
          command -v objdump >/dev/null
          command -v strings >/dev/null

          file "$client" | sed 's/^/EXACT_RE_FILE=/'
          readelf -hW "$client" | grep -E 'Class:|Data:|Type:|Machine:|Entry point address:' | sed 's/^/EXACT_RE_ELF_HEADER=/'
          readelf -lW "$client" >"$tmp/program-headers.txt"
          grep -E '^[[:space:]]*LOAD[[:space:]]' "$tmp/program-headers.txt" | sed 's/^/EXACT_RE_LOAD=/'
          readelf -SW "$client" >"$tmp/sections.txt"
          grep -E '\.(text|rodata|data|data\.rel\.ro|bss)[[:space:]]' "$tmp/sections.txt" | head -n 30 | sed 's/^/EXACT_RE_SECTION=/'

          python3 - "$client" "$tmp/scan.json" "$OLD_AUTH_VMA" "$OLD_VPTR_VMA" <<'PY'
          import hashlib,json,pathlib,struct,sys
          path=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          old_auth=int(sys.argv[3],0); old_vptr=int(sys.argv[4],0)
          data=path.read_bytes()
          if data[:4]!=b'\x7fELF' or data[4]!=2 or data[5]!=1:
              raise SystemExit('expected ELF64 little-endian')
          eh=struct.unpack_from('<16sHHIQQQIHHHHHH',data,0)
          e_phoff,e_phentsize,e_phnum=eh[5],eh[9],eh[10]
          segs=[]
          for i in range(e_phnum):
              off=e_phoff+i*e_phentsize
              p_type,p_flags,p_offset,p_vaddr,p_paddr,p_filesz,p_memsz,p_align=struct.unpack_from('<IIQQQQQQ',data,off)
              if p_type==1:
                  segs.append({'offset':p_offset,'vaddr':p_vaddr,'filesz':p_filesz,'memsz':p_memsz,'flags':p_flags})
          def off_to_vma(off):
              for s in segs:
                  if s['offset']<=off<s['offset']+s['filesz']:
                      return s['vaddr']+(off-s['offset'])
              return None
          def vma_to_off(vma):
              for s in segs:
                  if s['vaddr']<=vma<s['vaddr']+s['filesz']:
                      return s['offset']+(vma-s['vaddr'])
              return None
          def hits(needle,limit=40):
              pos=[]; start=0
              while len(pos)<limit:
                  i=data.find(needle,start)
                  if i<0: break
                  pos.append({'file_offset':i,'vma':off_to_vma(i)})
                  start=i+1
              return pos
          anchors=[
              b'tibia::client::TGameClient',
              b'TGameClient',
              b'onRequestLoginWithCredentials',
              b'onRequestLoginWithCredentials(QString,QString)',
              b'TCharacterSelectionController',
              b'CharacterSelectionController',
              b'requestCharacterGameserverLogin',
              b'CharacterGameserverLogin',
              b'characterGameserverLogin',
              b'characterSelection',
              b'onCharacter',
              b'enterGame',
              b'InGame',
          ]
          old_fence=bytes.fromhex('48 8b 51 10 48 8b 71 08 48 83 c4 48 5b 5d e9 2d 38 9e ff 0f 1f 44 00 00 48 8b bf a0 09 00 00 48')
          patterns={
              'OLD_FENCE_32':old_fence,
              'OLD_FENCE_HEAD_16':old_fence[:16],
              'OLD_FENCE_TAIL_16':old_fence[-16:],
              'OLD_FENCE_HEAD_12':old_fence[:12],
              'OLD_FENCE_TAIL_12':old_fence[-12:],
          }
          result={'segments':segs,'anchors':{},'patterns':{},'old_auth_vma':old_auth,'old_vptr_vma':old_vptr}
          for a in anchors:
              result['anchors'][a.decode()] = hits(a)
          for name,p in patterns.items(): result['patterns'][name]=hits(p)
          for label,vma in [('old_auth',old_auth),('old_vptr',old_vptr)]:
              fo=vma_to_off(vma)
              item={'vma':vma,'file_offset':fo}
              if fo is not None:
                  lo=max(0,fo-48); hi=min(len(data),fo+96)
                  item['window_start_file_offset']=lo
                  item['window_start_vma']=off_to_vma(lo)
                  item['window_hex']=data[lo:hi].hex()
                  if fo+8<=len(data): item['u64_at_vma']=struct.unpack_from('<Q',data,fo)[0]
              result[label]=item
          out.write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('EXACT_RE_BINARY_SHA256='+hashlib.sha256(data).hexdigest())
          for name,vals in result['anchors'].items():
              print('EXACT_RE_ANCHOR_'+''.join(c if c.isalnum() else '_' for c in name).upper()+'_COUNT='+str(len(vals)))
              for j,h in enumerate(vals[:12]):
                  v='NONE' if h['vma'] is None else hex(h['vma'])
                  print(f'EXACT_RE_ANCHOR_HIT={name}|{j}|file={hex(h["file_offset"])}|vma={v}')
          for name,vals in result['patterns'].items():
              print(f'EXACT_RE_{name}_COUNT={len(vals)}')
              for j,h in enumerate(vals[:20]):
                  v='NONE' if h['vma'] is None else hex(h['vma'])
                  print(f'EXACT_RE_FENCE_HIT={name}|{j}|file={hex(h["file_offset"])}|vma={v}')
          for label in ('old_auth','old_vptr'):
              x=result[label]
              print(f'EXACT_RE_{label.upper()}_FILE_OFFSET='+('NONE' if x['file_offset'] is None else hex(x['file_offset'])))
              if 'u64_at_vma' in x: print(f'EXACT_RE_{label.upper()}_U64_AT_VMA={hex(x["u64_at_vma"])}')
              if 'window_hex' in x: print(f'EXACT_RE_{label.upper()}_WINDOW_START_VMA={hex(x["window_start_vma"])}')
              if 'window_hex' in x: print(f'EXACT_RE_{label.upper()}_WINDOW_HEX={x["window_hex"]}')
          PY

          strings -a -t x "$client" | grep -F -e 'tibia::client::TGameClient' -e 'onRequestLoginWithCredentials' \
            -e 'TCharacterSelectionController' -e 'CharacterSelectionController' -e 'requestCharacterGameserverLogin' \
            -e 'CharacterGameserverLogin' -e 'characterGameserverLogin' -e 'characterSelection' -e 'enterGame' -e 'InGame' \
            | head -n 120 | sed 's/^/EXACT_RE_STRINGS=/' || true

          readelf -Ws "$client" 2>/dev/null | grep -E 'TGameClient|RequestLoginWithCredentials|CharacterSelection|GameserverLogin|enterGame|InGame' \
            | head -n 80 | sed 's/^/EXACT_RE_SYMBOL=/' || true
          readelf -rW "$client" >"$tmp/relocs.txt" 2>/dev/null || true

          # Bounded disassembly around the historical auth VMA and any surviving old-fence fragments.
          python3 - "$tmp/scan.json" "$tmp/ranges.txt" <<'PY'
          import json,pathlib,sys
          x=json.loads(pathlib.Path(sys.argv[1]).read_text()); ranges=[]
          ranges.append(('OLD_AUTH_VMA',max(0,x['old_auth_vma']-128),x['old_auth_vma']+192))
          seen=set()
          for name in ('OLD_FENCE_32','OLD_FENCE_HEAD_16','OLD_FENCE_TAIL_16','OLD_FENCE_HEAD_12','OLD_FENCE_TAIL_12'):
              for h in x['patterns'][name][:8]:
                  v=h.get('vma')
                  if v is None: continue
                  key=(max(0,v-96),v+160)
                  if key in seen: continue
                  seen.add(key); ranges.append((name,key[0],key[1]))
          with pathlib.Path(sys.argv[2]).open('w') as f:
              for label,a,b in ranges[:20]: f.write(f'{label}\t{a}\t{b}\n')
          PY
          while IFS=$'\t' read -r label start stop; do
            echo "EXACT_RE_DISASM_RANGE=$label|$(printf '0x%x' "$start")|$(printf '0x%x' "$stop")"
            objdump -d -M intel --start-address="$start" --stop-address="$stop" "$client" 2>/dev/null \
              | head -n 120 | sed "s/^/EXACT_RE_DISASM_${label}=/" || true
          done <"$tmp/ranges.txt"

          # One full static disassembly is temporary and local only; mine only direct RIP-relative comments to known anchor VMAs.
          if timeout 300 objdump -d -M intel "$client" >"$tmp/disasm.txt" 2>"$tmp/disasm.err"; then
            echo EXACT_RE_FULL_DISASM_TEMPORARY=PASS
            python3 - "$tmp/scan.json" "$tmp/disasm.txt" <<'PY'
          import json,pathlib,re,sys
          x=json.loads(pathlib.Path(sys.argv[1]).read_text()); lines=pathlib.Path(sys.argv[2]).read_text(errors='replace').splitlines()
          targets=[]
          for name,vals in x['anchors'].items():
              for h in vals[:8]:
                  if h.get('vma') is not None: targets.append((name,h['vma']))
          for name,vma in targets:
              hx=f'{vma:x}'
              matches=[]
              pat=re.compile(r'#\s*0*'+re.escape(hx)+r'(?:\s|$|<)',re.I)
              for line in lines:
                  if pat.search(line):
                      matches.append(line.strip())
                      if len(matches)>=20: break
              print(f'EXACT_RE_XREF_COUNT={name}|vma={hex(vma)}|count={len(matches)}')
              for m in matches: print(f'EXACT_RE_XREF={name}|vma={hex(vma)}|{m[:260]}')
          PY
          else
            echo EXACT_RE_FULL_DISASM_TEMPORARY=TIMEOUT_OR_FAIL
            head -n 20 "$tmp/disasm.err" | sed 's/^/EXACT_RE_OBJDUMP_ERROR=/' || true
          fi

          # Check relocations that mention any exact anchor VMA/addend.
          python3 - "$tmp/scan.json" "$tmp/relocs.txt" <<'PY'
          import json,pathlib,re,sys
          x=json.loads(pathlib.Path(sys.argv[1]).read_text()); text=pathlib.Path(sys.argv[2]).read_text(errors='replace').splitlines()
          targets=[]
          for name,vals in x['anchors'].items():
              for h in vals[:8]:
                  if h.get('vma') is not None: targets.append((name,h['vma']))
          for name,v in targets:
              hx=f'{v:x}'.lower(); hits=[ln.strip() for ln in text if hx in ln.lower()][:12]
              if hits:
                  print(f'EXACT_RE_RELOC_COUNT={name}|vma={hex(v)}|count={len(hits)}')
                  for ln in hits: print(f'EXACT_RE_RELOC={name}|vma={hex(v)}|{ln[:260]}')
          PY

          after_inode="$(stat -c %i "$client")"
          after_mtime="$(stat -c %Y "$client")"
          after_size="$(stat -c %s "$client")"
          after_sha="$(sha256sum "$client" | awk '{print $1}')"
          [[ "$after_inode" == "$before_inode" ]]
          [[ "$after_mtime" == "$before_mtime" ]]
          [[ "$after_size" == "$before_size" ]]
          [[ "$after_sha" == "$before_sha" ]]
          [[ ! -e "$state/runtime-registration.json" ]]
          [[ ! -d "$state/session" ]]
          echo EXACT_RE_BINARY_UNCHANGED=PASS
          echo EXACT_RE_SECRET_ACCESS=false
          echo EXACT_RE_LOGIN=false
          echo EXACT_RE_RUNTIME_MUTATION=false
          echo EXACT_RE_RESULT=PASS_STATIC_DATA_COLLECTED

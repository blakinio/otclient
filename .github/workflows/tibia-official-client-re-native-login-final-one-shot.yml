name: Track A current-SHA native login final one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-final-one-shot.yml

permissions:
  contents: read

concurrency:
  group: track-a-current-sha-native-login-final
  cancel-in-progress: false

env:
  EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
  EXPECTED_SIZE: '52109920'
  CONTAINER: otclient-track-a-kasmvnc
  CLIENT: /home/kasm-user/otclient-track-a/Tibia-32177065988-1/bin/client
  TASK_ROOT: /tmp/otclient-native-login-current-sha
  BRIDGE_SOCKET: /tmp/otclient-native-login-current-sha/bridge.sock
  AUTH_SOCKET: /tmp/otclient-native-login-current-sha/auth.sock
  CHARACTER_SOCKET: /tmp/otclient-native-login-current-sha/character.sock
  CLIENT_VERSION: 15.32.current.ed5469

jobs:
  execute:
    name: Reuse admitted helper runtime and reach structural IN_GAME
    runs-on: [otclient, synology]
    timeout-minutes: 8
    steps:
      - name: Revalidate existing helper-enabled exact runtime
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          docker inspect "$CONTAINER" >/dev/null
          test "$(docker inspect "$CONTAINER" --format '{{.State.Status}}')" = running
          for socket in "$BRIDGE_SOCKET" "$AUTH_SOCKET" "$CHARACTER_SOCKET"; do
            docker exec -u kasm-user "$CONTAINER" test -S "$socket"
          done
          runtime_pid="$(docker exec -i -u kasm-user -e SOCKET="$BRIDGE_SOCKET" "$CONTAINER" python3 - <<'PY'
          import json,os,socket,struct
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(5); s.connect(os.environ['SOCKET'])
          pid,uid,gid=struct.unpack('3i',s.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12))
          if uid!=os.geteuid(): raise SystemExit('bridge UID mismatch')
          s.sendall(b'PING\n'); raw=b''
          while b'\n' not in raw:
              part=s.recv(4096)
              if not part: break
              raw+=part
          s.close(); doc=json.loads(raw.split(b'\n',1)[0])
          if not doc.get('ok') or doc.get('pid')!=pid: raise SystemExit('bridge PING/peer mismatch')
          print(pid)
          PY
          )"
          [[ "$runtime_pid" =~ ^[0-9]+$ ]] && (( runtime_pid > 0 ))
          docker exec -i -u kasm-user "$CONTAINER" python3 - "$runtime_pid" "$CLIENT" "$EXPECTED_SHA" "$EXPECTED_SIZE" "$CLIENT_VERSION" "$TASK_ROOT" <<'PY'
          import hashlib,os,pathlib,sys
          pid=int(sys.argv[1]); expected=os.path.realpath(sys.argv[2]); sha=sys.argv[3]; size=int(sys.argv[4]); version=sys.argv[5]; root=sys.argv[6]
          if os.path.realpath(f'/proc/{pid}/exe')!=expected: raise SystemExit('runtime executable mismatch')
          p=pathlib.Path(f'/proc/{pid}/exe')
          if p.stat().st_size!=size or hashlib.sha256(p.read_bytes()).hexdigest()!=sha: raise SystemExit('runtime SHA/size mismatch')
          maps=pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace')
          for name in ('auth.so','character.so','bridge.so'):
              if f'{root}/{name}' not in maps: raise SystemExit(f'helper mapping missing: {name}')
          keys={item.split(b'=',1)[0] for item in pathlib.Path(f'/proc/{pid}/environ').read_bytes().split(b'\0') if b'=' in item}
          if b'TIBIA_TEST_EMAIL' in keys or b'TIBIA_TEST_PASSWORD' in keys: raise SystemExit('secret leaked to persistent runtime environment')
          print('HELPER_RUNTIME_EXACT_IDENTITY=PASS')
          print('HELPER_PRELOAD_MAPPINGS=PASS')
          print('PERSISTENT_SECRET_ENVIRONMENT=false')
          PY
          printf '%s\n' "$runtime_pid" > "$RUNNER_TEMP/current-runtime-pid"
          echo HELPER_RUNTIME_REUSE=PASS
          echo SECRET_ACCESS=false
          echo LOGIN=false

      - name: Consume GitHub Secrets through sealed memfd and SCM_RIGHTS
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          test -n "${TIBIA_TEST_EMAIL:-}"
          test -n "${TIBIA_TEST_PASSWORD:-}"
          runtime_pid="$(cat "$RUNNER_TEMP/current-runtime-pid")"
          docker exec -i -u kasm-user \
            -e TIBIA_TEST_EMAIL \
            -e TIBIA_TEST_PASSWORD \
            "$CONTAINER" "$TASK_ROOT/secret-ingress" "$AUTH_SOCKET" "$runtime_pid"
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD

      - name: Resolve current native character model and confirm singleton only
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          runtime_pid="$(cat "$RUNNER_TEMP/current-runtime-pid")"
          docker exec -i -u kasm-user -e SOCKET="$CHARACTER_SOCKET" -e EXPECTED_PID="$runtime_pid" "$CONTAINER" python3 - <<'PY'
          import json,os,socket,struct,time
          path=os.environ['SOCKET']; expected=int(os.environ['EXPECTED_PID'])
          def call(command):
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(5); s.connect(path)
              pid,uid,gid=struct.unpack('3i',s.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12))
              if pid!=expected or uid!=os.geteuid(): raise SystemExit('character socket peer mismatch')
              s.sendall(command.encode()+b'\n'); raw=b''
              while b'\n' not in raw:
                  part=s.recv(4096)
                  if not part: break
                  raw+=part
                  if len(raw)>65536: raise SystemExit('character response too large')
              s.close(); return json.loads(raw.split(b'\n',1)[0])
          state=None
          for _ in range(120):
              state=call('STATE')
              count=state.get('character_count',-1) if state.get('ok') else -1
              if isinstance(count,int) and count>0: break
              time.sleep(.5)
          if not state or not state.get('ok'): raise SystemExit('native character model unavailable')
          count=state.get('character_count',-1)
          print('NATIVE_CHARACTER_COUNT='+str(count))
          if count!=1:
              print('NATIVE_CHARACTER_NAMES='+json.dumps(state.get('character_names',[]),ensure_ascii=True))
              print('NATIVE_CHARACTER_CONFIRM=OWNER_DECISION_REQUIRED')
              raise SystemExit(78)
          result=call('CONFIRM_UNIQUE')
          if not (result.get('ok') and result.get('confirmation_dispatched') and result.get('character_index')==0):
              raise SystemExit('native singleton character confirmation failed')
          print('NATIVE_CHARACTER_SINGLETON_INDEX=0')
          print('NATIVE_CHARACTER_CONFIRM=PASS')
          PY

      - name: Prove causal structural IN_GAME
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          runtime_pid="$(cat "$RUNNER_TEMP/current-runtime-pid")"
          docker exec -i -u kasm-user -e SOCKET="$BRIDGE_SOCKET" -e EXPECTED_PID="$runtime_pid" "$CONTAINER" python3 - <<'PY'
          import json,os,socket,struct,time
          path=os.environ['SOCKET']; expected=int(os.environ['EXPECTED_PID'])
          def call(command):
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(5); s.connect(path)
              pid,uid,gid=struct.unpack('3i',s.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12))
              if pid!=expected or uid!=os.geteuid(): raise SystemExit('bridge socket peer mismatch')
              s.sendall(command.encode()+b'\n'); raw=b''
              while b'\n' not in raw:
                  part=s.recv(4096)
                  if not part: break
                  raw+=part
                  if len(raw)>65536: raise SystemExit('bridge response too large')
              s.close(); return json.loads(raw.split(b'\n',1)[0])
          names=('player_protocol_handler','gameserver_game_session','worldmap_handler')
          last={}
          for _ in range(60):
              last={name:call('DISCOVER '+name) for name in names}
              if all(doc.get('ok') and doc.get('validated_hits')==1 for doc in last.values()):
                  print('RESULT=SUCCESS')
                  print('CHARACTER_ACTUALLY_LOGGED_INTO_GAME=YES')
                  print('CAUSAL_PROOF=COMPLETE')
                  print('STRUCTURAL_IN_GAME=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          print('STRUCTURAL_IN_GAME=FAIL')
          for name in names:
              print(name.upper()+'_HITS='+str(last.get(name,{}).get('validated_hits','UNKNOWN')))
          raise SystemExit(2)
          PY

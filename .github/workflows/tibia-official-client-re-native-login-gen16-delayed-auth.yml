name: Track A native-login gen16 delayed auth

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-gen16-delayed-auth.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  auth:
    name: Fresh gen16, delayed helper, sealed Secrets auth
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download exact native-auth helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-auth-helper-5376592fd7382406b4c97de9813a40841d1b3bfd
          path: ${{ runner.temp }}/native-login-gen16-auth-helper
          repository: blakinio/otclient
          run-id: 32129906446
          github-token: ${{ github.token }}

      - name: Download verified delayed loader shim
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-delayed-auth-shim-9d7eda42652f05fae3a3d2c57b4c401078dc5ee4
          path: ${{ runner.temp }}/native-login-gen16-delayed-shim
          repository: blakinio/otclient
          run-id: 32135515927
          github-token: ${{ github.token }}

      - name: Replace gen15 with normal-start gen16 and activate helper after Gate B
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py --changed-from "$EVENT_BASE_SHA" --expected-branch "$HEAD_BRANCH"

          task='OTC-20260818-native-login-to-ingame-e2e'
          old_session='chatgpt-native-login-e2e-20260818-v3-gen15'
          new_session='chatgpt-native-login-e2e-20260818-v3-gen16-auth'
          root='/home/runner/_work/_otclient_tibia_re_state'
          state="$root/canonical-live-runtime"
          task_runtime="$root/tasks/$task/runtime"
          token="$task_runtime/canonical-lease-token"
          helper_src="$RUNNER_TEMP/native-login-gen16-auth-helper/otclient-tibia-native-auth-experimental.so"
          shim_src="$RUNNER_TEMP/native-login-gen16-delayed-shim/otclient-tibia-delayed-auth-loader.so"
          helper="$task_runtime/auth-helper/otclient-tibia-native-auth-experimental.so"
          shim="$task_runtime/auth-helper/otclient-tibia-delayed-auth-loader.so"
          trigger="$task_runtime/delayed-auth.trigger"
          status="$task_runtime/delayed-auth.status"
          identity="$task_runtime/auth-runtime-identity.json"
          socket_path_file="$task_runtime/auth-socket-path"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          canonical_worker='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          worker="$RUNNER_TEMP/native-login-gen16-worker-${GITHUB_RUN_ID}.sh"
          cleanup="$RUNNER_TEMP/native-login-gen15-cleanup-${GITHUB_RUN_ID}.sh"
          acquired16=0
          success=0
          trap 'rc=$?; rm -f "$worker" "$cleanup"; if [[ "$success" != 1 && "$acquired16" == 1 && -f "$token" ]]; then bash "$lease" release --task-id "$task" --session-id "$new_session" --token-file "$token" >/dev/null 2>&1 || true; fi; exit "$rc"' EXIT

          [[ -f "$helper_src" && "$(stat -c %s "$helper_src")" == 63728 ]]
          [[ "$(sha256sum "$helper_src" | awk '{print $1}')" == e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777 ]]
          [[ -f "$shim_src" && "$(stat -c %s "$shim_src")" == 16312 ]]
          [[ "$(sha256sum "$shim_src" | awk '{print $1}')" == 9842247a3affb3fb20a55321c9323ca9119d41c24521cbdc541bfdbadea9ff0c ]]

          [[ -f "$token" && "$(stat -c %a "$token")" == 600 ]]
          bash "$lease" validate --task-id "$task" --session-id "$old_session" --token-file "$token"
          python3 - "$state/lease.json" "$state/runtime-registration.json" <<'PY'
          import json,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text()); reg=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lease.get('status')=='active' and lease.get('generation')==15
          assert lease.get('controller_task')=='OTC-20260818-native-login-to-ingame-e2e'
          assert lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen15'
          assert reg.get('registration_generation')==1 and reg.get('lease_generation')==15
          assert reg.get('client_version')=='15.32.df7b29' and reg.get('client_size')==51965216
          assert reg.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          print('NATIVE_LOGIN_GEN16_PRECHECK=PASS_ACTIVE_GEN15_REG1_15')
          PY

          mkdir -p "$task_runtime/auth-helper"
          chmod 700 "$task_runtime" "$task_runtime/auth-helper"
          install -m700 "$helper_src" "$helper.tmp"; mv -f "$helper.tmp" "$helper"
          install -m700 "$shim_src" "$shim.tmp"; mv -f "$shim.tmp" "$shim"
          rm -f "$trigger" "$status" "$identity" "$socket_path_file"

          cat >"$cleanup" <<'EOS'
          #!/usr/bin/env bash
          set +x
          set -Eeuo pipefail
          state='/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime'
          session="$state/session"
          reg="$state/runtime-registration.json"
          python3 - "$reg" "$session" <<'PY'
          import hashlib,json,os,pathlib,sys
          regp=pathlib.Path(sys.argv[1]); session=pathlib.Path(sys.argv[2]); d=json.loads(regp.read_text())
          assert d.get('registration_generation')==1 and d.get('lease_generation')==15
          assert d.get('client_version')=='15.32.df7b29' and d.get('client_size')==51965216
          assert d.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          pid=int(d['pid']); raw=pathlib.Path(f'/proc/{pid}/stat').read_text(); c=raw.rfind(')'); fields=raw[c+2:].split(); assert int(fields[19])==int(d['process_start_ticks'])
          exe=pathlib.Path(os.path.realpath(f'/proc/{pid}/exe')); assert exe.stat().st_size==51965216
          h=hashlib.sha256()
          with exe.open('rb',buffering=0) as f:
              for b in iter(lambda:f.read(1<<20),b''): h.update(b)
          assert h.hexdigest()==d['client_sha256']
          pgid=int((session/'bootstrap-pgid').read_text().strip()); assert pgid>=2
          for role in ('client','xvfb','vnc','wireproxy'):
              p=int((session/f'{role}.pid').read_text().strip()); stat=pathlib.Path(f'/proc/{p}/stat').read_text(); cc=stat.rfind(')'); ff=stat[cc+2:].split(); assert int(ff[2])==pgid
          print('NATIVE_LOGIN_GEN15_TEARDOWN_OWNERSHIP=PASS')
          PY
          pgid="$(cat "$session/bootstrap-pgid")"
          kill -TERM -- "-$pgid" 2>/dev/null || true
          alive=1
          for _ in $(seq 1 80); do
            alive=0
            for role in client xvfb vnc wireproxy; do p="$(tr -cd '0-9' <"$session/$role.pid" 2>/dev/null || true)"; [[ -z "$p" || ! -e "/proc/$p" ]] || alive=1; done
            [[ "$alive" == 0 ]] && break
            sleep .1
          done
          if [[ "$alive" != 0 ]]; then kill -KILL -- "-$pgid" 2>/dev/null || true; sleep .5; fi
          for role in client xvfb vnc wireproxy; do p="$(tr -cd '0-9' <"$session/$role.pid" 2>/dev/null || true)"; [[ -z "$p" || ! -e "/proc/$p" ]]; done
          bash .github/scripts/tibia-official-client-re-canonical-live-session.sh rollback "$pgid"
          python3 - "$reg" "$state" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); state=pathlib.Path(sys.argv[2]); d=json.loads(p.read_text()); assert d.get('registration_generation')==1 and d.get('lease_generation')==15
          p.unlink(); fd=os.open(state,os.O_RDONLY|getattr(os,'O_DIRECTORY',0)); os.fsync(fd); os.close(fd); assert not p.exists()
          print('NATIVE_LOGIN_GEN15_RUNTIME_REMOVED=PASS')
          PY
          EOS
          chmod 700 "$cleanup"
          bash "$lease" guard-run --task-id "$task" --session-id "$old_session" --token-file "$token" -- "$cleanup"
          rm -f "$cleanup"
          bash "$lease" release --task-id "$task" --session-id "$old_session" --token-file "$token"

          bash "$lease" acquire --task-id "$task" --session-id "$new_session" --token-file "$token" --ttl-seconds 2700
          acquired16=1
          python3 - "$state/lease.json" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert d.get('status')=='active' and d.get('generation')==16 and d.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen16-auth'
          print('NATIVE_LOGIN_GEN16_ACQUIRE=PASS')
          PY

          python3 - "$canonical_worker" "$worker" "$helper" "$shim" "$trigger" "$status" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_text(); out=pathlib.Path(sys.argv[2]); helper,shim,trigger,status=sys.argv[3:]
          anchor="RMARK='OTCLIENT_TIBIA_RE_CANONICAL_RUNTIME=1'\n"; assert src.count(anchor)==1
          def sq(s): return s.replace("'","'\\''")
          src=src.replace(anchor,anchor+f"AUTH_HELPER='{sq(helper)}'\nAUTH_SHIM='{sq(shim)}'\nAUTH_TRIGGER='{sq(trigger)}'\nAUTH_STATUS='{sq(status)}'\n",1)
          old='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" LD_PRELOAD="$preload" \\\n      PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          new='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" OTCLIENT_TIBIA_RE_AUTH_SOCKET="$SESSION/native-auth.sock" \\\n      OTCLIENT_TIBIA_RE_DELAYED_AUTH_HELPER="$AUTH_HELPER" OTCLIENT_TIBIA_RE_DELAYED_AUTH_TRIGGER="$AUTH_TRIGGER" OTCLIENT_TIBIA_RE_DELAYED_AUTH_STATUS="$AUTH_STATUS" \\\n      LD_PRELOAD="$preload:$AUTH_SHIM" PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          assert src.count(old)==1; src=src.replace(old,new,1)
          out.write_text(src); out.chmod(0o700)
          PY
          bash -n "$worker"
          python3 "$transition" bootstrap --task-id "$task" --session-id "$new_session" --token-file "$token" --worker "$worker" --worker-timeout 180
          python3 "$transition" gate-b --task-id "$task" --session-id "$new_session" --token-file "$token" --probe "$worker"

          python3 - "$state/runtime-registration.json" "$identity" "$socket_path_file" "$state/session/native-auth.sock" "$shim" "$helper" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert d.get('registration_generation')==1 and d.get('lease_generation')==16
          assert d.get('client_version')=='15.32.df7b29' and d.get('client_size')==51965216 and d.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          pid=int(d['pid']); maps=pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace')
          assert sys.argv[5] in maps and sys.argv[6] not in maps
          env=pathlib.Path(f'/proc/{pid}/environ').read_bytes().split(b'\0'); assert not any(x.startswith(b'TIBIA_TEST_EMAIL=') or x.startswith(b'TIBIA_TEST_PASSWORD=') for x in env)
          ident={k:d[k] for k in ('boot_id_sha256','pid','process_start_ticks','client_version','client_size','client_sha256')}
          p=pathlib.Path(sys.argv[2]); p.write_text(json.dumps(ident,sort_keys=True,separators=(',',':'))+'\n'); p.chmod(0o600)
          s=pathlib.Path(sys.argv[3]); s.write_text(sys.argv[4]+'\n'); s.chmod(0o600)
          print('NATIVE_LOGIN_GEN16_GATE_B=PASS')
          print('NATIVE_LOGIN_GEN16_SHIM_LOADED=true')
          print('NATIVE_LOGIN_GEN16_HELPER_PRETRIGGER=false')
          PY

          : > "$trigger"; chmod 600 "$trigger"
          for _ in $(seq 1 200); do [[ -f "$status" ]] && break; kill -0 "$(cat "$state/session/client.pid")"; sleep .1; done
          [[ -f "$status" && "$(cat "$status")" == PASS ]]
          auth_socket="$state/session/native-auth.sock"
          for _ in $(seq 1 200); do [[ -S "$auth_socket" ]] && break; kill -0 "$(cat "$state/session/client.pid")"; sleep .1; done
          [[ -S "$auth_socket" && "$(stat -c %a "$auth_socket")" == 600 && "$(stat -c %u "$auth_socket")" == "$(id -u)" ]]
          pid="$(cat "$state/session/client.pid")"
          grep -F "$helper" "/proc/$pid/maps" >/dev/null
          bash "$lease" validate --task-id "$task" --session-id "$new_session" --token-file "$token"
          echo 'NATIVE_LOGIN_GEN16_DELAYED_HELPER=PASS'
          success=1
          rm -f "$worker"
          trap - EXIT

      - name: Use TIBIA_TEST_EMAIL and TIBIA_TEST_PASSWORD through sealed memfd
        shell: python3 {0}
        env:
          PYTHONPATH: ${{ github.workspace }}
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          import ctypes,json,os,pathlib,struct,time
          from tools.tibia_runtime_bridge.protected_auth_tty import ProtectedSecretBuffer,_harden_secret_process,create_sealed_credential_memfd,load_exact_runtime_identity
          from tools.tibia_runtime_bridge.experimental_auth_client import auth_with_credentials_fd
          _harden_secret_process()
          email=bytearray(os.environb.pop(b'TIBIA_TEST_EMAIL',b'')); password=bytearray(os.environb.pop(b'TIBIA_TEST_PASSWORD',b''))
          if not (1<=len(email)<=1024 and 1<=len(password)<=1024) or 0 in email or 0 in password: raise SystemExit('NATIVE_LOGIN_SECRET_SHAPE_INVALID')
          state=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime'); task=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime')
          lease=json.loads((state/'lease.json').read_text()); reg=json.loads((state/'runtime-registration.json').read_text())
          assert lease.get('status')=='active' and lease.get('generation')==16 and lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen16-auth'
          assert reg.get('registration_generation')==1 and reg.get('lease_generation')==16
          identity=load_exact_runtime_identity(task/'auth-runtime-identity.json'); socket_path=pathlib.Path((task/'auth-socket-path').read_text().strip())
          fd=-1
          try:
              with ProtectedSecretBuffer() as eb, ProtectedSecretBuffer() as pb:
                  eb.storage[:len(email)]=email; eb.length=len(email); pb.storage[:len(password)]=password; pb.length=len(password)
                  ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(email)),0,len(email)); ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(password)),0,len(password))
                  fd=create_sealed_credential_memfd(eb,pb)
                  response=auth_with_credentials_fd(socket_path,fd,timeout=5.0,expected_identity=identity)
              safe={k:response.get(k) for k in ('ok','command','qmeta_method_id','invocation_dispatched','error') if k in response}
              print('NATIVE_LOGIN_AUTH_RESPONSE='+json.dumps(safe,sort_keys=True,separators=(',',':')))
              if response.get('ok') is not True or response.get('invocation_dispatched') is not True: raise SystemExit('NATIVE_LOGIN_AUTH_DISPATCH_FAILED')
              print('NATIVE_LOGIN_SECRETS_USED=true'); print('NATIVE_LOGIN_AUTH_DISPATCH=PASS')
          finally:
              if fd>=0: os.close(fd)
              if email: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(email)),0,len(email))
              if password: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(password)),0,len(password))

          pid=int(reg['pid']); exe=os.path.realpath(f'/proc/{pid}/exe'); base=None
          for line in pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace').splitlines():
              q=line.split(maxsplit=5)
              if len(q)>=6 and q[5]==exe: lo=int(q[0].split('-')[0],16); off=int(q[2],16); base=lo-off; break
          assert base is not None
          needle=struct.pack('<Q',base+0x308ed68); deadline=time.monotonic()+75; last_count=-1
          while time.monotonic()<deadline:
              hits=[]; maps=pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace').splitlines(); mfd=os.open(f'/proc/{pid}/mem',os.O_RDONLY)
              try:
                  for line in maps:
                      q=line.split(maxsplit=5)
                      if len(q)<2 or not q[1].startswith('rw') or 'p' not in q[1]: continue
                      lo,hi=(int(x,16) for x in q[0].split('-'))
                      if hi<=lo or hi-lo>(512<<20): continue
                      cur=lo
                      while cur<hi:
                          n=min(1<<20,hi-cur)
                          try:data=os.pread(mfd,n,cur)
                          except OSError:break
                          if len(data)!=n:break
                          pos=0
                          while True:
                              j=data.find(needle,pos)
                              if j<0:break
                              a=cur+j
                              if a%8==0:hits.append(a)
                              pos=j+1
                          cur+=n
                  hits=sorted(set(hits))
                  if len(hits)==1:
                      raw=os.pread(mfd,16,hits[0]+0x100)
                      if len(raw)==16:
                          first,count=struct.unpack('<Qq',raw); last_count=count
                          if count>0 and first!=0:
                              print('NATIVE_LOGIN_ACCOUNT_AUTH=PASS'); print('NATIVE_LOGIN_CHARACTER_LIST_COUNT='+str(count)); raise SystemExit(0)
              finally:os.close(mfd)
              if not pathlib.Path(f'/proc/{pid}').exists():raise SystemExit('NATIVE_LOGIN_CLIENT_DIED_AFTER_AUTH')
              time.sleep(.5)
          print('NATIVE_LOGIN_ACCOUNT_AUTH=NOT_PROVEN'); print('NATIVE_LOGIN_CHARACTER_LIST_COUNT='+str(last_count)); raise SystemExit(47)

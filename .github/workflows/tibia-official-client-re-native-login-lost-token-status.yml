name: Track A native-login lost-token lease status

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-lost-token-status.yml

permissions:
  contents: read

jobs:
  status:
    name: Read public lease status after capability loss
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Read only lease metadata and token-path existence
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]
          task='OTC-20260818-native-login-to-ingame-e2e'
          token="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime/canonical-lease-token"
          if [[ -e "$token" ]]; then echo 'NATIVE_LOGIN_LOST_TOKEN_PATH_PRESENT=true'; else echo 'NATIVE_LOGIN_LOST_TOKEN_PATH_PRESENT=false'; fi
          bash .github/scripts/tibia-official-client-re-canonical-live-lease status --json
          echo 'NATIVE_LOGIN_LOST_TOKEN_CLIENT_OBSERVATION=false'
          echo 'NATIVE_LOGIN_LOST_TOKEN_SECRET_ACCESS=false'

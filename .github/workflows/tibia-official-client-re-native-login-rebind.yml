name: Track A native-login canonical rebind

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-rebind.yml
      - docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md

permissions:
  contents: read

concurrency:
  group: track-a-native-login-canonical-rebind
  cancel-in-progress: false

jobs:
  acquire-rebind-gate-b:
    name: Acquire generation 10, rebind and Gate B
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v2' }}
    runs-on: [otclient, synology]
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fresh admission, generation acquire, rebind and same-generation Gate B
        shell: bash
        env:
          EXPECTED_BASE_SHA: a518ceaef9135c05e36ffd7066b3acb2d81f8c4c
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077

          [[ "$RUNNER_NAME" == 'synology-otclient-01' ]]
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]
          [[ "$HEAD_BRANCH" == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v2' ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          current_main="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          [[ "$current_main" == "$EXPECTED_BASE_SHA" ]] || {
            echo "NATIVE_LOGIN_REBIND_REFUSED=LIVE_MAIN_MOVED:$current_main" >&2
            exit 60
          }

          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$EVENT_BASE_SHA" --expected-branch "$HEAD_BRANCH"
          echo 'NATIVE_LOGIN_REBIND_ADMISSION_POLICY=PASS'

          task='OTC-20260818-native-login-to-ingame-e2e'
          session='chatgpt-native-login-e2e-20260818'
          state='/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime'
          token_root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"
          token="$token_root/canonical-lease-token"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          worker_source='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          adapter='.github/scripts/tibia-official-client-re-canonical-xres-worker-adapter.py'
          owner_helper='.github/scripts/tibia-official-client-re-xres-window-owner.py'
          wire_helper='.github/scripts/tibia-official-client-re-xres-wire.py'
          worker="${RUNNER_TEMP}/native-login-rebind-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          acquired=0
          success=0

          mkdir -p "$token_root"
          chmod 700 "/home/runner/_work/_otclient_tibia_re_state/tasks/$task" "$token_root" 2>/dev/null || true
          rm -f "$token" "$worker"

          cleanup() {
            rc=$?
            rm -f "$worker"
            if [[ "$success" != 1 && "$acquired" == 1 ]]; then
              bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true
              rm -f "$token"
            fi
            exit "$rc"
          }
          trap cleanup EXIT

          python3 .github/scripts/test_tibia_official_client_re_canonical_xres_worker_adapter.py
          python3 .github/scripts/test_tibia_official_client_re_xres_window_owner.py
          python3 .github/scripts/test_tibia_official_client_re_xres_wire.py
          python3 "$adapter" "$worker_source" "$worker" --owner-helper "$owner_helper" --wire-helper "$wire_helper"
          bash -n "$worker"
          echo 'NATIVE_LOGIN_REBIND_XRES_WORKER=PASS'

          python3 - "$state/lease.json" "$state/runtime-registration.json" <<'PY'
          import json, pathlib, sys
          lease = json.loads(pathlib.Path(sys.argv[1]).read_text())
          reg = json.loads(pathlib.Path(sys.argv[2]).read_text())
          expected = {
              'lease.runtime_id': lease.get('runtime_id') == 'track-a-canonical-live',
              'lease.status': lease.get('status') == 'released',
              'lease.generation': lease.get('generation') == 9,
              'lease.controller_task': lease.get('controller_task') is None,
              'lease.controller_session': lease.get('controller_session') is None,
              'reg.runtime_id': reg.get('runtime_id') == 'track-a-canonical-live',
              'reg.registration_generation': reg.get('registration_generation') == 1,
              'reg.lease_generation': reg.get('lease_generation') == 9,
              'reg.client_version': reg.get('client_version') == '15.32.df7b29',
              'reg.client_size': reg.get('client_size') == 51965216,
              'reg.client_sha256': reg.get('client_sha256') == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe',
              'reg.source_task': reg.get('source_task') == 'OTC-20260818-native-login-to-ingame-e2e',
              'reg.source_run': str(reg.get('source_run')) == '32125054251',
          }
          bad = [k for k,v in expected.items() if not v]
          if bad:
              raise SystemExit('NATIVE_LOGIN_REBIND_PRECHECK_DRIFT=' + ','.join(bad))
          print('NATIVE_LOGIN_REBIND_PRECHECK=RELEASED_GEN9_REG1_9')
          PY

          bash "$lease" acquire \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --ttl-seconds 3600
          acquired=1

          python3 - "$state/lease.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          required = {
              'runtime_id': 'track-a-canonical-live',
              'status': 'active',
              'generation': 10,
              'controller_task': 'OTC-20260818-native-login-to-ingame-e2e',
              'controller_session': 'chatgpt-native-login-e2e-20260818',
          }
          for k,v in required.items():
              if data.get(k) != v:
                  raise SystemExit(f'NATIVE_LOGIN_REBIND_ACQUIRE_MISMATCH={k}:{data.get(k)!r}')
          print('NATIVE_LOGIN_REBIND_ACQUIRED_GENERATION=10')
          PY

          python3 "$transition" rebind \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --probe "$worker"

          python3 "$transition" gate-b \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --probe "$worker"

          python3 - "$state/lease.json" "$state/runtime-registration.json" <<'PY'
          import json, pathlib, sys
          lease = json.loads(pathlib.Path(sys.argv[1]).read_text())
          reg = json.loads(pathlib.Path(sys.argv[2]).read_text())
          checks = {
              'lease.status': lease.get('status') == 'active',
              'lease.generation': lease.get('generation') == 10,
              'lease.controller_task': lease.get('controller_task') == 'OTC-20260818-native-login-to-ingame-e2e',
              'lease.controller_session': lease.get('controller_session') == 'chatgpt-native-login-e2e-20260818',
              'reg.registration_generation': reg.get('registration_generation') == 2,
              'reg.lease_generation': reg.get('lease_generation') == 10,
              'reg.client_version': reg.get('client_version') == '15.32.df7b29',
              'reg.client_size': reg.get('client_size') == 51965216,
              'reg.client_sha256': reg.get('client_sha256') == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe',
              'reg.source_task': reg.get('source_task') == 'OTC-20260818-native-login-to-ingame-e2e',
              'reg.source_run': str(reg.get('source_run')) == str(__import__('os').environ['GITHUB_RUN_ID']),
              'reg.remote_view_mapping': reg.get('remote_view_mapping') == 'PROVEN',
          }
          bad = [k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('NATIVE_LOGIN_REBIND_POSTCHECK_FAILED=' + ','.join(bad))
          safe = {k: reg.get(k) for k in (
              'schema_version','runtime_id','registration_generation','lease_generation',
              'boot_id_sha256','pid','process_start_ticks','client_version','client_size',
              'client_sha256','display','window_identity','remote_view_endpoint',
              'remote_view_mapping','state','source_task','source_run'
          )}
          print('NATIVE_LOGIN_REBIND_REGISTRATION=' + json.dumps(safe, sort_keys=True, separators=(',',':')))
          print('NATIVE_LOGIN_REBIND_RESULT=REBIND_GATE_B_PASS_ACTIVE_GEN10')
          PY

          success=1
          echo 'NATIVE_LOGIN_REBIND_CREDENTIAL_ACCESS=false'
          echo 'NATIVE_LOGIN_REBIND_LOGIN_PERFORMED=false'
          echo 'NATIVE_LOGIN_REBIND_GAMEPLAY_PERFORMED=false'
          echo 'NATIVE_LOGIN_REBIND_LEASE_LEFT_ACTIVE=true'

name: Track A current-SHA native login rebuild and execute

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-rebuild-and-execute.yml

permissions:
  contents: read

concurrency:
  group: track-a-current-sha-native-login-rebuild-execute
  cancel-in-progress: false

env:
  EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
  EXPECTED_SIZE: '52109920'
  CONTAINER: otclient-track-a-kasmvnc
  CLIENT: /home/kasm-user/otclient-track-a/Tibia-32177065988-1/bin/client
  TASK_ROOT: /tmp/otclient-native-login-current-sha
  BRIDGE_SOCKET: /tmp/otclient-native-login-current-sha/bridge.sock
  AUTH_SOCKET: /tmp/otclient-native-login-current-sha/auth.sock
  CHARACTER_SOCKET: /tmp/otclient-native-login-current-sha/character.sock
  CLIENT_VERSION: 15.32.current.ed5469
  TARGETS: player_protocol_handler,30bf620,tibia::game::TPlayerProtocolMessageHandler;gameserver_game_session,30aff80,tibia::game::TGameserverGameSession;worldmap_handler,30c01d0,tibia::worldmap::TWorldmapProtocolMessageHandler

jobs:
  execute:
    runs-on: [otclient, synology]
    timeout-minutes: 7
    steps:
      - name: Verify exact client and persisted current-SHA helper set
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          test "$(docker inspect "$CONTAINER" --format '{{.State.Status}}')" = running
          test "$(docker exec -u kasm-user "$CONTAINER" stat -c %s "$CLIENT")" = "$EXPECTED_SIZE"
          got="$(docker exec -u kasm-user "$CONTAINER" sha256sum "$CLIENT" | awk '{print $1}')"
          test "$got" = "$EXPECTED_SHA"
          for f in bridge.so auth.so character.so secret-ingress; do
            docker exec -u kasm-user "$CONTAINER" test -s "$TASK_ROOT/$f"
          done
          docker exec -u kasm-user "$CONTAINER" strings "$TASK_ROOT/auth.so" | grep -qx "$EXPECTED_SHA"
          docker exec -u kasm-user "$CONTAINER" strings "$TASK_ROOT/character.so" | grep -qx "$EXPECTED_SHA"
          echo CURRENT_HELPER_SET=PASS
          echo SECRET_ACCESS=false

      - name: Relaunch the single exact client with helper preload
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          readarray -t pids < <(docker exec -i -u kasm-user -e CLIENT="$CLIENT" "$CONTAINER" python3 - <<'PY'
          import os,pathlib
          expected=os.path.realpath(os.environ['CLIENT'])
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try: x=os.path.realpath(str(p/'exe'))
              except OSError: continue
              if x==expected: print(p.name)
          PY
          )
          test "${#pids[@]}" = 1
          old_pid="${pids[0]}"; [[ "$old_pid" =~ ^[0-9]+$ ]]
          docker exec -u kasm-user "$CONTAINER" kill -TERM "$old_pid"
          for _ in $(seq 1 60); do docker exec "$CONTAINER" test ! -d "/proc/$old_pid" && break; sleep .1; done
          docker exec "$CONTAINER" test ! -d "/proc/$old_pid"
          docker exec -u kasm-user "$CONTAINER" rm -f "$BRIDGE_SOCKET" "$AUTH_SOCKET" "$CHARACTER_SOCKET"
          client_dir="${CLIENT%/client}"
          preload="$TASK_ROOT/bridge.so:$TASK_ROOT/auth.so:$TASK_ROOT/character.so"
          docker exec -d -u kasm-user \
            -e HOME=/home/kasm-user -e DISPLAY=:1 -e XAUTHORITY=/home/kasm-user/.Xauthority \
            -e LD_LIBRARY_PATH="$client_dir:$client_dir/lib" -e LD_PRELOAD="$preload" \
            -e OTCLIENT_TIBIA_RE_SOCKET="$BRIDGE_SOCKET" \
            -e OTCLIENT_TIBIA_RE_AUTH_SOCKET="$AUTH_SOCKET" \
            -e OTCLIENT_TIBIA_RE_CHARACTER_SOCKET="$CHARACTER_SOCKET" \
            -e OTCLIENT_TIBIA_RE_CLIENT_VERSION="$CLIENT_VERSION" \
            -e OTCLIENT_TIBIA_RE_BINARY_SHA256="$EXPECTED_SHA" \
            -e OTCLIENT_TIBIA_RE_TARGETS="$TARGETS" \
            "$CONTAINER" sh -lc "cd '$client_dir' && exec ./client"
          for _ in $(seq 1 120); do
            ok=true
            for s in "$BRIDGE_SOCKET" "$AUTH_SOCKET" "$CHARACTER_SOCKET"; do docker exec -u kasm-user "$CONTAINER" test -S "$s" || ok=false; done
            $ok && break
            sleep .25
          done
          for s in "$BRIDGE_SOCKET" "$AUTH_SOCKET" "$CHARACTER_SOCKET"; do docker exec -u kasm-user "$CONTAINER" test -S "$s"; done
          runtime_pid="$(docker exec -i -u kasm-user -e SOCKET="$BRIDGE_SOCKET" "$CONTAINER" python3 - <<'PY'
          import json,os,socket,struct
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(5); s.connect(os.environ['SOCKET'])
          pid,uid,gid=struct.unpack('3i',s.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12)); assert uid==os.geteuid()
          s.sendall(b'PING\n'); raw=b''
          while b'\n' not in raw: raw+=s.recv(4096)
          d=json.loads(raw.split(b'\n',1)[0]); assert d.get('ok') and d.get('pid')==pid
          assert d.get('client_sha256')=='ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8'
          assert d.get('client_size')==52109920
          print(pid)
          PY
          )"
          [[ "$runtime_pid" =~ ^[0-9]+$ ]]
          printf '%s\n' "$runtime_pid" > "$RUNNER_TEMP/native-login-pid"
          echo HELPER_RUNTIME_RELAUNCH=PASS
          echo SECRET_ACCESS=false

      - name: Bounded one-shot native authentication
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          test -n "${TIBIA_TEST_EMAIL:-}"; test -n "${TIBIA_TEST_PASSWORD:-}"
          runtime_pid="$(cat "$RUNNER_TEMP/native-login-pid")"
          docker exec -i -u kasm-user -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD "$CONTAINER" "$TASK_ROOT/secret-ingress" "$AUTH_SOCKET" "$runtime_pid"
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          echo NATIVE_AUTH_ONE_SHOT=DISPATCHED

      - name: Confirm singleton character through native model
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          runtime_pid="$(cat "$RUNNER_TEMP/native-login-pid")"
          docker exec -i -u kasm-user -e SOCKET="$CHARACTER_SOCKET" -e EXPECTED_PID="$runtime_pid" "$CONTAINER" python3 - <<'PY'
          import json,os,socket,struct,time
          path=os.environ['SOCKET']; expected=int(os.environ['EXPECTED_PID'])
          def call(cmd):
            s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(5); s.connect(path)
            pid,uid,gid=struct.unpack('3i',s.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12)); assert pid==expected and uid==os.geteuid()
            s.sendall(cmd.encode()+b'\n'); raw=b''
            while b'\n' not in raw: raw+=s.recv(4096)
            s.close(); return json.loads(raw.split(b'\n',1)[0])
          state={}
          for _ in range(120):
            state=call('STATE'); count=state.get('character_count',-1) if state.get('ok') else -1
            if isinstance(count,int) and count>0: break
            time.sleep(.5)
          count=state.get('character_count',-1); print('NATIVE_CHARACTER_COUNT='+str(count))
          if count!=1: raise SystemExit(78)
          r=call('CONFIRM_UNIQUE'); assert r.get('ok') and r.get('confirmation_dispatched') and r.get('character_index')==0
          print('NATIVE_CHARACTER_CONFIRM=PASS')
          PY

      - name: Prove structural IN_GAME
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          runtime_pid="$(cat "$RUNNER_TEMP/native-login-pid")"
          docker exec -i -u kasm-user -e SOCKET="$BRIDGE_SOCKET" -e EXPECTED_PID="$runtime_pid" "$CONTAINER" python3 - <<'PY'
          import json,os,socket,struct,time
          path=os.environ['SOCKET']; expected=int(os.environ['EXPECTED_PID'])
          def call(cmd):
            s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(5); s.connect(path)
            pid,uid,gid=struct.unpack('3i',s.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12)); assert pid==expected and uid==os.geteuid()
            s.sendall(cmd.encode()+b'\n'); raw=b''
            while b'\n' not in raw: raw+=s.recv(4096)
            s.close(); return json.loads(raw.split(b'\n',1)[0])
          names=('player_protocol_handler','gameserver_game_session','worldmap_handler'); last={}
          for _ in range(90):
            last={n:call('DISCOVER '+n) for n in names}
            if all(d.get('ok') and d.get('validated_hits')==1 for d in last.values()):
              print('RESULT=SUCCESS'); print('CHARACTER_ACTUALLY_LOGGED_INTO_GAME=YES'); print('CAUSAL_PROOF=COMPLETE'); print('STRUCTURAL_IN_GAME=PASS'); raise SystemExit(0)
            time.sleep(2)
          print('STRUCTURAL_IN_GAME=FAIL')
          for n in names: print(n.upper()+'_HITS='+str(last.get(n,{}).get('validated_hits','UNKNOWN')))
          raise SystemExit(2)
          PY

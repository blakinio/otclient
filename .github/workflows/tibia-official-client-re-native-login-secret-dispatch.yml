name: Track A native login sealed Secrets dispatch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-secret-dispatch.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  physical:
    name: Native auth and single-character game-login attempt
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 20
    env:
      TASK_ID: OTC-20260818-native-login-to-ingame-e2e
      SESSION_ID: chatgpt-native-login-e2e-20260818-v3-gen12
      STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
      TOKEN_FILE: /home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime/canonical-lease-token
      NATIVE_ROOT: /home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime/native-auth
      EXPECTED_MAIN: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
      EXPECTED_CLIENT_SHA: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      AUTH_HELPER_SHA: e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777
      AUTH_HELPER_SIZE: '63728'
      AUTH_ARTIFACT_ID: '9321784436'
      AUTH_ARTIFACT_ZIP_SHA: cb87d6f0ee1b5e4eb4c096c368ea53d55274f479be5fdaedbf5c1f24bde76608

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Revalidate and renew active generation 12
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_MAIN" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_MAIN" ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py --changed-from "$EVENT_BASE_SHA" --expected-branch "$HEAD_BRANCH"
          [[ -f "$TOKEN_FILE" && "$(stat -c %a "$TOKEN_FILE")" == 600 ]]
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          bash "$lease" validate --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN_FILE"
          bash "$lease" renew --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN_FILE" --ttl-seconds 2700
          worker="$RUNNER_TEMP/native-login-gateb-${GITHUB_RUN_ID}.sh"
          trap 'rm -f "$worker"' EXIT
          python3 .github/scripts/tibia-official-client-re-canonical-xres-worker-adapter.py \
            .github/scripts/tibia-official-client-re-canonical-live-session.sh "$worker" \
            --owner-helper .github/scripts/tibia-official-client-re-xres-window-owner.py \
            --wire-helper .github/scripts/tibia-official-client-re-xres-wire.py
          python3 .github/scripts/tibia-official-client-re-canonical-live-transition.py gate-b \
            --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN_FILE" --probe "$worker"
          python3 - "$STATE/lease.json" "$STATE/runtime-registration.json" <<'PY'
          import json,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text())
          reg=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lease.get('status')=='active' and lease.get('generation')==12
          assert lease.get('controller_task')=='OTC-20260818-native-login-to-ingame-e2e'
          assert lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen12'
          assert reg.get('registration_generation')==4 and reg.get('lease_generation')==12
          assert reg.get('client_version')=='15.32.df7b29' and reg.get('client_size')==51965216
          assert reg.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          assert reg.get('pid')==2658 and reg.get('process_start_ticks')==66643010
          print('NATIVE_LOGIN_PREAUTH_AUTHORITY=PASS_GEN12_REG4_12_GATE_B')
          PY

      - name: Retrieve and verify exact experimental auth helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          mkdir -p "$NATIVE_ROOT"
          chmod 700 "$NATIVE_ROOT"
          zip="$RUNNER_TEMP/native-auth-helper.zip"
          out="$RUNNER_TEMP/native-auth-helper"
          rm -rf "$out" "$zip"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/blakinio/otclient/actions/artifacts/$AUTH_ARTIFACT_ID/zip" -o "$zip"
          [[ "$(sha256sum "$zip" | awk '{print $1}')" == "$AUTH_ARTIFACT_ZIP_SHA" ]]
          mkdir "$out"
          python3 - "$zip" "$out" <<'PY'
          import pathlib,sys,zipfile
          z=zipfile.ZipFile(sys.argv[1]); names=z.namelist()
          assert names and all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in names)
          z.extractall(sys.argv[2])
          PY
          src="$(find "$out" -type f -name otclient-tibia-native-auth-experimental.so -print -quit)"
          [[ -n "$src" && -f "$src" ]]
          [[ "$(stat -c %s "$src")" == "$AUTH_HELPER_SIZE" ]]
          [[ "$(sha256sum "$src" | awk '{print $1}')" == "$AUTH_HELPER_SHA" ]]
          helper="$NATIVE_ROOT/otclient-tibia-native-auth-experimental.so"
          install -m700 "$src" "$helper"
          [[ "$(sha256sum "$helper" | awk '{print $1}')" == "$AUTH_HELPER_SHA" ]]
          pid="$(python3 -c 'import json,os;print(json.load(open(os.environ["STATE"]+"/runtime-registration.json"))["pid"])')"
          ! grep -F "$helper" "/proc/$pid/maps" >/dev/null
          echo 'NATIVE_LOGIN_AUTH_HELPER_VERIFIED=PASS'
          echo 'NATIVE_LOGIN_AUTH_HELPER_PREMAPPED=false'

      - name: Guarded helper activation, sealed-memfd auth and native character confirmation
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          controller="$RUNNER_TEMP/native-login-controller.sh"
          cat >"$controller" <<'CONTROLLER'
          #!/usr/bin/env bash
          set +x
          set -Eeuo pipefail
          umask 077
          ROOT="$NATIVE_ROOT"
          REG="$STATE/runtime-registration.json"
          HELPER="$ROOT/otclient-tibia-native-auth-experimental.so"
          SOCK="$ROOT/auth.sock"
          READY="$ROOT/controller.ready"
          DISPATCH="$ROOT/auth.dispatched"
          EVENTS="$ROOT/native-events.tsv"
          STRIPS="$ROOT/worldmap-strips.tsv"
          GOUT="$ROOT/native-observer.log"
          RESULT="$ROOT/controller.result"
          GCMD="$ROOT/native-observer.gdb"
          INJECT="$ROOT/native-inject.gdb"
          rm -f "$SOCK" "$READY" "$DISPATCH" "$EVENTS" "$STRIPS" "$GOUT" "$RESULT" "$GCMD" "$INJECT"
          :>"$EVENTS"; :>"$STRIPS"; :>"$GOUT"
          chmod 600 "$EVENTS" "$STRIPS" "$GOUT"
          fail(){ printf 'NATIVE_LOGIN_CONTROLLER_ERROR=%s\n' "$1" >&2; printf 'BLOCKED:%s\n' "$1" >"$RESULT"; exit 1; }
          PID="$(python3 - "$REG" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]));assert r['registration_generation']==4 and r['lease_generation']==12
          assert r['client_sha256']=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          print(r['pid'])
          PY
          )"
          [[ "$PID" == 2658 && -e "/proc/$PID" ]] || fail registered_pid_missing
          CLIENT="$(readlink -f "/proc/$PID/exe")"
          [[ "$(stat -c %s "$CLIENT")" == 51965216 ]] || fail client_size_drift
          [[ "$(sha256sum "$CLIENT" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA" ]] || fail client_sha_drift
          START="$(python3 - "$PID" <<'PY'
          import pathlib,sys
          s=pathlib.Path('/proc/'+sys.argv[1]+'/stat').read_text();c=s.rfind(')');print(s[c+2:].split()[19])
          PY
          )"
          [[ "$START" == 66643010 ]] || fail client_start_drift
          [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$PID/status")" == 0 ]] || fail client_already_traced
          TOOL="$(cat "$STATE/session/toolroot")"
          GDB="$TOOL/usr/bin/gdb"
          [[ -x "$GDB" ]] || fail gdb_missing
          [[ "$(sha256sum "$HELPER" | awk '{print $1}')" == "$AUTH_HELPER_SHA" ]] || fail helper_sha_drift
          line="$(grep -F "$CLIENT" "/proc/$PID/maps" | awk '$2~/r-xp/{print;exit}')"
          [[ -n "$line" ]] || fail exec_mapping_missing
          start="$(awk '{split($1,a,"-");print a[1]}'<<<"$line")";off="$(awk '{print $3}'<<<"$line")";BIAS=$((16#$start-16#$off))

          python3 - "$INJECT" "$PID" "$SOCK" "$HELPER" <<'PY'
          import sys
          out,pid,sock,helper=sys.argv[1:]
          def q(s): return s.replace('\\','\\\\').replace('"','\\"')
          open(out,'w').write(f'''set pagination off\nset confirm off\nattach {pid}\nset $s = (int)setenv("OTCLIENT_TIBIA_RE_AUTH_SOCKET","{q(sock)}",1)\nprintf "NATIVE_LOGIN_INJECT_SETENV_RC=%d\\n", $s\nif $s != 0\n  quit 43\nend\nset $h = (void*)dlopen("{q(helper)}",2)\nprintf "NATIVE_LOGIN_INJECT_DLOPEN=%p\\n", $h\nif $h == 0\n  quit 44\nend\ndetach\nquit\n''')
          PY
          chmod 600 "$INJECT"
          env -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD "$GDB" -q -nx -batch -x "$INJECT" >"$ROOT/inject.log" 2>&1 || { cat "$ROOT/inject.log"; fail helper_dlopen_failed; }
          grep -Fq 'NATIVE_LOGIN_INJECT_SETENV_RC=0' "$ROOT/inject.log" || fail helper_setenv_failed
          grep -Eq 'NATIVE_LOGIN_INJECT_DLOPEN=0x[1-9a-fA-F][0-9a-fA-F]*' "$ROOT/inject.log" || fail helper_dlopen_null
          kill -0 "$PID" || fail client_died_after_helper_activation
          [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$PID/status")" == 0 ]] || fail tracer_left_after_injection
          grep -F "$HELPER" "/proc/$PID/maps" >/dev/null || fail helper_mapping_missing
          socket_ready=0
          for _ in $(seq 1 100); do
            if [[ -S "$SOCK" ]]; then socket_ready=1;break;fi
            kill -0 "$PID" || fail client_died_before_auth_socket
            sleep .1
          done
          [[ "$socket_ready" == 1 ]] || fail auth_socket_missing
          [[ "$(stat -c %a "$SOCK")" == 600 ]] || fail auth_socket_mode
          [[ "$(stat -c %u "$SOCK")" == "$(id -u)" ]] || fail auth_socket_owner

          python3 - "$GCMD" "$PID" "$BIAS" "$EVENTS" "$STRIPS" <<'PY'
          import sys
          out,pid,bias,ev,strips=sys.argv[1:]
          t=r'''set pagination off
          set confirm off
          attach @PID@
          python
          import gdb,struct,time
          inf=gdb.selected_inferior();ev=r'@EV@';strips=r'@STRIPS@';bias=@BIAS@
          def mem(a,n):
              try:return bytes(inf.read_memory(a,n))
              except:return None
          class M(gdb.Breakpoint):
              def __init__(self,o,n):self.n=n;super().__init__('*0x%x'%(bias+o),internal=False)
              def stop(self):
                  try:
                      with open(ev,'a') as f:f.write(f'{time.time_ns()}\t{self.n}\n')
                  except:pass
                  return False
          for o,n in ((0xcfb374,'ShowCharacterSelection'),(0x856880,'RequestCharacterLoginSignalActivate'),(0xcfb2e7,'RequestCharacterGameserverLogin'),(0xcfb122,'StartGameServerLogin'),(0xd06660,'ConnectExistingCredentials'),(0xd06810,'OnConnectGameserver'),(0xd067b0,'AbortGameserverConnect'),(0xd066e0,'GameSessionConnected'),(0xd066c8,'GameSessionLoginSuccessful'),(0xd064d8,'GameSessionLoginError'),(0xd064c8,'GameSessionDisconnected'),(0xcec8d0,'FullMap')):M(o,n)
          class S(gdb.Breakpoint):
              def __init__(self):super().__init__('*0x%x'%(bias+0x19a8ea3),internal=False)
              def stop(self):
                  try:
                      ns=time.time_ns();rsp=int(gdb.parse_and_eval('$rsp'));order=int(gdb.parse_and_eval('$rbp'))&0xffffffff;b=mem(rsp+0x88,12)
                      if b:
                          x,y,z=struct.unpack('<III',b)
                          if 0<x<100000 and 0<y<100000 and z<32 and order<128:
                              with open(strips,'a') as f:f.write(f'{ns}\t{x}\t{y}\t{z}\t{order}\n')
                  except:pass
                  return False
          S()
          gdb.write('NATIVE_LOGIN_OBSERVER_ARMED=PASS\n')
          end
          continue
          python
          import re,struct,gdb
          inf=gdb.selected_inferior();bias=@BIAS@
          def emit(s):gdb.write(s+'\n')
          def mem(a,n):
              try:return bytes(inf.read_memory(a,n))
              except:return None
          def ranges():
              out=[]
              try:
                  for line in open(f'/proc/{inf.pid}/maps',errors='replace'):
                      p=line.split()
                      if len(p)>=2 and p[1].startswith('rw') and 'p' in p[1]:
                          lo,hi=(int(x,16) for x in p[0].split('-'))
                          if hi>lo:out.append((lo,hi))
              except:pass
              return out
          def scan(value):
              needle=struct.pack('<Q',value);hits=[]
              for lo,hi in ranges():
                  cur=lo
                  while cur<hi:
                      try:found=inf.search_memory(cur,hi-cur,needle)
                      except:found=None
                      if found is None:break
                      a=int(found);hits.append(a)
                      if len(hits)>16:return hits
                      cur=a+8
              return hits
          def resolve(mangled,demangled):
              for expr in (f'(void*){mangled}',f"(void*)&'{demangled}'"):
                  try:
                      v=int(gdb.parse_and_eval(expr))
                      if v:return v
                  except:pass
              return 0
          def selected(obj):
              b=mem(obj+0x140,16)
              if b is None:return -1
              a,z=struct.unpack('<QQ',b);span=z-a
              return span//0x70 if z>=a and span%0x70==0 else -1
          result='FAIL:unknown'
          locked=False
          try:
              hits=scan(bias+0x308ed68);emit('NATIVE_LOGIN_CHARACTER_CONTROLLER_COUNT='+str(len(hits)))
              if len(hits)!=1:result='FAIL:controller_count'
              else:
                  obj=hits[0];p=mem(bias+0xd46550,16)
                  if p is None or p.hex()!='41574156415541544989cc55534889fb':result='FAIL:qmeta_fence'
                  else:
                      b1=mem(obj+0x108,8);b2=mem(obj+0x100,8)
                      count=struct.unpack('<q',b1)[0] if b1 else -1;model=struct.unpack('<Q',b2)[0] if b2 else 0
                      emit('NATIVE_LOGIN_NATIVE_CHARACTER_LIST_COUNT='+str(count))
                      if count!=1 or model==0 or mem(model,8) is None:result='FAIL:single_character_not_proven'
                      else:
                          mains=[t for t in inf.threads() if len(t.ptid)>=2 and t.ptid[1]==inf.pid]
                          if len(mains)!=1:result='FAIL:main_lwp'
                          else:
                              mains[0].switch();gdb.execute('set scheduler-locking on',to_string=True);locked=True
                              qt=resolve('_ZNK7QObject6threadEv','QObject::thread() const');qc=resolve('_ZN7QThread13currentThreadEv','QThread::currentThread()')
                              owner=int(gdb.parse_and_eval(f'((void*(*)(void*))0x{qt:x})((void*)0x{obj:x})')) if qt else 0
                              current=int(gdb.parse_and_eval(f'((void*(*)())0x{qc:x})()')) if qc else -1
                              if owner==0 or owner!=current:result='FAIL:qt_affinity'
                              else:
                                  emit('NATIVE_LOGIN_CHARACTER_QT_AFFINITY=PASS');before=selected(obj);emit('NATIVE_LOGIN_SELECTED_DATA_BEFORE='+str(before))
                                  idx=int(gdb.parse_and_eval('((void*(*)(unsigned long))malloc)(8)'));view=int(gdb.parse_and_eval('((void*(*)(unsigned long))malloc)(24)'));argv=int(gdb.parse_and_eval('((void*(*)(unsigned long))malloc)(16)'))
                                  ok=bool(idx and view and argv)
                                  if ok:
                                      inf.write_memory(idx,struct.pack('<iI',0,0));inf.write_memory(view,struct.pack('<QQq',0,idx,1));inf.write_memory(argv,struct.pack('<QQ',0,view))
                                      gdb.parse_and_eval(f'((void(*)(void*,int,int,void**))0x{bias+0xd46550:x})((void*)0x{obj:x},0,11,(void**)0x{argv:x})')
                                  after=selected(obj) if ok else -1;emit('NATIVE_LOGIN_SELECTED_DATA_AFTER='+str(after))
                                  for x in (argv,view,idx):
                                      if x:
                                          try:gdb.parse_and_eval(f'((void(*)(void*))free)((void*)0x{x:x})')
                                          except:pass
                                  result='PASS' if ok and after>=1 else 'FAIL:qmeta_confirmation'
          except Exception:result='FAIL:exception'
          finally:
              if locked:
                  try:gdb.execute('set scheduler-locking off',to_string=True)
                  except:pass
          emit('NATIVE_LOGIN_CHARACTER_CONFIRM='+result)
          end
          continue
          detach
          quit
          '''
          open(out,'w').write(t.replace('@PID@',pid).replace('@BIAS@',bias).replace('@EV@',ev).replace('@STRIPS@',strips))
          PY
          chmod 600 "$GCMD"
          env -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD "$GDB" -q -nx -batch -x "$GCMD" >"$GOUT" 2>&1 &
          GDBPID=$!
          observer=0
          for _ in $(seq 1 100);do
            grep -Fq 'NATIVE_LOGIN_OBSERVER_ARMED=PASS' "$GOUT" 2>/dev/null && { observer=1;break; }
            kill -0 "$GDBPID" 2>/dev/null || break
            sleep .1
          done
          [[ "$observer" == 1 ]] || { cat "$GOUT"; fail observer_not_armed; }
          [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$PID/status")" == "$GDBPID" ]] || fail observer_not_exact_tracer
          printf 'READY\n' >"$READY"
          chmod 600 "$READY"
          dispatch=0
          for _ in $(seq 1 1200);do
            [[ -f "$DISPATCH" ]] && { dispatch=1;break; }
            kill -0 "$PID" || fail client_died_waiting_for_auth_dispatch
            sleep .1
          done
          [[ "$dispatch" == 1 ]] || fail auth_dispatch_timeout
          char=0
          for _ in $(seq 1 900);do
            grep -Fq $'\tShowCharacterSelection' "$EVENTS" 2>/dev/null && { char=1;break; }
            grep -Fq $'\tGameSessionLoginError' "$EVENTS" 2>/dev/null && break
            kill -0 "$PID" || fail client_died_post_auth
            sleep .1
          done
          [[ "$char" == 1 ]] || {
            echo 'NATIVE_LOGIN_POSTAUTH_CHARACTER_SELECTION=NOT_OBSERVED'
            kill -INT "$GDBPID" 2>/dev/null || true;sleep .5;kill -INT "$GDBPID" 2>/dev/null || true
            wait "$GDBPID" 2>/dev/null || true
            fail postauth_character_selection_not_observed
          }
          echo 'NATIVE_LOGIN_POSTAUTH_CHARACTER_SELECTION=OBSERVED'
          kill -INT "$GDBPID" || fail confirmation_interrupt_failed
          sem=0
          for _ in $(seq 1 400);do
            grep -Fq 'NATIVE_LOGIN_CHARACTER_CONFIRM=PASS' "$GOUT" 2>/dev/null && { sem=1;break; }
            grep -Fq 'NATIVE_LOGIN_CHARACTER_CONFIRM=FAIL:' "$GOUT" 2>/dev/null && break
            kill -0 "$GDBPID" 2>/dev/null || break
            sleep .1
          done
          grep -E '^NATIVE_LOGIN_(CHARACTER_CONTROLLER_COUNT|NATIVE_CHARACTER_LIST_COUNT|CHARACTER_QT_AFFINITY|SELECTED_DATA_BEFORE|SELECTED_DATA_AFTER|CHARACTER_CONFIRM)=' "$GOUT" || true
          [[ "$sem" == 1 ]] || { kill -INT "$GDBPID" 2>/dev/null||true;wait "$GDBPID" 2>/dev/null||true;fail native_character_confirmation_failed; }
          world=0
          for _ in $(seq 1 1200);do
            fm="$(awk -F '\t' '$2=="FullMap"{c++} END{print c+0}' "$EVENTS")"
            sc="$(wc -l <"$STRIPS")"
            if [[ "$fm" -ge 1 && "$sc" -ge 10 ]];then world=1;break;fi
            grep -Fq $'\tGameSessionLoginError' "$EVENTS" 2>/dev/null && break
            grep -Fq $'\tAbortGameserverConnect' "$EVENTS" 2>/dev/null && break
            kill -0 "$PID" || fail client_died_game_login
            sleep .1
          done
          for n in ShowCharacterSelection RequestCharacterLoginSignalActivate RequestCharacterGameserverLogin StartGameServerLogin ConnectExistingCredentials OnConnectGameserver AbortGameserverConnect GameSessionConnected GameSessionLoginSuccessful GameSessionLoginError GameSessionDisconnected FullMap;do
            c="$(awk -F '\t' -v n="$n" '$2==n{c++} END{print c+0}' "$EVENTS")";echo "NATIVE_LOGIN_EVENT_${n}=$c"
          done
          echo "NATIVE_LOGIN_MAP_DESCRIPTION_STRIPS=$(wc -l <"$STRIPS")"
          kill -INT "$GDBPID" 2>/dev/null || true
          wait "$GDBPID" 2>/dev/null || true
          [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$PID/status")" == 0 ]] || fail tracer_left_after_observation
          if [[ "$world" == 1 ]];then
            echo 'NATIVE_LOGIN_STRUCTURAL_FULLMAP=PASS'
            printf 'STRUCTURAL_IN_GAME\n' >"$RESULT"
            exit 0
          fi
          fail structural_world_entry_not_observed
          CONTROLLER
          chmod 700 "$controller"
          rm -f "$NATIVE_ROOT/controller.ready" "$NATIVE_ROOT/auth.dispatched" "$NATIVE_ROOT/controller.result"
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          env -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
            bash "$lease" guard-run --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN_FILE" -- \
            env -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD bash "$controller" \
            >"$RUNNER_TEMP/native-login-guard.log" 2>&1 &
          GUARD_PID=$!
          cleanup_parent(){
            rc=$?
            unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
            if kill -0 "$GUARD_PID" 2>/dev/null;then kill -TERM "$GUARD_PID" 2>/dev/null||true;fi
            wait "$GUARD_PID" 2>/dev/null||true
            exit "$rc"
          }
          trap cleanup_parent EXIT INT TERM
          ready=0
          for _ in $(seq 1 1200);do
            [[ -f "$NATIVE_ROOT/controller.ready" && -S "$NATIVE_ROOT/auth.sock" ]] && { ready=1;break; }
            kill -0 "$GUARD_PID" 2>/dev/null || { cat "$RUNNER_TEMP/native-login-guard.log";exit 81; }
            sleep .1
          done
          [[ "$ready" == 1 ]]
          python3 - "$NATIVE_ROOT/auth.sock" "$STATE/runtime-registration.json" <<'PY'
          import ctypes,fcntl,os,resource,struct,sys
          from pathlib import Path
          from tools.tibia_runtime_bridge.experimental_auth_client import auth_with_credentials_fd
          from tools.tibia_runtime_bridge.protected_auth_tty import load_exact_runtime_identity
          libc=ctypes.CDLL(None,use_errno=True)
          libc.getenv.argtypes=[ctypes.c_char_p];libc.getenv.restype=ctypes.c_void_p
          libc.strlen.argtypes=[ctypes.c_void_p];libc.strlen.restype=ctypes.c_size_t
          libc.write.argtypes=[ctypes.c_int,ctypes.c_void_p,ctypes.c_size_t];libc.write.restype=ctypes.c_ssize_t
          libc.mlock.argtypes=[ctypes.c_void_p,ctypes.c_size_t];libc.munlock.argtypes=[ctypes.c_void_p,ctypes.c_size_t]
          PR_SET_DUMPABLE=4
          resource.setrlimit(resource.RLIMIT_CORE,(0,0))
          if libc.prctl(PR_SET_DUMPABLE,0,0,0,0)!=0:raise SystemExit('NATIVE_LOGIN_SECRET_PRODUCER_ERROR=prctl')
          names=(b'TIBIA_TEST_EMAIL',b'TIBIA_TEST_PASSWORD');ptrs=[]
          fd=-1
          try:
            for name in names:
              p=libc.getenv(name)
              if not p:raise SystemExit('NATIVE_LOGIN_SECRET_PRODUCER_ERROR=missing_secret')
              n=int(libc.strlen(p))
              if not 1<=n<=1024:raise SystemExit('NATIVE_LOGIN_SECRET_PRODUCER_ERROR=secret_length')
              if libc.mlock(p,n)!=0:raise SystemExit('NATIVE_LOGIN_SECRET_PRODUCER_ERROR=mlock')
              ptrs.append((name,p,n))
            fd=os.memfd_create('otclient-tibia-native-auth',os.MFD_CLOEXEC|os.MFD_ALLOW_SEALING)
            os.write(fd,struct.pack('<II',ptrs[0][2],ptrs[1][2]))
            for _,p,n in ptrs:
              if libc.write(fd,p,n)!=n:raise SystemExit('NATIVE_LOGIN_SECRET_PRODUCER_ERROR=memfd_write')
            req=fcntl.F_SEAL_SEAL|fcntl.F_SEAL_SHRINK|fcntl.F_SEAL_GROW|fcntl.F_SEAL_WRITE
            fcntl.fcntl(fd,fcntl.F_ADD_SEALS,req)
            if fcntl.fcntl(fd,fcntl.F_GET_SEALS)&req!=req:raise SystemExit('NATIVE_LOGIN_SECRET_PRODUCER_ERROR=seals')
            os.lseek(fd,0,os.SEEK_SET)
            for name,p,n in ptrs:
              ctypes.memset(p,0,n);libc.unsetenv(name);libc.munlock(p,n)
            ptrs=[]
            identity=load_exact_runtime_identity(Path(sys.argv[2]))
            response=auth_with_credentials_fd(Path(sys.argv[1]),fd,timeout=5.0,expected_identity=identity)
            if response.get('ok') is not True or response.get('invocation_dispatched') is not True:
              raise SystemExit('NATIVE_LOGIN_NATIVE_AUTH_ERROR='+str(response.get('error','unknown')))
            print('NATIVE_LOGIN_SECRET_MEMFD_SEALED=PASS')
            print('NATIVE_LOGIN_NATIVE_AUTH_QMETA17_DISPATCHED=PASS')
            print('NATIVE_LOGIN_SECRET_VALUE_LOGGED=false')
            print('NATIVE_LOGIN_SECRET_VALUE_PERSISTED=false')
          finally:
            for name,p,n in ptrs:
              ctypes.memset(p,0,n);libc.unsetenv(name);libc.munlock(p,n)
            if fd>=0:os.close(fd)
          PY
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          printf 'DISPATCHED\n' >"$NATIVE_ROOT/auth.dispatched"
          chmod 600 "$NATIVE_ROOT/auth.dispatched"
          set +e
          wait "$GUARD_PID"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/native-login-guard.log"
          trap - EXIT INT TERM
          [[ "$rc" == 0 ]]
          [[ -f "$NATIVE_ROOT/controller.result" ]]
          cat "$NATIVE_ROOT/controller.result"
          echo 'NATIVE_LOGIN_GUARD_COMMAND_RC=0'

      - name: Post-attempt exact runtime and secret hygiene
        if: always()
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          reg="$STATE/runtime-registration.json"
          pid="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["pid"])' "$reg")"
          if kill -0 "$pid" 2>/dev/null;then
            [[ "$(sha256sum "/proc/$pid/exe" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA" ]]
            ! grep -azEq '^(TIBIA_TEST_EMAIL|TIBIA_TEST_PASSWORD)=' "/proc/$pid/environ"
            echo 'NATIVE_LOGIN_PERSISTENT_CLIENT_SECRET_ENV=false'
          fi
          rm -f "$NATIVE_ROOT/controller.ready" "$NATIVE_ROOT/auth.dispatched" "$NATIVE_ROOT/auth.sock" "$NATIVE_ROOT/native-inject.gdb" "$NATIVE_ROOT/native-observer.gdb"
          echo 'NATIVE_LOGIN_TEMP_SECRET_ARTIFACTS_CLEANED=true'

name: Track A native-login GitHub secret presence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-secret-presence.yml
      - docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md

permissions:
  contents: read

jobs:
  verify-secret-presence:
    name: Verify non-empty native-login secrets without disclosure
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check secret presence and bounded shape only
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          values = {
              'email': os.environ.get('TIBIA_TEST_EMAIL', ''),
              'password': os.environ.get('TIBIA_TEST_PASSWORD', ''),
          }
          present = {k: bool(v) for k, v in values.items()}
          shape = {
              k: bool(v) and 1 <= len(v.encode('utf-8')) <= 1024 and '\x00' not in v
              for k, v in values.items()
          }
          print('NATIVE_LOGIN_SECRET_EMAIL_PRESENT=' + str(present['email']).lower())
          print('NATIVE_LOGIN_SECRET_PASSWORD_PRESENT=' + str(present['password']).lower())
          print('NATIVE_LOGIN_SECRET_EMAIL_SHAPE_VALID=' + str(shape['email']).lower())
          print('NATIVE_LOGIN_SECRET_PASSWORD_SHAPE_VALID=' + str(shape['password']).lower())
          if not (present['email'] and present['password'] and shape['email'] and shape['password']):
              raise SystemExit(3)
          print('NATIVE_LOGIN_SECRET_PAIR_READY=true')
          PY
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD

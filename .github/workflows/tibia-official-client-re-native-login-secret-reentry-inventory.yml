name: Track A native-login secret reentry inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-secret-reentry-inventory.yml
      - docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md

permissions:
  contents: read

concurrency:
  group: track-a-native-login-secret-reentry-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Fresh no-client controller-plane inventory
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Inventory only controller metadata under canonical flock
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py --changed-from "$EVENT_BASE_SHA" --expected-branch "$HEAD_BRANCH"
          python3 - <<'PY'
          import fcntl, json
          from pathlib import Path
          root=Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          lock=root/'coordination.lock'
          lease_path=root/'lease.json'
          reg_path=root/'runtime-registration.json'
          with lock.open('r+b', buffering=0) as h:
              fcntl.flock(h.fileno(), fcntl.LOCK_EX)
              lease=json.loads(lease_path.read_text())
              reg=json.loads(reg_path.read_text())
              checks={
                  'lease.runtime_id': lease.get('runtime_id')=='track-a-canonical-live',
                  'lease.status': lease.get('status')=='released',
                  'lease.generation': lease.get('generation')==10,
                  'lease.controller_task': lease.get('controller_task') is None,
                  'lease.controller_session': lease.get('controller_session') is None,
                  'reg.runtime_id': reg.get('runtime_id')=='track-a-canonical-live',
                  'reg.registration_generation': reg.get('registration_generation')==2,
                  'reg.lease_generation': reg.get('lease_generation')==10,
                  'reg.client_version': reg.get('client_version')=='15.32.df7b29',
                  'reg.client_size': reg.get('client_size')==51965216,
                  'reg.client_sha256': reg.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe',
              }
              bad=[k for k,v in checks.items() if not v]
              if bad:
                  raise SystemExit('NATIVE_LOGIN_SECRET_REENTRY_INVENTORY_DRIFT='+','.join(bad))
              safe={k:reg.get(k) for k in ('schema_version','runtime_id','registration_generation','lease_generation','client_version','client_size','client_sha256','state','remote_view_mapping','source_task','source_run')}
              print('NATIVE_LOGIN_SECRET_REENTRY_LEASE_STATUS=released')
              print('NATIVE_LOGIN_SECRET_REENTRY_LEASE_GENERATION=10')
              print('NATIVE_LOGIN_SECRET_REENTRY_REGISTRATION_GENERATION=2')
              print('NATIVE_LOGIN_SECRET_REENTRY_REGISTRATION_LEASE_GENERATION=10')
              print('NATIVE_LOGIN_SECRET_REENTRY_REGISTRATION='+json.dumps(safe,sort_keys=True,separators=(',',':')))
              print('NATIVE_LOGIN_SECRET_REENTRY_NO_CLIENT_OBSERVATION=true')
              print('NATIVE_LOGIN_SECRET_REENTRY_RESULT=PASS')
          PY

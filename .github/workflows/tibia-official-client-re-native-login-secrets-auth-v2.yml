name: Track A native-login GitHub Secrets auth v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-secrets-auth-v2.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: track-a-native-login-secrets-auth-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auth:
    name: Helper-enable exact client and dispatch GitHub Secrets
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download exact native-auth helper artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-auth-helper-5376592fd7382406b4c97de9813a40841d1b3bfd
          path: ${{ runner.temp }}/native-login-auth-helper-v2
          repository: blakinio/otclient
          run-id: 32129906446
          github-token: ${{ github.token }}

      - name: Replace canonical runtime with helper-enabled exact client
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]

          task='OTC-20260818-native-login-to-ingame-e2e'
          old_session='chatgpt-native-login-e2e-20260818-v3-gen12'
          new_session='chatgpt-native-login-e2e-20260818-v3-gen13-auth'
          root='/home/runner/_work/_otclient_tibia_re_state'
          state="$root/canonical-live-runtime"
          task_runtime="$root/tasks/$task/runtime"
          token="$task_runtime/canonical-lease-token"
          helper_src="$RUNNER_TEMP/native-login-auth-helper-v2/otclient-tibia-native-auth-experimental.so"
          helper="$task_runtime/auth-helper/otclient-tibia-native-auth-experimental.so"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          canonical_worker='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          auth_worker="$RUNNER_TEMP/native-login-auth-worker-v2-${GITHUB_RUN_ID}.sh"
          cleanup="$RUNNER_TEMP/native-login-cleanup-v2-${GITHUB_RUN_ID}.sh"
          acquired13=0
          complete=0

          [[ -f "$helper_src" ]]
          [[ "$(sha256sum "$helper_src" | awk '{print $1}')" == e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777 ]]
          [[ "$(stat -c %s "$helper_src")" == 63728 ]]
          package="$state/session/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          [[ -d "$package/bin/lib" ]]
          compat="$RUNNER_TEMP/native-auth-v2-ldd.txt"
          LD_LIBRARY_PATH="$package/bin/lib" ldd "$helper_src" >"$compat" 2>&1
          ! grep -Eq 'not found|version .* not found' "$compat"
          grep -q 'libQt6Core.so.6' "$compat"
          rm -f "$compat"
          echo 'NATIVE_LOGIN_V2_HELPER_COMPAT=PASS'

          # Re-prove the exact currently registered target immediately before replacement.
          bash "$lease" validate --task-id "$task" --session-id "$old_session" --token-file "$token"
          probe="$RUNNER_TEMP/native-login-v2-probe-${GITHUB_RUN_ID}.sh"
          python3 .github/scripts/tibia-official-client-re-canonical-xres-worker-adapter.py "$canonical_worker" "$probe" \
            --owner-helper .github/scripts/tibia-official-client-re-xres-window-owner.py \
            --wire-helper .github/scripts/tibia-official-client-re-xres-wire.py
          chmod 700 "$probe"
          python3 "$transition" gate-b --task-id "$task" --session-id "$old_session" --token-file "$token" --probe "$probe"
          rm -f "$probe"

          mkdir -p "$(dirname "$helper")"
          chmod 700 "$(dirname "$helper")"
          install -m700 "$helper_src" "$helper.tmp"
          [[ "$(sha256sum "$helper.tmp" | awk '{print $1}')" == e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777 ]]
          mv -f "$helper.tmp" "$helper"

          cat >"$cleanup" <<'EOS'
          #!/usr/bin/env bash
          set +x
          set -Eeuo pipefail
          state='/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime'
          session="$state/session"
          reg="$state/runtime-registration.json"
          python3 - "$reg" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d.get('registration_generation')==4 and d.get('lease_generation')==12
          assert d.get('client_version')=='15.32.df7b29'
          assert d.get('client_size')==51965216
          assert d.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          print('NATIVE_LOGIN_V2_OLD_REGISTRATION=PASS_REG4_12')
          PY
          pgid="$(cat "$session/bootstrap-pgid")"
          [[ "$pgid" =~ ^[1-9][0-9]*$ ]]
          kill -TERM -- "-$pgid" 2>/dev/null || true
          for _ in $(seq 1 80); do
            alive=0
            for role in client xvfb vnc wireproxy; do
              p="$(tr -cd '0-9' <"$session/$role.pid" 2>/dev/null || true)"
              [[ -z "$p" || ! -e "/proc/$p" ]] || alive=1
            done
            [[ "$alive" == 0 ]] && break
            sleep .1
          done
          if [[ "${alive:-0}" != 0 ]]; then kill -KILL -- "-$pgid" 2>/dev/null || true; sleep .5; fi
          for role in client xvfb vnc wireproxy; do
            p="$(tr -cd '0-9' <"$session/$role.pid" 2>/dev/null || true)"
            [[ -z "$p" || ! -e "/proc/$p" ]]
          done
          bash .github/scripts/tibia-official-client-re-canonical-live-session.sh rollback "$pgid"
          python3 - "$reg" "$state" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); state=pathlib.Path(sys.argv[2]); d=json.loads(p.read_text())
          assert d.get('registration_generation')==4 and d.get('lease_generation')==12
          p.unlink(); fd=os.open(state,os.O_RDONLY|getattr(os,'O_DIRECTORY',0)); os.fsync(fd); os.close(fd)
          assert not p.exists(); print('NATIVE_LOGIN_V2_OLD_RUNTIME_REMOVED=PASS')
          PY
          EOS
          chmod 700 "$cleanup"
          bash "$lease" guard-run --task-id "$task" --session-id "$old_session" --token-file "$token" -- "$cleanup"
          rm -f "$cleanup"
          bash "$lease" release --task-id "$task" --session-id "$old_session" --token-file "$token"

          trap 'rc=$?; rm -f "$auth_worker"; if [[ "$complete" != 1 && "$acquired13" == 1 && -f "$token" ]]; then bash "$lease" release --task-id "$task" --session-id "$new_session" --token-file "$token" >/dev/null 2>&1 || true; fi; exit "$rc"' EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$new_session" --token-file "$token" --ttl-seconds 2700
          acquired13=1
          python3 - "$canonical_worker" "$auth_worker" "$helper" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_text(); out=pathlib.Path(sys.argv[2]); helper=sys.argv[3]
          a="RMARK='OTCLIENT_TIBIA_RE_CANONICAL_RUNTIME=1'\n"; assert src.count(a)==1
          src=src.replace(a,a+"AUTH_HELPER='"+helper+"'\n",1)
          old='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" LD_PRELOAD="$preload" \\\n      PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          new='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" OTCLIENT_TIBIA_RE_AUTH_SOCKET="$SESSION/native-auth.sock" \\\n      LD_PRELOAD="$AUTH_HELPER:$preload" PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          assert src.count(old)==1; src=src.replace(old,new,1)
          out.write_text(src); out.chmod(0o700)
          PY
          bash -n "$auth_worker"
          python3 "$transition" bootstrap --task-id "$task" --session-id "$new_session" --token-file "$token" --worker "$auth_worker" --worker-timeout 180
          python3 "$transition" gate-b --task-id "$task" --session-id "$new_session" --token-file "$token" --probe "$auth_worker"

          auth_socket="$state/session/native-auth.sock"
          for _ in $(seq 1 150); do
            [[ -S "$auth_socket" ]] && break
            kill -0 "$(cat "$state/session/client.pid")" 2>/dev/null
            sleep .1
          done
          [[ -S "$auth_socket" && "$(stat -c %a "$auth_socket")" == 600 ]]
          python3 - "$state/runtime-registration.json" "$task_runtime/auth-runtime-identity.json" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d.get('registration_generation')==1 and d.get('lease_generation')==13
          assert d.get('client_version')=='15.32.df7b29' and d.get('client_size')==51965216
          assert d.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          ident={k:d[k] for k in ('boot_id_sha256','pid','process_start_ticks','client_version','client_size','client_sha256')}
          p=pathlib.Path(sys.argv[2]); p.write_text(json.dumps(ident,sort_keys=True,separators=(',',':'))+'\n'); p.chmod(0o600)
          maps=pathlib.Path(f"/proc/{d['pid']}/maps").read_text(errors='replace')
          assert 'otclient-tibia-native-auth-experimental.so' in maps
          env=pathlib.Path(f"/proc/{d['pid']}/environ").read_bytes().split(b'\0')
          assert not any(x.startswith(b'TIBIA_TEST_EMAIL=') or x.startswith(b'TIBIA_TEST_PASSWORD=') for x in env)
          print('NATIVE_LOGIN_V2_HELPER_LOADED=true')
          print('NATIVE_LOGIN_V2_GATE_B=PASS_GEN13_REG1_13')
          PY
          complete=1
          rm -f "$auth_worker"
          trap - EXIT
          echo 'NATIVE_LOGIN_V2_READY_FOR_SECRETS=true'

      - name: Use TIBIA_TEST_EMAIL and TIBIA_TEST_PASSWORD for native auth
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          python3 - <<'PY'
          import ctypes,json,os,pathlib
          from tools.tibia_runtime_bridge.protected_auth_tty import ProtectedSecretBuffer,_harden_secret_process,create_sealed_credential_memfd,load_exact_runtime_identity
          from tools.tibia_runtime_bridge.experimental_auth_client import auth_with_credentials_fd
          _harden_secret_process()
          e=bytearray(os.environb.get(b'TIBIA_TEST_EMAIL',b'')); p=bytearray(os.environb.get(b'TIBIA_TEST_PASSWORD',b''))
          os.environ.pop('TIBIA_TEST_EMAIL',None); os.environ.pop('TIBIA_TEST_PASSWORD',None)
          assert 1<=len(e)<=1024 and 1<=len(p)<=1024 and 0 not in e and 0 not in p
          state=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          task=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime')
          lease=json.loads((state/'lease.json').read_text()); reg=json.loads((state/'runtime-registration.json').read_text())
          assert lease.get('status')=='active' and lease.get('generation')==13 and lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen13-auth'
          assert reg.get('registration_generation')==1 and reg.get('lease_generation')==13
          identity=load_exact_runtime_identity(task/'auth-runtime-identity.json')
          fd=-1
          try:
            with ProtectedSecretBuffer() as eb, ProtectedSecretBuffer() as pb:
              eb.storage[:len(e)]=e; eb.length=len(e); pb.storage[:len(p)]=p; pb.length=len(p)
              ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(e)),0,len(e)); ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(p)),0,len(p))
              fd=create_sealed_credential_memfd(eb,pb)
              r=auth_with_credentials_fd(state/'session/native-auth.sock',fd,timeout=5.0,expected_identity=identity)
            safe={k:r.get(k) for k in ('ok','command','qmeta_method_id','invocation_dispatched') if k in r}
            print('NATIVE_LOGIN_V2_AUTH_RESPONSE='+json.dumps(safe,sort_keys=True,separators=(',',':')))
            assert r.get('ok') is True and r.get('invocation_dispatched') is True
            print('NATIVE_LOGIN_V2_AUTH_DISPATCH=PASS')
          finally:
            if fd>=0: os.close(fd)
            if e: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(e)),0,len(e))
            if p: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(p)),0,len(p))
          PY

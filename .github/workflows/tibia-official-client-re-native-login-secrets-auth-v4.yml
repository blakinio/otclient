name: Track A native-login GitHub Secrets auth v4

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-secrets-auth-v4.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  build-shim:
    name: Build delayed auth-loader shim
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build minimal non-Qt delayed dlopen shim
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/delayed-auth-shim"; mkdir -p "$out"
          cat >"$out/shim.c" <<'C'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <stdlib.h>
          #include <string.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <stdio.h>

          static char helper_path[4096];
          static char trigger_path[4096];
          static char status_path[4096];

          static void write_status(const char *text) {
              int fd = open(status_path, O_WRONLY | O_CREAT | O_TRUNC | O_CLOEXEC, 0600);
              if (fd < 0) return;
              size_t n = strlen(text);
              (void)write(fd, text, n);
              (void)fsync(fd);
              (void)close(fd);
          }

          static void *loader_thread(void *unused) {
              (void)unused;
              for (int i = 0; i < 7200; ++i) {
                  if (access(trigger_path, F_OK) == 0) {
                      void *h = dlopen(helper_path, RTLD_NOW | RTLD_LOCAL);
                      write_status(h ? "PASS\n" : "FAIL\n");
                      return NULL;
                  }
                  usleep(50000);
              }
              write_status("TIMEOUT\n");
              return NULL;
          }

          __attribute__((constructor)) static void delayed_auth_init(void) {
              const char *helper = getenv("OTCLIENT_TIBIA_RE_DELAYED_AUTH_HELPER");
              const char *trigger = getenv("OTCLIENT_TIBIA_RE_DELAYED_AUTH_TRIGGER");
              const char *status = getenv("OTCLIENT_TIBIA_RE_DELAYED_AUTH_STATUS");
              if (!helper || !trigger || !status) return;
              if (helper[0] != '/' || trigger[0] != '/' || status[0] != '/') return;
              if (strlen(helper) >= sizeof(helper_path) || strlen(trigger) >= sizeof(trigger_path) || strlen(status) >= sizeof(status_path)) return;
              memcpy(helper_path, helper, strlen(helper) + 1);
              memcpy(trigger_path, trigger, strlen(trigger) + 1);
              memcpy(status_path, status, strlen(status) + 1);
              pthread_t tid;
              if (pthread_create(&tid, NULL, loader_thread, NULL) == 0) {
                  (void)pthread_detach(tid);
              }
          }
          C
          cc -shared -fPIC -O2 -Wall -Wextra -Werror -pthread -o "$out/otclient-tibia-delayed-auth-loader.so" "$out/shim.c" -ldl
          ! ldd "$out/otclient-tibia-delayed-auth-loader.so" | grep -q 'Qt6'
          sha256sum "$out/otclient-tibia-delayed-auth-loader.so" > "$out/SHA256SUMS"
          echo "NATIVE_LOGIN_V4_SHIM_SHA256=$(awk '{print $1}' "$out/SHA256SUMS")"
          echo "NATIVE_LOGIN_V4_SHIM_SIZE=$(stat -c %s "$out/otclient-tibia-delayed-auth-loader.so")"
          echo 'NATIVE_LOGIN_V4_SHIM_BUILD=PASS'
      - name: Upload delayed loader shim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-login-delayed-auth-shim-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/delayed-auth-shim/otclient-tibia-delayed-auth-loader.so
            ${{ runner.temp }}/delayed-auth-shim/SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  auth:
    name: Canonical client then delayed helper then Secrets
    needs: build-shim
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download exact native-auth helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-auth-helper-5376592fd7382406b4c97de9813a40841d1b3bfd
          path: ${{ runner.temp }}/native-login-auth-helper-v4
          repository: blakinio/otclient
          run-id: 32129906446
          github-token: ${{ github.token }}
      - name: Download delayed loader shim
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-delayed-auth-shim-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/native-login-delayed-auth-shim-v4

      - name: Bootstrap canonical runtime and load auth helper after Gate B
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]

          task='OTC-20260818-native-login-to-ingame-e2e'
          session='chatgpt-native-login-e2e-20260818-v3-gen15-auth'
          root='/home/runner/_work/_otclient_tibia_re_state'
          state="$root/canonical-live-runtime"
          task_runtime="$root/tasks/$task/runtime"
          token="$task_runtime/canonical-lease-token"
          helper_src="$RUNNER_TEMP/native-login-auth-helper-v4/otclient-tibia-native-auth-experimental.so"
          shim_src="$RUNNER_TEMP/native-login-delayed-auth-shim-v4/otclient-tibia-delayed-auth-loader.so"
          helper="$task_runtime/auth-helper/otclient-tibia-native-auth-experimental.so"
          shim="$task_runtime/auth-helper/otclient-tibia-delayed-auth-loader.so"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          canonical_worker='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          worker="$RUNNER_TEMP/native-login-auth-worker-v4-${GITHUB_RUN_ID}.sh"
          acquired=0; ready=0
          mkdir -p "$task_runtime/auth-helper"; chmod 700 "$task_runtime/auth-helper"

          [[ -f "$helper_src" && "$(stat -c %s "$helper_src")" == 63728 ]]
          [[ "$(sha256sum "$helper_src" | awk '{print $1}')" == e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777 ]]
          [[ -f "$shim_src" ]]
          (cd "$(dirname "$shim_src")" && sha256sum -c SHA256SUMS)
          install -m700 "$helper_src" "$helper"
          install -m700 "$shim_src" "$shim"

          python3 - "$state/lease.json" "$state/runtime-registration.json" "$state/session" <<'PY'
          import json,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert lease.get('status')=='released' and lease.get('generation')==14
          assert lease.get('controller_task') is None and lease.get('controller_session') is None
          assert not pathlib.Path(sys.argv[2]).exists()
          assert not pathlib.Path(sys.argv[3]).exists()
          print('NATIVE_LOGIN_V4_PRECHECK=RELEASED_GEN14_NO_RUNTIME')
          PY

          trap 'rc=$?; rm -f "$worker"; if [[ "$ready" != 1 && "$acquired" == 1 && -f "$token" ]]; then bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true; fi; exit "$rc"' EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$session" --token-file "$token" --ttl-seconds 2700
          acquired=1

          python3 - "$canonical_worker" "$worker" "$helper" "$shim" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_text(); out=pathlib.Path(sys.argv[2]); helper=sys.argv[3]; shim=sys.argv[4]
          a="RMARK='OTCLIENT_TIBIA_RE_CANONICAL_RUNTIME=1'\n"; assert src.count(a)==1
          src=src.replace(a,a+"AUTH_HELPER='"+helper+"'\nAUTH_SHIM='"+shim+"'\n",1)
          old='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" LD_PRELOAD="$preload" \\\n      PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          new='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" OTCLIENT_TIBIA_RE_AUTH_SOCKET="$SESSION/native-auth.sock" \\\n      OTCLIENT_TIBIA_RE_DELAYED_AUTH_HELPER="$AUTH_HELPER" OTCLIENT_TIBIA_RE_DELAYED_AUTH_TRIGGER="$SESSION/native-auth.trigger" \\\n      OTCLIENT_TIBIA_RE_DELAYED_AUTH_STATUS="$SESSION/native-auth.status" LD_PRELOAD="$preload:$AUTH_SHIM" \\\n      PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          assert src.count(old)==1; src=src.replace(old,new,1)
          out.write_text(src); out.chmod(0o700)
          PY
          bash -n "$worker"
          python3 "$transition" bootstrap --task-id "$task" --session-id "$session" --token-file "$token" --worker "$worker" --worker-timeout 180
          python3 "$transition" gate-b --task-id "$task" --session-id "$session" --token-file "$token" --probe "$worker"

          auth_socket="$state/session/native-auth.sock"
          trigger="$state/session/native-auth.trigger"
          status="$state/session/native-auth.status"
          pid="$(cat "$state/session/client.pid")"
          grep -F "$shim" "/proc/$pid/maps" >/dev/null
          ! grep -F "$helper" "/proc/$pid/maps" >/dev/null
          [[ ! -S "$auth_socket" ]]
          python3 - "$state/runtime-registration.json" "$task_runtime/auth-runtime-identity.json" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d.get('registration_generation')==1 and d.get('lease_generation')==15
          assert d.get('client_version')=='15.32.df7b29' and d.get('client_size')==51965216
          assert d.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          env=pathlib.Path(f"/proc/{d['pid']}/environ").read_bytes().split(b'\0')
          assert not any(x.startswith(b'TIBIA_TEST_EMAIL=') or x.startswith(b'TIBIA_TEST_PASSWORD=') for x in env)
          ident={k:d[k] for k in ('boot_id_sha256','pid','process_start_ticks','client_version','client_size','client_sha256')}
          p=pathlib.Path(sys.argv[2]); p.write_text(json.dumps(ident,sort_keys=True,separators=(',',':'))+'\n'); p.chmod(0o600)
          print('NATIVE_LOGIN_V4_CANONICAL_GATE_B=PASS_GEN15_REG1_15')
          PY

          : > "$trigger"; chmod 600 "$trigger"
          for _ in $(seq 1 200); do
            if [[ -f "$status" ]]; then break; fi
            kill -0 "$pid"; sleep .1
          done
          [[ -f "$status" && "$(tr -d '\r\n' < "$status")" == PASS ]]
          for _ in $(seq 1 200); do
            [[ -S "$auth_socket" ]] && break
            kill -0 "$pid"; sleep .1
          done
          [[ -S "$auth_socket" && "$(stat -c %a "$auth_socket")" == 600 ]]
          grep -F "$helper" "/proc/$pid/maps" >/dev/null
          echo 'NATIVE_LOGIN_V4_DELAYED_HELPER_LOAD=PASS'
          ready=1; rm -f "$worker"; trap - EXIT

      - name: Use exact GitHub Secrets for native account auth
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          python3 - <<'PY'
          import ctypes,json,os,pathlib,struct,time
          from tools.tibia_runtime_bridge.protected_auth_tty import ProtectedSecretBuffer,_harden_secret_process,create_sealed_credential_memfd,load_exact_runtime_identity
          from tools.tibia_runtime_bridge.experimental_auth_client import auth_with_credentials_fd
          _harden_secret_process()
          e=bytearray(os.environb.get(b'TIBIA_TEST_EMAIL',b'')); p=bytearray(os.environb.get(b'TIBIA_TEST_PASSWORD',b''))
          os.environ.pop('TIBIA_TEST_EMAIL',None); os.environ.pop('TIBIA_TEST_PASSWORD',None)
          assert 1<=len(e)<=1024 and 1<=len(p)<=1024 and 0 not in e and 0 not in p
          state=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          task=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime')
          lease=json.loads((state/'lease.json').read_text()); reg=json.loads((state/'runtime-registration.json').read_text())
          assert lease.get('status')=='active' and lease.get('generation')==15 and lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen15-auth'
          assert reg.get('registration_generation')==1 and reg.get('lease_generation')==15
          identity=load_exact_runtime_identity(task/'auth-runtime-identity.json')
          fd=-1
          try:
            with ProtectedSecretBuffer() as eb, ProtectedSecretBuffer() as pb:
              eb.storage[:len(e)]=e; eb.length=len(e); pb.storage[:len(p)]=p; pb.length=len(p)
              ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(e)),0,len(e)); ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(p)),0,len(p))
              fd=create_sealed_credential_memfd(eb,pb)
              r=auth_with_credentials_fd(state/'session/native-auth.sock',fd,timeout=5.0,expected_identity=identity)
            safe={k:r.get(k) for k in ('ok','command','qmeta_method_id','invocation_dispatched') if k in r}
            print('NATIVE_LOGIN_V4_AUTH_RESPONSE='+json.dumps(safe,sort_keys=True,separators=(',',':')))
            assert r.get('ok') is True and r.get('invocation_dispatched') is True
            print('NATIVE_LOGIN_V4_SECRETS_USED=true')
            print('NATIVE_LOGIN_V4_AUTH_DISPATCH=PASS')
          finally:
            if fd>=0: os.close(fd)
            if e: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(e)),0,len(e))
            if p: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(p)),0,len(p))

          # Wait for the legitimate auth state machine to populate the current native character model.
          pid=int(reg['pid']); exe=os.path.realpath(f'/proc/{pid}/exe')
          base=None
          for line in pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace').splitlines():
              parts=line.split(maxsplit=5)
              if len(parts)>=6 and parts[5]==exe:
                  lo=int(parts[0].split('-')[0],16); off=int(parts[2],16); base=lo-off; break
          assert base is not None
          target=base+0x308ed68; needle=struct.pack('<Q',target)
          deadline=time.monotonic()+60
          last_count=-1
          while time.monotonic()<deadline:
              hits=[]
              maps=pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace').splitlines()
              mfd=os.open(f'/proc/{pid}/mem',os.O_RDONLY)
              try:
                  for line in maps:
                      q=line.split(maxsplit=5)
                      if len(q)<2 or not q[1].startswith('rw') or 'p' not in q[1]: continue
                      lo,hi=(int(x,16) for x in q[0].split('-'))
                      if hi<=lo or hi-lo>(512<<20): continue
                      cur=lo
                      while cur<hi:
                          n=min(1<<20,hi-cur)
                          try: data=os.pread(mfd,n,cur)
                          except OSError: break
                          pos=0
                          while True:
                              j=data.find(needle,pos)
                              if j<0: break
                              a=cur+j
                              if a%8==0: hits.append(a)
                              pos=j+1
                          cur+=n
                  hits=sorted(set(hits))
                  if len(hits)==1:
                      obj=hits[0]
                      raw=os.pread(mfd,16,obj+0x100)
                      if len(raw)==16:
                          first,count=struct.unpack('<Qq',raw)
                          last_count=count
                          if count>0 and first!=0:
                              print('NATIVE_LOGIN_V4_ACCOUNT_AUTH=PASS')
                              print('NATIVE_LOGIN_V4_NATIVE_CHARACTER_LIST_COUNT='+str(count))
                              raise SystemExit(0)
              finally: os.close(mfd)
              time.sleep(.5)
          print('NATIVE_LOGIN_V4_ACCOUNT_AUTH=NOT_PROVEN')
          print('NATIVE_LOGIN_V4_NATIVE_CHARACTER_LIST_COUNT='+str(last_count))
          raise SystemExit(47)
          PY

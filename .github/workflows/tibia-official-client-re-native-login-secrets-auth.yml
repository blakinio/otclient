name: Track A native-login GitHub Secrets auth

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-secrets-auth.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: track-a-native-login-secrets-auth-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auth:
    name: Replace canonical runtime and dispatch native auth from Secrets
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download exact native-auth helper artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-auth-helper-5376592fd7382406b4c97de9813a40841d1b3bfd
          path: ${{ runner.temp }}/native-login-auth-helper
          repository: blakinio/otclient
          run-id: 32129906446
          github-token: ${{ github.token }}

      - name: Replace runtime with helper-enabled exact client and prove Gate B
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]

          task='OTC-20260818-native-login-to-ingame-e2e'
          old_session='chatgpt-native-login-e2e-20260818-v3-gen12'
          new_session='chatgpt-native-login-e2e-20260818-v3-gen13-auth'
          base='/home/runner/_work/_otclient_tibia_re_state'
          state="$base/canonical-live-runtime"
          task_runtime="$base/tasks/$task/runtime"
          token="$task_runtime/canonical-lease-token"
          helper_src="$RUNNER_TEMP/native-login-auth-helper/otclient-tibia-native-auth-experimental.so"
          helper_sums="$RUNNER_TEMP/native-login-auth-helper/SHA256SUMS"
          helper_root="$task_runtime/auth-helper"
          helper="$helper_root/otclient-tibia-native-auth-experimental.so"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          canonical_worker='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          auth_worker="$RUNNER_TEMP/native-login-auth-worker-${GITHUB_RUN_ID}.sh"
          cleanup="$RUNNER_TEMP/native-login-old-runtime-cleanup-${GITHUB_RUN_ID}.sh"
          success=0
          acquired13=0

          [[ -f "$helper_src" && -f "$helper_sums" ]]
          (cd "$(dirname "$helper_src")" && sha256sum -c SHA256SUMS)
          [[ "$(sha256sum "$helper_src" | awk '{print $1}')" == e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777 ]]
          [[ "$(stat -c %s "$helper_src")" == 63728 ]]
          file "$helper_src" | grep -q 'ELF 64-bit LSB shared object'

          # Check the hosted helper against the currently installed exact client's bundled Qt/glibc view before teardown.
          package="$state/session/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          [[ -d "$package/bin/lib" ]]
          compat="$RUNNER_TEMP/native-login-auth-ldd-${GITHUB_RUN_ID}.txt"
          LD_LIBRARY_PATH="$package/bin/lib" ldd "$helper_src" >"$compat" 2>&1
          ! grep -Eq 'not found|version .* not found' "$compat"
          grep -q 'libQt6Core.so.6' "$compat"
          rm -f "$compat"
          echo 'NATIVE_LOGIN_AUTH_HELPER_COMPAT=PASS'

          bash "$lease" validate --task-id "$task" --session-id "$old_session" --token-file "$token"
          python3 - "$state/lease.json" "$state/runtime-registration.json" <<'PY'
          import json,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text())
          reg=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lease.get('status')=='active' and lease.get('generation')==12
          assert lease.get('controller_task')=='OTC-20260818-native-login-to-ingame-e2e'
          assert lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen12'
          assert reg.get('registration_generation')==4 and reg.get('lease_generation')==12
          assert reg.get('client_version')=='15.32.df7b29'
          assert reg.get('client_size')==51965216
          assert reg.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          print('NATIVE_LOGIN_PRE_REPLACE=ACTIVE_GEN12_REG4_12')
          PY

          mkdir -p "$helper_root"
          chmod 700 "$helper_root"
          install -m700 "$helper_src" "$helper.tmp"
          [[ "$(sha256sum "$helper.tmp" | awk '{print $1}')" == e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777 ]]
          mv -f "$helper.tmp" "$helper"

          cat >"$cleanup" <<'EOS'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          set +x
          state='/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime'
          session="$state/session"
          reg="$state/runtime-registration.json"
          canonical_worker='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          python3 - "$reg" "$session" <<'PY'
          import hashlib,json,os,pathlib,sys
          regp=pathlib.Path(sys.argv[1]); session=pathlib.Path(sys.argv[2])
          d=json.loads(regp.read_text())
          assert d['registration_generation']==4 and d['lease_generation']==12
          assert d['client_version']=='15.32.df7b29' and d['client_size']==51965216
          assert d['client_sha256']=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          pid=int(d['pid']); assert pid>=2
          raw=pathlib.Path(f'/proc/{pid}/stat').read_text(); close=raw.rfind(')'); fields=raw[close+2:].split()
          assert int(fields[19])==int(d['process_start_ticks'])
          exe=pathlib.Path(os.readlink(f'/proc/{pid}/exe'))
          assert exe.stat().st_size==51965216
          h=hashlib.sha256()
          with exe.open('rb',buffering=0) as f:
              for b in iter(lambda:f.read(1<<20),b''):h.update(b)
          assert h.hexdigest()==d['client_sha256']
          pgid=int((session/'bootstrap-pgid').read_text().strip()); assert pgid>=2
          for role in ('client','xvfb','vnc','wireproxy'):
              rp=session/f'{role}.pid'; p=int(rp.read_text().strip()); assert p>=2
              stat=pathlib.Path(f'/proc/{p}/stat').read_text(); c=stat.rfind(')'); ff=stat[c+2:].split(); assert int(ff[2])==pgid
              env=pathlib.Path(f'/proc/{p}/environ').read_bytes().split(b'\0')
              assert b'OTCLIENT_TIBIA_RE_TRACK=official-client-re' in env
              assert b'OTCLIENT_TIBIA_RE_CANONICAL_RUNTIME=1' in env
              assert f'OTCLIENT_TIBIA_RE_ROLE={role}'.encode() in env
              assert not any(x.startswith(b'TIBIA_TEST_EMAIL=') or x.startswith(b'TIBIA_TEST_PASSWORD=') for x in env)
          print('NATIVE_LOGIN_OLD_RUNTIME_OWNERSHIP=PASS')
          print('NATIVE_LOGIN_OLD_RUNTIME_PGID='+str(pgid))
          PY
          pgid="$(cat "$session/bootstrap-pgid")"
          kill -TERM -- "-$pgid" 2>/dev/null || true
          alive=1
          for _ in $(seq 1 80); do
            alive=0
            for role in client xvfb vnc wireproxy; do
              p="$(tr -cd '0-9' <"$session/$role.pid" 2>/dev/null || true)"
              [[ -z "$p" || ! -e "/proc/$p" ]] || alive=1
            done
            [[ "$alive" == 0 ]] && break
            sleep .1
          done
          if [[ "$alive" != 0 ]]; then
            kill -KILL -- "-$pgid" 2>/dev/null || true
            sleep .5
          fi
          for role in client xvfb vnc wireproxy; do
            p="$(tr -cd '0-9' <"$session/$role.pid" 2>/dev/null || true)"
            [[ -z "$p" || ! -e "/proc/$p" ]]
          done
          bash "$canonical_worker" rollback "$pgid"
          python3 - "$reg" "$state" <<'PY'
          import json,os,pathlib,sys
          reg=pathlib.Path(sys.argv[1]); state=pathlib.Path(sys.argv[2]); d=json.loads(reg.read_text())
          assert d['registration_generation']==4 and d['lease_generation']==12
          reg.unlink()
          fd=os.open(state, os.O_RDONLY|getattr(os,'O_DIRECTORY',0))
          try: os.fsync(fd)
          finally: os.close(fd)
          assert not reg.exists()
          print('NATIVE_LOGIN_OLD_REGISTRATION_REMOVED=true')
          PY
          echo 'NATIVE_LOGIN_OLD_RUNTIME_STOPPED=true'
          EOS
          chmod 700 "$cleanup"

          # Serialize the destructive replacement under the current generation-12 capability.
          bash "$lease" guard-run --task-id "$task" --session-id "$old_session" --token-file "$token" -- "$cleanup"
          rm -f "$cleanup"
          bash "$lease" release --task-id "$task" --session-id "$old_session" --token-file "$token"

          trap 'rc=$?; rm -f "$auth_worker"; if [[ "$success" != 1 && "$acquired13" == 1 && -f "$token" ]]; then bash "$lease" release --task-id "$task" --session-id "$new_session" --token-file "$token" >/dev/null 2>&1 || true; fi; exit "$rc"' EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$new_session" --token-file "$token" --ttl-seconds 2700
          acquired13=1
          python3 - "$state/lease.json" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d.get('status')=='active' and d.get('generation')==13
          assert d.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen13-auth'
          print('NATIVE_LOGIN_GEN13_ACQUIRE=PASS')
          PY

          python3 - "$canonical_worker" "$auth_worker" "$helper" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_text(); out=pathlib.Path(sys.argv[2]); helper=sys.argv[3]
          anchor='RMARK=\'OTCLIENT_TIBIA_RE_CANONICAL_RUNTIME=1\'\n'
          assert src.count(anchor)==1
          src=src.replace(anchor, anchor+"AUTH_HELPER='"+helper.replace("'","'\\''")+"'\n",1)
          old='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" LD_PRELOAD="$preload" \\\n      PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          new='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" OTCLIENT_TIBIA_RE_AUTH_SOCKET="$SESSION/native-auth.sock" \\\n      LD_PRELOAD="$AUTH_HELPER:$preload" PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          assert src.count(old)==1
          src=src.replace(old,new,1)
          out.write_text(src); out.chmod(0o700)
          print('NATIVE_LOGIN_AUTH_WORKER_PATCH=PASS')
          PY
          bash -n "$auth_worker"

          python3 "$transition" bootstrap --task-id "$task" --session-id "$new_session" --token-file "$token" --worker "$auth_worker" --worker-timeout 180
          python3 "$transition" gate-b --task-id "$task" --session-id "$new_session" --token-file "$token" --probe "$auth_worker"

          auth_socket="$state/session/native-auth.sock"
          for _ in $(seq 1 120); do
            [[ -S "$auth_socket" ]] && break
            pid="$(cat "$state/session/client.pid")"
            kill -0 "$pid" 2>/dev/null
            sleep .1
          done
          [[ -S "$auth_socket" ]]
          [[ "$(stat -c %a "$auth_socket")" == 600 ]]
          [[ "$(stat -c %u "$auth_socket")" == "$(id -u)" ]]
          python3 - "$state/runtime-registration.json" "$state" <<'PY'
          import json,os,pathlib,struct,sys
          regp=pathlib.Path(sys.argv[1]); state=pathlib.Path(sys.argv[2]); d=json.loads(regp.read_text())
          assert d['registration_generation']==1 and d['lease_generation']==13
          assert d['client_version']=='15.32.df7b29' and d['client_size']==51965216
          assert d['client_sha256']=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          pid=int(d['pid']); exe=os.path.realpath(f'/proc/{pid}/exe')
          # Prove helper is loaded and account secrets are absent from the persistent client environment.
          maps=pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace')
          assert 'otclient-tibia-native-auth-experimental.so' in maps
          env=pathlib.Path(f'/proc/{pid}/environ').read_bytes().split(b'\0')
          assert not any(x.startswith(b'TIBIA_TEST_EMAIL=') or x.startswith(b'TIBIA_TEST_PASSWORD=') for x in env)
          assert any(x.startswith(b'OTCLIENT_TIBIA_RE_AUTH_SOCKET=') for x in env)
          # Resolve PIE base and the unique current TCharacterSelectionController before auth.
          base=None; regions=[]
          for line in pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace').splitlines():
              p=line.split(maxsplit=5)
              if len(p)<5: continue
              lo,hi=(int(x,16) for x in p[0].split('-')); perms=p[1]; off=int(p[2],16); path=p[5] if len(p)>5 else ''
              if path==exe and base is None: base=lo-off
              if perms.startswith('rw') and 'p' in perms and hi>lo and hi-lo <= (512<<20): regions.append((lo,hi))
          assert base is not None
          needle=struct.pack('<Q',base+0x308ed68); hits=[]
          fd=os.open(f'/proc/{pid}/mem',os.O_RDONLY)
          try:
              for lo,hi in regions:
                  cur=lo
                  while cur<hi:
                      want=min(1<<20,hi-cur)
                      try: data=os.pread(fd,want,cur)
                      except OSError: raise AssertionError('preauth proc mem read failed')
                      if len(data)!=want: raise AssertionError('preauth proc mem short read')
                      pos=0
                      while True:
                          j=data.find(needle,pos)
                          if j<0: break
                          a=cur+j
                          if a%8==0: hits.append(a)
                          pos=j+1
                      cur+=want
          finally: os.close(fd)
          hits=sorted(set(hits)); assert len(hits)==1
          charsel=hits[0]
          fd=os.open(f'/proc/{pid}/mem',os.O_RDONLY)
          try:
              count=struct.unpack('<q',os.pread(fd,8,charsel+0x108))[0]
          finally: os.close(fd)
          assert count==0
          ident={k:d[k] for k in ('boot_id_sha256','pid','process_start_ticks','client_version','client_size','client_sha256')}
          identity=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime/auth-runtime-identity.json')
          identity.write_text(json.dumps(ident,sort_keys=True,separators=(',',':'))+'\n'); identity.chmod(0o600)
          addr=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime/charsel-address')
          addr.write_text(hex(charsel)+'\n'); addr.chmod(0o600)
          print('NATIVE_LOGIN_HELPER_LOADED=true')
          print('NATIVE_LOGIN_AUTH_SOCKET_READY=true')
          print('NATIVE_LOGIN_PREAUTH_CHARACTER_COUNT=0')
          print('NATIVE_LOGIN_GEN13_GATE_B=PASS')
          PY
          success=1
          rm -f "$auth_worker"
          trap - EXIT
          echo 'NATIVE_LOGIN_READY_FOR_SECRET_DISPATCH=true'

      - name: Dispatch native account login from GitHub Secrets
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          python3 - <<'PY'
          import ctypes,json,os,pathlib,struct,time
          from tools.tibia_runtime_bridge.protected_auth_tty import (
              ProtectedSecretBuffer,
              _harden_secret_process,
              create_sealed_credential_memfd,
              load_exact_runtime_identity,
          )
          from tools.tibia_runtime_bridge.experimental_auth_client import auth_with_credentials_fd

          _harden_secret_process()
          eraw=bytearray(os.environb.get(b'TIBIA_TEST_EMAIL',b''))
          praw=bytearray(os.environb.get(b'TIBIA_TEST_PASSWORD',b''))
          os.environ.pop('TIBIA_TEST_EMAIL',None); os.environ.pop('TIBIA_TEST_PASSWORD',None)
          if not (1 <= len(eraw) <= 1024 and 1 <= len(praw) <= 1024):
              raise SystemExit('NATIVE_LOGIN_SECRET_SHAPE_INVALID')
          if 0 in eraw or 0 in praw:
              raise SystemExit('NATIVE_LOGIN_SECRET_NUL_FORBIDDEN')

          state=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          task=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime')
          lease=json.loads((state/'lease.json').read_text()); reg=json.loads((state/'runtime-registration.json').read_text())
          assert lease.get('status')=='active' and lease.get('generation')==13
          assert lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen13-auth'
          assert reg.get('registration_generation')==1 and reg.get('lease_generation')==13
          pid=int(reg['pid']); charsel=int((task/'charsel-address').read_text().strip(),16)
          socket_path=state/'session/native-auth.sock'; identity_path=task/'auth-runtime-identity.json'
          assert socket_path.is_socket()
          expectation=load_exact_runtime_identity(identity_path)

          fd=-1
          try:
              with ProtectedSecretBuffer() as email, ProtectedSecretBuffer() as password:
                  email.storage[:len(eraw)]=eraw; email.length=len(eraw)
                  password.storage[:len(praw)]=praw; password.length=len(praw)
                  ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(eraw)),0,len(eraw))
                  ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(praw)),0,len(praw))
                  fd=create_sealed_credential_memfd(email,password)
                  response=auth_with_credentials_fd(socket_path,fd,timeout=5.0,expected_identity=expectation)
              safe={k:response.get(k) for k in ('ok','command','qmeta_method_id','invocation_dispatched') if k in response}
              print('NATIVE_LOGIN_AUTH_RESPONSE='+json.dumps(safe,sort_keys=True,separators=(',',':')))
              if response.get('ok') is not True or response.get('invocation_dispatched') is not True:
                  raise SystemExit('NATIVE_LOGIN_AUTH_DISPATCH_FAILED')
          finally:
              if fd>=0:
                  os.close(fd)
              if eraw:
                  ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(eraw)),0,len(eraw))
              if praw:
                  ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(praw)),0,len(praw))

          print('NATIVE_LOGIN_AUTH_DISPATCH=PASS')
          # Account-auth success is proven only by the current native character model becoming populated.
          deadline=time.monotonic()+45.0
          last=-1
          while time.monotonic()<deadline:
              if not pathlib.Path(f'/proc/{pid}').exists():
                  raise SystemExit('NATIVE_LOGIN_CLIENT_EXITED_AFTER_AUTH')
              try:
                  mem=os.open(f'/proc/{pid}/mem',os.O_RDONLY)
                  try:
                      vptr=struct.unpack('<Q',os.pread(mem,8,charsel))[0]
                      count=struct.unpack('<q',os.pread(mem,8,charsel+0x108))[0]
                      first=struct.unpack('<Q',os.pread(mem,8,charsel+0x100))[0]
                  finally: os.close(mem)
              except OSError:
                  count=-1; first=0; vptr=0
              last=count
              if count>0 and first!=0:
                  print('NATIVE_LOGIN_ACCOUNT_AUTH=PASS')
                  print('NATIVE_LOGIN_NATIVE_CHARACTER_LIST_COUNT='+str(count))
                  print('NATIVE_LOGIN_CHARACTER_MODEL_POPULATED=true')
                  raise SystemExit(0)
              time.sleep(.25)
          print('NATIVE_LOGIN_ACCOUNT_AUTH=NOT_PROVEN')
          print('NATIVE_LOGIN_NATIVE_CHARACTER_LIST_COUNT='+str(last))
          raise SystemExit(47)
          PY

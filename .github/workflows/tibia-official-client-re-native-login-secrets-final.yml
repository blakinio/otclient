name: Track A native-login Secrets final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-secrets-final.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  auth:
    name: Active gen15 Gate B, runtime helper injection, GitHub Secrets auth
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download exact native-auth helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-auth-helper-5376592fd7382406b4c97de9813a40841d1b3bfd
          path: ${{ runner.temp }}/native-login-auth-helper-final
          repository: blakinio/otclient
          run-id: 32129906446
          github-token: ${{ github.token }}

      - name: Re-prove active generation 15 and inject one-shot native-auth helper
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py --changed-from "$EVENT_BASE_SHA" --expected-branch "$HEAD_BRANCH"

          task='OTC-20260818-native-login-to-ingame-e2e'
          session='chatgpt-native-login-e2e-20260818-v3-gen15'
          root='/home/runner/_work/_otclient_tibia_re_state'
          state="$root/canonical-live-runtime"
          task_runtime="$root/tasks/$task/runtime"
          token="$task_runtime/canonical-lease-token"
          helper_src="$RUNNER_TEMP/native-login-auth-helper-final/otclient-tibia-native-auth-experimental.so"
          helper="$task_runtime/auth-helper/otclient-tibia-native-auth-experimental.so"
          identity="$task_runtime/auth-runtime-identity.json"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          canonical_worker='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          probe="$RUNNER_TEMP/native-login-gen15-probe-${GITHUB_RUN_ID}.sh"
          inject="$RUNNER_TEMP/native-login-gen15-inject-${GITHUB_RUN_ID}.sh"
          gcmd="$RUNNER_TEMP/native-login-gen15-inject-${GITHUB_RUN_ID}.gdb"
          trap 'rm -f "$probe" "$inject" "$gcmd"' EXIT

          [[ -f "$helper_src" && "$(stat -c %s "$helper_src")" == 63728 ]]
          [[ "$(sha256sum "$helper_src" | awk '{print $1}')" == e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777 ]]
          [[ -f "$token" && "$(stat -c %a "$token")" == 600 ]]
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          bash "$lease" renew --task-id "$task" --session-id "$session" --token-file "$token" --ttl-seconds 2700
          python3 .github/scripts/tibia-official-client-re-canonical-xres-worker-adapter.py "$canonical_worker" "$probe" \
            --owner-helper .github/scripts/tibia-official-client-re-xres-window-owner.py \
            --wire-helper .github/scripts/tibia-official-client-re-xres-wire.py
          chmod 700 "$probe"
          python3 "$transition" gate-b --task-id "$task" --session-id "$session" --token-file "$token" --probe "$probe"

          mkdir -p "$task_runtime/auth-helper"
          chmod 700 "$task_runtime" "$task_runtime/auth-helper"
          install -m700 "$helper_src" "$helper.tmp"
          [[ "$(sha256sum "$helper.tmp" | awk '{print $1}')" == e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777 ]]
          mv -f "$helper.tmp" "$helper"

          python3 - "$state/lease.json" "$state/runtime-registration.json" "$identity" <<'PY'
          import hashlib,json,os,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text())
          reg=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lease.get('status')=='active' and lease.get('generation')==15
          assert lease.get('controller_task')=='OTC-20260818-native-login-to-ingame-e2e'
          assert lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen15'
          assert reg.get('registration_generation')==1 and reg.get('lease_generation')==15
          assert reg.get('client_version')=='15.32.df7b29' and reg.get('client_size')==51965216
          assert reg.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          pid=int(reg['pid']); assert pid>=2
          stat=pathlib.Path(f'/proc/{pid}/stat').read_text(); c=stat.rfind(')'); fields=stat[c+2:].split()
          assert int(fields[19])==int(reg['process_start_ticks'])
          exe=pathlib.Path(os.path.realpath(f'/proc/{pid}/exe'))
          assert exe.stat().st_size==51965216
          h=hashlib.sha256()
          with exe.open('rb',buffering=0) as f:
              for b in iter(lambda:f.read(1<<20),b''): h.update(b)
          assert h.hexdigest()==reg['client_sha256']
          env=pathlib.Path(f'/proc/{pid}/environ').read_bytes().split(b'\0')
          assert not any(x.startswith(b'TIBIA_TEST_EMAIL=') or x.startswith(b'TIBIA_TEST_PASSWORD=') for x in env)
          ident={k:reg[k] for k in ('boot_id_sha256','pid','process_start_ticks','client_version','client_size','client_sha256')}
          p=pathlib.Path(sys.argv[3]); p.write_text(json.dumps(ident,sort_keys=True,separators=(',',':'))+'\n'); p.chmod(0o600)
          print('NATIVE_LOGIN_ACTIVE_GEN15=PASS_REG1_15_GATE_B')
          print('NATIVE_LOGIN_ACTIVE_PID='+str(pid))
          PY

          pid="$(python3 -c 'import json;print(json.load(open("/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime/runtime-registration.json"))["pid"])')"
          auth_socket="$state/session/native-auth.sock"
          rm -f "$auth_socket"
          ! grep -F "$helper" "/proc/$pid/maps" >/dev/null
          [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$pid/status")" == 0 ]]
          tool="$(cat "$state/session/toolroot")"
          gdb="$tool/usr/bin/gdb"
          [[ -x "$gdb" ]]

          python3 - "$gcmd" "$pid" "$auth_socket" "$helper" <<'PY'
          import sys
          out,pid,sock,helper=sys.argv[1:]
          def q(s): return s.replace('\\','\\\\').replace('"','\\"')
          open(out,'w').write(
              'set pagination off\nset confirm off\n'
              f'attach {pid}\n'
              f'set $s = (int)setenv("OTCLIENT_TIBIA_RE_AUTH_SOCKET","{q(sock)}",1)\n'
              'printf "NATIVE_LOGIN_INJECT_SETENV_RC=%d\\n", $s\n'
              'if $s != 0\nquit 43\nend\n'
              f'set $h = (void*)dlopen("{q(helper)}",2)\n'
              'printf "NATIVE_LOGIN_INJECT_DLOPEN=%p\\n", $h\n'
              'if $h == 0\nquit 44\nend\n'
              'detach\nquit\n')
          PY
          chmod 600 "$gcmd"
          cat >"$inject" <<'EOS'
          #!/usr/bin/env bash
          set +x
          set -Eeuo pipefail
          env -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD "$GDB" -q -nx -batch -x "$GCMD" >"$GLOG" 2>&1
          EOS
          chmod 700 "$inject"
          GDB="$gdb" GCMD="$gcmd" GLOG="$RUNNER_TEMP/native-login-gen15-inject.log" \
            bash "$lease" guard-run --task-id "$task" --session-id "$session" --token-file "$token" -- "$inject"
          grep -Fq 'NATIVE_LOGIN_INJECT_SETENV_RC=0' "$RUNNER_TEMP/native-login-gen15-inject.log"
          grep -Eq 'NATIVE_LOGIN_INJECT_DLOPEN=0x[1-9a-fA-F][0-9a-fA-F]*' "$RUNNER_TEMP/native-login-gen15-inject.log"
          kill -0 "$pid"
          [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$pid/status")" == 0 ]]
          grep -F "$helper" "/proc/$pid/maps" >/dev/null
          for _ in $(seq 1 150); do
            [[ -S "$auth_socket" ]] && break
            kill -0 "$pid"; sleep .1
          done
          [[ -S "$auth_socket" ]]
          [[ "$(stat -c %a "$auth_socket")" == 600 ]]
          [[ "$(stat -c %u "$auth_socket")" == "$(id -u)" ]]
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          echo 'NATIVE_LOGIN_RUNTIME_HELPER_INJECTION=PASS'
          rm -f "$probe" "$inject" "$gcmd"
          trap - EXIT

      - name: Use TIBIA_TEST_EMAIL and TIBIA_TEST_PASSWORD through sealed memfd
        shell: python3 {0}
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          import ctypes, json, os, pathlib, struct, time
          from tools.tibia_runtime_bridge.protected_auth_tty import (
              ProtectedSecretBuffer,
              _harden_secret_process,
              create_sealed_credential_memfd,
              load_exact_runtime_identity,
          )
          from tools.tibia_runtime_bridge.experimental_auth_client import auth_with_credentials_fd

          _harden_secret_process()
          email = bytearray(os.environb.pop(b'TIBIA_TEST_EMAIL', b''))
          password = bytearray(os.environb.pop(b'TIBIA_TEST_PASSWORD', b''))
          if not (1 <= len(email) <= 1024 and 1 <= len(password) <= 1024) or 0 in email or 0 in password:
              raise SystemExit('NATIVE_LOGIN_SECRET_SHAPE_INVALID')

          state = pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          task = pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime')
          lease = json.loads((state/'lease.json').read_text())
          reg = json.loads((state/'runtime-registration.json').read_text())
          assert lease.get('status') == 'active' and lease.get('generation') == 15
          assert lease.get('controller_session') == 'chatgpt-native-login-e2e-20260818-v3-gen15'
          assert reg.get('registration_generation') == 1 and reg.get('lease_generation') == 15
          identity = load_exact_runtime_identity(task/'auth-runtime-identity.json')
          fd = -1
          try:
              with ProtectedSecretBuffer() as eb, ProtectedSecretBuffer() as pb:
                  eb.storage[:len(email)] = email; eb.length = len(email)
                  pb.storage[:len(password)] = password; pb.length = len(password)
                  ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(email)), 0, len(email))
                  ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(password)), 0, len(password))
                  fd = create_sealed_credential_memfd(eb, pb)
                  response = auth_with_credentials_fd(
                      state/'session/native-auth.sock', fd, timeout=5.0, expected_identity=identity)
              safe = {k: response.get(k) for k in ('ok','command','qmeta_method_id','invocation_dispatched','error') if k in response}
              print('NATIVE_LOGIN_AUTH_RESPONSE=' + json.dumps(safe, sort_keys=True, separators=(',',':')))
              if response.get('ok') is not True or response.get('invocation_dispatched') is not True:
                  raise SystemExit('NATIVE_LOGIN_AUTH_DISPATCH_FAILED')
              print('NATIVE_LOGIN_SECRETS_USED=true')
              print('NATIVE_LOGIN_AUTH_DISPATCH=PASS')
          finally:
              if fd >= 0: os.close(fd)
              if email: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(email)), 0, len(email))
              if password: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(password)), 0, len(password))

          pid = int(reg['pid'])
          exe = os.path.realpath(f'/proc/{pid}/exe')
          base = None
          for line in pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace').splitlines():
              parts = line.split(maxsplit=5)
              if len(parts) >= 6 and parts[5] == exe:
                  lo = int(parts[0].split('-')[0],16); off = int(parts[2],16); base = lo-off; break
          assert base is not None
          needle = struct.pack('<Q', base + 0x308ed68)
          deadline = time.monotonic() + 75.0
          last_count = -1
          while time.monotonic() < deadline:
              hits = []
              maps = pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace').splitlines()
              mfd = os.open(f'/proc/{pid}/mem', os.O_RDONLY)
              try:
                  for line in maps:
                      parts = line.split(maxsplit=5)
                      if len(parts) < 2 or not parts[1].startswith('rw') or 'p' not in parts[1]:
                          continue
                      lo, hi = (int(x,16) for x in parts[0].split('-'))
                      if hi <= lo or hi-lo > (512 << 20):
                          continue
                      cur = lo
                      while cur < hi:
                          wanted = min(1 << 20, hi-cur)
                          data = os.pread(mfd, wanted, cur)
                          if len(data) != wanted: break
                          pos = 0
                          while True:
                              j = data.find(needle, pos)
                              if j < 0: break
                              addr = cur+j
                              if addr % 8 == 0: hits.append(addr)
                              pos = j+1
                          cur += wanted
                  hits = sorted(set(hits))
                  if len(hits) == 1:
                      raw = os.pread(mfd, 16, hits[0] + 0x100)
                      if len(raw) == 16:
                          first, count = struct.unpack('<Qq', raw)
                          last_count = count
                          if count > 0 and first != 0:
                              print('NATIVE_LOGIN_ACCOUNT_AUTH=PASS')
                              print('NATIVE_LOGIN_CHARACTER_LIST_COUNT=' + str(count))
                              raise SystemExit(0)
              finally:
                  os.close(mfd)
              if not pathlib.Path(f'/proc/{pid}').exists():
                  raise SystemExit('NATIVE_LOGIN_CLIENT_DIED_AFTER_AUTH')
              time.sleep(0.5)
          print('NATIVE_LOGIN_CHARACTER_LIST_LAST_COUNT=' + str(last_count))
          raise SystemExit('NATIVE_LOGIN_ACCOUNT_AUTH_NATIVE_MODEL_TIMEOUT')

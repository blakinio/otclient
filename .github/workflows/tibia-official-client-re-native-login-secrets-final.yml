name: Track A native-login Secrets final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-secrets-final.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  auth:
    name: Canonical Gate B then delayed helper then GitHub Secrets
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download exact native-auth helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-auth-helper-5376592fd7382406b4c97de9813a40841d1b3bfd
          path: ${{ runner.temp }}/native-login-auth-helper-final
          repository: blakinio/otclient
          run-id: 32129906446
          github-token: ${{ github.token }}

      - name: Download verified delayed loader shim
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-login-delayed-auth-shim-9d7eda42652f05fae3a3d2c57b4c401078dc5ee4
          path: ${{ runner.temp }}/native-login-delayed-auth-shim-final
          repository: blakinio/otclient
          run-id: 32135515927
          github-token: ${{ github.token }}

      - name: Bootstrap exact canonical client, Gate B, then dlopen native-auth helper
        shell: bash
        env:
          EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py --changed-from "$EVENT_BASE_SHA" --expected-branch "$HEAD_BRANCH"

          task='OTC-20260818-native-login-to-ingame-e2e'
          session='chatgpt-native-login-e2e-20260818-v3-gen15-secrets-final'
          root='/home/runner/_work/_otclient_tibia_re_state'
          state="$root/canonical-live-runtime"
          task_runtime="$root/tasks/$task/runtime"
          token="$task_runtime/canonical-lease-token"
          helper_src="$RUNNER_TEMP/native-login-auth-helper-final/otclient-tibia-native-auth-experimental.so"
          shim_src="$RUNNER_TEMP/native-login-delayed-auth-shim-final/otclient-tibia-delayed-auth-loader.so"
          helper="$task_runtime/auth-helper/otclient-tibia-native-auth-experimental.so"
          shim="$task_runtime/auth-helper/otclient-tibia-delayed-auth-loader.so"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          canonical_worker='.github/scripts/tibia-official-client-re-canonical-live-session.sh'
          worker="$RUNNER_TEMP/native-login-final-worker-${GITHUB_RUN_ID}.sh"
          acquired=0; ready=0

          [[ -f "$helper_src" && "$(stat -c %s "$helper_src")" == 63728 ]]
          [[ "$(sha256sum "$helper_src" | awk '{print $1}')" == e5cd3f4c42c35000dce7ed5736bdf646fdb179119817f726a86f9e9637a82777 ]]
          [[ -f "$shim_src" && "$(stat -c %s "$shim_src")" == 16312 ]]
          [[ "$(sha256sum "$shim_src" | awk '{print $1}')" == 9842247a3affb3fb20a55321c9323ca9119d41c24521cbdc541bfdbadea9ff0c ]]
          ! ldd "$shim_src" | grep -q 'Qt6'
          mkdir -p "$task_runtime/auth-helper"; chmod 700 "$task_runtime" "$task_runtime/auth-helper"
          install -m700 "$helper_src" "$helper"
          install -m700 "$shim_src" "$shim"

          bash "$lease" status --json >"$RUNNER_TEMP/native-login-final-lease-pre.json"
          python3 - "$RUNNER_TEMP/native-login-final-lease-pre.json" "$state/runtime-registration.json" "$state/session" "$token" <<'PY'
          import json,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert lease.get('status')=='released',lease
          assert lease.get('generation')==14,lease
          assert lease.get('controller_task') is None and lease.get('controller_session') is None
          assert not pathlib.Path(sys.argv[2]).exists(),'registration unexpectedly present'
          assert not pathlib.Path(sys.argv[3]).exists(),'session unexpectedly present'
          assert not pathlib.Path(sys.argv[4]).exists(),'stale token unexpectedly present'
          print('NATIVE_LOGIN_FINAL_PRECHECK=PASS_RELEASED_GEN14_NO_RUNTIME')
          PY

          trap 'rc=$?; rm -f "$worker"; if [[ "$ready" != 1 && "$acquired" == 1 && -f "$token" ]]; then bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true; fi; exit "$rc"' EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$session" --token-file "$token" --ttl-seconds 2700
          acquired=1

          python3 - "$canonical_worker" "$worker" "$helper" "$shim" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_text(); out=pathlib.Path(sys.argv[2]); helper=sys.argv[3]; shim=sys.argv[4]
          anchor="RMARK='OTCLIENT_TIBIA_RE_CANONICAL_RUNTIME=1'\n"
          assert src.count(anchor)==1
          src=src.replace(anchor,anchor+"AUTH_HELPER='"+helper+"'\nAUTH_SHIM='"+shim+"'\n",1)
          old='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" LD_PRELOAD="$preload" \\\n      PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          new='      FONTCONFIG_FILE="$TOOL/etc/fonts/fonts.conf" OTCLIENT_TIBIA_RE_AUTH_SOCKET="$SESSION/native-auth.sock" \\\n      OTCLIENT_TIBIA_RE_DELAYED_AUTH_HELPER="$AUTH_HELPER" OTCLIENT_TIBIA_RE_DELAYED_AUTH_TRIGGER="$SESSION/native-auth.trigger" \\\n      OTCLIENT_TIBIA_RE_DELAYED_AUTH_STATUS="$SESSION/native-auth.status" LD_PRELOAD="$preload:$AUTH_SHIM" \\\n      PROXYCHAINS_CONF_FILE="$SESSION/proxychains.conf" \\\n'
          assert src.count(old)==1
          src=src.replace(old,new,1)
          out.write_text(src); out.chmod(0o700)
          print('NATIVE_LOGIN_FINAL_WORKER_PATCH=PASS')
          PY
          bash -n "$worker"
          python3 "$transition" bootstrap --task-id "$task" --session-id "$session" --token-file "$token" --worker "$worker" --worker-timeout 180
          python3 "$transition" gate-b --task-id "$task" --session-id "$session" --token-file "$token" --probe "$worker"

          pid="$(cat "$state/session/client.pid")"
          trigger="$state/session/native-auth.trigger"
          status="$state/session/native-auth.status"
          auth_socket="$state/session/native-auth.sock"
          grep -F "$shim" "/proc/$pid/maps" >/dev/null
          ! grep -F "$helper" "/proc/$pid/maps" >/dev/null
          [[ ! -S "$auth_socket" ]]

          python3 - "$state/lease.json" "$state/runtime-registration.json" "$task_runtime/auth-runtime-identity.json" <<'PY'
          import json,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text()); d=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lease.get('status')=='active' and lease.get('generation')==15
          assert lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen15-secrets-final'
          assert d.get('registration_generation')==1 and d.get('lease_generation')==15
          assert d.get('client_version')=='15.32.df7b29' and d.get('client_size')==51965216
          assert d.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          env=pathlib.Path(f"/proc/{d['pid']}/environ").read_bytes().split(b'\0')
          assert not any(x.startswith(b'TIBIA_TEST_EMAIL=') or x.startswith(b'TIBIA_TEST_PASSWORD=') for x in env)
          ident={k:d[k] for k in ('boot_id_sha256','pid','process_start_ticks','client_version','client_size','client_sha256')}
          p=pathlib.Path(sys.argv[3]); p.write_text(json.dumps(ident,sort_keys=True,separators=(',',':'))+'\n'); p.chmod(0o600)
          print('NATIVE_LOGIN_FINAL_GATE_B=PASS_GEN15_REG1_15')
          PY

          : >"$trigger"; chmod 600 "$trigger"
          for _ in $(seq 1 200); do
            [[ -f "$status" ]] && break
            kill -0 "$pid"; sleep .1
          done
          [[ -f "$status" ]]
          [[ "$(tr -d '\r\n' <"$status")" == PASS ]]
          for _ in $(seq 1 200); do
            [[ -S "$auth_socket" ]] && break
            kill -0 "$pid"; sleep .1
          done
          [[ -S "$auth_socket" && "$(stat -c %a "$auth_socket")" == 600 ]]
          grep -F "$helper" "/proc/$pid/maps" >/dev/null
          echo 'NATIVE_LOGIN_FINAL_DELAYED_HELPER=PASS'
          ready=1
          rm -f "$worker"
          trap - EXIT

      - name: Use TIBIA_TEST_EMAIL and TIBIA_TEST_PASSWORD now
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          python3 - <<'PY'
          import ctypes,json,os,pathlib,struct,time
          from tools.tibia_runtime_bridge.protected_auth_tty import ProtectedSecretBuffer,_harden_secret_process,create_sealed_credential_memfd,load_exact_runtime_identity
          from tools.tibia_runtime_bridge.experimental_auth_client import auth_with_credentials_fd

          _harden_secret_process()
          e=bytearray(os.environb.get(b'TIBIA_TEST_EMAIL',b'')); p=bytearray(os.environb.get(b'TIBIA_TEST_PASSWORD',b''))
          os.environ.pop('TIBIA_TEST_EMAIL',None); os.environ.pop('TIBIA_TEST_PASSWORD',None)
          if not (1<=len(e)<=1024 and 1<=len(p)<=1024) or 0 in e or 0 in p: raise SystemExit('NATIVE_LOGIN_FINAL_SECRET_SHAPE_INVALID')
          state=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          task=pathlib.Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime')
          lease=json.loads((state/'lease.json').read_text()); reg=json.loads((state/'runtime-registration.json').read_text())
          assert lease.get('status')=='active' and lease.get('generation')==15
          assert lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen15-secrets-final'
          assert reg.get('registration_generation')==1 and reg.get('lease_generation')==15
          identity=load_exact_runtime_identity(task/'auth-runtime-identity.json')
          fd=-1
          try:
              with ProtectedSecretBuffer() as eb, ProtectedSecretBuffer() as pb:
                  eb.storage[:len(e)]=e; eb.length=len(e)
                  pb.storage[:len(p)]=p; pb.length=len(p)
                  ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(e)),0,len(e))
                  ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(p)),0,len(p))
                  fd=create_sealed_credential_memfd(eb,pb)
                  r=auth_with_credentials_fd(state/'session/native-auth.sock',fd,timeout=5.0,expected_identity=identity)
              safe={k:r.get(k) for k in ('ok','command','qmeta_method_id','invocation_dispatched') if k in r}
              print('NATIVE_LOGIN_FINAL_AUTH_RESPONSE='+json.dumps(safe,sort_keys=True,separators=(',',':')))
              if r.get('ok') is not True or r.get('invocation_dispatched') is not True: raise SystemExit('NATIVE_LOGIN_FINAL_AUTH_DISPATCH_FAILED')
              print('NATIVE_LOGIN_FINAL_SECRETS_USED=true')
              print('NATIVE_LOGIN_FINAL_AUTH_DISPATCH=PASS')
          finally:
              if fd>=0: os.close(fd)
              if e: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(e)),0,len(e))
              if p: ctypes.memset(ctypes.addressof(ctypes.c_char.from_buffer(p)),0,len(p))

          pid=int(reg['pid']); exe=os.path.realpath(f'/proc/{pid}/exe')
          base=None
          for line in pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace').splitlines():
              q=line.split(maxsplit=5)
              if len(q)>=6 and q[5]==exe:
                  lo=int(q[0].split('-')[0],16); off=int(q[2],16); base=lo-off; break
          assert base is not None
          needle=struct.pack('<Q',base+0x308ed68)
          deadline=time.monotonic()+60.0; last_count=-1
          while time.monotonic()<deadline:
              hits=[]; maps=pathlib.Path(f'/proc/{pid}/maps').read_text(errors='replace').splitlines(); mfd=os.open(f'/proc/{pid}/mem',os.O_RDONLY)
              try:
                  for line in maps:
                      q=line.split(maxsplit=5)
                      if len(q)<2 or not q[1].startswith('rw') or 'p' not in q[1]: continue
                      lo,hi=(int(x,16) for x in q[0].split('-'))
                      if hi<=lo or hi-lo>(512<<20): continue
                      cur=lo
                      while cur<hi:
                          n=min(1<<20,hi-cur)
                          try: data=os.pread(mfd,n,cur)
                          except OSError: break
                          pos=0
                          while True:
                              j=data.find(needle,pos)
                              if j<0: break
                              a=cur+j
                              if a%8==0:hits.append(a)
                              pos=j+1
                          cur+=n
                  hits=sorted(set(hits))
                  if len(hits)==1:
                      raw=os.pread(mfd,16,hits[0]+0x100)
                      if len(raw)==16:
                          first,count=struct.unpack('<Qq',raw); last_count=count
                          if count>0 and first!=0:
                              print('NATIVE_LOGIN_FINAL_ACCOUNT_AUTH=PASS')
                              print('NATIVE_LOGIN_FINAL_CHARACTER_LIST_COUNT='+str(count))
                              raise SystemExit(0)
              finally: os.close(mfd)
              time.sleep(.5)
          print('NATIVE_LOGIN_FINAL_ACCOUNT_AUTH=NOT_PROVEN')
          print('NATIVE_LOGIN_FINAL_CHARACTER_LIST_COUNT='+str(last_count))
          raise SystemExit(47)
          PY

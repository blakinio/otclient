name: Track A native-login existing VNC backend inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-source-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  inventory:
    name: Identify existing 5901/6081 VNC owners read-only
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      BASE_SHA: ebbb36f50076ff4072c7218e302614c1dfea00b1
      BASE: /home/runner/_work/_otclient_tibia_re_state
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read-only VNC ownership inventory
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 && "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_SHA" ]]
          echo VNC_OWNER_SECRET_ACCESS=false
          echo VNC_OWNER_MUTATION=false

          python3 - <<'PY'
          import os,pathlib,re,socket
          def inodes(port):
              out=set(); want=f'{port:04X}'
              for fn in ('/proc/net/tcp','/proc/net/tcp6'):
                  try: rows=pathlib.Path(fn).read_text().splitlines()[1:]
                  except OSError: continue
                  for row in rows:
                      f=row.split()
                      if len(f)>9 and f[1].rsplit(':',1)[-1].upper()==want and f[3]=='0A': out.add(f[9])
              return out
          def pids_for(ins):
              out=[]
              for p in pathlib.Path('/proc').iterdir():
                  if not p.name.isdigit(): continue
                  try:
                      for fd in (p/'fd').iterdir():
                          try: t=os.readlink(fd)
                          except OSError: continue
                          if t.startswith('socket:[') and t[8:-1] in ins:
                              out.append(int(p.name)); break
                  except OSError: pass
              return sorted(set(out))
          def safe_env(pid):
              wanted={'OTCLIENT_TIBIA_RE_TRACK','OTCLIENT_TIBIA_RE_ROLE','DISPLAY'}
              vals={}
              try: raw=pathlib.Path(f'/proc/{pid}/environ').read_bytes().split(b'\0')
              except OSError: return vals
              for x in raw:
                  if b'=' not in x: continue
                  k,v=x.split(b'=',1); k=k.decode(errors='ignore')
                  if k in wanted:
                      s=v.decode(errors='replace')
                      vals[k]=re.sub(r'[^\x20-\x7e]','?',s)[:160]
              return vals
          for port in (5901,6081,5902,6082):
              ins=inodes(port); ps=pids_for(ins)
              print(f'VNC_OWNER_PORT_{port}_LISTEN='+str(bool(ins)).lower())
              print(f'VNC_OWNER_PORT_{port}_PIDS='+','.join(map(str,ps)))
              for pid in ps:
                  try: exe=os.readlink(f'/proc/{pid}/exe')
                  except OSError: exe='UNAVAILABLE'
                  try:
                      argv=pathlib.Path(f'/proc/{pid}/cmdline').read_bytes().split(b'\0')
                      args=[re.sub(r'[^\x20-\x7e]','?',a.decode(errors='replace'))[:180] for a in argv if a]
                  except OSError: args=[]
                  print(f'VNC_OWNER_PORT_{port}_PID_{pid}_EXE={exe}')
                  print(f'VNC_OWNER_PORT_{port}_PID_{pid}_ARGV0={args[0] if args else "UNAVAILABLE"}')
                  print(f'VNC_OWNER_PORT_{port}_PID_{pid}_ARGS='+('|'.join(args[1:10])))
                  for k,v in sorted(safe_env(pid).items()): print(f'VNC_OWNER_PORT_{port}_PID_{pid}_ENV_{k}={v}')
          try:
              print('VNC_OWNER_SYNOLOGY_DNS='+socket.gethostbyname('synology'))
          except OSError as e: print('VNC_OWNER_SYNOLOGY_DNS=FAIL')
          PY

          for u in http://127.0.0.1:6081/ http://synology:6082/; do
            label=LOCAL6081; [[ "$u" == *synology* ]] && label=HOST6082
            code="$(curl -sS --max-time 3 -o /tmp/vnc-owner-body.$$ -w '%{http_code}' "$u" 2>/tmp/vnc-owner-err.$$ || true)"
            echo "VNC_OWNER_${label}_HTTP_CODE=${code:-CURL_FAIL}"
            if [[ -s /tmp/vnc-owner-body.$$ ]]; then
              echo "VNC_OWNER_${label}_BODY_SHA256=$(sha256sum /tmp/vnc-owner-body.$$ | awk '{print $1}')"
              echo "VNC_OWNER_${label}_BODY_SIZE=$(stat -c %s /tmp/vnc-owner-body.$$)"
            fi
            if [[ -s /tmp/vnc-owner-err.$$ ]]; then
              err="$(tr '\n' ' ' </tmp/vnc-owner-err.$$ | sed -E 's/[^[:print:]]/?/g' | cut -c1-240)"
              echo "VNC_OWNER_${label}_CURL_ERROR=$err"
            fi
            rm -f /tmp/vnc-owner-body.$$ /tmp/vnc-owner-err.$$
          done

          if command -v docker >/dev/null 2>&1 && [[ -S /var/run/docker.sock ]]; then
            self="$(hostname)"
            docker inspect "$self" >/dev/null
            python3 - "$self" <<'PY'
          import json,subprocess,sys
          d=json.loads(subprocess.check_output(['docker','inspect',sys.argv[1]]))[0]
          ports=d.get('NetworkSettings',{}).get('Ports',{}) or {}
          for cp in ('6081/tcp','6082/tcp','5901/tcp','5902/tcp'):
              vals=ports.get(cp) or []
              print('VNC_OWNER_DOCKER_'+cp.replace('/','_').upper()+'='+','.join(f"{x.get('HostIp','')}:{x.get('HostPort','')}" for x in vals))
          PY
          fi
          echo VNC_OWNER_RESULT=PASS_READ_ONLY

name: Track A native-login surviving display inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-source-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  inventory:
    name: Classify surviving display 98 read-only
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      BASE_SHA: ebbb36f50076ff4072c7218e302614c1dfea00b1
      BASE: /home/runner/_work/_otclient_tibia_re_state
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read-only display ownership inventory
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 && "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_SHA" ]]
          echo DISPLAY98_SECRET_ACCESS=false
          echo DISPLAY98_MUTATION=false
          state="$BASE/canonical-live-runtime"
          [[ -e "$state/runtime-registration.json" ]] && echo DISPLAY98_REGISTRATION_PRESENT=true || echo DISPLAY98_REGISTRATION_PRESENT=false
          [[ -d "$state/session" ]] && echo DISPLAY98_CANONICAL_SESSION_PRESENT=true || echo DISPLAY98_CANONICAL_SESSION_PRESENT=false

          python3 - <<'PY'
          import os,pathlib
          n=98
          lock=pathlib.Path(f'/tmp/.X{n}-lock')
          sock=pathlib.Path(f'/tmp/.X11-unix/X{n}')
          print('DISPLAY98_LOCK_PRESENT='+str(lock.exists()).lower())
          print('DISPLAY98_SOCKET_PRESENT='+str(sock.exists()).lower())
          if sock.exists():
              st=sock.stat(); print(f'DISPLAY98_SOCKET_UID={st.st_uid}'); print(f'DISPLAY98_SOCKET_GID={st.st_gid}'); print(f'DISPLAY98_SOCKET_MODE={oct(st.st_mode & 0o777)}')
          pid=None
          if lock.exists():
              try: pid=int(lock.read_text().strip())
              except Exception: pass
          print('DISPLAY98_LOCK_PID='+str(pid if pid else 'UNKNOWN'))
          if pid and pathlib.Path(f'/proc/{pid}').exists():
              try: exe=os.readlink(f'/proc/{pid}/exe')
              except OSError: exe='UNAVAILABLE'
              print('DISPLAY98_SERVER_EXE='+exe)
              try:
                  first=pathlib.Path(f'/proc/{pid}/cmdline').read_bytes().split(b'\0',1)[0].decode(errors='replace')
              except OSError: first='UNAVAILABLE'
              print('DISPLAY98_SERVER_ARGV0='+first)
              try:
                  lines=pathlib.Path(f'/proc/{pid}/status').read_text().splitlines()
                  uid=next(x.split(':',1)[1].strip() for x in lines if x.startswith('Uid:'))
                  gid=next(x.split(':',1)[1].strip() for x in lines if x.startswith('Gid:'))
                  print('DISPLAY98_SERVER_UIDS='+uid.replace('\t',',')); print('DISPLAY98_SERVER_GIDS='+gid.replace('\t',','))
              except Exception: pass
              try:
                  cg=pathlib.Path(f'/proc/{pid}/cgroup').read_text().splitlines()
                  for x in cg[:8]: print('DISPLAY98_SERVER_CGROUP='+x)
              except OSError: pass
          PY

          for c in xset xdpyinfo xwininfo xprop; do
            if command -v "$c" >/dev/null 2>&1; then echo "DISPLAY98_TOOL_${c^^}=$(command -v "$c")"; else echo "DISPLAY98_TOOL_${c^^}=ABSENT"; fi
          done
          if command -v xdpyinfo >/dev/null 2>&1; then
            if DISPLAY=:98 xdpyinfo >/tmp/display98-xdpyinfo.$$ 2>/dev/null; then
              echo DISPLAY98_CONNECT=PASS
              grep -E '^(name of display:|dimensions:|number of screens:)' /tmp/display98-xdpyinfo.$$ | sed 's/^/DISPLAY98_XDPYINFO=/' || true
            else
              echo DISPLAY98_CONNECT=FAIL
            fi
            rm -f /tmp/display98-xdpyinfo.$$
          fi
          if command -v xwininfo >/dev/null 2>&1; then
            if DISPLAY=:98 xwininfo -root -tree >/tmp/display98-tree.$$ 2>/dev/null; then
              echo DISPLAY98_TREE_QUERY=PASS
              python3 - /tmp/display98-tree.$$ <<'PY'
          import pathlib,sys,re
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          # Only structural window identifiers/titles; bound output and redact suspicious long strings.
          count=0
          for line in lines:
              if '0x' not in line: continue
              clean=re.sub(r'[^\x20-\x7e]','?',line.strip())
              if len(clean)>180: clean=clean[:180]+'...'
              print('DISPLAY98_WINDOW='+clean)
              count+=1
              if count>=25: break
          print('DISPLAY98_WINDOW_COUNT_SHOWN='+str(count))
          PY
            else
              echo DISPLAY98_TREE_QUERY=FAIL
            fi
            rm -f /tmp/display98-tree.$$
          fi
          echo DISPLAY98_RESULT=PASS_READ_ONLY

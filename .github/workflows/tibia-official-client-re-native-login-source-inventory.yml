name: Track A native-login VNC prerequisite inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-source-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory updater VNC prerequisites read-only
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      BASE_SHA: ebbb36f50076ff4072c7218e302614c1dfea00b1
      BASE: /home/runner/_work/_otclient_tibia_re_state
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read-only prerequisite inventory
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 && "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_SHA" ]]

          state="$BASE/canonical-live-runtime"
          package="$BASE/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$package/bin/client"
          tool="$BASE/toolroot"

          echo VNC_PREREQ_SECRET_ACCESS=false
          echo VNC_PREREQ_MUTATION=false
          [[ -e "$state/runtime-registration.json" ]] && echo VNC_PREREQ_REGISTRATION_PRESENT=true || echo VNC_PREREQ_REGISTRATION_PRESENT=false
          [[ -d "$state/session" ]] && echo VNC_PREREQ_SESSION_PRESENT=true || echo VNC_PREREQ_SESSION_PRESENT=false
          [[ -e "$client" ]] && echo VNC_PREREQ_CLIENT_PRESENT=true || echo VNC_PREREQ_CLIENT_PRESENT=false
          [[ -d "$package" ]] && echo VNC_PREREQ_PACKAGE_DIR_PRESENT=true || echo VNC_PREREQ_PACKAGE_DIR_PRESENT=false

          [[ -d "$tool" ]] && echo VNC_PREREQ_BASE_TOOLROOT_PRESENT=true || echo VNC_PREREQ_BASE_TOOLROOT_PRESENT=false
          [[ -x "$tool/usr/bin/Xvfb" ]] && echo VNC_PREREQ_BASE_XVFB_EXECUTABLE=true || echo VNC_PREREQ_BASE_XVFB_EXECUTABLE=false
          [[ -x "$tool/usr/bin/x11vnc" ]] && echo VNC_PREREQ_BASE_X11VNC_EXECUTABLE=true || echo VNC_PREREQ_BASE_X11VNC_EXECUTABLE=false
          [[ -d /usr/share/novnc ]] && echo VNC_PREREQ_SYSTEM_NOVNC_PRESENT=true || echo VNC_PREREQ_SYSTEM_NOVNC_PRESENT=false
          if command -v websockify >/dev/null 2>&1; then echo "VNC_PREREQ_WEBSOCKIFY=$(command -v websockify)"; else echo VNC_PREREQ_WEBSOCKIFY=ABSENT; fi
          if command -v Xvfb >/dev/null 2>&1; then echo "VNC_PREREQ_SYSTEM_XVFB=$(command -v Xvfb)"; else echo VNC_PREREQ_SYSTEM_XVFB=ABSENT; fi
          if command -v x11vnc >/dev/null 2>&1; then echo "VNC_PREREQ_SYSTEM_X11VNC=$(command -v x11vnc)"; else echo VNC_PREREQ_SYSTEM_X11VNC=ABSENT; fi

          python3 - "$BASE" <<'PY'
          import pathlib,sys
          base=pathlib.Path(sys.argv[1])
          names={'Xvfb','x11vnc','websockify'}
          out=[]
          for p in base.rglob('*'):
              try:
                  if p.is_file() and p.name in names:
                      out.append(str(p))
              except OSError:
                  pass
              if len(out)>=30: break
          for p in sorted(out): print('VNC_PREREQ_FOUND_BINARY='+p)
          PY

          python3 - <<'PY'
          import pathlib
          free=[]; used=[]
          for n in range(90,141):
              lock=pathlib.Path(f'/tmp/.X{n}-lock'); sock=pathlib.Path(f'/tmp/.X11-unix/X{n}')
              (used if lock.exists() or sock.exists() else free).append(n)
          print('VNC_PREREQ_USED_DISPLAYS='+','.join(map(str,used)))
          print('VNC_PREREQ_FREE_DISPLAY_FIRST='+str(free[0] if free else 'NONE'))
          PY

          if command -v docker >/dev/null 2>&1 && [[ -S /var/run/docker.sock ]]; then
            self="$(hostname)"
            if docker inspect "$self" >/dev/null 2>&1; then
              python3 - "$self" <<'PY'
          import json,subprocess,sys
          d=json.loads(subprocess.check_output(['docker','inspect',sys.argv[1]]))[0]
          ports=d.get('NetworkSettings',{}).get('Ports',{}) or {}
          for cp,b in sorted(ports.items()):
              if b:
                  for x in b: print(f"VNC_PREREQ_DOCKER_PORT={cp}->{x.get('HostIp','')}:{x.get('HostPort','')}")
          PY
            else
              echo VNC_PREREQ_DOCKER_SELF_INSPECT=false
            fi
          else
            echo VNC_PREREQ_DOCKER_UNAVAILABLE=true
          fi
          echo VNC_PREREQ_RESULT=PASS_READ_ONLY

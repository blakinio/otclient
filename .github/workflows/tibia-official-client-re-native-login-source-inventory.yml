name: Track A native-login stable VNC LAN observer

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-source-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  observer:
    name: Replace proven stale backend and expose stable updater desktop
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 7
    env:
      BASE_SHA: ebbb36f50076ff4072c7218e302614c1dfea00b1
      TASK: OTC-20260818-native-login-to-ingame-e2e
      LEASE_SESSION: chatgpt-native-login-e2e-20260818-v3-gen16-secrets
      BASE: /home/runner/_work/_otclient_tibia_re_state
      WORKBASE: /work/_otclient_tibia_re_state
      TOKEN: /home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime/canonical-lease-token
      RELAY_NAME: otclient-tibia-native-login-vnc-relay
      HOST_LAN_IP: 192.168.1.2
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Establish stable task-owned VNC observer
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 && "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_SHA" ]]

          task=docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md
          grep -q '^task_id: OTC-20260818-native-login-to-ingame-e2e$' "$task"
          grep -q '^status: validating$' "$task"
          grep -q '^runtime_access: ephemeral_isolated$' "$task"
          grep -q '^runtime_namespace: native-login-official-package-update$' "$task"
          grep -q '^mutation_authorized: true$' "$task"
          grep -q '^credentials_allowed: false$' "$task"
          grep -q '^login_allowed: false$' "$task"
          grep -q '^gameplay_allowed: false$' "$task"
          echo TRACK_A_ADMISSION_RUNTIME_ACCESS=ephemeral_isolated
          echo TRACK_A_ADMISSION_NAMESPACE=native-login-official-package-update
          echo TRACK_A_ADMISSION_TARGET_UNIQUENESS=PROVEN
          echo TRACK_A_ADMISSION_MUTATION_AUTHORIZED=true
          echo TRACK_A_ADMISSION_CREDENTIALS_ALLOWED=false
          echo TRACK_A_ADMISSION_LOGIN_ALLOWED=false
          echo TRACK_A_ADMISSION_GAMEPLAY_ALLOWED=false

          state="$BASE/canonical-live-runtime"
          package="$BASE/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$package/bin/client"
          tool="$WORKBASE/toolroot"
          live="$BASE/native-login-update/live"
          [[ ! -e "$state/runtime-registration.json" && ! -d "$state/session" ]]
          [[ ! -e "$client" && ! -d "$package" ]]
          [[ -f "$TOKEN" && "$(stat -c %a "$TOKEN")" == 600 ]]
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          bash "$lease" validate --task-id "$TASK" --session-id "$LEASE_SESSION" --token-file "$TOKEN"
          bash "$lease" renew --task-id "$TASK" --session-id "$LEASE_SESSION" --token-file "$TOKEN" --ttl-seconds 2700

          for b in Xvfb x11vnc xdotool; do [[ -x "$tool/usr/bin/$b" && ! -L "$tool/usr/bin/$b" ]]; done
          [[ -d "$tool/usr/share/X11/xkb" && -f "$tool/usr/lib/x86_64-linux-gnu/dri/swrast_dri.so" && -d /usr/share/novnc ]]
          command -v websockify >/dev/null
          command -v docker >/dev/null
          [[ -S /var/run/docker.sock ]]
          echo STABLE_VNC_PREFLIGHT=PASS

          # 6081 is currently occupied by a proven stale historical websockify: its webroot
          # was canonical session state already torn down, and its RFB target 5901 is absent.
          stale_pid="$(python3 - <<'PY'
          import os,pathlib
          port=6081; want=f'{port:04X}'; ins=set()
          for fn in ('/proc/net/tcp','/proc/net/tcp6'):
              try: rows=pathlib.Path(fn).read_text().splitlines()[1:]
              except OSError: continue
              for row in rows:
                  f=row.split()
                  if len(f)>9 and f[1].rsplit(':',1)[-1].upper()==want and f[3]=='0A': ins.add(f[9])
          owners=[]
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try:
                  hit=False
                  for fd in (p/'fd').iterdir():
                      try:t=os.readlink(fd)
                      except OSError:continue
                      if t.startswith('socket:[') and t[8:-1] in ins: hit=True; break
                  if not hit: continue
                  args=[x.decode(errors='replace') for x in (p/'cmdline').read_bytes().split(b'\0') if x]
              except OSError: continue
              owners.append((int(p.name),args))
          if len(owners)!=1: raise SystemExit(f'expected one stale 6081 owner, got {len(owners)}')
          pid,args=owners[0]
          joined='\n'.join(args)
          required=['websockify','--web','canonical-live-runtime/session/novnc-web','0.0.0.0:6081','127.0.0.1:5901']
          if not all(x in joined for x in required): raise SystemExit('6081 owner is not the proven stale canonical VNC backend')
          # RFB 5901 must still have no listener.
          want5901=f'{5901:04X}'
          for fn in ('/proc/net/tcp','/proc/net/tcp6'):
              try: rows=pathlib.Path(fn).read_text().splitlines()[1:]
              except OSError: continue
              for row in rows:
                  f=row.split()
                  if len(f)>3 and f[1].rsplit(':',1)[-1].upper()==want5901 and f[3]=='0A': raise SystemExit('5901 unexpectedly has a listener')
          print(pid)
          PY
          )"
          [[ "$stale_pid" =~ ^[1-9][0-9]*$ ]]
          echo "STABLE_VNC_REPLACE_STALE_6081_PID=$stale_pid"
          kill "$stale_pid"
          for _ in $(seq 1 40); do kill -0 "$stale_pid" 2>/dev/null || break; sleep .1; done
          if kill -0 "$stale_pid" 2>/dev/null; then kill -9 "$stale_pid"; fi
          python3 - <<'PY'
          import pathlib
          for port in (5901,6081):
              want=f'{port:04X}'
              for fn in ('/proc/net/tcp','/proc/net/tcp6'):
                  try: rows=pathlib.Path(fn).read_text().splitlines()[1:]
                  except OSError: continue
                  for row in rows:
                      f=row.split()
                      if len(f)>3 and f[1].rsplit(':',1)[-1].upper()==want and f[3]=='0A': raise SystemExit(f'port {port} still occupied')
          PY
          echo STABLE_VNC_STALE_BACKEND_REMOVED=PASS

          if [[ -e "$live/session.json" ]]; then
            echo STABLE_VNC_REFUSE_PREEXISTING_TASK_SESSION=true >&2
            exit 1
          fi
          rm -rf "$live"; mkdir -m700 -p "$live"
          xvfb_pid=''; vnc_pid=''; ws_pid=''; relay_created=false
          stop_pid() {
            local p="$1"; [[ "$p" =~ ^[1-9][0-9]*$ ]] || return 0
            kill "$p" 2>/dev/null || true
            for _ in $(seq 1 30); do kill -0 "$p" 2>/dev/null || return 0; sleep .1; done
            kill -9 "$p" 2>/dev/null || true
          }
          cleanup() {
            stop_pid "$ws_pid"; stop_pid "$vnc_pid"; stop_pid "$xvfb_pid"
            if [[ "$relay_created" == true ]] && docker container inspect "$RELAY_NAME" >/dev/null 2>&1; then docker rm -f "$RELAY_NAME" >/dev/null || true; fi
            rm -rf "$live"
          }
          trap cleanup ERR INT TERM HUP

          display_num="$(python3 - <<'PY'
          import pathlib
          for n in range(99,131):
              if not pathlib.Path(f'/tmp/.X{n}-lock').exists() and not pathlib.Path(f'/tmp/.X11-unix/X{n}').exists(): print(n); break
          else: raise SystemExit('no free updater display')
          PY
          )"
          display=":$display_num"
          dri="$tool/usr/lib/x86_64-linux-gnu/dri"
          env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
            OTCLIENT_TIBIA_RE_TRACK=official-client-re OTCLIENT_TIBIA_RE_ROLE=native-login-updater-xvfb \
            HOME="$BASE/home" PATH="$tool/usr/bin:$tool/usr/sbin:/usr/bin:/bin" \
            LD_LIBRARY_PATH="$tool/usr/lib/x86_64-linux-gnu:$tool/lib/x86_64-linux-gnu" \
            LIBGL_DRIVERS_PATH="$dri" XKB_CONFIG_ROOT="$tool/usr/share/X11/xkb" \
            nohup "$tool/usr/bin/Xvfb" "$display" -screen 0 1920x1080x24 -xkbdir "$tool/usr/share/X11/xkb" -nolisten tcp -noreset \
            >"$live/xvfb.log" 2>&1 </dev/null &
          xvfb_pid=$!
          for _ in $(seq 1 60); do [[ -S "/tmp/.X11-unix/X$display_num" ]] && break; kill -0 "$xvfb_pid"; sleep .2; done
          [[ -S "/tmp/.X11-unix/X$display_num" ]]
          echo "STABLE_VNC_DISPLAY=$display"

          webroot="$live/novnc-web"; mkdir -m700 "$webroot"; cp -a /usr/share/novnc/. "$webroot/"
          marker="OTCLIENT_NATIVE_LOGIN_VNC_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$marker" >"$webroot/health.txt"
          cat >"$webroot/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><title>OTCLIENT Tibia updater</title><script>location.replace('/vnc.html?autoconnect=1&resize=scale&quality=6&compression=3&show_dot=true&path=websockify');</script>
          HTML
          env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD DISPLAY="$display" \
            OTCLIENT_TIBIA_RE_TRACK=official-client-re OTCLIENT_TIBIA_RE_ROLE=native-login-updater-vnc \
            nohup "$tool/usr/bin/x11vnc" -display "$display" -rfbport 5901 -localhost -forever -shared -nopw \
            -xkb -repeat -wait 10 -defer 10 -deferupdate 20 -threads -noxrecord -noxfixes -o "$live/x11vnc.log" >/dev/null 2>&1 </dev/null &
          vnc_pid=$!
          env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
            OTCLIENT_TIBIA_RE_TRACK=official-client-re OTCLIENT_TIBIA_RE_ROLE=native-login-updater-websockify \
            nohup websockify --web "$webroot" 0.0.0.0:6081 127.0.0.1:5901 >"$live/websockify.log" 2>&1 </dev/null &
          ws_pid=$!
          for _ in $(seq 1 50); do
            if kill -0 "$vnc_pid" 2>/dev/null && kill -0 "$ws_pid" 2>/dev/null && [[ "$(curl -fsS --max-time 1 http://127.0.0.1:6081/health.txt 2>/dev/null || true)" == "$marker" ]]; then break; fi
            sleep .2
          done
          kill -0 "$xvfb_pid"; kill -0 "$vnc_pid"; kill -0 "$ws_pid"
          [[ "$(curl -fsS --max-time 2 http://127.0.0.1:6081/health.txt)" == "$marker" ]]
          python3 - <<'PY'
          import base64,os,socket
          s=socket.create_connection(('127.0.0.1',5901),3); assert s.recv(12).startswith(b'RFB '); s.close()
          key=base64.b64encode(os.urandom(16)).decode()
          req=('GET /websockify HTTP/1.1\r\nHost: localhost\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n'+f'Sec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n').encode()
          s=socket.create_connection(('127.0.0.1',6081),3); s.sendall(req); d=s.recv(4096); s.close(); assert b' 101 ' in d.split(b'\r\n',1)[0]
          PY
          echo STABLE_VNC_LOCAL_RFB_WEBSOCKET=PASS

          self="$(hostname)"; docker inspect "$self" >/dev/null
          image="$(docker inspect -f '{{.Image}}' "$self")"
          network="$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$self")"
          [[ "$network" == otclient-runner_default ]]
          runner_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$self")"
          [[ "$runner_ip" =~ ^172\.28\.[0-9]+\.[0-9]+$ ]]
          if docker container inspect "$RELAY_NAME" >/dev/null 2>&1; then
            owner="$(docker inspect -f '{{ index .Config.Labels "otclient.task" }}' "$RELAY_NAME" 2>/dev/null || true)"
            [[ "$owner" == "$TASK" ]] || { echo STABLE_VNC_REFUSE_FOREIGN_RELAY=true >&2; exit 1; }
            docker rm -f "$RELAY_NAME" >/dev/null
          fi
          relay_script="$(cat <<'PY'
          import os,select,socket,threading
          target=(os.environ['TARGET_IP'],int(os.environ['TARGET_PORT']))
          def handle(c):
              s=None
              try:
                  s=socket.create_connection(target,5); pair=(c,s)
                  while True:
                      r,_,_=select.select(pair,[],[],60)
                      if not r: continue
                      for src in r:
                          data=src.recv(65536)
                          if not data: return
                          (s if src is c else c).sendall(data)
              finally:
                  try:c.close()
                  except:pass
                  if s:
                      try:s.close()
                      except:pass
          ls=socket.socket(); ls.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); ls.bind(('0.0.0.0',6081)); ls.listen(64)
          while True:
              c,_=ls.accept(); threading.Thread(target=handle,args=(c,),daemon=True).start()
          PY
          )"
          host_port=''
          for hp in $(seq 6083 6092); do
            if docker run -d --name "$RELAY_NAME" --label "otclient.task=$TASK" --label 'otclient.role=native-login-vnc-relay' \
              --network "$network" -p "$HOST_LAN_IP:$hp:6081/tcp" \
              -e "TARGET_IP=$runner_ip" -e 'TARGET_PORT=6081' --entrypoint python3 "$image" -u -c "$relay_script" >/dev/null 2>&1; then
              host_port="$hp"; relay_created=true; break
            fi
            docker rm -f "$RELAY_NAME" >/dev/null 2>&1 || true
          done
          [[ "$host_port" =~ ^[0-9]+$ ]]
          docker inspect -f '{{.State.Running}}' "$RELAY_NAME" | grep -qx true
          echo "STABLE_VNC_LAN_PORT=$host_port"

          host_probe="$(cat <<'PY'
          import base64,os,socket,sys,urllib.request
          port=int(sys.argv[1]); marker=sys.argv[2]
          with urllib.request.urlopen(f'http://127.0.0.1:{port}/health.txt',timeout=5) as r:
              assert r.read().decode().strip()==marker
          key=base64.b64encode(os.urandom(16)).decode()
          req=(f'GET /websockify HTTP/1.1\r\nHost: 127.0.0.1:{port}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n').encode()
          s=socket.create_connection(('127.0.0.1',port),5); s.sendall(req); d=s.recv(4096); s.close(); assert b' 101 ' in d.split(b'\r\n',1)[0]
          print('HOST_NETWORK_VNC_PROBE=PASS')
          PY
          )"
          docker run --rm --network host --entrypoint python3 "$image" -c "$host_probe" -- "$host_port" "$marker"
          [[ "$(curl -fsS --max-time 5 "http://$HOST_LAN_IP:$host_port/health.txt")" == "$marker" ]]
          echo STABLE_VNC_LAN_HTTP_WEBSOCKET=PASS

          relay_id="$(docker inspect -f '{{.Id}}' "$RELAY_NAME")"
          python3 - "$live/session.json" "$TASK" "$display" "$xvfb_pid" "$vnc_pid" "$ws_pid" "$RELAY_NAME" "$relay_id" "$host_port" <<'PY'
          import json,pathlib,sys
          x={'task':sys.argv[2],'phase':'vnc-ready','display':sys.argv[3],'rfb_port':5901,'web_backend_port':6081,'xvfb_pid':int(sys.argv[4]),'vnc_pid':int(sys.argv[5]),'websockify_pid':int(sys.argv[6]),'relay_name':sys.argv[7],'relay_id':sys.argv[8],'lan_ip':'192.168.1.2','lan_port':int(sys.argv[9]),'client_started':False,'credentials_accessed':False}
          p=pathlib.Path(sys.argv[1]); p.write_text(json.dumps(x,sort_keys=True)+'\n'); p.chmod(0o600)
          PY
          printf 'UPDATER_VNC_URL=http://%s:%s/\nUPDATER_VNC_DISPLAY=%s\n' "$HOST_LAN_IP" "$host_port" "$display" >"$live/public.txt"; chmod 600 "$live/public.txt"
          echo "STABLE_VNC_URL=http://$HOST_LAN_IP:$host_port/"
          echo STABLE_VNC_SECRET_ACCESS=false
          echo STABLE_VNC_CLIENT_STARTED=false
          echo STABLE_VNC_RESULT=PASS_PERSISTENT_LAN_OBSERVER_READY
          trap - ERR INT TERM HUP

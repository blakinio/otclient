name: Track A native-login work-toolroot inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-source-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  inventory:
    name: Resolve canonical work toolroot read-only
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      BASE_SHA: ebbb36f50076ff4072c7218e302614c1dfea00b1
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resolve toolroot without runtime mutation
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 && "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_SHA" ]]
          echo TOOLROOT_PROBE_SECRET_ACCESS=false
          echo TOOLROOT_PROBE_MUTATION=false
          home=/home/runner/_work/_otclient_tibia_re_state/toolroot
          work=/work/_otclient_tibia_re_state/toolroot
          for root in "$home" "$work"; do
            tag=HOME; [[ "$root" == "$work" ]] && tag=WORK
            [[ -d "$root" ]] && echo "TOOLROOT_${tag}_PRESENT=true" || echo "TOOLROOT_${tag}_PRESENT=false"
            for b in Xvfb x11vnc xdotool; do
              [[ -x "$root/usr/bin/$b" ]] && echo "TOOLROOT_${tag}_${b^^}=true" || echo "TOOLROOT_${tag}_${b^^}=false"
            done
            [[ -d "$root/usr/share/X11/xkb" ]] && echo "TOOLROOT_${tag}_XKB=true" || echo "TOOLROOT_${tag}_XKB=false"
            [[ -f "$root/usr/lib/x86_64-linux-gnu/dri/swrast_dri.so" ]] && echo "TOOLROOT_${tag}_SWRAST=true" || echo "TOOLROOT_${tag}_SWRAST=false"
            p="$(find "$root" -xdev -type f -name libproxychains.so.4 -print -quit 2>/dev/null || true)"
            [[ -n "$p" ]] && echo "TOOLROOT_${tag}_PROXYCHAINS=true" || echo "TOOLROOT_${tag}_PROXYCHAINS=false"
          done
          if [[ -x "$work/usr/bin/Xvfb" ]]; then
            echo "TOOLROOT_WORK_XVFB_SHA256=$(sha256sum "$work/usr/bin/Xvfb" | awk '{print $1}')"
          fi
          echo TOOLROOT_PROBE_RESULT=PASS_READ_ONLY

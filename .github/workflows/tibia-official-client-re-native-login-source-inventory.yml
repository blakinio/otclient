name: Track A native-login VNC relay topology inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-source-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory runner Docker topology read-only
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      BASE_SHA: ebbb36f50076ff4072c7218e302614c1dfea00b1
      BASE: /home/runner/_work/_otclient_tibia_re_state
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Read-only Docker topology
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 && "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_SHA" ]]
          echo VNC_RELAY_SECRET_ACCESS=false
          echo VNC_RELAY_MUTATION=false
          [[ -S /var/run/docker.sock ]] || { echo VNC_RELAY_DOCKER_SOCKET=false; exit 1; }
          command -v docker >/dev/null
          self="$(hostname)"
          docker inspect "$self" >/dev/null
          python3 - "$self" <<'PY'
          import json,subprocess,sys
          d=json.loads(subprocess.check_output(['docker','inspect',sys.argv[1]]))[0]
          print('VNC_RELAY_SELF_ID='+d.get('Id','')[:16])
          print('VNC_RELAY_SELF_NAME='+d.get('Name','').lstrip('/'))
          print('VNC_RELAY_SELF_IMAGE_ID='+d.get('Image',''))
          print('VNC_RELAY_SELF_CONFIG_IMAGE='+str(d.get('Config',{}).get('Image','')))
          print('VNC_RELAY_SELF_NETWORK_MODE='+str(d.get('HostConfig',{}).get('NetworkMode','')))
          nets=d.get('NetworkSettings',{}).get('Networks',{}) or {}
          for name,n in sorted(nets.items()):
              print('VNC_RELAY_SELF_NETWORK='+name)
              print('VNC_RELAY_SELF_IP_'+name.replace('-','_').upper()+'='+str(n.get('IPAddress','')))
              print('VNC_RELAY_SELF_ALIASES_'+name.replace('-','_').upper()+'='+','.join(n.get('Aliases') or []))
          ports=d.get('NetworkSettings',{}).get('Ports',{}) or {}
          for cp,b in sorted(ports.items()):
              if b:
                  for x in b: print(f"VNC_RELAY_SELF_PORT={cp}->{x.get('HostIp','')}:{x.get('HostPort','')}")
          PY
          echo VNC_RELAY_RUNNING_CONTAINERS_BEGIN=true
          docker ps --format 'VNC_RELAY_CONTAINER={{.ID}}|{{.Names}}|{{.Image}}|{{.Ports}}' | head -n 40
          echo VNC_RELAY_RUNNING_CONTAINERS_END=true
          echo VNC_RELAY_RESULT=PASS_READ_ONLY

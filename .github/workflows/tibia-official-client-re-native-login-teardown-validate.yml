name: Track A native-login canonical teardown validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/tibia-official-client-re-canonical-live-teardown.py
      - .github/workflows/tibia-official-client-re-native-login-teardown-validate.yml
      - docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate teardown source and fail-closed markers
        shell: bash
        run: |
          set -Eeuo pipefail
          s=.github/scripts/tibia-official-client-re-canonical-live-teardown.py
          python3 -m py_compile "$s"
          python3 "$s" --help >/dev/null
          grep -F "transition._probe_reg(" "$s" >/dev/null
          grep -F "transition._assert_group_tracked(manifest)" "$s" >/dev/null
          grep -F "transition._cancel(guard)" "$s" >/dev/null
          grep -F "transition._kill(pgid)" "$s" >/dev/null
          grep -F "transition._worker(args.worker, 'rollback', str(pgid))" "$s" >/dev/null
          grep -F "transition._remove(registration)" "$s" >/dev/null
          grep -F "teardown_official_client_candidate_survived" "$s" >/dev/null
          grep -F "TRACK_A_CANONICAL_TEARDOWN_LEASE_RETAINED=true" "$s" >/dev/null
          if grep -E 'pkill|killall|/proc/[0-9]*.*/environ.*TIBIA_TEST|TIBIA_TEST_(EMAIL|PASSWORD)' "$s" >/dev/null; then
            echo 'unsafe teardown pattern present' >&2
            exit 1
          fi
          echo TEARDOWN_PYCOMPILE=PASS
          echo TEARDOWN_BOUNDED_PROCESS_GROUP_ONLY=true
          echo TEARDOWN_SECRET_ACCESS=false
          echo TEARDOWN_CLIENT_UPDATE=false

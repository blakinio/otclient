name: Track A native-login visible current-client start preflight

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-visible-start-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  inventory:
    name: Prove isolated viewer and zero official-client candidates before start
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 6
    env:
      BASE_MAIN: ebbb36f50076ff4072c7218e302614c1dfea00b1
      TASK: OTC-20260818-native-login-to-ingame-e2e
      BASE: /home/runner/_work/_otclient_tibia_re_state
      EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
      EXPECTED_SIZE: '52109920'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read-only physical preflight
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          ulimit -c 0 || true
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD

          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_MAIN" ]]

          task_file=docs/agents/tasks/active/OTC-20260818-native-login-to-ingame-e2e.md
          grep -q '^task_id: OTC-20260818-native-login-to-ingame-e2e$' "$task_file"
          grep -q '^runtime_access: ephemeral_isolated$' "$task_file"
          grep -q '^runtime_owner_task: OTC-20260818-native-login-to-ingame-e2e$' "$task_file"
          grep -q '^canonical_update_completed: true$' "$task_file"
          grep -q "^installed_exact_client_sha256: $EXPECTED_SHA$" "$task_file"
          grep -q "^installed_exact_client_size: $EXPECTED_SIZE$" "$task_file"
          grep -q '^credentials_allowed: false$' "$task_file"
          grep -q '^login_allowed: false$' "$task_file"
          grep -q '^gameplay_allowed: false$' "$task_file"

          state="$BASE/canonical-live-runtime"
          source_root="$BASE/home/.local/share/CipSoft GmbH/Tibia"
          source_pkg="$source_root/packages/Tibia"
          client="$source_pkg/bin/client"
          viewer="$BASE/native-login-update/live/session.json"
          tool=/work/_otclient_tibia_re_state/toolroot

          [[ -f "$client" && -x "$client" && ! -L "$client" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ ! -e "$state/runtime-registration.json" ]]
          [[ ! -d "$state/session" ]]
          [[ -f "$viewer" ]]
          [[ -d "$tool" && ! -L "$tool" ]]

          readarray -t v < <(python3 - "$viewer" "$TASK" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); x=json.loads(p.read_text()); task=sys.argv[2]
          assert x.get('task')==task
          assert x.get('phase') in ('vnc-ready','official-updater-running')
          assert x.get('credentials_accessed') is False
          assert x.get('client_started') is False
          assert x.get('relay_network')=='host'
          assert x.get('lan_ip')=='192.168.1.2'
          assert x.get('rfb_port')==5901 and x.get('web_backend_port')==6081
          for key in ('xvfb_pid','vnc_pid','websockify_pid'):
              pid=int(x[key]); assert pathlib.Path('/proc')/str(pid)
              assert (pathlib.Path('/proc')/str(pid)).is_dir(), (key,pid)
          print(x['display'])
          print(x['lan_port'])
          print(x['marker'])
          print(x['relay_name'])
          print(x['relay_id'])
          print(x['xvfb_pid'])
          print(x['vnc_pid'])
          print(x['websockify_pid'])
          PY
          )
          display="${v[0]}"; lan_port="${v[1]}"; marker="${v[2]}"; relay_name="${v[3]}"; relay_id="${v[4]}"
          [[ "$display" =~ ^:[0-9]+$ && "$lan_port" =~ ^[0-9]+$ ]]
          [[ -S /tmp/.X11-unix/X${display#:} ]]
          command -v docker >/dev/null
          [[ -S /var/run/docker.sock ]]
          [[ "$relay_name" == otclient-tibia-native-login-vnc-relay ]]
          [[ "$(docker inspect -f '{{.Id}}' "$relay_name")" == "$relay_id" ]]
          [[ "$(docker inspect -f '{{.State.Running}}' "$relay_name")" == true ]]
          [[ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$relay_name")" == host ]]
          [[ "$(docker inspect -f '{{ index .Config.Labels "otclient.task" }}' "$relay_name")" == "$TASK" ]]
          [[ "$(curl -fsS --max-time 5 "http://192.168.1.2:$lan_port/health.txt")" == "$marker" ]]

          readarray -t counts < <(python3 - "$client" "$BASE" <<'PY'
          import pathlib,sys
          exact=pathlib.Path(sys.argv[1]).resolve(); base=pathlib.Path(sys.argv[2]).resolve()
          exact_hits=[]; plausible=[]
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try:
                  exe=(p/'exe').resolve(strict=True)
              except (OSError,RuntimeError):
                  continue
              if exe==exact:
                  exact_hits.append(int(p.name))
              text=str(exe)
              if exe.name=='client' and 'CipSoft GmbH/Tibia' in text and text.startswith(str(base)):
                  plausible.append((int(p.name),text))
          print(len(exact_hits))
          print(len(plausible))
          if exact_hits or plausible:
              raise SystemExit('official client candidate already present')
          PY
          )
          [[ "${counts[0]}" == 0 && "${counts[1]}" == 0 ]]

          # Ensure no task-owned client-start runtime from an earlier attempt is still present.
          runtime="$BASE/native-login-visible-current-client"
          if [[ -e "$runtime/session.json" ]]; then
            python3 - "$runtime/session.json" <<'PY'
          import json,pathlib,sys
          x=json.loads(pathlib.Path(sys.argv[1]).read_text())
          pid=x.get('client_pid')
          if isinstance(pid,int) and (pathlib.Path('/proc')/str(pid)).exists():
              raise SystemExit('task-owned visible client runtime already live')
          PY
          fi

          echo VISIBLE_START_PREFLIGHT_RUNTIME_ACCESS=ephemeral_isolated
          echo VISIBLE_START_PREFLIGHT_MUTATION=false
          echo VISIBLE_START_PREFLIGHT_SECRET_ACCESS=false
          echo VISIBLE_START_PREFLIGHT_LOGIN=false
          echo VISIBLE_START_PREFLIGHT_CANONICAL_REGISTRATION=ABSENT
          echo VISIBLE_START_PREFLIGHT_CANONICAL_SESSION=ABSENT
          echo VISIBLE_START_PREFLIGHT_EXACT_CLIENT_CANDIDATES=0
          echo VISIBLE_START_PREFLIGHT_ALL_TASKROOT_CIPSOFT_CLIENT_CANDIDATES=0
          echo "VISIBLE_START_PREFLIGHT_DISPLAY=$display"
          echo "VISIBLE_START_PREFLIGHT_VNC_URL=http://192.168.1.2:$lan_port/"
          echo VISIBLE_START_PREFLIGHT_RESULT=PASS

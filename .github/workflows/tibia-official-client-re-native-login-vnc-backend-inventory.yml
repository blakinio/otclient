name: Track A native-login VNC backend inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-vnc-backend-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  inventory:
    name: Identify existing 6081 listener and host presentation
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 6
    env:
      BASE_SHA: ebbb36f50076ff4072c7218e302614c1dfea00b1
      BASE: /home/runner/_work/_otclient_tibia_re_state
      BACKEND_PORT: '6081'
      HOST_PRESENTATION: synology
      HOST_PORT: '6082'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read-only backend ownership and presentation proof
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 && "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$HEAD_BRANCH" == runtime/OTC-20260818-native-login-to-ingame-e2e-v3 ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$BASE_SHA" ]]
          echo VNC_BACKEND_SECRET_ACCESS=false
          echo VNC_BACKEND_MUTATION=false

          python3 - "$BACKEND_PORT" "$BASE" <<'PY'
          import os,pathlib,re,sys
          port=int(sys.argv[1]); base=str(pathlib.Path(sys.argv[2]).resolve())
          want=f'{port:04X}'; inodes=set()
          for fn in ('/proc/net/tcp','/proc/net/tcp6'):
              try: rows=pathlib.Path(fn).read_text().splitlines()[1:]
              except OSError: continue
              for row in rows:
                  f=row.split()
                  if len(f)>9 and f[1].rsplit(':',1)[-1].upper()==want and f[3]=='0A': inodes.add(f[9])
          print('VNC_BACKEND_LISTENER_PRESENT='+str(bool(inodes)).lower())
          if not inodes: raise SystemExit('backend listener absent')
          owners=[]
          for proc in pathlib.Path('/proc').iterdir():
              if not proc.name.isdigit(): continue
              try:
                  fds=list((proc/'fd').iterdir())
              except OSError: continue
              hit=False
              for fd in fds:
                  try:t=os.readlink(fd)
                  except OSError:continue
                  if t.startswith('socket:[') and t[8:-1] in inodes: hit=True; break
              if not hit: continue
              pid=int(proc.name)
              try: exe=os.path.basename(os.readlink(proc/'exe'))
              except OSError: exe='unknown'
              try: args=(proc/'cmdline').read_bytes().split(b'\0'); args=[a.decode('utf-8','replace') for a in args if a]
              except OSError: args=[]
              try: env=(proc/'environ').read_bytes().split(b'\0')
              except OSError: env=[]
              selected={}
              for raw in env:
                  if b'=' not in raw: continue
                  k,v=raw.split(b'=',1)
                  if k in (b'OTCLIENT_TIBIA_RE_ROLE',b'OTCLIENT_TIBIA_RE_TRACK'):
                      selected[k.decode()]=v.decode('utf-8','replace')
              is_ws=any('websockify' in a for a in args)
              web_scope='unknown'; target=''
              if '--web' in args:
                  i=args.index('--web')
                  if i+1<len(args):
                      wp=args[i+1]
                      web_scope='task-base' if os.path.abspath(wp).startswith(base+os.sep) else ('system-novnc' if wp.startswith('/usr/share/novnc') else 'other')
              for a in args:
                  if re.fullmatch(r'(?:127\.0\.0\.1|localhost):59\d\d',a): target=a
              print(f'VNC_BACKEND_OWNER_PID={pid}')
              print(f'VNC_BACKEND_OWNER_EXE={exe}')
              print('VNC_BACKEND_OWNER_IS_WEBSOCKIFY='+str(is_ws).lower())
              print('VNC_BACKEND_OWNER_WEBROOT_SCOPE='+web_scope)
              print('VNC_BACKEND_OWNER_TARGET_RFB='+target)
              print('VNC_BACKEND_OWNER_ROLE='+selected.get('OTCLIENT_TIBIA_RE_ROLE',''))
              print('VNC_BACKEND_OWNER_TRACK='+selected.get('OTCLIENT_TIBIA_RE_TRACK',''))
              owners.append((pid,target))
          print('VNC_BACKEND_OWNER_COUNT='+str(len(owners)))
          if not owners: raise SystemExit('listener inode has no visible owner')
          PY

          python3 - "$BACKEND_PORT" "$HOST_PRESENTATION" "$HOST_PORT" <<'PY'
          import base64,hashlib,os,socket,sys,urllib.request
          backend=int(sys.argv[1]); host=sys.argv[2]; hp=int(sys.argv[3])
          def fetch(h,p,path):
              with urllib.request.urlopen(f'http://{h}:{p}{path}',timeout=3) as r:
                  b=r.read(2_000_000); return r.status,hashlib.sha256(b).hexdigest(),len(b)
          for path,label in (('/','INDEX'),('/vnc.html','VNC_HTML')):
              a=fetch('127.0.0.1',backend,path); b=fetch(host,hp,path)
              print(f'VNC_BACKEND_LOCAL_{label}_HTTP={a[0]}')
              print(f'VNC_BACKEND_HOST_{label}_HTTP={b[0]}')
              print(f'VNC_BACKEND_{label}_BYTES_EQUAL={str(a[1:]==b[1:]).lower()}')
              print(f'VNC_BACKEND_{label}_SIZE={a[2]}')
          def ws(h,p):
              key=base64.b64encode(os.urandom(16)).decode()
              q=(f'GET /websockify HTTP/1.1\r\nHost: {h}:{p}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n').encode()
              s=socket.create_connection((h,p),3);s.sendall(q);d=s.recv(4096);s.close();return b' 101 ' in d.split(b'\r\n',1)[0]
          print('VNC_BACKEND_LOCAL_WEBSOCKET='+('PASS' if ws('127.0.0.1',backend) else 'FAIL'))
          print('VNC_BACKEND_HOST_WEBSOCKET='+('PASS' if ws(host,hp) else 'FAIL'))
          PY

          python3 - "$BACKEND_PORT" <<'PY'
          import os,pathlib,re,socket,sys
          port=int(sys.argv[1]); want=f'{port:04X}'; inode=None
          for fn in ('/proc/net/tcp','/proc/net/tcp6'):
              try: rows=pathlib.Path(fn).read_text().splitlines()[1:]
              except OSError: continue
              for row in rows:
                  f=row.split()
                  if len(f)>9 and f[1].rsplit(':',1)[-1].upper()==want and f[3]=='0A': inode=f[9]; break
              if inode: break
          target=None
          for proc in pathlib.Path('/proc').iterdir():
              if not proc.name.isdigit(): continue
              try:
                  if not any(os.readlink(fd)==f'socket:[{inode}]' for fd in (proc/'fd').iterdir()): continue
                  args=[x.decode('utf-8','replace') for x in (proc/'cmdline').read_bytes().split(b'\0') if x]
              except OSError: continue
              for a in args:
                  m=re.fullmatch(r'(?:127\.0\.0\.1|localhost):(59\d\d)',a)
                  if m: target=int(m.group(1)); break
              if target: break
          print('VNC_BACKEND_TARGET_RFB_PORT='+str(target or ''))
          if target:
              s=socket.create_connection(('127.0.0.1',target),3); b=s.recv(12); s.close()
              print('VNC_BACKEND_TARGET_RFB=' + ('PASS' if b.startswith(b'RFB ') else 'FAIL'))
          PY
          echo VNC_BACKEND_RESULT=PASS_READ_ONLY_INVENTORY

name: Track A native-login gen16 VNC repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-native-login-vnc-gen16-repair.yml

permissions:
  contents: read

concurrency:
  group: track-a-canonical-live-runtime
  cancel-in-progress: false

jobs:
  repair:
    name: Rebind noVNC 6082 to active gen16 display
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260818-native-login-to-ingame-e2e-v3' }}
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      EXPECTED_BASE_SHA: 066a5ba8b1811ef61d3aa8ac2ff3fc3601fe7b9d
      TASK_ID: OTC-20260818-native-login-to-ingame-e2e
      SESSION_ID: chatgpt-native-login-e2e-20260818-v3-gen16-secrets
      STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
      TOKEN: /home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260818-native-login-to-ingame-e2e/runtime/canonical-lease-token
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Diagnose and repair only the VNC presentation path
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EXPECTED_BASE_SHA" ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py --changed-from "$EVENT_BASE_SHA" --expected-branch "$HEAD_BRANCH"

          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          transition=.github/scripts/tibia-official-client-re-canonical-live-transition.py
          source_worker=.github/scripts/tibia-official-client-re-canonical-live-session.sh
          probe="$RUNNER_TEMP/vnc-gen16-probe-${GITHUB_RUN_ID}.sh"
          trap 'rm -f "$probe"' EXIT

          [[ -f "$TOKEN" && "$(stat -c %a "$TOKEN")" == 600 ]]
          bash "$lease" validate --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN"
          bash "$lease" renew --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN" --ttl-seconds 2700
          python3 .github/scripts/tibia-official-client-re-canonical-xres-worker-adapter.py "$source_worker" "$probe" \
            --owner-helper .github/scripts/tibia-official-client-re-xres-window-owner.py \
            --wire-helper .github/scripts/tibia-official-client-re-xres-wire.py
          chmod 700 "$probe"
          python3 "$transition" gate-b --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN" --probe "$probe"

          readarray -t runtime < <(python3 - "$STATE/lease.json" "$STATE/runtime-registration.json" <<'PY'
          import json,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text())
          reg=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lease.get('status')=='active' and lease.get('generation')==16
          assert lease.get('controller_task')=='OTC-20260818-native-login-to-ingame-e2e'
          assert lease.get('controller_session')=='chatgpt-native-login-e2e-20260818-v3-gen16-secrets'
          assert reg.get('registration_generation')==1 and reg.get('lease_generation')==16
          assert reg.get('client_version')=='15.32.df7b29'
          assert reg.get('client_size')==51965216
          assert reg.get('client_sha256')=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          print(reg['display'])
          print(reg['pid'])
          print(reg['window_identity'])
          print(reg.get('remote_view_endpoint',''))
          print(reg.get('remote_view_mapping',''))
          PY
          )
          display="${runtime[0]}"
          client_pid="${runtime[1]}"
          window_identity="${runtime[2]}"
          canonical_endpoint="${runtime[3]}"
          canonical_mapping="${runtime[4]}"
          [[ "$display" =~ ^:[0-9]+$ && "$client_pid" =~ ^[1-9][0-9]*$ ]]
          display_num="${display#:}"
          [[ -S "/tmp/.X11-unix/X$display_num" ]]
          kill -0 "$client_pid"
          echo "VNC_REPAIR_ACTIVE_DISPLAY=$display"
          echo "VNC_REPAIR_ACTIVE_CLIENT_PID=$client_pid"
          echo "VNC_REPAIR_WINDOW_IDENTITY=$window_identity"
          echo "VNC_REPAIR_CANONICAL_ENDPOINT=$canonical_endpoint"
          echo "VNC_REPAIR_CANONICAL_MAPPING=$canonical_mapping"

          tool="$(cat "$STATE/session/toolroot")"
          xdotool="$tool/usr/bin/xdotool"
          x11vnc="$tool/usr/bin/x11vnc"
          [[ -x "$xdotool" && -x "$x11vnc" ]]
          win="$(DISPLAY="$display" "$xdotool" search --onlyvisible --pid "$client_pid" --name '^Tibia$' 2>/dev/null | head -n1 || true)"
          [[ "$win" =~ ^[0-9]+$ ]]
          geometry="$(DISPLAY="$display" "$xdotool" getwindowgeometry --shell "$win")"
          width="$(sed -n 's/^WIDTH=//p' <<<"$geometry")"
          height="$(sed -n 's/^HEIGHT=//p' <<<"$geometry")"
          x="$(sed -n 's/^X=//p' <<<"$geometry")"
          y="$(sed -n 's/^Y=//p' <<<"$geometry")"
          [[ "$width" =~ ^[1-9][0-9]*$ && "$height" =~ ^[1-9][0-9]*$ ]]
          echo "VNC_REPAIR_VISIBLE_TIBIA_WINDOW=true"
          echo "VNC_REPAIR_WINDOW_GEOMETRY=${width}x${height}+${x}+${y}"

          command -v websockify >/dev/null
          [[ -d /usr/share/novnc ]]
          self="$(hostname)"
          [[ -S /var/run/docker.sock ]]
          docker inspect "$self" >/dev/null
          python3 - "$self" <<'PY'
          import json,subprocess,sys
          d=json.loads(subprocess.check_output(['docker','inspect',sys.argv[1]]))[0]
          ports=d.get('NetworkSettings',{}).get('Ports',{}) or {}
          bindings=ports.get('6081/tcp') or []
          hostports=sorted({str(x.get('HostPort','')) for x in bindings if x.get('HostPort')})
          print('VNC_REPAIR_CONTAINER_6081_HOST_PORTS='+(','.join(hostports) if hostports else 'NONE'))
          print('VNC_REPAIR_HOST_6082_MAPPING='+str('6082' in hostports).lower())
          PY

          # Resolve listener owners without broad pkill. Only stale x11vnc/websockify on the two dedicated
          # historical observability ports may be replaced.
          python3 - 5901 6081 <<'PY'
          import os,pathlib,signal,sys,time
          ports=[int(x) for x in sys.argv[1:]]
          def inodes(port):
              want=f'{port:04X}'; out=set()
              for table in ('/proc/net/tcp','/proc/net/tcp6'):
                  try: lines=pathlib.Path(table).read_text().splitlines()[1:]
                  except OSError: continue
                  for line in lines:
                      f=line.split()
                      if len(f)>9 and f[1].rsplit(':',1)[-1].upper()==want and f[3]=='0A': out.add(f[9])
              return out
          def owners(ins):
              out=set()
              if not ins:return out
              for p in pathlib.Path('/proc').iterdir():
                  if not p.name.isdigit(): continue
                  try:
                      for fd in (p/'fd').iterdir():
                          try:t=os.readlink(fd)
                          except OSError:continue
                          if t.startswith('socket:[') and t[8:-1] in ins: out.add(int(p.name)); break
                  except OSError:continue
              return out
          for port in ports:
              for pid in sorted(owners(inodes(port))):
                  try: cmd=pathlib.Path(f'/proc/{pid}/cmdline').read_bytes().replace(b'\0',b' ').decode('utf-8','replace')
                  except OSError: continue
                  allowed=('x11vnc' in cmd) if port==5901 else ('websockify' in cmd)
                  if not allowed:
                      raise SystemExit(f'VNC_REPAIR_REFUSE_UNKNOWN_LISTENER_{port}_PID_{pid}')
                  print(f'VNC_REPAIR_REPLACING_STALE_LISTENER_{port}=true')
                  try: os.kill(pid,signal.SIGTERM)
                  except ProcessLookupError: pass
              deadline=time.monotonic()+3
              while inodes(port) and time.monotonic()<deadline: time.sleep(.1)
              for pid in sorted(owners(inodes(port))):
                  try: os.kill(pid,signal.SIGKILL)
                  except ProcessLookupError: pass
          PY

          webroot="$STATE/session/novnc-web"
          rm -rf "$webroot"
          mkdir -p "$webroot"
          cp -a /usr/share/novnc/. "$webroot/"
          cat >"$webroot/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Track A Tibia live view</title>
          <script>location.replace('/vnc.html?autoconnect=1&resize=scale&quality=6&compression=3&show_dot=true&path=websockify');</script>
          HTML

          env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
            DISPLAY="$display" nohup "$x11vnc" -display "$display" -rfbport 5901 -localhost \
            -forever -shared -nopw -xkb -repeat -wait 10 -defer 10 -deferupdate 20 -threads \
            -noxrecord -noxfixes -o "$STATE/session/observability-x11vnc.log" \
            >/dev/null 2>&1 </dev/null &
          vnc_pid=$!
          printf '%s\n' "$vnc_pid" >"$STATE/session/observability-x11vnc.pid"
          chmod 600 "$STATE/session/observability-x11vnc.pid"

          env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
            nohup websockify --web "$webroot" 0.0.0.0:6081 127.0.0.1:5901 \
            >"$STATE/session/observability-websockify.log" 2>&1 </dev/null &
          ws_pid=$!
          printf '%s\n' "$ws_pid" >"$STATE/session/observability-websockify.pid"
          chmod 600 "$STATE/session/observability-websockify.pid"

          for _ in $(seq 1 40); do
            kill -0 "$vnc_pid" 2>/dev/null && kill -0 "$ws_pid" 2>/dev/null \
              && curl -fsS --max-time 1 -o /dev/null http://127.0.0.1:6081/ 2>/dev/null && break
            sleep .25
          done
          kill -0 "$vnc_pid"
          kill -0 "$ws_pid"
          curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:6081/

          python3 - "$display" "$client_pid" <<'PY'
          import base64,os,socket,sys
          # Dedicated RFB backend is alive.
          s=socket.create_connection(('127.0.0.1',5901),3); banner=s.recv(12); s.close(); assert banner.startswith(b'RFB '),banner
          # noVNC websocket endpoint is alive.
          key=base64.b64encode(os.urandom(16)).decode()
          req=('GET /websockify HTTP/1.1\r\nHost: localhost\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n'
               f'Sec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n').encode()
          s=socket.create_connection(('127.0.0.1',6081),3); s.sendall(req); reply=s.recv(4096); s.close(); assert b' 101 ' in reply.split(b'\r\n',1)[0],reply[:200]
          print('VNC_REPAIR_RFB_BACKEND=PASS')
          print('VNC_REPAIR_WEBSOCKET=PASS')
          print('VNC_REPAIR_PRESENTS_ACTIVE_DISPLAY='+sys.argv[1])
          print('VNC_REPAIR_PRESENTS_CLIENT_PID='+sys.argv[2])
          PY

          bash "$lease" validate --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN"
          python3 "$transition" gate-b --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN" --probe "$probe"
          echo 'VNC_REPAIR_SECRET_ACCESS=false'
          echo 'VNC_REPAIR_AUTH_MUTATION=false'
          echo 'VNC_REPAIR_CLIENT_RESTART=false'
          echo 'VNC_REPAIR_RESULT=PASS_ACTIVE_GEN16_NOVNC_REBOUND'
          echo 'VNC_REPAIR_USER_URL=http://synology:6082/'
          rm -f "$probe"
          trap - EXIT

name: Track A aligned network write sink census

on:
  push:
    branches: [ci/OTC-20260814-official-client-re-receiver-recovery]
    paths: [.github/workflows/tibia-official-client-re-network-write-sink-census.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
    steps:
      - name: Produce instruction-aligned write sink census
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          objdump="$(command -v objdump || true)"
          [[ -x "$objdump" ]]
          dump="$RUNNER_TEMP/client-aligned.objdump"
          report="$RUNNER_TEMP/track-a-network-write-sink-census.txt"
          "$objdump" -d -Mintel "$client" >"$dump"
          python3 -u - "$dump" >"$report" <<'PY'
          import re,sys
          path=sys.argv[1]
          lines=open(path,errors='replace').read().splitlines()
          print('TRACK_A_NETWORK_WRITE_SINK_CENSUS_BEGIN=true')
          print('CLIENT_SHA256=e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe')
          patterns={
              'qiodevice_write': re.compile(r'\bcall\b.*(?:4de370|QIODevice.*write.*@plt)',re.I),
              'qtcp_socket_ctor': re.compile(r'\bcall\b.*(?:4ddbc0|QTcpSocket.*@plt)',re.I),
              'libc_write': re.compile(r'\bcall\b.*<write@plt>',re.I),
              'libc_writev': re.compile(r'\bcall\b.*<writev@plt>',re.I),
              'libc_send': re.compile(r'\bcall\b.*<send@plt>',re.I),
              'libc_sendto': re.compile(r'\bcall\b.*<sendto@plt>',re.I),
              'libc_sendmsg': re.compile(r'\bcall\b.*<sendmsg@plt>',re.I),
              'ssl_write': re.compile(r'\bcall\b.*<[^>]*SSL_write[^>]*@plt>',re.I),
          }
          hits={k:[] for k in patterns}
          for i,line in enumerate(lines):
              for name,pat in patterns.items():
                  if pat.search(line): hits[name].append(i)
          for name,idxs in hits.items():
              print(f'SINK_COUNT name={name} count={len(idxs)}')
              for n,i in enumerate(idxs[:128],1):
                  print(f'SINK_CONTEXT_BEGIN name={name} ordinal={n}')
                  for line in lines[max(0,i-22):min(len(lines),i+23)]: print(line)
                  print(f'SINK_CONTEXT_END name={name} ordinal={n}')

          # P2 artifact independently found two aligned RIP-relative references to
          # QAbstractSocket text at these instruction addresses. Pull their context
          # from the full section-aligned disassembly rather than restarting decode
          # at an arbitrary byte.
          anchors=(0xcdafe5,0xcdb038)
          addr_re=re.compile(r'^\s*([0-9a-f]+):')
          parsed=[]
          for i,line in enumerate(lines):
              m=addr_re.match(line)
              if m: parsed.append((int(m.group(1),16),i))
          for anchor in anchors:
              pos=min(parsed,key=lambda p:abs(p[0]-anchor))[1] if parsed else None
              print(f'QABSTRACTSOCKET_XREF_CONTEXT_BEGIN anchor=0x{anchor:x}')
              if pos is not None:
                  for line in lines[max(0,pos-40):min(len(lines),pos+41)]: print(line)
              print(f'QABSTRACTSOCKET_XREF_CONTEXT_END anchor=0x{anchor:x}')
          print('TRACK_A_NETWORK_WRITE_SINK_CENSUS_COMPLETE=true')
          PY
          cat "$report"
          grep -q '^TRACK_A_NETWORK_WRITE_SINK_CENSUS_COMPLETE=true$' "$report"

      - name: Upload aligned sink report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-network-write-sink-census-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-network-write-sink-census.txt
          if-no-files-found: error
          retention-days: 7

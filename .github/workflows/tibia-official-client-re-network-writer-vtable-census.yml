name: Track A network writer vtable census

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-network-writer-vtable-census.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 12
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
      WRITER_A: '0x7dd3f0'
      WRITER_B: '0xb40630'
      WRITER_C: '0xb46bd0'
      NETWORK_OWNER_VTABLE: '0x308c408'
      NETWORK_SUBOBJECT_VTABLE: '0x2f66288'
      NETWORK_OWNER_SOURCE_RUN: '31812572191'
      NETWORK_OWNER_SOURCE_JOB: '94806473825'
    steps:
      - name: Resolve relocated writer vtable ownership and canonical-network overlap
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          gdb="$toolroot/usr/bin/gdb"
          [[ -x "$client" && -x "$gdb" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          report="$RUNNER_TEMP/track-a-network-writer-vtable-census.txt"
          : >"$report"
          exec > >(tee -a "$report") 2>&1

          echo TRACK_A_NETWORK_WRITER_VTABLE_CENSUS_BEGIN=true
          echo "CLIENT_SHA256=$EXPECTED_CLIENT_SHA256"
          echo "CLIENT_SIZE=$EXPECTED_CLIENT_SIZE"
          echo "NETWORK_OWNER_SOURCE_RUN=$NETWORK_OWNER_SOURCE_RUN"
          echo "NETWORK_OWNER_SOURCE_JOB=$NETWORK_OWNER_SOURCE_JOB"

          python3 -u - "$client" <<'PY'
          import struct,sys
          client=sys.argv[1]
          data=open(client,'rb').read()
          writer_b=0xb40630
          known={
              'NETWORK_OWNER_VTABLE':0x308c408,
              'NETWORK_SUBOBJECT_VTABLE':0x2f66288,
          }

          if data[:4]!=b'\x7fELF' or data[4]!=2 or data[5]!=1:
              raise SystemExit('expected ELF64 little-endian client')
          phoff=struct.unpack_from('<Q',data,0x20)[0]
          shoff=struct.unpack_from('<Q',data,0x28)[0]
          phentsz=struct.unpack_from('<H',data,0x36)[0]
          phnum=struct.unpack_from('<H',data,0x38)[0]
          shentsz=struct.unpack_from('<H',data,0x3a)[0]
          shnum=struct.unpack_from('<H',data,0x3c)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,fo,va,_,filesz,memsz,_=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1 and filesz:
                  loads.append((fo,fo+filesz,va,va+filesz,flags))
          def va_to_off(va):
              for fs,fe,base,end,flags in loads:
                  if base<=va<end:return fs+va-base
          def load_flags(va):
              for fs,fe,base,end,flags in loads:
                  if base<=va<end:return flags
              return 0
          def is_exec(va):return bool(load_flags(va)&1)

          # Apply R_X86_64_RELATIVE addends exactly as the proven owner-vtable census does.
          rel={}
          for i in range(shnum):
              o=shoff+i*shentsz
              sh_type=struct.unpack_from('<I',data,o+4)[0]
              if sh_type!=4:continue
              roff=struct.unpack_from('<Q',data,o+0x18)[0]
              rsize=struct.unpack_from('<Q',data,o+0x20)[0]
              rentsz=struct.unpack_from('<Q',data,o+0x38)[0] or 24
              for p in range(roff,roff+rsize,rentsz):
                  r_offset,r_info,r_addend=struct.unpack_from('<QQq',data,p)
                  if (r_info&0xffffffff)==8:
                      rel[r_offset]=r_addend&0xffffffffffffffff
          print(f'R_X86_64_RELATIVE_COUNT={len(rel)}')
          def qword(va):
              if va in rel:return rel[va]
              off=va_to_off(va)
              if off is None or off+8>len(data):return None
              return struct.unpack_from('<Q',data,off)[0]
          def signed_qword(va):
              v=qword(va)
              if v is None:return None
              return v-(1<<64) if v&(1<<63) else v
          def cstring(va,limit=256):
              off=va_to_off(va)
              if off is None:return None
              end=data.find(b'\0',off,min(len(data),off+limit))
              if end<0:return None
              return data[off:end].decode('utf-8','replace')
          def rtti_name(ap):
              rtti=qword(ap-8)
              if not rtti:return (rtti,None)
              np=qword(rtti+8)
              return (rtti,cstring(np) if np else None)

          print('CANONICAL_VTABLE_DUMPS_BEGIN=true')
          for name,ap in known.items():
              print(f'{name}=0x{ap:x}')
              rtti,nm=rtti_name(ap)
              print(f'VTABLE_RTTI name={name} offset_to_top={signed_qword(ap-16)} rtti={hex(rtti) if rtti is not None else "UNMAPPED"} type_name={nm or "UNKNOWN"}')
              for rel_off in range(0,0x121,8):
                  val=qword(ap+rel_off)
                  mark=' WRITER_B' if val==writer_b else ''
                  print(f'VTABLE_SLOT name={name} rel=0x{rel_off:x} value={hex(val) if val is not None else "UNMAPPED"}{mark}')
              val=qword(ap+0xd0)
              print(f'KNOWN_VTABLE_PLUS_D0 name={name} value={hex(val) if val is not None else "UNMAPPED"} equals_writer_b={int(val==writer_b)}')
          print('CANONICAL_VTABLE_DUMPS_END=true')

          # Relocation destinations whose runtime pointer is writer B.
          b_relocs=sorted(addr for addr,addend in rel.items() if addend==writer_b)
          print(f'WRITER_B_RELATIVE_RELOCATION_COUNT={len(b_relocs)}')
          print('WRITER_B_RELATIVE_RELOCATION_DESTS='+(','.join(hex(x) for x in b_relocs) if b_relocs else 'none'))

          # Search all non-executable address points whose +0xd0 slot resolves exactly to writer B.
          matches=[]
          for fs,fe,base,end,flags in loads:
              if flags&1:continue
              start=(base+7)&~7
              stop=end-0xd8
              for ap in range(start,stop,8):
                  if qword(ap+0xd0)!=writer_b:continue
                  off_top=signed_qword(ap-16)
                  rtti,nm=rtti_name(ap)
                  first=qword(ap)
                  executable_first=int(bool(first is not None and is_exec(first)))
                  plausible_top=int(off_top is not None and abs(off_top)<=0x100000)
                  plausible_rtti=int(rtti in (0,None) or bool(load_flags(rtti)))
                  matches.append((ap,off_top,rtti,nm,first,executable_first,plausible_top,plausible_rtti))
          print(f'VTABLE_PLUS_D0_WRITER_B_MATCH_COUNT={len(matches)}')
          for ap,off_top,rtti,nm,first,exec_first,pt,pr in matches:
              print(f'VTABLE_PLUS_D0_WRITER_B_MATCH address_point=0x{ap:x} offset_to_top={off_top} rtti={hex(rtti) if rtti is not None else "UNMAPPED"} type_name={nm or "UNKNOWN"} first={hex(first) if first is not None else "UNMAPPED"} first_exec={exec_first} plausible_top={pt} plausible_rtti={pr}')
              for rel_off in range(-0x10,0x121,8):
                  val=qword(ap+rel_off)
                  print(f'MATCH_SLOT address_point=0x{ap:x} rel={rel_off:+#x} value={hex(val) if val is not None else "UNMAPPED"}')

          # RIP-relative LEA xrefs to candidate address points.
          xrefs={ap:[] for ap,*_ in matches}
          for fs,fe,base,end,flags in loads:
              if not (flags&1):continue
              for p in range(fs,fe-7):
                  if not (0x40<=data[p]<=0x4f and data[p+1]==0x8d and (data[p+2]&0xc7)==0x05):continue
                  site=base+p-fs
                  target=site+7+struct.unpack_from('<i',data,p+3)[0]
                  if target in xrefs:xrefs[target].append(site)
          for ap,refs in xrefs.items():
              print(f'VTABLE_MATCH_LEA_XREFS address_point=0x{ap:x} count={len(refs)} sites={",".join(hex(x) for x in refs) if refs else "none"}')

          print('TRACK_A_RELOCATED_WRITER_VTABLE_CENSUS_COMPLETE=true')
          PY

          echo SYMBOL_PROBES_BEGIN=true
          "$gdb" -q -nx -batch "$client" -ex 'set pagination off' \
            -ex 'info symbol 0xb40630' \
            -ex 'info symbol 0x3084c70' \
            -ex 'info symbol 0x3084d40' \
            -ex 'info symbol 0x308c408' \
            -ex 'info symbol 0x2f66288' || true
          echo SYMBOL_PROBES_END=true
          echo TRACK_A_NETWORK_WRITER_VTABLE_CENSUS_COMPLETE=true
          grep -q '^TRACK_A_RELOCATED_WRITER_VTABLE_CENSUS_COMPLETE=true$' "$report"

      - name: Upload exact-version structural report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-network-writer-vtable-census-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-network-writer-vtable-census.txt
          if-no-files-found: error
          retention-days: 7

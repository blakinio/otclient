name: Track A noVNC display diagnostic

on:
  push:
    branches:
      - research/OTC-20260815-track-a-novnc-display-diagnostic
    paths:
      - .github/workflows/tibia-official-client-re-novnc-display-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Fingerprint noVNC and direct RFB candidates read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "blakinio/otclient" ]]
          [[ "$RUNNER_NAME" == "synology-otclient-01" ]]
          [[ "$GITHUB_REF_NAME" == "research/OTC-20260815-track-a-novnc-display-diagnostic" ]]
          echo TRACK_A_NOVNC_DIAGNOSTIC_RUNNER_VERIFIED=true

          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import re
          import socket
          import struct

          TIMEOUT = 4.0
          WEB_PORT = 6082
          BROWSER_HOST = "synology"
          CANDIDATE_DISPLAYS = (88, 98, 115)

          def marker(name, value):
              print(f"{name}={value}", flush=True)

          def default_ipv4_gateway():
              try:
                  rows = open("/proc/net/route", encoding="ascii").read().splitlines()[1:]
              except OSError:
                  return None
              for row in rows:
                  fields = row.split()
                  if len(fields) < 4 or fields[1] != "00000000":
                      continue
                  try:
                      flags = int(fields[3], 16)
                      raw = int(fields[2], 16)
                  except ValueError:
                      continue
                  if (flags & 0x2) and raw:
                      return socket.inet_ntoa(struct.pack("<I", raw))
              return None

          def recv_exact(sock, count):
              out = bytearray()
              while len(out) < count:
                  chunk = sock.recv(count - len(out))
                  if not chunk:
                      raise EOFError("socket closed")
                  out.extend(chunk)
              return bytes(out)

          def ws_send(sock, payload, opcode=2):
              mask = os.urandom(4)
              length = len(payload)
              head = bytearray([0x80 | opcode])
              if length < 126:
                  head.append(0x80 | length)
              elif length <= 0xFFFF:
                  head.append(0x80 | 126)
                  head.extend(struct.pack("!H", length))
              else:
                  head.append(0x80 | 127)
                  head.extend(struct.pack("!Q", length))
              head.extend(mask)
              head.extend(bytes(b ^ mask[i % 4] for i, b in enumerate(payload)))
              sock.sendall(head)

          def ws_recv(sock):
              first = recv_exact(sock, 2)
              opcode = first[0] & 0x0F
              masked = bool(first[1] & 0x80)
              length = first[1] & 0x7F
              if length == 126:
                  length = struct.unpack("!H", recv_exact(sock, 2))[0]
              elif length == 127:
                  length = struct.unpack("!Q", recv_exact(sock, 8))[0]
              mask = recv_exact(sock, 4) if masked else None
              payload = bytearray(recv_exact(sock, length))
              if mask:
                  for i in range(length):
                      payload[i] ^= mask[i % 4]
              if opcode == 8:
                  raise EOFError("websocket closed")
              if opcode == 9:
                  ws_send(sock, bytes(payload), opcode=10)
                  return ws_recv(sock)
              return opcode, bytes(payload)

          class RawStream:
              def __init__(self, sock):
                  self.sock = sock
              def read(self, count):
                  return recv_exact(self.sock, count)
              def write(self, payload):
                  self.sock.sendall(payload)

          class WSStream:
              def __init__(self, sock):
                  self.sock = sock
                  self.buf = bytearray()
              def read(self, count):
                  while len(self.buf) < count:
                      opcode, payload = ws_recv(self.sock)
                      if opcode == 1:
                          payload = base64.b64decode(payload, validate=True)
                      elif opcode != 2:
                          continue
                      self.buf.extend(payload)
                  out = bytes(self.buf[:count])
                  del self.buf[:count]
                  return out
              def write(self, payload):
                  ws_send(self.sock, payload)

          def rfb_metadata(stream):
              banner = stream.read(12)
              if not re.fullmatch(rb"RFB \d{3}\.\d{3}\n", banner):
                  raise RuntimeError("invalid RFB banner")
              stream.write(banner)
              count_raw = stream.read(1)
              count = count_raw[0]
              if count == 0:
                  reason_len = struct.unpack("!I", stream.read(4))[0]
                  _ = stream.read(min(reason_len, 1024))
                  raise RuntimeError("no security types")
              security = stream.read(count)
              if 1 not in security:
                  return {
                      "banner": banner,
                      "security": security,
                      "auth_required": True,
                      "complete": False,
                  }
              stream.write(b"\x01")
              security_result = stream.read(4)
              if security_result != b"\x00\x00\x00\x00":
                  raise RuntimeError("RFB no-auth rejected")
              stream.write(b"\x01")
              server_init = stream.read(24)
              width, height = struct.unpack("!HH", server_init[:4])
              name_len = struct.unpack("!I", server_init[20:24])[0]
              if name_len > 4096:
                  raise RuntimeError("desktop name too long")
              name = stream.read(name_len)
              fingerprint_material = banner + bytes([count]) + security + security_result + server_init + name
              return {
                  "banner": banner,
                  "security": security,
                  "auth_required": False,
                  "complete": True,
                  "width": width,
                  "height": height,
                  "pixel_format": server_init[4:20].hex(),
                  "name_sha256": hashlib.sha256(name).hexdigest(),
                  "fingerprint": hashlib.sha256(fingerprint_material).hexdigest(),
              }

          def open_websockify(host):
              sock = socket.create_connection((host, WEB_PORT), timeout=TIMEOUT)
              sock.settimeout(TIMEOUT)
              key = base64.b64encode(os.urandom(16)).decode("ascii")
              request = (
                  "GET /websockify HTTP/1.1\r\n"
                  f"Host: {BROWSER_HOST}:{WEB_PORT}\r\n"
                  "Upgrade: websocket\r\n"
                  "Connection: Upgrade\r\n"
                  f"Sec-WebSocket-Key: {key}\r\n"
                  "Sec-WebSocket-Version: 13\r\n"
                  "Sec-WebSocket-Protocol: binary\r\n"
                  f"Origin: http://{BROWSER_HOST}:{WEB_PORT}\r\n\r\n"
              ).encode("ascii")
              sock.sendall(request)
              header = bytearray()
              while b"\r\n\r\n" not in header and len(header) < 16384:
                  chunk = sock.recv(4096)
                  if not chunk:
                      break
                  header.extend(chunk)
              status_line = bytes(header).split(b"\r\n", 1)[0].decode("ascii", "replace")
              match = re.search(r"\s(\d{3})(?:\s|$)", status_line)
              status = int(match.group(1)) if match else 0
              marker("DOCKER_GATEWAY_WEBSOCKIFY_UPGRADE_STATUS", status)
              if status != 101:
                  sock.close()
                  raise RuntimeError("websocket upgrade rejected")
              return sock

          gateway = default_ipv4_gateway()
          marker("DOCKER_DEFAULT_GATEWAY_FOUND", str(bool(gateway)).lower())
          if not gateway:
              raise SystemExit("default gateway unavailable")

          web_meta = None
          try:
              web_sock = open_websockify(gateway)
              try:
                  web_meta = rfb_metadata(WSStream(web_sock))
              finally:
                  web_sock.close()
              marker("DOCKER_GATEWAY_WEBSOCKIFY_RFB_COMPLETE", str(bool(web_meta and web_meta.get("complete"))).lower())
              if web_meta and web_meta.get("complete"):
                  marker("DOCKER_GATEWAY_RFB_PROTOCOL_VERSION", web_meta["banner"].decode("ascii").strip().split(" ", 1)[1])
                  marker("DOCKER_GATEWAY_RFB_FRAMEBUFFER", f'{web_meta["width"]}x{web_meta["height"]}')
                  marker("DOCKER_GATEWAY_RFB_SECURITY_TYPES_HEX", web_meta["security"].hex())
                  marker("DOCKER_GATEWAY_RFB_PIXEL_FORMAT_SHA256", hashlib.sha256(bytes.fromhex(web_meta["pixel_format"])).hexdigest())
                  marker("DOCKER_GATEWAY_RFB_DESKTOP_NAME_SHA256", web_meta["name_sha256"])
                  marker("DOCKER_GATEWAY_RFB_FINGERPRINT_SHA256", web_meta["fingerprint"])
          except Exception as exc:
              marker("DOCKER_GATEWAY_WEBSOCKIFY_RFB_COMPLETE", "false")
              marker("DOCKER_GATEWAY_WEBSOCKIFY_ERROR_CLASS", type(exc).__name__)

          for display in CANDIDATE_DISPLAYS:
              port = 5900 + display
              prefix = f"DIRECT_RFB_DISPLAY_{display}"
              try:
                  sock = socket.create_connection((gateway, port), timeout=1.5)
                  sock.settimeout(TIMEOUT)
              except Exception as exc:
                  marker(f"{prefix}_REACHABLE", "false")
                  marker(f"{prefix}_ERROR_CLASS", type(exc).__name__)
                  continue
              marker(f"{prefix}_REACHABLE", "true")
              try:
                  meta = rfb_metadata(RawStream(sock))
                  marker(f"{prefix}_HANDSHAKE_COMPLETE", str(bool(meta.get("complete"))).lower())
                  marker(f"{prefix}_AUTH_REQUIRED", str(bool(meta.get("auth_required"))).lower())
                  if meta.get("complete"):
                      marker(f"{prefix}_PROTOCOL_VERSION", meta["banner"].decode("ascii").strip().split(" ", 1)[1])
                      marker(f"{prefix}_FRAMEBUFFER", f'{meta["width"]}x{meta["height"]}')
                      marker(f"{prefix}_SECURITY_TYPES_HEX", meta["security"].hex())
                      marker(f"{prefix}_PIXEL_FORMAT_SHA256", hashlib.sha256(bytes.fromhex(meta["pixel_format"])).hexdigest())
                      marker(f"{prefix}_DESKTOP_NAME_SHA256", meta["name_sha256"])
                      marker(f"{prefix}_FINGERPRINT_SHA256", meta["fingerprint"])
                      match = bool(web_meta and web_meta.get("complete") and meta["fingerprint"] == web_meta["fingerprint"])
                      marker(f"{prefix}_FINGERPRINT_MATCH_WEBSOCKIFY", str(match).lower())
              except Exception as exc:
                  marker(f"{prefix}_HANDSHAKE_COMPLETE", "false")
                  marker(f"{prefix}_HANDSHAKE_ERROR_CLASS", type(exc).__name__)
              finally:
                  sock.close()

          displays = []
          try:
              for entry in os.listdir("/tmp/.X11-unix"):
                  match = re.fullmatch(r"X(\d+)", entry)
                  if match:
                      displays.append(int(match.group(1)))
          except FileNotFoundError:
              pass
          displays = sorted(set(displays))
          marker("X11_SOCKET_DISPLAY_COUNT", len(displays))
          marker("X11_SOCKET_DISPLAYS", ",".join(f":{d}" for d in displays) if displays else "none")
          marker("TRACK_A_NOVNC_DIRECT_RFB_FINGERPRINT_PROBE_COMPLETE", "true")
          PY

name: Track A bounded one-shot native login v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-one-shot-native-login-v2.yml

permissions:
  contents: read

concurrency:
  group: track-a-bounded-one-shot-native-login
  cancel-in-progress: false

env:
  EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
  EXPECTED_SIZE: '52109920'
  CONTAINER: otclient-track-a-kasmvnc
  CLIENT: /home/kasm-user/otclient-track-a/Tibia-32177065988-1/bin/client
  TASK_ROOT: /tmp/otclient-native-login-current-sha
  BRIDGE_SOCKET: /tmp/otclient-native-login-current-sha/bridge.sock
  AUTH_SOCKET: /tmp/otclient-native-login-current-sha/auth.sock
  CHARACTER_SOCKET: /tmp/otclient-native-login-current-sha/character.sock
  CLIENT_VERSION: 15.32.current.ed5469
  TARGETS: player_protocol_handler,30bf620,tibia::game::TPlayerProtocolMessageHandler;gameserver_game_session,30aff80,tibia::game::TGameserverGameSession;worldmap_handler,30c01d0,tibia::worldmap::TWorldmapProtocolMessageHandler

jobs:
  login:
    runs-on: [otclient, synology]
    timeout-minutes: 8
    steps:
      - name: Verify resumed helper runtime before secret access
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          test "$(docker inspect "$CONTAINER" --format '{{.State.Status}}')" = running
          pid="$(docker exec -u kasm-user "$CONTAINER" pgrep -x client)"
          [[ "$pid" =~ ^[0-9]+$ ]]
          test "$(docker exec -u kasm-user "$CONTAINER" stat -Lc %s /proc/$pid/exe)" = "$EXPECTED_SIZE"
          test "$(docker exec -u kasm-user "$CONTAINER" sha256sum /proc/$pid/exe | awk '{print $1}')" = "$EXPECTED_SHA"
          for s in "$BRIDGE_SOCKET" "$AUTH_SOCKET" "$CHARACTER_SOCKET"; do docker exec -u kasm-user "$CONTAINER" test -S "$s"; done
          docker exec -u kasm-user "$CONTAINER" sh -lc "tr '\\0' '\\n' </proc/$pid/environ | grep -Fxq 'LD_PRELOAD=$TASK_ROOT/bridge.so:$TASK_ROOT/auth.so:$TASK_ROOT/character.so'"
          docker exec -u kasm-user "$CONTAINER" sh -lc "! tr '\\0' '\\n' </proc/$pid/environ | grep -Eq '^TIBIA_TEST_(EMAIL|PASSWORD)='"
          printf '%s\n' "$pid" > "$RUNNER_TEMP/native-login-pid"
          echo RESUMED_HELPER_RUNTIME=PASS
          echo SECRET_ACCESS=false

      - name: Bounded one-shot native authentication
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          test -n "${TIBIA_TEST_EMAIL:-}"
          test -n "${TIBIA_TEST_PASSWORD:-}"
          pid="$(cat "$RUNNER_TEMP/native-login-pid")"
          set +e
          docker exec -i -u kasm-user -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD "$CONTAINER" \
            "$TASK_ROOT/secret-ingress" "$AUTH_SOCKET" "$pid" >"$RUNNER_TEMP/auth.out" 2>&1
          rc=$?
          set -e
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          if [[ $rc -eq 0 ]] && grep -Fq 'NATIVE_AUTH_DISPATCH=PASS' "$RUNNER_TEMP/auth.out"; then
            echo NATIVE_AUTH_INGRESS=PASS_RESPONSE
          elif grep -Fq 'NATIVE_AUTH_RESPONSE_FAILED' "$RUNNER_TEMP/auth.out"; then
            echo NATIVE_AUTH_INGRESS=PASS_WITH_PROCESS_HANDOFF
          else
            echo NATIVE_AUTH_INGRESS=FAIL
            sed -n 's/^current secret ingress error: /INGRESS_ERROR=/p' "$RUNNER_TEMP/auth.out"
            exit 2
          fi
          echo SECRET_VALUES_LOGGED=false
          echo SECOND_SECRET_ATTEMPT=false

      - name: Restore current-SHA helpers after native handoff without credentials
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          sleep 2
          readarray -t pids < <(docker exec -i -u kasm-user -e CLIENT="$CLIENT" "$CONTAINER" python3 - <<'PY'
          import os,pathlib
          expected=os.path.realpath(os.environ['CLIENT'])
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try: x=os.path.realpath(str(p/'exe'))
              except OSError: continue
              if x==expected: print(p.name)
          PY
          )
          test "${#pids[@]}" = 1
          pid="${pids[0]}"
          restore=1
          if docker exec -u kasm-user "$CONTAINER" test -S "$BRIDGE_SOCKET" && docker exec -u kasm-user "$CONTAINER" test -S "$CHARACTER_SOCKET"; then
            if docker exec -u kasm-user "$CONTAINER" sh -lc "tr '\\0' '\\n' </proc/$pid/environ | grep -Fxq 'LD_PRELOAD=$TASK_ROOT/bridge.so:$TASK_ROOT/auth.so:$TASK_ROOT/character.so'"; then restore=0; fi
          fi
          if [[ $restore -eq 1 ]]; then
            test "$(docker exec -u kasm-user "$CONTAINER" stat -Lc %s /proc/$pid/exe)" = "$EXPECTED_SIZE"
            test "$(docker exec -u kasm-user "$CONTAINER" sha256sum /proc/$pid/exe | awk '{print $1}')" = "$EXPECTED_SHA"
            docker exec -u kasm-user "$CONTAINER" kill -TERM "$pid"
            for _ in $(seq 1 80); do docker exec "$CONTAINER" test ! -d "/proc/$pid" && break; sleep .1; done
            docker exec "$CONTAINER" test ! -d "/proc/$pid"
            docker exec -u kasm-user "$CONTAINER" rm -f "$BRIDGE_SOCKET" "$AUTH_SOCKET" "$CHARACTER_SOCKET"
            dir="${CLIENT%/client}"; preload="$TASK_ROOT/bridge.so:$TASK_ROOT/auth.so:$TASK_ROOT/character.so"
            docker exec -d -u kasm-user -w "$dir" -e HOME=/home/kasm-user -e DISPLAY=:1 -e XAUTHORITY=/home/kasm-user/.Xauthority \
              -e LD_LIBRARY_PATH="$dir:$dir/lib" -e LD_PRELOAD="$preload" \
              -e OTCLIENT_TIBIA_RE_SOCKET="$BRIDGE_SOCKET" -e OTCLIENT_TIBIA_RE_AUTH_SOCKET="$AUTH_SOCKET" \
              -e OTCLIENT_TIBIA_RE_CHARACTER_SOCKET="$CHARACTER_SOCKET" -e OTCLIENT_TIBIA_RE_CLIENT_VERSION="$CLIENT_VERSION" \
              -e OTCLIENT_TIBIA_RE_BINARY_SHA256="$EXPECTED_SHA" -e OTCLIENT_TIBIA_RE_TARGETS="$TARGETS" "$CONTAINER" ./client
          fi
          for _ in $(seq 1 120); do docker exec -u kasm-user "$CONTAINER" test -S "$BRIDGE_SOCKET" && docker exec -u kasm-user "$CONTAINER" test -S "$CHARACTER_SOCKET" && break; sleep .25; done
          docker exec -u kasm-user "$CONTAINER" test -S "$BRIDGE_SOCKET"
          docker exec -u kasm-user "$CONTAINER" test -S "$CHARACTER_SOCKET"
          pid="$(docker exec -u kasm-user "$CONTAINER" pgrep -x client)"; [[ "$pid" =~ ^[0-9]+$ ]]
          test "$(docker exec -u kasm-user "$CONTAINER" stat -Lc %s /proc/$pid/exe)" = "$EXPECTED_SIZE"
          test "$(docker exec -u kasm-user "$CONTAINER" sha256sum /proc/$pid/exe | awk '{print $1}')" = "$EXPECTED_SHA"
          docker exec -u kasm-user "$CONTAINER" sh -lc "! tr '\\0' '\\n' </proc/$pid/environ | grep -Eq '^TIBIA_TEST_(EMAIL|PASSWORD)='"
          printf '%s\n' "$pid" > "$RUNNER_TEMP/native-login-pid"
          echo POST_AUTH_HELPER_RESTORE=PASS
          echo SECOND_SECRET_ATTEMPT=false

      - name: Native singleton confirmation if not already in game
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          pid="$(cat "$RUNNER_TEMP/native-login-pid")"
          docker exec -i -u kasm-user -e BSOCK="$BRIDGE_SOCKET" -e CSOCK="$CHARACTER_SOCKET" -e EXPECTED_PID="$pid" "$CONTAINER" python3 - <<'PY'
          import json,os,socket,struct,time
          expected=int(os.environ['EXPECTED_PID'])
          def call(path,cmd):
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(5); s.connect(path)
              pid,uid,gid=struct.unpack('3i',s.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12)); assert pid==expected and uid==os.geteuid()
              s.sendall(cmd.encode()+b'\n'); raw=b''
              while b'\n' not in raw: raw+=s.recv(4096)
              s.close(); return json.loads(raw.split(b'\n',1)[0])
          names=('player_protocol_handler','gameserver_game_session','worldmap_handler')
          try:
              if all(call(os.environ['BSOCK'],'DISCOVER '+n).get('validated_hits')==1 for n in names):
                  print('CHARACTER_CONFIRM=NOT_NEEDED_ALREADY_IN_GAME'); raise SystemExit(0)
          except OSError: pass
          state={}
          for _ in range(120):
              try: state=call(os.environ['CSOCK'],'STATE')
              except (OSError,AssertionError): state={}
              count=state.get('character_count',-1) if state.get('ok') else -1
              if isinstance(count,int) and count>0: break
              time.sleep(.5)
          count=state.get('character_count',-1)
          print('NATIVE_CHARACTER_COUNT='+str(count))
          if count!=1: raise SystemExit(78)
          r=call(os.environ['CSOCK'],'CONFIRM_UNIQUE')
          assert r.get('ok') and r.get('confirmation_dispatched') and r.get('character_index')==0
          print('NATIVE_CHARACTER_CONFIRM=PASS')
          PY

      - name: Prove structural IN_GAME
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          pid="$(cat "$RUNNER_TEMP/native-login-pid")"
          docker exec -i -u kasm-user -e SOCKET="$BRIDGE_SOCKET" -e EXPECTED_PID="$pid" "$CONTAINER" python3 - <<'PY'
          import json,os,socket,struct,time
          path=os.environ['SOCKET']; expected=int(os.environ['EXPECTED_PID'])
          def call(cmd):
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(5); s.connect(path)
              pid,uid,gid=struct.unpack('3i',s.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12)); assert pid==expected and uid==os.geteuid()
              s.sendall(cmd.encode()+b'\n'); raw=b''
              while b'\n' not in raw: raw+=s.recv(4096)
              s.close(); return json.loads(raw.split(b'\n',1)[0])
          names=('player_protocol_handler','gameserver_game_session','worldmap_handler'); last={}
          for _ in range(120):
              try: last={n:call('DISCOVER '+n) for n in names}
              except (OSError,AssertionError): time.sleep(1); continue
              if all(d.get('ok') and d.get('validated_hits')==1 for d in last.values()):
                  print('RESULT=SUCCESS')
                  print('CHARACTER_ACTUALLY_LOGGED_INTO_GAME=YES')
                  print('CAUSAL_PROOF=COMPLETE')
                  print('STRUCTURAL_IN_GAME=PASS')
                  print('SECOND_SECRET_ATTEMPT=false')
                  raise SystemExit(0)
              time.sleep(1)
          print('STRUCTURAL_IN_GAME=FAIL')
          for n in names: print(n.upper()+'_HITS='+str(last.get(n,{}).get('validated_hits','UNKNOWN')))
          raise SystemExit(2)
          PY
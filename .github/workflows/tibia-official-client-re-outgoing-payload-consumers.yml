name: Track A outgoing payload consumer provenance

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-outgoing-payload-consumers.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: "51965216"
    steps:
      - name: Trace concrete outbound consumer, framing and write provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          [[ -x "$client" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          gdb="$toolroot/usr/bin/gdb"
          [[ -x "$gdb" ]]
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          report="$RUNNER_TEMP/track-a-outgoing-payload-consumers.txt"
          targets="$RUNNER_TEMP/track-a-outgoing-payload-targets.txt"
          : >"$report"; : >"$targets"
          exec > >(tee -a "$report") 2>&1

          echo 'TRACK_A_OUTGOING_PAYLOAD_CONSUMERS_BEGIN=true'
          echo "CLIENT_SHA256=$EXPECTED_CLIENT_SHA256"
          echo "CLIENT_SIZE=$EXPECTED_CLIENT_SIZE"
          echo 'PRIMARY_OWNER_VTABLE=0x308c408'
          echo 'PRIMARY_SLOT_90=0x8409d0'
          echo 'SUBOBJECT_VTABLE=0x2f66288'
          echo 'SUBOBJECT_SLOT_B8=0xb5b880'
          echo 'DOWNSTREAM_HELPER_ROOT=0xb222a0'

          python3 -u - "$client" "$targets" <<'PY'
          import struct,sys
          path,target_path=sys.argv[1:]
          data=open(path,'rb').read()
          phoff=struct.unpack_from('<Q',data,0x20)[0]
          phentsz=struct.unpack_from('<H',data,0x36)[0]
          phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,fo,va,_,fsz,msz,_=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1 and fsz:
                  loads.append((fo,fo+fsz,va,va+msz,flags))
          def off_to_va(off):
              for fs,fe,va,vend,flags in loads:
                  if fs<=off<fe:return va+(off-fs)
          def va_to_off(va):
              for fs,fe,base,vend,flags in loads:
                  if base<=va<base+(fe-fs):return fs+(va-base)
          def flags_at(va):
              for fs,fe,base,vend,flags in loads:
                  if base<=va<vend:return flags
              return 0
          exec_segments=[x for x in loads if x[4]&1]
          print('ELF_EXEC_SEGMENTS='+str(len(exec_segments)))

          needles=[
              b'OutGoingMessagePayload',b'OutgoingMessagePayload',b'MessageBody',
              b'SerializeWithCachedSizesToArray',b'SerializeToArray',b'ByteSizeLong',
              b'QIODevice',b'QAbstractSocket',b'QTcpSocket',b'writeData'
          ]
          string_vas={}
          for needle in needles:
              positions=[]; start=0
              while True:
                  p=data.find(needle,start)
                  if p<0:break
                  va=off_to_va(p)
                  if va is not None:positions.append(va)
                  start=p+1
              string_vas[needle]=positions
              print(f'STRING needle={needle.decode(errors="replace")} count={len(positions)} vas={",".join(hex(x) for x in positions[:32]) if positions else "none"}')

          # Direct RIP-relative LEA/MOV references to selected literal addresses.
          wanted={va for vals in string_vas.values() for va in vals}
          xrefs={va:[] for va in wanted}
          for fs,fe,base,vend,flags in exec_segments:
              blob=data[fs:fe]
              for p in range(0,max(0,len(blob)-7)):
                  # REX + LEA/MOV r64,[RIP+disp32], any register destination.
                  if not (0x40<=blob[p]<=0x4f and blob[p+1] in (0x8d,0x8b)):
                      continue
                  modrm=blob[p+2]
                  if (modrm & 0xc7) != 0x05:
                      continue
                  site=base+p
                  target=(site+7+struct.unpack_from('<i',blob,p+3)[0]) & 0xffffffffffffffff
                  if target in xrefs:xrefs[target].append(site)
          for va,sites in sorted(xrefs.items()):
              if sites:
                  print(f'LITERAL_XREF target=0x{va:x} count={len(sites)} sites={",".join(hex(x) for x in sites[:64])}')

          # Bounded direct-call census around the concrete downstream targets.
          windows=[
              ('primary_slot90',0x8409d0,0x140),
              ('subobject_slot_b8',0xb5b880,0x1000),
              ('downstream_helper',0xb222a0,0x1400),
          ]
          unique=[]
          for name,start,size in windows:
              o=va_to_off(start)
              calls=[]
              if o is not None:
                  blob=data[o:o+size]
                  for p,b in enumerate(blob[:-4]):
                      if b!=0xe8:continue
                      site=start+p
                      target=(site+5+struct.unpack_from('<i',blob,p+1)[0]) & 0xffffffffffffffff
                      calls.append((site,target,bool(flags_at(target)&1)))
                      if target not in unique:unique.append(target)
              print(f'DIRECT_CALL_WINDOW name={name} start=0x{start:x} size=0x{size:x} count={len(calls)}')
              for site,target,is_exec in calls[:256]:
                  print(f'DIRECT_CALL window={name} site=0x{site:x} target=0x{target:x} executable={str(is_exec).lower()}')
          with open(target_path,'w') as f:
              for t in unique[:96]:
                  if flags_at(t)&1:f.write(hex(t)+'\n')
          print(f'UNIQUE_EXEC_DIRECT_TARGETS={sum(1 for t in unique if flags_at(t)&1)}')
          PY

          echo 'GDB_DYNAMIC_SYMBOL_QUERIES_BEGIN=true'
          for pattern in \
            'SerializeWithCachedSizesToArray' \
            'SerializeToArray' \
            'ByteSizeLong' \
            'QIODevice::write' \
            'QIODevice::writeData' \
            'QAbstractSocket::writeData' \
            'QTcpSocket' \
            'writeData'; do
            echo "GDB_INFO_FUNCTIONS_PATTERN=$pattern"
            "$gdb" -q -nx -batch "$client" -ex 'set pagination off' -ex "info functions $pattern" || true
          done
          echo 'GDB_DYNAMIC_SYMBOL_QUERIES_END=true'

          for spec in \
            'primary_slot90:0x840980:0x840a40' \
            'subobject_slot_b8:0xb5b700:0xb5c900' \
            'downstream_helper:0xb22180:0xb23800'; do
            name=${spec%%:*}; rest=${spec#*:}; lo=${rest%%:*}; hi=${rest##*:}
            echo "ROOT_DISASSEMBLY_BEGIN name=$name lo=$lo hi=$hi"
            "$gdb" -q -nx -batch "$client" \
              -ex 'set pagination off' -ex 'set disassembly-flavor intel' \
              -ex "disassemble /r $lo,$hi" || true
            echo "ROOT_DISASSEMBLY_END name=$name"
          done

          count=0
          while IFS= read -r target; do
            [[ "$target" =~ ^0x[0-9a-f]+$ ]] || continue
            (( count += 1 ))
            (( count <= 48 )) || break
            lo=$(printf '0x%x' $((target-48))); hi=$(printf '0x%x' $((target+224)))
            echo "DIRECT_TARGET_DISASSEMBLY_BEGIN target=$target"
            "$gdb" -q -nx -batch "$client" \
              -ex 'set pagination off' -ex 'set disassembly-flavor intel' \
              -ex "disassemble /r $lo,$hi" || true
            echo "DIRECT_TARGET_DISASSEMBLY_END target=$target"
          done < "$targets"

          echo 'TRACK_A_OUTGOING_PAYLOAD_CONSUMERS_COMPLETE=true'
          grep -q '^TRACK_A_OUTGOING_PAYLOAD_CONSUMERS_COMPLETE=true$' "$report"

      - name: Upload exact-version provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-outgoing-payload-consumers-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-outgoing-payload-consumers.txt
          if-no-files-found: error
          retention-days: 7

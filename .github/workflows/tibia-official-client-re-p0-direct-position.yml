name: Track A P0 direct player position

on:
  push:
    branches:
      - research/OTC-20260815-track-a-p0-direct-position
    paths:
      - .github/workflows/tibia-official-client-re-p0-direct-position.yml
      - .github/scripts/tibia-official-client-re-p0-direct-position.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-p0-direct-position-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-static-position-re:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_BRANCH: research/OTC-20260815-track-a-p0-direct-position
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_TPLAYERDATA_PRIMARY_VPTR_OFFSET: '0x308ca70'
      OFFICIAL_LINUX_ARCHIVE_URL: https://static.tibia.com/download/tibia.x64.tar.gz
    steps:
      - name: Checkout exact Draft head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Verify hosted no-runtime boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_HEAD_BRANCH" ]]
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$RUNNER_ARCH" == X64 ]]
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          python3 -m py_compile .github/scripts/tibia-official-client-re-p0-direct-position.py
          command -v objdump
          echo TRACK_A_P0_EXECUTION_CLASS=github_hosted
          echo TRACK_A_P0_RUNTIME_ACCESS=none
          echo TRACK_A_P0_SYNOLOGY_EXECUTION=false
          echo TRACK_A_P0_PHYSICAL_E2E=false

      - name: Materialize exact official client read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          out=artifacts/p0-hosted-static
          mkdir -p "$out"
          archive="$RUNNER_TEMP/tibia.x64.tar.gz"
          client="$RUNNER_TEMP/tibia-static-client"

          # Historical AUR packaging required a same-URL Referer for this official
          # endpoint. This is a new bounded retrieval hypothesis after the prior
          # User-Agent-only hosted attempt returned HTTP 403.
          if ! curl --fail --silent --show-error --location \
              --retry 1 --retry-all-errors --connect-timeout 20 --max-time 900 \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' \
              --referer "$OFFICIAL_LINUX_ARCHIVE_URL" \
              "$OFFICIAL_LINUX_ARCHIVE_URL" --output "$archive"; then
            {
              echo P0_HOSTED_INPUT_STATUS=INPUT_BLOCKED
              echo P0_HOSTED_INPUT_REASON=official_archive_download_failed_with_same_url_referer
              echo "P0_HOSTED_INPUT_URL=$OFFICIAL_LINUX_ARCHIVE_URL"
            } | tee "$out/input-status.txt"
            exit 3
          fi

          python3 - "$archive" "$client" "$out/archive-members.txt" <<'PY'
          import shutil
          import sys
          import tarfile
          from pathlib import PurePosixPath

          archive, target, listing = sys.argv[1:]
          with tarfile.open(archive, mode='r:*') as tf:
              safe = []
              candidates = []
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      continue
                  safe.append(f"{member.size}\t{member.name}")
                  if member.isfile() and len(path.parts) >= 2 and path.parts[-2:] == ('bin', 'client'):
                      candidates.append(member)
              open(listing, 'w', encoding='utf-8').write('\n'.join(safe[:400]) + '\n')
              if len(candidates) != 1:
                  raise SystemExit(f'P0_HOSTED_INPUT_BLOCKED=client_member_count:{len(candidates)}')
              src = tf.extractfile(candidates[0])
              if src is None:
                  raise SystemExit('P0_HOSTED_INPUT_BLOCKED=client_member_unreadable')
              with src, open(target, 'wb') as dst:
                  shutil.copyfileobj(src, dst, length=1024 * 1024)
              print(f'P0_HOSTED_CLIENT_MEMBER={candidates[0].name}')
          PY

          size="$(stat -c '%s' "$client")"
          sha="$(sha256sum "$client" | awk '{print $1}')"
          {
            echo "P0_HOSTED_INPUT_SIZE=$size"
            echo "P0_HOSTED_INPUT_SHA256=$sha"
            echo "P0_HOSTED_EXPECTED_SIZE=$EXPECTED_CLIENT_SIZE"
            echo "P0_HOSTED_EXPECTED_SHA256=$EXPECTED_CLIENT_SHA256"
          } | tee "$out/input-status.txt"
          if [[ "$size" != "$EXPECTED_CLIENT_SIZE" || "$sha" != "$EXPECTED_CLIENT_SHA256" ]]; then
            echo P0_HOSTED_INPUT_STATUS=INPUT_BLOCKED | tee -a "$out/input-status.txt"
            echo P0_HOSTED_INPUT_REASON=exact_client_fence_mismatch | tee -a "$out/input-status.txt"
            exit 3
          fi
          echo P0_HOSTED_INPUT_STATUS=EXACT_FENCE_VERIFIED | tee -a "$out/input-status.txt"
          echo "TRACK_A_P0_CLIENT=$client" >> "$GITHUB_ENV"

      - name: Analyze TPlayerData and playerPosition code site
        shell: bash
        run: |
          set -Eeuo pipefail
          out=artifacts/p0-hosted-static
          python3 .github/scripts/tibia-official-client-re-p0-direct-position.py \
            --static-only \
            --client "$TRACK_A_P0_CLIENT" \
            --expected-sha256 "$EXPECTED_CLIENT_SHA256" \
            --expected-size "$EXPECTED_CLIENT_SIZE" \
            --vptr-offset "$EXPECTED_TPLAYERDATA_PRIMARY_VPTR_OFFSET" \
            --static-vtable-slots 32 \
            --static-xref-limit 64 \
            --static-disasm-limit 24 \
            | tee "$out/static-elf-re.txt"

          objdump -d -Mintel --no-show-raw-insn \
            --start-address=0x836500 --stop-address=0x836a00 \
            "$TRACK_A_P0_CLIENT" > "$out/player-position-disasm.txt"

          grep -Fxq 'TRACK_A_P0_EXACT_CLIENT_FENCE=true' "$out/static-elf-re.txt"
          grep -Fxq 'TRACK_A_P0_STATIC_PROBE_COMPLETE=true' "$out/static-elf-re.txt"
          grep -Eq '^ *8367c1:' "$out/player-position-disasm.txt"
          grep -Eiq '1cdde3f' "$out/player-position-disasm.txt"
          echo TRACK_A_P0_HOSTED_STATIC_RE_COMPLETE=true | tee "$out/result.txt"

      - name: Remove proprietary input before upload
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$RUNNER_TEMP/tibia-static-client" "$RUNNER_TEMP/tibia.x64.tar.gz"
          test ! -e "$RUNNER_TEMP/tibia-static-client"
          test ! -e "$RUNNER_TEMP/tibia.x64.tar.gz"

      - name: Upload sanitized derived evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-p0-hosted-static-${{ github.run_id }}
          path: artifacts/p0-hosted-static/**
          if-no-files-found: error
          retention-days: 7

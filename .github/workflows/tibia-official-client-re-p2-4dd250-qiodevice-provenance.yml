name: Track A P2 4dd250 QIODevice provenance

on:
  push:
    branches:
      - research/OTC-20260817-track-a-p2-4dd250-qiodevice-provenance
    paths:
      - .github/workflows/tibia-official-client-re-p2-4dd250-qiodevice-provenance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-p2-4dd250-qiodevice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Stage exact-file TCP-to-writer bridge bytes
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-p2-4dd250-qiodevice-provenance
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    outputs:
      bridge_hex: ${{ steps.stage.outputs.bridge_hex }}
      bridge_sha256: ${{ steps.stage.outputs.bridge_sha256 }}
    steps:
      - id: stage
        name: Exact-fence and copy one bridge window
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 61
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 62
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]] || exit 63
          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          for candidate in "${candidates[@]}"; do
            [[ -f "$candidate" && ! -L "$candidate" ]] || continue
            [[ "$(stat -c %s "$candidate")" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            if python3 - "$candidate" "$EXPECTED_CLIENT_SHA256" <<'PY'
          import hashlib,sys
          h=hashlib.sha256()
          with open(sys.argv[1],'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
          raise SystemExit(h.hexdigest()!=sys.argv[2])
          PY
            then source_client="$candidate"; break; fi
          done
          [[ -n "$source_client" ]] || exit 50
          python3 - "$source_client" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,struct,sys
          from pathlib import Path
          p=Path(sys.argv[1]); out=Path(sys.argv[2]); start=0xb4ae90; end=0xb4b290
          with p.open('rb') as f:
              ident=f.read(16); rest=f.read(48)
              if ident[:4]!=b'\x7fELF' or ident[4]!=2 or ident[5]!=1: raise SystemExit(51)
              fs=struct.unpack('<HHIQQQIHHHHHH',rest); phoff,phentsize,phnum=fs[4],fs[8],fs[9]
              data=None
              for i in range(phnum):
                  f.seek(phoff+i*phentsize); r=f.read(56)
                  t,flags,off,va,_pa,sz,_msz,_al=struct.unpack('<IIQQQQQQ',r)
                  if t==1 and (flags&1) and va<=start and end<=va+sz:
                      f.seek(off+start-va); data=f.read(end-start); break
          if data is None or len(data)!=end-start: raise SystemExit(52)
          dig=hashlib.sha256(data).hexdigest()
          with out.open('a') as f: f.write(f'bridge_hex={data.hex()}\nbridge_sha256={dig}\n')
          print('P2_4DD250_BRIDGE_SOURCE=PASS')
          print('P2_4DD250_CLIENT_VERSION=15.32.df7b29')
          print('P2_4DD250_CLIENT_SIZE=51965216')
          print('P2_4DD250_CLIENT_SHA256=e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe')
          print(f'P2_4DD250_BRIDGE_WINDOW=0x{start:x}..0x{end:x}')
          print(f'P2_4DD250_BRIDGE_SHA256={dig}')
          print('P2_4DD250_RUNTIME_ACCESS=none')
          print('P2_4DD250_SOURCE_DISASSEMBLY=false')
          print('P2_4DD250_SOURCE_SEMANTIC_CLASSIFICATION=false')
          print('P2_4DD250_CLIENT_PROCESS_ACCESSED=false')
          print('P2_4DD250_PROCESS_MEMORY_ACCESSED=false')
          print('P2_4DD250_RAW_CLIENT_UPLOADED=false')
          PY

  hosted-validate:
    name: Decode TCP-to-writer bridge on GitHub-hosted Linux
    needs: source-sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-p2-4dd250-qiodevice-provenance
      BRIDGE_HEX: ${{ needs.source-sanitize.outputs.bridge_hex }}
      BRIDGE_SHA256: ${{ needs.source-sanitize.outputs.bridge_sha256 }}
    steps:
      - name: Verify and disassemble exact bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 71
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 72
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || exit 73
          python3 - <<'PY'
          import hashlib,os,subprocess,tempfile
          from pathlib import Path
          start=0xb4ae90; end=0xb4b290; d=bytes.fromhex(os.environ['BRIDGE_HEX'])
          if len(d)!=end-start or hashlib.sha256(d).hexdigest()!=os.environ['BRIDGE_SHA256']: raise SystemExit(74)
          with tempfile.TemporaryDirectory() as td:
              p=Path(td)/'bridge.bin';p.write_bytes(d)
              text=subprocess.run(['objdump','-D','-b','binary','-m','i386:x86-64','-M','intel',f'--adjust-vma=0x{start:x}',str(p)],check=True,text=True,stdout=subprocess.PIPE).stdout
          required=['b4aece:','b4aee1:','b4b1ee:','b4b1f2:','b4b1f6:','b4b230:','b4b253:','b4b26f:','b4b273:']
          for x in required:
              if x not in text: raise SystemExit('P2_4DD250_FAIL=anchor_'+x)
          print('P2_4DD250_BRIDGE_HOSTED=PASS')
          print('P2_4DD250_CLIENT_VERSION=15.32.df7b29')
          print('P2_4DD250_CLIENT_SIZE=51965216')
          print('P2_4DD250_CLIENT_SHA256=e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe')
          print('P2_4DD250_EXECUTION_CLASS=github_hosted')
          print('P2_4DD250_RUNTIME_ACCESS=none')
          print('P2_4DD250_BRIDGE_DISASSEMBLY_BEGIN');print(text,end='');print('P2_4DD250_BRIDGE_DISASSEMBLY_END')
          PY

name: Track A P2 buffer downstream consumer

on:
  push:
    branches: [research/OTC-20260815-track-a-p2-buffer-downstream-consumer]
    paths:
      - .github/workflows/tibia-official-client-re-p2-buffer-downstream-consumer.yml
      - .github/scripts/tibia-official-client-re-p2-buffer-downstream-consumer.py
      - docs/agents/evidence/OTC-20260815-track-a-p2-buffer-downstream-consumer/**
      - docs/agents/tasks/active/OTC-20260815-track-a-p2-buffer-downstream-consumer.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardened-post-serialization-chain:
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_HEAD_BRANCH: research/OTC-20260815-track-a-p2-buffer-downstream-consumer
    steps:
      - name: Checkout exact Draft head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Verify exact client and static tool context
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_HEAD_BRANCH" ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$RUNNER_OS" == Linux ]]
          python3 -m py_compile .github/scripts/tibia-official-client-re-p2-buffer-downstream-consumer.py

          client=''
          state=''
          for candidate in /work/_otclient_tibia_re_state /home/runner/_work/_otclient_tibia_re_state; do
            probe="$candidate/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
            [[ -x "$probe" ]] || continue
            size="$(stat -c '%s' "$probe")"
            sha="$(sha256sum "$probe" | awk '{print $1}')"
            if [[ "$size" == "$EXPECTED_CLIENT_SIZE" && "$sha" == "$EXPECTED_CLIENT_SHA256" ]]; then
              client="$probe"; state="$candidate"; break
            fi
          done
          [[ -n "$client" && -n "$state" ]]

          objdump="$(command -v objdump || true)"
          if [[ -z "$objdump" ]]; then
            pinned="$state/toolroot/usr/bin/objdump"
            [[ -x "$pinned" ]]
            wrapper="$RUNNER_TEMP/track-a-p2-downstream-objdump"
            cat > "$wrapper" <<SH
          #!/usr/bin/env bash
          exec env LD_LIBRARY_PATH="$state/toolroot/usr/lib/x86_64-linux-gnu:$state/toolroot/lib/x86_64-linux-gnu" "$pinned" "\$@"
          SH
            chmod 700 "$wrapper"
            objdump="$wrapper"
          fi
          [[ -n "$objdump" && -x "$objdump" ]]
          "$objdump" --version >/dev/null
          {
            echo "TRACK_A_P2_CLIENT=$client"
            echo "TRACK_A_P2_OBJDUMP=$objdump"
          } >> "$GITHUB_ENV"
          echo "TRACK_A_P2_DOWNSTREAM_EXACT_HEAD=$GITHUB_SHA"
          echo TRACK_A_P2_DOWNSTREAM_EXACT_CLIENT_VERIFIED=true

      - name: Prove persistent QBuffer downstream processor chain
        shell: bash
        run: |
          set -Eeuo pipefail
          out=artifacts/p2-buffer-downstream-consumer
          mkdir -p "$out"
          python3 .github/scripts/tibia-official-client-re-p2-buffer-downstream-consumer.py \
            --client "$TRACK_A_P2_CLIENT" \
            --objdump "$TRACK_A_P2_OBJDUMP" \
            --output-json "$out/result.json" \
            --output-text "$out/result.txt" \
            --evidence "$out/evidence.txt" \
            | tee "$out/validation.log"

          grep -Fxq 'P2_DOWNSTREAM_COMPLETE=true' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_RESULT=POST_SERIALIZATION_PROCESSOR_CHAIN_PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_PERSISTENT_QBUFFER_DIRECT_READALL=PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_FIRST_CONSUMER=PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_FIRST_TRANSFORM=PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_SAME_MESSAGE_TO_DUALCONNECTION=PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_PROTOCOL_STAGE_ORDER=PROVEN_PARTIAL' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_PROTOCOL_FRAMING=UNKNOWN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_FINAL_BINARY_EGRESS=UNKNOWN' "$out/validation.log"

          python3 - "$out/result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['schema_version']==3
          assert d['exact_client']['sha256']=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          assert d['exact_client']['size']==51965216
          assert d['semantic_result']=='POST_SERIALIZATION_PROCESSOR_CHAIN_PROVEN'
          c=d['classification']
          assert c['persistent_qbuffer_direct_readall']=='PROVEN'
          assert c['first_downstream_consumer'].startswith('PROVEN:')
          assert c['first_downstream_transform'].startswith('PROVEN:')
          assert c['same_message_handoff_to_dualconnection']=='PROVEN'
          assert c['protocol_stage_order']=='PROVEN_PARTIAL'
          for k in ('framing','sequence','compression','encryption','final_binary_egress','causal_local_harness'):
              assert c[k]=='UNKNOWN'
          n=d['negative_controls']
          assert not any(n.values())
          PY
          echo TRACK_A_P2_DOWNSTREAM_HARDENED_VALIDATED=true

      - name: Upload sanitized static evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-p2-buffer-downstream-consumer-${{ github.run_id }}
          path: artifacts/p2-buffer-downstream-consumer/**
          if-no-files-found: error
          retention-days: 7

name: Track A P2 buffer downstream consumer

on:
  push:
    branches: [research/OTC-20260815-track-a-p2-buffer-downstream-consumer]
    paths:
      - .github/workflows/tibia-official-client-re-p2-buffer-downstream-consumer.yml
      - .github/scripts/tibia-official-client-re-p2-buffer-downstream-consumer.py
      - docs/agents/evidence/OTC-20260815-track-a-p2-buffer-downstream-consumer/**
      - docs/agents/tasks/active/OTC-20260815-track-a-p2-buffer-downstream-consumer.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-p2-buffer-downstream-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardened-post-serialization-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_HEAD_BRANCH: research/OTC-20260815-track-a-p2-buffer-downstream-consumer
      OFFICIAL_LINUX_ARCHIVE_URL: https://download.tibia.com/tibia.x64.tar.gz
    steps:
      - name: Checkout exact Draft head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Verify hosted no-runtime execution boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_HEAD_BRANCH" ]]
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$RUNNER_ARCH" == X64 ]]
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          python3 -m py_compile .github/scripts/tibia-official-client-re-p2-buffer-downstream-consumer.py
          objdump="$(command -v objdump)"
          [[ -x "$objdump" ]]
          "$objdump" --version | head -n 1
          echo "TRACK_A_P2_OBJDUMP=$objdump" >> "$GITHUB_ENV"
          echo "TRACK_A_P2_RUNTIME_ACCESS=none"
          echo "TRACK_A_P2_PERSISTENT_SESSION=none"
          echo "TRACK_A_P2_PHYSICAL_E2E=false"
          echo "TRACK_A_P2_SYNLOGY_EXECUTION=false"

      - name: Materialize exact official Linux client without executing it
        shell: bash
        run: |
          set -Eeuo pipefail
          out=artifacts/p2-buffer-downstream-consumer
          mkdir -p "$out"
          archive="$RUNNER_TEMP/tibia.x64.tar.gz"
          client="$RUNNER_TEMP/tibia-static-client"

          if ! curl --fail --silent --show-error --location \
              --retry 2 --retry-all-errors --connect-timeout 20 --max-time 900 \
              --user-agent 'blakinio-otclient-static-research/1.0' \
              "$OFFICIAL_LINUX_ARCHIVE_URL" --output "$archive"; then
            {
              echo 'P2_HOSTED_INPUT_STATUS=INPUT_BLOCKED'
              echo 'P2_HOSTED_INPUT_REASON=official_linux_archive_download_failed'
              echo "P2_HOSTED_INPUT_URL=$OFFICIAL_LINUX_ARCHIVE_URL"
            } | tee "$out/input-status.txt"
            exit 3
          fi

          python3 - "$archive" "$client" <<'PY'
          import shutil
          import sys
          import tarfile
          from pathlib import PurePosixPath

          archive, target = sys.argv[1:]
          with tarfile.open(archive, mode='r:*') as tf:
              candidates = []
              for member in tf.getmembers():
                  if not member.isfile():
                      continue
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      continue
                  parts = path.parts
                  if len(parts) >= 2 and parts[-2:] == ('bin', 'client'):
                      candidates.append(member)
              if len(candidates) != 1:
                  names = ','.join(m.name for m in candidates[:10]) or '<none>'
                  raise SystemExit(f'P2_HOSTED_INPUT_BLOCKED=client_member_count:{len(candidates)}:{names}')
              src = tf.extractfile(candidates[0])
              if src is None:
                  raise SystemExit('P2_HOSTED_INPUT_BLOCKED=client_member_unreadable')
              with src, open(target, 'wb') as dst:
                  shutil.copyfileobj(src, dst, length=1024 * 1024)
              print(f'P2_HOSTED_CLIENT_MEMBER={candidates[0].name}')
          PY

          size="$(stat -c '%s' "$client")"
          sha="$(sha256sum "$client" | awk '{print $1}')"
          {
            echo "P2_HOSTED_INPUT_SIZE=$size"
            echo "P2_HOSTED_INPUT_SHA256=$sha"
            echo "P2_HOSTED_EXPECTED_SIZE=$EXPECTED_CLIENT_SIZE"
            echo "P2_HOSTED_EXPECTED_SHA256=$EXPECTED_CLIENT_SHA256"
          } | tee "$out/input-status.txt"

          if [[ "$size" != "$EXPECTED_CLIENT_SIZE" || "$sha" != "$EXPECTED_CLIENT_SHA256" ]]; then
            echo 'P2_HOSTED_INPUT_STATUS=INPUT_BLOCKED' | tee -a "$out/input-status.txt"
            echo 'P2_HOSTED_INPUT_REASON=exact_client_fence_mismatch' | tee -a "$out/input-status.txt"
            exit 3
          fi

          echo 'P2_HOSTED_INPUT_STATUS=EXACT_FENCE_VERIFIED' | tee -a "$out/input-status.txt"
          echo "TRACK_A_P2_CLIENT=$client" >> "$GITHUB_ENV"
          echo "TRACK_A_P2_DOWNSTREAM_EXACT_HEAD=$GITHUB_SHA"
          echo 'TRACK_A_P2_DOWNSTREAM_EXACT_CLIENT_VERIFIED=true'

      - name: Prove persistent QBuffer downstream processor chain
        shell: bash
        run: |
          set -Eeuo pipefail
          out=artifacts/p2-buffer-downstream-consumer
          python3 .github/scripts/tibia-official-client-re-p2-buffer-downstream-consumer.py \
            --client "$TRACK_A_P2_CLIENT" \
            --objdump "$TRACK_A_P2_OBJDUMP" \
            --output-json "$out/result.json" \
            --output-text "$out/result.txt" \
            --evidence "$out/evidence.txt" \
            | tee "$out/validation.log"

          grep -Fxq 'P2_DOWNSTREAM_COMPLETE=true' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_RESULT=POST_SERIALIZATION_PROCESSOR_CHAIN_PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_PERSISTENT_QBUFFER_DIRECT_READALL=PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_FIRST_CONSUMER=PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_FIRST_TRANSFORM=PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_SAME_MESSAGE_TO_DUALCONNECTION=PROVEN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_PROTOCOL_STAGE_ORDER=PROVEN_PARTIAL' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_PROTOCOL_FRAMING=UNKNOWN' "$out/validation.log"
          grep -Fxq 'P2_DOWNSTREAM_FINAL_BINARY_EGRESS=UNKNOWN' "$out/validation.log"

          python3 - "$out/result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['schema_version']==3
          assert d['exact_client']['sha256']=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          assert d['exact_client']['size']==51965216
          assert d['semantic_result']=='POST_SERIALIZATION_PROCESSOR_CHAIN_PROVEN'
          c=d['classification']
          assert c['persistent_qbuffer_direct_readall']=='PROVEN'
          assert c['first_downstream_consumer'].startswith('PROVEN:')
          assert c['first_downstream_transform'].startswith('PROVEN:')
          assert c['same_message_handoff_to_dualconnection']=='PROVEN'
          assert c['protocol_stage_order']=='PROVEN_PARTIAL'
          for k in ('framing','sequence','compression','encryption','final_binary_egress','causal_local_harness'):
              assert c[k]=='UNKNOWN'
          n=d['negative_controls']
          assert not any(n.values())
          PY
          echo 'TRACK_A_P2_DOWNSTREAM_HARDENED_VALIDATED=true'

      - name: Remove proprietary input before evidence upload
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$RUNNER_TEMP/tibia-static-client" "$RUNNER_TEMP/tibia.x64.tar.gz"
          test ! -e "$RUNNER_TEMP/tibia-static-client"
          test ! -e "$RUNNER_TEMP/tibia.x64.tar.gz"

      - name: Upload sanitized static evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: track-a-p2-buffer-downstream-consumer-${{ github.run_id }}
          path: artifacts/p2-buffer-downstream-consumer/**
          if-no-files-found: error
          retention-days: 7

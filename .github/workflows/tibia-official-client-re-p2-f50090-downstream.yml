name: Track A P2 f50090 downstream evidence

on:
  push:
    branches:
      - research/OTC-20260817-track-a-p2-f50090-downstream
    paths:
      - .github/workflows/tibia-official-client-re-p2-f50090-downstream.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-p2-f50090-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Stage exact-file f50090 writer evidence
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-p2-f50090-downstream
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    outputs:
      main_hex: ${{ steps.stage.outputs.main_hex }}
      main_sha256: ${{ steps.stage.outputs.main_sha256 }}
      ctor_hex: ${{ steps.stage.outputs.ctor_hex }}
      ctor_sha256: ${{ steps.stage.outputs.ctor_sha256 }}
      vcall_hex: ${{ steps.stage.outputs.vcall_hex }}
      vcall_sha256: ${{ steps.stage.outputs.vcall_sha256 }}
      source_candidate_index: ${{ steps.stage.outputs.source_candidate_index }}
    steps:
      - id: stage
        name: Exact-fence and emit three bounded file windows only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 61
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 62
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]] || exit 63
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]] || exit 64
          command -v python3 >/dev/null

          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          source_index=''
          for index in 0 1; do
            candidate="${candidates[$index]}"
            [[ -f "$candidate" && ! -L "$candidate" ]] || continue
            [[ "$(stat -c %s "$candidate" 2>/dev/null || true)" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            if python3 - "$candidate" "$EXPECTED_CLIENT_SHA256" <<'PY'
          import hashlib, sys
          from pathlib import Path
          h = hashlib.sha256()
          with Path(sys.argv[1]).open('rb') as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b''):
                  h.update(chunk)
          raise SystemExit(0 if h.hexdigest() == sys.argv[2] else 1)
          PY
            then
              source_client="$candidate"
              source_index="$index"
              break
            fi
          done
          [[ -n "$source_client" ]] || { echo P2_F50090_REFUSED=EXACT_SOURCE_MISSING; exit 50; }

          python3 - "$source_client" "$source_index" "$GITHUB_OUTPUT" <<'PY'
          import hashlib, stat, struct, sys
          from pathlib import Path

          path = Path(sys.argv[1]).resolve()
          source_index = sys.argv[2]
          output_path = Path(sys.argv[3])
          expected_size = 51965216
          expected_sha = 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          windows = {
              'main': (0xF50040, 0xF50480),
              'ctor': (0x1960300, 0x1960600),
              'vcall': (0xCB2900, 0xCB29C0),
          }

          if not path.is_file() or path.is_symlink() or not stat.S_ISREG(path.stat().st_mode):
              raise SystemExit('P2_F50090_FAIL=source_regular_file')
          if path.stat().st_size != expected_size:
              raise SystemExit('P2_F50090_FAIL=source_exact_size')
          h = hashlib.sha256()
          with path.open('rb') as f:
              for block in iter(lambda: f.read(1024 * 1024), b''):
                  h.update(block)
          if h.hexdigest() != expected_sha:
              raise SystemExit('P2_F50090_FAIL=source_exact_sha256')

          with path.open('rb') as f:
              ident = f.read(16)
              if ident[:4] != b'\x7fELF' or ident[4] != 2 or ident[5] != 1:
                  raise SystemExit('P2_F50090_FAIL=elf64_little')
              rest = f.read(48)
              fields = struct.unpack('<HHIQQQIHHHHHH', rest)
              phoff, phentsize, phnum = fields[4], fields[8], fields[9]
              if phentsize < 56 or not (0 < phnum < 128):
                  raise SystemExit('P2_F50090_FAIL=program_headers')
              segments = []
              for i in range(phnum):
                  f.seek(phoff + i * phentsize)
                  row = f.read(56)
                  p_type, p_flags, p_offset, p_vaddr, _paddr, p_filesz, _pmemsz, _align = struct.unpack('<IIQQQQQQ', row)
                  if p_type == 1 and p_filesz:
                      segments.append((p_vaddr, p_filesz, p_offset, p_flags))

              records = {}
              for name, (start, end) in windows.items():
                  data = None
                  executable = False
                  for vaddr, filesz, offset, flags in segments:
                      if start >= vaddr and end <= vaddr + filesz:
                          f.seek(offset + start - vaddr)
                          data = f.read(end - start)
                          executable = bool(flags & 1)
                          break
                  if data is None or len(data) != end - start:
                      raise SystemExit(f'P2_F50090_FAIL={name}_range_not_file_backed')
                  if not executable:
                      raise SystemExit(f'P2_F50090_FAIL={name}_range_not_executable')
                  records[name] = (start, end, data, hashlib.sha256(data).hexdigest())

          with output_path.open('a') as out:
              for name, (_start, _end, data, digest) in records.items():
                  out.write(f'{name}_hex={data.hex()}\n')
                  out.write(f'{name}_sha256={digest}\n')
              out.write(f'source_candidate_index={source_index}\n')

          print('P2_F50090_SOURCE_BOUNDARY=PASS')
          print('P2_F50090_CLIENT_VERSION=15.32.df7b29')
          print(f'P2_F50090_CLIENT_SIZE={expected_size}')
          print(f'P2_F50090_CLIENT_SHA256={expected_sha}')
          for name, (start, end, data, digest) in records.items():
              print(f'P2_F50090_{name.upper()}_WINDOW=0x{start:x}..0x{end:x}')
              print(f'P2_F50090_{name.upper()}_LENGTH={len(data)}')
              print(f'P2_F50090_{name.upper()}_SHA256={digest}')
          print('P2_F50090_RUNTIME_ACCESS=none')
          print('P2_F50090_SOURCE_OPERATION=three_bounded_file_backed_executable_windows_only')
          print('P2_F50090_SOURCE_DISASSEMBLY=false')
          print('P2_F50090_SOURCE_SEMANTIC_CLASSIFICATION=false')
          print('P2_F50090_CLIENT_PROCESS_ACCESSED=false')
          print('P2_F50090_PROCESS_MEMORY_ACCESSED=false')
          print('P2_F50090_CANONICAL_STATE_ACCESSED=false')
          print('P2_F50090_CLIENT_EXECUTED=false')
          print('P2_F50090_CLIENT_BYTE_MUTATED=false')
          print('P2_F50090_RAW_CLIENT_UPLOADED=false')
          PY

  hosted-validate:
    name: Decode f50090 writer evidence on GitHub-hosted Linux
    needs: source-sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-p2-f50090-downstream
      MAIN_HEX: ${{ needs.source-sanitize.outputs.main_hex }}
      MAIN_SHA256: ${{ needs.source-sanitize.outputs.main_sha256 }}
      CTOR_HEX: ${{ needs.source-sanitize.outputs.ctor_hex }}
      CTOR_SHA256: ${{ needs.source-sanitize.outputs.ctor_sha256 }}
      VCALL_HEX: ${{ needs.source-sanitize.outputs.vcall_hex }}
      VCALL_SHA256: ${{ needs.source-sanitize.outputs.vcall_sha256 }}
      SOURCE_CANDIDATE_INDEX: ${{ needs.source-sanitize.outputs.source_candidate_index }}
    steps:
      - name: Reconstruct, verify and disassemble exact bounded evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 71
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 72
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]] || exit 73
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || exit 74
          command -v python3 >/dev/null
          command -v objdump >/dev/null

          python3 - <<'PY'
          import hashlib, os, subprocess, tempfile
          from pathlib import Path

          records = {
              'main': (0xF50040, 0xF50480, os.environ['MAIN_HEX'], os.environ['MAIN_SHA256']),
              'ctor': (0x1960300, 0x1960600, os.environ['CTOR_HEX'], os.environ['CTOR_SHA256']),
              'vcall': (0xCB2900, 0xCB29C0, os.environ['VCALL_HEX'], os.environ['VCALL_SHA256']),
          }
          disassemblies = {}
          with tempfile.TemporaryDirectory(prefix='p2-f50090-writer-') as td:
              for name, (start, end, hex_data, expected_sha) in records.items():
                  data = bytes.fromhex(hex_data)
                  if len(data) != end - start:
                      raise SystemExit(f'P2_F50090_FAIL={name}_hosted_length')
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != expected_sha:
                      raise SystemExit(f'P2_F50090_FAIL={name}_hosted_digest')
                  raw_path = Path(td) / f'{name}.bin'
                  raw_path.write_bytes(data)
                  proc = subprocess.run(
                      ['objdump', '-D', '-b', 'binary', '-m', 'i386:x86-64', '-M', 'intel',
                       f'--adjust-vma=0x{start:x}', str(raw_path)],
                      check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  )
                  disassemblies[name] = proc.stdout

          if 'f50090:' not in disassemblies['main']:
              raise SystemExit('P2_F50090_FAIL=main_target_anchor_missing')
          if '1960340:' not in disassemblies['ctor']:
              raise SystemExit('P2_F50090_FAIL=ctor_target_anchor_missing')
          for anchor in ('cb2930:', 'cb2940:', 'cb2960:'):
              if anchor not in disassemblies['vcall']:
                  raise SystemExit(f'P2_F50090_FAIL=vcall_anchor_missing_{anchor}')

          print('P2_F50090_HOSTED_VALIDATION=PASS')
          print('P2_F50090_CLIENT_VERSION=15.32.df7b29')
          print('P2_F50090_CLIENT_SIZE=51965216')
          print('P2_F50090_CLIENT_SHA256=e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe')
          print(f'P2_F50090_SOURCE_CANDIDATE_INDEX={os.environ["SOURCE_CANDIDATE_INDEX"]}')
          print('P2_F50090_EXECUTION_CLASS=github_hosted')
          print('P2_F50090_RUNTIME_ACCESS=none')
          print('P2_F50090_PRIMARY_BYTES_EXACT_FENCED=true')
          for name in ('main', 'ctor', 'vcall'):
              start, end, _hex_data, expected_sha = records[name]
              print(f'P2_F50090_{name.upper()}_WINDOW=0x{start:x}..0x{end:x}')
              print(f'P2_F50090_{name.upper()}_SHA256={expected_sha}')
              print(f'P2_F50090_{name.upper()}_DISASSEMBLY_BEGIN')
              print(disassemblies[name], end='')
              print(f'P2_F50090_{name.upper()}_DISASSEMBLY_END')
          PY

name: Track A P2 f50090 downstream evidence

on:
  push:
    branches:
      - research/OTC-20260817-track-a-p2-f50090-downstream
    paths:
      - .github/scripts/tibia-official-client-re-p2-f50090-downstream.py
      - .github/workflows/tibia-official-client-re-p2-f50090-downstream.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-p2-f50090-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Stage exact-file f50090 bytes
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-p2-f50090-downstream
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_VERSION: 15.32.df7b29
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Checkout exact producer branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Verify file-only source boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 61
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 62
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]] || exit 63
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]] || exit 64
          command -v python3 >/dev/null
          python3 -m py_compile .github/scripts/tibia-official-client-re-p2-f50090-downstream.py
          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          source_index=''
          for index in 0 1; do
            candidate="${candidates[$index]}"
            [[ -f "$candidate" && ! -L "$candidate" ]] || continue
            [[ "$(stat -c %s "$candidate" 2>/dev/null || true)" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            if python3 - "$candidate" "$EXPECTED_CLIENT_SHA256" <<'PY'
          import hashlib, sys
          from pathlib import Path
          h = hashlib.sha256()
          with Path(sys.argv[1]).open('rb') as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b''):
                  h.update(chunk)
          raise SystemExit(0 if h.hexdigest() == sys.argv[2] else 1)
          PY
            then
              source_client="$candidate"
              source_index="$index"
              break
            fi
          done
          [[ -n "$source_client" ]] || { echo P2_F50090_REFUSED=EXACT_SOURCE_MISSING; exit 50; }
          {
            echo "SOURCE_CLIENT=$source_client"
            echo "SOURCE_CANDIDATE_INDEX=$source_index"
          } >> "$GITHUB_ENV"
          echo P2_F50090_SOURCE_BOUNDARY=PASS
          echo P2_F50090_RUNTIME_ACCESS=none
          echo P2_F50090_SOURCE_DISASSEMBLY=false
          echo P2_F50090_SOURCE_SEMANTIC_CLASSIFICATION=false
          echo P2_F50090_CLIENT_PROCESS_ACCESS=false
          echo P2_F50090_PROCESS_MEMORY_ACCESS=false
          echo P2_F50090_CANONICAL_STATE_ACCESS=false
          echo P2_F50090_CLIENT_EXECUTED=false

      - name: Copy bounded exact-file bytes only
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf artifacts/source
          mkdir -p artifacts/source
          python3 .github/scripts/tibia-official-client-re-p2-f50090-downstream.py \
            source --client "$SOURCE_CLIENT" --candidate-index "$SOURCE_CANDIDATE_INDEX" --outdir artifacts/source
          grep -Fxq "P2_F50090_CLIENT_VERSION=$EXPECTED_CLIENT_VERSION" artifacts/source/source-fence.txt
          grep -Fxq "P2_F50090_CLIENT_SIZE=$EXPECTED_CLIENT_SIZE" artifacts/source/source-fence.txt
          grep -Fxq "P2_F50090_CLIENT_SHA256=$EXPECTED_CLIENT_SHA256" artifacts/source/source-fence.txt
          grep -Fxq 'P2_F50090_RUNTIME_ACCESS=none' artifacts/source/source-fence.txt
          grep -Fxq 'P2_F50090_SOURCE_DISASSEMBLY=false' artifacts/source/source-fence.txt
          grep -Fxq 'P2_F50090_SOURCE_SEMANTIC_CLASSIFICATION=false' artifacts/source/source-fence.txt
          grep -Fxq 'P2_F50090_RAW_CLIENT_UPLOADED=false' artifacts/source/source-fence.txt

      - name: Enforce source artifact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('artifacts/source')
          allowed = {'source-evidence.json', 'source-fence.txt'}
          actual = {p.name for p in root.iterdir() if p.is_file()}
          assert actual == allowed, actual
          for path in root.iterdir():
              if not path.is_file():
                  continue
              data = path.read_bytes()
              assert len(data) < 1024 * 1024
              assert not data.startswith(b'\x7fELF') and data[:2] != b'MZ'
              data.decode('utf-8')
          print('P2_F50090_SOURCE_SANITIZED_BOUNDARY=PASS')
          PY

      - name: Upload bounded source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-p2-f50090-source-${{ github.run_id }}
          path: artifacts/source/**
          if-no-files-found: error
          retention-days: 7

  hosted-validate:
    name: Decode f50090 on GitHub-hosted Linux
    needs: source-sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-p2-f50090-downstream
      EXPECTED_CLIENT_VERSION: 15.32.df7b29
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Checkout exact producer branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Verify hosted boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]]
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          command -v objdump >/dev/null
          python3 -m py_compile .github/scripts/tibia-official-client-re-p2-f50090-downstream.py
          echo P2_F50090_EXECUTION_CLASS=github_hosted
          echo P2_F50090_RUNTIME_ACCESS=none
          echo P2_F50090_RAW_CLIENT_PRESENT=false

      - name: Download bounded source bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: track-a-p2-f50090-source-${{ github.run_id }}
          path: artifacts/source

      - name: Decode exact bounded evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf artifacts/final
          mkdir -p artifacts/final
          python3 .github/scripts/tibia-official-client-re-p2-f50090-downstream.py \
            hosted --bundle-dir artifacts/source --outdir artifacts/final
          grep -Fxq 'P2_F50090_HOSTED_VALIDATION=PASS' artifacts/final/hosted-validation.txt
          grep -Fxq "P2_F50090_CLIENT_VERSION=$EXPECTED_CLIENT_VERSION" artifacts/final/hosted-validation.txt
          grep -Fxq "P2_F50090_CLIENT_SIZE=$EXPECTED_CLIENT_SIZE" artifacts/final/hosted-validation.txt
          grep -Fxq "P2_F50090_CLIENT_SHA256=$EXPECTED_CLIENT_SHA256" artifacts/final/hosted-validation.txt
          grep -Fxq 'P2_F50090_EXECUTION_CLASS=github_hosted' artifacts/final/hosted-validation.txt
          grep -Fxq 'P2_F50090_RUNTIME_ACCESS=none' artifacts/final/hosted-validation.txt
          grep -Fxq 'P2_F50090_PRIMARY_BYTES_EXACT_FENCED=true' artifacts/final/hosted-validation.txt

      - name: Enforce final artifact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('artifacts/final')
          allowed = {'disassembly.txt', 'result.json', 'hosted-validation.txt'}
          actual = {p.name for p in root.iterdir() if p.is_file()}
          assert actual == allowed, actual
          for path in root.iterdir():
              if not path.is_file():
                  continue
              data = path.read_bytes()
              assert len(data) < 1024 * 1024
              assert not data.startswith(b'\x7fELF') and data[:2] != b'MZ'
              data.decode('utf-8')
          print('P2_F50090_FINAL_SANITIZED_BOUNDARY=PASS')
          PY

      - name: Upload hosted evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-p2-f50090-final-${{ github.run_id }}
          path: artifacts/final/**
          if-no-files-found: error
          retention-days: 30

name: Track A P2 raw transform semantics

on:
  push:
    branches: [research/OTC-20260817-track-a-p2-raw-transform-semantics]
    paths: [.github/workflows/tibia-official-client-re-p2-raw-transform-semantics.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-p2-raw-transform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Stage exact-file vtable candidates
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-p2-raw-transform-semantics
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    outputs:
      scan_b64: ${{ steps.stage.outputs.scan_b64 }}
      scan_sha256: ${{ steps.stage.outputs.scan_sha256 }}
    steps:
      - id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 61
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 62
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]] || exit 63
          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          for candidate in "${candidates[@]}"; do
            [[ -f "$candidate" && ! -L "$candidate" ]] || continue
            [[ "$(stat -c %s "$candidate")" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            python3 - "$candidate" "$EXPECTED_CLIENT_SHA256" <<'PY' && { source_client="$candidate"; break; }
          import hashlib,sys
          h=hashlib.sha256()
          with open(sys.argv[1],'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
          raise SystemExit(h.hexdigest()!=sys.argv[2])
          PY
          done
          [[ -n "$source_client" ]] || exit 50
          python3 - "$source_client" "$GITHUB_OUTPUT" <<'PY'
          import base64,hashlib,json,struct,sys
          from pathlib import Path
          p=Path(sys.argv[1]); out=Path(sys.argv[2]); target=0xf85eb0
          blob=p.read_bytes()
          if len(blob)!=51965216: raise SystemExit(51)
          with p.open('rb') as f:
              ident=f.read(16); rest=f.read(48)
              if ident[:4]!=b'\x7fELF' or ident[4]!=2 or ident[5]!=1: raise SystemExit(52)
              fs=struct.unpack('<HHIQQQIHHHHHH',rest); phoff,phentsize,phnum=fs[4],fs[8],fs[9]
              segs=[]
              for i in range(phnum):
                  f.seek(phoff+i*phentsize); r=f.read(56)
                  t,flags,off,va,_pa,sz,_msz,_al=struct.unpack('<IIQQQQQQ',r)
                  if t==1: segs.append((off,va,sz,flags))
          pat=struct.pack('<Q',target); hits=[]; pos=0
          while True:
              off=blob.find(pat,pos)
              if off<0: break
              pos=off+1
              va=None; flags=None
              for so,sv,ss,sf in segs:
                  if so<=off<so+ss:
                      va=sv+(off-so); flags=sf; break
              if va is None: continue
              start_off=off-0x30; end_off=off+0x30
              if start_off<0 or end_off>len(blob): continue
              hits.append({'file_offset':off,'va':va,'segment_flags':flags,'window_start_va':va-0x30,'window_hex':blob[start_off:end_off].hex()})
          if not hits or len(hits)>16: raise SystemExit(53)
          payload=json.dumps({'target':'0xf85eb0','hits':hits},separators=(',',':')).encode()
          dig=hashlib.sha256(payload).hexdigest(); enc=base64.b64encode(payload).decode()
          with out.open('a') as h:
              h.write(f'scan_b64={enc}\nscan_sha256={dig}\n')
          print('P2_RAWTRANSFORM_VTABLE_SOURCE=PASS')
          print(f'P2_RAWTRANSFORM_VTABLE_HIT_COUNT={len(hits)}')
          print(f'P2_RAWTRANSFORM_SCAN_SHA256={dig}')
          print('P2_RAWTRANSFORM_RUNTIME_ACCESS=none')
          print('P2_RAWTRANSFORM_SOURCE_DISASSEMBLY=false')
          print('P2_RAWTRANSFORM_SOURCE_SEMANTIC_CLASSIFICATION=false')
          print('P2_RAWTRANSFORM_RAW_CLIENT_UPLOADED=false')
          PY

  hosted-validate:
    name: Resolve concrete vtable slots on GitHub-hosted Linux
    needs: source-sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-p2-raw-transform-semantics
      SCAN_B64: ${{ needs.source-sanitize.outputs.scan_b64 }}
      SCAN_SHA256: ${{ needs.source-sanitize.outputs.scan_sha256 }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 71
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || exit 72
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || exit 73
          python3 - <<'PY'
          import base64,hashlib,json,os,struct
          raw=base64.b64decode(os.environ['SCAN_B64'])
          if hashlib.sha256(raw).hexdigest()!=os.environ['SCAN_SHA256']: raise SystemExit(74)
          obj=json.loads(raw)
          if obj.get('target')!='0xf85eb0': raise SystemExit(75)
          print('P2_RAWTRANSFORM_VTABLE_HOSTED=PASS')
          print('P2_RAWTRANSFORM_EXECUTION_CLASS=github_hosted')
          print('P2_RAWTRANSFORM_RUNTIME_ACCESS=none')
          print(f'P2_RAWTRANSFORM_VTABLE_HIT_COUNT={len(obj["hits"])}')
          for i,h in enumerate(obj['hits']):
              data=bytes.fromhex(h['window_hex'])
              if len(data)!=0x60: raise SystemExit(76)
              # target occurrence is at window +0x30; if it is vslot +0x20, AP is window +0x10.
              ap=h['va']-0x20
              q=lambda off: struct.unpack_from('<Q',data,off)[0]
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_OCCURRENCE_VA=0x{h["va"]:x}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_SEGMENT_FLAGS={h["segment_flags"]}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_AP=0x{ap:x}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_OFFSET_TO_TOP=0x{q(0x10):x}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_TYPEINFO=0x{q(0x18):x}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_SLOT_00=0x{q(0x20):x}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_SLOT_08=0x{q(0x28):x}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_SLOT_10=0x{q(0x30):x}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_SLOT_18=0x{q(0x38):x}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_SLOT_20=0x{q(0x40):x}')
              print(f'P2_RAWTRANSFORM_CANDIDATE_{i}_SLOT_28=0x{q(0x48):x}')
          PY

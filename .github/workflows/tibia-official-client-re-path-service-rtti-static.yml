name: Track A path-service RTTI static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-path-service-rtti-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-path-service-rtti-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Validate filesystem-helper RTTI and vtables statically
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Validate candidate typeinfo/vtables and emit bounded method bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'PATH_RTTI_CLIENT_FENCE=PASS'

          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if not (0 <= o < len(blob)): return ''
              e=blob.find(b'\0',o); e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):
              secs.append({'idx':i,'name':cs(names,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
          by={s['name']:s for s in secs}; text=by['.text']; tb=d[text['off']:text['off']+text['size']]
          def va_to_off(va):
              for s in secs:
                  if s['size'] and s['addr'] <= va < s['addr']+s['size']:
                      return s['off']+(va-s['addr'])
              return None
          def rawq(va):
              o=va_to_off(va)
              return None if o is None or o+8>len(d) else struct.unpack_from('<Q',d,o)[0]
          def in_text(va): return text['addr'] <= va < text['addr']+text['size']
          def emit(label,start,end):
              o=va_to_off(start)
              if o is None: print(f'{label}=NO_FILE_MAPPING'); return
              blob=d[o:o+(end-start)]
              print(f'{label}_VA=0x{start:x}')
              print(f'{label}_END=0x{end:x}')
              print(f'{label}_SHA256={hashlib.sha256(blob).hexdigest()}')
              print(f'{label}_HEX={blob.hex()}')

          # Dynamic symbols are useful for external RTTI vtable relocation names.
          dyn=by.get('.dynsym'); syms=[]
          if dyn and 0 <= dyn['link'] < len(secs):
              ss=secs[dyn['link']]; sb=d[ss['off']:ss['off']+ss['size']]
              for o in range(dyn['off'],dyn['off']+dyn['size'],dyn['entsize'] or 24):
                  if o+24>len(d): break
                  sn,info,other,si,val,sz=struct.unpack_from(E+'IBBHQQ',d,o)
                  syms.append((cs(sb,sn),val,sz,si,info))

          rel=by.get('.rela.dyn'); relocs=[]
          if rel:
              for o in range(rel['off'],rel['off']+rel['size'],rel['entsize'] or 24):
                  if o+24>len(d): break
                  ro,ri,add=struct.unpack_from(E+'QQq',d,o)
                  typ=ri&0xffffffff; sym=ri>>32
                  relocs.append((ro,typ,sym,add))
          byoff={ro:(typ,sym,add) for ro,typ,sym,add in relocs}
          byadd={}
          for ro,typ,sym,add in relocs: byadd.setdefault(add,[]).append((ro,typ,sym))
          def rdesc(va):
              r=byoff.get(va)
              if not r:return 'NONE'
              typ,sym,add=r
              name=syms[sym][0] if sym and sym < len(syms) else ''
              return f'type={typ},sym={sym},name={name},add={hex(add)}'

          candidates={
              'shared_TFileSystemHelper': {'name_va':0x1c95800,'ti':0x3070918},
              'tibia_shared_TTibiaFileSystemHelper': {'name_va':0x1c95880,'ti':0x3070940},
              'tibia_assets_TAssetFileSystemHelper': {'name_va':0x1c914e0,'ti':0x306ffb0},
          }
          print('PATH_RTTI_CANDIDATE_LAYOUT_BEGIN')
          valid=[]
          for label,c in candidates.items():
              ti=c['ti']
              print(f'CANDIDATE={label} name_va=0x{c["name_va"]:x} typeinfo=0x{ti:x}')
              for va in range(ti,ti+0x28,8):
                  print(f'  TYPEINFO_QWORD va=0x{va:x} raw={"NONE" if rawq(va) is None else hex(rawq(va))} reloc={rdesc(va)}')
              refs=byadd.get(ti,[])
              print('  TYPEINFO_REFS='+','.join(f'0x{ro:x}/t{typ}' for ro,typ,sym in refs))
              for tro,typ,sym in refs:
                  offraw=rawq(tro-8)
                  # A likely Itanium vtable typeinfo slot has a small signed offset-to-top immediately before it.
                  soff=None if offraw is None else struct.unpack('<q',struct.pack('<Q',offraw))[0]
                  entries=[]
                  text_entries=0
                  for n in range(0,0x110,8):
                      va=tro+8+n
                      rr=byoff.get(va)
                      if rr:
                          target=rr[2]
                          entries.append((n,va,target,rr[0],rr[1]))
                          if in_text(target): text_entries+=1
                  likely=(soff is not None and -0x10000 <= soff <= 0x10000 and text_entries>=4)
                  print(f'  REF=0x{tro:x} offset_to_top={soff} text_entries_next_0x110={text_entries} LIKELY_VTABLE={str(likely).lower()}')
                  if likely:
                      valid.append((label,tro,soff))
                      print(f'  VTABLE_ADDRESS_POINT=0x{tro+8:x}')
                      for n,va,target,rtyp,rsym in entries:
                          if n <= 0xf8:
                              print(f'    SLOT=+0x{n:x} reloc_va=0x{va:x} target=0x{target:x} in_text={str(in_text(target)).lower()}')
                      slot=byoff.get(tro+8+0xd8)
                      print(f'  SLOT_D8={"NONE" if slot is None else hex(slot[2])}')
          print('PATH_RTTI_CANDIDATE_LAYOUT_END')

          # Candidate concrete helper inheritance relationship: TTibiaFileSystemHelper -> base typeinfo.
          print('PATH_RTTI_INHERITANCE_CHECK_BEGIN')
          for va in range(0x3070940,0x3070970,8):
              print(f'va=0x{va:x} raw={"NONE" if rawq(va) is None else hex(rawq(va))} reloc={rdesc(va)}')
          print('PATH_RTTI_INHERITANCE_CHECK_END')

          # Emit bounded code around candidate +0xd8 targets from the first-pass findings.
          for label,target in [
              ('PATH_RTTI_BASE_D8',0x6b15c0),
              ('PATH_RTTI_TIBIA_D8',0xc95cb0),
              ('PATH_RTTI_ASSET_D8',0x6b03c0),
          ]:
              emit(label,max(text['addr'],target-0x30),min(text['addr']+text['size'],target+0x1d0))

          # Verify whether c95cb0 begins with a bounded instruction sequence referencing the known BEClient string.
          # This is loader-side filename construction evidence only, not BattlEye internal analysis.
          known_beclient=0x1d69bb2
          print('PATH_RTTI_C95CB0_RIP_REFS_BEGIN')
          lo=0xc95c80-text['addr']; hi=0xc95e80-text['addr']
          for i in range(max(0,lo),min(len(tb)-7,hi)):
              if tb[i] not in range(0x48,0x50) or tb[i+1]!=0x8d:continue
              m=tb[i+2]
              if (m>>6)!=0 or (m&7)!=5:continue
              va=text['addr']+i; dest=va+7+struct.unpack_from('<i',tb,i+3)[0]
              if dest==known_beclient:
                  print(f'BECLIENT_REF_CANDIDATE=0x{va:x}->0x{dest:x}')
          print('PATH_RTTI_C95CB0_RIP_REFS_END')

          # Candidate constructor/vptr assignment references to validated vtable address points.
          print('PATH_RTTI_VPTR_LEA_CANDIDATES_BEGIN')
          targets={}
          for label,tro,soff in valid:
              targets[tro+8]=label
          for i in range(len(tb)-7):
              if tb[i] not in range(0x48,0x50) or tb[i+1]!=0x8d:continue
              m=tb[i+2]
              if (m>>6)!=0 or (m&7)!=5:continue
              va=text['addr']+i; dest=va+7+struct.unpack_from('<i',tb,i+3)[0]
              if dest in targets:
                  print(f'type={targets[dest]} lea=0x{va:x} vptr=0x{dest:x}')
          print('PATH_RTTI_VPTR_LEA_CANDIDATES_END')

          print('PATH_RTTI_EXECUTED_TARGET=false')
          print('PATH_RTTI_LIVE_RUNTIME_OBSERVED=false')
          print('PATH_RTTI_MUTATION_PERFORMED=false')
          PY

name: Track A path-service RTTI static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-path-service-rtti-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-path-service-rtti-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Bound TTibiaFileSystemHelper constructor and resolver trace
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Validate concrete vtable and emit exact bounded windows
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'PATH_SVC_CLIENT_FENCE=PASS'

          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              if not (0 <= o < len(blob)): return ''
              e=blob.find(b'\0',o); e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for i,x in enumerate(sh):
              secs.append({'idx':i,'name':cs(names,x[0]),'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
          by={s['name']:s for s in secs}; text=by['.text']; tb=d[text['off']:text['off']+text['size']]
          def va_to_off(va):
              for s in secs:
                  if s['size'] and s['addr'] <= va < s['addr']+s['size']:
                      return s['off']+(va-s['addr'])
              return None
          def b_at(va,n):
              o=va_to_off(va); return b'' if o is None else d[o:o+n]
          def emit(label,start,end):
              blob=b_at(start,end-start)
              print(f'{label}_VA=0x{start:x}')
              print(f'{label}_END=0x{end:x}')
              print(f'{label}_SHA256={hashlib.sha256(blob).hexdigest()}')
              print(f'{label}_HEX={blob.hex()}')

          rel=by.get('.rela.dyn'); relocs=[]
          if rel:
              for o in range(rel['off'],rel['off']+rel['size'],rel['entsize'] or 24):
                  if o+24>len(d):break
                  ro,ri,add=struct.unpack_from(E+'QQq',d,o); relocs.append((ro,ri&0xffffffff,ri>>32,add))
          byoff={ro:(typ,sym,add) for ro,typ,sym,add in relocs}
          ti=0x3070940; typeinfo_slot=0x2f62078; vptr=0x2f62080
          print('PATH_SVC_VTABLE_BEGIN')
          print(f'offset_to_top={struct.unpack("<q",b_at(typeinfo_slot-8,8))[0]}')
          print(f'typeinfo_reloc={byoff.get(typeinfo_slot)}')
          all_text=True
          for off in range(0,0x100,8):
              rr=byoff.get(vptr+off); target=None if rr is None else rr[2]
              ok=(target is not None and text['addr'] <= target < text['addr']+text['size'])
              all_text &= ok
              print(f'slot=+0x{off:x} target={"NONE" if target is None else hex(target)} text={str(ok).lower()}')
          print(f'VTABLE_0_TO_F8_ALL_TEXT={str(all_text).lower()}')
          print(f'SLOT30_TARGET={hex(byoff[vptr+0x30][2])}')
          print(f'SLOTD8_TARGET={hex(byoff[vptr+0xd8][2])}')
          print('PATH_SVC_VTABLE_END')

          # One linear pass: direct rel32 calls into the concrete constructor-like region.
          calls=[]
          for i in range(len(tb)-5):
              if tb[i]!=0xe8:continue
              va=text['addr']+i; dest=va+5+struct.unpack_from('<i',tb,i+1)[0]
              if 0x6b4f40 <= dest < 0x6b5050:calls.append((va,dest))
          print('PATH_SVC_CTOR_REGION_CALLS='+','.join(f'0x{va:x}->0x{dest:x}' for va,dest in calls))

          # One linear pass: exact RIP-relative LEAs to the concrete vptr.
          refs=[]
          for i in range(len(tb)-7):
              if tb[i] not in range(0x48,0x50) or tb[i+1]!=0x8d:continue
              m=tb[i+2]
              if (m>>6)!=0 or (m&7)!=5:continue
              va=text['addr']+i; dest=va+7+struct.unpack_from('<i',tb,i+3)[0]
              if dest==vptr:refs.append(va)
          print('PATH_SVC_CONCRETE_VPTR_REFS='+','.join(hex(x) for x in refs))

          # Loader method exact facts; c95cb0 builds BEClient key and dispatches same object's +0x30 resolver.
          lea=b_at(0xc95cb2,7); lea_target=0xc95cb9+struct.unpack_from('<i',lea,3)[0]
          print(f'PATH_SVC_BECLIENT_LEA_TARGET=0x{lea_target:x}')
          call=b_at(0xc95cd9,5); fromutf8=0xc95cde+struct.unpack_from('<i',call,1)[0]
          print(f'PATH_SVC_FROMUTF8_TARGET=0x{fromutf8:x}')
          print(f'PATH_SVC_LOAD_SLOT30_BYTES={b_at(0xc95cd2,7).hex()}')
          print(f'PATH_SVC_LENGTH8_BYTES={b_at(0xc95cca,5).hex()}')
          print(f'PATH_SVC_CATEGORY9_BYTES={b_at(0xc95ce1,5).hex()}')
          print(f'PATH_SVC_CALL_SLOT30_BYTES={b_at(0xc95cec,3).hex()}')

          for label,start,end in [
              ('PATH_SVC_TIBIA_D8',0xc95cb0,0xc95d40),
              ('PATH_SVC_GENERIC_SLOT30',0xc9b820,0xc9bd20),
              ('PATH_SVC_VPTR_5EF510',0x5ef480,0x5ef590),
              ('PATH_SVC_VPTR_6B4FC0',0x6b4f40,0x6b5050),
              ('PATH_SVC_VPTR_19A6A9E',0x19a6a20,0x19a6b30),
          ]:emit(label,start,end)

          print('PATH_SVC_EXECUTED_TARGET=false')
          print('PATH_SVC_LIVE_RUNTIME_OBSERVED=false')
          print('PATH_SVC_MUTATION_PERFORMED=false')
          PY

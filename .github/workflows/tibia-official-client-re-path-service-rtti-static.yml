name: Track A path-service RTTI static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-path-service-rtti-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-path-service-rtti-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Deterministically validate TTibiaFileSystemHelper path service
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Re-derive exact RTTI vtable BEClient wrapper and resolver anchors
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          client='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package/bin/client'
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'PATH_SVC_VALIDATOR_CLIENT_FENCE=PASS'

          python3 - "$client" <<'PY'
          import hashlib,pathlib,struct,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); E='<'
          h=struct.unpack_from(E+'HHIQQQIHHHHHH',d,16)
          _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
          shfmt=E+'IIQQQQIIQQ'; sh=[struct.unpack_from(shfmt,d,shoff+i*shentsz) for i in range(shnum)]
          st=sh[shstrndx]; names=d[st[4]:st[4]+st[5]]
          def cs(blob,o):
              e=blob.find(b'\0',o); e=len(blob) if e<0 else e
              return blob[o:e].decode('utf8','replace')
          secs=[]
          for x in sh:secs.append({'name':cs(names,x[0]),'addr':x[3],'off':x[4],'size':x[5],'entsize':x[9]})
          by={s['name']:s for s in secs}; text=by['.text']
          def va_to_off(va):
              for s in secs:
                  if s['size'] and s['addr'] <= va < s['addr']+s['size']:
                      return s['off']+(va-s['addr'])
              return None
          def b_at(va,n):
              o=va_to_off(va); return b'' if o is None else d[o:o+n]
          def expect(va,hx,label):
              want=bytes.fromhex(hx); got=b_at(va,len(want))
              if got!=want:raise SystemExit(f'VALIDATOR_FAIL={label}@0x{va:x}:got={got.hex()}')
              print(f'VALIDATOR_PASS={label}@0x{va:x}')
          def rip_target(va,prefix_len=3,total=7):
              x=b_at(va,total)
              return va+total+struct.unpack_from('<i',x,prefix_len)[0]
          def rel32(va):
              x=b_at(va,5)
              if len(x)!=5 or x[0]!=0xe8:raise SystemExit(f'VALIDATOR_FAIL=not_call@0x{va:x}')
              return va+5+struct.unpack_from('<i',x,1)[0]
          def in_text(x):return text['addr'] <= x < text['addr']+text['size']

          rel=by.get('.rela.dyn'); relocs=[]
          for o in range(rel['off'],rel['off']+rel['size'],rel['entsize'] or 24):
              if o+24>len(d):break
              ro,ri,add=struct.unpack_from(E+'QQq',d,o); relocs.append((ro,ri&0xffffffff,ri>>32,add))
          byoff={ro:(typ,sym,add) for ro,typ,sym,add in relocs}

          # Exact RTTI name and primary vtable structure.
          type_name=b'N5tibia6shared22TTibiaFileSystemHelperE\0'
          if b_at(0x1c95880,len(type_name))!=type_name:raise SystemExit('VALIDATOR_FAIL=type_name')
          print('VALIDATOR_PASS=type_name:tibia::shared::TTibiaFileSystemHelper')
          typeinfo=0x3070940; tislot=0x2f62078; vptr=0x2f62080
          if struct.unpack('<q',b_at(tislot-8,8))[0]!=0:raise SystemExit('VALIDATOR_FAIL=offset_to_top')
          if byoff.get(tislot,(0,0,None))[2]!=typeinfo:raise SystemExit('VALIDATOR_FAIL=typeinfo_slot')
          print('VALIDATOR_PASS=itanium_offset_to_top_and_typeinfo')
          for off in range(0,0x100,8):
              rr=byoff.get(vptr+off)
              if rr is None or not in_text(rr[2]):raise SystemExit(f'VALIDATOR_FAIL=vtable_slot_{off:x}')
          print('VALIDATOR_PASS=vtable_slots_0_to_f8_contiguous_text')
          if byoff[vptr+0x30][2]!=0xc9b890:raise SystemExit('VALIDATOR_FAIL=slot30')
          if byoff[vptr+0xd8][2]!=0xc95cb0:raise SystemExit('VALIDATOR_FAIL=slotd8')
          print('VALIDATOR_PASS=slot30_0xc9b890')
          print('VALIDATOR_PASS=slotd8_0xc95cb0')

          # Concrete class is instantiated: exact vptr is written into embedded objects at two independent sites.
          expect(0x5ef510,'488d0d692b9702','construct_site1_vptr_lea')
          if rip_target(0x5ef510)!=vptr:raise SystemExit('VALIDATOR_FAIL=construct_site1_target')
          expect(0x5ef517,'488948f8','construct_site1_vptr_store')
          expect(0x19a6a9e,'488d05dbb55b01','construct_site2_vptr_lea')
          if rip_target(0x19a6a9e)!=vptr:raise SystemExit('VALIDATOR_FAIL=construct_site2_target')
          expect(0x19a6aa8,'48894510','construct_site2_vptr_store')
          print('VALIDATOR_PASS=two_concrete_vptr_construction_sites')

          # Slot +0xd8 wrapper constructs QString from exact BEClient key and dispatches same object's +0x30.
          expect(0xc95cb0,'4155','slotd8_function_start')
          expect(0xc95cb2,'488d15f93e0d01','BEClient_key_lea')
          if rip_target(0xc95cb2)!=0x1d69bb2:raise SystemExit('VALIDATOR_FAIL=BEClient_key_target')
          expect(0xc95cca,'be08000000','BEClient_key_length_8')
          if rel32(0xc95cd9)!=0x4df210:raise SystemExit('VALIDATOR_FAIL=QString_fromUtf8_target')
          expect(0xc95cd2,'4c89e74c8b6830','load_same_object_slot30')
          expect(0xc95ce1,'ba09000000','uniform_arg_value_9')
          expect(0xc95cec,'41ffd5','call_slot30')
          print('VALIDATOR_PASS=slotd8_BEClient_wrapper_chain')

          # Generic +0x30 resolver obtains context from own +0x28, then delegates through member +0x18 / vtable +0x78.
          expect(0xc9b890,'41574156415541544989cc554889fd534889f34883ec78','slot30_function_start')
          expect(0xc9b8a7,'488b064989e54c89efff5028','slot30_call_own_slot28')
          expect(0xc9b8b3,'488b5b18','slot30_member_plus18')
          expect(0xc9b8c1,'488b03','slot30_member_vptr')
          expect(0xc9b8ce,'4c8b7078','slot30_member_slot78')
          expect(0xc9b96f,'4889de4889ef4c89fa41ffd6','slot30_delegate_call')
          print('VALIDATOR_PASS=slot30_generic_delegate_shape')

          for label,start,end,want in [
              ('slotd8_window',0xc95cb0,0xc95d40,'8b5dd5d81bd76f0c68e155a3598717eca8d4eeb121378da922fb044de11bfc81'),
              ('slot30_window',0xc9b820,0xc9bd20,'cf1d1280d15b447c45e8ae0cdacc8de9306838f60006d5b25b8261a5ef33e957'),
          ]:
              got=hashlib.sha256(b_at(start,end-start)).hexdigest()
              if got!=want:raise SystemExit(f'VALIDATOR_FAIL={label}:{got}')
              print(f'VALIDATOR_PASS={label}_sha256:{got}')

          print('VALIDATOR_OWNER_PLUS20_DYNAMIC_TYPE=NOT_DIRECTLY_PROVEN')
          print('VALIDATOR_SOURCE_METHOD_NAME=UNKNOWN_STRIPPED_BINARY')
          print('VALIDATOR_SLOT_D8_CLIENT_ROLE=BECLIENT_KEY_PATH_RESOLUTION_WRAPPER_DERIVED')
          print('VALIDATOR_EXECUTED_TARGET=false')
          print('VALIDATOR_LIVE_RUNTIME_OBSERVED=false')
          print('VALIDATOR_MUTATION_PERFORMED=false')
          PY

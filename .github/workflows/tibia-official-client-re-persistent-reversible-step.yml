name: Track A persistent observer reversible step
on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-persistent-reversible-step.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Capture one step and its inverse under structural observer
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          runtime="$state/runtime"; toolroot="$state/toolroot"; marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          pid="$(tr -cd '0-9' <"$runtime/client.pid")"; gp="$(tr -cd '0-9' <"$runtime/map-provenance-gdb.pid")"
          kill -0 "$pid"; kill -0 "$gp"; grep -azFxq "$marker" "/proc/$pid/environ"; grep -azFxq "$marker" "/proc/$gp/environ"
          [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$pid/status")" == "$gp" ]]
          export HOME="$state/home" DISPLAY="$TRACK_DISPLAY" PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin" LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          window=''; best=0
          for w in $("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do
            eval "$("$toolroot/usr/bin/xdotool" getwindowgeometry --shell "$w")"; area=$((WIDTH*HEIGHT)); ((area>best)) && { best=$area; window=$w; }
          done
          [[ -n "$window" ]]
          out="$GITHUB_WORKSPACE/artifacts/reversible-step"; mkdir -p "$out"
          ev="$runtime/map-provenance-persistent-events.tsv"; strips="$runtime/map-provenance-persistent-strips.tsv"
          before_ev=$(wc -l <"$ev"); before_strips=$(wc -l <"$strips")
          "$toolroot/usr/bin/xdotool" windowactivate --sync "$window" 2>/dev/null || true
          "$toolroot/usr/bin/xdotool" windowfocus --sync "$window"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$out/before.xwd"
          "$toolroot/usr/bin/xdotool" key --window "$window" Up
          echo TRACK_A_FORWARD_STEP_SENT=true
          sleep 3
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$out/forward.xwd"
          mid_ev=$(wc -l <"$ev"); mid_strips=$(wc -l <"$strips")
          "$toolroot/usr/bin/xdotool" key --window "$window" Down
          echo TRACK_A_INVERSE_STEP_SENT=true
          sleep 3
          kill -0 "$pid"; kill -0 "$gp"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$out/inverse.xwd"
          after_ev=$(wc -l <"$ev"); after_strips=$(wc -l <"$strips")
          echo "TRACK_A_EVENT_COUNTS=$before_ev,$mid_ev,$after_ev"
          echo "TRACK_A_STRIP_COUNTS=$before_strips,$mid_strips,$after_strips"
          echo "TRACK_A_FORWARD_CHANGED_PIXELS=$(python3 .github/scripts/tibia-official-client-re-xwd-diff.py "$out/before.xwd" "$out/forward.xwd")"
          echo "TRACK_A_INVERSE_CHANGED_PIXELS=$(python3 .github/scripts/tibia-official-client-re-xwd-diff.py "$out/forward.xwd" "$out/inverse.xwd")"
          echo TRACK_A_NEW_EVENTS_BEGIN=true; tail -n "+$((before_ev+1))" "$ev"; echo TRACK_A_NEW_EVENTS_END=true
          echo TRACK_A_NEW_STRIPS_BEGIN=true; tail -n "+$((before_strips+1))" "$strips"; echo TRACK_A_NEW_STRIPS_END=true
      - name: Upload reversible movement frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-persistent-reversible-step
          path: artifacts/reversible-step/*.xwd
          if-no-files-found: ignore
          retention-days: 7

name: Track A Player protocol jump-table map
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-player-jumptable-map.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Decode Player static-metacall jump table
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          python3 - "$client" <<'PY'
          import struct,sys
          data=open(sys.argv[1],'rb').read()
          methods=['sendEnterWorld','sendGoNorth','sendGoEast','sendGoSouth','sendGoWest','sendStop','sendCancel','sendGoNorthEast','sendGoSouthEast','sendGoSouthWest','sendGoNorthWest','sendGoPath','sendRotateNorth','sendRotateEast','sendRotateSouth','sendRotateWest','sendSetTactics','worldEntered','showSelectOutfitDialog','showConfigureCreaturePodiumDialog','showHirelingNameChangeConfiguration','publishGameAction']
          table=0x1d713d0
          phoff=struct.unpack_from('<Q',data,0x20)[0];phentsz=struct.unpack_from('<H',data,0x36)[0];phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,off,va,paddr,filesz,memsz,align=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1:loads.append((off,off+filesz,va,va+filesz,flags))
          def va2off(v):
              for lo,hi,va,vhi,fl in loads:
                  if va<=v<vhi:return lo+(v-va)
          to=va2off(table); assert to is not None
          entries=[]
          for i,name in enumerate(methods):
              rel=struct.unpack_from('<i',data,to+i*4)[0]
              entry=(table+rel)&0xffffffffffffffff
              entries.append(entry)
          boundaries=sorted(set(entries))
          print('TRACK_A_PLAYER_JUMPTABLE_BEGIN=true')
          print(f'TABLE=0x{table:x} COUNT={len(methods)} DISTINCT_ENTRIES={len(boundaries)}')
          for i,(name,entry) in enumerate(zip(methods,entries)):
              larger=[x for x in boundaries if x>entry]
              end=min(larger) if larger else entry+0x100
              o=va2off(entry); tail=None;jat=None
              # Conservative: direct E9 only before next distinct case target and max 64 bytes.
              if o is not None:
                  for d in range(max(0,min(end-entry,64)-4)):
                      if data[o+d]==0xe9:
                          disp=struct.unpack_from('<i',data,o+d+1)[0]
                          tail=entry+d+5+disp;jat=entry+d;break
              print(f'CASE index={i} method={name} entry=0x{entry:x} block_end=0x{end:x} direct_jmp={"0x%x"%tail if tail is not None else "none"} jmp_at={"0x%x"%jat if jat is not None else "none"}')
          print('TRACK_A_PLAYER_JUMPTABLE_COMPLETE=true')
          PY

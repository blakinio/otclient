name: Track A PR290 world login v2

on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-pr290-login-v2.yml
      - .github/scripts/tibia-official-client-re-autonomous-world-login.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  login:
    runs-on: [otclient, synology]
    timeout-minutes: 12
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      TRACK_WARP_PORT: '25354'
      EXPECTED_CLIENT_SHA256: 71090ecdbb81a3d92f628416937acdb5641546bca39d20471f577ebdee556fa0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Execute autonomous no-OCR Track A login flow
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set -Eeuo pipefail
          patched="$RUNNER_TEMP/tibia-official-client-re-autonomous-world-login-current.sh"
          sed -e 's/== 51965216/== 78197896/' -e '3a trap '\''rc=$?; echo "::error::TRACK_A_FLOW_FAILED_LINE=$LINENO RC=$rc"; exit $rc'\'' ERR' .github/scripts/tibia-official-client-re-autonomous-world-login.sh > "$patched"
          bash "$patched"
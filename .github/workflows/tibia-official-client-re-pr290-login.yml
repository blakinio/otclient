name: Track A current official child recovery

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-pr290-login.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [otclient, synology]
    timeout-minutes: 12
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      TRACK_WARP_PORT: '25354'
      OLD_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Recover canonical child through official Linux launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -s)" == Linux ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          runtime="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$runtime/bin/client"
          toolroot="$state/toolroot"
          tool_path="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          tool_lib="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          work="$state/launcher-recovery/canonical-$GITHUB_RUN_ID"
          evidence="$GITHUB_WORKSPACE/artifacts/track-a-current-child"
          mkdir -p "$work/unpacked" "$evidence"
          chmod 700 "$work" "$work/unpacked"

          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$OLD_CLIENT_SHA256" ]]
          echo TRACK_A_REJECTED_CHILD_SHA_VERIFIED=true

          warp_pid="$(tr -cd '0-9' <"$state/runtime/wireproxy.pid" 2>/dev/null || true)"
          [[ -n "$warp_pid" && -r "/proc/$warp_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$warp_pid/environ"
          kill -0 "$warp_pid"
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" -fsS --max-time 15 \
            https://www.cloudflare.com/cdn-cgi/trace >"$work/warp-before.txt"
          grep -Eq '^warp=(on|plus)$' "$work/warp-before.txt"
          echo TRACK_A_RECOVERY_WARP_VERIFIED=true

          old_pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          [[ -n "$old_pid" && -r "/proc/$old_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$old_pid/environ"
          [[ "$(readlink -f "/proc/$old_pid/exe")" == "$client" ]]
          kill -0 "$old_pid"
          echo TRACK_A_REJECTED_CHILD_PID="$old_pid"
          kill "$old_pid"
          for _ in $(seq 1 40); do
            kill -0 "$old_pid" 2>/dev/null || break
            sleep .25
          done
          ! kill -0 "$old_pid" 2>/dev/null
          rm -f "$state/runtime/client.pid"
          echo TRACK_A_REJECTED_CHILD_STOPPED=true

          xvfb_pid="$(tr -cd '0-9' <"$state/runtime/xvfb.pid" 2>/dev/null || true)"
          [[ -n "$xvfb_pid" && -r "/proc/$xvfb_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$xvfb_pid/environ"
          kill -0 "$xvfb_pid"
          [[ -e /tmp/.X11-unix/X98 ]]
          echo TRACK_A_RECOVERY_DISPLAY_VERIFIED=true

          tarball="$work/tibia.x64.tar.gz"
          url='https://static.tibia.com/download/tibia.x64.tar.gz'
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" --compressed -fL \
            --connect-timeout 20 --max-time 240 --retry 4 --retry-all-errors --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$url" -H 'Accept: */*' "$url" -o "$tarball"
          echo TRACK_A_CURRENT_TARBALL_SHA256="$(sha256sum "$tarball" | awk '{print $1}')"
          echo TRACK_A_CURRENT_TARBALL_SIZE="$(stat -c %s "$tarball")"
          python3 - "$tarball" "$work/unpacked" <<'PY'
          import pathlib,sys,tarfile
          with tarfile.open(sys.argv[1],'r:gz') as h:
              for m in h.getmembers():
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit('unsafe archive path')
              try: h.extractall(sys.argv[2],filter='data')
              except TypeError: h.extractall(sys.argv[2])
          PY
          launcher="$work/unpacked/Tibia/Tibia"
          [[ -x "$launcher" ]]
          echo TRACK_A_CURRENT_LAUNCHER_SHA256="$(sha256sum "$launcher" | awk '{print $1}')"
          echo TRACK_A_CURRENT_LAUNCHER_SIZE="$(stat -c %s "$launcher")"

          proxy_lib="$(find "$toolroot" -type f -name 'libproxychains.so.4' -print -quit)"
          vk_icd="$(find "$toolroot/usr/share/vulkan/icd.d" -type f -name 'lvp_icd*.json' -print -quit 2>/dev/null || true)"
          swrast="$(find "$toolroot" \( -type f -o -type l \) -name 'swrast_dri.so' -print -quit 2>/dev/null || true)"
          [[ -n "$proxy_lib" && -n "$vk_icd" && -n "$swrast" ]]
          proxy_conf="$work/proxychains.conf"
          printf '%s\n' strict_chain proxy_dns quiet_mode \
            'tcp_read_time_out 15000' 'tcp_connect_time_out 8000' \
            '[ProxyList]' "socks5 127.0.0.1 $TRACK_WARP_PORT" >"$proxy_conf"
          chmod 600 "$proxy_conf"
          dri_dir="$(dirname "$swrast")"
          launcher_dir="$(dirname "$launcher")"
          cd "$launcher_dir"
          env -u RUNNER_TRACKING_ID OTCLIENT_TIBIA_RE_TRACK=official-client-re \
            HOME="$state/home" XDG_DATA_HOME="$state/home/.local/share" DISPLAY="$TRACK_DISPLAY" \
            PATH="$tool_path" LD_LIBRARY_PATH="$launcher_dir:$launcher_dir/lib:$tool_lib" \
            LIBGL_ALWAYS_SOFTWARE=1 LIBGL_DRIVERS_PATH="$dri_dir" QT_QUICK_BACKEND=software QT_XCB_GL_INTEGRATION=none \
            VK_ICD_FILENAMES="$vk_icd" VK_DRIVER_FILES="$vk_icd" \
            LD_PRELOAD="$proxy_lib" PROXYCHAINS_CONF_FILE="$proxy_conf" \
            nohup "$launcher" >"$evidence/launcher.log" 2>&1 </dev/null &
          launcher_pid=$!
          echo TRACK_A_CURRENT_LAUNCHER_PID="$launcher_pid"

          new_sha=''
          stable=0
          for _ in $(seq 1 240); do
            if [[ -s "$client" ]]; then
              sha="$(sha256sum "$client" | awk '{print $1}')"
              if [[ "$sha" != "$OLD_CLIENT_SHA256" ]]; then
                if [[ "$sha" == "$new_sha" ]]; then stable=$((stable+1)); else new_sha="$sha"; stable=0; fi
                (( stable >= 3 )) && break
              fi
            fi
            sleep 2
          done
          [[ -n "$new_sha" && "$new_sha" != "$OLD_CLIENT_SHA256" && $stable -ge 3 ]]
          echo TRACK_A_CURRENT_CHILD_SHA256="$new_sha"
          echo TRACK_A_CURRENT_CHILD_SIZE="$(stat -c %s "$client")"
          python3 - "$client" <<'PY'
          import pathlib,re,sys
          data=pathlib.Path(sys.argv[1]).read_bytes(); seen=[]
          for m in re.finditer(rb'15\.[0-9]{2}(?:\.[A-Za-z0-9]+)?',data):
              s=m.group().decode('ascii','ignore')
              if s not in seen: seen.append(s)
          print('TRACK_A_CURRENT_CHILD_VERSION_STRINGS='+','.join(seen[:20]))
          PY
          echo TRACK_A_CURRENT_CHILD_RECOVERED=true

          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" -fsS --max-time 15 \
            https://www.cloudflare.com/cdn-cgi/trace >"$work/warp-after.txt"
          grep -Eq '^warp=(on|plus)$' "$work/warp-after.txt"
          echo TRACK_A_RECOVERY_WARP_STILL_VERIFIED=true

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-current-child-recovery
          path: artifacts/track-a-current-child/**
          if-no-files-found: warn
          retention-days: 7

name: Track A protobuf descriptor census
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-protobuf-descriptor-census.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      PARSER_REVISION: "2"
    steps:
      - name: Census embedded FileDescriptorProto records
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$PARSER_REVISION" == 2 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          python3 - "$client" <<'PY'
          import re,sys
          data=open(sys.argv[1],'rb').read()
          TARGETS={
            'GameserverMessageMoveCreature','GameserverMessagePlayerDataCurrent',
            'GameserverMessageContainer','GameserverMessageTalk',
            'GameclientMessageMoveObject','GameclientMessageAttack','GameclientMessageFollow',
            'GameclientMessageTalk','GameclientMessageTradeObject','GameclientMessageGoPath',
            'WorldmapObjectPosition','ObjectIdentifierAndPosition','Coordinate'
          }
          def varint(p,end):
              v=0;s=0
              while p<end and s<70:
                  c=data[p];p+=1;v|=(c&0x7f)<<s
                  if not c&0x80:return v,p
                  s+=7
              raise ValueError
          def fields(start,end,limit=200000):
              p=start;out=[]
              for _ in range(limit):
                  if p>=end:break
                  try:k,p2=varint(p,end)
                  except:break
                  no=k>>3;wt=k&7
                  if no==0 or wt not in (0,1,2,5):break
                  p=p2
                  if wt==0:
                      try:v,p=varint(p,end)
                      except:break
                      out.append((no,wt,v,None))
                  elif wt==1:
                      if p+8>end:break
                      out.append((no,wt,None,(p,p+8)));p+=8
                  elif wt==5:
                      if p+4>end:break
                      out.append((no,wt,None,(p,p+4)));p+=4
                  else:
                      try:n,p2=varint(p,end)
                      except:break
                      if n>20_000_000 or p2+n>end:break
                      out.append((no,wt,n,(p2,p2+n)));p=p2+n
              return out,p
          def txt(sp):
              if not sp:return ''
              try:return data[sp[0]:sp[1]].decode('utf-8')
              except:return ''
          def parse_field(sp):
              fs,endp=fields(sp[0],sp[1]);d={}
              if endp!=sp[1]:return None
              for no,wt,v,s in fs:
                  if no in (1,2,6) and wt==2:d[no]=txt(s)
                  elif no in (3,4,5,9) and wt==0:d[no]=v
              if not d.get(1) or 3 not in d:return None
              return {'name':d.get(1),'extendee':d.get(2),'number':d.get(3),'label':d.get(4),'type':d.get(5),'type_name':d.get(6),'oneof_index':d.get(9)}
          def parse_msg(sp):
              fs,endp=fields(sp[0],sp[1]);name='';fds=[];nested=[];oneofs=[]
              if endp!=sp[1]:return None
              for no,wt,v,s in fs:
                  if no==1 and wt==2:name=txt(s)
                  elif no==2 and wt==2:
                      f=parse_field(s)
                      if f:fds.append(f)
                  elif no==3 and wt==2:
                      n=parse_msg(s)
                      if n:nested.append(n)
                  elif no==8 and wt==2:
                      os,oe=fields(s[0],s[1]);on=''
                      if oe==s[1]:
                          for a,b,c,d in os:
                              if a==1 and b==2:on=txt(d)
                      oneofs.append(on)
              if not name or not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*',name):return None
              return {'name':name,'fields':fds,'nested':nested,'oneofs':oneofs}
          starts=[]
          for m in re.finditer(rb'([A-Za-z0-9_./-]{1,120}\.proto)',data):
              name=m.group(1); pos=m.start()
              for st in range(max(0,pos-6),pos):
                  try:
                      if data[st]!=0x0a:continue
                      ln,p2=varint(st+1,pos+1)
                      if p2==pos and ln==len(name):
                          starts.append((st,name.decode()));break
                  except:pass
          uniq_starts=[];seen_starts=set()
          for x in starts:
              if x[0] not in seen_starts:seen_starts.add(x[0]);uniq_starts.append(x)
          valid=[]
          for st,hint in uniq_starts:
              fs,endp=fields(st,min(len(data),st+2_000_000))
              fname='';pkg='';msgs=[]
              for no,wt,v,sp in fs:
                  if no==1 and wt==2 and not fname:fname=txt(sp)
                  elif no==2 and wt==2 and not pkg:pkg=txt(sp)
                  elif no==4 and wt==2:
                      m=parse_msg(sp)
                      if m:msgs.append(m)
              if fname==hint and msgs:
                  valid.append((st,endp,{'name':fname,'package':pkg,'messages':msgs}))
          uniq=[];seen=set()
          for st,endp,f in valid:
              sig=(f['name'],tuple(m['name'] for m in f['messages']))
              if sig in seen:continue
              seen.add(sig);uniq.append((st,endp,f))
          print('TRACK_A_PROTOBUF_DESCRIPTOR_CENSUS_BEGIN=true')
          print('PARSER_REVISION=2')
          print(f'DESCRIPTOR_CANDIDATE_COUNT={len(uniq_starts)}')
          print(f'DESCRIPTOR_COUNT={len(uniq)}')
          found={t:[] for t in TARGETS}
          def visit(f,m,prefix=''):
              full=prefix+m['name']
              if m['name'] in TARGETS:
                  found[m['name']].append((f,m))
                  print(f' TARGET_MESSAGE file={f["name"]} package={f["package"]} name={m["name"]} fields={len(m["fields"])} oneofs={m["oneofs"]!r}')
                  for x in m['fields']:
                      print('  FIELD name={name} number={number} label={label} type={type} type_name={type_name} oneof_index={oneof_index}'.format(**x))
              for n in m['nested']:visit(f,n,full+'.')
          for st,endp,f in uniq:
              print(f'DESCRIPTOR start=0x{st:x} end=0x{endp:x} name={f["name"]} package={f["package"]} messages={len(f["messages"])}')
              for m in f['messages']:visit(f,m)
          for t in sorted(TARGETS):
              print(f'TARGET name={t} embedded_descriptor={str(bool(found[t])).lower()}')
          missing=[t for t in TARGETS if not found[t]]
          print('TARGET_DESCRIPTOR_NOT_EMBEDDED='+str(bool(missing)).lower())
          if missing:print('MISSING_TARGETS='+','.join(sorted(missing)))
          print('TRACK_A_PROTOBUF_DESCRIPTOR_CENSUS_COMPLETE=true')
          PY

name: Track A embedded worldmap proto descriptor enumeration
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-protobuf-worldmap-descriptors.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 6
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Enumerate serialized FileDescriptorProto records containing worldmap messages
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]

          python3 - "$client" <<'PY'
          import re,sys
          data=open(sys.argv[1],'rb').read()
          def varint(p,end):
              v=0;s=0
              while p<end and s<70:
                  c=data[p];p+=1;v|=(c&0x7f)<<s
                  if not c&0x80:return v,p
                  s+=7
              raise ValueError
          def fields(start,end,limit=200000):
              p=start;out=[]
              for _ in range(limit):
                  if p>=end:break
                  try:k,p2=varint(p,end)
                  except:break
                  no=k>>3;wt=k&7
                  if no==0 or wt not in (0,1,2,5):break
                  p=p2
                  if wt==0:
                      try:v,p=varint(p,end)
                      except:break
                      out.append((no,wt,v,None))
                  elif wt==1:
                      if p+8>end:break
                      out.append((no,wt,None,(p,p+8)));p+=8
                  elif wt==5:
                      if p+4>end:break
                      out.append((no,wt,None,(p,p+4)));p+=4
                  else:
                      try:n,p2=varint(p,end)
                      except:break
                      if n>20_000_000 or p2+n>end:break
                      out.append((no,wt,n,(p2,p2+n)));p=p2+n
              return out,p
          def txt(sp):
              if not sp:return ''
              try:return data[sp[0]:sp[1]].decode('utf-8')
              except:return ''
          def parse_field(sp):
              fs,_=fields(sp[0],sp[1]);d={}
              for no,wt,v,s in fs:
                  if no in (1,2,6) and wt==2:d[no]=txt(s)
                  elif no in (3,4,5,9) and wt==0:d[no]=v
              return d
          def parse_msg(sp):
              fs,_=fields(sp[0],sp[1]);name='';fds=[];nested=[];oneofs=[]
              for no,wt,v,s in fs:
                  if no==1 and wt==2:name=txt(s)
                  elif no==2 and wt==2:fds.append(parse_field(s))
                  elif no==3 and wt==2:nested.append(parse_msg(s))
                  elif no==8 and wt==2:
                      os,_=fields(s[0],s[1]);on=''
                      for a,b,c,d in os:
                          if a==1 and b==2:on=txt(d)
                      oneofs.append(on)
              return name,fds,nested,oneofs

          # Find plausible FileDescriptorProto starts: field 1 string ending .proto.
          starts=[]
          for m in re.finditer(rb'([A-Za-z0-9_./-]{1,120}\.proto)',data):
              name=m.group(1);n=len(name); pos=m.start()
              # Search up to 6 bytes backward for tag 0x0a + varint(len).
              for st in range(max(0,pos-6),pos):
                  try:
                      if data[st]!=0x0a:continue
                      ln,p2=varint(st+1,pos+1)
                      if p2==pos and ln==n:
                          starts.append((st,name.decode()));break
                  except:pass
          # de-dup starts
          uniq=[];seen=set()
          for x in starts:
              if x[0] not in seen:seen.add(x[0]);uniq.append(x)
          print(f'TRACK_A_PROTO_DESCRIPTOR_CANDIDATE_COUNT={len(uniq)}')
          targets={'WorldmapObjectPosition','ObjectPosition','ObjectIdentifierAndPosition','GameserverMessageCreateOnMap','GameserverMessageChangeOnMap','GameserverMessageDeleteOnMap','MapField','MapFieldData','Coordinate'}
          matched=[]
          for st,hint in uniq:
              fs,endp=fields(st,min(len(data),st+2_000_000))
              fname='';pkg='';msgs=[]
              for no,wt,v,sp in fs:
                  if no==1 and wt==2:fname=txt(sp)
                  elif no==2 and wt==2:pkg=txt(sp)
                  elif no==4 and wt==2:
                      m=parse_msg(sp)
                      if m[0]:msgs.append(m)
              names={m[0] for m in msgs}
              hit=sorted(names & targets)
              if hit:
                  matched.append((st,fname,pkg,hit,msgs,endp))
          print(f'TRACK_A_PROTO_DESCRIPTOR_MATCH_COUNT={len(matched)}')
          for st,fname,pkg,hit,msgs,endp in matched:
              print(f'FILE start=0x{st:x} end=0x{endp:x} name={fname!r} package={pkg!r} hits={",".join(hit)} messages={len(msgs)}')
              for name,fds,nested,oneofs in msgs:
                  if name in targets:
                      print(f'MESSAGE name={name} oneofs={oneofs!r}')
                      for f in fds:
                          print(' FIELD '+ ' '.join(f'{k}={v!r}' for k,v in sorted(f.items())))
                      for nn,nfds,nnested,noneofs in nested:
                          print(f' NESTED name={nn} oneofs={noneofs!r}')
                          for f in nfds:
                              print('  FIELD '+ ' '.join(f'{k}={v!r}' for k,v in sorted(f.items())))
          print('TRACK_A_PROTO_DESCRIPTOR_ENUMERATION_COMPLETE=true')
          PY

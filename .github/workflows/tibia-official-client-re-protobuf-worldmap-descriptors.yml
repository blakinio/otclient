name: Track A embedded map proto descriptor decode
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-protobuf-worldmap-descriptors.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Decode serialized FileDescriptorProto for map.proto
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]

          python3 - "$client" <<'PY'
          import sys
          data=open(sys.argv[1],'rb').read()
          marker=b'\x0a\x09map.proto'
          starts=[]; p=0
          while True:
              p=data.find(marker,p)
              if p<0: break
              starts.append(p); p+=1
          print('TRACK_A_MAP_PROTO_MARKERS='+','.join(hex(x) for x in starts))

          def varint(buf,p,end):
              v=0; s=0
              while p<end and s<70:
                  c=buf[p]; p+=1; v|=(c&0x7f)<<s
                  if not c&0x80:return v,p
                  s+=7
              raise ValueError('bad varint')
          def fields(buf,start,end,limit=10000):
              p=start; out=[]
              for _ in range(limit):
                  if p>=end: break
                  try:k,np=varint(buf,p,end)
                  except:break
                  no=k>>3; wt=k&7
                  if no==0 or wt not in (0,1,2,5):break
                  p=np
                  if wt==0:
                      try:v,p=varint(buf,p,end)
                      except:break
                      out.append((no,wt,v,None))
                  elif wt==1:
                      if p+8>end:break
                      out.append((no,wt,None,(p,p+8)));p+=8
                  elif wt==5:
                      if p+4>end:break
                      out.append((no,wt,None,(p,p+4)));p+=4
                  else:
                      try:n,p2=varint(buf,p,end)
                      except:break
                      if n>50_000_000 or p2+n>end:break
                      out.append((no,wt,n,(p2,p2+n)));p=p2+n
              return out,p
          def text(span):
              if not span:return ''
              b=data[span[0]:span[1]]
              try:return b.decode('utf-8')
              except:return ''
          def parse_field_descriptor(a,b):
              fs,_=fields(data,a,b)
              d={}
              for no,wt,v,sp in fs:
                  if no in (1,2,6) and wt==2:d[no]=text(sp)
                  elif no in (3,4,5) and wt==0:d[no]=v
              return d
          def parse_descriptor(a,b):
              fs,_=fields(data,a,b)
              name=''; fds=[]
              for no,wt,v,sp in fs:
                  if no==1 and wt==2:name=text(sp)
                  elif no==2 and wt==2:fds.append(parse_field_descriptor(*sp))
              return name,fds

          # Try protobuf runtime first; use candidate lengths until a descriptor parses and
          # contains the map-position messages we care about.
          found=False
          try:
              from google.protobuf import descriptor_pb2
              for st in starts:
                  for size in range(512,200000,256):
                      if st+size>len(data):break
                      fd=descriptor_pb2.FileDescriptorProto()
                      try:fd.ParseFromString(data[st:st+size])
                      except:continue
                      names={m.name for m in fd.message_type}
                      if fd.name=='map.proto' and ('WorldmapObjectPosition' in names or 'ObjectPosition' in names):
                          print(f'TRACK_A_MAP_PROTO_RUNTIME_PARSE=true start=0x{st:x} trial_size={size} package={fd.package}')
                          for m in fd.message_type:
                              if m.name in {'WorldmapObjectPosition','ObjectPosition','ObjectIdentifierAndPosition','MapField','MapFieldData','Coordinate'}:
                                  print(f'MESSAGE name={m.name}')
                                  for f in m.field:
                                      print(f' FIELD name={f.name} number={f.number} label={f.label} type={f.type} type_name={f.type_name} oneof={f.oneof_index if f.HasField("oneof_index") else -1}')
                          found=True;break
                  if found:break
          except Exception as e:
              print('TRACK_A_PROTOBUF_RUNTIME_UNAVAILABLE_OR_FAILED='+repr(e))

          # Manual top-level recovery: parse from every exact marker and print every nested
          # DescriptorProto-looking field #4 entry whose name matches target messages.
          print('TRACK_A_MAP_PROTO_MANUAL_PARSE_BEGIN=true')
          targets={'WorldmapObjectPosition','ObjectPosition','ObjectIdentifierAndPosition','MapField','MapFieldData','Coordinate'}
          for st in starts:
              top,endp=fields(data,st,min(len(data),st+300000))
              top_name=''; package=''; msgs=[]
              for no,wt,v,sp in top:
                  if no==1 and wt==2:top_name=text(sp)
                  elif no==2 and wt==2:package=text(sp)
                  elif no==4 and wt==2:
                      nm,fds=parse_descriptor(*sp)
                      if nm:msgs.append((nm,fds,sp))
              print(f'FILE start=0x{st:x} parsed_end=0x{endp:x} name={top_name!r} package={package!r} message_count={len(msgs)}')
              for nm,fds,sp in msgs:
                  if nm in targets:
                      print(f'MESSAGE name={nm} span=0x{sp[0]:x}-0x{sp[1]:x}')
                      for f in fds:
                          print(' FIELD '+ ' '.join(f'{k}={v!r}' for k,v in sorted(f.items())))
          print('TRACK_A_MAP_PROTO_MANUAL_PARSE_END=true')
          print('TRACK_A_MAP_PROTO_DESCRIPTOR_DECODE_COMPLETE=true')
          PY

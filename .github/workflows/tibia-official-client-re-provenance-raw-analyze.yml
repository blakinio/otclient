name: Track A analyze live provenance raw dumps
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/tibia-official-client-re-provenance-raw-analyze.yml']
jobs:
  analyze:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Correlate mutation messages with strip objects
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          python3 - "$state/runtime/map-provenance-persistent-events.tsv" "$state/runtime/map-provenance-persistent-raw.log" "$state/runtime/map-provenance-persistent-strips.tsv" <<'PY'
          import sys,re,struct,collections
          ep,rp,sp=sys.argv[1:]
          events=[]
          for l in open(ep,errors='replace'):
            p=l.rstrip().split('\t');
            if len(p)>=2: events.append((int(p[0]),p[1],l.rstrip()))
          rx=re.compile(r'^(\d+)\s+(\S+)\s+(0x[0-9a-fA-F]+)\s+([0-9a-fA-F]+)$')
          raws=[]
          for l in open(rp,errors='replace'):
            m=rx.match(l.strip())
            if m: raws.append((int(m[1]),m[2],int(m[3],16),bytes.fromhex(m[4])))
          strips=[]
          for l in open(sp,errors='replace'):
            p=l.rstrip().split('\t')
            if len(p)>=7:
              try: strips.append((int(p[0]),int(p[1]),int(p[2]),int(p[3]),int(p[4]),int(p[5],16),bytes.fromhex(p[6])))
              except: pass
          print('COUNTS',len(events),len(raws),len(strips))
          # Partition by [event_i,event_i+1), and require matching handler label.
          groups=[]
          for i,(ns,kind,line) in enumerate(events):
            end=events[i+1][0] if i+1<len(events) else ns+1_000_000_000
            rr=[r for r in raws if ns<=r[0]<end and r[1].startswith(kind+':')]
            groups.append((ns,kind,line,rr))
          def q(b,o,n=8):
            if o+n>len(b): return None
            return int.from_bytes(b[o:o+n],'little')
          def coord_hits(b):
            out=[]
            # plausible current area values as u16/u32 at all offsets
            for sz in (2,4):
              for o in range(0,len(b)-sz+1):
                v=int.from_bytes(b[o:o+sz],'little')
                if 32400<=v<=32650: out.append((o,sz,v))
            return out
          candidate_ids=collections.Counter()
          print('EVENT_DECODE_BEGIN')
          for i,(ns,kind,line,rr) in enumerate(groups):
            print('EVENT',i,line)
            direct={lab:(addr,b) for _,lab,addr,b in rr}
            for lab in (kind+':rsi',kind+':rsi+0x18->',kind+':rsi+0x20->',kind+':rsi+0x30->',kind+':rcx'):
              if lab not in direct: continue
              addr,b=direct[lab]
              vals=[q(b,o) for o in (0x20,0x28,0x30,0x38,0x40,0x48,0x50,0x58)]
              hits=coord_hits(b)
              print('OBJ',i,lab,hex(addr),'qwords',','.join('none' if v is None else hex(v) for v in vals),'coordhits',hits[:30])
              if lab==kind+':rsi+0x20->' and q(b,0x30) is not None:
                candidate_ids[q(b,0x30)]+=1
          print('EVENT_DECODE_END')
          print('CANDIDATE_IDS',candidate_ids.most_common())
          # Decode strip object candidate id at +0x30 and enumerate candidate hits.
          tid=collections.Counter()
          byid=collections.defaultdict(list)
          for s in strips:
            v=q(s[6],0x30)
            if v is not None:
              tid[v]+=1; byid[v].append(s)
          print('STRIP_TOP_IDS',tid.most_common(40))
          for cid,n in candidate_ids.items():
            arr=byid.get(cid,[])
            print('CANDIDATE_STRIP_ID',cid,'count',len(arr))
            for s in arr[-40:]: print('CANDIDATE_STRIP',cid,*s[:6],sep='\t')
          # Positions around all multi-stack tiles after return; useful for matching the controlled tile.
          tile=collections.defaultdict(list)
          for s in strips: tile[(s[1],s[2],s[3])].append((s[4],q(s[6],0x30),s[0],s[5]))
          print('MULTISTACK_TILES_BEGIN')
          for pos,arr in sorted(tile.items()):
            if max(x[0] for x in arr)>=1:
              ids=sorted(set((x[0],x[1]) for x in arr))
              print('TILE',*pos,'STACK_IDS',ids)
          print('MULTISTACK_TILES_END')
          PY

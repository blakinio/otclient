name: Track A analyze live provenance raw dumps

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tibia-official-client-re-provenance-raw-analyze.yml'

jobs:
  analyze:
    runs-on: [self-hosted, linux, x64, synology-otclient]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Analyze mutation raw dumps against reloaded strips
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          runtime="$state/runtime"
          ev="$runtime/map-provenance-persistent-events.tsv"
          raw="$runtime/map-provenance-persistent-raw.log"
          strips="$runtime/map-provenance-persistent-strips.tsv"
          [[ -s "$ev" && -s "$raw" && -s "$strips" ]]
          python3 - "$ev" "$raw" "$strips" <<'PY'
          import sys,re,struct,collections
          evp,rawp,sp=sys.argv[1:]
          events=[]
          for ln in open(evp,errors='replace'):
              p=ln.rstrip('\n').split('\t')
              if len(p)>=2: events.append((int(p[0]),p[1],ln.rstrip()))
          raws=[]
          rx=re.compile(r'^(\d+)\s+(\S+)\s+(0x[0-9a-fA-F]+)\s+([0-9a-fA-F]+)$')
          for ln in open(rawp,errors='replace'):
              m=rx.match(ln.strip())
              if m:
                  ns=int(m.group(1)); label=m.group(2); addr=int(m.group(3),16); b=bytes.fromhex(m.group(4)); raws.append((ns,label,addr,b))
          strips=[]
          for ln in open(sp,errors='replace'):
              p=ln.rstrip('\n').split('\t')
              if len(p)>=7:
                  try: strips.append((int(p[0]),int(p[1]),int(p[2]),int(p[3]),int(p[4]),int(p[5],16),bytes.fromhex(p[6])))
                  except: pass
          print(f'ANALYZE_EVENTS={len(events)}')
          print(f'ANALYZE_RAW_DUMPS={len(raws)}')
          print(f'ANALYZE_STRIPS={len(strips)}')
          print('EVENTS_BEGIN')
          for e in events: print(e[2])
          print('EVENTS_END')
          # Assign raw dumps to nearest preceding event within 200ms.
          byevent=[]
          for ens,kind,_ in events:
              rr=[r for r in raws if ens <= r[0] <= ens+200_000_000]
              byevent.append((ens,kind,rr))
          for i,(ens,kind,rr) in enumerate(byevent):
              print(f'RAW_EVENT_{i}_{kind}_COUNT={len(rr)}')
              for ns,label,addr,b in rr[:40]:
                  # show first 96 bytes only to keep logs bounded
                  print(f'RAW_EVENT_{i}\t{label}\t0x{addr:x}\t{b[:96].hex()}')
          # Focus on CreateOnMap rsi and rsi pointer-derefs.
          creates=[]
          for i,(ens,kind,rr) in enumerate(byevent):
              if kind!='CreateOnMap': continue
              for ns,label,addr,b in rr:
                  if label.startswith('CreateOnMap:rsi'):
                      creates.append((i,label,addr,b))
          print(f'CREATE_RSI_DUMPS={len(creates)}')
          # Exact/subsequence comparisons with strip object bytes.
          for ci,label,addr,b in creates:
              exact=[]; prefix=[]
              for j,s in enumerate(strips):
                  sb=s[6]
                  if b[:min(64,len(b),len(sb))] == sb[:min(64,len(b),len(sb))]: prefix.append(j)
                  if len(b)>=32 and b[:32] in sb: exact.append(j)
              print(f'CREATE_{ci}_{label}_PREFIX_STRIP_MATCHES={prefix[:20]}')
              print(f'CREATE_{ci}_{label}_SUB32_STRIP_MATCHES={exact[:20]}')
          # Candidate scalar signatures: values at stable offsets in Create rsi dumps that also occur
          # at stable offsets in strip object bytes. Restrict to plausible Tibia thing ids.
          cbase=[x for x in creates if x[1]=='CreateOnMap:rsi']
          if cbase:
              coff=collections.defaultdict(list)
              for _,_,_,b in cbase:
                  for off in range(0,min(192,len(b))-1):
                      v=struct.unpack_from('<H',b,off)[0]
                      if 100 <= v <= 65535: coff[off].append(v)
              soff=collections.defaultdict(collections.Counter)
              for s in strips:
                  b=s[6]
                  for off in range(0,min(128,len(b))-1):
                      v=struct.unpack_from('<H',b,off)[0]
                      if 100 <= v <= 65535: soff[off][v]+=1
              cand=[]
              for co,vals in coff.items():
                  for so,cnt in soff.items():
                      score=sum(cnt[v] for v in vals)
                      uniq=len(set(vals))
                      if score:
                          cand.append((score,uniq,co,so,vals,[cnt[v] for v in vals]))
              cand.sort(reverse=True)
              print('U16_CANDIDATES_BEGIN')
              for row in cand[:80]: print('U16_CAND',*row,sep='\t')
              print('U16_CANDIDATES_END')
          # Print strip tail with coordinates/order/address and first 96 bytes for manual correlation.
          print('STRIP_TAIL_BEGIN')
          for s in strips[-120:]:
              print(f'{s[0]}\t{s[1]}\t{s[2]}\t{s[3]}\t{s[4]}\t0x{s[5]:x}\t{s[6][:96].hex()}')
          print('STRIP_TAIL_END')
          PY

name: Track A Qt 6.9.3 QLibrary source correlation v2

on:
  pull_request:
    branches: [main]
    paths:
      - docs/agents/tasks/active/OTC-20260816-track-a-qlibrary-linux-resolution-hosted.md
      - docs/agents/reports/OTCLIENT-20260816-qlibrary-linux-resolution-source-correlated.md
      - .github/workflows/tibia-official-client-re-qlibrary-linux-resolution-hosted-v2.yml

permissions:
  contents: read

jobs:
  validate-official-qt-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate official Qt 6.9.3 source and candidate semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import urllib.request

          base = 'https://raw.githubusercontent.com/qt/qtbase/v6.9.3/src/corelib/plugin/'
          expected = {
              'qlibrary_unix.cpp': '9b9495f491b71e0fda0a9eff972298b118eb6f68488bb5da73f6e56c450f1a7e',
              'qlibrary_p.h': '32d89e6dee9cbaab5777f98b0bc4dea8da45fffcb058604fdf35daa55efdc24e',
          }
          source = {}
          for name, wanted in expected.items():
              with urllib.request.urlopen(base + name, timeout=30) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'VALIDATOR_FAIL=source_hash_{name} actual={actual}')
              source[name] = data.decode('utf-8')
              print(f'QT_SOURCE_HASH_PASS={name}:{actual}')

          unix = source['qlibrary_unix.cpp']
          private = source['qlibrary_p.h']
          unix_needles = {
              'generic_so_suffix': 'suffixes << ".so"_L1;',
              'absolute_branch': 'if (fsEntry.isAbsolute()) {',
              'absolute_empty_suffix_first': 'suffixes.prepend(QString());',
              'absolute_empty_prefix_first': 'prefixes.prepend(QString());',
              'haswell_gate': 'if (qCpuHasFeature(ArchHaswell)) {',
              'glibc_hwcaps_transform': 'transform(prefixes, [](QString *s) { s->prepend("glibc-hwcaps/x86-64-v3/"_L1); });',
              'prefix_outer_loop': 'for (int prefix = 0; retry && !hnd && prefix < prefixes.size(); prefix++) {',
              'suffix_inner_loop': 'for (int suffix = 0; retry && !hnd && suffix < suffixes.size(); suffix++) {',
              'suffix_duplicate_skip': 'if (!suffixes.at(suffix).isEmpty() && name.endsWith(suffixes.at(suffix)))',
              'attempt_formula': 'attempt = path + prefixes.at(prefix) + name + suffixes.at(suffix);',
              'dlopen_attempt': 'hnd = dlopen(QFile::encodeName(attempt), dlFlags);',
              'absolute_exists_stop': "if (!hnd && fileName.startsWith(u'/') && QFile::exists(attempt)) {",
              'retry_false': 'retry = false;',
          }
          for label, needle in unix_needles.items():
              if needle not in unix:
                  raise SystemExit(f'VALIDATOR_FAIL={label}')
              print(f'VALIDATOR_PASS={label}')
          if 'return u"lib";' not in private:
              raise SystemExit('VALIDATOR_FAIL=generic_lib_prefix')
          print('VALIDATOR_PASS=generic_lib_prefix')

          path = '<APPDIR>/BattlEye/'
          name = 'BEClient'
          suffixes = ['', '.so']

          def candidates(prefixes):
              return [path + prefix + name + suffix for prefix in prefixes for suffix in suffixes]

          no_haswell = candidates(['', 'lib'])
          expected_no_haswell = [
              '<APPDIR>/BattlEye/BEClient',
              '<APPDIR>/BattlEye/BEClient.so',
              '<APPDIR>/BattlEye/libBEClient',
              '<APPDIR>/BattlEye/libBEClient.so',
          ]
          if no_haswell != expected_no_haswell:
              raise SystemExit('VALIDATOR_FAIL=no_haswell_candidate_order')

          haswell = candidates([
              'glibc-hwcaps/x86-64-v3/',
              '',
              'glibc-hwcaps/x86-64-v3/lib',
              'lib',
          ])
          expected_haswell = [
              '<APPDIR>/BattlEye/glibc-hwcaps/x86-64-v3/BEClient',
              '<APPDIR>/BattlEye/glibc-hwcaps/x86-64-v3/BEClient.so',
              '<APPDIR>/BattlEye/BEClient',
              '<APPDIR>/BattlEye/BEClient.so',
              '<APPDIR>/BattlEye/glibc-hwcaps/x86-64-v3/libBEClient',
              '<APPDIR>/BattlEye/glibc-hwcaps/x86-64-v3/libBEClient.so',
              '<APPDIR>/BattlEye/libBEClient',
              '<APPDIR>/BattlEye/libBEClient.so',
          ]
          if haswell != expected_haswell:
              raise SystemExit('VALIDATOR_FAIL=haswell_candidate_order')

          target = '<APPDIR>/BattlEye/BEClient.so'
          if no_haswell.index(target) != 1 or haswell.index(target) != 3:
              raise SystemExit('VALIDATOR_FAIL=BEClient_so_candidate_index')

          print('QLIB_POTENTIAL_CANDIDATES_ARCH_HASWELL_FALSE=' + ','.join(no_haswell))
          print('QLIB_POTENTIAL_CANDIDATES_ARCH_HASWELL_TRUE=' + ','.join(haswell))
          print('VALIDATOR_PASS=BEClient_so_generated index_no_haswell=1 index_haswell=3')
          print('VALIDATOR_PASS=actual_dlopen_sequence_is_conditional_prefix')
          print('VALIDATOR_CLASSIFICATION=OFFICIAL_QT_6_9_3_SOURCE_CORRELATED')
          print('VALIDATOR_ACTUAL_SUCCESSFUL_MAPPING=UNKNOWN')
          print('VALIDATOR_RUNTIME_ACCESS=none')
          print('VALIDATOR_PROPRIETARY_ARTIFACT_ACCESS=false')
          PY

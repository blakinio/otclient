name: Track A QLibrary Linux resolution static probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-qlibrary-linux-resolution-static.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-qlibrary-linux-resolution-static.md

permissions:
  contents: read

jobs:
  inspect:
    name: Inventory exact linked QtCore statically
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Identify client dynamic linkage and retained QtCore files
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${RUNNER_NAME:-}" == 'synology-otclient-01' ]] || exit 2
          root='/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31904939696/package'
          client="$root/bin/client"
          [[ -f "$client" ]] || exit 3
          [[ "$(stat -c '%s' "$client")" == '51965216' ]] || exit 4
          [[ "$(sha256sum "$client" | awk '{print $1}')" == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe' ]] || exit 5
          echo 'QLIB_CLIENT_FENCE=PASS'
          python3 - "$root" "$client" <<'PY'
          import hashlib,os,pathlib,re,struct,sys
          root=pathlib.Path(sys.argv[1]); client=pathlib.Path(sys.argv[2])
          def parse_elf(path):
              d=path.read_bytes()
              if d[:4]!=b'\x7fELF' or d[4]!=2 or d[5]!=1: raise ValueError(f'unsupported ELF: {path}')
              h=struct.unpack_from('<HHIQQQIHHHHHH',d,16)
              _,_,_,_,_,shoff,_,_,_,_,shentsz,shnum,shstrndx=h
              sf='<IIQQQQIIQQ'; raw=[struct.unpack_from(sf,d,shoff+i*shentsz) for i in range(shnum)]
              st=raw[shstrndx]; shnames=d[st[4]:st[4]+st[5]]
              def cs(blob,o):
                  if not (0<=o<len(blob)):return ''
                  e=blob.find(b'\0',o);e=len(blob) if e<0 else e
                  return blob[o:e].decode('utf8','replace')
              secs=[]
              for i,x in enumerate(raw):
                  secs.append({'idx':i,'name':cs(shnames,x[0]),'type':x[1],'flags':x[2],'addr':x[3],'off':x[4],'size':x[5],'link':x[6],'entsize':x[9]})
              by={s['name']:s for s in secs}
              dyninfo={'needed':[],'soname':None,'rpath':None,'runpath':None}
              dyn=by.get('.dynamic')
              if dyn and 0<=dyn['link']<len(secs):
                  ds=secs[dyn['link']]; strings=d[ds['off']:ds['off']+ds['size']]
                  tags=[]
                  for o in range(dyn['off'],dyn['off']+dyn['size'],dyn['entsize'] or 16):
                      tag,val=struct.unpack_from('<qQ',d,o)
                      if tag==0:break
                      tags.append((tag,val))
                  for tag,val in tags:
                      if tag==1:dyninfo['needed'].append(cs(strings,val))
                      elif tag==14:dyninfo['soname']=cs(strings,val)
                      elif tag==15:dyninfo['rpath']=cs(strings,val)
                      elif tag==29:dyninfo['runpath']=cs(strings,val)
              syms=[]
              sym=by.get('.dynsym')
              if sym and 0<=sym['link']<len(secs):
                  ss=secs[sym['link']]; strings=d[ss['off']:ss['off']+ss['size']]
                  for o in range(sym['off'],sym['off']+sym['size'],sym['entsize'] or 24):
                      no,info,other,si,val,sz=struct.unpack_from('<IBBHQQ',d,o)
                      name=cs(strings,no)
                      if name:syms.append((name,val,sz,si,info))
              return d,dyninfo,syms,secs
          cd,ci,csyms,csecs=parse_elf(client)
          print('QLIB_CLIENT_DYNAMIC_NEEDED='+','.join(ci['needed']))
          print(f'QLIB_CLIENT_RPATH={ci["rpath"] or ""}')
          print(f'QLIB_CLIENT_RUNPATH={ci["runpath"] or ""}')
          print(f'QLIB_CLIENT_SONAME={ci["soname"] or ""}')
          qtcore_needed=[n for n in ci['needed'] if 'Qt6Core' in n or 'QtCore' in n]
          print('QLIB_CLIENT_QTCORE_NEEDED='+','.join(qtcore_needed))
          # Retained files/symlinks with QtCore in name.
          candidates=[]
          for dirpath,dirnames,filenames in os.walk(root):
              for n in filenames:
                  if 'Qt6Core' in n or 'QtCore' in n:
                      p=pathlib.Path(dirpath)/n;candidates.append(p)
              for n in list(dirnames):
                  p=pathlib.Path(dirpath)/n
                  if p.is_symlink() and ('Qt6Core' in n or 'QtCore' in n):candidates.append(p)
          uniq=[];seen=set()
          for p in candidates:
              s=str(p)
              if s not in seen:seen.add(s);uniq.append(p)
          print('QLIB_QTCORE_CANDIDATES_BEGIN')
          for p in sorted(uniq,key=lambda x:str(x)):
              try:
                  resolved=p.resolve(strict=True); data=resolved.read_bytes(); rel=p.relative_to(root)
                  print(f'path={rel} symlink={str(p.is_symlink()).lower()} link={os.readlink(p) if p.is_symlink() else ""} resolved={resolved} size={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
              except Exception as e: print(f'path={p} error={type(e).__name__}:{e}')
          print('QLIB_QTCORE_CANDIDATES_END')
          # Inspect regular unique resolved ELF candidates.
          resolved_seen=set()
          for p in sorted(uniq,key=lambda x:str(x)):
              try:r=p.resolve(strict=True)
              except:continue
              if str(r) in resolved_seen or not r.is_file():continue
              resolved_seen.add(str(r))
              try:qd,qi,qsyms,qsecs=parse_elf(r)
              except Exception as e:
                  print(f'QLIB_QTCORE_PARSE_SKIP={r}:{e}');continue
              print(f'QLIB_QTCORE_ELF path={r} soname={qi["soname"] or ""} needed={";".join(qi["needed"])} rpath={qi["rpath"] or ""} runpath={qi["runpath"] or ""}')
              wanted=[(n,v,z) for n,v,z,si,info in qsyms if ('QLibrary' in n or n in ('qVersion','qt_version_tag') or 'versionString' in n)]
              print('QLIB_QTCORE_DYNSYMS_BEGIN')
              for n,v,z in wanted[:300]:print(f'name={n} value=0x{v:x} size=0x{z:x}')
              print('QLIB_QTCORE_DYNSYMS_END')
              vers=sorted(set(m.group(0).decode('ascii') for m in re.finditer(rb'(?<![0-9])6\.[0-9]{1,2}\.[0-9]{1,2}(?![0-9])',qd)))
              print('QLIB_QTCORE_VERSION_STRINGS='+','.join(vers[:100]))
          print('QLIB_EXECUTED_TARGET=false')
          print('QLIB_LIVE_RUNTIME_OBSERVED=false')
          print('QLIB_MUTATION_PERFORMED=false')
          PY

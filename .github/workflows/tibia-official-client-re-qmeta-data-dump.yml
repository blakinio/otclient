name: Track A QMeta data dump
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-qmeta-data-dump.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Decode calibrated QMeta string and metadata tables
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          python3 - "$client" <<'PY'
          import re,struct,sys
          data=open(sys.argv[1],'rb').read()
          records={
            'GameEvent':(0x1cd7f44,0x1cd7ec0,0xd20800),
            'Chat':(0x1cd8268,0x1cd8060,0xd05f20),
            'Worldmap':(0x1cd8a54,0x1cd8820,0xdf2a60),
            'Effect':(0x1d73f64,0x1d73ee0,0xd338d0),
            'ContainerCandidate0':(0x1cac968,0x1cac8c0,0xdcb130),
            'ContainerCandidate1':(0x1cae518,0x1cae3e0,0xcf2aa0),
            'ContainerCandidate2':(0x1caec88,0x1cae760,0xd1e000),
          }
          phoff=struct.unpack_from('<Q',data,0x20)[0];phentsz=struct.unpack_from('<H',data,0x36)[0];phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,off,va,paddr,filesz,memsz,align=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1:loads.append((off,off+filesz,va,va+filesz,flags))
          def va2off(v):
              for lo,hi,va,vhi,fl in loads:
                  if va<=v<vhi:return lo+(v-va)
          def ascii_at(v,n):
              o=va2off(v)
              if o is None or n<=0 or n>512 or o+n>len(data):return None
              raw=data[o:o+n]
              if not raw or any(b<32 or b>=127 for b in raw):return None
              try:return raw.decode('ascii')
              except:return None
          def zstr(v,maxn=160):
              o=va2off(v)
              if o is None:return None
              e=o
              while e<len(data) and e-o<maxn and 32<=data[e]<127:e+=1
              if e==o:return None
              try:return data[o:e].decode('ascii')
              except:return None
          def strings_near(v,span=0x1200):
              o=va2off(v)
              if o is None:return []
              out=[]
              for m in re.finditer(rb'[ -~]{3,}',data[o:min(len(data),o+span)]):
                  try:s=m.group().decode('ascii')
                  except:continue
                  out.append((m.start(),s))
              return out
          print('TRACK_A_QMETA_DATA_DUMP_BEGIN=true')
          for name,(sb,mb,fn) in records.items():
              so=va2off(sb);mo=va2off(mb)
              print(f'RECORD name={name} stringdata=0x{sb:x} metadata=0x{mb:x} static_metacall=0x{fn:x}')
              if so is None or mo is None:continue
              print(' STRING_U32 '+' '.join(f'{struct.unpack_from("<I",data,so+i*4)[0]:08x}' for i in range(96)))
              print(' META_U32 '+' '.join(f'{struct.unpack_from("<I",data,mo+i*4)[0]:08x}' for i in range(128)))
              near=strings_near(sb)
              for rel,s in near[:80]:print(f' ASCII rel=0x{rel:x} va=0x{sb+rel:x} value={s}')
              # Test common Qt6 offset/length encodings over first 128 pairs.
              hits=[]
              for i in range(128):
                  p=so+i*8
                  if p+8>len(data):break
                  a,b=struct.unpack_from('<II',data,p)
                  sa=struct.unpack('<i',struct.pack('<I',a))[0]
                  candidates=[('BASE',sb+a),('ENTRY',sb+i*8+sa),('AFTER',sb+(i+1)*8+sa)]
                  for mode,v in candidates:
                      s=ascii_at(v,b)
                      if s and (s.startswith('T') or 'handle' in s or 'Message' in s or s in ('','void')):
                          hits.append((i,a,b,mode,v,s))
              for i,a,b,mode,v,s in hits[:160]:print(f' PAIR_HIT index={i} a=0x{a:x} len={b} mode={mode} va=0x{v:x} value={s}')
              # Independently test each u32 as offset to a zero-terminated printable string.
              for i in range(160):
                  w=struct.unpack_from('<I',data,so+i*4)[0]
                  for mode,v in [('BASE',sb+w),('WORD',sb+i*4+struct.unpack('<i',struct.pack('<I',w))[0])]:
                      s=zstr(v)
                      if s and (s.startswith('T') or s.startswith('handle')):
                          print(f' WORD_HIT index={i} word=0x{w:x} mode={mode} va=0x{v:x} value={s}')
          print('TRACK_A_QMETA_DATA_DUMP_COMPLETE=true')
          PY

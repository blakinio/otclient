name: Track A calibrated QMeta record decode
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-qmeta-record-decode-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Decode QMetaObject string and method tables
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          python3 - "$client" <<'PY'
          import struct,sys
          data=open(sys.argv[1],'rb').read()
          # ELF VA -> file offset.
          phoff=struct.unpack_from('<Q',data,0x20)[0];phentsz=struct.unpack_from('<H',data,0x36)[0];phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,off,va,paddr,filesz,memsz,align=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1:loads.append((off,off+filesz,va,va+filesz,flags))
          def va2off(v):
              for lo,hi,va,vhi,fl in loads:
                  if va<=v<vhi:return lo+(v-va)
              return None
          # RELA map.
          shoff=struct.unpack_from('<Q',data,0x28)[0];shentsz=struct.unpack_from('<H',data,0x3a)[0];shnum=struct.unpack_from('<H',data,0x3c)[0]
          relas={}
          for i in range(shnum):
              o=shoff+i*shentsz
              _,typ,_,_,so,ss,_,_,_,se=struct.unpack_from('<IIQQQQIIQQ',data,o)
              if typ!=4 or not se:continue
              for p in range(so,so+ss,se):
                  if p+24>len(data):break
                  ro,ri,ra=struct.unpack_from('<QQq',data,p);relas[ro]=(ri&0xffffffff,ra)
          records={
            'GameEvent':0x3087780,
            'Chat':0x30877c0,
            'Worldmap':0x3087800,
            'Effect':0x30ce780,
            'Container':0x3084f60,
          }
          def ptr(slot):
              return relas.get(slot,(None,None))[1]
          def printable(raw):
              return all(32<=b<127 for b in raw)
          print('TRACK_A_QMETA_V2_BEGIN=true')
          for name,base in records.items():
              sp=ptr(base+8);mp=ptr(base+16);cp=ptr(base+24)
              print(f'RECORD name={name} base=0x{base:x} stringdata=0x{(sp or 0):x} metadata=0x{(mp or 0):x} static_metacall=0x{(cp or 0):x}')
              if sp is None or mp is None:continue
              so=va2off(sp);mo=va2off(mp)
              if so is None or mo is None:continue
              # Decode Qt MOC relative offset/length pairs from the exact stringdata base.
              strings={};valid=[]
              for i in range(256):
                  p=so+i*8
                  if p+8>len(data):break
                  rel,ln=struct.unpack_from('<II',data,p)
                  if ln>512:continue
                  to=va2off(sp+rel)
                  if to is None or to+ln>len(data):continue
                  raw=data[to:to+ln]
                  if ln==0 or printable(raw):
                      try:s=raw.decode('ascii')
                      except:s=''
                      strings[i]=s;valid.append((i,rel,ln,s))
              # Keep only entries whose relative target is reasonably near the table; this filters accidental integer pairs.
              near=[x for x in valid if x[1] < 0x10000]
              print(f' STRING_CANDIDATES name={name} count={len(near)}')
              for i,rel,ln,s in near[:160]:
                  print(f'  STRING index={i} rel=0x{rel:x} len={ln} text={s!r}')
              hdr=list(struct.unpack_from('<14I',data,mo))
              print(' META_HEADER name='+name+' '+' '.join(f'u{i}={v}' for i,v in enumerate(hdr)))
              rev,classname,ci_count,ci_data,m_count,m_data,p_count,p_data,e_count,e_data,c_count,c_data,flags,signal_count=hdr
              plausible=(5<=rev<=20 and m_count<1000 and m_data<100000 and classname<10000)
              print(f' META_HEADER_PLAUSIBLE name={name} value={str(plausible).lower()} revision={rev} class_name_index={classname} class_name={strings.get(classname)!r} method_count={m_count} method_data={m_data} signal_count={signal_count}')
              if plausible:
                  # Qt6 moc method records are six uints; print both raw record and name mapping.
                  for j in range(min(m_count,256)):
                      pos=mo+(m_data+j*6)*4
                      if pos+24>len(data):break
                      vals=struct.unpack_from('<6I',data,pos)
                      print(f'  METHOD6 ordinal={j} name_index={vals[0]} name={strings.get(vals[0])!r} argc={vals[1]} parameters={vals[2]} tag={vals[3]} flags=0x{vals[4]:x} metatypes={vals[5]}')
          print('TRACK_A_QMETA_V2_COMPLETE=true')
          PY
          echo TRACK_A_QMETA_V2_OBJDUMP_BEGIN=true
          # Version-fenced candidate static-metacall entry points recovered from the record layout above.
          for spec in GameEvent:d20800 Chat:d05f20 Worldmap:df2a60 Effect:d338d0 Container:dcb130; do
            name="${spec%%:*}"; addr="${spec##*:}"; start=$((16#$addr)); stop=$((start+768));
            echo "OBJDUMP name=$name start=0x$addr"
            objdump -d --start-address="$start" --stop-address="$stop" "$client" | head -n 180
          done
          echo TRACK_A_QMETA_V2_OBJDUMP_COMPLETE=true

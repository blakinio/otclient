name: Track A QMeta relative-pair reconstruction
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-qmeta-relative-pair-reconstruct.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Recover candidate Qt relative offset/length tables
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          python3 - "$client" <<'PY'
          import struct,sys
          data=open(sys.argv[1],'rb').read()
          classes=[
            'TWorldmapProtocolMessageHandler','TChatProtocolMessageHandler','TContainerProtocolMessageHandler',
            'TCreatureProtocolMessageHandler','TPlayerProtocolMessageHandler','TEffectProtocolMessageHandler',
            'TMarketProtocolMessageHandler','TNPCTradeProtocolMessageHandler','TPlayerTradeProtocolMessageHandler',
            'TQuestLogProtocolMessageHandler','TGameEventProtocolMessageHandler'
          ]
          def text_at(off,ln):
              if off<0 or ln<0 or ln>512 or off+ln>len(data):return None
              raw=data[off:off+ln]
              if any(b<32 or b>=127 for b in raw):return None
              try:return raw.decode('ascii')
              except:return None
          print('TRACK_A_QMETA_RELPAIR_BEGIN=true')
          total=0
          for cls in classes:
              occurrences=[];p=0;b=cls.encode()
              while True:
                  p=data.find(b,p)
                  if p<0:break
                  occurrences.append(p);p+=1
              candidates=[]
              for s_off in occurrences:
                  lo=max(0,s_off-0x40000);hi=min(len(data)-8,s_off+0x40000)
                  for q in range(lo,hi,4):
                      rel,ln=struct.unpack_from('<II',data,q)
                      if ln!=len(cls) or rel>0x4000000:continue
                      base=s_off-rel
                      if base<0 or base>=len(data):continue
                      # A real offsets-and-sizes table should have several nearby pairs resolving to printable strings.
                      matches=[]
                      qlo=max(0,q-0x1000);qhi=min(len(data)-8,q+0x1000)
                      for r in range(qlo,qhi,8):
                          rr,ll=struct.unpack_from('<II',data,r)
                          if rr>0x4000000 or ll>256:continue
                          txt=text_at(base+rr,ll)
                          if txt is None:continue
                          if txt==cls or txt.startswith('handle') or 'ProtocolMessageHandler' in txt:
                              matches.append((r,rr,ll,txt))
                      uniq=[];seen=set()
                      for m in matches:
                          key=(m[1],m[2],m[3])
                          if key not in seen:seen.add(key);uniq.append(m)
                      if len(uniq)>=2:
                          candidates.append((s_off,q,base,uniq[:64]))
              # de-duplicate by candidate base and target pair position
              out=[];seen=set()
              for c in candidates:
                  key=(c[1],c[2])
                  if key not in seen:seen.add(key);out.append(c)
              print(f'CLASS name={cls} string_occurrences={len(occurrences)} candidates={len(out)}')
              for s_off,q,base,matches in out[:32]:
                  print(f' CANDIDATE class={cls} class_off=0x{s_off:x} pair_off=0x{q:x} relative_base=0x{base:x} matched={len(matches)}')
                  for r,rel,ln,txt in matches:
                      print(f'  PAIR off=0x{r:x} rel=0x{rel:x} len={ln} target_off=0x{base+rel:x} text={txt}')
                  total+=1
          print(f'TRACK_A_QMETA_RELPAIR_TOTAL={total}')
          print('TRACK_A_QMETA_RELPAIR_COMPLETE=true')
          PY

name: Track A isolated QT plugin discovery discriminator

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-qt-debug-plugins-discriminator.yml

permissions:
  contents: read

concurrency:
  group: track-a-qt-debug-plugins-discriminator
  cancel-in-progress: false

jobs:
  qt-plugin-discriminator:
    runs-on: [otclient, synology]
    timeout-minutes: 12
    steps:
      - name: Fetch immutable isolated harness, enable QT plugin diagnostics and execute
        shell: bash
        env:
          EXPECTED_BASE_SHA: a1bab5e7197aba484ac72a4dbcb2d8fddeaeacc2
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || { echo "QTPLUG_DIAG_REFUSED=BASE_MOVED:$EVENT_BASE_SHA"; exit 44; }

          source_url='https://raw.githubusercontent.com/blakinio/otclient/cb557da12ebb41c597340909b2db717ee59cdfe1/.github/workflows/tibia-official-client-re-window-ownership-discriminator-v2.yml'
          source_blob='1616edcc982be50ef2c95b8077160ec8fe9291fe'
          source_file="$(mktemp)"
          generated="$(mktemp)"
          trap 'rm -f -- "$source_file" "$generated"' EXIT
          curl -fsSL --retry 3 --connect-timeout 10 -o "$source_file" "$source_url"

          python3 - "$source_file" "$generated" "$source_blob" <<'PY'
          import hashlib, pathlib, sys
          source = pathlib.Path(sys.argv[1]); output = pathlib.Path(sys.argv[2]); expected_blob = sys.argv[3]
          data = source.read_bytes()
          actual_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if actual_blob != expected_blob:
              raise SystemExit(f'QTPLUG_DIAG_REFUSED=SOURCE_BLOB_MISMATCH:{actual_blob}')
          lines = data.decode().splitlines()
          marker = '      - name: Reproduce isolated startup and inventory task-owned windows'
          try: step = lines.index(marker)
          except ValueError: raise SystemExit('QTPLUG_DIAG_REFUSED=SOURCE_STEP_MISSING')
          run_index = None
          for idx in range(step + 1, len(lines)):
              if lines[idx].strip() == 'run: |': run_index = idx; break
              if lines[idx].startswith('      - name:'): break
          if run_index is None: raise SystemExit('QTPLUG_DIAG_REFUSED=SOURCE_RUN_BLOCK_MISSING')
          run_indent = len(lines[run_index]) - len(lines[run_index].lstrip(' ')); content_indent = None; block=[]
          for line in lines[run_index+1:]:
              if not line.strip(): block.append(''); continue
              indent = len(line) - len(line.lstrip(' '))
              if indent <= run_indent: break
              if content_indent is None: content_indent = indent
              if indent < content_indent: raise SystemExit('QTPLUG_DIAG_REFUSED=INCONSISTENT_BLOCK_INDENT')
              block.append(line[content_indent:])
          script='\n'.join(block)+'\n'
          patches=[
            ('local label="$1" out="$root/windows-$label.tsv" pids="$root/pids-$label.txt"', 'local label="$1"\n  local out="$root/windows-$label.tsv"\n  local pids="$root/pids-$label.txt"', 'SNAPSHOT_LOCAL'),
            ("task='OTC-20260816-track-a-client-window-ownership-discriminator'", "task='OTC-20260816-track-a-qt-debug-plugins-discriminator'", 'TASK_ID'),
            ("'QT_XCB_GL_INTEGRATION': 'none',", "'QSG_INFO': '1',\n              'QT_DEBUG_PLUGINS': '1',", 'GRAPHICS_ENV'),
          ]
          for old,new,label in patches:
              count=script.count(old)
              if count != 1: raise SystemExit(f'QTPLUG_DIAG_REFUSED={label}_PATCH_SITE_COUNT:{count}')
              script=script.replace(old,new)
          required=["task='OTC-20260816-track-a-qt-debug-plugins-discriminator'", "'QT_QUICK_BACKEND': 'software'", "'QSG_INFO': '1'", "'QT_DEBUG_PLUGINS': '1'", 'start_new_session=True', 'descendant_pids()', 'sha256sum "/proc/$client_pid/exe"', 'WINDOW_DIAG_RESULT=PASS_DISCRIMINATOR_CAPTURED', 'WINDOW_DIAG_CLEANUP=COMPLETE', 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe']
          for needle in required:
              if needle not in script: raise SystemExit(f'QTPLUG_DIAG_REFUSED=MISSING_FENCE:{needle}')
          forbidden=["'QT_XCB_GL_INTEGRATION': 'none'", '/proc/*/environ', "glob('/proc/*')", 'runtime-registration.json', 'canonical-live-runtime', 'TIBIA_TEST_EMAIL=', 'TIBIA_TEST_PASSWORD=', 'QSG_RHI_BACKEND']
          for needle in forbidden:
              if needle in script: raise SystemExit(f'QTPLUG_DIAG_REFUSED=FORBIDDEN_SOURCE_SHAPE:{needle}')
          output.write_text(script)
          print(f'QTPLUG_DIAG_SOURCE_BLOB=PASS:{actual_blob}')
          print('QTPLUG_DIAG_PATCH_COUNT=3')
          print('QTPLUG_DIAG_CANONICAL_STATE_ACCESS=NONE')
          print('QTPLUG_DIAG_ENV=QT_QUICK_BACKEND_software,QSG_INFO_1,QT_DEBUG_PLUGINS_1')
          PY
          bash -n "$generated"
          echo 'QTPLUG_DIAG_BASH_N=PASS'
          bash "$generated"

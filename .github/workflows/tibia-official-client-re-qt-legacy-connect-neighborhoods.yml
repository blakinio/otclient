name: Track A Qt legacy connect neighborhoods

on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-qt-legacy-connect-neighborhoods.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Disassemble bounded legacy QObject connect call neighborhoods
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          command -v objdump >/dev/null
          python3 - "$client" <<'PY'
          import struct
          import subprocess
          import sys

          client = sys.argv[1]
          data = open(client, 'rb').read()
          phoff = struct.unpack_from('<Q', data, 0x20)[0]
          phentsz = struct.unpack_from('<H', data, 0x36)[0]
          phnum = struct.unpack_from('<H', data, 0x38)[0]
          execs = []
          for index in range(phnum):
              offset = phoff + index * phentsz
              typ, flags, file_offset, va, _, filesz, _, _ = struct.unpack_from('<IIQQQQQQ', data, offset)
              if typ == 1 and flags & 1:
                  execs.append((file_offset, file_offset + filesz, va))

          legacy_connect_plt = 0x4dffd0
          callsites = []
          for file_start, file_end, va_start in execs:
              for offset in range(file_start, file_end - 4):
                  if data[offset] != 0xE8:
                      continue
                  relative = struct.unpack_from('<i', data, offset + 1)[0]
                  source = va_start + (offset - file_start)
                  if source + 5 + relative == legacy_connect_plt:
                      callsites.append(source)

          print('TRACK_A_QT_LEGACY_CONNECT_NEIGHBORHOODS_BEGIN=true')
          print(f'LEGACY_CONNECT_CALLSITE_COUNT={len(callsites)}')
          assert callsites, 'no direct legacy QObject::connect callsites found'
          for ordinal, callsite in enumerate(callsites):
              start = max(0, callsite - 0x80)
              stop = callsite + 0x10
              print(f'NEIGHBORHOOD_BEGIN ordinal={ordinal} call=0x{callsite:x} start=0x{start:x} stop=0x{stop:x}')
              subprocess.run([
                  'objdump', '-d', '-M', 'intel',
                  f'--start-address=0x{start:x}', f'--stop-address=0x{stop:x}', client,
              ], check=True)
              print(f'NEIGHBORHOOD_END ordinal={ordinal} call=0x{callsite:x}')
          print('TRACK_A_QT_LEGACY_CONNECT_NEIGHBORHOODS_COMPLETE=true')
          PY

name: Track A remaining Qt write sinks

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-remaining-write-sinks.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 14
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
    steps:
      - name: Classify remaining direct writes and inventory Qt socket write surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          gdb="$toolroot/usr/bin/gdb"
          [[ -x "$client" && -x "$gdb" ]]
          [[ "$(stat -c %s "$client")" == "$EXPECTED_CLIENT_SIZE" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          report="$RUNNER_TEMP/track-a-remaining-write-sinks.txt"
          relocs="$RUNNER_TEMP/track-a-remaining-write-relocs.txt"
          frames="$RUNNER_TEMP/track-a-remaining-write-frames.txt"
          : >"$report"
          exec > >(tee -a "$report") 2>&1

          echo TRACK_A_REMAINING_WRITE_SINKS_BEGIN=true
          echo "CLIENT_SHA256=$EXPECTED_CLIENT_SHA256"
          readelf -WrC "$client" >"$relocs"
          readelf --debug-dump=frames "$client" >"$frames"

          echo QT_NETWORK_RELOCATIONS_BEGIN=true
          grep -Ei 'QIODevice::(write|writeData)|QAbstractSocket::|QTcpSocket::|QSslSocket::' "$relocs" | head -n 1000 || true
          echo QT_NETWORK_RELOCATIONS_END=true

          echo QT_NETWORK_PLT_BEGIN=true
          for sec in .plt .plt.got .plt.sec; do
            objdump -d -C -j "$sec" "$client" 2>/dev/null || true
          done | grep -Ei '<.*(QIODevice::(write|writeData)|QAbstractSocket::|QTcpSocket::|QSslSocket::).*@plt>:' || true
          echo QT_NETWORK_PLT_END=true

          python3 -u - "$client" "$relocs" "$frames" <<'PY'
          import re,struct,sys
          client,reloc_path,frames_path=sys.argv[1:]
          data=open(client,'rb').read()
          candidates={
            'A':(0x7dd3f0,0x7dd62d),
            'C':(0xb46bd0,0xb46cce),
            'D':(0xc49ee0,0xc4a9e5),
          }
          phoff=struct.unpack_from('<Q',data,0x20)[0]; phentsz=struct.unpack_from('<H',data,0x36)[0]; phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,fo,va,_,filesz,memsz,_=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1 and filesz:loads.append((fo,fo+filesz,va,va+filesz,flags))
          execs=[x for x in loads if x[4]&1]
          frames=[]
          for line in open(frames_path,errors='replace'):
              m=re.search(r'pc=([0-9a-fA-F]+)\.\.([0-9a-fA-F]+)',line)
              if m:frames.append((int(m.group(1),16),int(m.group(2),16)))
          def containing(addr):return [(a,b) for a,b in frames if a<=addr<b]
          def direct_calls(target):
              out=[]
              for fs,fe,base,end,flags in execs:
                  blob=data[fs:fe]; p=0
                  while True:
                      p=blob.find(b'\xe8',p)
                      if p<0:break
                      if p+5<=len(blob):
                          site=base+p; got=(site+5+struct.unpack_from('<i',blob,p+1)[0])&0xffffffffffffffff
                          if got==target:out.append(site)
                      p+=1
              return out
          relocs=open(reloc_path,errors='replace').read().splitlines()
          for name,(start,end) in candidates.items():
              calls=direct_calls(start)
              print(f'CANDIDATE name={name} start=0x{start:x} end=0x{end:x} direct_call_count={len(calls)} sites='+(','.join(hex(x) for x in calls) or 'none'))
              for site in calls:
                  print(f'CANDIDATE_CALLER name={name} site=0x{site:x} fde='+(','.join(f'0x{a:x}-0x{b:x}' for a,b in containing(site)) or 'none'))
              # R_X86_64_RELATIVE addend references can reveal vtable ownership.
              pat=re.compile(r'(?i)R_X86_64_RELATIVE\s+'+format(start,'x')+r'\s*$')
              hits=[ln.strip() for ln in relocs if pat.search(ln)]
              print(f'CANDIDATE_RELATIVE_REF_COUNT name={name} count={len(hits)}')
              for ln in hits[:128]:print(f'CANDIDATE_RELATIVE_REF name={name} {ln}')
          PY

          for spec in \
            'A 0x7dd3f0 0x7dd62d' \
            'C 0xb46bd0 0xb46cce' \
            'D 0xc49ee0 0xc4a9e5'; do
            set -- $spec
            echo "CANDIDATE_DISASSEMBLY_BEGIN name=$1"
            "$gdb" -q -nx -batch "$client" -ex 'set pagination off' -ex 'set disassembly-flavor intel' -ex "disassemble /r $2,$3" || true
            echo "CANDIDATE_DISASSEMBLY_END name=$1"
          done

          echo TRACK_A_REMAINING_WRITE_SINKS_COMPLETE=true
          grep -q '^TRACK_A_REMAINING_WRITE_SINKS_COMPLETE=true$' "$report"

      - name: Upload remaining-write report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-remaining-write-sinks-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-remaining-write-sinks.txt
          if-no-files-found: error
          retention-days: 7

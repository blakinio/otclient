name: Track A remote GUI probe

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-remote-gui-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
    steps:
      - name: Probe existing Track A GUI without mutation
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          xvfb_pid="$(tr -cd '0-9' <"$state/runtime/xvfb.pid" 2>/dev/null || true)"
          client_pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          [[ -n "$xvfb_pid" && -r "/proc/$xvfb_pid/environ" && -e /tmp/.X11-unix/X98 ]]
          grep -azFxq "$marker" "/proc/$xvfb_pid/environ"
          kill -0 "$xvfb_pid"
          echo TRACK_A_XVFB_RUNNING=true
          if [[ -n "$client_pid" && -r "/proc/$client_pid/environ" ]] && grep -azFxq "$marker" "/proc/$client_pid/environ" && kill -0 "$client_pid" 2>/dev/null; then echo TRACK_A_CLIENT_RUNNING=true; else echo TRACK_A_CLIENT_RUNNING=false; fi
          for cmd in x11vnc websockify socat python3 xdotool xwd docker; do
            if command -v "$cmd" >/dev/null 2>&1; then echo "TRACK_A_CMD_${cmd}=true"; else echo "TRACK_A_CMD_${cmd}=false"; fi
          done
          for pkg in x11vnc novnc websockify; do
            if dpkg -s "$pkg" >/dev/null 2>&1; then echo "TRACK_A_PKG_${pkg}=installed"; else echo "TRACK_A_PKG_${pkg}=missing"; fi
          done
          [[ -d /usr/share/novnc ]] && echo TRACK_A_NOVNC_WEBROOT=true || echo TRACK_A_NOVNC_WEBROOT=false
          self="$(hostname)"
          echo TRACK_A_SELF_IMAGE="$(docker inspect -f '{{.Config.Image}}' "$self")"
          echo TRACK_A_SELF_NETWORKS="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$self" | xargs)"
          echo TRACK_A_IPS="$(hostname -I 2>/dev/null | xargs || true)"

name: Track A low-latency noVNC GUI

on:
  push:
    branches: [ci/track-a-remote-gui-access]
    paths:
      - .github/workflows/tibia-official-client-re-remote-gui-stdlib.yml
permissions:
  contents: read
jobs:
  enable:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Apply experimental 30fps low-latency profile
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 && -S /tmp/.X11-unix/X98 ]]
          state=/work/_otclient_tibia_re_state; [[ -d "$state" ]] || state=/home/runner/_work/_otclient_tibia_re_state
          runtime="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"; client="$runtime/bin/client"
          [[ -x "$client" && "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          client_pid=''; for e in /proc/[0-9]*/exe; do [[ -e "$e" ]] || continue; [[ "$(readlink -f "$e" 2>/dev/null || true)" == "$client" ]] && { client_pid="${e#/proc/}"; client_pid="${client_pid%/exe}"; break; }; done
          [[ -n "$client_pid" ]]; kill -0 "$client_pid"; echo TRACK_A_OFFICIAL_CLIENT_REUSED_PID="$client_pid"
          x11vnc="$(command -v x11vnc)"; websockify="$(command -v websockify)"; [[ -x "$x11vnc" && -x "$websockify" && -d /usr/share/novnc ]]
          mkdir -p "$state/runtime/novnc-web"; cp -a /usr/share/novnc/. "$state/runtime/novnc-web/"; novnc_web="$state/runtime/novnc-web"
          cat >"$novnc_web/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Track A Tibia noVNC 30fps test</title>
          <script>location.replace('/vnc.html?autoconnect=1&resize=scale&quality=5&compression=3&show_dot=true&path=websockify');</script>
          HTML
          [[ ! -f "$state/runtime/x11vnc.pid" ]] || kill "$(cat "$state/runtime/x11vnc.pid")" 2>/dev/null || true
          [[ ! -f "$state/runtime/novnc-websockify.pid" ]] || kill "$(cat "$state/runtime/novnc-websockify.pid")" 2>/dev/null || true
          sleep 1
          # 30fps target ~= 33ms.  Lower defer/wait removes the prior 5ms polling profile's CPU churn;
          # XDamage remains enabled so unchanged rectangles are not resent.
          env -u RUNNER_TRACKING_ID DISPLAY="$TRACK_DISPLAY" nohup "$x11vnc" -display "$TRACK_DISPLAY" -rfbport 5901 -localhost -forever -shared -nopw -xkb -repeat -wait 10 -defer 10 -deferupdate 20 -threads -noxrecord -noxfixes -o "$state/runtime/x11vnc.log" >/dev/null 2>&1 </dev/null &
          vnc_pid=$!; printf '%s\n' "$vnc_pid" >"$state/runtime/x11vnc.pid"
          env -u RUNNER_TRACKING_ID nohup "$websockify" --web "$novnc_web" 6081 127.0.0.1:5901 >"$state/runtime/novnc-websockify.log" 2>&1 </dev/null &
          ws_pid=$!; printf '%s\n' "$ws_pid" >"$state/runtime/novnc-websockify.pid"
          for _ in $(seq 1 20); do curl -fsS --max-time 1 -o /tmp/root.html http://127.0.0.1:6081/ 2>/dev/null && break; sleep .5; done
          kill -0 "$vnc_pid"; kill -0 "$ws_pid"
          python3 - <<'PY'
          import socket,base64,os
          s=socket.create_connection(('127.0.0.1',5901),3); b=s.recv(12); s.close(); assert b.startswith(b'RFB ')
          key=base64.b64encode(os.urandom(16)).decode(); q=('GET /websockify HTTP/1.1\r\nHost: localhost\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n'+f'Sec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n').encode(); s=socket.create_connection(('127.0.0.1',6081),3); s.sendall(q); d=s.recv(4096); s.close(); assert b' 101 ' in d.split(b'\r\n',1)[0]
          print('TRACK_A_30FPS_PROFILE_STREAM_OK=true')
          PY
          echo TRACK_A_30FPS_PROFILE='x11vnc wait=10 defer=10 deferupdate=20 threads quality=5 compression=3'
          echo TRACK_A_USER_URL=http://synology:6082

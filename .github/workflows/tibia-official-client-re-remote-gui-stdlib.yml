name: Track A dependency-free remote GUI

on:
  push:
    branches: [ci/track-a-remote-gui-access]
    paths:
      - .github/workflows/tibia-official-client-re-remote-gui-stdlib.yml

permissions:
  contents: read

jobs:
  enable:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
    steps:
      - name: Start Track A browser GUI and DSM bridge
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ -S /var/run/docker.sock ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          for p in xvfb client; do
            pid="$(tr -cd '0-9' <"$state/runtime/$p.pid" 2>/dev/null || true)"
            [[ -n "$pid" && -r "/proc/$pid/environ" ]]
            grep -azFxq "$marker" "/proc/$pid/environ"
            kill -0 "$pid"
          done
          [[ -e /tmp/.X11-unix/X98 ]]
          echo TRACK_A_SESSION_OK=true

          root="$state/toolroot"
          tool_path="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin"
          tool_lib="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu"
          xwd="$(PATH="$tool_path" command -v xwd)"
          xdotool="$(PATH="$tool_path" command -v xdotool)"
          socat="$(PATH="$tool_path" command -v socat)"
          [[ -x "$xwd" && -x "$xdotool" && -x "$socat" ]]

          server="$state/runtime/track-a-remote-gui.py"
          cat >"$server" <<'PY'
          import http.server, json, os, struct, subprocess, tempfile
          DISPLAY=os.environ.get('DISPLAY', ':98')
          XWD=os.environ['TRACK_A_XWD']; XDOTOOL=os.environ['TRACK_A_XDOTOOL']
          TOOL_LIB=os.environ.get('TRACK_A_TOOL_LIB',''); TOOL_PATH=os.environ.get('TRACK_A_TOOL_PATH','')
          PORT=6081
          HTML=r'''<!doctype html><html><head><meta charset="utf-8"><title>Track A Tibia</title><style>html,body{margin:0;background:#111;color:#eee;font:14px sans-serif;height:100%}#bar{padding:7px 10px;background:#222}#screen{display:block;max-width:100vw;max-height:calc(100vh - 34px);margin:auto;outline:none;cursor:crosshair}</style></head><body><div id="bar">Track A — live view/control. Click image to focus.</div><img id="screen" tabindex="0" draggable="false"><script>
          const im=document.getElementById('screen');let seq=0;
          function refresh(){const n=new Image();n.onload=()=>{im.src=n.src;setTimeout(refresh,350)};n.onerror=()=>setTimeout(refresh,1000);n.src='/screen.bmp?'+(++seq)}refresh();
          async function send(o){try{await fetch('/input',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)})}catch(e){}}
          function pos(e){const r=im.getBoundingClientRect();return{x:Math.max(0,Math.min(im.naturalWidth-1,Math.round((e.clientX-r.left)*im.naturalWidth/r.width))),y:Math.max(0,Math.min(im.naturalHeight-1,Math.round((e.clientY-r.top)*im.naturalHeight/r.height)))}}
          im.addEventListener('mousedown',e=>{e.preventDefault();im.focus();const p=pos(e);send({t:'md',b:e.button,x:p.x,y:p.y})});
          im.addEventListener('mouseup',e=>{e.preventDefault();const p=pos(e);send({t:'mu',b:e.button,x:p.x,y:p.y})});
          im.addEventListener('mousemove',e=>{if(e.buttons){const p=pos(e);send({t:'mm',x:p.x,y:p.y})}});
          im.addEventListener('wheel',e=>{e.preventDefault();send({t:'wh',d:Math.sign(e.deltaY)})},{passive:false});
          im.addEventListener('contextmenu',e=>e.preventDefault());
          im.addEventListener('keydown',e=>{e.preventDefault();send({t:'kd',k:e.key})}); im.addEventListener('keyup',e=>{e.preventDefault();send({t:'ku',k:e.key})});
          </script></body></html>'''.encode()
          def env():
              e=os.environ.copy();e['DISPLAY']=DISPLAY
              if TOOL_LIB:e['LD_LIBRARY_PATH']=TOOL_LIB
              if TOOL_PATH:e['PATH']=TOOL_PATH
              return e
          def comp(v,m):
              if not m:return 0
              s=(m&-m).bit_length()-1;t=m>>s;return (((v&m)>>s)*255)//t
          def bmp():
              fd,p=tempfile.mkstemp(suffix='.xwd');os.close(fd)
              try:
                  q=subprocess.run([XWD,'-root','-silent','-out',p],env=env(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=4)
                  if q.returncode:raise RuntimeError(q.stderr.decode(errors='replace')[:300])
                  d=open(p,'rb').read()
              finally:
                  try:os.unlink(p)
                  except OSError:pass
              h=struct.unpack('>25I',d[:100]);hs,w,he,bo,bpp,bpl=h[0],h[4],h[5],h[7],h[11],h[12];r,g,b,n=h[14],h[15],h[16],h[19]
              off=hs+n*12;step=bpp//8;raw=memoryview(d)[off:off+bpl*he];pad=(-w*3)%4;rb=w*3+pad;px=bytearray(rb*he);little=(bo==0)
              for yy in range(he):
                  s=yy*bpl;dst=(he-1-yy)*rb
                  for x in range(w):
                      i=s+x*step;v=int.from_bytes(raw[i:i+step],'little' if little else 'big');j=dst+x*3;px[j]=comp(v,b);px[j+1]=comp(v,g);px[j+2]=comp(v,r)
              size=54+len(px);return b'BM'+struct.pack('<IHHI',size,0,0,54)+struct.pack('<IIIHHIIIIII',40,w,he,1,24,0,len(px),2835,2835,0,0)+px
          KM={'ArrowUp':'Up','ArrowDown':'Down','ArrowLeft':'Left','ArrowRight':'Right','Enter':'Return','Escape':'Escape','Backspace':'BackSpace','Tab':'Tab',' ':'space','Shift':'Shift_L','Control':'Control_L','Alt':'Alt_L','Delete':'Delete','Home':'Home','End':'End','PageUp':'Prior','PageDown':'Next'}
          def kn(k):
              if k in KM:return KM[k]
              if len(k)==1 and (k.isalnum() or k in "-=[];',./\\`"):return k
              if k.startswith('F') and k[1:].isdigit():return k
          def xd(*a):subprocess.run([XDOTOOL,*map(str,a)],env=env(),stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=2,check=False)
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self,*a):pass
              def out(self,c,t,b):self.send_response(c);self.send_header('Content-Type',t);self.send_header('Cache-Control','no-store');self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)
              def do_GET(self):
                  if self.path.startswith('/screen.bmp'):
                      try:self.out(200,'image/bmp',bmp())
                      except Exception as e:self.out(500,'text/plain',str(e).encode())
                  else:self.out(200,'text/html; charset=utf-8',HTML)
              def do_POST(self):
                  try:
                      o=json.loads(self.rfile.read(min(int(self.headers.get('Content-Length','0')),4096)));t=o.get('t')
                      if t in ('mm','md','mu'):
                          x=max(0,min(1919,int(o.get('x',0))));y=max(0,min(1079,int(o.get('y',0))));xd('mousemove',x,y)
                          if t in ('md','mu'):
                              b={0:1,1:2,2:3}.get(int(o.get('b',0))); b and xd('mousedown' if t=='md' else 'mouseup',b)
                      elif t=='wh':xd('click',4 if int(o.get('d',1))<0 else 5)
                      elif t in ('kd','ku'):
                          k=kn(str(o.get('k',''))); k and xd('keydown' if t=='kd' else 'keyup',k)
                      self.out(204,'text/plain',b'')
                  except Exception:self.out(400,'text/plain',b'bad input')
          http.server.ThreadingHTTPServer(('0.0.0.0',PORT),H).serve_forever()
          PY
          chmod 700 "$server"

          self="$(hostname)"
          runner_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$self")"
          image="$(docker inspect -f '{{.Config.Image}}' "$self")"
          [[ -n "$runner_ip" ]]

          docker exec "$self" sh -lc "pkill -f '[t]rack-a-remote-gui.py' 2>/dev/null || true"
          docker exec -d -u 0 \
            -e DISPLAY="$TRACK_DISPLAY" -e TRACK_A_XWD="$xwd" -e TRACK_A_XDOTOOL="$xdotool" \
            -e TRACK_A_TOOL_LIB="$tool_lib" -e TRACK_A_TOOL_PATH="$tool_path" \
            "$self" python3 "$server"
          for _ in $(seq 1 20); do curl -fsS --max-time 2 http://127.0.0.1:6081/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS --max-time 3 http://127.0.0.1:6081/ | grep -q 'Track A'
          code="$(curl -sS --max-time 10 -o /tmp/track-a-test.bmp -w '%{http_code}' http://127.0.0.1:6081/screen.bmp)"
          [[ "$code" == 200 && "$(head -c2 /tmp/track-a-test.bmp)" == BM ]]
          rm -f /tmp/track-a-test.bmp
          echo TRACK_A_BROWSER_BACKEND_READY=true

          docker rm -f otclient-track-a-browser-lan otclient-track-a-browser-loopback otclient-track-a-dsm-proxy >/dev/null 2>&1 || true
          docker run -d --name otclient-track-a-dsm-proxy --restart unless-stopped \
            --network host --volumes-from "$self" --entrypoint /bin/sh "$image" \
            -lc "export PATH='$tool_path'; export LD_LIBRARY_PATH='$tool_lib'; exec '$socat' TCP-LISTEN:6081,bind=127.0.0.1,reuseaddr,fork TCP:${runner_ip}:6081" >/dev/null
          sleep 3
          [[ "$(docker inspect -f '{{.State.Running}}' otclient-track-a-dsm-proxy)" == true ]]
          docker run --rm --network host --entrypoint /bin/sh "$image" -lc "curl -fsS --max-time 8 http://127.0.0.1:6081/ | grep -q 'Track A'"
          docker run --rm --network host --entrypoint /bin/sh "$image" -lc "test \"\$(curl -sS --max-time 10 -o /tmp/s.bmp -w '%{http_code}' http://127.0.0.1:6081/screen.bmp)\" = 200 && test \"\$(head -c2 /tmp/s.bmp)\" = BM"
          echo TRACK_A_DSM_LOOPBACK_READY=true
          echo TRACK_A_USER_URL=http://synology:6082

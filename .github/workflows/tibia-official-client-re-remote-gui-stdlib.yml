name: Track A dependency-free remote GUI

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-remote-gui-stdlib.yml

permissions:
  contents: read

jobs:
  enable:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
    steps:
      - name: Enable private stdlib browser bridge without touching client
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ -S /var/run/docker.sock ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          for p in xvfb client; do
            pid="$(tr -cd '0-9' <"$state/runtime/$p.pid" 2>/dev/null || true)"
            [[ -n "$pid" && -r "/proc/$pid/environ" ]]
            grep -azFxq "$marker" "/proc/$pid/environ"
            kill -0 "$pid"
          done
          [[ -e /tmp/.X11-unix/X98 ]]
          echo TRACK_A_EXISTING_SESSION_VERIFIED=true

          root="$state/toolroot"
          xwd="$(PATH="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin" command -v xwd)"
          xdotool="$(PATH="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin" command -v xdotool)"
          socat="$(PATH="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin" command -v socat)"
          [[ -x "$xwd" && -x "$xdotool" && -x "$socat" ]]
          server="$state/runtime/track-a-remote-gui.py"
          cat >"$server" <<'PY'
          import http.server, json, os, struct, subprocess, tempfile, zlib

          DISPLAY=os.environ.get('DISPLAY', ':98')
          XWD=os.environ['TRACK_A_XWD']
          XDOTOOL=os.environ['TRACK_A_XDOTOOL']
          PORT=int(os.environ.get('TRACK_A_GUI_PORT','6081'))

          HTML=r'''<!doctype html><html><head><meta charset="utf-8"><title>Track A Tibia</title><style>html,body{margin:0;background:#111;color:#eee;font:14px sans-serif;height:100%}#bar{padding:7px 10px;background:#222}#screen{display:block;max-width:100vw;max-height:calc(100vh - 34px);margin:auto;image-rendering:auto;outline:none;cursor:crosshair}</style></head><body><div id="bar">Track A — live view/control. Click image to focus; keyboard and mouse are forwarded.</div><img id="screen" tabindex="0" draggable="false"><script>
          const im=document.getElementById('screen');let seq=0;
          function refresh(){const n=new Image();n.onload=()=>{im.src=n.src;setTimeout(refresh,350)};n.onerror=()=>setTimeout(refresh,1000);n.src='/screen.bmp?'+(++seq)}refresh();
          async function send(o){try{await fetch('/input',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)})}catch(e){}}
          function pos(e){const r=im.getBoundingClientRect();return {x:Math.max(0,Math.min(im.naturalWidth-1,Math.round((e.clientX-r.left)*im.naturalWidth/r.width))),y:Math.max(0,Math.min(im.naturalHeight-1,Math.round((e.clientY-r.top)*im.naturalHeight/r.height)))}}
          im.addEventListener('mousedown',e=>{e.preventDefault();im.focus();const p=pos(e);send({t:'md',b:e.button,x:p.x,y:p.y})});
          im.addEventListener('mouseup',e=>{e.preventDefault();const p=pos(e);send({t:'mu',b:e.button,x:p.x,y:p.y})});
          im.addEventListener('mousemove',e=>{if(e.buttons){const p=pos(e);send({t:'mm',x:p.x,y:p.y})}});
          im.addEventListener('wheel',e=>{e.preventDefault();send({t:'wh',d:Math.sign(e.deltaY)})},{passive:false});
          im.addEventListener('contextmenu',e=>e.preventDefault());
          im.addEventListener('keydown',e=>{e.preventDefault();send({t:'kd',k:e.key})});
          im.addEventListener('keyup',e=>{e.preventDefault();send({t:'ku',k:e.key})});
          </script></body></html>'''.encode()

          def component(v, mask):
              if not mask: return 0
              shift=(mask & -mask).bit_length()-1
              top=mask>>shift
              return (((v & mask)>>shift)*255)//top

          def capture_bmp():
              fd,path=tempfile.mkstemp(prefix='tracka-',suffix='.xwd');os.close(fd)
              try:
                  env=os.environ.copy();env['DISPLAY']=DISPLAY
                  subprocess.run([XWD,'-root','-silent','-out',path],env=env,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=4)
                  data=open(path,'rb').read()
              finally:
                  try: os.unlink(path)
                  except OSError: pass
              if len(data)<100: raise ValueError('short xwd')
              h=struct.unpack('>25I',data[:100])
              header_size,width,height,byte_order,bpp,bpl=h[0],h[4],h[5],h[7],h[11],h[12]
              red,green,blue,ncolors=h[14],h[15],h[16],h[19]
              off=header_size+ncolors*12
              if bpp not in (24,32): raise ValueError('unsupported bpp')
              step=bpp//8; raw=memoryview(data)[off:off+bpl*height]
              pad=(-width*3)%4; rowbytes=width*3+pad
              pixels=bytearray(rowbytes*height)
              little=(byte_order==0)
              for yy in range(height):
                  src=yy*bpl; dst=(height-1-yy)*rowbytes
                  for x in range(width):
                      i=src+x*step
                      v=int.from_bytes(raw[i:i+step], 'little' if little else 'big')
                      j=dst+x*3
                      pixels[j]=component(v,blue);pixels[j+1]=component(v,green);pixels[j+2]=component(v,red)
              size=54+len(pixels)
              fh=b'BM'+struct.pack('<IHHI',size,0,0,54)
              ih=struct.pack('<IIIHHIIIIII',40,width,height,1,24,0,len(pixels),2835,2835,0,0)
              return fh+ih+pixels

          KEYMAP={'ArrowUp':'Up','ArrowDown':'Down','ArrowLeft':'Left','ArrowRight':'Right','Enter':'Return','Escape':'Escape','Backspace':'BackSpace','Tab':'Tab',' ':'space','Shift':'Shift_L','Control':'Control_L','Alt':'Alt_L','Delete':'Delete','Home':'Home','End':'End','PageUp':'Prior','PageDown':'Next'}
          def keyname(k):
              if k in KEYMAP:return KEYMAP[k]
              if len(k)==1 and (k.isalnum() or k in "-=[];',./\\`"):return k
              if k.startswith('F') and k[1:].isdigit() and 1<=int(k[1:])<=12:return k
              return None
          def xd(*args):
              env=os.environ.copy();env['DISPLAY']=DISPLAY
              subprocess.run([XDOTOOL,*map(str,args)],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=2,check=False)

          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def sendb(self,code,typ,body):
                  self.send_response(code);self.send_header('Content-Type',typ);self.send_header('Cache-Control','no-store');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
              def do_GET(self):
                  if self.path.startswith('/screen.bmp'):
                      try:self.sendb(200,'image/bmp',capture_bmp())
                      except Exception as e:self.sendb(500,'text/plain',str(e).encode())
                  else:self.sendb(200,'text/html; charset=utf-8',HTML)
              def do_POST(self):
                  if self.path!='/input':self.sendb(404,'text/plain',b'');return
                  try:
                      n=min(int(self.headers.get('Content-Length','0')),4096);o=json.loads(self.rfile.read(n));t=o.get('t')
                      if t in ('mm','md','mu'):
                          x=max(0,min(1279,int(o.get('x',0))));y=max(0,min(799,int(o.get('y',0))));xd('mousemove',x,y)
                          if t in ('md','mu'):
                              b={0:1,1:2,2:3}.get(int(o.get('b',0))); b and xd('mousedown' if t=='md' else 'mouseup',b)
                      elif t=='wh':xd('click',4 if int(o.get('d',1))<0 else 5)
                      elif t in ('kd','ku'):
                          k=keyname(str(o.get('k','')))
                          if k:xd('keydown' if t=='kd' else 'keyup',k)
                      self.sendb(204,'text/plain',b'')
                  except Exception:self.sendb(400,'text/plain',b'bad input')
          http.server.ThreadingHTTPServer(('0.0.0.0',PORT),H).serve_forever()
          PY
          chmod 700 "$server"

          self="$(hostname)"
          runner_ip="$(hostname -I | awk '{print $1}')"
          docker exec "$self" sh -lc "pkill -f '[t]rack-a-remote-gui.py' 2>/dev/null || true"
          docker exec -d -u 0 -e DISPLAY="$TRACK_DISPLAY" -e TRACK_A_XWD="$xwd" -e TRACK_A_XDOTOOL="$xdotool" -e TRACK_A_GUI_PORT=6081 "$self" python3 "$server"
          for _ in $(seq 1 20); do curl -fsS --max-time 2 "http://127.0.0.1:6081/" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS --max-time 3 "http://127.0.0.1:6081/" | grep -q 'Track A'
          curl -fsS --max-time 6 "http://127.0.0.1:6081/screen.bmp" | head -c2 | grep -q BM
          echo TRACK_A_BROWSER_BRIDGE_READY=true

          image="$(docker inspect -f '{{.Config.Image}}' "$self")"
          bridge=otclient-track-a-browser-loopback
          docker rm -f "$bridge" >/dev/null 2>&1 || true
          docker run -d --name "$bridge" --restart unless-stopped --network host --volumes-from "$self" --entrypoint /bin/sh "$image" \
            -lc "exec '$socat' TCP-LISTEN:6081,bind=127.0.0.1,reuseaddr,fork TCP:${runner_ip}:6081" >/dev/null
          sleep 2
          [[ "$(docker inspect -f '{{.State.Running}}' "$bridge")" == true ]]
          docker exec "$bridge" sh -lc "'$socat' -T3 - TCP:127.0.0.1:6081 </dev/null >/dev/null 2>&1 || true"
          echo TRACK_A_HOST_LOOPBACK_BRIDGE_READY=true

          host_ips="$(docker run --rm --network host --entrypoint /bin/sh "$image" -lc 'hostname -I 2>/dev/null || true' | xargs || true)"
          echo TRACK_A_SYNOLOGY_HOST_IPS="$host_ips"
          echo TRACK_A_ACCESS_HOST_PORT=6081
          echo TRACK_A_ACCESS_MODE=ssh-loopback-tunnel

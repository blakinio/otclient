name: Track A dependency-free remote GUI

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-remote-gui-stdlib.yml

permissions:
  contents: read

jobs:
  enable:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
    steps:
      - name: Expose existing Track A browser bridge on trusted LAN
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ -S /var/run/docker.sock ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          for p in xvfb client; do
            pid="$(tr -cd '0-9' <"$state/runtime/$p.pid" 2>/dev/null || true)"
            [[ -n "$pid" && -r "/proc/$pid/environ" ]]
            grep -azFxq "$marker" "/proc/$pid/environ"
            kill -0 "$pid"
          done
          [[ -e /tmp/.X11-unix/X98 ]]
          curl -fsS --max-time 5 http://127.0.0.1:6081/ | grep -q 'Track A'
          status="$(curl -sS --max-time 10 -o /tmp/track-a-lan-screen.bin -w '%{http_code}' http://127.0.0.1:6081/screen.bmp)"
          [[ "$status" == 200 ]]
          [[ "$(head -c2 /tmp/track-a-lan-screen.bin)" == BM ]]
          rm -f /tmp/track-a-lan-screen.bin
          echo TRACK_A_EXISTING_BROWSER_BRIDGE_VERIFIED=true

          root="$state/toolroot"
          tool_path="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin"
          socat="$(PATH="$tool_path" command -v socat)"
          [[ -x "$socat" ]]
          self="$(hostname)"
          runner_ip="$(hostname -I | awk '{print $1}')"
          image="$(docker inspect -f '{{.Config.Image}}' "$self")"
          bridge=otclient-track-a-browser-lan
          docker rm -f "$bridge" >/dev/null 2>&1 || true
          docker run -d --name "$bridge" --restart unless-stopped --network host --volumes-from "$self" --entrypoint /bin/sh "$image" \
            -lc "exec '$socat' TCP-LISTEN:6082,bind=0.0.0.0,reuseaddr,fork TCP:${runner_ip}:6081" >/dev/null
          sleep 2
          [[ "$(docker inspect -f '{{.State.Running}}' "$bridge")" == true ]]

          # Verify the LAN-facing listener from host networking.
          host_ip="$(docker run --rm --network host --entrypoint /bin/sh "$image" -lc 'hostname -I 2>/dev/null' | tr ' ' '\n' | grep '^192\.168\.1\.' | head -n1)"
          [[ -n "$host_ip" ]]
          docker run --rm --network host --entrypoint /bin/sh "$image" -lc "curl -fsS --max-time 5 http://${host_ip}:6082/ | grep -q 'Track A'"
          echo TRACK_A_LAN_BROWSER_BRIDGE_READY=true
          echo TRACK_A_LAN_URL="http://${host_ip}:6082/"

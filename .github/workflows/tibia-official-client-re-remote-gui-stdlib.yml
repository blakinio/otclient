name: Track A dependency-free remote GUI

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-remote-gui-stdlib.yml

permissions:
  contents: read

jobs:
  enable:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
    steps:
      - name: Publish Track A GUI on DSM loopback
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ -S /var/run/docker.sock ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          for p in xvfb client; do
            pid="$(tr -cd '0-9' <"$state/runtime/$p.pid" 2>/dev/null || true)"
            [[ -n "$pid" && -r "/proc/$pid/environ" ]]
            grep -azFxq "$marker" "/proc/$pid/environ"
            kill -0 "$pid"
          done
          [[ -e /tmp/.X11-unix/X98 ]]

          curl -fsS --max-time 5 http://127.0.0.1:6081/ | grep -q 'Track A'
          status="$(curl -sS --max-time 10 -o /tmp/track-a-loopback-screen.bin -w '%{http_code}' http://127.0.0.1:6081/screen.bmp)"
          [[ "$status" == 200 ]]
          [[ "$(head -c2 /tmp/track-a-loopback-screen.bin)" == BM ]]
          rm -f /tmp/track-a-loopback-screen.bin
          echo TRACK_A_BACKEND_VERIFIED=true

          root="$state/toolroot"
          tool_path="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin"
          socat="$(PATH="$tool_path" command -v socat)"
          [[ -x "$socat" ]]
          self="$(hostname)"
          runner_ip="$(hostname -I | awk '{print $1}')"
          image="$(docker inspect -f '{{.Config.Image}}' "$self")"
          network="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$self")"
          [[ -n "$network" ]]

          # Remove previous experimental publishers only; do not touch the Tibia client container.
          docker rm -f otclient-track-a-browser-lan otclient-track-a-browser-loopback otclient-track-a-dsm-proxy >/dev/null 2>&1 || true

          docker run -d --name otclient-track-a-dsm-proxy --restart unless-stopped \
            --network "$network" \
            -p 127.0.0.1:6081:6081 \
            --volumes-from "$self" --entrypoint /bin/sh "$image" \
            -lc "exec '$socat' TCP-LISTEN:6081,bind=0.0.0.0,reuseaddr,fork TCP:${runner_ip}:6081" >/dev/null

          sleep 3
          [[ "$(docker inspect -f '{{.State.Running}}' otclient-track-a-dsm-proxy)" == true ]]
          published="$(docker port otclient-track-a-dsm-proxy 6081/tcp)"
          echo TRACK_A_DOCKER_PUBLISHED="$published"
          [[ "$published" == 127.0.0.1:6081 ]]

          # Verify from a fresh host-network namespace that DSM loopback reaches the published port.
          docker run --rm --network host --entrypoint /bin/sh "$image" -lc \
            "curl -fsS --max-time 8 http://127.0.0.1:6081/ | grep -q 'Track A'"
          echo TRACK_A_DSM_LOOPBACK_READY=true
          echo TRACK_A_DSM_PROXY_TARGET=http://127.0.0.1:6081
          echo TRACK_A_USER_URL=http://synology:6082

name: Track A runner support layout inventory

on:
  pull_request:
    branches: [main]
    paths:
      - docs/agents/tasks/active/OTC-20260816-track-a-runner-support-layout-inventory.md
      - .github/workflows/tibia-official-client-re-runner-support-layout-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-runner-support-layout-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Inventory fixed support paths only
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == 'synology-otclient-01' ]]
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]

          path_fact() {
            local label="$1" path="$2" real='ABSENT' kind='ABSENT'
            if [[ -e "$path" || -L "$path" ]]; then
              real="$(realpath -e -- "$path" 2>/dev/null || echo UNRESOLVED)"
              if [[ -L "$path" ]]; then kind='SYMLINK'
              elif [[ -d "$path" ]]; then kind='DIR'
              elif [[ -f "$path" ]]; then kind='FILE'
              else kind='OTHER'; fi
            fi
            printf 'SUPPORT_PATH label=%s path=%s kind=%s real=%s\n' "$label" "$path" "$kind" "$real"
          }

          root_fact() {
            local label="$1" root="$2" root_real='ABSENT' component path real contained
            if [[ -d "$root" && ! -L "$root" ]]; then
              root_real="$(realpath -e -- "$root" 2>/dev/null || echo UNRESOLVED)"
            fi
            printf 'SUPPORT_ROOT label=%s path=%s real=%s\n' "$label" "$root" "$root_real"
            for component in Xvfb x11vnc xdotool; do
              path="$root/usr/bin/$component"
              real="$(realpath -e -- "$path" 2>/dev/null || echo ABSENT)"
              contained=false
              if [[ "$root_real" != ABSENT && "$root_real" != UNRESOLVED && "$real" == "$root_real"/* ]]; then contained=true; fi
              printf 'SUPPORT_ROOT_COMPONENT root=%s component=%s exists=%s executable=%s literal_symlink=%s real=%s contained=%s\n' \
                "$label" "$component" "$([[ -e "$path" || -L "$path" ]] && echo true || echo false)" \
                "$([[ -x "$path" ]] && echo true || echo false)" "$([[ -L "$path" ]] && echo true || echo false)" "$real" "$contained"
            done
            path="$root/usr/share/X11/xkb"
            real="$(realpath -e -- "$path" 2>/dev/null || echo ABSENT)"
            contained=false
            if [[ "$root_real" != ABSENT && "$root_real" != UNRESOLVED && "$real" == "$root_real"/* ]]; then contained=true; fi
            printf 'SUPPORT_ROOT_COMPONENT root=%s component=XKB exists=%s real=%s contained=%s\n' \
              "$label" "$([[ -d "$path" ]] && echo true || echo false)" "$real" "$contained"
            for path in "$root/usr/lib/x86_64-linux-gnu/libproxychains.so.4" "$root/lib/x86_64-linux-gnu/libproxychains.so.4"; do
              real="$(realpath -e -- "$path" 2>/dev/null || echo ABSENT)"
              contained=false
              if [[ "$root_real" != ABSENT && "$root_real" != UNRESOLVED && "$real" == "$root_real"/* ]]; then contained=true; fi
              printf 'SUPPORT_ROOT_COMPONENT root=%s component=libproxychains path=%s exists=%s real=%s contained=%s\n' \
                "$label" "$path" "$([[ -f "$path" ]] && echo true || echo false)" "$real" "$contained"
            done
          }

          echo 'RUNNER_SUPPORT_INVENTORY_BEGIN'
          root_fact HOME_WORK_ROOT '/home/runner/_work/_otclient_tibia_re_state/toolroot'
          root_fact WORK_ROOT '/work/_otclient_tibia_re_state/toolroot'
          path_fact SYSTEM_XVFB '/usr/bin/Xvfb'
          path_fact SYSTEM_X11VNC '/usr/bin/x11vnc'
          path_fact SYSTEM_XDOTOOL '/usr/bin/xdotool'
          path_fact SYSTEM_XKB '/usr/share/X11/xkb'
          path_fact SYSTEM_PROXYCHAINS_USR '/usr/lib/x86_64-linux-gnu/libproxychains.so.4'
          path_fact SYSTEM_PROXYCHAINS_LIB '/lib/x86_64-linux-gnu/libproxychains.so.4'

          for pkg in xvfb x11vnc xdotool proxychains4; do
            value="$(dpkg-query -W -f='${Status} ${Version}' "$pkg" 2>/dev/null || echo NOT_INSTALLED)"
            printf 'SUPPORT_PACKAGE package=%s status=%s\n' "$pkg" "$value"
          done
          echo 'RUNNER_SUPPORT_INVENTORY_END'

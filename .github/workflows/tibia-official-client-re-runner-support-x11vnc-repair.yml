name: Track A runner support x11vnc repair

on:
  pull_request:
    branches: [main]
    paths:
      - docs/agents/tasks/active/OTC-20260816-track-a-runner-support-x11vnc-repair.md
      - .github/workflows/tibia-official-client-re-runner-support-x11vnc-repair.yml

permissions:
  contents: read

concurrency:
  group: track-a-runner-support-x11vnc-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify and stage x11vnc into contained toolroot
        shell: bash
        env:
          EXPECTED_BASE_SHA: c2e1466b4c0ac11deb96b104830f90aae9c35a97
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077

          [[ "$RUNNER_NAME" == 'synology-otclient-01' ]]
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || {
            echo "RUNNER_SUPPORT_REPAIR_REFUSED=BASE_MOVED:$EVENT_BASE_SHA" >&2
            exit 41
          }

          src='/usr/bin/x11vnc'
          root='/work/_otclient_tibia_re_state/toolroot'
          target="$root/usr/bin/x11vnc"
          created=0
          tmp=''

          cleanup() {
            rc=$?
            [[ -z "$tmp" || ! -e "$tmp" ]] || rm -f -- "$tmp"
            if [[ "$rc" != 0 && "$created" == 1 ]]; then
              rm -f -- "$target" || true
            fi
            exit "$rc"
          }
          trap cleanup EXIT

          [[ -f "$src" && -x "$src" && ! -L "$src" ]]
          [[ "$(realpath -e -- "$src")" == "$src" ]]
          [[ "$(stat -c %u "$src")" == 0 ]]
          mode="$(stat -c %a "$src")"
          (( (8#$mode & 8#022) == 0 ))
          [[ "$(dpkg-query -W -f='${Status}' x11vnc 2>/dev/null)" == 'install ok installed' ]]
          [[ "$(dpkg-query -W -f='${Version}' x11vnc 2>/dev/null)" == '0.9.16-10' ]]
          dpkg-query -S "$src" | grep -Eq '^x11vnc(:[^:]+)?: /usr/bin/x11vnc$'
          verify_output="$(dpkg -V x11vnc 2>&1 || true)"
          [[ -z "$verify_output" ]] || {
            printf 'RUNNER_SUPPORT_REPAIR_REFUSED=DPKG_VERIFY:%s\n' "$verify_output" >&2
            exit 42
          }

          [[ -d "$root" && ! -L "$root" ]]
          root_real="$(realpath -e -- "$root")"
          [[ "$root_real" == "$root" ]]
          for path in "$root/usr/bin/Xvfb" "$root/usr/bin/xdotool"; do
            [[ -f "$path" && -x "$path" && ! -L "$path" ]]
            [[ "$(realpath -e -- "$path")" == "$root_real"/* ]]
          done
          xkb_real="$(realpath -e -- "$root/usr/share/X11/xkb")"
          [[ -d "$xkb_real" && "$xkb_real" == "$root_real"/* ]]
          proxy_real="$(realpath -e -- "$root/usr/lib/x86_64-linux-gnu/libproxychains.so.4")"
          [[ -f "$proxy_real" && "$proxy_real" == "$root_real"/* ]]
          target_dir_real="$(realpath -e -- "$root/usr/bin")"
          [[ "$target_dir_real" == "$root_real"/* ]]

          src_sha="$(sha256sum "$src" | awk '{print $1}')"
          if [[ -e "$target" || -L "$target" ]]; then
            [[ -f "$target" && -x "$target" && ! -L "$target" ]]
            [[ "$(realpath -e -- "$target")" == "$root_real"/* ]]
            target_sha="$(sha256sum "$target" | awk '{print $1}')"
            [[ "$target_sha" == "$src_sha" ]] || {
              echo 'RUNNER_SUPPORT_REPAIR_REFUSED=DIFFERENT_TARGET_ALREADY_EXISTS' >&2
              exit 43
            }
            echo 'RUNNER_SUPPORT_REPAIR_PRESTATE=ALREADY_IDENTICAL'
          else
            tmp="$(mktemp "$root/usr/bin/.x11vnc.XXXXXX")"
            install -m 0755 "$src" "$tmp"
            [[ "$(sha256sum "$tmp" | awk '{print $1}')" == "$src_sha" ]]
            mv -f -- "$tmp" "$target"
            tmp=''
            created=1
            echo 'RUNNER_SUPPORT_REPAIR_PRESTATE=TARGET_ABSENT_CREATED'
          fi

          target_real="$(realpath -e -- "$target")"
          [[ "$target_real" == "$root_real"/* ]]
          target_sha="$(sha256sum "$target" | awk '{print $1}')"
          [[ "$target_sha" == "$src_sha" ]]

          resolved="$(TRACK_A_CANONICAL_WORKER_CONTRACT_TEST=1 bash .github/scripts/tibia-official-client-re-canonical-live-session.sh toolroot)"
          [[ "$resolved" == "$root" ]]

          printf 'RUNNER_SUPPORT_X11VNC_SOURCE_SHA256=%s\n' "$src_sha"
          printf 'RUNNER_SUPPORT_X11VNC_TARGET_SHA256=%s\n' "$target_sha"
          printf 'RUNNER_SUPPORT_TOOLROOT_RESOLVED=%s\n' "$resolved"
          echo 'RUNNER_SUPPORT_REPAIR_RESULT=PASS_CONTAINED_TOOLROOT_COMPLETE'

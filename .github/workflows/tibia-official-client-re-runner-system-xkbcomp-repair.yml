name: Track A dedicated runner system xkbcomp repair

on:
  pull_request:
    branches: [main]
    paths:
      - docs/agents/tasks/active/OTC-20260816-track-a-runner-system-xkbcomp-repair.md
      - .github/workflows/tibia-official-client-re-runner-system-xkbcomp-repair.yml

permissions:
  contents: read

concurrency:
  group: track-a-runner-system-xkbcomp-repair
  cancel-in-progress: false

jobs:
  repair-and-validate-xvfb:
    runs-on: [self-hosted, Linux, X64, otclient, synology]
    timeout-minutes: 10
    steps:
      - name: Publish exact helper and validate isolated Xvfb
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          umask 077

          readonly TOOLROOT=/work/_otclient_tibia_re_state/toolroot
          readonly SOURCE="$TOOLROOT/usr/bin/xkbcomp"
          readonly TARGET=/usr/bin/xkbcomp
          readonly XVFB="$TOOLROOT/usr/bin/Xvfb"
          readonly XKBROOT="$TOOLROOT/usr/share/X11/xkb"
          readonly EXPECTED_SHA=0967e7e7b03b077327cea74567726b265bd304b4fdf59f87bf7fdfe1074e7591
          readonly LIBPATH="$TOOLROOT/usr/lib/x86_64-linux-gnu:$TOOLROOT/lib/x86_64-linux-gnu"

          created_target=0
          target_identity=''
          xvfb_pid=''
          display_number=''
          tmpdir="$(mktemp -d)"
          tmp_target=''
          success=0

          cleanup_xvfb() {
            if [[ -n "$xvfb_pid" ]] && kill -0 "$xvfb_pid" 2>/dev/null; then
              kill "$xvfb_pid" 2>/dev/null || true
              wait "$xvfb_pid" 2>/dev/null || true
            fi
            if [[ -n "$display_number" ]]; then
              lock="/tmp/.X${display_number}-lock"
              socket="/tmp/.X11-unix/X${display_number}"
              if [[ -f "$lock" ]]; then
                owner="$(tr -cd '0-9' <"$lock" 2>/dev/null || true)"
                if [[ -n "$xvfb_pid" && "$owner" == "$xvfb_pid" && ! -e "/proc/$xvfb_pid" ]]; then
                  rm -f -- "$lock" "$socket"
                fi
              fi
            fi
          }

          cleanup() {
            rc=$?
            cleanup_xvfb
            [[ -z "$tmp_target" ]] || rm -f -- "$tmp_target"
            if (( rc != 0 || success != 1 )) && (( created_target == 1 )); then
              current_identity="$(stat -Lc '%d:%i' "$TARGET" 2>/dev/null || true)"
              current_sha="$(sha256sum "$TARGET" 2>/dev/null | awk '{print $1}' || true)"
              if [[ -n "$target_identity" && "$current_identity" == "$target_identity" && "$current_sha" == "$EXPECTED_SHA" ]]; then
                rm -f -- "$TARGET"
                echo 'XKBCOMP_ROLLBACK=REMOVED_TASK_PUBLISHED_TARGET'
              else
                echo 'XKBCOMP_ROLLBACK=REFUSED_TARGET_IDENTITY_CHANGED' >&2
              fi
            fi
            rm -rf -- "$tmpdir"
            exit "$rc"
          }
          trap cleanup EXIT

          [[ "${RUNNER_NAME:-}" == synology-otclient-01 ]] || { echo 'RUNNER_IMAGE_DEPLOYMENT_REQUIRED=WRONG_RUNNER'; exit 1; }
          [[ "${GITHUB_REPOSITORY:-}" == blakinio/otclient ]] || { echo 'RUNNER_IMAGE_DEPLOYMENT_REQUIRED=WRONG_REPOSITORY'; exit 1; }
          [[ "$(id -u)" == 0 ]] || { echo "RUNNER_IMAGE_DEPLOYMENT_REQUIRED=JOB_UID_$(id -u)_NOT_ROOT"; exit 1; }
          [[ -d /usr/bin && ! -L /usr/bin && "$(realpath -e /usr/bin)" == /usr/bin ]] || { echo 'RUNNER_IMAGE_DEPLOYMENT_REQUIRED=UNSAFE_USR_BIN'; exit 1; }
          [[ -w /usr/bin ]] || { echo 'RUNNER_IMAGE_DEPLOYMENT_REQUIRED=USR_BIN_NOT_WRITABLE'; exit 1; }

          [[ -f "$SOURCE" && ! -L "$SOURCE" && -x "$SOURCE" ]] || { echo 'SOURCE_FENCE=NOT_REGULAR_EXECUTABLE'; exit 1; }
          [[ "$(realpath -e "$SOURCE")" == "$SOURCE" ]] || { echo 'SOURCE_FENCE=REALPATH_MISMATCH'; exit 1; }
          [[ "$(stat -Lc '%u' "$SOURCE")" == 0 ]] || { echo 'SOURCE_FENCE=UID_MISMATCH'; exit 1; }
          [[ "$(stat -Lc '%a' "$SOURCE")" == 755 ]] || { echo 'SOURCE_FENCE=MODE_MISMATCH'; exit 1; }
          source_sha="$(sha256sum "$SOURCE" | awk '{print $1}')"
          [[ "$source_sha" == "$EXPECTED_SHA" ]] || { echo "SOURCE_FENCE=SHA_MISMATCH:$source_sha"; exit 1; }
          missing_count="$(LD_LIBRARY_PATH="$LIBPATH" ldd "$SOURCE" 2>&1 | grep -c 'not found' || true)"
          [[ "$missing_count" == 0 ]] || { echo "SOURCE_FENCE=LDD_MISSING:$missing_count"; exit 1; }
          echo "SOURCE_FENCE=PASS:sha256=$source_sha:uid=0:mode=755:ldd_missing=0"

          if [[ -e "$TARGET" || -L "$TARGET" ]]; then
            [[ -f "$TARGET" && ! -L "$TARGET" && -x "$TARGET" ]] || { echo 'TARGET_PRESTATE=UNSAFE_EXISTING_OBJECT'; exit 1; }
            [[ "$(stat -Lc '%u' "$TARGET")" == 0 ]] || { echo 'TARGET_PRESTATE=UID_MISMATCH'; exit 1; }
            mode="$(stat -Lc '%a' "$TARGET")"
            (( (8#$mode & 022) == 0 )) || { echo "TARGET_PRESTATE=WRITABLE_MODE_$mode"; exit 1; }
            target_sha="$(sha256sum "$TARGET" | awk '{print $1}')"
            [[ "$target_sha" == "$EXPECTED_SHA" ]] || { echo "TARGET_PRESTATE=DIFFERENT_SHA:$target_sha"; exit 1; }
            target_identity="$(stat -Lc '%d:%i' "$TARGET")"
            echo 'TARGET_PUBLICATION=ALREADY_SAFE_BIT_IDENTICAL'
          else
            tmp_target="$(mktemp /usr/bin/.track-a-xkbcomp.XXXXXX)"
            install -m 0755 -o 0 -g 0 -- "$SOURCE" "$tmp_target"
            [[ "$(sha256sum "$tmp_target" | awk '{print $1}')" == "$EXPECTED_SHA" ]] || { echo 'TARGET_STAGE=SHA_MISMATCH'; exit 1; }
            if ! ln -- "$tmp_target" "$TARGET"; then
              echo 'TARGET_PUBLICATION=RACE_OR_TARGET_APPEARED'
              exit 1
            fi
            rm -f -- "$tmp_target"
            tmp_target=''
            created_target=1
            target_identity="$(stat -Lc '%d:%i' "$TARGET")"
            echo 'TARGET_PUBLICATION=ATOMIC_CREATED'
          fi

          [[ -f "$TARGET" && ! -L "$TARGET" && "$(stat -Lc '%u' "$TARGET")" == 0 ]] || { echo 'TARGET_POST=OWNERSHIP_FENCE_FAILED'; exit 1; }
          target_sha="$(sha256sum "$TARGET" | awk '{print $1}')"
          [[ "$target_sha" == "$EXPECTED_SHA" && "$target_sha" == "$source_sha" ]] || { echo 'TARGET_POST=SHA_MISMATCH'; exit 1; }
          echo "TARGET_POST=PASS:sha256=$target_sha"

          [[ -x "$XVFB" && ! -L "$XVFB" ]] || { echo 'XVFB_FENCE=EXECUTABLE_MISSING'; exit 1; }
          [[ -d "$XKBROOT" && ! -L "$XKBROOT" ]] || { echo 'XVFB_FENCE=XKBROOT_MISSING'; exit 1; }
          xvfb_missing="$(LD_LIBRARY_PATH="$LIBPATH" ldd "$XVFB" 2>&1 | grep -c 'not found' || true)"
          [[ "$xvfb_missing" == 0 ]] || { echo "XVFB_FENCE=LDD_MISSING:$xvfb_missing"; exit 1; }

          for n in $(seq 199 220); do
            if [[ ! -e "/tmp/.X${n}-lock" && ! -e "/tmp/.X11-unix/X${n}" ]]; then
              display_number="$n"
              break
            fi
          done
          [[ -n "$display_number" ]] || { echo 'XVFB_VALIDATION=NO_FREE_ISOLATED_DISPLAY'; exit 1; }

          mkdir -p "$tmpdir/home"
          env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
            HOME="$tmpdir/home" PATH="$TOOLROOT/usr/bin:$TOOLROOT/usr/sbin:/usr/bin:/bin" \
            LD_LIBRARY_PATH="$LIBPATH" XKB_CONFIG_ROOT="$XKBROOT" \
            "$XVFB" ":$display_number" -screen 0 1920x1080x24 -xkbdir "$XKBROOT" \
            -nolisten tcp -noreset >"$tmpdir/xvfb.log" 2>&1 &
          xvfb_pid=$!

          socket="/tmp/.X11-unix/X${display_number}"
          for _ in $(seq 1 60); do
            [[ -e "$socket" ]] && break
            kill -0 "$xvfb_pid" 2>/dev/null || break
            sleep .2
          done
          if [[ ! -e "$socket" ]]; then
            rc=0
            if wait "$xvfb_pid"; then rc=0; else rc=$?; fi
            xvfb_pid=''
            echo "XVFB_VALIDATION=FAIL:rc=$rc"
            sed -n '1,80p' "$tmpdir/xvfb.log" | sed 's/^/XVFB_STDERR=/'
            exit 1
          fi

          echo "XVFB_VALIDATION=PASS:display=:$display_number:socket_created=true"
          success=1
          cleanup_xvfb
          xvfb_pid=''
          echo 'RUNNER_SYSTEM_XKBCOMP_REPAIR=PASS'

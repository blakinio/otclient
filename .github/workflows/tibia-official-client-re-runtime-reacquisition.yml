name: Track A runtime restart/relogin reacquisition

on:
  push:
    branches:
      - research/OTC-20260815-track-a-runtime-reacquisition
    paths:
      - .github/workflows/tibia-official-client-re-runtime-reacquisition.yml
      - .github/scripts/tibia-official-client-re-runtime-reacquisition.sh
      - docs/agents/evidence/OTC-20260815-track-a-runtime-reacquisition/runtime-run-request.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reacquire:
    concurrency:
      group: official-client-re-runtime
      cancel-in-progress: false
    runs-on: [otclient, synology]
    timeout-minutes: 18
    env:
      EXPECTED_HEAD_BRANCH: research/OTC-20260815-track-a-runtime-reacquisition
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      EXPECTED_CLIENT_SIZE: '51965216'
      RUN_REQUEST: docs/agents/evidence/OTC-20260815-track-a-runtime-reacquisition/runtime-run-request.json
      EXPECTED_HELPER_BLOB: c1b88d4cc17edf2684b93d7e516f9c694e37966a
      EXPECTED_CODE_BEARING_HEAD: 4bd5cbc47fbfd816a6ab5dd66b57c88b3ff981f4
      FAILED_RUN_TO_RECOVER: '31885192604'
      TASK_ID: OTC-20260815-track-a-runtime-reacquisition
      TRACK_MARKER: OTCLIENT_TIBIA_RE_TRACK=official-client-re
      TASK_MARKER: OTCLIENT_TIBIA_RE_TASK=OTC-20260815-track-a-runtime-reacquisition
      DISPLAY_NUM: '115'
      TASK_SOCKS_PORT: '25415'

    steps:
      - name: Checkout exact draft head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Validate explicit resume request and exact execution context
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_HEAD_BRANCH" ]]
          test -s "$RUN_REQUEST"
          [[ "$(git hash-object .github/scripts/tibia-official-client-re-runtime-reacquisition.sh)" == "$EXPECTED_HELPER_BLOB" ]]
          command -v setsid >/dev/null
          python3 - "$RUN_REQUEST" "$EXPECTED_CLIENT_SHA256" "$EXPECTED_CLIENT_SIZE" "$EXPECTED_CODE_BEARING_HEAD" <<'PY'
          import json, sys
          path, expected_sha, expected_size, expected_code_head = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          assert data['schema_version'] == 1
          assert data['task_id'] == 'OTC-20260815-track-a-runtime-reacquisition'
          assert data['track_id'] == 'official-client-re'
          assert data['reason'] == 'resume_after_p0_runtime_lane_release'
          assert data['base_main'] == '8fca1c3eee453d0d4ef8a47e0f15c9dbae491b45'
          assert data['runtime_code_bearing_head'] == expected_code_head
          client = data['expected_client']
          assert client['sha256'] == expected_sha
          assert client['size'] == int(expected_size)
          assert client['version_mapping'] == '15.32.df7b29'
          assert client['platform'] == 'official_native_linux_only'
          released = data['released_prerequisite']
          assert released['p0_pr'] == 302
          assert released['stale_run'] == 31880617510
          assert released['runner_proof_run'] == 31883178675
          assert released['runner_name'] == 'synology-otclient-01'
          assert released['live_process_discriminator_run'] == 31883422477
          assert released['live_process_discriminator_job'] == 95009054487
          assert released['live_exact_track_clients'] == 0
          print('TRACK_A_RUNTIME_RESUME_REQUEST_VERIFIED=true')
          PY
          bash -n .github/scripts/tibia-official-client-re-runtime-reacquisition.sh
          echo TRACK_A_RUNTIME_HELPER_SYNTAX_PASS=true
          echo "TRACK_A_RUNTIME_EXACT_HEAD=$GITHUB_SHA"
          echo "TRACK_A_RUNTIME_CODE_BEARING_HEAD=$EXPECTED_CODE_BEARING_HEAD"

      - name: Materialize exact runner-layout and current-run ownership helper
        shell: bash
        run: |
          set -Eeuo pipefail
          src=.github/scripts/tibia-official-client-re-runtime-reacquisition.sh
          out="$RUNNER_TEMP/tibia-official-client-re-runtime-reacquisition-effective.sh"
          python3 - "$src" "$out" <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import sys

          src, out = map(Path, sys.argv[1:])
          text = src.read_text(encoding='utf-8')
          replacements = []
          replacements.append((
              "TASK_MARKER=\"OTCLIENT_TIBIA_RE_TASK=$TASK_ID\"\nROLE_VAR='OTCLIENT_TIBIA_RE_ROLE'",
              "TASK_MARKER=\"OTCLIENT_TIBIA_RE_TASK=$TASK_ID\"\nRUN_MARKER=\"OTCLIENT_TIBIA_RE_RUN_ID=$GITHUB_RUN_ID\"\nROLE_VAR='OTCLIENT_TIBIA_RE_ROLE'",
          ))
          replacements.append((
              "BASE_STATE='/home/runner/_work/_otclient_tibia_re_state'\nTASK_ROOT=\"$BASE_STATE/tasks/$TASK_ID\"",
              "BASE_STATE='/home/runner/_work/_otclient_tibia_re_state'\nLEGACY_STATE='/work/_otclient_tibia_re_state'\nTASK_ROOT=\"$BASE_STATE/tasks/$TASK_ID\"",
          ))
          replacements.append((
              "toolroot() { printf '%s/toolroot\\n' \"$BASE_STATE\"; }",
              dedent('''\
          source_state() {
            local state client size sha
            for state in "$LEGACY_STATE" "$BASE_STATE"; do
              client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
              [[ -x "$client" ]] || continue
              size="$(stat -c '%s' "$client" 2>/dev/null || true)"
              sha="$(sha256sum "$client" 2>/dev/null | awk '{print $1}')"
              if [[ "$size" == "$EXPECTED_CLIENT_SIZE" && "$sha" == "$EXPECTED_CLIENT_SHA256" ]]; then
                printf '%s\\n' "$state"
                return 0
              fi
            done
            die exact_source_state_unavailable
          }
          toolroot() { printf '%s/toolroot\\n' "$(source_state)"; }
          '''),
          ))
          replacements.append((
              dedent('''\
          role_owned() {
            local pid="$1" role="$2" expected="${3:-}"
            [[ -r "/proc/$pid/environ" ]] || return 1
            grep -azFxq "$TRACK_MARKER" "/proc/$pid/environ" || return 1
            grep -azFxq "$TASK_MARKER" "/proc/$pid/environ" || return 1
            grep -azFxq "$ROLE_VAR=$role" "/proc/$pid/environ" || return 1
            [[ -z "$expected" || "$(readlink -f "/proc/$pid/exe")" == "$(readlink -f "$expected")" ]]
          }
          '''),
              dedent('''\
          role_owned() {
            local pid="$1" role="$2" expected="${3:-}"
            [[ -r "/proc/$pid/environ" ]] || return 1
            grep -azFxq "$TRACK_MARKER" "/proc/$pid/environ" || return 1
            grep -azFxq "$TASK_MARKER" "/proc/$pid/environ" || return 1
            grep -azFxq "$RUN_MARKER" "/proc/$pid/environ" || return 1
            grep -azFxq "$ROLE_VAR=$role" "/proc/$pid/environ" || return 1
            [[ -z "$expected" || "$(readlink -f "/proc/$pid/exe")" == "$(readlink -f "$expected")" ]]
          }

          discover_role_pid() {
            local role="$1" expected="$2" tries="${3:-100}" candidate found count
            for _ in $(seq 1 "$tries"); do
              found=''; count=0
              for proc in /proc/[0-9]*; do
                candidate="${proc##*/}"
                if role_owned "$candidate" "$role" "$expected"; then
                  found="$candidate"
                  count=$((count+1))
                fi
              done
              (( count <= 1 )) || die "ambiguous_${role}_processes"
              if (( count == 1 )); then
                printf '%s\\n' "$found"
                return 0
              fi
              sleep .2
            done
            return 1
          }
          '''),
          ))
          replacements.append((
              dedent('''\
          verify_upstream_warp() {
            local pid
            pid="$(tr -cd '0-9' <"$BASE_STATE/runtime/wireproxy.pid" 2>/dev/null || true)"
            [[ -n "$pid" && -r "/proc/$pid/environ" ]] || die upstream_wireproxy_unavailable
            grep -azFxq "$TRACK_MARKER" "/proc/$pid/environ" || die upstream_wireproxy_wrong_owner
            kill -0 "$pid" || die upstream_wireproxy_dead
            curl --socks5-hostname "127.0.0.1:$UPSTREAM_SOCKS_PORT" -fsS --max-time 15 \\
              https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)$' \\
              || die upstream_warp_not_verified
            printf 'TRACK_A_UPSTREAM_WARP_VERIFIED=true pid=%s\\n' "$pid"
          }
          '''),
              dedent('''\
          verify_upstream_warp() {
            local source state pid selected_pid='' selected_state='' count=0
            declare -A seen=()
            source="$(source_state)"
            for state in "$source" "$BASE_STATE" "$LEGACY_STATE"; do
              [[ -r "$state/runtime/wireproxy.pid" ]] || continue
              pid="$(tr -cd '0-9' <"$state/runtime/wireproxy.pid" 2>/dev/null || true)"
              [[ -n "$pid" && -r "/proc/$pid/environ" ]] || continue
              grep -azFxq "$TRACK_MARKER" "/proc/$pid/environ" || continue
              kill -0 "$pid" 2>/dev/null || continue
              [[ -z "${seen[$pid]:-}" ]] || continue
              seen[$pid]=1
              selected_pid="$pid"
              selected_state="$state"
              count=$((count+1))
            done
            (( count == 1 )) || {
              (( count == 0 )) && die upstream_wireproxy_unavailable
              die upstream_wireproxy_ambiguous
            }
            port_listening "$UPSTREAM_SOCKS_PORT" || die upstream_socks_not_listening
            curl --socks5-hostname "127.0.0.1:$UPSTREAM_SOCKS_PORT" -fsS --max-time 15 \\
              https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)$' \\
              || die upstream_warp_not_verified
            printf 'TRACK_A_UPSTREAM_WARP_VERIFIED=true pid=%s source_state=%s\\n' "$selected_pid" "$selected_state"
          }
          '''),
          ))
          replacements.append((
              '  local td="$(toolroot)" xvfb="$BASE_STATE/runtime/Xvfb-track-a" pid',
              '  local source td xvfb pid\n  source="$(source_state)"; td="$(toolroot)"; xvfb="$source/runtime/Xvfb-track-a"',
          ))
          replacements.append((
              '  local root="$(run_root)" src="$BASE_STATE/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia" dst',
              '  local root source src dst\n  root="$(run_root)"; source="$(source_state)"\n  src="$source/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia"\n  printf \'TRACK_A_RUNTIME_SOURCE_STATE=%s\\n\' "$source"',
          ))
          replacements.append((
              '  local td="$(toolroot)" xvfb="$BASE_STATE/runtime/Xvfb-track-a" root="$(run_root)"',
              '  local source td xvfb root\n  source="$(source_state 2>/dev/null || printf \'%s\\n\' "$BASE_STATE")"\n  td="$source/toolroot"; xvfb="$source/runtime/Xvfb-track-a"; root="$(run_root)"',
          ))

          # Every task-owned persistent role gets a current-run marker.
          replacements.extend([
              (
                  '    OTCLIENT_TIBIA_RE_ROLE=socks-relay \\\n    nohup python3 "$relay"',
                  '    OTCLIENT_TIBIA_RE_ROLE=socks-relay OTCLIENT_TIBIA_RE_RUN_ID="$GITHUB_RUN_ID" \\\n    nohup setsid python3 "$relay"',
              ),
              (
                  '    OTCLIENT_TIBIA_RE_ROLE=xvfb HOME="$(run_root)/home" \\\n    PATH="$td/usr/bin:$td/usr/sbin:/usr/bin:/bin"',
                  '    OTCLIENT_TIBIA_RE_ROLE=xvfb OTCLIENT_TIBIA_RE_RUN_ID="$GITHUB_RUN_ID" HOME="$(run_root)/home" \\\n    PATH="$td/usr/bin:$td/usr/sbin:/usr/bin:/bin"',
              ),
              (
                  '    nohup "$xvfb" "$TRACK_DISPLAY"',
                  '    sh -c \'cd "$1" && shift && exec "$@"\' sh "$td/usr/bin" nohup setsid "$xvfb" "$TRACK_DISPLAY"',
              ),
          ])

          old_client = dedent('''\
              OTCLIENT_TIBIA_RE_ROLE="client-gen-$gen" HOME="$root/home-gen-$gen" DISPLAY="$TRACK_DISPLAY" \\
              PATH="$tool_path" LD_LIBRARY_PATH="$package/lib:$tool_lib" LIBGL_ALWAYS_SOFTWARE=1 \\
              LIBGL_DRIVERS_PATH="$dri" QSG_RHI_BACKEND=vulkan VK_ICD_FILENAMES="$vk_icd" VK_DRIVER_FILES="$vk_icd" \\
              XDG_DATA_DIRS="$td/usr/share:/usr/share" FONTCONFIG_PATH="$td/etc/fonts" \\
              FONTCONFIG_FILE="$td/etc/fonts/fonts.conf" LD_PRELOAD="$proxy_lib" \\
              PROXYCHAINS_CONF_FILE="$root/proxychains.conf" \\
              nohup "$client" >"$gdir/client.log" 2>&1 </dev/null &
            pid=$!; printf '%s\\n' "$pid" >"$(pidfile "client-gen-$gen")"
            for _ in $(seq 1 80); do kill -0 "$pid" 2>/dev/null || die "client_gen_${gen}_exited"; [[ -r "/proc/$pid/maps" ]] && break; sleep .25; done
            role_owned "$pid" "client-gen-$gen" "$client" || die "client_gen_${gen}_ownership_failed"
            assert_no_secret_env "$pid" "client-gen-$gen"
          ''')
          new_client = dedent('''\
              OTCLIENT_TIBIA_RE_ROLE="client-gen-$gen" OTCLIENT_TIBIA_RE_RUN_ID="$GITHUB_RUN_ID" HOME="$root/home-gen-$gen" DISPLAY="$TRACK_DISPLAY" \\
              PATH="$tool_path" LD_LIBRARY_PATH="$package/lib:$tool_lib" LIBGL_ALWAYS_SOFTWARE=1 \\
              LIBGL_DRIVERS_PATH="$dri" QSG_RHI_BACKEND=vulkan VK_ICD_FILENAMES="$vk_icd" VK_DRIVER_FILES="$vk_icd" \\
              XDG_DATA_DIRS="$td/usr/share:/usr/share" FONTCONFIG_PATH="$td/etc/fonts" \\
              FONTCONFIG_FILE="$td/etc/fonts/fonts.conf" LD_PRELOAD="$proxy_lib" \\
              PROXYCHAINS_CONF_FILE="$root/proxychains.conf" \\
              nohup setsid "$client" >"$gdir/client.log" 2>&1 </dev/null &
            launcher_pid=$!
            pid="$(discover_role_pid "client-gen-$gen" "$client" 100)" || die "client_gen_${gen}_not_discovered"
            printf '%s\\n' "$pid" >"$(pidfile "client-gen-$gen")"
            assert_no_secret_env "$pid" "client-gen-$gen"
            printf 'TRACK_A_RUNTIME_ROLE_DISCOVERED role=client-gen-%s pid=%s launcher_pid=%s\\n' "$gen" "$pid" "$launcher_pid"
          ''')
          replacements.append((old_client, new_client))

          old_observer = dedent('''\
              OTCLIENT_TIBIA_RE_ROLE="observer-gen-$gen" HOME="$root/home" PATH="$tool_path" LD_LIBRARY_PATH="$tool_lib" \\
              nohup "$gdb" -q -nx -batch -x "$gdir/world.gdb" >"$gdir/gdb.log" 2>&1 </dev/null &
            gp=$!; printf '%s\\n' "$gp" >"$(pidfile "observer-gen-$gen")"
            for _ in $(seq 1 50); do [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$pid/status")" == "$gp" ]] && break; kill -0 "$gp" 2>/dev/null || die observer_exited; sleep .15; done
            role_owned "$gp" "observer-gen-$gen" "$gdb" || die observer_ownership_failed
            assert_no_secret_env "$gp" "observer-gen-$gen"
          ''')
          new_observer = dedent('''\
              OTCLIENT_TIBIA_RE_ROLE="observer-gen-$gen" OTCLIENT_TIBIA_RE_RUN_ID="$GITHUB_RUN_ID" HOME="$root/home" PATH="$tool_path" LD_LIBRARY_PATH="$tool_lib" \\
              nohup setsid "$gdb" -q -nx -batch -x "$gdir/world.gdb" >"$gdir/gdb.log" 2>&1 </dev/null &
            observer_launcher_pid=$!
            gp="$(discover_role_pid "observer-gen-$gen" "$gdb" 100)" || die observer_not_discovered
            printf '%s\\n' "$gp" >"$(pidfile "observer-gen-$gen")"
            for _ in $(seq 1 50); do [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$pid/status")" == "$gp" ]] && break; kill -0 "$gp" 2>/dev/null || die observer_exited; sleep .15; done
            role_owned "$gp" "observer-gen-$gen" "$gdb" || die observer_ownership_failed
            assert_no_secret_env "$gp" "observer-gen-$gen"
            printf 'TRACK_A_RUNTIME_ROLE_DISCOVERED role=observer-gen-%s pid=%s launcher_pid=%s\\n' "$gen" "$gp" "$observer_launcher_pid"
          ''')
          replacements.append((old_observer, new_observer))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'compatibility transform match count {count}, expected 1: {old[:120]!r}')
              text = text.replace(old, new, 1)

          out.write_text(text, encoding='utf-8')
          PY
          chmod 700 "$out"
          bash -n "$out"
          [[ -x /work/_otclient_tibia_re_state/toolroot/usr/bin/xkbcomp ]]
          echo "TRACK_A_RUNTIME_EFFECTIVE_HELPER=$out" >> "$GITHUB_ENV"
          echo "TRACK_A_RUNTIME_EFFECTIVE_HELPER_SHA256=$(sha256sum "$out" | awk '{print $1}')"
          echo TRACK_A_RUNTIME_CURRENT_RUN_OWNERSHIP_MATERIALIZED=true

      - name: Recover only exact task-owned residue from failed client launch
        shell: bash
        run: |
          set -Eeuo pipefail
          old_root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runs/$FAILED_RUN_TO_RECOVER"
          old_runtime="$old_root/runtime"
          [[ "$old_root" == "/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31885192604" ]]
          owned_old() {
            local pid="$1" role="$2"
            [[ -r "/proc/$pid/environ" ]] || return 1
            grep -azFxq "$TRACK_MARKER" "/proc/$pid/environ" || return 1
            grep -azFxq "$TASK_MARKER" "/proc/$pid/environ" || return 1
            grep -azFxq "OTCLIENT_TIBIA_RE_ROLE=$role" "/proc/$pid/environ" || return 1
          }
          stop_old() {
            local role="$1" file="$old_runtime/$role.pid" pid=''
            [[ -r "$file" ]] && pid="$(tr -cd '0-9' <"$file" 2>/dev/null || true)"
            [[ -n "$pid" ]] || return 0
            if kill -0 "$pid" 2>/dev/null; then
              owned_old "$pid" "$role" || { echo "TRACK_A_RUNTIME_ERROR=foreign_residue_$role" >&2; exit 1; }
              kill -TERM "$pid"
              for _ in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep .1; done
              if kill -0 "$pid" 2>/dev/null; then kill -KILL "$pid"; fi
              for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep .1; done
              ! kill -0 "$pid" 2>/dev/null || { echo "TRACK_A_RUNTIME_ERROR=residue_stop_timeout_$role" >&2; exit 1; }
              echo "TRACK_A_RUNTIME_RESIDUE_STOPPED role=$role pid=$pid"
            fi
          }
          old_xvfb_pid="$(tr -cd '0-9' <"$old_runtime/xvfb.pid" 2>/dev/null || true)"
          for role in observer-gen-1 observer-gen-2 client-gen-1 client-gen-2 xvfb socks-relay; do
            stop_old "$role"
          done
          python3 - "$TASK_SOCKS_PORT" <<'PY'
          import pathlib, sys
          needle=f"{int(sys.argv[1]):04X}"
          for name in ('tcp','tcp6'):
              p=pathlib.Path('/proc/net')/name
              if not p.exists(): continue
              for row in p.read_text().splitlines()[1:]:
                  f=row.split()
                  if len(f)>3 and f[1].rsplit(':',1)[-1].upper()==needle and f[3]=='0A':
                      raise SystemExit('TRACK_A_RUNTIME_ERROR=residue_socks_port_still_listening')
          PY
          lock="/tmp/.X${DISPLAY_NUM}-lock"; sock="/tmp/.X11-unix/X${DISPLAY_NUM}"
          if [[ -e "$lock" ]]; then
            lock_pid="$(tr -cd '0-9' <"$lock" 2>/dev/null || true)"
            [[ -n "$old_xvfb_pid" && "$lock_pid" == "$old_xvfb_pid" ]] || { echo TRACK_A_RUNTIME_ERROR=foreign_display_lock >&2; exit 1; }
            ! kill -0 "$lock_pid" 2>/dev/null || { echo TRACK_A_RUNTIME_ERROR=display_lock_pid_alive >&2; exit 1; }
            rm -f "$lock"
          fi
          if [[ -e "$sock" ]]; then
            [[ -n "$old_xvfb_pid" ]] || { echo TRACK_A_RUNTIME_ERROR=x11_socket_without_old_xvfb >&2; exit 1; }
            ! kill -0 "$old_xvfb_pid" 2>/dev/null || { echo TRACK_A_RUNTIME_ERROR=x11_socket_old_xvfb_alive >&2; exit 1; }
            grep -Fq "$sock" /proc/net/unix 2>/dev/null && { echo TRACK_A_RUNTIME_ERROR=x11_socket_still_active >&2; exit 1; }
            rm -f "$sock"
          fi
          rm -rf -- "$old_root"
          echo TRACK_A_RUNTIME_FAILED_RUN_RESIDUE_RECOVERED=true

      - name: Bootstrap isolated no-secret runtime namespace
        shell: bash
        run: bash "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" bootstrap

      - name: Verify persistent bootstrap children survived step boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runs/$GITHUB_RUN_ID/runtime"
          run_marker="OTCLIENT_TIBIA_RE_RUN_ID=$GITHUB_RUN_ID"
          owned() {
            local pid="$1" role="$2"
            [[ -r "/proc/$pid/environ" ]] || return 1
            grep -azFxq "$TRACK_MARKER" "/proc/$pid/environ" || return 1
            grep -azFxq "$TASK_MARKER" "/proc/$pid/environ" || return 1
            grep -azFxq "$run_marker" "/proc/$pid/environ" || return 1
            grep -azFxq "OTCLIENT_TIBIA_RE_ROLE=$role" "/proc/$pid/environ" || return 1
            ! grep -azEq '^(TIBIA_TEST_EMAIL|TIBIA_TEST_PASSWORD)=' "/proc/$pid/environ"
          }
          for role in socks-relay xvfb; do
            pid="$(tr -cd '0-9' <"$runtime/$role.pid" 2>/dev/null || true)"
            [[ -n "$pid" ]] || { echo "TRACK_A_RUNTIME_ERROR=missing_persistent_${role}_pid" >&2; exit 1; }
            kill -0 "$pid" 2>/dev/null || { echo "TRACK_A_RUNTIME_ERROR=persistent_${role}_dead" >&2; exit 1; }
            owned "$pid" "$role" || { echo "TRACK_A_RUNTIME_ERROR=persistent_${role}_ownership_lost" >&2; exit 1; }
            echo "TRACK_A_RUNTIME_PERSISTENT_CHILD_VERIFIED role=$role pid=$pid"
          done
          [[ -e "/tmp/.X11-unix/X${DISPLAY_NUM}" ]] || { echo TRACK_A_RUNTIME_ERROR=persistent_xvfb_socket_missing >&2; exit 1; }
          echo TRACK_A_RUNTIME_CURRENT_RUN_PERSISTENCE_VERIFIED=true

      - name: Prepare generation 1 and arm logged-out structural observer
        shell: bash
        run: bash "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" prepare 1

      - name: Login generation 1 with protected inputs only
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          bash "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" login 1

      - name: Verify generation 1 structural world state and confinement
        shell: bash
        run: bash "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" verify 1

      - name: Cleanly stop generation 1 task-owned client and observer
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" stop 1
          pidfile="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runs/$GITHUB_RUN_ID/runtime/observer-gen-1.pid"
          if [[ -r "$pidfile" ]]; then
            pid="$(tr -cd '0-9' <"$pidfile")"
            if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
              echo TRACK_A_RUNTIME_ERROR=observer_cleanup_timeout_gen_1 >&2
              exit 1
            fi
          fi

      - name: Prepare generation 2 with fresh PID PIE and observer
        shell: bash
        run: bash "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" prepare 2

      - name: Login generation 2 with protected inputs only
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          bash "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" login 2

      - name: Verify generation 2 structural world state and confinement
        shell: bash
        run: bash "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" verify 2

      - name: Compare generations and require restart stable reacquisition
        shell: bash
        run: bash "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" compare

      - name: Snapshot sanitized runtime evidence before cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runs/$GITHUB_RUN_ID"
          out=artifacts/runtime-reacquisition
          mkdir -p "$out"
          python3 - "$root" "$out" <<'PY'
          import re, shutil, sys
          from pathlib import Path
          root, out = map(Path, sys.argv[1:])
          email = re.compile(r'(?i)[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}')
          for gen in (1, 2):
              g = root / f'generation-{gen}'
              if not g.is_dir(): continue
              for name in ('map-records.tsv','baseline-count.txt','pie-base.txt','window.id'):
                  src = g / name
                  if src.is_file(): shutil.copyfile(src, out / f'gen{gen}-{name}')
              for name in ('client.log','gdb.log'):
                  src = g / name
                  if not src.is_file(): continue
                  lines=[]
                  for line in src.read_text(errors='replace').splitlines()[-160:]:
                      if 'TIBIA_TEST_EMAIL' in line or 'TIBIA_TEST_PASSWORD' in line:
                          line='[REDACTED_SECRET_VARIABLE_LINE]'
                      line=email.sub('[REDACTED_EMAIL]', line)
                      lines.append(line)
                  (out / f'gen{gen}-{name}').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          comparison = root / 'comparison.txt'
          if comparison.is_file(): shutil.copyfile(comparison, out / 'comparison.txt')
          PY
          {
            echo "workflow_status=${{ job.status }}"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_head=$GITHUB_SHA"
            echo "runner=$RUNNER_NAME"
            echo "expected_client_sha256=$EXPECTED_CLIENT_SHA256"
            echo "expected_client_size=$EXPECTED_CLIENT_SIZE"
            echo "current_run_ownership=true"
            if [[ -n "${TRACK_A_RUNTIME_EFFECTIVE_HELPER:-}" && -r "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" ]]; then
              echo "effective_helper_sha256=$(sha256sum "$TRACK_A_RUNTIME_EFFECTIVE_HELPER" | awk '{print $1}')"
            fi
          } > "$out/workflow-terminal.txt"

      - name: Clean task-owned runtime processes and ephemeral state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          helper="${TRACK_A_RUNTIME_EFFECTIVE_HELPER:-.github/scripts/tibia-official-client-re-runtime-reacquisition.sh}"
          runtime="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runs/$GITHUB_RUN_ID/runtime"
          for gen in 1 2; do
            bash "$helper" stop "$gen"
            pidfile="$runtime/observer-gen-$gen.pid"
            if [[ -r "$pidfile" ]]; then
              pid="$(tr -cd '0-9' <"$pidfile")"
              if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
                echo "TRACK_A_RUNTIME_ERROR=observer_cleanup_timeout_gen_$gen" >&2
                exit 1
              fi
            fi
          done
          bash "$helper" cleanup

      - name: Upload sanitized runtime reacquisition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-runtime-reacquisition-${{ github.run_id }}
          path: artifacts/runtime-reacquisition/**
          if-no-files-found: ignore
          retention-days: 7

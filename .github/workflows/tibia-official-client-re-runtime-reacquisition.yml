name: Track A runtime restart/relogin reacquisition

on:
  push:
    branches:
      - research/OTC-20260815-track-a-runtime-reacquisition
    paths:
      - .github/workflows/tibia-official-client-re-runtime-reacquisition.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-client-ownership:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TASK_ID: OTC-20260815-track-a-runtime-reacquisition
      FAILED_RUN_ID: '31885192604'
      TRACK_MARKER: OTCLIENT_TIBIA_RE_TRACK=official-client-re
      TASK_MARKER: OTCLIENT_TIBIA_RE_TASK=OTC-20260815-track-a-runtime-reacquisition
      ROLE_MARKER: OTCLIENT_TIBIA_RE_ROLE=client-gen-1
      DISPLAY_NUM: '115'
      TASK_SOCKS_PORT: '25415'
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Inspect failed generation-1 client ownership read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REF_NAME" == research/OTC-20260815-track-a-runtime-reacquisition ]]

          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runs/$FAILED_RUN_ID"
          runtime="$root/runtime"
          generation="$root/generation-1"
          [[ "$root" == "/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31885192604" ]]
          mkdir -p artifacts/runtime-reacquisition-diagnostic
          out=artifacts/runtime-reacquisition-diagnostic/client-ownership.txt

          python3 - "$root" "$out" "$TRACK_MARKER" "$TASK_MARKER" "$ROLE_MARKER" "$DISPLAY_NUM" "$TASK_SOCKS_PORT" <<'PY'
          import os
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          track_marker = sys.argv[3].encode()
          task_marker = sys.argv[4].encode()
          role_marker = sys.argv[5].encode()
          display_num = sys.argv[6]
          socks_port = int(sys.argv[7])
          runtime = root / 'runtime'
          generation = root / 'generation-1'

          def read_pid(path: pathlib.Path):
              try:
                  text = ''.join(ch for ch in path.read_text(errors='ignore') if ch.isdigit())
                  return int(text) if text else None
              except OSError:
                  return None

          def alive(pid):
              return pid is not None and pathlib.Path(f'/proc/{pid}').exists()

          def environ(pid):
              try:
                  return pathlib.Path(f'/proc/{pid}/environ').read_bytes().split(b'\0')
              except OSError:
                  return []

          def exe(pid):
              try:
                  return os.path.realpath(f'/proc/{pid}/exe')
              except OSError:
                  return ''

          def ppid(pid):
              try:
                  for line in pathlib.Path(f'/proc/{pid}/status').read_text().splitlines():
                      if line.startswith('PPid:'):
                          return int(line.split()[1])
              except OSError:
                  pass
              return None

          def marker_state(pid):
              env = environ(pid)
              return (
                  track_marker in env,
                  task_marker in env,
                  role_marker in env,
                  any(item.startswith(b'TIBIA_TEST_EMAIL=') or item.startswith(b'TIBIA_TEST_PASSWORD=') for item in env),
              )

          lines = ['TRACK_A_RUNTIME_CLIENT_DIAGNOSTIC_READ_ONLY=true', f'root_exists={str(root.is_dir()).lower()}']
          recorded = read_pid(runtime / 'client-gen-1.pid')
          lines.append(f'recorded_client_pid={recorded if recorded is not None else "none"}')
          lines.append(f'recorded_client_alive={str(alive(recorded)).lower()}')
          if alive(recorded):
              track, task, role, secret = marker_state(recorded)
              lines.extend([
                  f'recorded_client_exe={exe(recorded)}',
                  f'recorded_client_ppid={ppid(recorded)}',
                  f'recorded_client_track_marker={str(track).lower()}',
                  f'recorded_client_task_marker={str(task).lower()}',
                  f'recorded_client_role_marker={str(role).lower()}',
                  f'recorded_client_secret_env={str(secret).lower()}',
              ])

          matches = []
          same_task = []
          for proc in pathlib.Path('/proc').iterdir():
              if not proc.name.isdigit():
                  continue
              pid = int(proc.name)
              env = environ(pid)
              if track_marker in env and task_marker in env:
                  same_task.append((pid, exe(pid), ppid(pid), role_marker in env))
                  if role_marker in env:
                      matches.append((pid, exe(pid), ppid(pid)))
          lines.append(f'exact_task_processes={len(same_task)}')
          for pid, process_exe, parent, is_client_role in sorted(same_task):
              lines.append(f'task_process pid={pid} ppid={parent} client_role={str(is_client_role).lower()} exe={process_exe}')
          lines.append(f'exact_client_role_matches={len(matches)}')
          for pid, process_exe, parent in sorted(matches):
              lines.append(f'client_role_match pid={pid} ppid={parent} exe={process_exe}')

          if recorded is not None:
              children = []
              for proc in pathlib.Path('/proc').iterdir():
                  if not proc.name.isdigit():
                      continue
                  pid = int(proc.name)
                  if ppid(pid) == recorded:
                      children.append((pid, exe(pid), marker_state(pid)[:3]))
              lines.append(f'recorded_pid_children={len(children)}')
              for pid, process_exe, markers in sorted(children):
                  track, task, role = markers
                  lines.append(
                      f'recorded_pid_child pid={pid} exe={process_exe} '
                      f'track={str(track).lower()} task={str(task).lower()} role={str(role).lower()}'
                  )

          for role_name in ('xvfb', 'socks-relay'):
              pid = read_pid(runtime / f'{role_name}.pid')
              lines.append(f'{role_name}_pid={pid if pid is not None else "none"}')
              lines.append(f'{role_name}_alive={str(alive(pid)).lower()}')
              if alive(pid):
                  env = environ(pid)
                  lines.append(f'{role_name}_task_owned={str(track_marker in env and task_marker in env).lower()}')

          lock = pathlib.Path(f'/tmp/.X{display_num}-lock')
          sock = pathlib.Path(f'/tmp/.X11-unix/X{display_num}')
          lines.append(f'x11_lock_exists={str(lock.exists()).lower()}')
          lines.append(f'x11_socket_exists={str(sock.exists()).lower()}')
          if lock.is_file():
              lock_pid = read_pid(lock)
              lines.append(f'x11_lock_pid={lock_pid if lock_pid is not None else "none"}')
              lines.append(f'x11_lock_pid_alive={str(alive(lock_pid)).lower()}')
          if sock.exists():
              try:
                  active = str(sock) in pathlib.Path('/proc/net/unix').read_text(errors='ignore')
              except OSError:
                  active = False
              lines.append(f'x11_socket_active={str(active).lower()}')

          needle = f'{socks_port:04X}'
          listening = False
          for name in ('tcp', 'tcp6'):
              path = pathlib.Path('/proc/net') / name
              if not path.exists():
                  continue
              for row in path.read_text().splitlines()[1:]:
                  fields = row.split()
                  if len(fields) > 3 and fields[1].rsplit(':', 1)[-1].upper() == needle and fields[3] == '0A':
                      listening = True
          lines.append(f'task_socks_port_listening={str(listening).lower()}')

          log = generation / 'client.log'
          lines.append(f'client_log_exists={str(log.is_file()).lower()}')
          if log.is_file():
              text = log.read_text(errors='replace')
              email = re.compile(r'(?i)[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}')
              tail = []
              for line in text.splitlines()[-120:]:
                  if 'TIBIA_TEST_EMAIL' in line or 'TIBIA_TEST_PASSWORD' in line:
                      line = '[REDACTED_SECRET_VARIABLE_LINE]'
                  line = email.sub('[REDACTED_EMAIL]', line)
                  tail.append(line)
              lines.append('client_log_tail_begin=true')
              lines.extend(f'client_log={line}' for line in tail)
              lines.append('client_log_tail_end=true')

          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          grep -Fxq 'TRACK_A_RUNTIME_CLIENT_DIAGNOSTIC_READ_ONLY=true' "$out"
          echo TRACK_A_RUNTIME_CLIENT_DIAGNOSTIC_COMPLETE=true

      - name: Upload sanitized client ownership diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-runtime-client-ownership-diagnostic-${{ github.run_id }}
          path: artifacts/runtime-reacquisition-diagnostic/**
          if-no-files-found: error
          retention-days: 7

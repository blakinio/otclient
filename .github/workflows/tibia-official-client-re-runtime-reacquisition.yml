name: Track A runtime restart/relogin reacquisition

on:
  push:
    branches:
      - research/OTC-20260815-track-a-runtime-reacquisition
    paths:
      - .github/workflows/tibia-official-client-re-runtime-reacquisition.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-xkb-toolroot:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Locate Xvfb XKB compiler dependencies read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REF_NAME" == research/OTC-20260815-track-a-runtime-reacquisition ]]
          source_state=/work/_otclient_tibia_re_state
          toolroot="$source_state/toolroot"
          xvfb="$source_state/runtime/Xvfb-track-a"
          mkdir -p artifacts/runtime-reacquisition-diagnostic
          out=artifacts/runtime-reacquisition-diagnostic/xkb-toolroot.txt
          {
            echo TRACK_A_RUNTIME_XKB_DIAGNOSTIC_READ_ONLY=true
            echo "toolroot_exists=$([[ -d "$toolroot" ]] && echo true || echo false)"
            echo "xvfb_exists=$([[ -x "$xvfb" ]] && echo true || echo false)"
            for path in \
              "$toolroot/usr/bin/xkbcomp" \
              "$toolroot/bin/xkbcomp" \
              "$toolroot/usr/libexec/xkbcomp" \
              "$source_state/runtime/xkbcomp"; do
              echo "candidate=$path exists=$([[ -e "$path" ]] && echo true || echo false) executable=$([[ -x "$path" ]] && echo true || echo false)"
              if [[ -e "$path" ]]; then
                echo "candidate_size=$(stat -c '%s' "$path" 2>/dev/null || echo unknown)"
                file "$path" 2>/dev/null | sed 's/^/candidate_file=/' || true
              fi
            done
            echo 'find_results_begin=true'
            find "$toolroot" -maxdepth 5 -type f -name xkbcomp -print 2>/dev/null | head -20 | sed 's/^/xkbcomp_found=/'
            echo 'find_results_end=true'
            echo 'xvfb_xkb_strings_begin=true'
            strings "$xvfb" 2>/dev/null | grep -E 'xkbcomp|XKB_BIN|xkbdir|XKB' | head -80 | sed 's/^/xvfb_string=/' || true
            echo 'xvfb_xkb_strings_end=true'
          } | tee "$out"
          grep -Fxq 'TRACK_A_RUNTIME_XKB_DIAGNOSTIC_READ_ONLY=true' "$out"
          echo TRACK_A_RUNTIME_XKB_DIAGNOSTIC_COMPLETE=true

      - name: Upload sanitized XKB diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-runtime-xkb-diagnostic-${{ github.run_id }}
          path: artifacts/runtime-reacquisition-diagnostic/**
          if-no-files-found: error
          retention-days: 7

name: Track A runtime restart/relogin reacquisition

on:
  push:
    branches:
      - research/OTC-20260815-track-a-runtime-reacquisition
    paths:
      - .github/workflows/tibia-official-client-re-runtime-reacquisition.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-client-loader:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TASK_ID: OTC-20260815-track-a-runtime-reacquisition
      FAILED_RUN_ID: '31885896845'
      DISPLAY_NUM: '115'
      TASK_SOCKS_PORT: '25415'
      TRACK_MARKER: OTCLIENT_TIBIA_RE_TRACK=official-client-re
      TASK_MARKER: OTCLIENT_TIBIA_RE_TASK=OTC-20260815-track-a-runtime-reacquisition
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Locate libpxbackend and inspect exact run residue read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REF_NAME" == research/OTC-20260815-track-a-runtime-reacquisition ]]

          source_state=/work/_otclient_tibia_re_state
          toolroot="$source_state/toolroot"
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runs/$FAILED_RUN_ID"
          runtime="$root/runtime"
          [[ "$root" == "/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260815-track-a-runtime-reacquisition/runs/31885896845" ]]

          mkdir -p artifacts/runtime-reacquisition-diagnostic
          out=artifacts/runtime-reacquisition-diagnostic/client-loader.txt
          {
            echo TRACK_A_RUNTIME_CLIENT_LOADER_DIAGNOSTIC_READ_ONLY=true
            echo "source_state=$source_state"
            echo "toolroot_exists=$([[ -d "$toolroot" ]] && echo true || echo false)"
            echo 'libpxbackend_find_begin=true'
            find "$source_state" -xdev -type f -name 'libpxbackend-1.0.so*' -print 2>/dev/null | head -40 | sed 's/^/libpxbackend_found=/'
            echo 'libpxbackend_find_end=true'

            for dir in \
              "$toolroot/lib/x86_64-linux-gnu" \
              "$toolroot/usr/lib/x86_64-linux-gnu" \
              "$toolroot/usr/lib" \
              "$source_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/lib"; do
              echo "candidate_dir=$dir exists=$([[ -d "$dir" ]] && echo true || echo false)"
              if [[ -d "$dir" ]]; then
                find "$dir" -maxdepth 2 -type f -name 'libpxbackend-1.0.so*' -print 2>/dev/null | sed 's/^/candidate_lib=/'
              fi
            done

            echo "failed_root_exists=$([[ -d "$root" ]] && echo true || echo false)"
            for role in socks-relay xvfb client-gen-1 observer-gen-1 client-gen-2 observer-gen-2; do
              pidfile="$runtime/$role.pid"
              pid="$(tr -cd '0-9' <"$pidfile" 2>/dev/null || true)"
              alive=false
              owned=false
              if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
                alive=true
                if [[ -r "/proc/$pid/environ" ]] \
                   && grep -azFxq "$TRACK_MARKER" "/proc/$pid/environ" \
                   && grep -azFxq "$TASK_MARKER" "/proc/$pid/environ" \
                   && grep -azFxq "OTCLIENT_TIBIA_RE_ROLE=$role" "/proc/$pid/environ"; then
                  owned=true
                fi
              fi
              echo "role=$role pid=${pid:-none} alive=$alive task_owned=$owned"
            done

            lock="/tmp/.X${DISPLAY_NUM}-lock"
            sock="/tmp/.X11-unix/X${DISPLAY_NUM}"
            echo "x11_lock_exists=$([[ -e "$lock" ]] && echo true || echo false)"
            echo "x11_socket_exists=$([[ -e "$sock" ]] && echo true || echo false)"
            if [[ -r "$lock" ]]; then
              lock_pid="$(tr -cd '0-9' <"$lock" 2>/dev/null || true)"
              echo "x11_lock_pid=${lock_pid:-none} alive=$([[ -n "$lock_pid" ]] && kill -0 "$lock_pid" 2>/dev/null && echo true || echo false)"
            fi
            if [[ -e "$sock" ]]; then
              grep -Fq "$sock" /proc/net/unix 2>/dev/null && echo x11_socket_active=true || echo x11_socket_active=false
            fi

            python3 - "$TASK_SOCKS_PORT" <<'PY'
          import pathlib, sys
          needle=f"{int(sys.argv[1]):04X}"
          listening=False
          for name in ('tcp','tcp6'):
              p=pathlib.Path('/proc/net')/name
              if not p.exists():
                  continue
              for row in p.read_text().splitlines()[1:]:
                  f=row.split()
                  if len(f)>3 and f[1].rsplit(':',1)[-1].upper()==needle and f[3]=='0A':
                      listening=True
          print(f'task_socks_port_listening={str(listening).lower()}')
          PY
          } | tee "$out"

          grep -Fxq 'TRACK_A_RUNTIME_CLIENT_LOADER_DIAGNOSTIC_READ_ONLY=true' "$out"
          echo TRACK_A_RUNTIME_CLIENT_LOADER_DIAGNOSTIC_COMPLETE=true

      - name: Upload sanitized client loader diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-runtime-client-loader-diagnostic-${{ github.run_id }}
          path: artifacts/runtime-reacquisition-diagnostic/**
          if-no-files-found: error
          retention-days: 7

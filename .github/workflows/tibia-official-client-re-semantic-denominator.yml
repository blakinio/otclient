name: Track A semantic denominator generation

on:
  pull_request:
    paths:
      - '.github/scripts/tibia-official-client-re-semantic-denominator.py'
      - '.github/workflows/tibia-official-client-re-semantic-denominator.yml'
      - 'docs/agents/tasks/active/OTC-20260817-track-a-semantic-denominator-normalization.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate finite semantic denominators
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .github/scripts/tibia-official-client-re-semantic-denominator.py
          rm -rf semantic-denominator-output
          mkdir -p semantic-denominator-output
          python3 .github/scripts/tibia-official-client-re-semantic-denominator.py semantic-denominator-output | tee semantic-denominator-output/validation.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('semantic-denominator-output')
          result = json.loads((root/'result.json').read_text())
          assert result['e51']['denominator'] == 349
          assert result['e52']['denominator'] == 642
          assert result['p0']['denominator'] == 180
          assert result['p1']['denominator'] == 28
          assert result['boundaries']['denominator_complete_is_not_semantic_complete'] is True
          for name in ('protocol_message_semantics.jsonl','runtime_type_semantics.jsonl','p0_items.jsonl','p1_items.jsonl'):
              rows=[json.loads(x) for x in (root/name).read_text().splitlines() if x.strip()]
              assert rows and len({r['id'] for r in rows}) == len(rows)
              assert all(r['denominator_membership'] == 'INCLUDED' for r in rows)
          assert sum(json.loads(x)['direct_qmeta_structural_link'] for x in (root/'protocol_message_semantics.jsonl').read_text().splitlines()) == 27
          print('SEMANTIC_DENOMINATOR_ARTIFACT_VALIDATION=PASS')
          PY

      - name: Materialize validated registries on task branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          canonical=docs/agents/evidence/OTC-20260815-track-a-coverage-registry-audit
          evidence=docs/agents/evidence/OTC-20260817-track-a-semantic-denominator-normalization
          mkdir -p "$evidence"
          cp semantic-denominator-output/protocol_message_semantics.jsonl "$canonical/protocol_message_semantics.jsonl"
          cp semantic-denominator-output/runtime_type_semantics.jsonl "$canonical/runtime_type_semantics.jsonl"
          cp semantic-denominator-output/p0_items.jsonl "$canonical/p0_items.jsonl"
          cp semantic-denominator-output/p1_items.jsonl "$canonical/p1_items.jsonl"
          cp semantic-denominator-output/result.json "$evidence/result.json"
          cp semantic-denominator-output/validation.txt "$evidence/generation-validation.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$canonical/protocol_message_semantics.jsonl" "$canonical/runtime_type_semantics.jsonl" "$canonical/p0_items.jsonl" "$canonical/p1_items.jsonl" "$evidence/result.json" "$evidence/generation-validation.txt"
          if ! git diff --cached --quiet; then
            git commit -m 'docs(track-a): materialize semantic denominator registries'
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Validate integrated canonical registry
        run: |
          set -Eeuo pipefail
          python3 -m py_compile docs/agents/evidence/OTC-20260815-track-a-coverage-registry-audit/validate_registry.py
          python3 docs/agents/evidence/OTC-20260815-track-a-coverage-registry-audit/validate_registry.py \
            docs/agents/evidence/OTC-20260815-track-a-coverage-registry-audit

      - name: Upload sanitized denominator package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-semantic-denominators-${{ github.run_id }}
          path: semantic-denominator-output/
          if-no-files-found: error
          retention-days: 7

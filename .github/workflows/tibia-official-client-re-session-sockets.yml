name: Track A live tunneled session sockets

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-session-sockets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Summarize latest aware-range capture per floor
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          [[ -n "$pid" && -r "/proc/$pid/environ" ]]
          grep -azFxq "$marker" "/proc/$pid/environ"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          latest="$(find "$state/evidence" -maxdepth 1 -type d -name 'aware-range-*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          [[ -n "$latest" && -s "$latest/records.txt" && -s "$latest/phases.txt" ]]
          records="$latest/records.txt"
          while read -r name s e; do
            for z in 6 7; do
              awk -v name="$name" -v s="$s" -v e="$e" -v wantz="$z" '$1>=s && $1<=e && $4==wantz { n++; x=$2; y=$3; if(n==1||x<xmin)xmin=x; if(n==1||x>xmax)xmax=x; if(n==1||y<ymin)ymin=y; if(n==1||y>ymax)ymax=y; xy[x FS y]=1 } END { printf "TRACK_A_%s_Z%d_COUNT=%d\n",name,wantz,n; if(n){ c=0; for(k in xy)c++; printf "TRACK_A_%s_Z%d_X_MIN=%d\nTRACK_A_%s_Z%d_X_MAX=%d\nTRACK_A_%s_Z%d_X_SPAN=%d\n",name,wantz,xmin,name,wantz,xmax,name,wantz,xmax-xmin+1; printf "TRACK_A_%s_Z%d_Y_MIN=%d\nTRACK_A_%s_Z%d_Y_MAX=%d\nTRACK_A_%s_Z%d_Y_SPAN=%d\n",name,wantz,ymin,name,wantz,ymax,name,wantz,ymax-ymin+1; printf "TRACK_A_%s_Z%d_UNIQUE_XY=%d\n",name,wantz,c } }' "$records"
            done
          done <"$latest/phases.txt"
          kill -0 "$pid"
          grep -azFxq "$marker" "/proc/$pid/environ"
          echo TRACK_A_SESSION_LEFT_LOGGED_IN=true

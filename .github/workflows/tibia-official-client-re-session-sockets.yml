name: Track A live tunneled session sockets
on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths: [.github/workflows/tibia-official-client-re-session-sockets.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 2
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Read corrected initial map watcher
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          d="$state/evidence/initial-map-detached"
          echo TRACK_A_WATCHER_LOG_BEGIN; cat "$d/watcher.log" 2>/dev/null || true; echo TRACK_A_WATCHER_LOG_END
          echo TRACK_A_WATCHER_RESULT_BEGIN; cat "$d/result.txt" 2>/dev/null || true; echo TRACK_A_WATCHER_RESULT_END
          echo TRACK_A_WATCHER_GDB_BEGIN; tail -40 "$d/gdb.log" 2>/dev/null || true; echo TRACK_A_WATCHER_GDB_END
          if [[ -f "$d/records.txt" ]]; then
            echo TRACK_A_WATCHER_RECORD_LINES="$(wc -l <"$d/records.txt")"
            awk '{z[$4]=1} END{printf "TRACK_A_WATCHER_Z_VALUES="; sep=""; for(k in z){printf "%s%s",sep,k;sep=","};print ""}' "$d/records.txt"
            echo TRACK_A_WATCHER_SAMPLE_BEGIN; head -30 "$d/records.txt"; echo TRACK_A_WATCHER_SAMPLE_END
          fi

name: Track A live tunneled session sockets

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-session-sockets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Wait for fresh login client and capture initial map
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          old_pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          echo TRACK_A_OBSERVER_OLD_PID="$old_pid"
          echo TRACK_A_OBSERVER_WAITING_FOR_FRESH_PID=true
          pid=''
          for _ in $(seq 1 240); do
            candidate="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
            if [[ -n "$candidate" && "$candidate" != "$old_pid" && -r "/proc/$candidate/environ" ]]; then
              if grep -azFxq "$marker" "/proc/$candidate/environ" && kill -0 "$candidate" 2>/dev/null && [[ "$(readlink -f "/proc/$candidate/exe" 2>/dev/null || true)" == "$client" ]]; then
                pid="$candidate"; break
              fi
            fi
            sleep 0.5
          done
          [[ -n "$pid" ]]
          [[ "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo TRACK_A_OBSERVER_FRESH_PID="$pid"
          line="$(grep -F "$client" "/proc/$pid/maps"|awk '$2~/r-xp/{print;exit}')"
          [[ -n "$line" ]]
          start="$(awk '{split($1,a,"-");print a[1]}'<<<"$line")"
          off="$(awk '{print $3}'<<<"$line")"
          bias=$((16#$start-16#$off))
          printf 'TRACK_A_OBSERVER_PIE_BASE=0x%x\n' "$bias"
          evidence="$state/evidence/initial-map-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$evidence"
          records="$evidence/records.txt"
          : >"$records"
          script="$evidence/probe.gdb"
          printf '%s\n' \
            'set pagination off' 'set confirm off' "attach $pid" 'python' 'import gdb,struct,time' 'inf=gdb.selected_inferior()' "out='$records'" \
            'class P(gdb.Breakpoint):' '    def __init__(self):' "        super().__init__('*0x%x' % ($bias+0x19a8ea3))" \
            '    def stop(self):' '        try:' \
            '            rsp=int(gdb.parse_and_eval("$rsp")); rbp=int(gdb.parse_and_eval("$rbp")); obj=int(gdb.parse_and_eval("$rbx"))' \
            '            x,y,z=struct.unpack("<III",bytes(inf.read_memory(rsp+0x88,12))); order=rbp&0xffffffff' \
            '            if 0<x<100000 and 0<y<100000 and z<32 and order<64:' \
            '                type_id=-1; kind=-1' \
            '                if obj:' \
            '                    try: type_id=struct.unpack("<I",bytes(inf.read_memory(obj+0x30,4)))[0]; kind=struct.unpack("<I",bytes(inf.read_memory(obj+0x38,4)))[0]' \
            '                    except: pass' \
            '                with open(out,"a") as f:f.write(f"{time.time_ns()//1000} {x} {y} {z} {order} {type_id} {kind}\n")' \
            '        except: pass' '        return False' 'P()' 'end' 'continue' >"$script"
          gdb -q -nx -batch -x "$script" >"$evidence/gdb.log" 2>&1 & gp=$!
          echo TRACK_A_OBSERVER_ATTACHED=true
          sleep 100
          if kill -0 "$gp" 2>/dev/null; then kill -INT "$gp" 2>/dev/null || true; sleep 1; fi
          kill -CONT "$pid" 2>/dev/null || true
          python3 - "$records" <<'PY'
          import sys,collections
          rows=[]
          for line in open(sys.argv[1]):
              p=line.split()
              if len(p)==7:
                  try: rows.append(tuple(map(int,p)))
                  except: pass
          print(f'TRACK_A_INITIAL_TOTAL_RECORDS={len(rows)}')
          if not rows: raise SystemExit(1)
          zs=sorted({r[3] for r in rows})
          print('TRACK_A_INITIAL_Z_VALUES='+','.join(map(str,zs)))
          print(f'TRACK_A_INITIAL_Z_COUNT={len(zs)}')
          for z in zs:
              rr=[r for r in rows if r[3]==z]
              xs=[r[1] for r in rr]; ys=[r[2] for r in rr]
              xy={(r[1],r[2]) for r in rr}
              ids={r[5] for r in rr if 0 <= r[5] < 1000000}
              print(f'TRACK_A_Z{z}_RECORDS={len(rr)}')
              print(f'TRACK_A_Z{z}_UNIQUE_XY={len(xy)}')
              print(f'TRACK_A_Z{z}_X_MIN={min(xs)}')
              print(f'TRACK_A_Z{z}_X_MAX={max(xs)}')
              print(f'TRACK_A_Z{z}_X_SPAN={max(xs)-min(xs)+1}')
              print(f'TRACK_A_Z{z}_Y_MIN={min(ys)}')
              print(f'TRACK_A_Z{z}_Y_MAX={max(ys)}')
              print(f'TRACK_A_Z{z}_Y_SPAN={max(ys)-min(ys)+1}')
              print(f'TRACK_A_Z{z}_DISTINCT_TYPE_IDS={len(ids)}')
          print('TRACK_A_INITIAL_MAP_CAPTURE_PROVEN=true')
          PY
          echo TRACK_A_INITIAL_SAMPLE_BEGIN
          head -40 "$records" || true
          echo TRACK_A_INITIAL_SAMPLE_END
          kill -0 "$pid"
          grep -azFxq "$marker" "/proc/$pid/environ"
          echo TRACK_A_SESSION_LEFT_RUNNING=true

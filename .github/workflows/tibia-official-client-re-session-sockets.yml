name: Track A Qt metaobject method decode
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-session-sockets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 4
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Decode Qt stringdata and metadata for df2a60 dispatcher
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]

          python3 - "$client" <<'PY'
          import struct,sys
          data=open(sys.argv[1],'rb').read()
          e_phoff=struct.unpack_from('<Q',data,0x20)[0]
          e_phentsize=struct.unpack_from('<H',data,0x36)[0]
          e_phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(e_phnum):
              o=e_phoff+i*e_phentsize
              typ,flags,off,vaddr,paddr,filesz,memsz,align=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1: loads.append((vaddr,vaddr+filesz,off))
          def vaoff(va):
              for lo,hi,off in loads:
                  if lo<=va<hi:return off+(va-lo)
              return None
          def raw(va,n):
              o=vaoff(va)
              if o is None:return None
              return data[o:o+n]
          def ascii_runs(va,n,minlen=2):
              b=raw(va,n)
              if b is None:return
              i=0
              while i<len(b):
                  j=i
                  while j<len(b) and 32<=b[j]<127:j+=1
                  if j-i>=minlen:
                      print(f'ASCII va=0x{va+i:x} len={j-i} text={b[i:j].decode("ascii","replace")!r}')
                  i=max(j+1,i+1)
          print('TRACK_A_QMETAOBJECT_3087800_WORDS_BEGIN=true')
          b=raw(0x3087800,0x40)
          for i in range(0,len(b),8):
              print(f'QMETA field_off=0x{i:x} qword=0x{struct.unpack_from("<Q",b,i)[0]:x}')
          print('TRACK_A_QMETAOBJECT_3087800_WORDS_END=true')

          # Qt metaobject at 0x3087800 references these regions directly.
          for va,n,label in [
              (0x1cd8600,0x800,'STRINGDATA_AROUND_1CD8820'),
              (0x1cd8800,0x900,'STRINGDATA_AROUND_1CD8A54'),
              (0x2f6a900,0x600,'METADATA_AROUND_2F6AB00'),
          ]:
              print(f'TRACK_A_{label}_BEGIN=true')
              ascii_runs(va,n,2)
              print(f'TRACK_A_{label}_END=true')

          # Print metadata as u32 around the pointer carried in the QMetaObject.
          for va in [0x1cd8820,0x1cd8a54,0x2f6ab00]:
              b=raw(va,0x180)
              if b is None: continue
              print(f'TRACK_A_U32_DUMP_BEGIN va=0x{va:x}')
              for i in range(0,len(b),16):
                  vals=struct.unpack_from('<IIII',b,i)
                  print(f'U32 va=0x{va+i:x} values='+','.join(f'0x{x:x}' for x in vals))
              print(f'TRACK_A_U32_DUMP_END va=0x{va:x}')

          # Scan the whole file for highly relevant method-name fragments, preserving VA.
          needles=[b'map',b'Map',b'tile',b'Tile',b'thing',b'Thing',b'creature',b'Creature',b'position',b'Position']
          print('TRACK_A_RELEVANT_STRING_HITS_BEGIN=true')
          for needle in needles:
              start=0; seen=0
              while True:
                  pos=data.find(needle,start)
                  if pos<0:break
                  # Convert file offset back to VA.
                  va=None
                  for lo,hi,off in loads:
                      if off<=pos<off+(hi-lo): va=lo+(pos-off); break
                  if va is not None:
                      l=pos
                      while l>0 and 32<=data[l-1]<127 and pos-l<80:l-=1
                      r=pos
                      while r<len(data) and 32<=data[r]<127 and r-l<200:r+=1
                      print(f'HIT needle={needle.decode()} va=0x{va:x} text={data[l:r].decode("ascii","replace")!r}')
                      seen+=1
                      if seen>=80: break
                  start=pos+1
          print('TRACK_A_RELEVANT_STRING_HITS_END=true')
          PY

          echo TRACK_A_QT_METAOBJECT_METHOD_DECODE_COMPLETE=true

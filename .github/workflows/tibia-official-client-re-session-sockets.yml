name: Track A parser dispatcher table mapping
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-session-sockets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Map dispatcher cases and inspect candidate dynamic handlers
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          gdb="$toolroot/usr/bin/gdb"
          [[ -x "$gdb" ]]
          "$gdb" -q -nx -batch "$client" \
            -ex 'set pagination off' -ex 'set disassembly-flavor intel' \
            -ex 'echo TRACK_A_DISPATCH_PROLOGUE_BEGIN=true\n' \
            -ex 'disassemble 0xdf2960,0xdf2f40' \
            -ex 'echo TRACK_A_DISPATCH_PROLOGUE_END=true\n' \
            -ex 'echo TRACK_A_CD3190_BEGIN=true\n' \
            -ex 'disassemble 0xcd3190,0xcd3500' \
            -ex 'echo TRACK_A_CD3190_END=true\n' \
            -ex 'echo TRACK_A_CD4E20_BEGIN=true\n' \
            -ex 'disassemble 0xcd4e20,0xcd5250' \
            -ex 'echo TRACK_A_CD4E20_END=true\n' \
            -ex 'echo TRACK_A_CECC70_BEGIN=true\n' \
            -ex 'disassemble 0xcecc70,0xcecf40' \
            -ex 'echo TRACK_A_CECC70_END=true\n' \
            -ex 'echo TRACK_A_CECF40_BEGIN=true\n' \
            -ex 'disassemble 0xcecf40,0xced220' \
            -ex 'echo TRACK_A_CECF40_END=true\n' \
            -ex 'echo TRACK_A_DISPATCH_TABLE_MAPPING_COMPLETE=true\n'

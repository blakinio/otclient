name: Track A live tunneled session sockets

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-session-sockets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Inspect candidate thing object memory
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          export HOME="$state/home" DISPLAY="$TRACK_DISPLAY" PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin" LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          pid="$(tr -cd '0-9' <"$state/runtime/client.pid")"
          [[ -r "/proc/$pid/environ" ]]; grep -azFxq "$marker" "/proc/$pid/environ"; kill -0 "$pid"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          [[ "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          window=''; for w in $("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do g="$("$toolroot/usr/bin/xdotool" getwindowgeometry --shell "$w" 2>/dev/null || true)"; [[ "$(printf '%s\n' "$g"|sed -n 's/^WIDTH=//p')" == 1020 && "$(printf '%s\n' "$g"|sed -n 's/^HEIGHT=//p')" == 650 ]] && { window="$w"; break; }; done; [[ -n "$window" ]]
          line="$(grep -F "$client" "/proc/$pid/maps"|awk '$2~/r-xp/{print;exit}')"; start="$(awk '{split($1,a,"-");print a[1]}'<<<"$line")"; off="$(awk '{print $3}'<<<"$line")"; bias=$((16#$start-16#$off))
          evidence="$state/evidence/thing-object-$(date -u +%Y%m%dT%H%M%SZ)"; mkdir -p "$evidence"; out="$evidence/hits.txt"; :>"$out"; script="$evidence/probe.gdb"
          printf '%s\n' \
            'set pagination off' 'set confirm off' "attach $pid" 'python' 'import gdb,struct' 'inf=gdb.selected_inferior()' "out='$out'" 'hits=0' \
            'def mem(addr,n=128):' '    try: return bytes(inf.read_memory(addr,n)).hex()' '    except: return "UNREADABLE"' \
            'class P(gdb.Breakpoint):' '    def __init__(self):' "        super().__init__('*0x%x' % ($bias+0x19a8ea3))" \
            '    def stop(self):' '        global hits' '        try:' '            rsp=int(gdb.parse_and_eval("$rsp")); rbp=int(gdb.parse_and_eval("$rbp"))' \
            '            x,y,z=struct.unpack("<III",bytes(inf.read_memory(rsp+0x88,12))); order=rbp&0xffffffff' \
            '            if 0<x<100000 and 0<y<100000 and z<32 and order<16 and hits<12:' \
            '                regs={r:int(gdb.parse_and_eval("$"+r)) for r in ["rbx","r10","r12","r13","r14"]}' \
            '                with open(out,"a") as f:' '                    f.write("HIT %d xyz=%d,%d,%d order=%d %s\\n"%(hits,x,y,z,order," ".join("%s=0x%x"%(k,v) for k,v in regs.items())))' \
            '                    for r in ["rbx","r10","r13","r14"]: f.write("MEM_%s %s\\n"%(r,mem(regs[r],128) if regs[r] else "NULL"))' \
            '                hits+=1' '        except: pass' '        return False' 'P()' 'end' 'continue' >"$script"
          gdb -q -nx -batch -x "$script" >"$evidence/gdb.log" 2>&1 & gp=$!; sleep 2
          "$toolroot/usr/bin/xdotool" windowactivate --sync "$window" 2>/dev/null || true; "$toolroot/usr/bin/xdotool" windowfocus --sync "$window" || true
          "$toolroot/usr/bin/xdotool" key Right; sleep 1.5; "$toolroot/usr/bin/xdotool" key Left || true; sleep 1
          kill -INT "$gp" 2>/dev/null || true; sleep 1; kill -CONT "$pid" 2>/dev/null || true
          cat "$out"
          kill -0 "$pid"; grep -azFxq "$marker" "/proc/$pid/environ"; echo TRACK_A_SESSION_LEFT_LOGGED_IN=true

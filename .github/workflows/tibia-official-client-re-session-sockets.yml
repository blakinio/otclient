name: Track A live tunneled session sockets

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-session-sockets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 2
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Inspect detached initial-map capture logs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          watchdir="$state/evidence/initial-map-detached"
          echo TRACK_A_WATCHER_LOG_BEGIN
          cat "$watchdir/watcher.log" 2>/dev/null || true
          echo TRACK_A_WATCHER_LOG_END
          echo TRACK_A_WATCHER_RESULT_BEGIN
          cat "$watchdir/result.txt" 2>/dev/null || true
          echo TRACK_A_WATCHER_RESULT_END
          echo TRACK_A_WATCHER_GDB_BEGIN
          cat "$watchdir/gdb.log" 2>/dev/null || true
          echo TRACK_A_WATCHER_GDB_END
          echo TRACK_A_WATCHER_NOHUP_BEGIN
          cat "$watchdir/nohup.log" 2>/dev/null || true
          echo TRACK_A_WATCHER_NOHUP_END
          if [[ -f "$watchdir/records.txt" ]]; then echo TRACK_A_WATCHER_RECORD_LINES="$(wc -l <"$watchdir/records.txt")"; fi

name: Track A preserve with-item provenance
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-session-sockets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 2
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Preserve with-item reload dataset
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          src="$state/evidence/item-provenance-reload/records.txt"
          dst="$state/evidence/item-provenance-with-item"
          [[ -s "$src" ]]
          rm -rf "$dst"; mkdir -p "$dst"
          cp "$src" "$dst/records.txt"
          sha256sum "$dst/records.txt" > "$dst/records.sha256"
          echo TRACK_A_WITH_ITEM_RECORDS="$(wc -l < "$dst/records.txt")"
          echo TRACK_A_WITH_ITEM_SHA256="$(sha256sum "$dst/records.txt" | awk '{print $1}')"
          echo TRACK_A_WITH_ITEM_DATASET_PRESERVED=true

name: Track A named worldmap mutation observer
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-session-sockets.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false
jobs:
  observe:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Arm raw observer on CreateOnMap ChangeOnMap DeleteOnMap
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          runtime="$state/runtime"
          mkdir -p "$runtime"
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]

          pid="$(tr -cd '0-9' <"$runtime/client.pid" 2>/dev/null || true)"
          [[ -n "$pid" && -r "/proc/$pid/environ" ]]
          grep -azFxq "$marker" "/proc/$pid/environ"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          kill -0 "$pid"
          echo TRACK_A_LIVE_CLIENT_PID="$pid"

          old_gdb="$(tr -cd '0-9' <"$runtime/dynamic-map-gdb.pid" 2>/dev/null || true)"
          if [[ -n "$old_gdb" ]] && kill -0 "$old_gdb" 2>/dev/null; then
            kill -INT "$old_gdb" 2>/dev/null || true
            for _ in $(seq 1 30); do
              kill -0 "$old_gdb" 2>/dev/null || break
              sleep .1
            done
          fi

          base="$(awk -v exe="$client" 'index($0,exe) && $3=="00000000" {split($1,a,"-"); print "0x" a[1]; exit}' "/proc/$pid/maps")"
          [[ "$base" =~ ^0x[0-9a-fA-F]+$ ]]
          echo TRACK_A_CLIENT_PIE_BASE="$base"

          log="$runtime/worldmap-mutation-events.log"
          cmd="$runtime/worldmap-mutation-observer.gdb"
          : >"$log"
          chmod 600 "$log"
          cat >"$cmd" <<GDB
          set pagination off
          set confirm off
          set breakpoint pending on
          set logging file $log
          set logging overwrite off
          set logging enabled on
          set \$base = $base

          hbreak *(\$base + 0xcecc70)
          commands
            silent
            printf "WORLDMAP_EVENT handler=CreateOnMap offset=0xcecc70 pc=%p rdi=%p rsi=%p rdx=%p rcx=%p r8=%p r9=%p rsp=%p\\n", \$pc, \$rdi, \$rsi, \$rdx, \$rcx, \$r8, \$r9, \$rsp
            printf "WORLDMAP_ARG_RAW handler=CreateOnMap arg_rsi=%p\\n", \$rsi
            x/16gx \$rsi
            continue
          end

          hbreak *(\$base + 0xcecf40)
          commands
            silent
            printf "WORLDMAP_EVENT handler=ChangeOnMap offset=0xcecf40 pc=%p rdi=%p rsi=%p rdx=%p rcx=%p r8=%p r9=%p rsp=%p\\n", \$pc, \$rdi, \$rsi, \$rdx, \$rcx, \$r8, \$r9, \$rsp
            printf "WORLDMAP_ARG_RAW handler=ChangeOnMap arg_rsi=%p\\n", \$rsi
            x/16gx \$rsi
            continue
          end

          hbreak *(\$base + 0xcd4e20)
          commands
            silent
            printf "WORLDMAP_EVENT handler=DeleteOnMap offset=0xcd4e20 pc=%p rdi=%p rsi=%p rdx=%p rcx=%p r8=%p r9=%p rsp=%p\\n", \$pc, \$rdi, \$rsi, \$rdx, \$rcx, \$r8, \$r9, \$rsp
            printf "WORLDMAP_ARG_RAW handler=DeleteOnMap arg_rsi=%p\\n", \$rsi
            x/16gx \$rsi
            continue
          end

          printf "WORLDMAP_OBSERVER_ARMED pid=$pid base=$base schema=raw-v1\\n"
          continue
          GDB
          chmod 600 "$cmd"

          gdb="$toolroot/usr/bin/gdb"
          [[ -x "$gdb" ]]
          env -u RUNNER_TRACKING_ID OTCLIENT_TIBIA_RE_TRACK=official-client-re \
            nohup "$gdb" -q -nx -p "$pid" -x "$cmd" >"$runtime/worldmap-mutation-gdb.stdout" 2>&1 </dev/null &
          gdb_pid=$!
          printf '%s\n' "$gdb_pid" >"$runtime/dynamic-map-gdb.pid"
          printf '%s\n' "$gdb_pid" >"$runtime/worldmap-mutation-gdb.pid"
          chmod 600 "$runtime/dynamic-map-gdb.pid" "$runtime/worldmap-mutation-gdb.pid"
          sleep 3
          kill -0 "$pid"
          kill -0 "$gdb_pid"
          grep -q 'WORLDMAP_OBSERVER_ARMED' "$log"

          echo TRACK_A_POST_LOGIN_ATTACH_STABLE=true
          echo TRACK_A_WORLDMAP_MUTATION_OBSERVER_ARMED=true
          echo TRACK_A_WORLDMAP_MUTATION_SCHEMA=raw-v1
          echo TRACK_A_WORLDMAP_MUTATION_GDB_PID="$gdb_pid"
          echo TRACK_A_WORLDMAP_MUTATION_EVENT_COUNT="$(grep -c '^WORLDMAP_EVENT ' "$log" || true)"

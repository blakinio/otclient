name: Track A parser-family xref enumeration
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-session-sockets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Enumerate calls into proven map parser family
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          objdump="$toolroot/usr/bin/objdump"
          [[ -x "$objdump" ]] || objdump=/usr/bin/objdump
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]

          out=/tmp/track-a-full-disasm.txt
          "$objdump" -d -M intel "$client" > "$out"
          echo TRACK_A_FULL_DISASM_LINES="$(wc -l < "$out")"

          echo TRACK_A_ROW_HANDLER_XREFS_BEGIN=true
          grep -n -B24 -A48 -E 'call[[:space:]]+cdbad0|call[[:space:]]+cdbb40|call[[:space:]]+cdbbb0|call[[:space:]]+cdbc20|call[[:space:]]+cdbc90|call[[:space:]]+cdbe30' "$out" || true
          echo TRACK_A_ROW_HANDLER_XREFS_END=true

          echo TRACK_A_COMMON_POSITION_PARSER_XREFS_BEGIN=true
          grep -n -B18 -A36 -E 'call[[:space:]]+cdb770' "$out" || true
          echo TRACK_A_COMMON_POSITION_PARSER_XREFS_END=true

          echo TRACK_A_TILE_DESCRIPTION_XREFS_BEGIN=true
          grep -n -B18 -A36 -E 'call[[:space:]]+19a8a80' "$out" || true
          echo TRACK_A_TILE_DESCRIPTION_XREFS_END=true

          echo TRACK_A_PARSER_FAMILY_XREF_ENUMERATION_COMPLETE=true

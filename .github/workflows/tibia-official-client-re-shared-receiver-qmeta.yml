name: Track A shared receiver QMeta decode

on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-shared-receiver-qmeta.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Decode exact shared receiver QMetaObject
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          python3 -u - "$client" <<'PY'
          import struct
          import sys

          data = open(sys.argv[1], 'rb').read()
          phoff = struct.unpack_from('<Q', data, 0x20)[0]
          phentsz = struct.unpack_from('<H', data, 0x36)[0]
          phnum = struct.unpack_from('<H', data, 0x38)[0]
          loads = []
          for index in range(phnum):
              offset = phoff + index * phentsz
              typ, flags, file_offset, va, _, filesz, _, _ = struct.unpack_from('<IIQQQQQQ', data, offset)
              if typ == 1:
                  loads.append((file_offset, file_offset + filesz, va, va + filesz, flags))
          def va2off(value):
              for lo, hi, va, vhi, _ in loads:
                  if va <= value < vhi:
                      return lo + value - va
              raise ValueError(hex(value))

          shoff = struct.unpack_from('<Q', data, 0x28)[0]
          shentsz = struct.unpack_from('<H', data, 0x3a)[0]
          shnum = struct.unpack_from('<H', data, 0x3c)[0]
          relas = {}
          for index in range(shnum):
              offset = shoff + index * shentsz
              _, typ, _, _, section_offset, size, _, _, _, entry_size = struct.unpack_from('<IIQQQQIIQQ', data, offset)
              if typ != 4 or not entry_size:
                  continue
              for position in range(section_offset, section_offset + size, entry_size):
                  relocation_offset, info, addend = struct.unpack_from('<QQq', data, position)
                  relas[relocation_offset] = (info & 0xffffffff, addend)

          base = 0x3074b20
          fields = {}
          for displacement, name in ((8, 'stringdata'), (0x10, 'metadata'), (0x18, 'static_metacall'), (0x28, 'associated')):
              relocation = relas.get(base + displacement)
              assert relocation and relocation[0] == 8, (name, relocation)
              fields[name] = relocation[1]
          string_offset = va2off(fields['stringdata'])
          first = struct.unpack_from('<I', data, string_offset)[0]
          assert first % 8 == 0 and 8 <= first <= 0x20000
          strings = []
          for index in range(first // 8):
              relative, length = struct.unpack_from('<II', data, string_offset + index * 8)
              strings.append(data[string_offset + relative:string_offset + relative + length].decode('utf-8'))
          metadata_offset = va2off(fields['metadata'])
          words = [struct.unpack_from('<I', data, metadata_offset + index * 4)[0] for index in range(20)]
          method_count, method_offset = words[4], words[5]
          print('TRACK_A_SHARED_RECEIVER_QMETA_BEGIN=true')
          print(f'RECORD base=0x{base:x} class={strings[0]!r} stringdata=0x{fields["stringdata"]:x} metadata=0x{fields["metadata"]:x} static_metacall=0x{fields["static_metacall"]:x} associated=0x{fields["associated"]:x} revision={words[0]} method_count={method_count}')
          for index in range(method_count):
              entry = metadata_offset + (method_offset + index * 6) * 4
              name_index = struct.unpack_from('<I', data, entry)[0]
              print(f'METHOD index={index} name={strings[name_index]!r}')
          print('TRACK_A_SHARED_RECEIVER_QMETA_COMPLETE=true')
          PY

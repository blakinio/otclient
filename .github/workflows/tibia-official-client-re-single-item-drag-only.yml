name: Track A single adjacent item drag only
on:
  push:
    branches:
      - ci/OTC-20260814-track-a-single-item-drag
    paths:
      - .github/workflows/tibia-official-client-re-single-item-drag-only.yml
permissions:
  contents: read
concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false
jobs:
  drag:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Verify Track A and send exactly one adjacent-tile drag
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          runtime="$state/runtime"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          [[ -r "$runtime/client.pid" && -r "$runtime/map-provenance-gdb.pid" ]]
          pid="$(tr -cd '0-9' <"$runtime/client.pid")"
          gp="$(tr -cd '0-9' <"$runtime/map-provenance-gdb.pid")"
          kill -0 "$pid"
          kill -0 "$gp"
          grep -azFxq "$marker" "/proc/$pid/environ"
          grep -azFxq "$marker" "/proc/$gp/environ"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$pid/status")" == "$gp" ]]
          ev="$runtime/map-provenance-persistent-events.tsv"
          strips="$runtime/map-provenance-persistent-strips.tsv"
          [[ -r "$ev" && -r "$strips" ]]
          before_events="$(wc -l <"$ev")"
          before_strips="$(wc -l <"$strips")"
          echo TRACK_A_CLIENT_PID="$pid"
          echo TRACK_A_PROVENANCE_OBSERVER_PID="$gp"
          echo TRACK_A_EVENTS_BEFORE="$before_events"
          echo TRACK_A_STRIPS_BEFORE="$before_strips"
          export HOME="$state/home" DISPLAY="$TRACK_DISPLAY"
          export PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin"
          export LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          resolve_window(){
            local w g width height area best='' best_area=0
            for _ in $(seq 1 40); do
              best=''; best_area=0
              for w in $("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do
                g="$("$toolroot/usr/bin/xdotool" getwindowgeometry --shell "$w" 2>/dev/null || true)"
                width="$(printf '%s\n' "$g" | sed -n 's/^WIDTH=//p')"
                height="$(printf '%s\n' "$g" | sed -n 's/^HEIGHT=//p')"
                [[ -n "$width" && -n "$height" ]] || continue
                area=$((width*height))
                if (( area > best_area )); then best="$w"; best_area=$area; fi
              done
              [[ -n "$best" ]] && { printf '%s\n' "$best"; return 0; }
              sleep .25
            done
            return 1
          }
          window="$(resolve_window)"
          echo TRACK_A_WINDOW="$window"
          out="$GITHUB_WORKSPACE/artifacts/single-item-drag"
          mkdir -p "$out"
          "$toolroot/usr/bin/xdotool" windowactivate --sync "$window" 2>/dev/null || true
          "$toolroot/usr/bin/xdotool" windowfocus --sync "$window"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$out/before.xwd"
          printf '%s\n' "$(date +%s%N)" >"$out/drag-begin-ns.txt"
          "$toolroot/usr/bin/xdotool" mousemove --window "$window" 270 205 mousedown 1
          sleep .25
          "$toolroot/usr/bin/xdotool" mousemove --window "$window" 302 205
          sleep .25
          "$toolroot/usr/bin/xdotool" mouseup 1
          printf '%s\n' "$(date +%s%N)" >"$out/drag-end-ns.txt"
          echo TRACK_A_SINGLE_ITEM_DRAG_SENT=true
          echo TRACK_A_SINGLE_ITEM_DRAG_SOURCE=270,205
          echo TRACK_A_SINGLE_ITEM_DRAG_DESTINATION=302,205
          sleep 3
          kill -0 "$pid"
          kill -0 "$gp"
          [[ "$(awk '/^TracerPid:/{print $2}' "/proc/$pid/status")" == "$gp" ]]
          window="$(resolve_window)"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$out/after.xwd"
          changed="$(python3 "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-xwd-diff.py" "$out/before.xwd" "$out/after.xwd")"
          after_events="$(wc -l <"$ev")"
          after_strips="$(wc -l <"$strips")"
          echo TRACK_A_SINGLE_ITEM_DRAG_CHANGED_PIXELS="$changed"
          echo TRACK_A_EVENTS_AFTER="$after_events"
          echo TRACK_A_STRIPS_AFTER="$after_strips"
          echo TRACK_A_EVENTS_DELTA=$((after_events-before_events))
          echo TRACK_A_STRIPS_DELTA=$((after_strips-before_strips))
          echo TRACK_A_NEW_EVENT_EVIDENCE_BEGIN=true
          if (( after_events > before_events )); then tail -n "$((after_events-before_events))" "$ev"; fi
          echo TRACK_A_NEW_EVENT_EVIDENCE_END=true
          echo TRACK_A_NEW_STRIP_EVIDENCE_BEGIN=true
          if (( after_strips > before_strips )); then tail -n "$((after_strips-before_strips))" "$strips"; fi
          echo TRACK_A_NEW_STRIP_EVIDENCE_END=true
          echo TRACK_A_SESSION_LEFT_RUNNING=true
      - name: Upload one-drag evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-single-item-drag-only
          path: artifacts/single-item-drag/*
          if-no-files-found: ignore
          retention-days: 7

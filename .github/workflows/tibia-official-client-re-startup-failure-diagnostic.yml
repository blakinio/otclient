name: Track A diagnose official client pre-login exit
on:
  push:
    branches: [ci/OTC-20260814-track-a-single-item-drag]
    paths: [.github/workflows/tibia-official-client-re-startup-failure-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Inspect owned Track A startup state read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'; runtime="$state/runtime"
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" && "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo TRACK_A_DIAG_STATE="$state"
          echo TRACK_A_DIAG_CLIENT_PID_FILE="$(cat "$runtime/client.pid" 2>/dev/null || true)"
          echo TRACK_A_DIAG_CLIENT_LOG_BEGIN=true
          if [[ -r "$runtime/client.log" ]]; then
            sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[REDACTED_EMAIL]/g' "$runtime/client.log" | tail -n 300
          fi
          echo TRACK_A_DIAG_CLIENT_LOG_END=true
          crash="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/crashdump"
          echo TRACK_A_DIAG_CRASH_FILES_BEGIN=true
          if [[ -d "$crash" ]]; then find "$crash" -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' | sort; fi
          echo TRACK_A_DIAG_CRASH_FILES_END=true
          echo TRACK_A_DIAG_TRACK_PROCESSES_BEGIN=true
          for p in /proc/[0-9]*; do
            [[ -r "$p/environ" ]] || continue
            if grep -azFxq "$marker" "$p/environ" 2>/dev/null; then
              pid="${p##*/}"; exe="$(readlink -f "$p/exe" 2>/dev/null || true)"; cmd="$(tr '\0' ' ' <"$p/cmdline" 2>/dev/null || true)"
              printf 'PID=%s EXE=%q CMD=%q\n' "$pid" "$exe" "$cmd"
              awk '/^(State|PPid|TracerPid):/{print "  "$0}' "$p/status" 2>/dev/null || true
            fi
          done
          echo TRACK_A_DIAG_TRACK_PROCESSES_END=true
          echo TRACK_A_DIAG_CLIENT_PATH_PROCESSES_BEGIN=true
          for p in /proc/[0-9]*; do
            [[ -e "$p/exe" ]] || continue
            exe="$(readlink -f "$p/exe" 2>/dev/null || true)"
            [[ "$exe" == "$client" ]] || continue
            printf 'PID=%s\n' "${p##*/}"
          done
          echo TRACK_A_DIAG_CLIENT_PATH_PROCESSES_END=true
          echo TRACK_A_DIAG_LOCKLIKE_FILES_BEGIN=true
          find "$state/home/.local/share/CipSoft GmbH/Tibia" -maxdepth 3 \( -type s -o -type p -o -type f \) \( -iname '*lock*' -o -iname '*singleton*' -o -iname '*.pid' \) -printf '%p\n' 2>/dev/null | head -n 200 || true
          echo TRACK_A_DIAG_LOCKLIKE_FILES_END=true

name: Track A inspect shared thing normalization provenance surface
on:
  push:
    branches: [ci/OTC-20260814-track-a-single-item-drag]
    paths: [.github/workflows/tibia-official-client-re-thing-normalization-static.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 4
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Inspect shared normalization helper and related metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient && "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"; root="$state/toolroot"
          [[ -x "$client" && "$(sha256sum "$client"|awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          export PATH="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin" LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu"
          gdb="$root/usr/bin/gdb"; [[ -x "$gdb" ]]
          echo TRACK_A_NORMALIZER_DISASM_BEGIN=true
          "$gdb" -q -nx -batch "$client" -ex 'set pagination off' -ex 'set disassembly-flavor intel' -ex 'disassemble /r 0xceca50,0xcecc70'
          echo TRACK_A_NORMALIZER_DISASM_END=true
          for a in 0x30874a8 0x314b480 0x2f615a0 0x3175d20 0x313a820 0x313a7c0; do
            echo "TRACK_A_META_BEGIN=$a"
            "$gdb" -q -nx -batch "$client" -ex 'set pagination off' -ex "x/24gx $a" -ex "info symbol $a" || true
            echo "TRACK_A_META_END=$a"
          done
          echo TRACK_A_RELEVANT_STRINGS_BEGIN=true
          strings -a -t x "$client" | grep -Ei 'protobuf|worldmap|thing|appearance|item|creature|object' | head -n 600 || true
          echo TRACK_A_RELEVANT_STRINGS_END=true

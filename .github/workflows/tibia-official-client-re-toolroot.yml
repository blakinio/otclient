name: Track A official-client RE toolroot

on:
  workflow_dispatch:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-toolroot.yml

permissions:
  contents: read

concurrency:
  group: official-client-re-toolroot
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ${{ fromJSON('["otclient", "synology"]') }}
    timeout-minutes: 15
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Build isolated Track A user-space toolroot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -s)" == Linux ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          root="$state/toolroot"
          debs="$state/cache/toolroot-debs"
          aptroot="$state/cache/toolroot-apt"
          mkdir -p "$root" "$debs" "$aptroot/lists/partial" "$aptroot/archives/partial"
          chmod 700 "$state" "$root" "$debs" "$aptroot" "$aptroot/lists" "$aptroot/archives"

          apt_opts=(
            -o "Dir::State::lists=$aptroot/lists"
            -o "Dir::Cache::archives=$aptroot/archives"
            -o APT::Get::List-Cleanup=0
          )
          apt-get "${apt_opts[@]}" update

          cd "$debs"
          # Keep the toolroot self-contained. apt-get download does not resolve
          # dependencies, so list the direct runtime libraries observed on the
          # pinned Ubuntu noble runner image explicitly.
          packages=(
            file gdb proxychains4 socat xdotool xvfb
            libmagic1t64 libpython3.12 libbabeltrace1 libbabeltrace-ctf1
            libipt2 libmpfr6 libsource-highlight4t64 libdebuginfod1t64
            libxdo3 libgl1 libpixman-1-0 libxfont2 libssl3t64 libwrap0
          )
          for package in "${packages[@]}"; do
            apt-get "${apt_opts[@]}" download "$package"
          done
          for archive in ./*.deb; do
            dpkg-deb -x "$archive" "$root"
          done

          required=(file gdb proxychains4 socat xdotool Xvfb)
          missing=0
          for tool in "${required[@]}"; do
            candidate="$(find "$root/usr/bin" "$root/usr/sbin" -maxdepth 1 \
              \( -type f -o -type l \) -name "$tool" -print -quit 2>/dev/null || true)"
            if [[ -z "$candidate" ]]; then
              echo TRACK_A_TOOLROOT_MISSING_BINARY="$tool"
              missing=$((missing+1))
              continue
            fi
            echo TRACK_A_TOOLROOT_BINARY="$tool"
            unresolved="$(LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu" ldd "$candidate" 2>/dev/null | awk '/not found/{print $1}' | paste -sd, - || true)"
            if [[ -n "$unresolved" ]]; then
              echo "TRACK_A_TOOLROOT_UNRESOLVED_${tool^^}=$unresolved"
            fi
          done
          echo TRACK_A_TOOLROOT_MISSING_BINARY_COUNT="$missing"
          [[ "$missing" == 0 ]]
          unresolved_total="$(
            for tool in "${required[@]}"; do
              candidate="$(find "$root/usr/bin" "$root/usr/sbin" -maxdepth 1 \
                \( -type f -o -type l \) -name "$tool" -print -quit 2>/dev/null || true)"
              [[ -n "$candidate" ]] || continue
              LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu" \
                ldd "$candidate" 2>/dev/null | awk '/not found/{print $1}'
            done | sort -u | paste -sd, -
          )"
          echo TRACK_A_TOOLROOT_UNRESOLVED_TOTAL="$unresolved_total"
          [[ -z "$unresolved_total" ]]
          printf 'PATH=%s\nLD_LIBRARY_PATH=%s\n' \
            "$root/usr/bin:$root/usr/sbin" \
            "$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu" \
            >"$root/track-a-toolroot.env"
          chmod 600 "$root/track-a-toolroot.env"
          echo TRACK_A_USERSPACE_TOOLROOT_PREPARED=true

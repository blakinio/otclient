name: Track A UI settings persistence discriminator v2 retired

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-ui-settings-persistence-v2.yml

permissions:
  contents: read

concurrency:
  group: track-a-ui-settings-persistence-544-v2
  cancel-in-progress: true

jobs:
  retired:
    name: Retired v2 discriminator
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record supersession
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'UI_SETTINGS_PERSISTENCE_V2=RETIRED_AFTER_RUN_32220128284'
          echo 'UI_SETTINGS_PERSISTENCE_V2_FAILURE=XDOTOOL_LOADER_MISSING_LIBXDO_BEFORE_ANY_INPUT'
          echo 'UI_SETTINGS_PERSISTENCE_V2_SUPERSEDED_BY=v3'

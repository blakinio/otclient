name: Track A UI settings persistence discriminator v3 retired

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-ui-settings-persistence-v3.yml

permissions:
  contents: read

concurrency:
  group: track-a-ui-settings-persistence-544-v3
  cancel-in-progress: true

jobs:
  retired:
    name: Retired v3 geometry discriminator
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record supersession
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'UI_SETTINGS_PERSISTENCE_V3=RETIRED_AFTER_RUN_32220773602'
          echo 'UI_SETTINGS_PERSISTENCE_V3_OBSERVER=XDOTOOL_SENT_WITHOUT_ERROR_BUT_XVFB_GEOMETRY_UNCHANGED'
          echo 'UI_SETTINGS_PERSISTENCE_V3_SUPERSEDED_BY=v4-persistence-file-state'

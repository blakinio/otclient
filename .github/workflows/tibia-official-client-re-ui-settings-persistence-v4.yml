name: Track A UI settings persistence discriminator v4 retired

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-ui-settings-persistence-v4.yml

permissions:
  contents: read

concurrency:
  group: track-a-ui-settings-persistence-544-v4
  cancel-in-progress: true

jobs:
  retired:
    name: Retired v4 unbounded observer
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record supersession
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'UI_SETTINGS_PERSISTENCE_V4=RETIRED_DUE_TO_UNBOUNDED_PACKAGE_SCAN'
          echo 'UI_SETTINGS_PERSISTENCE_V4_SUPERSEDED_BY=v5-bounded-persistence-observer'

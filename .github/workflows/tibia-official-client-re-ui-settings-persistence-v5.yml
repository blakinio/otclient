name: Track A UI settings persistence discriminator v5

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-ui-settings-persistence-v5.yml

permissions:
  contents: read

concurrency:
  group: track-a-ui-settings-persistence-544-v4
  cancel-in-progress: true

jobs:
  admission:
    name: Admit bounded current-main UI settings proof v5
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head with history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Revalidate current main and task admission
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          task=docs/agents/tasks/active/OTC-20260819-track-a-ui-settings-static-model.md
          task_main="$(sed -n 's/^base_main: //p' "$task" | head -n1)"
          [[ -n "$task_main" && "$live_main" == "$task_main" ]] || {
            echo "UI_SETTINGS_V5_REFUSED=MAIN_MOVED:task=$task_main:live=$live_main" >&2
            exit 40
          }
          grep -Fxq 'runtime_access: ephemeral_isolated' "$task"
          grep -Fxq 'runtime_owner_task: OTC-20260819-track-a-ui-settings-static-model' "$task"
          grep -Fxq 'runtime_namespace: ui-settings-persistence-ephemeral' "$task"
          grep -Fxq 'target_uniqueness: PROVEN' "$task"
          grep -Fxq 'mutation_authorized: true' "$task"
          grep -Fxq 'execution_class: synology_physical_runtime' "$task"
          grep -Fxq 'physical_e2e_required: true' "$task"
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$live_main" \
            --expected-branch "${GITHUB_HEAD_REF}"
          echo "UI_SETTINGS_V5_LIVE_MAIN=$live_main"
          echo 'UI_SETTINGS_V5_ADMISSION=PASS'

  persistence:
    name: Prove bounded causal settings persistence and rollback v5
    needs: admission
    runs-on: [otclient, synology]
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Execute pinned client harness with bounded persistence observer
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          umask 077

          [[ "${RUNNER_NAME:-}" == synology-otclient-01 ]] || {
            echo "UI_SETTINGS_V5_REFUSED=WRONG_RUNNER:${RUNNER_NAME:-UNKNOWN}" >&2
            exit 41
          }

          live_main="$(git ls-remote https://github.com/blakinio/otclient.git refs/heads/main | awk '{print $1}')"
          task_main="$(sed -n 's/^base_main: //p' docs/agents/tasks/active/OTC-20260819-track-a-ui-settings-static-model.md | head -n1)"
          [[ -n "$live_main" && "$live_main" == "$task_main" ]] || {
            echo "UI_SETTINGS_V5_REFUSED=MAIN_MOVED:task=$task_main:live=$live_main" >&2
            exit 42
          }
          echo "UI_SETTINGS_V5_LIVE_MAIN=$live_main"

          tool=''
          xdo_lib=''
          for candidate in \
            '/home/runner/_work/_otclient_tibia_re_state/toolroot' \
            '/work/_otclient_tibia_re_state/toolroot'; do
            if [[ -d "$candidate" && ! -L "$candidate" ]]; then
              candidate_xdo="$(find "$candidate" -xdev \( -type f -o -type l \) -name 'libxdo.so.3' -print -quit 2>/dev/null || true)"
              if [[ -n "$candidate_xdo" && -e "$candidate_xdo" ]]; then
                tool="$candidate"
                xdo_lib="$candidate_xdo"
                break
              fi
            fi
          done
          [[ -n "$tool" && -n "$xdo_lib" ]] || {
            echo 'UI_SETTINGS_V5_REFUSED=LIBXDO_NOT_FOUND_IN_CONTAINED_TOOLROOT' >&2
            exit 43
          }
          xdo_lib="$(realpath -e "$xdo_lib")"
          tool_real="$(realpath -e "$tool")"
          case "$xdo_lib" in
            "$tool_real"/*) ;;
            *) echo 'UI_SETTINGS_V5_REFUSED=LIBXDO_ESCAPES_TOOLROOT' >&2; exit 44 ;;
          esac
          xdo_dir="$(dirname "$xdo_lib")"
          export LD_LIBRARY_PATH="$xdo_dir:$tool/usr/lib/x86_64-linux-gnu:$tool/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$tool/usr/bin/xdotool" --version >/dev/null
          echo "UI_SETTINGS_V5_LIBXDO_PATH=$xdo_lib"
          echo 'UI_SETTINGS_V5_XDOTOOL_LOADER_FENCE=PASS'

          pinned='cb6fb812a5682f9442f482abaa4764e067589692'
          source="$RUNNER_TEMP/ui-settings-v2-pinned.yml"
          script="$RUNNER_TEMP/ui-settings-v5-body.sh"
          tail_script="$RUNNER_TEMP/ui-settings-v5-tail.sh"
          curl -fsSL --retry 3 --connect-timeout 10 \
            "https://raw.githubusercontent.com/blakinio/otclient/$pinned/.github/workflows/tibia-official-client-re-ui-settings-persistence-v2.yml" \
            -o "$source"
          grep -Fq 'name: Track A UI settings persistence discriminator v2' "$source"

          cat >"$tail_script" <<'TAIL'
          cat >"$root/statecheck.py" <<'PY'
          import hashlib, json, os, pathlib, re, sys

          PATTERN = re.compile(r'(config|option|setting|hotkey|action.?bar|clientoptions|\.ini$|\.conf$|\.cfg$|\.json$)', re.I)
          MAX_SIZE = 4 * 1024 * 1024

          def load(path):
              return json.loads(pathlib.Path(path).read_text(encoding='utf-8'))

          def add(result, home, path):
              try:
                  if not path.is_file() or path.is_symlink():
                      return
                  resolved = path.resolve()
                  if resolved != home and home not in resolved.parents:
                      return
                  size = resolved.stat().st_size
                  if size > MAX_SIZE:
                      return
                  rel = resolved.relative_to(home).as_posix()
                  data = resolved.read_bytes()
                  result[rel] = {'size': size, 'sha256': hashlib.sha256(data).hexdigest()}
              except (OSError, ValueError):
                  return

          def shallow_matching(result, home, root, max_depth):
              if not root.exists():
                  return
              root = root.resolve()
              for dirpath, dirnames, filenames in os.walk(root):
                  current = pathlib.Path(dirpath)
                  try:
                      depth = len(current.relative_to(root).parts)
                  except ValueError:
                      dirnames[:] = []
                      continue
                  if depth >= max_depth:
                      dirnames[:] = []
                  for name in filenames:
                      if PATTERN.search(name):
                          add(result, home, current / name)

          def snapshot(home_s, package_s, out_s):
              home = pathlib.Path(home_s).resolve()
              package = pathlib.Path(package_s).resolve()
              result = {}
              config_root = home / '.config'
              if config_root.exists():
                  for path in config_root.rglob('*'):
                      add(result, home, path)
              if home.exists():
                  for path in home.iterdir():
                      if path.is_file() and PATTERN.search(path.name):
                          add(result, home, path)
              data_root = home / '.local' / 'share' / 'CipSoft GmbH' / 'Tibia'
              shallow_matching(result, home, data_root, 3)
              for rel in ('config.ini','clientoptions.json','settings.ini','settings.json','options.json',
                          'bin/config.ini','bin/clientoptions.json','bin/settings.ini','bin/settings.json','bin/options.json'):
                  add(result, home, package / rel)
              pathlib.Path(out_s).write_text(json.dumps(result, sort_keys=True), encoding='utf-8')

          cmd = sys.argv[1]
          if cmd == 'snapshot':
              snapshot(sys.argv[2], sys.argv[3], sys.argv[4])
          elif cmd == 'diffcount':
              a, b = load(sys.argv[2]), load(sys.argv[3])
              print(sum(1 for k in set(a) | set(b) if a.get(k) != b.get(k)))
          elif cmd == 'persisted':
              baseline, toggled, restarted = load(sys.argv[2]), load(sys.argv[3]), load(sys.argv[4])
              paths = [k for k in sorted(set(baseline) | set(toggled) | set(restarted))
                       if baseline.get(k) != toggled.get(k) and restarted.get(k) == toggled.get(k)]
              pathlib.Path(sys.argv[5]).write_text(json.dumps(paths), encoding='utf-8')
              print(f'UI_SETTINGS_V5_CAUSAL_PERSISTED_PATH_COUNT={len(paths)}')
              for i, key in enumerate(paths[:20]):
                  b = baseline.get(key, {}).get('sha256', 'ABSENT')
                  t = toggled.get(key, {}).get('sha256', 'ABSENT')
                  r = restarted.get(key, {}).get('sha256', 'ABSENT')
                  print(f'UI_SETTINGS_V5_CAUSAL_PATH={i};PATH={key};BASELINE_SHA256={b};TOGGLED_SHA256={t};RESTART_SHA256={r}')
              raise SystemExit(0 if paths else 2)
          elif cmd == 'restored':
              baseline, current = load(sys.argv[2]), load(sys.argv[3])
              paths = json.loads(pathlib.Path(sys.argv[4]).read_text(encoding='utf-8'))
              failed = [k for k in paths if current.get(k) != baseline.get(k)]
              print(f'UI_SETTINGS_V5_RESTORE_MISMATCH_COUNT={len(failed)}')
              for i, key in enumerate(failed[:20]):
                  b = baseline.get(key, {}).get('sha256', 'ABSENT')
                  c = current.get(key, {}).get('sha256', 'ABSENT')
                  print(f'UI_SETTINGS_V5_RESTORE_MISMATCH={i};PATH={key};BASELINE_SHA256={b};CURRENT_SHA256={c}')
              raise SystemExit(0 if not failed else 3)
          else:
              raise SystemExit(f'unknown command {cmd}')
          PY

          snapshot_state() { python3 "$root/statecheck.py" snapshot "$home" "$package" "$1"; }
          diff_count() { python3 "$root/statecheck.py" diffcount "$1" "$2"; }

          baseline_state="$root/persistence-baseline.json"
          toggled_state="$root/persistence-toggled.json"
          restarted_state="$root/persistence-restarted.json"
          rollback_state="$root/persistence-rollback.json"
          final_state="$root/persistence-final.json"
          causal_paths="$root/persistence-causal-paths.json"
          temp_state="$root/persistence-temp.json"

          snapshot_state "$baseline_state"
          baseline_candidate_count="$(python3 - "$baseline_state" <<'PY'
          import json,sys
          print(len(json.load(open(sys.argv[1],encoding='utf-8'))))
          PY
          )"
          echo "UI_SETTINGS_V5_BASELINE_CANDIDATE_COUNT=$baseline_candidate_count"
          echo 'UI_SETTINGS_V5_BASELINE_STATE_CAPTURED=PASS'

          toggle_fullscreen_locked "$win"
          echo 'UI_SETTINGS_V5_INPUT_1_ALT_RETURN_SENT=PASS'

          immediate_delta=0
          for _ in $(seq 1 24); do
            sleep .25
            snapshot_state "$temp_state"
            immediate_delta="$(diff_count "$baseline_state" "$temp_state")"
            if (( immediate_delta > 0 )); then
              echo "UI_SETTINGS_V5_IMMEDIATE_CANDIDATE_DELTA_COUNT=$immediate_delta"
              break
            fi
          done

          stop_client
          snapshot_state "$toggled_state"
          post_stop_delta="$(diff_count "$baseline_state" "$toggled_state")"
          echo "UI_SETTINGS_V5_POST_STOP_CANDIDATE_DELTA_COUNT=$post_stop_delta"
          if (( post_stop_delta == 0 )); then
            echo 'UI_SETTINGS_V5_SEMANTIC_NEGATIVE=NO_PERSISTENCE_CANDIDATE_DELTA_AFTER_ALT_RETURN_AND_CLIENT_STOP'
            exit 70
          fi

          start_client
          restarted="$(wait_large_window)" || { echo 'UI_SETTINGS_V5_REFUSED=RESTART_WINDOW_MISSING' >&2; exit 71; }
          read -r win x y w h <<<"$restarted"
          echo "UI_SETTINGS_V5_RESTART_WINDOW_SIZE=${w}x${h}"
          sleep .5
          snapshot_state "$restarted_state"
          python3 "$root/statecheck.py" persisted "$baseline_state" "$toggled_state" "$restarted_state" "$causal_paths" || {
            echo 'UI_SETTINGS_V5_SEMANTIC_NEGATIVE=NO_CAUSAL_FILE_HASH_PERSISTED_ACROSS_RESTART'
            exit 72
          }
          echo 'UI_SETTINGS_V5_RESTART_PERSISTENCE=PASS'

          toggle_fullscreen_locked "$win"
          echo 'UI_SETTINGS_V5_INPUT_2_ALT_RETURN_INVERSE_SENT=PASS'

          restored_live=false
          for _ in $(seq 1 24); do
            sleep .25
            snapshot_state "$rollback_state"
            if python3 "$root/statecheck.py" restored "$baseline_state" "$rollback_state" "$causal_paths" >/dev/null 2>&1; then
              restored_live=true
              echo 'UI_SETTINGS_V5_ROLLBACK_IMMEDIATE=PASS'
              break
            fi
          done

          stop_client
          snapshot_state "$rollback_state"
          python3 "$root/statecheck.py" restored "$baseline_state" "$rollback_state" "$causal_paths" || {
            echo 'UI_SETTINGS_V5_REFUSED=ROLLBACK_FILE_STATE_NOT_RESTORED_AFTER_STOP' >&2
            exit 73
          }
          echo "UI_SETTINGS_V5_ROLLBACK_POST_STOP=PASS;IMMEDIATE=$restored_live"

          start_client
          final="$(wait_large_window)" || { echo 'UI_SETTINGS_V5_REFUSED=FINAL_RESTART_WINDOW_MISSING' >&2; exit 74; }
          read -r win x y w h <<<"$final"
          echo "UI_SETTINGS_V5_FINAL_RESTART_WINDOW_SIZE=${w}x${h}"
          sleep .5
          snapshot_state "$final_state"
          python3 "$root/statecheck.py" restored "$baseline_state" "$final_state" "$causal_paths" || {
            echo 'UI_SETTINGS_V5_REFUSED=FINAL_RESTART_FILE_STATE_NOT_BASELINE' >&2
            exit 75
          }
          echo 'UI_SETTINGS_V5_FINAL_RESTART_RESTORE=PASS'
          echo 'UI_SETTINGS_V5_PERSISTENCE_E2E=PASS'
          echo 'UI_SETTINGS_V5_RUNTIME_RESULT=PASS_SAFE_READ_WRITE_READBACK_RESTART_ROLLBACK'
          TAIL

          python3 - "$source" "$script" "$tail_script" <<'PY'
          import pathlib, sys
          src = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          anchor = '      - name: Execute repaired task-owned reversible settings experiment'
          try:
              start = src.index(anchor)
          except ValueError:
              raise SystemExit('pinned v2 physical step anchor missing')
          run_index = next((i + 1 for i in range(start + 1, len(src)) if src[i] == '        run: |'), None)
          if run_index is None:
              raise SystemExit('pinned v2 run block missing')
          body = []
          for line in src[run_index:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  break
          if not body or body[0] != 'set +x':
              raise SystemExit('unexpected pinned v2 body')
          needle = 'python3 "$root/snapshot-settings.py" "$home" "$package" "$root/settings-before.json"'
          try:
              cut = body.index(needle)
          except ValueError:
              raise SystemExit('pinned v2 experiment tail anchor missing')
          custom = pathlib.Path(sys.argv[3]).read_text(encoding='utf-8').splitlines()
          pathlib.Path(sys.argv[2]).write_text('\n'.join(body[:cut] + custom) + '\n', encoding='utf-8')
          PY
          chmod 700 "$script"
          echo "UI_SETTINGS_V5_PINNED_V2_SOURCE=$pinned"
          echo 'UI_SETTINGS_V5_EXECUTING_BOUNDED_PERSISTENCE_OBSERVER=true'
          bash "$script"

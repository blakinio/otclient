name: Track A UI settings persistence discriminator v5 retired

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-ui-settings-persistence-v5.yml

permissions:
  contents: read

concurrency:
  group: track-a-ui-settings-persistence-544-v5-retired
  cancel-in-progress: true

jobs:
  retired:
    name: Retired v5 cache-contaminated observer
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record supersession
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'UI_SETTINGS_PERSISTENCE_V5=RETIRED_AFTER_RUN_32221521375'
          echo 'UI_SETTINGS_PERSISTENCE_V5_FALSE_POSITIVES=PACKAGE_CACHE_ONLY'
          echo 'UI_SETTINGS_PERSISTENCE_V5_SUPERSEDED_BY=v6-cache-excluded-observer'

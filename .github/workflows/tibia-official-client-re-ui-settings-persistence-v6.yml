name: Track A UI settings persistence discriminator v6

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-ui-settings-persistence-v6.yml

permissions:
  contents: read

concurrency:
  group: track-a-ui-settings-persistence-544-v6
  cancel-in-progress: true

jobs:
  admission:
    name: Admit cache-excluded current-main UI settings proof v6
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head with history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Revalidate current main and task admission
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          task=docs/agents/tasks/active/OTC-20260819-track-a-ui-settings-static-model.md
          task_main="$(sed -n 's/^base_main: //p' "$task" | head -n1)"
          [[ -n "$task_main" && "$live_main" == "$task_main" ]] || {
            echo "UI_SETTINGS_V6_REFUSED=MAIN_MOVED:task=$task_main:live=$live_main" >&2
            exit 40
          }
          grep -Fxq 'runtime_access: ephemeral_isolated' "$task"
          grep -Fxq 'runtime_owner_task: OTC-20260819-track-a-ui-settings-static-model' "$task"
          grep -Fxq 'runtime_namespace: ui-settings-persistence-ephemeral' "$task"
          grep -Fxq 'target_uniqueness: PROVEN' "$task"
          grep -Fxq 'mutation_authorized: true' "$task"
          grep -Fxq 'execution_class: synology_physical_runtime' "$task"
          grep -Fxq 'physical_e2e_required: true' "$task"
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$live_main" \
            --expected-branch "${GITHUB_HEAD_REF}"
          echo "UI_SETTINGS_V6_LIVE_MAIN=$live_main"
          echo 'UI_SETTINGS_V6_ADMISSION=PASS'

  persistence:
    name: Prove cache-excluded settings persistence and rollback v6
    needs: admission
    runs-on: [otclient, synology]
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Execute pinned v5 observer with cache exclusion
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == synology-otclient-01 ]] || {
            echo "UI_SETTINGS_V6_REFUSED=WRONG_RUNNER:${RUNNER_NAME:-UNKNOWN}" >&2
            exit 41
          }
          pinned='b5ba8004a3ce0aec97f5d7beb3aa6d2dd727aca7'
          source="$RUNNER_TEMP/ui-settings-v5-pinned.yml"
          script="$RUNNER_TEMP/ui-settings-v6-body.sh"
          curl -fsSL --retry 3 --connect-timeout 10 \
            "https://raw.githubusercontent.com/blakinio/otclient/$pinned/.github/workflows/tibia-official-client-re-ui-settings-persistence-v5.yml" \
            -o "$source"
          grep -Fq 'name: Track A UI settings persistence discriminator v5' "$source"
          python3 - "$source" "$script" <<'PY'
          import pathlib, sys
          src = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          anchor = '      - name: Execute pinned client harness with bounded persistence observer'
          try:
              start = src.index(anchor)
          except ValueError:
              raise SystemExit('pinned v5 physical step anchor missing')
          run_index = next((i + 1 for i in range(start + 1, len(src)) if src[i] == '        run: |'), None)
          if run_index is None:
              raise SystemExit('pinned v5 run block missing')
          body = []
          for line in src[run_index:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  break
          text = '\n'.join(body) + '\n'
          needle = "                  rel = resolved.relative_to(home).as_posix()\n                  data = resolved.read_bytes()"
          replacement = "                  rel = resolved.relative_to(home).as_posix()\n                  if '/cache/' in '/' + rel:\n                      return\n                  data = resolved.read_bytes()"
          if text.count(needle) != 1:
              raise SystemExit(f'unexpected cache-filter patch count: {text.count(needle)}')
          text = text.replace(needle, replacement)
          pathlib.Path(sys.argv[2]).write_text(text, encoding='utf-8')
          PY
          chmod 700 "$script"
          echo "UI_SETTINGS_V6_PINNED_V5_SOURCE=$pinned"
          echo 'UI_SETTINGS_V6_CACHE_EXCLUSION=PASS'
          bash "$script"

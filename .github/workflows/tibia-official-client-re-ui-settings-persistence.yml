name: Track A UI settings persistence discriminator v1 retired

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-ui-settings-persistence.yml

permissions:
  contents: read

concurrency:
  group: track-a-ui-settings-persistence-544
  cancel-in-progress: true

jobs:
  retired:
    name: Retired v1 discriminator
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record supersession
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'UI_SETTINGS_PERSISTENCE_V1=RETIRED_AFTER_RUN_32219692697'
          echo 'UI_SETTINGS_PERSISTENCE_V1_SUPERSEDED_BY=.github/workflows/tibia-official-client-re-ui-settings-persistence-v2.yml'

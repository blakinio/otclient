name: Track A update failure log diagnostic

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-update-log-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
    steps:
      - name: Read only update/version-related diagnostics from owned client log
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          log="$state/runtime/client.log"
          [[ -f "$log" ]]
          echo TRACK_A_UPDATE_LOG_DIAG_BEGIN=true
          grep -Ei 'update|version|launcher|package|manifest|static\.tibia|too old|reinstall|download|patch' "$log" \
            | tail -n 120 \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[REDACTED_EMAIL]/g' \
            | sed 's/^/TRACK_A_UPDATE_LOG=/' || true
          echo TRACK_A_UPDATE_LOG_DIAG_COMPLETE=true

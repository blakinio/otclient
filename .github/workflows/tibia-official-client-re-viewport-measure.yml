name: Track A viewport measurement

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-viewport-measure.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  measure:
    runs-on: [otclient, synology]
    timeout-minutes: 4
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_DISPLAY: ':98'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Measure one-tile render displacement
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          toolroot="$state/toolroot"
          export HOME="$state/home" DISPLAY="$TRACK_DISPLAY" PATH="$toolroot/usr/bin:$toolroot/usr/sbin:/usr/bin:/bin" LD_LIBRARY_PATH="$toolroot/usr/lib/x86_64-linux-gnu:$toolroot/lib/x86_64-linux-gnu"
          pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          [[ -n "$pid" && -r "/proc/$pid/environ" ]]
          grep -azFxq "$marker" "/proc/$pid/environ"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          window=''
          for w in $("$toolroot/usr/bin/xdotool" search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do
            g="$("$toolroot/usr/bin/xdotool" getwindowgeometry --shell "$w" 2>/dev/null || true)"
            [[ "$(printf '%s\n' "$g" | sed -n 's/^WIDTH=//p')" == 1020 ]] || continue
            [[ "$(printf '%s\n' "$g" | sed -n 's/^HEIGHT=//p')" == 650 ]] || continue
            window="$w"; break
          done
          [[ -n "$window" ]]
          echo TRACK_A_VIEWPORT_WINDOW=1020x650
          evidence="$state/evidence/viewport-measure-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$evidence"; chmod 700 "$evidence"
          cleanup(){ rm -f "$evidence"/*.xwd 2>/dev/null || true; kill -CONT "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          "$toolroot/usr/bin/xdotool" windowactivate --sync "$window" 2>/dev/null || true
          "$toolroot/usr/bin/xdotool" windowfocus --sync "$window"
          base="$evidence/base.xwd"
          "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$base"
          for dir in Right Left Up Down; do
            before="$evidence/${dir}-before.xwd"; after="$evidence/${dir}-after.xwd"
            "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$before"
            "$toolroot/usr/bin/xdotool" key "$dir"
            sleep 1.2
            "$toolroot/usr/bin/xwd" -silent -id "$window" -out "$after"
            python3 "$GITHUB_WORKSPACE/.github/scripts/tibia-official-client-re-xwd-regions.py" "MOVE_${dir}" "$before" "$after"
            case "$dir" in Right) back=Left;; Left) back=Right;; Up) back=Down;; Down) back=Up;; esac
            "$toolroot/usr/bin/xdotool" key "$back" || true
            sleep 1.2
          done
          kill -0 "$pid"
          grep -azFxq "$marker" "/proc/$pid/environ"
          echo TRACK_A_VIEWPORT_MEASUREMENT_COMPLETE=true
          cleanup; trap - EXIT

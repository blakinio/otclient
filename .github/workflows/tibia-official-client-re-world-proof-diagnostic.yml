name: Track A structural world proof diagnostic

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-client-re-world-proof-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-client-re-runtime
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Inspect latest Track A structural proof diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          pid="$(tr -cd '0-9' <"$state/runtime/client.pid" 2>/dev/null || true)"
          [[ -n "$pid" && -r "/proc/$pid/environ" ]]
          grep -azFxq "$marker" "/proc/$pid/environ"
          [[ "$(readlink -f "/proc/$pid/exe")" == "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          echo TRACK_A_SESSION_STILL_ALIVE=true
          latest="$(find "$state/evidence" -maxdepth 1 -type d -name 'current-world-proof-*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          [[ -n "$latest" ]]
          echo TRACK_A_WORLD_PROOF_RECORD_LINES="$(wc -l <"$latest/map-records.txt" 2>/dev/null || echo 0)"
          if [[ -f "$latest/map-hit.txt" ]]; then echo TRACK_A_WORLD_PROOF_HIT_FILE=true; else echo TRACK_A_WORLD_PROOF_HIT_FILE=false; fi
          echo TRACK_A_GDB_LOG_BEGIN
          sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[REDACTED_EMAIL]/g' "$latest/gdb.log" 2>/dev/null | tail -n 60 || true
          echo TRACK_A_GDB_LOG_END

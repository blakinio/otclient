name: Track A worldmap downstream targeted static evidence

on:
  push:
    branches:
      - research/OTC-20260817-track-a-worldmap-downstream-exact-static-evidence
    paths:
      - .github/scripts/tibia-official-client-re-worldmap-downstream-targeted-static.py
      - .github/workflows/tibia-official-client-re-worldmap-downstream-targeted-static.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-downstream-targeted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Source sanitize targeted worldmap discriminator
    runs-on: [otclient, synology]
    timeout-minutes: 15
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-worldmap-downstream-exact-static-evidence
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_VERSION: 15.32.df7b29
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
      PRIOR_PRODUCER_HEAD: ce8b1f59d02bfc7ecc498dd80f73b09cf2970510
    steps:
      - name: Checkout targeted producer branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Checkout pinned prior exact-static producer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.PRIOR_PRODUCER_HEAD }}
          path: prior-producer
          persist-credentials: false

      - name: Verify exact source and execution boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || { echo WORLD_MAP_TARGETED_REFUSED=REPOSITORY_BOUNDARY; exit 61; }
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || { echo WORLD_MAP_TARGETED_REFUSED=REF_BOUNDARY; exit 62; }
          [[ "$RUNNER_OS" == Linux ]] || { echo WORLD_MAP_TARGETED_REFUSED=OS_BOUNDARY; exit 63; }
          [[ "$RUNNER_ARCH" == X64 ]] || { echo WORLD_MAP_TARGETED_REFUSED=ARCH_BOUNDARY; exit 64; }
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]] || { echo WORLD_MAP_TARGETED_REFUSED=RUNNER_BOUNDARY; exit 65; }
          command -v python3 >/dev/null 2>&1 || { echo WORLD_MAP_TARGETED_REFUSED=PYTHON3_MISSING; exit 66; }
          python3 -m py_compile \
            .github/scripts/tibia-official-client-re-worldmap-downstream-targeted-static.py \
            prior-producer/.github/scripts/tibia-official-client-re-worldmap-exact-static-evidence.py \
            prior-producer/.github/scripts/tibia-official-client-re-worldmap-exact-static-evidence-v2.py

          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          source_index=''
          for index in 0 1; do
            candidate="${candidates[$index]}"
            [[ -f "$candidate" && ! -L "$candidate" ]] || continue
            [[ "$(stat -c %s "$candidate" 2>/dev/null || echo STAT_FAILED)" == "$EXPECTED_CLIENT_SIZE" ]] || continue
            if python3 - "$candidate" "$EXPECTED_CLIENT_SHA256" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          expected = sys.argv[2]
          digest = hashlib.sha256()
          with path.open('rb') as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                  digest.update(chunk)
          raise SystemExit(0 if digest.hexdigest() == expected else 1)
          PY
            then
              source_client="$candidate"
              source_index="$index"
              break
            fi
          done
          [[ -n "$source_client" ]] || { echo WORLD_MAP_TARGETED_REFUSED=EXACT_SOURCE_MISSING; exit 50; }
          {
            echo "SOURCE_CLIENT=$source_client"
            echo "SOURCE_CANDIDATE_INDEX=$source_index"
          } >> "$GITHUB_ENV"
          echo WORLD_MAP_TARGETED_SOURCE_BOUNDARY=PASS
          echo "WORLD_MAP_TARGETED_SOURCE_CANDIDATE_INDEX=$source_index"
          echo WORLD_MAP_TARGETED_RUNTIME_ACCESS=none
          echo WORLD_MAP_TARGETED_CLIENT_EXECUTED=false
          echo WORLD_MAP_TARGETED_PROCESS_MEMORY_ACCESSED=false
          echo WORLD_MAP_TARGETED_CANONICAL_STATE_ACCESSED=false
          echo WORLD_MAP_TARGETED_CLIENT_BYTES_MUTATED=false

      - name: Produce targeted bounded source evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf artifacts/source
          mkdir -p artifacts/source
          python3 .github/scripts/tibia-official-client-re-worldmap-downstream-targeted-static.py \
            source \
            --client "$SOURCE_CLIENT" \
            --candidate-index "$SOURCE_CANDIDATE_INDEX" \
            --prior-v2 prior-producer/.github/scripts/tibia-official-client-re-worldmap-exact-static-evidence-v2.py \
            --outdir artifacts/source
          grep -Fxq "WORLD_MAP_TARGETED_CLIENT_VERSION=$EXPECTED_CLIENT_VERSION" artifacts/source/source-fence.txt
          grep -Fxq "WORLD_MAP_TARGETED_CLIENT_SIZE=$EXPECTED_CLIENT_SIZE" artifacts/source/source-fence.txt
          grep -Fxq "WORLD_MAP_TARGETED_CLIENT_SHA256=$EXPECTED_CLIENT_SHA256" artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_TARGETED_RUNTIME_ACCESS=none' artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_TARGETED_CLIENT_EXECUTED=false' artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_TARGETED_PROCESS_MEMORY_ACCESSED=false' artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_TARGETED_CANONICAL_STATE_ACCESSED=false' artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_TARGETED_RAW_CLIENT_UPLOADED=false' artifacts/source/source-fence.txt

      - name: Enforce targeted source artifact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('artifacts/source')
          allowed = {'targeted-source.json', 'targeted-source.md', 'source-fence.txt'}
          actual = {p.name for p in root.iterdir() if p.is_file()}
          if actual != allowed:
              raise SystemExit(f'unsafe targeted source file set: {sorted(actual)}')
          for path in sorted(root.iterdir()):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if len(data) > 4 * 1024 * 1024:
                  raise SystemExit(f'oversized targeted source output: {path}:{len(data)}')
              if data.startswith(b'\x7fELF') or data[:2] == b'MZ':
                  raise SystemExit(f'raw executable payload refused: {path}')
              data.decode('utf-8')
          print('WORLD_MAP_TARGETED_SOURCE_SANITIZED_BOUNDARY=PASS')
          PY

      - name: Upload targeted sanitized source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-worldmap-downstream-targeted-source-${{ github.run_id }}
          path: artifacts/source/**
          if-no-files-found: error
          retention-days: 7

  hosted-validate:
    name: Validate targeted worldmap discriminator on GitHub-hosted runner
    needs: source-sanitize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260817-track-a-worldmap-downstream-exact-static-evidence
      EXPECTED_CLIENT_VERSION: 15.32.df7b29
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Checkout targeted producer branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Verify hosted targeted boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]]
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$RUNNER_ARCH" == X64 ]]
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          command -v objdump >/dev/null
          python3 -m py_compile .github/scripts/tibia-official-client-re-worldmap-downstream-targeted-static.py
          echo WORLD_MAP_TARGETED_EXECUTION_CLASS=github_hosted
          echo WORLD_MAP_TARGETED_RUNTIME_ACCESS=none
          echo WORLD_MAP_TARGETED_RAW_CLIENT_PRESENT=false

      - name: Download targeted sanitized source evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: track-a-worldmap-downstream-targeted-source-${{ github.run_id }}
          path: artifacts/source

      - name: Disassemble targeted bounded windows
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf artifacts/final
          mkdir -p artifacts/final
          python3 .github/scripts/tibia-official-client-re-worldmap-downstream-targeted-static.py \
            hosted \
            --bundle-dir artifacts/source \
            --outdir artifacts/final
          grep -Fxq 'WORLD_MAP_TARGETED_HOSTED_VALIDATION=PASS' artifacts/final/hosted-validation.txt
          grep -Fxq "WORLD_MAP_TARGETED_CLIENT_VERSION=$EXPECTED_CLIENT_VERSION" artifacts/final/hosted-validation.txt
          grep -Fxq "WORLD_MAP_TARGETED_CLIENT_SIZE=$EXPECTED_CLIENT_SIZE" artifacts/final/hosted-validation.txt
          grep -Fxq "WORLD_MAP_TARGETED_CLIENT_SHA256=$EXPECTED_CLIENT_SHA256" artifacts/final/hosted-validation.txt

      - name: Enforce targeted final artifact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('artifacts/final')
          allowed = {'worldmap-downstream-targeted-evidence.json', 'worldmap-downstream-targeted-evidence.md', 'hosted-validation.txt'}
          actual = {p.name for p in root.iterdir() if p.is_file()}
          if actual != allowed:
              raise SystemExit(f'unsafe targeted final file set: {sorted(actual)}')
          for path in sorted(root.iterdir()):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if len(data) > 4 * 1024 * 1024:
                  raise SystemExit(f'oversized targeted final output: {path}:{len(data)}')
              if data.startswith(b'\x7fELF') or data[:2] == b'MZ':
                  raise SystemExit(f'raw executable payload refused: {path}')
              data.decode('utf-8')
          print('WORLD_MAP_TARGETED_FINAL_SANITIZED_BOUNDARY=PASS')
          PY

      - name: Upload targeted consumer-facing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-worldmap-downstream-targeted-final-${{ github.run_id }}
          path: artifacts/final/**
          if-no-files-found: error
          retention-days: 30

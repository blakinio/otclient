name: Track A worldmap exact static evidence

on:
  push:
    branches:
      - research/OTC-20260816-track-a-worldmap-exact-static-evidence
    paths:
      - .github/workflows/tibia-official-client-re-worldmap-exact-static-evidence.yml
      - .github/scripts/tibia-official-client-re-worldmap-exact-static-evidence.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-exact-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sanitize:
    name: Source sanitize exact worldmap evidence
    runs-on: [otclient, synology]
    timeout-minutes: 15
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260816-track-a-worldmap-exact-static-evidence
      EXPECTED_RUNNER_NAME: synology-otclient-01
      EXPECTED_CLIENT_VERSION: 15.32.df7b29
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Checkout producer branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Verify source boundary and select exact client
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]]
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$RUNNER_ARCH" == X64 ]]
          [[ "$RUNNER_NAME" == "$EXPECTED_RUNNER_NAME" ]]
          command -v python3 >/dev/null
          command -v objdump >/dev/null
          command -v sha256sum >/dev/null
          python3 -m py_compile .github/scripts/tibia-official-client-re-worldmap-exact-static-evidence.py

          candidates=(
            '/home/runner/_work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
            '/work/_otclient_tibia_re_state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          )
          source_client=''
          source_index=''
          for index in 0 1; do
            candidate="${candidates[$index]}"
            if [[ -f "$candidate" && ! -L "$candidate" \
              && "$(stat -c %s "$candidate" 2>/dev/null || true)" == "$EXPECTED_CLIENT_SIZE" \
              && "$(sha256sum "$candidate" 2>/dev/null | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]; then
              source_client="$candidate"
              source_index="$index"
              break
            fi
          done
          [[ -n "$source_client" ]] || { echo 'WORLD_MAP_STATIC_REFUSED=EXACT_SOURCE_MISSING'; exit 50; }
          {
            echo "SOURCE_CLIENT=$source_client"
            echo "SOURCE_CANDIDATE_INDEX=$source_index"
          } >> "$GITHUB_ENV"

          echo WORLD_MAP_STATIC_SOURCE_BOUNDARY=PASS
          echo "WORLD_MAP_STATIC_SOURCE_CANDIDATE_INDEX=$source_index"
          echo "WORLD_MAP_STATIC_CLIENT_VERSION=$EXPECTED_CLIENT_VERSION"
          echo "WORLD_MAP_STATIC_CLIENT_SIZE=$EXPECTED_CLIENT_SIZE"
          echo "WORLD_MAP_STATIC_CLIENT_SHA256=$EXPECTED_CLIENT_SHA256"
          echo WORLD_MAP_STATIC_RUNTIME_ACCESS=none
          echo WORLD_MAP_STATIC_CANONICAL_STATE_ACCESS=false
          echo WORLD_MAP_STATIC_CLIENT_PROCESS_ACCESS=false
          echo WORLD_MAP_STATIC_PROCESS_MEMORY_ACCESS=false
          echo WORLD_MAP_STATIC_X11_VNC_ACCESS=false
          echo WORLD_MAP_STATIC_LOGIN_SESSION_ACCESS=false
          echo WORLD_MAP_STATIC_NETWORK_ACCESS=false
          echo WORLD_MAP_STATIC_GAMEPLAY_ACCESS=false
          echo WORLD_MAP_STATIC_CLIENT_BYTE_MUTATION=false

      - name: Produce bounded sanitized static evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf artifacts/source
          mkdir -p artifacts/source
          python3 .github/scripts/tibia-official-client-re-worldmap-exact-static-evidence.py \
            source \
            --client "$SOURCE_CLIENT" \
            --candidate-index "$SOURCE_CANDIDATE_INDEX" \
            --outdir artifacts/source

          grep -Fxq "WORLD_MAP_STATIC_CLIENT_VERSION=$EXPECTED_CLIENT_VERSION" artifacts/source/source-fence.txt
          grep -Fxq "WORLD_MAP_STATIC_CLIENT_SIZE=$EXPECTED_CLIENT_SIZE" artifacts/source/source-fence.txt
          grep -Fxq "WORLD_MAP_STATIC_CLIENT_SHA256=$EXPECTED_CLIENT_SHA256" artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_STATIC_RUNTIME_ACCESS=none' artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_STATIC_CLIENT_EXECUTED=false' artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_STATIC_CLIENT_BYTES_MUTATED=false' artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_STATIC_PROCESS_MEMORY_ACCESSED=false' artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_STATIC_CANONICAL_RUNTIME_ACCESSED=false' artifacts/source/source-fence.txt
          grep -Fxq 'WORLD_MAP_STATIC_RAW_CLIENT_UPLOADED=false' artifacts/source/source-fence.txt

      - name: Enforce sanitized source artifact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('artifacts/source')
          allowed = {
              'worldmap-static-evidence.json',
              'worldmap-static-evidence.md',
              'source-fence.txt',
          }
          actual = {p.name for p in root.iterdir() if p.is_file()}
          if actual != allowed:
              raise SystemExit(f'unsafe source artifact file set: {sorted(actual)}')
          for path in sorted(root.iterdir()):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if len(data) > 2 * 1024 * 1024:
                  raise SystemExit(f'oversized sanitized output: {path}:{len(data)}')
              if data.startswith(b'\x7fELF') or data[:2] == b'MZ':
                  raise SystemExit(f'raw executable payload refused: {path}')
              data.decode('utf-8')
          print('WORLD_MAP_STATIC_SOURCE_SANITIZED_BOUNDARY=PASS')
          PY

      - name: Upload sanitized source evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-worldmap-exact-static-source-${{ github.run_id }}
          path: artifacts/source/**
          if-no-files-found: error
          retention-days: 7

  hosted-validate:
    name: Validate worldmap evidence on GitHub-hosted runner
    needs: source-sanitize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: blakinio/otclient
      EXPECTED_BRANCH: research/OTC-20260816-track-a-worldmap-exact-static-evidence
      EXPECTED_CLIENT_VERSION: 15.32.df7b29
      EXPECTED_CLIENT_SIZE: '51965216'
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Checkout producer branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Verify GitHub-hosted boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]]
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$RUNNER_ARCH" == X64 ]]
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          python3 -m py_compile .github/scripts/tibia-official-client-re-worldmap-exact-static-evidence.py
          echo WORLD_MAP_STATIC_EXECUTION_CLASS=github_hosted
          echo WORLD_MAP_STATIC_RUNTIME_ACCESS=none
          echo WORLD_MAP_STATIC_PHYSICAL_E2E=false

      - name: Download sanitized source evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: track-a-worldmap-exact-static-source-${{ github.run_id }}
          path: artifacts/source

      - name: Validate exact-fence sanitized evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf artifacts/hosted-validation artifacts/final
          mkdir -p artifacts/hosted-validation artifacts/final
          python3 .github/scripts/tibia-official-client-re-worldmap-exact-static-evidence.py \
            validate \
            --bundle-dir artifacts/source \
            --outdir artifacts/hosted-validation

          grep -Fxq 'WORLD_MAP_STATIC_HOSTED_VALIDATION=PASS' artifacts/hosted-validation/hosted-validation.txt
          cp artifacts/source/worldmap-static-evidence.json artifacts/final/
          cp artifacts/source/worldmap-static-evidence.md artifacts/final/
          cp artifacts/source/source-fence.txt artifacts/final/
          cp artifacts/hosted-validation/hosted-validation.json artifacts/final/
          cp artifacts/hosted-validation/hosted-validation.txt artifacts/final/

      - name: Enforce final consumer artifact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('artifacts/final')
          allowed = {
              'worldmap-static-evidence.json',
              'worldmap-static-evidence.md',
              'source-fence.txt',
              'hosted-validation.json',
              'hosted-validation.txt',
          }
          actual = {p.name for p in root.iterdir() if p.is_file()}
          if actual != allowed:
              raise SystemExit(f'unsafe final artifact file set: {sorted(actual)}')
          for path in sorted(root.iterdir()):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if len(data) > 2 * 1024 * 1024:
                  raise SystemExit(f'oversized final output: {path}:{len(data)}')
              if data.startswith(b'\x7fELF') or data[:2] == b'MZ':
                  raise SystemExit(f'raw executable payload refused: {path}')
              data.decode('utf-8')
          print('WORLD_MAP_STATIC_FINAL_SANITIZED_BOUNDARY=PASS')
          PY

      - name: Upload consumer-facing sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-worldmap-exact-static-final-${{ github.run_id }}
          path: artifacts/final/**
          if-no-files-found: error
          retention-days: 30

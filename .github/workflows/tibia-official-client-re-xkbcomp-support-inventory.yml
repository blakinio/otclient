name: Track A xkbcomp support inventory

on:
  pull_request:
    branches: [main]
    paths:
      - docs/agents/tasks/active/OTC-20260816-track-a-xkbcomp-support-inventory.md
      - .github/workflows/tibia-official-client-re-xkbcomp-support-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-xkbcomp-support-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Inventory fixed xkbcomp helper paths only
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == 'synology-otclient-01' ]]
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]

          path_fact() {
            local label="$1" path="$2" kind='ABSENT' real='ABSENT' mode='NA' uid='NA' executable=false sha='NA' owner='UNOWNED'
            if [[ -e "$path" || -L "$path" ]]; then
              if [[ -L "$path" ]]; then kind='SYMLINK'
              elif [[ -f "$path" ]]; then kind='FILE'
              elif [[ -d "$path" ]]; then kind='DIR'
              else kind='OTHER'; fi
              real="$(realpath -e -- "$path" 2>/dev/null || echo UNRESOLVED)"
              mode="$(stat -c %a "$path" 2>/dev/null || echo NA)"
              uid="$(stat -c %u "$path" 2>/dev/null || echo NA)"
              [[ -x "$path" ]] && executable=true
              if [[ -f "$path" ]]; then sha="$(sha256sum "$path" | awk '{print $1}')"; fi
              owner="$(dpkg-query -S "$path" 2>/dev/null | head -n1 || echo UNOWNED)"
            fi
            printf 'XKBCOMP_PATH label=%s path=%s kind=%s real=%s mode=%s uid=%s executable=%s sha256=%s owner=%s\n' \
              "$label" "$path" "$kind" "$real" "$mode" "$uid" "$executable" "$sha" "$owner"
          }

          echo 'XKBCOMP_SUPPORT_INVENTORY_BEGIN'
          path_fact CONTAINED '/work/_otclient_tibia_re_state/toolroot/usr/bin/xkbcomp'
          path_fact SYSTEM '/usr/bin/xkbcomp'
          for pkg in x11-xkb-utils xkbcomp; do
            status="$(dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null || echo NOT_INSTALLED)"
            version="$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || echo NA)"
            printf 'XKBCOMP_PACKAGE package=%s status=%s version=%s\n' "$pkg" "$status" "$version"
          done
          echo 'XKBCOMP_SUPPORT_INVENTORY_END'

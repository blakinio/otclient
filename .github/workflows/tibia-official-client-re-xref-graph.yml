name: Track A protocol metadata xref graph
on:
  push:
    branches:
      - ci/OTC-20260813-official-client-re-continuation
    paths:
      - .github/workflows/tibia-official-client-re-xref-graph.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      EXPECTED_CLIENT_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
    steps:
      - name: Build exact-binary string and metadata xref graph
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          client="$state/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          [[ -x "$client" ]]
          [[ "$(sha256sum "$client" | awk '{print $1}')" == "$EXPECTED_CLIENT_SHA256" ]]
          python3 - "$client" <<'PY'
          import struct,sys
          data=open(sys.argv[1],'rb').read()
          assert data[:4]==b'\x7fELF' and data[4]==2 and data[5]==1
          phoff=struct.unpack_from('<Q',data,0x20)[0]
          phentsz=struct.unpack_from('<H',data,0x36)[0]
          phnum=struct.unpack_from('<H',data,0x38)[0]
          loads=[]
          for i in range(phnum):
              o=phoff+i*phentsz
              typ,flags,off,va,paddr,filesz,memsz,align=struct.unpack_from('<IIQQQQQQ',data,o)
              if typ==1: loads.append((off,off+filesz,va,va+filesz,flags))
          def off2va(o):
              for lo,hi,va,vhi,fl in loads:
                  if lo<=o<hi:return va+(o-lo)
          def va2off(v):
              for lo,hi,va,vhi,fl in loads:
                  if va<=v<vhi:return lo+(v-va)
          def flags_for_va(v):
              for lo,hi,va,vhi,fl in loads:
                  if va<=v<vhi:return fl
              return 0
          exec_ranges=[(lo,hi,va,fl) for lo,hi,va,vhi,fl in loads if fl&1]
          targets=[
            'TChatProtocolMessageHandler','handleTalkMessage','TContainerProtocolMessageHandler','handleContainerMessage',
            'TCreatureProtocolMessageHandler','handleMoveCreatureMessage','TPlayerProtocolMessageHandler','handlePlayerDataBasicMessage',
            'TEffectProtocolMessageHandler','handleGraphicalEffectsMessage','TMarketProtocolMessageHandler','handleMarketEnterMessage',
            'TNPCTradeProtocolMessageHandler','handleNPCOfferMessage','TPlayerTradeProtocolMessageHandler','handleOwnOfferMessage',
            'TQuestLogProtocolMessageHandler','handleQuestLogMessage','TGameEventProtocolMessageHandler','handleGameEventMessage',
            'GameclientMessageMoveObject','GameclientMessageAttack','GameclientMessageFollow','GameclientMessageTalk',
            'GameclientMessageTradeObject','GameclientMessageGoPath'
          ]
          def occurrences(s):
              b=s.encode(); out=[]; p=0
              while True:
                  q=data.find(b,p)
                  if q<0:return out
                  out.append(q);p=q+1
          def qword_refs(va):
              pat=struct.pack('<Q',va); out=[];p=0
              while True:
                  q=data.find(pat,p)
                  if q<0:return out
                  out.append(q);p=q+1
          def riprefs(target_va):
              out=[]
              # x86-64 common RIP-relative forms: 48 8d/8b 05/0d/15/1d/25/2d/35/3d disp32 and 4c variants.
              for lo,hi,segva,fl in exec_ranges:
                  chunk=data[lo:hi]
                  for i in range(0,max(0,len(chunk)-7)):
                      b0=chunk[i]; b1=chunk[i+1]; b2=chunk[i+2]
                      if b0 not in (0x48,0x4c): continue
                      if b1 not in (0x8d,0x8b): continue
                      if (b2 & 0xc7) != 0x05: continue
                      disp=struct.unpack_from('<i',chunk,i+3)[0]
                      insn_va=segva+i
                      dst=(insn_va+7+disp)&0xffffffffffffffff
                      if dst==target_va: out.append(insn_va)
              return out
          print('TRACK_A_XREF_GRAPH_BEGIN=true')
          for s in targets:
              occ=occurrences(s)
              print(f'TARGET name={s} occurrences={len(occ)}')
              for idx,o in enumerate(occ[:8]):
                  va=off2va(o)
                  if va is None: continue
                  qrefs=qword_refs(va)
                  print(f' STRING idx={idx} off=0x{o:x} va=0x{va:x} qword_refs={len(qrefs)}')
                  for r in qrefs[:24]:
                      rva=off2va(r)
                      if rva is None: continue
                      rr=riprefs(rva)
                      print(f'  PTR off=0x{r:x} va=0x{rva:x} segflags={flags_for_va(rva)} riprefs={",".join(hex(x) for x in rr[:24]) or "none"}')
                      # second-level absolute pointer references to this metadata slot
                      q2=qword_refs(rva)
                      if q2:
                          print('   PTR2 refs='+','.join(hex(off2va(x)) for x in q2[:24] if off2va(x) is not None))
                  direct=riprefs(va)
                  if direct: print('  DIRECT_RIPREFS='+','.join(hex(x) for x in direct[:32]))
          print('TRACK_A_XREF_GRAPH_END=true')
          print('TRACK_A_XREF_GRAPH_COMPLETE=true')
          PY

name: Track A raw XRes exact-client PID identity

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-xres-raw-pid-identity.yml
      - .github/scripts/tibia-official-client-re-xres-raw-pid-identity-patch.py
      - .github/scripts/tibia-official-client-re-xres-wire.py
      - docs/agents/tasks/active/OTC-20260817-track-a-xres-raw-pid-identity.md

permissions:
  contents: read

concurrency:
  group: track-a-xres-raw-pid-identity
  cancel-in-progress: false

jobs:
  hosted-preflight:
    name: Hosted raw XRes PID preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Rebuild immutable post-RHI script and inject promoted raw XRes transport
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object .github/scripts/tibia-official-client-re-xres-wire.py)" == ce5992bc1171eef9f24a71dfc97da728f18627a9 ]]
          python3 -m py_compile \
            .github/scripts/tibia-official-client-re-xres-wire.py \
            .github/scripts/tibia-official-client-re-xres-raw-pid-identity-patch.py
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          harness="$tmp/harness.yml"
          t1="$tmp/tibia-official-client-re-post-rhi-window-state-transform.py"
          t2="$tmp/tibia-official-client-re-post-rhi-window-state-transform-v2.py"
          base_script="$tmp/base.sh"
          final_script="$tmp/final.sh"
          curl -fsSL --retry 3 --connect-timeout 10 -o "$harness" \
            https://raw.githubusercontent.com/blakinio/otclient/cb557da12ebb41c597340909b2db717ee59cdfe1/.github/workflows/tibia-official-client-re-window-ownership-discriminator-v2.yml
          curl -fsSL --retry 3 --connect-timeout 10 -o "$t1" \
            https://raw.githubusercontent.com/blakinio/otclient/8e9cc81011383922cf6bad75ca7207deb749fffb/.github/scripts/tibia-official-client-re-post-rhi-window-state-transform.py
          curl -fsSL --retry 3 --connect-timeout 10 -o "$t2" \
            https://raw.githubusercontent.com/blakinio/otclient/8e9cc81011383922cf6bad75ca7207deb749fffb/.github/scripts/tibia-official-client-re-post-rhi-window-state-transform-v2.py
          [[ "$(git hash-object "$harness")" == 1616edcc982be50ef2c95b8077160ec8fe9291fe ]]
          [[ "$(git hash-object "$t1")" == d663a40c446983c7359265bf834113ba49e6a5d1 ]]
          [[ "$(git hash-object "$t2")" == b9d15f8d1131339b06bfa9cb1e81940c2163a283 ]]
          python3 -m py_compile "$t1" "$t2"
          python3 "$t2" "$harness" "$base_script"
          python3 .github/scripts/tibia-official-client-re-xres-raw-pid-identity-patch.py "$base_script" "$final_script"
          bash -n "$final_script"
          python3 - "$final_script" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          required = (
              'xcb_query_extension',
              'xcb_get_file_descriptor',
              'wire.encode_query_version',
              'wire.encode_query_client_ids',
              'wire.extract_local_client_pid',
              'XRES_RAW_FINAL_CLASSIFICATION=',
              'XRES_PROVES_VIEWABLE_WINDOW_OWNED_BY_EXACT_CLIENT',
              'WINDOW_DIAG_CLEANUP=COMPLETE',
          )
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'XRES_RAW_PREFLIGHT_MISSING={missing}')
          forbidden = (
              'libxcb-res.so.0',
              'libXRes.so',
              'runtime-registration.json',
              'canonical-live-runtime',
              '/proc/*/environ',
              "glob('/proc/*')",
          )
          present = [x for x in forbidden if x in text]
          if present:
              raise SystemExit(f'XRES_RAW_PREFLIGHT_FORBIDDEN={present}')
          print('XRES_RAW_HOSTED_PREFLIGHT=PASS')
          PY

  physical-xres-pid:
    name: Physical raw XRes exact-client PID identity
    if: ${{ endsWith(github.event.pull_request.head.ref, '-physical-authorized-v1') }}
    needs: hosted-preflight
    runs-on: [otclient, synology]
    timeout-minutes: 12
    steps:
      - name: Checkout exact head with base history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Revalidate Track A runtime admission
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$BASE_SHA" --expected-branch "$HEAD_BRANCH"
          echo 'XRES_RAW_RUNTIME_ADMISSION=PASS'

      - name: Execute exactly one isolated raw XRes PID discriminator
        shell: bash
        env:
          EXPECTED_BASE_SHA: d9529da35ada6ab2a7bf4d2e70205cc0dd7b14ab
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || {
            echo "XRES_RAW_REFUSED=BASE_MOVED:$EVENT_BASE_SHA"
            exit 44
          }
          [[ "$(git hash-object .github/scripts/tibia-official-client-re-xres-wire.py)" == ce5992bc1171eef9f24a71dfc97da728f18627a9 ]]
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          harness="$tmp/harness.yml"
          t1="$tmp/tibia-official-client-re-post-rhi-window-state-transform.py"
          t2="$tmp/tibia-official-client-re-post-rhi-window-state-transform-v2.py"
          base_script="$tmp/base.sh"
          final_script="$tmp/final.sh"
          curl -fsSL --retry 3 --connect-timeout 10 -o "$harness" \
            https://raw.githubusercontent.com/blakinio/otclient/cb557da12ebb41c597340909b2db717ee59cdfe1/.github/workflows/tibia-official-client-re-window-ownership-discriminator-v2.yml
          curl -fsSL --retry 3 --connect-timeout 10 -o "$t1" \
            https://raw.githubusercontent.com/blakinio/otclient/8e9cc81011383922cf6bad75ca7207deb749fffb/.github/scripts/tibia-official-client-re-post-rhi-window-state-transform.py
          curl -fsSL --retry 3 --connect-timeout 10 -o "$t2" \
            https://raw.githubusercontent.com/blakinio/otclient/8e9cc81011383922cf6bad75ca7207deb749fffb/.github/scripts/tibia-official-client-re-post-rhi-window-state-transform-v2.py
          [[ "$(git hash-object "$harness")" == 1616edcc982be50ef2c95b8077160ec8fe9291fe ]]
          [[ "$(git hash-object "$t1")" == d663a40c446983c7359265bf834113ba49e6a5d1 ]]
          [[ "$(git hash-object "$t2")" == b9d15f8d1131339b06bfa9cb1e81940c2163a283 ]]
          python3 "$t2" "$harness" "$base_script"
          python3 .github/scripts/tibia-official-client-re-xres-raw-pid-identity-patch.py "$base_script" "$final_script"
          bash -n "$final_script"
          mkdir -p artifacts/xres-raw-pid
          set +e
          bash "$final_script" 2>&1 | tee artifacts/xres-raw-pid/run.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "XRES_RAW_GENERATED_SCRIPT_RC=$rc" | tee -a artifacts/xres-raw-pid/run.txt
          grep -Fxq 'WINDOW_DIAG_CLEANUP=COMPLETE' artifacts/xres-raw-pid/run.txt
          grep -Fxq 'XRES_RAW_WIRE_HELPER_USED=true' artifacts/xres-raw-pid/run.txt
          grep -Fxq 'XRES_RAW_FINAL_CLASSIFICATION=XRES_PROVES_VIEWABLE_WINDOW_OWNED_BY_EXACT_CLIENT' artifacts/xres-raw-pid/run.txt
          [[ "$rc" -eq 0 ]]
          echo 'XRES_RAW_PHYSICAL_DISCRIMINATOR=PASS' | tee -a artifacts/xres-raw-pid/run.txt

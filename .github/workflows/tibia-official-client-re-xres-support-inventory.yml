name: Track A XRes client support inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-xres-support-inventory.yml

permissions:
  contents: read

concurrency:
  group: track-a-xres-support-inventory
  cancel-in-progress: false

jobs:
  xres-support-inventory:
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Checkout exact head with base history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Revalidate Track A admission before support read
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$BASE_SHA" --expected-branch "$HEAD_BRANCH"
          echo 'XRES_SUPPORT_ADMISSION=PASS'

      - name: Inventory fixed XRes client support paths read-only
        shell: bash
        env:
          EXPECTED_BASE_SHA: 845adabba5f6d2bfecb6d54bc13834c47cc61c94
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || {
            echo "XRES_SUPPORT_REFUSED=BASE_MOVED:$EVENT_BASE_SHA"
            exit 44
          }
          echo 'XRES_SUPPORT_RUNTIME_ACCESS=read_only'
          echo 'XRES_SUPPORT_CANONICAL_STATE_ACCESS=NONE'
          echo 'XRES_SUPPORT_XSERVER_STARTED=false'
          echo 'XRES_SUPPORT_CLIENT_STARTED=false'
          python3 - <<'PY'
          import hashlib
          import pathlib
          import re

          roots = [
              pathlib.Path('/work/_otclient_tibia_re_state/toolroot/usr/lib/x86_64-linux-gnu'),
              pathlib.Path('/work/_otclient_tibia_re_state/toolroot/lib/x86_64-linux-gnu'),
              pathlib.Path('/usr/lib/x86_64-linux-gnu'),
              pathlib.Path('/lib/x86_64-linux-gnu'),
          ]
          names = ('libxcb-res.so.0', 'libxcb-res.so', 'libXRes.so.1', 'libXRes.so', 'libxcb.so.1', 'libX11.so.6')
          headers = [
              pathlib.Path('/work/_otclient_tibia_re_state/toolroot/usr/include/xcb/res.h'),
              pathlib.Path('/work/_otclient_tibia_re_state/toolroot/usr/include/X11/extensions/XRes.h'),
              pathlib.Path('/work/_otclient_tibia_re_state/toolroot/usr/include/X11/extensions/XResproto.h'),
              pathlib.Path('/usr/include/xcb/res.h'),
              pathlib.Path('/usr/include/X11/extensions/XRes.h'),
              pathlib.Path('/usr/include/X11/extensions/XResproto.h'),
          ]
          pkgconfigs = [
              pathlib.Path('/work/_otclient_tibia_re_state/toolroot/usr/lib/x86_64-linux-gnu/pkgconfig/xcb-res.pc'),
              pathlib.Path('/work/_otclient_tibia_re_state/toolroot/usr/lib/x86_64-linux-gnu/pkgconfig/xres.pc'),
              pathlib.Path('/usr/lib/x86_64-linux-gnu/pkgconfig/xcb-res.pc'),
              pathlib.Path('/usr/lib/x86_64-linux-gnu/pkgconfig/xres.pc'),
          ]

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()

          def safe_key(text):
              return re.sub(r'[^A-Za-z0-9]+','_',text).strip('_').upper()

          seen = set()
          libxcb_res = False
          libxres = False
          for root in roots:
              for name in names:
                  p=root/name
                  key=safe_key(str(p))
                  exists=p.exists()
                  print(f'XRES_SUPPORT_PATH={p}:exists={str(exists).lower()}')
                  if not exists:
                      continue
                  try:
                      real=p.resolve()
                  except OSError:
                      print(f'XRES_SUPPORT_RESOLVE={p}:FAIL')
                      continue
                  if str(real) in seen:
                      print(f'XRES_SUPPORT_DUPLICATE={p}:{real}')
                      continue
                  seen.add(str(real))
                  if not real.is_file():
                      print(f'XRES_SUPPORT_REAL_FILE={p}:false')
                      continue
                  data=real.read_bytes()
                  strings=[]
                  for m in re.finditer(rb'[\x20-\x7e]{5,}',data):
                      s=m.group().decode('ascii','replace')
                      if re.search(r'(?i)(xcb_res_query_client_ids|local_client_pid|XResQueryClientIds|XRES_CLIENT_ID_MASK_LOCAL_CLIENT_PID|QueryClientIds)',s):
                          strings.append(s[:240])
                          if len(strings)>=40: break
                  print(f'XRES_SUPPORT_LIB={p}:real={real}:size={real.stat().st_size}:sha256={sha256(real)}:matches={len(strings)}')
                  for s in strings:
                      print(f'XRES_SUPPORT_LIB_MATCH={p}:{s}')
                  if name.startswith('libxcb-res.so'):
                      libxcb_res=True
                  if name.startswith('libXRes.so'):
                      libxres=True

          header_basis=False
          for p in headers:
              exists=p.is_file()
              print(f'XRES_SUPPORT_HEADER={p}:exists={str(exists).lower()}')
              if not exists:
                  continue
              text=p.read_text(errors='replace')
              chosen=[line.strip()[:300] for line in text.splitlines() if re.search(r'(?i)(QueryClientIds|LocalClientPid|CLIENT_ID_MASK|XResQueryClientIds|XRES_CLIENT_ID)',line)]
              print(f'XRES_SUPPORT_HEADER_MATCHES={p}:{len(chosen)}')
              for line in chosen[:50]:
                  print(f'XRES_SUPPORT_HEADER_MATCH={p}:{line}')
              if chosen:
                  header_basis=True

          pkg_basis=False
          for p in pkgconfigs:
              exists=p.is_file()
              print(f'XRES_SUPPORT_PKGCONFIG={p}:exists={str(exists).lower()}')
              if exists:
                  text=p.read_text(errors='replace')
                  chosen=[line.strip()[:300] for line in text.splitlines() if re.match(r'^(Name|Version|Libs|Cflags):',line)]
                  for line in chosen:
                      print(f'XRES_SUPPORT_PKGCONFIG_LINE={p}:{line}')
                  pkg_basis=True

          if libxcb_res:
              classification='LIBXCB_RES_HELPER_PRESENT'
          elif libxres:
              classification='LIBXRES_HELPER_PRESENT_LIBXCB_RES_ABSENT'
          elif header_basis:
              classification='HEADERS_PROTOCOL_BASIS_PRESENT_NO_HELPER_LIBRARY'
          else:
              classification='NO_XRES_CLIENT_HELPER_OR_HEADER_BASIS_IN_FIXED_PATHS'
          print(f'XRES_SUPPORT_CLASSIFICATION={classification}')
          print(f'XRES_SUPPORT_LIBXCB_RES_PRESENT={str(libxcb_res).lower()}')
          print(f'XRES_SUPPORT_LIBXRES_PRESENT={str(libxres).lower()}')
          print(f'XRES_SUPPORT_HEADER_BASIS_PRESENT={str(header_basis).lower()}')
          print(f'XRES_SUPPORT_PKGCONFIG_PRESENT={str(pkg_basis).lower()}')
          print('XRES_SUPPORT_RESULT=PASS_READ_ONLY_INVENTORY')
          PY

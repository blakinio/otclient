name: Track A isolated Xvfb GLX enable probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-xvfb-glx-enable-probe.yml

permissions:
  contents: read

concurrency:
  group: track-a-xvfb-glx-enable-probe
  cancel-in-progress: false

jobs:
  xvfb-glx-enable-probe:
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Compare default Xvfb with explicit GLX extension
        shell: bash
        env:
          EXPECTED_BASE_SHA: d3f186414256151c9d5e03f34c5a9026b1fba500
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || {
            echo "XVFB_GLX_PROBE_REFUSED=BASE_MOVED:$EVENT_BASE_SHA"
            exit 44
          }

          task='OTC-20260816-track-a-xvfb-glx-enable-probe'
          marker="OTCLIENT_TIBIA_RE_DIAG_TASK=$task"
          tool='/work/_otclient_tibia_re_state/toolroot'
          xvfb="$tool/usr/bin/Xvfb"
          xkb="$tool/usr/share/X11/xkb"
          xkbcomp='/usr/bin/xkbcomp'
          expected_xvfb_sha='2c7f5a9534410fed5092d782a69ca7ffd9fce80e98b81ffe4944d703dd11d3b1'
          expected_xkbcomp_sha='0967e7e7b03b077327cea74567726b265bd304b4fdf59f87bf7fdfe1074e7591'
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/ephemeral-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          default_pid=''
          glx_pid=''
          used_displays=''

          task_owned_pid() {
            local pid="$1" role="$2"
            [[ "$pid" =~ ^[1-9][0-9]*$ && -r "/proc/$pid/environ" ]] || return 1
            grep -azFxq "$marker" "/proc/$pid/environ" || return 1
            grep -azFxq "OTCLIENT_TIBIA_RE_ROLE=$role" "/proc/$pid/environ"
          }

          stop_owned() {
            local pid="$1" role="$2"
            [[ -n "$pid" ]] || return 0
            if task_owned_pid "$pid" "$role"; then
              kill "$pid" 2>/dev/null || true
              for _ in $(seq 1 20); do
                kill -0 "$pid" 2>/dev/null || break
                sleep .1
              done
              kill -9 "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }

          cleanup() {
            rc=$?
            stop_owned "$glx_pid" xvfb-glx || true
            stop_owned "$default_pid" xvfb-default || true
            for n in $used_displays; do
              lock="/tmp/.X${n}-lock"
              sock="/tmp/.X11-unix/X${n}"
              if [[ -f "$lock" ]]; then
                owner="$(tr -cd '0-9' <"$lock" 2>/dev/null || true)"
                if [[ "$owner" == "$default_pid" || "$owner" == "$glx_pid" ]]; then
                  [[ ! -e "/proc/$owner" ]] && rm -f -- "$lock" "$sock"
                fi
              fi
            done
            rm -rf --one-file-system "$root" 2>/dev/null || true
            echo 'XVFB_GLX_PROBE_CLEANUP=COMPLETE'
            exit "$rc"
          }
          trap cleanup EXIT

          echo "XVFB_GLX_PROBE_TASK=$task"
          echo 'XVFB_GLX_PROBE_ADMISSION=EPHEMERAL_ISOLATED_MUTATION_AUTHORIZED'
          echo 'XVFB_GLX_PROBE_CANONICAL_STATE_ACCESS=NONE'
          echo 'XVFB_GLX_PROBE_CLIENT_STARTED=false'
          echo 'XVFB_GLX_PROBE_VNC_STARTED=false'
          echo 'XVFB_GLX_PROBE_WARP_STARTED=false'

          [[ -d "$tool" && ! -L "$tool" && "$(realpath -e "$tool")" == "$tool" ]] || exit 45
          [[ -f "$xvfb" && -x "$xvfb" && ! -L "$xvfb" ]] || exit 46
          [[ "$(sha256sum "$xvfb" | awk '{print $1}')" == "$expected_xvfb_sha" ]] || exit 47
          [[ -d "$xkb" && ! -L "$xkb" ]] || exit 48
          [[ -f "$xkbcomp" && -x "$xkbcomp" && ! -L "$xkbcomp" ]] || exit 49
          [[ "$(sha256sum "$xkbcomp" | awk '{print $1}')" == "$expected_xkbcomp_sha" ]] || exit 50
          echo 'XVFB_GLX_PROBE_SUPPORT_FENCE=PASS'

          [[ ! -e "$root" ]] || exit 51
          mkdir -p "$root"
          chmod 700 "$root"

          pick_display() {
            local n
            for n in $(seq 241 250); do
              case " $used_displays " in *" $n "*) continue ;; esac
              if [[ ! -e "/tmp/.X${n}-lock" && ! -e "/tmp/.X11-unix/X${n}" ]]; then
                used_displays+=" $n"
                printf '%s\n' "$n"
                return 0
              fi
            done
            return 1
          }

          query_x11() {
            local display_number="$1" label="$2" out="$3"
            python3 - "$display_number" "$label" "$out" <<'PY'
          import socket, struct, sys
          n=int(sys.argv[1]); label=sys.argv[2]; out=sys.argv[3]
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(3.0)
          s.connect(f'/tmp/.X11-unix/X{n}')
          def rx(k):
              b=b''
              while len(b)<k:
                  c=s.recv(k-len(b))
                  if not c: raise SystemExit('unexpected_eof')
                  b+=c
              return b
          s.sendall(struct.pack('<BBHHHHH',ord('l'),0,11,0,0,0,0))
          h=rx(8); body=rx(struct.unpack_from('<H',h,6)[0]*4)
          if h[0]!=1: raise SystemExit('setup_failed')
          s.sendall(struct.pack('<BBH',99,0,1)); r=rx(32); payload=rx(struct.unpack_from('<I',r,4)[0]*4)
          names=[]; p=0
          for _ in range(r[1]):
              ln=payload[p]; p+=1; names.append(payload[p:p+ln].decode('ascii','replace')); p+=ln
          def q(name):
              raw=name.encode(); pad=(-len(raw))%4; length=(8+len(raw)+pad)//4
              s.sendall(struct.pack('<BBHHH',98,0,length,len(raw),0)+raw+b'\0'*pad)
              rep=rx(32); return bool(rep[8]), int(rep[9])
          glx, glxop=q('GLX'); render, renderop=q('RENDER')
          lines=[
              f'XVFB_GLX_PROBE_{label}_EXTENSION_COUNT={len(names)}',
              f'XVFB_GLX_PROBE_{label}_EXTENSIONS={",".join(sorted(names))}',
              f'XVFB_GLX_PROBE_{label}_GLX_PRESENT={str(glx).lower()}',
              f'XVFB_GLX_PROBE_{label}_GLX_MAJOR_OPCODE={glxop if glx else 0}',
              f'XVFB_GLX_PROBE_{label}_RENDER_PRESENT={str(render).lower()}',
              f'XVFB_GLX_PROBE_{label}_RENDER_MAJOR_OPCODE={renderop if render else 0}',
          ]
          print('\n'.join(lines)); open(out,'w').write('\n'.join(lines)+'\n'); s.close()
          PY
          }

          emit_log() {
            local label="$1" log="$2"
            python3 - "$label" "$log" <<'PY'
          import pathlib,re,sys
          label=sys.argv[1]; p=pathlib.Path(sys.argv[2]); text=p.read_text(errors='replace') if p.exists() else ''
          chosen=[]
          for line in text.splitlines():
              if re.search(r'(?i)(GLX|AIGLX|glamor|DRI|renderer|extension|error|failed)',line):
                  line=''.join(ch if ch.isprintable() else '?' for ch in line)[:400]
                  chosen.append(line)
          print(f'XVFB_GLX_PROBE_{label}_LOG_TOTAL_LINES={len(text.splitlines())}')
          print(f'XVFB_GLX_PROBE_{label}_LOG_FILTER_MATCHES={len(chosen)}')
          for line in chosen[:80]: print(f'XVFB_GLX_PROBE_{label}_LOG={line}')
          PY
          }

          start_case() {
            local label="$1" role="$2" extra="$3" display_number display pid log result role_pid
            display_number="$(pick_display)" || { echo "XVFB_GLX_PROBE_${label}_RESULT=NO_FREE_DISPLAY"; return 1; }
            display=":$display_number"
            log="$root/${label,,}.log"
            result="$root/${label,,}.result"
            mkdir -p "$root/home-${label,,}"
            echo "XVFB_GLX_PROBE_${label}_DISPLAY=$display"
            if [[ -n "$extra" ]]; then
              env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
                OTCLIENT_TIBIA_RE_DIAG_TASK="$task" OTCLIENT_TIBIA_RE_ROLE="$role" \
                HOME="$root/home-${label,,}" PATH="$tool/usr/bin:$tool/usr/sbin:/usr/bin:/bin" \
                LD_LIBRARY_PATH="$tool/usr/lib/x86_64-linux-gnu:$tool/lib/x86_64-linux-gnu" \
                XKB_CONFIG_ROOT="$xkb" \
                nohup "$xvfb" "$display" -screen 0 1920x1080x24 -xkbdir "$xkb" \
                -nolisten tcp -noreset +extension GLX >"$log" 2>&1 </dev/null &
            else
              env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
                OTCLIENT_TIBIA_RE_DIAG_TASK="$task" OTCLIENT_TIBIA_RE_ROLE="$role" \
                HOME="$root/home-${label,,}" PATH="$tool/usr/bin:$tool/usr/sbin:/usr/bin:/bin" \
                LD_LIBRARY_PATH="$tool/usr/lib/x86_64-linux-gnu:$tool/lib/x86_64-linux-gnu" \
                XKB_CONFIG_ROOT="$xkb" \
                nohup "$xvfb" "$display" -screen 0 1920x1080x24 -xkbdir "$xkb" \
                -nolisten tcp -noreset >"$log" 2>&1 </dev/null &
            fi
            pid=$!
            if [[ "$role" == xvfb-default ]]; then default_pid="$pid"; else glx_pid="$pid"; fi
            echo "XVFB_GLX_PROBE_${label}_PID=$pid"
            for _ in $(seq 1 60); do
              [[ -e "/tmp/.X11-unix/X${display_number}" ]] && break
              kill -0 "$pid" 2>/dev/null || break
              sleep .2
            done
            if [[ ! -e "/tmp/.X11-unix/X${display_number}" ]]; then
              echo "XVFB_GLX_PROBE_${label}_SERVER_STARTED=false"
              emit_log "$label" "$log"
              return 0
            fi
            task_owned_pid "$pid" "$role" || { echo "XVFB_GLX_PROBE_${label}_OWNERSHIP=FAIL"; return 1; }
            echo "XVFB_GLX_PROBE_${label}_SERVER_STARTED=true"
            query_x11 "$display_number" "$label" "$result"
            sleep .5
            emit_log "$label" "$log"
            stop_owned "$pid" "$role"
            if [[ "$role" == xvfb-default ]]; then default_pid=''; else glx_pid=''; fi
            for _ in $(seq 1 20); do
              [[ ! -e "/tmp/.X11-unix/X${display_number}" ]] && break
              sleep .1
            done
            echo "XVFB_GLX_PROBE_${label}_STOPPED=true"
          }

          start_case DEFAULT xvfb-default ''
          start_case EXPLICIT_GLX xvfb-glx '+extension GLX'

          default_glx="$(sed -n 's/^XVFB_GLX_PROBE_DEFAULT_GLX_PRESENT=//p' "$root/default.result" 2>/dev/null || true)"
          explicit_glx="$(sed -n 's/^XVFB_GLX_PROBE_EXPLICIT_GLX_GLX_PRESENT=//p' "$root/explicit_glx.result" 2>/dev/null || true)"
          echo "XVFB_GLX_PROBE_COMPARE_DEFAULT_GLX=${default_glx:-SERVER_NOT_QUERYABLE}"
          echo "XVFB_GLX_PROBE_COMPARE_EXPLICIT_GLX=${explicit_glx:-SERVER_NOT_QUERYABLE}"
          if [[ "$default_glx" == false && "$explicit_glx" == true ]]; then
            classification='EXPLICIT_GLX_ENABLES_EXTENSION'
          elif [[ "$default_glx" == false && "$explicit_glx" == false ]]; then
            classification='EXPLICIT_GLX_DOES_NOT_ENABLE_EXTENSION'
          elif [[ -z "$explicit_glx" ]]; then
            classification='EXPLICIT_GLX_SERVER_NOT_QUERYABLE'
          else
            classification='OTHER_DIFFERENTIAL'
          fi
          echo "XVFB_GLX_PROBE_CLASSIFICATION=$classification"
          echo 'XVFB_GLX_PROBE_RESULT=PASS_DISCRIMINATOR_CAPTURED'

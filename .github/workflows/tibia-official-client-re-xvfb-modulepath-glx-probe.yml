name: Track A isolated Xvfb modulepath GLX probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-official-client-re-xvfb-modulepath-glx-probe.yml

permissions:
  contents: read

concurrency:
  group: track-a-xvfb-modulepath-glx-probe
  cancel-in-progress: false

jobs:
  xvfb-modulepath-glx-probe:
    runs-on: [otclient, synology]
    timeout-minutes: 6
    steps:
      - name: Start isolated Xvfb with contained modulepath and query GLX
        shell: bash
        env:
          EXPECTED_BASE_SHA: d3f186414256151c9d5e03f34c5a9026b1fba500
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || exit 44

          task='OTC-20260816-track-a-xvfb-modulepath-glx-probe'
          marker="OTCLIENT_TIBIA_RE_DIAG_TASK=$task"
          role='xvfb-modulepath-glx'
          tool='/work/_otclient_tibia_re_state/toolroot'
          xvfb="$tool/usr/bin/Xvfb"
          modules="$tool/usr/lib/xorg/modules"
          libglx="$modules/extensions/libglx.so"
          xkb="$tool/usr/share/X11/xkb"
          xkbcomp='/usr/bin/xkbcomp'
          xvfb_sha='2c7f5a9534410fed5092d782a69ca7ffd9fce80e98b81ffe4944d703dd11d3b1'
          libglx_sha='373b75559ee9a17449dfb84871bb7e5e306da7bd3aecd3282c7f03831ccf961a'
          xkbcomp_sha='0967e7e7b03b077327cea74567726b265bd304b4fdf59f87bf7fdfe1074e7591'
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/ephemeral-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pid=''
          display_number=''

          task_owned_pid() {
            local p="$1"
            [[ "$p" =~ ^[1-9][0-9]*$ && -r "/proc/$p/environ" ]] || return 1
            grep -azFxq "$marker" "/proc/$p/environ" || return 1
            grep -azFxq "OTCLIENT_TIBIA_RE_ROLE=$role" "/proc/$p/environ"
          }

          cleanup() {
            rc=$?
            if [[ -n "$pid" ]] && task_owned_pid "$pid"; then
              kill "$pid" 2>/dev/null || true
              for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep .1; done
              kill -9 "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            if [[ -n "$display_number" && -f "/tmp/.X${display_number}-lock" ]]; then
              owner="$(tr -cd '0-9' <"/tmp/.X${display_number}-lock" 2>/dev/null || true)"
              if [[ "$owner" == "$pid" && ! -e "/proc/$pid" ]]; then
                rm -f -- "/tmp/.X${display_number}-lock" "/tmp/.X11-unix/X${display_number}"
              fi
            fi
            rm -rf --one-file-system "$root" 2>/dev/null || true
            echo 'XVFB_MODULEPATH_GLX_CLEANUP=COMPLETE'
            exit "$rc"
          }
          trap cleanup EXIT

          echo "XVFB_MODULEPATH_GLX_TASK=$task"
          echo 'XVFB_MODULEPATH_GLX_ADMISSION=EPHEMERAL_ISOLATED_MUTATION_AUTHORIZED'
          echo 'XVFB_MODULEPATH_GLX_CANONICAL_STATE_ACCESS=NONE'
          echo 'XVFB_MODULEPATH_GLX_CLIENT_STARTED=false'
          echo 'XVFB_MODULEPATH_GLX_VNC_STARTED=false'
          echo 'XVFB_MODULEPATH_GLX_WARP_STARTED=false'

          [[ -d "$tool" && ! -L "$tool" && "$(realpath -e "$tool")" == "$tool" ]] || exit 45
          [[ -f "$xvfb" && -x "$xvfb" && ! -L "$xvfb" ]] || exit 46
          [[ "$(sha256sum "$xvfb" | awk '{print $1}')" == "$xvfb_sha" ]] || exit 47
          [[ -d "$modules" && ! -L "$modules" && "$(realpath -e "$modules")" == "$modules" ]] || exit 48
          [[ -f "$libglx" && ! -L "$libglx" ]] || exit 49
          [[ "$(sha256sum "$libglx" | awk '{print $1}')" == "$libglx_sha" ]] || exit 50
          [[ -d "$xkb" && ! -L "$xkb" ]] || exit 51
          [[ -f "$xkbcomp" && -x "$xkbcomp" && ! -L "$xkbcomp" ]] || exit 52
          [[ "$(sha256sum "$xkbcomp" | awk '{print $1}')" == "$xkbcomp_sha" ]] || exit 53
          echo 'XVFB_MODULEPATH_GLX_SUPPORT_FENCE=PASS'

          for n in $(seq 242 250); do
            if [[ ! -e "/tmp/.X${n}-lock" && ! -e "/tmp/.X11-unix/X${n}" ]]; then display_number="$n"; break; fi
          done
          [[ -n "$display_number" ]] || exit 54
          display=":$display_number"
          mkdir -p "$root/home"
          chmod 700 "$root" "$root/home"
          log="$root/xvfb.log"
          echo "XVFB_MODULEPATH_GLX_DISPLAY=$display"
          echo "XVFB_MODULEPATH_GLX_MODULEPATH=$modules"

          env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
            OTCLIENT_TIBIA_RE_DIAG_TASK="$task" OTCLIENT_TIBIA_RE_ROLE="$role" \
            HOME="$root/home" PATH="$tool/usr/bin:$tool/usr/sbin:/usr/bin:/bin" \
            LD_LIBRARY_PATH="$tool/usr/lib/x86_64-linux-gnu:$tool/lib/x86_64-linux-gnu" \
            XKB_CONFIG_ROOT="$xkb" \
            nohup "$xvfb" "$display" -screen 0 1920x1080x24 -xkbdir "$xkb" \
            -modulepath "$modules" -nolisten tcp -noreset +extension GLX \
            >"$log" 2>&1 </dev/null &
          pid=$!
          echo "XVFB_MODULEPATH_GLX_PID=$pid"

          for _ in $(seq 1 60); do
            [[ -e "/tmp/.X11-unix/X${display_number}" ]] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep .2
          done
          if [[ ! -e "/tmp/.X11-unix/X${display_number}" ]]; then
            echo 'XVFB_MODULEPATH_GLX_SERVER_STARTED=false'
            python3 - "$log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace') if pathlib.Path(sys.argv[1]).exists() else ''
          print(f'XVFB_MODULEPATH_GLX_LOG_TOTAL_LINES={len(text.splitlines())}')
          for line in text.splitlines()[:120]:
              line=''.join(ch if ch.isprintable() else '?' for ch in line)[:400]
              print('XVFB_MODULEPATH_GLX_LOG='+line)
          PY
            echo 'XVFB_MODULEPATH_GLX_RESULT=PASS_SERVER_START_DISCRIMINATOR'
            exit 0
          fi

          task_owned_pid "$pid" || exit 55
          echo 'XVFB_MODULEPATH_GLX_SERVER_STARTED=true'

          python3 - "$display_number" <<'PY'
          import socket,struct,sys
          n=int(sys.argv[1]); s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(3); s.connect(f'/tmp/.X11-unix/X{n}')
          def rx(k):
              b=b''
              while len(b)<k:
                  c=s.recv(k-len(b))
                  if not c: raise SystemExit('unexpected_eof')
                  b+=c
              return b
          s.sendall(struct.pack('<BBHHHHH',ord('l'),0,11,0,0,0,0)); h=rx(8); rx(struct.unpack_from('<H',h,6)[0]*4)
          s.sendall(struct.pack('<BBH',99,0,1)); r=rx(32); payload=rx(struct.unpack_from('<I',r,4)[0]*4)
          names=[]; p=0
          for _ in range(r[1]): ln=payload[p]; p+=1; names.append(payload[p:p+ln].decode('ascii','replace')); p+=ln
          def q(name):
              raw=name.encode(); pad=(-len(raw))%4; length=(8+len(raw)+pad)//4
              s.sendall(struct.pack('<BBHHH',98,0,length,len(raw),0)+raw+b'\0'*pad); rep=rx(32); return bool(rep[8]),int(rep[9])
          glx,go=q('GLX'); render,ro=q('RENDER')
          print(f'XVFB_MODULEPATH_GLX_EXTENSION_COUNT={len(names)}')
          print('XVFB_MODULEPATH_GLX_EXTENSIONS='+','.join(sorted(names)))
          print(f'XVFB_MODULEPATH_GLX_GLX_PRESENT={str(glx).lower()}')
          print(f'XVFB_MODULEPATH_GLX_GLX_MAJOR_OPCODE={go if glx else 0}')
          print(f'XVFB_MODULEPATH_GLX_RENDER_PRESENT={str(render).lower()}')
          print(f'XVFB_MODULEPATH_GLX_RENDER_MAJOR_OPCODE={ro if render else 0}')
          s.close()
          PY

          sleep .5
          python3 - "$log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace') if pathlib.Path(sys.argv[1]).exists() else ''
          chosen=[]
          for line in text.splitlines():
              if re.search(r'(?i)(module|GLX|AIGLX|glamor|DRI|renderer|extension|error|failed|loading)',line):
                  chosen.append(''.join(ch if ch.isprintable() else '?' for ch in line)[:400])
          print(f'XVFB_MODULEPATH_GLX_LOG_TOTAL_LINES={len(text.splitlines())}')
          print(f'XVFB_MODULEPATH_GLX_LOG_FILTER_MATCHES={len(chosen)}')
          for line in chosen[:120]: print('XVFB_MODULEPATH_GLX_LOG='+line)
          PY

          echo 'XVFB_MODULEPATH_GLX_RESULT=PASS_DISCRIMINATOR_CAPTURED'

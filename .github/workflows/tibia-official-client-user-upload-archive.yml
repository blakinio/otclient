name: Archive user-supplied Tibia Linux launcher

on:
  push:
    branches:
      - research/OTC-20260816-track-a-worldmap-extent-static-re
    paths:
      - .github/workflows/tibia-official-client-user-upload-archive.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Fetch, fence and archive exact launcher package
    runs-on: [otclient, synology]
    timeout-minutes: 8
    env:
      EXPECTED_SIZE: '29477141'
      EXPECTED_SHA256: '04a87c801d3855f4da1b07e201dff1f79acc8528c57c984131c3a2a88cb60ea7'
      SOURCE_URL: 'https://static.tibia.com/download/tibia.x64.tar.gz'
    steps:
      - name: Materialize exact user-supplied launcher bytes from official source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]
          [[ "$RUNNER_NAME" == 'synology-otclient-01' ]]
          out="$RUNNER_TEMP/tibia.x64.tar.gz"
          rm -f "$out"
          curl -fL --retry 0 --compressed \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -e 'https://www.tibia.com/account/?subtopic=downloadclient' \
            "$SOURCE_URL" -o "$out"
          actual_size="$(stat -c '%s' "$out")"
          actual_sha="$(sha256sum "$out" | awk '{print $1}')"
          echo "ARCHIVE_SIZE=$actual_size"
          echo "ARCHIVE_SHA256=$actual_sha"
          [[ "$actual_size" == "$EXPECTED_SIZE" ]]
          [[ "$actual_sha" == "$EXPECTED_SHA256" ]]
          tar -tzf "$out" >/dev/null
          echo 'USER_UPLOAD_BIT_IDENTITY_PROVEN=true'

      - name: Upload exact launcher package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-x64-launcher-user-upload-04a87c80
          path: ${{ runner.temp }}/tibia.x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

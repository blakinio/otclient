name: Track A official launcher CLI string recovery

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-launcher-cli-strings.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_WARP_PORT: '25354'
    steps:
      - name: Recover command-line option strings from fresh launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          warp_pid="$(tr -cd '0-9' <"$state/runtime/wireproxy.pid" 2>/dev/null || true)"
          [[ -n "$warp_pid" && -r "/proc/$warp_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$warp_pid/environ"
          work="$state/launcher-cli-static/run-$GITHUB_RUN_ID"; mkdir -p "$work/unpacked"
          url='https://static.tibia.com/download/tibia.x64.tar.gz'
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" --compressed -fL --max-time 120 --retry 3 --retry-all-errors "$url" -o "$work/tibia.x64.tar.gz"
          tar -xzf "$work/tibia.x64.tar.gz" -C "$work/unpacked"
          launcher="$work/unpacked/Tibia/Tibia"
          python3 - "$launcher" <<'PY'
          import pathlib,re,sys
          d=pathlib.Path(sys.argv[1]).read_bytes()
          rows=[(m.start(),m.group().decode('latin1','replace')) for m in re.finditer(rb'[ -~]{2,}',d)]
          for off,s in rows:
              if 0xc7600 <= off <= 0xc7d20:
                  print(f'TRACK_A_CLI_REGION=0x{off:x}|{s}')
          print('TRACK_A_CLI_REGION_COMPLETE=true')
          PY

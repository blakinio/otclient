name: Track A official launcher help probe

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-launcher-help-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  help:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_WARP_PORT: '25354'
      TRACK_DISPLAY: ':98'
    steps:
      - name: Print fresh official launcher help only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          warp_pid="$(tr -cd '0-9' <"$state/runtime/wireproxy.pid" 2>/dev/null || true)"
          [[ -n "$warp_pid" && -r "/proc/$warp_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$warp_pid/environ"
          xvfb_pid="$(tr -cd '0-9' <"$state/runtime/xvfb.pid" 2>/dev/null || true)"
          [[ -n "$xvfb_pid" && -e /tmp/.X11-unix/X98 ]]
          kill -0 "$xvfb_pid"
          root="$state/toolroot"
          work="$state/launcher-help/run-$GITHUB_RUN_ID"; mkdir -p "$work/unpacked" "$work/home"
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" --compressed -fL --max-time 120 --retry 3 --retry-all-errors \
            https://static.tibia.com/download/tibia.x64.tar.gz -o "$work/tibia.x64.tar.gz"
          tar -xzf "$work/tibia.x64.tar.gz" -C "$work/unpacked"
          launcher="$work/unpacked/Tibia/Tibia"
          [[ -x "$launcher" ]]
          workdir="$(dirname "$launcher")"
          tool_lib="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu"
          tool_path="$root/usr/bin:$root/usr/sbin:/usr/bin:/bin"
          HOME="$work/home" DISPLAY="$TRACK_DISPLAY" PATH="$tool_path" \
            LD_LIBRARY_PATH="$workdir:$workdir/lib:$tool_lib" LIBGL_ALWAYS_SOFTWARE=1 \
            QT_QUICK_BACKEND=software QT_XCB_GL_INTEGRATION=none \
            "$launcher" --help >"$work/help.txt" 2>&1 || rc=$?
          echo TRACK_A_LAUNCHER_HELP_RC="${rc:-0}"
          sed 's/^/TRACK_A_LAUNCHER_HELP=/' "$work/help.txt" | head -n 200
          echo TRACK_A_LAUNCHER_HELP_COMPLETE=true

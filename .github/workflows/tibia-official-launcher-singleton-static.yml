name: Track A official launcher singleton static analysis

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/tibia-official-launcher-singleton-static.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [otclient, synology]
    timeout-minutes: 3
    env:
      CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state
      LEGACY_IMAGE_STATE: /work/_otclient_tibia_re_state
      TRACK_WARP_PORT: '25354'
    steps:
      - name: Inspect fresh official launcher ELF without executing it
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == blakinio/otclient ]]
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          if [[ -d /work && -w /work ]]; then state="$LEGACY_IMAGE_STATE"; else state="$CANONICAL_STATE"; fi
          marker='OTCLIENT_TIBIA_RE_TRACK=official-client-re'
          warp_pid="$(tr -cd '0-9' <"$state/runtime/wireproxy.pid" 2>/dev/null || true)"
          [[ -n "$warp_pid" && -r "/proc/$warp_pid/environ" ]]
          grep -azFxq "$marker" "/proc/$warp_pid/environ"
          kill -0 "$warp_pid"
          work="$state/launcher-singleton-static/run-$GITHUB_RUN_ID"
          mkdir -p "$work/unpacked"
          url='https://static.tibia.com/download/tibia.x64.tar.gz'
          curl --socks5-hostname "127.0.0.1:$TRACK_WARP_PORT" --compressed -fL --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors -A 'Mozilla/5.0 (X11; Linux x86_64)' "$url" -o "$work/tibia.x64.tar.gz"
          tar -xzf "$work/tibia.x64.tar.gz" -C "$work/unpacked"
          launcher="$work/unpacked/Tibia/Tibia"
          [[ -x "$launcher" ]]
          echo TRACK_A_LAUNCHER_STATIC_SHA256="$(sha256sum "$launcher" | awk '{print $1}')"
          echo TRACK_A_LAUNCHER_STATIC_SIZE="$(stat -c %s "$launcher")"
          python3 - "$launcher" <<'PY'
          import pathlib,re,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          rows=[(m.start(),m.group().decode('latin1','replace')) for m in re.finditer(rb'[ -~]{4,}',data)]
          patterns=re.compile(r'Application is already running|single.?application|single.?instance|QLocal(?:Server|Socket)|QSharedMemory|QSystemSemaphore|QLockFile|lock.?file|server.?name|local.?socket|shared.?memory|semaphore|flock|fcntl|sem_|shm_|socket|bind|connect',re.I)
          hits=[i for i,(_,s) in enumerate(rows) if patterns.search(s)]
          print('TRACK_A_LAUNCHER_PY_STRING_COUNT='+str(len(rows)))
          print('TRACK_A_LAUNCHER_PY_MATCH_COUNT='+str(len(hits)))
          emitted=set()
          for idx in hits:
              for j in range(max(0,idx-12),min(len(rows),idx+13)):
                  off,s=rows[j]
                  key=(off,s)
                  if key in emitted: continue
                  emitted.add(key)
                  safe=s.replace('\n','\\n').replace('\r','\\r')
                  print(f'TRACK_A_LAUNCHER_PY_STRING=0x{off:x}|{safe}')
          # Emit all mangled Qt/local IPC-looking names even if not adjacent to the log message.
          for off,s in rows:
              if any(k in s for k in ('QLocalServer','QLocalSocket','QSharedMemory','QSystemSemaphore','QLockFile')):
                  print(f'TRACK_A_LAUNCHER_QT_IPC=0x{off:x}|{s}')
          print('TRACK_A_LAUNCHER_SINGLETON_STATIC_COMPLETE=true')
          PY

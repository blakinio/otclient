name: Tibia official login request string map

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-official-login-request-string-map.yml]

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact current official client through WARP
        shell: bash
        run: |
          set -Eeuo pipefail
          r=/tmp/w; mkdir -p "$r/bin" "$r/state" /tmp/c; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >/tmp/wp.log 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/t 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' /tmp/t
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A "$ua" -e "$u" -H 'Accept: */*' "$u" -o /tmp/c/client.lzma
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/c/client.lzma' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          b=pathlib.Path('/tmp/c/client.lzma').read_bytes(); q=b[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(b[33:37],'little')
          f={'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}; o=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[f])
          assert hashlib.sha256(o).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'; pathlib.Path('/tmp/c/client').write_bytes(o)
          PY
          echo OFFICIAL_CLIENT_SHA256_VERIFIED=true
          for spec in \
            'https://static.tibia.com/launcher/tibiaclient-linux-current/package.json /tmp/c/package.json' \
            'https://static.tibia.com/launcher/assets-current/assets.json /tmp/c/assets.json'; do
            set -- $spec; curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A "$ua" -e "$1" -H 'Accept: */*' "$1" -o "$2"
          done

      - name: Emit bounded request and metadata inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          strings -a -t x -n 4 /tmp/c/client >/tmp/client.strings
          echo LOGIN_REQUEST_TERMS_BEGIN
          grep -Ei 'loginservice|staylogged|client.?version|client.?build|version.?string|build.?version|authenticator|account.?password|account.?name|session.?key|client.?type|operating.?system|asset.?version|client.?identifier|client.?id|product.?version|release.?version|protocol.?version' /tmp/client.strings | head -n 600 || true
          echo LOGIN_REQUEST_TERMS_END
          python3 - <<'PY'
          import json,re,pathlib
          rows=[]
          for line in open('/tmp/client.strings',errors='replace'):
              m=re.match(r'^\s*([0-9a-fA-F]+)\s+(.*)$',line.rstrip('\n'))
              if m: rows.append((int(m.group(1),16),m.group(2)))
          for label,needle,radius in [('CLIENTVERSION','clientversion',4096),('CLIENTTYPE','clienttype',2048),('OPERATINGSYSTEM','operatingsystem',2048),('ASSETVERSION','assetversion',2048)]:
              print('NEAR_'+label+'_BEGIN')
              anchors=[o for o,s in rows if needle in s.lower()]
              seen=set()
              for a in anchors:
                  for o,s in rows:
                      if abs(o-a)<=radius and (o,s) not in seen:
                          seen.add((o,s)); print(f'{o:x} {s}')
              print('NEAR_'+label+'_END')
          def walk(v,path=''):
              if isinstance(v,dict):
                  for k,x in v.items():
                      p=f'{path}.{k}' if path else str(k)
                      if isinstance(x,(str,int,float,bool)) and re.search(r'(version|client|asset|platform|operating|system|build|release|type)',str(k),re.I):
                          s=str(x)
                          if len(s)<=160: print('META '+p+'='+s)
                      else: walk(x,p)
              elif isinstance(v,list):
                  for i,x in enumerate(v[:50]): walk(x,f'{path}[{i}]')
          for fn in ('package.json','assets.json'):
              print('METADATA_'+fn.upper().replace('.','_')+'_BEGIN')
              doc=json.loads((pathlib.Path('/tmp/c')/fn).read_text())
              if isinstance(doc,dict): print('TOP_LEVEL_KEYS='+','.join(sorted(map(str,doc.keys()))))
              walk(doc)
              print('METADATA_'+fn.upper().replace('.','_')+'_END')
          PY

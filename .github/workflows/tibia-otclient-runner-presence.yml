name: Tibia OTClient runner presence

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-otclient-runner-presence.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, otclient, synology]
    timeout-minutes: 3
    steps:
      - name: Emit non-secret runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -srm
          echo DEDICATED_OTCLIENT_RUNNER_ACCEPTED_JOB=true

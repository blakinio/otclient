name: TIBIA RE Control Center Package A

on:
  pull_request:
    branches: [main]
    paths:
      - tools/tibia_re_control_center/**
      - tests/tools/tibia_re_control_center/**
      - docs/agents/tasks/active/OTC-20260820-tibia-re-control-center-package-a.md
      - docs/agents/MODULE_CATALOG.md
      - docs/agents/CHANGELOG.md
      - .github/workflows/tibia-re-control-center-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-core:
    name: Package A deterministic core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head with base history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compile and run focused suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q tools/tibia_re_control_center tests/tools/tibia_re_control_center
          PYTHONPATH=. python3 -m unittest discover -s tests/tools/tibia_re_control_center -v

      - name: Verify all 65 mandatory cases are explicit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tests/tools/tibia_re_control_center/test_package_a.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          names = {
              node.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          missing = [
              index
              for index in range(1, 66)
              if not any(name.startswith(f'test_{index:02d}_') for name in names)
          ]
          if missing:
              raise SystemExit(f'missing mandatory Package A tests: {missing}')
          print('PACKAGE_A_MANDATORY_TESTS=65/65')
          PY

      - name: Enforce runtime-access-none implementation boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          root = Path('tools/tibia_re_control_center')
          forbidden_modules = {
              'socket', 'subprocess', 'requests', 'httpx', 'urllib.request',
              'selenium', 'playwright', 'docker', 'paramiko',
          }
          forbidden_calls = {'system', 'popen', 'Popen', 'exec', 'eval'}
          violations = []
          for path in sorted(root.glob('*.py')):
              tree = ast.parse(path.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name in forbidden_modules:
                              violations.append(f'{path}:{node.lineno}:import {alias.name}')
                  elif isinstance(node, ast.ImportFrom):
                      if node.module in forbidden_modules:
                          violations.append(f'{path}:{node.lineno}:from {node.module}')
                  elif isinstance(node, ast.Call):
                      name = getattr(node.func, 'id', None) or getattr(node.func, 'attr', None)
                      if name in forbidden_calls:
                          violations.append(f'{path}:{node.lineno}:call {name}')
          if violations:
              raise SystemExit('runtime_access:none violation(s):\n' + '\n'.join(violations))
          print('RUNTIME_ACCESS_NONE_BOUNDARY=PASS')
          PY

      - name: Ruff and whitespace validation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1
          ruff check tools/tibia_re_control_center tests/tools/tibia_re_control_center
          if [[ -n "${BASE_SHA:-}" ]]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD~1..HEAD
          fi

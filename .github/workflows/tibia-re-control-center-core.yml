name: TIBIA RE Control Center Package A

on:
  pull_request:
    branches: [main]
    paths:
      - tools/tibia_re_control_center/**
      - tests/tools/tibia_re_control_center/**
      - docs/agents/tasks/active/OTC-20260820-tibia-re-control-center-package-a.md
      - docs/agents/tasks/active/OTC-20260820-tibia-re-control-center-package-a-p1-isolation.md
      - docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-2.md
      - docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-3.md
      - docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-4.md
      - docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-5.md
      - docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-6.md
      - docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-7.md
      - docs/agents/tasks/archive/OTC-20260820-tibia-re-control-center-package-a.md
      - docs/agents/tasks/archive/OTC-20260820-tibia-re-control-center-package-a-p1-isolation.md
      - docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-2.md
      - docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-3.md
      - docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-4.md
      - docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-5.md
      - docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-6.md
      - docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-7.md
      - docs/agents/MODULE_CATALOG.md
      - docs/agents/CHANGELOG.md
      - .github/workflows/tibia-re-control-center-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-core:
    name: Package A deterministic core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head with base history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compile and run focused suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q tools/tibia_re_control_center tests/tools/tibia_re_control_center
          PYTHONPATH=. python3 -m unittest discover -s tests/tools/tibia_re_control_center -v

      - name: Verify all 65 mandatory cases are explicit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tests/tools/tibia_re_control_center/test_package_a.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          names = {
              node.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          missing = [
              index
              for index in range(1, 66)
              if not any(name.startswith(f'test_{index:02d}_') for name in names)
          ]
          if missing:
              raise SystemExit(f'missing mandatory Package A tests: {missing}')
          print('PACKAGE_A_MANDATORY_TESTS=65/65')
          PY

      - name: Enforce runtime-access-none implementation boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a.py >/tmp/package-a-audit.txt
          grep -F 'RUNTIME_ACCESS_NONE=PASS' /tmp/package-a-audit.txt

      - name: Ruff and whitespace validation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1
          ruff check tools/tibia_re_control_center
          if [[ -n "${BASE_SHA:-}" ]]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD~1..HEAD
          fi

  fresh-audit:
    name: Fresh Package A falsification audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head with base history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify declared Package A path boundary
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -Eeuo pipefail
          python3 - "$BASE_SHA" <<'PY'
          import os
          import subprocess
          import sys

          base = sys.argv[1]
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}...HEAD'],
              text=True,
          ).splitlines()
          allowed_exact = {
              '.github/workflows/tibia-re-control-center-core.yml',
              '.github/workflows/tibia-re-control-center-package-b.yml',
              'docs/agents/tasks/active/OTC-20260823-tibia-re-control-center-package-b.md',
              'docs/agents/tasks/archive/OTC-20260823-tibia-re-control-center-package-b.md',
              'docs/agents/CHANGELOG.md',
              'docs/agents/MODULE_CATALOG.md',
              'docs/agents/tasks/active/OTC-20260820-tibia-re-control-center-package-a.md',
              'docs/agents/tasks/active/OTC-20260820-tibia-re-control-center-package-a-p1-isolation.md',
              'docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-2.md',
              'docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-3.md',
              'docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-4.md',
              'docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-5.md',
              'docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-6.md',
              'docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-7.md',
              'docs/agents/tasks/archive/OTC-20260820-tibia-re-control-center-package-a.md',
              'docs/agents/tasks/archive/OTC-20260820-tibia-re-control-center-package-a-p1-isolation.md',
              'docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-2.md',
              'docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-3.md',
              'docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-4.md',
              'docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-5.md',
              'docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-6.md',
              'docs/agents/tasks/archive/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-7.md',
              'docs/agents/prompts/OTC_20260830_LOCAL_VISION_AGENT_SUPERVISOR_FOUNDATION_SDD.md',
              'docs/agents/prompts/OTC_20260830_LOCAL_VISION_AGENT_SUPERVISOR_FOUNDATION_SDD_ALIAS.md',
              'docs/agents/reports/OTC-20260830-local-vision-agent-supervisor-discovery.md',
              'docs/agents/reports/OTC-20260830-local-vision-agent-supervisor-foundation.md',
              'docs/agents/tasks/active/OTC-20260830-local-vision-agent-supervisor-discovery.md',
              'docs/agents/tasks/active/OTC-20260830-local-vision-agent-supervisor-foundation.md',
              'docs/superpowers/plans/2026-08-30-local-track-a-vision-agent-supervisor.md',
              'docs/superpowers/specs/2026-08-30-local-track-a-vision-agent-supervisor-design.md',
              'tools/tibia-re-vision-benchmark/vision_benchmark.py',
          }
          allowed_prefixes = (
              'tools/tibia_re_control_center/',
              'tests/tools/tibia_re_control_center/',
              'tools/tibia_re_vision/',
              'tests/tools/tibia_re_vision/',
              'docs/agents/tasks/active/OTC-20260901-vision-p2-',
              'docs/agents/tasks/archive/OTC-20260901-vision-p2-',
              'docs/agents/reports/OTC-20260901-vision-p2-',
              'docs/agents/evidence/OTC-20260823-tibia-re-control-center-package-b/',
          )
          fence_task = 'docs/agents/tasks/active/OTC-20260902-canonical-current-client-fence-be4f48.md'
          fence_branch = 'fix/OTC-20260902-canonical-current-client-fence-be4f48'
          fence_base = '8441fc1cce1600033b505d68ebc5c0141b337394'
          fence_repo = 'blakinio/otclient'
          if (
              fence_task in changed
              and base == fence_base
              and os.environ.get('HEAD_REF') == fence_branch
              and os.environ.get('HEAD_REPO') == fence_repo
          ):
              allowed_exact |= {
                  fence_task,
                  '.github/scripts/test_track_a_agent_runtime_governance.py',
                  '.github/scripts/test_track_a_canonical_current_client_fence.py',
                  '.github/scripts/tibia-official-client-re-canonical-live-session.sh',
                  '.github/scripts/tibia-official-client-re-canonical-live-transition.py',
                  '.github/scripts/tibia-official-client-re-kasm-bootstrap-worker.py',
                  '.github/scripts/tibia-official-client-re-kasm-existing-runtime-probe.py',
                  '.github/workflows/track-a-canonical-current-client-fence.yml',
                  '.github/workflows/track-a-canonical-live-governance.yml',
                  '.github/workflows/track-a-kasm-canonical-bootstrap.yml',
                  'docs/agents/TIBIA_RESEARCH_TRACKS.md',
                  'docs/agents/contracts/TRACK_A_CANONICAL_LIVE_BOOTSTRAP_V1.md',
                  'docs/agents/contracts/TRACK_A_RUNTIME_AGENT_ADMISSION_V1.md',
                  'docs/agents/decisions/ADR-0001-track-a-canonical-live-runtime.md',
                  'docs/agents/evidence/OTC-20260902-canonical-current-client-fence-be4f48/provenance.md',
                  'docs/agents/evidence/OTC-20260902-canonical-current-client-fence-be4f48/result.json',
                  'docs/agents/evidence/OTC-20260902-canonical-current-client-fence-be4f48/validation.md',
              }
          vision_p2_reconcile_task = 'docs/agents/tasks/active/OTC-20260902-vision-p2-vision-reconciliation.md'
          vision_p2_reconcile_report = 'docs/agents/reports/OTC-20260902-vision-p2-vision-reconciliation.md'
          vision_p2_reconcile_branch = 'feat/OTC-20260902-vision-p2-vision-reconciliation'
          vision_p2_reconcile_base = '27f9bdd5f003c596529e7571343ae8bb053d5cff'
          vision_p2_reconcile_repo = 'blakinio/otclient'
          if (
              vision_p2_reconcile_task in changed
              and base == vision_p2_reconcile_base
              and os.environ.get('HEAD_REF') == vision_p2_reconcile_branch
              and os.environ.get('HEAD_REPO') == vision_p2_reconcile_repo
          ):
              allowed_exact |= {
                  vision_p2_reconcile_task,
                  vision_p2_reconcile_report,
              }

          qwen_schema_task = 'docs/agents/tasks/active/OTC-20260902-vision-p2-qwen-schema-repair.md'
          qwen_schema_branch = 'fix/OTC-20260902-vision-p2-qwen-schema-contract'
          qwen_schema_base = 'c16d180d336ba8aa9e1656807c79a44e81c15c66'
          qwen_schema_repo = 'blakinio/otclient'
          if (
              qwen_schema_task in changed
              and base == qwen_schema_base
              and os.environ.get('HEAD_REF') == qwen_schema_branch
              and os.environ.get('HEAD_REPO') == qwen_schema_repo
          ):
              allowed_exact.add(qwen_schema_task)
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(f'Package A changed unexpected paths: {unexpected}')
          print(f'PACKAGE_A_CHANGED_PATHS={len(changed)}_DECLARED_ONLY')
          PY

      - name: Independently falsify safety and E2E invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a.py
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a_p1.py

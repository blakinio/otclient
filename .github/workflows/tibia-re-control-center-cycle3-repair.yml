name: TIBIA RE Control Center Package A cycle-3 repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/tibia-re-control-center-cycle3-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 628 && github.head_ref == 'feat/OTC-20260820-tibia-re-control-center-package-a'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/OTC-20260820-tibia-re-control-center-package-a
          fetch-depth: 0

      - name: Apply cycle-three review repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          p = Path('tools/tibia_re_control_center/execution.py')
          s = p.read_text(encoding='utf-8')
          s = once(s, 'from __future__ import annotations\n\nimport threading\n', 'from __future__ import annotations\n\nimport copy\nimport threading\n', 'execution copy import')
          s = once(
              s,
              '    ) -> ActionResult:\n        run = self._run(request.run_id)\n        canonical_request_hash = action_request_hash(\n',
              '    ) -> ActionResult:\n        request = replace(request, parameters=copy.deepcopy(dict(request.parameters)))\n        run = self._run(request.run_id)\n        canonical_request_hash = action_request_hash(\n',
              'action semantic snapshot',
          )
          s = once(
              s,
              '    def stop_all(self, *, transition_id: str | None = None, reason_code: str = "STOP_ALL") -> bool:\n        persisted = False\n        with self.control_transition_lock, self.dispatch_gate:\n',
              '    def stop_all(self, *, transition_id: str | None = None, reason_code: str = "STOP_ALL") -> bool:\n        persisted = False\n        with self.run_admission_lock, self.control_transition_lock, self.dispatch_gate:\n',
              'STOP/admission lock',
          )
          s = once(
              s,
              '                    self.stop_durability_unresolved = False\n                    persisted = True\n        for run in self.runs.values():\n            run.cancelled = True\n        try:\n',
              '                    self.stop_durability_unresolved = False\n                    persisted = True\n            for run in self.runs.values():\n                run.cancelled = True\n        try:\n',
              'STOP cancellation under admission lock',
          )
          s = once(
              s,
              '                self.control_state = next_state\n                self.in_memory_stop = False\n                self.mutation_disabled = False\n                for run in self.runs.values():\n                    run.cancelled = False\n                return True\n',
              '                self.control_state = next_state\n                self.in_memory_stop = False\n                self.mutation_disabled = False\n                return True\n',
              'STOP-cancelled run remains terminal',
          )
          s = once(
              s,
              '    def resume_run(self, run_id: str) -> bool:\n        run = self._run(run_id)\n        if self._deadline_expired(run):\n',
              '    def resume_run(self, run_id: str) -> bool:\n        run = self._run(run_id)\n        if run.cancelled:\n            return False\n        if self._deadline_expired(run):\n',
              'resume cancelled fence',
          )
          p.write_text(s, encoding='utf-8')

          p = Path('tools/tibia_re_control_center/artifact.py')
          s = p.read_text(encoding='utf-8')
          s = once(s, 'from __future__ import annotations\n\nfrom collections.abc import Mapping\n', 'from __future__ import annotations\n\nimport copy\nfrom collections.abc import Mapping\n', 'artifact copy import')
          s = once(
              s,
              '        validate_opaque_id(run_id, field_name="run_id")\n        ensure_no_secret_material(\n            {\n                "run_id": run_id,\n                "scenario_id": scenario_id,\n                "adapter_identity": adapter_identity,\n                "backend_epoch": backend_epoch,\n            },\n            key_path="artifact_metadata",\n        )\n        privacy_scan_ast = {key: value for key, value in scenario_ast.items() if key != "privacy_policy"}\n        ensure_no_secret_material(privacy_scan_ast, key_path="scenario")\n        if scenario_hash != sha256_jcs(scenario_ast):\n',
              '        validate_opaque_id(run_id, field_name="run_id")\n        scenario_ast_snapshot = copy.deepcopy(dict(scenario_ast))\n        adapter_identity_snapshot = copy.deepcopy(dict(adapter_identity))\n        privacy_policy_snapshot = copy.deepcopy(dict(privacy_policy))\n        ensure_no_secret_material(\n            {\n                "run_id": run_id,\n                "scenario_id": scenario_id,\n                "adapter_identity": adapter_identity_snapshot,\n                "backend_epoch": backend_epoch,\n            },\n            key_path="artifact_metadata",\n        )\n        privacy_scan_ast = {key: value for key, value in scenario_ast_snapshot.items() if key != "privacy_policy"}\n        ensure_no_secret_material(privacy_scan_ast, key_path="scenario")\n        if scenario_hash != sha256_jcs(scenario_ast_snapshot):\n',
              'artifact snapshot before scan',
          )
          s = once(s, '            scenario_ast=dict(scenario_ast),\n            adapter_identity=dict(adapter_identity),\n', '            scenario_ast=scenario_ast_snapshot,\n            adapter_identity=adapter_identity_snapshot,\n', 'artifact stored snapshots')
          s = once(s, '            privacy_policy=dict(privacy_policy),\n', '            privacy_policy=privacy_policy_snapshot,\n', 'privacy policy snapshot')
          s = once(s, '        run.stage["scenario.json"] = jcs_dumps(scenario_ast).encode("utf-8")\n', '        run.stage["scenario.json"] = jcs_dumps(scenario_ast_snapshot).encode("utf-8")\n', 'scenario snapshot serialization')
          s = once(
              s,
              '        safety_actions: Mapping[str, ActionLedgerRecord] | None = None,\n    ) -> Mapping[str, Any]:\n',
              '        safety_actions: Mapping[str, ActionLedgerRecord] | None = None,\n        reason_codes: list[str] | tuple[str, ...] | None = None,\n    ) -> Mapping[str, Any]:\n',
              'artifact reason_codes parameter',
          )
          s = once(s, '                "reason_codes": [] if status == "PASS" else [status],\n', '                "reason_codes": [] if status == "PASS" else list(reason_codes or (status,)),\n', 'concrete reason codes')
          p.write_text(s, encoding='utf-8')

          p = Path('tools/tibia_re_control_center/engine.py')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '        run = self.coordinator.start_run(\n            run_id,\n            scenario.side_effect_budget,\n            mutation_capable=scenario.mutation_capable,\n        )\n        identity = self.adapter.identity()\n        self.artifacts.create_run(\n            run_id=run_id,\n            scenario_id=scenario.scenario_id,\n            scenario_hash=scenario.scenario_hash,\n            scenario_ast=scenario.ast,\n            adapter_identity=self._identity_mapping(identity),\n            backend_epoch=self.coordinator.backend_epoch,\n            initial_control_generation=self.coordinator.control_generation,\n            started_monotonic_ns=run.budget.started_monotonic_ns,\n            privacy_policy=scenario.ast["privacy_policy"],\n        )\n        action_results: dict[str, ActionResult] = {}\n        assertions: dict[str, bool] = {}\n        reason_codes: list[str] = []\n        last_snapshot: Mapping[str, Any] | None = None\n        status = "PASS"\n        try:\n            current = self._snapshot_mapping(self.adapter.snapshot())\n',
              '        run = self.coordinator.start_run(\n            run_id,\n            scenario.side_effect_budget,\n            mutation_capable=scenario.mutation_capable,\n        )\n        artifact_created = False\n        action_results: dict[str, ActionResult] = {}\n        assertions: dict[str, bool] = {}\n        reason_codes: list[str] = []\n        last_snapshot: Mapping[str, Any] | None = None\n        status = "PASS"\n        try:\n            identity = self.adapter.identity()\n            self.artifacts.create_run(\n                run_id=run_id,\n                scenario_id=scenario.scenario_id,\n                scenario_hash=scenario.scenario_hash,\n                scenario_ast=scenario.ast,\n                adapter_identity=self._identity_mapping(identity),\n                backend_epoch=self.coordinator.backend_epoch,\n                initial_control_generation=self.coordinator.control_generation,\n                started_monotonic_ns=run.budget.started_monotonic_ns,\n                privacy_policy=scenario.ast["privacy_policy"],\n            )\n            artifact_created = True\n            current = self._snapshot_mapping(self.adapter.snapshot())\n',
              'engine setup cleanup scope',
          )
          s = once(s, '                safety_actions=self.coordinator.store.action_ledgers,\n            )\n', '                safety_actions=self.coordinator.store.action_ledgers,\n                reason_codes=reason_codes,\n            )\n', 'engine reason propagation')
          s = once(s, '        except Exception:\n            self.artifacts.mark_crash(run_id)\n            raise\n', '        except Exception:\n            if artifact_created:\n                self.artifacts.mark_crash(run_id)\n            raise\n', 'safe mark_crash')
          p.write_text(s, encoding='utf-8')

          p = Path('tools/tibia_re_control_center/recorder.py')
          s = p.read_text(encoding='utf-8')
          s = once(s, 'from __future__ import annotations\n\nimport re\n', 'from __future__ import annotations\n\nimport copy\nimport re\n', 'recorder copy import')
          s = once(
              s,
              '        ensure_no_secret_material(payload)\n        self._ingest_seq += 1\n',
              '        payload_snapshot = copy.deepcopy(dict(payload))\n        metadata_snapshot = {\n            "source_timestamp": source_timestamp,\n            "source_clock_domain": source_clock_domain,\n            "source_sequence_scope": source_sequence_scope,\n            "backend_epoch": self.backend_epoch,\n            "adapter_id": self.adapter_id,\n            "adapter_generation": self.adapter_generation,\n            "runtime_instance_id": runtime_instance_id,\n            "session_epoch": session_epoch,\n            "run_id": run_id,\n            "experiment_id": experiment_id,\n            "step_id": step_id,\n            "stimulus_id": stimulus_id,\n            "kind": kind,\n            "sensitivity": sensitivity,\n            "payload": payload_snapshot,\n        }\n        ensure_no_secret_material(metadata_snapshot, key_path="event")\n        self._ingest_seq += 1\n',
              'event metadata privacy snapshot',
          )
          s = once(s, '            payload=dict(payload),\n', '            payload=payload_snapshot,\n', 'event payload snapshot construction')
          p.write_text(s, encoding='utf-8')
          PY

          cat > tests/tools/tibia_re_control_center/test_codex_cycle2_repairs.py <<'PYTEST'
          from __future__ import annotations

          import json
          import threading
          import unittest
          from collections.abc import Iterator, Mapping
          from typing import Any

          import tools.tibia_re_control_center.execution as execution_module
          from test_codex_review_repairs import abort_scenario_json, hard_budget, make_request, make_stack
          from tools.tibia_re_control_center.artifact import ArtifactStore
          from tools.tibia_re_control_center.engine import ScenarioEngine
          from tools.tibia_re_control_center.execution import MutationCoordinator
          from tools.tibia_re_control_center.fake import FakeAdapter, ManualClock
          from tools.tibia_re_control_center.model import ActionStatus, PrivacyError
          from tools.tibia_re_control_center.recorder import Recorder
          from tools.tibia_re_control_center.scenario import parse_and_validate
          from tools.tibia_re_control_center.store import DeterministicDurableStore


          class BlockingActivationStore(DeterministicDurableStore):
              def __init__(self) -> None:
                  super().__init__()
                  self.activation_started = threading.Event()
                  self.activation_release = threading.Event()

              def persist_run_activation(self, run_id: str, started_ns: int, deadline_ns: int) -> None:
                  if run_id == "race-run":
                      self.activation_started.set()
                      if not self.activation_release.wait(2):
                          raise RuntimeError("activation release timed out")
                  super().persist_run_activation(run_id, started_ns, deadline_ns)


          class FlipIdentity(Mapping[str, Any]):
              def __init__(self) -> None:
                  self.adapter_id_reads = 0
                  self.values = {
                      "adapter_kind": "fake",
                      "adapter_version": "1",
                      "adapter_generation": "generation-1",
                      "runtime_instance_id": "runtime-1",
                      "session_epoch": "session-1",
                  }

              def __iter__(self) -> Iterator[str]:
                  return iter(("adapter_id", *self.values.keys()))

              def __len__(self) -> int:
                  return 1 + len(self.values)

              def __getitem__(self, key: str) -> Any:
                  if key == "adapter_id":
                      self.adapter_id_reads += 1
                      return "fake" if self.adapter_id_reads == 1 else "PASSWORD=hunter2"
                  return self.values[key]


          class CycleThreeRegressionTests(unittest.TestCase):
              def test_artifact_rejection_releases_mutation_run_lease(self) -> None:
                  raw = json.loads(abort_scenario_json())
                  raw["name"] = "PASSWORD=hunter2"
                  scenario = parse_and_validate(json.dumps(raw))
                  clock = ManualClock()
                  adapter = FakeAdapter(clock)
                  adapter.add_capability("move")
                  store = DeterministicDurableStore()
                  coordinator = MutationCoordinator(adapter, store, clock, backend_epoch="artifact-reject")
                  recorder = Recorder(clock, backend_epoch=coordinator.backend_epoch, adapter_id=adapter.identity().adapter_id, adapter_generation=adapter.identity().adapter_generation)
                  engine = ScenarioEngine(adapter=adapter, coordinator=coordinator, artifacts=ArtifactStore(), recorder=recorder)
                  with self.assertRaises(PrivacyError):
                      engine.run(scenario, run_id="rejected-run")
                  self.assertIsNone(coordinator.active_mutation_run_id)
                  self.assertEqual({}, coordinator.runs)

              def test_stop_linearizes_with_inflight_run_admission(self) -> None:
                  clock = ManualClock()
                  adapter = FakeAdapter(clock)
                  adapter.add_capability("move")
                  store = BlockingActivationStore()
                  coordinator = MutationCoordinator(adapter, store, clock, backend_epoch="admission-stop")
                  admitted: list[object] = []
                  stop_done = threading.Event()
                  start_worker = threading.Thread(target=lambda: admitted.append(coordinator.start_run("race-run", hard_budget())))
                  start_worker.start()
                  self.assertTrue(store.activation_started.wait(2))
                  stop_worker = threading.Thread(target=lambda: (coordinator.stop_all(), stop_done.set()))
                  stop_worker.start()
                  self.assertFalse(stop_done.wait(0.1))
                  store.activation_release.set()
                  start_worker.join(2)
                  stop_worker.join(2)
                  self.assertFalse(start_worker.is_alive())
                  self.assertFalse(stop_worker.is_alive())
                  self.assertEqual(1, len(admitted))
                  self.assertTrue(coordinator.runs["race-run"].cancelled)
                  self.assertTrue(coordinator.control_state.stop_latched)

              def test_stop_cancelled_run_stays_invalid_after_reset(self) -> None:
                  _, _, _, coordinator = make_stack(epoch="cancel-generation")
                  coordinator.pause_run("repair-run")
                  self.assertTrue(coordinator.stop_all())
                  self.assertTrue(coordinator.runs["repair-run"].cancelled)
                  self.assertTrue(coordinator.reset_stop())
                  self.assertTrue(coordinator.runs["repair-run"].cancelled)
                  self.assertFalse(coordinator.resume_run("repair-run"))

              def test_event_metadata_secret_rejected_before_construction(self) -> None:
                  clock = ManualClock()
                  recorder = Recorder(clock, backend_epoch="backend", adapter_id="fake", adapter_generation="generation")
                  with self.assertRaises(PrivacyError):
                      recorder.record_event(kind="SYSTEM", payload={}, source_timestamp="PASSWORD=hunter2")
                  self.assertEqual([], recorder.events)

              def test_concrete_abort_reason_is_in_result_envelope(self) -> None:
                  scenario = parse_and_validate(abort_scenario_json())
                  clock = ManualClock()
                  adapter = FakeAdapter(clock)
                  adapter.add_capability("move")
                  store = DeterministicDurableStore()
                  coordinator = MutationCoordinator(adapter, store, clock, backend_epoch="reason-envelope")
                  recorder = Recorder(clock, backend_epoch=coordinator.backend_epoch, adapter_id=adapter.identity().adapter_id, adapter_generation=adapter.identity().adapter_generation)
                  adapter.authority_wait_hook = lambda: adapter.snapshot_values.__setitem__("client_state", "OFFLINE")
                  result = ScenarioEngine(adapter=adapter, coordinator=coordinator, artifacts=ArtifactStore(), recorder=recorder).run(scenario, run_id="reason-run")
                  self.assertEqual(("CLIENT_NOT_IN_GAME",), result.reason_codes)
                  self.assertEqual(["CLIENT_NOT_IN_GAME"], result.artifact_result["reason_codes"])

              def test_action_semantics_are_snapshotted_before_execution_lock(self) -> None:
                  _, adapter, store, coordinator = make_stack(epoch="semantic-snapshot")
                  parameters = {"direction": "NORTH", "tiles": 1}
                  request = make_request(coordinator, adapter, "snapshot-action")
                  request = execution_module.replace(request, parameters=parameters)
                  snapshotted = threading.Event()
                  original_deepcopy = execution_module.copy.deepcopy

                  def signaled_deepcopy(value: Any) -> Any:
                      result = original_deepcopy(value)
                      snapshotted.set()
                      return result

                  coordinator.mutation_execution_lock.acquire()
                  execution_module.copy.deepcopy = signaled_deepcopy
                  results: list[Any] = []
                  try:
                      worker = threading.Thread(target=lambda: results.append(coordinator.execute_action(request)))
                      worker.start()
                      self.assertTrue(snapshotted.wait(2))
                      parameters["direction"] = "SOUTH"
                      coordinator.mutation_execution_lock.release()
                      worker.join(2)
                  finally:
                      execution_module.copy.deepcopy = original_deepcopy
                      if coordinator.mutation_execution_lock.locked():
                          coordinator.mutation_execution_lock.release()
                  self.assertEqual(ActionStatus.PASS, results[0].status)
                  self.assertEqual("NORTH", adapter.physical_effects[0]["parameters"]["direction"])
                  self.assertEqual(request.action_request_hash, store.load_action(request.action_id).action_request_hash)

              def test_artifact_metadata_is_snapshotted_before_privacy_scan(self) -> None:
                  scenario = parse_and_validate(abort_scenario_json())
                  identity = FlipIdentity()
                  artifacts = ArtifactStore()
                  run = artifacts.create_run(run_id="snapshot-metadata", scenario_id=scenario.scenario_id, scenario_hash=scenario.scenario_hash, scenario_ast=scenario.ast, adapter_identity=identity, backend_epoch="backend", initial_control_generation=0, started_monotonic_ns=0, privacy_policy=scenario.ast["privacy_policy"])
                  self.assertEqual(1, identity.adapter_id_reads)
                  self.assertEqual("fake", run.adapter_identity["adapter_id"])


          if __name__ == "__main__":
              unittest.main()
          PYTEST

      - name: Validate repaired Package A
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q tools/tibia_re_control_center tests/tools/tibia_re_control_center
          PYTHONPATH=. python3 -m unittest discover -s tests/tools/tibia_re_control_center -v
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a.py
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a_p1.py
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1
          ruff check tools/tibia_re_control_center tests/tools/tibia_re_control_center/test_codex_cycle2_repairs.py
          git diff --check

      - name: Checkpoint task and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/agents/tasks/active/OTC-20260820-tibia-re-control-center-package-a-p1-isolation.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('repair_cycles_for_current_gate: 2', 'repair_cycles_for_current_gate: 3', 1)
          s = s.replace('- [ ] Artifact-construction rejection always releases the admitted mutation-run lease.', '- [x] Artifact-construction rejection always releases the admitted mutation-run lease.', 1)
          s = s.replace('- [ ] Run admission linearizes with STOP and STOP-cancelled runs remain terminal after reset.', '- [x] Run admission linearizes with STOP and STOP-cancelled runs remain terminal after reset.', 1)
          s = s.replace('- [ ] All serialized event metadata is privacy-scanned before Event construction.', '- [x] All serialized event metadata is privacy-scanned before Event construction.', 1)
          s = s.replace('- [ ] Result-v1 preserves concrete failure reason codes.', '- [x] Result-v1 preserves concrete failure reason codes.', 1)
          s = s.replace('- [ ] Action semantics and artifact metadata are snapshotted before hash/privacy validation and reused through dispatch/persistence.', '- [x] Action semantics and artifact metadata are snapshotted before hash/privacy validation and reused through dispatch/persistence.', 1)
          s = s.replace('- [ ] Focused regressions, full Package A tests, audits, Ruff and diff-check PASS on the new exact head.', '- [x] Focused regressions, full Package A tests, audits, Ruff and diff-check PASS on the new exact head.', 1)
          s = s.replace('ci_check_generation: isolation_cycle3_repair_pending', 'ci_check_generation: isolation_cycle3_candidate_pending_ci', 1)
          s = s.replace('  phase: repair\n', '  phase: validate\n', 1)
          s = s.replace('  active_operation: apply repair cycle 3 through an owned one-shot GitHub workflow, remove that workflow in the repair commit, then validate the resulting exact head\n', '  active_operation: publish exact-head cycle-3 candidate, then run exact-head CI and fresh independent review\n', 1)
          s = s.replace('  check_generation: isolation_cycle3_repair_pending\n', '  check_generation: isolation_cycle3_candidate_pending_ci\n', 1)
          s = s.replace('  next_action: create and run the owned one-shot repair workflow, then trigger exact-head CI and fresh independent review\n', '  next_action: trigger exact-head CI and fresh independent Codex review; close isolation only if both are clean\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/tibia-re-control-center-cycle3-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/tibia_re_control_center tests/tools/tibia_re_control_center docs/agents/tasks/active/OTC-20260820-tibia-re-control-center-package-a-p1-isolation.md
          git commit -m 'fix(control-center): close isolation cycle-three findings'
          git push origin HEAD:feat/OTC-20260820-tibia-re-control-center-package-a

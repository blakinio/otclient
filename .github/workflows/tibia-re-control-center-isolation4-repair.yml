name: Package A isolation-4 one-shot repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feat/OTC-20260820-tibia-re-control-center-package-a'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply bounded isolation-four repairs and validate
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin "$BRANCH"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/tibia_re_control_center/execution.py')
          text = p.read_text(encoding='utf-8')
          duplicate = '''            if self.clock.now_ns() >= action_deadline_ns:\n                final_commit_refusal_reason[0] = "ACTION_TIMEOUT_EXPIRED"\n                return False\n            if self.clock.now_ns() >= action_deadline_ns:\n                final_commit_refusal_reason[0] = "ACTION_TIMEOUT_EXPIRED"\n                return False\n'''
          single = '''            if self.clock.now_ns() >= action_deadline_ns:\n                final_commit_refusal_reason[0] = "ACTION_TIMEOUT_EXPIRED"\n                return False\n'''
          if duplicate in text:
              text = text.replace(duplicate, single, 1)
          hook_tail = '''                if final_reason is not None:\n                    final_commit_refusal_reason[0] = final_reason\n                    return False\n            record = self.store.load_action(request.action_id)\n'''
          hook_tail_fixed = '''                if final_reason is not None:\n                    final_commit_refusal_reason[0] = final_reason\n                    return False\n            if self.clock.now_ns() >= action_deadline_ns:\n                final_commit_refusal_reason[0] = "ACTION_TIMEOUT_EXPIRED"\n                return False\n            record = self.store.load_action(request.action_id)\n'''
          if hook_tail_fixed not in text:
              if hook_tail not in text:
                  raise SystemExit('post-hook timeout anchor missing')
              text = text.replace(hook_tail, hook_tail_fixed, 1)

          start = text.index('    def recover_run(self, run_id: str, *, mutation_capable: bool = True) -> RunState:\n')
          end = text.index('\n    def finish_run(self, run_id: str) -> None:\n', start)
          body = text[start:end]
          if '        with self.run_admission_lock:\n' not in body:
              lines = body.splitlines()
              fixed = [lines[0], '        with self.run_admission_lock:']
              fixed.extend('    ' + line if line else line for line in lines[1:])
              text = text[:start] + '\n'.join(fixed) + text[end:]
          p.write_text(text, encoding='utf-8')

          p = Path('tools/tibia_re_control_center/artifact.py')
          text = p.read_text(encoding='utf-8')
          marker = '\n\ndef _admit_public_artifact_bytes(logical: str, data: bytes, *, key_path: str) -> bytes:\n'
          if 'def _json_object_without_duplicate_keys(' not in text:
              helper = '''\n\ndef _json_object_without_duplicate_keys(pairs: list[tuple[str, Any]]) -> dict[str, Any]:\n    result: dict[str, Any] = {}\n    for key, value in pairs:\n        if key in result:\n            raise ValidationError(\n                "ARTIFACT_JSON_DUPLICATE_KEY",\n                f"duplicate JSON key is forbidden: {key}",\n            )\n        result[key] = value\n    return result\n'''
              if marker not in text:
                  raise SystemExit('json helper anchor missing')
              text = text.replace(marker, helper + marker, 1)
          text = text.replace('structured = json.loads(decoded)', 'structured = json.loads(decoded, object_pairs_hook=_json_object_without_duplicate_keys)', 1)
          text = text.replace('structured = json.loads(line)', 'structured = json.loads(line, object_pairs_hook=_json_object_without_duplicate_keys)', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tools/tibia_re_control_center/recorder.py')
          text = p.read_text(encoding='utf-8')
          anchor = '''            "source_clock_domain": source_clock_domain,\n            "source_sequence_scope": source_sequence_scope,\n'''
          fixed = '''            "source_clock_domain": source_clock_domain,\n            "source_sequence": source_sequence,\n            "source_sequence_scope": source_sequence_scope,\n'''
          if '            "source_sequence": source_sequence,\n' not in text:
              if anchor not in text:
                  raise SystemExit('source_sequence metadata anchor missing')
              text = text.replace(anchor, fixed, 1)
          p.write_text(text, encoding='utf-8')
          PY

          cat > tests/tools/tibia_re_control_center/test_isolation4_repairs.py <<'PY'
          from __future__ import annotations

          import threading
          import unittest

          from test_codex_review_repairs import abort_scenario_json, make_request, make_stack

          from tools.tibia_re_control_center.artifact import ArtifactStore
          from tools.tibia_re_control_center.model import ActionStatus, PrivacyError
          from tools.tibia_re_control_center.recorder import Recorder
          from tools.tibia_re_control_center.scenario import parse_and_validate


          class IsolationFourRegressionTests(unittest.TestCase):
              def test_action_timeout_is_rechecked_after_final_safety_hook(self) -> None:
                  clock, adapter, _, coordinator = make_stack(epoch="post-hook-timeout")
                  request = make_request(coordinator, adapter, "post-hook-timeout-action")

                  def final_check():
                      clock.advance_ms(request.timeout_ms + 1)
                      return None

                  result = coordinator.execute_action(request, final_commit_check=final_check)
                  self.assertEqual(ActionStatus.TIMEOUT, result.status)
                  self.assertEqual("ACTION_TIMEOUT_EXPIRED", result.reason_code)
                  self.assertEqual([], adapter.physical_effects)

              def test_recover_run_publication_linearizes_with_stop(self) -> None:
                  _, _, _, coordinator = make_stack(epoch="recovery-stop-race")
                  run = coordinator.start_run("recover-race", coordinator.runs[next(iter(coordinator.runs))].budget if False else __import__('test_codex_review_repairs').hard_budget())
                  coordinator.finish_run(run.run_id)
                  checked = threading.Event()
                  release = threading.Event()
                  original = coordinator.mutation_admission_allowed

                  def blocking_admission():
                      allowed = original()
                      checked.set()
                      if not release.wait(2):
                          raise RuntimeError("recovery admission release timed out")
                      return allowed

                  coordinator.mutation_admission_allowed = blocking_admission
                  recovered_holder = []
                  recover_thread = threading.Thread(target=lambda: recovered_holder.append(coordinator.recover_run("recover-race")))
                  stop_done = threading.Event()
                  stop_thread = threading.Thread(target=lambda: (coordinator.stop_all(), stop_done.set()))
                  recover_thread.start()
                  self.assertTrue(checked.wait(1))
                  stop_thread.start()
                  self.assertFalse(stop_done.wait(0.05))
                  release.set()
                  recover_thread.join(2)
                  stop_thread.join(2)
                  self.assertFalse(recover_thread.is_alive())
                  self.assertFalse(stop_thread.is_alive())
                  self.assertTrue(recovered_holder[0].cancelled)

              def test_duplicate_key_json_secret_is_rejected(self) -> None:
                  scenario = parse_and_validate(abort_scenario_json())
                  artifacts = ArtifactStore()
                  artifacts.create_run(
                      run_id="duplicate-json",
                      scenario_id=scenario.scenario_id,
                      scenario_hash=scenario.scenario_hash,
                      scenario_ast=scenario.ast,
                      adapter_identity={"adapter_id": "fake"},
                      backend_epoch="b",
                      initial_control_generation=0,
                      started_monotonic_ns=0,
                      privacy_policy=scenario.ast["privacy_policy"],
                  )
                  with self.assertRaises(Exception) as ctx:
                      artifacts.write_stage(
                          "duplicate-json",
                          "metadata.json",
                          b'{"note":"PASSWORD=hunter2","note":"safe"}',
                      )
                  self.assertIn("duplicate JSON key", str(ctx.exception))

              def test_source_sequence_is_privacy_classified(self) -> None:
                  clock, adapter, _, coordinator = make_stack(epoch="event-source-sequence")
                  recorder = Recorder(clock, coordinator.backend_epoch, adapter.identity())
                  with self.assertRaises(PrivacyError):
                      recorder.record(
                          kind="SNAPSHOT",
                          payload={},
                          source_sequence="PASSWORD=hunter2",
                      )


          if __name__ == "__main__":
              unittest.main()
          PY

          rm -rf tools/tibia_re_control_center/__pycache__ tests/tools/tibia_re_control_center/__pycache__
          python3 -m compileall -q tools/tibia_re_control_center tests/tools/tibia_re_control_center
          PYTHONPATH=. python3 -m unittest discover -s tests/tools/tibia_re_control_center -p 'test_*.py'
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a.py
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a_p1.py
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1 >/dev/null
          ruff check --fix tools/tibia_re_control_center tests/tools/tibia_re_control_center/test_isolation4_repairs.py
          ruff check tools/tibia_re_control_center tests/tools/tibia_re_control_center/test_isolation4_repairs.py
          git diff --check
          rm -rf tools/tibia_re_control_center/__pycache__ tests/tools/tibia_re_control_center/__pycache__
          git rm .github/workflows/tibia-re-control-center-isolation4-repair.yml
          git config user.name 'blakinio'
          git config user.email '75369544+blakinio@users.noreply.github.com'
          git add -A
          git commit -m 'fix(control-center): close isolation-four P1 findings'
          git push origin "HEAD:$BRANCH"

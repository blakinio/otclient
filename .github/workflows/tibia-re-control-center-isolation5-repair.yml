name: Package A isolation-5 one-shot repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feat/OTC-20260820-tibia-re-control-center-package-a'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply bounded isolation-five repairs and validate
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin "$BRANCH"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/tibia_re_control_center/execution.py')
          text = p.read_text(encoding='utf-8')
          lock_anchor = '        self.mutation_execution_lock = threading.Lock()\n'
          lock_fixed = lock_anchor + '        self.stop_operation_lock = threading.RLock()\n'
          if 'self.stop_operation_lock = threading.RLock()' not in text:
              if lock_anchor not in text:
                  raise SystemExit('stop-operation lock anchor missing')
              text = text.replace(lock_anchor, lock_fixed, 1)

          authority_anchor = '''            if request.required_authority == Authority.MUTATION and not self.adapter.allow_mutation:\n                return self._make_result(\n                    request,\n                    LifecycleState.REFUSED,\n                    ActionStatus.REFUSED,\n                    DispatchState.NOT_DISPATCHED,\n                    reason_code="READ_ONLY_MUTATION_REFUSED",\n                )\n'''
          authority_fixed = '''            if request.required_authority != Authority.MUTATION:\n                return self._make_result(\n                    request,\n                    LifecycleState.REFUSED,\n                    ActionStatus.REFUSED,\n                    DispatchState.NOT_DISPATCHED,\n                    reason_code="MUTATION_AUTHORITY_REQUIRED",\n                )\n            if not self.adapter.allow_mutation:\n                return self._make_result(\n                    request,\n                    LifecycleState.REFUSED,\n                    ActionStatus.REFUSED,\n                    DispatchState.NOT_DISPATCHED,\n                    reason_code="READ_ONLY_MUTATION_REFUSED",\n                )\n'''
          if 'reason_code="MUTATION_AUTHORITY_REQUIRED"' not in text:
              if authority_anchor not in text:
                  raise SystemExit('authority anchor missing')
              text = text.replace(authority_anchor, authority_fixed, 1)

          timeout_anchor = '''            if not self.adapter.current_authority(request.required_authority):\n                return False\n            if request.action_id not in run.budget.reservations:\n                return False\n            next_budget = self._move_reserved_to_at_risk(run.budget, request.action_id)\n'''
          timeout_fixed = '''            if not self.adapter.current_authority(request.required_authority):\n                return False\n            if request.action_id not in run.budget.reservations:\n                return False\n            if self.clock.now_ns() >= action_deadline_ns:\n                final_commit_refusal_reason[0] = "ACTION_TIMEOUT_EXPIRED"\n                return False\n            next_budget = self._move_reserved_to_at_risk(run.budget, request.action_id)\n'''
          if timeout_fixed not in text:
              if timeout_anchor not in text:
                  raise SystemExit('final timeout anchor missing')
              text = text.replace(timeout_anchor, timeout_fixed, 1)

          start = text.index('    def stop_all(self, *, transition_id: str | None = None, reason_code: str = "STOP_ALL") -> bool:\n')
          end = text.index('\n    def reset_stop(self, *, transition_id: str | None = None, reason_code: str = "EXPLICIT_RESET") -> bool:\n', start)
          body = text[start:end]
          if '        with self.stop_operation_lock:\n' not in body:
              lines = body.splitlines()
              fixed = [lines[0], '        with self.stop_operation_lock:']
              fixed.extend('    ' + line if line else line for line in lines[1:])
              text = text[:start] + '\n'.join(fixed) + text[end:]
          p.write_text(text, encoding='utf-8')

          p = Path('tools/tibia_re_control_center/recorder.py')
          text = p.read_text(encoding='utf-8')
          freeze_marker = '\n\ndef safe_error(code: str, *, safe_message: str, exception: BaseException | None = None) -> dict[str, str]:\n'
          if 'class _FrozenEventDict(dict):' not in text:
              helper = '''\n\nclass _FrozenEventDict(dict):\n    def _immutable(self, *args: Any, **kwargs: Any) -> None:\n        del args, kwargs\n        raise TypeError("event payload is immutable")\n\n    __setitem__ = _immutable\n    __delitem__ = _immutable\n    clear = _immutable\n    pop = _immutable\n    popitem = _immutable\n    setdefault = _immutable\n    update = _immutable\n\n\ndef _freeze_event_value(value: Any) -> Any:\n    if isinstance(value, Mapping):\n        return _FrozenEventDict({key: _freeze_event_value(child) for key, child in value.items()})\n    if isinstance(value, list):\n        return tuple(_freeze_event_value(child) for child in value)\n    if isinstance(value, tuple):\n        return tuple(_freeze_event_value(child) for child in value)\n    return value\n'''
              if freeze_marker not in text:
                  raise SystemExit('recorder freeze marker missing')
              text = text.replace(freeze_marker, helper + freeze_marker, 1)
          admission_anchor = '        ensure_no_secret_material(metadata_snapshot, key_path="event")\n        self._ingest_seq += 1\n'
          admission_fixed = '        ensure_no_secret_material(metadata_snapshot, key_path="event")\n        payload_snapshot = _freeze_event_value(payload_snapshot)\n        self._ingest_seq += 1\n'
          if admission_fixed not in text:
              if admission_anchor not in text:
                  raise SystemExit('event freeze admission anchor missing')
              text = text.replace(admission_anchor, admission_fixed, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tools/tibia_re_control_center/artifact.py')
          text = p.read_text(encoding='utf-8')
          status_anchor = '''        if status == "PASS" and (ambiguous or not privacy_ok or not cleanup_ok):\n            status = "INCOMPLETE"\n        try:\n            run.stage["events.jsonl"] = self._events_jsonl(recorder)\n            action_projection = {\n                action_id: {\n                    "lifecycle_state": result.lifecycle_state.value,\n                    "status": result.status.value,\n                    "dispatch_state": result.dispatch_state.value,\n                    "reason_code": result.reason_code,\n                }\n                for action_id, result in action_results.items()\n            }\n'''
          status_fixed = '''        if status == "PASS" and (ambiguous or not privacy_ok or not cleanup_ok):\n            status = "INCOMPLETE"\n        reason_codes_snapshot = copy.deepcopy(list(reason_codes or ()))\n        assertions_snapshot = copy.deepcopy(dict(assertions or {}))\n        budget_summary_snapshot = copy.deepcopy(dict(budget_summary))\n        action_projection = {\n            action_id: {\n                "lifecycle_state": result.lifecycle_state.value,\n                "status": result.status.value,\n                "dispatch_state": result.dispatch_state.value,\n                "reason_code": result.reason_code,\n            }\n            for action_id, result in action_results.items()\n        }\n        ensure_no_secret_material(\n            {\n                "reason_codes": reason_codes_snapshot,\n                "assertions": assertions_snapshot,\n                "budget_summary": budget_summary_snapshot,\n                "action_outcomes": action_projection,\n            },\n            key_path="artifact.finalize",\n        )\n        try:\n            run.stage["events.jsonl"] = self._events_jsonl(recorder)\n'''
          if 'budget_summary_snapshot = copy.deepcopy(dict(budget_summary))' not in text:
              if status_anchor not in text:
                  raise SystemExit('artifact finalization admission anchor missing')
              text = text.replace(status_anchor, status_fixed, 1)
          text = text.replace('"reason_codes": [] if status == "PASS" else list(reason_codes or (status,)),', '"reason_codes": [] if status == "PASS" else (reason_codes_snapshot or [status]),', 1)
          text = text.replace('"assertions": dict(assertions or {}),', '"assertions": assertions_snapshot,', 1)
          text = text.replace('"budget_outcome": dict(budget_summary),', '"budget_outcome": budget_summary_snapshot,', 1)
          text = text.replace('"budget_summary": dict(budget_summary),', '"budget_summary": budget_summary_snapshot,', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('.github/workflows/tibia-re-control-center-core.yml')
          text = p.read_text(encoding='utf-8')
          active4 = '      - docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-4.md\n'
          active5 = active4 + '      - docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-5.md\n'
          if 'isolation-5.md' not in text:
              if active4 not in text:
                  raise SystemExit('core workflow isolation-4 path anchor missing')
              text = text.replace(active4, active5)
          exact4 = "              'docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-4.md',\n"
          exact5 = exact4 + "              'docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-5.md',\n"
          if "'docs/agents/tasks/active/OTC-20260821-tibia-re-control-center-package-a-p1-isolation-5.md'," not in text:
              if exact4 not in text:
                  raise SystemExit('core workflow allowed_exact isolation-4 anchor missing')
              text = text.replace(exact4, exact5)
          p.write_text(text, encoding='utf-8')
          PY

          cat > tests/tools/tibia_re_control_center/test_isolation5_repairs.py <<'PY'
          from __future__ import annotations

          import threading
          import unittest
          from dataclasses import replace

          from test_codex_review_repairs import abort_scenario_json, make_request, make_stack

          from tools.tibia_re_control_center.artifact import ArtifactStore
          from tools.tibia_re_control_center.fake import FakeAdapter, ManualClock
          from tools.tibia_re_control_center.model import ActionStatus, Authority, PrivacyError
          from tools.tibia_re_control_center.recorder import Recorder
          from tools.tibia_re_control_center.scenario import action_request_hash, parse_and_validate


          class IsolationFiveRegressionTests(unittest.TestCase):
              def test_effect_request_requires_mutation_authority(self) -> None:
                  _, adapter, _, coordinator = make_stack(epoch="authority-p1")
                  adapter.add_capability("move", read=True, action=False)
                  original = make_request(coordinator, adapter, "read-authority-effect")
                  request_hash = action_request_hash(
                      schema_version=original.schema_version,
                      run_id=original.run_id,
                      step_id=original.step_id,
                      attempt_index=original.attempt_index,
                      kind=original.kind,
                      parameters=original.parameters,
                      timeout_ms=original.timeout_ms,
                      required_capability=original.required_capability,
                      required_authority=Authority.READ_ONLY,
                  )
                  request = replace(original, required_authority=Authority.READ_ONLY, action_request_hash=request_hash)
                  result = coordinator.execute_action(request)
                  self.assertEqual(ActionStatus.REFUSED, result.status)
                  self.assertEqual("MUTATION_AUTHORITY_REQUIRED", result.reason_code)
                  self.assertEqual([], adapter.physical_effects)

              def test_timeout_is_checked_after_last_authority_revalidation(self) -> None:
                  clock, adapter, _, coordinator = make_stack(epoch="last-timeout-p1")
                  request = make_request(coordinator, adapter, "last-timeout")
                  original = adapter.current_authority
                  calls = 0

                  def delayed_current_authority(authority):
                      nonlocal calls
                      calls += 1
                      result = original(authority)
                      if calls >= 3:
                          clock.advance_ms(request.timeout_ms + 1)
                      return result

                  adapter.current_authority = delayed_current_authority
                  result = coordinator.execute_action(request)
                  self.assertEqual(ActionStatus.TIMEOUT, result.status)
                  self.assertEqual("ACTION_TIMEOUT_EXPIRED", result.reason_code)
                  self.assertEqual([], adapter.physical_effects)

              def test_overlapping_stop_cleanup_remains_fenced(self) -> None:
                  _, adapter, _, coordinator = make_stack(epoch="overlap-stop-p1")
                  entered_first = threading.Event()
                  entered_second = threading.Event()
                  release_first = threading.Event()
                  release_second = threading.Event()
                  count_lock = threading.Lock()
                  count = 0

                  def blocking_stop(reason):
                      del reason
                      nonlocal count
                      with count_lock:
                          count += 1
                          current = count
                      if current == 1:
                          entered_first.set()
                          self.assertTrue(release_first.wait(2))
                      else:
                          entered_second.set()
                          self.assertTrue(release_second.wait(2))
                      adapter.emergency_stop_calls += 1

                  adapter.emergency_stop = blocking_stop
                  first = threading.Thread(target=coordinator.stop_all)
                  second = threading.Thread(target=coordinator.stop_all)
                  first.start()
                  self.assertTrue(entered_first.wait(1))
                  second.start()
                  self.assertFalse(entered_second.wait(0.05))
                  self.assertTrue(coordinator.stop_cleanup_in_progress)
                  release_first.set()
                  self.assertTrue(entered_second.wait(1))
                  self.assertTrue(coordinator.stop_cleanup_in_progress)
                  self.assertFalse(coordinator.reset_stop())
                  release_second.set()
                  first.join(2)
                  second.join(2)
                  self.assertFalse(first.is_alive())
                  self.assertFalse(second.is_alive())
                  self.assertFalse(coordinator.stop_cleanup_in_progress)

              def test_event_payload_is_recursively_immutable(self) -> None:
                  clock = ManualClock()
                  adapter = FakeAdapter(clock)
                  identity = adapter.identity()
                  recorder = Recorder(
                      clock,
                      backend_epoch="event-freeze",
                      adapter_id=identity.adapter_id,
                      adapter_generation=identity.adapter_generation,
                  )
                  event = recorder.record_event(kind="SNAPSHOT", payload={"nested": {"safe": "value"}})
                  with self.assertRaises(TypeError):
                      event.payload["password"] = "hunter2"
                  with self.assertRaises(TypeError):
                      event.payload["nested"]["password"] = "hunter2"
                  self.assertEqual("value", event.payload["nested"]["safe"])

              def test_finalize_rejects_secret_shaped_result_inputs(self) -> None:
                  scenario = parse_and_validate(abort_scenario_json())
                  clock = ManualClock()
                  adapter = FakeAdapter(clock)
                  identity = adapter.identity()
                  recorder = Recorder(
                      clock,
                      backend_epoch="finalize-privacy",
                      adapter_id=identity.adapter_id,
                      adapter_generation=identity.adapter_generation,
                  )
                  artifacts = ArtifactStore()
                  artifacts.create_run(
                      run_id="finalize-privacy",
                      scenario_id=scenario.scenario_id,
                      scenario_hash=scenario.scenario_hash,
                      scenario_ast=scenario.ast,
                      adapter_identity={"adapter_id": "fake"},
                      backend_epoch="finalize-privacy",
                      initial_control_generation=0,
                      started_monotonic_ns=0,
                      privacy_policy=scenario.ast["privacy_policy"],
                  )
                  with self.assertRaises(PrivacyError):
                      artifacts.finalize(
                          "finalize-privacy",
                          recorder=recorder,
                          action_results={},
                          requested_status="REFUSED",
                          final_control_generation=0,
                          budget_summary={"safe": 1},
                          assertions={"safe": True},
                          reason_codes=["PASSWORD=hunter2"],
                      )
                  self.assertNotIn("result.json", artifacts.runs["finalize-privacy"].stage)


          if __name__ == "__main__":
              unittest.main()
          PY

          rm -rf tools/tibia_re_control_center/__pycache__ tests/tools/tibia_re_control_center/__pycache__
          python3 -m compileall -q tools/tibia_re_control_center tests/tools/tibia_re_control_center
          PYTHONPATH=. python3 -m unittest discover -s tests/tools/tibia_re_control_center -p 'test_*.py'
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a.py
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a_p1.py
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1 >/dev/null
          ruff check --fix tools/tibia_re_control_center tests/tools/tibia_re_control_center/test_isolation5_repairs.py
          ruff check tools/tibia_re_control_center tests/tools/tibia_re_control_center/test_isolation5_repairs.py
          git diff --check
          rm -rf tools/tibia_re_control_center/__pycache__ tests/tools/tibia_re_control_center/__pycache__
          git rm .github/workflows/tibia-re-control-center-isolation5-repair.yml
          git config user.name 'blakinio'
          git config user.email '75369544+blakinio@users.noreply.github.com'
          git add -A
          git commit -m 'fix(control-center): close isolation-five P1 findings'
          git push origin "HEAD:$BRANCH"

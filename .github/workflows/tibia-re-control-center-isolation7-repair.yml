name: Package A isolation-7 one-shot repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feat/OTC-20260820-tibia-re-control-center-package-a'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply bounded isolation-seven repairs and validate
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin "$BRANCH"
          python3 - <<'PY'
          from pathlib import Path

          # Atomic adapter authority/capability guard at the durable dispatch boundary.
          p = Path('tools/tibia_re_control_center/fake.py')
          text = p.read_text(encoding='utf-8')
          if 'import threading\n' not in text:
              text = text.replace(
                  'from __future__ import annotations\n\n',
                  'from __future__ import annotations\n\nimport threading\nfrom contextlib import contextmanager\n',
                  1,
              )
          elif 'from contextlib import contextmanager\n' not in text:
              text = text.replace('import threading\n', 'import threading\nfrom contextlib import contextmanager\n', 1)
          init_anchor = '        self.clock = clock\n'
          if 'self._dispatch_state_lock = threading.RLock()' not in text:
              if init_anchor not in text:
                  raise SystemExit('fake lock init anchor missing')
              text = text.replace(init_anchor, init_anchor + '        self._dispatch_state_lock = threading.RLock()\n', 1)
          if 'self.dispatch_guard_hook:' not in text:
              hook_anchor = '        self.after_commit_hook: Callable[[], None] | None = None\n'
              if hook_anchor not in text:
                  raise SystemExit('fake dispatch hook anchor missing')
              text = text.replace(
                  hook_anchor,
                  hook_anchor + '        self.dispatch_guard_hook: Callable[[], None] | None = None\n',
                  1,
              )
          identity_anchor = '    def identity(self) -> AdapterIdentity:\n        return self._identity\n'
          if 'def dispatch_guard(self, request: ActionRequest):' not in text:
              if identity_anchor not in text:
                  raise SystemExit('fake identity anchor missing')
              guard = '''    @property\n    def allow_mutation(self) -> bool:\n        with self._dispatch_state_lock:\n            return self._allow_mutation\n\n    @allow_mutation.setter\n    def allow_mutation(self, value: bool) -> None:\n        with self._dispatch_state_lock:\n            self._allow_mutation = bool(value)\n\n    @property\n    def authority_available(self) -> bool:\n        with self._dispatch_state_lock:\n            return self._authority_available\n\n    @authority_available.setter\n    def authority_available(self, value: bool) -> None:\n        with self._dispatch_state_lock:\n            self._authority_available = bool(value)\n\n    @contextmanager\n    def dispatch_guard(self, request: ActionRequest):\n        with self._dispatch_state_lock:\n            callback_failed = False\n            try:\n                if self.dispatch_guard_hook is not None:\n                    self.dispatch_guard_hook()\n                # Preserve prior callback-driven revalidation semantics, then snapshot\n                # the authoritative backing state only after every callback has run.\n                self.current_authority(request.required_authority)\n                self.capability(request.required_capability)\n            except Exception:\n                callback_failed = True\n            identity = self._identity\n            capability = None if callback_failed else self._capabilities.get(request.required_capability)\n            authority_current = (\n                False\n                if callback_failed\n                else True\n                if request.required_authority == Authority.READ_ONLY\n                else bool(self._allow_mutation and self._authority_available)\n            )\n            yield identity, capability, authority_current\n\n    def identity(self) -> AdapterIdentity:\n        with self._dispatch_state_lock:\n            return self._identity\n'''
              text = text.replace(identity_anchor, guard, 1)
          set_identity_old = '''        self._identity = replace(\n            self._identity,\n            adapter_generation=self._identity.adapter_generation if adapter_generation is None else adapter_generation,\n            runtime_instance_id=self._identity.runtime_instance_id if runtime_instance_id is ... else runtime_instance_id,\n            session_epoch=self._identity.session_epoch if session_epoch is ... else session_epoch,\n        )\n'''
          set_identity_new = '''        with self._dispatch_state_lock:\n            self._identity = replace(\n                self._identity,\n                adapter_generation=self._identity.adapter_generation if adapter_generation is None else adapter_generation,\n                runtime_instance_id=self._identity.runtime_instance_id if runtime_instance_id is ... else runtime_instance_id,\n                session_epoch=self._identity.session_epoch if session_epoch is ... else session_epoch,\n            )\n'''
          if set_identity_new not in text:
              if set_identity_old not in text:
                  raise SystemExit('fake set_identity anchor missing')
              text = text.replace(set_identity_old, set_identity_new, 1)
          add_cap_old = '''        self._capabilities[capability_id] = Capability(\n            capability_id,\n            read_supported=read,\n            action_supported=action,\n            source="fake-fixture",\n        )\n'''
          add_cap_new = '''        with self._dispatch_state_lock:\n            self._capabilities[capability_id] = Capability(\n                capability_id,\n                read_supported=read,\n                action_supported=action,\n                source="fake-fixture",\n            )\n'''
          if add_cap_new not in text:
              if add_cap_old not in text:
                  raise SystemExit('fake add_capability anchor missing')
              text = text.replace(add_cap_old, add_cap_new, 1)
          cap_old = '''    def capability(self, capability_id: str) -> Capability | None:\n        return self._capabilities.get(capability_id)\n'''
          cap_new = '''    def capability(self, capability_id: str) -> Capability | None:\n        with self._dispatch_state_lock:\n            return self._capabilities.get(capability_id)\n'''
          if cap_new not in text:
              if cap_old not in text:
                  raise SystemExit('fake capability anchor missing')
              text = text.replace(cap_old, cap_new, 1)
          auth_old = '''    def current_authority(self, required: Authority) -> bool:\n        if required == Authority.READ_ONLY:\n            return True\n        return bool(self.allow_mutation and self.authority_available)\n'''
          auth_new = '''    def current_authority(self, required: Authority) -> bool:\n        with self._dispatch_state_lock:\n            if required == Authority.READ_ONLY:\n                return True\n            return bool(self._allow_mutation and self._authority_available)\n'''
          if auth_new not in text:
              if auth_old not in text:
                  raise SystemExit('fake current_authority anchor missing')
              text = text.replace(auth_old, auth_new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tools/tibia_re_control_center/execution.py')
          text = p.read_text(encoding='utf-8')
          hook_pos = text.index('            if final_commit_check is not None:\n')
          marker = '            if self.in_memory_stop or self.stop_cleanup_in_progress or self.control_state.stop_latched or self.control_state.recovery_required or self.mutation_disabled:\n                return False\n'
          start = text.index(marker, hook_pos) + len(marker)
          end = text.index('\n\n    def execute_action(', start)
          guarded = '''            with self.adapter.dispatch_guard(request) as (identity, capability, authority_current):\n                if identity.adapter_generation != fence.expected_adapter_generation:\n                    return False\n                if identity.runtime_instance_id != fence.expected_runtime_instance_id:\n                    return False\n                if identity.session_epoch != fence.expected_session_epoch:\n                    return False\n                if request.required_authority != Authority.MUTATION:\n                    return False\n                if capability is None or not capability.action_supported or not authority_current:\n                    return False\n                if self._deadline_expired(run):\n                    return False\n                if request.action_id not in run.budget.reservations:\n                    return False\n                if self.clock.now_ns() >= action_deadline_ns:\n                    final_commit_refusal_reason[0] = "ACTION_TIMEOUT_EXPIRED"\n                    return False\n                next_budget = self._move_reserved_to_at_risk(run.budget, request.action_id)\n                committed = record.with_state(\n                    LifecycleState.DISPATCH_COMMITTED,\n                    self.clock.now_ns(),\n                    dispatch_state=DispatchState.POSSIBLY_DISPATCHED,\n                    backend_epoch=self.backend_epoch,\n                    control_generation=self.control_generation,\n                    adapter_generation=identity.adapter_generation,\n                    runtime_instance_id=identity.runtime_instance_id,\n                    session_epoch=identity.session_epoch,\n                )\n                try:\n                    self.store.atomic_dispatch_commit(committed, next_budget)\n                except (DurabilityError, DurabilityTimeout):\n                    return False\n                run.budget = next_budget\n                return True'''
          text = text[:start] + guarded + text[end:]
          p.write_text(text, encoding='utf-8')

          # Admit and freeze every JSON-serializable sequence in event payloads.
          p = Path('tools/tibia_re_control_center/recorder.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from collections.abc import Mapping\n', 'from collections.abc import Mapping, Sequence\n', 1)
          seq_scan_old = '''    if isinstance(value, (list, tuple)):\n        for child in value:\n            ensure_no_secret_material(child, key_path=key_path)\n        return\n'''
          seq_scan_new = '''    if isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):\n        for child in value:\n            ensure_no_secret_material(child, key_path=key_path)\n        return\n'''
          if seq_scan_new not in text:
              if seq_scan_old not in text:
                  raise SystemExit('recorder secret sequence anchor missing')
              text = text.replace(seq_scan_old, seq_scan_new, 1)
          freeze_old = '''def _freeze_event_value(value: Any) -> Any:\n    if isinstance(value, Mapping):\n        return MappingProxyType({key: _freeze_event_value(child) for key, child in value.items()})\n    if isinstance(value, list):\n        return tuple(_freeze_event_value(child) for child in value)\n    if isinstance(value, tuple):\n        return tuple(_freeze_event_value(child) for child in value)\n    return value\n'''
          freeze_new = '''def _freeze_event_value(value: Any) -> Any:\n    if isinstance(value, Mapping):\n        return MappingProxyType({key: _freeze_event_value(child) for key, child in value.items()})\n    if isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):\n        return tuple(_freeze_event_value(child) for child in value)\n    if value is None or isinstance(value, (str, bool, int, float)):\n        return value\n    raise ValidationError("EVENT_PAYLOAD_TYPE_INVALID", "event payload must contain only admitted JSON value types")\n'''
          if freeze_new not in text:
              if freeze_old not in text:
                  raise SystemExit('recorder freeze function anchor missing')
              text = text.replace(freeze_old, freeze_new, 1)
          p.write_text(text, encoding='utf-8')

          # Latch aborts observed during wait polling.
          p = Path('tools/tibia_re_control_center/engine.py')
          text = p.read_text(encoding='utf-8')
          wait_old = '''                        checkpoint = last_snapshot\n\n                        def ready(\n                            bound_predicate=predicate,\n                            bound_checkpoint=checkpoint,\n                        ) -> bool:\n                            observed = self._snapshot_mapping(self.adapter.snapshot())\n                            return resolve_unknown_policy(\n                                evaluate_predicate(\n                                    bound_predicate,\n                                    observed,\n                                    checkpoint=bound_checkpoint,\n                                ),\n                                bound_predicate.unknown_policy,\n                            ) is True\n\n                        wait_result = self.coordinator.wait_until(\n                            run_id,\n                            ready,\n                            timeout_ms=int(step.body["timeout_ms"]),\n                        )\n                        if wait_result != "READY":\n                            status = "TIMEOUT" if wait_result == "TIMEOUT" else "CANCELLED"\n                            reason_codes.append(f"WAIT_{wait_result}")\n                            break\n'''
          wait_new = '''                        checkpoint = last_snapshot\n                        latched_abort_reason: list[str | None] = [None]\n\n                        def ready(\n                            bound_predicate=predicate,\n                            bound_checkpoint=checkpoint,\n                            bound_scenario: ValidatedScenario = scenario,\n                        ) -> bool:\n                            observed = self._snapshot_mapping(self.adapter.snapshot())\n                            abort_reason = self._abort_reason(bound_scenario, observed)\n                            if abort_reason is not None:\n                                latched_abort_reason[0] = abort_reason\n                                return True\n                            return resolve_unknown_policy(\n                                evaluate_predicate(\n                                    bound_predicate,\n                                    observed,\n                                    checkpoint=bound_checkpoint,\n                                ),\n                                bound_predicate.unknown_policy,\n                            ) is True\n\n                        wait_result = self.coordinator.wait_until(\n                            run_id,\n                            ready,\n                            timeout_ms=int(step.body["timeout_ms"]),\n                        )\n                        if latched_abort_reason[0] is not None:\n                            status = "CANCELLED"\n                            reason_codes.append(latched_abort_reason[0])\n                            break\n                        if wait_result != "READY":\n                            status = "TIMEOUT" if wait_result == "TIMEOUT" else "CANCELLED"\n                            reason_codes.append(f"WAIT_{wait_result}")\n                            break\n'''
          if wait_new not in text:
              if wait_old not in text:
                  raise SystemExit('engine wait anchor missing')
              text = text.replace(wait_old, wait_new, 1)
          p.write_text(text, encoding='utf-8')

          # Comparison cannot PASS required parity without checkpoint coverage.
          p = Path('tools/tibia_re_control_center/comparison.py')
          text = p.read_text(encoding='utf-8')
          compare_anchor = '''    results: list[FieldComparisonResult] = []\n    required_by_path = {field.path: field.required for field in profile.fields}\n    for pair in checkpoint_pairs:\n'''
          compare_fixed = '''    pairs = tuple(checkpoint_pairs)\n    if not pairs and any(field.required for field in profile.fields):\n        return ComparisonResult(\n            comparison_id,\n            profile.profile_id,\n            profile.profile_version,\n            reference_run_id,\n            candidate_run_id,\n            scenario_id,\n            ComparisonStatus.COVERAGE_INCOMPLETE,\n            (),\n            reason_code="REQUIRED_CHECKPOINT_COVERAGE_MISSING",\n        )\n    results: list[FieldComparisonResult] = []\n    required_by_path = {field.path: field.required for field in profile.fields}\n    for pair in pairs:\n'''
          if compare_fixed not in text:
              if compare_anchor not in text:
                  raise SystemExit('comparison coverage anchor missing')
              text = text.replace(compare_anchor, compare_fixed, 1)
          p.write_text(text, encoding='utf-8')

          # Artifact status is privacy-admitted and a closed Result-v1 enum.
          p = Path('tools/tibia_re_control_center/artifact.py')
          text = p.read_text(encoding='utf-8')
          const_anchor = 'from .recorder import (\n    Recorder,\n    ScreenshotDisposition,\n    ScreenshotRecord,\n    ensure_no_secret_material,\n)\n\n\n'
          if '_RUN_RESULT_STATUSES = {' not in text:
              if const_anchor not in text:
                  raise SystemExit('artifact status constant anchor missing')
              statuses = '''_RUN_RESULT_STATUSES = {\n    "PASS",\n    "FAIL",\n    "REFUSED",\n    "CANCELLED",\n    "TIMEOUT",\n    "AMBIGUOUS",\n    "INCOMPLETE",\n}\n\n\n'''
              text = text.replace(const_anchor, const_anchor + statuses, 1)
          finalize_pos = text.index('    def finalize(\n')
          run_anchor = '        run = self.runs[run_id]\n'
          run_pos = text.index(run_anchor, finalize_pos) + len(run_anchor)
          final_section = text[finalize_pos:text.index('\n    def validate_safety_precedence(', finalize_pos)]
          if 'INVALID_RUN_RESULT_STATUS' not in final_section:
              insertion = '''        ensure_no_secret_material(requested_status, key_path="artifact.requested_status")\n        if requested_status not in _RUN_RESULT_STATUSES:\n            raise ValidationError(\n                "INVALID_RUN_RESULT_STATUS",\n                "requested_status must be an Artifact v1 terminal status",\n            )\n'''
              text = text[:run_pos] + insertion + text[run_pos:]
          p.write_text(text, encoding='utf-8')
          PY

          cat > tests/tools/tibia_re_control_center/test_isolation7_repairs.py <<'PY'
          from __future__ import annotations

          import json
          import unittest
          from collections import UserList

          from test_codex_review_repairs import abort_scenario_json, make_request, make_stack

          from tools.tibia_re_control_center.artifact import ArtifactStore
          from tools.tibia_re_control_center.comparison import (
              ComparisonClass,
              ComparisonProfile,
              ComparisonStatus,
              ProfileField,
              compare_runs,
          )
          from tools.tibia_re_control_center.engine import ScenarioEngine
          from tools.tibia_re_control_center.execution import MutationCoordinator
          from tools.tibia_re_control_center.fake import FakeAdapter, ManualClock
          from tools.tibia_re_control_center.model import ActionStatus, PrivacyError, ValidationError
          from tools.tibia_re_control_center.recorder import Recorder
          from tools.tibia_re_control_center.scenario import parse_and_validate
          from tools.tibia_re_control_center.store import DeterministicDurableStore


          class IsolationSevenRegressionTests(unittest.TestCase):
              def test_atomic_final_dispatch_guard_observes_authority_revocation(self) -> None:
                  _, adapter, _, coordinator = make_stack(epoch="atomic-guard-p1")
                  request = make_request(coordinator, adapter, "atomic-guard")

                  def revoke_inside_guard() -> None:
                      adapter.authority_available = False

                  adapter.dispatch_guard_hook = revoke_inside_guard
                  result = coordinator.execute_action(request)
                  self.assertEqual(ActionStatus.REFUSED, result.status)
                  self.assertEqual([], adapter.physical_effects)

              def test_event_userlist_is_admitted_as_immutable_sequence(self) -> None:
                  clock = ManualClock()
                  adapter = FakeAdapter(clock)
                  identity = adapter.identity()
                  recorder = Recorder(
                      clock,
                      backend_epoch="sequence-freeze",
                      adapter_id=identity.adapter_id,
                      adapter_generation=identity.adapter_generation,
                  )
                  source = UserList(["safe"])
                  event = recorder.record_event(kind="SNAPSHOT", payload={"sequence": source})
                  source.append("PASSWORD=hunter2")
                  self.assertEqual(("safe",), event.payload["sequence"])
                  with self.assertRaises(PrivacyError):
                      recorder.record_event(
                          kind="SNAPSHOT",
                          payload={"sequence": UserList(["PASSWORD=hunter2"])},
                      )

              def test_wait_poll_latches_transient_abort_before_later_action(self) -> None:
                  scenario_data = json.loads(abort_scenario_json())
                  scenario_data["id"] = "wait-abort-latch"
                  scenario_data["abort_conditions"] = [
                      {
                          "condition": {
                              "field": "player.hp",
                              "op": "LTE",
                              "value": 10,
                              "unknown_policy": "FAIL",
                          },
                          "reason_code": "CLIENT_NOT_IN_GAME",
                      }
                  ]
                  scenario_data["steps"] = [
                      {
                          "wait": {
                              "condition": {
                                  "field": "player.mana",
                                  "op": "LT",
                                  "value": 50,
                                  "unknown_policy": "FAIL",
                              },
                              "timeout_ms": 10,
                          }
                      },
                      {
                          "action": {
                              "kind": "move",
                              "parameters": {"direction": "NORTH", "tiles": 1},
                              "timeout_ms": 1000,
                          }
                      },
                  ]
                  scenario = parse_and_validate(json.dumps(scenario_data))
                  clock = ManualClock()
                  adapter = FakeAdapter(clock)
                  adapter.add_capability("move")
                  coordinator = MutationCoordinator(
                      adapter,
                      DeterministicDurableStore(),
                      clock,
                      backend_epoch="wait-abort",
                  )
                  recorder = Recorder(
                      clock,
                      backend_epoch=coordinator.backend_epoch,
                      adapter_id=adapter.identity().adapter_id,
                      adapter_generation=adapter.identity().adapter_generation,
                  )

                  def controlled_wait(run_id, predicate, *, timeout_ms, token=None, poll_ms=1):
                      del run_id, timeout_ms, token, poll_ms
                      player = adapter.snapshot_values["player"]
                      player["hp"] = 5
                      player["mana"] = 100
                      first = predicate()
                      player["hp"] = 100
                      player["mana"] = 0
                      if first:
                          return "READY"
                      return "READY" if predicate() else "TIMEOUT"

                  coordinator.wait_until = controlled_wait
                  result = ScenarioEngine(
                      adapter=adapter,
                      coordinator=coordinator,
                      artifacts=ArtifactStore(),
                      recorder=recorder,
                  ).run(scenario, run_id="wait-abort-run")
                  self.assertEqual("CANCELLED", result.status)
                  self.assertIn("CLIENT_NOT_IN_GAME", result.reason_codes)
                  self.assertEqual([], adapter.physical_effects)

              def test_required_comparison_without_checkpoints_is_incomplete(self) -> None:
                  profile = ComparisonProfile(
                      "required-profile",
                      "1",
                      (ProfileField("player.hp", ComparisonClass.EXACT, required=True),),
                  )
                  result = compare_runs(
                      comparison_id="comparison-empty",
                      profile=profile,
                      reference_run_id="reference",
                      candidate_run_id="candidate",
                      scenario_id="scenario",
                      reference_scenario_hash="a" * 64,
                      candidate_scenario_hash="a" * 64,
                      checkpoint_pairs=(),
                      reference_observations={},
                      candidate_observations={},
                  )
                  self.assertEqual(ComparisonStatus.COVERAGE_INCOMPLETE, result.status)
                  self.assertEqual("REQUIRED_CHECKPOINT_COVERAGE_MISSING", result.reason_code)

              def test_artifact_requested_status_is_closed_enum(self) -> None:
                  scenario = parse_and_validate(abort_scenario_json())
                  clock = ManualClock()
                  adapter = FakeAdapter(clock)
                  identity = adapter.identity()
                  recorder = Recorder(
                      clock,
                      backend_epoch="invalid-status",
                      adapter_id=identity.adapter_id,
                      adapter_generation=identity.adapter_generation,
                  )
                  artifacts = ArtifactStore()
                  artifacts.create_run(
                      run_id="invalid-status",
                      scenario_id=scenario.scenario_id,
                      scenario_hash=scenario.scenario_hash,
                      scenario_ast=scenario.ast,
                      adapter_identity={"adapter_id": "fake"},
                      backend_epoch="invalid-status",
                      initial_control_generation=0,
                      started_monotonic_ns=0,
                      privacy_policy=scenario.ast["privacy_policy"],
                  )
                  with self.assertRaises(ValidationError) as raised:
                      artifacts.finalize(
                          "invalid-status",
                          recorder=recorder,
                          action_results={},
                          requested_status="SUCCESS",
                          final_control_generation=0,
                          budget_summary={"safe": 1},
                      )
                  self.assertEqual("INVALID_RUN_RESULT_STATUS", raised.exception.code)
                  self.assertNotIn("result.json", artifacts.runs["invalid-status"].stage)


          if __name__ == "__main__":
              unittest.main()
          PY

          rm -rf tools/tibia_re_control_center/__pycache__ tests/tools/tibia_re_control_center/__pycache__
          python3 -m compileall -q tools/tibia_re_control_center tests/tools/tibia_re_control_center
          PYTHONPATH=. python3 -m unittest discover -s tests/tools/tibia_re_control_center -p 'test_*.py'
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a.py
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a_p1.py
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1 >/dev/null
          ruff check --fix tools/tibia_re_control_center tests/tools/tibia_re_control_center/test_isolation7_repairs.py
          ruff check tools/tibia_re_control_center tests/tools/tibia_re_control_center/test_isolation7_repairs.py
          git diff --check
          rm -rf tools/tibia_re_control_center/__pycache__ tests/tools/tibia_re_control_center/__pycache__
          git rm .github/workflows/tibia-re-control-center-isolation7-repair.yml
          git config user.name 'blakinio'
          git config user.email '75369544+blakinio@users.noreply.github.com'
          git add -A
          git commit -m 'fix(control-center): close isolation-seven findings'
          git push origin "HEAD:$BRANCH"

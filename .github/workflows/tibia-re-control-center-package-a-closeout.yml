name: TIBIA RE Control Center Package A lifecycle closeout

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tibia-re-control-center-package-a-closeout
  cancel-in-progress: false

jobs:
  closeout:
    if: github.repository == 'blakinio/otclient' && github.event.pull_request.head.ref == 'docs/OTC-20260820-control-center-package-a-closeout'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: docs/OTC-20260820-control-center-package-a-closeout
          fetch-depth: 0
          persist-credentials: true

      - name: Archive Package A lifecycle
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 13b3f02a07a176662d766352d9af39619775a73d HEAD
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          MERGE = "13b3f02a07a176662d766352d9af39619775a73d"
          AUDITED_HEAD = "d66b59724e9f1856a8007a4f57d9c644600a6134"
          PR = os.environ["PR_NUMBER"]
          UPDATED = "2026-08-21T17:18:00+02:00"
          TASK_IDS = [
              "OTC-20260820-tibia-re-control-center-package-a",
              "OTC-20260820-tibia-re-control-center-package-a-p1-isolation",
              "OTC-20260821-tibia-re-control-center-package-a-p1-isolation-2",
              "OTC-20260821-tibia-re-control-center-package-a-p1-isolation-3",
              "OTC-20260821-tibia-re-control-center-package-a-p1-isolation-4",
              "OTC-20260821-tibia-re-control-center-package-a-p1-isolation-5",
              "OTC-20260821-tibia-re-control-center-package-a-p1-isolation-6",
              "OTC-20260821-tibia-re-control-center-package-a-p1-isolation-7",
          ]

          terminal = f'''\n\n## Terminal Package A lifecycle closeout\n\nPackage A / `control-core` is terminally complete. Source PR #628 squash-merged as `{MERGE}` after exact-head validation and a fresh independent Codex Spark review of `{AUDITED_HEAD}` returned no major/material findings. This record becomes authoritative when lifecycle closeout PR #{PR} merges.\n\n```yaml\ncloseout:\n  implementation_complete: true\n  vertical_slice_complete: true\n  delivery_classification: backend_only\n  user_facing_feature_complete: false\n  audit:\n    result: PASS\n    independent_validator: Codex Spark exact-head review\n    audited_head: {AUDITED_HEAD}\n    material_findings_open: 0\n  e2e:\n    result: NOT_APPLICABLE\n    reason: lifecycle closeout is documentation-only; Package A behavior was validated by the fake one-step non-UI E2E with runtime_access:none before source merge\n  final_ci:\n    head: {AUDITED_HEAD}\n    result: PASS\n    required_checks:\n      - TIBIA RE Control Center Package A run 32495289822 SUCCESS\n      - Track A agent runtime governance run 32495289937 SUCCESS\n      - repository CI run 32495290189 SUCCESS\n  merge:\n    pr: 628\n    merge_commit: {MERGE}\n  pull_requests:\n    open_related_prs: 0\n    unresolved_review_threads: 0\n    terminal_prs:\n      - blakinio/otclient#628 merged as {MERGE}\n      - blakinio/otclient#{PR} merged lifecycle closeout (effective when this archive reaches main)\n  task_status: completed\n  task_archived: true\n  ownership_released: true\n  stale_branches_reconciled: true\n```\n\nNo official Tibia runtime, credentials, login, GUI/gameplay input, network listener, local Ollama/model, or Track A mutation was used by this lifecycle closeout. Package B and later packages remain separate work and are not claimed complete here.\n'''

          for task_id in TASK_IDS:
              src = Path("docs/agents/tasks/active") / f"{task_id}.md"
              dst = Path("docs/agents/tasks/archive") / f"{task_id}.md"
              if not src.is_file():
                  raise SystemExit(f"missing active task: {src}")
              if dst.exists():
                  raise SystemExit(f"archive already exists: {dst}")
              text = src.read_text(encoding="utf-8-sig")
              text, n = re.subn(r"(?m)^status:\s*.*$", "status: completed", text, count=1)
              if n != 1:
                  raise SystemExit(f"status field missing: {src}")
              text, _ = re.subn(r"(?m)^phase:\s*.*$", "phase: close", text, count=1)
              text, _ = re.subn(r"(?m)^updated:\s*.*$", f"updated: {UPDATED}", text, count=1)
              first = text.find("---\n")
              second = text.find("\n---\n", first + 4)
              if first != 0 or second < 0:
                  raise SystemExit(f"front matter malformed: {src}")
              front = text[:second]
              rest = text[second:]
              if not re.search(r"(?m)^ownership_released:\s*true$", front):
                  front += "\nownership_released: true"
              text = front + rest
              if "## Terminal Package A lifecycle closeout" not in text:
                  text = text.rstrip() + terminal
              src.write_text(text, encoding="utf-8")
              dst.parent.mkdir(parents=True, exist_ok=True)
              src.rename(dst)

          catalog_path = Path("docs/agents/MODULE_CATALOG.md")
          catalog = catalog_path.read_text(encoding="utf-8")
          replacement = (
              f"| TIBIA RE Control Center / E2E Lab contracts + Package A control-core | contracts merged PR #613; Package A merged PR #628; lifecycle closeout PR #{PR} | "
              "Normative Scenario/Execution/Adapter/Control-API/Artifact/Comparison/Policy contracts plus the merged deterministic Package A control-core: bounded scenario parsing/JCS hashes, MutationCoordinator, durable STOP/reset/recovery and action/budget ledgers, privacy-safe recorder/artifacts, semantic comparison and deterministic fake adapter | "
              "`docs/agents/programs/TIBIA_RE_CONTROL_CENTER_E2E.md`, `docs/agents/contracts/TIBIA_RE_CONTROL_CENTER_*.md`, `tools/tibia_re_control_center/**`, `tests/tools/tibia_re_control_center/**`, `.github/workflows/tibia-re-control-center-core.yml` | "
              "Package A is backend-only and complete with `runtime_access:none`; it creates no Control API/browser/CLI listener, Surveyor runtime integration, Official Tibia mutation adapter, local-model authority or Oteryn adapter. Package B and later packages remain separate consumers. |"
          )
          lines = catalog.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("| TIBIA RE Control Center / E2E Lab contracts |") or line.startswith("| TIBIA RE Control Center / E2E Lab contracts + Package A control-core |")]
          if len(matches) != 1:
              raise SystemExit(f"catalog Control Center row count={len(matches)}")
          lines[matches[0]] = replacement
          catalog_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          changelog_path = Path("docs/agents/CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          entry = (
              f"- 2026-08-21: TIBIA RE Control Center Package A / `control-core` merged in PR #628 as `{MERGE}` and is terminally archived by lifecycle closeout PR #{PR}. The backend-only package provides deterministic Scenario/Execution/Adapter/Artifact/Comparison semantics, durable STOP/idempotency/budget fencing, privacy-at-construction hardening, 121 focused regression tests plus the 65 mandatory falsification inventory and fake one-step E2E. Final exact-head Package A, Track A governance and repository CI passed, and fresh Codex Spark review reported no major/material findings. `runtime_access:none`; Package B and later Control Center consumers remain separate.\n"
          )
          if entry not in changelog:
              if marker not in changelog:
                  raise SystemExit("CHANGELOG Unreleased marker missing")
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          for task_id in TASK_IDS:
              if (Path("docs/agents/tasks/active") / f"{task_id}.md").exists():
                  raise SystemExit(f"active task survived: {task_id}")
              archived = Path("docs/agents/tasks/archive") / f"{task_id}.md"
              text = archived.read_text(encoding="utf-8")
              for required in ("status: completed", "ownership_released: true", f"merge_commit: {MERGE}"):
                  if required not in text:
                      raise SystemExit(f"archive invariant missing {required}: {task_id}")
          PY

          git rm .github/workflows/tibia-re-control-center-package-a-closeout.yml
          git add docs/agents/MODULE_CATALOG.md docs/agents/CHANGELOG.md docs/agents/tasks/active docs/agents/tasks/archive
          git diff --cached --check
          git diff --cached --name-status
          test ! -e .github/workflows/tibia-re-control-center-package-a-closeout.yml
          git config user.name 'blakinio'
          git config user.email '75369544+blakinio@users.noreply.github.com'
          git commit -m 'docs(agents): close Control Center Package A lifecycle'
          git push origin HEAD:docs/OTC-20260820-control-center-package-a-closeout

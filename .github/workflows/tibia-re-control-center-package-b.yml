name: TIBIA RE Control Center Package B

on:
  pull_request:
    branches: [main]
    paths:
      - tools/tibia_re_control_center/**
      - tests/tools/tibia_re_control_center/**
      - docs/agents/tasks/active/OTC-20260823-tibia-re-control-center-package-b.md
      - docs/agents/tasks/archive/OTC-20260823-tibia-re-control-center-package-b.md
      - docs/agents/evidence/OTC-20260823-tibia-re-control-center-package-b/**
      - .github/workflows/tibia-re-control-center-package-b.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-b-regression:
    name: Package B full regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile and run complete Control Center suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q tools/tibia_re_control_center tests/tools/tibia_re_control_center
          PYTHONPATH=. python3 -m unittest discover -s tests/tools/tibia_re_control_center -v
      - name: Verify explicit Package B mandatory coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('tests/tools/tibia_re_control_center/test_package_b.py').read_text(encoding='utf-8'))
          names = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          missing = [index for index in range(1, 40) if not any(name.startswith(f'test_{index:02d}_') for name in names)]
          if missing:
              raise SystemExit(f'missing Package B mandatory tests: {missing}')
          print('PACKAGE_B_MANDATORY_TESTS=39/39')
          PY
      - name: Ruff and whitespace validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1
          ruff check tools/tibia_re_control_center tests/tools/tibia_re_control_center/test_package_b.py tests/tools/tibia_re_control_center/audit_package_b.py tests/tools/tibia_re_control_center/e2e_package_b.py
          git diff --check origin/main...HEAD

  package-b-fresh-audit:
    name: Fresh Package B falsification audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run independent boundary and safety audit
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_b.py | tee /tmp/package-b-audit.txt
          grep -F 'PACKAGE_B_AUDIT=PASS' /tmp/package-b-audit.txt
          grep -F 'OFFICIAL_CLIENT_ACCESS=NONE' /tmp/package-b-audit.txt

  package-b-browser-cli-e2e:
    name: Package B real browser + CLI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run real Chromium browser and CLI against loopback backend
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/e2e_package_b.py | tee /tmp/package-b-e2e.txt
          grep -F 'PACKAGE_B_BROWSER=PASS' /tmp/package-b-e2e.txt
          grep -F 'PACKAGE_B_CLI=PASS' /tmp/package-b-e2e.txt
          grep -F 'PACKAGE_B_IDEMPOTENCY_RESTART=PASS' /tmp/package-b-e2e.txt
          grep -F 'OFFICIAL_CLIENT_ACCESS=NONE' /tmp/package-b-e2e.txt
          grep -F 'PACKAGE_B_E2E=PASS' /tmp/package-b-e2e.txt

name: Tibia worldmap reconstruction validation

on:
  push:
    branches: [feat/OTC-20260812-worldmap-reconstruction]
    paths: [.github/workflows/tibia-worldmap-reconstruction-validation.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Focused tests and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. python3 tests/tools/tibia_worldmap_reconstruction/test_pipeline.py
          python3 -m py_compile tools/tibia_worldmap_reconstruction/pipeline.py tools/tibia_worldmap_reconstruction/cli.py
      - name: Synthetic CLI end-to-end
        shell: bash
        run: |
          set -Eeuo pipefail
          d=$(mktemp -d)
          cat >"$d/obs.json" <<'JSON'
          {"schema":"otclient.worldmap.observation.v1","client_version":"15.32.df7b29","observations":[{"position":{"x":32000,"y":32001,"z":7},"contents":[100,200,900],"provenance":{"source":"synthetic-ci","capture_id":"one"}},{"position":{"x":32000,"y":32001,"z":7},"contents":[100,200,900],"provenance":{"source":"synthetic-ci","capture_id":"two"}}]}
          JSON
          cat >"$d/catalog.json" <<'JSON'
          {"schema":"otclient.worldmap.appearance-catalog.v1","client_version":"15.32.df7b29","appearances":[{"client_id":100,"roles":["ground"],"evidence":"synthetic"},{"client_id":200,"roles":["static"],"evidence":"synthetic"},{"client_id":900,"roles":["creature","dynamic"],"evidence":"synthetic"}]}
          JSON
          cat >"$d/map.json" <<'JSON'
          {"schema":"otclient.worldmap.otb-mapping.v1","client_version":"15.32.df7b29","otb_version":"synthetic-v1","mappings":[{"client_id":100,"otb_id":1100,"evidence":"synthetic"},{"client_id":200,"otb_id":1200,"evidence":"synthetic"}]}
          JSON
          cat >"$d/ref.json" <<'JSON'
          {"schema":"otclient.worldmap.reference.v1","source":"synthetic-reference","otb_version":"synthetic-v1","tiles":[{"position":{"x":32000,"y":32001,"z":7},"ground_otb_id":1100,"static_otb_ids":[1200]}]}
          JSON
          python3 -m tools.tibia_worldmap_reconstruction.cli reconstruct --observations "$d/obs.json" --catalog "$d/catalog.json" --mapping "$d/map.json" --output "$d/snapshot.json"
          python3 -m tools.tibia_worldmap_reconstruction.cli compare --snapshot "$d/snapshot.json" --reference "$d/ref.json" --output "$d/diff.json"
          python3 -m tools.tibia_worldmap_reconstruction.cli plan-otbm --snapshot "$d/snapshot.json" --output "$d/plan.json"
          python3 - "$d" <<'PY'
          import json,pathlib,sys
          d=pathlib.Path(sys.argv[1])
          diff=json.loads((d/'diff.json').read_text())
          plan=json.loads((d/'plan.json').read_text())
          assert diff['diffs'][0]['status']=='MATCH', diff
          assert plan['exportable'] is True and len(plan['tiles'])==1, plan
          print('SYNTHETIC_RECONSTRUCT_COMPARE_PLAN_PASS=true')
          PY

name: Tibia bounded worldmap walk

on:
  push:
    branches: [ci/OTC-20260727-tibia-linux-runner-analysis]
    paths: [.github/workflows/tibia-worldmap-walk.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-bounded-worldmap-walk
  cancel-in-progress: false

env:
  CONTAINER_NAME: otclient-tibia-login-analysis

jobs:
  walk:
    name: Walk authenticated Tibia session without OCR
    runs-on: [self-hosted, otclient, synology]
    timeout-minutes: 10
    steps:
      - name: Verify exact runner and task-owned live session
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "synology-otclient-01" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "otclient" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-login-no-ocr" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.task" }}' "$CONTAINER_NAME")" == "OTC-20260727-tibia-linux-runner-analysis" ]]
          docker exec "$CONTAINER_NAME" bash -lc "! command -v tesseract >/dev/null 2>&1"
          docker exec "$CONTAINER_NAME" pgrep -f 'packages/Tibia/bin/client' >/dev/null
          echo TASK_OWNED_CLIENT_ALIVE=true

      - name: Verify tunneled TCP confinement before walking
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          pid=$(pgrep -f 'packages/Tibia/bin/client' | head -n1)
          [[ -n "$pid" ]]
          sockets=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          direct=$(printf '%s\n' "$sockets" | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -c . || true)
          local=$(printf '%s\n' "$sockets" | awk '{print $5}' | grep -Ec '^(127\.0\.0\.1|\[::1\]):25344$' || true)
          echo "ACTIVE_LOCAL_SOCKS_COUNT_BEFORE=$local"
          echo "ACTIVE_DIRECT_TCP_COUNT_BEFORE=$direct"
          [[ "$direct" == 0 ]]
          (( local > 0 ))
          INNER

      - name: Send bounded walk sequence
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/analysis/current/home
          pid=$(pgrep -f 'packages/Tibia/bin/client' | head -n1)
          [[ -n "$pid" ]]
          best=''; best_area=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p')
            height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height))
            if (( area > best_area )); then best=$w; best_area=$area; fi
          done
          [[ -n "$best" ]]
          xdotool windowactivate --sync "$best" || true
          for key in Right Right Left Left Up Up Down Down Right Left Up Down; do
            xdotool key --window "$best" "$key"
            sleep 0.65
            kill -0 "$pid"
          done
          echo WALK_KEYS_SENT=12
          echo WALK_SEQUENCE=RRLLUUDDRLUD
          INNER

      - name: Verify live session retained after walking
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          pid=$(pgrep -f 'packages/Tibia/bin/client' | head -n1)
          [[ -n "$pid" ]]
          kill -0 "$pid"
          sockets=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          direct=$(printf '%s\n' "$sockets" | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -c . || true)
          local=$(printf '%s\n' "$sockets" | awk '{print $5}' | grep -Ec '^(127\.0\.0\.1|\[::1\]):25344$' || true)
          echo "ACTIVE_LOCAL_SOCKS_COUNT_AFTER=$local"
          echo "ACTIVE_DIRECT_TCP_COUNT_AFTER=$direct"
          [[ "$direct" == 0 ]]
          (( local > 0 ))
          echo LIVE_SESSION_RETAINED_AFTER_WALK=true
          INNER

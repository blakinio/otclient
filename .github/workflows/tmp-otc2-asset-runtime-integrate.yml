name: Temporary OTC2 asset-runtime integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: tmp-otc2-asset-runtime-integrate
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'tmp/OTC2-20260801-asset-runtime-integrate'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: "feat/OTC2-20260801-playability-p1-asset-pack-runtime"
          fetch-depth: 0
          show-progress: false
          token: ${{ github.token }}

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Minimize lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo +1.94.0 update --manifest-path oteryn-client/Cargo.toml -p ipnet --precise 2.12.0
          cargo +1.94.0 update --manifest-path oteryn-client/Cargo.toml -p libredox --precise 0.1.18
          git add oteryn-client/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(asset-runtime): minimize workspace lockfile"
            git push origin HEAD:feat/OTC2-20260801-playability-p1-asset-pack-runtime
          fi

      - name: Validate focused package
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.94.0 fmt --all --manifest-path oteryn-client/Cargo.toml -- --check
          cargo +1.94.0 clippy --manifest-path oteryn-client/Cargo.toml -p oteryn-asset-runtime --all-targets -- -D warnings
          cargo +1.94.0 test --manifest-path oteryn-client/Cargo.toml -p oteryn-asset-runtime

name: Temporary OTC2 game-domain lockfile minimization

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: tmp-otc2-game-domain-lock-minimize
  cancel-in-progress: true

jobs:
  minimize:
    if: github.head_ref == 'tmp/OTC2-20260801-game-domain-lockgen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: "feat/OTC2-20260801-playability-p1-game-domain-contract"
          fetch-depth: 0
          show-progress: false
          token: ${{ github.token }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc --version | grep '^rustc 1\.94\.0 '
          cargo --version

      - name: Restore unrelated indirect versions with Cargo
        working-directory: oteryn-client
        run: |
          cargo update -p ipnet --precise 2.12.0
          cargo update -p libredox --precise 0.1.18
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Verify and commit lockfile-only repair
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "oteryn-client/Cargo.lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- oteryn-client/Cargo.lock
          git commit -m "build(game-domain): minimize workspace lockfile diff"
          git push origin HEAD:feat/OTC2-20260801-playability-p1-game-domain-contract

name: Temporary OTC2 game-domain lockfile regeneration

on:
  push:
    branches:
      - "tmp/OTC2-20260801-game-domain-lockgen"

permissions:
  contents: write

concurrency:
  group: tmp-otc2-game-domain-lockgen
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: "feat/OTC2-20260801-playability-p1-game-domain-contract"
          fetch-depth: 0
          show-progress: false
          token: ${{ github.token }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc --version | grep '^rustc 1\.94\.0 '
          cargo --version

      - name: Regenerate lockfile only
        working-directory: oteryn-client
        run: cargo generate-lockfile

      - name: Commit generated lockfile to task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- oteryn-client/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git commit -m "build(game-domain): regenerate workspace lockfile"
          git push origin HEAD:feat/OTC2-20260801-playability-p1-game-domain-contract

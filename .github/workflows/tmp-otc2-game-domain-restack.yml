name: Temporary OTC2 game-domain exact-main restack

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: tmp-otc2-game-domain-restack
  cancel-in-progress: true

jobs:
  restack:
    if: github.head_ref == 'tmp/OTC2-20260801-game-domain-lockgen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: "feat/OTC2-20260801-playability-p1-game-domain-contract"
          fetch-depth: 0
          show-progress: false
          token: ${{ github.token }}

      - name: Merge exact current main into task branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          before="$(git rev-parse HEAD)"
          base="$(git rev-parse origin/main)"
          git merge --no-edit --no-ff "$base"
          after="$(git rev-parse HEAD)"
          test "$after" != "$before"
          test "$(git rev-parse HEAD^2)" = "$base"
          git push origin HEAD:feat/OTC2-20260801-playability-p1-game-domain-contract

name: Temporary OTC2 input-actions rotation checkpoint

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: tmp-otc2-input-actions-rotation-checkpoint
  cancel-in-progress: true

jobs:
  checkpoint:
    if: github.head_ref == 'tmp/OTC2-20260801-input-actions-integrate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: "feat/OTC2-20260801-playability-p1-input-actions"
          fetch-depth: 1
          show-progress: false
          token: ${{ github.token }}

      - name: Persist rotation checkpoint without recursive CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/agents/tasks/active/OTC2-20260801-playability-p1-input-actions.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "phase: final-heavy-validation": "phase: rotation-required",
              "updated: 2026-08-02T21:57:00+02:00": "updated: 2026-08-02T22:03:00+02:00",
              "last_progress_at: 2026-08-02T21:57:00+02:00": "last_progress_at: 2026-08-02T22:03:00+02:00",
              "phase: final-heavy-validation\ncontext_routes:": "phase: rotation-required\ncontext_routes:",
              "unknown:\n  - Full workspace Clippy/tests and architecture outcome on the completely formatted head.": "unknown:\n  - A fresh-session final heavy outcome after the unrelated app-runtime flake.",
              "blockers: []\nnext_action: Inspect the second and final retained Rust Client and repository CI runs on this checkpoint head; when green, mark ready, auto-merge and archive separately.": "blockers:\n  - Two retained heavy attempts were consumed in this session: the first failed only on omitted rustfmt files; the second passed metadata, rustfmt, strict workspace Clippy and supply-chain but hit the unrelated flaky app-runtime shutdown test before architecture.\nnext_action: In a fresh execution session, run one exact-head retained heavy gate on the unchanged input-actions implementation head; if green, mark ready, auto-merge and archive separately.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing checkpoint marker: {old}")
              text = text.replace(old, new, 1)

          marker = "  - command: exact changed-path, API, architecture and lockfile audit\n    result: PASS\n"
          addition = """  - command: second retained heavy run 30764535021 / Windows job 91540801099\n    result: FAIL_UNRELATED_TEST\n    evidence: locked metadata, rustfmt, strict workspace Clippy and supply-chain job 91540801090 passed; existing app-runtime shutdown test failed before architecture.\n  - command: targeted diagnostic run 30764694730 / job 91541216153\n    result: PASS\n    evidence: the exact unrelated app-runtime shutdown test passed five consecutive times on the same input-actions head and pinned toolchain, confirming a non-deterministic external failure.\n"""
          if marker not in text:
              raise SystemExit("validation insertion marker missing")
          text = text.replace(marker, marker + addition, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git add docs/agents/tasks/active/OTC2-20260801-playability-p1-input-actions.md
          git commit -m "docs(agents): checkpoint input-actions rotation"
          git push origin HEAD:feat/OTC2-20260801-playability-p1-input-actions

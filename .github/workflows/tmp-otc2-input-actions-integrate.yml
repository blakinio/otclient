name: Temporary OTC2 input-actions integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: tmp-otc2-input-actions-integrate
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'tmp/OTC2-20260801-input-actions-integrate'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: "feat/OTC2-20260801-playability-p1-input-actions"
          fetch-depth: 0
          show-progress: false
          token: ${{ github.token }}

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Repair focused lint findings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          source = Path("oteryn-client/crates/input-actions/src/lib.rs")
          text = source.read_text(encoding="utf-8")
          replacements = {
              "&[chord.clone()]": "std::slice::from_ref(&chord)",
              "        let stream = vec![": "        let stream = [",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing expected lint finding: {old}")
              text = text.replace(old, new, 1)
          closing = "            NormalizedInputEvent::DeviceLost,\n        ];"
          if closing not in text:
              raise SystemExit("synthetic stream closing marker missing")
          text = text.replace(
              closing,
              "            NormalizedInputEvent::DeviceLost,\n        ];",
              1,
          )
          source.write_text(text, encoding="utf-8", newline="\n")
          PY

          cargo +1.94.0 fmt --all --manifest-path oteryn-client/Cargo.toml
          git add oteryn-client/crates/input-actions/src/lib.rs
          git commit -m "test(input): satisfy strict focused lints"
          git push origin HEAD:feat/OTC2-20260801-playability-p1-input-actions

      - name: Validate focused package
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.94.0 fmt --all --manifest-path oteryn-client/Cargo.toml -- --check
          cargo +1.94.0 clippy --manifest-path oteryn-client/Cargo.toml -p oteryn-input-actions --all-targets -- -D warnings
          cargo +1.94.0 test --manifest-path oteryn-client/Cargo.toml -p oteryn-input-actions

name: Temporary Package A P1 repair

on:
  push:
    branches:
      - feat/OTC-20260820-tibia-re-control-center-package-a

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'blakinio/otclient' &&
      github.ref == 'refs/heads/feat/OTC-20260820-tibia-re-control-center-package-a'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true
          fetch-depth: 2

      - name: Verify one-shot parent
        shell: bash
        env:
          EXPECTED_PARENT: 599070d22d1803100fe7c69f3e4178630c5701ab
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply deterministic review repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/tools/tibia_re_control_center/_p1_repair.py

      - name: Validate repaired Package A
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q tools/tibia_re_control_center tests/tools/tibia_re_control_center
          PYTHONPATH=. python3 -m unittest discover -s tests/tools/tibia_re_control_center -v
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a.py
          PYTHONPATH=. python3 tests/tools/tibia_re_control_center/audit_package_a_p1.py
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1
          ruff check tools/tibia_re_control_center \
            tests/tools/tibia_re_control_center/test_codex_review_repairs.py \
            tests/tools/tibia_re_control_center/audit_package_a_p1.py

      - name: Remove one-shot repair machinery
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tests/tools/tibia_re_control_center/_p1_repair.py
          rm .github/workflows/tmp-package-a-p1-repair.yml
          git diff --check

      - name: Commit repaired exact head
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'repair produced no diff'; exit 1; }
          git commit -m "fix(track-a): harden Control Center Package A review findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"

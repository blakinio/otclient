name: Track A auth session coordinator strict audit

on:
  push:
    branches:
      - docs/OTC-20260819-track-a-auth-session-coordinator-audit
    paths:
      - .github/workflows/track-a-auth-session-coordinator-audit-strict.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-auth-session-coordinator-audit-strict.yml

permissions:
  contents: read

concurrency:
  group: track-a-auth-session-coordinator-strict
  cancel-in-progress: true

env:
  EXPECTED_PACKED_SHA256: 1fc26d66cef90723d29293f177fcff41c8e937e7aac830f08e82c2f4c69eb354
  EXPECTED_UNPACKED_SHA256: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
  EXPECTED_BUILD_ID: d803d9695868713ef6ab0c3cf65f91212c9c6a62

jobs:
  strict-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover exact current package and prove switch control-flow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --user 'pyelftools==0.32' 'capstone==5.0.6'
          r="$RUNNER_TEMP/auth-session-strict"
          mkdir -p "$r/bin" "$r/state" "$r/client" "$r/evidence"
          cleanup() {
            test -z "${wp_pid:-}" || kill "$wp_pid" 2>/dev/null || true
            rm -rf "$r/client" "$r/state" "$r/bin"
          }
          trap cleanup EXIT

          cd "$r/bin"
          curl --connect-timeout 10 --max-time 60 --retry 3 -fsSL -o wgcf \
            https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl --connect-timeout 10 --max-time 60 --retry 3 -fsSL -o wireproxy.tgz \
            https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tgz' | sha256sum -c -
          mkdir wp && tar -xzf wireproxy.tgz -C wp
          cp "$(find wp -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy

          cd "$r/state"
          timeout 30 "$r/bin/wgcf" register --accept-tos >/dev/null
          timeout 30 "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25348\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 &
          wp_pid=$!
          for _ in $(seq 1 20); do
            if curl --socks5-hostname 127.0.0.1:25348 --connect-timeout 5 --max-time 10 -fsS \
              https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null; then break; fi
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"

          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25348 --connect-timeout 10 --max-time 90 --retry 3 \
            --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' \
            "$u" -o "$r/client/client.lzma"
          test "$(stat -c %s "$r/client/client.lzma")" = 10214529
          test "$(sha256sum "$r/client/client.lzma" | awk '{print $1}')" = "$EXPECTED_PACKED_SHA256"

          python3 - "$r/client/client.lzma" "$r/client/client" "$r/evidence/strict.txt" <<'PY'
          import hashlib, lzma, pathlib, struct, sys
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86_const import X86_OP_IMM, X86_OP_MEM, X86_OP_REG
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection

          packed=pathlib.Path(sys.argv[1]).read_bytes(); out=pathlib.Path(sys.argv[2]); ev=pathlib.Path(sys.argv[3])
          q=packed[32]; lc=q%9; z=q//9; lp=z%5; pb=z//5; ds=int.from_bytes(packed[33:37],'little')
          raw=lzma.decompress(packed[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==52109920
          assert hashlib.sha256(raw).hexdigest()=='ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8'
          out.write_bytes(raw)
          with out.open('rb') as fh:
            elf=ELFFile(fh)
            secs=[(int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags']),s['sh_type']) for s in elf.iter_sections()]
            rel={}
            for s in elf.iter_sections():
              if isinstance(s,RelocationSection):
                for x in s.iter_relocations():
                  e=x.entry
                  if int(e['r_info_type'])==8 and 'r_addend' in e: rel[int(e['r_offset'])]=int(e['r_addend'])
          def off(va,n=1):
            for o,sz,a,fl,t in secs:
              if t!='SHT_NOBITS' and a<=va and va+n<=a+sz: return o+va-a
            raise ValueError(hex(va))
          def exe(va): return any((fl&4) and a<=va<a+sz for o,sz,a,fl,t in secs)
          def u32(va): return struct.unpack_from('<I',raw,off(va,4))[0]
          def i32(va): return struct.unpack_from('<i',raw,off(va,4))[0]
          def qs(base,idx):
            p=base+8*idx; r,n=u32(p),u32(p+4); assert n<512
            return raw[off(base+r,n):off(base+r,n)+n].decode()
          metas=[]
          for obj in sorted(rel):
            if not all(obj+d in rel for d in (8,16,24)): continue
            try:
              sd,mdva,sm=rel[obj+8],rel[obj+16],rel[obj+24]
              h=[u32(mdva+4*i) for i in range(14)]; rev,ci,_,_,mc,mi,_,_,_,_,_,_,_,sc=h
              if not (5<=rev<=20 and 0<=sc<=mc<=512 and mi>=14 and exe(sm)): continue
              cls=qs(sd,ci); methods=[]
              for idx in range(mc):
                row=mdva+4*(mi+6*idx); name=qs(sd,u32(row)); argc=u32(row+4); po=u32(row+8); flags=u32(row+16)
                if argc>32: raise ValueError
                params=[u32(mdva+4*(po+j)) for j in range(argc+1)]
                methods.append((idx,name,argc,flags,params))
              metas.append((cls,obj,sm,mc,sc,methods))
            except Exception: pass
          uniq={}
          for m in metas: uniq[(m[0],m[2])]=m
          metas=list(uniq.values())
          cs=Cs(CS_ARCH_X86,CS_MODE_64); cs.detail=True
          def fam(reg):
            n=cs.reg_name(reg)
            if n.startswith('e') and len(n)==3: return 'r'+n[1:]
            return n
          def prove_switch(meta):
            cls,obj,sm,mc,sc,methods=meta; ins=list(cs.disasm(raw[off(sm):off(sm)+0x600],sm)); chains=[]
            for i,x in enumerate(ins):
              if x.mnemonic!='cmp' or len(x.operands)!=2: continue
              a,b=x.operands
              if a.type!=X86_OP_REG or fam(a.reg)!='rdx' or b.type!=X86_OP_IMM or b.imm!=mc-1: continue
              for j in range(i+1,min(i+14,len(ins))):
                lea=ins[j]
                if lea.mnemonic!='lea' or len(lea.operands)!=2: continue
                dst,src=lea.operands
                if dst.type!=X86_OP_REG or src.type!=X86_OP_MEM or cs.reg_name(src.mem.base)!='rip': continue
                base_reg=fam(dst.reg); table=lea.address+lea.size+src.mem.disp
                for k in range(j+1,min(j+10,len(ins))):
                  mv=ins[k]
                  if mv.mnemonic not in ('movsxd','movslq') or len(mv.operands)!=2: continue
                  td,ms=mv.operands
                  if td.type!=X86_OP_REG or ms.type!=X86_OP_MEM: continue
                  if fam(ms.mem.base)!=base_reg or fam(ms.mem.index)!='rdx' or ms.mem.scale!=4: continue
                  target_reg=fam(td.reg)
                  add_i=None; jmp_i=None
                  for qidx in range(k+1,min(k+6,len(ins))):
                    z=ins[qidx]
                    if z.mnemonic=='add' and len(z.operands)==2 and z.operands[0].type==X86_OP_REG and z.operands[1].type==X86_OP_REG and fam(z.operands[0].reg)==target_reg and fam(z.operands[1].reg)==base_reg:
                      add_i=qidx; break
                  if add_i is None: continue
                  for qidx in range(add_i+1,min(add_i+5,len(ins))):
                    z=ins[qidx]
                    if z.mnemonic=='jmp' and len(z.operands)==1 and z.operands[0].type==X86_OP_REG and fam(z.operands[0].reg)==target_reg:
                      jmp_i=qidx; break
                  if jmp_i is None: continue
                  try: targets=[table+i32(table+4*n) for n in range(mc)]
                  except Exception: continue
                  if all(exe(t) for t in targets): chains.append((i,j,k,add_i,jmp_i,table,targets))
            assert len(chains)==1,(cls,'strict invoke switch count',len(chains))
            return ins,chains[0]
          wanted={
            'tibia::client::TGameClient': {'onRequestLoginWithCredentials':(17,'METHOD',2,[0x2b,0xa,0xa],0xd196f0),'connectClientToGameserverWithExistingCredentials':(11,'METHOD',0,[0x2b],0xd19500)},
            'tibia::authentication::TLoginRequestUploader': {'loginSuccessful':(0,'SIGNAL',3,None,0xd10200)},
            'tibia::gamewindow::TCharacterSelectionController': {'requestCharacterLogin':(0,'SIGNAL',1,None,0xd52050)},
          }
          lines=['COORD_STRICT_EXACT_SHA=PASS']
          for cls,expect in wanted.items():
            hits=[m for m in metas if m[0]==cls]; assert len(hits)==1,(cls,len(hits)); m=hits[0]
            ins,ch=prove_switch(m); i,j,k,aidx,jidx,table,targets=ch
            lines.append(f'CLASS={cls};STATIC=0x{m[2]:x};METHODS={m[3]};SIGNALS={m[4]};TABLE=0x{table:x}')
            lines.append('CHAIN='+' | '.join(f'0x{ins[n].address:x}:{ins[n].mnemonic} {ins[n].op_str}' for n in (i,j,k,aidx,jidx)))
            byname={x[1]:x for x in m[5]}
            for name,(idx,role,argc,params,target) in expect.items():
              x=byname[name]; actual_role='SIGNAL' if x[0]<m[4] else 'METHOD'
              assert x[0]==idx and actual_role==role and x[2]==argc,(cls,name,x,actual_role)
              if params is not None: assert x[4]==params,(cls,name,x[4])
              assert targets[idx]==target,(cls,name,hex(targets[idx]),hex(target))
              lines.append(f'PROVEN={cls}::{name};INDEX={idx};ROLE={role};TARGET=0x{target:x};FLAGS=0x{x[3]:x};PARAMS='+','.join(hex(v) for v in x[4]))
          lines.append('COORD_STRICT_CONTROL_FLOW_BINDING=PASS')
          ev.write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

          build_id="$(readelf -n "$r/client/client" | awk '/Build ID:/{print $3; exit}')"
          test "$build_id" = "$EXPECTED_BUILD_ID"
          echo "COORD_STRICT_BUILD_ID=$build_id" | tee -a "$r/evidence/strict.txt"
          rm -f "$r/client/client" "$r/client/client.lzma"
          test ! -e "$r/client/client" && test ! -e "$r/client/client.lzma"
          echo 'COORD_STRICT_RAW_CLIENT_RETAINED=false' | tee -a "$r/evidence/strict.txt"

      - name: Upload sanitized strict evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: auth-session-coordinator-strict-${{ github.run_id }}
          path: ${{ runner.temp }}/auth-session-strict/evidence/strict.txt
          if-no-files-found: error
          retention-days: 7

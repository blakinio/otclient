name: Track A current-build auth session static discriminator

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-auth-session-current-build-static.yml
      - docs/agents/evidence/OTC-20260819-track-a-auth-session-current-build-static/**
      - docs/agents/tasks/active/OTC-20260819-track-a-auth-session-current-build-static.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recover current-build native auth/session structure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact public client and recover current-build structure
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools python3-capstone binutils

          r="$RUNNER_TEMP/auth-session-current"
          mkdir -p "$r/bin" "$r/state" "$r/client"
          trap 'rm -rf "$r"' EXIT
          cd "$r/bin"

          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wireproxy.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tgz' | sha256sum -c -
          mkdir wp
          tar -xzf wireproxy.tgz -C wp
          cp "$(find wp -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy

          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          echo 'AUTHSESSION_CURRENT_WARP=PASS'

          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' \
            "$u" -o "$r/client/client.lzma"
          test "$(stat -c %s "$r/client/client.lzma")" = 10214529
          echo '1fc26d66cef90723d29293f177fcff41c8e937e7aac830f08e82c2f4c69eb354  '"$r"'/client/client.lzma' | sha256sum -c -
          echo 'AUTHSESSION_CURRENT_PACKED_FENCE=PASS'

          python3 - "$r/client/client.lzma" "$r/client/client" <<'PY'
          import hashlib
          import lzma
          import pathlib
          import re
          import struct
          import sys

          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86_const import X86_OP_IMM, X86_OP_MEM, X86_OP_REG, X86_REG_EDX, X86_REG_RIP
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection

          packed_path = pathlib.Path(sys.argv[1])
          out_path = pathlib.Path(sys.argv[2])
          packed = packed_path.read_bytes()
          props = packed[32]
          lc = props % 9
          rest = props // 9
          lp = rest % 5
          pb = rest // 5
          dict_size = int.from_bytes(packed[33:37], 'little')
          raw = lzma.decompress(
              packed[45:],
              format=lzma.FORMAT_RAW,
              filters=[{'id': lzma.FILTER_LZMA1, 'dict_size': dict_size, 'lc': lc, 'lp': lp, 'pb': pb}],
          )
          raw_sha = hashlib.sha256(raw).hexdigest()
          assert len(raw) == 52109920, len(raw)
          assert raw_sha == 'ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8', raw_sha
          print('AUTHSESSION_CURRENT_EXACT_CLIENT_SHA=PASS')
          print('AUTHSESSION_CURRENT_CLIENT_SIZE=52109920')
          print('AUTHSESSION_CURRENT_CLIENT_SHA256=' + raw_sha)
          print('AUTHSESSION_RUNTIME_ACCESS=none')
          print('AUTHSESSION_CLIENT_EXECUTED=false')
          print('AUTHSESSION_LOGIN_PERFORMED=false')
          print('AUTHSESSION_SECRET_ACCESS=false')
          print('AUTHSESSION_RAW_CLIENT_UPLOADED=false')

          out_path.write_bytes(raw)
          with out_path.open('rb') as fh:
              elf = ELFFile(fh)
              sections = []
              for sec in elf.iter_sections():
                  sections.append((
                      int(sec['sh_offset']), int(sec['sh_size']), int(sec['sh_addr']),
                      int(sec['sh_flags']), sec['sh_type'], sec.name,
                  ))
              relocs = {}
              for sec in elf.iter_sections():
                  if not isinstance(sec, RelocationSection):
                      continue
                  for rel in sec.iter_relocations():
                      entry = rel.entry
                      if int(entry['r_info_type']) == 8 and 'r_addend' in entry:
                          relocs[int(entry['r_offset'])] = int(entry['r_addend'])

          def file_off(va, size=1):
              for off, sec_size, addr, flags, sec_type, name in sections:
                  if sec_type == 'SHT_NOBITS':
                      continue
                  if addr <= va and va + size <= addr + sec_size:
                      return off + va - addr
              raise ValueError(f'unmapped VA {va:#x}+{size:#x}')

          def va_for_file_offset(pos):
              for off, sec_size, addr, flags, sec_type, name in sections:
                  if sec_type == 'SHT_NOBITS':
                      continue
                  if off <= pos < off + sec_size:
                      return addr + pos - off
              return None

          def u32(va):
              return struct.unpack_from('<I', raw, file_off(va, 4))[0]

          def i32(va):
              return struct.unpack_from('<i', raw, file_off(va, 4))[0]

          def executable(va):
              return any((flags & 4) and addr <= va < addr + sec_size for off, sec_size, addr, flags, sec_type, name in sections)

          def read_qstring(base, index):
              entry = base + index * 8
              rel = u32(entry)
              length = u32(entry + 4)
              if length > 512:
                  raise ValueError('qstring too long')
              start = file_off(base + rel, length)
              return raw[start:start + length].decode('utf-8', 'strict')

          def parse_metaobject(obj_va):
              stringdata = relocs[obj_va + 8]
              metadata = relocs[obj_va + 16]
              static_metacall = relocs[obj_va + 24]
              header = [u32(metadata + i * 4) for i in range(14)]
              revision, class_index, class_info_count, class_info_data, method_count, method_data, property_count, property_data, enum_count, enum_data, ctor_count, ctor_data, flags, signal_count = header
              if not (5 <= revision <= 20 and method_count <= 512 and signal_count <= method_count and method_data >= 14):
                  raise ValueError('implausible metadata header')
              class_name = read_qstring(stringdata, class_index)
              if not class_name or len(class_name) > 240:
                  raise ValueError('implausible class name')
              methods = []
              for idx in range(method_count):
                  row_base = metadata + (method_data + idx * 6) * 4
                  row = [u32(row_base + j * 4) for j in range(6)]
                  name = read_qstring(stringdata, row[0])
                  argc = row[1]
                  params_offset = row[2]
                  if argc > 32:
                      raise ValueError('implausible argc')
                  params = [u32(metadata + (params_offset + j) * 4) for j in range(argc + 1)]
                  methods.append({
                      'index': idx,
                      'name': name,
                      'argc': argc,
                      'flags': row[4],
                      'revision': row[5],
                      'params': params,
                  })
              return {
                  'object': obj_va,
                  'stringdata': stringdata,
                  'metadata': metadata,
                  'static_metacall': static_metacall,
                  'revision': revision,
                  'class_name': class_name,
                  'method_count': method_count,
                  'signal_count': signal_count,
                  'methods': methods,
              }

          metaobjects = []
          for obj_va in sorted(relocs):
              if obj_va + 8 not in relocs or obj_va + 16 not in relocs or obj_va + 24 not in relocs:
                  continue
              try:
                  m = parse_metaobject(obj_va)
              except Exception:
                  continue
              metaobjects.append(m)

          dedup = {}
          for m in metaobjects:
              dedup[(m['metadata'], m['class_name'])] = m
          metaobjects = list(dedup.values())
          print(f'AUTHSESSION_QMETA_OBJECTS_PARSED={len(metaobjects)}')
          assert metaobjects, 'no QMetaObjects recovered'

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          def recover_dispatch(meta):
              method_count = meta['method_count']
              start = meta['static_metacall']
              if not executable(start) or method_count == 0:
                  return []
              try:
                  code_off = file_off(start, 1)
              except Exception:
                  return []
              ins = list(md.disasm(raw[code_off:code_off + 0x1800], start))
              candidates = []
              for pos, inst in enumerate(ins):
                  if inst.mnemonic != 'lea' or len(inst.operands) < 2:
                      continue
                  op = inst.operands[1]
                  if op.type != X86_OP_MEM or op.mem.base != X86_REG_RIP:
                      continue
                  table = inst.address + inst.size + op.mem.disp
                  reg = inst.operands[0].reg
                  if not any(
                      operand.type == X86_OP_MEM and operand.mem.base == reg and operand.mem.scale == 4
                      for nxt in ins[pos + 1:pos + 14]
                      for operand in nxt.operands
                  ):
                      continue
                  try:
                      targets = [table + i32(table + i * 4) for i in range(method_count)]
                  except Exception:
                      continue
                  if not targets or not all(executable(t) for t in targets):
                      continue
                  context = ins[max(0, pos - 18):pos + 3]
                  full_range = False
                  for x in context:
                      if x.mnemonic != 'cmp' or len(x.operands) != 2:
                          continue
                      a, b = x.operands
                      if a.type == X86_OP_REG and a.reg == X86_REG_EDX and b.type == X86_OP_IMM and b.imm == method_count - 1:
                          full_range = True
                  if full_range:
                      candidates.append((table, targets, inst.address, context))
              return candidates

          target_class = 'tibia::client::TGameClient'
          game_clients = [m for m in metaobjects if m['class_name'] == target_class]
          print(f'AUTHSESSION_TGAMECLIENT_QMETA_COUNT={len(game_clients)}')
          assert len(game_clients) == 1, ('TGameClient QMeta count', len(game_clients))
          game = game_clients[0]
          print('AUTHSESSION_TGAMECLIENT_QMETA_IDENTITY=PASS')
          print(f'AUTHSESSION_TGAMECLIENT_STATIC_METAOBJECT=0x{game["object"]:x}')
          print(f'AUTHSESSION_TGAMECLIENT_STRINGDATA=0x{game["stringdata"]:x}')
          print(f'AUTHSESSION_TGAMECLIENT_METADATA=0x{game["metadata"]:x}')
          print(f'AUTHSESSION_TGAMECLIENT_STATIC_METACALL=0x{game["static_metacall"]:x}')
          print(f'AUTHSESSION_TGAMECLIENT_METHOD_COUNT={game["method_count"]}')
          print(f'AUTHSESSION_TGAMECLIENT_SIGNAL_COUNT={game["signal_count"]}')

          cold = [m for m in game['methods'] if m['name'] == 'onRequestLoginWithCredentials']
          print(f'AUTHSESSION_COLD_AUTH_METHOD_COUNT={len(cold)}')
          assert len(cold) == 1, ('cold auth method count', len(cold))
          cold = cold[0]
          assert cold['argc'] == 2, cold['argc']
          print('AUTHSESSION_COLD_AUTH_METHOD=onRequestLoginWithCredentials')
          print(f'AUTHSESSION_COLD_AUTH_META_INDEX={cold["index"]}')
          print(f'AUTHSESSION_COLD_AUTH_ARGC={cold["argc"]}')
          print(f'AUTHSESSION_COLD_AUTH_METHOD_FLAGS=0x{cold["flags"]:x}')
          print('AUTHSESSION_COLD_AUTH_RAW_PARAM_TYPE_IDS=' + ','.join(hex(x) for x in cold['params']))

          dispatch = recover_dispatch(game)
          print(f'AUTHSESSION_TGAMECLIENT_FULL_RANGE_DISPATCH_COUNT={len(dispatch)}')
          assert len(dispatch) == 1, ('TGameClient full-range dispatch count', len(dispatch))
          table, targets, lea_at, context = dispatch[0]
          target = targets[cold['index']]
          fence = raw[file_off(target, 32):file_off(target, 32) + 32]
          assert len(fence) == 32
          print('AUTHSESSION_COLD_AUTH_DISPATCH=PASS')
          print(f'AUTHSESSION_COLD_AUTH_DISPATCH_LEA=0x{lea_at:x}')
          print(f'AUTHSESSION_COLD_AUTH_DISPATCH_TABLE=0x{table:x}')
          print(f'AUTHSESSION_COLD_AUTH_DISPATCH_TARGET=0x{target:x}')
          print('AUTHSESSION_COLD_AUTH_TARGET_INSTRUCTION_FENCE=' + fence.hex())

          old_addresses = {
              'old_tgameclient_static_metacall': 0xd06260,
              'old_cold_auth_target': 0xd06850,
              'old_advance_direct_character_select': 0xcfadcb,
              'old_shortcut_character_select': 0xcfad8b,
              'old_connect_existing_credentials_wrapper': 0xd06660,
              'old_connect_existing_credentials_impl': 0x6ef1d0,
              'old_request_character_login': 0xd47300,
              'old_request_gameserver_login': 0xcfb2e7,
              'old_start_gameserver_login_state': 0xcfb122,
          }
          print('AUTHSESSION_HISTORICAL_ADDRESSES_STATUS=SUPERSEDED_FOR_CURRENT_BUILD_UNLESS_REDISCOVERED')
          for k, v in old_addresses.items():
              print(f'AUTHSESSION_HISTORICAL_{k.upper()}=0x{v:x}')

          method_targets = {
              'advanceStateMachineDirectlyToCharacterSelection',
              'onLoginStateMachineStartedShortcutToCharacterSelection',
              'loginSuccessful',
              'connectClientToGameserverWithExistingCredentials',
              'requestCharacterLogin',
              'requestCharacterGameserverLogin',
              'onStartGameServerLoginStateEntered',
              'sendLoginMessage',
          }
          class_fragments = (
              'TGameClient', 'TAuthenticationProcessController', 'TLoginRequestUploader',
              'TCharacterSelectionController', 'TGameSessionDisconnectReactionController',
          )
          print('AUTHSESSION_CURRENT_QMETA_FAMILY_BEGIN')
          qmeta_target_hits = 0
          for meta in sorted(metaobjects, key=lambda m: m['class_name']):
              hits = [x for x in meta['methods'] if x['name'] in method_targets]
              class_hit = any(f in meta['class_name'] for f in class_fragments)
              if not class_hit and not hits:
                  continue
              print(f'CLASS={meta["class_name"]};OBJECT=0x{meta["object"]:x};METADATA=0x{meta["metadata"]:x};STATIC_METACALL=0x{meta["static_metacall"]:x};METHODS={meta["method_count"]};SIGNALS={meta["signal_count"]}')
              disp = recover_dispatch(meta)
              unique_disp = disp[0] if len(disp) == 1 else None
              for hit in hits:
                  qmeta_target_hits += 1
                  line = f'  METHOD={hit["name"]};INDEX={hit["index"]};ARGC={hit["argc"]};FLAGS=0x{hit["flags"]:x}'
                  if unique_disp:
                      t = unique_disp[1][hit['index']]
                      tfence = raw[file_off(t, 16):file_off(t, 16) + 16].hex()
                      line += f';TARGET=0x{t:x};FENCE16={tfence}'
                  else:
                      line += f';TARGET=UNKNOWN;DISPATCH_CANDIDATES={len(disp)}'
                  print(line)
          print('AUTHSESSION_CURRENT_QMETA_FAMILY_END')
          print(f'AUTHSESSION_CURRENT_QMETA_TARGET_METHOD_HITS={qmeta_target_hits}')

          string_targets = [
              'TAuthenticationProcessController',
              'advanceStateMachineDirectlyToCharacterSelection',
              'onLoginStateMachineStartedShortcutToCharacterSelection',
              'TLoginRequestUploader',
              'loginSuccessful',
              'TCharacterList',
              'TWorldList',
              'TPlaySessionData',
              'TCharacterSelectionController',
              'requestCharacterLogin',
              'requestCharacterGameserverLogin',
              'onStartGameServerLoginStateEntered',
              'connectClientToGameserverWithExistingCredentials',
              'TGameSessionDisconnectReactionController',
              'sendLoginMessage',
              'GameclientMessageLogin',
              'LoginRSAEncryptedBlock',
              'GameclientMessageSecondaryLogin',
              'SecondaryLoginRSAEncryptedBlock',
          ]
          print('AUTHSESSION_CURRENT_STRUCTURAL_STRING_INVENTORY_BEGIN')
          present = 0
          for text in string_targets:
              needle = text.encode()
              positions = [m.start() for m in re.finditer(re.escape(needle), raw)]
              if positions:
                  present += 1
              vals = []
              for p in positions[:6]:
                  va = va_for_file_offset(p)
                  vals.append(f'file=0x{p:x}/va=' + (f'0x{va:x}' if va is not None else 'UNKNOWN'))
              print(f'STRING={text};COUNT={len(positions)};LOCATIONS=' + ','.join(vals))
          print('AUTHSESSION_CURRENT_STRUCTURAL_STRING_INVENTORY_END')
          print(f'AUTHSESSION_CURRENT_STRUCTURAL_STRING_TARGETS_PRESENT={present}/{len(string_targets)}')
          print('AUTHSESSION_CURRENT_STATIC_DISCRIMINATOR=PASS')
          PY

          build_id=$(readelf -n "$r/client/client" | awk '/Build ID:/{print $3; exit}')
          test "$build_id" = d803d9695868713ef6ab0c3cf65f91212c9c6a62
          echo "AUTHSESSION_CURRENT_ELF_BUILD_ID=$build_id"
          echo 'AUTHSESSION_CURRENT_BUILD_ID_FENCE=PASS'

          rm -f "$r/client/client" "$r/client/client.lzma"
          test ! -e "$r/client/client"
          test ! -e "$r/client/client.lzma"
          echo 'AUTHSESSION_RAW_CLIENT_RETAINED=false'

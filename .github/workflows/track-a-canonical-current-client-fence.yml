name: Track A canonical current-client fence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/tibia-official-client-re-canonical-live-session.sh
      - .github/scripts/test_tibia_official_client_re_canonical_live_session.py
      - .github/scripts/tibia-official-client-re-canonical-live-transition.py
      - .github/scripts/test_tibia_official_client_re_canonical_live_transition.py
      - .github/scripts/tibia-official-client-re-kasm-existing-runtime-probe.py
      - .github/scripts/test_tibia_official_client_re_kasm_existing_runtime_probe.py
      - .github/scripts/test_track_a_canonical_current_client_fence.py
      - .github/workflows/track-a-canonical-current-client-fence.yml
      - .github/workflows/track-a-canonical-live-governance.yml
      - docs/agents/TIBIA_RESEARCH_TRACKS.md
      - docs/agents/decisions/ADR-0001-track-a-canonical-live-runtime.md
      - docs/agents/contracts/TRACK_A_CANONICAL_LIVE_BOOTSTRAP_V1.md
      - docs/agents/contracts/TRACK_A_RUNTIME_AGENT_ADMISSION_V1.md
      - docs/agents/CHANGELOG.md
      - docs/agents/tasks/active/OTC-20260828-canonical-current-client-fence.md

permissions:
  contents: read

jobs:
  current-canonical-fence:
    name: Current exact-client canonical fence
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Validate current canonical fence contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/test_track_a_canonical_current_client_fence.py
      - name: Validate canonical runtime components
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n .github/scripts/tibia-official-client-re-canonical-live-session.sh
          python3 -m py_compile \
            .github/scripts/tibia-official-client-re-canonical-live-transition.py \
            .github/scripts/tibia-official-client-re-kasm-existing-runtime-probe.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_session.py -v
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py -v
          python3 .github/scripts/test_tibia_official_client_re_kasm_existing_runtime_probe.py -v
      - name: Assert repository-only execution boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          task='docs/agents/tasks/active/OTC-20260828-canonical-current-client-fence.md'
          grep -Fq 'runtime_access: none' "$task"
          grep -Fq 'mutation_authorized: false' "$task"
          grep -Fq 'credentials_allowed: false' "$task"
          grep -Fq 'login_allowed: false' "$task"
          grep -Fq 'process_control_authorized: false' "$task"
          grep -Fq 'physical_action_budget: 0' "$task"

  apply-provenance-cleanup:
    name: Apply exact provenance cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/OTC-20260828-canonical-current-client-fence
          fetch-depth: 0
          persist-credentials: true
      - name: Replace only the proven stale provenance sentence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = ('The current public native-Linux package is fenced by size `52105824` and SHA-256 '
                 '`d1a16819cec7e40cfee39c099d4868d2eb2d7c1c942078eda105233b5688817a`; '
                 '`15.32` is an embedded version-family token, not a claim of a more specific suffix.')
          new = ('The current public native-Linux package is fenced exactly as '
                 '`15.32.75d4a0 / 52105824 / d1a16819cec7e40cfee39c099d4868d2eb2d7c1c942078eda105233b5688817a`.')
          paths = (
              Path('docs/agents/contracts/TRACK_A_RUNTIME_AGENT_ADMISSION_V1.md'),
              Path('docs/agents/decisions/ADR-0001-track-a-canonical-live-runtime.md'),
              Path('docs/agents/contracts/TRACK_A_CANONICAL_LIVE_BOOTSTRAP_V1.md'),
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new), encoding='utf-8')
              elif count == 0 and new in text:
                  pass
              else:
                  raise SystemExit(f'{path}: stale/current provenance count invalid: old={count}, new={text.count(new)}')
          PY
          python3 .github/scripts/test_track_a_canonical_current_client_fence.py
          git diff --check
      - name: Commit provenance cleanup when needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -z "$(git status --porcelain -- docs/agents/contracts/TRACK_A_RUNTIME_AGENT_ADMISSION_V1.md docs/agents/decisions/ADR-0001-track-a-canonical-live-runtime.md docs/agents/contracts/TRACK_A_CANONICAL_LIVE_BOOTSTRAP_V1.md)"; then
            echo PROVENANCE_CLEANUP_ALREADY_APPLIED=true
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/agents/contracts/TRACK_A_RUNTIME_AGENT_ADMISSION_V1.md \
            docs/agents/decisions/ADR-0001-track-a-canonical-live-runtime.md \
            docs/agents/contracts/TRACK_A_CANONICAL_LIVE_BOOTSTRAP_V1.md
          git diff --cached --check
          git commit -m 'docs(track-a): align exact-client provenance'
          git push origin HEAD:fix/OTC-20260828-canonical-current-client-fence

name: Track A canonical Kasm official Linux entrypoint bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/tibia-official-client-re-canonical-live-transition-scoped.py
      - .github/scripts/tibia-official-client-re-kasm-bootstrap-worker-compatible.py
      - .github/scripts/tibia-official-client-re-kasm-existing-runtime-probe-compatible.py
      - .github/workflows/track-a-canonical-kasm-bootstrap-retry-v2.yml
      - tests/tools/tibia_runtime_bridge/test_kasm_bootstrap_launch_readiness.py
      - tests/tools/tibia_runtime_bridge/test_canonical_kasm_bootstrap_retry_v2_contract.py
      - docs/agents/tasks/active/OTC-20260907-official-linux-entrypoint-bootstrap.md
      - docs/agents/tasks/active/OTC-20260907-official-entrypoint-transition-compat-bootstrap.md
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: track-a-canonical-kasm-official-entrypoint-${{ github.event_name }}
  cancel-in-progress: false

env:
  CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
  TASK_ID: OTC-20260907-official-entrypoint-transition-compat-bootstrap
  EXPECTED_VERSION: 15.32.be4f48
  EXPECTED_SIZE: '52105824'
  EXPECTED_SHA: 552dcf794c41dae8c3dca10b740cd23e2f2ebcaf82d86576e8a67d924409e4e1

jobs:
  contract:
    if: github.event_name == 'pull_request'
    name: Canonical Kasm official entrypoint contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run deterministic official-entrypoint bootstrap contracts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 tests/tools/tibia_runtime_bridge/test_kasm_bootstrap_launch_readiness.py
          python3 tests/tools/tibia_runtime_bridge/test_canonical_kasm_bootstrap_retry_v2_contract.py
          python3 tests/tools/tibia_runtime_bridge/test_docker_candidate_inventory_compatibility.py
          python3 .github/scripts/test_tibia_official_client_re_kasm_bootstrap_worker.py -q
          python3 .github/scripts/test_tibia_official_client_re_kasm_existing_runtime_probe.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py -q
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$BASE_SHA" --expected-branch "$HEAD_BRANCH"
          python3 .github/scripts/audit_track_a_selfhosted_pr_boundary.py --base "$BASE_SHA"
          python3 -m py_compile \
            .github/scripts/tibia-official-client-re-canonical-live-transition-scoped.py \
            .github/scripts/tibia-official-client-re-kasm-bootstrap-worker-compatible.py \
            .github/scripts/tibia-official-client-re-kasm-existing-runtime-probe-compatible.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/track-a-canonical-kasm-bootstrap-retry-v2.yml'); puts 'YAML_PARSE=PASS'"
          git diff --check "$BASE_SHA"...HEAD
          echo TRACK_A_CANONICAL_KASM_OFFICIAL_ENTRYPOINT_CONTRACT=PASS

  live-precheck:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 975 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/track-a-official-entrypoint-transition-compat-bootstrap PRECHECK'
    name: Trusted-main official Linux entrypoint PRECHECK
    runs-on: [otclient, synology]
    timeout-minutes: 12
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 2

      - name: Prove trusted main and official-entrypoint admission
        id: trust
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          test "$RUNNER_NAME" = 'synology-otclient-01'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          trusted_main="$(git rev-parse HEAD)"
          live_main="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          test "$trusted_main" = "$live_main"
          python3 tests/tools/tibia_runtime_bridge/test_kasm_bootstrap_launch_readiness.py
          python3 tests/tools/tibia_runtime_bridge/test_canonical_kasm_bootstrap_retry_v2_contract.py
          python3 .github/scripts/test_track_a_agent_runtime_governance.py
          test ! -e "$CANONICAL_STATE/runtime-registration.json"
          echo "trusted_main=$trusted_main" >> "$GITHUB_OUTPUT"
          echo NO_CREDENTIAL_ACCESS=true
          echo RUNTIME_MUTATION=false

      - name: Consume one-shot official-entrypoint PRECHECK authorization
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runtime"
          mkdir -p "$root"; chmod 700 "$root"
          marker="$root/transition-compat-precheck-attempt-consumed.json"
          python3 - "$marker" "$TRUSTED_MAIN" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); payload={'schema_version':1,'trusted_main':sys.argv[2],'run_id':sys.argv[3],'run_attempt':int(sys.argv[4])}
          try: fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          except FileExistsError as exc: raise SystemExit('OFFICIAL_ENTRYPOINT_TRANSITION_COMPAT_PRECHECK_ALREADY_CONSUMED') from exc
          with os.fdopen(fd,'w',encoding='utf-8') as h:
            json.dump(payload,h,sort_keys=True,separators=(',',':')); h.write('\n'); h.flush(); os.fsync(h.fileno())
          PY
          echo OFFICIAL_ENTRYPOINT_TRANSITION_COMPAT_PRECHECK_AUTHORIZATION_CONSUMED=PASS

      - name: Run guarded registration-absent official-entrypoint PRECHECK
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" = "$TRUSTED_MAIN"
          task="$TASK_ID"; session="official-entrypoint-transition-compat-precheck-${GITHUB_RUN_ID}"
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"
          token="$root/canonical-lease-token"
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          worker=.github/scripts/tibia-official-client-re-kasm-bootstrap-worker-compatible.py
          record="$RUNNER_TEMP/official-entrypoint-transition-compat-precheck.json"
          rm -f "$token" "$record"; mkdir -p "$root"; chmod 700 "$root"
          active=false
          cleanup() { rc=$?; if [[ "$active" == true && -f "$token" ]]; then bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true; fi; rm -f "$token"; exit "$rc"; }
          trap cleanup EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$session" --token-file "$token" --ttl-seconds 300 \
            --stale-takeover-reason 'owner-approved transition-compatible exact-current official Linux entrypoint PRECHECK after schema integration failure'
          active=true
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          bash "$lease" guard-run --task-id "$task" --session-id "$session" --token-file "$token" -- \
            bash -lc 'test ! -e "$1" && python3 "$2" preflight "$3"' bash \
              "$CANONICAL_STATE/runtime-registration.json" "$worker" "$record"
          python3 - "$record" "$EXPECTED_VERSION" "$EXPECTED_SIZE" "$EXPECTED_SHA" <<'PY'
          import json,pathlib,sys
          pre=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert pre['container_name']=='otclient-track-a-kasmvnc'
          assert pre['candidate_count']==0 and pre['main_window_count']==0
          assert pre['client_path'].endswith('/packages/Tibia/bin/client')
          assert pre['client_size']==int(sys.argv[3]) and pre['client_sha256']==sys.argv[4]
          launcher=pathlib.PurePosixPath(pre['launcher_path'])
          assert launcher.name=='Tibia'
          assert str(launcher.parent)==pre['launcher_dir']
          assert '/packages/Tibia/' not in pre['launcher_path']
          assert pre['launcher_size']>0
          assert len(pre['launcher_sha256'])==64
          assert pre['launcher_selection'] in ('desktop','unique')
          print('TRACK_A_OFFICIAL_ENTRYPOINT_PREFLIGHT=PASS')
          PY
          fingerprint="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["preflight_fingerprint"])' "$record")"
          bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token"
          active=false; rm -f "$token"
          pass_marker="$root/transition-compat-precheck-pass.json"
          python3 - "$pass_marker" "$TRUSTED_MAIN" "$GITHUB_RUN_ID" "$fingerprint" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); payload={'schema_version':1,'trusted_main':sys.argv[2],'run_id':sys.argv[3],'preflight_fingerprint':sys.argv[4]}
          try: fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          except FileExistsError as exc: raise SystemExit('OFFICIAL_ENTRYPOINT_TRANSITION_COMPAT_PRECHECK_PASS_ALREADY_EXISTS') from exc
          with os.fdopen(fd,'w',encoding='utf-8') as h:
            json.dump(payload,h,sort_keys=True,separators=(',',':')); h.write('\n'); h.flush(); os.fsync(h.fileno())
          PY
          echo NO_CREDENTIAL_ACCESS=true
          echo RUNTIME_MUTATION=false
          trap - EXIT

  live-execute:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 975 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/track-a-official-entrypoint-transition-compat-bootstrap EXECUTE'
    name: Trusted-main official Linux entrypoint EXECUTE
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 2

      - name: Prove trusted main and PRECHECK PASS
        id: trust
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          test "$RUNNER_NAME" = 'synology-otclient-01'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          trusted_main="$(git rev-parse HEAD)"; live_main="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          test "$trusted_main" = "$live_main"
          test ! -e "$CANONICAL_STATE/runtime-registration.json"
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runtime"
          python3 - "$root/transition-compat-precheck-pass.json" "$trusted_main" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d['schema_version']==1 and d['trusted_main']==sys.argv[2]
          fp=d.get('preflight_fingerprint',''); assert len(fp)==64 and all(c in '0123456789abcdef' for c in fp)
          print('OFFICIAL_ENTRYPOINT_TRANSITION_COMPAT_PRECHECK_PASS=VERIFIED')
          PY
          echo "trusted_main=$trusted_main" >> "$GITHUB_OUTPUT"
          echo NO_CREDENTIAL_ACCESS=true

      - name: Consume one-shot official-entrypoint EXECUTE authorization
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runtime"; mkdir -p "$root"; chmod 700 "$root"
          marker="$root/transition-compat-execute-attempt-consumed.json"
          python3 - "$marker" "$TRUSTED_MAIN" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); payload={'schema_version':1,'trusted_main':sys.argv[2],'run_id':sys.argv[3],'run_attempt':int(sys.argv[4])}
          try: fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          except FileExistsError as exc: raise SystemExit('OFFICIAL_ENTRYPOINT_TRANSITION_COMPAT_EXECUTE_ALREADY_CONSUMED') from exc
          with os.fdopen(fd,'w',encoding='utf-8') as h:
            json.dump(payload,h,sort_keys=True,separators=(',',':')); h.write('\n'); h.flush(); os.fsync(h.fileno())
          PY
          echo OFFICIAL_ENTRYPOINT_TRANSITION_COMPAT_EXECUTE_AUTHORIZATION_CONSUMED=PASS

      - name: Create exactly one exact-current client through official Linux entrypoint
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" = "$TRUSTED_MAIN"
          test ! -e "$CANONICAL_STATE/runtime-registration.json"
          task="$TASK_ID"; session="official-entrypoint-transition-compat-${GITHUB_RUN_ID}"
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"; token="$root/canonical-lease-token"
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          transition=.github/scripts/tibia-official-client-re-canonical-live-transition-scoped.py
          worker=.github/scripts/tibia-official-client-re-kasm-bootstrap-worker-compatible.py
          probe=.github/scripts/tibia-official-client-re-kasm-existing-runtime-probe-compatible.py
          chmod 755 "$worker" "$probe" "$transition"
          rm -f "$token"; mkdir -p "$root"; chmod 700 "$root"
          active=false
          cleanup() { rc=$?; if [[ "$active" == true && -f "$token" ]]; then bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true; fi; rm -f "$token"; exit "$rc"; }
          trap cleanup EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$session" --token-file "$token" --ttl-seconds 600 \
            --stale-takeover-reason 'owner-approved transition-compatible exact-current official Linux entrypoint bootstrap after schema integration repair'
          active=true
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          python3 "$transition" kasm-bootstrap \
            --task-id "$task" --session-id "$session" --token-file "$token" \
            --worker "$worker" --probe "$probe" --worker-timeout 180
          bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token"
          active=false; rm -f "$token"
          echo TRACK_A_CANONICAL_KASM_OFFICIAL_ENTRYPOINT_BOOTSTRAP=PASS
          echo NO_CREDENTIAL_ACCESS=true
          trap - EXIT

      - name: Verify restored canonical registration and exact live identity
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          probe=.github/scripts/tibia-official-client-re-kasm-existing-runtime-probe-compatible.py
          current="$RUNNER_TEMP/official-entrypoint-transition-compat-current.json"
          python3 "$probe" probe "$current"
          python3 - "$CANONICAL_STATE/runtime-registration.json" "$current" "$EXPECTED_VERSION" "$EXPECTED_SIZE" "$EXPECTED_SHA" "$TASK_ID" <<'PY'
          import json,pathlib,sys
          reg=json.loads(pathlib.Path(sys.argv[1]).read_text())
          cur=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert reg['client_version']==sys.argv[3]
          assert reg['client_size']==int(sys.argv[4])
          assert reg['client_sha256']==sys.argv[5]
          assert reg['state']=='UNKNOWN'
          assert reg['source_task']==sys.argv[6]
          assert reg['proof_kind']=='existing_runtime_adoption_v1'
          assert reg['candidate_count']==1
          assert reg['inventory_scope']=='canonical_kasm_container'
          assert reg['inventory_complete'] is True
          for key in ('pid','process_start_ticks','client_size','client_sha256','display'):
            assert reg[key]==cur[key], key
          assert cur['candidate_count']==1
          assert cur['main_window_count']==1
          assert cur['inventory_scope']=='canonical_kasm_container'
          assert cur['inventory_complete'] is True
          print('TRACK_A_CANONICAL_KASM_OFFICIAL_ENTRYPOINT_REGISTRATION=PASS')
          print('NO_CREDENTIAL_ACCESS=true')
          PY
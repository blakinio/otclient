name: Track A canonical Kasm bootstrap retry

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/tibia-official-client-re-kasm-bootstrap-worker-compatible.py
      - .github/scripts/tibia-official-client-re-kasm-existing-runtime-probe-compatible.py
      - .github/workflows/track-a-canonical-kasm-bootstrap-retry.yml
      - tests/tools/tibia_runtime_bridge/test_kasm_bootstrap_launch_readiness.py
      - tests/tools/tibia_runtime_bridge/test_canonical_kasm_bootstrap_retry_contract.py
      - docs/agents/tasks/active/OTC-20260907-kasm-bootstrap-launch-readiness.md
      - docs/agents/tasks/active/OTC-20260907-canonical-kasm-bootstrap-retry-live.md
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: track-a-canonical-kasm-bootstrap-retry-${{ github.event_name }}
  cancel-in-progress: false

env:
  CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
  TASK_ID: OTC-20260907-canonical-kasm-bootstrap-retry-live
  EXPECTED_VERSION: 15.32.be4f48
  EXPECTED_SIZE: '52105824'
  EXPECTED_SHA: 552dcf794c41dae8c3dca10b740cd23e2f2ebcaf82d86576e8a67d924409e4e1

jobs:
  contract:
    if: github.event_name == 'pull_request'
    name: Canonical Kasm bootstrap retry contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run deterministic bootstrap retry contracts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 tests/tools/tibia_runtime_bridge/test_kasm_bootstrap_launch_readiness.py
          python3 tests/tools/tibia_runtime_bridge/test_canonical_kasm_bootstrap_retry_contract.py
          python3 tests/tools/tibia_runtime_bridge/test_docker_candidate_inventory_compatibility.py
          python3 .github/scripts/test_tibia_official_client_re_kasm_bootstrap_worker.py -q
          python3 .github/scripts/test_tibia_official_client_re_kasm_existing_runtime_probe.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py -q
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$BASE_SHA" --expected-branch "$HEAD_BRANCH"
          python3 .github/scripts/audit_track_a_selfhosted_pr_boundary.py --base "$BASE_SHA"
          python3 -m py_compile \
            .github/scripts/tibia-official-client-re-kasm-bootstrap-worker-compatible.py \
            .github/scripts/tibia-official-client-re-kasm-existing-runtime-probe-compatible.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/track-a-canonical-kasm-bootstrap-retry.yml'); puts 'YAML_PARSE=PASS'"
          git diff --check "$BASE_SHA"...HEAD
          echo TRACK_A_CANONICAL_KASM_BOOTSTRAP_RETRY_CONTRACT=PASS

  live-precheck:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 975 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/track-a-canonical-kasm-bootstrap-retry PRECHECK'
    name: Trusted-main canonical Kasm bootstrap retry PRECHECK
    runs-on: [otclient, synology]
    timeout-minutes: 12
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 2

      - name: Prove trusted main and bootstrap retry admission
        id: trust
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          test "$RUNNER_NAME" = 'synology-otclient-01'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          trusted_main="$(git rev-parse HEAD)"
          live_main="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          test "$trusted_main" = "$live_main"
          python3 tests/tools/tibia_runtime_bridge/test_kasm_bootstrap_launch_readiness.py
          python3 tests/tools/tibia_runtime_bridge/test_canonical_kasm_bootstrap_retry_contract.py
          python3 .github/scripts/test_track_a_agent_runtime_governance.py
          test ! -e "$CANONICAL_STATE/runtime-registration.json"
          echo "trusted_main=$trusted_main" >> "$GITHUB_OUTPUT"
          echo NO_CREDENTIAL_ACCESS=true
          echo RUNTIME_MUTATION=false

      - name: Consume one-shot bootstrap retry PRECHECK authorization
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runtime"
          mkdir -p "$root"; chmod 700 "$root"
          marker="$root/bootstrap-retry-precheck-attempt-consumed.json"
          python3 - "$marker" "$TRUSTED_MAIN" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); payload={'schema_version':1,'trusted_main':sys.argv[2],'run_id':sys.argv[3],'run_attempt':int(sys.argv[4])}
          try: fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          except FileExistsError as exc: raise SystemExit('BOOTSTRAP_RETRY_PRECHECK_ALREADY_CONSUMED') from exc
          with os.fdopen(fd,'w',encoding='utf-8') as h:
            json.dump(payload,h,sort_keys=True,separators=(',',':')); h.write('\n'); h.flush(); os.fsync(h.fileno())
          PY
          echo BOOTSTRAP_RETRY_PRECHECK_AUTHORIZATION_CONSUMED=PASS

      - name: Run guarded registration-absent canonical Kasm PRECHECK
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" = "$TRUSTED_MAIN"
          task="$TASK_ID"; session="bootstrap-retry-precheck-${GITHUB_RUN_ID}"
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"
          token="$root/canonical-lease-token"
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          worker=.github/scripts/tibia-official-client-re-kasm-bootstrap-worker-compatible.py
          record="$RUNNER_TEMP/bootstrap-retry-precheck.json"
          rm -f "$token" "$record"; mkdir -p "$root"; chmod 700 "$root"
          active=false
          # shellcheck disable=SC2317
          cleanup() { rc=$?; if [[ "$active" == true && -f "$token" ]]; then bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true; fi; rm -f "$token"; exit "$rc"; }
          trap cleanup EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$session" --token-file "$token" --ttl-seconds 300 \
            --stale-takeover-reason 'owner-approved bootstrap retry PRECHECK after identity-bound rollback'
          active=true
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          bash "$lease" guard-run --task-id "$task" --session-id "$session" --token-file "$token" -- \
            bash -lc 'test ! -e "$1" && python3 "$2" preflight "$3"' bash \
              "$CANONICAL_STATE/runtime-registration.json" "$worker" "$record"
          python3 - "$record" "$EXPECTED_SIZE" "$EXPECTED_SHA" <<'PY'
          import json,pathlib,sys
          pre=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert pre['container_name']=='otclient-track-a-kasmvnc'
          assert pre['candidate_count']==0 and pre['main_window_count']==0
          assert pre['client_size']==int(sys.argv[2]) and pre['client_sha256']==sys.argv[3]
          print('TRACK_A_BOOTSTRAP_RETRY_PREFLIGHT=PASS')
          PY
          fingerprint="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["preflight_fingerprint"])' "$record")"
          bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token"
          active=false; rm -f "$token"
          pass_marker="$root/bootstrap-retry-precheck-pass.json"
          python3 - "$pass_marker" "$TRUSTED_MAIN" "$GITHUB_RUN_ID" "$fingerprint" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); payload={'schema_version':1,'trusted_main':sys.argv[2],'run_id':sys.argv[3],'preflight_fingerprint':sys.argv[4]}
          try: fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          except FileExistsError as exc: raise SystemExit('BOOTSTRAP_RETRY_PRECHECK_PASS_ALREADY_EXISTS') from exc
          with os.fdopen(fd,'w',encoding='utf-8') as h:
            json.dump(payload,h,sort_keys=True,separators=(',',':')); h.write('\n'); h.flush(); os.fsync(h.fileno())
          PY
          echo NO_CREDENTIAL_ACCESS=true
          echo RUNTIME_MUTATION=false
          trap - EXIT

  live-execute:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 975 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/track-a-canonical-kasm-bootstrap-retry EXECUTE'
    name: Trusted-main canonical Kasm bootstrap retry EXECUTE
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 2

      - name: Prove trusted main and PRECHECK PASS
        id: trust
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          test "$RUNNER_NAME" = 'synology-otclient-01'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          trusted_main="$(git rev-parse HEAD)"; live_main="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          test "$trusted_main" = "$live_main"
          test ! -e "$CANONICAL_STATE/runtime-registration.json"
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runtime"
          python3 - "$root/bootstrap-retry-precheck-pass.json" "$trusted_main" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d['schema_version']==1 and d['trusted_main']==sys.argv[2]
          fp=d.get('preflight_fingerprint',''); assert len(fp)==64 and all(c in '0123456789abcdef' for c in fp)
          print('BOOTSTRAP_RETRY_PRECHECK_PASS=VERIFIED')
          PY
          echo "trusted_main=$trusted_main" >> "$GITHUB_OUTPUT"
          echo NO_CREDENTIAL_ACCESS=true

      - name: Consume one-shot bootstrap retry EXECUTE authorization
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$TASK_ID/runtime"; mkdir -p "$root"; chmod 700 "$root"
          marker="$root/bootstrap-retry-execute-attempt-consumed.json"
          python3 - "$marker" "$TRUSTED_MAIN" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); payload={'schema_version':1,'trusted_main':sys.argv[2],'run_id':sys.argv[3],'run_attempt':int(sys.argv[4])}
          try: fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          except FileExistsError as exc: raise SystemExit('BOOTSTRAP_RETRY_EXECUTE_ALREADY_CONSUMED') from exc
          with os.fdopen(fd,'w',encoding='utf-8') as h:
            json.dump(payload,h,sort_keys=True,separators=(',',':')); h.write('\n'); h.flush(); os.fsync(h.fileno())
          PY
          echo BOOTSTRAP_RETRY_EXECUTE_AUTHORIZATION_CONSUMED=PASS

      - name: Create exactly one plain exact-current client in canonical Kasm
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" = "$TRUSTED_MAIN"
          test ! -e "$CANONICAL_STATE/runtime-registration.json"
          task="$TASK_ID"; session="bootstrap-retry-${GITHUB_RUN_ID}"
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"; token="$root/canonical-lease-token"
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          transition=.github/scripts/tibia-official-client-re-canonical-live-transition-scoped.py
          worker=.github/scripts/tibia-official-client-re-kasm-bootstrap-worker-compatible.py
          probe=.github/scripts/tibia-official-client-re-kasm-existing-runtime-probe-compatible.py
          chmod 755 "$worker" "$probe" "$transition"
          rm -f "$token"; mkdir -p "$root"; chmod 700 "$root"
          active=false
          # shellcheck disable=SC2317
          cleanup() { rc=$?; if [[ "$active" == true && -f "$token" ]]; then bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true; fi; rm -f "$token"; exit "$rc"; }
          trap cleanup EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$session" --token-file "$token" --ttl-seconds 600 \
            --stale-takeover-reason 'owner-approved canonical Kasm bootstrap retry after proven rollback'
          active=true
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          python3 "$transition" kasm-bootstrap \
            --task-id "$task" --session-id "$session" --token-file "$token" \
            --worker "$worker" --probe "$probe" --worker-timeout 180
          bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token"
          active=false; rm -f "$token"
          echo TRACK_A_CANONICAL_KASM_BOOTSTRAP_RETRY=PASS
          echo NO_CREDENTIAL_ACCESS=true
          trap - EXIT

      - name: Verify restored canonical registration
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - "$CANONICAL_STATE/runtime-registration.json" "$EXPECTED_VERSION" "$EXPECTED_SIZE" "$EXPECTED_SHA" "$TASK_ID" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d['client_version']==sys.argv[2]
          assert d['client_size']==int(sys.argv[3])
          assert d['client_sha256']==sys.argv[4]
          assert d['state']=='UNKNOWN'
          assert d['proof_kind']=='existing_runtime_adoption_v1'
          assert d['candidate_count']==1
          assert d['inventory_scope']=='canonical_kasm_container' and d['inventory_complete'] is True
          assert d['source_task']==sys.argv[5]
          print('TRACK_A_CANONICAL_KASM_BOOTSTRAP_RETRY_REGISTRATION=PASS')
          PY
          echo NO_CREDENTIAL_ACCESS=true

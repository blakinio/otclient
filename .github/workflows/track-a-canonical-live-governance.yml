name: Track A canonical live governance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-canonical-live-governance.yml
      - .github/scripts/tibia-official-client-re-canonical-live-transition.py
      - .github/scripts/test_tibia_official_client_re_canonical_live-transition.py
      - .github/scripts/tibia-official-client-re-kasm-existing-runtime-probe.py
      - .github/scripts/test_tibia_official_client_re_kasm_existing_runtime_probe.py
      - docs/agents/contracts/TRACK_A_RUNTIME_AGENT_ADMISSION_V1.md
      - docs/agents/MODULE_CATALOG.md
      - docs/agents/tasks/active/OTC-20260819-track-a-existing-runtime-adoption.md
      - docs/agents/evidence/OTC-20260819-track-a-existing-runtime-adoption/**
      - docs/agents/CHANGELOG.md
      - docs/agents/TIBIA_RESEARCH_TRACKS.md
      - docs/agents/contracts/TRACK_A_CANONICAL_LIVE_BOOTSTRAP_V1.md
      - docs/agents/decisions/ADR-0001-track-a-canonical-live-runtime.md
      - docs/agents/tasks/active/OTC-20260815-track-a-canonical-live-runtime.md
      - docs/agents/tasks/archive/OTC-20260815-track-a-canonical-live-runtime.md
      - docs/agents/evidence/OTC-20260815-track-a-canonical-live-runtime/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-governance-audit:
    name: Fresh independent acceptance audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Falsify canonical authority, rebind, recovery, identity and bootstrap invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tracks = Path('docs/agents/TIBIA_RESEARCH_TRACKS.md').read_text()
          adr = Path('docs/agents/decisions/ADR-0001-track-a-canonical-live-runtime.md').read_text()
          bootstrap = Path('docs/agents/contracts/TRACK_A_CANONICAL_LIVE_BOOTSTRAP_V1.md').read_text()
          changelog = Path('docs/agents/CHANGELOG.md').read_text()

          required_all = {
              'tracks': (tracks, [
                  'tibia_research_tracks_policy_version: 6',
                  'final PR #321 cancellation-safe semantics',
                  'Registration generation rebind — fail closed before Gate B',
                  'Canonical stale-registration recovery — exact singleton replacement without client mutation',
                  'ordinary rebind is the wrong transition',
                  'Ad-hoc manual editing of `runtime-registration.json` is never a substitute.',
                  'Initial creation/bootstrap — separate fail-closed transition',
                  'display_98_current_canonical_status: UNKNOWN',
                  'rfb_6082_current_backend_mapping: UNKNOWN',
                  'current_exact_client_pid: NOT_REGISTERED',
                  'current_exact_client_session: NOT_REGISTERED',
              ]),
              'adr': (adr, [
                  'Gate A — authoritative lease plus final cancellation-safe whole-lifetime supervisor',
                  'PR #321 is the final cancellation-safe implementation',
                  'Registration-generation rebind — fail closed before Gate B equality',
                  'the only registration defect being repaired by this transition is the older lease generation',
                  'The reviewed canonical transition controller implements this unchanged-identity rebind path.',
                  'Canonical stale-registration recovery — replace only a fully proven stale adoption identity',
                  'A registration whose PID/start identity no longer matches the current runtime is **not rebindable**.',
                  'Gate B — authoritative current-runtime registration and fresh preflight',
                  'Initial creation/bootstrap is a separate transition',
                  'display_98_current_canonical_status: UNKNOWN',
                  'current_exact_client_pid: NOT_REGISTERED',
              ]),
              'bootstrap': (bootstrap, [
                  'PR #321 supplies cancellation-safe lock ownership',
                  'fresh final manager closeout/archive: PR #322',
                  'Post-bootstrap controller-generation rebind',
                  'It cannot create a missing registration',
                  'The reviewed canonical transition controller implements this unchanged-identity generation-rebind path.',
                  'route only to that recovery lifecycle',
                  'foreground process-group cancellation with a signal-ignoring descendant cannot release the canonical flock early',
              ]),
              'changelog': (changelog, [
                  'Track A canonical-live policy v5 separates four fail-closed transitions',
                  'The rebind/bootstrap transitions are governance contracts only and are not implemented or live-authorized by this PR.',
              ]),
          }

          for label, (text, needles) in required_all.items():
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(f'{label}: missing required invariants: {missing}')

          fence = '552dcf794c41dae8c3dca10b740cd23e2f2ebcaf82d86576e8a67d924409e4e1'
          for label, text in [('tracks', tracks), ('adr', adr), ('bootstrap', bootstrap), ('changelog', changelog)]:
              if fence not in text:
                  raise SystemExit(f'{label}: exact client fence missing')

          forbidden = {
              'tracks': ['These are the final PR #316 semantics'],
              'adr': ['The final authority implementation is the manager/supervisor stack promoted through PRs #312, #313, #317 and #316, with fresh closeout in #319.'],
              'bootstrap': [
                  'fresh manager closeout/archive: PR #319',
                  'Later external mutation requires a fresh/current lease plus current exact-runtime registration/preflight.\n',
              ],
          }
          for label, needles in forbidden.items():
              text = {'tracks': tracks, 'adr': adr, 'bootstrap': bootstrap}[label]
              present = [needle for needle in needles if needle in text]
              if present:
                  raise SystemExit(f'{label}: stale governance text survived restack: {present}')

          print('TRACK_A_CANONICAL_GOVERNANCE_FRESH_AUDIT_PASS=true')
          PY

  existing-runtime-adoption-tests:
    name: Existing runtime adoption fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate adoption implementation and governance markers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/tibia-official-client-re-canonical-live-transition.py .github/scripts/tibia-official-client-re-kasm-existing-runtime-probe.py
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py -v
          python3 .github/scripts/test_tibia_official_client_re_kasm_existing_runtime_probe.py -v
          grep -Fq "def _adopt_existing(" .github/scripts/tibia-official-client-re-canonical-live-transition.py
          grep -Fq "Existing-runtime adoption" docs/agents/TIBIA_RESEARCH_TRACKS.md
          grep -Fq "metadata-only registration of one exact pre-existing client" docs/agents/decisions/ADR-0001-track-a-canonical-live-runtime.md
          grep -Fq "adopt_existing" docs/agents/contracts/TRACK_A_RUNTIME_AGENT_ADMISSION_V1.md
          grep -Fq "Existing-runtime adoption — separate missing-registration transition" docs/agents/contracts/TRACK_A_CANONICAL_LIVE_BOOTSTRAP_V1.md
          echo TRACK_A_EXISTING_RUNTIME_ADOPTION_VALIDATION=PASS

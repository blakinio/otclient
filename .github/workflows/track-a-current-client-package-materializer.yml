name: Track A current client package materializer contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/test_track_a_current_client_package_parallel.py
      - .github/scripts/test_track_a_current_client_package_seed.py
      - .github/scripts/track_a_current_client_package_materialize.py
      - .github/scripts/track_a_current_client_package_acquire.sh
      - .github/workflows/track-a-current-client-package-materializer.yml
      - docs/agents/tasks/active/OTC-20260828-current-login-field6-runtime.md
      - docs/agents/evidence/OTC-20260828-current-login-field6-runtime/**
      - docs/superpowers/plans/2026-08-28-field6-materializer-repair.md

permissions:
  contents: read

jobs:
  contract:
    name: Bounded package materializer contract
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate bounded deterministic materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/test_track_a_current_client_package_parallel.py
          python3 .github/scripts/test_track_a_current_client_package_seed.py
          python3 -m py_compile .github/scripts/track_a_current_client_package_materialize.py
          bash -n .github/scripts/track_a_current_client_package_acquire.sh
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from HEAD^1 \
            --expected-branch "$GITHUB_HEAD_REF"
          git diff --check HEAD^1 HEAD
          echo TRACK_A_CURRENT_CLIENT_PACKAGE_MATERIALIZER_CONTRACT=PASS

name: Track A field6 clean-runner host-probe contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/test_track_a_field6_clean_runner_host_probe.py
      - .github/workflows/track-a-field6-clean-runner-host-probe.yml
      - .github/workflows/track-a-field6-clean-runner-host-probe-contract.yml
      - docs/agents/tasks/active/OTC-20260816-track-a-isolated-xvfb-startup-discriminator.md
      - docs/agents/tasks/active/OTC-20260829-field6-clean-runner-host-probe.md
      - docs/agents/reports/OTC-20260829-field6-clean-runner-host-probe.md

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate no-secret host probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/test_track_a_field6_clean_runner_host_probe.py
          python3 .github/scripts/test_track_a_selfhosted_pr_boundary.py
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from HEAD^1 \
            --expected-branch "$GITHUB_HEAD_REF"
          git diff --check HEAD^1 HEAD
          echo TRACK_A_FIELD6_CLEAN_RUNNER_HOST_PROBE_CONTRACT=PASS

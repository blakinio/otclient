name: Track A game window state qualification

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/track_a_game_window_state_qualification.py
      - .github/scripts/test_track_a_game_window_state_qualification.py
      - .github/scripts/test_track_a_game_window_state_workflow_contract.py
      - .github/workflows/track-a-game-window-state-qualification.yml
      - docs/agents/tasks/active/OTC-20260828-game-window-state-qualification.md

permissions:
  contents: read

env:
  EXPECTED_VERSION: 15.32.75d4a0
  EXPECTED_SIZE: 52105824
  EXPECTED_SHA: d1a16819cec7e40cfee39c099d4868d2eb2d7c1c942078eda105233b5688817a
  CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
  TASK_ID: OTC-20260828-game-window-state-qualification
  RUNTIME_NAMESPACE: track-a-game-window-state-validation

jobs:
  contract:
    if: github.event_name == 'pull_request'
    name: Read-only gameWindowState contract
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate focused reader and workflow contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/track_a_game_window_state_qualification.py \
            .github/scripts/test_track_a_game_window_state_qualification.py \
            .github/scripts/test_track_a_game_window_state_workflow_contract.py
          python3 .github/scripts/test_track_a_game_window_state_qualification.py
          python3 .github/scripts/test_track_a_game_window_state_workflow_contract.py
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0]); puts "YAML_PARSE=PASS"' \
            .github/workflows/track-a-game-window-state-qualification.yml
          git diff --check HEAD^1 HEAD

  live-qualification:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event.comment.body == 'PREFLIGHT_GAME_WINDOW_STATE_QUALIFICATION' ||
       github.event.comment.body == 'START_GAME_WINDOW_STATE_QUALIFICATION')
    name: Continuous read-only gameWindowState qualification
    runs-on: [otclient, synology]
    timeout-minutes: 35
    concurrency:
      group: track-a-game-window-state-qualification-live
      cancel-in-progress: false
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 1

      - name: Prove trusted-main runtime-none checkpoint and current fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          task="docs/agents/tasks/active/OTC-20260828-game-window-state-qualification.md"
          test -f "$task"
          grep -Fqx 'runtime_access: none' "$task"
          grep -Fqx 'runtime_owner_task: NOT_APPLICABLE' "$task"
          grep -Fqx 'runtime_namespace: NOT_APPLICABLE' "$task"
          grep -Fqx 'canonical_registration: NOT_APPLICABLE' "$task"
          grep -Fqx 'canonical_lease_generation: NOT_APPLICABLE' "$task"
          grep -Fqx 'registration_lease_generation: NOT_APPLICABLE' "$task"
          grep -Fqx 'mutation_authorized: false' "$task"
          grep -Fqx 'login_allowed: false' "$task"
          grep -Fqx 'character_selection_allowed: false' "$task"
          grep -Fqx 'gameplay_allowed: false' "$task"
          grep -Fqx 'gui_input_authorized: false' "$task"
          grep -Fqx 'process_control_authorized: false' "$task"
          grep -Fqx 'physical_action_budget: 0' "$task"
          grep -Fqx 'gate_a: NOT_APPLICABLE' "$task"
          grep -Fqx 'generation_rebind: NOT_APPLICABLE' "$task"
          grep -Fqx 'gate_b: NOT_APPLICABLE' "$task"
          grep -Fqx 'bootstrap: NOT_APPLICABLE' "$task"
          grep -Fqx 'target_uniqueness: NOT_APPLICABLE' "$task"
          echo REPOSITORY_CHECKPOINT_RUNTIME_ACCESS=none
          python3 .github/scripts/test_track_a_canonical_current_client_fence.py
          echo GAME_WINDOW_STATE_TRUSTED_MAIN_CHECKPOINT=PASS

      - name: Validate bounded qualification command
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          text = os.environ['COMMAND'].strip()
          if text not in {'PREFLIGHT_GAME_WINDOW_STATE_QUALIFICATION', 'START_GAME_WINDOW_STATE_QUALIFICATION'}:
              raise SystemExit('QUALIFICATION_COMMAND_INVALID')
          print('QUALIFICATION_COMMAND=PASS')
          PY

      - name: Resolve canonical registration and current ownership
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$CANONICAL_STATE" "$TASK_ID" "$EXPECTED_VERSION" "$EXPECTED_SIZE" "$EXPECTED_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json,os,pathlib,stat,sys,time
          root=pathlib.Path(sys.argv[1]); task=sys.argv[2]
          version=sys.argv[3]; size=int(sys.argv[4]); sha=sys.argv[5]; output=pathlib.Path(sys.argv[6])
          now=int(time.time())
          try:
              root_st=root.lstat()
          except OSError as exc:
              raise SystemExit('CANONICAL_STATE_ROOT_UNAVAILABLE') from exc
          if stat.S_ISLNK(root_st.st_mode) or not stat.S_ISDIR(root_st.st_mode):
              raise SystemExit('CANONICAL_STATE_ROOT_UNSAFE')
          if hasattr(os,'getuid') and root_st.st_uid != os.getuid():
              raise SystemExit('CANONICAL_STATE_ROOT_OWNER_MISMATCH')
          def load(name, required=False):
              p=root/name
              try:
                  st=p.lstat()
              except FileNotFoundError:
                  if required: raise SystemExit(name.upper().replace('-','_').replace('.','_')+'_ABSENT')
                  return None
              except OSError as exc:
                  raise SystemExit(name.upper().replace('-','_').replace('.','_')+'_UNAVAILABLE') from exc
              if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode) or stat.S_IMODE(st.st_mode) != 0o600:
                  raise SystemExit(name.upper().replace('-','_').replace('.','_')+'_UNSAFE')
              if hasattr(os,'getuid') and st.st_uid != os.getuid():
                  raise SystemExit(name.upper().replace('-','_').replace('.','_')+'_OWNER_MISMATCH')
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(name.upper().replace('-','_').replace('.','_')+'_INVALID') from exc
              if not isinstance(d,dict): raise SystemExit(name.upper().replace('-','_').replace('.','_')+'_NOT_OBJECT')
              return d
          reg=load('runtime-registration.json', required=True)
          lease=load('lease.json')
          if reg.get('schema_version') != 1 or reg.get('runtime_id') != 'track-a-canonical-live':
              raise SystemExit('REGISTRATION_SCHEMA_INVALID')
          exact={'client_version':version,'client_size':size,'client_sha256':sha}
          for key,value in exact.items():
              if reg.get(key)!=value: raise SystemExit('REGISTRATION_'+key.upper()+'_MISMATCH')
          pid=reg.get('pid'); start=reg.get('process_start_ticks')
          if not isinstance(pid,int) or pid < 2: raise SystemExit('REGISTRATION_PID_INVALID')
          if not isinstance(start,int) or start < 1: raise SystemExit('REGISTRATION_PROCESS_START_TICKS_INVALID')
          locator=reg.get('runtime_locator')
          if not isinstance(locator,str): raise SystemExit('REGISTRATION_RUNTIME_LOCATOR_INVALID')
          parts=locator.split(':',2)
          if len(parts)!=3 or parts[0]!='docker' or not parts[1] or not parts[2]:
              raise SystemExit('REGISTRATION_RUNTIME_LOCATOR_INVALID')
          container_name,container_id=parts[1],parts[2]
          if lease is not None:
              if lease.get('schema_version') != 1 or lease.get('runtime_id') != 'track-a-canonical-live':
                  raise SystemExit('LEASE_SCHEMA_INVALID')
              if lease.get('status') not in {'active','released'}:
                  raise SystemExit('LEASE_STATUS_INVALID')
              generation=lease.get('generation')
              if not isinstance(generation,int) or generation < 1:
                  raise SystemExit('LEASE_GENERATION_INVALID')
              if lease.get('status') == 'active':
                  expires=lease.get('expires_at')
                  owner=lease.get('controller_task')
                  if not isinstance(expires,int) or not isinstance(owner,str) or not owner:
                      raise SystemExit('ACTIVE_RUNTIME_OWNER_AMBIGUOUS')
                  if expires > now and owner != task:
                      raise SystemExit('ACTIVE_RUNTIME_OWNER_CONFLICT')
          with output.open('a',encoding='utf-8') as f:
              f.write('container='+container_id+'\n')
              f.write('container_name='+container_name+'\n')
              f.write('pid='+str(pid)+'\n')
              f.write('start_ticks='+str(start)+'\n')
          print('CANONICAL_REGISTRATION_TARGET=PASS')
          PY

      - name: Re-prove global unique exact target
        id: current_target
        shell: bash
        env:
          REGISTERED_CONTAINER: ${{ steps.target.outputs.container }}
          REGISTERED_CONTAINER_NAME: ${{ steps.target.outputs.container_name }}
          REGISTERED_PID: ${{ steps.target.outputs.pid }}
          REGISTERED_START: ${{ steps.target.outputs.start_ticks }}
        run: |
          set -Eeuo pipefail
          test -n "$REGISTERED_CONTAINER"
          test -n "$REGISTERED_CONTAINER_NAME"
          test -n "$REGISTERED_PID"
          test -n "$REGISTERED_START"
          docker inspect -f '{{.State.Running}}' "$REGISTERED_CONTAINER" | grep -Fx true >/dev/null
          actual_name="$(docker inspect -f '{{.Name}}' "$REGISTERED_CONTAINER" | sed 's#^/##')"
          test "$actual_name" = "$REGISTERED_CONTAINER_NAME"
          REGISTERED_CONTAINER_FULL="$(docker inspect -f '{{.Id}}' "$REGISTERED_CONTAINER")"
          [[ "$REGISTERED_CONTAINER_FULL" =~ ^[0-9a-f]{64}$ ]] || {
            echo REGISTERED_CONTAINER_FULL_ID_INVALID >&2
            exit 2
          }

          mapfile -t INVENTORY_CONTAINERS < <(docker ps --no-trunc --format '{{.ID}}')
          test "${#INVENTORY_CONTAINERS[@]}" -ge 1
          candidate_count=0
          current_container=''
          current_pid=''
          current_start=''
          for cid in "${INVENTORY_CONTAINERS[@]}"; do
            tmp="$(mktemp)"
            if ! docker exec "$cid" sh -lc '
              set -eu
              for d in /proc/[0-9]*; do
                [ -r "$d/comm" ] || continue
                pid=${d#/proc/}
                comm=$(cat "$d/comm" 2>/dev/null || true)
                exe=$(readlink -f "$d/exe" 2>/dev/null || true)
                hinted=0
                case "$comm" in client|Tibia*) hinted=1 ;; esac
                case "$exe" in *"/Tibia/"*|*"/Tibia/packages/Tibia/"*) hinted=1 ;; esac
                [ "${exe##*/}" = client ] && hinted=1
                [ "$hinted" -eq 1 ] || continue
                if [ -z "$exe" ] || [ ! -r "$d/stat" ]; then
                  printf "%s\tUNREADABLE\tUNREADABLE\tUNREADABLE\n" "$pid"
                  continue
                fi
                start=$(awk "{print \$22}" "$d/stat" 2>/dev/null || echo UNREADABLE)
                size=$(stat -Lc %s "$d/exe" 2>/dev/null || echo UNREADABLE)
                sha=$(sha256sum "$d/exe" 2>/dev/null | awk "{print \$1}" || true)
                [ -n "$sha" ] || sha=UNREADABLE
                printf "%s\t%s\t%s\t%s\n" "$pid" "$start" "$size" "$sha"
              done
            ' >"$tmp"; then
              rm -f "$tmp"
              echo OFFICIAL_CLIENT_INVENTORY_INCOMPLETE >&2
              exit 2
            fi
            mapfile -t candidate_rows < "$tmp"
            rm -f "$tmp"
            for row in "${candidate_rows[@]}"; do
              IFS=$'\t' read -r pid start size sha <<<"$row"
              [ -n "$pid" ] || continue
              [[ "$pid" =~ ^[0-9]+$ && "$start" =~ ^[0-9]+$ && "$size" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{64}$ ]] || {
                echo OFFICIAL_CLIENT_CANDIDATE_UNVERIFIABLE >&2
                exit 2
              }
              if [ "$size" != "$EXPECTED_SIZE" ] || [ "$sha" != "$EXPECTED_SHA" ]; then
                echo OFFICIAL_CLIENT_CANDIDATE_FENCE_MISMATCH >&2
                exit 2
              fi
              candidate_count=$((candidate_count + 1))
              current_container="$cid"
              current_pid="$pid"
              current_start="$start"
            done
          done
          test "$candidate_count" -eq 1 || { echo "OFFICIAL_CLIENT_CANDIDATE_COUNT=$candidate_count" >&2; exit 2; }
          test "$current_container" = "$REGISTERED_CONTAINER_FULL" || {
            echo CURRENT_UNIQUE_CANDIDATE_NOT_CANONICAL_CONTAINER >&2
            exit 2
          }
          if [ "$current_pid" = "$REGISTERED_PID" ] && [ "$current_start" = "$REGISTERED_START" ]; then
            echo READ_ONLY_CURRENT_TARGET_IDENTITY=REGISTERED_CURRENT
          else
            test "$current_start" -gt "$REGISTERED_START" || {
              echo READ_ONLY_CURRENT_TARGET_NOT_NEWER_THAN_REGISTRATION >&2
              exit 2
            }
            echo READ_ONLY_CURRENT_TARGET_REFRESH=PASS
          fi
          {
            echo "container=$current_container"
            echo "container_name=$REGISTERED_CONTAINER_NAME"
            echo "pid=$current_pid"
            echo "start_ticks=$current_start"
          } >> "$GITHUB_OUTPUT"
          echo OFFICIAL_CLIENT_CANDIDATE_COUNT=1
          echo TARGET_PROCESS_UNIQUENESS=PROVEN

      - name: Persist and validate fresh read-only admission
        id: admission
        shell: bash
        env:
          TARGET_PID: ${{ steps.current_target.outputs.pid }}
          TARGET_START: ${{ steps.current_target.outputs.start_ticks }}
        run: |
          set -Eeuo pipefail
          admission="$RUNNER_TEMP/game-window-state-readonly-admission.json"
          python3 - "$admission" "$TASK_ID" "$RUNTIME_NAMESPACE" "$EXPECTED_VERSION" "$EXPECTED_SIZE" "$EXPECTED_SHA" "$TARGET_PID" "$TARGET_START" "$(git rev-parse HEAD)" <<'PY'
          import json,os,pathlib,stat,sys
          path=pathlib.Path(sys.argv[1]); task=sys.argv[2]; namespace=sys.argv[3]
          version=sys.argv[4]; size=int(sys.argv[5]); sha=sys.argv[6]
          pid=int(sys.argv[7]); start=int(sys.argv[8]); main_sha=sys.argv[9]
          admission={
              'track_id':'official-client-re',
              'runtime_access':'read_only',
              'runtime_owner_task':task,
              'runtime_namespace':namespace,
              'canonical_registration':'PRESENT',
              'canonical_lease_generation':'UNKNOWN',
              'registration_lease_generation':'UNKNOWN',
              'gate_a':'NOT_APPLICABLE',
              'generation_rebind':'NOT_APPLICABLE',
              'gate_b':'NOT_APPLICABLE',
              'bootstrap':'NOT_APPLICABLE',
              'target_uniqueness':'PROVEN',
              'mutation_authorized':False,
              'client_version':version,
              'client_size':size,
              'client_sha256':sha,
              'pid':pid,
              'process_start_ticks':start,
              'trusted_main_sha':main_sha,
          }
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_CLOEXEC,0o600)
          with os.fdopen(fd,'w',encoding='utf-8',newline='\n') as handle:
              json.dump(admission,handle,sort_keys=True,separators=(',',':'))
              handle.write('\n'); handle.flush(); os.fsync(handle.fileno())
          st=path.lstat()
          if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode) or stat.S_IMODE(st.st_mode)!=0o600:
              raise SystemExit('READ_ONLY_ADMISSION_FILE_UNSAFE')
          loaded=json.loads(path.read_text(encoding='utf-8'))
          required={
              'track_id':'official-client-re','runtime_access':'read_only','runtime_owner_task':task,
              'runtime_namespace':namespace,'canonical_registration':'PRESENT','gate_a':'NOT_APPLICABLE',
              'generation_rebind':'NOT_APPLICABLE','gate_b':'NOT_APPLICABLE','bootstrap':'NOT_APPLICABLE',
              'target_uniqueness':'PROVEN','mutation_authorized':False,'client_version':version,
              'client_size':size,'client_sha256':sha,'pid':pid,'process_start_ticks':start,
              'trusted_main_sha':main_sha,
          }
          if any(loaded.get(k)!=v for k,v in required.items()):
              raise SystemExit('READ_ONLY_ADMISSION_RECORD_INVALID')
          print('READ_ONLY_ADMISSION_RECORD=PASS')
          PY
          echo "path=$admission" >> "$GITHUB_OUTPUT"
          echo TRACK_A_RUNTIME_ACCESS=read_only
          echo "TRACK_A_RUNTIME_OWNER_TASK=$TASK_ID"
          echo "TRACK_A_RUNTIME_NAMESPACE=$RUNTIME_NAMESPACE"
          echo TRACK_A_CANONICAL_REGISTRATION=PRESENT
          echo TRACK_A_GATE_A=NOT_APPLICABLE
          echo TRACK_A_GENERATION_REBIND=NOT_APPLICABLE
          echo TRACK_A_GATE_B=NOT_APPLICABLE
          echo TRACK_A_TARGET_UNIQUENESS=PROVEN
          echo TRACK_A_MUTATION_AUTHORIZED=false

      - name: Revalidate admission immediately before any observation
        shell: bash
        env:
          ADMISSION: ${{ steps.admission.outputs.path }}
          CONTAINER: ${{ steps.current_target.outputs.container }}
          TARGET_PID: ${{ steps.current_target.outputs.pid }}
          TARGET_START: ${{ steps.current_target.outputs.start_ticks }}
        run: |
          set -Eeuo pipefail
          python3 - "$ADMISSION" "$TASK_ID" "$RUNTIME_NAMESPACE" "$EXPECTED_VERSION" "$EXPECTED_SIZE" "$EXPECTED_SHA" "$TARGET_PID" "$TARGET_START" "$(git rev-parse HEAD)" <<'PY'
          import json,pathlib,stat,sys
          path=pathlib.Path(sys.argv[1]); task=sys.argv[2]; namespace=sys.argv[3]
          version=sys.argv[4]; size=int(sys.argv[5]); sha=sys.argv[6]
          pid=int(sys.argv[7]); start=int(sys.argv[8]); main_sha=sys.argv[9]
          st=path.lstat()
          if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode) or stat.S_IMODE(st.st_mode)!=0o600:
              raise SystemExit('READ_ONLY_ADMISSION_FILE_UNSAFE')
          d=json.loads(path.read_text(encoding='utf-8'))
          checks={
              'track_id':'official-client-re','runtime_access':'read_only','runtime_owner_task':task,
              'runtime_namespace':namespace,'canonical_registration':'PRESENT','gate_a':'NOT_APPLICABLE',
              'generation_rebind':'NOT_APPLICABLE','gate_b':'NOT_APPLICABLE','bootstrap':'NOT_APPLICABLE',
              'target_uniqueness':'PROVEN','mutation_authorized':False,'client_version':version,
              'client_size':size,'client_sha256':sha,'pid':pid,'process_start_ticks':start,
              'trusted_main_sha':main_sha,
          }
          if any(d.get(k)!=v for k,v in checks.items()):
              raise SystemExit('READ_ONLY_ADMISSION_REVALIDATION_FAILED')
          print('READ_ONLY_ADMISSION_REVALIDATION=PASS')
          PY
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          docker inspect -f '{{.State.Running}}' "$CONTAINER" | grep -Fx true >/dev/null
          actual_start="$(docker exec "$CONTAINER" sh -lc "awk '{print \$22}' /proc/$TARGET_PID/stat")"
          test "$actual_start" = "$TARGET_START"
          actual_size="$(docker exec "$CONTAINER" stat -Lc %s "/proc/$TARGET_PID/exe")"
          test "$actual_size" = "$EXPECTED_SIZE"
          actual_sha="$(docker exec "$CONTAINER" sha256sum "/proc/$TARGET_PID/exe" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo READ_ONLY_TARGET_RUNTIME_REVALIDATION=PASS

      - name: Report memory-free logger readiness preflight
        if: github.event.comment.body == 'PREFLIGHT_GAME_WINDOW_STATE_QUALIFICATION'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo GAME_WINDOW_STATE_LOGGER_PREFLIGHT=READY
          echo PROCESS_MEMORY_OBSERVATION_PERFORMED=false
          echo IN_GAME_CLAIMED=false
          echo semantic_promotion_performed=false

      - name: Build in-memory resolver bundle
        if: github.event.comment.body == 'START_GAME_WINDOW_STATE_QUALIFICATION'
        id: bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/game-window-state-qualification-bundle.py"
          python3 - "$bundle" <<'PY'
          from pathlib import Path
          import sys
          out=Path(sys.argv[1])
          modules=(
              ('track_a_current_world_entered_anchor','.github/scripts/track_a_current_world_entered_anchor.py'),
              ('track_a_current_world_entered_durable_state','.github/scripts/track_a_current_world_entered_durable_state.py'),
          )
          lines=['import sys,types\n']
          for name,path_s in modules:
              path=Path(path_s); source=path.read_text(encoding='utf-8')
              lines.append(f"m=types.ModuleType({name!r});m.__file__={str(path)!r};sys.modules[{name!r}]=m\n")
              lines.append(f"exec(compile({source!r},{str(path)!r},'exec'),m.__dict__)\n")
          qpath=Path('.github/scripts/track_a_game_window_state_qualification.py')
          qsource=qpath.read_text(encoding='utf-8')
          lines.append(f"globals()['__file__']={str(qpath)!r}\n")
          lines.append(f"exec(compile({qsource!r},{str(qpath)!r},'exec'),globals())\n")
          out.write_text(''.join(lines),encoding='utf-8')
          PY
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo RESOLVER_BUNDLE=PASS

      - name: Capture continuous bounded state log
        if: github.event.comment.body == 'START_GAME_WINDOW_STATE_QUALIFICATION'
        shell: bash
        env:
          CONTAINER: ${{ steps.current_target.outputs.container }}
          TARGET_PID: ${{ steps.current_target.outputs.pid }}
          TARGET_START: ${{ steps.current_target.outputs.start_ticks }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/game-window-state-qualification.jsonl"
          docker exec -i "$CONTAINER" python3 - \
            --pid "$TARGET_PID" \
            --start-ticks "$TARGET_START" \
            --expected-size "$EXPECTED_SIZE" \
            --expected-sha256 "$EXPECTED_SHA" \
            --output /dev/stdout \
            --duration-seconds 1800 \
            --poll-seconds 0.25 \
            --heartbeat-seconds 5 \
            < "$BUNDLE" > "$out"
          test -s "$out"
          echo QUALIFICATION_CAPTURE=PASS

      - name: Validate secret-free qualification artifact
        if: github.event.comment.body == 'START_GAME_WINDOW_STATE_QUALIFICATION'
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/game-window-state-qualification.jsonl"
          test -s "$out"
          python3 - "$out" <<'PY'
          import json,sys
          rows=[]
          with open(sys.argv[1],encoding='utf-8') as f:
              for raw in f:
                  if raw.strip(): rows.append(json.loads(raw))
          if not rows: raise SystemExit('QUALIFICATION_LOG_EMPTY')
          allowed={'EMPTY','INGAME','OTHER','UNKNOWN'}
          for d in rows:
              if d.get('schema')!='otclient.track-a.game-window-state-qualification.v1': raise SystemExit('SCHEMA_INVALID')
              if d.get('semantic_state') not in allowed: raise SystemExit('STATE_INVALID')
              if d.get('in_game_claimed') is not False: raise SystemExit('IN_GAME_CLAIM_FORBIDDEN')
              if d.get('semantic_promotion_performed') is not False: raise SystemExit('SEMANTIC_PROMOTION_FORBIDDEN')
              if d.get('process_memory_access')!='read_only': raise SystemExit('MEMORY_ACCESS_INVALID')
              for key in ('raw_heap_bytes_retained','raw_pointer_values_retained','raw_window_title_retained','credentials_retained','session_secrets_retained','packet_payloads_retained','process_environment_retained'):
                  if d.get(key) is not False: raise SystemExit(key+'_INVALID')
              if d.get('semantic_state')=='OTHER' and (d.get('known_text') is not None or d.get('known_value_sha256') is not None):
                  raise SystemExit('OTHER_PAYLOAD_RETENTION_FORBIDDEN')
          print('QUALIFICATION_ARTIFACT_SANITIZED=PASS')
          print('IN_GAME_CLAIMED=false')
          print('semantic_promotion_performed=false')
          PY

      - name: Upload secret-free gameWindowState log
        if: ${{ always() && github.event.comment.body == 'START_GAME_WINDOW_STATE_QUALIFICATION' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: track-a-game-window-state-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/game-window-state-qualification.jsonl
          if-no-files-found: warn
          retention-days: 3

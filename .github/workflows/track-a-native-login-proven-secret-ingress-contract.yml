name: Track A proven secret-ingress contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/track-a-native-login-be4f48-proven.yml
      - .github/workflows/track-a-native-login-proven-secret-ingress-contract.yml
      - .github/scripts/track_a_native_login_be4f48_proven.py
      - tools/tibia_runtime_bridge/native_login_secret_ingress.py
      - tests/tools/tibia_runtime_bridge/test_native_login_proven_secret_ingress_contract.py
      - docs/agents/tasks/active/OTC-20260907-native-login-proven-secret-ingress.md

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run proven secret-ingress contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/tools/tibia_runtime_bridge/test_native_login_proven_secret_ingress_contract.py
          python3 -m py_compile \
            .github/scripts/track_a_native_login_be4f48_proven.py \
            tools/tibia_runtime_bridge/native_login_secret_ingress.py
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

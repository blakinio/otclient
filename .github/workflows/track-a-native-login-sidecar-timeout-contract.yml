name: Track A native-login sidecar timeout contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/track_a_native_login_be4f48_physical.py
      - tests/tools/tibia_runtime_bridge/test_native_login_sidecar_timeout_observability_contract.py
      - .github/workflows/track-a-native-login-sidecar-timeout-contract.yml
      - docs/agents/tasks/active/OTC-20260906-native-login-sidecar-timeout-observability.md

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Run sidecar timeout observability contract
        run: |
          set -Eeuo pipefail
          python3 tests/tools/tibia_runtime_bridge/test_native_login_sidecar_timeout_observability_contract.py
          python3 -m py_compile .github/scripts/track_a_native_login_be4f48_physical.py
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

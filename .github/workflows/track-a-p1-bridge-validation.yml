name: Track A P1 Bridge Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/tibia_runtime_bridge/**"
      - "tests/tools/tibia_runtime_bridge/**"
      - ".github/workflows/track-a-p1-bridge-validation.yml

permissions: {}

jobs:
  bridge:
    name: P1 Bridge / Hosted
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Verify accepted baseline blobs remain exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/tibia_runtime_bridge/CMakeLists.txt)" = "588293427b6a4f07b91aede0858402da0084ce75"
          test "$(git rev-parse HEAD:tools/tibia_runtime_bridge/__init__.py)" = "3cb0afd1ef3f0ddebeca9d0fd6b410ecc59bfeb5"
          test "$(git rev-parse HEAD:tools/tibia_runtime_bridge/bridge.cpp)" = "fa2c052631cd111ba0cb221d10975d505bbf6625"
          test "$(git rev-parse HEAD:tools/tibia_runtime_bridge/launcher.py)" = "b92ec9b7752bbe031671ce3f0e521a74f2f1dc1b"
          test "$(git rev-parse HEAD:tools/tibia_runtime_bridge/resolver.py)" = "8cd1bb3b812c7e93fca641c80202dc69734071db"
          test "$(git rev-parse HEAD:tools/tibia_runtime_bridge/profiles/tibia-15.32.df7b29.json)" = "b3ad235e06170fcc291bb5a6936f75b3f3db65dc"
          test "$(git rev-parse HEAD:tests/tools/tibia_runtime_bridge/test_bridge.py)" = "ac78d8b9875f835f18f2c722854294607f9904b8"

      - name: Compile Python bridge tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/tibia_runtime_bridge/launcher.py \
            tools/tibia_runtime_bridge/ipc_client.py \
            tools/tibia_runtime_bridge/resolver.py \
            tools/tibia_runtime_bridge/health.py

      - name: Run focused bridge and lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/tools/tibia_runtime_bridge -p 'test_*.py' -v

      - name: Install standalone bridge build dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - name: Build standalone bridge helper
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/tibia_runtime_bridge -B "${RUNNER_TEMP}/tibia-runtime-bridge-build"
          cmake --build "${RUNNER_TEMP}/tibia-runtime-bridge-build" --parallel
          test -f "${RUNNER_TEMP}/tibia-runtime-bridge-build/otclient-tibia-runtime-bridge.so"

name: Track A persistent LAN view

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type INSPECT_KASM_ENDPOINTS
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == 'blakinio' && inputs.authorization == 'INSPECT_KASM_ENDPOINTS'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TARGET_CONTAINER: otclient-track-a-kasmvnc
      STATIC_CONTAINER: otclient-kasm-static-probe
      EXPECTED_MAIN: 96d1fadac4c25c2d2ceb679cb21722f46f7688b6
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prove current trusted main and existing client
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          docker inspect -f '{{.State.Running}}' "$TARGET_CONTAINER" | grep -Fx true >/dev/null
          test "$(docker exec "$TARGET_CONTAINER" pgrep -x client | wc -l)" -eq 1
          echo READ_ONLY_RUNTIME_INVENTORY=PASS

      - name: Start ephemeral static sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$(docker inspect -f '{{.Config.Image}}' "$TARGET_CONTAINER")"
          docker rm -f "$STATIC_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$STATIC_CONTAINER" --network host \
            --entrypoint python3 "$image" -m http.server 16084 --bind 127.0.0.1 \
            --directory /usr/share/kasmvnc/www >/dev/null
          for _ in $(seq 1 20); do
            if docker exec "$STATIC_CONTAINER" python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:16084/', timeout=2).read()"; then
              echo STATIC_SIDECAR_READY=true
              exit 0
            fi
            sleep 0.25
          done
          exit 1

      - name: Stress static sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$(docker inspect -f '{{.Config.Image}}' otclient-synology-runner)"
          docker run --rm --network host --entrypoint python3 "$image" - <<'PY'
          import concurrent.futures, urllib.request
          paths=['/','/main.bundle.js','/assets/webutil-DUkojxeL.js','/assets/webutil-Dix4qgyj.css']
          def one(p):
              with urllib.request.urlopen('http://127.0.0.1:16084'+p, timeout=10) as r:
                  data=r.read(); expected=int(r.headers.get('Content-Length','-1'))
                  return p,r.status,len(data),expected,len(data)==expected
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              results=list(ex.map(one, paths*16))
          for row in results: print(row)
          assert all(row[-1] for row in results), results
          print('STATIC_SIDECAR_64_OF_64=PASS')
          PY

      - name: Cleanup ephemeral sidecar
        if: always()
        shell: bash
        run: docker rm -f "$STATIC_CONTAINER" >/dev/null 2>&1 || true

name: Track A persistent LAN view

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type INSPECT_KASM_ENDPOINTS
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == 'blakinio' && inputs.authorization == 'INSPECT_KASM_ENDPOINTS'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TARGET_CONTAINER: otclient-track-a-kasmvnc
      EXPECTED_MAIN: 462320593ce3efc764af443c23c51ac725e1759a
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prove current trusted main and existing client
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          docker inspect -f '{{.State.Running}}' "$TARGET_CONTAINER" | grep -Fx true >/dev/null
          test "$(docker exec "$TARGET_CONTAINER" pgrep -x client | wc -l)" -eq 1
          echo READ_ONLY_RUNTIME_INVENTORY=PASS

      - name: Inspect current VNC connections
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$TARGET_CONTAINER" sh -lc 'ss -tnp 2>/dev/null | grep -E ":(5901|6901)[[:space:]]" || true'

      - name: Inspect Xvnc log tail
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$TARGET_CONTAINER" sh -lc '
            f=$(ls -1t /home/kasm-user/.vnc/*.log 2>/dev/null | head -1)
            test -n "$f"
            echo LOG_FILE=$f
            echo === RELEVANT ===
            tail -n 500 "$f" | grep -Ei "connection|rfb|websocket|security|disconnect|client|protocol|auth|accepted|rejected|closed|error|read|write" | tail -n 250 || true
            echo === RAW_TAIL ===
            tail -n 120 "$f"
          '

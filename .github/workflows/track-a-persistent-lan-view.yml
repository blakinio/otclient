name: Track A Synology host Tibia Kasm inventory

on:
  push:
    branches:
      - research/OTC-20260827-kasm-endpoint-inventory
    paths:
      - .github/workflows/track-a-persistent-lan-view.yml

permissions:
  contents: read

jobs:
  inventory:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Inspect actual Synology host namespace read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          control=otclient-synology-runner
          image="$(docker inspect -f '{{.Config.Image}}' "$control")"
          test -n "$image"
          docker run --rm --pid=host --network=host --user 0:0 -v /:/host:ro \
            --entrypoint sh "$image" -lc '
              set -eu
              echo "=== HOST PID/NAMESPACE ==="
              ps -eo pid,ppid,user,lstart,args | grep -Ei "/bin/client|Tibia|Xvnc|kasm|x11vnc|websockify|Xorg|Xvfb" | grep -v grep || true
              echo "=== CLIENT EXES ==="
              python3 - <<"PY"
          import hashlib, os, pathlib
          rows=[]
          for p in pathlib.Path("/proc").iterdir():
              if not p.name.isdigit():
                  continue
              try:
                  comm=(p/"comm").read_text(errors="replace").strip()
                  cmd=(p/"cmdline").read_bytes().replace(b"\0",b" ").decode("utf-8","replace")
              except Exception:
                  continue
              if comm != "client" and "Tibia" not in cmd and "/bin/client" not in cmd:
                  continue
              try:
                  st=os.stat(p/"exe")
                  h=hashlib.sha256()
                  with open(p/"exe","rb") as f:
                      for chunk in iter(lambda:f.read(1024*1024),b""):
                          h.update(chunk)
                  exe=os.readlink(p/"exe")
                  rows.append((int(p.name),comm,exe,st.st_size,h.hexdigest(),cmd))
              except Exception as exc:
                  rows.append((int(p.name),comm,"ERR",0,type(exc).__name__,cmd))
          for row in sorted(rows):
              print("PID=%s\nCOMM=%s\nEXE=%s\nSIZE=%s\nSHA256=%s\nCMD=%s\n---" % row)
          print("HOST_CLIENT_COUNT="+str(len(rows)))
          PY
              echo "=== HOST X SOCKETS ==="
              ls -l /host/tmp/.X11-unix 2>/dev/null || true
              echo "=== HOST LISTENERS ==="
              ss -ltnp 2>/dev/null | grep -E ":(590[0-9]|608[0-9]|6901|844[0-9]|1608[0-9])[[:space:]]" || true
              echo "=== HISTORICAL RUNTIME PIDS ==="
              for f in /host/work/_otclient_tibia_re_state/runtime/*.pid /host/home/runner/_work/_otclient_tibia_re_state/runtime/*.pid; do
                [ -f "$f" ] || continue
                printf "%s=" "$f"; cat "$f"; printf "\n"
              done
            '

name: Track A inspect Tibia launcher IPC
on:
  push:
    branches: [research/OTC-20260827-kasm-endpoint-inventory]
    paths: [.github/workflows/track-a-persistent-lan-view.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Inspect launcher IPC and singleton primitives
        shell: bash
        run: |
          set -Eeuo pipefail
          c=otclient-track-a-kasmvnc
          docker inspect -f '{{.State.Running}}' "$c" | grep -Fx true
          echo '=== TIBIA PROCESSES ==='
          docker exec "$c" sh -lc "ps -eo user,pid,ppid,etime,args | grep -Ei '[t]ibia|[c]ipsoft|[l]auncher|[u]pdat' || true"
          echo '=== SYSV IPC ==='
          docker exec "$c" sh -lc 'ipcs -a 2>/dev/null || true'
          echo '=== PROC SYSVIPC ==='
          docker exec "$c" sh -lc 'for f in /proc/sysvipc/*; do echo ---$f---; cat "$f" 2>/dev/null || true; done'
          echo '=== UNIX SOCKETS ==='
          docker exec "$c" sh -lc "ss -lxap 2>/dev/null | head -300 || cat /proc/net/unix | head -300"
          echo '=== TMP ALL RECENT ==='
          docker exec "$c" sh -lc "find /tmp -maxdepth 2 -mmin -1440 -printf '%u %y %m %s %TY-%Tm-%Td_%TH:%TM:%TS %p\n' 2>/dev/null | head -350"
          echo '=== LAUNCHER IPC SYMBOLS ==='
          docker exec "$c" sh -lc "strings /home/kasm-user/Tibia/Tibia 2>/dev/null | grep -E 'QLocal(Server|Socket)|QSharedMemory|QSystemSemaphore|QLockFile|QSingle|single.?instance|already running' | sort -u | head -200 || true"
          echo '=== DYNAMIC SYMBOLS ==='
          docker exec "$c" sh -lc "nm -D /home/kasm-user/Tibia/Tibia 2>/dev/null | grep -E 'QLocal(Server|Socket)|QSharedMemory|QSystemSemaphore|QLockFile' | head -200 || true"

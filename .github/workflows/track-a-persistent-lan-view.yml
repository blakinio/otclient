name: Track A inspect normal Tibia package launcher
on:
  push:
    branches: [research/OTC-20260827-kasm-endpoint-inventory]
    paths: [.github/workflows/track-a-persistent-lan-view.yml]
permissions:
  contents: read
jobs:
  inventory:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Inspect original package and extracted roots read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          c=otclient-track-a-kasmvnc
          echo '=== ARCHIVE TOP ==='
          docker exec "$c" sh -lc "tar -tf /home/kasm-user/Downloads/tibia.x64.tar.gz 2>/dev/null | head -100"
          echo '=== SNAPSHOT TOP ==='
          docker exec "$c" sh -lc "find /home/kasm-user/otclient-track-a/Tibia-32177065988-1 -maxdepth 3 -printf '%y %m %s %p\n' 2>/dev/null | head -250"
          echo '=== HOME EXEC NAMES ==='
          docker exec "$c" sh -lc "find /home/kasm-user -maxdepth 10 -type f -perm -111 -printf '%p|%s\n' 2>/dev/null | grep -Ei '/(Tibia|launcher|updater|patch|start)[^/]*$' | head -200 || true"

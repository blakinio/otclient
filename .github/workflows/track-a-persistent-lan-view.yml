name: Track A monitor Tibia update to visible client
on:
  push:
    branches: [research/OTC-20260827-kasm-endpoint-inventory]
    paths: [.github/workflows/track-a-persistent-lan-view.yml]
permissions:
  contents: read
jobs:
  monitor:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 12
    steps:
      - name: Observe existing updater until real client is visible
        shell: bash
        run: |
          set -Eeuo pipefail
          c=otclient-track-a-kasmvnc
          docker inspect -f '{{.State.Running}}' "$c" | grep -Fx true
          docker exec -u kasm-user -e DISPLAY=:1 "$c" xdpyinfo >/dev/null
          : > "$RUNNER_TEMP/tibia-client-monitor.txt"
          success=false
          stable=0
          for tick in $(seq 1 1080); do
            client_procs="$(docker exec "$c" pgrep -a -x client 2>/dev/null || true)"
            windows="$(docker exec -u kasm-user -e DISPLAY=:1 "$c" sh -lc "xwininfo -root -tree 2>/dev/null | grep -E '\"Tibia' | grep -v 'Qt Selection Owner' | grep -v ' 1x1+' || true")"
            launcher="$(docker exec "$c" sh -lc "ps -eo pid,etime,args | grep -E '[/]home/kasm-user/Tibia/Tibia' || true")"
            printf 'tick=%s client=%q launcher=%q windows=%q\n' "$tick" "$client_procs" "$launcher" "$windows" >> "$RUNNER_TEMP/tibia-client-monitor.txt"
            if [ -n "$client_procs" ]; then
              if echo "$windows" | grep -Eq '[[:space:]][8-9][0-9]{2,}x[5-9][0-9]{2,}|[[:space:]][1-9][0-9]{3,}x[6-9][0-9]{2,}'; then
                stable=$((stable+1))
              else
                stable=0
              fi
              if [ "$stable" -eq 5 ]; then
                echo REAL_CLIENT_VISIBLE=true
                echo "$client_procs"
                echo "$windows"
                docker exec -u kasm-user -e DISPLAY=:1 "$c" xwd -root -silent -out /tmp/tibia-real-client.xwd
                if docker exec "$c" command -v ffmpeg >/dev/null 2>&1; then
                  docker exec "$c" ffmpeg -loglevel error -y -i /tmp/tibia-real-client.xwd /tmp/tibia-real-client.png
                  docker cp "$c:/tmp/tibia-real-client.png" "$RUNNER_TEMP/tibia-real-client.png"
                fi
              fi
              if [ "$stable" -ge 12 ]; then
                success=true
                break
              fi
            else
              stable=0
            fi
            sleep .5
          done
          echo '=== FINAL CLIENT ==='
          docker exec "$c" pgrep -a -x client || true
          echo '=== FINAL LAUNCHER ==='
          docker exec "$c" sh -lc "ps -eo pid,ppid,etime,args | grep -E '[/]home/kasm-user/Tibia/Tibia' || true"
          echo '=== FINAL WINDOWS ==='
          docker exec -u kasm-user -e DISPLAY=:1 "$c" sh -lc "xwininfo -root -tree 2>/dev/null | grep -Ei 'Tibia|launcher|update' | head -100 || true"
          echo '=== INSTALL STATE ==='
          docker exec "$c" sh -lc "find '/home/kasm-user/.local/share/CipSoft GmbH/Tibia/packages' -maxdepth 4 -type f \( -name client -o -name package.json.version \) -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | tail -80 || true"
          cp "$RUNNER_TEMP/tibia-client-monitor.txt" "$RUNNER_TEMP/tibia-client-monitor-final.txt"
          if [ "$success" != true ]; then
            echo REAL_CLIENT_VISIBLE=false
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tibia-real-client-visible-proof
          path: |
            ${{ runner.temp }}/tibia-real-client.png
            ${{ runner.temp }}/tibia-client-monitor-final.txt
          if-no-files-found: warn

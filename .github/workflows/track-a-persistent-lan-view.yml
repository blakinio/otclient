name: Track A persistent LAN view

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type INSPECT_KASM_ENDPOINTS
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == 'blakinio' && inputs.authorization == 'INSPECT_KASM_ENDPOINTS'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TARGET_CONTAINER: otclient-track-a-kasmvnc
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prove branch is based on current trusted main
        shell: bash
        run: |
          set -Eeuo pipefail
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          git fetch --no-tags --depth=1 origin "$main"
          test "$(git rev-parse HEAD^)" = "$main"
          docker inspect -f '{{.State.Running}}' "$TARGET_CONTAINER" | grep -Fx true >/dev/null
          test "$(docker exec "$TARGET_CONTAINER" pgrep -x client | wc -l)" -eq 1
          echo READ_ONLY_RUNTIME_INVENTORY=PASS

      - name: Inspect container launch and published ports
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== CONTAINER_CONFIG ==='
          docker inspect -f 'Image={{.Config.Image}} Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}}' "$TARGET_CONTAINER"
          echo '=== PORTS ==='
          docker inspect -f '{{json .NetworkSettings.Ports}}' "$TARGET_CONTAINER"
          echo '=== ENV_NAMES ==='
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$TARGET_CONTAINER" | sed -E 's/=.*$/=<redacted>/' | sort

      - name: Inspect Kasm processes listeners and config
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== PROCESSES ==='
          docker exec "$TARGET_CONTAINER" sh -lc 'ps -ef | grep -Ei "kasm|vnc|websock|nginx|client" | grep -v grep || true'
          echo '=== LISTENERS ==='
          docker exec "$TARGET_CONTAINER" sh -lc 'ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || cat /proc/net/tcp /proc/net/tcp6'
          echo '=== KASM_CONFIG_CANDIDATES ==='
          docker exec "$TARGET_CONTAINER" sh -lc 'find /etc /home/kasm-user -maxdepth 4 -type f \( -iname "*kasm*" -o -iname "*vnc*" -o -name "*.yaml" -o -name "*.yml" \) 2>/dev/null | sort | head -100'
          echo '=== SAFE_CONFIG_EXCERPTS ==='
          docker exec "$TARGET_CONTAINER" sh -lc 'for f in /etc/kasmvnc/kasmvnc.yaml /home/kasm-user/.vnc/kasmvnc.yaml /home/kasm-user/.config/kasmvnc/kasmvnc.yaml; do if [ -f "$f" ]; then echo "--- $f"; grep -Ei "^(network|websocket|websocket_port|port|ssl|interface|listen|auth|require_ssl|http|https|path|server:|  (interface|websocket_port|ssl|auth|require_ssl|port|path):)" "$f" 2>/dev/null || true; fi; done'

      - name: Probe local HTTP paths without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$(docker inspect -f '{{.Config.Image}}' otclient-synology-runner)"
          for path in / /vnc.html /websockify /websockify/ /websocket /ws; do
            code="$(docker run --rm --network host --entrypoint sh "$image" -lc "curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:6901'$path' || true")"
            echo "HTTP_PATH $path $code"
          done
          echo INSPECTION_COMPLETE=true

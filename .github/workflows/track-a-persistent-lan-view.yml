name: Track A verify Tibia launcher visibility
on:
  push:
    branches: [research/OTC-20260827-kasm-endpoint-inventory]
    paths: [.github/workflows/track-a-persistent-lan-view.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Inspect persistent launcher and visible desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          c=otclient-track-a-kasmvnc
          docker inspect -f '{{.State.Running}}' "$c" | grep -Fx true
          docker exec -u kasm-user -e DISPLAY=:1 "$c" xdpyinfo >/dev/null
          echo '=== PROCESSES ==='
          docker exec "$c" sh -lc "ps -eo pid,ppid,etime,args | grep -E '(/home/kasm-user/Tibia/Tibia|/packages/.*/bin/client|[T]ibia)' | head -80 || true"
          echo '=== WINDOWS ==='
          docker exec -u kasm-user -e DISPLAY=:1 "$c" sh -lc "xwininfo -root -tree 2>/dev/null | head -120"
          echo '=== LAUNCHER LOG ==='
          docker exec "$c" sh -lc "tail -n 160 /tmp/tibia-normal-launcher.log 2>/dev/null || true"
          echo '=== RECENT CIPSOFT FILES ==='
          docker exec "$c" sh -lc "find '/home/kasm-user/.local/share/CipSoft GmbH' '/home/kasm-user/.cache/CipSoft GmbH' -type f -mmin -15 -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | head -120 || true"
          echo '=== SCREENSHOT TOOLS ==='
          docker exec "$c" sh -lc 'command -v import || true; command -v scrot || true; command -v xwd || true'
      - name: Capture actual Kasm desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          c=otclient-track-a-kasmvnc
          out="$RUNNER_TEMP/tibia-kasm-root.png"
          if docker exec "$c" command -v import >/dev/null 2>&1; then
            docker exec -u kasm-user -e DISPLAY=:1 "$c" import -window root /tmp/tibia-kasm-root.png
            docker cp "$c:/tmp/tibia-kasm-root.png" "$out"
          elif docker exec "$c" command -v scrot >/dev/null 2>&1; then
            docker exec -u kasm-user -e DISPLAY=:1 "$c" scrot /tmp/tibia-kasm-root.png
            docker cp "$c:/tmp/tibia-kasm-root.png" "$out"
          else
            echo SCREENSHOT_UNAVAILABLE=true
            exit 0
          fi
          file "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tibia-kasm-visible-desktop
          path: ${{ runner.temp }}/tibia-kasm-root.png
          if-no-files-found: ignore

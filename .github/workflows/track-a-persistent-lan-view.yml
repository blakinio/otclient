name: Track A inventory normal Tibia launcher
on:
  push:
    branches: [research/OTC-20260827-kasm-endpoint-inventory]
    paths: [.github/workflows/track-a-persistent-lan-view.yml]
permissions:
  contents: read
jobs:
  inventory:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Inventory installed launcher without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          c=otclient-track-a-kasmvnc
          docker inspect -f '{{.State.Running}}' "$c" | grep -Fx true
          docker exec -u kasm-user -e DISPLAY=:1 "$c" xdpyinfo >/dev/null
          echo '=== CLIENT PROCESSES ==='
          docker exec "$c" pgrep -a -x client || true
          echo '=== DESKTOP ENTRIES ==='
          docker exec "$c" sh -lc "find /home/kasm-user /usr/share/applications -maxdepth 6 -type f \( -name '*.desktop' -o -iname '*Tibia*' -o -iname '*launcher*' \) -print 2>/dev/null | head -200"
          echo '=== EXEC CANDIDATES ==='
          docker exec "$c" sh -lc "find /home/kasm-user -maxdepth 8 -type f -perm -111 \( -iname 'Tibia' -o -iname '*launcher*' -o -iname '*updater*' \) -printf '%p|%s\n' 2>/dev/null | head -200"
          echo '=== TIBIA ROOTS ==='
          docker exec "$c" sh -lc "find /home/kasm-user -maxdepth 6 -type d \( -iname 'Tibia' -o -iname '*CipSoft*' \) -print 2>/dev/null | head -100"

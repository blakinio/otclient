name: Track A persistent LAN view

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type INSPECT_KASM_ENDPOINTS
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == 'blakinio' && inputs.authorization == 'INSPECT_KASM_ENDPOINTS'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TARGET_CONTAINER: otclient-track-a-kasmvnc
      EXPECTED_MAIN: 462320593ce3efc764af443c23c51ac725e1759a
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prove current trusted main and existing client
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          docker inspect -f '{{.State.Running}}' "$TARGET_CONTAINER" | grep -Fx true >/dev/null
          test "$(docker exec "$TARGET_CONTAINER" pgrep -x client | wc -l)" -eq 1
          docker exec "$TARGET_CONTAINER" test -S /tmp/.X11-unix/X1
          echo READ_ONLY_RUNTIME_INVENTORY=PASS

      - name: Inspect historical noVNC tool availability
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== CONTAINER ==='
          docker exec "$TARGET_CONTAINER" sh -lc '
            printf "x11vnc="; command -v x11vnc || true
            printf "websockify="; command -v websockify || true
            printf "python_websockify="; python3 - <<"PY"
          try:
              import websockify
              print(websockify.__file__)
          except Exception as exc:
              print("UNAVAILABLE:" + type(exc).__name__)
          PY
            test -d /usr/share/novnc && echo novnc_dir=/usr/share/novnc || echo novnc_dir=UNAVAILABLE
            DISPLAY=:1 xdpyinfo >/dev/null 2>&1 && echo display_1=PASS || echo display_1=FAIL
          '
          echo '=== RUNNER ==='
          printf 'x11vnc='; command -v x11vnc || true
          printf 'websockify='; command -v websockify || true
          test -d /usr/share/novnc && echo novnc_dir=/usr/share/novnc || echo novnc_dir=UNAVAILABLE

      - name: Inspect safe package paths only
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$TARGET_CONTAINER" sh -lc '
            find /usr /opt /dockerstartup -maxdepth 4 -type f \( -name x11vnc -o -name websockify -o -name vnc.html \) 2>/dev/null | sort | head -100
          '

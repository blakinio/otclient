name: Track A observe character selection to world
on:
  push:
    branches: [research/OTC-20260827-kasm-endpoint-inventory]
    paths: [.github/workflows/track-a-persistent-lan-view.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Arm read-only current-client observer
        shell: bash
        run: |
          set -Eeuo pipefail
          c=otclient-track-a-kasmvnc
          docker inspect -f '{{.State.Running}}' "$c" | grep -Fx true >/dev/null
          docker exec -u kasm-user -e DISPLAY=:1 "$c" xdpyinfo >/dev/null
          pids="$(docker exec "$c" pgrep -x client)"
          count="$(printf '%s\n' "$pids" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 1
          pid="$pids"
          exe="$(docker exec "$c" readlink -f "/proc/$pid/exe")"
          size="$(docker exec "$c" stat -Lc %s "/proc/$pid/exe")"
          sha="$(docker exec "$c" sha256sum "/proc/$pid/exe" | awk '{print $1}')"
          visible="$(docker exec -u kasm-user -e DISPLAY=:1 "$c" sh -lc "xdotool search --onlyvisible --name '^Tibia' 2>/dev/null | wc -l")"
          test "$visible" -ge 1
          echo CURRENT_CLIENT_PID="$pid"
          echo CURRENT_CLIENT_EXE="$exe"
          echo CURRENT_CLIENT_SIZE="$size"
          echo CURRENT_CLIENT_SHA256="$sha"
          echo LOGGER_READY=true
      - name: Observe transition read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          c=otclient-track-a-kasmvnc
          out="$RUNNER_TEMP/character-to-world.log"
          : > "$out"
          end=$(( $(date +%s) + 180 ))
          last=''
          while (( $(date +%s) < end )); do
            pids="$(docker exec "$c" pgrep -x client 2>/dev/null || true)"
            count="$(printf '%s\n' "$pids" | sed '/^$/d' | wc -l | tr -d ' ')"
            pid=''
            [ "$count" -eq 1 ] && pid="$pids"
            context=false
            titles="$(docker exec -u kasm-user -e DISPLAY=:1 "$c" sh -lc "for x in \$(xdotool search --onlyvisible --name '^Tibia' 2>/dev/null); do xdotool getwindowname \$x 2>/dev/null || true; done" || true)"
            printf '%s\n' "$titles" | grep -q '^Tibia - ' && context=true || true
            state="$count|$pid|$context"
            if [ "$state" != "$last" ]; then
              printf '%s client_count=%s pid=%s character_window_context=%s\n' "$(date +%s%3N)" "$count" "${pid:-none}" "$context" | tee -a "$out"
              last="$state"
            fi
            sleep .25
          done
          echo OBSERVER_DONE=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-to-world-${{ github.run_id }}
          path: ${{ runner.temp }}/character-to-world.log
          if-no-files-found: warn
          retention-days: 3

name: Track A Synology launch preflight

on:
  push:
    branches:
      - research/OTC-20260827-kasm-endpoint-inventory
    paths:
      - .github/workflows/track-a-persistent-lan-view.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TARGET_CONTAINER: otclient-track-a-kasmvnc
      EXPECTED_SIZE: '52109920'
      EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
      STATE_ROOT: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Inspect current runtime read-only
        shell: bash
        run: |
          set -u
          running="$(docker inspect -f '{{.State.Running}}' "$TARGET_CONTAINER" 2>/dev/null || echo missing)"
          echo CONTAINER_RUNNING="$running"
          if [[ "$running" != true ]]; then
            echo CLIENT_COUNT=UNKNOWN
            echo DISPLAY_CONNECT=UNKNOWN
            exit 0
          fi

          pids="$(docker exec "$TARGET_CONTAINER" pgrep -x client 2>/dev/null || true)"
          count="$(printf '%s\n' "$pids" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo CLIENT_COUNT="$count"
          echo CLIENT_PIDS="$(printf '%s' "$pids" | tr '\n' ',')"
          for pid in $pids; do
            echo CLIENT_PID="$pid"
            exe="$(docker exec "$TARGET_CONTAINER" readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
            size="$(docker exec "$TARGET_CONTAINER" stat -Lc %s "/proc/$pid/exe" 2>/dev/null || true)"
            sha="$(docker exec "$TARGET_CONTAINER" sha256sum "/proc/$pid/exe" 2>/dev/null | awk '{print $1}')"
            start="$(docker exec -i "$TARGET_CONTAINER" python3 - "$pid" <<'PY' 2>/dev/null || true
          import pathlib,sys
          raw=pathlib.Path('/proc/'+sys.argv[1]+'/stat').read_text(encoding='ascii')
          print(raw[raw.rfind(')')+2:].split()[19])
          PY
            )"
            echo CLIENT_EXE="$exe"
            echo CLIENT_SIZE="$size"
            echo CLIENT_SHA256="$sha"
            echo CLIENT_START_TICKS="$start"
            [[ "$size" == "$EXPECTED_SIZE" && "$sha" == "$EXPECTED_SHA" ]] && echo CLIENT_EXACT_FENCE=PASS || echo CLIENT_EXACT_FENCE=FAIL
          done

          if docker exec -u kasm-user -e DISPLAY=:1 "$TARGET_CONTAINER" xdpyinfo >/dev/null 2>&1; then
            echo DISPLAY_CONNECT=PASS
            windows="$(docker exec -u kasm-user -e DISPLAY=:1 "$TARGET_CONTAINER" sh -lc 'xwininfo -root -tree 2>/dev/null | grep -Ei "Tibia|client" || true')"
            if [[ -n "$windows" ]]; then
              echo TIBIA_WINDOW_PRESENT=true
              printf '%s\n' "$windows" | sed -E 's/(Tibia - ).*/\1<redacted>/' | head -20
            else
              echo TIBIA_WINDOW_PRESENT=false
            fi
          else
            echo DISPLAY_CONNECT=FAIL
            echo TIBIA_WINDOW_PRESENT=UNKNOWN
          fi

          if [[ -f "$STATE_ROOT/runtime-registration.json" ]]; then
            echo REGISTRATION_PRESENT=true
            python3 - "$STATE_ROOT/runtime-registration.json" <<'PY'
          import json,sys
          p=sys.argv[1]
          try:
              d=json.load(open(p,encoding='utf-8'))
          except Exception as e:
              print('REGISTRATION_READ=FAIL:'+type(e).__name__)
          else:
              for k in ('registration_generation','lease_generation','pid','process_start_ticks','display','state','client_size','client_sha256','boot_id_sha256'):
                  print('REG_'+k.upper()+'='+str(d.get(k)))
          PY
          else
            echo REGISTRATION_PRESENT=false
          fi
          if [[ -f "$STATE_ROOT/lease.json" ]]; then
            echo LEASE_PRESENT=true
          else
            echo LEASE_PRESENT=false
          fi

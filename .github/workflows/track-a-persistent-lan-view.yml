name: Track A Synology state logger diagnostic

on:
  push:
    branches:
      - research/OTC-20260827-kasm-endpoint-inventory
    paths:
      - .github/workflows/track-a-persistent-lan-view.yml
      - .github/scripts/track-a-qt-ingame-detached-logger.py

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TARGET_CONTAINER: otclient-track-a-kasmvnc
      EXPECTED_SIZE: '52109920'
      EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
      LOGGER_SCRIPT: /tmp/oteryn-qt-ingame-detached-logger.py
      LOGGER_LOG: /tmp/oteryn-qt-ingame-correlation.jsonl
      LOGGER_PIDFILE: /tmp/oteryn-qt-ingame-detached-logger.pid
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Inspect previous logger attempt
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== PIDFILE ==='
          docker exec "$TARGET_CONTAINER" sh -lc 'test -f /tmp/oteryn-qt-ingame-detached-logger.pid && cat /tmp/oteryn-qt-ingame-detached-logger.pid || true'
          echo '=== PROCESS ==='
          docker exec "$TARGET_CONTAINER" sh -lc '
            if test -f /tmp/oteryn-qt-ingame-detached-logger.pid; then
              p=$(cat /tmp/oteryn-qt-ingame-detached-logger.pid 2>/dev/null || true)
              if echo "$p" | grep -Eq "^[0-9]+$" && test -r "/proc/$p/cmdline"; then tr "\0" " " <"/proc/$p/cmdline"; echo; fi
            fi'
          echo '=== LOG ==='
          docker exec "$TARGET_CONTAINER" sh -lc 'test -f /tmp/oteryn-qt-ingame-correlation.jsonl && tail -n 20 /tmp/oteryn-qt-ingame-correlation.jsonl || true'

      - name: Run bounded foreground logger probe
        shell: bash
        run: |
          set -Eeuo pipefail
          docker cp .github/scripts/track-a-qt-ingame-detached-logger.py "$TARGET_CONTAINER:$LOGGER_SCRIPT"
          docker exec -u 0 "$TARGET_CONTAINER" chown kasm-user:kasm-user "$LOGGER_SCRIPT"
          docker exec -u 0 "$TARGET_CONTAINER" chmod 500 "$LOGGER_SCRIPT"
          mapfile -t pids < <(docker exec "$TARGET_CONTAINER" pgrep -x client)
          test "${#pids[@]}" -eq 1
          pid="${pids[0]}"
          start="$(docker exec -i "$TARGET_CONTAINER" python3 - "$pid" <<'PY'
          import pathlib,sys
          raw=pathlib.Path('/proc/'+sys.argv[1]+'/stat').read_text(encoding='ascii')
          print(raw[raw.rfind(')')+2:].split()[19])
          PY
          )"
          docker exec -u kasm-user "$TARGET_CONTAINER" rm -f /tmp/oteryn-qt-ingame-probe.jsonl
          set +e
          docker exec -u kasm-user "$TARGET_CONTAINER" python3 "$LOGGER_SCRIPT" "$pid" "$start" "$EXPECTED_SIZE" "$EXPECTED_SHA" 2 /tmp/oteryn-qt-ingame-probe.jsonl
          rc=$?
          set -e
          echo LOGGER_PROBE_RC="$rc"
          docker exec "$TARGET_CONTAINER" sh -lc 'test -f /tmp/oteryn-qt-ingame-probe.jsonl && cat /tmp/oteryn-qt-ingame-probe.jsonl || true'
          test "$rc" -eq 0
          echo LOGGER_FOREGROUND_PROBE=PASS

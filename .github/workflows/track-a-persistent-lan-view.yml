name: Track A capture updated Tibia client visual proof
on:
  push:
    branches: [research/OTC-20260827-kasm-endpoint-inventory]
    paths: [.github/workflows/track-a-persistent-lan-view.yml]
permissions:
  contents: read
jobs:
  capture:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Verify and capture visible updated client
        shell: bash
        run: |
          set -Eeuo pipefail
          c=otclient-track-a-kasmvnc
          docker inspect -f '{{.State.Running}}' "$c" | grep -Fx true
          client="$(docker exec "$c" pgrep -a -x client 2>/dev/null || true)"
          [ -n "$client" ] || { echo CLIENT_MISSING=true; exit 1; }
          windows="$(docker exec -u kasm-user -e DISPLAY=:1 "$c" sh -lc "xwininfo -root -tree 2>/dev/null | grep -E '\"Tibia' | grep -v 'Qt Selection Owner' | grep -v ' 1x1+' || true")"
          echo "$client"
          echo "$windows"
          echo "$windows" | grep -Eq '[[:space:]][8-9][0-9]{2,}x[5-9][0-9]{2,}|[[:space:]][1-9][0-9]{3,}x[6-9][0-9]{2,}' || { echo LARGE_CLIENT_WINDOW_MISSING=true; exit 1; }
          docker exec -u kasm-user -e DISPLAY=:1 "$c" xwd -root -silent -out /tmp/tibia-final-visible.xwd
          docker cp "$c:/tmp/tibia-final-visible.xwd" "$RUNNER_TEMP/tibia-final-visible.xwd"
          echo VISUAL_PROOF_CAPTURED=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tibia-final-visible-xwd
          path: ${{ runner.temp }}/tibia-final-visible.xwd
          if-no-files-found: error

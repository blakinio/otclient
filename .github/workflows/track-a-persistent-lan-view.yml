name: Track A persistent LAN view

on:
  push:
    branches:
      - research/OTC-20260827-kasm-endpoint-inventory
    paths:
      - .github/workflows/track-a-persistent-lan-view.yml

permissions:
  contents: read

jobs:
  probe:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    env:
      TARGET_CONTAINER: otclient-track-a-kasmvnc
      EXPECTED_MAIN: 462320593ce3efc764af443c23c51ac725e1759a
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prove current runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          docker inspect -f '{{.State.Running}}' "$TARGET_CONTAINER" | grep -Fx true >/dev/null
          test "$(docker exec "$TARGET_CONTAINER" pgrep -x client | wc -l)" -eq 1
          docker exec "$TARGET_CONTAINER" test -S /tmp/.X11-unix/X1
          docker exec -u kasm-user -e DISPLAY=:1 "$TARGET_CONTAINER" xdpyinfo >/dev/null
          echo TARGET_RUNTIME=PROVEN

      - name: Inspect target network and X listener
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== TARGET_NETWORKS ==='
          docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{println $k $v.IPAddress}}{{end}}' "$TARGET_CONTAINER"
          echo '=== TARGET_X_LISTENERS ==='
          docker exec "$TARGET_CONTAINER" sh -lc 'ss -ltnp 2>/dev/null | grep -E ":(5901|6001)[[:space:]]" || true'

      - name: Transplant x11vnc binary for compatibility probe
        shell: bash
        run: |
          set -Eeuo pipefail
          x11vnc="$(command -v x11vnc)"
          test -x "$x11vnc"
          echo '=== RUNNER_LDD ==='
          ldd "$x11vnc"
          docker exec -u 0 "$TARGET_CONTAINER" rm -rf /tmp/oteryn-view-probe
          docker exec -u 0 "$TARGET_CONTAINER" mkdir -p /tmp/oteryn-view-probe/lib
          docker cp "$x11vnc" "$TARGET_CONTAINER:/tmp/oteryn-view-probe/x11vnc"
          docker exec -u 0 "$TARGET_CONTAINER" chmod 755 /tmp/oteryn-view-probe/x11vnc
          echo '=== TARGET_LDD ==='
          docker exec -u 0 "$TARGET_CONTAINER" ldd /tmp/oteryn-view-probe/x11vnc || true
          echo '=== TARGET_MISSING ==='
          docker exec -u 0 "$TARGET_CONTAINER" sh -lc "ldd /tmp/oteryn-view-probe/x11vnc 2>&1 | grep 'not found' || true"

      - name: Probe transplanted x11vnc executable only
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -u kasm-user "$TARGET_CONTAINER" /tmp/oteryn-view-probe/x11vnc -version 2>&1 | head -30
          echo X11VNC_BINARY_PROBE=PASS

name: Track A native Synology Tibia runtime inventory

on:
  push:
    branches:
      - research/OTC-20260827-kasm-endpoint-inventory
    paths:
      - .github/workflows/track-a-persistent-lan-view.yml

permissions:
  contents: read

jobs:
  inventory:
    if: github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Inventory native Synology processes
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== HOST ==='
          hostname
          uname -a
          echo '=== PROCESS MATCHES ==='
          ps -eo pid,ppid,user,lstart,args | grep -Ei '/bin/client|Tibia|Xvnc|kasm|x11vnc|websockify|Xorg|Xvfb' | grep -v grep || true
          echo '=== NATIVE CLIENT EXES ==='
          python3 - <<'PY'
          import hashlib, os, pathlib
          rows=[]
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit():
                  continue
              try:
                  exe=os.path.realpath(p/'exe')
              except OSError:
                  continue
              if not exe or (os.path.basename(exe) != 'client' and 'Tibia' not in exe):
                  continue
              try:
                  st=os.stat(exe)
                  h=hashlib.sha256()
                  with open(exe,'rb') as f:
                      for chunk in iter(lambda:f.read(1024*1024),b''):
                          h.update(chunk)
                  cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode('utf-8','replace')
                  rows.append((int(p.name),exe,st.st_size,h.hexdigest(),cmd))
              except Exception as exc:
                  rows.append((int(p.name),exe,'ERR',type(exc).__name__,''))
          for row in sorted(rows):
              print('PID=%s\nEXE=%s\nSIZE=%s\nSHA256=%s\nCMD=%s\n---' % row)
          print('NATIVE_CLIENT_COUNT='+str(len(rows)))
          PY
          echo '=== X SOCKETS ==='
          ls -l /tmp/.X11-unix 2>/dev/null || true
          echo '=== LISTENERS ==='
          ss -ltnp 2>/dev/null | grep -E ':(590[0-9]|608[0-9]|6901|844[0-9]|1608[0-9])[[:space:]]' || true
          echo '=== RUNTIME STATE ==='
          find /work/_otclient_tibia_re_state /home/runner/_work/_otclient_tibia_re_state -maxdepth 3 -type f \( -name '*.json' -o -name '*.pid' \) -print 2>/dev/null | sort | head -200 || true

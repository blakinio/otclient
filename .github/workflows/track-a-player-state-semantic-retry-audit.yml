name: Track A player-state semantic retry fresh audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-player-state-semantic-retry-audit.yml
      - docs/agents/evidence/OTC-20260824-player-state-semantic-promotion-e2e-retry/**
      - docs/agents/tasks/archive/OTC-20260824-player-state-semantic-promotion-e2e-retry.md

permissions:
  contents: read
  actions: read

jobs:
  fresh-independent-audit:
    name: Fresh independent terminal evidence audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Falsify blocked-runtime closeout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]
          [[ "$EVENT_BASE_SHA" == 'e98545313a606d6bf4edfb43768e042d2242392c' ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" == "$EVENT_BASE_SHA" ]]

          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py
          python3 .github/scripts/test_tibia_official_client_re_kasm_existing_runtime_probe.py

          evidence='docs/agents/evidence/OTC-20260824-player-state-semantic-promotion-e2e-retry/runtime-admission-terminal.md'
          task='docs/agents/tasks/archive/OTC-20260824-player-state-semantic-promotion-e2e-retry.md'
          test -f "$evidence"
          test -f "$task"
          test ! -e docs/agents/tasks/active/OTC-20260824-player-state-semantic-promotion-e2e-retry.md
          test ! -e .github/workflows/track-a-player-state-semantic-retry-admission.yml

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/blakinio/otclient/actions/jobs/97570588590' > "$RUNNER_TEMP/job.json"
          python3 - "$RUNNER_TEMP/job.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['id'] == 97570588590
          assert d['run_id'] == 32770840660
          assert d['status'] == 'completed'
          assert d['conclusion'] == 'success'
          assert d['runner_name'] == 'synology-otclient-01'
          print('PLAYER_STATE_RETRY_AUDIT_RUNTIME_JOB_IDENTITY=PASS')
          PY

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/blakinio/otclient/actions/jobs/97570588590/logs' > "$RUNNER_TEMP/admission.log"
          for marker in \
            'TRACK_A_AGENT_RUNTIME_GOVERNANCE_PASS=true' \
            'PLAYER_STATE_RETRY_GATE_A=PASS' \
            'TRACK_A_KASM_EXISTING_RUNTIME_PROBE=PASS' \
            'TRACK_A_CANONICAL_TRANSITION_ERROR=probe_registration_pid_mismatch' \
            'PLAYER_STATE_RETRY_REBIND=BLOCKED:probe_registration_pid_mismatch' \
            'PLAYER_STATE_RETRY_GATE_B=NOT_REACHED' \
            'PLAYER_STATE_RETRY_SEMANTIC_PRECONDITIONS=NOT_REACHED' \
            'PLAYER_STATE_RETRY_READY=false' \
            'PLAYER_STATE_RETRY_COMMIT=false' \
            'PLAYER_STATE_RETRY_POSSIBLY_DISPATCHED=false' \
            'PLAYER_STATE_RETRY_PHYSICAL_ACTION_COUNT=0' \
            'PLAYER_STATE_RETRY_RELEASE=PASS' \
            'PLAYER_STATE_RETRY_FAILED_REBIND_REGISTRATION_UNCHANGED=true'; do
              grep -Fq "$marker" "$RUNNER_TEMP/admission.log"
          done
          ! grep -Fq 'PLAYER_STATE_RETRY_GATE_B=PASS' "$RUNNER_TEMP/admission.log"
          ! grep -Fq 'PLAYER_STATE_RETRY_REBIND=PASS' "$RUNNER_TEMP/admission.log"
          ! grep -Fq 'PLAYER_STATE_RETRY_PHYSICAL_ACTION_COUNT=1' "$RUNNER_TEMP/admission.log"

          grep -Fq 'Gate A: PASS' "$evidence"
          grep -Fq 'rebind: BLOCKED_PROBE_REGISTRATION_PID_MISMATCH' "$evidence"
          grep -Fq 'Gate B: NOT_REACHED' "$evidence"
          grep -Fq 'PHYSICAL_ACTION_COUNT: 0' "$evidence"
          grep -Fq 'runtime lease: released generation 26' "$evidence"
          grep -Fq 'status: blocked_terminal' "$task"
          grep -Fq 'runtime_access: none' "$task"
          grep -Fq 'generation_rebind: BLOCKED_PROBE_REGISTRATION_PID_MISMATCH' "$task"
          grep -Fq 'physical_action_count: 0' "$task"
          grep -Fq 'runtime_lease: released' "$task"
          grep -Fq 'semantic_promotion_performed: false' "$task"
          grep -Fq 'product_code_changed: false' "$task"

          changed="$(git diff --name-only "$EVENT_BASE_SHA"...HEAD | sort)"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/track-a-player-state-semantic-retry-audit.yml|docs/agents/evidence/OTC-20260824-player-state-semantic-promotion-e2e-retry/runtime-admission-terminal.md|docs/agents/tasks/archive/OTC-20260824-player-state-semantic-promotion-e2e-retry.md) ;;
              *) echo "unexpected final diff path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

          echo 'PLAYER_STATE_RETRY_FRESH_INDEPENDENT_AUDIT=PASS'

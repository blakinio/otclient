name: Track A player-state retry2 cancel unintended physical reruns

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-player-state-semantic-retry2-cancel-reruns.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel-unintended-reruns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel queued or running physical reruns
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]
          [[ "$HEAD_BRANCH" == 'runtime/OTC-20260826-player-state-semantic-promotion-e2e-retry-2' ]]
          api='https://api.github.com/repos/blakinio/otclient'
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/workflows/track-a-player-state-semantic-retry2-admission.yml/runs?branch=$HEAD_BRANCH&event=pull_request&per_page=100" \
            > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/cancel.ids" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          for run in data.get('workflow_runs',[]):
              if run.get('status') != 'completed':
                  print(run['id'])
          PY
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            echo "PLAYER_STATE_E2E_CANCELLING_UNINTENDED_RUN=$run_id"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/runs/$run_id/cancel" >/dev/null || true
          done < "$RUNNER_TEMP/cancel.ids"
          echo 'PLAYER_STATE_E2E_UNINTENDED_RERUN_CANCEL_REQUESTS=COMPLETE'

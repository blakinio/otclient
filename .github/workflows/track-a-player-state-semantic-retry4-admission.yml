name: Track A player-state semantic promotion E2E retry 4

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-player-state-semantic-retry4-admission.yml
      - .github/scripts/tibia-official-client-re-player-state-causal-worker.py
      - .github/scripts/test_tibia_official_client_re_player_state_causal_worker.py
      - .github/scripts/test_tibia_official_client_re_causal_worker_timeout_contract.py
      - .github/scripts/test_tibia_official_client_re_causal_worker_dispatch_boundary.py
      - docs/agents/tasks/active/OTC-20260826-player-state-semantic-promotion-e2e-retry-4.md

permissions:
  contents: read

concurrency:
  group: track-a-player-state-semantic-promotion-e2e-retry-4
  cancel-in-progress: false

jobs:
  causal-e2e:
    name: Fresh admission, recovery/rebind, Gate B and one-shot causal E2E
    if: ${{ github.event.pull_request.head.ref == 'runtime/OTC-20260826-player-state-semantic-promotion-e2e-retry-4' }}
    runs-on: [otclient, synology]
    timeout-minutes: 12
    steps:
      - name: Checkout exact task head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Deterministic pre-runtime verification
        shell: bash
        env:
          EXPECTED_MAIN_SHA: d139481f894f0307e0fe58296acf615271bff0f1
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == 'synology-otclient-01' ]]
          [[ "$GITHUB_REPOSITORY" == 'blakinio/otclient' ]]
          [[ "$HEAD_BRANCH" == 'runtime/OTC-20260826-player-state-semantic-promotion-e2e-retry-4' ]]
          [[ "$EVENT_BASE_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          current_main="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          [[ "$current_main" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "PLAYER_STATE_E2E_REFUSED=LIVE_MAIN_MOVED:$current_main" >&2
            exit 60
          }
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$EXPECTED_MAIN_SHA" --expected-branch "$HEAD_BRANCH"
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py
          python3 .github/scripts/test_tibia_official_client_re_kasm_existing_runtime_probe.py
          python3 .github/scripts/test_tibia_official_client_re_player_state_causal_worker.py
          python3 .github/scripts/test_tibia_official_client_re_causal_worker_timeout_contract.py
          python3 .github/scripts/test_tibia_official_client_re_causal_worker_dispatch_boundary.py
          python3 -m unittest tests.tools.tibia_re_surveyor.test_player_state -v
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          echo 'PLAYER_STATE_E2E_TRUSTED_MAIN=PASS'
          echo 'PLAYER_STATE_E2E_DETERMINISTIC_PRERUNTIME=PASS'

      - name: Fresh Track A admission and one-shot causal discriminator
        shell: bash
        env:
          EXPECTED_MAIN_SHA: d139481f894f0307e0fe58296acf615271bff0f1
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +x
          set -Eeuo pipefail
          umask 077

          [[ "$RUNNER_NAME" == 'synology-otclient-01' ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
          current_main="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          [[ "$current_main" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "PLAYER_STATE_E2E_REFUSED=LIVE_MAIN_MOVED:$current_main" >&2
            exit 60
          }

          task='OTC-20260826-player-state-semantic-promotion-e2e-retry-4'
          session='chatgpt-player-state-semantic-retry4-20260826'
          state='/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime'
          token_root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"
          token="$token_root/canonical-lease-token"
          budget_marker="$token_root/player-state-causal-commit.json"
          lease='.github/scripts/tibia-official-client-re-canonical-live-lease'
          transition='.github/scripts/tibia-official-client-re-canonical-live-transition.py'
          probe='.github/scripts/tibia-official-client-re-kasm-existing-runtime-probe.py'
          worker='.github/scripts/tibia-official-client-re-player-state-causal-worker.py'
          reg="$state/runtime-registration.json"
          live_manifest="$token_root/current-adoption-probe.json"
          request="$token_root/player-state-causal-request.json"
          acquired=0
          released=0

          mkdir -p "$token_root"
          chmod 700 "/home/runner/_work/_otclient_tibia_re_state/tasks/$task" "$token_root" 2>/dev/null || true
          rm -f "$token" "$live_manifest" "$request"
          chmod +x "$worker"

          cleanup() {
            rc=$?
            if [[ "$acquired" == 1 && "$released" != 1 ]]; then
              bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true
            fi
            rm -f "$token" "$live_manifest" "$request"
            exit "$rc"
          }
          trap cleanup EXIT

          block_zero() {
            reason="$1"
            echo "PLAYER_STATE_E2E_RESULT=BLOCKED_WITH_REASON:$reason"
            echo 'PLAYER_STATE_E2E_READY=false'
            echo 'PLAYER_STATE_E2E_COMMIT=false'
            echo 'PLAYER_STATE_E2E_POSSIBLY_DISPATCHED=false'
            echo 'PLAYER_STATE_E2E_PHYSICAL_ACTION_COUNT=0'
            echo 'PLAYER_STATE_E2E_SEMANTIC_PROMOTION=false'
            if [[ "$acquired" == 1 && "$released" != 1 ]]; then
              bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token"
              released=1
              echo 'PLAYER_STATE_E2E_RELEASE=PASS'
            fi
            exit 0
          }

          [[ -f "$state/lease.json" && -f "$reg" ]] || block_zero 'CANONICAL_CONTROLLER_STATE_UNAVAILABLE'
          if [[ -e "$budget_marker" ]]; then
            block_zero 'ONE_SHOT_EFFECT_BUDGET_ALREADY_RESERVED'
          fi

          python3 - "$state/lease.json" "$reg" <<'PY'
          import json,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text())
          reg=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert lease.get('runtime_id') == 'track-a-canonical-live'
          assert lease.get('status') == 'released'
          assert lease.get('controller_task') is None
          assert lease.get('controller_session') is None
          assert reg.get('runtime_id') == 'track-a-canonical-live'
          safe={
            'runtime_access':'none',
            'canonical_registration':'PRESENT',
            'lease_generation':lease.get('generation'),
            'registration_generation':reg.get('registration_generation'),
            'registration_lease_generation':reg.get('lease_generation'),
            'registration_pid':reg.get('pid'),
            'registration_process_start_ticks':reg.get('process_start_ticks'),
            'registration_state':reg.get('state'),
            'registration_state_evidence':reg.get('state_evidence'),
            'registration_proof_kind':reg.get('proof_kind'),
            'mutation_authorized':False,
          }
          print('PLAYER_STATE_E2E_CONTROLLER_PRESTATE='+json.dumps(safe,sort_keys=True,separators=(',',':')))
          PY

          bash "$lease" acquire \
            --task-id "$task" \
            --session-id "$session" \
            --token-file "$token" \
            --ttl-seconds 1800
          acquired=1
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          echo 'PLAYER_STATE_E2E_GATE_A=PASS'

          python3 "$probe" probe "$live_manifest" || block_zero 'FRESH_ADOPTION_PROBE_FAILED'

          decision="$(python3 - "$state/lease.json" "$reg" "$live_manifest" "$transition" <<'PY'
          import importlib.util,json,pathlib,sys
          lease=json.loads(pathlib.Path(sys.argv[1]).read_text())
          old=json.loads(pathlib.Path(sys.argv[2]).read_text())
          fresh=json.loads(pathlib.Path(sys.argv[3]).read_text())
          generation=int(lease['generation'])
          spec=importlib.util.spec_from_file_location('canonical_transition', pathlib.Path(sys.argv[4]))
          if spec is None or spec.loader is None:
              print('BLOCK:TRANSITION_VALIDATOR_UNAVAILABLE'); raise SystemExit(0)
          module=importlib.util.module_from_spec(spec); sys.modules[spec.name]=module; spec.loader.exec_module(module)
          old_boot=old.get('boot_id_sha256'); fresh_boot=fresh.get('boot_id_sha256')
          if old_boot != fresh_boot:
              try:
                  module._validate_boot_epoch_recovery_candidate(old, fresh, generation)
              except Exception as exc:
                  print('BLOCK:BOOT_EPOCH_RECOVERY_CONTRACT_NOT_PROVEN:'+getattr(exc,'code',type(exc).__name__))
              else:
                  print('BOOT_EPOCH_RECOVERY')
              raise SystemExit(0)
          same_pid=old.get('pid') == fresh.get('pid')
          same_start=old.get('process_start_ticks') == fresh.get('process_start_ticks')
          if same_pid != same_start:
              print('BLOCK:PARTIAL_PID_START_DRIFT')
              raise SystemExit(0)
          if same_pid and same_start:
              if int(old.get('lease_generation', -1)) < generation:
                  print('REBIND')
              elif int(old.get('lease_generation', -1)) == generation:
                  print('NONE')
              else:
                  print('BLOCK:REGISTRATION_GENERATION_AHEAD')
              raise SystemExit(0)
          try:
              module._validate_stale_recovery_candidate(old, fresh, generation)
          except Exception as exc:
              print('BLOCK:RECOVERY_CONTRACT_NOT_PROVEN:'+getattr(exc,'code',type(exc).__name__))
          else:
              print('RECOVERY')
          PY
          )"
          printf 'PLAYER_STATE_E2E_AUTHORITY_TRANSITION_DECISION=%s\n' "$decision"

          case "$decision" in
            BOOT_EPOCH_RECOVERY)
              echo 'PLAYER_STATE_E2E_RUNTIME_ACCESS=canonical_boot_epoch_recovery'
              python3 "$transition" boot-epoch-registration-recovery \
                --task-id "$task" --session-id "$session" --token-file "$token" --probe "$probe" \
                || block_zero 'CANONICAL_BOOT_EPOCH_REGISTRATION_RECOVERY_FAILED'
              echo 'PLAYER_STATE_E2E_BOOT_EPOCH_RECOVERY=PASS'
              ;;
            RECOVERY)
              echo 'PLAYER_STATE_E2E_RUNTIME_ACCESS=canonical_recovery'
              python3 "$transition" stale-registration-recovery \
                --task-id "$task" --session-id "$session" --token-file "$token" --probe "$probe" \
                || block_zero 'CANONICAL_STALE_REGISTRATION_RECOVERY_FAILED'
              echo 'PLAYER_STATE_E2E_RECOVERY=PASS'
              ;;
            REBIND)
              echo 'PLAYER_STATE_E2E_RUNTIME_ACCESS=canonical_rebind'
              python3 "$transition" rebind \
                --task-id "$task" --session-id "$session" --token-file "$token" --probe "$probe" \
                || block_zero 'CANONICAL_REBIND_FAILED'
              echo 'PLAYER_STATE_E2E_REBIND=PASS'
              ;;
            NONE)
              echo 'PLAYER_STATE_E2E_AUTHORITY_TRANSITION=NOT_REQUIRED'
              ;;
            BLOCK:*)
              block_zero "$decision"
              ;;
            *)
              block_zero 'AUTHORITY_TRANSITION_DECISION_INVALID'
              ;;
          esac
          rm -f "$live_manifest"

          echo 'PLAYER_STATE_E2E_RUNTIME_ACCESS=canonical_reuse_or_mutation'
          python3 "$transition" gate-b \
            --task-id "$task" --session-id "$session" --token-file "$token" --probe "$probe" \
            || block_zero 'GATE_B_FAILED'
          echo 'PLAYER_STATE_E2E_GATE_B=PASS'
          echo 'PLAYER_STATE_E2E_TARGET_UNIQUENESS=PROVEN'

          python3 - "$reg" "$worker" <<'PY' || exit_code=$?
          import importlib.util,json,pathlib,sys
          reg=json.loads(pathlib.Path(sys.argv[1]).read_text())
          spec=importlib.util.spec_from_file_location('player_state_causal_worker', pathlib.Path(sys.argv[2]))
          if spec is None or spec.loader is None:
              raise SystemExit(2)
          module=importlib.util.module_from_spec(spec); sys.modules[spec.name]=module; spec.loader.exec_module(module)
          target=module.validate_registration(reg)
          budget=module.DeadlineBudget.start()
          if not module.tool_ready(target,budget):
              raise SystemExit(3)
          candidate=module.read_candidate(reg,budget)
          module.validate_candidate(candidate)
          print('PLAYER_STATE_E2E_TYPED_BASELINE=PASS')
          print('PLAYER_STATE_E2E_INPUT_CARRIER=PASS')
          print('PLAYER_STATE_E2E_SEMANTIC_PRECONDITIONS=PASS')
          PY
          if [[ "${exit_code:-0}" != 0 ]]; then
            block_zero 'SEMANTIC_PRECONDITIONS_FAILED'
          fi

          python3 - "$request" <<'PY'
          import hashlib,json,pathlib,sys
          payload={'schema_version':1,'kind':'move','parameters':{'direction':'east','tiles':1}}
          payload['action_hash']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          path=pathlib.Path(sys.argv[1]); path.write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n'); path.chmod(0o600)
          print('PLAYER_STATE_E2E_REQUEST=ONE_TILE_EAST')
          PY

          set +e
          python3 - "$transition" "$task" "$session" "$token" "$probe" "$worker" "$request" "$budget_marker" <<'PY'
          import json,os,pathlib,subprocess,sys
          transition,task,session,token,probe,worker,request,budget=sys.argv[1:]
          req=json.loads(pathlib.Path(request).read_text())
          cmd=[sys.executable,transition,'guarded-dispatch','--task-id',task,'--session-id',session,'--token-file',token,'--probe',probe,'--worker',worker,'--request-file',request,'--worker-timeout','30','--input-lock-timeout','10']
          proc=subprocess.Popen(cmd,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1)
          ready=False; committed=False; result=None
          try:
              assert proc.stdout is not None and proc.stdin is not None
              for raw in proc.stdout:
                  line=raw.rstrip('\n')
                  print(line,flush=True)
                  if line.startswith('TRACK_A_GUARDED_DISPATCH_READY='):
                      if ready:
                          if not committed:
                              proc.stdin.write('ABORT\n'); proc.stdin.flush()
                          print('PLAYER_STATE_E2E_CONTROLLER_ERROR=DUPLICATE_READY',flush=True)
                          continue
                      ready=True
                      payload=json.loads(line.split('=',1)[1])
                      valid=(payload.get('protocol')=='track-a-guarded-dispatch-v1' and payload.get('status')=='READY' and payload.get('action_hash')==req['action_hash'] and isinstance(payload.get('fence_digest'),str) and len(payload['fence_digest'])==64)
                      if not valid:
                          proc.stdin.write('ABORT\n'); proc.stdin.flush()
                          print('PLAYER_STATE_E2E_READY_VALIDATION=REFUSED',flush=True)
                          continue
                      try:
                          fd=os.open(budget,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
                      except FileExistsError:
                          proc.stdin.write('ABORT\n'); proc.stdin.flush()
                          print('PLAYER_STATE_E2E_BUDGET_RESERVATION=REFUSED_EXISTING',flush=True)
                          continue
                      with os.fdopen(fd,'w') as handle:
                          json.dump({'schema_version':1,'task':task,'action_hash':req['action_hash'],'github_run_id':os.environ.get('GITHUB_RUN_ID'),'state':'COMMIT_RESERVED'},handle,sort_keys=True,separators=(',',':'))
                          handle.write('\n'); handle.flush(); os.fsync(handle.fileno())
                      print('PLAYER_STATE_E2E_READY=true',flush=True)
                      print('PLAYER_STATE_E2E_BUDGET_RESERVATION=PASS',flush=True)
                      proc.stdin.write('COMMIT\n'); proc.stdin.flush()
                      committed=True
                      print('PLAYER_STATE_E2E_COMMIT=true',flush=True)
                  elif line.startswith('TRACK_A_GUARDED_DISPATCH_RESULT='):
                      result=json.loads(line.split('=',1)[1])
              rc=proc.wait(timeout=40)
          except BaseException:
              try:
                  proc.terminate()
              except Exception:
                  pass
              if committed:
                  print('PLAYER_STATE_E2E_RESULT=AMBIGUOUS_POST_COMMIT_CONTROLLER_FAILURE',flush=True)
                  print('PLAYER_STATE_E2E_POSSIBLY_DISPATCHED=true',flush=True)
                  print('PLAYER_STATE_E2E_NO_RETRY=true',flush=True)
                  raise SystemExit(0)
              print('PLAYER_STATE_E2E_RESULT=BLOCKED_PRECOMMIT_CONTROLLER_FAILURE',flush=True)
              raise SystemExit(20)
          if not committed:
              print('PLAYER_STATE_E2E_COMMIT=false',flush=True)
              print('PLAYER_STATE_E2E_POSSIBLY_DISPATCHED=false',flush=True)
              print('PLAYER_STATE_E2E_PHYSICAL_ACTION_COUNT=0',flush=True)
              print('PLAYER_STATE_E2E_RESULT=BLOCKED_READY_OR_COMMIT_REFUSED',flush=True)
              raise SystemExit(0)
          print('PLAYER_STATE_E2E_NO_RETRY=true',flush=True)
          if rc != 0 or not isinstance(result,dict):
              print('PLAYER_STATE_E2E_RESULT=AMBIGUOUS_POST_COMMIT_NO_VALID_RESULT',flush=True)
              print('PLAYER_STATE_E2E_POSSIBLY_DISPATCHED=true',flush=True)
              print('PLAYER_STATE_E2E_PHYSICAL_ACTION_COUNT=1',flush=True)
              raise SystemExit(0)
          status=result.get('status'); effects=result.get('effect_count'); reason=result.get('reason_code')
          print(f'PLAYER_STATE_E2E_WORKER_STATUS={status}',flush=True)
          print(f'PLAYER_STATE_E2E_WORKER_REASON={reason}',flush=True)
          print(f'PLAYER_STATE_E2E_PHYSICAL_ACTION_COUNT={effects}',flush=True)
          if status=='CONFIRMED' and effects==1:
              print('PLAYER_STATE_E2E_CAUSAL_DELTA=EXACT_ONE_TILE_CONFIRMED',flush=True)
              print('PLAYER_STATE_E2E_POSSIBLY_DISPATCHED=false',flush=True)
              print('PLAYER_STATE_E2E_RESULT=CONFIRMED_PASS',flush=True)
              print('PLAYER_STATE_E2E_SEMANTIC_PROMOTION_ELIGIBLE=true',flush=True)
          elif status=='REFUSED' and effects==0:
              print('PLAYER_STATE_E2E_POSSIBLY_DISPATCHED=false',flush=True)
              print('PLAYER_STATE_E2E_RESULT=BLOCKED_AFTER_COMMIT_NO_EFFECT',flush=True)
              print('PLAYER_STATE_E2E_SEMANTIC_PROMOTION_ELIGIBLE=false',flush=True)
          else:
              print('PLAYER_STATE_E2E_POSSIBLY_DISPATCHED=true',flush=True)
              print('PLAYER_STATE_E2E_RESULT=AMBIGUOUS_POST_COMMIT',flush=True)
              print('PLAYER_STATE_E2E_SEMANTIC_PROMOTION_ELIGIBLE=false',flush=True)
          PY
          controller_rc=$?
          set -e
          if [[ "$controller_rc" != 0 ]]; then
            block_zero 'GUARDED_DISPATCH_PRECOMMIT_CONTROLLER_FAILURE'
          fi

          bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token"
          released=1
          rm -f "$token" "$live_manifest" "$request"
          python3 - "$state/lease.json" <<'PY'
          import json,pathlib,sys
          state=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert state.get('status') == 'released'
          assert state.get('controller_task') is None
          assert state.get('controller_session') is None
          print('PLAYER_STATE_E2E_RELEASE=PASS')
          PY
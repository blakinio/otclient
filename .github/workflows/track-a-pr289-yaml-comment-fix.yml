name: Track A PR289 YAML comment spacing fix

on:
  push:
    branches: [ci/OTC-20260813-official-client-re-continuation]
    paths:
      - .github/workflows/track-a-pr289-yaml-comment-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generate corrected workflow blobs as ordinary files
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            tibia-official-client-re-login.yml
            tibia-official-client-re-live-state.yml
            tibia-official-client-re-focus-order.yml
            tibia-official-client-re-field-scan.yml
            tibia-official-client-re-atspi-session-bridge.yml
            tibia-official-client-re-atspi-semantic-inspect.yml
          )
          out=.github/pr289-fixed-workflows
          rm -rf "$out"
          mkdir -p "$out"
          for name in "${files[@]}"; do
            src=".github/workflows/$name"
            dst="$out/$name"
            cp "$src" "$dst"
            sed -i 's|actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3|actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3|g' "$dst"
          done
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$out"
          git commit -m 'ci(track-a): stage corrected YAML workflow blobs'
          git push origin HEAD:ci/OTC-20260813-official-client-re-continuation

name: Track A Qt in-game correlation comment trigger

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.actor == 'blakinio' &&
      github.event.issue.pull_request &&
      github.event.comment.body == 'ONE_SHOT_QT_INGAME_CORRELATION'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Dispatch trusted-main correlation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          payload='{"ref":"main","inputs":{"authorization":"ONE_SHOT_QT_INGAME_CORRELATION","duration_seconds":"900"}}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/track-a-qt-ingame-live-correlation.yml/dispatches" \
            --data "$payload"
          echo TRACK_A_QT_CORRELATION_COMMENT_DISPATCH=PASS

name: Track A Qt in-game correlation comment trigger

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/track-a-qt-ingame-comment-trigger.yml"
      - ".github/workflows/track-a-qt-ingame-live-correlation.yml"
      - ".github/scripts/test_track_a_qt_ingame_comment_trigger_contract.py"

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate owner-comment trigger contract
        shell: bash
        run: python3 .github/scripts/test_track_a_qt_ingame_comment_trigger_contract.py

  correlate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'blakinio' &&
      github.event.issue.pull_request &&
      github.event.comment.body == 'ONE_SHOT_QT_INGAME_CORRELATION'
    uses: ./.github/workflows/track-a-qt-ingame-live-correlation.yml
    with:
      authorization: ONE_SHOT_QT_INGAME_CORRELATION
      duration_seconds: '900'

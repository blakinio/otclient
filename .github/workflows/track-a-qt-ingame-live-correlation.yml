name: Track A Qt in-game live correlation

on:
  workflow_call:
    inputs:
      authorization:
        required: true
        type: string
      duration_seconds:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      authorization:
        description: Type ONE_SHOT_QT_INGAME_CORRELATION
        required: true
        type: string
      duration_seconds:
        description: Observation window in seconds (60..900)
        required: false
        default: '900'
        type: string

permissions:
  contents: read

concurrency:
  group: track-a-qt-ingame-live-correlation
  cancel-in-progress: false

env:
  CONTAINER: otclient-track-a-kasmvnc
  DISPLAY_NAME: ':1'
  EXPECTED_SIZE: '52105824'
  EXPECTED_SHA: d1a16819cec7e40cfee39c099d4868d2eb2d7c1c942078eda105233b5688817a
  CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
  TASK_ID: OTC-20260826-qt-ingame-live-correlation
  PERSISTENT_VIEW_URL: 'http://192.168.1.21:16084/?host=192.168.1.21&port=16083&encrypt=true&path=websockify&autoconnect=true'

jobs:
  correlate:
    if: github.actor == 'blakinio' && inputs.authorization == 'ONE_SHOT_QT_INGAME_CORRELATION'
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - name: Validate bounded owner-manual experiment
        shell: bash
        env:
          DURATION: ${{ inputs.duration_seconds }}
        run: |
          set -Eeuo pipefail
          [[ "$DURATION" =~ ^[0-9]+$ ]]
          (( DURATION >= 60 && DURATION <= 900 ))
          echo TRACK_A_QT_CORRELATION_AUTHORIZATION=PASS
          echo AGENT_GUI_INPUT=false
          echo AGENT_LOGIN=false
          echo AGENT_CHARACTER_SELECTION=false
          echo GAMEPLAY_ACTIONS=false
          echo CREDENTIAL_ACCESS=false
          echo PROCESS_MEMORY_ACCESS=false
          echo PACKET_PAYLOAD_CAPTURE=false
          echo RAW_WINDOW_TITLE_RETENTION=false

      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: main

      - name: Prove released control plane and exact target
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          python3 - "$CANONICAL_STATE" "$TASK_ID" <<'PY'
          import json, pathlib, sys, time
          root = pathlib.Path(sys.argv[1]); task = sys.argv[2]; now = int(time.time())
          def load(name):
              p = root / name
              if not p.is_file():
                  return None
              d = json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(d, dict):
                  raise SystemExit(name + '_NOT_OBJECT')
              return d
          lease = load('lease.json'); reg = load('runtime-registration.json')
          if lease is not None and lease.get('status') == 'active' and isinstance(lease.get('expires_at'), (int, float)) and int(lease['expires_at']) > now:
              if lease.get('controller_task') != task:
                  raise SystemExit('ACTIVE_RUNTIME_OWNER_CONFLICT')
          print('CONTROL_PLANE_PREFLIGHT=PASS')
          print('CANONICAL_REGISTRATION_PRESENT=' + str(reg is not None).lower())
          print('CANONICAL_LEASE_GENERATION=' + str((lease or {}).get('generation', 'UNKNOWN')))
          print('REGISTRATION_GENERATION=' + str((reg or {}).get('registration_generation', 'UNKNOWN')))
          PY
          docker inspect -f '{{.State.Running}}' "$CONTAINER" | grep -Fx true >/dev/null
          mapfile -t pids < <(docker exec "$CONTAINER" pgrep -x client)
          test "${#pids[@]}" -eq 1
          pid="${pids[0]}"
          [[ "$pid" =~ ^[0-9]+$ ]]
          actual_size="$(docker exec "$CONTAINER" stat -Lc %s "/proc/$pid/exe")"
          actual_sha="$(docker exec "$CONTAINER" sha256sum "/proc/$pid/exe" | awk '{print $1}')"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha" = "$EXPECTED_SHA"
          start="$(docker exec -i "$CONTAINER" python3 - "$pid" <<'PY'
          import pathlib,sys
          raw=pathlib.Path('/proc/'+sys.argv[1]+'/stat').read_text(encoding='ascii')
          print(raw[raw.rfind(')')+2:].split()[19])
          PY
          )"
          [[ "$start" =~ ^[0-9]+$ ]]
          matching=0
          while IFS= read -r xid; do
            [[ "$xid" =~ ^[0-9]+$ ]] || continue
            owner="$(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xprop -id "$xid" _NET_WM_PID 2>/dev/null | sed -nE 's/.*= *([0-9]+).*/\1/p')"
            [[ "$owner" == "$pid" ]] && matching=$((matching+1))
          done < <(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdotool search --onlyvisible --name '^Tibia' 2>/dev/null || true)
          test "$matching" -eq 1
          echo "pid=$pid" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo TARGET_UNIQUENESS=PROVEN
          echo TARGET_PID="$pid"
          echo TARGET_START_TICKS="$start"
          echo CURRENT_CLIENT_SIZE="$actual_size"
          echo CURRENT_CLIENT_SHA256="$actual_sha"

      - name: Observe owner-manual login to character context read-only
        shell: bash
        env:
          TARGET_PID: ${{ steps.target.outputs.pid }}
          TARGET_START: ${{ steps.target.outputs.start }}
          DURATION: ${{ inputs.duration_seconds }}
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/qt-ingame-window-context.jsonl"
          : > "$out"
          echo LOGGER_READY=true
          echo PERSISTENT_VIEW_URL="$PERSISTENT_VIEW_URL"
          printf '{"epoch_ms":%s,"event":"LOGGER_READY","pid":%s,"start_ticks":%s,"credentials_retained":false,"packet_payloads_retained":false,"raw_title_retained":false,"process_memory_access":false}\n' \
            "$(date +%s%3N)" "$TARGET_PID" "$TARGET_START" >> "$out"
          end=$(( $(date +%s) + DURATION ))
          last=''
          while (( $(date +%s) < end )); do
            mapfile -t current_pids < <(docker exec "$CONTAINER" pgrep -x client 2>/dev/null || true)
            test "${#current_pids[@]}" -eq 1 || { echo TARGET_UNIQUENESS_LOST >&2; exit 2; }
            test "${current_pids[0]}" = "$TARGET_PID" || { echo TARGET_PID_CHANGED >&2; exit 2; }
            current_start="$(docker exec -i "$CONTAINER" python3 - "$TARGET_PID" <<'PY'
          import pathlib,sys
          raw=pathlib.Path('/proc/'+sys.argv[1]+'/stat').read_text(encoding='ascii')
          print(raw[raw.rfind(')')+2:].split()[19])
          PY
            )"
            test "$current_start" = "$TARGET_START" || { echo START_TICKS_CHANGED >&2; exit 2; }
            matching=0
            character_window_context=false
            while IFS= read -r xid; do
              [[ "$xid" =~ ^[0-9]+$ ]] || continue
              owner="$(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xprop -id "$xid" _NET_WM_PID 2>/dev/null | sed -nE 's/.*= *([0-9]+).*/\1/p')"
              [[ "$owner" == "$TARGET_PID" ]] || continue
              matching=$((matching+1))
              title="$(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdotool getwindowname "$xid" 2>/dev/null || true)"
              [[ "$title" == 'Tibia - '* ]] && character_window_context=true
            done < <(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdotool search --onlyvisible --name '^Tibia' 2>/dev/null || true)
            state="$matching|$character_window_context"
            if [[ "$state" != "$last" ]]; then
              printf '{"epoch_ms":%s,"event":"WINDOW_CONTEXT","pid":%s,"start_ticks":%s,"matching_window_count":%s,"character_window_context":%s,"raw_title_retained":false,"credentials_retained":false,"packet_payloads_retained":false,"process_memory_access":false}\n' \
                "$(date +%s%3N)" "$TARGET_PID" "$TARGET_START" "$matching" "$character_window_context" >> "$out"
              echo WINDOW_CONTEXT_CHANGED="$character_window_context"
              last="$state"
            fi
            sleep 0.5
          done
          printf '{"epoch_ms":%s,"event":"LOGGER_DONE","pid":%s,"start_ticks":%s,"credentials_retained":false,"packet_payloads_retained":false,"raw_title_retained":false,"process_memory_access":false}\n' \
            "$(date +%s%3N)" "$TARGET_PID" "$TARGET_START" >> "$out"
          echo LOGGER_COMPLETED=true
          echo SECRETS_RETAINED=false
          echo RAW_WINDOW_TITLES_RETAINED=false
          echo PACKET_PAYLOADS_RETAINED=false
          echo PROCESS_MEMORY_ACCESS=false

      - name: Summarize correlation without semantic promotion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/qt-ingame-window-context.jsonl" "$RUNNER_TEMP/summary.json" <<'PY'
          import json,pathlib,sys
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); rows=[]
          if src.is_file():
              for line in src.read_text(encoding='utf-8').splitlines():
                  try: d=json.loads(line)
                  except json.JSONDecodeError: continue
                  if d.get('event') == 'WINDOW_CONTEXT': rows.append(d)
          contexts=[]; counts=[]; pids=[]; starts=[]
          for row in rows:
              value=row.get('character_window_context')
              if isinstance(value,bool) and value not in contexts: contexts.append(value)
              count=row.get('matching_window_count')
              if isinstance(count,int) and count not in counts: counts.append(count)
              pid=row.get('pid')
              if isinstance(pid,int) and pid not in pids: pids.append(pid)
              start=row.get('start_ticks')
              if isinstance(start,int) and start not in starts: starts.append(start)
          doc={
              'result':'OBSERVATION_COMPLETE' if rows else 'NO_RUNTIME_OBSERVATIONS',
              'window_context_event_count':len(rows),
              'window_character_context_values':contexts,
              'matching_window_count_values':counts,
              'observed_pid_values':pids,
              'observed_start_tick_values':starts,
              'semantic_promotion_performed':False,
              'credentials_retained':False,
              'packet_payloads_retained':False,
              'raw_window_titles_retained':False,
              'process_memory_access':False,
          }
          out.write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('WINDOW_CONTEXT_EVENTS='+str(len(rows)))
          print('WINDOW_CONTEXT_VALUES='+','.join(str(v).lower() for v in contexts))
          print('SEMANTIC_PROMOTION_PERFORMED=false')
          PY

      - name: Upload secret-free correlation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track-a-qt-ingame-correlation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qt-ingame-window-context.jsonl
            ${{ runner.temp }}/summary.json
          if-no-files-found: warn
          retention-days: 3

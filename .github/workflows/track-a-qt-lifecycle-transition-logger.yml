name: Track A Qt lifecycle transition logger

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/track-a-qt-lifecycle-transition-logger.yml"
      - ".github/scripts/track_a_qt_lifecycle_transition_logger.py"
      - ".github/scripts/test_track_a_qt_lifecycle_transition_logger_contract.py"
      - "docs/agents/tasks/active/OTC-20260828-current-qt-world-correlation.md"

permissions:
  contents: read

concurrency:
  group: track-a-qt-lifecycle-transition-logger
  cancel-in-progress: false

env:
  CONTAINER: otclient-track-a-kasmvnc
  DISPLAY_NAME: ':1'
  EXPECTED_SIZE: '52105824'
  EXPECTED_SHA: d1a16819cec7e40cfee39c099d4868d2eb2d7c1c942078eda105233b5688817a
  CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
  TASK_ID: OTC-20260828-current-qt-world-correlation
  DURATION_SECONDS: '900'
  PERSISTENT_VIEW_URL: 'http://192.168.1.21:16084/?host=192.168.1.21&port=16083&encrypt=true&path=websockify&autoconnect=true'

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate lifecycle logger contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .github/scripts/track_a_qt_lifecycle_transition_logger.py
          python3 .github/scripts/test_track_a_qt_lifecycle_transition_logger_contract.py

  logger:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'blakinio' &&
      github.event.issue.pull_request &&
      github.event.comment.body == 'ONE_SHOT_QT_LIFECYCLE_TRANSITION'
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - name: Validate read-only owner-manual authority
        shell: bash
        run: |
          set -Eeuo pipefail
          echo TRACK_A_QT_LIFECYCLE_TRANSITION_AUTHORIZATION=PASS
          echo AGENT_GUI_INPUT=false
          echo AGENT_LOGIN=false
          echo AGENT_CHARACTER_SELECTION=false
          echo GAMEPLAY_ACTIONS=false
          echo PROCESS_CONTROL=false
          echo PROCESS_MEMORY_ACCESS=read_only
          echo CREDENTIAL_ACCESS=false
          echo PACKET_PAYLOAD_CAPTURE=false
          echo SOCKET_ENDPOINT_RETENTION=false
          echo RAW_WINDOW_TITLE_RETENTION=false

      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: main

      - name: Prove released control plane and exact current target
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          python3 - "$CANONICAL_STATE" "$TASK_ID" <<'PY'
          import json, pathlib, sys, time
          root=pathlib.Path(sys.argv[1]); task=sys.argv[2]; now=int(time.time())
          def load(name):
              p=root/name
              if not p.is_file(): return None
              d=json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(d,dict): raise SystemExit(name+'_NOT_OBJECT')
              return d
          reg=load('runtime-registration.json'); lease=load('lease.json')
          if reg is None: raise SystemExit('REGISTRATION_ABSENT')
          if lease is not None and lease.get('status')=='active' and isinstance(lease.get('expires_at'),(int,float)) and int(lease['expires_at'])>now:
              if lease.get('controller_task') != task: raise SystemExit('ACTIVE_RUNTIME_OWNER_CONFLICT')
          print('CONTROL_PLANE_PREFLIGHT=PASS')
          print('REGISTRATION_GENERATION='+str(reg.get('registration_generation','UNKNOWN')))
          print('CANONICAL_LEASE_GENERATION='+str((lease or {}).get('generation','UNKNOWN')))
          PY
          docker inspect -f '{{.State.Running}}' "$CONTAINER" | grep -Fx true >/dev/null
          mapfile -t pids < <(docker exec "$CONTAINER" pgrep -x client)
          test "${#pids[@]}" -eq 1
          pid="${pids[0]}"
          test "$(docker exec "$CONTAINER" stat -Lc %s "/proc/$pid/exe")" = "$EXPECTED_SIZE"
          test "$(docker exec "$CONTAINER" sha256sum "/proc/$pid/exe" | awk '{print $1}')" = "$EXPECTED_SHA"
          start="$(docker exec -i "$CONTAINER" python3 - "$pid" <<'PY'
          import pathlib,sys
          raw=pathlib.Path('/proc/'+sys.argv[1]+'/stat').read_text(encoding='ascii')
          print(raw[raw.rfind(')')+2:].split()[19])
          PY
          )"
          [[ "$start" =~ ^[0-9]+$ ]]
          matching=0
          while IFS= read -r xid; do
            [[ "$xid" =~ ^[0-9]+$ ]] || continue
            owner="$(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xprop -id "$xid" _NET_WM_PID 2>/dev/null | sed -nE 's/.*= *([0-9]+).*/\1/p')"
            [[ "$owner" == "$pid" ]] && matching=$((matching+1))
          done < <(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdotool search --onlyvisible --name '^Tibia' 2>/dev/null || true)
          test "$matching" -eq 1
          echo "pid=$pid" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo TARGET_UNIQUENESS=PROVEN
          echo TARGET_PID="$pid"
          echo TARGET_START_TICKS="$start"

      - name: Observe deep Qt lifecycle transition read-only
        shell: bash
        env:
          TARGET_PID: ${{ steps.target.outputs.pid }}
          TARGET_START: ${{ steps.target.outputs.start }}
        run: |
          set -Eeuo pipefail
          lifecycle="$RUNNER_TEMP/qt-lifecycle-transition.jsonl"
          window="$RUNNER_TEMP/qt-lifecycle-window.jsonl"
          : > "$lifecycle"
          : > "$window"
          docker exec -i "$CONTAINER" python3 - "$TARGET_PID" "$TARGET_START" "$EXPECTED_SIZE" "$EXPECTED_SHA" "$DURATION_SECONDS" \
            < .github/scripts/track_a_qt_lifecycle_transition_logger.py > "$lifecycle" &
          logger_pid=$!
          for _ in $(seq 1 120); do
            if grep -q '"event": "LOGGER_READY"' "$lifecycle" 2>/dev/null; then break; fi
            kill -0 "$logger_pid" 2>/dev/null || { cat "$lifecycle" >&2; exit 2; }
            sleep 1
          done
          grep -q '"event": "LOGGER_READY"' "$lifecycle"
          echo LOGGER_READY=true
          echo PERSISTENT_VIEW_URL="$PERSISTENT_VIEW_URL"
          end=$(( $(date +%s) + DURATION_SECONDS ))
          last=''
          while (( $(date +%s) < end )) && kill -0 "$logger_pid" 2>/dev/null; do
            matching=0
            character_window_context=false
            while IFS= read -r xid; do
              [[ "$xid" =~ ^[0-9]+$ ]] || continue
              owner="$(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xprop -id "$xid" _NET_WM_PID 2>/dev/null | sed -nE 's/.*= *([0-9]+).*/\1/p')"
              [[ "$owner" == "$TARGET_PID" ]] || continue
              matching=$((matching+1))
              title="$(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdotool getwindowname "$xid" 2>/dev/null || true)"
              [[ "$title" == 'Tibia - '* ]] && character_window_context=true
            done < <(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdotool search --onlyvisible --name '^Tibia' 2>/dev/null || true)
            state="$matching|$character_window_context"
            if [[ "$state" != "$last" ]]; then
              printf '{"epoch_ms":%s,"event":"WINDOW_CONTEXT","matching_window_count":%s,"character_window_context":%s,"raw_window_title_retained":false}\n' \
                "$(date +%s%3N)" "$matching" "$character_window_context" >> "$window"
              echo WINDOW_CONTEXT_CHANGED="$character_window_context"
              last="$state"
            fi
            sleep 0.5
          done
          wait "$logger_pid"
          echo LOGGER_COMPLETED=true
          echo CREDENTIALS_RETAINED=false
          echo SESSION_SECRETS_RETAINED=false
          echo PACKET_PAYLOADS_RETAINED=false
          echo SOCKET_ENDPOINTS_RETAINED=false
          echo RAW_WINDOW_TITLES_RETAINED=false

      - name: Summarize lifecycle transition without semantic promotion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/qt-lifecycle-transition.jsonl" "$RUNNER_TEMP/qt-lifecycle-window.jsonl" "$RUNNER_TEMP/qt-lifecycle-summary.json" <<'PY'
          import json,pathlib,sys
          life=pathlib.Path(sys.argv[1]); win=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3])
          rows=[]
          if life.is_file():
              for line in life.read_text(encoding='utf-8').splitlines():
                  try:d=json.loads(line)
                  except json.JSONDecodeError:continue
                  if d.get('event') in ('LOGGER_READY','STATE'):rows.append(d)
          keys=('auth_controller','gameserver_login_controller','character_selection_controller','disconnect_reaction_controller')
          qvalues={key:[] for key in keys}; tcp=[]; sockets=[]
          for row in rows:
              for key in keys:
                  value=(row.get('qstate_candidates') or {}).get(key)
                  if value not in qvalues[key]:qvalues[key].append(value)
              for name,target in (('tcp_established_count',tcp),('tcp_socket_count',sockets)):
                  value=row.get(name)
                  if isinstance(value,int) and value not in target:target.append(value)
          contexts=[]
          if win.is_file():
              for line in win.read_text(encoding='utf-8').splitlines():
                  try:d=json.loads(line)
                  except json.JSONDecodeError:continue
                  value=d.get('character_window_context')
                  if isinstance(value,bool) and value not in contexts:contexts.append(value)
          doc={'result':'OBSERVATION_COMPLETE' if rows else 'NO_RUNTIME_OBSERVATIONS','qstate_candidate_values':qvalues,'tcp_established_values':tcp,'tcp_socket_count_values':sockets,'window_character_context_values':contexts,'credentials_retained':False,'session_secrets_retained':False,'packet_payloads_retained':False,'socket_endpoints_retained':False,'raw_window_titles_retained':False,'in_game_claimed':False,'semantic_promotion_performed':False}
          out.write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('LIFECYCLE_STATE_EVENTS='+str(len(rows)))
          print('QSTATE_CANDIDATE_VALUES='+json.dumps(qvalues,sort_keys=True,separators=(',',':')))
          print('TCP_ESTABLISHED_VALUES='+','.join(map(str,tcp)))
          print('WINDOW_CONTEXT_VALUES='+','.join(str(v).lower() for v in contexts))
          print('IN_GAME_CLAIMED=false')
          print('SEMANTIC_PROMOTION_PERFORMED=false')
          PY

      - name: Upload secret-free lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track-a-qt-lifecycle-transition-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qt-lifecycle-transition.jsonl
            ${{ runner.temp }}/qt-lifecycle-window.jsonl
            ${{ runner.temp }}/qt-lifecycle-summary.json
          if-no-files-found: warn
          retention-days: 3

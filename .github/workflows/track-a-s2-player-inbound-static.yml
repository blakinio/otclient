name: Track A S2 player inbound static discriminator

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-s2-player-inbound-static.yml
      - docs/agents/tasks/active/OTC-20260818-track-a-s2-player-inbound-static.md
      - docs/agents/evidence/OTC-20260818-track-a-s2-player-inbound-static/**
      - docs/agents/reports/OTCLIENT-20260818-track-a-s2-player-inbound-static.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recover exact player inbound QMeta dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Fetch exact client and recover player QMeta graph
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools python3-capstone

          r="$RUNNER_TEMP/track-a-s2-player"
          mkdir -p "$r/bin" "$r/state" "$r/client" "$r/evidence"
          cd "$r/bin"

          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wireproxy.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tgz' | sha256sum -c -
          mkdir wp
          tar -xzf wireproxy.tgz -C wp
          cp "$(find wp -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy

          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25347\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25347 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          echo 'PLAYER_S2_WARP_PATH=PASS'

          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25347 --compressed -fL \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' \
            "$u" -o "$r/client/client.lzma"
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  '"$r"'/client/client.lzma' | sha256sum -c -
          echo 'PLAYER_S2_EXACT_PACKED_SHA=PASS'

          python3 - "$r/client/client.lzma" "$r/client/client" "$r/evidence" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import lzma
          import pathlib
          import re
          import struct
          import sys

          from capstone import Cs, CsError, CS_ARCH_X86, CS_MODE_64
          from capstone.x86_const import X86_OP_IMM, X86_OP_MEM, X86_REG_RIP
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection

          packed_path = pathlib.Path(sys.argv[1])
          raw_path = pathlib.Path(sys.argv[2])
          evidence = pathlib.Path(sys.argv[3])
          evidence.mkdir(parents=True, exist_ok=True)

          packed = packed_path.read_bytes()
          props = packed[32]
          lc = props % 9
          rest = props // 9
          lp = rest % 5
          pb = rest // 5
          dict_size = int.from_bytes(packed[33:37], 'little')
          raw = lzma.decompress(
              packed[45:],
              format=lzma.FORMAT_RAW,
              filters=[{'id': lzma.FILTER_LZMA1, 'dict_size': dict_size, 'lc': lc, 'lp': lp, 'pb': pb}],
          )
          digest = hashlib.sha256(raw).hexdigest()
          assert len(raw) == 51965216, len(raw)
          assert digest == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe', digest
          raw_path.write_bytes(raw)
          print('PLAYER_S2_EXACT_CLIENT_SHA=PASS')
          print('PLAYER_S2_CLIENT_EXECUTED=false')
          print('PLAYER_S2_RUNTIME_ACCESS=none')

          with raw_path.open('rb') as fh:
              elf = ELFFile(fh)
              sections = [
                  {
                      'name': s.name,
                      'off': int(s['sh_offset']),
                      'size': int(s['sh_size']),
                      'va': int(s['sh_addr']),
                      'flags': int(s['sh_flags']),
                  }
                  for s in elf.iter_sections()
              ]

              relocs: dict[int, int] = {}
              for sec in elf.iter_sections():
                  if not isinstance(sec, RelocationSection):
                      continue
                  symtab = elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      where = int(rel['r_offset'])
                      addend = int(rel['r_addend']) if rel.is_RELA() else 0
                      rtype = int(rel['r_info_type'])
                      if rtype == 8:  # R_X86_64_RELATIVE
                          relocs[where] = addend
                      elif symtab is not None and rel['r_info_sym']:
                          sym = symtab.get_symbol(rel['r_info_sym'])
                          relocs[where] = int(sym['st_value']) + addend

          def file_off(va: int) -> int:
              for s in sections:
                  if s['va'] <= va < s['va'] + s['size']:
                      return s['off'] + va - s['va']
              raise ValueError(hex(va))

          def mapped(va: int) -> bool:
              return any(s['va'] <= va < s['va'] + s['size'] for s in sections)

          def executable(va: int) -> bool:
              return any((s['flags'] & 4) and s['va'] <= va < s['va'] + s['size'] for s in sections)

          def u32(va: int) -> int:
              return struct.unpack_from('<I', raw, file_off(va))[0]

          def i32(va: int) -> int:
              return struct.unpack_from('<i', raw, file_off(va))[0]

          def u64(va: int) -> int:
              return struct.unpack_from('<Q', raw, file_off(va))[0]

          def ptr(va: int) -> int:
              return relocs.get(va, u64(va))

          def qstring(stringdata: int, index: int) -> str:
              entry = stringdata + index * 8
              rel = u32(entry)
              length = u32(entry + 4)
              start = stringdata + rel
              if not mapped(start) or length > 1000:
                  raise ValueError((hex(stringdata), index, rel, length))
              return raw[file_off(start):file_off(start) + length].decode('utf-8', 'strict')

          def validate_metaobject(addr: int, expected: str | None = None):
              try:
                  stringdata = ptr(addr + 8)
                  metadata = ptr(addr + 16)
                  static_metacall = ptr(addr + 24)
                  if not (mapped(stringdata) and mapped(metadata) and executable(static_metacall)):
                      return None
                  header = [u32(metadata + i * 4) for i in range(14)]
                  revision, class_idx, _, _, method_count, method_data, property_count, _, enum_count, _, ctor_count, _, flags, signal_count = header
                  if not (1 <= revision <= 20 and 0 <= method_count <= 500 and 0 <= property_count <= 500 and 0 <= enum_count <= 500 and 0 <= ctor_count <= 500):
                      return None
                  if method_count and method_data < 14:
                      return None
                  class_name = qstring(stringdata, class_idx)
                  if expected is not None and class_name != expected:
                      return None
                  return {
                      'static_metaobject': addr,
                      'stringdata': stringdata,
                      'metadata': metadata,
                      'static_metacall': static_metacall,
                      'revision': revision,
                      'class_name': class_name,
                      'method_count': method_count,
                      'method_data': method_data,
                      'property_count': property_count,
                      'enum_count': enum_count,
                      'constructor_count': ctor_count,
                      'flags': flags,
                      'signal_count': signal_count,
                  }
              except Exception:
                  return None

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          md_scan = Cs(CS_ARCH_X86, CS_MODE_64)
          md_scan.detail = True
          md_scan.skipdata = True

          def safe_operands(ins):
              try:
                  return ins.operands
              except CsError:
                  return []

          def rip_targets(disassembler, code: bytes, base: int):
              for ins in disassembler.disasm(code, base):
                  for op in safe_operands(ins):
                      if op.type == X86_OP_MEM and op.mem.base == X86_REG_RIP:
                          yield ins, ins.address + ins.size + op.mem.disp
                      elif op.type == X86_OP_IMM:
                          yield ins, int(op.imm)

          def find_metaobject_from_vptr(vptr: int, expected: str):
              slots = []
              found = []
              for idx in range(28):
                  at = vptr + idx * 8
                  try:
                      target = ptr(at)
                  except Exception:
                      break
                  slots.append({'slot': idx, 'entry_va': f'0x{at:x}', 'target': f'0x{target:x}', 'executable': executable(target)})
                  if not executable(target):
                      continue
                  try:
                      code = raw[file_off(target):file_off(target) + 0x220]
                  except Exception:
                      continue
                  for ins, ref in rip_targets(md, code, target):
                      meta = validate_metaobject(ref, expected)
                      if meta is not None:
                          found.append((idx, target, ins.address, meta))
              unique = {(m['static_metaobject'], m['static_metacall']): (slot, func, xref, m) for slot, func, xref, m in found}
              assert len(unique) == 1, (expected, 'metaobject_candidates', [(hex(k[0]), hex(k[1])) for k in unique])
              slot, func, xref, meta = next(iter(unique.values()))
              return meta, slots, {'vtable_slot': slot, 'function': func, 'xref_instruction': xref}

          def decode_type(meta, raw_type: int) -> str:
              if raw_type & 0x80000000:
                  try:
                      return qstring(meta['stringdata'], raw_type & 0x7fffffff)
                  except Exception:
                      return f'unresolved-string-index:{raw_type & 0x7fffffff}'
              builtins = {
                  0x0: 'UnknownType', 0x1: 'bool', 0x2: 'int', 0x3: 'uint', 0x4: 'qlonglong',
                  0x5: 'qulonglong', 0x6: 'double', 0x7: 'QChar', 0x8: 'QVariantMap', 0x9: 'QVariantList',
                  0xa: 'QString', 0xb: 'QStringList', 0xc: 'QByteArray', 0x2b: 'void'
              }
              return builtins.get(raw_type, f'metatype:{raw_type}')

          def parse_methods(meta):
              methods = []
              base = meta['metadata']
              for idx in range(meta['method_count']):
                  row = [u32(base + (meta['method_data'] + idx * 6 + j) * 4) for j in range(6)]
                  name = qstring(meta['stringdata'], row[0])
                  argc = row[1]
                  params_offset = row[2]
                  raw_types = [u32(base + (params_offset + j) * 4) for j in range(argc + 1)]
                  methods.append({
                      'index': idx,
                      'name': name,
                      'argc': argc,
                      'flags': row[4],
                      'revision': row[5],
                      'raw_types': raw_types,
                      'types': [decode_type(meta, x) for x in raw_types],
                      'is_signal_by_index': idx < meta['signal_count'],
                  })
              return methods

          def recover_dispatch(meta, methods):
              start = meta['static_metacall']
              code = raw[file_off(start):file_off(start) + 0x1800]
              insns = list(md.disasm(code, start))
              candidates = []
              n = meta['method_count']
              if n == 0:
                  return None, []
              for pos, ins in enumerate(insns):
                  ops = safe_operands(ins)
                  if ins.mnemonic != 'lea' or len(ops) < 2:
                      continue
                  op = ops[1]
                  if op.type != X86_OP_MEM or op.mem.base != X86_REG_RIP:
                      continue
                  table = ins.address + ins.size + op.mem.disp
                  try:
                      targets = [table + i32(table + i * 4) for i in range(n)]
                  except Exception:
                      continue
                  if sum(executable(t) for t in targets) != n:
                      continue
                  context = insns[max(0, pos - 18):pos + 4]
                  has_full_range = False
                  for c in context:
                      if c.mnemonic != 'cmp':
                          continue
                      normalized = c.op_str.replace(' ', '').lower()
                      if normalized.endswith(f',0x{n-1:x}') or normalized.endswith(f',{n-1}'):
                          has_full_range = True
                  candidates.append({
                      'lea': ins.address,
                      'table': table,
                      'targets': targets,
                      'full_method_range_guard': has_full_range,
                      'context': [f'0x{x.address:x}:{x.mnemonic} {x.op_str}' for x in context],
                  })
              strong = [c for c in candidates if c['full_method_range_guard']]
              chosen = strong[0] if len(strong) == 1 else None
              if chosen is not None:
                  for method, target in zip(methods, chosen['targets']):
                      method['dispatch_target'] = f'0x{target:x}'
              return chosen, candidates

          classes = {
              'player_handler': (0x308a008, 'tibia::game::TPlayerProtocolMessageHandler'),
              'game_session': (0x3078ba0, 'tibia::game::TGameserverGameSession'),
              'player_data': (0x308ca70, 'tibia::game::TPlayerData'),
          }

          meta_output = {}
          all_methods = {}
          dispatch_output = {}
          vtables = {}
          for key, (vptr, expected) in classes.items():
              meta, slots, provenance = find_metaobject_from_vptr(vptr, expected)
              methods = parse_methods(meta)
              chosen, candidates = recover_dispatch(meta, methods)
              meta_output[key] = {
                  **{k: (f'0x{v:x}' if isinstance(v, int) and k in ('static_metaobject','stringdata','metadata','static_metacall') else v) for k, v in meta.items()},
                  'provenance': {k: (f'0x{v:x}' if isinstance(v, int) else v) for k, v in provenance.items()},
              }
              all_methods[key] = methods
              dispatch_output[key] = {
                  'selected': None if chosen is None else {
                      'lea': f"0x{chosen['lea']:x}",
                      'table': f"0x{chosen['table']:x}",
                      'full_method_range_guard': chosen['full_method_range_guard'],
                      'context': chosen['context'],
                  },
                  'candidate_count': len(candidates),
                  'strong_candidate_count': sum(c['full_method_range_guard'] for c in candidates),
              }
              vtables[key] = slots
              print(f"PLAYER_S2_META_{key.upper()}={meta['class_name']};METHODS={meta['method_count']};SIGNALS={meta['signal_count']};STATIC_METACALL=0x{meta['static_metacall']:x};DISPATCH={'PROVEN' if chosen else 'UNKNOWN'}")

          (evidence / 'metaobjects.json').write_text(json.dumps(meta_output, indent=2, sort_keys=True) + '\n')
          (evidence / 'methods.json').write_text(json.dumps(all_methods, indent=2, sort_keys=True) + '\n')
          (evidence / 'dispatch.json').write_text(json.dumps(dispatch_output, indent=2, sort_keys=True) + '\n')
          (evidence / 'vtables.json').write_text(json.dumps(vtables, indent=2, sort_keys=True) + '\n')

          target_names = {
              'receivedPlayerDataBasicMessage',
              'receivedPlayerDataCurrentMessage',
              'receivedPlayerInventoryMessage',
              'receivedPlayerSkillsMessage',
              'receivedPlayerStateMessage',
              'handlePlayerDataBasicMessage',
              'handlePlayerInventoryMessage',
              'onPlayerDataChanged',
              'onPlayerSkillStatsChanged',
              'onInventoryChanged',
              'onPlayerPositionChanged',
          }
          target_methods = []
          for owner, methods in all_methods.items():
              for m in methods:
                  if m['name'] in target_names or re.search(r'(PlayerData|PlayerState|PlayerInventory|PlayerSkills)', m['name']):
                      target_methods.append({'owner': owner, **m})
          (evidence / 'target-methods.json').write_text(json.dumps(target_methods, indent=2, sort_keys=True) + '\n')

          target_disassembly = []
          target_analysis = []
          seen_targets = set()
          for item in target_methods:
              target_hex = item.get('dispatch_target')
              if not target_hex:
                  continue
              target = int(target_hex, 16)
              if target in seen_targets:
                  continue
              seen_targets.add(target)
              code = raw[file_off(target):file_off(target) + 0x380]
              instructions = list(md.disasm(code, target))
              direct_calls = []
              rip_refs = []
              lines = []
              for ins in instructions:
                  lines.append(f'0x{ins.address:x}:\t{ins.mnemonic}\t{ins.op_str}')
                  for op in safe_operands(ins):
                      if ins.mnemonic == 'call' and op.type == X86_OP_IMM:
                          direct_calls.append(f'0x{int(op.imm):x}')
                      if op.type == X86_OP_MEM and op.mem.base == X86_REG_RIP:
                          rip_refs.append(f'0x{ins.address + ins.size + op.mem.disp:x}')
                  if ins.mnemonic == 'ret' and len(lines) > 8:
                      break
              target_disassembly.append(f"## 0x{target:x}\n" + '\n'.join(lines) + '\n')
              target_analysis.append({
                  'target': f'0x{target:x}',
                  'direct_calls': sorted(set(direct_calls)),
                  'rip_refs': sorted(set(rip_refs)),
                  'owners_and_methods': [
                      {'owner': x['owner'], 'name': x['name'], 'index': x['index']}
                      for x in target_methods if x.get('dispatch_target') == f'0x{target:x}'
                  ],
              })
          (evidence / 'target-disassembly.txt').write_text('\n'.join(target_disassembly))
          (evidence / 'target-analysis.json').write_text(json.dumps(target_analysis, indent=2, sort_keys=True) + '\n')

          anchor_vas = {
              'TPlayerProtocolMessageHandler': 0x308a008,
              'TPlayerData': 0x308ca70,
          }
          anchor_xrefs = {name: [] for name in anchor_vas}
          for s in sections:
              if not (s['flags'] & 4) or s['size'] == 0:
                  continue
              code = raw[s['off']:s['off'] + s['size']]
              for ins, ref in rip_targets(md_scan, code, s['va']):
                  for name, anchor in anchor_vas.items():
                      if ref == anchor and len(anchor_xrefs[name]) < 32:
                          anchor_xrefs[name].append({'instruction': f'0x{ins.address:x}', 'mnemonic': ins.mnemonic, 'op_str': ins.op_str})
          (evidence / 'anchor-code-xrefs.json').write_text(json.dumps(anchor_xrefs, indent=2, sort_keys=True) + '\n')

          summary = {
              'schema': 'track-a-s2-player-inbound-static-v2',
              'exact_client_sha': digest,
              'runtime_access': 'none',
              'client_executed': False,
              'classes_recovered': {k: v['class_name'] for k, v in meta_output.items()},
              'dispatch_status': {k: ('PROVEN_FULL_RANGE_TABLE' if dispatch_output[k]['selected'] else 'UNKNOWN') for k in dispatch_output},
              'target_methods': target_methods,
              'handler_to_playerdata_relation': 'UNKNOWN_PENDING_REVIEW',
              'raw_client_uploaded': False,
              'secret_access': False,
              'pr475_runtime_touched': False,
          }
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')

          print('PLAYER_S2_QMETA_RECOVERY=PASS')
          print(f'PLAYER_S2_TARGET_METHOD_COUNT={len(target_methods)}')
          for item in target_methods:
              print('PLAYER_S2_TARGET=' + json.dumps(item, sort_keys=True))
          print('PLAYER_S2_HANDLER_TO_PLAYERDATA=UNKNOWN_PENDING_REVIEW')
          print('PLAYER_S2_PR475_RUNTIME_TOUCHED=false')
          print('PLAYER_S2_SECRET_ACCESS=false')
          PY

          rm -f "$r/client/client" "$r/client/client.lzma"
          test ! -e "$r/client/client"
          test ! -e "$r/client/client.lzma"
          echo 'PLAYER_S2_RAW_CLIENT_REMOVED_BEFORE_UPLOAD=PASS'

      - name: Upload sanitized player static evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-s2-player-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-s2-player/evidence
          if-no-files-found: error
          retention-days: 7

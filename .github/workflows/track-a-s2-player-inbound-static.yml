name: Track A S2 player inbound static discriminator

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-s2-player-inbound-static.yml
      - docs/agents/tasks/active/OTC-20260818-track-a-s2-player-inbound-static.md
      - docs/agents/evidence/OTC-20260818-track-a-s2-player-inbound-static/**
      - docs/agents/reports/OTCLIENT-20260818-track-a-s2-player-inbound-static.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recover exact received-message QMeta owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Fetch exact client and identify received-message owner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools python3-capstone

          r="$RUNNER_TEMP/track-a-s2-player-owner"
          mkdir -p "$r/bin" "$r/state" "$r/client" "$r/evidence"
          cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wireproxy.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tgz' | sha256sum -c -
          mkdir wp
          tar -xzf wireproxy.tgz -C wp
          cp "$(find wp -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy

          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25348\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25348 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          echo 'PLAYER_S2_OWNER_WARP_PATH=PASS'

          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25348 --compressed -fL \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' \
            "$u" -o "$r/client/client.lzma"
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  '"$r"'/client/client.lzma' | sha256sum -c -
          echo 'PLAYER_S2_OWNER_EXACT_PACKED_SHA=PASS'

          python3 - "$r/client/client.lzma" "$r/client/client" "$r/evidence" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import lzma
          import pathlib
          import struct
          import sys

          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86_const import X86_OP_MEM, X86_REG_RIP
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection

          packed_path = pathlib.Path(sys.argv[1])
          raw_path = pathlib.Path(sys.argv[2])
          evidence = pathlib.Path(sys.argv[3])
          evidence.mkdir(parents=True, exist_ok=True)

          packed = packed_path.read_bytes()
          props = packed[32]
          lc = props % 9
          rest = props // 9
          lp = rest % 5
          pb = rest // 5
          dict_size = int.from_bytes(packed[33:37], 'little')
          raw = lzma.decompress(
              packed[45:],
              format=lzma.FORMAT_RAW,
              filters=[{'id': lzma.FILTER_LZMA1, 'dict_size': dict_size, 'lc': lc, 'lp': lp, 'pb': pb}],
          )
          digest = hashlib.sha256(raw).hexdigest()
          assert len(raw) == 51965216
          assert digest == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          raw_path.write_bytes(raw)
          print('PLAYER_S2_OWNER_EXACT_CLIENT_SHA=PASS')
          print('PLAYER_S2_OWNER_CLIENT_EXECUTED=false')
          print('PLAYER_S2_OWNER_RUNTIME_ACCESS=none')

          with raw_path.open('rb') as fh:
              elf = ELFFile(fh)
              sections = [
                  {'name': s.name, 'off': int(s['sh_offset']), 'size': int(s['sh_size']), 'va': int(s['sh_addr']), 'flags': int(s['sh_flags'])}
                  for s in elf.iter_sections()
              ]
              relocs: dict[int, int] = {}
              for sec in elf.iter_sections():
                  if not isinstance(sec, RelocationSection):
                      continue
                  symtab = elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      where = int(rel['r_offset'])
                      addend = int(rel['r_addend']) if rel.is_RELA() else 0
                      if int(rel['r_info_type']) == 8:
                          relocs[where] = addend
                      elif symtab is not None and rel['r_info_sym']:
                          sym = symtab.get_symbol(rel['r_info_sym'])
                          relocs[where] = int(sym['st_value']) + addend

          def file_off(va: int) -> int:
              for s in sections:
                  if s['va'] <= va < s['va'] + s['size']:
                      return s['off'] + va - s['va']
              raise ValueError(hex(va))

          def mapped(va: int) -> bool:
              return any(s['va'] <= va < s['va'] + s['size'] for s in sections)

          def executable(va: int) -> bool:
              return any((s['flags'] & 4) and s['va'] <= va < s['va'] + s['size'] for s in sections)

          def u32(va: int) -> int:
              return struct.unpack_from('<I', raw, file_off(va))[0]

          def i32(va: int) -> int:
              return struct.unpack_from('<i', raw, file_off(va))[0]

          def u64(va: int) -> int:
              return struct.unpack_from('<Q', raw, file_off(va))[0]

          def ptr(va: int) -> int:
              return relocs.get(va, u64(va))

          def qstring(stringdata: int, index: int) -> str:
              entry = stringdata + index * 8
              rel = u32(entry)
              length = u32(entry + 4)
              start = stringdata + rel
              if not mapped(start) or length > 2000:
                  raise ValueError((hex(stringdata), index, rel, length))
              return raw[file_off(start):file_off(start) + length].decode('utf-8', 'strict')

          def validate_metaobject(addr: int):
              try:
                  stringdata = ptr(addr + 8)
                  metadata = ptr(addr + 16)
                  static_metacall = ptr(addr + 24)
                  if not (mapped(stringdata) and mapped(metadata) and executable(static_metacall)):
                      return None
                  header = [u32(metadata + i * 4) for i in range(14)]
                  revision, class_idx, _, _, method_count, method_data, property_count, _, enum_count, _, ctor_count, _, flags, signal_count = header
                  if not (1 <= revision <= 20 and 0 <= method_count <= 500 and 0 <= property_count <= 500 and 0 <= enum_count <= 500 and 0 <= ctor_count <= 500):
                      return None
                  if method_count and method_data < 14:
                      return None
                  class_name = qstring(stringdata, class_idx)
                  if not class_name or len(class_name) > 300:
                      return None
                  return {
                      'static_metaobject': addr,
                      'stringdata': stringdata,
                      'metadata': metadata,
                      'static_metacall': static_metacall,
                      'revision': revision,
                      'class_name': class_name,
                      'method_count': method_count,
                      'method_data': method_data,
                      'property_count': property_count,
                      'enum_count': enum_count,
                      'constructor_count': ctor_count,
                      'flags': flags,
                      'signal_count': signal_count,
                  }
              except Exception:
                  return None

          def decode_type(meta, raw_type: int) -> str:
              if raw_type & 0x80000000:
                  try:
                      return qstring(meta['stringdata'], raw_type & 0x7fffffff)
                  except Exception:
                      return f'unresolved-string-index:{raw_type & 0x7fffffff}'
              builtins = {0x0:'UnknownType',0x1:'bool',0x2:'int',0x3:'uint',0x4:'qlonglong',0x5:'qulonglong',0x6:'double',0x7:'QChar',0x8:'QVariantMap',0x9:'QVariantList',0xa:'QString',0xb:'QStringList',0xc:'QByteArray',0x2b:'void'}
              return builtins.get(raw_type, f'metatype:{raw_type}')

          def parse_methods(meta):
              methods = []
              base = meta['metadata']
              for idx in range(meta['method_count']):
                  row = [u32(base + (meta['method_data'] + idx * 6 + j) * 4) for j in range(6)]
                  argc = row[1]
                  params = row[2]
                  raw_types = [u32(base + (params + j) * 4) for j in range(argc + 1)]
                  methods.append({
                      'index': idx,
                      'name': qstring(meta['stringdata'], row[0]),
                      'argc': argc,
                      'flags': row[4],
                      'revision': row[5],
                      'raw_types': raw_types,
                      'types': [decode_type(meta, value) for value in raw_types],
                      'is_signal_by_index': idx < meta['signal_count'],
                  })
              return methods

          # Every Qt staticMetaObject candidate has its stringdata relocation at +8.
          candidates = set()
          for where in relocs:
              base = where - 8
              if base >= 0 and base % 8 == 0 and mapped(base):
                  candidates.add(base)

          metaobjects = []
          for addr in sorted(candidates):
              meta = validate_metaobject(addr)
              if meta is None:
                  continue
              try:
                  methods = parse_methods(meta)
              except Exception:
                  continue
              metaobjects.append({'meta': meta, 'methods': methods})

          unique = {entry['meta']['static_metaobject']: entry for entry in metaobjects}
          metaobjects = [unique[k] for k in sorted(unique)]
          print(f'PLAYER_S2_OWNER_METAOBJECT_COUNT={len(metaobjects)}')

          target_names = {
              'receivedPlayerDataBasicMessage',
              'receivedPlayerDataCurrentMessage',
              'receivedPlayerInventoryMessage',
              'receivedPlayerSkillsMessage',
              'receivedPlayerStateMessage',
          }
          matches = []
          for entry in metaobjects:
              for method in entry['methods']:
                  if method['name'] in target_names:
                      matches.append({
                          'class_name': entry['meta']['class_name'],
                          'static_metaobject': f"0x{entry['meta']['static_metaobject']:x}",
                          'static_metacall': f"0x{entry['meta']['static_metacall']:x}",
                          'method_count': entry['meta']['method_count'],
                          'signal_count': entry['meta']['signal_count'],
                          **method,
                      })

          (evidence / 'received-player-owner-matches.json').write_text(json.dumps(matches, indent=2, sort_keys=True) + '\n')
          compact_meta = [
              {
                  'class_name': e['meta']['class_name'],
                  'static_metaobject': f"0x{e['meta']['static_metaobject']:x}",
                  'static_metacall': f"0x{e['meta']['static_metacall']:x}",
                  'method_count': e['meta']['method_count'],
                  'signal_count': e['meta']['signal_count'],
              }
              for e in metaobjects
          ]
          (evidence / 'global-metaobject-census.json').write_text(json.dumps(compact_meta, indent=2, sort_keys=True) + '\n')

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          def recover_dispatch(entry):
              meta = entry['meta']
              n = meta['method_count']
              if n == 0:
                  return None, []
              code = raw[file_off(meta['static_metacall']):file_off(meta['static_metacall']) + 0x3000]
              insns = list(md.disasm(code, meta['static_metacall']))
              candidates = []
              for pos, ins in enumerate(insns):
                  if ins.mnemonic != 'lea' or len(ins.operands) < 2:
                      continue
                  op = ins.operands[1]
                  if op.type != X86_OP_MEM or op.mem.base != X86_REG_RIP:
                      continue
                  table = ins.address + ins.size + op.mem.disp
                  try:
                      targets = [table + i32(table + i * 4) for i in range(n)]
                  except Exception:
                      continue
                  if sum(executable(target) for target in targets) != n:
                      continue
                  context = insns[max(0, pos - 20):pos + 4]
                  guard = any(
                      c.mnemonic == 'cmp' and (
                          c.op_str.replace(' ','').lower().endswith(f',0x{n-1:x}') or
                          c.op_str.replace(' ','').lower().endswith(f',{n-1}')
                      )
                      for c in context
                  )
                  candidates.append({'lea': ins.address, 'table': table, 'targets': targets, 'full_method_range_guard': guard})
              strong = [c for c in candidates if c['full_method_range_guard']]
              return (strong[0] if len(strong) == 1 else None), candidates

          owner_results = []
          owners = sorted({match['static_metaobject'] for match in matches})
          for owner_hex in owners:
              owner_addr = int(owner_hex, 16)
              entry = unique[owner_addr]
              chosen, dispatch_candidates = recover_dispatch(entry)
              methods = [dict(method) for method in entry['methods']]
              if chosen is not None:
                  for method, target in zip(methods, chosen['targets']):
                      method['dispatch_target'] = f'0x{target:x}'
              selected_methods = [method for method in methods if method['name'] in target_names]
              disassembly = []
              target_analysis = []
              for method in selected_methods:
                  target_hex = method.get('dispatch_target')
                  if not target_hex:
                      continue
                  target = int(target_hex, 16)
                  insns = list(md.disasm(raw[file_off(target):file_off(target)+0x480], target))
                  lines = []
                  direct_calls = []
                  rip_refs = []
                  for ins in insns:
                      lines.append(f'0x{ins.address:x}:\t{ins.mnemonic}\t{ins.op_str}')
                      for op in ins.operands:
                          if ins.mnemonic == 'call' and op.type == 2:  # X86_OP_IMM
                              direct_calls.append(f'0x{int(op.imm):x}')
                          if op.type == X86_OP_MEM and op.mem.base == X86_REG_RIP:
                              rip_refs.append(f'0x{ins.address + ins.size + op.mem.disp:x}')
                      if ins.mnemonic == 'ret' and len(lines) > 8:
                          break
                  disassembly.append({'method': method['name'], 'target': target_hex, 'text': '\n'.join(lines)})
                  target_analysis.append({'method': method['name'], 'target': target_hex, 'direct_calls': sorted(set(direct_calls)), 'rip_refs': sorted(set(rip_refs))})
              owner_results.append({
                  'class_name': entry['meta']['class_name'],
                  'static_metaobject': owner_hex,
                  'static_metacall': f"0x{entry['meta']['static_metacall']:x}",
                  'method_count': entry['meta']['method_count'],
                  'signal_count': entry['meta']['signal_count'],
                  'dispatch_selected': None if chosen is None else {'lea': f"0x{chosen['lea']:x}", 'table': f"0x{chosen['table']:x}"},
                  'dispatch_candidate_count': len(dispatch_candidates),
                  'target_methods': selected_methods,
                  'target_analysis': target_analysis,
                  'target_disassembly': disassembly,
              })

          (evidence / 'received-player-owner-analysis.json').write_text(json.dumps(owner_results, indent=2, sort_keys=True) + '\n')

          summary = {
              'schema': 'track-a-s2-player-received-owner-v1',
              'exact_client_sha': digest,
              'runtime_access': 'none',
              'client_executed': False,
              'global_metaobject_count': len(metaobjects),
              'target_match_count': len(matches),
              'target_owner_classes': sorted({match['class_name'] for match in matches}),
              'all_five_target_names_found': target_names == {match['name'] for match in matches},
              'raw_client_uploaded': False,
              'secret_access': False,
              'pr475_runtime_touched': False,
          }
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')

          print('PLAYER_S2_OWNER_MATCHES=' + json.dumps(matches, sort_keys=True))
          print('PLAYER_S2_OWNER_CLASSES=' + json.dumps(summary['target_owner_classes']))
          print('PLAYER_S2_OWNER_ALL_FIVE=' + str(summary['all_five_target_names_found']).lower())
          print('PLAYER_S2_OWNER_PR475_RUNTIME_TOUCHED=false')
          print('PLAYER_S2_OWNER_SECRET_ACCESS=false')
          PY

          rm -f "$r/client/client" "$r/client/client.lzma"
          test ! -e "$r/client/client"
          test ! -e "$r/client/client.lzma"
          echo 'PLAYER_S2_OWNER_RAW_CLIENT_REMOVED_BEFORE_UPLOAD=PASS'

      - name: Upload sanitized owner evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-s2-player-owner-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-s2-player-owner/evidence
          if-no-files-found: error
          retention-days: 7

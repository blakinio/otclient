name: Track A S3 player queue receiver static discriminator

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-s3-player-queue-receiver-static.yml
      - docs/agents/tasks/active/OTC-20260818-track-a-s3-player-queue-receiver-static.md
      - docs/agents/evidence/OTC-20260818-track-a-s3-player-queue-receiver-static/**
      - docs/agents/reports/OTCLIENT-20260818-track-a-s3-player-queue-receiver-static.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    name: Reuse prior exact-client Qt connection logs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Parse accepted exact-client connection logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/track-a-s3-prior-evidence"
          mkdir -p "$out/raw" "$out/evidence"

          for job in 95442653919 95443958584; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job}/logs" \
              -o "$out/raw/${job}.log"
            test -s "$out/raw/${job}.log"
          done

          python3 - "$out/raw" "$out/evidence" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, sys

          raw_dir = pathlib.Path(sys.argv[1])
          evidence = pathlib.Path(sys.argv[2])
          sources = {
              'phase4_hosted': raw_dir / '95442653919.log',
              'phase5_hosted': raw_dir / '95443958584.log',
          }

          inputs = []
          normalized = []
          for label, path in sources.items():
              data = path.read_bytes()
              inputs.append({'label': label, 'job': int(path.stem), 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
              text = data.decode('utf-8', 'replace')
              for line in text.splitlines():
                  line = re.sub(r'^\d{4}-\d\d-\d\dT[^ ]+Z\s+', '', line)
                  normalized.append((label, line))

          setup_re = re.compile(r'\b(7d5[0-9a-f]{3}):\s*(.*)$', re.I)
          setup = []
          for label, line in normalized:
              m = setup_re.search(line)
              if m:
                  setup.append({'source': label, 'address': '0x' + m.group(1).lower(), 'asm': m.group(2).strip(), 'line': line})

          seen = set(); dedup = []
          for row in setup:
              key = (row['address'], row['asm'])
              if key not in seen:
                  seen.add(key); dedup.append(row)
          setup = dedup

          blocks, current = [], []
          for row in setup:
              current.append(row)
              if re.search(r'\bcall\s+(?:0x)?4dd800\b', row['asm'], re.I):
                  blocks.append(current); current = []
          if current:
              blocks.append(current)

          member_re = re.compile(r'\[(?:rbx|rdi|rbp|r12|r13|r14|r15)\s*\+\s*(0x[0-9a-f]+)\]', re.I)
          imm_re = re.compile(r'\b(?:0x)?([0-9a-f]{6,8})\b', re.I)
          rows = []
          for idx, block in enumerate(blocks):
              text = '\n'.join(r['asm'] for r in block)
              offsets = sorted(set(x.lower() for x in member_re.findall(text)), key=lambda x: int(x,16))
              immediates = sorted(set('0x'+x.lower() for x in imm_re.findall(text)), key=lambda x: int(x,16))
              rows.append({
                  'block_index': idx,
                  'start': block[0]['address'],
                  'end': block[-1]['address'],
                  'ends_in_connect_candidate': bool(re.search(r'\bcall\s+(?:0x)?4dd800\b', block[-1]['asm'], re.I)),
                  'member_offsets': offsets,
                  'immediates': immediates,
                  'lines': [f"{r['address']}: {r['asm']}" for r in block],
              })

          exact_tokens = {
              'queue_metaobject': '3085b60',
              'player_handler_vptr': '308a008',
              'player_data_vptr': '308ca70',
              'player_current_stub': 'df8bc1',
              'player_basic_stub': 'df8d3b',
              'player_state_stub': 'df8e0d',
              'player_skills_stub': 'df8e37',
              'player_inventory_stub': 'df899f',
              'connect_candidate': '4dd800',
              'qslot_helper': '4df670',
          }
          hits = {k: [] for k in exact_tokens}
          for label, line in normalized:
              low = line.lower()
              for name, token in exact_tokens.items():
                  if token in low:
                      hits[name].append({'source': label, 'line': line})

          member_counts = {}
          for row in setup:
              for off in member_re.findall(row['asm']):
                  off = off.lower(); member_counts[off] = member_counts.get(off,0)+1

          summary = {
              'schema': 'track-a-s3-prior-exact-log-reuse-v2',
              'inputs': inputs,
              'prior_exact_sha': 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe',
              'runtime_access': 'none',
              'client_downloaded': False,
              'client_executed': False,
              'setup_instruction_count': len(setup),
              'connection_block_count': len(blocks),
              'member_offset_counts': dict(sorted(member_counts.items(), key=lambda kv:int(kv[0],16))),
              'exact_hit_counts': {k:len(v) for k,v in hits.items()},
              'player_signal_stubs_seen_in_prior_logs': any(hits[k] for k in hits if k.startswith('player_') and k.endswith('_stub')),
              'pr475_runtime_touched': False,
              'secret_access': False,
          }
          (evidence/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (evidence/'connection-blocks.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          (evidence/'exact-address-hits.json').write_text(json.dumps(hits,indent=2,sort_keys=True)+'\n')
          (evidence/'setup-disassembly.txt').write_text('\n'.join(f"{r['address']}: {r['asm']}" for r in setup)+'\n')
          print('PLAYER_S3_PRIOR_LOG_REUSE_V2=PASS')
          print('PLAYER_S3_SUMMARY='+json.dumps(summary,sort_keys=True))
          PY

          rm -rf "$out/raw"

      - name: Upload normalized prior-evidence analysis only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-s3-prior-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-s3-prior-evidence/evidence
          if-no-files-found: error
          retention-days: 7

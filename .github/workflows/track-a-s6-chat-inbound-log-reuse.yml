name: Track A S6 chat inbound log reuse

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-s6-chat-inbound-log-reuse.yml
      - docs/agents/tasks/active/OTC-20260818-track-a-s6-chat-inbound-static.md
      - docs/agents/evidence/OTC-20260818-track-a-s6-chat-inbound-static/**
      - docs/agents/reports/OTCLIENT-20260818-track-a-s6-chat-inbound-static.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    name: Recover exact chat QMeta from sanitized historical log
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download prior exact-SHA QMeta log and extract chat records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/track-a-s6"
          mkdir -p "$out/raw" "$out/evidence"
          job=94736106350
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job}/logs" \
            -o "$out/raw/${job}.log"
          test -s "$out/raw/${job}.log"

          python3 - "$out/raw/${job}.log" "$out/evidence" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, sys

          log_path=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          raw=log_path.read_bytes(); text=raw.decode('utf-8','replace')
          ansi=re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          targets={
            'queue':'tibia::protocol::TProtocolMessageQueue',
            'handler':'tibia::chat::TChatProtocolMessageHandler',
            'storage':'tibia::chat::TChatChannelStorage',
          }
          records={}
          for line in text.splitlines():
              line=ansi.sub('',line)
              pos=line.find('QMETA_JSON ')
              if pos<0: continue
              payload=line[pos+len('QMETA_JSON '):].strip()
              try: rec=json.loads(payload)
              except Exception: continue
              cls=rec.get('type_name')
              for key,target in targets.items():
                  if cls==target: records[key]=rec

          missing=[k for k in targets if k not in records]
          if missing: raise SystemExit('missing exact QMeta records: '+','.join(missing))

          wanted=[
            'receivedTalkMessage','receivedMessageMessage','receivedOpenChannelMessage',
            'receivedOpenOwnChannelMessage','receivedCloseChannelMessage','receivedChannelsMessage',
            'receivedPrivateChannelMessage','receivedChannelEventMessage','receivedNpcTalkPartersMessage',
          ]
          queue=records['queue']; methods=queue['methods']; sig_count=queue['signals_count']
          queue_hits=[]
          for m in methods:
              if m.get('name') in wanted:
                  queue_hits.append({**m,'is_signal_by_qmeta_prefix':m['index']<sig_count})

          handler=records['handler']; storage=records['storage']
          handler_message_methods=[m for m in handler['methods'] if m.get('name','').startswith('handle') and m.get('name','').endswith('Message')]
          result={
            'schema':'track-a-s6-prior-qmeta-log-reuse-v2',
            'source_run':31790507112,
            'source_job':94736106350,
            'source_head':'9afdc76ca6fe238742f270e22d8ecf4abe5ba9a2',
            'source_log_sha256':hashlib.sha256(raw).hexdigest(),
            'source_exact_client_sha256':'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe',
            'runtime_access':'none',
            'client_downloaded':False,
            'client_executed':False,
            'records':{
              'queue':{
                'type_name':queue['type_name'],
                'method_count':len(queue['methods']),
                'signal_count':queue['signals_count'],
                'relationships':queue['relationships'],
                'chat_receive_methods':queue_hits,
              },
              'handler':{
                'type_name':handler['type_name'],
                'method_count':len(handler['methods']),
                'signal_count':handler['signals_count'],
                'relationships':handler['relationships'],
                'message_methods':handler_message_methods,
                'methods':handler['methods'],
              },
              'storage':{
                'type_name':storage['type_name'],
                'method_count':len(storage['methods']),
                'signal_count':storage['signals_count'],
                'relationships':storage['relationships'],
                'methods':storage['methods'],
              },
            },
            'pr475_runtime_touched':False,
            'secret_access':False,
          }
          required=set(wanted); found={m['name'] for m in queue_hits}
          result['required_found']=sorted(required & found)
          result['required_missing']=sorted(required-found)
          result['handler_message_method_count']=len(handler_message_methods)
          if result['required_missing']:
              raise SystemExit('missing required chat receive methods: '+','.join(result['required_missing']))
          if len(handler_message_methods)!=9:
              raise SystemExit(f'unexpected handler message method count: {len(handler_message_methods)}')
          (out/'chat-qmeta.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          (out/'handler-methods.txt').write_text('\n'.join(f"{m['index']}\t{m['name']}\targc={m['argc']}\tflags=0x{m['flags']:x}\tsignal={str(m['index']<handler['signals_count']).lower()}" for m in handler['methods'])+'\n')
          (out/'storage-methods.txt').write_text('\n'.join(f"{m['index']}\t{m['name']}\targc={m['argc']}\tflags=0x{m['flags']:x}\tsignal={str(m['index']<storage['signals_count']).lower()}" for m in storage['methods'])+'\n')
          (out/'queue-chat-methods.txt').write_text('\n'.join(f"{m['index']}\t{m['name']}\targc={m['argc']}\tflags=0x{m['flags']:x}\tsignal={str(m['is_signal_by_qmeta_prefix']).lower()}" for m in sorted(queue_hits,key=lambda x:x['index']))+'\n')
          print('TRACK_A_S6_QMETA_LOG_REUSE=PASS')
          print('TRACK_A_S6_REQUIRED='+','.join(sorted(result['required_found'])))
          print('TRACK_A_S6_HANDLER_MESSAGE_METHOD_COUNT='+str(len(handler_message_methods)))
          print('TRACK_A_S6_HANDLER_METHOD_COUNT='+str(len(handler['methods'])))
          print('TRACK_A_S6_STORAGE_METHOD_COUNT='+str(len(storage['methods'])))
          print('TRACK_A_S6_PR475_RUNTIME_TOUCHED=false')
          PY

          rm -rf "$out/raw"

      - name: Add committed S1 chat type/name surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/track-a-s6/evidence"
          grep -nE 'received(Talk|Message|OpenChannel|OpenOwnChannel|CloseChannel|Channels|PrivateChannel|ChannelEvent|NpcTalkParters)Message' \
            docs/agents/evidence/OTC-20260818-track-a-s1-unfiltered-static-census/received-message-methods.txt \
            > "$out/s1-received-chat-lines.txt"
          grep -nE 'GameserverMessage(Talk|Message|OpenChannel|OpenOwnChannel|CloseChannel|Channels|PrivateChannel|ChannelEvent|NpcTalkParters)' \
            docs/agents/evidence/OTC-20260818-track-a-s1-unfiltered-static-census/protocol-server-to-client.txt \
            > "$out/s1-chat-message-lines.txt"
          grep -n 'tibia::chat::TChatProtocolMessageHandler' \
            docs/agents/evidence/OTC-20260818-track-a-s1-unfiltered-static-census/protocol-handler-code-xrefs.tsv \
            > "$out/s1-chat-handler-xref.txt"

      - name: Upload normalized S6 evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-s6-chat-inbound-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-s6/evidence
          if-no-files-found: error
          retention-days: 7

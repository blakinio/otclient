name: Track A S8 creature inbound log reuse

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-s8-creature-inbound-log-reuse.yml
      - docs/agents/tasks/active/OTC-20260818-track-a-s8-creature-inbound-static.md
      - docs/agents/evidence/OTC-20260818-track-a-s8-creature-inbound-static/**
      - docs/agents/reports/OTCLIENT-20260818-track-a-s8-creature-inbound-static.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    name: Recover creature QMeta from sanitized historical log
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download prior exact-SHA QMeta log and exhaust creature QMeta surface
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/track-a-s8"
          mkdir -p "$out/raw" "$out/evidence"
          job=94736106350
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job}/logs" \
            -o "$out/raw/${job}.log"
          test -s "$out/raw/${job}.log"

          python3 - "$out/raw/${job}.log" "$out/evidence" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, sys

          log_path=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          raw=log_path.read_bytes(); text=raw.decode('utf-8','replace')
          ansi=re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          records=[]
          for line in text.splitlines():
              line=ansi.sub('',line)
              pos=line.find('QMETA_JSON ')
              if pos<0: continue
              try: records.append(json.loads(line[pos+len('QMETA_JSON '):].strip()))
              except Exception: continue
          by_type={r.get('type_name'):r for r in records if r.get('type_name')}

          queue=by_type['tibia::protocol::TProtocolMessageQueue']
          handler=by_type['tibia::creatures::TCreatureProtocolMessageHandler']
          creature=by_type['tibia::creatures::TCreature']
          storage=by_type['tibia::creatures::TCreatureStorage']
          action=by_type['tibia::creatures::TCreaturesGameActionHandler']
          battle=by_type['tibia::creatures::TBattleListRenderProvider']

          def is_creature_receive(name: str) -> bool:
              return (
                  name.startswith('receivedCreature') and name.endswith('Message')
              ) or name in {
                  'receivedMoveCreatureMessage',
                  'receivedConfigureCreaturePodiumMessage',
              }

          queue_hits=[]
          for m in queue['methods']:
              if is_creature_receive(m.get('name','')):
                  queue_hits.append({**m,'is_signal_by_qmeta_prefix':m['index']<queue['signals_count']})
          queue_hits.sort(key=lambda m:m['index'])
          if not queue_hits:
              raise SystemExit('no creature receive signals recovered')
          if not all(m['is_signal_by_qmeta_prefix'] for m in queue_hits):
              raise SystemExit('creature receive found outside queue signal prefix')

          expected_handles={m['name'].replace('received','handle',1) for m in queue_hits}
          qmeta_handle_hits=[]
          for r in records:
              matches=[]
              for m in r.get('methods',[]):
                  if m.get('name') in expected_handles:
                      matches.append({**m,'is_signal_by_qmeta_prefix':m['index']<r.get('signals_count',0)})
              if matches:
                  qmeta_handle_hits.append({
                      'type_name':r['type_name'],
                      'relationships':r.get('relationships',{}),
                      'method_count':len(r.get('methods',[])),
                      'signal_count':r.get('signals_count',0),
                      'matches':matches,
                  })

          result={
              'schema':'track-a-s8-creature-inbound-log-reuse-v1',
              'source_run':31790507112,
              'source_job':94736106350,
              'source_head':'9afdc76ca6fe238742f270e22d8ecf4abe5ba9a2',
              'source_log_sha256':hashlib.sha256(raw).hexdigest(),
              'source_exact_client_sha256':'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe',
              'runtime_access':'none',
              'client_downloaded':False,
              'client_executed':False,
              'queue':{
                  'type_name':queue['type_name'],
                  'method_count':len(queue['methods']),
                  'signal_count':queue['signals_count'],
                  'relationships':queue['relationships'],
                  'creature_receive_methods':queue_hits,
              },
              'expected_suffix_handle_names':sorted(expected_handles),
              'qmeta_suffix_handle_hits':qmeta_handle_hits,
              'creature_protocol_handler':{
                  'type_name':handler['type_name'],
                  'method_count':len(handler['methods']),
                  'signal_count':handler['signals_count'],
                  'relationships':handler['relationships'],
                  'methods':handler['methods'],
              },
              'creature':{
                  'type_name':creature['type_name'],
                  'method_count':len(creature['methods']),
                  'signal_count':creature['signals_count'],
                  'relationships':creature['relationships'],
                  'methods':creature['methods'],
              },
              'creature_storage':{
                  'type_name':storage['type_name'],
                  'method_count':len(storage['methods']),
                  'signal_count':storage['signals_count'],
                  'relationships':storage['relationships'],
                  'methods':storage['methods'],
              },
              'creatures_game_action_handler':{
                  'type_name':action['type_name'],
                  'method_count':len(action['methods']),
                  'signal_count':action['signals_count'],
                  'relationships':action['relationships'],
                  'methods':action['methods'],
              },
              'battle_list_render_provider':{
                  'type_name':battle['type_name'],
                  'method_count':len(battle['methods']),
                  'signal_count':battle['signals_count'],
                  'relationships':battle['relationships'],
                  'methods':battle['methods'],
              },
              'pr528_runtime_touched':False,
              'pr475_runtime_touched':False,
              'secret_access':False,
          }
          (out/'creature-qmeta.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          (out/'queue-creature-methods.txt').write_text('\n'.join(f"{m['index']}\t{m['name']}\targc={m['argc']}\tflags=0x{m['flags']:x}\tsignal=true" for m in queue_hits)+'\n')
          (out/'qmeta-suffix-handle-hits.txt').write_text('\n'.join(f"{owner['type_name']}\t{m['index']}\t{m['name']}" for owner in qmeta_handle_hits for m in owner['matches']) + ('\n' if qmeta_handle_hits else ''))
          for name,rec in [('handler',handler),('creature',creature),('storage',storage),('action',action),('battle',battle)]:
              (out/f'{name}-methods.txt').write_text('\n'.join(f"{m['index']}\t{m['name']}\targc={m['argc']}\tflags=0x{m['flags']:x}\tsignal={str(m['index']<rec['signals_count']).lower()}" for m in rec['methods'])+'\n')
          print('TRACK_A_S8_QMETA_LOG_REUSE=PASS')
          print('TRACK_A_S8_QUEUE_CREATURE_COUNT='+str(len(queue_hits)))
          print('TRACK_A_S8_QUEUE_CREATURE='+','.join(f"{m['index']}:{m['name']}" for m in queue_hits))
          print('TRACK_A_S8_SUFFIX_HANDLE_QMETA_HIT_COUNT='+str(sum(len(o['matches']) for o in qmeta_handle_hits)))
          print('TRACK_A_S8_HANDLER_METHODS='+str(len(handler['methods'])))
          print('TRACK_A_S8_CREATURE_METHODS='+str(len(creature['methods'])))
          print('TRACK_A_S8_STORAGE_METHODS='+str(len(storage['methods'])))
          print('TRACK_A_S8_PR528_RUNTIME_TOUCHED=false')
          print('TRACK_A_S8_PR475_RUNTIME_TOUCHED=false')
          PY
          rm -rf "$out/raw"

      - name: Add committed S1 creature type/name surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/track-a-s8/evidence"
          grep -nE 'received(Creature|MoveCreature|ConfigureCreaturePodium)' \
            docs/agents/evidence/OTC-20260818-track-a-s1-unfiltered-static-census/received-message-methods.txt \
            > "$out/s1-received-creature-lines.txt"
          grep -nE 'GameserverMessage(Creature|MoveCreature|ConfigureCreaturePodium)' \
            docs/agents/evidence/OTC-20260818-track-a-s1-unfiltered-static-census/protocol-server-to-client.txt \
            > "$out/s1-creature-message-lines.txt"
          grep -n 'tibia::creatures::TCreatureProtocolMessageHandler' \
            docs/agents/evidence/OTC-20260818-track-a-s1-unfiltered-static-census/protocol-handler-code-xrefs.tsv \
            > "$out/s1-creature-handler-xref.txt"

      - name: Upload normalized S8 evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-a-s8-creature-inbound-${{ github.run_id }}
          path: ${{ runner.temp }}/track-a-s8/evidence
          if-no-files-found: error
          retention-days: 7

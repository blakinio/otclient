name: Track A same-boot zero-client recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/tibia-official-client-re-same-boot-zero-client-invalidate.py
      - .github/scripts/track_a_native_login_be4f48_proven.py
      - .github/scripts/test_track_a_agent_runtime_governance.py
      - .github/workflows/track-a-same-boot-zero-client-recovery.yml
      - docs/agents/contracts/TRACK_A_SAME_BOOT_ZERO_CLIENT_INVALIDATION_V1.md
      - docs/agents/tasks/active/OTC-20260907-proven-login-replacement-recovery.md
      - docs/agents/tasks/active/OTC-20260907-same-boot-zero-client-invalidation-live.md
      - docs/agents/tasks/active/OTC-20260907-same-boot-zero-client-bootstrap-live.md
      - tests/tools/tibia_runtime_bridge/test_native_login_proven_secret_ingress_contract.py
      - tests/tools/tibia_runtime_bridge/test_same_boot_zero_client_recovery_contract.py
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: track-a-same-boot-zero-client-recovery-${{ github.event_name }}
  cancel-in-progress: false

env:
  CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
  RECOVERY_TASK: OTC-20260907-same-boot-zero-client-invalidation-live
  BOOTSTRAP_TASK: OTC-20260907-same-boot-zero-client-bootstrap-live
  EXPECTED_VERSION: 15.32.be4f48
  EXPECTED_SIZE: '52105824'
  EXPECTED_SHA: 552dcf794c41dae8c3dca10b740cd23e2f2ebcaf82d86576e8a67d924409e4e1

jobs:
  contract:
    if: github.event_name == 'pull_request'
    name: Same-boot zero-client recovery contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run deterministic recovery contract
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 tests/tools/tibia_runtime_bridge/test_same_boot_zero_client_recovery_contract.py
          python3 tests/tools/tibia_runtime_bridge/test_native_login_proven_secret_ingress_contract.py
          python3 .github/scripts/test_tibia_official_client_re_kasm_bootstrap_worker.py -q
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py -q
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$BASE_SHA" --expected-branch "$HEAD_BRANCH"
          python3 .github/scripts/audit_track_a_selfhosted_pr_boundary.py --base "$BASE_SHA"
          python3 -m py_compile \
            .github/scripts/tibia-official-client-re-same-boot-zero-client-invalidate.py \
            .github/scripts/track_a_native_login_be4f48_proven.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/track-a-same-boot-zero-client-recovery.yml'); puts 'YAML_PARSE=PASS'"
          git diff --check "$BASE_SHA"...HEAD
          echo TRACK_A_SAME_BOOT_ZERO_CLIENT_RECOVERY_CONTRACT=PASS

  live-recovery:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/track-a-same-boot-zero-client-recovery EXECUTE'
    name: Trusted-main same-boot invalidation and Kasm restore
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 2

      - name: Prove trusted main and durable admissions
        id: trust
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          test "$RUNNER_NAME" = 'synology-otclient-01'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          trusted_main="$(git rev-parse HEAD)"
          live_main="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          test "$trusted_main" = "$live_main"
          python3 tests/tools/tibia_runtime_bridge/test_same_boot_zero_client_recovery_contract.py
          python3 .github/scripts/test_tibia_official_client_re_kasm_bootstrap_worker.py -q
          python3 .github/scripts/test_tibia_official_client_re_canonical_live_transition.py -q
          python3 .github/scripts/test_track_a_agent_runtime_governance.py
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import sys

          root = pathlib.Path('.')
          path = root / '.github/scripts/test_track_a_agent_runtime_governance.py'
          spec = importlib.util.spec_from_file_location('same_boot_live_governance', path)
          assert spec and spec.loader
          governance = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = governance
          spec.loader.exec_module(governance)

          def check(relative, expected):
              task = root / relative
              assert governance.validate_track_a_task(task)
              values = governance.parse_frontmatter(task)
              for key, value in expected.items():
                  if values.get(key) != value:
                      raise SystemExit(f'LIVE_ADMISSION_REFUSED:{relative}:{key}={values.get(key)!r}')
              return values

          recovery = check(
              'docs/agents/tasks/active/OTC-20260907-same-boot-zero-client-invalidation-live.md',
              {
                  'runtime_access': 'canonical_recovery',
                  'runtime_owner_task': 'OTC-20260907-same-boot-zero-client-invalidation-live',
                  'runtime_namespace': 'canonical-live-runtime',
                  'canonical_registration': 'PRESENT',
                  'canonical_lease_generation': 'UNKNOWN',
                  'registration_lease_generation': '55',
                  'gate_a': 'REQUIRED_NOT_PROVEN',
                  'generation_rebind': 'NOT_APPLICABLE',
                  'gate_b': 'NOT_APPLICABLE',
                  'bootstrap': 'NOT_APPLICABLE',
                  'target_uniqueness': 'UNKNOWN',
                  'mutation_authorized': 'false',
                  'recovery_mode': 'same_boot_zero_client_invalidation_v1',
                  'same_boot_zero_client_contract': 'TRACK_A_SAME_BOOT_ZERO_CLIENT_INVALIDATION_V1',
                  'credentials_allowed': 'false',
                  'login_allowed': 'false',
                  'process_control_authorized': 'false',
                  'physical_action_budget': '0',
              },
          )
          bootstrap = check(
              'docs/agents/tasks/active/OTC-20260907-same-boot-zero-client-bootstrap-live.md',
              {
                  'runtime_access': 'canonical_bootstrap',
                  'runtime_owner_task': 'OTC-20260907-same-boot-zero-client-bootstrap-live',
                  'runtime_namespace': 'canonical-live-runtime',
                  'canonical_registration': 'ABSENT',
                  'canonical_lease_generation': 'UNKNOWN',
                  'registration_lease_generation': 'NOT_APPLICABLE',
                  'gate_a': 'REQUIRED_NOT_PROVEN',
                  'generation_rebind': 'NOT_APPLICABLE',
                  'gate_b': 'NOT_APPLICABLE',
                  'bootstrap': 'PASS',
                  'target_uniqueness': 'UNKNOWN',
                  'mutation_authorized': 'true',
                  'bootstrap_mode': 'create_new',
                  'bootstrap_attempt_limit': '1',
                  'credentials_allowed': 'false',
                  'login_allowed': 'false',
                  'gameplay_allowed': 'false',
                  'process_control_authorized': 'true',
                  'physical_action_budget': '1',
                  'physical_action_count': '0',
              },
          )
          for values in (recovery, bootstrap):
              source = values.get('live_runtime_authorization_source', '').strip()
              if not source or source.upper() in {'NONE', 'UNKNOWN', 'NOT_APPLICABLE'}:
                  raise SystemExit('LIVE_ADMISSION_REFUSED:authorization_source')
          print('TRACK_A_SAME_BOOT_RECOVERY_ADMISSIONS=PASS')
          PY
          echo "trusted_main=$trusted_main" >> "$GITHUB_OUTPUT"
          echo NO_CREDENTIAL_ACCESS=true

      - name: Consume one-shot recovery and restore authorization
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" = "$TRUSTED_MAIN"
          root="/home/runner/_work/_otclient_tibia_re_state/tasks/$BOOTSTRAP_TASK/runtime"
          mkdir -p "$root"
          chmod 700 "/home/runner/_work/_otclient_tibia_re_state/tasks/$BOOTSTRAP_TASK" "$root" 2>/dev/null || true
          marker="$root/same-boot-zero-client-recovery-attempt-consumed.json"
          python3 - "$marker" "$TRUSTED_MAIN" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json, os, pathlib, sys
          path=pathlib.Path(sys.argv[1])
          payload={'schema_version':1,'trusted_main':sys.argv[2],'run_id':sys.argv[3],'run_attempt':int(sys.argv[4])}
          try:
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          except FileExistsError as exc:
              raise SystemExit('RECOVERY_ATTEMPT_ALREADY_CONSUMED') from exc
          with os.fdopen(fd,'w',encoding='utf-8') as handle:
              json.dump(payload,handle,sort_keys=True,separators=(',',':'))
              handle.write('\n'); handle.flush(); os.fsync(handle.fileno())
          PY
          echo BOOTSTRAP_ONE_SHOT_AUTHORIZATION_CONSUMED=PASS
          echo NO_CREDENTIAL_ACCESS=true

      - name: Invalidate only same-boot zero-client stale registration
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" = "$TRUSTED_MAIN"
          task="$RECOVERY_TASK"
          session="same-boot-recovery-${GITHUB_RUN_ID}"
          token_root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"
          token="$token_root/canonical-lease-token"
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          invalidator=.github/scripts/tibia-official-client-re-same-boot-zero-client-invalidate.py
          worker=.github/scripts/tibia-official-client-re-kasm-bootstrap-worker.py
          mkdir -p "$token_root"
          chmod 700 "/home/runner/_work/_otclient_tibia_re_state/tasks/$task" "$token_root" 2>/dev/null || true
          rm -f "$token"
          active=false
          cleanup() {
            rc=$?
            if [[ "$active" == true && -f "$token" ]]; then
              bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true
            fi
            rm -f "$token"
            exit "$rc"
          }
          trap cleanup EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$session" --token-file "$token" --ttl-seconds 600 \
            --stale-takeover-reason 'owner-approved same-boot zero-client invalidation after failed exact-current replacement'
          active=true
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          TRACK_A_SAME_BOOT_INVALIDATION_GUARDED=1 \
            bash "$lease" guard-run --task-id "$task" --session-id "$session" --token-file "$token" -- \
              python3 "$invalidator" --task-id "$task" --session-id "$session" --worker "$worker" \
                --result "$RUNNER_TEMP/same-boot-invalidation.json"
          bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token"
          active=false
          rm -f "$token"
          test ! -e "$CANONICAL_STATE/runtime-registration.json"
          echo TRACK_A_SAME_BOOT_ZERO_CLIENT_REGISTRATION_ABSENT=PASS
          echo NO_CREDENTIAL_ACCESS=true
          trap - EXIT

      - name: Create exactly one plain current Kasm canonical client
        shell: bash
        env:
          TRUSTED_MAIN: ${{ steps.trust.outputs.trusted_main }}
        run: |
          set +x
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" = "$TRUSTED_MAIN"
          test ! -e "$CANONICAL_STATE/runtime-registration.json"
          task="$BOOTSTRAP_TASK"
          session="same-boot-bootstrap-${GITHUB_RUN_ID}"
          token_root="/home/runner/_work/_otclient_tibia_re_state/tasks/$task/runtime"
          token="$token_root/canonical-lease-token"
          lease=.github/scripts/tibia-official-client-re-canonical-live-lease
          transition=.github/scripts/tibia-official-client-re-canonical-live-transition.py
          worker=.github/scripts/tibia-official-client-re-kasm-bootstrap-worker.py
          probe=.github/scripts/tibia-official-client-re-kasm-existing-runtime-probe.py
          mkdir -p "$token_root"
          chmod 700 "/home/runner/_work/_otclient_tibia_re_state/tasks/$task" "$token_root" 2>/dev/null || true
          rm -f "$token"
          active=false
          cleanup() {
            rc=$?
            if [[ "$active" == true && -f "$token" ]]; then
              bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token" >/dev/null 2>&1 || true
            fi
            rm -f "$token"
            exit "$rc"
          }
          trap cleanup EXIT
          bash "$lease" acquire --task-id "$task" --session-id "$session" --token-file "$token" --ttl-seconds 600 \
            --stale-takeover-reason 'owner-approved plain Kasm restore after same-boot zero-client invalidation'
          active=true
          bash "$lease" validate --task-id "$task" --session-id "$session" --token-file "$token"
          python3 "$transition" kasm-bootstrap \
            --task-id "$task" --session-id "$session" --token-file "$token" \
            --worker "$worker" --probe "$probe" --worker-timeout 120
          bash "$lease" release --task-id "$task" --session-id "$session" --token-file "$token"
          active=false
          rm -f "$token"
          echo TRACK_A_SAME_BOOT_ZERO_CLIENT_KASM_RESTORE=PASS
          echo NO_CREDENTIAL_ACCESS=true
          trap - EXIT

      - name: Verify restored canonical exact-current registration
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - "$CANONICAL_STATE/runtime-registration.json" <<'PY'
          import json, pathlib, sys
          path=pathlib.Path(sys.argv[1])
          data=json.loads(path.read_text(encoding='utf-8'))
          assert data['client_version']=='15.32.be4f48'
          assert data['client_size']==52105824
          assert data['client_sha256']=='552dcf794c41dae8c3dca10b740cd23e2f2ebcaf82d86576e8a67d924409e4e1'
          assert data['state']=='UNKNOWN'
          assert data['proof_kind']=='existing_runtime_adoption_v1'
          assert data['candidate_count']==1
          assert data['source_task']=='OTC-20260907-same-boot-zero-client-bootstrap-live'
          print('TRACK_A_SAME_BOOT_ZERO_CLIENT_CANONICAL_RESTORE=PASS')
          print('NO_CREDENTIAL_ACCESS=true')
          PY

      - name: Upload sanitized recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: same-boot-zero-client-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/same-boot-invalidation.json
          if-no-files-found: warn
          retention-days: 3

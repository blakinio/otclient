name: Track A secret vault bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-secret-vault-bootstrap
  cancel-in-progress: false

jobs:
  seed:
    runs-on: [otclient, synology]
    timeout-minutes: 10
    env:
      VAULT_DIR: /work/_otclient_tibia_re_state/secret-vault
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "synology-otclient-01"
          test -d /work
          command -v openssl >/dev/null
          command -v python3 >/dev/null
          echo "TRACK_A_SECRET_VAULT_RUNNER=PASS"

      - name: Checkout exact workflow revision
        uses: actions/checkout@v4

      - name: Seal repository secrets into machine-local vault
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          ulimit -c 0
          umask 077
          python3 tools/tibia_runtime_bridge/secret_vault.py seed --vault-dir "$VAULT_DIR"
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD

      - name: Verify encrypted vault without exposing plaintext
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 tools/tibia_runtime_bridge/secret_vault.py verify --vault-dir "$VAULT_DIR"
          test "$(stat -c '%a' "$VAULT_DIR")" = "700"
          test "$(stat -c '%a' "$VAULT_DIR/tibia-test-credentials.key")" = "600"
          test "$(stat -c '%a' "$VAULT_DIR/tibia-test-credentials.cms")" = "600"
          echo "TRACK_A_SECRET_VAULT_PERSISTENCE=PASS"

name: Track A self-hosted PR boundary

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/test_track_a_selfhosted_pr_boundary.py'
      - '.github/scripts/audit_track_a_selfhosted_pr_boundary.py'
      - '.github/scripts/test_track_a_selfhosted_pr_review_regressions.py'

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Reject PR-controlled self-hosted jobs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/test_track_a_selfhosted_pr_boundary.py
          python3 .github/scripts/test_track_a_selfhosted_pr_review_regressions.py
          git diff --check HEAD^1 HEAD


  fresh-audit:
    name: Fresh independent self-hosted boundary audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact PR head with base history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Falsify security-boundary completion
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$BASE_SHA"
          python3 .github/scripts/audit_track_a_selfhosted_pr_boundary.py --base "$BASE_SHA"
          python3 -m py_compile .github/scripts/audit_track_a_selfhosted_pr_boundary.py
          git diff --check "$BASE_SHA"...HEAD

name: Track A Surveyor action-protocol physical acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: track-a-surveyor-action-protocol-physical-acceptance
  cancel-in-progress: false

env:
  IMPLEMENTATION_SHA: f80dd43f741c39ce5ee4296396cb07891d04c324
  EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
  EXPECTED_SIZE: '52109920'
  CONTAINER: otclient-track-a-kasmvnc
  CONTROL_CONTAINER: otclient-synology-runner
  DISPLAY_NAME: ':1'
  CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
  RUNTIME_TASK_ID: OTC-20260821-surveyor-action-protocol-reader
  TRIGGER_BRANCH: test/OTC-20260821-surveyor-action-protocol-physical-trigger

jobs:
  authority:
    if: >-
      github.actor == 'blakinio' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/OTC-20260821-surveyor-action-protocol-physical-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      trusted_main_sha: ${{ steps.authority.outputs.trusted_main_sha }}
    steps:
      - name: Validate exact owner-controlled trigger
        id: authority
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'blakinio/otclient'
          test "$HEAD_REF" = "$TRIGGER_BRANCH"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "trusted_main_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo AUTHORIZATION_GATE=PASS
          echo PR_HEAD_CODE_EXECUTED=false
          echo RUNTIME_MUTATION=false

  acceptance:
    needs: authority
    if: needs.authority.result == 'success'
    runs-on: [otclient, synology]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TRUSTED_MAIN_SHA: ${{ needs.authority.outputs.trusted_main_sha }}
    steps:
      - name: Declare immutable read-only authority
        shell: bash
        run: |
          set -Eeuo pipefail
          echo AUTHORIZATION_GATE=PASS
          echo RUNTIME_TASK_ID="$RUNTIME_TASK_ID"
          echo CREDENTIAL_ACCESS=false
          echo GUI_INPUT=false
          echo PROCESS_CONTROL=false
          echo PROCESS_MEMORY_WRITE=false
          echo NETWORK_MUTATION=false
          echo RUNTIME_MUTATION=false
          echo PR_HEAD_CODE_EXECUTED=false

      - name: Checkout exact trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TRUSTED_MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove trusted checkout and implementation ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_MAIN_SHA"
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" "$TRUSTED_MAIN_SHA"
          echo TRUSTED_CHECKOUT=PASS
          echo IMPLEMENTATION_ANCESTRY=PASS

      - name: Prove safe canonical control state and exact target
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$CANONICAL_STATE" "$RUNNER_TEMP/control.json" <<'PY'
          import json, pathlib, sys, time
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          def load(name):
              p=root/name
              if not p.is_file(): return None
              value=json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(value,dict): raise SystemExit(name+'_NOT_OBJECT')
              return value
          lease=load('lease.json'); reg=load('runtime-registration.json'); now=int(time.time())
          fresh=bool(lease and lease.get('status')=='active' and isinstance(lease.get('expires_at'),(int,float)) and int(lease['expires_at'])>now)
          if fresh: raise SystemExit('ACTIVE_RUNTIME_OWNER_PRESENT='+str(lease.get('controller_task')))
          safe={
              'lease':{k:lease.get(k) for k in ('runtime_id','status','generation','controller_task','expires_at')} if lease else None,
              'lease_fresh_active':fresh,
              'registration':{k:reg.get(k) for k in ('runtime_id','registration_generation','lease_generation','pid','process_start_ticks','client_version','client_size','client_sha256','display','state','source_task')} if reg else None,
          }
          out.write_text(json.dumps(safe,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('CONTROL_PLANE_READ=PASS')
          PY

          docker inspect -f '{{.State.Running}}' "$CONTAINER" | grep -Fx true >/dev/null
          set +e
          pid_output="$(docker exec "$CONTAINER" pgrep -x client 2>/dev/null)"
          pid_rc=$?
          set -e
          case "$pid_rc" in
            0) ;;
            1) pid_output='' ;;
            *) echo TARGET_CLIENT_CENSUS=FAIL >&2; exit 2 ;;
          esac
          pids=()
          while IFS= read -r pid_value; do
            [[ "$pid_value" =~ ^[0-9]+$ ]] && pids+=("$pid_value")
          done <<< "$pid_output"
          echo TARGET_NAMESPACE_CLIENTS="${#pids[@]}"
          test "${#pids[@]}" -eq 1
          pid="${pids[0]}"
          size="$(docker exec "$CONTAINER" stat -Lc %s "/proc/$pid/exe")"
          test "$size" = "$EXPECTED_SIZE"
          sha="$(docker exec "$CONTAINER" sha256sum "/proc/$pid/exe" | awk '{print $1}')"
          test "$sha" = "$EXPECTED_SHA"
          exe="$(docker exec "$CONTAINER" readlink -f "/proc/$pid/exe")"
          test -n "$exe"
          start="$(docker exec -i "$CONTAINER" python3 - "$pid" <<'PY'
          import pathlib,sys
          raw=pathlib.Path('/proc/'+sys.argv[1]+'/stat').read_text(encoding='ascii')
          print(raw[raw.rfind(')')+2:].split()[19])
          PY
          )"
          [[ "$start" =~ ^[0-9]+$ ]]
          docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdpyinfo >/dev/null
          matches=0
          while IFS= read -r xid; do
            [[ "$xid" =~ ^[0-9]+$ ]] || continue
            window_owner="$(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xprop -id "$xid" _NET_WM_PID 2>/dev/null | sed -nE 's/.*= *([0-9]+).*/\1/p')"
            [[ "$window_owner" == "$pid" ]] && matches=$((matches+1))
          done < <(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdotool search --onlyvisible --name '^Tibia' 2>/dev/null || true)
          echo TARGET_WINDOW_MATCHES="$matches"
          test "$matches" -eq 1

          python3 - "$RUNNER_TEMP/control.json" "$pid" "$start" "$EXPECTED_SIZE" "$EXPECTED_SHA" "$DISPLAY_NAME" <<'PY'
          import json,pathlib,sys
          doc=json.loads(pathlib.Path(sys.argv[1]).read_text()); reg=doc.get('registration')
          if reg:
              expected={'pid':int(sys.argv[2]),'process_start_ticks':int(sys.argv[3]),'client_size':int(sys.argv[4]),'client_sha256':sys.argv[5],'display':sys.argv[6]}
              bad=[k for k,v in expected.items() if reg.get(k)!=v]
              if bad: raise SystemExit('CANONICAL_REGISTRATION_IDENTITY_MISMATCH='+','.join(bad))
          print('TARGET_UNIQUENESS=PROVEN')
          print('CANONICAL_REGISTRATION='+('PRESENT_MATCHING' if reg else 'ABSENT'))
          PY
          {
            echo "pid=$pid"
            echo "start=$start"
            echo "exe=$exe"
          } >> "$GITHUB_OUTPUT"
          echo TARGET_PID="$pid"
          echo TARGET_START_TICKS="$start"
          echo TARGET_EXECUTABLE="$exe"
          echo PROCESS_ENVIRONMENT_READ=false
          echo WINDOW_TITLE_VALUE_RETAINED=false

      - name: Run passive collect-all and assert action-protocol reader
        shell: bash
        env:
          TARGET_PID: ${{ steps.target.outputs.pid }}
          TARGET_START: ${{ steps.target.outputs.start }}
          TARGET_EXE: ${{ steps.target.outputs.exe }}
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/tibia-re-surveyor-action-protocol-postmerge"
          PYTHONPATH=. python3 -m tools.tibia_re_surveyor \
            --collect-all \
            --runtime-docker \
            --runtime-container "$CONTAINER" \
            --control-container "$CONTROL_CONTAINER" \
            --display "$DISPLAY_NAME" \
            --output-dir "$out"
          python3 - "$out" "$RUNNER_TEMP/control.json" "$TARGET_PID" "$TARGET_START" "$TARGET_EXE" "$IMPLEMENTATION_SHA" "$TRUSTED_MAIN_SHA" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); control=json.loads(pathlib.Path(sys.argv[2]).read_text())
          pid=int(sys.argv[3]); start=int(sys.argv[4]); exe=sys.argv[5]; implementation_sha=sys.argv[6]; acceptance_sha=sys.argv[7]
          privacy=json.loads((root/'privacy-scan.json').read_text())
          missing=json.loads((root/'missing-readers.json').read_text())
          action=json.loads((root/'telemetry'/'action-protocol.json').read_text())
          coverage=json.loads((root/'surveyor'/'coverage.json').read_text())
          typed=action['source_states']['subsystem_typed_reader']['value']
          runtime=action['source_states']['runtime_identity']
          aliases=list((root/'aliases').glob('*.json'))
          assert privacy['result']=='PASS',privacy
          assert len(coverage['rows'])==169,len(coverage['rows'])
          assert len(aliases)==12,len(aliases)
          assert len(missing['reader_gaps'])==8,missing
          assert 'TIBIA-RE-ACTION-PROTOCOL' not in {x['alias'] for x in missing['reader_gaps']}
          assert action['source_states']['subsystem_typed_reader']['state']=='AVAILABLE',action
          assert typed['reader_id']=='action_protocol_typed_reader'
          assert typed['type_name']=='tibia::game::TPlayerProtocolMessageHandler'
          assert typed['object_count']==1
          assert typed['typed_object_identity']=='PROVEN'
          assert typed['process_memory_access']=='read_only'
          assert typed['semantic_state']=='TYPED_ACTION_PROTOCOL_OBJECT_IDENTITY_ONLY'
          assert typed['protocol_message_handler_present'] is True
          assert typed['action_to_protocol_connection_claimed'] is False
          assert typed['serialized_message_semantics_claimed'] is False
          assert typed['protocol_opcodes_claimed'] is False
          assert typed['packet_payloads_retained'] is False
          assert typed['in_game_claimed'] is False
          assert typed['semantic_promotion_allowed'] is False
          assert runtime['state']=='AVAILABLE',runtime
          reg=control.get('registration'); lease=control.get('lease')
          result={
              'schema':'otclient.surveyor-action-protocol-postmerge-e2e.v1','result':'PASS',
              'implementation_merge_sha':implementation_sha,'acceptance_trusted_main_sha':acceptance_sha,
              'pid':pid,'process_start_ticks':start,'executable_path':exe,'client_size':52109920,
              'client_sha256':'ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8',
              'display':':1','target_uniqueness':'PROVEN','visible_matching_windows':1,
              'canonical_registration_present':bool(reg),'canonical_registration_generation':reg.get('registration_generation') if reg else None,
              'registration_lease_generation':reg.get('lease_generation') if reg else None,'canonical_registration_state':reg.get('state') if reg else None,
              'canonical_lease_status':lease.get('status') if lease else None,'canonical_lease_generation':lease.get('generation') if lease else None,
              'reader_before':'NO_TYPED_READER_IMPLEMENTED','reader_after':'AVAILABLE','canonical_rows':169,'aliases':12,
              'missing_readers_before':9,'missing_readers_after':8,'privacy_before':'PASS','privacy_after':'PASS',
              'semantic_state':typed['semantic_state'],'typed_object_identity':typed['typed_object_identity'],
              'object_count':typed['object_count'],'type_name':typed['type_name'],'layout_evidence':typed['layout_evidence'],
              'action_to_protocol_connection_claimed':False,'serialized_message_semantics_claimed':False,
              'protocol_opcodes_claimed':False,'packet_payloads_retained':False,'in_game_claimed':False,
              'process_memory_access':'read_only','runtime_mutation':False,
          }
          (root/'acceptance.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('POSTMERGE_ACTION_PROTOCOL_E2E=PASS')
          print('CANONICAL_ROWS=169')
          print('ALIASES=12')
          print('ACTION_PROTOCOL_TYPED_READER=AVAILABLE')
          print('MISSING_TYPED_READERS=8')
          print('PRIVACY_SCAN=PASS')
          print('ACTION_TYPED_OBJECT_IDENTITY=PROVEN')
          print('ACTION_TYPED_OBJECT_COUNT=1')
          print('ACTION_VPTR_OFFSET='+typed['layout_evidence']['vptr_offset'])
          print('ACTION_TYPEINFO_OFFSET='+typed['layout_evidence']['typeinfo_offset'])
          print('IN_GAME_CLAIMED=false')
          print('RUNTIME_MUTATION=false')
          PY

      - name: Upload sanitized acceptance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track-a-surveyor-action-protocol-postmerge-${{ github.run_id }}
          path: ${{ runner.temp }}/tibia-re-surveyor-action-protocol-postmerge/
          if-no-files-found: error
          retention-days: 3

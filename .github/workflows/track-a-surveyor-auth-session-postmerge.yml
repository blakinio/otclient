name: Track A Surveyor auth-session post-merge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/track-a-surveyor-auth-session-postmerge.yml"

permissions:
  contents: read

concurrency:
  group: track-a-surveyor-auth-session-postmerge
  cancel-in-progress: false

env:
  IMPLEMENTATION_SHA: 16f83cf70548cbbe1eb6cb3838d27fbe6e0430e3
  EXPECTED_SHA: ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8
  EXPECTED_SIZE: '52109920'
  CONTAINER: otclient-track-a-kasmvnc
  CONTROL_CONTAINER: otclient-synology-runner
  DISPLAY_NAME: ':1'
  CANONICAL_STATE: /home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
  RUNTIME_TASK_ID: OTC-20260820-surveyor-auth-session-reader
  REPORT_PR: '637'

jobs:
  authority:
    if: contains(github.event.head_commit.message, 'ONE_SHOT_SURVEYOR_AUTH_READ_ONLY')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - name: Validate owner-authored trusted-main request
        shell: bash
        env:
          COMMIT_AUTHOR_USERNAME: ${{ github.event.head_commit.author.username }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'blakinio/otclient'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$COMMIT_AUTHOR_USERNAME" = 'blakinio'
          echo AUTHORIZATION_GATE=PASS
          echo OWNER_AUTHORED_REQUEST=PASS
          echo RUNTIME_MUTATION=false

      - name: Publish authorized run id
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['GITHUB_RUN_ID']; pr=os.environ['REPORT_PR']
          sha=os.environ['GITHUB_SHA']; implementation=os.environ['IMPLEMENTATION_SHA']
          body=(
              '## Trusted-main auth/session acceptance run authorized\n\n'
              f'Run: `{run}`  \nTrusted-main SHA: `{sha}`  \nImplementation merge: `{implementation}`\n\n'
              '**State: AUTHORIZED — physical read-only job pending/running**\n\n'
              'This marker proves only that the protected-main one-shot gate accepted the owner-authored request. '
              'It is not physical acceptance and is never treated as PASS.'
          )
          data=json.dumps({'body':body}).encode()
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{pr}/comments', data=data, method='POST',
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'otclient-surveyor-readonly'}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200,201): raise SystemExit('RUN_ID_REPORT_FAILED='+str(response.status))
          print('AUTHORIZED_RUN_ID_REPORT=PASS')
          PY

  acceptance:
    needs: authority
    if: needs.authority.result == 'success'
    runs-on: [otclient, synology]
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      acceptance_json: ${{ steps.assert.outputs.acceptance_json }}
    steps:
      - name: Declare immutable read-only authority
        shell: bash
        run: |
          set -Eeuo pipefail
          echo AUTHORIZATION_GATE=PASS
          echo RUNTIME_TASK_ID="$RUNTIME_TASK_ID"
          echo CREDENTIAL_ACCESS=false
          echo GUI_INPUT=false
          echo PROCESS_CONTROL=false
          echo PROCESS_MEMORY_WRITE=false
          echo NETWORK_MUTATION=false
          echo RUNTIME_MUTATION=false

      - name: Checkout trusted main merge
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Prove implementation ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" "$GITHUB_SHA"
          echo IMPLEMENTATION_ANCESTRY=PASS

      - name: Prove safe canonical control state and exact target
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$CANONICAL_STATE" "$RUNNER_TEMP/control.json" <<'PY'
          import json, pathlib, sys, time
          root = pathlib.Path(sys.argv[1]); out = pathlib.Path(sys.argv[2])
          def load(name):
              p = root / name
              if not p.is_file(): return None
              value = json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(value, dict): raise SystemExit(name + '_NOT_OBJECT')
              return value
          lease = load('lease.json'); reg = load('runtime-registration.json'); now = int(time.time())
          fresh = bool(lease and lease.get('status') == 'active' and isinstance(lease.get('expires_at'), (int,float)) and int(lease['expires_at']) > now)
          if fresh:
              raise SystemExit('ACTIVE_RUNTIME_OWNER_PRESENT=' + str(lease.get('controller_task')))
          safe = {
              'lease': {k: lease.get(k) for k in ('runtime_id','status','generation','controller_task','expires_at')} if lease else None,
              'lease_fresh_active': fresh,
              'registration': {k: reg.get(k) for k in ('runtime_id','registration_generation','lease_generation','pid','process_start_ticks','client_version','client_size','client_sha256','display','state','source_task')} if reg else None,
          }
          out.write_text(json.dumps(safe, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('CONTROL_PLANE_READ=PASS')
          print('RUNTIME_OWNER_TASK=NOT_APPLICABLE')
          PY

          docker inspect -f '{{.State.Running}}' "$CONTAINER" | grep -Fx true >/dev/null
          set +e
          pid_output="$(docker exec "$CONTAINER" pgrep -x client 2>/dev/null)"
          pid_rc=$?
          set -e
          case "$pid_rc" in
            0) ;;
            1) pid_output='' ;;
            *) echo TARGET_CLIENT_CENSUS=FAIL >&2; exit 2 ;;
          esac
          pids=()
          while IFS= read -r pid_value; do
            [[ "$pid_value" =~ ^[0-9]+$ ]] && pids+=("$pid_value")
          done <<< "$pid_output"
          echo TARGET_NAMESPACE_CLIENTS="${#pids[@]}"
          test "${#pids[@]}" -eq 1
          pid="${pids[0]}"
          size="$(docker exec "$CONTAINER" stat -Lc %s "/proc/$pid/exe")"; test "$size" = "$EXPECTED_SIZE"
          sha="$(docker exec "$CONTAINER" sha256sum "/proc/$pid/exe" | awk '{print $1}')"; test "$sha" = "$EXPECTED_SHA"
          start="$(docker exec -i "$CONTAINER" python3 - "$pid" <<'PY'
          import pathlib, sys
          raw=pathlib.Path('/proc/'+sys.argv[1]+'/stat').read_text(encoding='ascii')
          print(raw[raw.rfind(')')+2:].split()[19])
          PY
          )"
          [[ "$start" =~ ^[0-9]+$ ]]
          docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdpyinfo >/dev/null
          matches=0
          while IFS= read -r xid; do
            [[ "$xid" =~ ^[0-9]+$ ]] || continue
            window_owner="$(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xprop -id "$xid" _NET_WM_PID 2>/dev/null | sed -nE 's/.*= *([0-9]+).*/\1/p')"
            [[ "$window_owner" == "$pid" ]] && matches=$((matches+1))
          done < <(docker exec -u kasm-user -e DISPLAY="$DISPLAY_NAME" "$CONTAINER" xdotool search --onlyvisible --name '^Tibia' 2>/dev/null || true)
          echo TARGET_WINDOW_MATCHES="$matches"; test "$matches" -eq 1

          python3 - "$RUNNER_TEMP/control.json" "$pid" "$start" "$EXPECTED_SIZE" "$EXPECTED_SHA" "$DISPLAY_NAME" <<'PY'
          import json, pathlib, sys
          doc=json.loads(pathlib.Path(sys.argv[1]).read_text()); reg=doc.get('registration')
          if reg:
              expected={'pid':int(sys.argv[2]),'process_start_ticks':int(sys.argv[3]),'client_size':int(sys.argv[4]),'client_sha256':sys.argv[5],'display':sys.argv[6]}
              bad=[k for k,v in expected.items() if reg.get(k)!=v]
              if bad: raise SystemExit('CANONICAL_REGISTRATION_IDENTITY_MISMATCH='+','.join(bad))
          print('TARGET_UNIQUENESS=PROVEN')
          print('CANONICAL_REGISTRATION=' + ('PRESENT_MATCHING' if reg else 'ABSENT'))
          PY
          echo "pid=$pid" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo PROCESS_ENVIRONMENT_READ=false
          echo WINDOW_TITLE_VALUE_RETAINED=false

      - name: Run post-merge passive collect-all and assert causal implementation delta
        id: assert
        shell: bash
        env:
          TARGET_PID: ${{ steps.target.outputs.pid }}
          TARGET_START: ${{ steps.target.outputs.start }}
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/tibia-re-surveyor-auth-session-postmerge"
          PYTHONPATH=. python3 -m tools.tibia_re_surveyor \
            --collect-all \
            --runtime-docker \
            --runtime-container "$CONTAINER" \
            --control-container "$CONTROL_CONTAINER" \
            --display "$DISPLAY_NAME" \
            --output-dir "$out"
          python3 - "$out" "$RUNNER_TEMP/control.json" "$TARGET_PID" "$TARGET_START" "$IMPLEMENTATION_SHA" "$GITHUB_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); control=json.loads(pathlib.Path(sys.argv[2]).read_text())
          pid=int(sys.argv[3]); start=int(sys.argv[4]); implementation_sha=sys.argv[5]; acceptance_sha=sys.argv[6]
          output=pathlib.Path(sys.argv[7])
          privacy=json.loads((root/'privacy-scan.json').read_text())
          missing=json.loads((root/'missing-readers.json').read_text())
          auth=json.loads((root/'telemetry'/'auth-session.json').read_text())
          coverage=json.loads((root/'surveyor'/'coverage.json').read_text())
          typed=auth['source_states']['subsystem_typed_reader']['value']
          runtime=auth['source_states']['runtime_identity']
          aliases=list((root/'aliases').glob('*.json'))
          assert privacy['result']=='PASS', privacy
          assert len(coverage['rows'])==169, len(coverage['rows'])
          assert len(aliases)==12, len(aliases)
          assert len(missing['reader_gaps'])==9, missing
          assert 'TIBIA-RE-AUTH-SESSION' not in {x['alias'] for x in missing['reader_gaps']}
          assert auth['source_states']['subsystem_typed_reader']['state']=='AVAILABLE', auth
          assert typed['reader_id']=='auth_session_typed_reader'
          assert typed['process_memory_access']=='read_only'
          assert typed['semantic_state']=='TYPED_AUTH_LIFECYCLE_ONLY'
          assert typed['in_game_claimed'] is False
          assert typed['credentials_retained'] is False
          assert typed['session_secrets_retained'] is False
          assert typed['semantic_promotion_allowed'] is False
          assert isinstance(typed['authentication_state_machine_running'], bool)
          assert runtime['state']=='AVAILABLE', runtime
          reg=control.get('registration'); lease=control.get('lease')
          result={
              'schema':'otclient.surveyor-auth-session-postmerge-e2e.v1',
              'result':'PASS','implementation_merge_sha':implementation_sha,
              'acceptance_trusted_main_sha':acceptance_sha,
              'pid':pid,'process_start_ticks':start,'client_size':52109920,
              'client_sha256':'ed5469b9fa71349de688f719434d23875f76f28a3ebd08a36d30f7f6da0af6b8',
              'target_uniqueness':'PROVEN','runtime_owner_task':'NOT_APPLICABLE',
              'canonical_registration_present':bool(reg),
              'canonical_registration_generation':reg.get('registration_generation') if reg else None,
              'registration_lease_generation':reg.get('lease_generation') if reg else None,
              'canonical_registration_state':reg.get('state') if reg else None,
              'canonical_lease_status':lease.get('status') if lease else None,
              'canonical_lease_generation':lease.get('generation') if lease else None,
              'reader_before':'NO_TYPED_READER_IMPLEMENTED','reader_after':'AVAILABLE',
              'canonical_rows':169,'aliases':12,
              'missing_readers_before':10,'missing_readers_after':9,
              'privacy_before':'PASS','privacy_after':'PASS',
              'authentication_state_machine_running':typed['authentication_state_machine_running'],
              'semantic_state':typed['semantic_state'],'in_game_claimed':False,
              'credentials_retained':False,'session_secrets_retained':False,
              'process_memory_access':'read_only','runtime_mutation':False,
          }
          (root/'acceptance.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          compact=json.dumps(result,separators=(',',':'),sort_keys=True)
          with output.open('a',encoding='utf-8') as handle: handle.write('acceptance_json='+compact+'\n')
          print('POSTMERGE_AUTH_SESSION_E2E=PASS')
          print('IMPLEMENTATION_MERGE_SHA='+implementation_sha)
          print('CANONICAL_ROWS=169')
          print('ALIASES=12')
          print('AUTH_TYPED_READER=AVAILABLE')
          print('MISSING_TYPED_READERS=9')
          print('PRIVACY_SCAN=PASS')
          print('AUTH_STATE_MACHINE_RUNNING='+str(result['authentication_state_machine_running']).lower())
          print('IN_GAME_CLAIMED=false')
          print('RUNTIME_MUTATION=false')
          PY

      - name: Upload sanitized acceptance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track-a-surveyor-auth-session-postmerge-${{ github.run_id }}
          path: ${{ runner.temp }}/tibia-re-surveyor-auth-session-postmerge/
          if-no-files-found: error
          retention-days: 3

  report:
    needs: [authority, acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - name: Publish sanitized final verdict
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          ACCEPTANCE_JSON: ${{ needs.acceptance.outputs.acceptance_json }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['GITHUB_RUN_ID']; pr=os.environ['REPORT_PR']; sha=os.environ['GITHUB_SHA']
          authority=os.environ.get('AUTHORITY_RESULT',''); acceptance=os.environ.get('ACCEPTANCE_RESULT',''); raw=os.environ.get('ACCEPTANCE_JSON','')
          if authority=='success' and acceptance=='success' and raw:
              result=json.loads(raw)
              body=(
                  '## Trusted-main auth/session read-only acceptance\n\n'
                  f"Run: `{run}`  \nTrusted-main SHA: `{result['acceptance_trusted_main_sha']}`  \n"
                  f"Implementation merge: `{result['implementation_merge_sha']}`\n\n"
                  '**Result: PASS**\n\n'
                  f"- exact target PID/start: `{result['pid']}` / `{result['process_start_ticks']}`\n"
                  f"- client size/SHA: `{result['client_size']}` / `{result['client_sha256']}`\n"
                  f"- target uniqueness: `{result['target_uniqueness']}`; runtime owner: `{result['runtime_owner_task']}`\n"
                  f"- canonical registration present/generation/state: `{result['canonical_registration_present']}` / `{result['canonical_registration_generation']}` / `{result['canonical_registration_state']}`\n"
                  f"- lease status/generation: `{result['canonical_lease_status']}` / `{result['canonical_lease_generation']}`\n"
                  f"- canonical rows / aliases: `{result['canonical_rows']}` / `{result['aliases']}`\n"
                  f"- auth typed reader: `{result['reader_before']} -> {result['reader_after']}`\n"
                  f"- missing typed readers: `{result['missing_readers_before']} -> {result['missing_readers_after']}`\n"
                  f"- privacy: `{result['privacy_before']} -> {result['privacy_after']}`\n"
                  f"- auth state-machine running: `{str(result['authentication_state_machine_running']).lower()}`\n"
                  f"- semantic state: `{result['semantic_state']}`; IN_GAME claimed: `false`\n"
                  '- process memory: `read_only`; runtime mutation: `false`; credentials/session secrets retained: `false`\n\n'
                  'This is an implementation causal delta, not a login-state transition and not an IN_GAME proof.'
              )
          else:
              body=(
                  '## Trusted-main auth/session read-only acceptance\n\n'
                  f'Run: `{run}`  \nTrusted-main SHA: `{sha}`\n\n'
                  '**Result: FAIL — no physical acceptance recorded**\n\n'
                  f'- authority job: `{authority or "unknown"}`\n'
                  f'- physical acceptance job: `{acceptance or "unknown"}`\n\n'
                  'No runtime details are published by this failure path. The run ID is retained solely for bounded diagnosis.'
              )
          data=json.dumps({'body':body}).encode()
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{pr}/comments', data=data, method='POST',
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'otclient-surveyor-readonly'}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200,201): raise SystemExit('FINAL_REPORT_COMMENT_FAILED='+str(response.status))
          print('SANITIZED_FINAL_REPORT_COMMENT=PASS')
          PY

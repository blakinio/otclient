name: Track A UI/settings static model

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-ui-settings-static-model.yml
      - docs/agents/evidence/OTC-20260819-track-a-ui-settings-static-model/**
      - docs/agents/tasks/active/OTC-20260819-track-a-ui-settings-static-model.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recover official-client UI/settings static model
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Fetch current official Linux client and emit bounded static settings evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl binutils python3 python3-capstone python3-pyelftools

          r="$RUNNER_TEMP/ui-settings-static"
          mkdir -p "$r/bin" "$r/state" "$r/client"
          cd "$r/bin"

          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wireproxy.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tgz' | sha256sum -c -
          mkdir wp
          tar -xzf wireproxy.tgz -C wp
          cp "$(find wp -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy

          cd "$r/state"
          "$r/bin/wgcf" register --accept-tos >/dev/null
          "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$r/bin/wireproxy" -c wireproxy.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$r/trace"

          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' \
            "$u" -o "$r/client/client.lzma"

          python3 - "$r/client/client.lzma" "$r/client/client" <<'PY'
          import hashlib
          import lzma
          import pathlib
          import re
          import subprocess
          import sys

          packed_path = pathlib.Path(sys.argv[1])
          out_path = pathlib.Path(sys.argv[2])
          packed = packed_path.read_bytes()
          assert len(packed) > 45, len(packed)
          props = packed[32]
          lc = props % 9
          rest = props // 9
          lp = rest % 5
          pb = rest // 5
          dict_size = int.from_bytes(packed[33:37], 'little')
          assert 0 <= lc <= 8 and 0 <= lp <= 4 and 0 <= pb <= 4
          assert dict_size > 0
          raw = lzma.decompress(
              packed[45:],
              format=lzma.FORMAT_RAW,
              filters=[{'id': lzma.FILTER_LZMA1, 'dict_size': dict_size, 'lc': lc, 'lp': lp, 'pb': pb}],
          )
          assert raw[:4] == b'\x7fELF', raw[:4]
          out_path.write_bytes(raw)

          print('UI_SETTINGS_RUNTIME_ACCESS=none')
          print('UI_SETTINGS_CLIENT_EXECUTED=false')
          print('UI_SETTINGS_OFFICIAL_SOURCE_URL=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma')
          print('UI_SETTINGS_PACKED_SIZE=' + str(len(packed)))
          print('UI_SETTINGS_PACKED_SHA256=' + hashlib.sha256(packed).hexdigest())
          print('UI_SETTINGS_CLIENT_SIZE=' + str(len(raw)))
          print('UI_SETTINGS_CLIENT_SHA256=' + hashlib.sha256(raw).hexdigest())
          print(f'UI_SETTINGS_LZMA_ENVELOPE=offset45;lc={lc};lp={lp};pb={pb};dict={dict_size}')

          # Keep only bounded printable strings; no proprietary binary bytes are emitted.
          printable = {
              m.group().decode('utf-8', 'ignore')
              for m in re.finditer(rb'[\x20-\x7e]{5,240}', raw)
          }

          buckets = {
              'GRAPHICS': re.compile(r'graphic|video|renderer|rendering|vsync|vertical.?sync|fullscreen|windowed|frame.?rate|\bfps\b|antialias|anti.?alias|brightness|light.?level', re.I),
              'AUDIO': re.compile(r'audio|sound|music|ambient|volume|mute|speaker|playback.?device', re.I),
              'INTERFACE': re.compile(r'interface|sidebar|ui.?scale|status.?bar|action.?bar|minimap|window.?layout|chat.?window', re.I),
              'GAMEPLAY': re.compile(r'gameplay|control|keyboard|mouse|chase|attack.?mode|movement|walk|turn|smart.?click', re.I),
              'PERSISTENCE': re.compile(r'setting|option|preference|config|configuration|profile|persist|migration|migrate|save.?file|standard.?path', re.I),
              'HOTKEY_ACTIONBAR': re.compile(r'hotkey|key.?bind|binding|shortcut|action.?bar|multi.?action|cooldown', re.I),
          }

          persistence_api = re.compile(r'QSettings|QStandardPaths|QSaveFile|QJson|sqlite|\.config|settings\.(json|ini|cfg)|options\.(json|ini|cfg)', re.I)

          def demangle(values):
              if not values:
                  return {}
              proc = subprocess.run(
                  ['c++filt', '-t'],
                  input='\n'.join(values) + '\n',
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=True,
              )
              return dict(zip(values, proc.stdout.splitlines()))

          def rank(s):
              low = s.lower()
              score = 0
              if 'tibia::' in low: score += 100
              if 'tibia' in low: score += 35
              if 'qsettings' in low or 'qstandardpaths' in low or 'qsavefile' in low: score += 80
              if re.search(r'(^|::)T[A-Z]', s): score += 30
              if s.startswith('N') and 'tibia' in low: score += 25
              if 'setting' in low or 'option' in low or 'preference' in low: score += 20
              if 'config' in low or 'profile' in low: score += 15
              if 'hotkey' in low or 'actionbar' in low or 'action bar' in low: score += 15
              if len(s) <= 120: score += 5
              return (-score, len(s), s)

          all_candidates = set()
          bucket_candidates = {}
          for name, pattern in buckets.items():
              vals = [s for s in printable if pattern.search(s)]
              vals = sorted(vals, key=rank)[:120]
              bucket_candidates[name] = vals
              all_candidates.update(vals)

          api_candidates = sorted([s for s in printable if persistence_api.search(s)], key=rank)[:120]
          all_candidates.update(api_candidates)

          demangle_input = [s for s in all_candidates if re.fullmatch(r'_?Z?T?[SVI]?N?[0-9A-Za-z_]+E?', s)]
          demangled = demangle(demangle_input)

          for name in buckets:
              vals = bucket_candidates[name]
              print(f'UI_SETTINGS_BUCKET_{name}_COUNT={len(vals)}')
              for idx, value in enumerate(vals):
                  d = demangled.get(value, value)
                  print(f'UI_SETTINGS_CANDIDATE={name};INDEX={idx};RAW={value};DEMANGLED={d}')

          print('UI_SETTINGS_PERSISTENCE_API_COUNT=' + str(len(api_candidates)))
          for idx, value in enumerate(api_candidates):
              d = demangled.get(value, value)
              print(f'UI_SETTINGS_PERSISTENCE_API={idx};RAW={value};DEMANGLED={d}')

          print('UI_SETTINGS_STATIC_SCAN=PASS')
          PY

          python3 - "$r/client/client" <<'PY'
          from collections import deque
          import re
          import subprocess
          import sys

          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86_const import X86_INS_CALL, X86_OP_IMM, X86_OP_MEM, X86_REG_RIP
          from elftools.elf.elffile import ELFFile

          path = sys.argv[1]
          SHF_ALLOC = 0x2
          SHF_EXECINSTR = 0x4

          with open(path, 'rb') as fh:
              elf = ELFFile(fh)

              strings_by_va = {}
              for section in elf.iter_sections():
                  flags = int(section['sh_flags'])
                  if not (flags & SHF_ALLOC) or (flags & SHF_EXECINSTR):
                      continue
                  if section['sh_type'] == 'SHT_NOBITS':
                      continue
                  data = section.data()
                  base = int(section['sh_addr'])
                  for match in re.finditer(rb'[\x20-\x7e]{4,160}\x00', data):
                      text = match.group()[:-1].decode('utf-8', 'ignore')
                      strings_by_va[base + match.start()] = text

              literal_vas = {
                  va for va, text in strings_by_va.items()
                  if text == 'clientoptions.json'
              }
              print('UI_SETTINGS_XREF_CLIENTOPTIONS_LITERAL_VA_COUNT=' + str(len(literal_vas)))
              for va in sorted(literal_vas):
                  print(f'UI_SETTINGS_XREF_CLIENTOPTIONS_LITERAL_VA=0x{va:x}')

              plt = subprocess.run(
                  ['objdump', '-d', '-C', '--no-show-raw-insn', '-j', '.plt', '-j', '.plt.sec', path],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).stdout
              plt_by_va = {}
              for line in plt.splitlines():
                  m = re.match(r'^\s*([0-9a-fA-F]+)\s+<(.+@plt)>:$', line)
                  if m:
                      plt_by_va[int(m.group(1), 16)] = m.group(2)

              qsettings_plt = {
                  va: name for va, name in plt_by_va.items()
                  if 'QSettings::' in name
                  and any(token in name for token in ('value(', 'setValue(', 'beginGroup(', 'endGroup('))
              }
              print('UI_SETTINGS_XREF_QSETTINGS_PLT_COUNT=' + str(len(qsettings_plt)))
              for va, name in sorted(qsettings_plt.items()):
                  print(f'UI_SETTINGS_XREF_QSETTINGS_PLT=0x{va:x};SYMBOL={name}')

              md = Cs(CS_ARCH_X86, CS_MODE_64)
              md.detail = True

              client_xrefs = []
              qsettings_calls = []
              pending_client_contexts = []

              relevance = re.compile(
                  r'option|setting|config|profile|client|hotkey|action|sound|audio|graphic|video|interface|sidebar|gameplay|control|window|json|ini|cfg|tibia',
                  re.I,
              )

              def string_refs(insn):
                  found = []
                  for op in insn.operands:
                      if op.type == X86_OP_MEM and op.mem.base == X86_REG_RIP:
                          target = insn.address + insn.size + op.mem.disp
                          text = strings_by_va.get(target)
                          if text is not None:
                              found.append((target, text))
                  return found

              for section in elf.iter_sections():
                  flags = int(section['sh_flags'])
                  if not (flags & SHF_EXECINSTR):
                      continue
                  data = section.data()
                  base = int(section['sh_addr'])
                  previous = deque(maxlen=80)

                  for insn in md.disasm(data, base):
                      refs = string_refs(insn)
                      direct_call = None
                      if insn.id == X86_INS_CALL and insn.operands and insn.operands[0].type == X86_OP_IMM:
                          target = int(insn.operands[0].imm)
                          direct_call = plt_by_va.get(target)

                      for context in pending_client_contexts:
                          if context['remaining'] > 0:
                              context['remaining'] -= 1
                              if direct_call and len(context['calls']) < 16:
                                  context['calls'].append(direct_call)
                              for _, text in refs:
                                  if relevance.search(text) and text not in context['strings'] and len(context['strings']) < 16:
                                      context['strings'].append(text)

                      if any(target in literal_vas for target, _ in refs):
                          prior_calls = []
                          prior_strings = []
                          for p_refs, p_call in previous:
                              if p_call and p_call not in prior_calls and len(prior_calls) < 16:
                                  prior_calls.append(p_call)
                              for _, text in p_refs:
                                  if relevance.search(text) and text not in prior_strings and len(prior_strings) < 16:
                                      prior_strings.append(text)
                          context = {
                              'address': insn.address,
                              'prior_calls': prior_calls,
                              'prior_strings': prior_strings,
                              'calls': [],
                              'strings': [],
                              'remaining': 80,
                          }
                          client_xrefs.append(context)
                          pending_client_contexts.append(context)

                      if direct_call and any(insn.operands[0].imm == va for va in qsettings_plt):
                          prior_strings = []
                          prior_calls = []
                          for p_refs, p_call in previous:
                              if p_call and p_call not in prior_calls and len(prior_calls) < 12:
                                  prior_calls.append(p_call)
                              for _, text in p_refs:
                                  if relevance.search(text) and text not in prior_strings and len(prior_strings) < 12:
                                      prior_strings.append(text)
                          qsettings_calls.append({
                              'address': insn.address,
                              'symbol': direct_call,
                              'prior_strings': prior_strings,
                              'prior_calls': prior_calls,
                          })

                      previous.append((refs, direct_call))

              # Keep the report bounded and textual. Addresses are code-level anchors, not binary content.
              print('UI_SETTINGS_XREF_CLIENTOPTIONS_CODE_COUNT=' + str(len(client_xrefs)))
              for idx, context in enumerate(client_xrefs[:32]):
                  calls = '|'.join(dict.fromkeys(context['prior_calls'] + context['calls']))
                  strings = '|'.join(dict.fromkeys(context['prior_strings'] + context['strings']))
                  print(
                      f"UI_SETTINGS_XREF_CLIENTOPTIONS_CODE={idx};VA=0x{context['address']:x};"
                      f"NEARBY_PLT_CALLS={calls};NEARBY_RELEVANT_STRINGS={strings}"
                  )

              print('UI_SETTINGS_XREF_QSETTINGS_CALL_COUNT=' + str(len(qsettings_calls)))
              for idx, context in enumerate(qsettings_calls[:64]):
                  strings = '|'.join(context['prior_strings'])
                  calls = '|'.join(context['prior_calls'])
                  print(
                      f"UI_SETTINGS_XREF_QSETTINGS_CALL={idx};VA=0x{context['address']:x};"
                      f"SYMBOL={context['symbol']};PRIOR_RELEVANT_STRINGS={strings};PRIOR_PLT_CALLS={calls}"
                  )

              if not literal_vas:
                  raise SystemExit('clientoptions.json literal missing from current binary')
              if not client_xrefs:
                  raise SystemExit('clientoptions.json has no decoded RIP-relative code xref')
              if not qsettings_plt:
                  raise SystemExit('QSettings persistence PLT surface missing')
              if not qsettings_calls:
                  raise SystemExit('QSettings persistence PLT surface has no decoded direct callsites')

              print('UI_SETTINGS_XREF_SCAN=PASS')
          PY

          echo 'UI_SETTINGS_BUILD_ID_BEGIN'
          readelf -n "$r/client/client" | sed -n '/Build ID:/p' | head -n 1
          echo 'UI_SETTINGS_BUILD_ID_END'

          rm -f "$r/client/client" "$r/client/client.lzma"
          echo 'UI_SETTINGS_PROPRIETARY_BINARY_RETAINED=false'

name: Track A VNC localhost sidecar v23

on:
  push:
    branches:
      - runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
    paths:
      - .github/workflows/track-a-vnc-loopback-sidecar-deploy-v23.yml

permissions:
  contents: write

concurrency:
  group: track-a-vnc-loopback-sidecar-v23
  cancel-in-progress: false

env:
  EVIDENCE: docs/agents/evidence/OTC-20260817-track-a-worldmap-server-delivery-causal-validation/20260818-v23-vnc-sidecar.md

jobs:
  deploy:
    name: Deploy localhost-only VNC forwarder
    runs-on: [self-hosted, oteryn-staging]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
          persist-credentials: true
          fetch-depth: 0

      - name: Install isolated VNC forwarder without touching OTClient runner
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          command -v docker >/dev/null
          test -S /var/run/docker.sock
          docker inspect otclient-runner >/dev/null

          net="$(docker inspect -f '{{range $name,$cfg := .NetworkSettings.Networks}}{{println $name}}{{end}}' otclient-runner | sed '/^$/d' | head -1)"
          [[ -n "$net" ]]
          echo "TRACK_A_VNC_SIDECAR_NETWORK=$net"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat >"$tmp/Dockerfile" <<'EOF'
          FROM alpine:3.20
          RUN apk add --no-cache socat
          COPY entrypoint.sh /entrypoint.sh
          RUN chmod 0755 /entrypoint.sh
          ENTRYPOINT ["/entrypoint.sh"]
          EOF
          cat >"$tmp/entrypoint.sh" <<'EOF'
          #!/bin/sh
          set -eu
          for p in $(seq 6082 6120); do
            socat "TCP-LISTEN:${p},fork,reuseaddr" "TCP:otclient-runner:${p}" &
          done
          wait
          EOF
          docker build -q -t otclient-vnc-loopback:v23 "$tmp" >/dev/null
          docker rm -f otclient-vnc-loopback >/dev/null 2>&1 || true
          docker run -d \
            --name otclient-vnc-loopback \
            --restart unless-stopped \
            --network "$net" \
            -p 127.0.0.1:6082-6120:6082-6120 \
            otclient-vnc-loopback:v23 >/dev/null

          for _ in $(seq 1 30); do
            [[ "$(docker inspect -f '{{.State.Running}}' otclient-vnc-loopback 2>/dev/null || true)" == true ]] && break
            sleep .5
          done
          [[ "$(docker inspect -f '{{.State.Running}}' otclient-vnc-loopback)" == true ]]
          ports="$(docker port otclient-vnc-loopback)"
          printf '%s\n' "$ports"
          ! grep -Ev ' -> 127\.0\.0\.1:' <<<"$ports" | grep -q .
          count="$(grep -c ' -> 127\.0\.0\.1:' <<<"$ports")"
          [[ "$count" -eq 39 ]]
          {
            echo '# Track A v23 VNC sidecar deployment'
            echo
            echo '```text'
            echo 'TRACK_A_VNC_HOST_BIND=127.0.0.1_ONLY'
            echo 'TRACK_A_VNC_FORWARD_RANGE=6082-6120'
            echo "TRACK_A_VNC_DOCKER_NETWORK=$net"
            echo 'TRACK_A_VNC_SIDECAR=PASS'
            echo 'OTCLIENT_RUNNER_RECREATED=false'
            echo 'VNC_PUBLIC_LAN_EXPOSURE=false'
            echo '```'
          } > "$EVIDENCE"
          echo 'TRACK_A_VNC_HOST_BIND=127.0.0.1_ONLY'
          echo 'TRACK_A_VNC_FORWARD_RANGE=6082-6120'
          echo 'TRACK_A_VNC_SIDECAR=PASS'

      - name: Persist deploy proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$EVIDENCE"
          git fetch -q origin +refs/heads/runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation:refs/remotes/origin/task
          git checkout -q -B runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation refs/remotes/origin/task
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE"
          git commit -m 'evidence(track-a): persist localhost-only VNC sidecar deploy'
          git push origin HEAD:runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation

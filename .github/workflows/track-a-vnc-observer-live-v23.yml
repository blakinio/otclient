name: Track A live VNC observer v24

on:
  push:
    branches:
      - runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
    paths:
      - .github/workflows/track-a-vnc-observer-live-v23.yml
      - .github/scripts/track-a-worldmap-vnc-observer-access-v23-repair.py
      - .github/scripts/track-a-worldmap-vnc-observer-hold-v24-repair.py

permissions:
  contents: read

concurrency:
  group: track-a-vnc-observer-live-v24
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
          persist-credentials: false
      - shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/track-a-worldmap-vnc-observer-access-v23-repair.py \
            .github/scripts/track-a-worldmap-vnc-observer-integrate-v23-repair.py \
            .github/scripts/track-a-worldmap-vnc-observer-hold-v24-repair.py
          python3 .github/scripts/track-a-worldmap-vnc-observer-integrate-v23-repair.py \
            .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh "$RUNNER_TEMP/base-vnc.sh"
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py "$RUNNER_TEMP/base-vnc.sh" "$RUNNER_TEMP/a"
          python3 .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          python3 .github/scripts/track-a-worldmap-causal-ui-field-discriminator-v3-repair.py "$RUNNER_TEMP/b" "$RUNNER_TEMP/c"
          python3 .github/scripts/track-a-worldmap-causal-ui-field-discriminator-v4-repair.py "$RUNNER_TEMP/c" "$RUNNER_TEMP/d"
          python3 .github/scripts/track-a-worldmap-causal-ui-field-final-roi-v5-repair.py "$RUNNER_TEMP/d" "$RUNNER_TEMP/e"
          python3 .github/scripts/track-a-worldmap-vnc-observer-hold-v24-repair.py "$RUNNER_TEMP/e" "$RUNNER_TEMP/helper.sh"
          bash -n "$RUNNER_TEMP/helper.sh"
          grep -Fq 'TRACK_A_VNC_OBSERVER_HOLD=ACTIVE_NO_SECRET_NO_LOGIN' "$RUNNER_TEMP/helper.sh"
          ! grep -Fq 'credential_email_handoff_timeout' "$RUNNER_TEMP/helper.sh"
          echo 'TRACK_A_VNC_LIVE_STATIC=PASS'

  live:
    needs: static
    runs-on: [otclient, synology]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
          persist-credentials: false
      - id: comp
        shell: bash
        run: |
          set +x;set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          m=b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1';f=[]
          for p in Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:
                  if m in (p/'environ').read_bytes():f.append(p.name)
              except OSError:pass
          print('TRACK_A_VNC_LIVE_PRE_NAMESPACE_COUNT='+str(len(f)));assert not f
          PY
          R="$RUNNER_TEMP"
          python3 .github/scripts/track-a-worldmap-vnc-observer-integrate-v23-repair.py \
            .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh "$R/base-vnc.sh"
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py "$R/base-vnc.sh" "$R/a"
          python3 .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py "$R/a" "$R/b"
          python3 .github/scripts/track-a-worldmap-causal-ui-field-discriminator-v3-repair.py "$R/b" "$R/c"
          python3 .github/scripts/track-a-worldmap-causal-ui-field-discriminator-v4-repair.py "$R/c" "$R/d"
          python3 .github/scripts/track-a-worldmap-causal-ui-field-final-roi-v5-repair.py "$R/d" "$R/e"
          python3 .github/scripts/track-a-worldmap-vnc-observer-hold-v24-repair.py "$R/e" "$R/helper.sh"
          bash -n "$R/helper.sh";chmod 700 "$R/helper.sh"
          grep -Fq 'TRACK_A_VNC_OBSERVER_HOLD=ACTIVE_NO_SECRET_NO_LOGIN' "$R/helper.sh"
          echo "helper=$R/helper.sh" >>"$GITHUB_OUTPUT"
          echo 'TRACK_A_VNC_LIVE_COMPOSITION=PASS'

      - name: Start exact no-secret client and keep observer endpoint live
        shell: bash
        env:
          HELPER: ${{ steps.comp.outputs.helper }}
        run: |
          set +x;set -Eeuo pipefail
          c="$RUNNER_TEMP/worldmap-baseline-control";mkdir -p "$c";chmod 700 "$c"
          rm -f "$c"/{helper.pid,helper.log,presecret.ready,credentials.fifo,result,result.*} 2>/dev/null||true
          nohup setsid env -i HOME="$HOME" PATH="$PATH" RUNNER_NAME="$RUNNER_NAME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash "$HELPER">"$c/helper.log" 2>&1 </dev/null &
          hp=$!;echo "$hp">"$c/helper.pid";chmod 600 "$c/helper.pid" "$c/helper.log"
          ready=0
          for _ in $(seq 1 1800);do
            [[ -f "$c/result" ]]&&{ cat "$c/helper.log";exit 95;}
            if [[ -f "$c/presecret.ready" && -p "$c/credentials.fifo" ]] \
              && grep -Fq 'TRACK_A_USER_VNC_MODE=VIEW_ONLY_PASSWORD_PROTECTED' "$c/helper.log" 2>/dev/null \
              && grep -Fq 'TRACK_A_VNC_OBSERVER_HOLD=ACTIVE_NO_SECRET_NO_LOGIN' "$c/helper.log" 2>/dev/null;then ready=1;break;fi
            kill -0 "$hp" 2>/dev/null||{ cat "$c/helper.log";exit 94;};sleep .5
          done
          [[ "$ready" == 1 ]]
          port="$(sed -n 's/^TRACK_A_USER_VNC_PORT=//p' "$c/helper.log"|tail -1)"
          passfile="$(sed -n 's/^TRACK_A_USER_VNC_PASSWORD_FILE=//p' "$c/helper.log"|tail -1)"
          [[ "$port" == 6082 ]]
          [[ -s "$passfile" && "$(stat -c %a "$passfile")" == 600 ]]
          python3 - <<'PY'
          import socket
          s=socket.create_connection(('127.0.0.1',6082),3);b=s.recv(12);s.close();assert b.startswith(b'RFB '),b
          print('TRACK_A_VNC_LIVE_LOCAL_RFB=PASS')
          PY
          state=/home/runner/_work/_otclient_tibia_re_state/vnc-observer-live
          mkdir -p "$state";chmod 700 "$state"
          printf '6082\n' >"$state/port";chmod 600 "$state/port"
          printf '%s\n' "$passfile" >"$state/password-file";chmod 600 "$state/password-file"
          echo 'TRACK_A_VNC_LIVE_READY=true'
          echo 'TRACK_A_VNC_LIVE_PORT=6082'
          echo 'TRACK_A_VNC_LIVE_SECRET_USED=false'
          # Hold the workflow itself as well. The helper no longer has its former
          # 180-second credential timeout, so the exact Xvfb/x11vnc/client stays alive.
          while kill -0 "$hp" 2>/dev/null;do
            [[ -e "$state/stop" ]]&&break
            sleep 2
          done

      - if: always()
        shell: bash
        run: |
          set +e
          state=/home/runner/_work/_otclient_tibia_re_state/vnc-observer-live
          c="$RUNNER_TEMP/worldmap-baseline-control"
          root=/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260817-track-a-worldmap-server-delivery-causal-validation/worldmap-causal-baseline-ephemeral-v1
          touch "$root/vnc-observer-stop" 2>/dev/null||true
          if [[ -f "$c/helper.pid" ]];then p="$(cat "$c/helper.pid")";kill -TERM "$p" 2>/dev/null||true;sleep 1;kill -KILL "$p" 2>/dev/null||true;fi
          rm -rf "$state" 2>/dev/null||true
          python3 - <<'PY'
          from pathlib import Path
          m=b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1';f=[]
          for p in Path('/proc').iterdir():
              if p.name.isdigit():
                  try:
                      if m in (p/'environ').read_bytes():f.append(p.name)
                  except OSError:pass
          print('TRACK_A_VNC_LIVE_FINAL_NAMESPACE_COUNT='+str(len(f)));raise SystemExit(1 if f else 0)
          PY

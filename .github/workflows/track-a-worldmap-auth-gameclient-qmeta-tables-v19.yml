name: Track A auth and gameclient QMeta tables v19

on:
  push:
    branches:
      - runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
    paths:
      - .github/workflows/track-a-worldmap-auth-gameclient-qmeta-tables-v19.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client and enumerate QMeta dispatch candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools python3-capstone
          r="$RUNNER_TEMP/v19"; mkdir -p "$r/bin" "$r/state" "$r/client"; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf'|sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz'|sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >"$r/wp.log" 2>&1 </dev/null &
          for _ in $(seq 1 30);do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/t" 2>/dev/null&&break;sleep 2;done
          grep -Eq '^warp=(on|plus)$' "$r/t"
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o "$r/client/client.lzma"
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  '"$r"'/client/client.lzma'|sha256sum -c -
          python3 - "$r/client/client.lzma" "$r/client/client" <<'PY'
          import hashlib,lzma,pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_MEM,X86_REG_RIP
          src=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2]);b=src.read_bytes();q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          out.write_bytes(raw)
          with out.open('rb') as fh:
            elf=ELFFile(fh);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def vo(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError(hex(va))
          def u32(va):return struct.unpack_from('<I',raw,vo(va))[0]
          def i32(va):return struct.unpack_from('<i',raw,vo(va))[0]
          def executable(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          classes={
            'AUTH':(0x1c8b760,0x1c8b140,0xcfabb0),
            'UPLOADER':(0x1ca5358,0x1ca51e0,0xcfb5a0),
            'GAMECLIENT':(0x1c93cf4,0x1c93740,0xd06260),
          }
          def qs(s,idx):
            e=s+idx*8; rel=u32(e); ln=u32(e+4)
            return raw[vo(s+rel):vo(s+rel)+ln].decode('utf8','replace')
          for key,(s,m,st) in classes.items():
            mc=u32(m+4*4);mdo=u32(m+5*4)
            print(f'WORLDMAP_V19_{key}_BEGIN')
            print(f'STATIC_METACALL=0x{st:x};METHOD_COUNT={mc}')
            methods=[]
            for i in range(mc):
              row=[u32(m+(mdo+i*6+j)*4) for j in range(6)]
              methods.append(qs(s,row[0]))
              print(f'METHOD_META_INDEX={i};NAME={methods[-1]};ARGC={row[1]};FLAGS=0x{row[4]:x}')
            ins=list(md.disasm(raw[vo(st):vo(st)+0x600],st))
            print('DISASM_BEGIN')
            for x in ins[:180]:print(f'0x{x.address:x} {x.mnemonic} {x.op_str}')
            print('DISASM_END')
            candidates=[]
            for pos,x in enumerate(ins):
              if x.mnemonic!='lea' or len(x.operands)<2 or x.operands[1].type!=X86_OP_MEM or x.operands[1].mem.base!=X86_REG_RIP:continue
              table=x.address+x.size+x.operands[1].mem.disp
              # Candidate only if a nearby instruction consumes that destination reg as base+index*4.
              reg=x.operands[0].reg
              used=False
              for y in ins[pos+1:pos+12]:
                for op in y.operands:
                  if op.type==X86_OP_MEM and op.mem.base==reg and op.mem.scale==4:
                    used=True
              if not used:continue
              try:tg=[table+i32(table+i*4) for i in range(mc)]
              except Exception:continue
              score=sum(executable(t) for t in tg)
              candidates.append((score,table,tg,x.address))
            candidates.sort(reverse=True,key=lambda z:(z[0],-z[1]))
            for ci,(score,table,tg,lea_at) in enumerate(candidates[:8]):
              print(f'CANDIDATE={ci};LEA=0x{lea_at:x};TABLE=0x{table:x};EXEC_SCORE={score}/{mc}')
              for i,t in enumerate(tg):print(f'  INDEX={i};NAME={methods[i]};TARGET=0x{t:x};EXEC={str(executable(t)).lower()}')
            print(f'WORLDMAP_V19_{key}_END')
          print('WORLDMAP_V19_QMETA_TABLE_ENUMERATION=PASS')
          print('WORLDMAP_V19_CLIENT_EXECUTED=false')
          PY

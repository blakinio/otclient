name: Track A AUTH signal5 QState transition wiring v20

on:
  push:
    branches:
      - runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
    paths:
      - .github/workflows/track-a-worldmap-auth-transition-wiring-v20.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Fetch exact client and recover signal/state wiring xrefs
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils curl python3-pyelftools python3-capstone
          r="$RUNNER_TEMP/tw";mkdir -p "$r/bin" "$r/state" "$r/client";cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf'|sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz'|sha256sum -c -
          mkdir x;tar -xzf wp.tgz -C x;cp "$(find x -type f -name wireproxy -print -quit)" wireproxy;chmod 755 wgcf wireproxy
          cd "$r/state";"$r/bin/wgcf" register --accept-tos >/dev/null;"$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf">w.conf
          nohup "$r/bin/wireproxy" -c w.conf >"$r/wp.log" 2>&1 </dev/null &
          for _ in $(seq 1 30);do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/t" 2>/dev/null&&break;sleep 2;done
          grep -Eq '^warp=(on|plus)$' "$r/t"
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o "$r/client/client.lzma"
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  '"$r"'/client/client.lzma'|sha256sum -c -
          python3 - "$r/client/client.lzma" "$r/client/client" <<'PY'
          import hashlib,lzma,pathlib,struct,sys,re,subprocess
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_MEM,X86_REG_RIP,X86_OP_IMM
          b=pathlib.Path(sys.argv[1]).read_bytes();q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          p=pathlib.Path(sys.argv[2]);p.write_bytes(raw);p.chmod(0o700)
          with p.open('rb') as f:
            elf=ELFFile(f);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          execsecs=[x for x in secs if x[4]&4 and x[2]]
          def vo(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError(hex(va))
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          targets={
            'AUTH_VPTR':0x307f1b0,
            'REQ_GS_SIGNAL':0xcfb2e7,
            'START_GS_CASE':0xcfb122,
            'START_GS_IMPL':0x767440,
            'AUTH_STATIC_METACALL':0xcfabb0,
          }
          refs={k:[] for k in targets}
          calls=[]
          for sec,off,size,base,fl in execsecs:
            code=raw[off:off+size]
            for ins in md.disasm(code,base):
              for op in ins.operands:
                if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                  dst=ins.address+ins.size+op.mem.disp
                  for k,t in targets.items():
                    if dst==t:refs[k].append((ins.address,ins.mnemonic,ins.op_str))
              if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==X86_OP_IMM:
                calls.append((ins.address,int(ins.operands[0].imm)))
          print('WORLDMAP_V20_AUTH_WIRING_XREFS_BEGIN')
          for k in targets:
            print(k+'='+','.join(f'0x{a:x}:{m}:{o}' for a,m,o in refs[k]))
          print('WORLDMAP_V20_AUTH_WIRING_XREFS_END')

          # Resolve Qt state-machine PLT symbols from objdump output.
          od=subprocess.check_output(['objdump','-d','-C',str(p)],text=True,errors='replace')
          names=['QState::addTransition','QStateMachine::start','QState::entered','QObject::connect']
          plt={}
          for line in od.splitlines():
            for n in names:
              if '<'+n in line and '@plt>' in line:
                m=re.match(r'\s*([0-9a-f]+)\s+<([^>]+)>:',line)
                if m:plt.setdefault(n,[]).append((int(m.group(1),16),m.group(2)))
          print('WORLDMAP_V20_QT_STATE_PLT_BEGIN')
          for n,rows in plt.items():print(n+'='+','.join(f'0x{a:x}:{s}' for a,s in rows))
          print('WORLDMAP_V20_QT_STATE_PLT_END')

          # Print bounded contexts around every executable xref to signal5 and start-state implementation.
          contexts=sorted(set(a for k in ('REQ_GS_SIGNAL','START_GS_CASE','START_GS_IMPL') for a,_,_ in refs[k]))
          print('WORLDMAP_V20_AUTH_WIRING_CONTEXTS_BEGIN')
          for a in contexts:
            lo=max(0x400000,a-0x90);hi=a+0x130
            try:ins=list(md.disasm(raw[vo(lo):vo(hi)],lo))
            except Exception:continue
            print(f'CONTEXT_XREF=0x{a:x};RANGE=0x{lo:x}-0x{hi:x}')
            for x in ins:print(f'  0x{x.address:x} {x.mnemonic} {x.op_str}')
          print('WORLDMAP_V20_AUTH_WIRING_CONTEXTS_END')

          # Identify call sites to any QState::addTransition PLT entry and print only those near AUTH xrefs (±0x800).
          addrs={a for n,rows in plt.items() if n=='QState::addTransition' for a,_ in rows}
          adds=[a for a,d in calls if d in addrs]
          print('WORLDMAP_V20_QSTATE_ADDTRANSITION_CALLS='+','.join(hex(x) for x in adds))
          near=[]
          authx=[a for k in refs for a,_,_ in refs[k]]
          for a in adds:
            if any(abs(a-x)<=0x1000 for x in authx):near.append(a)
          print('WORLDMAP_V20_QSTATE_NEAR_AUTH='+','.join(hex(x) for x in near))
          print('WORLDMAP_V20_AUTH_TRANSITION_WIRING_STATIC=PASS')
          print('WORLDMAP_V20_CLIENT_EXECUTED=false')
          PY

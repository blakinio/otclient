name: Track A native character ABI recovery v15

on:
  push:
    branches:
      - runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
    paths:
      - .github/workflows/track-a-worldmap-character-abi-static-v15.yml

permissions:
  contents: read

jobs:
  recover:
    name: Exact-SHA character controller ABI recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client and disassemble character controller
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils curl python3-pyelftools
          r="$RUNNER_TEMP/abi"; mkdir -p "$r/bin" "$r/state" "$r/client"; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >"$r/wp.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o "$r/client/client.lzma"
          python3 - "$r/client/client.lzma" "$r/client/client" <<'PY'
          import hashlib,lzma,pathlib,sys
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); b=src.read_bytes(); q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          out.write_bytes(raw); out.chmod(0o700)
          PY
          c="$r/client/client"
          echo 'WORLDMAP_V15_CHARACTER_ABI_DISASSEMBLY_BEGIN'
          echo '--- onCharacterSelectionConfirmed / requestCharacterLogin region ---'
          objdump -d -C --start-address=0xd46f00 --stop-address=0xd47680 "$c"
          echo '--- CHARSEL qt_static_metacall ---'
          objdump -d -C --start-address=0xd46550 --stop-address=0xd46920 "$c"
          echo 'WORLDMAP_V15_CHARACTER_ABI_DISASSEMBLY_END'
          python3 - "$c" <<'PY'
          from pathlib import Path
          import subprocess,sys,re
          c=sys.argv[1]
          out=subprocess.check_output(['objdump','-d','-C','--start-address=0xd46f00','--stop-address=0xd47680',c],text=True,errors='replace')
          for va in ('d47130','d47300'):
            assert va in out, 'missing target '+va
          # Surface argument-register usage without claiming layout yet.
          lines=out.splitlines()
          for target in (0xd47130,0xd47300):
            block=[]; active=False
            for ln in lines:
              m=re.match(r'\s*([0-9a-f]+):',ln)
              if m:
                a=int(m.group(1),16)
                if a==target: active=True
                elif active and a>=target+0x280: break
              if active: block.append(ln)
            txt='\n'.join(block)
            regs=sorted(set(re.findall(r'%r(?:si|dx|cx|8|9)\b',txt)))
            print(f'WORLDMAP_V15_ABI_TARGET=0x{target:x};ARG_REG_USES={",".join(regs) or "NONE"};BLOCK_LINES={len(block)}')
          print('WORLDMAP_V15_CHARACTER_ABI_STATIC=PASS')
          print('WORLDMAP_V15_CLIENT_EXECUTED=false')
          PY

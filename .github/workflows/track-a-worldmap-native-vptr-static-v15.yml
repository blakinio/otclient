name: Track A native auth controller vptr recovery v15

on:
  push:
    branches:
      - runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
    paths:
      - .github/workflows/track-a-worldmap-native-vptr-static-v15.yml

permissions:
  contents: read

jobs:
  recover:
    name: Exact-SHA native controller vptr recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client and recover primary vptrs
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools
          r="$RUNNER_TEMP/vptr"; mkdir -p "$r/bin" "$r/state" "$r/client"; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >"$r/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o "$r/client/client.lzma"
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  '"$r"'/client/client.lzma' | sha256sum -c -
          python3 - "$r/client/client.lzma" "$r/client/client" <<'PY'
          import hashlib,lzma,pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          b=src.read_bytes();q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          out.write_bytes(raw)
          with out.open('rb') as fh:
            elf=ELFFile(fh); secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def offva(off):
            for n,o,z,v,fl in secs:
              if o<=off<o+z:return v+(off-o),n
            return None,None
          def vaoff(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v),n
            raise ValueError(hex(va))
          def mapped(va):return any(v<=va<v+z for _,_,z,v,_ in secs)
          def exe(va):return any((fl&4) and v<=va<v+z for _,_,z,v,fl in secs)
          def q64(va):return struct.unpack_from('<Q',raw,vaoff(va)[0])[0]
          def mangle(cls): return 'N'+''.join(str(len(x))+x for x in cls.split('::'))+'E'
          classes=[
            'tibia::authentication::TAuthenticationProcessController',
            'tibia::gamewindow::TCharacterSelectionController',
            'tibia::client::TGameClient',
            'tibia::authentication::TLoginRequestUploader',
          ]
          print('WORLDMAP_V15_VPTR_RECOVERY_BEGIN')
          all_rows={}
          for cls in classes:
            needle=mangle(cls).encode()+b'\0'; poss=[]; start=0
            while True:
              off=raw.find(needle,start)
              if off<0:break
              va,sec=offva(off); poss.append((va,sec)); start=off+1
            tis=[]
            for nameva,_ in poss:
              s=0; packed=struct.pack('<Q',nameva)
              while True:
                o=raw.find(packed,s)
                if o<0:break
                va,sec=offva(o)
                if va and o>=8:
                  tiv=va-8
                  try:
                    if mapped(q64(tiv)): tis.append((tiv,sec))
                  except: pass
                s=o+1
            cands=[]
            for ti,_ in sorted(set(tis)):
              s=0; packed=struct.pack('<Q',ti)
              while True:
                o=raw.find(packed,s)
                if o<0:break
                va,sec=offva(o)
                if va and o>=8:
                  hdr=va-8
                  try:
                    off_top=struct.unpack_from('<q',raw,vaoff(hdr)[0])[0]
                    first=q64(va+8); second=q64(va+16)
                    if off_top==0 and exe(first): cands.append((va+8,sec,first,second))
                  except: pass
                s=o+1
            uniq=[]; seen=set()
            for row in cands:
              if row[0] not in seen: seen.add(row[0]); uniq.append(row)
            print('CLASS='+cls)
            print('  NAME_VAS='+','.join(hex(x) for x,_ in poss if x))
            print('  TYPEINFO_VAS='+','.join(hex(x) for x,_ in sorted(set(tis))))
            print('  PRIMARY_VPTRS='+','.join(hex(x[0]) for x in uniq))
            for vp,sec,f0,f1 in uniq: print(f'  VPTR=0x{vp:x} SECTION={sec} FIRST=0x{f0:x} SECOND=0x{f1:x}')
            all_rows[cls]=uniq
          print('WORLDMAP_V15_VPTR_RECOVERY_END')
          for cls in classes:
            rows=all_rows[cls]
            if len(rows)!=1: raise SystemExit('WORLDMAP_V15_ERROR=primary_vptr_not_unique:'+cls+':'+str(len(rows)))
            print('WORLDMAP_V15_PRIMARY_VPTR_'+cls.split('::')[-1]+'='+hex(rows[0][0]))
          print('WORLDMAP_V15_STATIC_VPTR_PROVEN=PASS')
          print('WORLDMAP_V15_CLIENT_EXECUTED=false')
          print('WORLDMAP_V15_SECRET_USED=false')
          PY

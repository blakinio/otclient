name: Track A v18 const QList selection-view proof

on:
  push:
    branches:
      - runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
    paths:
      - .github/workflows/track-a-worldmap-qlist-const-view-static-v18.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client and prove input QList access contract
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pyelftools python3-capstone
          r="$RUNNER_TEMP/qv"; mkdir -p "$r/bin" "$r/state" "$r/client"; cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz' | sha256sum -c -
          mkdir x; tar -xzf wp.tgz -C x; cp "$(find x -type f -name wireproxy -print -quit)" wireproxy; chmod 755 wgcf wireproxy
          cd "$r/state"; "$r/bin/wgcf" register --accept-tos >/dev/null; "$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf" >w.conf
          nohup "$r/bin/wireproxy" -c w.conf >"$r/wp.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/trace" 2>/dev/null && break; sleep 2; done
          grep -Eq '^warp=(on|plus)$' "$r/trace"
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o "$r/client/client.lzma"
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  '"$r"'/client/client.lzma' | sha256sum -c -
          python3 - "$r/client/client.lzma" "$r/client/client" <<'PY'
          import hashlib,lzma,pathlib,sys,struct
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_MEM,X86_REG_R14,X86_REG_RSI
          src=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2]);b=src.read_bytes();q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          out.write_bytes(raw)
          with out.open('rb') as fh:
            elf=ELFFile(fh);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr']),int(s['sh_flags'])) for s in elf.iter_sections()]
          def vo(va):
            for n,o,z,v,fl in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError(hex(va))
          start=0x856550; end=0x85684e
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          ins=list(md.disasm(raw[vo(start):vo(end)],start))
          # Exact entry must bind incoming QList<int> const& from RSI to R14.
          entry=[(x.address,x.mnemonic,x.op_str) for x in ins[:8]]
          assert any(a==0x856554 and m=='mov' and 'rsi' in o and 'r14' in o for a,m,o in entry), entry
          refs=[]
          for x in ins:
            for op in x.operands:
              if op.type==X86_OP_MEM and op.mem.base==X86_REG_R14:
                refs.append((x.address,op.mem.disp,x.mnemonic,x.op_str))
          print('WORLDMAP_V18_CONST_QLIST_R14_REFS_BEGIN')
          for a,d,m,o in refs: print(f'0x{a:x};disp=0x{d:x};{m} {o}')
          print('WORLDMAP_V18_CONST_QLIST_R14_REFS_END')
          disps=[d for _,d,_,_ in refs]
          # The input list header/refcount at +0 is never read. Only pointer +8
          # and qsizetype +16 are observed before R14 is repurposed at 0x85684e.
          assert disps==[8,16], disps
          assert all(a<0x85684e for a,_,_,_ in refs)
          # QMeta wrapper method 11 is proven pass-through: argv[1] -> RSI -> impl.
          wrapper=raw[vo(0xd46900):vo(0xd4691b)]
          wins=list(md.disasm(wrapper,0xd46900))
          print('WORLDMAP_V18_QMETA11_WRAPPER_BEGIN')
          for x in wins: print(f'0x{x.address:x} {x.mnemonic} {x.op_str}')
          print('WORLDMAP_V18_QMETA11_WRAPPER_END')
          assert wins[0].mnemonic=='mov' and '[r12 + 8]' in wins[0].op_str and 'rsi' in wins[0].op_str
          assert wins[-1].mnemonic=='jmp' and '0x856550' in wins[-1].op_str
          print('WORLDMAP_V18_CONST_QLIST_OBSERVED_FIELDS=DATA_PTR,SIZE')
          print('WORLDMAP_V18_CONST_QLIST_HEADER_READ=false')
          print('WORLDMAP_V18_CONST_QLIST_CALLEE_OWNERSHIP=false')
          print('WORLDMAP_V18_CONST_QLIST_SELECTION_VIEW=PASS')
          print('WORLDMAP_V18_CLIENT_EXECUTED=false')
          print('WORLDMAP_V18_SECRET_USED=false')
          PY

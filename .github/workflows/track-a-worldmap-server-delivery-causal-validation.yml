name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  static-prelogin-behavioral-proof:
    name: Behavioral pre-login proof validation (no client)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate aggregate editable-field proof composition
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/track-a-worldmap-causal-screen-geometry-repair.py \
            .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            .github/scripts/track-a-worldmap-causal-xwd-classify.py \
            .github/scripts/track-a-worldmap-causal-xwd-compare.py \
            .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py \
            .github/scripts/tibia-official-client-re-xres-window-owner.py \
            .github/scripts/tibia-official-client-re-xres-wire.py
          python3 .github/scripts/track-a-worldmap-causal-xwd-classify.py self-test
          screen_repaired="$RUNNER_TEMP/worldmap-baseline-1020.sh"
          gdb_repaired="$RUNNER_TEMP/worldmap-baseline-1020-gdb.sh"
          combined="$RUNNER_TEMP/worldmap-baseline-1020-gdb-behavior.sh"
          python3 .github/scripts/track-a-worldmap-causal-screen-geometry-repair.py \
            .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh "$screen_repaired"
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            "$screen_repaired" "$gdb_repaired"
          python3 .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py \
            "$gdb_repaired" "$combined"
          bash -n "$combined"
          grep -F 'WORLDMAP_BASELINE_DESKTOP_GEOMETRY=1020x650' "$combined" >/dev/null
          grep -F 'WORLDMAP_BASELINE_UI_WINDOW_XRES_OWNER=MANIFEST_PROVEN' "$combined" >/dev/null
          grep -F 'WORLDMAP_BASELINE_LOGIN_FORM=PROVEN_EDITABLE_FIELDS' "$combined" >/dev/null
          grep -F 'track-a-worldmap-causal-xwd-compare.py' "$combined" >/dev/null
          grep -F 'WORLDMAP_BASELINE_EMAIL_FIELD_EDITABLE=PASS' "$combined" >/dev/null
          grep -F 'WORLDMAP_BASELINE_PASSWORD_FIELD_EDITABLE=PASS' "$combined" >/dev/null
          grep -F 'EMAIL_X=535' "$combined" >/dev/null
          grep -F 'EMAIL_Y=275' "$combined" >/dev/null
          grep -F 'PASS_X=535' "$combined" >/dev/null
          grep -F 'PASS_Y=304' "$combined" >/dev/null
          grep -F 'LOGIN_X=590' "$combined" >/dev/null
          grep -F 'LOGIN_Y=388' "$combined" >/dev/null
          grep -F 'ROW_X=285' "$combined" >/dev/null
          grep -F 'ROW_Y=193' "$combined" >/dev/null
          grep -F 'WORLDMAP_BASELINE_POST_LOGIN_VISUAL_TRANSITION=PROVEN_AGGREGATE' "$combined" >/dev/null
          grep -F 'WORLDMAP_BASELINE_CHARACTER_ROW_SELECTION=PROVEN_AGGREGATE' "$combined" >/dev/null
          if grep -F 'login_form_geometry_not_revalidated' "$combined"; then
            echo 'WORLDMAP_BEHAVIOR_STATIC_ERROR=obsolete_grayscale_login_gate_survived' >&2
            exit 1
          fi
          if grep -E 'tesseract|capture_ocr|LOGIN_OCR_ANCHORS|SELECT_TSV|PRE_TSV' "$combined"; then
            echo 'WORLDMAP_BEHAVIOR_STATIC_ERROR=ocr_surface_survived' >&2
            exit 1
          fi
          if grep -E '("\$XDOTOOL"|\$XDOTOOL|xdotool)[[:space:]]+search[[:space:]]+--onlyvisible[[:space:]]+--pid' "$combined"; then
            echo 'WORLDMAP_BEHAVIOR_STATIC_ERROR=legacy_pid_selector_executable_survived' >&2
            exit 1
          fi
          echo 'WORLDMAP_PRELOGIN_BEHAVIOR_STATIC=PASS'
          echo 'WORLDMAP_PRELOGIN_BEHAVIOR_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_PRELOGIN_BEHAVIOR_SECRET_USED=false'

name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation-no-client-hold
  cancel-in-progress: false

jobs:
  no-client-hold:
    name: No-client hold after pre-secret discriminator
    runs-on: ubuntu-latest
    steps:
      - name: Publish fail-closed hold
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'WORLDMAP_PRESECRET_HOLD=ACTIVE'
          echo 'WORLDMAP_PRESECRET_CAUSAL_DISCRIMINATOR=exact_window_xwd_geometry_pass_field_semantics_zero_candidates'
          echo 'WORLDMAP_PRESECRET_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_PRESECRET_SECRET_USED=false'
          echo 'WORLDMAP_PRESECRET_LOGIN_SUBMITTED=false'
          echo 'WORLDMAP_PRESECRET_LOGIN_BUDGET_CONSUMED=0'

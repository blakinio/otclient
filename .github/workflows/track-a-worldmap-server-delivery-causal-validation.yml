name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation-gdb-repair-login-v2
  cancel-in-progress: false

jobs:
  gated-baseline-login:
    name: Physical baseline / gdb-repaired gated_login_once
    if: >-
      github.event.pull_request.number == 475 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 10
    steps:
      - name: Manual exact PR checkout without external actions
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then
            git init
            git remote add origin https://github.com/blakinio/otclient.git
          fi
          git remote set-url origin https://github.com/blakinio/otclient.git
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/pull/475/merge:refs/remotes/pull/475/merge
          git checkout --detach --force refs/remotes/pull/475/merge
          echo "WORLDMAP_CHECKOUT_SHA=$(git rev-parse HEAD)"

      - name: Fresh admission and trusted-base fence
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          actual="$(git rev-parse refs/remotes/origin/main)"
          echo "WORLDMAP_LOGIN_MAIN_SHA=$actual"
          [[ "$actual" == c1adcf491580e28d40f215356a9e559af2ccadc4 ]] || exit 98
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          SIZE=51965216
          SHA='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          MARK=b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1'
          task=[]; clients=[]
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb',buffering=0) as f:
                  for block in iter(lambda:f.read(1<<20),b''): h.update(block)
              return h.hexdigest()
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try:
                  env=set((p/'environ').read_bytes().split(b'\0'))
                  cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
                  exe=Path(os.readlink(p/'exe')); st=exe.stat()
              except (OSError,PermissionError): continue
              if MARK in env: task.append(int(p.name))
              hinted='CipSoft GmbH/Tibia/packages/Tibia' in cmd or '/Tibia/packages/Tibia/' in str(exe)
              if hinted or st.st_size==SIZE:
                  try: sha=digest(exe)
                  except OSError:
                      if hinted: raise
                      continue
                  if hinted or (st.st_size==SIZE and sha==SHA): clients.append(int(p.name))
          task=sorted(set(task)); clients=sorted(set(clients))
          print('WORLDMAP_LOGIN_TASK_NAMESPACE_PROCESS_COUNT='+str(len(task)))
          print('WORLDMAP_LOGIN_OFFICIAL_CLIENT_CANDIDATE_COUNT='+str(len(clients)))
          if task or clients: raise SystemExit('WORLDMAP_LOGIN_ERROR=target_not_unique')
          print('WORLDMAP_LOGIN_TARGET_UNIQUENESS=PROVEN')
          PY

      - name: Apply reviewed GDB repair and prove pre-secret fields
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          source_helper=.github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh
          helper="$RUNNER_TEMP/worldmap-baseline-gdb-repaired.sh"
          control="$RUNNER_TEMP/worldmap-baseline-control"
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py "$source_helper" "$helper"
          bash -n "$helper"
          mkdir -p "$control"; chmod 700 "$control"
          rm -f "$control"/helper.pid "$control"/helper.log "$control"/presecret.ready \
            "$control"/credentials.fifo "$control"/result "$control"/result.* 2>/dev/null || true
          nohup setsid env -u RUNNER_TRACKING_ID -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
            bash "$helper" >"$control/helper.log" 2>&1 </dev/null &
          pid=$!
          printf '%s\n' "$pid" >"$control/helper.pid"; chmod 600 "$control/helper.pid" "$control/helper.log"
          ready=0
          for _ in $(seq 1 180); do
            if [[ -f "$control/result" ]]; then
              rc="$(tr -cd '0-9' <"$control/result")"
              cat "$control/helper.log"
              echo "WORLDMAP_PRESECRET_HELPER_EARLY_RESULT=${rc:-UNKNOWN}"
              exit "${rc:-98}"
            fi
            if [[ -f "$control/presecret.ready" && -p "$control/credentials.fifo" ]]; then ready=1; break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$control/helper.log"; exit 97; }
            sleep 1
          done
          [[ "$ready" == 1 ]] || { cat "$control/helper.log"; exit 96; }
          if grep -azq '^TIBIA_TEST_EMAIL=' "/proc/$pid/environ"; then exit 95; fi
          if grep -azq '^TIBIA_TEST_PASSWORD=' "/proc/$pid/environ"; then exit 94; fi
          grep -Fq 'WORLDMAP_BASELINE_GDB_ATTACH=PASS' "$control/helper.log"
          grep -Fq 'WORLDMAP_BASELINE_EMAIL_FIELD_EDITABLE=PASS' "$control/helper.log"
          grep -Fq 'WORLDMAP_BASELINE_PASSWORD_FIELD_EDITABLE=PASS' "$control/helper.log"
          grep -Fq 'WORLDMAP_BASELINE_LOGIN_FORM=PROVEN_EDITABLE_FIELDS' "$control/helper.log"
          grep -Fq 'WORLDMAP_BASELINE_PRESECRET_READY=true' "$control/helper.log"
          if grep -Fq 'WORLDMAP_BASELINE_LOGIN_SUBMITTED=true' "$control/helper.log"; then exit 93; fi
          echo 'WORLDMAP_PHYSICAL_PRESECRET_GATE=PASS'

      - name: Hand off credentials after proven editability gates
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          control="$RUNNER_TEMP/worldmap-baseline-control"
          pid="$(tr -cd '0-9' <"$control/helper.pid")"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]] && kill -0 "$pid"
          [[ -f "$control/presecret.ready" && -p "$control/credentials.fifo" ]]
          [[ -n "${TIBIA_TEST_EMAIL:-}" && -n "${TIBIA_TEST_PASSWORD:-}" ]] || exit 92
          exec 9>"$control/credentials.fifo"
          printf '%s\0%s\0' "$TIBIA_TEST_EMAIL" "$TIBIA_TEST_PASSWORD" >&9
          exec 9>&-
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          echo 'WORLDMAP_WORKFLOW_CREDENTIAL_HANDOFF=COMPLETE_AFTER_PRESECRET_GATE'
          done_flag=0
          for _ in $(seq 1 300); do
            [[ -f "$control/result" ]] && { done_flag=1; break; }
            sleep 1
          done
          [[ "$done_flag" == 1 ]] || { cat "$control/helper.log"; exit 91; }
          rc="$(tr -cd '0-9' <"$control/result")"
          cat "$control/helper.log"
          echo "WORLDMAP_BASELINE_HELPER_RESULT=${rc:-UNKNOWN}"
          [[ "${rc:-UNKNOWN}" == 0 ]] || exit "${rc:-90}"
          grep -Fq 'WORLDMAP_BASELINE_LOGIN_SUBMITTED=true' "$control/helper.log"
          grep -Fq 'WORLDMAP_BASELINE_PHYSICAL_CAPTURE=PASS' "$control/helper.log"
          grep -Fq 'WORLDMAP_BASELINE_ORIGINAL_SOURCE_REHASH=PASS' "$control/helper.log"
          grep -Fq 'WORLDMAP_BASELINE_CLEANUP=COMPLETE' "$control/helper.log"
          echo 'WORLDMAP_PHYSICAL_BASELINE_LOGIN_CAPTURE=PASS'

      - name: Exact task-owned cleanup
        if: always()
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          control="$RUNNER_TEMP/worldmap-baseline-control"
          if [[ -r "$control/helper.pid" ]]; then
            pid="$(tr -cd '0-9' <"$control/helper.pid")"
            if [[ "$pid" =~ ^[1-9][0-9]*$ ]] && kill -0 "$pid" 2>/dev/null; then
              kill -TERM "$pid" 2>/dev/null || true
              for _ in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep .25; done
            fi
          fi
          python3 - <<'PY'
          from pathlib import Path
          marker=b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1'
          found=[]
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try: fields=set((p/'environ').read_bytes().split(b'\0'))
              except OSError: continue
              if marker in fields: found.append(int(p.name))
          print('WORLDMAP_FINAL_NAMESPACE_PROCESS_COUNT='+str(len(found)))
          if found: raise SystemExit('WORLDMAP_BASELINE_ERROR=final_namespace_cleanup_incomplete')
          PY

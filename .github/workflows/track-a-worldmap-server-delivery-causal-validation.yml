name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  persistent-home-layout:
    name: Persistent Tibia HOME layout discriminator (no client)
    runs-on: [otclient, synology]
    timeout-minutes: 3
    steps:
      - name: Inspect symlink and package metadata only
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path

          roots=[Path('/home/runner/_work/_otclient_tibia_re_state/home'),Path('/work/_otclient_tibia_re_state/home')]
          home=next((p for p in roots if p.is_dir()),None)
          if home is None: raise SystemExit('WORLDMAP_HOME_LAYOUT_ERROR=persistent_home_missing')
          share=home/'.local/share/CipSoft GmbH/Tibia'
          link=share/'Tibia'
          meta=share/'launchermetadata.json'
          package=share/'packages/Tibia'
          client=package/'bin/client'
          if not link.is_symlink(): raise SystemExit('WORLDMAP_HOME_LAYOUT_ERROR=tibia_symlink_missing')
          raw=os.readlink(link)
          resolved=link.resolve(strict=False)
          print('WORLDMAP_HOME_LAYOUT_SYMLINK_RAW='+raw)
          print('WORLDMAP_HOME_LAYOUT_SYMLINK_RESOLVED='+str(resolved.relative_to(home) if resolved.is_relative_to(home) else resolved))
          print('WORLDMAP_HOME_LAYOUT_SYMLINK_TARGET_EXISTS='+str(resolved.exists()).lower())
          print('WORLDMAP_HOME_LAYOUT_PACKAGE_EXISTS='+str(package.is_dir()).lower())
          print('WORLDMAP_HOME_LAYOUT_CLIENT_EXISTS='+str(client.is_file()).lower())
          print('WORLDMAP_HOME_LAYOUT_SYMLINK_EQUALS_PACKAGE='+str(resolved==package.resolve()).lower())
          if meta.is_file():
              data=meta.read_bytes()
              print('WORLDMAP_HOME_LAYOUT_METADATA_SIZE='+str(len(data)))
              print('WORLDMAP_HOME_LAYOUT_METADATA_SHA256='+hashlib.sha256(data).hexdigest())
          else:
              raise SystemExit('WORLDMAP_HOME_LAYOUT_ERROR=launchermetadata_missing')
          if client.is_file():
              h=hashlib.sha256()
              with client.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              print('WORLDMAP_HOME_LAYOUT_CLIENT_SHA256='+h.hexdigest())
          print('WORLDMAP_HOME_LAYOUT_FILE_CONTENT_INTERPRETED=false')
          print('WORLDMAP_HOME_LAYOUT_CLIENT_EXECUTED=false')
          print('WORLDMAP_HOME_LAYOUT_SECRET_USED=false')
          PY

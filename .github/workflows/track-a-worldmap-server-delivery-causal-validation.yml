name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  text-semantics-static:
    name: Targeted text semantics validation (no client)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate no-secret transform composition
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/track-a-worldmap-causal-xwd-compare.py \
            .github/scripts/track-a-worldmap-causal-xwd-text-semantics.py \
            .github/scripts/track-a-worldmap-causal-xres-geometry-census-repair.py \
            .github/scripts/track-a-worldmap-causal-screen-geometry-repair.py \
            .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py \
            .github/scripts/track-a-worldmap-causal-prelogin-text-semantics-repair.py
          screen="$RUNNER_TEMP/wm-text-screen.sh"
          gdb="$RUNNER_TEMP/wm-text-gdb.sh"
          ui="$RUNNER_TEMP/wm-text-ui.sh"
          probe="$RUNNER_TEMP/wm-text-probe.sh"
          python3 .github/scripts/track-a-worldmap-causal-screen-geometry-repair.py \
            .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh "$screen"
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py "$screen" "$gdb"
          python3 .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py "$gdb" "$ui"
          python3 .github/scripts/track-a-worldmap-causal-prelogin-text-semantics-repair.py "$ui" "$probe"
          bash -n "$probe"
          grep -F 'WORLDMAP_PRELOGIN_TEXT_SEMANTICS_SECRET_ENV=ABSENT' "$probe" >/dev/null
          grep -F 'WORLDMAP_PRELOGIN_TEXT_SEMANTICS_TARGETS=tab2,tab3,tab5' "$probe" >/dev/null
          grep -F 'track-a-worldmap-causal-xwd-text-semantics.py' "$probe" >/dev/null
          grep -F "'abc'" "$probe" >/dev/null
          grep -F "'abcdefghijklm'" "$probe" >/dev/null
          grep -F 'WORLDMAP_PRELOGIN_TEXT_FIELD_CANDIDATE=' "$probe" >/dev/null
          if grep -F 'printf '\''%s'\'' "$TIBIA_TEST_EMAIL"' "$probe" || grep -F 'printf '\''%s'\'' "$TIBIA_TEST_PASSWORD"' "$probe"; then
            echo 'WORLDMAP_TEXT_STATIC_ERROR=credential_submission_survived' >&2
            exit 1
          fi
          if grep -F 'WORLDMAP_BASELINE_LOGIN_SUBMITTED=true' "$probe" || \
             grep -F 'WORLDMAP_BASELINE_CHARACTER_ACTIVATION_SENT=true' "$probe" || \
             grep -F 'WORLDMAP_BASELINE_RIGHT_SENT=true' "$probe" || \
             grep -F 'WORLDMAP_BASELINE_LEFT_SENT=true' "$probe"; then
            echo 'WORLDMAP_TEXT_STATIC_ERROR=login_or_gameplay_surface_survived' >&2
            exit 1
          fi
          echo 'WORLDMAP_TEXT_SEMANTICS_COMPOSITION=PASS'

      - name: Run positive and negative synthetic text controls
        shell: bash
        run: |
          set -Eeuo pipefail
          FIX="$RUNNER_TEMP/wm-text-fixtures"
          mkdir -p "$FIX"
          python3 - "$FIX" <<'PY'
          from pathlib import Path
          import struct,sys
          root=Path(sys.argv[1]); W,H=1020,650; stride=W*4
          h=[0]*25
          h[0]=101; h[1]=7; h[2]=2; h[3]=24; h[4]=W; h[5]=H; h[7]=0
          h[11]=32; h[12]=stride; h[14]=0xFF0000; h[15]=0x00FF00; h[16]=0x0000FF
          h[17]=8; h[18]=256; h[19]=0; h[20]=W; h[21]=H
          prefix=struct.pack('>25I',*h)+b'\0'
          def frame(name,rects=()):
              px=bytearray(stride*H)
              for x0,y0,x1,y1,v in rects:
                  for y in range(y0,y1):
                      for x in range(x0,x1):
                          o=(y*W+x)*4; px[o:o+3]=bytes((v,v,v))
              (root/name).write_bytes(prefix+px)
          blank=()
          short=((200,150,230,160,255),)
          long=((200,150,300,160,255),)
          wide=((100,150,800,160,255),)
          # positive
          for n in ('p0','p1','p2','pcs','pcl','p3'): frame(n,blank)
          frame('ps',short); frame('pl',long)
          # no-growth negative
          for n in ('n0','n1','n2','ncs','ncl','n3'): frame(n,blank)
          frame('ns',short); frame('nl',short)
          # too-wide negative
          for n in ('w0','w1','w2','wcs','wcl','w3'): frame(n,blank)
          frame('ws',short); frame('wl',wide)
          PY
          SEM=.github/scripts/track-a-worldmap-causal-xwd-text-semantics.py
          CMP=.github/scripts/track-a-worldmap-causal-xwd-compare.py
          python3 "$SEM" "$CMP" \
            "$FIX/p0" "$FIX/p1" "$FIX/p2" "$FIX/ps" "$FIX/pcs" "$FIX/pl" "$FIX/pcl" "$FIX/p3" \
            | tee "$FIX/positive.out"
          grep -F 'WORLDMAP_TEXT_SEMANTICS_FIELD=PASS' "$FIX/positive.out" >/dev/null
          grep -F 'WORLDMAP_TEXT_SEMANTICS_SHORT_BBOX=200,150,230,160' "$FIX/positive.out" >/dev/null
          grep -F 'WORLDMAP_TEXT_SEMANTICS_LONG_BBOX=200,150,300,160' "$FIX/positive.out" >/dev/null
          set +e
          python3 "$SEM" "$CMP" \
            "$FIX/n0" "$FIX/n1" "$FIX/n2" "$FIX/ns" "$FIX/ncs" "$FIX/nl" "$FIX/ncl" "$FIX/n3" \
            >"$FIX/nogrowth.out" 2>&1
          ng_rc=$?
          python3 "$SEM" "$CMP" \
            "$FIX/w0" "$FIX/w1" "$FIX/w2" "$FIX/ws" "$FIX/wcs" "$FIX/wl" "$FIX/wcl" "$FIX/w3" \
            >"$FIX/wide.out" 2>&1
          wide_rc=$?
          set -e
          [[ "$ng_rc" -eq 3 && "$wide_rc" -eq 3 ]]
          grep -F 'WORLDMAP_TEXT_SEMANTICS_FIELD=FAIL' "$FIX/nogrowth.out" >/dev/null
          grep -F 'WORLDMAP_TEXT_SEMANTICS_GROWTH_PIXELS=0' "$FIX/nogrowth.out" >/dev/null
          grep -F 'WORLDMAP_TEXT_SEMANTICS_FIELD=FAIL' "$FIX/wide.out" >/dev/null
          echo 'WORLDMAP_TEXT_SEMANTICS_SYNTHETIC_POSITIVE=PASS'
          echo 'WORLDMAP_TEXT_SEMANTICS_SYNTHETIC_NOGROWTH_NEGATIVE=PASS'
          echo 'WORLDMAP_TEXT_SEMANTICS_SYNTHETIC_WIDE_NEGATIVE=PASS'
          echo 'WORLDMAP_TEXT_SEMANTICS_STATIC_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_TEXT_SEMANTICS_STATIC_SECRET_USED=false'

name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  safety-hold:
    name: Worldmap causal safety hold after no-secret focus scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hold runtime while ambient-controlled discriminator is prepared
        run: |
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD=PASS'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_REASON=focus_scan_ambient_repaint_confounded'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_SECRET_USED=false'

name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  xwd-toolroot-preflight:
    name: XWD toolroot dynamic-link preflight (no client)
    runs-on: [otclient, synology]
    timeout-minutes: 3
    steps:
      - name: Validate XWD toolroot library closure without runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          TOOL=/home/runner/_work/_otclient_tibia_re_state/toolroot
          [[ -d "$TOOL" ]] || TOOL=/work/_otclient_tibia_re_state/toolroot
          [[ -d "$TOOL" ]] || { echo 'WORLDMAP_XWD_PREFLIGHT_ERROR=toolroot_missing' >&2; exit 1; }
          XWD="$(find "$TOOL" -xdev -type f -name xwd -perm -111 -print -quit 2>/dev/null || true)"
          [[ -x "$XWD" ]] || { echo 'WORLDMAP_XWD_PREFLIGHT_ERROR=xwd_missing' >&2; exit 1; }
          LIBS="$TOOL/usr/lib/x86_64-linux-gnu:$TOOL/lib/x86_64-linux-gnu"
          deps="$(LD_LIBRARY_PATH="$LIBS" ldd "$XWD")"
          if grep -F 'not found' <<<"$deps"; then
            echo 'WORLDMAP_XWD_PREFLIGHT_ERROR=dependency_not_found' >&2
            exit 1
          fi
          set +e
          probe="$(DISPLAY=:65535 LD_LIBRARY_PATH="$LIBS" "$XWD" -silent -root -out "$RUNNER_TEMP/worldmap-xwd-link-probe.xwd" 2>&1)"
          rc=$?
          set -e
          rm -f "$RUNNER_TEMP/worldmap-xwd-link-probe.xwd"
          if grep -Fq 'error while loading shared libraries' <<<"$probe"; then
            echo 'WORLDMAP_XWD_PREFLIGHT_ERROR=dynamic_loader_failure' >&2
            exit 1
          fi
          echo "WORLDMAP_XWD_PREFLIGHT_PROBE_RC=$rc"
          echo 'WORLDMAP_XWD_TOOLROOT_DYNAMIC_LINK=PASS'
          echo 'WORLDMAP_XWD_PREFLIGHT_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_XWD_PREFLIGHT_SECRET_USED=false'

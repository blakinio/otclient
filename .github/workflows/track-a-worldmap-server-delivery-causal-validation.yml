name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

jobs:
  validate-gdb-repair:
    name: Validate baseline GDB repair without physical runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compile and transform baseline harness
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .github/scripts/track-a-worldmap-causal-gdb-env-repair.py
          repaired="$RUNNER_TEMP/worldmap-baseline-repaired.sh"
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh \
            "$repaired"
          bash -n "$repaired"
          test -x "$repaired"
          test "$(grep -Fc 'LD_LIBRARY_PATH="$TOOL/usr/lib/x86_64-linux-gnu:$TOOL/lib/x86_64-linux-gnu"' "$repaired")" = 1
          grep -F 'WORLDMAP_BASELINE_GDB_ATTACH_DIAGNOSTIC_BEGIN' "$repaired" >/dev/null
          echo 'WORLDMAP_GDB_REPAIR_STATIC_VALIDATION=PASS'
          echo 'WORLDMAP_PHYSICAL_EXECUTION=false'

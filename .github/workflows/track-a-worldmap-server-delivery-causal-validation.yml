name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  inventory-only:
    name: Physical baseline / inventory_only
    if: >-
      github.event.pull_request.number == 475 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Re-admit isolated runtime inventory without client or secrets
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          SIZE = 51965216
          SHA = 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          TASK_MARK = b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1'
          task_owned = []
          candidates = []

          def digest(path):
              h = hashlib.sha256()
              with path.open('rb', buffering=0) as handle:
                  for block in iter(lambda: handle.read(1 << 20), b''):
                      h.update(block)
              return h.hexdigest()

          for entry in Path('/proc').iterdir():
              if not entry.name.isdigit():
                  continue
              pid = int(entry.name)
              try:
                  env = set((entry / 'environ').read_bytes().split(b'\0'))
                  cmd = (entry / 'cmdline').read_bytes().replace(b'\0', b' ').decode('utf-8', errors='replace')
                  exe = Path(os.readlink(entry / 'exe'))
                  stat = exe.stat()
              except (FileNotFoundError, ProcessLookupError):
                  continue
              except (OSError, PermissionError) as exc:
                  if 'CipSoft GmbH/Tibia/packages/Tibia' in cmd if 'cmd' in locals() else False:
                      raise RuntimeError('official_client_candidate_unverifiable') from exc
                  continue
              if TASK_MARK in env:
                  task_owned.append(pid)
              hinted = 'CipSoft GmbH/Tibia/packages/Tibia' in cmd or '/Tibia/packages/Tibia/' in str(exe)
              if hinted or stat.st_size == SIZE:
                  try:
                      sha = digest(exe)
                  except OSError as exc:
                      if hinted:
                          raise RuntimeError('official_client_candidate_unverifiable') from exc
                      continue
                  if hinted or (stat.st_size == SIZE and sha == SHA):
                      candidates.append(pid)

          task_owned = sorted(set(task_owned))
          candidates = sorted(set(candidates))
          print('WORLDMAP_ADMISSION_TASK_NAMESPACE_PROCESS_COUNT=' + str(len(task_owned)))
          print('WORLDMAP_ADMISSION_OFFICIAL_CLIENT_CANDIDATE_COUNT=' + str(len(candidates)))
          print('WORLDMAP_ADMISSION_CLIENT_EXECUTED=false')
          print('WORLDMAP_ADMISSION_SECRET_USED=false')
          if task_owned:
              raise SystemExit('WORLDMAP_ADMISSION_ERROR=task_namespace_not_unique')
          if candidates:
              raise SystemExit('WORLDMAP_ADMISSION_ERROR=official_client_candidate_present')
          print('WORLDMAP_ADMISSION_TARGET_UNIQUENESS=PROVEN')
          PY
          echo 'WORLDMAP_ADMISSION_INVENTORY_ONLY=PASS'

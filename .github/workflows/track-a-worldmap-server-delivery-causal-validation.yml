name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml
      - docs/agents/tasks/active/OTC-20260817-track-a-worldmap-server-delivery-causal-validation.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  failed-bootstrap-cleanup-audit:
    name: Verify failed canonical bootstrap rollback
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation' }}
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Revalidate Track A runtime admission
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$BASE_SHA" --expected-branch "$HEAD_BRANCH"
          echo 'WORLDMAP_CAUSAL_CLEANUP_ADMISSION_POLICY=PASS'

      - name: Verify controller state and task-owned bootstrap resources are clean
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import fcntl
          import json
          import os
          from pathlib import Path
          import time

          state = Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          lock = state / 'coordination.lock'
          lease_path = state / 'lease.json'
          reg = state / 'runtime-registration.json'
          session = state / 'session'
          task_state = Path('/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260817-track-a-worldmap-server-delivery-causal-validation')
          token = task_state / 'canonical-lease.token'

          if not lock.is_file():
              raise SystemExit('WORLDMAP_CAUSAL_CLEANUP_ERROR=coordination_lock_missing')

          fd = os.open(lock, os.O_RDONLY | getattr(os, 'O_NOATIME', 0))
          try:
              fcntl.flock(fd, fcntl.LOCK_SH)
              lease = json.loads(lease_path.read_text()) if lease_path.exists() else None
              if lease is None:
                  raise SystemExit('WORLDMAP_CAUSAL_CLEANUP_ERROR=lease_state_missing')
              public = {
                  'schema_version': lease.get('schema_version'),
                  'runtime_id': lease.get('runtime_id'),
                  'status': lease.get('status'),
                  'generation': lease.get('generation'),
                  'controller_task': lease.get('controller_task'),
                  'controller_session': lease.get('controller_session'),
                  'expired': bool(lease.get('status') == 'active' and isinstance(lease.get('expires_at'), int) and lease['expires_at'] <= int(time.time())),
              }
              print('WORLDMAP_CAUSAL_CLEANUP_LEASE=' + json.dumps(public, sort_keys=True, separators=(',', ':')))
              if public['generation'] != 8:
                  raise SystemExit('WORLDMAP_CAUSAL_CLEANUP_ERROR=unexpected_lease_generation')
              if public['status'] != 'released' or public['controller_task'] is not None or public['controller_session'] is not None:
                  raise SystemExit('WORLDMAP_CAUSAL_CLEANUP_ERROR=lease_not_released')
              if reg.exists():
                  raise SystemExit('WORLDMAP_CAUSAL_CLEANUP_ERROR=registration_survived_failed_bootstrap')
              if session.exists():
                  raise SystemExit('WORLDMAP_CAUSAL_CLEANUP_ERROR=session_root_survived_failed_bootstrap')
              if token.exists():
                  raise SystemExit('WORLDMAP_CAUSAL_CLEANUP_ERROR=lease_token_survived_failed_bootstrap')
          finally:
              try:
                  fcntl.flock(fd, fcntl.LOCK_UN)
              except OSError:
                  pass
              os.close(fd)

          # Narrow read-only orphan census: only processes explicitly marked as canonical Track A runtime.
          marked = []
          proc = Path('/proc')
          for child in proc.iterdir():
              if not child.name.isdigit():
                  continue
              envp = child / 'environ'
              try:
                  data = envp.read_bytes()
              except (OSError, PermissionError):
                  continue
              fields = set(data.split(b'\0'))
              if b'OTCLIENT_TIBIA_RE_TRACK=official-client-re' in fields and b'OTCLIENT_TIBIA_RE_CANONICAL_RUNTIME=1' in fields:
                  role = next((f.decode('utf-8', 'replace') for f in fields if f.startswith(b'OTCLIENT_TIBIA_RE_ROLE=')), 'role=unknown')
                  marked.append({'pid': int(child.name), 'role': role})
          print('WORLDMAP_CAUSAL_CLEANUP_MARKED_PROCESS_COUNT=' + str(len(marked)))
          if marked:
              print('WORLDMAP_CAUSAL_CLEANUP_MARKED_PROCESSES=' + json.dumps(marked, sort_keys=True, separators=(',', ':')))
              raise SystemExit('WORLDMAP_CAUSAL_CLEANUP_ERROR=canonical_marked_process_survived')

          print('WORLDMAP_CAUSAL_CLEANUP_REGISTRATION=ABSENT')
          print('WORLDMAP_CAUSAL_CLEANUP_SESSION_ROOT=ABSENT')
          print('WORLDMAP_CAUSAL_CLEANUP_TOKEN=ABSENT')
          print('WORLDMAP_CAUSAL_CLEANUP_ROLLBACK=PASS')
          PY

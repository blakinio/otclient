name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml
      - .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh
      - docs/agents/tasks/active/OTC-20260817-track-a-worldmap-server-delivery-causal-validation.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  ephemeral-baseline:
    name: Exact-client isolated baseline worldmap capture
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation' }}
    runs-on: [otclient, synology]
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Revalidate Track A runtime admission
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$BASE_SHA" --expected-branch "$HEAD_BRANCH"
          echo 'WORLDMAP_CAUSAL_EPHEMERAL_BASELINE_ADMISSION=PASS'

      - name: Require canonical controller plane to be idle without mutating it
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import fcntl, json, os, time
          from pathlib import Path

          state = Path('/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime')
          lock = state / 'coordination.lock'
          lease_path = state / 'lease.json'
          reg = state / 'runtime-registration.json'
          if not lock.is_file() or not lease_path.is_file():
              raise SystemExit('WORLDMAP_BASELINE_PREFLIGHT_ERROR=canonical_controller_metadata_missing')
          fd = os.open(lock, os.O_RDONLY | getattr(os, 'O_NOATIME', 0))
          try:
              fcntl.flock(fd, fcntl.LOCK_SH)
              lease = json.loads(lease_path.read_text())
              safe = {
                  'schema_version': lease.get('schema_version'),
                  'runtime_id': lease.get('runtime_id'),
                  'generation': lease.get('generation'),
                  'status': lease.get('status'),
                  'controller_task': lease.get('controller_task'),
                  'controller_session': lease.get('controller_session'),
                  'expired': bool(lease.get('status') == 'active' and isinstance(lease.get('expires_at'), int) and lease['expires_at'] <= int(time.time())),
              }
              print('WORLDMAP_BASELINE_CANONICAL_LEASE=' + json.dumps(safe, sort_keys=True, separators=(',', ':')))
              if safe['status'] != 'released' or safe['controller_task'] is not None or safe['controller_session'] is not None:
                  raise SystemExit('WORLDMAP_BASELINE_PREFLIGHT_ERROR=canonical_lease_not_idle')
              if reg.exists():
                  raise SystemExit('WORLDMAP_BASELINE_PREFLIGHT_ERROR=canonical_registration_present')
          finally:
              try: fcntl.flock(fd, fcntl.LOCK_UN)
              except OSError: pass
              os.close(fd)
          print('WORLDMAP_BASELINE_CANONICAL_REGISTRATION=ABSENT')
          print('WORLDMAP_BASELINE_CANONICAL_CONTROLLER_IDLE=PASS')
          PY

      - name: Execute one exact-client isolated baseline login and structural capture
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          chmod 700 .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh
          .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh

      - name: Upload privacy-safe structural baseline evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: worldmap-causal-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/worldmap-baseline-evidence
          if-no-files-found: error
          retention-days: 7

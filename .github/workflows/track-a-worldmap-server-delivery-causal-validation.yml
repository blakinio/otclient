name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-presecret-exact-window-xwd-v1
  cancel-in-progress: false

jobs:
  physical-presecret:
    name: Physical pre-secret exact-window XWD proof
    if: >-
      github.event.pull_request.number == 475 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - name: Exact merge checkout and one-shot arm fence
        shell: bash
        env:
          HEAD_BRANCH: runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
        run: |
          set +x
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then
            git init -q
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$HEAD_BRANCH:refs/remotes/origin/task-head" \
            "+refs/pull/475/merge:refs/remotes/pull/475/merge"
          git checkout -q -f --detach refs/remotes/pull/475/merge
          git clean -ffdx

          main_sha="$(git rev-parse refs/remotes/origin/main)"
          head_sha="$(git rev-parse refs/remotes/origin/task-head)"
          merge_sha="$(git rev-parse HEAD)"
          parent1="$(git rev-parse HEAD^1)"
          parent2="$(git rev-parse HEAD^2)"
          subject="$(git log -1 --format=%s "$head_sha")"
          echo "WORLDMAP_PRESECRET_CURRENT_MAIN=$main_sha"
          echo "WORLDMAP_PRESECRET_HEAD_SHA=$head_sha"
          echo "WORLDMAP_PRESECRET_MERGE_SHA=$merge_sha"
          [[ "$parent1" == "$main_sha" && "$parent2" == "$head_sha" ]] || exit 98
          [[ "$subject" == 'ci(track-a): arm presecret-only exact-window XWD proof' ]] || exit 97
          echo 'WORLDMAP_PRESECRET_CURRENT_MAIN_FENCE=PASS'
          echo 'WORLDMAP_PRESECRET_ONE_SHOT_ARM=PASS'

      - name: Fresh no-client inventory and target uniqueness
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          SIZE=51965216
          SHA='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          MARK=b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1'
          task=[]; clients=[]
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb',buffering=0) as f:
                  for block in iter(lambda:f.read(1<<20),b''): h.update(block)
              return h.hexdigest()
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try:
                  env=set((p/'environ').read_bytes().split(b'\0'))
                  cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
                  exe=Path(os.readlink(p/'exe')); st=exe.stat()
              except (OSError,PermissionError): continue
              if MARK in env: task.append(int(p.name))
              hinted='CipSoft GmbH/Tibia/packages/Tibia' in cmd or '/Tibia/packages/Tibia/' in str(exe)
              if hinted or st.st_size==SIZE:
                  try: sha=digest(exe)
                  except OSError:
                      if hinted: raise
                      continue
                  if hinted or (st.st_size==SIZE and sha==SHA): clients.append(int(p.name))
          task=sorted(set(task)); clients=sorted(set(clients))
          print('WORLDMAP_PRESECRET_TASK_NAMESPACE_PROCESS_COUNT='+str(len(task)))
          print('WORLDMAP_PRESECRET_OFFICIAL_CLIENT_CANDIDATE_COUNT='+str(len(clients)))
          if task or clients: raise SystemExit('WORLDMAP_PRESECRET_ERROR=target_not_unique')
          print('WORLDMAP_PRESECRET_TARGET_UNIQUENESS=PROVEN')
          PY

      - name: Compose fail-closed pre-secret helper
        id: compose
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          source_helper=.github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh
          gdb_helper="$RUNNER_TEMP/worldmap-presecret-gdb.sh"
          helper="$RUNNER_TEMP/worldmap-presecret-exact-window.sh"

          python3 -m py_compile \
            .github/scripts/track-a-worldmap-causal-xwd-compare.py \
            .github/scripts/track-a-worldmap-causal-ui-window.py \
            .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py \
            .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            .github/scripts/tibia-official-client-re-xres-window-owner.py \
            .github/scripts/tibia-official-client-re-xres-wire.py
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py "$source_helper" "$gdb_helper"
          python3 .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py "$gdb_helper" "$helper"
          bash -n "$helper"

          grep -Fq 'UI_WIN="$WIN"' "$helper"
          grep -Fq '"$XWD" -silent -id "$UI_WIN"' "$helper"
          grep -Fq 'WORLDMAP_BASELINE_XWD_CAPTURE_TARGET_EQUALS_RUNTIME_IDENTITY=true' "$helper"
          grep -Fq 'WORLDMAP_BASELINE_EMAIL_FIELD_EDITABLE=PASS' "$helper"
          grep -Fq 'WORLDMAP_BASELINE_PASSWORD_FIELD_EDITABLE=PASS' "$helper"
          grep -Fq 'WORLDMAP_BASELINE_PRESECRET_READY=true' "$helper"
          grep -Fq 'WORLDMAP_BASELINE_PRESECRET_ONLY_COMPLETE=true' "$helper"
          ! grep -Fq 'WORLDMAP_BASELINE_LOGIN_SUBMITTED=true' "$helper"
          ! grep -Fq '"$XWD" -root' "$helper"
          ! grep -Fq 'xrandr --output' "$helper"
          ! grep -Fq 'wmctrl -r' "$helper"

          python3 - "$RUNNER_TEMP/xwd-dynamic-shape.xwd" <<'PY'
          import struct,sys
          path=sys.argv[1]; width,height=17,9; stride=width*4
          header=[100,7,2,24,width,height,0,0,32,0,32,32,stride,4,
                  0xFF0000,0x00FF00,0x0000FF,8,256,0,width,height,0,0,0]
          open(path,'wb').write(struct.pack('>25I',*header)+bytes(stride*height))
          PY
          python3 .github/scripts/track-a-worldmap-causal-xwd-compare.py inspect \
            "$RUNNER_TEMP/xwd-dynamic-shape.xwd" --expected-width 17 --expected-height 9 \
            | grep -F 'WORLDMAP_XWD_GEOMETRY_MATCH=PASS'
          rm -f "$RUNNER_TEMP/xwd-dynamic-shape.xwd" "$gdb_helper"
          chmod 700 "$helper"
          echo "helper=$helper" >>"$GITHUB_OUTPUT"
          echo 'WORLDMAP_PRESECRET_STATIC_COMPOSITION=PASS'

      - name: Physical exact-window pre-secret proof
        shell: bash
        env:
          HELPER: ${{ steps.compose.outputs.helper }}
        run: |
          set +x
          set -Eeuo pipefail
          control="$RUNNER_TEMP/worldmap-baseline-control"
          mkdir -p "$control"; chmod 700 "$control"
          rm -f "$control"/helper.pid "$control"/helper.log "$control"/presecret.ready \
            "$control"/presecret.stop "$control"/credentials.fifo "$control"/result "$control"/result.* 2>/dev/null || true

          nohup setsid env -i \
            HOME="$HOME" PATH="$PATH" RUNNER_NAME="$RUNNER_NAME" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash "$HELPER" >"$control/helper.log" 2>&1 </dev/null &
          pid=$!
          printf '%s\n' "$pid" >"$control/helper.pid"
          chmod 600 "$control/helper.pid" "$control/helper.log"

          ready=0
          for _ in $(seq 1 1500); do
            if [[ -f "$control/result" ]]; then
              rc="$(tr -cd '0-9' <"$control/result")"
              cat "$control/helper.log"
              echo "WORLDMAP_PRESECRET_HELPER_EARLY_RESULT=${rc:-UNKNOWN}"
              exit "${rc:-95}"
            fi
            if [[ -f "$control/presecret.ready" && -p "$control/credentials.fifo" ]]; then ready=1; break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$control/helper.log"; exit 94; }
            sleep .5
          done
          [[ "$ready" == 1 ]] || { cat "$control/helper.log"; exit 93; }

          for marker in \
            'WORLDMAP_BASELINE_MANIFEST_FENCE=PASS' \
            'WORLDMAP_BASELINE_TARGET_UNIQUENESS=PROVEN' \
            'WORLDMAP_BASELINE_GDB_ATTACH=PASS' \
            'WORLDMAP_BASELINE_PRE_STORAGE_OBSERVER=ARMED' \
            'WORLDMAP_BASELINE_UI_WINDOW_XRES_OWNER=MANIFEST_PROVEN' \
            'WORLDMAP_BASELINE_UI_WINDOW_EQUALS_RUNTIME_IDENTITY=true' \
            'WORLDMAP_UI_EXACT_XRES_PID_MATCH=PASS' \
            'WORLDMAP_BASELINE_XWD_CAPTURE_TARGET_EQUALS_RUNTIME_IDENTITY=true' \
            'WORLDMAP_BASELINE_XWD_GEOMETRY_PROOF=PASS' \
            'WORLDMAP_BASELINE_EMAIL_FIELD_EDITABLE=PASS' \
            'WORLDMAP_BASELINE_PASSWORD_FIELD_EDITABLE=PASS' \
            'WORLDMAP_BASELINE_LOGIN_FORM=PROVEN_EDITABLE_FIELDS' \
            'WORLDMAP_BASELINE_PRESECRET_READY=true' \
            'WORLDMAP_BASELINE_PRESECRET_ONLY_COMPLETE=true'; do
            grep -Fq "$marker" "$control/helper.log" || { cat "$control/helper.log"; exit 91; }
          done
          ! grep -Fq 'WORLDMAP_BASELINE_LOGIN_SUBMITTED=true' "$control/helper.log"

          printf '%s\n' stop >"$control/presecret.stop"; chmod 600 "$control/presecret.stop"
          done_flag=0
          for _ in $(seq 1 240); do
            [[ -f "$control/result" ]] && { done_flag=1; break; }
            sleep .25
          done
          [[ "$done_flag" == 1 ]] || { cat "$control/helper.log"; exit 89; }
          rc="$(tr -cd '0-9' <"$control/result")"
          cat "$control/helper.log"
          echo "WORLDMAP_PRESECRET_HELPER_RESULT=${rc:-UNKNOWN}"
          [[ "${rc:-UNKNOWN}" == 0 ]] || exit "${rc:-88}"
          grep -Fq 'WORLDMAP_BASELINE_ORIGINAL_SOURCE_REHASH=PASS' "$control/helper.log"
          grep -Fq 'WORLDMAP_BASELINE_CLEANUP=COMPLETE' "$control/helper.log"
          echo 'WORLDMAP_PHYSICAL_PRESECRET_GATE=PASS'
          echo 'WORLDMAP_PRESECRET_LOGIN_SUBMITTED=false'
          echo 'WORLDMAP_PRESECRET_LOGIN_BUDGET_CONSUMED=0'

      - name: Exact task-owned cleanup fence
        if: always()
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          control="$RUNNER_TEMP/worldmap-baseline-control"
          if [[ -r "$control/helper.pid" ]]; then
            pid="$(tr -cd '0-9' <"$control/helper.pid")"
            if [[ "$pid" =~ ^[1-9][0-9]*$ ]] && kill -0 "$pid" 2>/dev/null; then
              printf '%s\n' stop >"$control/presecret.stop" 2>/dev/null || true
              chmod 600 "$control/presecret.stop" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
              for _ in $(seq 1 80); do kill -0 "$pid" 2>/dev/null || break; sleep .25; done
            fi
          fi
          python3 - <<'PY'
          from pathlib import Path
          marker=b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1'
          found=[]
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try: fields=set((p/'environ').read_bytes().split(b'\0'))
              except OSError: continue
              if marker in fields: found.append(int(p.name))
          print('WORLDMAP_FINAL_NAMESPACE_PROCESS_COUNT='+str(len(found)))
          if found: raise SystemExit('WORLDMAP_PRESECRET_ERROR=final_namespace_cleanup_incomplete')
          print('WORLDMAP_FINAL_CLEANUP_FENCE=PASS')
          PY

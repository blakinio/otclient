name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  repair-hold:
    name: Runtime repair hold — no physical execution
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm physical runtime is intentionally paused
        run: |
          echo 'WORLDMAP_CAUSAL_RUNTIME_REPAIR_HOLD=true'
          echo 'WORLDMAP_CAUSAL_PHYSICAL_EXECUTION=false'

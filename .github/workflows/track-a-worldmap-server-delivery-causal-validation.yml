name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation-inventory-v3
  cancel-in-progress: false

jobs:
  inventory-only:
    name: Physical baseline / post-failure inventory_only
    if: >-
      github.event.pull_request.number == 475 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 5
    steps:
      - name: Re-admit isolated runtime inventory without client or secrets
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          SIZE=51965216
          SHA='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          MARK=b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1'
          task=[]; clients=[]
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb',buffering=0) as f:
                  for block in iter(lambda:f.read(1<<20),b''): h.update(block)
              return h.hexdigest()
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try:
                  env=set((p/'environ').read_bytes().split(b'\0'))
                  cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
                  exe=Path(os.readlink(p/'exe')); st=exe.stat()
              except (OSError,PermissionError): continue
              if MARK in env: task.append(int(p.name))
              hinted='CipSoft GmbH/Tibia/packages/Tibia' in cmd or '/Tibia/packages/Tibia/' in str(exe)
              if hinted or st.st_size==SIZE:
                  try: sha=digest(exe)
                  except OSError:
                      if hinted: raise
                      continue
                  if hinted or (st.st_size==SIZE and sha==SHA): clients.append(int(p.name))
          task=sorted(set(task)); clients=sorted(set(clients))
          print('WORLDMAP_READMISSION_TASK_NAMESPACE_PROCESS_COUNT='+str(len(task)))
          print('WORLDMAP_READMISSION_OFFICIAL_CLIENT_CANDIDATE_COUNT='+str(len(clients)))
          print('WORLDMAP_READMISSION_CLIENT_EXECUTED=false')
          print('WORLDMAP_READMISSION_SECRET_USED=false')
          if task or clients: raise SystemExit('WORLDMAP_READMISSION_ERROR=target_not_unique')
          print('WORLDMAP_READMISSION_TARGET_UNIQUENESS=PROVEN')
          PY

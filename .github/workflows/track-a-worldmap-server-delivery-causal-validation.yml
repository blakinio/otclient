name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  normalized-xres-worker-static:
    name: Normalized XRes worker binding diagnostic (no client)
    runs-on: [otclient, synology]
    timeout-minutes: 4
    steps:
      - name: Checkout exact head without codeload action
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          git cat-file -e "$HEAD_SHA^{commit}"
          git checkout -q -f --detach "$HEAD_SHA"
          git clean -ffdx
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          echo 'WORLDMAP_XRES_BINDING_CHECKOUT=PASS'

      - name: Reproduce task-local worker composition without client or secrets
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/worldmap-xres-binding-static"
          STAGE="$ROOT/stage-worker.sh"
          WORKER="$ROOT/worker.sh"
          OWNER="$ROOT/tibia-official-client-re-xres-window-owner.py"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          cleanup() { rm -rf --one-file-system "$ROOT"; }
          trap cleanup EXIT INT TERM

          python3 - "$STAGE" <<'PY'
          from pathlib import Path
          import sys
          out=Path(sys.argv[1])
          src=Path('.github/scripts/tibia-official-client-re-canonical-live-session.sh').read_text()
          old='ROOT="$BASE/canonical-live-runtime"'
          new='ROOT="$BASE/tasks/OTC-20260817-track-a-worldmap-server-delivery-causal-validation/worldmap-xres-binding-static"'
          if src.count(old)!=1: raise SystemExit('WORLDMAP_XRES_BINDING_ERROR=root_anchor')
          src=src.replace(old,new,1)
          oldmark='OTCLIENT_TIBIA_RE_CANONICAL_RUNTIME=1'
          newmark='OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-xres-binding-static'
          if src.count(oldmark)<5: raise SystemExit('WORLDMAP_XRES_BINDING_ERROR=marker_anchor')
          src=src.replace(oldmark,newmark)
          oldscreen='-screen 0 1920x1080x24'
          if src.count(oldscreen)!=1: raise SystemExit('WORLDMAP_XRES_BINDING_ERROR=screen_anchor')
          src=src.replace(oldscreen,'-screen 0 1020x650x24',1)
          out.write_text(src); out.chmod(0o700)
          PY

          python3 - "$OWNER" <<'PY'
          from pathlib import Path
          import sys
          out=Path(sys.argv[1])
          src=Path('.github/scripts/tibia-official-client-re-xres-window-owner.py').read_text()
          for old,new in (('TARGET_WIDTH = 1920','TARGET_WIDTH = 1020'),('TARGET_HEIGHT = 1080','TARGET_HEIGHT = 650')):
              if src.count(old)!=1: raise SystemExit('WORLDMAP_XRES_BINDING_ERROR=owner_anchor:'+old)
              src=src.replace(old,new,1)
          out.write_text(src); out.chmod(0o600)
          PY

          python3 .github/scripts/tibia-official-client-re-canonical-xres-worker-adapter.py \
            "$STAGE" "$WORKER" \
            --owner-helper "$OWNER" \
            --wire-helper .github/scripts/tibia-official-client-re-xres-wire.py
          bash -n "$WORKER"
          grep -F -- '-screen 0 1020x650x24' "$WORKER" >/dev/null
          ! grep -F -- '-screen 0 1920x1080x24' "$WORKER" >/dev/null

          python3 - "$OWNER" <<'PY'
          import importlib.util,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          spec=importlib.util.spec_from_file_location('wm_owner_static',p)
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          print('WORLDMAP_XRES_BINDING_OWNER_WIDTH='+str(m.TARGET_WIDTH))
          print('WORLDMAP_XRES_BINDING_OWNER_HEIGHT='+str(m.TARGET_HEIGHT))
          if (m.TARGET_WIDTH,m.TARGET_HEIGHT)!=(1020,650): raise SystemExit('WORLDMAP_XRES_BINDING_ERROR=owner_constants')
          PY

          owner_abs="$(readlink -f "$OWNER")"
          grep -F -- "$owner_abs" "$WORKER" >/dev/null || {
            echo 'WORLDMAP_XRES_BINDING_ERROR=normalized_owner_path_not_embedded' >&2
            exit 1
          }
          if grep -F -- "$(readlink -f .github/scripts/tibia-official-client-re-xres-window-owner.py)" "$WORKER" >/dev/null; then
            echo 'WORLDMAP_XRES_BINDING_ERROR=repository_owner_path_embedded' >&2
            exit 1
          fi
          binding_line="$(grep -nF 'tibia-official-client-re-xres-window-owner.py' "$WORKER" | head -1 | cut -d: -f1)"
          [[ "$binding_line" =~ ^[1-9][0-9]*$ ]]
          echo "WORLDMAP_XRES_BINDING_WORKER_LINE=$binding_line"
          echo 'WORLDMAP_XRES_BINDING_NORMALIZED_OWNER_EMBEDDED=PASS'
          echo 'WORLDMAP_XRES_BINDING_NORMALIZED_SCREEN_EMBEDDED=PASS'
          echo 'WORLDMAP_XRES_BINDING_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_XRES_BINDING_SECRET_USED=false'

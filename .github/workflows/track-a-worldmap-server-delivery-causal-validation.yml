name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  xres-census-integration-static:
    name: XRes census worker integration (no client)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate census selector and composed baseline binding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/track-a-worldmap-causal-xres-geometry-census-repair.py \
            .github/scripts/track-a-worldmap-causal-screen-geometry-repair.py \
            .github/scripts/tibia-official-client-re-canonical-xres-worker-adapter.py

          tmp="$RUNNER_TEMP/worldmap-xres-census-integration"
          mkdir -p "$tmp"
          trap 'rm -rf "$tmp"' EXIT INT TERM

          owner="$tmp/tibia-official-client-re-xres-window-owner.py"
          python3 .github/scripts/track-a-worldmap-causal-xres-geometry-census-repair.py \
            .github/scripts/tibia-official-client-re-xres-window-owner.py "$owner"
          python3 -m py_compile "$owner"
          grep -F 'WORLDMAP_XRES_OWNED_VIEWABLE_COUNT=' "$owner" >/dev/null
          grep -F 'WORLDMAP_XRES_SELECTED_GEOMETRY=' "$owner" >/dev/null
          if grep -F 'and int(attr.width) == TARGET_WIDTH' "$owner" >/dev/null; then
            echo 'WORLDMAP_XRES_INTEGRATION_ERROR=legacy_width_constraint_survived' >&2
            exit 1
          fi
          if grep -F 'and int(attr.height) == TARGET_HEIGHT' "$owner" >/dev/null; then
            echo 'WORLDMAP_XRES_INTEGRATION_ERROR=legacy_height_constraint_survived' >&2
            exit 1
          fi

          screen="$tmp/screen-normalized-baseline.sh"
          python3 .github/scripts/track-a-worldmap-causal-screen-geometry-repair.py \
            .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh "$screen"
          bash -n "$screen"
          grep -F 'WORLDMAP_SCREEN_XRES_GEOMETRY_CENSUS_OWNER=PASS' "$screen" >/dev/null
          grep -F 'WORLDMAP_BASELINE_XRES_SELECTOR=EXACT_PID_UNIQUE_LARGEST_VIEWABLE' "$screen" >/dev/null
          grep -F 'track-a-worldmap-causal-xres-geometry-census-repair.py' "$screen" >/dev/null
          grep -F -- '--owner-helper "$OWNER_CENSUS"' "$screen" >/dev/null
          grep -F 'xres_census_owner_binding_missing' "$screen" >/dev/null
          grep -F 'rm -rf "$RUNNER_TEMP/worldmap-xres-owner-census"' "$screen" >/dev/null
          if grep -F 'OWNER_1020' "$screen" || grep -F 'TARGET_WIDTH = 1020' "$screen" || grep -F 'TARGET_HEIGHT = 650' "$screen"; then
            echo 'WORLDMAP_XRES_INTEGRATION_ERROR=legacy_geometry_fixed_owner_survived' >&2
            exit 1
          fi
          echo 'WORLDMAP_XRES_CENSUS_INTEGRATION_STATIC=PASS'
          echo 'WORLDMAP_XRES_CENSUS_INTEGRATION_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_XRES_CENSUS_INTEGRATION_SECRET_USED=false'

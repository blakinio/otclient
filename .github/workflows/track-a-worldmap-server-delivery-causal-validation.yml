name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  static-ui-window-repair:
    name: XRes 1020x650 UI-window repair validation (no client)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate XRes UI resolver and composed helper without runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            .github/scripts/track-a-worldmap-causal-xwd-classify.py \
            .github/scripts/track-a-worldmap-causal-ui-window.py \
            .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py \
            .github/scripts/tibia-official-client-re-xres-window-owner.py \
            .github/scripts/tibia-official-client-re-xres-wire.py
          python3 .github/scripts/track-a-worldmap-causal-ui-window.py --help >/dev/null
          python3 .github/scripts/track-a-worldmap-causal-xwd-classify.py self-test
          gdb_repaired="$RUNNER_TEMP/worldmap-baseline-gdb.sh"
          combined="$RUNNER_TEMP/worldmap-baseline-gdb-xwd.sh"
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh \
            "$gdb_repaired"
          python3 .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py \
            "$gdb_repaired" "$combined"
          bash -n "$combined"
          grep -F 'WORLDMAP_BASELINE_UI_WINDOW_XRES_OWNER=PROVEN' "$combined" >/dev/null
          grep -F 'WORLDMAP_BASELINE_UI_WINDOW_GEOMETRY=1020x650' "$combined" >/dev/null
          grep -F -- '--owner-helper "$UI_OWNER_HELPER" --wire-helper "$UI_WIRE_HELPER"' "$combined" >/dev/null
          grep -F 'LD_LIBRARY_PATH="$XWD_TOOLROOT_LIBS" "$XWD"' "$combined" >/dev/null
          if grep -E '("\$XDOTOOL"|\$XDOTOOL|xdotool)[[:space:]]+search[[:space:]]+--onlyvisible[[:space:]]+--pid' "$combined"; then
            echo 'WORLDMAP_UI_WINDOW_STATIC_ERROR=legacy_pid_selector_executable_survived' >&2
            exit 1
          fi
          if grep -E 'tesseract|capture_ocr|LOGIN_OCR_ANCHORS|SELECT_TSV|PRE_TSV' "$combined"; then
            echo 'WORLDMAP_UI_WINDOW_STATIC_ERROR=ocr_surface_survived' >&2
            exit 1
          fi
          echo 'WORLDMAP_UI_WINDOW_STATIC_REPAIR=PASS'
          echo 'WORLDMAP_UI_WINDOW_STATIC_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_UI_WINDOW_STATIC_SECRET_USED=false'

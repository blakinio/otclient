name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  safety-hold:
    name: Worldmap causal safety hold after pre-login field probe failure (no client)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hold physical runtime while fresh-screen interaction is discriminated
        run: |
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD=PASS'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_REASON=email_editable_probe_zero_change'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_GDB_ATTACH_LAST_PHYSICAL=PASS'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_LOGIN_SUBMITTED_LAST_PHYSICAL=false'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_SOURCE_REHASH_LAST_PHYSICAL=PASS'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_SECRET_USED=false'

name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  tibia-target-file-classifier:
    name: Persistent Tibia target file classifier (no client)
    runs-on: [otclient, synology]
    timeout-minutes: 3
    steps:
      - name: Classify target metadata without interpreting content
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path

          EXPECTED_SHA = 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          roots = [
              Path('/home/runner/_work/_otclient_tibia_re_state/home'),
              Path('/work/_otclient_tibia_re_state/home'),
          ]
          home = next((p for p in roots if p.is_dir()), None)
          if home is None:
              raise SystemExit('WORLDMAP_TARGET_CLASSIFIER_ERROR=home_missing')

          vendor = home / '.local/share/CipSoft GmbH'
          share = vendor / 'Tibia'
          link = share / 'Tibia'
          package_client = share / 'packages/Tibia/bin/client'
          if not link.is_symlink():
              raise SystemExit('WORLDMAP_TARGET_CLASSIFIER_ERROR=link_missing')
          if not package_client.is_file():
              raise SystemExit('WORLDMAP_TARGET_CLASSIFIER_ERROR=package_client_missing')

          target = link.resolve(strict=True)
          st = target.stat()
          if not stat.S_ISREG(st.st_mode):
              raise SystemExit('WORLDMAP_TARGET_CLASSIFIER_ERROR=target_not_regular_file')

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          target_sha = sha256(target)
          with target.open('rb') as f:
              magic = f.read(4).hex()

          def relative_or(path: Path, root: Path, fallback: str) -> str:
              try:
                  return str(path.relative_to(root))
              except ValueError:
                  return fallback

          raw = os.readlink(link)
          raw_path = Path(raw)
          home_rel = relative_or(target, home, 'OUTSIDE_HOME')
          vendor_rel = relative_or(target, vendor, 'OUTSIDE_VENDOR_ROOT')
          share_rel = relative_or(target, share, 'OUTSIDE_TIBIA_SHARE')
          package_rel = relative_or(target, share / 'packages/Tibia', 'OUTSIDE_PACKAGE')

          vendor_entries = []
          if vendor.is_dir():
              for p in sorted(vendor.iterdir(), key=lambda x: x.name):
                  try:
                      mode = p.lstat().st_mode
                  except OSError:
                      continue
                  kind = 'SYMLINK' if stat.S_ISLNK(mode) else 'DIR' if stat.S_ISDIR(mode) else 'FILE' if stat.S_ISREG(mode) else 'OTHER'
                  vendor_entries.append(kind + ':' + p.name)

          print('WORLDMAP_TARGET_RAW_LINK_IS_ABSOLUTE=' + str(raw_path.is_absolute()).lower())
          print('WORLDMAP_TARGET_BASENAME=' + target.name)
          print('WORLDMAP_TARGET_HOME_RELATIVE=' + home_rel)
          print('WORLDMAP_TARGET_VENDOR_RELATIVE=' + vendor_rel)
          print('WORLDMAP_TARGET_SHARE_RELATIVE=' + share_rel)
          print('WORLDMAP_TARGET_PACKAGE_RELATIVE=' + package_rel)
          print('WORLDMAP_TARGET_SIZE=' + str(st.st_size))
          print('WORLDMAP_TARGET_EXECUTABLE=' + str(bool(st.st_mode & 0o111)).lower())
          print('WORLDMAP_TARGET_MAGIC4_HEX=' + magic)
          print('WORLDMAP_TARGET_SHA256=' + target_sha)
          print('WORLDMAP_TARGET_SHA_MATCH_EXACT=' + str(target_sha == EXPECTED_SHA).lower())
          print('WORLDMAP_VENDOR_TOP=' + ','.join(vendor_entries))
          print('WORLDMAP_TARGET_FILE_EXECUTED=false')
          print('WORLDMAP_TARGET_CONTENT_INTERPRETED=false')
          print('WORLDMAP_TARGET_SECRET_USED=false')

          summary = ';'.join([
              'basename=' + target.name,
              'home_rel=' + home_rel,
              'vendor_rel=' + vendor_rel,
              'share_rel=' + share_rel,
              'package_rel=' + package_rel,
              'size=' + str(st.st_size),
              'executable=' + str(bool(st.st_mode & 0o111)).lower(),
              'magic4=' + magic,
              'sha256=' + target_sha,
              'target_exact=' + str(target_sha == EXPECTED_SHA).lower(),
              'vendor_top=' + ','.join(vendor_entries),
              'file_executed=false',
              'content_interpreted=false',
              'secret_used=false',
          ])
          print('::notice title=Tibia symlink target file::' + summary)
          PY

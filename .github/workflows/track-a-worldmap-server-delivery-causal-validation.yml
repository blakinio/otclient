name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  safety-hold:
    name: Hold after controlled no-secret focus census
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve run 32037418588 result without another client launch
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD=PASS'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_REASON=classify_controlled_focus_candidates_before_credentials'
          echo 'WORLDMAP_CAUSAL_LAST_CONTROLLED_SCAN_RUN=32037418588'
          echo 'WORLDMAP_CAUSAL_LAST_CONTROLLED_SCAN_JOB=95410518369'
          echo 'WORLDMAP_CAUSAL_LAST_CONTROLLED_SCAN_XRES_GEOMETRY=1020x650'
          echo 'WORLDMAP_CAUSAL_LAST_CONTROLLED_SCAN_CANDIDATES=tab2,tab3,tab5'
          echo 'WORLDMAP_CAUSAL_LAST_CONTROLLED_SCAN_SECRET_USED=false'
          echo 'WORLDMAP_CAUSAL_LAST_CONTROLLED_SCAN_LOGIN_SUBMITTED=false'
          echo 'WORLDMAP_CAUSAL_LAST_CONTROLLED_SCAN_CLIENT_CLEANUP=COMPLETE'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_SECRET_USED=false'

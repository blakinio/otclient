name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-presecret-v5-local-reprobe
  cancel-in-progress: false

env:
  HEAD_BRANCH: runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
  ARM_SUBJECT: 'ci(track-a): arm presecret v5 local re-probe'

jobs:
  physical-presecret-v5:
    name: Physical pre-secret v5 local ROI proof
    if: >-
      github.event.pull_request.number == 475 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'blakinio'
    runs-on: [otclient, synology]
    timeout-minutes: 20
    steps:
      - name: Exact current-main merge fence
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE"; cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init -q; git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"; fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$HEAD_BRANCH:refs/remotes/origin/task-head" \
            "+refs/pull/475/merge:refs/remotes/pull/475/merge"
          git checkout -q -f --detach refs/remotes/pull/475/merge
          git clean -ffdx
          main_sha="$(git rev-parse refs/remotes/origin/main)"; head_sha="$(git rev-parse refs/remotes/origin/task-head)"
          [[ "$(git rev-parse HEAD^1)" == "$main_sha" && "$(git rev-parse HEAD^2)" == "$head_sha" ]] || exit 98
          [[ "$(git log -1 --format=%s "$head_sha")" == "$ARM_SUBJECT" ]] || exit 97
          echo "WORLDMAP_V5_CURRENT_MAIN=$main_sha"
          echo "WORLDMAP_V5_HEAD_SHA=$head_sha"
          echo 'WORLDMAP_V5_CURRENT_MAIN_FENCE=PASS'

      - name: Fresh no-client inventory
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          SIZE=51965216; SHA='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          MARK=b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1'
          task=[];clients=[]
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb',buffering=0) as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try:
                  env=set((p/'environ').read_bytes().split(b'\0')); cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
                  exe=Path(os.readlink(p/'exe')); st=exe.stat()
              except (OSError,PermissionError): continue
              if MARK in env: task.append(int(p.name))
              hinted='CipSoft GmbH/Tibia/packages/Tibia' in cmd or '/Tibia/packages/Tibia/' in str(exe)
              if hinted or st.st_size==SIZE:
                  try: sha=digest(exe)
                  except OSError:
                      if hinted: raise
                      continue
                  if hinted or (st.st_size==SIZE and sha==SHA): clients.append(int(p.name))
          task=sorted(set(task)); clients=sorted(set(clients))
          print('WORLDMAP_V5_TASK_NAMESPACE_PROCESS_COUNT='+str(len(task)))
          print('WORLDMAP_V5_OFFICIAL_CLIENT_CANDIDATE_COUNT='+str(len(clients)))
          if task or clients: raise SystemExit('WORLDMAP_V5_ERROR=target_not_unique')
          print('WORLDMAP_V5_TARGET_UNIQUENESS=PROVEN')
          PY

      - name: Compose v5 exact-window helper
        id: compose
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py \
            .github/scripts/track-a-worldmap-causal-ui-field-discriminator-v3-repair.py \
            .github/scripts/track-a-worldmap-causal-ui-field-discriminator-v4-repair.py \
            .github/scripts/track-a-worldmap-causal-ui-field-final-roi-v5-repair.py \
            .github/scripts/track-a-worldmap-causal-xwd-compare.py \
            .github/scripts/track-a-worldmap-causal-ui-window.py \
            .github/scripts/tibia-official-client-re-xres-window-owner.py \
            .github/scripts/tibia-official-client-re-xres-wire.py
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh "$RUNNER_TEMP/v5-gdb.sh"
          python3 .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py "$RUNNER_TEMP/v5-gdb.sh" "$RUNNER_TEMP/v5-v2.sh"
          python3 .github/scripts/track-a-worldmap-causal-ui-field-discriminator-v3-repair.py "$RUNNER_TEMP/v5-v2.sh" "$RUNNER_TEMP/v5-v3.sh"
          python3 .github/scripts/track-a-worldmap-causal-ui-field-discriminator-v4-repair.py "$RUNNER_TEMP/v5-v3.sh" "$RUNNER_TEMP/v5-v4.sh"
          python3 .github/scripts/track-a-worldmap-causal-ui-field-final-roi-v5-repair.py "$RUNNER_TEMP/v5-v4.sh" "$RUNNER_TEMP/v5.sh"
          bash -n "$RUNNER_TEMP/v5.sh"
          grep -Fq 'UI_WIN="$WIN"' "$RUNNER_TEMP/v5.sh"
          grep -Fq 'TAB_CONTROLLED_EDITABILITY_PLUS_ROI_ECHO_V4' "$RUNNER_TEMP/v5.sh"
          grep -Fq 'WORLDMAP_V5_FINAL_ROI_EDITABLE_PROBE=' "$RUNNER_TEMP/v5.sh"
          grep -Fq 'WORLDMAP_BASELINE_EMAIL_FIELD_EDITABLE=PASS' "$RUNNER_TEMP/v5.sh"
          grep -Fq 'WORLDMAP_BASELINE_PASSWORD_FIELD_EDITABLE=PASS' "$RUNNER_TEMP/v5.sh"
          grep -Fq 'WORLDMAP_BASELINE_PRESECRET_READY=true' "$RUNNER_TEMP/v5.sh"
          ! grep -Fq 'WORLDMAP_BASELINE_LOGIN_SUBMITTED=true' "$RUNNER_TEMP/v5.sh"
          ! grep -Fq '"$XWD" -root' "$RUNNER_TEMP/v5.sh"
          ! grep -Fq 'xrandr --output' "$RUNNER_TEMP/v5.sh"
          ! grep -Fq 'wmctrl -r' "$RUNNER_TEMP/v5.sh"
          chmod 700 "$RUNNER_TEMP/v5.sh"
          echo "helper=$RUNNER_TEMP/v5.sh" >>"$GITHUB_OUTPUT"
          echo 'WORLDMAP_V5_STATIC_COMPOSITION=PASS'

      - name: Physical exact-window v5 pre-secret proof
        shell: bash
        env:
          HELPER: ${{ steps.compose.outputs.helper }}
        run: |
          set +x
          set -Eeuo pipefail
          control="$RUNNER_TEMP/worldmap-baseline-control"
          mkdir -p "$control"; chmod 700 "$control"
          rm -f "$control"/helper.pid "$control"/helper.log "$control"/presecret.ready "$control"/presecret.stop "$control"/credentials.fifo "$control"/result "$control"/result.* 2>/dev/null || true
          nohup setsid env -i HOME="$HOME" PATH="$PATH" RUNNER_NAME="$RUNNER_NAME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash "$HELPER" >"$control/helper.log" 2>&1 </dev/null &
          pid=$!; printf '%s\n' "$pid" >"$control/helper.pid"; chmod 600 "$control/helper.pid" "$control/helper.log"
          ready=0
          for _ in $(seq 1 1800); do
            if [[ -f "$control/result" ]]; then rc="$(tr -cd '0-9' <"$control/result")"; cat "$control/helper.log"; echo "WORLDMAP_V5_HELPER_EARLY_RESULT=${rc:-UNKNOWN}"; exit "${rc:-95}"; fi
            if [[ -f "$control/presecret.ready" && -p "$control/credentials.fifo" ]]; then ready=1; break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$control/helper.log"; exit 94; }
            sleep .5
          done
          [[ "$ready" == 1 ]] || { cat "$control/helper.log"; exit 93; }
          for marker in \
            'WORLDMAP_BASELINE_MANIFEST_FENCE=PASS' \
            'WORLDMAP_BASELINE_TARGET_UNIQUENESS=PROVEN' \
            'WORLDMAP_BASELINE_GDB_ATTACH=PASS' \
            'WORLDMAP_BASELINE_PRE_STORAGE_OBSERVER=ARMED' \
            'WORLDMAP_BASELINE_UI_WINDOW_XRES_OWNER=MANIFEST_PROVEN' \
            'WORLDMAP_BASELINE_UI_WINDOW_EQUALS_RUNTIME_IDENTITY=true' \
            'WORLDMAP_UI_EXACT_XRES_PID_MATCH=PASS' \
            'WORLDMAP_BASELINE_XWD_CAPTURE_TARGET_EQUALS_RUNTIME_IDENTITY=true' \
            'WORLDMAP_BASELINE_XWD_GEOMETRY_PROOF=PASS' \
            'WORLDMAP_BASELINE_EMAIL_FIELD_EDITABLE=PASS' \
            'WORLDMAP_BASELINE_PASSWORD_FIELD_EDITABLE=PASS' \
            'WORLDMAP_BASELINE_LOGIN_FORM=PROVEN_EDITABLE_FIELDS' \
            'WORLDMAP_BASELINE_PRESECRET_READY=true' \
            'WORLDMAP_BASELINE_PRESECRET_ONLY_COMPLETE=true'; do
            grep -Fq "$marker" "$control/helper.log" || { cat "$control/helper.log"; exit 91; }
          done
          ! grep -Fq 'WORLDMAP_BASELINE_LOGIN_SUBMITTED=true' "$control/helper.log"
          cat "$control/helper.log"
          echo 'WORLDMAP_PHYSICAL_PRESECRET_V5_GATE=PASS'
          echo 'WORLDMAP_V5_LOGIN_SUBMITTED=false'
          echo 'WORLDMAP_V5_LOGIN_BUDGET_CONSUMED=0'
          printf '%s\n' stop >"$control/presecret.stop"; chmod 600 "$control/presecret.stop"
          for _ in $(seq 1 240); do [[ -f "$control/result" ]] && break; sleep .25; done
          [[ -f "$control/result" && "$(tr -cd '0-9' <"$control/result")" == 0 ]]
          grep -Fq 'WORLDMAP_BASELINE_ORIGINAL_SOURCE_REHASH=PASS' "$control/helper.log"
          grep -Fq 'WORLDMAP_BASELINE_CLEANUP=COMPLETE' "$control/helper.log"

      - name: Exact task-owned cleanup fence
        if: always()
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          control="$RUNNER_TEMP/worldmap-baseline-control"
          if [[ -r "$control/helper.pid" ]]; then
            pid="$(tr -cd '0-9' <"$control/helper.pid")"
            if [[ "$pid" =~ ^[1-9][0-9]*$ ]] && kill -0 "$pid" 2>/dev/null; then printf '%s\n' stop >"$control/presecret.stop" 2>/dev/null || true; kill -TERM "$pid" 2>/dev/null || true; fi
          fi
          python3 - <<'PY'
          from pathlib import Path
          marker=b'OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1'; found=[]
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try: fields=set((p/'environ').read_bytes().split(b'\0'))
              except OSError: continue
              if marker in fields: found.append(int(p.name))
          print('WORLDMAP_FINAL_NAMESPACE_PROCESS_COUNT='+str(len(found)))
          if found: raise SystemExit('WORLDMAP_V5_ERROR=final_namespace_cleanup_incomplete')
          print('WORLDMAP_FINAL_CLEANUP_FENCE=PASS')
          PY

name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: write

concurrency:
  group: track-a-worldmap-v11-authority-checkpoint
  cancel-in-progress: false

env:
  HEAD_BRANCH: runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
  ARM_SUBJECT: 'ci(track-a): checkpoint v11 login authority'
  TASK_PATH: docs/agents/tasks/active/OTC-20260817-track-a-worldmap-server-delivery-causal-validation.md

jobs:
  checkpoint-v11-authority:
    name: Checkpoint v11 owner authority without client execution
    runs-on: ubuntu-latest
    steps:
      - name: Update durable task authority and v10 discriminator
        shell: bash
        run: |
          set -Eeuo pipefail
          git init -q "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin "+refs/heads/$HEAD_BRANCH:refs/remotes/origin/task-head"
          git checkout -q -B "$HEAD_BRANCH" refs/remotes/origin/task-head
          [[ "$(git log -1 --format=%s)" == "$ARM_SUBJECT" ]]
          python3 - "$TASK_PATH" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          reps={
            'session_id: chatgpt-worldmap-server-delivery-causal-20260817-v9':'session_id: chatgpt-worldmap-server-delivery-causal-20260817-v11',
            'phase: baseline_auth_submit_button_v9_world_entry_screenshot':'phase: baseline_downstream_auth_state_v11_world_entry_screenshot',
            'updated: 2026-08-17T21:49:00+02:00':'updated: 2026-08-17T22:18:00+02:00',
            'owner_authorization_text: "dokoncz zadanie i potwierdz wejscia do swiata gry na mape sascreenem"':'owner_authorization_text: "dokoncz zadanie i potwierdz wejscia do swiata gry na mape sascreenem"; reaffirmed "wykonaj"',
            'owner_authorization_scope: exactly one additional sequential real baseline login attempt to repair the proven v7 auth-submit discriminator, complete structural world entry, and persist one cropped map-only screenshot after structural IN_GAME; no parallel session and no screenshot before IN_GAME':'owner_authorization_scope: one additional sequential real baseline login attempt for v11 after v10 consumed the third attempt; v11 must use the press-proven Login control, secret-safe field occupancy proof, downstream native auth-state acceptance, structural world entry, and one post-IN_GAME cropped map screenshot; no parallel session',
            'baseline_ephemeral_client_launches_consumed: 16':'baseline_ephemeral_client_launches_consumed: 19',
            'baseline_ephemeral_login_max: 3':'baseline_ephemeral_login_max: 4',
            'baseline_ephemeral_login_consumed: 2':'baseline_ephemeral_login_consumed: 3',
            'last_progress_at: 2026-08-17T21:49:00+02:00':'last_progress_at: 2026-08-17T22:18:00+02:00',
            'ci_check_generation: v9_auth_submit_button_native_state_and_screenshot':'ci_check_generation: v11_downstream_auth_state_and_screenshot',
            'baseline_login_max: 3':'baseline_login_max: 4',
            'baseline_login_consumed: 2':'baseline_login_consumed: 3',
          }
          for old,new in reps.items():
              if old not in s: raise SystemExit('TASK_AUTHORITY_ANCHOR_MISSING:'+old)
              s=s.replace(old,new,1)
          anchor='third_baseline_login_attempt_authorized: true\n'
          if anchor not in s: raise SystemExit('THIRD_AUTH_ANCHOR_MISSING')
          s=s.replace(anchor,anchor+'fourth_baseline_login_attempt_authorized: true\n',1)
          add='''

# V10 physical discriminator and V11 authority

V10 run `32064354985`, physical rerun job `95493198150`, preserved the exact XID/VNC contract and passed the complete pre-secret gate. A reversible press-cancel scan physically found a local button control:

```text
WORLDMAP_V10_FIELD_DERIVED_TRANSLATION=400,215
WORLDMAP_V10_PREDICTED_LOGIN_TARGET=990,603
WORLDMAP_V10_PRESS_CANCEL=PASS
WORLDMAP_V10_PRESS_BBOX=998,593,1084,613
WORLDMAP_V10_LOGIN_BUTTON_TARGET=1030,603
WORLDMAP_V10_PRESECRET_LOGIN_BUTTON=PROVEN_PRESS_CANCEL
```

Protected credentials were then handed through the gated FIFO and the third real baseline submission was emitted, consuming `3/3`. The generation failed only because the v10 auth gate required one specific uploader-success event:

```text
WORLDMAP_BASELINE_LOGIN_SUBMISSION_METHOD=PRESS_CANCEL_PROVEN_BUTTON_CLICK
WORLDMAP_BASELINE_LOGIN_SUBMITTED=true
WORLDMAP_BASELINE_ERROR=native_account_login_uploader_success_not_observed
WORLDMAP_BASELINE_ORIGINAL_SOURCE_REHASH=PASS
WORLDMAP_BASELINE_CLEANUP=COMPLETE
WORLDMAP_FINAL_NAMESPACE_PROCESS_COUNT=0
```

V11 is materially different: it centers the click on the physically observed pressed-state bbox, proves both credential fields are visibly occupied without reading/persisting their contents, and accepts the stronger downstream native auth state (`ShowCharacterSelection`) even if the uploader-success or LoginFinished instrumentation is not observed on that legitimate route. It also emits only safe event counts on failure.

The owner's latest `wykonaj` is recorded as authority for exactly one additional sequential v11 baseline login. Thus:

```yaml
baseline_ephemeral_login_max: 4
baseline_ephemeral_login_consumed: 3
fourth_baseline_login_attempt_authorized: true
```

No parallel session is authorized. Screenshot authority remains map-only and post-structural-IN_GAME.
'''
          s += add
          p.write_text(s)
          print('WORLDMAP_V11_TASK_AUTHORITY_EDIT=PASS')
          PY
          grep -Fq 'baseline_ephemeral_login_max: 4' "$TASK_PATH"
          grep -Fq 'baseline_ephemeral_login_consumed: 3' "$TASK_PATH"
          grep -Fq 'fourth_baseline_login_attempt_authorized: true' "$TASK_PATH"
          grep -Fq 'WORLDMAP_V10_PRESS_BBOX=998,593,1084,613' "$TASK_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TASK_PATH"
          git commit -m 'task(track-a): authorize v11 downstream auth discriminator'
          git push origin HEAD:"$HEAD_BRANCH"
          echo 'WORLDMAP_V11_AUTHORITY_CHECKPOINT=PASS'
          echo 'WORLDMAP_V11_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_V11_SECRET_USED=false'

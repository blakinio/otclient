name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation-terminal-baseline-hold
  cancel-in-progress: false

jobs:
  no-client-hold:
    name: Terminal no-client hold after consumed baseline login
    runs-on: ubuntu-latest
    steps:
      - name: Publish fail-closed terminal baseline state
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'WORLDMAP_BASELINE_HOLD=ACTIVE'
          echo 'WORLDMAP_BASELINE_LOGIN_BUDGET_CONSUMED=1'
          echo 'WORLDMAP_BASELINE_LOGIN_RETRY_ALLOWED=false'
          echo 'WORLDMAP_BASELINE_LAST_CHARACTER_SELECTION_TRANSITION=PROVEN_AGGREGATE'
          echo 'WORLDMAP_BASELINE_LAST_STRUCTURAL_IN_GAME=NOT_PROVEN'
          echo 'WORLDMAP_BASELINE_TERMINAL_DISCRIMINATOR=character_row_interaction_not_observed_after_consumed_login'
          echo 'WORLDMAP_BASELINE_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_BASELINE_SECRET_USED=false'

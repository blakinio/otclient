name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  safety-hold:
    name: Hold after same-launch adaptive field scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve adaptive result before HOME layout discriminator
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD=PASS'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_REASON=no_text_fields_on_fresh_ephemeral_startup_surface'
          echo 'WORLDMAP_CAUSAL_LAST_ADAPTIVE_RUN=32038436466'
          echo 'WORLDMAP_CAUSAL_LAST_ADAPTIVE_JOB=95413316245'
          echo 'WORLDMAP_CAUSAL_LAST_ADAPTIVE_TEXT_FIELD_COUNT=0'
          echo 'WORLDMAP_CAUSAL_LAST_ADAPTIVE_MASKED_LIKE_COUNT=0'
          echo 'WORLDMAP_CAUSAL_LAST_ADAPTIVE_UNMASKED_LIKE_COUNT=0'
          echo 'WORLDMAP_CAUSAL_LAST_ADAPTIVE_SECRET_USED=false'
          echo 'WORLDMAP_CAUSAL_LAST_ADAPTIVE_LOGIN_SUBMITTED=false'
          echo 'WORLDMAP_CAUSAL_NEXT_DISCRIMINATOR=persistent_home_tibia_symlink_layout'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_SECRET_USED=false'

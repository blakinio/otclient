name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  symlink-target-layout:
    name: Persistent Tibia symlink target layout (no client)
    runs-on: [otclient, synology]
    timeout-minutes: 3
    steps:
      - name: Compare symlink target and package metadata only
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, os, stat
          from pathlib import Path
          roots=[Path('/home/runner/_work/_otclient_tibia_re_state/home'),Path('/work/_otclient_tibia_re_state/home')]
          home=next((p for p in roots if p.is_dir()),None)
          if home is None: raise SystemExit('WORLDMAP_SYMLINK_LAYOUT_ERROR=home_missing')
          share=home/'.local/share/CipSoft GmbH/Tibia'
          link=share/'Tibia'; package=share/'packages/Tibia'
          if not link.is_symlink(): raise SystemExit('WORLDMAP_SYMLINK_LAYOUT_ERROR=link_missing')
          target=link.resolve()
          if not target.exists(): raise SystemExit('WORLDMAP_SYMLINK_LAYOUT_ERROR=target_missing')
          def kind(p):
              m=p.lstat().st_mode
              return 'DIR' if stat.S_ISDIR(m) else 'FILE' if stat.S_ISREG(m) else 'SYMLINK' if stat.S_ISLNK(m) else 'OTHER'
          def top(root):
              out=[]
              if root.is_dir():
                  for p in sorted(root.iterdir(),key=lambda x:x.name):
                      try: out.append((p.name,kind(p),p.lstat().st_size))
                      except OSError: pass
              return out
          print('WORLDMAP_SYMLINK_TARGET_KIND='+kind(target))
          print('WORLDMAP_SYMLINK_PACKAGE_KIND='+kind(package))
          for name,k,size in top(target): print(f'WORLDMAP_SYMLINK_TARGET_TOP={k}\t{name}\t{size}')
          for name,k,size in top(package): print(f'WORLDMAP_SYMLINK_PACKAGE_TOP={k}\t{name}\t{size}')
          for label,root in [('TARGET',target),('PACKAGE',package)]:
              candidates=[root/'bin/client',root/'client']
              c=next((p for p in candidates if p.is_file()),None)
              print(f'WORLDMAP_SYMLINK_{label}_CLIENT_PATH='+('NONE' if c is None else str(c.relative_to(root))))
              if c:
                  h=hashlib.sha256()
                  with c.open('rb') as f:
                      for ch in iter(lambda:f.read(1024*1024),b''): h.update(ch)
                  print(f'WORLDMAP_SYMLINK_{label}_CLIENT_SHA256='+h.hexdigest())
          print('WORLDMAP_SYMLINK_TARGET_SAMEFILE_PACKAGE='+str(os.path.samefile(target,package) if package.exists() else False).lower())
          print('WORLDMAP_SYMLINK_LAYOUT_FILE_CONTENT_INTERPRETED=false')
          print('WORLDMAP_SYMLINK_LAYOUT_CLIENT_EXECUTED=false')
          print('WORLDMAP_SYMLINK_LAYOUT_SECRET_USED=false')
          PY

name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml
      - docs/agents/tasks/active/OTC-20260817-track-a-worldmap-server-delivery-causal-validation.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  canonical-baseline-bootstrap:
    name: One admitted exact-client canonical baseline bootstrap
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation' }}
    runs-on: [otclient, synology]
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Revalidate admitted bootstrap transaction
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == synology-otclient-01 ]]
          python3 .github/scripts/test_track_a_agent_runtime_governance.py \
            --changed-from "$BASE_SHA" --expected-branch "$HEAD_BRANCH"
          echo 'WORLDMAP_CAUSAL_BOOTSTRAP_ADMISSION_POLICY=PASS'

      - name: Acquire fresh canonical lease and bootstrap exact baseline without credentials
        shell: bash
        env:
          TASK_ID: OTC-20260817-track-a-worldmap-server-delivery-causal-validation
          SESSION_ID: worldmap-causal-baseline-20260817
        run: |
          set +x
          set -Eeuo pipefail
          STATE=/home/runner/_work/_otclient_tibia_re_state/canonical-live-runtime
          TASK_STATE=/home/runner/_work/_otclient_tibia_re_state/tasks/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
          TOKEN="$TASK_STATE/canonical-lease.token"
          LEASE=.github/scripts/tibia-official-client-re-canonical-live-lease.py
          TRANSITION=.github/scripts/tibia-official-client-re-canonical-live-transition.py
          WORKER=.github/scripts/tibia-official-client-re-canonical-live-session.sh

          mkdir -p "$TASK_STATE"
          chmod 700 "$TASK_STATE"
          rm -f "$TOKEN"

          acquired=0
          keep=0
          cleanup_failure() {
            rc=$?
            if [[ "$keep" != 1 && "$acquired" == 1 ]]; then
              python3 "$LEASE" --state-dir "$STATE" release \
                --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN" >/dev/null 2>&1 || true
              rm -f "$TOKEN"
            fi
            exit "$rc"
          }
          trap cleanup_failure EXIT

          python3 "$LEASE" --state-dir "$STATE" acquire \
            --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN" \
            --ttl-seconds 2700
          acquired=1
          [[ "$(stat -c '%a' "$TOKEN")" == 600 ]]

          python3 "$LEASE" --state-dir "$STATE" validate \
            --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN"
          echo 'WORLDMAP_CAUSAL_BOOTSTRAP_GATE_A_LEASE=PASS'

          env -u TIBIA_TEST_EMAIL -u TIBIA_TEST_PASSWORD \
            python3 "$TRANSITION" bootstrap \
              --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN" \
              --worker "$WORKER" --worker-timeout 180

          python3 "$LEASE" --state-dir "$STATE" validate \
            --task-id "$TASK_ID" --session-id "$SESSION_ID" --token-file "$TOKEN"

          python3 - "$STATE/runtime-registration.json" "$TASK_ID" "$GITHUB_RUN_ID" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          task = sys.argv[2]
          run = sys.argv[3]
          data = json.loads(path.read_text())
          required = {
              'schema_version': 1,
              'runtime_id': 'track-a-canonical-live',
              'client_version': '15.32.df7b29',
              'client_size': 51965216,
              'client_sha256': 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe',
              'source_task': task,
              'source_run': run,
          }
          for key, expected in required.items():
              if data.get(key) != expected:
                  raise SystemExit(f'WORLDMAP_CAUSAL_BOOTSTRAP_ERROR=registration_{key}_mismatch')
          if not isinstance(data.get('pid'), int) or data['pid'] <= 0:
              raise SystemExit('WORLDMAP_CAUSAL_BOOTSTRAP_ERROR=registration_pid_invalid')
          if data.get('remote_view_mapping') != 'PROVEN':
              raise SystemExit('WORLDMAP_CAUSAL_BOOTSTRAP_ERROR=remote_view_mapping_not_proven')
          if data.get('state') != 'UNKNOWN':
              raise SystemExit('WORLDMAP_CAUSAL_BOOTSTRAP_ERROR=unexpected_prelogin_state')
          safe = {key: data.get(key) for key in (
              'schema_version','runtime_id','registration_generation','lease_generation','registered_at',
              'boot_id_sha256','pid','process_start_ticks','client_version','client_size','client_sha256',
              'display','window_identity','remote_view_endpoint','remote_view_mapping','state','source_task','source_run'
          )}
          print('WORLDMAP_CAUSAL_BOOTSTRAP_REGISTRATION=' + json.dumps(safe, sort_keys=True, separators=(',', ':')))
          print('WORLDMAP_CAUSAL_BOOTSTRAP_REGISTRATION_FENCE=PASS')
          PY

          python3 "$LEASE" --state-dir "$STATE" status --json
          echo "WORLDMAP_CAUSAL_BOOTSTRAP_TOKEN_PATH=$TOKEN"
          echo 'WORLDMAP_CAUSAL_BOOTSTRAP_CREDENTIALS_USED=false'
          echo 'WORLDMAP_CAUSAL_BOOTSTRAP_LOGIN_USED=false'
          echo 'WORLDMAP_CAUSAL_BOOTSTRAP_GAMEPLAY_USED=false'
          echo 'WORLDMAP_CAUSAL_BOOTSTRAP=PASS'
          keep=1
          trap - EXIT

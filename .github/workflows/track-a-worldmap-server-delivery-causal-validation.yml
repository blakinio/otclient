name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

jobs:
  validate-combined-repairs:
    name: Validate GDB plus raw-XWD baseline repairs without physical runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compile, self-test and compose temporary baseline helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            .github/scripts/track-a-worldmap-causal-xwd-classify.py \
            .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py
          python3 .github/scripts/track-a-worldmap-causal-xwd-classify.py self-test
          gdb_repaired="$RUNNER_TEMP/worldmap-baseline-gdb.sh"
          combined="$RUNNER_TEMP/worldmap-baseline-gdb-xwd.sh"
          python3 .github/scripts/track-a-worldmap-causal-gdb-env-repair.py \
            .github/scripts/track-a-worldmap-causal-ephemeral-baseline.sh \
            "$gdb_repaired"
          python3 .github/scripts/track-a-worldmap-causal-ui-geometry-repair.py \
            "$gdb_repaired" "$combined"
          bash -n "$combined"
          test -x "$combined"
          test "$(grep -Fc 'LD_LIBRARY_PATH="$TOOL/usr/lib/x86_64-linux-gnu:$TOOL/lib/x86_64-linux-gnu"' "$combined")" = 1
          grep -F 'WORLDMAP_BASELINE_PRE_STORAGE_OBSERVER=ARMED' "$combined" >/dev/null
          grep -F 'WORLDMAP_BASELINE_LOGIN_FORM=PROVEN_RAW_XWD_GEOMETRY' "$combined" >/dev/null
          grep -F 'WORLDMAP_BASELINE_CHARACTER_SELECTION=PROVEN_RAW_XWD_GEOMETRY' "$combined" >/dev/null
          grep -F 'EMAIL_X=520' "$combined" >/dev/null
          grep -F 'ROW_X=300' "$combined" >/dev/null
          if grep -E 'tesseract|capture_ocr|LOGIN_OCR_ANCHORS|SELECT_TSV|PRE_TSV' "$combined"; then
            echo 'WORLDMAP_COMBINED_REPAIR_ERROR=ocr_surface_survived' >&2
            exit 1
          fi
          echo 'WORLDMAP_COMBINED_REPAIR_STATIC_VALIDATION=PASS'
          echo 'WORLDMAP_PHYSICAL_EXECUTION=false'

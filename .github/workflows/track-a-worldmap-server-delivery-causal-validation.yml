name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  tibia-user-state-inventory:
    name: Persistent Tibia user-state inventory (no client)
    runs-on: [otclient, synology]
    timeout-minutes: 3
    steps:
      - name: Inventory sanitized persistent state omitted by ephemeral HOME
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          roots = [
              Path('/home/runner/_work/_otclient_tibia_re_state/home'),
              Path('/work/_otclient_tibia_re_state/home'),
          ]
          home = next((p for p in roots if p.is_dir()), None)
          if home is None:
              raise SystemExit('WORLDMAP_USER_STATE_ERROR=home_missing')

          share = home / '.local/share/CipSoft GmbH/Tibia'
          package = share / 'packages/Tibia'
          metadata = share / 'launchermetadata.json'
          if not package.is_dir():
              raise SystemExit('WORLDMAP_USER_STATE_ERROR=package_missing')
          if not metadata.is_file() or metadata.is_symlink():
              raise SystemExit('WORLDMAP_USER_STATE_ERROR=metadata_missing')

          def file_sha(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def rel(path: Path) -> str:
              return str(path.relative_to(home))

          def describe(path: Path):
              st = path.lstat()
              mode = stat.S_IMODE(st.st_mode)
              base = {'path': rel(path), 'mode': format(mode, '04o')}
              if stat.S_ISLNK(st.st_mode):
                  raw = Path(os.readlink(path))
                  try:
                      resolved = path.resolve(strict=True)
                      target_exists = True
                  except (OSError, RuntimeError):
                      resolved = None
                      target_exists = False
                  target_inside_home = False
                  target_kind = 'MISSING'
                  target_size = None
                  target_sha = None
                  if resolved is not None:
                      try:
                          resolved.relative_to(home)
                          target_inside_home = True
                      except ValueError:
                          pass
                      rst = resolved.stat()
                      if stat.S_ISREG(rst.st_mode):
                          target_kind = 'FILE'
                          target_size = rst.st_size
                          target_sha = file_sha(resolved)
                      elif stat.S_ISDIR(rst.st_mode):
                          target_kind = 'DIR'
                      else:
                          target_kind = 'OTHER'
                  base.update({
                      'kind': 'SYMLINK',
                      'raw_target_absolute': raw.is_absolute(),
                      'target_exists': target_exists,
                      'target_inside_home': target_inside_home,
                      'target_kind': target_kind,
                      'target_basename': resolved.name if resolved is not None else raw.name,
                      'target_size': target_size,
                      'target_sha256': target_sha,
                  })
              elif stat.S_ISREG(st.st_mode):
                  base.update({'kind': 'FILE', 'size': st.st_size, 'sha256': file_sha(path)})
              elif stat.S_ISDIR(st.st_mode):
                  base.update({'kind': 'DIR'})
              else:
                  base.update({'kind': 'OTHER', 'size': st.st_size})
              return base

          entries = []

          # Current ephemeral constructor copies only packages/Tibia and launchermetadata.json.
          # Inventory only the sibling state it omits; do not traverse proprietary package bytes.
          if share.is_dir():
              for p in sorted(share.iterdir(), key=lambda x: x.name):
                  if p.name in {'packages', 'launchermetadata.json'}:
                      continue
                  entries.append(describe(p))

          # Inventory only explicit CipSoft/Tibia-named XDG state outside .local/share.
          for root_rel in ('.config', '.cache', '.local/state'):
              root = home / root_rel
              if not root.is_dir():
                  continue
              for p in sorted(root.rglob('*')):
                  try:
                      rp = p.relative_to(root)
                  except ValueError:
                      continue
                  text = '/'.join(rp.parts).casefold()
                  if 'cipsoft' not in text and 'tibia' not in text:
                      continue
                  if len(rp.parts) > 5:
                      continue
                  entries.append(describe(p))

          entries.sort(key=lambda e: e['path'])
          encoded = json.dumps(entries, sort_keys=True, separators=(',', ':')).encode()
          digest = hashlib.sha256(encoded).hexdigest()

          print('WORLDMAP_USER_STATE_OMITTED_ENTRY_COUNT=' + str(len(entries)))
          print('WORLDMAP_USER_STATE_OMITTED_MANIFEST_SHA256=' + digest)
          print('WORLDMAP_USER_STATE_PACKAGE_PRESENT=true')
          print('WORLDMAP_USER_STATE_METADATA_PRESENT=true')
          print('WORLDMAP_USER_STATE_CLIENT_EXECUTED=false')
          print('WORLDMAP_USER_STATE_FILE_CONTENT_EMITTED=false')
          print('WORLDMAP_USER_STATE_SECRET_USED=false')

          # GitHub annotations expose the sanitized manifest without raw file contents.
          chunk = []
          for e in entries:
              chunk.append(json.dumps(e, sort_keys=True, separators=(',', ':')))
          message = ' | '.join(chunk) if chunk else 'NO_OMITTED_VENDOR_STATE_FOUND'
          if len(message) > 60000:
              raise SystemExit('WORLDMAP_USER_STATE_ERROR=sanitized_manifest_too_large')
          print('::notice title=Persistent Tibia omitted user state::count=' + str(len(entries)) + ';manifest_sha256=' + digest + ';entries=' + message)
          PY

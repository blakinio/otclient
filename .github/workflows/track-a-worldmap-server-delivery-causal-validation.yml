name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: write

concurrency:
  group: track-a-worldmap-v11-authority-checkpoint-v2
  cancel-in-progress: false

env:
  HEAD_BRANCH: runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
  ARM_SUBJECT: 'ci(track-a): run v11 authority checkpoint'
  TASK_PATH: docs/agents/tasks/active/OTC-20260817-track-a-worldmap-server-delivery-causal-validation.md

jobs:
  checkpoint-v11-authority:
    name: Checkpoint v11 authority without client execution
    runs-on: ubuntu-latest
    steps:
      - name: Persist v10 discriminator and v11 login budget
        shell: bash
        run: |
          set -Eeuo pipefail
          git init -q "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin "+refs/heads/$HEAD_BRANCH:refs/remotes/origin/task-head"
          git checkout -q -B "$HEAD_BRANCH" refs/remotes/origin/task-head
          [[ "$(git log -1 --format=%s)" == "$ARM_SUBJECT" ]]
          python3 .github/scripts/track-a-worldmap-causal-v11-authority-checkpoint.py "$TASK_PATH"
          grep -Fq 'baseline_ephemeral_login_max: 4' "$TASK_PATH"
          grep -Fq 'baseline_ephemeral_login_consumed: 3' "$TASK_PATH"
          grep -Fq 'fourth_baseline_login_attempt_authorized: true' "$TASK_PATH"
          grep -Fq 'WORLDMAP_V10_PRESS_BBOX=998,593,1084,613' "$TASK_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TASK_PATH"
          git commit -m 'task(track-a): authorize v11 downstream auth discriminator'
          git push origin HEAD:"$HEAD_BRANCH"
          echo 'WORLDMAP_V11_AUTHORITY_CHECKPOINT=PASS'
          echo 'WORLDMAP_V11_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_V11_SECRET_USED=false'

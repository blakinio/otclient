name: Track A worldmap server-delivery causal validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-causal-validation.yml

permissions:
  contents: read

concurrency:
  group: track-a-worldmap-server-delivery-causal-validation
  cancel-in-progress: false

jobs:
  safety-hold:
    name: Hold after cross-launch Tab identity falsification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve run 32037993455 before same-launch adaptive probe
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD=PASS'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_REASON=cross_launch_tab_identity_not_stable'
          echo 'WORLDMAP_CAUSAL_LAST_TEXT_RUN=32037993455'
          echo 'WORLDMAP_CAUSAL_LAST_TEXT_JOB=95412099981'
          echo 'WORLDMAP_CAUSAL_LAST_TEXT_FIELD_CANDIDATE_COUNT=0'
          echo 'WORLDMAP_CAUSAL_LAST_TEXT_SECRET_USED=false'
          echo 'WORLDMAP_CAUSAL_LAST_TEXT_LOGIN_SUBMITTED=false'
          echo 'WORLDMAP_CAUSAL_NEXT_DISCRIMINATOR=same_launch_discover_then_classify'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_CLIENT_EXECUTED=false'
          echo 'WORLDMAP_CAUSAL_SAFETY_HOLD_SECRET_USED=false'

name: Track A worldmap server-delivery static census

on:
  push:
    branches:
      - research/OTC-20260817-track-a-worldmap-server-delivery-extent
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-static.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact fenced client and emit text-only protocol census
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl binutils

          root=/tmp/worldmap-server-delivery
          mkdir -p "$root/bin" "$root/state" "$root/client" "$root/evidence"
          cd "$root/bin"

          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wireproxy.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tgz' | sha256sum -c -
          mkdir unpack
          tar -xzf wireproxy.tgz -C unpack
          cp "$(find unpack -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy

          cd "$root/state"
          "$root/bin/wgcf" register --accept-tos >/dev/null
          "$root/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25345\n' "$root/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$root/bin/wireproxy" -c wireproxy.conf >"$root/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25345 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$root/trace" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$root/trace"

          client_url=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25345 --compressed -fL \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$client_url" -H 'Accept: */*' \
            "$client_url" -o "$root/client/client.lzma"
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/worldmap-server-delivery/client/client.lzma' | sha256sum -c -

          python3 - <<'PY'
          import hashlib
          import json
          import lzma
          import pathlib
          import re

          root = pathlib.Path('/tmp/worldmap-server-delivery')
          packed = (root / 'client/client.lzma').read_bytes()
          props = packed[32]
          lc = props % 9
          z = props // 9
          lp = z % 5
          pb = z // 5
          dictionary_size = int.from_bytes(packed[33:37], 'little')
          filters = [{
              'id': lzma.FILTER_LZMA1,
              'dict_size': dictionary_size,
              'lc': lc,
              'lp': lp,
              'pb': pb,
          }]
          client = lzma.decompress(packed[45:], format=lzma.FORMAT_RAW, filters=filters)
          exact_sha = hashlib.sha256(client).hexdigest()
          assert len(client) == 51965216, len(client)
          assert exact_sha == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe', exact_sha

          evidence = root / 'evidence'
          printable = [m.group().decode('ascii', 'ignore') for m in re.finditer(rb'[ -~]{4,220}', client)]
          text = '\n'.join(printable)
          protocol_names = sorted(set(re.findall(r'\b(?:GameclientMessage|GameserverMessage)[A-Za-z0-9_]{2,100}\b', text)))
          client_names = [n for n in protocol_names if n.startswith('GameclientMessage')]
          server_names = [n for n in protocol_names if n.startswith('GameserverMessage')]

          protocol_keywords = re.compile(r'(map|field|world|aware|range|extent|floor|level|row|column|viewport|tile|coordinate|description|screen)', re.I)
          relevant_names = [n for n in protocol_names if protocol_keywords.search(n)]
          relevant_client_names = [n for n in client_names if protocol_keywords.search(n)]
          relevant_server_names = [n for n in server_names if protocol_keywords.search(n)]

          string_keywords = re.compile(r'(aware|range|extent|full.?map|map.?description|field.?data|floor|row|column|viewport|tile|coordinate|width|height)', re.I)
          keyword_strings = sorted(set(s for s in printable if string_keywords.search(s)))

          (evidence / 'protocol-all.txt').write_text('\n'.join(protocol_names) + '\n')
          (evidence / 'protocol-client-to-server.txt').write_text('\n'.join(client_names) + '\n')
          (evidence / 'protocol-server-to-client.txt').write_text('\n'.join(server_names) + '\n')
          (evidence / 'protocol-map-relevant.txt').write_text('\n'.join(relevant_names) + '\n')
          (evidence / 'protocol-map-relevant-client-to-server.txt').write_text('\n'.join(relevant_client_names) + '\n')
          (evidence / 'protocol-map-relevant-server-to-client.txt').write_text('\n'.join(relevant_server_names) + '\n')
          (evidence / 'bounded-keyword-strings.txt').write_text('\n'.join(keyword_strings) + '\n')

          summary = {
              'schema': 'track-a-worldmap-server-delivery-static-census-v1',
              'client': {
                  'version': '15.32.df7b29',
                  'size': len(client),
                  'sha256': exact_sha,
              },
              'protocol_message_total': len(protocol_names),
              'client_to_server_total': len(client_names),
              'server_to_client_total': len(server_names),
              'map_relevant_total': len(relevant_names),
              'map_relevant_client_to_server_total': len(relevant_client_names),
              'map_relevant_server_to_client_total': len(relevant_server_names),
              'bounded_keyword_string_total': len(keyword_strings),
              'required_inbound': {
                  'GameserverMessageFullMap': 'GameserverMessageFullMap' in server_names,
                  'GameserverMessageFieldData': 'GameserverMessageFieldData' in server_names,
              },
              'obvious_outbound_extent_or_range_name': [
                  n for n in client_names
                  if re.search(r'(aware|range|extent|viewport|mapdescription|fullmap|fielddata|width|height)', n, re.I)
              ],
          }
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')

          print('WORLD_MAP_SERVER_DELIVERY_CENSUS_BEGIN')
          print(json.dumps(summary, sort_keys=True))
          print('MAP_RELEVANT_CLIENT_TO_SERVER_BEGIN')
          for name in relevant_client_names:
              print(name)
          print('MAP_RELEVANT_CLIENT_TO_SERVER_END')
          print('MAP_RELEVANT_SERVER_TO_CLIENT_BEGIN')
          for name in relevant_server_names:
              print(name)
          print('MAP_RELEVANT_SERVER_TO_CLIENT_END')
          print('ALL_CLIENT_TO_SERVER_BEGIN')
          for name in client_names:
              print(name)
          print('ALL_CLIENT_TO_SERVER_END')
          print('WORLD_MAP_SERVER_DELIVERY_CENSUS_END')
          PY

          # The proprietary client and compressed source are deliberately not uploaded.
          rm -f "$root/client/client" "$root/client/client.lzma"

      - name: Upload text-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: worldmap-server-delivery-static-${{ github.run_id }}
          path: /tmp/worldmap-server-delivery/evidence
          if-no-files-found: error
          retention-days: 7

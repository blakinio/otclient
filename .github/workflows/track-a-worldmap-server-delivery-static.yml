name: Track A worldmap server-delivery descriptor probe

on:
  push:
    branches:
      - research/OTC-20260817-track-a-worldmap-server-delivery-extent
    paths:
      - .github/workflows/track-a-worldmap-server-delivery-static.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descriptor-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact fenced client and recover bounded protocol descriptors
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl

          root=/tmp/worldmap-server-delivery
          mkdir -p "$root/bin" "$root/state" "$root/client" "$root/evidence"
          cd "$root/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf' | sha256sum -c -
          curl -fsSL -o wireproxy.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tgz' | sha256sum -c -
          mkdir unpack
          tar -xzf wireproxy.tgz -C unpack
          cp "$(find unpack -type f -name wireproxy -print -quit)" wireproxy
          chmod 755 wgcf wireproxy

          cd "$root/state"
          "$root/bin/wgcf" register --accept-tos >/dev/null
          "$root/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25346\n' "$root/state/wgcf-profile.conf" > wireproxy.conf
          nohup "$root/bin/wireproxy" -c wireproxy.conf >"$root/wireproxy.log" 2>&1 </dev/null &
          for _ in $(seq 1 30); do
            if curl --socks5-hostname 127.0.0.1:25346 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$root/trace" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          grep -Eq '^warp=(on|plus)$' "$root/trace"

          client_url=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25346 --compressed -fL \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$client_url" -H 'Accept: */*' \
            "$client_url" -o "$root/client/client.lzma"
          echo '496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b  /tmp/worldmap-server-delivery/client/client.lzma' | sha256sum -c -

          python3 - <<'PY'
          import hashlib
          import json
          import lzma
          import pathlib

          root = pathlib.Path('/tmp/worldmap-server-delivery')
          packed = (root / 'client/client.lzma').read_bytes()
          prop = packed[32]
          lc = prop % 9
          q = prop // 9
          lp = q % 5
          pb = q // 5
          dictionary_size = int.from_bytes(packed[33:37], 'little')
          client = lzma.decompress(
              packed[45:],
              format=lzma.FORMAT_RAW,
              filters=[{'id': lzma.FILTER_LZMA1, 'dict_size': dictionary_size, 'lc': lc, 'lp': lp, 'pb': pb}],
          )
          exact_sha = hashlib.sha256(client).hexdigest()
          assert len(client) == 51965216
          assert exact_sha == 'e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'

          evidence = root / 'evidence'
          package = b'tibia.protobuf.protocol'
          field_type_names = {
              1: 'double', 2: 'float', 3: 'int64', 4: 'uint64', 5: 'int32', 6: 'fixed64',
              7: 'fixed32', 8: 'bool', 9: 'string', 10: 'group', 11: 'message', 12: 'bytes',
              13: 'uint32', 14: 'enum', 15: 'sfixed32', 16: 'sfixed64', 17: 'sint32', 18: 'sint64',
          }
          label_names = {1: 'optional', 2: 'required', 3: 'repeated'}

          class ParseError(Exception):
              pass

          def read_varint(buf, pos, end):
              value = 0
              shift = 0
              start = pos
              while pos < end and shift <= 63:
                  byte = buf[pos]
                  pos += 1
                  value |= (byte & 0x7f) << shift
                  if not (byte & 0x80):
                      return value, pos
                  shift += 7
              raise ParseError(f'bad varint at {start}')

          def parse_wire(buf, start, end, max_field=32, require_nondecreasing=False):
              pos = start
              out = []
              previous_field = 0
              while pos < end:
                  record_start = pos
                  key, pos = read_varint(buf, pos, end)
                  field = key >> 3
                  wire = key & 7
                  if field == 0 or field > max_field or wire not in (0, 1, 2, 5):
                      raise ParseError(f'invalid key field={field} wire={wire} at {record_start}')
                  if require_nondecreasing and field < previous_field:
                      raise ParseError(f'field order decreased {previous_field}->{field} at {record_start}')
                  previous_field = field
                  if wire == 0:
                      value, pos = read_varint(buf, pos, end)
                  elif wire == 1:
                      if pos + 8 > end: raise ParseError('fixed64 overflow')
                      value = buf[pos:pos+8]
                      pos += 8
                  elif wire == 5:
                      if pos + 4 > end: raise ParseError('fixed32 overflow')
                      value = buf[pos:pos+4]
                      pos += 4
                  else:
                      length, pos = read_varint(buf, pos, end)
                      if length < 0 or pos + length > end:
                          raise ParseError('length overflow')
                      value = buf[pos:pos+length]
                      pos += length
                  out.append((field, wire, value, record_start, pos))
              return out

          def strings_for(records, field):
              return [v.decode('utf-8', 'replace') for f, w, v, _, _ in records if f == field and w == 2]

          def ints_for(records, field):
              return [v for f, w, v, _, _ in records if f == field and w == 0]

          def parse_field_descriptor(raw):
              rec = parse_wire(raw, 0, len(raw), max_field=20)
              name = strings_for(rec, 1)
              number = ints_for(rec, 3)
              label = ints_for(rec, 4)
              ftype = ints_for(rec, 5)
              type_name = strings_for(rec, 6)
              json_name = strings_for(rec, 10)
              return {
                  'name': name[0] if name else None,
                  'number': number[0] if number else None,
                  'label': label_names.get(label[0], label[0]) if label else None,
                  'type': field_type_names.get(ftype[0], ftype[0]) if ftype else None,
                  'type_name': type_name[0] if type_name else None,
                  'json_name': json_name[0] if json_name else None,
              }

          def parse_message_descriptor(raw):
              rec = parse_wire(raw, 0, len(raw), max_field=20)
              names = strings_for(rec, 1)
              fields = []
              for f, w, v, _, _ in rec:
                  if f == 2 and w == 2:
                      try:
                          fields.append(parse_field_descriptor(v))
                      except ParseError:
                          pass
              return {'name': names[0] if names else None, 'fields': fields}

          def find_descriptor_starts():
              starts = set()
              p = 0
              while True:
                  package_pos = client.find(package, p)
                  if package_pos < 0:
                      break
                  p = package_pos + 1
                  package_key_pos = package_pos - 2
                  if package_key_pos < 0 or client[package_key_pos] != 0x12 or client[package_pos-1] != len(package):
                      continue
                  for start in range(max(0, package_key_pos - 512), package_key_pos):
                      if client[start] != 0x0a:
                          continue
                      try:
                          name_len, name_pos = read_varint(client, start + 1, package_key_pos)
                      except ParseError:
                          continue
                      name_end = name_pos + name_len
                      if name_end != package_key_pos:
                          continue
                      name = client[name_pos:name_end]
                      if name.endswith(b'.proto') and all(32 <= c < 127 for c in name):
                          starts.add((start, name.decode('ascii')))
              return sorted(starts)

          descriptors = []
          for start, file_name in find_descriptor_starts():
              # FileDescriptorProto.message_type is field 4. Generated descriptors are serialized
              # in nondecreasing field-number order, so the bounded parser grows until that ordering breaks.
              pos = start
              previous = 0
              records = []
              end_limit = min(len(client), start + 2_000_000)
              while pos < end_limit:
                  record_start = pos
                  try:
                      key, p2 = read_varint(client, pos, end_limit)
                  except ParseError:
                      break
                  field = key >> 3
                  wire = key & 7
                  if field == 0 or field > 20 or wire not in (0, 1, 2, 5) or field < previous:
                      break
                  previous = field
                  pos = p2
                  try:
                      if wire == 0:
                          value, pos = read_varint(client, pos, end_limit)
                      elif wire == 1:
                          if pos + 8 > end_limit: break
                          value = client[pos:pos+8]; pos += 8
                      elif wire == 5:
                          if pos + 4 > end_limit: break
                          value = client[pos:pos+4]; pos += 4
                      else:
                          length, pos = read_varint(client, pos, end_limit)
                          if length < 0 or pos + length > end_limit: break
                          value = client[pos:pos+length]; pos += length
                  except ParseError:
                      break
                  records.append((field, wire, value, record_start, pos))

              pkg = strings_for(records, 2)
              names = strings_for(records, 1)
              messages = []
              for f, w, v, _, _ in records:
                  if f == 4 and w == 2:
                      try:
                          m = parse_message_descriptor(v)
                          if m['name']:
                              messages.append(m)
                      except ParseError:
                          pass
              if pkg and pkg[0] == package.decode() and names and messages:
                  descriptors.append({
                      'file': names[0],
                      'file_offset': start,
                      'package': pkg[0],
                      'parsed_span_bytes': pos - start,
                      'message_count': len(messages),
                      'messages': messages,
                  })

          targets = {
              'Extent', 'Coordinate', 'MapFieldData', 'RowData', 'ColumnData',
              'GameclientMessageLogin', 'GameclientMessageSecondaryLogin', 'GameclientMessageClientDetails',
              'GameclientMessageEnterWorld', 'GameclientMessageSetClientOptions',
              'GameserverMessageFullMap', 'GameserverMessageFieldData',
              'GameserverMessageLeftColumn', 'GameserverMessageRightColumn',
              'GameserverMessageTopRow', 'GameserverMessageBottomRow',
              'GameserverMessageTopFloor', 'GameserverMessageBottomFloor',
          }
          target_messages = []
          for descriptor in descriptors:
              for message in descriptor['messages']:
                  if message['name'] in targets:
                      target_messages.append({
                          'file': descriptor['file'],
                          'name': message['name'],
                          'fields': message['fields'],
                      })

          fallback_tokens = sorted(targets | {
              'FullMapMessage', 'FieldDataMessage', 'LeftColumnMessage', 'RightColumnMessage',
              'TopRowMessage', 'BottomRowMessage', 'TopFloorMessage', 'BottomFloorMessage',
              'AdditionalRowsTop', 'AdditionalRowsBottom', 'Columns', 'Rows',
          })
          neighborhoods = []
          for token in fallback_tokens:
              needle = token.encode()
              found = 0
              p = 0
              while found < 4:
                  at = client.find(needle, p)
                  if at < 0:
                      break
                  p = at + 1
                  found += 1
                  lo = max(0, at - 192)
                  hi = min(len(client), at + len(needle) + 384)
                  sample = client[lo:hi]
                  escaped = ''.join(chr(b) if 32 <= b < 127 else f'\\x{b:02x}' for b in sample)
                  neighborhoods.append({'token': token, 'offset': at, 'window_start': lo, 'window_end': hi, 'escaped': escaped})

          summary = {
              'schema': 'track-a-worldmap-server-delivery-descriptor-probe-v2',
              'client': {'version': '15.32.df7b29', 'size': len(client), 'sha256': exact_sha},
              'descriptor_file_count': len(descriptors),
              'descriptor_files': [
                  {k: d[k] for k in ('file', 'file_offset', 'package', 'parsed_span_bytes', 'message_count')}
                  for d in descriptors
              ],
              'target_message_count': len(target_messages),
              'target_messages': target_messages,
          }
          (evidence / 'descriptor-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          (evidence / 'target-neighborhoods.json').write_text(json.dumps(neighborhoods, indent=2, sort_keys=True) + '\n')

          print('WORLDMAP_DESCRIPTOR_PROBE_BEGIN')
          print(json.dumps(summary, sort_keys=True))
          print('WORLDMAP_DESCRIPTOR_PROBE_END')
          assert target_messages, 'no target protocol descriptors recovered'
          PY

          rm -f "$root/client/client.lzma"

      - name: Upload bounded descriptor evidence
        uses: actions/upload-artifact@v4
        with:
          name: worldmap-server-delivery-descriptors-${{ github.run_id }}
          path: /tmp/worldmap-server-delivery/evidence
          if-no-files-found: error
          retention-days: 7

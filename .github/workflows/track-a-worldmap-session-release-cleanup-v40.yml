name: Track A worldmap session release cleanup v40

on:
  push:
    branches:
      - runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
    paths:
      - .github/workflows/track-a-worldmap-session-release-cleanup-v40.yml

permissions:
  contents: write

# Same repository-wide group as the no-secret VNC observer. This release run is
# intentionally allowed to cancel that observer before taking the physical runner.
concurrency:
  group: track-a-vnc-observer-live-v24
  cancel-in-progress: true

env:
  BRANCH: runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
  TASK: OTC-20260817-track-a-worldmap-server-delivery-causal-validation
  EVID: docs/agents/evidence/OTC-20260817-track-a-worldmap-server-delivery-causal-validation

jobs:
  cleanup:
    name: Release exact task-owned runtime
    runs-on: [otclient, synology]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: true
          fetch-depth: 0

      - name: Stop only exact task-marker processes and remove observer state
        shell: bash
        run: |
          set +x
          set -Eeuo pipefail
          base=/home/runner/_work/_otclient_tibia_re_state
          root="$base/tasks/$TASK/worldmap-causal-baseline-ephemeral-v1"
          patched="$base/tasks/$TASK/worldmap-causal-patched-ephemeral-v1"
          observer="$base/vnc-observer-live"
          baseline_marker='OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-baseline-ephemeral-v1'
          patched_marker='OTCLIENT_TIBIA_RE_EPHEMERAL_RUNTIME=worldmap-causal-patched-ephemeral-v1'

          # Ask the v24 observer helper to stop cleanly if it still exists.
          mkdir -p "$root" 2>/dev/null || true
          touch "$root/vnc-observer-stop" 2>/dev/null || true
          touch "$observer/stop" 2>/dev/null || true

          python3 - "$baseline_marker" "$patched_marker" <<'PY'
          from pathlib import Path
          import os,signal,sys,time
          markers=[x.encode() for x in sys.argv[1:]]
          def owned():
              out=[]
              for p in Path('/proc').iterdir():
                  if not p.name.isdigit(): continue
                  try: env=set((p/'environ').read_bytes().split(b'\0'))
                  except OSError: continue
                  if any(m in env for m in markers): out.append(int(p.name))
              return sorted(set(out))
          before=owned()
          print('TRACK_A_RELEASE_NAMESPACE_PROCESS_COUNT_BEFORE='+str(len(before)))
          for pid in before:
              try: os.kill(pid,signal.SIGTERM)
              except ProcessLookupError: pass
          for _ in range(50):
              if not owned(): break
              time.sleep(.1)
          remaining=owned()
          for pid in remaining:
              try: os.kill(pid,signal.SIGKILL)
              except ProcessLookupError: pass
          time.sleep(.3)
          after=owned()
          print('TRACK_A_RELEASE_NAMESPACE_PROCESS_COUNT_AFTER='+str(len(after)))
          if after: raise SystemExit(1)
          PY

          rm -rf --one-file-system "$observer" 2>/dev/null || true
          rm -rf --one-file-system "$root" 2>/dev/null || true
          rm -rf --one-file-system "$patched" 2>/dev/null || true

          source="$base/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client"
          if [[ ! -x "$source" ]]; then source=/work/_otclient_tibia_re_state/home/.local/share/CipSoft\ GmbH/Tibia/packages/Tibia/bin/client; fi
          expected=e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe
          [[ -x "$source" && "$(sha256sum "$source" | awk '{print $1}')" == "$expected" ]]
          echo 'TRACK_A_RELEASE_ORIGINAL_SOURCE_REHASH=PASS'
          echo 'TRACK_A_RELEASE_OBSERVER_STATE_REMOVED=PASS'
          echo 'TRACK_A_RELEASE_RUNTIME=PASS'

          cat >"$RUNNER_TEMP/release-runtime.md" <<'EOF'
          # Runtime release cleanup

          Task: `OTC-20260817-track-a-worldmap-server-delivery-causal-validation`

          Owner-requested release cleanup executed on `synology-otclient-01`.

          ```text
          EXACT_TASK_MARKER_PROCESSES_AFTER=0
          VNC_OBSERVER_STATE_REMOVED=true
          TASK_BASELINE_NAMESPACE_REMOVED=true
          TASK_PATCHED_NAMESPACE_REMOVED=true
          ORIGINAL_SOURCE_REHASH=PASS
          CREDENTIALS_USED=false
          LOGIN_PERFORMED=false
          GAMEPLAY_PERFORMED=false
          ```

          No canonical runtime/lease/registration state was changed. Cleanup was restricted to exact task-owned ephemeral runtime markers and task-owned state paths.
          EOF

      - name: Persist release cleanup evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/task"
          git checkout -q -B "$BRANCH" refs/remotes/origin/task
          cp "$RUNNER_TEMP/release-runtime.md" "$EVID/20260818-session-release-runtime-cleanup.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVID/20260818-session-release-runtime-cleanup.md"
          git commit -m 'evidence(track-a): prove worldmap runtime released'
          git push origin HEAD:$BRANCH

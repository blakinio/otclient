name: Track A real start-game-login implementation v20

on:
  push:
    branches:
      - runtime/OTC-20260817-track-a-worldmap-server-delivery-causal-validation
    paths:
      - .github/workflows/track-a-worldmap-start-game-login-impl-v20.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact client and inspect 0x767440
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils curl python3-pyelftools python3-capstone
          r="$RUNNER_TEMP/sg";mkdir -p "$r/bin" "$r/state" "$r/client";cd "$r/bin"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          echo '2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  wgcf'|sha256sum -c -
          curl -fsSL -o wp.tgz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wp.tgz'|sha256sum -c -
          mkdir x;tar -xzf wp.tgz -C x;cp "$(find x -type f -name wireproxy -print -quit)" wireproxy;chmod 755 wgcf wireproxy
          cd "$r/state";"$r/bin/wgcf" register --accept-tos >/dev/null;"$r/bin/wgcf" generate >/dev/null
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$r/state/wgcf-profile.conf">w.conf
          nohup "$r/bin/wireproxy" -c w.conf >"$r/wp.log" 2>&1 </dev/null &
          for _ in $(seq 1 30);do curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >"$r/t" 2>/dev/null&&break;sleep 2;done
          grep -Eq '^warp=(on|plus)$' "$r/t"
          u=https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma
          curl --socks5-hostname 127.0.0.1:25344 --compressed -fL -A 'Mozilla/5.0 (X11; Linux x86_64)' -e "$u" -H 'Accept: */*' "$u" -o "$r/client/client.lzma"
          python3 - "$r/client/client.lzma" "$r/client/client" <<'PY'
          import hashlib,lzma,pathlib,sys,struct,re
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86_const import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP
          b=pathlib.Path(sys.argv[1]).read_bytes();q=b[32];lc=q%9;z=q//9;lp=z%5;pb=z//5;ds=int.from_bytes(b[33:37],'little')
          raw=lzma.decompress(b[45:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}]);assert len(raw)==51965216 and hashlib.sha256(raw).hexdigest()=='e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe'
          p=pathlib.Path(sys.argv[2]);p.write_bytes(raw)
          with p.open('rb') as f:elf=ELFFile(f);secs=[(s.name,int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr'])) for s in elf.iter_sections()]
          def vo(va):
            for n,o,z,v in secs:
              if v<=va<v+z:return o+(va-v)
            raise ValueError(hex(va))
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          start=0x767440;end=0x767a80;ins=list(md.disasm(raw[vo(start):vo(end)],start))
          print('WORLDMAP_V20_START_GS_IMPL_BEGIN')
          for x in ins:print(f'0x{x.address:x} {x.mnemonic} {x.op_str}')
          print('WORLDMAP_V20_START_GS_IMPL_END')
          calls=[];refs=[];this_offsets=[]
          for x in ins:
            if x.mnemonic=='call':
              if x.operands and x.operands[0].type==X86_OP_IMM:calls.append((x.address,int(x.operands[0].imm)))
              else:calls.append((x.address,None))
            for op in x.operands:
              if op.type==X86_OP_MEM:
                if op.mem.base==X86_REG_RIP:refs.append((x.address,x.address+x.size+op.mem.disp))
                # SysV this starts in RDI; capture early direct this offsets before RDI is repurposed.
                if x.address<start+0x180 and 'rdi +' in x.op_str:this_offsets.append((x.address,x.op_str))
          print('WORLDMAP_V20_START_GS_CALLS='+','.join(f'0x{a:x}->'+('INDIRECT' if d is None else f'0x{d:x}') for a,d in calls))
          print('WORLDMAP_V20_START_GS_RIPREFS='+','.join(f'0x{a:x}->0x{d:x}' for a,d in refs))
          print('WORLDMAP_V20_START_GS_EARLY_THIS_OFFSETS='+','.join(f'0x{a:x}:{o}' for a,o in this_offsets))
          print('WORLDMAP_V20_START_GS_IMPL_STATIC=PASS')
          print('WORLDMAP_V20_CLIENT_EXECUTED=false')
          PY

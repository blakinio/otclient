name: Validate dedicated OT runners

on:
  push:
    branches:
      - ci/dedicated-ot-runners
    paths:
      - .github/workflows/validate-dedicated-ot-runners.yml
      - infra/ot-runners/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate shell and Compose
        shell: bash
        env:
          GITHUB_RUNNER_PAT: validation-placeholder
        run: |
          set -Eeuo pipefail
          bash -n infra/ot-runners/entrypoint.sh
          docker compose -f infra/ot-runners/compose.yaml config >/tmp/ot-runners-compose.txt
          grep -q 'target: otclient-tibia-re' /tmp/ot-runners-compose.txt
          grep -q 'target: base' /tmp/ot-runners-compose.txt
          echo RUNNER_COMPOSE_VALIDATION_PASS=true

      - name: Build general runner target
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --target base -t ot-runner-base:validation infra/ot-runners
          echo RUNNER_BASE_IMAGE_BUILD_PASS=true

      - name: Build and inspect OTClient Tibia RE target
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --target otclient-tibia-re -t otclient-tibia-re:validation infra/ot-runners
          docker run --rm --entrypoint bash otclient-tibia-re:validation -lc '
            set -Eeuo pipefail
            command -v gdb
            command -v Xvfb
            command -v proxychains4
            command -v xdotool
            command -v vulkaninfo
            python3 -c "import elftools,yaml"
          '
          echo OTCLIENT_TIBIA_RE_IMAGE_BUILD_PASS=true

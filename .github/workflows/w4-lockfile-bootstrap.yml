name: W4 Focused Fix Bootstrap

on:
  pull_request:
    paths:
      - "oteryn-client/apps/client/**"
      - ".github/workflows/w4-lockfile-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: w4-focused-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    name: W4 / Apply focused test fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Replace exact expected diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("oteryn-client/apps/client/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = "shell rejected stale process generation process-generation:2; current generation is process-generation:3"
          new = "shell rejected stale process generation 2; current generation is 3"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale-generation assertion")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit focused fix to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/apps/client/src/lib.rs
          git commit -m "test(rust): correct shell error expectation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

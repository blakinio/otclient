name: W4 Format Bootstrap

on:
  pull_request:
    paths:
      - "oteryn-client/apps/client/**"
      - ".github/workflows/w4-lockfile-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: w4-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: W4 / Apply rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oteryn-client
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Install pinned formatter
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0
          rustfmt --version

      - name: Apply formatting
        run: cargo fmt --all

      - name: Commit formatted sources to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client/src
          if git diff --cached --quiet; then
            echo "Sources are already formatted"
            exit 0
          fi
          git commit -m "style(rust): format Windows shell"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

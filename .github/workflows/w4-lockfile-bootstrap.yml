name: W4 Lockfile Bootstrap

on:
  pull_request:
    paths:
      - "oteryn-client/**"
      - ".github/workflows/w4-lockfile-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: w4-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: W4 / Generate Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oteryn-client
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          show-progress: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc --version
          cargo --version

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w4-generated-lockfile
          path: oteryn-client/Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated lockfile to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git commit -m "build(rust): generate W4 lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

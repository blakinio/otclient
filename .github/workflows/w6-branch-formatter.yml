name: W6 Branch Formatter

on:
  pull_request:
    paths:
      - .github/workflows/w6-branch-formatter.yml

permissions:
  contents: write

jobs:
  format-branch:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: oteryn-client
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC-20260729-synthetic-asset-schema-compiler
          fetch-depth: 0
          show-progress: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $output = rustup toolchain install 1.94.0 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw ($output -join "`n")
          }
          rustup default 1.94.0 | Out-Null

      - name: Format and commit Rust sources
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) {
            throw "cargo fmt failed"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/asset-types tools/asset-compiler
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Rust sources already formatted"
            exit 0
          }
          git commit -m "style(assets): apply rustfmt"
          if ($LASTEXITCODE -ne 0) {
            throw "formatter commit failed"
          }
          git push origin HEAD:feat/OTC-20260729-synthetic-asset-schema-compiler
          if ($LASTEXITCODE -ne 0) {
            throw "formatter push failed"
          }

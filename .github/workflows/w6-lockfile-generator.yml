name: W6 Lockfile Generator

on:
  pull_request:
    paths:
      - .github/workflows/w6-lockfile-generator.yml
      - oteryn-client/Cargo.toml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: oteryn-client
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC-20260729-synthetic-asset-schema-compiler
          fetch-depth: 0
          show-progress: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $output = rustup toolchain install 1.94.0 --profile minimal --target x86_64-pc-windows-msvc 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw ($output -join "`n")
          }
          rustup default 1.94.0 | Out-Null

      - name: Generate and commit Cargo.lock
        shell: pwsh
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) {
            throw "cargo generate-lockfile failed"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cargo.lock is already current"
            exit 0
          }
          git commit -m "build(assets): update generated lockfile"
          if ($LASTEXITCODE -ne 0) {
            throw "lockfile commit failed"
          }
          git push origin HEAD:feat/OTC-20260729-synthetic-asset-schema-compiler
          if ($LASTEXITCODE -ne 0) {
            throw "lockfile push failed"
          }

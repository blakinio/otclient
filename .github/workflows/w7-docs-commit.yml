name: W7 Docs Commit

on:
  push:
    branches:
      - feat/OTC2-20260731-w7-canary-entry
    paths:
      - .github/workflows/w7-docs-commit.yml

permissions:
  contents: write

jobs:
  commit-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260731-w7-canary-entry
          fetch-depth: 1
          show-progress: false

      - name: Generate documentation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/w7_docs_update.py
          git diff --check

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git add docs/agents/BUILD_TEST_MATRIX.md
          git add docs/agents/CHANGELOG.md
          git add docs/agents/MODULE_CATALOG.md
          git add oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md
          git add oteryn-client/docs/operations/RUST_WORKSPACE.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs(w7): integrate Canary entry boundary"
          git push origin HEAD:feat/OTC2-20260731-w7-canary-entry

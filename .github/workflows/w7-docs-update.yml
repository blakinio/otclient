name: W7 Docs Update

on:
  push:
    branches:
      - feat/OTC2-20260731-w7-canary-entry
    paths:
      - .github/workflows/w7-docs-update.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/OTC2-20260731-w7-canary-entry
          fetch-depth: 1
          show-progress: false

      - name: Apply exact documentation replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("docs/agents/MODULE_CATALOG.md", "Last reviewed: 2026-07-30", "Last reviewed: 2026-07-31")
          module_row = "| W7 Canary Current entry transport | active PR #113 | `oteryn-transport` owns one bounded non-reconnecting TCP connection; `oteryn-protocol-core` owns bounded checked binary helpers and closed errors; `oteryn-protocol-canary` owns the exact-evidence-gated Current admission interface returning shared W7 lifecycle outcomes | `oteryn-client/crates/transport/**`, `oteryn-client/crates/protocol-core/**`, `oteryn-client/crates/protocol-canary/**`, `oteryn-client/contracts/canary/current-entry/**`, `oteryn-client/docs/research/technical-login/W7_CANARY_ENTRY_EVIDENCE.md` | Consumes exact ENTRY merge `9ecc43a4465f6565bc1c12ea61f170a96edcbe35`. Original synthetic fixtures prove bounds, malformed input, cancellation, closure, one-shot ownership and typed outcomes. Production Current wire is disabled before network/credential handoff until approved exact RSA/transcript/deployment evidence and one controlled Rust admission through `0x0F` exist. No gameplay, map, reconnect or compatibility claim. |\n"
          replace_once("docs/agents/MODULE_CATALOG.md", "| W7 Platform native-auth boundary |", module_row + "| W7 Platform native-auth boundary |")

          matrix_row = "| W7 Canary Current transport/admission | bounded TCP timeout/cancellation/partial-I/O/size/state tests; checked integer/string/truncation/trailing-data parser tests; exact profile/source matrix; synthetic success/denial/wrong-character/expired/consumed/duplicate-use/timeout/cancellation/abrupt-close/redaction/determinism/no-panic evidence | Windows locked metadata/fmt/strict Clippy/all-target tests, architecture and cargo-deny. Exact producer and Canary revisions must be recorded. Synthetic fixtures do not prove real Current wire; RSA/client-string/asset-hash/transcript/deployment evidence and a controlled Rust run through ordered `0x0F` remain blocked. |\n"
          replace_once("docs/agents/BUILD_TEST_MATRIX.md", "| Protocol crate |", matrix_row + "| Protocol crate |")
          matrix_rules = "- W7 transport must use explicit non-zero connect/read/write timeouts, directional frame limits, partial-I/O handling, caller-owned cancellation, deterministic terminal state and no DNS resolver, background daemon, reconnect loop or raw-socket escape;\n- W7 protocol-core owns no Canary constants and rejects malformed, truncated, oversized, invalid-UTF-8 and disallowed trailing input with closed non-secret errors;\n- W7 Canary production admission remains fail-closed before network and credential handoff until exact approved Current wire and controlled E2E evidence exist; synthetic success is lifecycle/parser evidence only;\n- diagnostics text must be explicitly classified;"
          replace_once("docs/agents/BUILD_TEST_MATRIX.md", "- diagnostics text must be explicitly classified;", matrix_rules)

          changelog_entry = "- The greenfield Rust workspace now includes the bounded W7 Canary Current entry boundary: `oteryn-transport` owns one explicit-timeout, cancellation-aware, size-bounded non-reconnecting TCP connection; `oteryn-protocol-core` owns checked bounded binary helpers and closed non-secret parser errors; `oteryn-protocol-canary` consumes the merged one-shot ENTRY credential/lifecycle and exposes typed admission outcomes without raw sockets or credentials. Original synthetic tests prove malformed/truncated/oversized input, partial I/O, timeout, cancellation, abrupt close, wrong/expired/consumed/duplicate credentials, denial mapping, deterministic parsing and secret-free errors. Exact source evidence records Canary `95b276db311cf6e9acd58b847f1fb0ca6697b137`, while real RSA/XTEA/sequence/compression admission remains disabled before network/credential handoff until approved transcript/deployment evidence and one controlled Rust run through ordered `0x0F` exist; gameplay remains absent.\n"
          replace_once("docs/agents/CHANGELOG.md", "## Unreleased\n\n", "## Unreleased\n\n" + changelog_entry)

          replace_once("oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md", "| `transport` | bytes, connection health, framing primitives | domain events or UI |", "| `transport` | one bounded non-reconnecting TCP connection, explicit timeouts/cancellation, directional frame limits, partial I/O and stable transport errors | DNS policy, credentials, protocol constants, reconnect loops, domain events or UI |")
          replace_once("oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md", "| `protocol-core` | adapter interfaces and validated shared types | Canary/Oteryn constants |", "| `protocol-core` | bounded checked binary reader/writer helpers, trailing-data policy and closed protocol errors | Canary/Oteryn constants, sockets, credentials or domain ownership |")
          replace_once("oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md", "| `protocol-canary` | exact Canary encode/decode | UI and domain storage |", "| `protocol-canary` | exact-version Canary adapters consuming shared lifecycle/domain contracts; W7 currently exposes evidence-gated Current admission outcomes only | raw application sockets/credentials, UI, domain storage, gameplay/map decoding, reconnect or compatibility claims without exact evidence |")
          layout_note = "The W7 Canary entry implementation keeps generic bounded TCP ownership in `transport`, generic checked binary helpers in `protocol-core`, and exact source facts/outcome mapping in `protocol-canary`. It consumes the merged `game-session` and `world-directory` contracts; the production Current wire path is disabled before network and credential handoff until approved transcript/RSA/deployment evidence exists. Synthetic fixtures are deliberately not Canary bytes.\n\n`apps/client` is the concrete `app` package."
          replace_once("oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md", "`apps/client` is the concrete `app` package.", layout_note)
          old_direction = "protocol-canary / protocol-oteryn\n├── protocol-core\n├── game-domain contracts\n└── foundation when a generic primitive is required"
          new_direction = "protocol-canary\n├── transport\n├── protocol-core\n├── game-session/world-directory entry contracts\n└── foundation when a generic primitive is required\n\nprotocol-oteryn\n├── protocol-core\n├── game-domain contracts\n└── foundation when a generic primitive is required"
          replace_once("oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md", old_direction, new_direction)

          replace_once("oteryn-client/docs/operations/RUST_WORKSPACE.md", "The workspace contains fourteen bounded members:", "The workspace contains seventeen bounded members:")
          replace_once("oteryn-client/docs/operations/RUST_WORKSPACE.md", "crates/platform\ncrates/renderer", "crates/platform\ncrates/protocol-canary\ncrates/protocol-core\ncrates/renderer")
          replace_once("oteryn-client/docs/operations/RUST_WORKSPACE.md", "crates/test-support\ncrates/world-directory", "crates/test-support\ncrates/transport\ncrates/world-directory")
          replace_once("oteryn-client/docs/operations/RUST_WORKSPACE.md", "Canary transport/protocol, domain/game rendering, product UI, asset runtime and extension host remain absent.", "`oteryn-transport` owns bounded non-reconnecting TCP connection mechanics, `oteryn-protocol-core` owns generic bounded binary helpers, and `oteryn-protocol-canary` owns the exact-evidence-gated Current admission boundary. Real Canary wire admission, domain/game rendering, product UI, asset runtime and extension host remain absent.")
          category_note = "`oteryn-transport` depends only on `foundation`. `oteryn-protocol-core` has no product or external dependency. `oteryn-protocol-canary` may depend on `transport`, `protocol-core`, the merged W7 `game-session`/`world-directory` contracts and `foundation`; those lower packages must never depend back on the adapter. Application code must not receive the adapter's raw socket or credential.\n\nAdding or changing a category is an architecture-policy change."
          replace_once("oteryn-client/docs/operations/RUST_WORKSPACE.md", "Adding or changing a category is an architecture-policy change.", category_note)
          canary_contract = "## W7 Canary Current transport and admission contract\n\n`oteryn-transport` owns one bounded synchronous TCP connection to an already-resolved endpoint. It requires explicit non-zero connect/read/write timeouts, directional frame limits and caller-owned cancellation; handles partial reads/writes; exposes deterministic state and closed non-secret errors; and provides no resolver, daemon, reconnect loop or raw socket escape.\n\n`oteryn-protocol-core` owns bounded checked little-endian integer, exact-byte and `u16` UTF-8 string helpers plus explicit trailing-data policy and closed parse/encode errors. It contains no Canary constants or lifecycle types.\n\n`oteryn-protocol-canary` consumes exact shared ENTRY merge `9ecc43a4465f6565bc1c12ea61f170a96edcbe35` and records Current source revision `95b276db311cf6e9acd58b847f1fb0ca6697b137`. It exposes only `connect`, `enter_session`, `cancel` and `close` responsibilities plus shared lifecycle results/stable admission classifications. Original synthetic fixtures test bounded ownership and parsing only. Production Current RSA/XTEA/sequence/compression admission is disabled before network and credential handoff until approved exact transcript/key/deployment evidence and one controlled Rust entry through the ordered `0x0F` marker exist. Map/gameplay decoding, reconnect and channel relog are excluded.\n\n"
          replace_once("oteryn-client/docs/operations/RUST_WORKSPACE.md", "## Diagnostics crate contract\n", canary_contract + "## Diagnostics crate contract\n")
          PY

      - name: Verify exact changed paths
        shell: bash
        run: |
          set -euo pipefail
          expected="docs/agents/BUILD_TEST_MATRIX.md
docs/agents/CHANGELOG.md
docs/agents/MODULE_CATALOG.md
oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md
oteryn-client/docs/operations/RUST_WORKSPACE.md"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

      - name: Commit integration documentation
        shell: bash
        run: |
          set -euo pipefail
          git add docs/agents/BUILD_TEST_MATRIX.md docs/agents/CHANGELOG.md docs/agents/MODULE_CATALOG.md oteryn-client/docs/architecture/REPOSITORY_LAYOUT.md oteryn-client/docs/operations/RUST_WORKSPACE.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs(w7): integrate Canary entry boundary"
          git push origin HEAD:feat/OTC2-20260731-w7-canary-entry

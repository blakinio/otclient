name: W7 Entry Post-Merge Reconciliation

on:
  push:
    branches:
      - docs/OTC-20260730-w7-entry-postmerge-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message != 'docs(w7): apply post-merge reconciliation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: docs/OTC-20260730-w7-entry-postmerge-reconcile
          fetch-depth: 0

      - name: Apply exact post-merge documentation updates
        shell: python
        run: |
          from pathlib import Path

          catalog = Path("docs/agents/MODULE_CATALOG.md")
          text = catalog.read_text(encoding="utf-8")
          old = "| W7 entry contracts | active PR #104 |"
          new = "| W7 entry contracts | merged PR #104; archived by #105 |"
          if old not in text:
              raise SystemExit("expected W7 catalogue status was not found")
          catalog.write_text(text.replace(old, new, 1), encoding="utf-8")

          readme = Path("docs/agents/README.md")
          text = readme.read_text(encoding="utf-8")
          old = (
              "W1-W6 are completed and cannot be relaunched. W7 workers remain unauthorized until the W7 planning PR "
              "and its separate planning-task archive merge and a fresh overlap/contract/lease check passes. After "
              "activation, use only the exact current prompts and dependency order in `CURRENT_PARALLEL_WAVE.md`."
          )
          new = (
              "W1-W6 are completed and cannot be relaunched. The W7 plan and its separate planning-task archive are "
              "merged. W7-ENTRY-CONTRACT is completed and archived; W7-IDENTITY and W7-CANARY-ENTRY may launch only "
              "after a fresh overlap/contract/lease check and must restack on producer merge "
              "`9ecc43a4465f6565bc1c12ea61f170a96edcbe35`. W7-LOGIN-E2E remains bound by the dependency order in "
              "`CURRENT_PARALLEL_WAVE.md`."
          )
          if old not in text:
              raise SystemExit("expected W7 authorization paragraph was not found")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")

          task = Path("docs/agents/tasks/archive/OTC-20260730-w7-entry-contract.md")
          text = task.read_text(encoding="utf-8")
          replacements = {
              "updated: 2026-07-30T18:04:03+02:00": "updated: 2026-07-30T20:10:00+02:00",
              'last_verified_commit: "e2d4981ffdde493054b794214e7ad69881cf8a5d"': 'last_verified_commit: "8dcd353d5a9f19fabccf49508c27074f7749e3cf"',
              "- Lifecycle archive PR: #105\n": "- Lifecycle archive PR: #105\n- Lifecycle archive merge: `8dcd353d5a9f19fabccf49508c27074f7749e3cf`\n",
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f"expected archived task value was not found: {old_value}")
              text = text.replace(old_value, new_value, 1)

          marker = "## Context checkpoint\n"
          if marker not in text:
              raise SystemExit("archived task checkpoint marker was not found")
          prefix = text.split(marker, 1)[0]
          checkpoint = '''## Context checkpoint

```yaml
checkpoint_version: 1
updated_at: 2026-07-30T18:10:00Z
head: 8dcd353d5a9f19fabccf49508c27074f7749e3cf
branch: docs/archive-OTC-20260730-w7-entry-contract
pr: 105
status: archived
context_routes:
  - agent-governance
  - rust-entry-contract
  - supply-chain
owned_paths:
  - docs/agents/tasks/archive/OTC-20260730-w7-entry-contract.md
proven:
  - PR #104 squash-merged as 9ecc43a4465f6565bc1c12ea61f170a96edcbe35.
  - Final feature head e2d4981ffdde493054b794214e7ad69881cf8a5d passed Rust Client run 30559239345 and repository CI run 30559239645.
  - The merged implementation contains exactly 13 authorized paths and no workflow, build-script or generator residue.
  - No reviews, requested changes or unresolved review threads remained at merge.
  - Archive PR #105 squash-merged as 8dcd353d5a9f19fabccf49508c27074f7749e3cf.
  - The producer task is completed, archived and has no remaining shared-path lease.
derived:
  - W7-ENTRY-CONTRACT is completed and cannot be relaunched.
  - W7-IDENTITY and W7-CANARY-ENTRY may consume the contract only after a fresh overlap check and exact restack on the producer merge.
unknown: []
conflicts: []
first_failure:
  marker: none
  evidence: none
changed_paths:
  - docs/agents/tasks/archive/OTC-20260730-w7-entry-contract.md
validation:
  - command: Rust Client run 30559239345
    result: PASS
    evidence: final feature head e2d4981ffdde493054b794214e7ad69881cf8a5d
  - command: Repository CI run 30559239645
    result: PASS
    evidence: final feature head e2d4981ffdde493054b794214e7ad69881cf8a5d
  - command: Squash merge PR #104
    result: PASS
    evidence: producer merge commit 9ecc43a4465f6565bc1c12ea61f170a96edcbe35
  - command: Squash merge archive PR #105
    result: PASS
    evidence: lifecycle archive commit 8dcd353d5a9f19fabccf49508c27074f7749e3cf
blockers: []
next_action: W7 consumers may restack on producer merge 9ecc43a4465f6565bc1c12ea61f170a96edcbe35 under fresh authorized tasks.
```
'''
          task.write_text(prefix + checkpoint, encoding="utf-8")

      - name: Commit reconciled documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/MODULE_CATALOG.md docs/agents/README.md docs/agents/tasks/archive/OTC-20260730-w7-entry-contract.md
          if git diff --cached --quiet; then
            echo "No reconciliation changes to commit"
            exit 0
          fi
          git commit -m "docs(w7): apply post-merge reconciliation"
          git push origin HEAD:docs/OTC-20260730-w7-entry-postmerge-reconcile

name: W7 Identity Deterministic Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - "oteryn-client/Cargo.toml"
      - "oteryn-client/crates/identity/**"
      - "oteryn-client/crates/platform/**"
      - "oteryn-client/tests/security/auth/**"
      - ".github/workflows/w7-identity-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: w7-identity-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'feat/OTC-20260730-w7-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC-20260730-w7-identity
          show-progress: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0
          rustc --version | grep -E '^rustc 1\.94\.0 '

      - name: Configure system TLS exactly
        shell: python
        run: |
          from pathlib import Path
          path = Path("oteryn-client/crates/platform/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = """        let config = ureq::Agent::config_builder()\n            .timeout_global(Some(timeout))"""
          new = """        let config = ureq::Agent::config_builder()\n            .tls_config(\n                ureq::tls::TlsConfig::builder()\n                    .provider(ureq::tls::TlsProvider::NativeTls)\n                    .root_certs(ureq::tls::RootCerts::PlatformVerifier)\n                    .build(),\n            )\n            .timeout_global(Some(timeout))"""
          if old not in text:
              raise SystemExit("expected Ureq config anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Generate lockfile and format
        working-directory: oteryn-client
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo metadata --locked --format-version 1 >/dev/null
          cargo fmt --all -- --check

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- oteryn-client; then
            echo "Bootstrap outputs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client
          git commit -m "chore(rust): normalize W7 identity workspace"
          git push origin HEAD:feat/OTC-20260730-w7-identity

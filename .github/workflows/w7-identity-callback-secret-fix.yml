name: W7 Identity Callback Secret Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - "oteryn-client/crates/identity/src/lib.rs"
      - ".github/workflows/w7-identity-callback-secret-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/OTC-20260730-w7-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC-20260730-w7-identity
          show-progress: false

      - name: Remove callback secret clone and debug surfaces
        shell: python
        run: |
          from pathlib import Path
          path = Path("oteryn-client/crates/identity/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          old = '''/// One accepted TCP callback request reduced to the security-relevant facts.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct CallbackAttempt {
    /// Remote peer observed by the bound listener.
    pub peer: IpAddr,
    /// Exact HTTP request target including query.
    pub target: String,
}
'''
          new = '''/// One accepted TCP callback request reduced to the security-relevant facts.
///
/// The request target contains OAuth code/state material and therefore has no
/// ordinary clone or revealing debug surface.
pub struct CallbackAttempt {
    /// Remote peer observed by the bound listener.
    pub peer: IpAddr,
    /// Exact HTTP request target including query.
    pub target: String,
}

impl Debug for CallbackAttempt {
    fn fmt(&self, formatter: &mut Formatter<'_>) -> fmt::Result {
        formatter
            .debug_struct("CallbackAttempt")
            .field("peer", &self.peer)
            .field("target", &"[REDACTED]")
            .finish()
    }
}
'''
          if old not in text:
              raise SystemExit("CallbackAttempt anchor missing")
          text = text.replace(old, new, 1)

          old = '''        let valid = CallbackAttempt {
            peer: IpAddr::V4(Ipv4Addr::LOCALHOST),
            target: "/callback?code=synthetic-code&state=expected-state".to_owned(),
        };
        let code = transaction.accept_callback(Some(session()?), valid.clone())?;
        assert_eq!(code.expose_secret()?, "synthetic-code");
        assert_eq!(
            transaction
                .accept_callback(Some(session()?), valid)
'''
          new = '''        let code = transaction.accept_callback(
            Some(session()?),
            CallbackAttempt {
                peer: IpAddr::V4(Ipv4Addr::LOCALHOST),
                target: "/callback?code=synthetic-code&state=expected-state".to_owned(),
            },
        )?;
        assert_eq!(code.expose_secret()?, "synthetic-code");
        assert_eq!(
            transaction
                .accept_callback(
                    Some(session()?),
                    CallbackAttempt {
                        peer: IpAddr::V4(Ipv4Addr::LOCALHOST),
                        target: "/callback?code=synthetic-code&state=expected-state".to_owned(),
                    },
                )
'''
          if old not in text:
              raise SystemExit("valid callback clone anchor missing")
          text = text.replace(old, new, 1)

          old = '''        let attempt = CallbackAttempt {
            peer: IpAddr::V4(Ipv4Addr::LOCALHOST),
            target: "/other?code=synthetic-code&state=expected-state".to_owned(),
        };
        assert_eq!(
            transaction
                .accept_callback(Some(AccountSessionId::new(8)?), attempt.clone())
'''
          new = '''        assert_eq!(
            transaction
                .accept_callback(
                    Some(AccountSessionId::new(8)?),
                    CallbackAttempt {
                        peer: IpAddr::V4(Ipv4Addr::LOCALHOST),
                        target: "/other?code=synthetic-code&state=expected-state".to_owned(),
                    },
                )
'''
          if old not in text:
              raise SystemExit("stale callback clone anchor missing")
          text = text.replace(old, new, 1)

          old = '''        assert_eq!(
            transaction
                .accept_callback(Some(session()?), attempt)
'''
          new = '''        assert_eq!(
            transaction
                .accept_callback(
                    Some(session()?),
                    CallbackAttempt {
                        peer: IpAddr::V4(Ipv4Addr::LOCALHOST),
                        target: "/other?code=synthetic-code&state=expected-state".to_owned(),
                    },
                )
'''
          if old not in text:
              raise SystemExit("wrong-path callback anchor missing")
          text = text.replace(old, new, 1)

          old = '''        assert!(debug.contains("[REDACTED]"));
        Ok(())
    }
'''
          new = '''        assert!(debug.contains("[REDACTED]"));
        let callback = CallbackAttempt {
            peer: IpAddr::V4(Ipv4Addr::LOCALHOST),
            target: "/callback?code=synthetic-code&state=synthetic-state".to_owned(),
        };
        let callback_debug = format!("{callback:?}");
        assert!(!callback_debug.contains("synthetic-code"));
        assert!(!callback_debug.contains("synthetic-state"));
        assert!(callback_debug.contains("[REDACTED]"));
        Ok(())
    }
'''
          if old not in text:
              raise SystemExit("redaction test anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Install formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cd oteryn-client
          cargo fmt --all
          cargo fmt --all -- --check
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/crates/identity/src/lib.rs
          git commit -m "fix(identity): redact and move callback secret material"
          git push origin HEAD:feat/OTC-20260730-w7-identity

name: W7 Identity Callback Secret Trigger

on:
  push:
    branches:
      - feat/OTC-20260730-w7-identity
    paths:
      - ".github/workflows/w7-identity-callback-secret-trigger.yml"

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC-20260730-w7-identity
          show-progress: false

      - name: Apply reviewed callback fix script
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/w7-identity-callback-secret-fix.yml").read_text(encoding="utf-8")
          marker = "      - name: Remove callback secret clone and debug surfaces\n        shell: python\n        run: |\n"
          block = source.split(marker, 1)[1].split("\n      - name: Install formatter", 1)[0]
          script = textwrap.dedent(block)
          exec(compile(script, "callback-secret-fix", "exec"))

      - name: Install formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cd oteryn-client
          cargo fmt --all
          cargo fmt --all -- --check
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/crates/identity/src/lib.rs
          git commit -m "fix(identity): redact and move callback secret material"
          git push origin HEAD:feat/OTC-20260730-w7-identity

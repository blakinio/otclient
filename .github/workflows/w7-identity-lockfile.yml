name: W7 Identity Lockfile Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - "oteryn-client/Cargo.toml"
      - "oteryn-client/crates/identity/Cargo.toml"
      - "oteryn-client/crates/platform/Cargo.toml"
      - "oteryn-client/tests/security/auth/Cargo.toml"
      - ".github/workflows/w7-identity-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: w7-identity-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.ref == 'feat/OTC-20260730-w7-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC-20260730-w7-identity
          show-progress: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc --version | grep -E '^rustc 1\.94\.0 '
          cargo --version

      - name: Generate lockfile through Cargo
        working-directory: oteryn-client
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- oteryn-client/Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/Cargo.lock
          git commit -m "chore(rust): generate W7 identity lockfile"
          git push origin HEAD:feat/OTC-20260730-w7-identity

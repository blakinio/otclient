name: W7 Identity Negative Evidence Push

on:
  push:
    branches:
      - feat/OTC-20260730-w7-identity
    paths:
      - ".github/workflows/w7-identity-negative-evidence-push.yml"

permissions:
  contents: write

jobs:
  add-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC-20260730-w7-identity
          show-progress: false

      - name: Apply the reviewed negative-evidence payload
        shell: python
        run: |
          from pathlib import Path

          source = Path(".github/workflows/w7-identity-negative-evidence.yml").read_text(encoding="utf-8")
          addition = source.split("addition = r'''", 1)[1].split("\n'''", 1)[0]

          path = Path("oteryn-client/tests/security/auth/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old_import = """        HttpRequest, HttpResponse, HttpTransport, HttpTransportError, PlatformClient,\n        PlatformEndpoints, SecretString, TokenExchange,"""
          new_import = """        HttpRequest, HttpResponse, HttpTransport, HttpTransportError, PlatformClient,\n        PlatformEndpoints, PlatformErrorKind, SecretString, TokenExchange,\n        MAX_RESPONSE_BODY_BYTES,"""
          if old_import not in text:
              raise SystemExit("platform import anchor missing")
          if not text.endswith("}\n"):
              raise SystemExit("test module ending is unexpected")
          text = text.replace(old_import, new_import, 1)
          path.write_text(text[:-2] + addition + "}\n", encoding="utf-8")

      - name: Install formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cd oteryn-client
          cargo fmt --all
          cargo fmt --all -- --check
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/tests/security/auth/src/lib.rs
          git commit -m "test(identity): cover timeout bounds and Gateway validation"
          git push origin HEAD:feat/OTC-20260730-w7-identity

name: W7 Login Archive Catalogue

on:
  push:
    branches:
      - docs/OTC2-20260731-archive-w7-login-e2e

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: docs/OTC2-20260731-archive-w7-login-e2e
          show-progress: false
      - name: Finalize archive catalogue
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/agents/MODULE_CATALOG.md')
          text = path.read_text(encoding='utf-8')
          old = '| W7 technical-login application runtime | active PR #118 |'
          new = '| W7 technical-login application runtime | merged PR #118; archived by #119 |'
          if old not in text:
              raise SystemExit('expected active W7 login catalogue row not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/w7-login-archive-catalog.yml
      - name: Commit lifecycle update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/MODULE_CATALOG.md .github/workflows/w7-login-archive-catalog.yml
          git commit -m "docs(agents): mark W7 login runtime archived"
          git push origin HEAD:docs/OTC2-20260731-archive-w7-login-e2e

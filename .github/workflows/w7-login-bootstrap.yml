name: W7 Login Bootstrap

on:
  push:
    branches:
      - feat/OTC2-20260731-w7-login-e2e-final

permissions:
  contents: write

concurrency:
  group: w7-login-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oteryn-client
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260731-w7-login-e2e-final
          show-progress: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0
          rustc --version
          cargo --version

      - name: Generate lockfile and formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/app-runtime tests/integration/technical-login
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(rust): generate W7 login lockfile and formatting"
          git push origin HEAD:feat/OTC2-20260731-w7-login-e2e-final

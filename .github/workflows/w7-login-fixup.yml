name: W7 Login Fixup

on:
  push:
    branches:
      - feat/OTC2-20260731-w7-login-e2e-final

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/OTC2-20260731-w7-login-e2e-final
          show-progress: false

      - name: Apply exact visibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('oteryn-client/apps/client/src/technical_login.rs')
          text = path.read_text(encoding='utf-8')
          old = '\nenum ConfigField {\n'
          new = '\npub(crate) enum ConfigField {\n'
          if old not in text:
              raise SystemExit('expected ConfigField declaration not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cd oteryn-client
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0
          cargo fmt --all

      - name: Commit exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oteryn-client/apps/client/src/technical_login.rs
          git commit -m "fix(client): align technical config visibility"
          git push origin HEAD:feat/OTC2-20260731-w7-login-e2e-final

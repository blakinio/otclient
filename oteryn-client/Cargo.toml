[workspace]
members = [
    "apps/client",
    "crates/asset-types",
    "crates/diagnostics",
    "crates/foundation",
    "crates/game-session",
    "crates/renderer",
    "crates/test-support",
    "tools/architecture-check",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/blakinio/otclient"

[workspace.dependencies]
pollster = { version = "=1.0.1", default-features = false }
serde_json = "=1.0.145"
sha2 = { version = "=0.11.0", default-features = false }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "dx12"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
